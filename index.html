角色设定及场景设计；\n独立完成AI出图、图生视频、动作生成、配音配乐、剪辑包装及成片交付；\n把控人物一致性、服装造型、画面风格、动作自然度、剧情节奏和镜头衔接；\n修复人物变形、肢体异常、穿模、画面闪烁、镜头抖动、画风不统一等问题；\n根据业务反馈快速完成修改和迭代，稳定承接日常内容产能；\n沉淀提示词、角色模板、人物LoRA、制作模板及批量化生产SOP；\n配合编剧、导演及运营团队完成短剧内容交付。\n\n任职要求\n有成熟的AI短剧、AI剧情视频或相关视频项目经验；\n能够独立完成从剧本、分镜、角色设定到成片交付的完整流程；\n入职后能够直接承接项目，不依赖长期手把手培训；\n熟悉可灵、即梦、Seedance、Runway、Pika、Midjourney、Stable Diffusion、ComfyUI等一种或多种工具；\n熟练使用剪映、Premiere、After Effects、达芬奇等剪辑软件；\n具备较强的剧情理解、分镜设计、镜头语言及画面审美能力；\n能够处理人物一致性、动作异常、镜头衔接及画面质量问题；\n能适应快速迭代、远程协作和稳定量产。\n\n优先条件\n有完整AI短剧成片及连续剧集制作经验；\n熟悉ComfyUI、LoRA、角色一致性和动作控制；\n有批量内容生产、平台发布或短剧项目经验；\n有成人向AI短剧项目经验优先，但不强制要求提供成人作品；\n能接受实际参与成人向剧情内容制作。\n\n作品要求\n必须提供视频作品，可提供本人自媒体账号、平台主页、作品链接或视频文件；\n作品类型包括AI短剧、AI动漫、动态漫、剧情视频、广告视频、短视频等；\n至少提供能够体现本人实际制作能力的完整作品或连续片段；\n如为团队项目，需明确说明本人负责的具体环节；\n面试及测试环节需能够讲清作品的制作流程、使用工具、提示词及后期处理方式；\n无视频作品、无法提供账号/链接或无法说明本人实际贡献的候选人，原则上不进入后续面试。", "cat": "内容与创作"}, {"id": "209", "title": "二次元动漫原画师（AI生成方向）", "salary": "20K-50K", "location": "远程，可国内办公", "jd": "二次元动漫原画师（AI生成方向）\n岗位定位\n\n本岗位面向具有动漫原画、角色设计、插画或相关美术经验的人才。入职后公司将提供AI短剧制作培训，帮助其逐步掌握AI图像及视频生成流程，并培养成为能够独立完成二次元动漫短剧的生成师。\n\n岗位职责\n根据短剧剧本完成剧情理解、人物分析、场景拆解及基础分镜设计。\n运用原画及美术能力，完成人物形象、服装、表情、动作和场景的视觉设计。\n在培训后使用 Seedance、ComfyUI、可灵等工具完成人物、场景及动漫视频镜头生成。\n根据剧情设计景别、构图、人物动作、情绪表演及镜头衔接，强化故事节奏和关键情绪。\n负责筛选、调整和优化AI生成结果，处理人物五官、肢体、服装及画面细节问题。\n保证同一剧集中人物形象、服装、场景、画风及镜头表现的一致性。\n配合导演及编剧完成镜头修改，并逐步具备独立负责完整剧集或主要镜头段落的能力。\n持续学习新的AI动漫制作工具和工作流，提升内容质量与生产效率。\n任职要求\n具备动漫原画、角色设计、漫画、插画、二次元游戏美术或相关工作经验。\n对二次元文化有成熟理解和长期热爱，熟悉不同动漫题材、人物属性及画风特点。\n具备良好的造型、人体结构、透视、色彩、构图及光影基础。\n具备一定的画面叙事和镜头意识，能够根据文字内容设计人物动作、表情及场景氛围。\n愿意从传统原画或插画方向转向AI动漫短剧制作，并接受系统培训。\n学习能力和执行力较强，能够快速掌握新的AI工具及制作流程。\n具备良好的沟通能力和责任心，能够根据反馈快速修改并稳定交付。\n应聘时需提供能够体现二次元审美、角色塑造及画面表现能力的作品集。\n\n加分项\n有动漫、动态漫、短剧、漫画或游戏项目经验。\n具备分镜、关键帧或连续剧情画面设计能力。\n使用过 ComfyUI、Midjourney、Seedance、可灵等工具。\n了解角色一致性、LoRA训练或AI美术资产制作。\n能够独立完成基础剪辑、镜头组合或短片制作。", "cat": "内容与创作"}, {"id": "210", "title": "AI内容生成（魔改/二创/视频制作）", "salary": "14K-25K", "location": "远程，可国内办公", "jd": "岗位职责\n1. 基于已有素材、热点或剧情需求，完成AI魔改、二创及视频内容生产；\n2. 进行角色、场景、动作、画风及节奏的AI化改编；\n3. 完成AI出图、视频生成、配音配乐、剪辑、字幕及包装；\n4. 根据平台及业务要求快速产出不同版本和内容变体；\n5. 修复画面异常、人物变形、镜头不连贯等问题；\n6. 配合增长及运营团队完成批量内容制作，并沉淀提示词、模板和SOP。\n\n任职要求\n1. 有AI视频、短视频、广告视频、剧情视频、魔改或二创作品经验；\n2. 有较好的热点理解、内容改编和镜头节奏能力；\n3. 能熟练使用一种或多种AI绘图、视频生成工具；\n4. 熟练使用剪映、PR、AE等剪辑软件；\n5. 能根据反馈快速修改并稳定批量交付；\n6. 具备较强的自我学习、沟通和执行能力。\n\n优先条件\n1. 有原创/二创账号、平台发布或批量生产经验优先；\n2. 有舞蹈、剧情、广告、热点视频等AI生成案例优先；\n3. 有ComfyUI、LoRA、角色一致性或工作流经验优先；\n4. 作品可以不是成人向，但需能接受团队实际项目安排；\n5. 需说明本人负责的具体环节，并接受针对性测试。", "cat": "内容与创作"}, {"id": "211", "title": "海外内容增长运营", "salary": "10k-30k", "location": "远程，可国内办公", "jd": "（海外社媒/精准引流方向）薪资：10K–30K＋提成，带团队入驻可面谈  学历：不限，以实际运营能力和项目结果为主要筛选标准\n\n岗位职责\n\n负责TikTok、X、Instagram、YouTube、Reddit等海外平台的账号运营、内容增长及精准引流。\n\n根据不同平台的用户习惯、推荐机制和内容生态，独立完成账号定位、从0到1起号、内容发布、互动运营及持续优化。\n\n围绕目标用户策划和制作平台内容，独立完成选题、标题、封面、脚本、剪辑、字幕、配音及内容包装，提升播放、互动和涨粉效果。\n\n分析同行账号及爆款内容，拆解其选题方向、内容结构和流量逻辑，并转化为适合自身账号的内容方案。\n\n负责素材搜集、筛选和实质性二创，通过重新编写脚本、重新剪辑、镜头重组、原创字幕或旁白、配音解说及视觉包装等方式提升内容原创价值。\n\n持续跟踪账号数据及引流效果，复盘曝光、播放、互动、涨粉、跳转及精准引流等指标，优化内容方向和运营策略。\n\n建立并维护素材库和内容排期，保证账号持续、稳定更新。\n\n通过内容、主页及其他平台允许的方式，将目标用户引导至公司指定渠道；后续社群承接及转化由公司负责。\n\n任职要求\n\n学历不限，必须真实运营过海外社媒或海外自媒体账号，具备可验证的项目经验。\n\n熟悉TikTok、X、Instagram、YouTube、Reddit等至少两个海外平台，了解不同平台的内容偏好、推荐机制及用户行为差异。\n\n具备从0到1起号经验，有账号冷启动、内容测试、涨粉、爆款或精准引流的实际案例。\n\n具备独立内容创作能力，能够完成“找素材—做内容—发布—数据分析—优化—引流”的完整流程。\n\n具备较强的网感和内容策划能力，能够优化选题、标题、封面、开头Hook、视频节奏、字幕及配音。\n\n具备素材搜集和实质性二创能力，熟悉海外平台关于原创、重复内容及版权使用的基本规则。\n\n懂流量获取和账号增长逻辑，能够根据数据持续优化内容质量、用户精准度及引流效果。\n\n应聘时需提供过往运营平台、账号案例、代表作品、播放及涨粉数据、后台截图或实际引流结果；涉及保密项目的可脱敏处理。\n\n加分项\n\n有海外自媒体、MCN、泛娱乐、社交或海外APP相关项目经验；\n\n有账号矩阵或多账号运营经验；\n\n有明确的爆款、涨粉或精准引流案例；\n\n熟练使用CapCut、剪映专业版、Canva、Photoshop等内容制作工具；\n\n熟练使用ChatGPT、Claude、AI配音、AI图片或AI视频工具，有AI批量内容生产或工作流搭建经验。", "cat": "内容与创作"}, {"id": "212", "title": "国内精准获客运营", "salary": "10k-30k", "location": "远程，可国内办公", "jd": "（打色粉方向）薪资：10K–30K＋提成，带团队入驻可面谈学历：不限，以实际出粉能力和项目结果为主要筛选标准\n\n岗位职责\n\n负责国内平台的精准用户获取、内容运营及引流工作，包括但不限于抖音、小红书、快手、视频号、贴吧等渠道。\n\n根据目标用户的年龄、性别、地区、兴趣及行为特征制定获客策略，提高有效用户比例及精准度。\n\n独立完成账号定位、从0到1起号、选题策划、素材制作、内容发布、数据测试及用户引导。\n\n持续测试不同平台、账号、内容形式和素材方向，寻找出粉量稳定、用户精准且成本可控的获客方式。\n\n跟踪每日出粉量、有效粉比例、用户精准度及获客成本，并根据数据持续优化运营策略。\n\n结合实际操作持续总结平台玩法、内容模型、用户筛选方式及获客路径，沉淀可复用的工作流程和SOP。\n\n负责账号及内容的日常维护，保障项目能够长期、稳定出粉。\n\n所有获客及运营行为须遵守相关法律法规和平台规则。\n\n任职要求\n\n学历不限，必须有真实的国内打色粉或精准获客项目经验。\n\n熟悉抖音、小红书、快手、视频号、贴吧等国内主流流量平台及内容获客方式。\n\n具备从0到1起号、内容测试、用户筛选及精准获客经验。\n\n有实际起量、稳定出粉或持续获客成果，能够兼顾出粉量、有效粉比例、用户精准度及获客成本。\n\n熟悉目标用户画像，能够根据年龄、性别、地区、兴趣等维度进行用户筛选。\n\n能够独立完成“账号搭建—内容生产—发布测试—用户筛选—精准获客—数据复盘”的完整流程。\n\n具备数据分析和复盘能力，能够根据实际结果持续优化平台、账号、内容及素材方向。\n\n应聘时需提供过往项目、操作平台、实际出粉量、有效粉比例、获客成本及相关后台截图；涉及保密项目的可脱敏处理。\n\n加分项\n\n做过成人、两性、泛娱乐、社交等相关垂类项目；\n\n有账号矩阵或多账号运营经验；\n\n有明确的日均出粉量、月度出粉量或稳定获客案例；\n\n具备多设备、多账号运营条件；\n\n能够带团队或自带成熟团队入驻。", "cat": "运营与市场"}, {"id": "213", "title": "Java工程师", "salary": "25-30K", "location": "远程，可国内办公", "jd": "【任职要求】\n1.计算机或相关专业，精通Java开发语言技术栈，具备五年以上开发经验;\n2.熟悉常用的框架以及组件:SpringBoot、 SpringCloud、 RabbitMQ、Kafka、 Redis、 MySQL,PolarDB、MongoDB等;\n3.有大型复杂分布式、高并发、高负载、高可用性系统架构设计经验、调优经验;\n4.具备复杂业务需求梳理能力，较强的产品思维能力和问题分析能力，具备优秀的沟通以及团队感染力;\n5.有创新精神和较强的自驱力，具备发现问题和解决问题的能力;\n6.具备项目管理经验，具备将技术方案推动落实到研发人员的落地能力;7.深入阅读过开源项目源码，能理解开源项目实现原理;\n8.对AI的发展有较高的关注度，有实际AI开发工具的使用经验。", "cat": "技术开发"}, {"id": "214", "title": "高级 Go 后端工程师 / 后端架构师", "salary": "20K-35k", "location": "远程，可国内办公", "jd": "高级 Go 后端工程师 / 后端架构师\n岗位职责\n负责广告平台对接、投放支持与系统建设全链路工作：\n- 对接主流广告平台（巨量引擎 / 腾讯广告 / 快手广告 / 百度营销 / 广点通 / Google / Meta (Facebook) / TikTok / Apple Search Ads / Amazon / Microsoft 等）的开放 API、SDK 及数据协议；\n- 投放账户、计划、单元、创意、人群定向、出价策略的配置、调试与上线支持，\n- 投放数据回收、实时监控、效果分析（曝光、点击、CTR、CVR、CPA、CPC、ROAS、ROI 等），投放异常排查、平台规则适配、数据对账与归因核对；\n- 主导广告平台相关系统的架构设计与开发：\n  - 广告投放管理系统、账户与权限体系、预算与出价控制系统；\n  - 广告对账与计费系统、归因与转化追踪系统、人群与创意分析系统；\n  - 实时投放监控大盘、ROI 归因、转化漏斗、异常告警等核心模块；\n- 建设广告数据\"采集 → 传输 → 存储 → 实时计算 → 效果分析\"全链路，与大数据平台（Kafka / Flink / Doris / ClickHouse）深度集成；\n- 支持 oCPM / oCPC / OCPA、RTB 实时竞价、归因窗口、人群定向等业务核心场景落地；\n- 处理跨区域数据合规（**GDPR / CCPA / PIPL**）、iOS 端 **SKAdNetwork 归因**、**IDFA 弱化后的隐私优先归因**、Conversion API / S2S 回传、多币种结算等海外特有场景。\n\n核心后端架构工作\n1. 负责核心后端系统的架构设计、技术方案设计及落地，参与高并发、高可用、分布式系统的建设与持续优化。\n2. 负责大型业务系统的服务架构设计，包括服务拆分、流量治理、负载均衡、容灾、高可用、数据一致性及性能优化等。\n3. 负责设计和建设 CDN + 应用层 + Redis 等多级缓存体系，解决热点数据、高并发访问、缓存穿透、缓存击穿、缓存雪崩、缓存一致性及大规模流量场景下的性能问题。\n4. 参与大型企业级统一入口 / 统一接入体系建设，包括 API Gateway、统一域名入口、流量调度、服务发现、健康检查、限流、熔断、故障切换等，并建设相应的监控及管理面板。\n5. 负责生产环境完整的监控、可观测性及故障定位体系建设，能够从基础设施、网络、网关、应用、数据库、缓存到业务指标建立完整的监控体系。\n6. 基于 OpenTelemetry 建立统一的 Metrics、Logs、Traces 可观测性体系，实现跨服务的全链路追踪，并通过 TraceID、日志、指标、调用链等信息快速定位生产环境问题。\n7. 建立生产环境故障快速定位和分析机制，能够针对 CPU、内存、网络、连接池、GC、线程/Goroutine、QPS、错误率、P99 延迟、缓存命中率、数据库慢查询、消息堆积等问题进行快速分析和定位。\n8. 参与大数据及实时数据处理相关系统建设，负责海量日志、用户行为、订单、风控事件等数据的采集、处理、分析及查询架构设计。\n9. 参与或负责基于 Flink 的实时计算、实时风控、实时指标及事件处理系统建设，理解 State、Checkpoint、Watermark、Window、Exactly-Once 等核心机制。\n10. 参与 Doris / Elasticsearch / ClickHouse 等大数据及分析系统的建设、性能优化和生产环境运维，解决海量数据写入、查询、索引、分片、数据生命周期及集群扩展等问题。\n11. 参与大型日志平台、风控系统、数据分析平台或实时监控平台建设，能够针对海量数据场景进行系统容量规划、性能优化及故障排查。\n12. 积极使用 AI 提升研发效率，包括 AI Coding、代码分析、问题排查、技术方案设计、测试生成、日志分析等场景。\n\n 任职要求\n- 5 年以上后端开发经验，3 年以上 Go 开发经验，具备扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、网络编程及 Go 服务性能优化。\n- 具备较强的系统架构设计能力，有实际负责大型分布式系统、高并发系统或核心业务系统架构设计和落地经验。\n- 有丰富的 CDN + 应用缓存 + Redis 多级缓存架构经验，理解缓存一致性、热点数据、缓存穿透/击穿/雪崩等问题。\n- 有大型企业统一入口 / 统一接入平台建设经验，熟悉 API Gateway、流量治理、限流、熔断、服务发现、健康检查、故障切换等。\n- 有完整的生产环境监控和可观测性体系建设经验，能够从 0 到 1 设计和建设一套覆盖基础设施、网络、网关、应用、数据库、中间件及业务指标的监控体系。\n- 具备较强的线上问题快速定位能力，能够通过 Metrics、Logs、Traces、调用链、系统指标及业务指标，快速判断问题所在层级，并建立从「发现问题 → 告警 → 定位 → 分析 → 处理 → 复盘」的完整闭环。\n- 有 OpenTelemetry 或同类可观测性体系的实际使用经验，理解 Metrics、Logs、Traces、TraceID、Span、Context Propagation 等概念。\n- 具备较好的大数据系统经验，有海量日志、实时数据、用户行为分析、风控、监控或数据分析平台的实际项目经验。\n- 对以下技术有实际生产环境使用经验：**Flink / Doris / Elasticsearch / ClickHouse**（不要求每项都达到专家级，但至少有 1～2 项较深入的生产实践）。\n- 有大规模日志系统 / 实时风控系统 / 实时监控系统 / 数据分析平台中的一种或多种实际建设经验。\n- 具备一定的 AI 工具使用经验，能够使用 AI 辅助编码、代码阅读、问题排查、技术方案设计、测试及日常研发工作。\n\n加分项\n有国内外广告平台对接 / 广告投放系统 / 广告归因 / 实时投放监控等实际项目经验**。\n熟悉主流广告平台**（巨量引擎 / 腾讯广告 / 快手广告 / 百度营销 / 广点通 / Google / Meta (Facebook) / TikTok / Apple Search Ads / Amazon / Microsoft 等）的 API、数据协议及投放链路。\n- 有大型互联网、金融、电商、支付、广告、内容平台等高并发业务经验。\n- 熟悉 Kafka、Pulsar 等消息队列的大规模生产实践。\n- 熟悉 Kubernetes、Docker、云原生及微服务体系。\n- 熟悉 Prometheus、Grafana、Loki、Tempo、Jaeger 等监控及可观测性组件。\n- 熟悉 MySQL / PostgreSQL，并具备数据库性能优化经验。\n- 有 Iceberg、数据湖、实时数仓等相关经验。\n- 有大型风控规则引擎、实时决策引擎或事件驱动系统建设经验。\n- 有大型企业基础设施平台、统一接入平台、监控平台或内部 PaaS 平台建设经验。\n- 有 AI Agent、RAG、MCP、AI Coding 或其他 AI 工程实践经验。", "cat": "技术开发"}, {"id": "215", "title": "用户增长运营", "salary": "12k-20k", "location": "远程，可国内办公", "jd": "岗位职责\n1.负责用户增长相关项目，围绕拉新、激活、留存、转化等核心指标制定并执行增长方案；\n2.通过数据分析定位用户增长及转化问题，设计测试方案并持续优化；\n3.参与新产品冷启动、活动、内容及流量承接等增长项目，推动用户从流量到注册、活跃及付费转化；\n4.跟踪DAU、新增、留存、转化、付费等核心数据，定期复盘并输出优化方案；\n5.研究竞品及行业增长打法，快速测试有效策略并推动复制落地。\n\n任职要求\n1.有用户增长、产品运营、活动运营、数据运营或互联网运营相关经验；\n2.有较强的数据意识，能够看懂DAU、新增、留存、转化率、付费率等基础指标；\n3.具备较强的问题分析能力，能够从数据发现问题并提出具体解决方案；\n4.执行力及项目推进能力强，能独立推进测试、复盘及优化；\n5.有新产品冷启动、增长实验、活动增长、私域或流量转化项目经验者优先；\n6.熟练使用Excel/表格，有SQL、BI或数据分析工具基础者优先。", "cat": "运营与市场"}, {"id": "216", "title": "海内外社媒运营", "salary": "12k-20k", "location": "远程，可国内办公", "jd": "岗位职责\n1.负责国内及海外社媒平台账号运营，包括抖音、快手、小红书、视频号、TikTok、Instagram、Facebook、YouTube、Twitter/X、Telegram等；\n2.负责账号起号、养号、内容发布及矩阵运营，提升曝光、互动、涨粉及引流效果；\n3.结合平台热点和用户偏好，完成图文、短视频选题、文案及素材运营；\n4.跟踪账号及内容数据，持续复盘并优化内容方向和运营策略；\n5.关注竞品及平台规则变化，持续挖掘新的自然流量机会。\n\n任职要求\n1.有新媒体、短视频、内容运营或海外社媒运营相关经验；\n2.熟悉至少1—2个主流社媒平台，有实际账号运营经验；\n3.网感较强，具备基础内容策划及数据分析能力；\n4.执行力强，能适应多账号矩阵及快速测试的工作模式；\n5.会使用ChatGPT、AI图片、AI视频等工具者优先；\n6.有海内外平台运营、账号从0到1、自然涨粉、爆款内容或实际引流案例者优先。", "cat": "运营与市场"}, {"id": "217", "title": "AI 模型训练师 / AIGC 模型工程师", "salary": "15K-30k", "location": "远程，可国内办公", "jd": "岗位职责\n\n1、LLM 大模型微调\n负责主流开源大语言模型的微调、评测与部署，包括 Qwen、DeepSeek、Llama 等；\n熟悉 SFT、LoRA、QLoRA、PEFT 等微调技术，能够完成数据准备、训练、评测、模型迭代全流程；\n能够针对垂直业务场景构建训练数据集，并持续优化模型效果。\n2、AIGC 图像 / 视频模型训练\n负责 Stable Diffusion、FLUX、Qwen-Image/Qwen-Image-Edit 等图像模型的 LoRA 微调及效果优化；\n熟悉角色 LoRA、风格 LoRA、服装/场景 LoRA 等训练方式；\n能针对 AI 短剧场景优化人物一致性、画风一致性、场景一致性及连续镜头效果；\n了解图生图、文生图、图生视频、视频生成等主流 AIGC 技术。\n3、ComfyUI 工作流开发\n熟练使用 ComfyUI，能够独立搭建、调试和优化复杂工作流；\n熟悉 ControlNet、IP-Adapter、LoRA、Face/ID Reference、Inpainting、Upscale 等常见能力；\n能够将 ComfyUI Workflow 封装为 API，并接入实际业务生产系统；\n能够定位显存溢出、节点依赖、模型兼容、推理速度等问题。\n4、模型推理与性能优化\n负责模型推理性能、显存占用、吞吐量和响应时间优化；\n熟悉 FP16/BF16/FP8/INT8/INT4 等量化及混合精度方案；\n了解 vLLM、TensorRT-LLM、SGLang、ONNX Runtime、Torch Compile 等推理加速技术；\n了解 Tensor Parallel、Pipeline Parallel、多 GPU 推理及模型并行；\n能根据 GPU 型号、显存和业务并发设计合理的部署方案。\n5、AI 短剧生产能力建设\n参与 AI 短剧「剧本 → 分镜 → 角色 → 图片 → 视频 → 配音 → 成片」生产链路建设；\n研究角色一致性、连续分镜、动作控制、表情控制、镜头控制等关键技术；\n熟悉主流图片/视频生成模型及相关工作流；\n能针对短剧生产中的质量、速度、成本进行模型选型和优化。\n6、Linux / GPU 环境运维\n熟悉 Linux 常用命令、Shell、进程/端口/磁盘/网络等基础运维；\n能独立完成 NVIDIA Driver、CUDA、cuDNN、PyTorch 等 GPU 环境搭建和问题排查；\n熟悉 Docker，能够完成 AI 模型服务容器化部署；\n能处理显存不足、CUDA OOM、驱动版本冲突、依赖冲突、多 GPU 调度等常见问题；\n了解 Nginx、Docker Compose、Kubernetes 者优先。\n\n任职要求\n\n计算机、人工智能、软件工程等相关专业，有 AI 模型训练或 AIGC 项目经验；\n熟练掌握 Python、PyTorch，具备实际模型训练和调优能力；\n有 LLM SFT / LoRA / QLoRA 实际项目经验；\n有 Stable Diffusion、FLUX、Qwen-Image 等图像模型 LoRA 训练经验；\n熟练使用 ComfyUI，能够独立设计复杂 Workflow；\n对 GPU、CUDA、显存、模型量化和推理优化有较深入理解；\n熟悉 Linux 环境，具备基本服务器部署和故障排查能力；\n对 AI 图片、AI 视频、数字人、AI 短剧等方向有较强兴趣和技术敏感度；\n具备较强的模型效果分析能力，能够通过数据、Prompt、训练参数、模型结构和工作流持续改善最终效果。\n加分项\n有 AI 短剧、漫剧、AI 视频生成项目实际落地经验；\n有角色一致性、人物 LoRA、风格 LoRA、视频 LoRA 训练经验；\n熟悉 Diffusers、Transformers、PEFT、DeepSpeed、Accelerate；\n熟悉 Wan、HunyuanVideo、Seedance、Kling、Veo、MiniMax 等视频生成模型或平台；\n有 vLLM / SGLang / TensorRT-LLM 大模型推理部署经验；\n有多卡训练、分布式训练、Tensor Parallel 实战经验；\n熟悉 FFmpeg、OpenCV、视频抽帧、数据清洗及自动标注；\n有模型数据集构建、Caption、自动打标、数据质量治理经验；\n有 4090 / 5090 / A100 / H100 等 GPU 服务器实际部署和优化经验；\n具备 Docker / Kubernetes / GPU 集群运维经验。\n\n核心能力关键词\nLLM / SFT / LoRA / QLoRA / PEFT / PyTorch / Transformers / Diffusers / ComfyUI / Stable Diffusion / FLUX / Qwen-Image / ControlNet / IP-Adapter / AIGC / AI Video / AI短剧 / vLLM / SGLang / TensorRT-LLM / CUDA / Multi-GPU / Docker / Linux / FFmpeg\n我们希望你是\n不是单纯“调用模型 API”的应用开发，而是能够真正深入到 数据 → 训练 → 模型 → 推理 → 工作流 → GPU 部署 → 业务效果 整个链路的人。\n最终目标是：把模型训出来、把效果调出来、把推理速度提上去，并真正投入 AI 短剧生产。", "cat": "技术开发"}, {"id": "218", "title": "AI短剧导演", "salary": "28K-35K", "location": "远程，可国内办公", "jd": "岗位职责\n\n1. 负责 AI 短剧项目整体导演工作，包括剧本理解、剧情拆解、分镜设计、镜头调度及成片质量把控。\n2. 根据剧情设计景别、构图、运镜、人物表演及镜头衔接，强化人物情绪、剧情冲突及关键爆点。\n3. 将剧本转化为可执行的 AI 视频制作方案，明确镜头画面、人物动作、情绪及生成要求。\n4. 指导 AI 生成师使用 Seedance、可灵、ComfyUI 等工具完成镜头制作，并针对生成结果提出明确修改意见。\n5. 把控短剧整体节奏、人物一致性、画面连续性及剧情表达，与编剧、生成师、剪辑协作完成最终成片。\n6. 持续关注 AI 视频新技术及短剧市场趋势，不断优化制作流程和成片效果。\n\n任职要求\n\n1. 具备较强的导演思维、剧情理解能力及镜头语言能力，有短剧、影视、广告、动画、漫剧等相关导演经验。\n2. 熟悉短剧的剧情节奏、人物关系、情绪递进、冲突爆点及反转设计。\n3. 具备 AI 视频制作经验，熟悉 Seedance、可灵等主流 AI 视频工具，对 ComfyUI 工作流及 AI 视频生成逻辑有一定了解。\n4. 有半年以上 AI 短剧导演或相关项目经验，能够独立完成从剧本到成片的导演工作。\n5. 需提供个人作品或参与项目案例。\n\n加分项\n\n有擦边、成人向或强剧情短剧导演经验，有成熟爆款作品或完整 AI 短剧项目经验者优先。", "cat": "内容与创作"}, {"id": "219", "title": "高级产品经理（管理方向）", "salary": "20k-28k", "location": "远程，可国内办公", "jd": "高级产品经理｜视频内容方向\n岗位职责\n负责视频内容产品规划与迭代\n负责公司视频内容类产品的整体规划、功能设计和持续优化，覆盖短视频、长视频、直播、内容社区、创作者体系、内容运营后台等相关方向。能够结合业务目标、用户需求、竞品情况和数据表现，制定清晰的产品路线图和阶段性目标。\n优化视频内容消费体验\n围绕视频播放、推荐流、详情页、搜索、评论、点赞、收藏、分享、关注、举报反馈等核心链路，持续提升用户体验和产品效率。重点关注播放量、完播率、人均观看时长、互动率、留存率等核心指标。\n推动内容生态建设\n参与内容生产、审核、分发、消费、沉淀的完整链路设计，推动内容标签、内容分层、优质内容识别、低质内容治理、创作者激励等机制建设，提升平台内容供给质量和内容分发效率。\n数据驱动产品增长\n建立和完善视频内容产品的数据指标体系，通过数据分析发现问题、验证假设、制定优化方案。能够独立完成需求效果复盘、漏斗分析、用户分层分析、AB 实验方案设计，并推动产品持续增长。\n跨团队项目推进\n负责重点项目从需求调研、方案设计、PRD 编写、评审推进、研发跟进、测试验收、上线发布到数据复盘的完整闭环。协调研发、设计、算法、运营、审核、数据、市场等团队资源，保障项目高质量交付。\n负责产品团队管理\n负责产品团队的目标拆解、任务分配、过程跟进和质量把控，能够指导团队成员提升需求分析、产品设计、数据分析、项目推进和业务理解能力，推动团队形成规范化、高效率的产品工作机制。\n任职要求\n经验要求\n本科及以上学历，5 年以上互联网产品经验，其中至少 2 年视频内容、短视频、直播、内容社区、信息流推荐或内容平台相关经验。\n视频内容产品能力\n熟悉视频内容产品核心链路，理解内容生产、内容审核、推荐分发、播放互动、内容运营、创作者体系等模块的产品设计逻辑。对短视频、直播、社区内容、UGC/PGC 内容生态有较深入理解。\n数据分析能力\n具备较强的数据意识和指标拆解能力，熟悉播放量、曝光点击率、完播率、互动率、关注转化率、留存率、内容供给量、优质内容占比等常见指标，能够通过数据定位问题并推动优化。\n项目推进能力\n具备复杂项目管理经验，能够在多部门协作场景下明确目标、拆解任务、推动执行、识别风险，并保证项目按计划落地。具备较强的沟通协调能力和问题解决能力。\n团队管理能力\n具备 2 年以上产品团队管理经验，有管理 3 人及以上产品团队经验优先。能够进行团队目标管理、过程管理、人才培养和结果复盘，带领团队持续交付高质量产品成果。\n加分项\n\n有短视频平台、直播平台、内容社区、影视内容平台、在线教育视频、新闻资讯视频化产品经验者优先。\n\n有推荐系统、内容标签、内容审核、创作者平台、内容商业化、会员付费、广告变现等相关经验者优先。\n\n有 AI 视频生成、智能剪辑、视频理解、智能审核、AIGC 内容生产工具相关经验者优先。\n\n熟悉 SQL、埋点体系、AB 实验、BI 数据看板、用户增长模型者优先。", "cat": "产品与管理"}, {"id": "220", "title": "AI内容编辑师", "salary": "15-25K（按市场情况可上浮至35K）", "location": "远程，可国内办公", "jd": "岗位职责：\n1. 根据编剧提供的剧本、分镜脚本，完成AI短剧、AI漫剧相关素材制作；\n2. 负责角色设计、场景设计、道具设计及画面风格统一；\n3. 完成角色一致性控制、多镜头角色复现及连续镜头衔接；\n4. 使用AI工具完成图片生成、图片优化、视频生成及镜头补充；\n5. 负责图生图、文生图、图生视频、视频重绘、局部重绘等制作工作；\n6. 根据项目要求完成镜头拆分、批量生成及素材管理；\n7. 配合后期完成短剧成片制作，保证画面质量及交付效率；\n8. 持续优化AI工作流，沉淀提示词库、角色库、场景库及标准化制作流程。\n岗位要求：\n1. 熟练使用ComfyUI，能够独立搭建及调整工作流；\n2. 熟悉角色一致性方案，包括LoRA、IPAdapter、ControlNet、FaceSwap等技术；\n3. 熟悉Flux、SDXL等主流模型及相关生态；\n4. 熟悉即梦、可灵、Runway、Pika、Luma、PixVerse、海螺等AI视频平台；\n5. 具备较强审美能力，对人物比例、镜头构图、光影氛围、色彩风格有较好理解；\n6. 具备影视镜头意识，能够根据分镜需求完成对应画面制作；\n7. 具备较强问题排查能力，能够解决角色崩坏、风格漂移、动作异常等问题；\n8. 有较强执行力，能够在规定时间内完成批量内容生产。\n加分项：\n1. 有AI短剧、AI漫剧、广告素材制作经验；\n2. 有角色一致性项目经验；\n3. 熟悉真人转动漫、韩漫风、影视风等风格制作；\n4. 有ComfyUI工作流开发及优化经验；\n5. 熟悉PR、PS、剪映等后期工具；\n6. 有成人向剧情内容制作经验者优先。\n面试重点考察：\n1. ComfyUI实操能力；\n2. 角色一致性控制能力；\n3. 图生视频质量与稳定性；\n4. 镜头理解能力；\n5. 问题解决能力；\n6. 批量化生产能力。\n面试需提供：\n1. AI短剧作品案例；\n2. AI漫剧作品案例；\n3. 角色一致性案例；\n4. ComfyUI工作流截图或工程文件；\n5. 图生视频案例；\n6. 本人独立完成项目说明", "cat": "内容与创作"}, {"id": "221", "title": "中高级运营", "salary": "15-20k", "location": "远程，可国内办公", "jd": "岗位职责：\n1. 5年以上To C产品运营、产品运营或内容产品相关经验，有内容站、社区产品、泛娱乐产品（包括但不限于视频、交友、直播等）产品经验优先；\n2. 必须具备产品0-1搭建或核心项目从规划到落地的完整经验，能够独立推动需求设计、项目落地及后续迭代优化经验；\n3. 熟悉产品迭代流程，能够结合业务目标、用户反馈及数据表现，持续推进产品功能优化与版本迭代；\n4. 具备基础原型输出能力，能够独立完成基础原型图、流程图、页面逻辑梳理，并与产品、设计、技术高效协同；\n5. 熟悉内容类产品运营逻辑，对内容板块搭建、内容分发、内容消费链路及内容生态优化有一定经验；\n6. 具备用户增长思维，对拉新、留存、活跃、转化等核心增长指标有实践经验，能够围绕目标制定增长策略；\n7. 具备较强的数据分析能力，能够通过数据发现问题、定位原因，并推动产品与运营方案优化；\n8. 对AI产品或AI工具有一定理解和应用经验，能够结合AI能力推动业务提效、内容优化或产品创新者优先；\n9. 具备良好的跨团队沟通协作能力，能够与产品、技术、设计、运营等多角色高效配合，推动事项落地；\n10. 具备较强的执行力、责任心和项目推进能力，能够适应业务快速变化与多任务并行节奏。\n\n岗位要求：\n1. 负责内容类产品的中后台及用户侧运营工作，围绕产品迭代、内容优化、用户增长及转化提升等方向，持续推进业务发展；\n2. 参与产品需求规划与版本迭代，能够结合业务目标、用户需求及数据反馈，提出优化方案并推动落地；\n3. 独立输出基础原型图、页面逻辑及流程方案，协助完成产品方案梳理、需求评审及开发对接；\n4. 负责内容板块的规划、调整与优化，持续提升内容曝光效率、用户消费效率及整体内容体验；\n5. 围绕用户增长目标，制定并推进拉新、促活、留存、转化等相关运营策略，提升产品核心指标表现；\n6. 分析用户行为及内容数据，重点关注DAU、留存率、转化率、内容点击率、消费时长等指标，并输出优化建议；\n7. 协同产品、技术、设计等团队推进产品功能落地，跟进项目排期、开发进度、测试上线及效果复盘；\n8. 结合内容生态和用户需求，持续优化内容结构、页面体验及功能策略，提升用户活跃度与产品使用体验；\n9. 探索AI在产品和运营场景中的应用，推动AI能力在内容生产、内容分发、用户运营或效率提升方面的落地；\n10. 沉淀产品运营方法论与项目流程规范，为后续业务复制和团队协同提供支持。\n\n必备条件：\n视频平台、AI互动产品、社区平台、社交平台等泛娱乐行业经验；\n具备产品0-1搭建或核心项目从规划到落地的完整经验；\n具备用户增长思维，对拉新、留存、活跃、转化等核心增长指标有实践经验，能够围绕目标制定增长策略；\n具备较强的数据分析能力，能够通过数据发现问题、定位原因，并推动产品与运营方案优化；\n跨职能岗位协调经验丰富，能够进行快速协调技术岗位推动整体项目开发进度；\n思维活跃实事求是，能够洞察工作环节的缺失点进行汇总，并进行有效整改。", "cat": "运营与市场"}, {"id": "222", "title": "AI短剧编导", "salary": "15-25k", "location": "远程，可国内办公", "jd": "岗位职责：\n负责公司 AI短剧、AI漫剧、成人向剧情短剧等内容制作，完成角色设定、分镜生成、画面生成、视频生成及成片交付；同时配合公司搭建 AI短剧内容生产工作流，沉淀提示词模板、平台使用流程、素材管理规范和批量化制作 SOP\n岗位要求：\n熟练使用 ComfyUI，具备角色一致性控制、图生图、图生视频、局部重绘等能力；熟悉可灵、即梦、Runway、Pika、Luma、PixVerse、海螺、Midjourney 等主流 AI视频/短剧平台；具备一定审美和镜头意识，能根据剧本和分镜完成可交付内容。\n其他要求：\n需提供 AI短剧、AI视频、AI漫剧、角色一致性案例或 ComfyUI 工作流作品；有 AI短剧、成人向内容、广告素材、批量化内容生产经验者优先；能接受成人向内容制作方向，并遵守公司内容合规要求。", "cat": "内容与创作"}, {"id": "223", "title": "AI视频剪辑师", "salary": "15-25K", "location": "远程，可国内办公", "jd": "岗位职责\n\n1. 负责品牌日常短视频、活动节点、专题宣传物料的 AI辅助剪辑、包装、调色、字幕及多版本导出；\n2. 独立承接 漫改二创、动漫混剪、剧情重组、氛围感卡点类视频 的全流程制作，并结合 AI 工具提升效率与表现力；\n3. 配合运营理解脚本意图，自主优化镜头节奏、转场、字幕、配乐及视觉包装，提升成片质感和完播体验；\n4. 结合 AI 工具完成 素材扩展、局部补帧、动态处理、封面优化、文案/字幕辅助生成 等工作；\n5. 统一品牌矩阵视频的视觉风格、配色、包装与模板规范，保持系列内容高级质感和一致性；\n6. 搭建并维护素材库、模板库、封面规范及 AI 剪辑工作流，沉淀可复用 SOP，提升团队整体交付效率；\n7. 跟踪播放、点击、互动等数据，持续优化剪辑节奏、封面风格和二创叙事逻辑；\n8. 适配业务紧急需求，快速产出热点专题、限时活动、深夜专区等高质感 AI 视频内容。\n\n二、任职要求\n\n1. 3年以上视频剪辑/后期相关经验，有短视频、二创、漫改、娱乐内容方向经验优先；\n2. 熟练使用 PR、AE、剪映 等剪辑工具，具备较强的节奏把控、调色、动态字幕、视觉包装和特效合成能力；\n3. 具备 AI 视频相关实操经验，能够使用 AI 工具辅助完成 视频生成、素材处理、字幕配音、封面优化、剪辑提效；\n4. 熟悉漫改二创、动漫素材拆解、情绪卡点、剧情重组、同人改编等内容表达方式；\n5. 具备较强审美和镜头语言认知，能独立把控画面质感、内容氛围和平台适配效果；\n6. 可独立完成从素材整理、粗剪、精剪、包装、字幕、封面到多规格导出的完整流程；\n7. 执行力强、抗压性高，适应快节奏和多任务并行交付；\n8. 有 AI 剪辑工作流搭建、模板沉淀、批量内容生产经验者优先；\n9. 有品牌矩阵统一风格管理、二创赛道经验或沉淀过视频 SOP 规范者优先。", "cat": "内容与创作"}, {"id": "224", "title": "国内新媒体运营", "salary": "15k-20k", "location": "远程，可国内办公", "jd": "岗位职责：\n1. 负责国内主流媒体平台整体运营规划，包括但不限于小红书、抖音、视频号、微博、公众号等平台；\n2. 根据业务发展方向制定平台运营策略、账号矩阵规划及阶段性增长目标；\n3. 深度研究各平台流量机制、推荐逻辑及内容生态，结合平台规则持续优化运营策略；\n4. 负责内容运营体系搭建，包括选题策划、内容方向、用户增长、互动运营及传播转化；\n5. 独立推进账号从0-1孵化及成熟账号增长，对账号数据结果负责；\n6. 定期分析平台数据及竞品动态，输出运营复盘及优化方案；\n7. 协调内容、设计、商务及技术等团队资源，推进项目执行及活动落地；\n8. 建立账号运营标准及管理机制，降低平台风险，保障账号稳定运营。\n\n任职要求：\n1. 大专及以上学历，3年以上国内主流媒体平台运营经验；\n2. 熟悉小红书、抖音、视频号等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知；\n3. 具备成熟账号操盘经验，有成功案例或账号增长成果优先；\n4. 具备较强的数据分析及运营复盘能力，能够通过数据驱动内容及运营优化；\n5. 具备较强的项目推进及统筹能力，能够独立负责平台整体运营工作；\n6. 对热点趋势、内容传播及用户心理有较高敏感度；\n7. 具备团队协作及基础管理能力，有运营团队管理经验优先；\n8. 有AI内容、互联网科技类项目运营经验者优先。\n\n加分项：\n1. 有百万级曝光或成熟账号矩阵运营经验；\n2. 熟悉短视频内容运营及投流逻辑；\n3. 有品牌营销、活动运营或商业化增长经验；\n4. 具备基础视频剪辑、内容策划或达人合作经验。", "cat": "运营与市场"}, {"id": "225", "title": "AI内容工程师（AI视频生产）", "salary": "15k-20k", "location": "远程，可国内办公", "jd": "一、岗位职责：\n1. AI剧情真人剧全流程制作：基于剧本完成分镜拆解、角色形象生成、多镜头剧情视频生成与后期剪辑，产出具备完整故事线和人物表演的AI真人短剧。\n2. AI成人影视全流程制作：完成影视角色与场景生成、静态画面动态化处理、镜头运动与配音配乐整合，产出高质量动态漫剧视频。\n3. 角色一致性与风格统一控制：通过LoRA、IPAdapter、ControlNet、FaceSwap等技术，确保同一角色在多集、多场景中的面部、服饰、姿态保持一致，并维护漫剧视觉风格统一。\n4. AI生产工作流搭建与效率优化：基于ComfyUI、扣子、Dify等工具构建标准化AI视频生产流水线，建立可复用的角色库、场景库与提示词体系，支撑剧情剧与漫剧的量产。\n5. 质量把控与新技术验证：对生成内容进行叙事节奏、画面质量的审核与修复，持续测试最新AI视频模型，优化效果与效率。\n\n二、任职要求：\n1. 1年以上AI视频实战经验，有成人经验更佳；\n2. 深度掌握核心AI工具链：图像生成，视频生成工作流搭建（ComfyUI）及基础后期剪辑\n3. 能独立完成从剧本到分镜的转化，理解景别、运镜、正反打等镜头语言，并通过提示词精准控制角色表演、情绪张力与镜头节奏。\n4.快速上手新AI视频模型，主动优化生产流程以支撑剧集化量产，并对生成瑕疵进行人工修复与质量把关。", "cat": "内容与创作"}, {"id": "226", "title": "二次元内容运营", "salary": "12K-15K", "location": "远程，可国内办公", "jd": "# 一、岗位职责\n\n1. 内容运营：负责视频产品的二次元（动漫/漫画/视频/图文）内容规划、铺设、标签分类与上架审核，保障内容供给与更新节奏，持续优化内容结构与页面展示效果；\n2. 数据运营：以 DAU、用户留存为核心指标，负责日报数据跟踪与复盘分析，定位问题、提出并落地拉活与留存优化动作；\n3. 用户与社区：策划并运营社区内容、签到/专区/活动等玩法，提升用户活跃度与粘性；\n4. 新品冷启动：参与新视频产品的冷启动与内容板块搭建，建立内容标准与标签体系，推动产品从 0 到 1；\n5. 跨部门协同：与产品、技术、投放、平面协同，推进需求落地、功能问题修复与活动上线；\n6. 内容合规：负责内容审核与违规排查，保障平台内容安全合规。\n\n## 二、任职要求\n\n1. 3 年以上内容/二次元运营经验，具备独立负责单一产品或核心模块的中高级经验；\n2. 熟悉 ACG/二次元生态与用户偏好，对内容有敏感度和判断力；\n3. 数据驱动思维强，能独立完成数据分析与复盘，熟练使用 Excel/数据表；\n4. 熟练运用 AI 工具提效（内容整理、数据分析、文案生成等）；\n5. 内容审核与合规意识强，工作细致、抗压、响应快；\n6. 能接受成人向/泛娱乐内容行业。\n\n## 三、加分项\n\n- 有产品冷启动 / 新品从 0 到 1 的经验\n- 有社区运营、活动策划经验\n- 熟悉 AI/自动化工具或简单脚本\n- 具备数据分析、看板搭建能力\n- 二次元深度用户 / 资深爱好者", "cat": "内容与创作"}, {"id": "227", "title": "中高级运营专员（创作者社区运营）", "salary": "15–25k", "location": "远程，可国内办公", "jd": "一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕创作者运营、用户运营、内容运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责创作者运营管理，推动创作者引入、分层、激励、活跃维护及产出提升，保障内容持续供给；\n5. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n6. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n7. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进；\n8. 根据业务发展需要，参与活动运营、专题策划、转化路径优化及其他与产品增长相关的专项工作。\n\n二、任职要求\n1. 3年以上互联网运营经验，社区运营、用户运营、内容运营方向优先；\n2. 具备完整项目运营经验，能够独立负责从目标制定、策略拆解、执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有0-1项目搭建经验、复杂业务增长经验、多平台运营经验者优先；\n8. 有团队管理或带教经验者优先；\n9. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "内容与创作"}, {"id": "228", "title": "AI视频剪辑师（短剧/影视二创）", "salary": "12k-20k", "location": "远程，可国内办公", "jd": "岗位JD描述\n负责短剧、电影、网剧等影视素材的AI辅助二创、剧情重组及内容魔改，结合剪辑能力与AI工具产出具备传播力的短视频内容。\n\n一、岗位职责\n\n1. 完成影视素材筛选、剧情拆解、混剪、魔改及剧情重组；\n2. 提炼高潮、冲突、反转等关键内容，优化短视频节奏和叙事效果；\n3. 使用AI工具完成风格化、换脸、换装、场景替换、画质增强、补帧、字幕等处理；\n4. 根据运营需求及热点方向快速制作影视二创及不同平台适配版本；\n5. 独立完成选题、素材处理、AI制作、剪辑包装到最终成片；\n6. 沉淀素材库、模板、AI工作流及二创SOP，提高批量生产效率；\n7. 根据播放、完播、互动等数据持续优化内容。\n\n二、任职要求\n\n1. 有视频剪辑经验，有短剧二创、影视混剪、电影解说、剧情魔改经验优先；\n2. 熟练使用PR、AE、剪映等工具，具备良好的剪辑节奏、调色、字幕及特效能力；\n3. 有AI视频实操经验，熟悉AI图像、AI视频、FaceSwap、AI配音等相关工具；\n4. 理解影视叙事、镜头语言及短视频传播逻辑，具备内容审美和爆款意识；\n5. 执行力强、出片速度快，能够适应多任务并行；\n6. 有AI工作流、批量生产、模板或SOP搭建经验优先。", "cat": "内容与创作"}, {"id": "229", "title": "AI视频内容工程师（AI短剧/AIGC）", "salary": "15k-20k", "location": "远程，可国内办公", "jd": "岗位JD描述\n负责AI短剧、动态漫剧等内容从剧本、分镜、角色、场景到视频成片的全流程生产，并搭建可复制、可规模化的AI视频生产工作流。\n\n一、岗位职责\n\n1. 根据剧本完成剧情拆解、分镜、角色、场景及多镜头AI视频制作；\n2. 制作AI真人短剧、动态漫剧、漫改剧等内容；\n3. 通过提示词及AI模型控制角色表演、镜头效果和视觉风格；\n4. 使用LoRA、IPAdapter、ControlNet、FaceSwap等技术解决角色一致性问题；\n5. 基于ComfyUI搭建标准化AI视频生产工作流及角色库、场景库、提示词库；\n6. 结合扣子、Dify等工具优化重复流程，提升批量生产效率；\n7. 处理人物崩坏、角色漂移、画面闪烁等生成问题；\n8. 持续测试新模型、新节点及新工作流，并推动实际生产落地。\n\n二、任职要求\n\n1. 有AI视频、AI短剧、动态漫剧或AIGC内容实际制作经验；\n2. 熟悉AI图像、AI视频及ComfyUI工作流；\n3. 能够完成剧本到分镜的转化，理解景别、构图、运镜及人物情绪表达；\n4. 熟悉LoRA、IPAdapter、ControlNet、FaceSwap等角色一致性技术；\n5. 能够独立完成至少一种AI视频内容从剧本到成片的完整流程；\n6. 具备基础视频剪辑及AI生成内容修复能力；\n7. 学习能力强，能够快速测试并落地新的AI视频模型。\n\n加分项\n有AI剧集批量生产、LoRA训练、ComfyUI工作流搭建、Python/API、模型部署或自动化生产经验优先。", "cat": "内容与创作"}, {"id": "230", "title": "AI短剧编剧", "salary": "12k-20k", "location": "远程，可国内办公", "jd": "岗位JD描述\n\n负责AI短剧剧情策划、剧本创作、分镜脚本设计及剧本库建设，持续沉淀团队创作方法论，为AI视频制作团队提供标准化、高质量的内容方案，不断提升AI短剧内容质量及生产效率。\n\n一、岗位职责\n\n1、负责AI短剧剧情策划及剧本创作\n根据业务需求及内容方向，负责AI短剧剧情构思、故事策划及剧本创作，持续输出具有传播力、可系列化及商业价值的原创内容。\n\n2、负责分镜头脚本设计\n根据剧本内容完成标准化分镜头脚本设计，包括镜头内容、人物动作、对白、情绪、场景、运镜及节奏等内容，确保脚本可直接交付AI视频制作团队使用。\n\n3、负责剧本库建设及内容储备\n持续建设AI短剧剧本库，保证剧本储备始终领先制作产能，保持不少于2-3个月可直接投入制作的内容储备，建立剧本分类、标签及版本管理体系，提高内容管理及复用效率。\n\n4、负责内容方法论沉淀\n持续总结爆款短剧创作规律，沉淀剧情结构、爽点设计、开场钩子、反转节点、节奏控制等创作方法，建立团队剧本创作规范。\n\n5、负责热点内容研究\n持续关注互联网热点、热门短剧、网络热梗及用户兴趣变化，结合平台内容趋势，不断策划符合用户喜好的创新题材及剧情。\n\n二、任职要求\n\n1、具备优秀的故事策划及剧本创作能力，有短剧、小说、影视剧本等相关创作经验优先；\n\n2、熟悉短剧内容节奏，能够独立完成剧情设计、人物设定及分镜脚本输出；\n\n3、熟悉AI内容创作流程，了解AI提示词（Prompt）基础逻辑及AI生成能力，能够结合AI制作特点进行剧本设计；\n\n4、互联网敏感度高，长期关注抖音、小红书、B站、微博等平台，熟悉各类网络热点、流行文化及网络热梗，能够快速将热点转化为剧情创意；\n\n5、具备较强原创能力及内容创新意识，能够持续输出不同题材、不同风格的剧本，避免流水线、模板化创作；\n\n6、具备良好的沟通协作能力，能够跨部门协同，推动剧本顺利落地。", "cat": "内容与创作"}, {"id": "231", "title": "中高级AI短剧编剧", "salary": "15K–25K", "location": "远程，可国内办公", "jd": "岗位JD：\n一、岗位职责\n1、原创博主IP短剧开发\n基于公司现有博主形象、人设及内容资产，完成世界观、人物关系、核心冲突和故事主线设计，开发具有鲜明辨识度、可持续连载和商业化潜力的原创短剧。\n2、热点IP改编与二次创作\n持续研究热门小说、影视剧、短剧及社会热点，提炼其中具有传播潜力的题材、人物和情节，在版权及平台合规范围内进行本土化、短剧化和差异化改编。\n3、完整剧本创作\n独立完成故事提案、人物小传、分集大纲及逐集剧本，强化开场钩子、矛盾升级、情绪刺激、反转节点和结尾悬念，确保内容符合短剧观看节奏及AI制作条件。\n4、建立剧本选题与评审机制\n从用户需求、内容差异化、制作难度、传播潜力和商业价值等维度评估选题，建立立项、评审、修改和定稿标准，提高优质剧本的筛选效率和落地成功率。\n5、筹建剧本库及资产管理体系\n建立原创、改编、储备剧本的分类体系，实现剧本资产的统一管理和复用。\n6、梳理剧本生产SOP\n搭建“选题研究—创意提案—大纲评审—剧本创作—定稿交付—成片复盘—数据反馈”的工作流程，沉淀创作模板、审核标准和质量检查清单。\n7、推动剧本落地与持续迭代\n与AI制作、剪辑、运营及产品团队协作，根据制作可行性优化场景、人物和情节设计；结合播放、完播、互动及付费数据复盘内容表现，持续调整创作方向。\n\n二、任职要求\n1、具备5年以上短剧、网文、影视剧、互动内容或相关领域的策划与编剧经验，有成熟作品或商业化项目案例。\n2、具备原创开发和改编能力，能够从零搭建人物与故事体系，也能将长篇小说、影视内容或热点题材重构为快节奏短剧。\n3、熟悉华人男性用户的内容偏好，能够准确把握冲突、悬念、反转、爽点和情绪价值，并将其转化为可持续连载的剧情。\n4、具备较强的系列化创作能力，能够统筹人物成长、故事主线、单集钩子和阶段性高潮，避免剧情同质化或简单套用模板。\n5、了解AI视频生产的基本特点，能够兼顾人物一致性、场景复杂度、制作成本和镜头实现难度，确保剧本具有实际可制作性。\n6、具备剧本库、内容资产或创作流程建设经验，能够承担标准制定、质量审核和方法论沉淀，不局限于单纯完成写稿。\n7、具备良好的数据意识和跨团队协作能力，能够根据用户反馈及产品数据快速调整剧本，并推动内容顺利进入制作环节。", "cat": "内容与创作"}, {"id": "232", "title": "高级产品经理", "salary": "20k-30k", "location": "远程，可国内办公", "jd": "一、岗位职责\n负责视频、漫画、小说、短剧等业务的产品规划与交付，连接用户体验、内容生态与商业增长；在复杂协作环境中将业务目标转化为可落地的产品成果，并通过 AI 提升产品全链路效率与质量。\n\n1.制定产品战略、产品路线图及需求优先级，覆盖用户端、创作者端及运营后台，推动从用户研究、方案设计、研发上线到数据复盘的完整闭环。\n2.持续优化视频播放、漫画/小说阅读、短剧观看及社区互动体验，关注内容发现、推荐分发、性能稳定性、跨端一致性及用户留存。\n3.设计粉丝经济与商业化体系，包括会员订阅、内容付费、虚拟商品、打赏、广告、及创作者激励等，兼顾收入增长、用户体验、创作者收益与平台生态。\n4.建立核心指标及实验机制，对活跃、留存、内容消费、付费转化、和内容供给等指标负责，通过数据发现问题并持续迭代。\n5.统筹产品、研发、设计、测试、数据、内容、运营、等资源，明确项目范围、里程碑、依赖、风险及验收标准；能在资源受限、目标变化时快速决策并保障交付。\n6.主导 AI 在用户研究、数据分析、PRD/原型、测试及运营工作流中的应用；建立效果评测、人机协作、成本、安全等机制，沉淀可复用能力。\n7. 拥有成人行业经验，若其他方面特别优秀，无成人行业经验可放宽限制 \n备注：请候选人投递简历时准备不少于1个经脱敏的代表案例，形式不限，可为PRD、HTML、原型、数据看板或编排好的工作流；至少包含1个内容/商业化项目或1个AI赋能项目。\n\n二、任职要求\n1.6年以上互联网产品经验，具备复杂产品主导经验及可量化业绩，拥有从0→1及规模化迭代案例。\n2.具备视频、漫画、小说、短剧等内容产品经验，至少两个方向有实际项目经历，其中一个方向达到核心负责人深度。\n3.熟悉内容平台、创作者生态、社区运营、内容分发及粉丝商业化，能够平衡用户价值、内容供给与商业目标。\n4.具备项目管理视角、强执行力和主人翁意识，能够拆解模糊目标、协调多团队、处理冲突并对最终结果负责。\n5.具备良好的商业判断、数据分析、用户洞察和技术理解；有推荐系统、付费转化、广告体系等经验者优先。\n6.有 AI 协作经验 或 AI 工作流的真实落地成果，能够说明场景选择、方案边界、上线指标、投入成本及业务价值。", "cat": "产品与管理"}, {"id": "233", "title": "视频剪辑师", "salary": "10k-15k", "location": "远程，可国内办公", "jd": "岗位JD描述\n一、岗位职责\n1.负责品牌日常短视频、活动节点、专题宣传物料的剪辑、视觉包装、调色精修及多版本导出；\n2.承接AI素材加工、二创、同人混剪、人物剧情重组、氛围感卡点视频剪辑制作\n3.配合运营拆解脚本意图，优化镜头节奏、转场配乐、字幕版式，把控成片质感与完播体验；\n4.统一全品牌视频视觉配色、包装体系与风格规范，保持系列内容高级质感与统一性；\n5.搭建分类素材库、剪辑模板与封面规范，沉淀复用流程，提升团队交付效率与标准化；\n6.参考视频播放、点击率、互动数据，迭代剪辑节奏与封面风格；\n7.适配业务紧急需求，快速产出深夜专区、限时活动、热点专题等高质感宣传剪辑物料。\n\n二、任职要求\n1.3年以上专业视频剪辑经验，有娱乐社群、信息流、IP同人二创剪辑经验优先；\n2.精通PR/AE，熟练使用剪映，具备专业调色、动态包装、特效合成能力，可独立高质量完成剪辑出片；\n3.具备相关剪辑作品集，擅长镜头解构、剧情重组、情绪卡点，有较强节奏把控与数据意识；\n4.网感审美在线，熟悉平台内容调性、热门玩法，可基于现有素材完成IP二次改编剪辑；\n5.能够利用AI输出素材进行视频加工剪辑，拒绝简单粗暴素材拼接；\n6.沟通协作顺畅，可多任务并行，接受高频迭代、排期管理与节点加急产出；\n7.有素材库搭建、剪辑模板沉淀、内容SOP标准化经验者优先。", "cat": "内容与创作"}, {"id": "234", "title": "AI陪伴产品运营（AI女友方向）", "salary": "12K-18K", "location": "远程，可国内办公", "jd": "岗位JD描述\n一、岗位职责\n1.负责成人向AI女友陪伴产品的整体运营，参与产品定位、目标用户分析、运营策略制定及上线冷启动，推动产品从0到1落地；\n2.围绕用户情感陪伴和成人互动需求，规划AI女友角色矩阵，包括人设、关系定位、对话风格、故事背景、互动场景及内容更新节奏；\n3.设计用户从注册、首次对话、关系升级到付费转化的完整运营路径，优化新用户激活、互动频次、次日及长期留存；\n4.策划会员订阅、虚拟礼物、剧情解锁、角色权益、限时活动等商业化玩法，持续提升付费率、客单价及用户生命周期价值；\n5.结合用户对话反馈和行为数据，协同产品及AI团队优化角色Prompt、回复质量、长期记忆、情绪反馈和内容丰富度，改善陪伴真实感与沉浸体验；\n6.搭建产品核心数据指标及复盘机制，持续跟踪注册转化、首聊率、互动轮次、留存率、付费率、ARPPU等指标，通过用户分层和A/B测试推动运营迭代；\n7.建立用户反馈、核心用户维护、流失召回及投诉处理机制，识别高价值用户需求，沉淀可复用的用户运营策略；\n8.负责竞品研究及行业趋势跟踪，持续分析AI陪伴、虚拟恋人、成人社交等产品的内容形态、商业模式及运营玩法；\n\n二、任职要求\n1.3年以上互联网产品运营、用户运营或内容运营经验，有AI陪伴、虚拟社交、聊天交友、互动娱乐、游戏或付费内容产品经验者优先；\n2.了解AI大模型及对话类产品的基本逻辑，能够参与角色Prompt、人设规则、对话效果及互动流程的配置、测试和优化；\n3.具备较强的用户洞察和内容策划能力，能够理解男性用户在情感陪伴、虚拟关系及成人互动场景中的核心需求；\n4.具备完整的用户增长和商业化思维，熟悉“拉新—激活—留存—付费—召回”运营链路，能够独立设计付费转化方案；\n5.数据敏感度较高，能够独立搭建指标体系、分析转化漏斗，并根据数据和用户反馈提出明确的优化方案；\n6.具备较强的文案及角色内容策划能力，能够独立完成人设、对话场景、关系成长线和活动方案设计；\n7.具备从0到1推进新产品或新项目的经验，目标意识强，能够主动拆解任务并推动跨部门协作落地；\n8.关注AI应用及成人内容行业发展，对新产品、新玩法和用户趋势保持敏感，能够接受成人向业务形态；", "cat": "运营与市场"}, {"id": "235", "title": "中高级运营专员", "salary": "15–20k", "location": "远程，可国内办公", "jd": "一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责创作者运营管理，推动创作者引入、分层、激励、活跃维护及产出提升，保障内容持续供给；\n5. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n6. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n7. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进；\n8. 根据业务发展需要，参与活动运营、专题策划、转化路径优化及其他与产品增长相关的专项工作。\n\n二、任职要求\n1. 3年以上互联网运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立负责从目标制定、策略拆解、执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有0-1项目搭建经验、复杂业务增长经验、多平台运营经验者优先；\n8. 有团队管理或带教经验者优先；\n9. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "运营与市场"}, {"id": "236", "title": "AI视频内容工程师", "salary": "15k-20k", "location": "远程，可国内办公", "jd": "\"岗位JD描述\n负责AI短剧、动态漫剧等内容从剧本、分镜、角色、场景到视频成片的全流程生产，并搭建可复制、可规模化的AI视频生产工作流。\n一、岗位职责\n1. 根据剧本完成剧情拆解、分镜、角色、场景及多镜头AI视频制作；\n2. 制作AI真人短剧、动态漫剧、漫改剧等内容；\n3. 通过提示词及AI模型控制角色表演、镜头效果和视觉风格；\n4. 使用LoRA、IPAdapter、ControlNet、FaceSwap等技术解决角色一致性问题；\n5. 基于ComfyUI搭建标准化AI视频生产工作流及角色库、场景库、提示词库；\n6. 结合扣子、Dify等工具优化重复流程，提升批量生产效率；\n7. 处理人物崩坏、角色漂移、画面闪烁等生成问题；\n8. 持续测试新模型、新节点及新工作流，并推动实际生产落地。\n二、任职要求\n1. 有AI视频、AI短剧、动态漫剧或AIGC内容实际制作经验；\n2. 熟悉AI图像、AI视频及ComfyUI工作流；\n3. 能够完成剧本到分镜的转化，理解景别、构图、运镜及人物情绪表达；\n4. 熟悉LoRA、IPAdapter、ControlNet、FaceSwap等角色一致性技术；\n5. 能够独立完成至少一种AI视频内容从剧本到成片的完整流程；\n6. 具备基础视频剪辑及AI生成内容修复能力；\n7. 学习能力强，能够快速测试并落地新的AI视频模型。\n加分项\n有AI剧集批量生产、LoRA训练、ComfyUI工作流搭建、Python/API、模型部署或自动化生产经验优先。\"", "cat": "内容与创作"}, {"id": "237", "title": "中高级运营专员（偏社区产品方向）", "salary": "12-16k", "location": "远程，可国内办公", "jd": "岗位JD描述\n岗位职责：\n1、参与社区产品的运营规划和迭代优化，并全盘负责产品日常维护。\n2、每日/每周监控内容发布后的核心数据。\n3、运用AI工具制作和统计基础的数据报表，能够发现数据异常。\n4、对热点敏感，知道平台用户喜欢看什么。\n5、配合其他岗位，完成活动任务或其他即时性任务。\n\n任职要求：\n1. 至少2年以上社区类、视频web类产品运营经验。\n2. 熟练使用AI工具及常用办公软件。\n3. 不抗拒看数据，能从枯燥的数据中发现问题。\n4. 需要具备良好的执行力、观察力，以及一定的抗压能力。", "cat": "运营与市场"}, {"id": "238", "title": "中高级运营（内容方向）", "salary": "15k-20k", "location": "远程，可国内办公", "jd": "简历筛选要点：优先考虑具备 Twitter（X）、Telegram、Facebook 等海外社媒运营经验，有内容矩阵搭建、用户增长、爆款内容打造经验者；电商背景暂不考虑，同时重点关注候选人对 ChatGPT、Claude、Gemini、AI Agent 等AI工具的使用经验、学习兴趣及实际应用能力。\n\n岗位职责\n1. 结合业务与用户需求，制定整体内容策略（定位、调性、矩阵），规划各阶段选题方向，并搭建可持续生产的内容体系；\n2. 能独立撰写内容，完成相关平台账号（海外平台为主）的运营，确保内容质量与账号安全；\n3. 建立全渠道分发矩阵，制定差异化运营策略，并联动内外部资源（如换量、付费推广）放大内容影响力；\n4. 通过数据分析（打开率、转化率等）反推内容优化，利用内容手段提升拉新、激活、留存等核心指标，并建立用户画像与标签体系；\n5. 关注行业热点及AI发展趋势，探索并运用AI工具提升内容生产及运营效率。\n\n任职要求\n1. 本科及以上学历，3-5年以上内容运营经验，有成功案例优先；\n2. 熟悉国内外社媒及平台规则，尤其是 Twitter（X）、Telegram、Facebook 等平台运营经验丰富者优先；\n3. 具有良好的网感，对内容传播及热点趋势具备较强敏感度，并有独立的内容见解；\n4. 具备成熟的用户洞察能力，能够以业务增长为导向，产出高传播性内容；\n5. 对AI工具有浓厚兴趣，熟悉 ChatGPT、Claude、Gemini 等主流大模型产品，有实际使用经验优先；\n6. 关注 AI Agent、自动化工作流等发展趋势，具备持续学习和应用新工具解决运营问题的能力。\n\n加分项\n* 有从0到1搭建内容体系、账号矩阵或爆款内容打造经验；\n* 有成人娱乐、泛娱乐、海外流量等相关行业经验；\n* 有AI辅助内容创作、数据分析、账号运营或自动化工作流搭建经验；\n* 熟悉AI Agent产品或有相关实践案例。", "cat": "内容与创作"}, {"id": "239", "title": "中高级运营专员（海外新媒体运营）", "salary": "13K-18K", "location": "远程，可国内办公", "jd": "岗位JD描述                                                                                                                                                                                                                                一、岗位职责：  \n  1. 负责公司视频App在海外主流社交平台（Twitter/X、TikTok、Instagram、YouTube、Facebook等）的账号运营与内容策划，实现用户引流与品牌曝光；\n  2. 根据各平台算法机制、内容调性及用户画像，制定差异化运营策略与内容分发方案；                                         \n  3. 策划并执行日常内容排期，包括图文、短视频、话题互动、社群运营等多种形式，持续提升账号活跃度与粉丝增长；\n  4. 紧跟海外社交平台热点趋势，快速策划借势内容，提升内容传播力与互动率；                                               \n  5. 搭建并维护各平台数据监控体系，定期输出运营数据报告（曝光、互动、导流转化等），基于数据持续优化运营策略；           \n  6. 对接内部内容创作、设计、产品团队，协调资源推动项目落地，确保内容产出质量与效率；                                                 \n   \n二、任职要求：                                                                                                        \n  1. 本科及以上学历，市场营销、新闻传播、新媒体、数字营销等相关专业优先，三年以上新媒体运营经验；                       \n  2. 熟悉Twitter/X、TikTok、Instagram、YouTube、Facebook等海外主流平台的运营规则、推荐算法及内容生态；\n  3. 有明确的导流/拉新成功案例，具备从内容到转化的全链路思维；                                                          \n  4. 具备较强的内容策划与文案撰写能力，对短视频及社交媒体内容有敏锐的网感；\n  5. 熟练使用数据分析工具，具备数据驱动运营的意识与能力；                                                               \n  6. 具备良好的跨团队沟通与项目推进能力，能独立负责多平台并行运营；                                                     \n  7.  简历请附过往运营案例或数据成果。", "cat": "运营与市场"}, {"id": "240", "title": "兼职AI短剧编剧", "salary": "一、计价口径\n以每部15集、单集2—3分钟为标准，交付内容包括故事提案、人物设定、分集大纲及完整分集剧本。\n二、价格标准\n付费试稿：400元/次\n交付3集分集大纲及1集完整剧本，按要求完成即可结算。\n1、IP改编／魔改项目：200元/集\n15集项目合计3000元。\n2、原创IP项目：400元/集\n15集项目合计6000元。\n特殊题材、紧急项目或质量要求较高的项目，可在基础价格上上浮10%—20%。\n三、结算方式\n结算：大纲通过后支付30%，完成一半剧集支付40%，全部验收后支付剩余30%。\n项目费用包含两轮合理修改；确认创作方向后因需求变化产生的大幅重写，费用另行协商。", "location": "远程，可国内办公", "jd": "一、主要工作内容\n1. 原创IP短剧开发\n 基于现有博主形象、人设及内容资产，完成人物关系、核心冲突、故事主线及系列剧情设计，开发适合持续连载和商业化的原创短剧。\n2. 热点题材改编与二次创作\n   研究热门小说、影视剧、短剧及社会热点，提炼具有传播潜力的题材和情节，在版权及平台合规范围内进行本土化、短剧化和差异化改编。\n3. 完整剧本交付\n   根据项目要求完成故事提案、人物小传、分集大纲及逐集剧本，重点强化开场钩子、矛盾升级、情绪刺激、剧情反转、付费卡点及结尾悬念。\n4. 男性向及成人向内容设计\n   熟悉华人男性用户的内容偏好，能够将爽点、情感关系及成人元素自然融入剧情，避免情节割裂、简单堆砌或低俗化表达。\n5. 配合剧本修改与项目落地\n   根据内部评审、AI制作可行性及成片数据反馈完成合理修改，与AI制作、剪辑和运营人员协作，推动剧本顺利进入制作环节。\n\n二、任职要求\n1. 必须为编剧科班出身，编剧、戏剧影视文学、电影学、广播电视编导等影视创作相关专业毕业，并接受过系统的剧本创作训练。\n2. 具备短剧、影视剧、网文的创作经验，有成熟作品、上线项目或商业化案例者优先。\n3. 具备原创开发及IP改编能力，能够独立完成从选题策划、人物设定、故事主线、分集大纲到逐集剧本的完整创作。\n4. 熟悉男性向短剧的冲突、悬念、反转、爽点及付费卡点设计，了解成人向内容创作逻辑者优先。\n5. 了解AI视频制作的基本特点，能够合理控制人物数量、场景切换、动作设计及镜头复杂度，保证剧本具备实际制作可行性。\n6. 具备稳定的兼职时间和交付能力，能够按照项目排期完成创作及修改，并及时响应项目沟通。\n7. 能够接受成人向内容题材，并严格遵守相关法律法规、版权规范、平台规则及项目保密要求。\n\n三、合作与结算方式\n1. 采用远程兼职、按项目合作的方式，不要求坐班。\n2. 首次合作需完成付费试稿，通过评审后进入正式项目。\n3. 正式合作可按集或按项目结算，具体单价根据个人经验、作品质量、项目难度及交付效率综合确定。\n4. 希望每月能够稳定承接至少1个短剧项目，交付质量优秀者可持续合作，并根据合作表现提高项目单价。\n\n四、应聘需提供\n1. 个人简历及编剧学习、从业经历介绍；\n2. 编剧相关专业、毕业院校及学历信息；\n3. 1—3份代表作品、剧本节选或上线作品链接，并注明本人负责的具体部分；\n4. 擅长的题材及内容类型；\n5. 每周可投入时间及预计月度产能；\n6. 按集或按项目的期望报价。", "cat": "内容与创作"}, {"id": "241", "title": "TG社群运营", "salary": "10k-15k", "location": "远程，可国内办公", "jd": "简历筛选要点：\n1. 是否有成熟的 Telegram 频道或社群运营经验，最好有从 0-1 搭建案例；\n2. 是否有内容平台或相关项目经验，了解用户内容偏好、社群玩法和付费习惯；\n3. 是否能提供频道规模、新增、阅读量、活跃、留存或转化等实际数据；\n4. 是否熟悉 TG 常用功能、机器人及自动化工具，并具备基本风险意识和内容判断能力。\n\n一、岗位职责\n1. 负责 Telegram 频道及社群的整体运营，包括内容发布、栏目规划、用户互动、活动策划、社群维护和数据复盘。\n2. 独立完成 TG 频道从 0-1 的搭建，包括频道定位、内容方向、更新节奏、群组配置、机器人配置、用户分层及运营流程搭建。\n3. 根据用户需求和偏好，策划适合 TG 生态的内容、话题及活动，提高频道订阅、内容浏览、用户活跃、留存和付费转化。\n4. 结合行业内容运营逻辑，把握内容尺度、用户兴趣和传播方向，持续优化内容表现和互动效果。\n5. 负责 TG 频道与群组联动，通过频道内容、社群互动、活动和用户分层提升整体运营效果。\n6. 维护社群秩序，处理广告、刷屏、争议内容、异常用户及投诉问题，控制频道和社群运营风险。\n7. 定期整理频道新增、阅读量、互动率、用户活跃、留存及转化数据，并根据数据持续优化运营策略。\n\n二、任职要求\n1. 有成熟的 Telegram 频道或社群运营经验，对 TG 生态、用户习惯、内容玩法和运营逻辑有深入理解。\n2. 有内容平台或相关项目的实际运营经验，了解用户的内容偏好、付费习惯和社群交流方式。\n3. 有独立负责 TG 频道从 0-1 搭建和运营的经验，能够提供过往案例、频道数据或实际运营成果。\n4. 对 TG 频道增长、内容运营、用户活跃、社群留存和付费转化有自己的方法和心得，而不是只会发帖、搬运内容或删除广告。\n5. 具备较强内容敏感度，能够根据用户反馈和数据判断内容方向，并持续策划有吸引力的话题和活动。\n6. 熟悉 TG 频道、群组、话题区、机器人、自动回复、权限管理和数据统计等常用功能。\n7. 能够接受行业相关内容，具备基本的风险意识、尺度判断和用户情绪处理能力。\n8. 执行力强、回复及时、有责任心，能够主动发现问题并提出解决方案。\n9. 有大型 TG 频道或万人社群运营经验、有平台/内容订阅平台/海外项目经验、有用户增长和付费转化经验者优先。\n10. 会使用 Codex、ChatGPT、Claude 等工具辅助内容生产、数据整理或运营自动化者优先。", "cat": "运营与市场"}, {"id": "242", "title": "Flutter 开发工程师", "salary": "20-30k", "location": "远程，可国内办公", "jd": "岗位职责：（优先中国籍，长期从事交易所区块链的不考虑）\n\n1.主要负责 Flutter 客户端业务开发与迭代，涵盖 App 核心页面、组件封装与模块联调；\n2.熟悉 Flutter / Dart 开发流程，参与需求评审，结合需求文档和 Figma 设计稿完成技术方案与开发落地；\n3.独立完成功能开发、联调自测、缺陷修复，保障版本按时高质量交付；\n4.负责视频相关能力开发与维护，如视频播放、短视频流、缓存下载、广告贴片、弱网/异常场景兼容等；\n5.参与会员支付、活动弹窗、社区/我的等业务模块开发与优化；\n6.对开发中发现的问题及时定位、跟踪、反馈，推动前后端协同解决；\n7.善用 AI 工具辅助代码编写、需求分析、问题排查，并对 AI 产出结果进行人工验真与落地；\n8.配合 Android / iOS 原生侧联调（MethodChannel、权限、相册、编解码能力探测等）；\n9.持续优化列表流畅度、启动性能、崩溃率与代码可维护性。\n\n任职要求：\n\n本科及以上学历，计算机或软件相关专业；\n1. 5年以上客户端开发经验，其中3年以上 Flutter 开发经验，有完整 App 上线经验者优先；\n2.熟悉 Dart / Flutter，能独立完成页面开发、状态管理、网络层与常用组件封装；\n3.熟悉 GetX / Provider 等状态管理方案；\n4.有视频/流媒体类产品开发经验者优先；\n5.有实际使用 AI 工具辅助开发工作的经验者优先；\n6.有较强的分析解决问题能力、逻辑思维能力，积极乐观，有良好的沟通、团队协作意识。\n加分项：\n\n1.有漫画/短剧/短视频/内容平台类 App 开发经验；\n2.熟悉 HLS/m3u8、视频缓存下载、播放器降级（如 H.264/H.265 切换、硬解兼容）等能力；\n3.熟悉 Android / iOS 打包发布流程，能配合排查原生侧问题；\n4.有实际使用 AI 工具辅助开发执行的经验，如生成样板代码、辅助定位问题、编写脚本等；\n5.有性能优化、崩溃治理、Code Review 意识者优先。", "cat": "技术开发"}, {"id": "243", "title": "高级内容运营", "salary": "20k-35k", "location": "远程，可国内办公", "jd": "【任职要求】（优先考虑境外办公人才，但需要是中国籍）\n\n本科及以上学历，专业不限。\n2年以上付费内容平台/泛娱乐类APP内容运营经验，有大流量内容产品经验者优先。\n需有完整的内容运营项目经历，主导过至少1个产品内容体系从搭建到稳定运营全流程。\n\n专业技能：深度理解内容生态与用户消费心理，具备独立制定内容策略、内容选品标准及审核机制的能力。\n熟悉内容生命周期管理，能主导内容分区规划、标签体系建设与内容质量持续优化。\n具备数据驱动内容决策的能力，能通过点击率、完播率、转化率等内容指标洞察用户偏好并调整策略。\n有二创内容、封面素材、推广物料的策划与审核经验，具备基本的内容审美与平台调性把控力。\n熟悉产品迭代流程，能从内容视角提出功能需求，跟进上线验收。\n熟练使用Excel/Google Sheets等数据工具；有BI看板或内容管理系统使用经验者优先。\n\n软性技能：对内容有热情，能快速理解不同产品的用户圈层与内容偏好。\n逻辑清晰，结果导向，能独立推动内容项目从策划到落地完整闭环。\n强责任心与自驱力，在多产品并行环境下能有效管理内容优先级。\n\n优先条件：有内容冷启动或内容体系从0到1搭建经验者优先；有AI工具辅助内容生产/审核经验者优先；有用户UGC/PGC内容运营成功案例者优先。\n\n───\n\n【岗位职责】\n\n主导所辖产品内容体系建设，负责内容分区规划、标签体系设计与内容选品标准制定，持续提升内容与用户需求的匹配度。\n深度把控内容质量，制定内容审核标准与上架规则，定期进行内容走查，校准产品调性，保障内容生态健康稳定。\n推动二创内容、封面素材、推广物料的持续产出与迭代，联动设计、技术资源，提升内容吸引力与点击转化。\n通过内容数据（点击率、完播率、付费转化等）深度洞察用户行为，定期输出内容分析报告，驱动内容选品与运营策略持续优化。\n策划并执行大促节点内容活动（节日专题、预购联动等），从内容角度放大活动声量，完成活动物料审核与数据复盘。\n构建并维护各产品内容需求池，推动内容相关产品功能的迭代优化，参与需求评审并完成上线前内容走查验收。\n跟踪用户付费行为与内容消费路径，参与用户分层运营，针对高价值用户设计差异化内容触达策略。\n持续关注行业内容趋势，引入优质内容资源与创新玩法，为产品内容竞争力提供持续输入。", "cat": "内容与创作"}, {"id": "244", "title": "高级产品经理", "salary": "20k-30k", "location": "远程，可国内办公", "jd": "【任职要求】（优先考虑境外办公人才，但需要是中国籍） \n本科及以上学历，985/211优先，专业不限。\n5年以上互联网C端产品经验，至少3年大流量to C产品经验（日活百万级以上优先）\n需要有一线产品正规行业完整的项目经历（在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等大厂有完整项目经历者优先），不要近几年有bc行业经验的\n专业技能：完整主导过至少1-2个现象级功能或从0到1项目，有显著数据提升案例。\n深刻理解内容生态、推荐算法、社区玩法、会员/付费体系、商业化变现等C端核心逻辑。\n熟练使用Axure、Figma等原型工具，精通Tableau、PowerBI、Excel等数据分析工具，能独立完成PRD撰写与数据埋点方案。\n熟练主导A/B测试、用户调研、增长实验，具备从数据洞察到策略落地的闭环能力。\n优秀的项目管理、需求优先级判断与跨部门推动能力。\n软性技能：优秀的线上沟通与协作能力，完全适应全远程工作模式。\n极强的逻辑思维、用户同理心与结果导向，能在不确定性中快速决策。\n抗压能力强，拥有强烈的责任心与自驱力。\n远程工作要求：稳定高速网络与独立安静的办公环境，能适应跨时区会议。\n熟练使用Lark（飞书）、Zoom等主流远程协作工具。\n优先条件:拥有日活百万级以上优先；在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等大厂有完整项目经历者优先；具备团队管理或指导经验。\n\n岗位职责:\n负责公司产品规划、需求挖掘、功能设计与全生命周期管理。\n深度洞察用户需求与行业趋势，结合数据分析与用户调研，主导从0到1或从1到100的核心功能迭代，覆盖内容推荐、会员体系、互动社区、商业化等模块。\n制定清晰的产品目标与核心指标（DAU、留存、时长、付费率、ARPU、GMV等），通过策略设计与快速试验持续推动指标增长。\n协调产品、设计、研发、运营、商务等团队资源，推动产品高效上线并实现预期目标。\n参与公司级产品战略制定，具备跨业务线资源整合与推动能力。", "cat": "产品与管理"}, {"id": "245", "title": "高级产品经理（增长方向）", "salary": "20k-30k", "location": "远程，可国内办公", "jd": "【岗位职责】\n\n1. 负责免费视频 App 整体运营策略制定与落地**\n（1）围绕用户增长、活跃、留存、转化及商业化目标，制定以**产品功能驱动**的阶段性运营规划并推动执行。\n（2）负责平台级内容运营、用户运营、活动运营、渠道运营等综合运营工作的**产品化落地**，通过机制与工具提升产品整体用户规模和活跃度。\n（3）对 DAU、MAU、次日留存、7日留存、30日留存、人均观看时长、播放转化率等核心指标负责。\n\n2. 负责全平台获客链路与获客矩阵建设\n（1）搭建免费视频 App 的用户获客链路及获客矩阵，主导 **Deeplink（深度链接）**、**智能邀请码**及**分享回流**等获客产品机制的设计，拓展站内外获客渠道。\n（2）制定渠道投放、自然增长、裂变增长、用户召回等多维度获客策略，将增长方法论固化为**后台可配置的自动化工具**，持续优化用户获取成本与转化效率。\n（3）基于 AARRR 用户增长模型，系统推进拉新、激活、留存、转化、复购/召回等运营策略的产品化落地。\n\n3. 负责数据分析与增长模型优化**\n（1）精通流量运营全链路，负责搭建增长数据看板与预警体系**，通过漏斗分析、留存分析、转化分析，敏锐定位业务问题并提出优化方案。\n（2）主导 A/B 测试需求，从文案、交互路径到算法策略分层，以数据结论驱动产品迭代。\n（3）对 DAU/MAU、留存率、ROI、LTV、ARPU、播放完成率、点击率、转化率等关键指标有极强敏感度和责任心。\n（4）通过数据看板、埋点分析、A/B 测试等方式，持续监控拉新、留存、活跃、转化等关键指标，及时发现问题并推动产品、内容、渠道策略优化。\n\n4. 负责产品优化与迭代规划**\n（1）深入分析用户使用路径和内容消费行为（如播放完成率、退出节点），识别产品在首页推荐、频道页、播放页、搜索、收藏、追更、推送、互动等环节的优化机会。\n（2）基于用户反馈、数据表现和业务目标，输出产品优化建议，推动产品需求立项、设计、研发、上线和复盘。\n（3）参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设，抽象通用组件与模块，提升运营效率。\n（4）负责阶段性产品迭代规划，推动产品体验、内容分发效率和用户留存能力持续提升。\n\n5. 负责用户矩阵与社群矩阵运营**\n（1）负责社媒矩阵及社群矩阵的整体产品化布局，包括账号体系规划、内容策略制定、渠道联动、用户分层及转化路径设计，打通公域引流与私域沉淀的产品闭环。\n（2）设计精准的**沉睡用户唤醒机制**与**流失预警模型**，通过 Push、短信及邮件等触达通道的产品化配置，提升用户粘性和回访频次。\n（3）建设**用户标签系统（CDP）**与**分层运营中台**，针对新用户、活跃用户、沉默用户、流失用户制定差异化产品策略。\n\n6. 负责活动运营与内容运营\n（1）抽象通用活动组件（如签到、抽奖、集卡、限时任务），搭建**低门槛活动配置后台，赋能运营团队快速上线节日活动、专题活动、召回活动、用户激励活动等重点项目。\n（2）结合热点、内容资源、用户兴趣和平台目标，通过活动玩法创新与推荐策略优化，提升活动参与率、内容曝光效率、用户活跃和留存表现。\n（3）负责活动方案设计、资源协调、上线执行、数据跟踪和复盘优化，建立标准化的活动复盘数据看板。\n\n7. 负责跨部门协作与项目推进\n（1）协同产品、研发、设计、算法、内容、渠道等团队推进重点项目及运营需求落地。\n（2）建立高效协同机制，保障项目按照运营目标和业务节奏推进。\n（3）关注行业趋势、竞品动态（含海外竞品）及新型增长方式，持续沉淀运营方法论，支持业务长期增长。\n\n\n【任职要求】\n\n1、本科及以上学历，3 年以上互联网产品运营、用户运营、增长运营、内容运营或平台运营经验。\n\n2、有视频、短视频、内容平台、社区、工具类 App、泛娱乐平台运营经验者优先，有从 0 到 1 搭建增长中台或运营后台者优先。\n\n3、熟悉 AARRR 用户增长模型，理解拉新、激活、留存、转化、召回的完整运营逻辑，并能将其转化为产品解决方案。\n\n4、具备极强数据分析能力，能够通过数据发现问题、拆解问题并推动解决。精通 Excel、数据看板、BI 工具，有 SQL、埋点分析、A/B 测试经验者优先。\n\n5、熟悉 DAU、MAU、留存率、LTV、ARPU、ROI、转化率、播放完成率等核心指标，并能围绕指标制定运营策略。\n\n6、具备产品思维，能够基于用户路径和数据结果提出产品优化及迭代建议，有参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设经验者优先。\n\n7、具备较强项目管理能力，能独立完成策略制定、项目推进、跨部门协作和结果复盘。\n\n8、目标感强，结果导向，对 DAU、留存、活跃、转化等核心指标有高度责任感与担当。\n\n\n 【加分项】\n\n1、有海外 Google Play / App Store 应用商店运营优化（ASO）经验。\n\n2、熟悉海外社交平台（如 TikTok、Instagram、YouTube）的引流产品机制。\n\n3、有自动化营销工具（MA）或用户分群工具（如 GrowingIO / 神策）的实际使用经验。", "cat": "产品与管理"}, {"id": "246", "title": "中高级UI设计师", "salary": "10k-30k", "location": "远程，可国内办公", "jd": "【岗位职责】 （优先考虑境外办公人才，但需要是中国籍）不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n\n负责公司相关产品（Web/H5/App等）的整体UI界面设计，熟练使用Figma等设计工具，主导产品视觉风格和规范的制定。\n根据产品调性，完成icon、logo、水印、启动页、落地页等产品上线前所需物料，包括但不限于静态图、动态图、MG动画；根据运营需求设计活动banner、弹窗等，覆盖节日活动、补间活动、社区日常推荐活动等场景。\n具备二次元视觉风格设计能力，能够产出符合二次元审美的界面、角色、插画及运营物料，理解二次元用户圈层喜好与视觉偏好。\n利用Make、Stitch等AIGC工具完成从构想到Figma成品交付，了解各类大模型用途及ComfyUI工作流搭建与节点使用。\n\n【任职要求】\n\n本科及以上学历，美术、视觉传达、计算机学等相关专业优先；\n5年以上UI设计及平面设计经验（两者均需具备）；\n专业技能：Figma、Photoshop、Illustrator、Adobe Effects、ComfyUI、Claude；\n有二次元风格设计作品集，优先考虑有动漫、游戏、虚拟IP等相关项目经验；\n优先考虑境外办公人才（中国籍）；\n近期有博彩、棋牌、区块链相关背景者不予考虑。\n\n【加分项】\n\n会使用Claude与Figma进行交互，可反推Frame文件生成；会用Make进行低保真生成，会用Stitch进行概念设计；\n会使用Blender、C4D等三维软件；\n有前端经验，会Python；\n深度理解ComfyUI各节点含义，能自写节点并搭建复杂工作流；\n有二次元IP设计、虚拟形象设计或Live2D相关经验者优先。", "cat": "内容与创作"}, {"id": "247", "title": "中高级内容运营专员", "salary": "10K-35K", "location": "远程，可国内办公", "jd": "岗位定位，（优先考虑境外办公人才，但需要是中国籍））负责成人内容业务方向的内容数据增长与SEO优化，围绕成人视频、图片、文章等内容的自然流量增长、内容质量提升和站点表现，推动从内容策划、生产到页面优化、流量转化的全链路工作\n\n岗位职责\n• 根据业务目标，负责成人内容方向的内容增长规划、SEO优化执行及结果跟踪，聚焦高转化成人关键词的流量获取\n• 负责成人关键词处理（长尾高搜词）、内容规划（标题/标签/描述）、页面SEO优化及站内调整，持续提升收录率、关键词覆盖率和自然搜索流量\n• 定期跟踪核心数据（收录量、关键词排名、自然流量、跳出率、停留时长、转化表现），发现问题并快速推动优化迭代\n• 熟练结合AI工具完成成人关键词挖掘、内容生成/改写、标题与Meta优化、批量图片/视频描述提效等工作\n• 与内容制作、技术开发、推广团队协同，推动成人内容优化策略高效落地，确保站点在搜索引擎中的曝光与竞争力\n• \n任职要求\n• 大专及以上学历，3以上年内容运营/成人内容型站点相关经验\n• 熟悉Google等搜索引擎机制，掌握成人行业关键词研究、内容SEO优化、自然流量增长的核心逻辑（熟悉成人长尾词、高意图搜索词优先）\n• 熟练使用GSC、GA等工具，\n• 对成人内容敏感度高，具备较强的数据分析能力，能基于流量、留存、转化数据发现问题并提出针对性优化方案\n• 执行力强，有强烈的结果导向意识，能独立推动成人内容项目落地并承担业绩结果\n• \n加分项\n• 有成人内容网站、成人资讯站、聚合站、多站点运营经验\n• 有成人新站从0到1起盘、历史内容批量优化、专题页/落地页搭建的成功案例\n• 熟悉AI辅助成人内容生产（剧本生成、标题党优化、标签系统、批量描述生成等）和规模化优化经验\n• 具有SEO优化及站内调整经验，持续提升收录率、关键词覆盖和自然搜索流量", "cat": "内容与创作"}, {"id": "248", "title": "高级运营专员", "salary": "20K-35K", "location": "远程，可国内办公", "jd": "岗位定位（优先考虑境外办公人才，但需要是中国籍）\n负责整体用户增长方向的策略制定与落地，通过网站优化、内容增长策略、SEO体系搭建，系统性提升站点用户规模与自然流量。该岗位需具备跨站点/跨模块统筹能力，能够独立搭建增长体系并带领团队实现阶段性增长目标。\n\n岗位职责\n\n• 负责用户增长方向的整体策略规划，通过网站优化、内容增长、SEO体系建设持续提升站点用户规模\n• 统筹多个内容/SEO增长模块，制定阶段性目标并推动团队落地，对整体增长结果负责\n• 建立关键词体系、内容矩阵规划及专题页搭建策略，系统性提升站点收录与自然流量\n• 主导竞品分析与用户需求洞察，结合搜索引擎规则变化，持续迭代增长策略\n• 建立核心数据监控体系，包括收录、关键词排名、自然流量、用户留存等，驱动持续优化\n• 推动AI工具在内容生产、流程自动化、数据分析中的规模化应用，提升团队整体效率\n• 与产品、技术、运营等团队深度协同，推动站点技术SEO优化与增长策略的系统性落地\n• 负责团队培养与方法论沉淀，打造可复制的内容增长与SEO增长能力\n\n任职要求\n\n• 本科及以上，5年以上内容运营/SEO/用户增长相关经验，有团队管理经验优先\n• 具备系统性的用户增长思维，能通过网站优化、内容策略、SEO体系实现用户规模提升\n• 熟悉Google等搜索引擎核心算法逻辑，有成功的自然流量增长项目经验\n• 熟练使用GSC、GA、Ahrefs、SEMrush等工具，具备较强数据分析与策略制定能力\n• 有多站点/跨模块统筹经验，具备较强项目推进与跨团队协调能力\n• 结果导向，能在复杂环境下推动事项落地并持续优化\n\n加分项\n\n• 有内容型网站、聚合站、资讯站从0到1起盘或规模化增长经验\n• 主导过SEO体系或内容增长体系搭建，有可量化的增长结果\n• 有AI工具规模化落地经验，能推动团队效率系统性提升\n• 具备一定的产品思维，能参与站点功能优化与用户体验改进", "cat": "运营与市场"}, {"id": "249", "title": "高级SEO优化", "salary": "20k-25k", "location": "远程，可国内办公", "jd": "【岗位定位】（优先考虑境外办公人才，但需要是中国籍） 需要纯内容型站点（资源、视频等）的高级SEO优化，不要偏向官网品牌类，电商不考虑\n负责内容型站点、APP及社媒平台的全链路纯白帽SEO策略规划、落地与迭代，结合AI工具和搜索趋势，通过高质量内容优化与技术提升驱动自然流量、用户留存及业务增长。\n【岗位职责】\n根据公司业务目标，主导制定并执行纯白帽SEO中长期优化策略，包括关键词体系构建、搜索意图深度分析、内容规划与专题权威建设。\n负责站内技术与内容优化：提升Core Web Vitals、页面加载速度、结构化数据实施、内链架构优化、URL规范化、标题/元描述/H标签优化，以及内容布局与E-E-A-T信号强化。\n规划并主导站外高质量外链与品牌曝光建设（客座博客、行业合作、媒体资源、PR等），严格遵守搜索引擎规则，杜绝任何黑帽/灰帽操作。\n建立SEO效果监控体系，定期分析核心指标（收录量、排名、自然流量、用户行为、停留时长、转化率等），输出专业洞察报告，并据此驱动策略迭代与业务决策支持。\n与内容创作、产品、技术、市场及社媒团队紧密协作，主导SEO最佳实践在内容生产、分发及多平台落地，推动跨部门协同效率提升。\n持续跟踪搜索引擎算法更新及AI搜索发展趋势（GEO/AEO等），评估对内容平台的影响，不断优化与创新SEO方法论，保持团队优化能力的领先性与合规性。\n\n【任职要求】\n本科及以上学历，新闻传播、市场营销、计算机、电子商务等相关专业优先。\n5年以上内容型网站、APP或平台SEO实操经验，有中大型内容站点或多平台SEO成功案例（自然流量显著增长、用户 engagement 改善等）优先。\n深入理解Google、Bing等搜索引擎工作原理，精通纯白帽SEO全链路策略（关键词体系、内容架构、网站结构优化、高质量外链建设等），具备独立主导整站或多平台优化的能力。\n熟练掌握并能高效运用主流SEO工具（Ahrefs、SEMrush、Google Analytics、Google Search Console、Screaming Frog等），能独立完成深度站点审计、竞争分析与数据建模。\n熟悉HTML、CSS及基础JavaScript，能清晰指导技术团队落地复杂优化需求。\n熟练运用AI工具（ChatGPT、Claude、Perplexity等）辅助高级关键词研究、内容策略规划与SEO决策制定。\n优秀的数据分析与战略思维能力，能从数据中提炼洞察，快速迭代优化策略并影响业务方向。\n\n【加分项】\n有内容型网站、APP或社媒平台SEO项目主导经验；\n具备系统化内容SEO体系建设与管理经验（内容日历、专题集群、内容质量评估体系等）；\n了解并有实践经验的AI搜索优化（Generative Engine Optimization / Answer Engine Optimization，简称GEO/AEO）；\n有成功驱动内容平台流量与用户增长的量化案例，或带领/指导过SEO相关团队/项目。", "cat": "运营与市场"}, {"id": "250", "title": "中高级运营专员（综合类方向）", "salary": "10K-35K", "location": "远程，可国内办公", "jd": "岗位职责  （优先考虑境外办公人才，但需要是中国籍）如果简历中没有提到过留存，次留，用户增长，日活这样的关键词，不考虑\n1、负责免费视频 App 整体运营策略制定与落地\n（1）围绕用户增长、活跃、留存、转化及商业化目标，制定阶段性运营规划并推动执行。\n（2）负责平台级内容运营、用户运营、活动运营、渠道运营等综合运营工作，提升产品整体用户规模和活跃度。\n（3）对 DAU、MAU、次日留存、7日留存、30日留存、人均观看时长、播放转化率等核心指标负责。\n2、负责全平台获客链路与获客矩阵建设\n（1）搭建免费视频 App 的用户获客链路及获客矩阵，拓展站内外获客渠道。\n（2）制定渠道投放、自然增长、裂变增长、用户召回等多维度获客策略，持续优化用户获取成本与转化效率。\n（3）基于 AARRR 用户增长模型，系统推进拉新、激活、留存、转化、复购 / 召回等运营策略落地。\n3、负责数据分析与增长模型优化\n（1）精通流量运营全链路，能够围绕用户增长模型、漏斗分析、留存分析、转化分析，发现业务问题并提出优化方案。\n（2）具备项目管理能力，能制定阶段性运营目标、拆解 KPI，并推动执行落地。\n（3）对 DAU / MAU、留存率、ROI、LTV、ARPU、播放完成率、点击率、转化率等关键指标有较强敏感度和责任心。\n（4）通过数据看板、埋点分析、A/B 测试等方式，持续监控拉新、留存、活跃、转化等关键指标，及时发现问题并推动产品、内容、渠道策略优化。\n4、负责产品优化与迭代规划\n（1）深入分析用户使用路径和内容消费行为，识别产品在首页推荐、频道页、播放页、搜索、收藏、追更、推送、互动等环节的优化机会。\n（2）基于用户反馈、数据表现和业务目标，输出产品优化建议，推动产品需求立项、设计、研发、上线和复盘。\n（3）参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设，提升运营效率。\n（4）负责阶段性产品迭代规划，推动产品体验、内容分发效率和用户留存能力持续提升。\n5、负责用户矩阵与社群矩阵运营\n（1）负责社媒矩阵及社群矩阵的整体布局与运营，包括账号体系规划、内容策略制定、渠道联动、用户分层及转化路径设计。\n（2）制定用户召回、活跃提升、会员 / 重点用户维护等策略，提升用户粘性和回访频次。\n（3）建立用户分层运营体系，针对新用户、活跃用户、沉默用户、流失用户制定差异化运营策略。\n6、负责活动运营与内容运营\n（1）策划并推动节日活动、专题活动、召回活动、用户激励活动等重点项目落地。\n（2）结合热点、内容资源、用户兴趣和平台目标，提升活动参与率、内容曝光效率、用户活跃和留存表现。\n（3）负责活动方案设计、资源协调、上线执行、数据跟踪和复盘优化。\n7、负责跨部门协作与项目推进\n（1）协同产品、研发、设计、算法、内容、渠道等团队推进重点项目及运营需求落地。\n（2）建立高效协同机制，保障项目按照运营目标和业务节奏推进。\n（3）关注行业趋势、竞品动态及新型增长方式，持续沉淀运营方法论，支持业务长期增长。\n任职要求\n1、本科及以上学历，3 年以上互联网产品运营、用户运营、增长运营、内容运营或平台运营经验。\n2、有视频、短视频、内容平台、社区、工具类 App、泛娱乐平台运营经验者优先。\n3、熟悉 AARRR 用户增长模型，理解拉新、激活、留存、转化、召回的完整运营逻辑。\n4、具备较强数据分析能力，能够通过数据发现问题、拆解问题并推动解决。\n5、熟悉 DAU、MAU、留存率、LTV、ARPU、ROI、转化率、播放完成率等核心指标，并能围绕指标制定运营策略。\n6、熟练使用 Excel、数据看板、BI 工具，有 SQL、埋点分析、A/B 测试经验者优先。\n7、具备产品思维，能够基于用户路径和数据结果提出产品优化及迭代建议。\n8、具备较强项目管理能力，能独立完成策略制定、项目推进、跨部门协作和结果复盘。\n9、目标感强，结果导向，对 DAU、留存、活跃、转化等核心指标有责任心。", "cat": "运营与市场"}, {"id": "251", "title": "中高级运营专员（二次元方向）", "salary": "10K-35K", "location": "远程，可国内办公", "jd": "岗位职责（优先考虑境外办公人才，但需要是中国籍）\n1、负责免费视频 App 二次元垂类运营策略制定与落地\n（1）负责动漫、番剧、国创、漫画改编、游戏改编、虚拟偶像、ACG 社区文化等二次元内容方向的运营规划。\n（2）围绕二次元用户增长、活跃、留存、内容消费和互动目标，制定阶段性运营方案并推动执行。\n（3）对二次元频道 DAU、垂类用户留存、追番转化率、播放完成率、互动率、人均观看时长等指标负责。\n2、负责二次元用户增长与获客矩阵建设\n（1）搭建二次元用户获客链路及获客矩阵，拓展站内推荐、社媒平台、社群、内容 IP、话题热点等多类获客渠道。\n（2）基于 AARRR 模型制定二次元用户拉新、激活、留存、召回和转化策略。\n（3）结合新番上线、热门 IP、角色话题、声优热点、漫展节点、游戏联动等机会，提升用户新增和回访。\n3、负责二次元用户数据分析与留存优化\n（1）建立二次元垂类运营数据分析体系，持续监控 DAU、MAU、次日留存、7日留存、30日留存、追番率、播放完成率、互动率等核心指标。\n（2）通过漏斗分析、留存分析、用户分层分析、内容消费分析，识别用户流失节点和增长机会。\n（3）针对新用户、追番用户、活跃用户、沉默用户、流失用户制定差异化运营策略。\n（4）对关键指标变化保持敏感，能够快速定位问题并推动内容、产品、推荐、渠道等环节优化。\n4、负责二次元产品优化与迭代规划\n（1）结合二次元用户需求，推动追番提醒、番剧日历、角色标签、兴趣订阅、弹幕互动、评论氛围、榜单机制、内容推荐等功能优化。\n（2）基于用户行为数据、社群反馈和竞品分析，输出二次元频道产品优化建议。\n（3）参与产品需求讨论、功能验收、上线数据跟踪和复盘，推动频道体验和用户留存持续提升。\n（4）协同产品、算法、内容、设计、研发团队，提升二次元内容分发效率和用户互动体验。\n5、负责二次元社媒矩阵与社群矩阵运营\n（1）负责二次元社媒账号及社群矩阵布局，包括账号定位、内容策略、话题运营、用户沉淀和转化路径设计。\n（2）熟悉 B 站、小红书、微博、抖音、贴吧、TapTap、NGA、QQ群 / 微信群等二次元用户活跃平台。\n（3）通过社媒内容、话题互动、社群活动、用户共创等方式提升二次元用户活跃和留存。\n6、负责二次元活动运营与 IP 运营\n（1）策划新番季、暑期档、周年庆、角色生日、追番挑战、投票打榜、弹幕互动、IP 联动等活动。\n（2）结合热门番剧、国创、游戏、漫展、声优、角色、CP 等内容热点，提升频道活跃度和用户粘性。\n（3）负责活动从方案设计、资源协调、上线执行到数据复盘的完整闭环。\n7、负责行业趋势与竞品研究\n（1）关注二次元行业趋势、竞品动态、新番周期、社区热点及新型增长方式。\n（2）持续沉淀二次元用户运营、内容运营和社群增长方法论，支持业务长期增长。\n任职要求\n1、本科及以上学历，3 年以上互联网运营经验，有视频平台、动漫平台、社区、游戏、泛娱乐、内容平台经验优先。\n2、深度了解二次元文化，熟悉番剧、国创、漫画、虚拟偶像、游戏改编、ACG 社区等内容生态。\n3、熟悉二次元用户行为，理解追番、补番、弹幕、评论、角色互动、IP 情感连接等用户需求。\n4、熟悉 AARRR 增长模型，能够围绕拉新、激活、留存、转化、召回设计运营策略。\n5、具备较强数据分析能力，能够对 DAU、留存、追番率、播放完成率、互动率、转化率等指标负责。\n6、具备漏斗分析、留存分析、用户分层、内容消费分析能力，能够通过数据定位问题并推动优化。\n7、具备产品优化意识，能够从二次元用户体验出发，提出频道、功能、互动机制和推荐策略优化建议。\n8、熟悉社媒矩阵、社群矩阵运营，有二次元社群、账号、活动或 IP 运营经验者优先。\n9、具备较强项目管理能力，能独立完成方案制定、跨部门协作、上线执行和数据复盘。\n10、网感好，对热点敏感，目标感强，能承担 DAU、留存、活跃、转化等核心指标压力。", "cat": "运营与市场"}, {"id": "252", "title": "中高级运营专员", "salary": "10K-35K", "location": "远程，可国内办公", "jd": "岗位JD描述：岗位职责  不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n岗位定位：中级运营专员是业务增长的核心执行者与推动者，能够独立负责产品或业务模块运营工作，通过数据分析、活动运营、用户运营及产品优化，推动新增、留存、活跃、转化等核心指标持续提升，主动发现业务问题、提出解决方案并推动落地，对产品经营结果负责，以及跨部门沟通保障项目高效推进。\n岗位职责\n\n用户运营与社区运营\n负责用户分层及生命周期运营；\n推动社区内容建设与用户互动氛围打造；\n收集用户反馈并推动问题解决；\n提升用户留存、活跃及复购能力。\n\n独立策划并执行活动方案\n推动会员体系、充值活动、节日活动等运营项目；\n优化用户转化路径，提高付费转化率；\n对活动效果进行分析与复盘。\n\n数据分析与业务诊断\n监控新增、留存、充值、活跃等核心数据；\n输出专项分析报告；\n分析业务异常并提出解决方案；\n跟踪优化结果并持续复盘\n\n产品运营管理\n负责产品日常运营及数据监控；\n跟进产品版本迭代、功能测试及上线验收；\n定期开展产品走查，发现问题并提出优化建议；\n推动产品需求、活动需求及优化方案落地。\n\n任职要求\n2-3年以上互联网运营经验；\n具备产品运营、用户运营、活动运营相关经验；\n熟悉互联网产品运营逻辑及增长模型；\n能适应快节奏业务环境，具备较强执行力与责任心。\n熟悉产品运营全流程；\n能独立完成新增、留存、活跃、转化等数据分析，能根据数据发现问题并制定优化方案；\n能独立策划、执行及复盘运营活动； 熟悉会员体系、充值活动、节日活动等运营模式；\n了解用户生命周期管理；能进行用户分层运营；具备社区运营、内容运营经验优先；能通过运营手段提升留存与活跃。", "cat": "运营与市场"}, {"id": "253", "title": "AI内容创作 / AI漫剧制作", "salary": "30-50K", "location": "远程，可国内办公", "jd": "岗位JD描述\n\n岗位定位\n负责 AI 漫剧项目的内容制作与生产落地，围绕短剧、漫画、网文等内容方向，使用 AI 工具完成脚本拆解、角色设定、分镜设计、画面生成、视频合成与成片优化。岗位核心目标是提升 AI 漫剧内容产能与质量，推动 AI 漫剧项目从创意、制作到上线的全流程落地。\n\n岗位职责\n1.内容策划与脚本拆解：根据项目方向或已有剧本，完成剧情理解、人物关系梳理、情节拆分、分镜规划与节奏设计；\n2.AI漫剧制作：使用 AI 绘画、AI 视频、AI 配音、剪辑等工具，完成角色形象、场景画面、关键帧、视频片段及成片制作；\n3.角色与画风统一：负责人物设定、角色一致性、场景风格、画面质感等内容把控，确保作品整体风格统一；\n4.分镜与镜头设计：根据剧情内容设计人物表情、动作、构图、镜头衔接与画面氛围，提升作品观看体验；\n5.视频合成与后期包装：配合完成剪辑、字幕、配音、音效、BGM、封面等后期制作，保障成片完整度；\n6.内容优化与复盘：根据播放数据、完播率、互动反馈等内容表现，持续优化剧情节奏、画面风格和制作流程；\n7.AI工具应用：持续探索并使用 AI 工具提升内容生产效率，包括但不限于 Midjourney、Stable Diffusion、即梦、可灵、Runway、Pika、ComfyUI、ChatGPT、剪映等。\n\n任职要求\n1.大专及以上学历，有 AI 内容创作、短视频、漫画、短剧、动画、影视剪辑、编导、网文改编等相关经验者优先；\n2.熟悉 AI 绘画、AI 视频或 AI 内容生产工具，具备实际操作经验，有 AI 漫剧 / AI 视频 / AI 漫画作品者优先；\n3.具备良好的内容审美、镜头感和故事理解能力，能够判断画面质量、剧情节奏和人物表现是否符合内容需求；\n4.熟悉短视频平台内容逻辑，了解抖音、快手、小红书、视频号、B站等平台内容风格者优先；\n5.具备较强的学习能力和执行力，能快速掌握新工具、新流程，适应 AI 内容生产的快速迭代；\n6.工作细致，有耐心，能接受多轮修改和持续优化，具备良好的沟通协作能力。\n\n加分项\n1.有 AI 漫剧、AI 短剧、AI 动画、AI 漫画等完整作品案例；\n2.熟悉男频、女频、重生、逆袭、甜宠、悬疑、玄幻、都市、爽文等网文题材；\n3.会写分镜脚本、AI 提示词 Prompt、角色设定表、世界观设定；\n4.熟悉人物一致性控制、LoRA、ControlNet、ComfyUI 工作流等技术或工具；\n5.有短视频账号运营经验，了解爆款内容节奏和用户观看习惯；\n6.有从 0 到 1 搭建 AI 内容生产流程或提升内容制作效率的经验。", "cat": "内容与创作"}, {"id": "254", "title": "AI短剧制作", "salary": "20-40K", "location": "远程，可国内办公", "jd": "岗位JD描述\n\n岗位定位\n\n面向有传统影视内容制作基础（编导、剪辑、AE动效等方向），希望系统进入AI漫剧内容制作领域的候选人。岗位核心目标是借助候选人已有的内容审美、镜头感和制作经验，结合AI工具快速完成AI漫剧的制作落地，在实战中建立完整的AI内容生产能力。\n\n岗位职责\n\n一、内容策划与脚本拆解\n根据项目方向或已有剧本，完成剧情理解、人物关系梳理、情节拆分、分镜规划与节奏设计，保障内容节奏符合短剧用户观看习惯。\n\n二、AI漫剧内容制作\n使用AI绘画、AI视频、AI配音、剪辑等工具，完成角色形象、场景画面、关键帧、视频片段及成片制作，逐步建立完整的AI内容生产能力。\n\n三、角色与画风统一\n负责人物设定、角色一致性、场景风格、画面质感等内容把控，确保作品整体风格统一，降低崩脸、穿模等常见质量问题。\n\n四、分镜与镜头设计\n根据剧情内容设计人物表情、动作、构图、镜头衔接与画面氛围，将传统编导/剪辑的镜头语言迁移至AI漫剧制作场景。\n\n五、视频合成与后期包装\n配合完成剪辑、字幕、配音、音效、BGM、封面等后期制作，保障成片完整度与交付质量。\n\n六、工具探索与效率提升\n持续学习并应用AI工具提升内容生产效率，包括但不限于Midjourney、即梦、可灵、Runway、ComfyUI、剪映等，积累可复用的提示词模板和生产SOP。\n\n\n任职要求\n\n1.大专及以上学历，有编导、AE动效、短视频剪辑、影视制作、动画、漫画等相关从业经验，能提供作品案例。\n2.对AI内容创作有浓厚兴趣，已自主尝试过AI绘画、AI视频等工具，具备基础操作经验，或有强烈学习意愿。\n3.具备良好的内容审美、镜头感和故事理解能力，能判断画面质量、剧情节奏和人物表现是否符合内容需求。\n4.学习能力强，能快速掌握新工具和新流程，适应AI内容生产的快速迭代节奏。\n5.工作细致，有耐心，能接受多轮修改和持续优化，具备良好的沟通协作能力。\n6.有意愿长期深耕AI漫剧制作方向，能接受从执行层做起、在实战中成长。\n\n加分项\n\n1.有AI漫剧、AI短剧、AI动画、AI漫画等完整作品案例，哪怕是个人练手作品也欢迎提供。\n2.熟悉男频、女频、重生、逆袭、甜宠、悬疑、玄幻、都市、爽文等网文题材，了解短剧用户偏好。\n3.会写分镜脚本或具备AI提示词Prompt的基础认知。\n4.有短视频账号运营经验，了解爆款内容节奏和用户观看习惯。\n5.熟悉AE、PR、达芬奇等专业后期软件，能将传统剪辑能力快速迁移至AI内容制作流程。\n6.有成人内容方向的内容制作或审美积累者优先。", "cat": "内容与创作"}, {"id": "255", "title": "流量组负责人", "salary": "20-35K", "location": "远程，可国内办公", "jd": "一、岗位定位\n负责新建流量组的整体搭建与管理，统筹 KOL、社媒／电报矩阵、收购号、站点 SEO 等自建流量渠道，带领团队完成从 0 到 1 的流量体系建设；对流量组整体引流规模、获客成本与渠道结构转型（降低渠道买量依赖、提升自然流量占比）负责。\n\n二、岗位职责\n团队组建与管理：搭建流量组组织架构（矩阵、KOL、内容、数据等方向），招募、培养与管理团队，制定各岗位 KPI 与考核机制；\n流量体系搭建：统筹规划 KOL 投放、社媒／电报账号矩阵、收购成熟号、站点 SEO 等多条自建流量线，推动各线从测试到放量的全流程落地；\nKOL 与渠道拓展：主导 KOL／网红资源的拓展与商务合作（优先分成模式），建立长期合作与代理网络，持续扩大渠道规模；\n矩阵运营管理：管理社媒／电报账号矩阵的养号、内容、引流与风控体系，沉淀可复制的标准化运营 SOP；\n目标管理与投放优化：制定阶段性引流目标与资源分配，监控各渠道引流量、ROI、留存等数据，持续优化投放效果与成本；\n数据分析与复盘：定期输出流量与投放分析报告，基于数据校准策略，对引流规模、获客成本、用户留存等结果负责；\n跨部门协同：与运营、产品、视觉团队协作，保障流量与产品承接、留存的衔接；\nAI 应用：推动团队运用 AI 工具批量触达资源、搭建落地页、提效渠道测试与投放流程。\n\n三、任职要求\n本科及以上学历，有 3 年以上流量／增长／投放相关经验，其中 1 年以上团队管理经验；\n具备从 0 到 1 搭建流量团队或渠道体系的经验，熟悉 KOL 投放、社媒／电报矩阵、SEO 等至少两类自建流量打法；\n熟悉主流投放与社媒平台，具备较强的数据分析能力（Excel／SQL／BI 工具），有 ROI 优化与成本管控经验；\n结果导向，具备优秀的团队管理、商务谈判、跨部门沟通与抗压能力，能适应快节奏与高不确定性的新业务；\n熟练运用 AI 工具辅助投放、资源触达与页面／功能搭建。\n\n四、加分项\n自带 KOL／网红、社媒矩阵、联盟等流量渠道资源或代理人脉，能快速启动；\n有成人／泛娱乐等行业流量运营经验；\n有成功的流量团队从 0 到 1 搭建案例（如团队规模、引流量级、获客成本降低 X%、自然流量占比提升 X%）；\n有社媒／电报账号矩阵规模化搭建与风控（抗封、养号体系）经验；\n有用 AI 搭建落地页／投放工具、提效流量测试与运营流程的经验。", "cat": "运营与市场"}, {"id": "256", "title": "品牌站运营负责人", "salary": "20-35K", "location": "远程，可国内办公", "jd": "一、岗位定位\n负责品牌站点流量方向的整体搭建与增长，独立规划并落地 2-3 个站点的建设与流量运营，通过 SEO、内容矩阵、外链与导航站合作等方式快速做大站点访问量；可根据业务规划组建并带领小团队，对站点流量规模与增长结果负责。\n\n二、岗位职责\n站点规划与搭建：独立规划 2-3 个站点的定位、架构与内容方向，推动从建站、内容填充到上线的全流程落地；\n流量增长：通过 SEO 优化、内容矩阵、外链建设、导航站合作等多种方式，快速提升站点收录、排名与访问量；\n站群与矩阵运营：搭建并运营站点矩阵（如 GEO 站群、聚合／导航站），实现多站并行、批量复制与抗风险；\n团队组建与管理：根据业务规划招募、培养并管理小团队，制定分工与考核；\n数据分析与优化：监控收录、排名、访问量、留存等数据，持续优化站点结构与内容策略；\n跨部门协同：与运营、产品、视觉团队协作，保障站点流量向产品的有效承接；\nAI 应用：运用 AI 工具提效建站、内容生产与 SEO 优化流程。\n\n三、任职要求\n本科及以上学历，有 3 年以上 SEO／站点流量／站群运营相关经验，其中有独立负责站点增长的经历；\n精通 SEO 优化（关键词、TDK、内链、聚合页等），有成功将站点访问量做大的实操案例；\n熟悉站群、聚合／导航站、外链建设等多种流量获取方式，具备从 0 到 1 搭建站点矩阵的能力；\n具备较强的数据分析能力（Excel／SQL／BI 工具），结果导向，能独当一面；\n具备团队组建与管理能力，沟通协调与抗压能力强，能适应快节奏的新业务；\n熟练运用 AI 工具辅助建站、内容生产与 SEO 流程。\n\n四、加分项\n有成人／泛娱乐等行业站点流量运营经验；\n有成功的站点矩阵从 0 到 1 搭建案例（如站点数量、访问量量级、增长速度等）；\n自带站点资源、外链资源或导航站合作人脉，能快速启动；\n有 GEO 站群、批量建站与抗封（起新站）经验；\n有用 AI 搭建站点／工具、提效 SEO 与内容生产流程的经验。", "cat": "运营与市场"}, {"id": "257", "title": "中级远程社媒运营（KOL & 内容方向）", "salary": "12-15K", "location": "远程，可国内办公", "jd": "岗位JD描述：岗位职责（不要过往行业经历只有web3的）\n负责 TG、Twitter/X、TikTok、Reddit 等海外社交媒体账号矩阵搭建与日常运营（养号、发布、引流）；\n负责短视频、图文等内容策划与制作，为矩阵和投放持续供给素材；\n负责 KOL/网红资源洽谈、投放与 ROI 优化；\n通过数据分析迭代内容与投放策略，推动海外流量到产品下载、转化闭环。\n\n任职要求：\n熟悉海外社媒平台运营、内容制作、KOL 对接及基础数据分析；具备执行力、学习能力、沟通协作能力，能适应远程协作。", "cat": "内容与创作"}, {"id": "258", "title": "社媒 / 社群运营专员（中级）", "salary": "12-15K", "location": "远程，可国内办公", "jd": "一、岗位定位\n\n负责站点内容业务方向的社媒宣发、社群运营和账号矩阵搭建，围绕 TG、推特/X、TikTok、INS、论坛、博客、问答、资源站等渠道，持续进行内容分发、账号运营和站外引流，提升站点曝光度和流量来源规模。\n岗位核心是通过多平台运营和矩阵布局，为站点带来稳定的站外流量增量，而不是偏重复杂的搜索引擎机制研究。\n\n二、岗位职责\n\n1. 根据业务目标，负责站点内容方向的社媒宣发规划、平台运营执行及结果跟踪，提升站点曝光和流量来源。\n2. 在 TG、推特/X、TikTok、INS、论坛、博客、问答、资源站等渠道进行内容分发、账号宣发和日常运营。\n3. 搭建并维护不同平台的宣发账号矩阵，制定账号定位、内容方向和发布节奏，提升账号活跃度和引流能力。\n4. 围绕站点页面、栏目页、专题页等内容，策划适合不同平台传播的分发方式，提升点击导流和站外曝光。\n5. 沉淀可重复使用的宣发渠道、投稿点、分发平台、账号资源和外链资源库，形成可持续复用的推广链路。\n6. 定期跟踪各平台核心数据，包括曝光、点击、引流量、账号增长、互动表现和转化结果，及时调整运营策略。\n7. 熟练结合AI工具进行文案改写、多平台内容适配、批量分发提效和账号矩阵管理，提升整体执行效率。\n8. 与内容、推广、技术等团队协同，确保站外流量引入和站内承接形成配合。\n\n三、任职要求\n\n1. 大专及以上学历，3年以上社媒运营、社群运营、内容分发或相关站外推广经验。\n2. 熟悉 TG、推特/X、TikTok、INS、论坛、博客、问答、资源站等平台的运营逻辑、内容分发方式和账号成长规律。\n3. 有账号矩阵搭建和多平台协同运营经验，能够独立推进账号从搭建、养号、发布到引流的完整链路。\n4. 具备较强的内容敏感度，能根据不同平台特点调整文案、标题、内容包装和发布方式。\n5. 具备较强的执行力和结果导向，能持续推进站外曝光、流量引入和渠道资源沉淀。\n6. 具备基础数据分析能力，能结合曝光、点击、引流、互动等数据判断效果并做优化调整。\n7. 熟练使用常见AI工具进行内容改写、发布提效和矩阵运营辅助。\n\n四、加分项\n\n1. 有成人内容网站、成人资讯站、聚合站、多站点宣发运营经验。\n2. 有社媒矩阵搭建、社群引流、论坛问答分发、博客投稿或资源站推广的成功案例。\n3. 有从0到1搭建宣发账号矩阵并持续做出流量结果的经验。\n4. 熟悉AI辅助内容分发、文案生成/改写、多平台适配和批量运营提效。\n5. 有较强的资源整理意识，能把有效渠道、账号、投稿点和分发平台沉淀为长期可复用资源。", "cat": "运营与市场"}, {"id": "259", "title": "SEO增长负责人（内容/媒体/视频资讯方向  年薪60–70万元 ）", "salary": "年薪60–70万元", "location": "远程，可国内办公", "jd": "岗位定位\n我们正在建设面向大众用户的内容、媒体及视频资讯平台，覆盖热点事件、娱乐资讯、人物、影视及视频内容。 \n现招聘一名SEO增长负责人，从0到1规划并搭建自然搜索增长体系。你将从业务目标出发，统筹SEO策略、站点架构、技术优化、内容增长、视频搜索和数据分析，推动产品、研发及编辑团队协同执行，对自然搜索流量、用户增长及商业结果负责。 \n这不是单纯的关键词优化或内容发布岗位。我们希望你既能制定增长策略，也能深入页面、数据和执行细节，建立可规模化、可持续、合规的SEO增长体系。 \n\n岗位职责 \n一、SEO增长策略 \n1.根据公司业务目标，制定年度及季度SEO增长策略，拆解流量、收录、关键词覆盖、用户增长及商业转化目标。 \n2.分析内容、媒体、热点资讯及视频领域的用户搜索需求、竞争格局和增长机会。 \n3.建立核心词、长尾词、热点词、人物词、事件词、影视词及视频词的关键词体系。 \n4.规划频道页、专题页、人物页、事件页、影视页、视频页、标签页及内容详情页等页面模型。 \n5.负责新站冷启动、网站权重建设及自然搜索流量规模化增长。 \n6.持续跟踪搜索引擎算法、搜索结果形态及用户搜索行为变化，及时调整增长策略。 \n二、技术SEO及产品协作 \n1.负责网站抓取、渲染、收录、索引、Canonical、robots.txt、站点地图及结构化数据等技术SEO工作。 \n2.优化网站信息架构、URL结构、内部链接、分页机制及页面模板。 \n3.针对大规模内容及视频页面制定抓取预算、索引管理和低质量页面治理方案。 \n4.推动视频结构化数据、视频站点地图、缩略图、字幕、标题及描述等视频搜索优化。 \n5.与产品及研发团队协作，推进页面性能、移动端体验、Core Web Vitals及服务端渲染等优化项目。 \n6.建立网站改版、URL迁移、页面上下线及重大版本发布的SEO评审和风险控制机制。 \n7.对网站日志、抓取数据、状态码及页面渲染结果进行分析，定位并推动解决技术问题。 \n三、内容及热点增长 \n1.制定符合用户搜索意图的选题方法、内容标准和编辑工作流程。 \n2.搭建热点发现、关键词判断、内容生产、页面聚合、更新维护及效果复盘机制。 \n3.平衡热点内容的时效增长与人物、事件、影视资料等常青内容的长期流量价值。 \n4.指导编辑团队优化标题、摘要、正文结构、图片、视频、标签及内部链接。 \n5.识别重复、薄弱、过期及低价值内容，制定更新、合并、重定向或下线策略。 \n6.推动优质内容获得媒体引用、自然外链及行业传播。 \n7.在版权、个人隐私、信息真实性和平台内容安全要求内开展SEO增长。 \n四、数据分析及增长实验 \n1.建立SEO数据看板、日常监控及周/月度复盘体系。 \n2.持续监控抓取、收录、排名、曝光、点击率、自然流量、用户留存及商业转化表现。 \n3.按页面类型、内容主题、关键词意图、用户价值和商业价值拆解SEO数据。 \n4.设计并推动页面标题、内容结构、页面模板、内链策略及视频信息等增长实验。 \n5.及时识别算法更新、流量异常、索引下降及人工处罚风险，并制定恢复方案。 \n6.评估自然搜索流量对新增用户、活跃用户、广告收入、会员收入或其他业务指标的实际贡献。 \n五、团队及项目管理 \n1.根据业务发展需要，规划SEO、内容、外链及数据相关岗位和协作资源。 \n2.建立SEO项目管理机制、执行规范、质量标准和绩效考核体系。 \n3.推动产品、研发、编辑、数据和商业化团队围绕SEO增长目标协同执行。 \n4.评估外部内容、媒体合作、数字公关及SEO服务资源的质量和投入产出。 \n5.定期向管理层汇报SEO目标进展、增长结果、业务贡献及潜在风险。 \n任职要求 \n1.5年以上SEO实战经验，有内容站、媒体站、视频站或大型资讯网站SEO经验。 \n2.有独立负责网站自然搜索增长的完整经历，能够提供真实、可验证的项目案例和增长数据。 \n3.熟悉百度和/或Google搜索机制；如负责海外业务，需要具备Google SEO实战经验。 \n4.熟悉大型内容网站的信息架构、页面模板、抓取预算、索引治理和内部链接策略。 \n5.熟悉视频页面搜索优化，理解视频结构化数据、视频站点地图、字幕和缩略图等优化方法。 \n6.熟练使用Google Search Console、GA4、百度搜索资源平台、Ahrefs、Semrush、Screaming Frog等工具。 \n7.能够阅读基础HTML、状态码、日志及前端渲染结果，并能与产品和研发团队有效沟通。 \n8.具备较强的数据分析、业务判断、项目管理和跨部门推动能力。 \n9.对搜索引擎算法变化敏感，能够快速判断流量波动原因并提出解决方案。 \n10.理解内容版权、个人隐私、信息真实性及平台内容安全要求，具备明确的合规意识。 \n\n加分项 \n1.有百万级以上月自然搜索流量项目经验。 \n2.有新站从0到1、网站规模化增长或算法影响后恢复经验。 \n3.有视频搜索、Google Discover、Google News或百度资讯生态增长经验。 \n4.有人物库、事件库、影视库、视频库或大规模专题页面建设经验。 \n5.有程序化SEO、日志分析、SQL、数据产品或自动化内容工作流经验。 \n6.有SEO团队招聘、培训、项目管理及绩效管理经验。 \n7.能够证明自然搜索增长最终带来了新增用户、活跃用户、广告收入、会员收入或其他商业结果。", "cat": "内容与创作"}, {"id": "260", "title": "初/中级运营专员", "salary": "7-15K", "location": "远程，可国内办公", "jd": "岗位职责\n1、负责APP内视频内容日常运营，根据运营规范完成内容发布、审核、上下架及维护，确保内容及时上线及正常展示；\n2、负责内容包装优化，包括标题、封面、标签、简介等，不断提升内容点击率、曝光率及基础转化率；\n3、每日监控核心运营数据，输出运营日报，对播放、点击、会员转化、付费转化等指标进行分析，发现异常并及时反馈；\n4、参与平台活动运营，包括专题策划、活动配置、数据跟踪及活动复盘，持续优化活动效果；\n5、维护内容资源池，结合用户偏好及平台需求，不断丰富内容标签及素材，提高平台内容供给质量；\n6、对接产品、审核、视频等相关部门，跟进运营需求落地，推动问题解决及项目执行；\n7、完成领导安排的其他运营工作。\n任职要求\n基本要求\n大专及以上学历，专业不限；\n1年以内运营经验，应届优秀毕业生亦可；\n熟悉短视频、影视、内容平台产品，对视频行业有浓厚兴趣；\n熟练使用Excel，具备基础数据分析能力（如透视表、VLOOKUP等优先）；\n工作细心，责任心强，执行力高，能够适应重复性工作。\n优先考虑\n有视频平台、短剧平台、小说平台、直播平台、内容社区运营经验；\n有内容审核、内容运营、活动运营经验；\n有一定数据敏感度，能够发现异常数据并提出优化建议；\n熟悉用户增长、会员转化、内容推荐逻辑者优先。", "cat": "运营与市场"}, {"id": "261", "title": "初/中级运营专员", "salary": "7-15K", "location": "远程，可国内办公", "jd": "岗位定位\n\n负责内容的基础内容搜集、素材整理，根据安排的内容方向，协助完善素材池、专题池与日常更新资料，为内容编写、上架更新提供基础支持。\n\n岗位职责\n\n• 负责吃瓜、热点话题、黑料爆点等方向的日常内容线索搜集与整理\n• 关注 Telegram、Twitter（X）、抖音、小红书、微博等平台，搜集热点事件可用素材\n• 对搜集到的内容进行基础筛选、分类和整理，提炼标题、爆点、人物关系、事件脉络等基础信息\n• 负责基础素材整理，去水印、视频拼接处理等\n• 配合运营和内容需求，对热点内容进行补充搜集、持续跟进及资料更新\n• 与内容、运营等团队协同，提高内容更新效率和素材整理效率\n\n任职要求\n\n• 有内容搜集、资料整理、热点追踪相关经验者优先\n• 对热点内容、吃瓜内容有一定兴趣和敏感度，愿意长期做内容搜集与整理工作\n• 熟悉 Telegram、Twitter（X）、抖音、微博、小红书等常见平台者优先\n• 具备基础的信息搜集、筛选和整理能力，能够按照要求完成素材归类和内容提取\n• 有一定文字理解和资料归纳能力，能把零散内容整理成清晰可用的基础资料\n• 执行力较好，工作细致，能适应较快的内容更新节奏\n• 具备基本团队协作意识，能配合完成日常内容支持工作\n\n加分项\n\n• 有成人站、吃瓜站、热点资讯类网站相关内容搜集经验\n• 有素材整理、专题归纳、资料库整理经验\n• 网感较好，平时关注热点内容和平台趋势\n• 有耐心，能长期稳定做素材搜集和资料整理工作\n\n补充说明\n\n• 本岗位以基础执行和资料整理为主\n• 更看重执行力、稳定性和学习意愿\n• 业务方向和内容判断可在入职后逐步培训\"", "cat": "运营与市场"}, {"id": "262", "title": "高级/专家 AI 应用工程师（Agent Ops）", "salary": "20-40k", "location": "远程，可国内办公", "jd": "【岗位定位】（优先中国籍）\n\n负责公司内部 AI Agent 工作流提效，以及 AI 应用从产品原型、技术开发到部署上线的全流程建设。\n\n该岗位不是单一的 Agent 运维、后端开发或 AI 工具使用岗位，而是需要具备全栈开发、AI 应用落地、产品理解及线上运维能力，能够独立推动产品从 0 到 1 上线并持续迭代。\n\n【岗位职责】\n\n1. 负责公司内部 Agent、Skill 及自动化工作流的搭建与优化，推动重复性工作自动化，提升业务效率和交付质量。\n2. 根据产品原型、业务需求及用户场景，独立完成技术方案设计、前后端开发、数据库设计、接口联调、AI 能力接入及部署上线，推动产品从 0 到 1 落地。\n3. 根据不同项目需求选择合适的技术架构，完成内部管理工具、外部 Web 应用、C 端产品、B 端系统、工具型产品及其他业务应用的建设，不局限于单一项目类型或固定技术方向。\n4. 将大模型 API、Agent、RAG、工作流编排等 AI 能力应用到真实产品中，并结合业务效果持续优化模型、Prompt、流程及系统架构。\n5. 从产品和消费者角度参与需求评估，主动发现原型、功能逻辑、操作流程及用户体验中的问题，并与产品经理共同推动优化。\n6. 负责产品上线后的全生命周期管理，包括系统监控、日志分析、异常处理、性能优化、版本迭代、服务部署、扩缩容及基础设施维护。\n7. 沉淀可复用的技术组件、Agent 工作流、开发模板、部署方案及技术规范，提升后续 AI 应用的开发和交付效率。\n\n【任职要求】\n\n1. 具备扎实的全栈开发能力，能够独立处理前端、后端、数据库、接口、部署及线上故障，不局限于单一前端、后端或运维方向。\n2. 至少熟练掌握两种主流编程语言， Golang 、 Python、Java等\n3. 熟练 React、Vue、Next.js 等至少一种前端技术栈，以及 Gin、FastAPI、Spring Boot 等至少一种后端框架。\n4. 熟练 MySQL、PostgreSQL、mongodb、Redis 等常用数据存储方案，具备数据库设计、性能优化及问题排查能力。\n5. 熟练 Linux、Docker、Nginx、CI/CD、日志分析及基础监控，能够独立完成服务部署、配置管理和线上问题处理。\n6. 有大模型 API、Agent、RAG、Prompt、Skill 或 AI 工作流的实际项目经验，能够使用 Claude Code、Cursor、GitHub Copilot 等工具提升开发效率。\n7. 具备多类型项目经验，做过内部管理系统、外部应用、C 端产品、B 端平台或工具型产品中的多种项目形态，能够适应不同业务和用户场景。\n8. 具备较强的产品意识和用户视角，不仅关注功能是否开发完成，也能够判断产品逻辑、用户体验及业务价值是否符合预期。\n9. 具备较强的独立解决问题和项目落地能力，能够在需求不完全明确或技术链路复杂的情况下，主动拆解问题并推动项目上线。\n\n【核心技术方向】\n\n编程语言：Golang、Python、Java，至少熟练掌握两种\n前端开发：React、Vue、Next.js 等\n后端开发：Gin、FastAPI、Spring Boot 等\n数据存储：MySQL、PostgreSQL、mongodb、Redis\nAI 应用：Agent、Skill、RAG、大模型 API、Prompt、工作流编排\n部署运维：Linux、Docker、Nginx、CI/CD、日志分析、监控告警\nAI 开发工具：Claude Code、Cursor、GitHub Copilot 等\n\n【加分项】\n\n1. 有 AI 应用从需求分析、技术设计、开发到正式上线的完整项目经验。\n2. 有企业内部 Agent、自动化工作流或业务提效工具的落地经验，并能说明实际提效成果。\n3. 有 Kubernetes、Prometheus、Grafana、ELK、LangSmith 等生产环境使用经验。\n4. 有多项目并行交付、技术负责人或项目负责人经验。\n5. 有面向真实消费者的产品开发经验，能够关注用户体验、使用效果和业务结果。\n\n【暂不匹配】\n\n1. 仅有单一前端、后端或运维经验，缺少完整全栈交付能力。\n2. 只会调用模型 API、配置 Agent 或调整 Prompt，缺少实际应用开发经验。\n3. 缺少产品从开发、部署上线到后续维护的完整项目经历。\n4. 项目经验长期局限于交易所、区块链或重复型流水线系统，缺少多类型产品和真实用户场景经验。\n5. 习惯机械执行产品原型，缺少产品判断、用户视角和主动优化意识。", "cat": "技术开发"}, {"id": "263", "title": "中高级产品经理（AI C 端产品方向）", "salary": "15-35k", "location": "远程，可国内办公", "jd": "岗位 JD 描述\n岗位职责：\n1. 参与公司级产品战略制定，具备跨业务线、跨职能部门整合资源与推动能力。负责公司产品的整体规划、需求挖掘、功能设计与全生命周期管理，推动产品从需求定义、方案设计、研发落地到上线迭代的完整闭环。\n2. 深度洞察用户需求、行业趋势与大模型能力演进路径，结合数据分析与用户调研，主导产品从 0 到 1 落地或从 1 到 100 的核心功能迭代。\n3. 制定清晰的产品目标与核心指标，包括 DAU、留存、使用时长、付费率、ARPU、GMV、AI 调用满意度等，并持续推动核心指标增长。\n4. 负责 AI 内容生产、智能推荐、AI 助手 / Agent、互动社区、AI 创作工具、商业化变现等核心模块的产品规划与功能设计。\n5. 负责产品商业化路径设计，探索订阅、增值服务、Token 计费、内容付费等变现模式，并推动商业化指标提升。\n6. 主导功能的灰度策略、A/B 测试、用户调研和增长实验，建立从数据洞察到产品策略落地的闭环机制。\n7. 能熟练使用AI工具提升工作效率，结合 Prompt 优化、模型选型、RAG、Agent 工作流、多模态等能力，设计具备差异化体验的产品方案。推动 AI 能力在多业务场景中的复用与落地。\n\n\n任职要求：\n1. 本科及以上学历，985 / 211 优先，计算机、人工智能、产品设计、数据科学等相关专业优先，专业不限。\n2. 5 年以上互联网 C 端产品经验， 完整主导过至少 1-2 个 产品从 0 到 1 落地，或现象级产品，有显著数据提升案例，如活跃、留存、付费、满意度等。\n3. 深刻理解内容平台、社区产品、视频产品、娱乐互动产品、会员付费产品或创作者生态产品。\n4. 深刻理解会员体系、付费体系及商业化变现路径，能够设计变现策略，包括订阅、增值服务、Token 计费、内容付费等。\n5. 深刻理解 AI 内容生态，包括 AIGC 内容生产、智能推荐、AI 互动玩法、AI 创作工具、智能体 Agent 应用、虚拟人 / 数字人等 C 端典型场景。\n6. 熟练使用 Axure、Figma 等原型工具，以及AI工具辅助工作，独立输出产品需求。\n7. 熟练使用数据分析工具，具备数据分析、数据埋点方案设计及指标拆解能力。\n8. 需要有一线大厂或正规行业完整项目经历，在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等公司有完整项目经历者优先；不接受近几年有 BC 行业经验的候选人。\n\n\n加分项：\n1. 拥有日活百万级以上产品落地经验者优先。\n2. 具备团队管理经验和优秀的项目管理能力，或有 AI 产品方向方法论沉淀、产品指导经验者优先。\n3. AI 工具深度用户，有个人 AI 作品、AI 项目、Agent 工作流或产品案例沉淀者优先。", "cat": "产品与管理"}, {"id": "264", "title": "中高级拓展专员", "salary": "15-25K", "location": "远程，可国内办公", "jd": "岗位JD描述\n\n岗位定位\n负责某一业务方向的新渠道开拓与引入，持续挖掘、洽谈、对接优质投放渠道（信息流、KOL、联盟、广告平台等），不断扩大渠道规模与覆盖面；推动新渠道从对接、测试到放量的全流程落地，并对新渠道的拓展数量与投放质量负责。\n\n岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "运营与市场"}, {"id": "265", "title": "ToC网站综合运营", "salary": "10K-35K", "location": "远程，可国内办公", "jd": "岗位JD描述\n\n岗位职责：\n\n负责网站整体框架的日常巡检，确保页面正常访问；配合产品和技术团队持续优化网站UI/UX，提升用户浏览体验。\n负责网站各版块的内容策划、撰写与更新；结合SEO策略进行关键词布局，提升网站自然搜索排名。\n根据节假日、行业热点或公司营销节点策划线上活动；负责活动页面原型输出、跟进开发上线，并对活动效果进行追踪和复盘。\n关注网站注册用户的活跃度与留存，建立用户触达与激活机制；收集用户反馈，为产品迭代提供运营视角的建议。\n熟练使用Google Analytics等数据工具，按日/周/月输出网站数据报表（PV、UV、跳出率、转化率等）；通过数据分析定位问题，提出并落地CRO优化方案。\n\n任职要求：\n\n本科及以上学历，3年以上网站运营或综合运营相关工作经验。\n具备扎实的文字功底，能独立完成软文、活动文案及产品包装文案的撰写。\n了解基础SEO知识，熟悉搜索引擎收录与排名规则。\n执行力强，具备良好的跨部门沟通协调能力，需频繁对接设计和技术团队。\n责任心强，抗压能力好，有团队合作精神。\n\n加分项：\n\n有账号矩阵从0到1起量并达成涨粉及曝光KPI实战经验者优先。\n熟练使用AI工具（文本生成、图像处理、音视频辅助等）并能建立内容生产SOP者优先。\n掌握基础HTML/CSS，能进行简单页面代码调整者优先。\n熟悉PS、Figma等设计工具，能独立完成简单配图处理者优先。\n了解Python脚本、自动化抓取工具或Telegram Bot搭建者优先。", "cat": "运营与市场"}, {"id": "266", "title": "SEO专员", "salary": "10K-35K", "location": "远程，可国内办公", "jd": "岗位JD描述\n\n岗位职责：\n\n全盘负责站点底层SEO架构优化；精细化管理动态Sitemap生成机制、robots.txt规则配置与爬虫抓取频次管理，确保千万级视频页面被高效抓取与收录。\n制定视频内容搜索排名核心策略；深度应用视频结构化数据（Schema Markup/VideoObject），优化视频聚合页与播放页的内部链接结构，提升核心页面权重。\n结合AI工具建立规模化的网页TDK生产SOP；搭建自动化长尾词挖掘与内容分发工作流，通过程序化SEO批量获取长尾流量。\n规划高质量外链建设方案，结合Facebook、X、Telegram等渠道的社交流量信号，综合提升网站DA/DR和搜索引擎信任度。\n建立SEO数据监控看板（基于Google Search Console、日志分析等）；定期进行全站爬虫日志分析，快速定位并解决死链、蜘蛛陷阱、降权等流量异常问题。\n\n任职要求：\n\n本科及以上学历，3年以上大型ToC网站SEO实操经验，有从0到1搭建SEO架构或流量翻倍的成功案例。\n深度了解Google、Bing、Yandex等主流搜索引擎排名机制与反作弊算法，精通白帽SEO，持续关注算法更新趋势。\n熟悉HTML/CSS/JavaScript对SEO的影响，了解AMP/SSR等移动端技术，能与技术团队无障碍沟通并推动SEO需求落地。\n数据敏感度强，具备日志分析能力，能从大规模服务器日志中发现爬虫抓取规律与瓶颈。\n执行力强，能独立推进SEO需求从分析到落地的全流程。\n\n加分项：\n\n熟练掌握Python，能独立编写脚本或自动化抓取工具进行竞品分析与数据处理者优先。\n有将业务数据或流量预警通过API接入Telegram Bot进行程序化管理经验者优先。\n有站群运营或大规模社媒账号矩阵流量协同经验者优先。", "cat": "运营与市场"}, {"id": "267", "title": "中高级UI设计师", "salary": "10k-30k", "location": "远程，可国内办公", "jd": "【岗位职责】 （优先考虑境外办公人才，但限制中国籍）不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n\n负责常规界面设计时顺便制作基础的微交互（如按钮点击、页面跳转过渡）。\n侧重逻辑流向，产出动效规范（Timing、Easing、状态变化说明文档）。大厂或高品质项目中负责炫酷动画、复杂转场和品牌化动效。\n负责公司相关产品（Web/H5/App等）的整体UI界面设计，熟练使用Figma等设计工具，主导产品视觉风格和规范的制定。\n根据产品调性，完成icon、logo、水印、启动页、落地页等产品上线前所需物料，包括但不限于静态图、动态图、MG动画；根据运营需求设计活动banner、弹窗等，覆盖节日活动、补间活动、社区日常推荐活动等场景。\n具备二次元视觉风格设计能力，能够产出符合二次元审美的界面、角色、插画及运营物料，理解二次元用户圈层喜好与视觉偏好。\n利用Make、Stitch等AIGC工具完成从构想到Figma成品交付，了解各类大模型用途及ComfyUI工作流搭建与节点使用。\n\n【任职要求】\n\n本科及以上学历，美术、视觉传达、计算机学等相关专业优先；\n5年以上UI设计及平面设计经验（两者均需具备）；\n专业技能：Figma、Photoshop、Illustrator、Adobe Effects、ComfyUI、Claude；\n有二次元风格设计作品集，优先考虑有动漫、游戏、虚拟IP等相关项目经验；\n优先考虑境外办公人才（中国籍）；\n近期有博彩、棋牌、区块链相关背景者不予考虑。\n\n【加分项】\n\n会使用Claude与Figma进行交互，可反推Frame文件生成；会用Make进行低保真生成，会用Stitch进行概念设计；\n会使用Blender、C4D等三维软件；\n有前端经验，会Python；\n深度理解ComfyUI各节点含义，能自写节点并搭建复杂工作流；\n有二次元IP设计、虚拟形象设计或Live2D相关经验者优先。", "cat": "内容与创作"}, {"id": "268", "title": "运营主管（55K-85K/月）", "salary": "55k-85k", "location": "远程，可国内办公", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n\n岗位定位：统筹产品整体运营战略、业务推进与团队管理，对平台核心指标、运营体系建设、团队发展及整体经营结果负总责，驱动业绩持续增长与运营体系标准化落地。\n\n核心职责\n1. 围绕APP新增、活跃、留存、转化、营收等核心指标，制定中长期运营策略与阶段性落地方案，拆解年度、季度、月度目标，统筹全局落地，对整体业务结果兜底。\n2. 负责运营团队日常管理、任务拆解、过程管控与结果验收；搭建人才梯队，开展员工带教、技能培训、绩效管控与风险防范，保障团队稳定高效输出。\n3. 建立常态化数据监测与复盘机制，深度分析运营数据、用户行为与转化链路，精准定位问题并输出优化方案，持续迭代运营策略，提升平台经营效益。\n4. 主导搭建并优化APP标准化运营流程、管理制度与SOP体系，规范运营动作，提升团队执行效率与跨部门协同效率，降低运营风险。\n5. 运用AI、Agent等数字化工具，优化数据整理、复盘汇报、日常巡检、风险预警、文档沉淀等工作，实现运营工作数字化、高效化升级。\n\n任职要求：\n\n全日制本科及以上学历，市场营销、工商管理、电子商务、数据分析、计算机/互联网相关专业优先、985/211或海外知名院校毕业者优先考虑\n精通流量运营全链路：熟悉用户增长模型（AARRR）、漏斗分析、留存/转化/复购优化逻辑\n熟练掌握数据分析工具（Excel高级函数、SQL、Tableau/Power BI、GrowingIO/神策等至少一种），具备较强的数据敏感度和业务洞察能力\n熟悉主流流量渠道与投放规则（信息流、短视频、搜索广告、社交媒体、SEO/SEM等），能独立制定并优化投放策略\n了解产品、内容、用户运营交叉领域，能推动跨部门协作（产品、技术、内容、BD等）\n具备项目管理能力，能制定分阶段运营方案、拆解KPI并落地执行\n熟悉运营工具链（如飞书、CRM系统、自动化营销工具）者优先\n\n\n加分项：\n\n有3年及以上团队管理经验，具备梯队搭建、带教和绩效管理的实操经历；\n有从0到1搭建运营流程或 SOP 体系的经验，推动过团队标准化落地", "cat": "运营与市场"}, {"id": "269", "title": "运营副主管（网站运营）40K-65K/月", "salary": "40k-65k", "location": "远程，可国内办公", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n\n岗位职责：\n\n协助主管制定并执行网站运营策略，确保网站运营方向与公司业务目标保持一致，围绕流量增长、内容质量、用户体验、转化提升及运营效率优化推进整体工作。\n负责网站日常运营统筹管理，覆盖内容、页面、功能、更新维护等核心环节，保障网站稳定、高效运行。\n建立并持续优化网站运营流程、管理制度及SOP，提升团队整体执行效率和业务协同能力。\n持续监控网站流量、用户行为、转化率及其他关键运营指标，及时识别问题并提出数据驱动的优化方案。\n推动网站用户体验（UX）及转化率优化（CRO），持续改善用户旅程、内容承接效率和业务转化效果。\n推动SEO策略落地及相关技术优化，协同提升网站自然搜索表现、内容可见度及流量增长。\n协调产品、设计、开发等部门资源，推进网站功能优化、运营需求及数字化项目按计划落地。\n监督网站系统运行、安全性及性能表现，及时协调处理异常问题，降低运营风险。\n协助主管进行团队管理，包括工作规划、任务分配、绩效跟进、培训辅导及人才培养，保障团队稳定输出。\n\n任职要求：\n\n本科及以上学历，具备网站运营、内容运营、流量运营或相关岗位工作经验，有网站业务管理经验者优先。\n熟悉网站日常运营逻辑，对流量增长、内容质量、搜索表现、用户体验和转化优化有较强理解。\n具备较强的数据分析能力，能够围绕流量、行为、转化等核心指标进行问题判断与优化推进。\n熟悉SEO基础逻辑，能够协同推进自然流量增长及网站结构、内容、页面等优化工作。\n具备较强的组织协调能力、跨部门推动能力和问题闭环意识，能够推进事项按节点落地。\n有一定团队管理、项目推进或带教经验，能够协助主管完成团队管理和业务统筹。\n责任意识强，抗压能力较好，能够在多项目并行情况下保持稳定推进。\n\n加分项：\n\n有多网站或内容平台运营管理经验者优先。\n有SEO、CRO、UX优化相关经验者优先。\n有网站改版、功能优化或数字化项目推进经验者优先。\n有团队管理、绩效跟进及人才培养经验者优先。\n熟悉AI工具在网站运营、内容生产及效率优化场景中的应用者优先。", "cat": "运营与市场"}, {"id": "270", "title": "运营副主管（40K-65K/月）", "salary": "40k-65k", "location": "远程，可国内办公", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n岗位定位：\n协助开展团队管理与业务推进，承接部门经营目标及运营策略拆解，负责重点项目推进、团队执行管理、日常运营保障及跨部门协同，对分管业务模块的经营结果、项目交付质量和团队执行效率负责。\n核心职责：\n1. 承接制定的年度、季度及月度经营目标，拆解阶段性任务，推动各项运营工作按计划执行，并对分管业务结果负责。\n2. 负责重点运营项目推进，包括产品运营、内容运营、用户增长、流量增长、活动运营、转化优化等专项，统筹资源推动项目从方案、执行到数据复盘完整闭环。\n3. 持续跟踪新增、活跃、留存、充值、转化等核心指标，分析用户行为和业务问题，输出数据驱动的优化方案，并推动产品、运营动作持续迭代。\n4. 协助进行团队日常管理，包括任务分配、过程跟进、结果验收、绩效辅导、新人培养及团队梯队建设，提升团队执行力和交付质量。\n5. 负责运营流程、管理制度及SOP的落地和持续优化，推动日常运营标准化、流程化，降低执行偏差与运营风险。\n6. 统筹产品日常运营、内容质量、用户体验及异常问题处理，及时发现业务风险并推动闭环，保障产品稳定运营。\n7. 协调产品、研发、设计、数据、渠道等相关部门资源，推动重点功能、活动及运营需求按节点交付，提升跨部门协同效率。\n8.结果导向：对分管业务模块的经营指标达成、重点项目交付、转化与留存改善、运营执行质量、团队执行效率及问题闭环结果负责，保障制定的经营策略高质量落地。\n\n任职要求：\n1. 具备基础管理思维和较强的业务执行、项目推进及结果交付能力。\n2. 具备业务拆解、问题研判、数据分析及资源统筹能力，能够基于经营指标发现问题并推动解决。\n3. 具备较强的跨部门沟通协同能力，能够推动产品、研发、设计、数据等多方资源完成项目落地。\n4. 具备团队带教和过程管理能力，能够协助提升团队整体执行效率。\n5. 熟练使用数字化工具赋能运营工作，有实际提效成果者优先。\n\n加分项：\n有独立负责核心产品或重点运营项目的成功经验，能够通过数据分析定位业务问题，并推动产品、活动、用户增长或转化优化方案落地；\n具备 AI/Agent自动化应用、跨部门复杂项目推进、从0到1搭建运营机制或带队完成明确业绩增长 的实际案例者优先。\n有异常与风险处理能力，在系统故障、数据异常、转化下滑等情况下，能够快速判断优先级、协调资源并完成止损闭环。\n有从0到1搭建运营机制经验，如SOP、数据看板、用户分层、活动机制、内容体系或运营流程，并能够复制推广。", "cat": "运营与市场"}, {"id": "271", "title": "运营组长（网站运营）25k-45k/月", "salary": "25k-45k", "location": "远程，可国内办公", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n\n岗位职责：\n\n独立规划2-3个网站的定位、架构及内容方向，推动从建站、内容填充到上线的全流程落地。\n通过SEO优化、内容矩阵、外链建设、导航站合作等方式，持续提升网站收录、排名和访问量，对网站流量规模和增长结果负责。\n搭建并运营网站矩阵，如GEO站群、聚合站、导航站等，实现多网站并行、批量复制及风险分散。\n持续监控网站收录、排名、访问量、留存等核心数据，结合业务结果不断优化网站结构、内容策略及增长打法。\n根据业务规划招募、培养并管理小团队，明确分工和考核要求，推动组内业务稳定推进。\n与运营、产品、视觉等团队协作，保障网站流量向产品的有效承接，提升流量质量和转化效率。\n运用AI工具提升建站、内容生产及SEO优化效率，推动业务流程标准化与提效。\n\n任职要求：\n\n本科及以上学历，具备网站运营、SEO增长、内容运营或流量运营相关经验，有独立推进网站搭建和增长经验者优先。\n熟悉网站从规划、搭建、内容填充到上线的基本流程，能够独立推动项目落地。\n熟悉SEO、内容矩阵、外链合作、导航站合作等流量增长方式，并具备一定实操经验。\n具备较强的数据分析能力，能够围绕收录、排名、访问量、留存等核心指标持续优化。\n结果导向强，执行力较高，具备较强增长意识，能够承担网站流量增长结果责任。\n具备一定团队管理或带教能力，能够组织小团队稳定推进业务。\n有较强的问题判断、协同推进和抗压能力，能够在多网站、多任务并行情况下保持推进节奏。\n熟悉AI工具在建站、内容生产和SEO提效场景中的应用。\n\n加分项：\n\n有内容站、资讯站、聚合站、导航站或站群运营经验者优先。\n有新网站从0到1搭建并起量经验者优先。\n有通过SEO和内容矩阵实现流量规模化增长实际案例者优先。\n有小团队管理、招募、培养和考核经验者优先。\n有Google或百度SEO实操经验者优先。", "cat": "运营与市场"}, {"id": "272", "title": "运营组长（免费产品）25k-45k/月", "salary": "25k-45k", "location": "远程，可国内办公", "jd": "岗位定位(不要近期是bc博弈和棋牌相关的经验)\n业务为免费产品线，覆盖MAU、日活、次留、七留、充值等核心运营指标，主要定位为协助组内主管推进团队管理与业务落地，独立带领小组完成阶段性运营任务，对所负责产品线的整体运营结果负责。\n\n岗位职责\n一、产品运营统筹\n1.负责组内产品线的日常运营统筹，围绕MAU、日活、次留、七留、充值等核心指标制定执行计划，拆解阶段目标并推动落地。\n2.对所负责产品的整体运营结果负责，定期向主管汇报目标进展与风险。\n\n二、活动与转化策略\n1.负责产品活动策略、用户分层、内容承接、AB测试等关键运营动作的规划与推动。\n2.持续优化新老用户转化路径，提升次留、七留及充值转化效率。\n\n三、数据复盘与优化\n1.建立日/周/月常态化复盘机制，跟踪MAU、日活、次留、七留、充值等核心数据表现。\n2.分析流量、留存、付费等关键指标波动原因，提出针对性优化方案并推动执行。\n\n四、团队管理与协同\n1.负责组内人员工作安排、过程跟进、结果验收、绩效评估及梯队带教。\n2.协调产品、设计、技术、渠道等岗位资源，保障重点事项按节点推进。\n\n\n五、竞品分析与效率提升\n1.跟踪竞品玩法、活动机制、广告策略和内容承接方式，输出竞品分析与可落地借鉴建议。\n2.结合AI和自动化工具优化团队在数据整理、汇报输出、巡检预警、文档整理等重复性环节的执行效率，逐步沉淀标准流程。\n\n任职要求\n1.具备独立带领团队完成运营目标的实际经验，能提供真实可验证的项目案例和数据结果，尤其在MAU、日活、次留、七留、充值等指标上有可验证的提升记录。\n2.熟悉MAU、日活、次留、七留、充值等核心运营指标的拆解与执行方法。\n3.具备用户分层、AB测试、活动策划等运营动作的实操经验。\n4.具备较强的数据分析能力，能通过数据定位留存或付费波动原因并提出优化方案。\n5.具备团队管理、带教及跨部门协调推动能力。\n6.熟悉AI及自动化工具在运营场景（数据整理、汇报、巡检等）中的应用为佳。\n\n加分项\n1.有免费成人内容类产品运营\n2.有从0到1搭建或规模化增长团队运营体系的经验。\n3.有针对次留、七留提升的专项运营经验（如内容排期、签到体系、广告频次调优等）。\n4.能够证明所带团队的运营结果最终带来了MAU、日活、留存、充值端或者广告收入的实际提升。", "cat": "运营与市场"}, {"id": "273", "title": "中高级平面设计师", "salary": "10-30K", "location": "远程，可国内办公", "jd": "岗位定位：\n负责产品视频封面的制作以及日常活动的视觉设计，良好的沟通能力和自主设计能力，积极配合产品活动项目落地以及推广，设计产出符合大众审美并带来强烈的点击欲望，实现产品的点击量的持续增长和增加用户粘。\n\n岗位职责：\n要求候选人具有一定的审美能力，在日常运营工作中的设计产品封面/推广等工作，能够根据视频精彩内容输出美观吸睛的作品，并且按照相关需求输出动效活动banner以及会员卡/弹窗/海报等物料。\n\n团队与创意协同：\n与设计/内容团队协作优化视觉并进行审核，最终落地推广。\n\nAI 应用：\n运用 AI 工具完成整个设计流程，提高设计效率和质量。\n\n任职要求\n大专及以上学历，有3年以上平面/视觉相关经验者优先；\n熟悉主流设计方向，有良好审美和原创能力，有一定的figma基础，注重设计细节以及良好的沟通协作能力，精通（PS/Ai/AE/Pr/C4d）等软件，输出动效类的推广banner/海拔/弹窗等活动图。\n\n结果导向：具备良好的审美能力、沟通协调、抗压能力与团队协作意识，能适应快节奏工作；熟练运用 AI 工具辅助设计，候选人在国内和海外都可以。\n\n加分项：\n有成人行业经验首选，其次为传媒/视频/直播公司相关经验，会使用AE/C4d/figma等相关3d动效类的候选者优先考虑。", "cat": "内容与创作"}, {"id": "274", "title": "PMO/项目管理", "salary": "8-10K", "location": "远程，可国内办公", "jd": "岗位定位：作为GM经营管理辅助角色，协助推进重点业务及项目，强化过程管控、跨部门协调及结果闭环，推动经营目标有效落地。\n\n岗位职责：\n1、项目统筹与进度管理：负责各部门重点项目全生命周期跟踪，定期收集、汇总及评估项目进展，围绕关键节点、交付结果及目标偏差进行过程管控，及时识别风险并推动解决。\n2、重点事项推进与业务协同：参与重点业务事项及跨部门项目的过程管理，对GM及管理层明确的重点任务进行拆解、跟进和协调，推动责任人按计划完成关键节点；针对进度偏差、协同卡点及重大风险及时介入，并做好阶段性进展及节点结果汇报。\n3、经营会议及决议闭环：负责重点跨部门会议、GM例会等管理会议的组织与信息梳理，提炼关键决议、责任人及完成节点，并持续跟进决议事项落地，对延期、未闭环事项及时预警及推动解决。\n4、管理信息及项目看板建设：建立并持续优化重点项目及任务管理看板，定期输出周报/月报，清晰呈现项目进度、关键成果、风险问题及待决策事项，为GM及管理层掌握业务进展、资源协调和管理决策提供支持。", "cat": "产品与管理"}, {"id": "275", "title": "AI内容线主管（55k-85k/月）", "salary": "20-35K", "location": "远程，可国内办公", "jd": "岗位职责；负责内容部门整体经营与产出；（1）对部门整体产出、单分钟制作成本、投产比（算力成本对商业收益）、剧本储备月数（稳定在 2–3 个月）负责。；（2）制定部门季度/月度内容规划与开机计划，平衡内部原创、外包承制与采购三条来源。；（3）作为单剧商业结果责任人，对每部剧的上线商业结果（留存、完播、付费转化、收入）负责。；负责内容调性与跨组统筹（总导演职责）；（1）统一画面风格、声音设计、剪辑调性；剪辑组长须与其对齐后执行。；（2）评估分镜归属——按项目实际判定分镜由美术组承担还是生成人员承担。；（3）确保剧本、美术、生成、剪辑四组输出服从同一套内容判断，解决跨组冲突。；负责质量卡点的终止决策；（1）持**卡点 3（分镜锁定）**放行权：分镜未通过不进入视频生产。；（2）持卡点 5（切片数据闸门）终止权：首轮切片数据不达标时，决定暂停、调整或终止项目，避免整部制作后才发现市场不接受。；（3）设定并向 L3 主管备案切片测试的数据阈值（观看率、完播率、收藏率等）。；负责数据消化与选题迭代；（1）会同剧本组，对每一轮播放数据与观众口碑给出书面调整结论，回流到下一轮选题与制作。；（2）将定性口碑与定量数据对照，形成可执行的内容优化方向。；负责团队建设与管理层储备；（1）搭建并管理四个专业小组，确保标准流程与五个卡点落地。；（2）推动骨干每人带出一名接班人，纳入组长考核。；任职要求；本科及以上学历，8 年以上内容制作/影视/泛娱乐从业经验，其中 3 年以上团队管理经验。；影视行业制片主任、统筹、执行导演背景优先——能力结构与本岗高度重合，且比纯 AI 岗位人员更懂内容质量。；具备从剧本到成片、再到首轮数据验证的完整内容闭环经验，主导过成规模的内容产出。；具备 AI 内容生产的成本与产线认知，理解算力—产能—质量的换算关系。；具备数据驱动的经营意识，能对单分钟成本、投产比、留存/完播/付费等指标负责。；具备较强的跨组协调与决策能力，能在质量与产能、艺术与成本之间做取舍。；目标感强，能承担部门经营结果压力。；自带成熟内容团队者优先。；关键考核指标：部门整体产出、单分钟制作成本、剧本储备月数、投产比、单剧商业结果、是否带出储备主管/组长。", "cat": "内容与创作"}, {"id": "276", "title": "剧本组长（35K-55K/月）", "salary": "20-35K", "location": "远程，可国内办公", "jd": "岗位职责；负责剧本组整体产出与储备；（1）对剧本采纳率、剧本储备月数（稳定 2–3 个月，含外包与采购）负责。；（2）统筹内部原创、外包撰写、剧本采购三条来源，合理分配产能。；（3）组员任务分配，跟踪各集剧本进度与质量。；负责剧本评审与方法沉淀；（1）组织本子评审，把控剧情成立、时长可控、钩子/爽点/断点有效。；（2）沉淀跑出成绩的结构、开场钩子、爽点、断点为方法，指导本组创作。；（3）参与立项前制作可行性会审，判断内容值不值得做。；负责不可外包内容的最终把关；（1）守住核心主线设定、男女主角核心人设、成片整体节奏，不外包、不放松。；（2）确保外包与采购剧本进入审核序列，不绕过卡点 1。；负责编剧梯队建设；（1）搭建编剧梯队并组织互评，培养储备组长。；（2）新入职编剧的带教与适应期缩短。；任职要求；本科及以上学历，5 年以上编剧/内容创作经验，其中 2 年以上团队带教或统筹经验。；具备带编剧团队的能力（核心要求）——各线最缺的不是编剧，是能带编剧的人。；有网文/短剧/动漫/影视等成规模内容的主创或统筹经验，有代表作品。；深刻理解爽点、钩子、断点、节奏等短剧/网文创作规律。；具备内容判断力与评本能力，能快速判断本子优劣与改进方向。；熟悉外包协作与剧本采购流程者优先。；自带成熟编剧团队者优先。；关键考核指标：剧本储备月数、采纳率、上线后相对表现、续作能力、是否带出储备组长。；", "cat": "内容与创作"}, {"id": "277", "title": "编剧", "salary": "15-25K", "location": "远程，可国内办公", "jd": "岗位职责；负责核心剧本与爆款项目创作；（1）撰写项目核心主线、分集剧本、锁定版剧本，确保剧情成立、时长可控。；（2）设计开场钩子、爽点节奏、集末断点，提升留存与完播。；（3）参与男女主核心人设与标志性场景的设定。；负责剧本迭代与数据响应；（1）参与立项前制作可行性会审，与生成组确认镜头可制作性。；（2）根据上线数据（前 3 秒留存、完播率、付费转化、转发）与观众口碑，调整后续剧集与选题。；配合审核与制作；（1）配合剧本审核在卡点 1 完成锁定，及时响应修改意见。；（2）配合导演与生成组，保障剧本到分镜的顺畅转化。；任职要求；大专/本科及以上学历，2 年以上编剧经验（短剧、网文、动漫、影视方向）。；有真实代表作品，审美与内容判断力优先于 AI 工具操作能力。；精通爽文/短剧叙事套路，熟悉钩子、反转、爽点、断点设计。；有单部完整作品的创作经验，能独立产出成熟分集剧本（成熟编剧月产约 2 部）。；对上线数据敏感，愿意以市场反馈迭代创作。；有女频/男频、悬疑、都市、玄幻等热门题材经验者优先。；关键考核指标：剧本采纳率、上线后相对表现、续作能力（不按写了多少集评价）。；", "cat": "内容与创作"}, {"id": "278", "title": "剧本审核（含合规）", "salary": "10-18K", "location": "远程，可国内办公", "jd": "岗位职责；负责卡点 1（剧本锁定）执行；（1）审核剧情成立性、时长可控性、逻辑连贯性；剧本未锁定不进入资产生产。；（2）覆盖全部本子（内部 + 外包 + 采购，10–15 部/月），人均月审 3–5 部。；（3）识别未经人工审查的低质 AI 剧本，把控外包/采购剧本质量。；负责合规审核（不可外包）；（1）依据中台合规标准、红线清单与各渠道差异，在卡点 1 执行合规审核，未通过不得进入生产。；（2）跟进监管变化，及时更新本地执行口径。；配合三段合规闭环；（1）作为「执行」环节，衔接中台「定标准」与发布接收方「复核」。；（2）记录合规问题与退回处理，形成可追溯档案。；任职要求；本科及以上学历，2 年以上剧本审校、编辑、内容审核或合规相关经验。；具备扎实的内容审校能力与逻辑判断力，能高吞吐地评判剧本质量。；熟悉内容合规红线（含出海目标市场差异者优先），对政治、暴力、涉黄涉暴等敏感点敏感。；具备较强文字功底与细致度，能识别 AI 生成剧本的常见问题。；抗压、稳定、吞吐高，能应对审核瓶颈期。；关键考核指标：漏检率、审核吞吐、下游返工引发率。；", "cat": "内容与创作"}, {"id": "279", "title": "外包与采购对接", "salary": "10-15K", "location": "远程，可国内办公", "jd": "岗位职责；负责外包剧本对接；（1）对接外包分集剧本、爽文改编、台词润色、钩子优化，按单集打包计价。；（2）管理外包供应商，跟踪交付进度与质量，推动进入审核序列。；负责剧本采购；（1）采购已验证版权内容、成熟小说改编权、成品剧本，列入预算、不占编制。；（2）维护独立的剧本采购预算，评估采购与扩编的性价比。；负责供给缺口补足；（1）根据产能对账（内部产出 vs 开机需求），补足月度 4–9 部缺口。；任职要求；大专/本科及以上学历，2 年以上内容采购、版权、商务或外包管理经验。；熟悉网文/短剧版权与外包生态，有供应商与版权渠道资源者优先。；具备成本意识与谈判能力，能把控采购性价比。；具备基本内容判断力，能初筛外包/采购剧本质量。；关键考核指标：供给缺口填补率、采购性价比、外包成品合格率。；", "cat": "职能与行政"}, {"id": "280", "title": "美术组长（33K-50K/月）", "salary": "18-30K", "location": "远程，可国内办公", "jd": "岗位职责；负责卡点 2（美术资产锁定）执行；（1）男女主、主要配角、核心场景未确认前，不允许大规模生产。；（2）把控角色与场景的一致性基础，为后端生产提供稳定素材。；负责部门共享资产库建设；（1）建立并维护角色/场景/风格资产库，推动复用率达到 70% 以上。；（2）沉淀角色级、风格级微调资产（角色微调模型、构图控制参数、随机种子等），并向技术团队回流。；（3）资产编号唯一、复用关系清晰，避免每开新项目从零设角色。；负责美术组产出与协同；（1）统筹角色设计、场景道具、分镜产出，分配任务。；（2）与导演对齐画面风格；与生成组协同资产交付。；任职要求；本科及以上学历，5 年以上美术/概念设计经验，2 年以上团队管理经验。；有动漫/游戏/影视美术或 AIGC 美术资产管理经验，有作品集。；熟悉 AI 图像生成与微调工具链（LoRA/构图控制/参数化等）者优先。；具备资产化、标准化思维，能建立可复用的资产体系。；对角色/场景一致性有强把控力。；自带成熟编剧团队者优先。；关键考核指标：资产复用率、资产库回流合规度、资产锁定及时性、是否带出储备组长。；", "cat": "内容与创作"}, {"id": "281", "title": "角色设计", "salary": "10-30K", "location": "远程，可国内办公", "jd": "岗位职责；负责角色一致性设计；（1）设计男女主、主要配角的形象、服装、表情、姿态规范，保证跨镜头一致性。；（2）产出角色微调资产，进入共享资产库。；负责角色资产迭代；（1）根据剧本与导演反馈迭代角色设定。；（2）路人角色可外包批量生成，本岗做审校把关。；任职要求；大专/本科及以上，2 年以上角色设计/原画经验，有作品集。；熟悉 AI 生成角色一致性控制方法（角色微调、参考图、参数化）。；审美过硬，对角色辨识度与情感表达敏感。；关键考核指标：角色一致性达标率、资产复用率。；", "cat": "内容与创作"}, {"id": "282", "title": "场景道具设计", "salary": "10-30K", "location": "远程，可国内办公", "jd": "岗位职责；负责主场景与道具设计；（1）设计标志性主场景、关键道具、服装，保证场景不漂移。；（2）产出场景/道具资产进入共享库，管理编号与复用。；配合批量生产；（1）次要场景、道具、服装可外包批量生成，本岗审校把关。；任职要求；大专/本科及以上，2 年以上场景/道具/概念设计经验，有作品集。；熟悉 AI 场景生成与一致性控制。；具备空间与氛围表现力。；关键考核指标：场景一致性达标率、资产复用率。；", "cat": "内容与创作"}, {"id": "283", "title": "分镜", "salary": "10-30K", "location": "远程，可国内办公", "jd": "岗位职责；负责正式分镜脚本产出；（1）产出剧情清楚、站位连续、镜头可生成、景别有变化的分镜脚本。；（2）确保分镜逻辑正确，避免错误镜头逻辑被批量放大。；配合卡点 3；（1）分镜提交导演审核（卡点 3），未通过不进入视频生产。；（2）大场面冲突、转场关键、剧情转折点分镜不外包。；任职要求；大专/本科及以上，2 年以上分镜/故事板经验（动漫、影视、短剧方向）。；具备镜头语言与叙事节奏能力，理解 AI 生成的可制作性边界。；有影视/动漫分镜经验者优先。；关键考核指标：分镜通过率（卡点 3）、下游返工引发率。；", "cat": "内容与创作"}, {"id": "284", "title": "视频生成组长（50K-70K/月）", "salary": "30-50K", "location": "远程，可国内办公", "jd": "岗位职责；负责生成产能组织与调度；（1）按剧本场次数分配生成人力（投入人数 > 场次数则边际效益迅速下降；最小作业单元 1 导演 + 3 生成）。；（2）保障目标产能 2–3 分钟/人/天（通过卡点 4 的合格成片分钟数）。；（3）管理动态额度申请，优先保障高质量有效产出。；负责生成质量把控；（1）对合格镜头率、一次通过率、单位算力产出负责。；（2）与导演对齐分镜归属与画面风格。；负责工具回流与资产沉淀；（1）回流生产数据与优质参数至技术团队与共享资产库。；任职要求；大专/本科及以上，3 年以上视频制作/AIGC 视频生成经验，1 年以上带组经验。；精通主流 AI 视频生成工具链与工作流，理解人物稳定、动作自然、场景不漂移的控制方法。；具备产能组织能力，能按场次数与难度合理排产。；对算力成本与产出效率敏感。；自带成熟编剧团队者优先。；关键考核指标：合格镜头率、单位算力产出、单人日产能、一次通过率、是否带出储备组长。；", "cat": "内容与创作"}, {"id": "285", "title": "AI 视频生成（30-50K/月）", "salary": "30-50K", "location": "远程，可国内办公", "jd": "岗位职责；负责镜头视频生成；（1）依据分镜脚本生成镜头素材，保证人物稳定、动作自然、场景不漂移。；（2）达成目标产能 2–3 分钟/人/天（指通过卡点 4 的合格成片分钟数）。；（3）常规对话、静态场景可批量生成；高难度打斗、多人复杂互动为重点攻坚。；负责生成质量与自检；（1）对一次通过率、合格镜头率负责，减少返工。；（2）瑕疵镜头初筛，配合镜头审核执行卡点 4。；配合资产与参数沉淀；（1）回流优质随机种子、构图参数、微调资产至共享库。；任职要求；大专及以上学历，1 年以上视频制作、后期或 AIGC 相关经验（应届优秀者可放宽）。；熟练使用 AI 视频生成工具，理解提示词、参数、种子对稳定性的影响。；有画面审美与镜头感，能判断生成结果是否达标。；细致、有耐心，能承担产量与一次通过率压力。；现有剪辑/后期人员经培训可内部转岗。；关键考核指标：产量、一次通过率、合格镜头率、单位算力产出。；", "cat": "内容与创作"}, {"id": "286", "title": "镜头审核", "salary": "10-18K", "location": "远程，可国内办公", "jd": "岗位职责；负责卡点 4（镜头审核）执行；（1）按 A/B/C 镜头分级把关，C 级镜头不得进入剪辑素材库。；（2）防止剪辑用后期硬救低质量镜头，保障剪辑编制可压缩到 1/4 的前提成立。；负责镜头质量反馈；（1）向生成人员反馈问题镜头与返修方向，降低下游返工。；（2）沉淀常见镜头缺陷，反哺《AI 制作约束清单》。；任职要求；大专及以上，1 年以上视频后期/审片/质检相关经验。；具备镜头质量判断力，能快速识别人物漂移、动作僵硬、穿帮等问题。；标准意识强、细致、稳定，抗审核吞吐压力。；关键考核指标：漏检率、审核吞吐、下游返工引发率。；", "cat": "内容与创作"}, {"id": "287", "title": "剪辑音频组长（33K-50K/月）", "salary": "18-30K", "location": "远程，可国内办公", "jd": "岗位职责；负责剪辑与成片节奏把控；（1）剪辑调性对齐导演后执行；对成片整体节奏负责。；（2）监控健康度——剪辑需求持续高于生成组 1/3 时，判断为前端生成不达标或卡点 4 未严格执行，推动修前端而非加剪辑。；负责音频统筹；（1）音色统一、情绪正确、断句正确、音乐不压台词；音频不单设岗，对剪辑人员做音频培训后并入。；负责组内产出与梯队；（1）任务分配、进度把控，培养储备组长。；任职要求；大专/本科及以上，3 年以上剪辑经验，1 年以上带组经验。；精通剪辑与音频软件，具备节奏与叙事把控力。；熟悉短剧/短视频成片规范与平台要求。；自带成熟编剧团队者优先。；关键考核指标：本组交付质量与进度、成片一次通过率、是否带出储备组长。；", "cat": "内容与创作"}, {"id": "288", "title": "剪辑", "salary": "10-15K", "location": "远程，可国内办公", "jd": "岗位职责；负责成片剪辑；（1）按导演调性完成镜头拼接、节奏处理、转场，产出二次修改视频与最终成片。；（2）A 级硬错误清零，B 级问题给出处理结论。；负责音频与字幕；（1）完成 AI 配音、音效配乐拼接、统一字幕（经音频培训后并入）。；配合交付规范；（1）确保格式、码率、分辨率、时长、命名符合统一规范。；任职要求；大专及以上，2 年以上剪辑经验（短剧/短视频/影视方向）。；熟练使用主流剪辑与音频软件，具备节奏感与画面审美。；有 AI 配音、批量字幕、成片规范化经验者优先。；现有剪辑人员可内部转岗。；关键考核指标：交付质量、单条平均返工次数、成片一次通过率。；", "cat": "内容与创作"}, {"id": "289", "title": "成片质检", "salary": "8-10K", "location": "远程，可国内办公", "jd": "岗位职责；负责成片六维评分自检；（1）交付前按六维评分把关：故事线 25% / 画面 20% / 语言 15% / 转场 15% / 配音 15% / 一致性 10%，综合 ≥ 80 分方可交付。；（2）A 级硬错误清零，B 级问题有处理结论。；负责交付前把关；（1）核对内容一致（无剧情偏离）、质量达标（无明显 AI 生成错误）、格式规范。；（2）内部把关不替代发布接收方验收，最终验收权在接收方。；任职要求；大专/本科及以上，2 年以上审片/质检/后期经验。；具备成片质量综合判断力，熟悉六维评分维度。；标准意识强、细致、客观。；关键考核指标：交付一次通过率、接收方退件率。；", "cat": "内容与创作"}, {"id": "290", "title": "发布与数据", "salary": "10-18K", "location": "远程，可国内办公", "jd": "岗位职责；负责首轮发布测试与切片投放；（1）执行首集/切片上线测试，取得可判断的留存与完播数据，支撑卡点 5 决策。；负责量化体系维护；（1）维护生产账号体系，关联团队/项目/剧集/镜头，记录投入、产出、质量、效率四维数据。；（2）执行基础额度 + 动态额度分配口径，跟踪算力—收益投产比并动态预警。；负责数据回流；（1）按统一口径、约定周期，将播放数据（有效播放、完播、跳出、续看、付费转化等）关联到项目/镜头/模型版本/生成参数。；（2）配合技术团队采集与关联，向中台回流。 4.（P0 首发阶段）兼任项目负责人职责，从立项跟到交付。；任职要求；本科及以上，2 年以上数据运营/内容运营/BI 相关经验。；具备较强数据分析能力，熟悉留存、完播、转化等内容指标口径。；熟悉数据看板/报表工具，能维护量化体系。；有视频/内容平台运营或投放经验者优先；现有运营人员可内部转岗。；关键考核指标：数据回流及时性与完整性、量化体系维护质量、切片测试有效性。；", "cat": "其他"}, {"id": "291", "title": "中级运营", "salary": "10-20k", "location": "远程，可国内办公", "jd": "岗位职责\n1，平台增长与商业化运营\n深度参与用户增长、留存及商业变现相关工作，协助优化平台盈利模式，逐步独立承担运营策略制定与落地工作。\n2，内容运营与流量优化\n负责内容选题策划、制作发布与数据复盘优化，依托优质内容助推用户增长与转化；具备短视频剪辑、SEO 优化任一专项能力即可，可独立完成视频剪辑成片，或熟练掌握关键词布局、站内优化、流量引流等 SEO 实操技巧，全方位提升内容曝光与自然流量。\n3，用户精细化运营\n结合用户行为数据与真实反馈，深挖用户需求、梳理使用路径，参与用户分层运营，搭建精细化运营体系。\n4，活动策划与转化提升\n主导并配合完成平台各类运营活动策划与落地，持续优化活动玩法，有效拉升用户活跃度与商业转化效果。\n5，AI 工具赋能提效\n灵活运用各类 AI 工具赋能内容生产、日常运营工作，积极探索全新使用场景，大幅提升整体工作效率。\n6，项目执行与复盘迭代\n独立负责对应运营模块及重点项目
