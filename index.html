推进，完成全流程落地执行，定期开展工作复盘，总结经验并输出优化方案，持续迭代运营打法。\n简历筛选核心要点\n1，从业经验要求\n有海外社交产品、同志社群平台（LGBTQ+）、兴趣社区、情感陪伴类产品运营经验者优先，熟悉相关用户群体特征、内容生态及用户增长逻辑。\n必备专项技能（二选一）\n① 短视频剪辑：熟练使用主流剪辑软件，可独立完成短视频剪辑、包装产出，具备内容审美与网感优先；\n② SEO 优化：熟悉搜索引擎规则，精通关键词挖掘、页面优化、流量提升等实操方法，有自然流量增长实操经验优先。\n2，具备商业化运营思维\n无需全盘操盘变现业务，熟知运营动作与营收收益的关联逻辑；有会员运营、付费内容推广、付费转化活动相关经验优先，洞悉用户付费需求者加分。\n3，拥有用户思维与数据分析能力\n善于站在用户视角思考问题，能整理分析用户反馈、研判用户行为，具备基础数据复盘与需求拆解能力，有用户分层、用户运营相关经验更佳。\n4，具备独立策略思考能力（重点）\n拥有主动思考与自主优化意识，可独立参与内容规划、活动设计、运营策略调整等工作，只要具备主动优化、积极复盘的思维，均可邀约面试。", "cat": "运营与市场"}, {"id": "292", "title": "新媒体运营专员（英国本地/远程）", "salary": "英国本地：GBP2500-3000/月\n远程：10-15k（特别优秀可谈）", "location": "远程，可国内办公", "jd": "核心任务：从 0 到 1 快速起号与矩阵构建\n 我们需要一位深谙海外社交媒体底层逻辑的“操盘手”。你不仅要懂内容，更要懂流量分发机制，能够带领账号在短时间内突破新手期并实现粉丝指数级增长。\n \n 具体职责：\n 1. 全平台起号： 负责 Twitter (X)、Facebook、Instagram 等海外主流平台的账号矩阵搭建与起号工作，能在 1-3 个月内实现粉丝数从 0 到万级的突破。\n 2. 内容策略： 制定并执行各平台差异化内容方案，包括短视频、图文及热点推文，确保内容具备病毒式传播潜力。\n 3. 矩阵化运营： 熟练运用账号矩阵策略，通过号群联动、交叉引流，低成本获取高精准流量。\n 4. 数据复盘： 实时监控运营数据（播放量、点击率、留存率、转化率等），并根据数据反馈快速迭代内容方向。\n 5. 粉丝转化： 提升账号活跃度与互动率，通过社群运营或私域转化，实现品牌曝光与业务增长双赢。\n 6.内容剪辑：有剪辑视频，二创能力，具备基础的内容整合视频剪辑技能。\n简历筛选要点：\n• 硬核实操： 3 年及以上海外媒体运营经验，拥有可验证的从 0-1 起号成功案例（面试需展示过往账号数据及增长曲线）。\n • 平台精通： 深度理解 Twitter、Facebook、Instagram 的算法推荐逻辑、风控规则及广告投放工具。\n • 矩阵思维： 有账号矩阵运营实操经验，了解防关联技术、号群分配及自动化管理工具者优先。\n • 敏锐嗅觉： 能够捕捉海外流行趋势及梗文化，迅速产出符合当地受众审美的爆款内容。\n • 语言能力： 优秀的英文/中文读写能力，能够独立进行文案创作及粉丝互动。\n • 目标导向： 对数据敏感，极强的抗压能力和自驱力，以结果为导向。\n 加分项 (Plus)\n • 有 TikTok 或 推特 成功起号经验者优先。\n • 具备 AI 工具辅助生产高效内容的技能。\n • 有海外广告投放（FB Ads/X Ads）推广号投流经验，能实现“内容+付费”协同增长。", "cat": "运营与市场"}, {"id": "293", "title": "产品经理", "salary": "15-30k", "location": "远程，可国内办公", "jd": "岗位职责\n1.负责内容社区类产品的产品设计、迭代与体验优化，对核心链路指标（拉新、留存等）负责。\n2.参与产品规划与版本节奏管理，完成需求调研、需求分析、方案设计、原型输出与 PRD/交互说明撰写。\n3.主导或参与核心模块建设与持续迭代，包括但不限于：内容发布与管理、内容分发、社区互动、播放/阅读体验、会员与广告体系等。\n4.建立并完善埋点与指标体系，结合数据表现与用户反馈，持续推进功能优化与体验提升，形成“上线-验证-复盘-迭代”的闭环。\n5.协调设计、研发、测试、运营等团队资源，推动需求评审、排期、联调、验收与上线，确保项目高质量按期交付。\n6.参与用户增长与商业化相关功能设计、支持广告与会员体系在产品侧的体验优化与链路打通。\n7.持续跟踪行业趋势与竞品动态，沉淀方法论与产品规范，提升产品竞争力。\n\n任职要求\n1.重点强调细心、主动性强、沟通理解能力强；\n2.本科及以上学历，3-5 年互联网产品经理经验；有内容社区产品经验优先。\n3.熟悉移动端产品设计流程，能够独立完成需求分析、原型设计（Figma/Axure/墨刀等）及 PRD/交互文档撰写。\n4.对内容社区产品核心链路有理解：内容供给、分发机制、互动体系与社区治理基础能力（至少熟悉其中 1-2 个模块）。\n5.具备基础数据分析能力与数据意识：能定义关键指标与埋点需求，能基于数据与反馈提出可落地的改进方案。\n6.具备良好的沟通协调与推进能力，能跨团队推动项目落地并处理风险与问题。\n7.学习能力强、逻辑清晰、责任心强，具备较强的问题拆解与解决能力，抗压与自驱力佳。\n8.熟练使用AI Agent提升工作效率，可AI搭建产品；\n\n\n加分项\n1.男同优先；\n2.做过内容推荐/Feed 流策略相关产品。\n3.做过会员/广告产品链路相关体验优化。\n\n应聘材料\n简历 + 代表作品（可附原型/PRD节选/作品集链接，脱敏即可）。", "cat": "产品与管理"}, {"id": "294", "title": "AI内容运营（BL方向）", "salary": "10-20k", "location": "远程，可国内办公", "jd": "岗位定位：\n负责Gshort项目内容运营及内容生态建设，围绕BL向短剧完成内容引入、创作者运营、渠道推广及用户增长相关工作。\n\n岗位职责：\n1. 负责短剧内容搜集、整理、审核、上架及内容库维护；\n2. 招募并维护创作者，建立稳定内容供给体系；\n3. 负责BL向短剧选题策划、内容包装及亮点提炼；\n4. 参与用户渠道拓展、活动策划及社媒运营推广；\n5. 跟踪内容数据表现，持续优化内容方向及运营策略。\n\n任职要求：\n1. 1-3年以上内容运营、推广运营、创作者运营或短视频运营经验；\n2. 对BL内容、短剧、网文、漫画、影视、二次元内容有兴趣及理解；\n3. 具备内容敏感度及基础文案能力；\n4. 熟悉或愿意学习ComfyUI、LiblibAI、RunningHub等AIGC工具；\n5. 执行力强，能适应项目早期快速迭代节奏。\n\n优先录用：\n• BL内容运营经验\n• 男性向内容运营经验\n• 短剧/网文/漫画平台运营经验\n• 创作者运营经验\n• AIGC内容制作经验\n• TikTok、小红书、B站、X(Twitter)运营经验", "cat": "内容与创作"}, {"id": "295", "title": "内容运营专员(新岗位)", "salary": "10-20k", "location": "远程，可国内办公", "jd": "## 关于我们\n\n我们运营一个面向华语男同群体的内容平台(站点导航 + 视频 + 图文指南),团队精简、流程高度工具化:素材收录、合规改写、封面、发布、SEO 巡检都有现成脚本与 SOP,你只需要按规范执行和判断,不需要从零摸索。\n\n特别说明:平台内容涉及男同成人题材。应聘者须年满 18 岁,并确认自己能长期、稳定、无心理负担地接触和处理此类内容。\n\n## 工作职责\n\n1. 吃瓜素材搜寻与瓜源维护\n   持续发掘、跟踪瓜源渠道(Telegram 群组/频道、X、微博等),筛选有传播价值的素材;按收录规范整理(去重、编号归档、标注风险点),保证素材供给稳定、可追溯。\n\n2. 微信公众号内容跟踪\n   定期读取指定公众号的更新,提取可用图文素材与选题线索,整理成规范素材包交付流水线。\n\n3. 视频封面选择\n   从抽帧图/原始封面中为每条视频挑选画面清晰、有点击吸引力且符合站内尺度规范的封面,按命名规范归档(有明确的选帧标准和示例)。\n\n4. 文案清洗(合规化改写)\n   按合规规范改写视频标题、简介与标签:去除风险词、统一格式、保留信息量与可读性,产出规范的数据文件供批量上传(有完整的改写规则与正反例)。\n\n5. 预览视频剪辑\n   从源视频截取 15–60 秒预览片段,统一分辨率与输出格式;剪映/PR/FCP 任一熟练即可,不要求特效包装。\n\n6. 内容 SEO 维护\n   对新上线的视频/指南/专题做例行巡检:标题与描述长度、重复度、摘要补写、死链检查等,按 checklist 执行并记录;有自动化巡检工具辅助,你负责人工判断与补写文案。\n\n7. 需求看板维护\n   维护 Trello 运营看板:需求收集建卡、进度更新、完成项归档、输出简要日报,保证团队对运营进展一目了然。\n\n## 任职要求\n\n- 年满 18 岁;完全接受男同成人内容题材(硬性要求,请慎重确认后再投递);\n- 中文文案功底扎实,改写通顺自然、有分寸感;细心、有条理,能严格按 SOP 执行;\n- 具备基础视频剪辑能力(剪映/PR/FCP 任一);\n- 会用或能快速上手 AI自动化、Telegram、Trello;\n- 远程自驱型:每日可保证稳定在线时段(与北京时间工作时段有重叠),响应及时、交付可靠;\n- 保密意识强:素材、账号与内部流程不外传,可签保密协议。\n\n## 加分项\n\n- 有 SEO 基础(懂 title/description/重复内容的基本逻辑);\n- 熟悉吃瓜社区、LGBTQ+ 社群内容生态;\n- 会用 AI 工具辅助改写/整理,并有辨别 AI 产出质量的能力;\n- 会简单的表格/脚本自动化。", "cat": "内容与创作"}, {"id": "296", "title": "用户增长运营", "salary": "10-20k", "location": "远程，可国内办公", "jd": "岗位定位\n负责男同视频内容平台或社区产品的用户增长工作，围绕拉新、转化、留存、召回和付费增长，搭建可持续的增\n长策略与运营机制，提升核心用户规模、用户活跃度和商业转化效率。\n工作职责\n• 制定并执行用户增长策略，围绕注册、激活、留存、付费、复购等关键环节，持续提升用户规模与用户质量\n• 负责增长渠道拓展，包括社交媒体、内容平台、社群、KOL/KOC、联盟渠道、SEO/ASO、广告投放等，评估渠道\n效果并优化获客成本\n• 结合男同内容消费场景和目标用户画像，设计拉新活动、裂变机制、会员转化活动、内容分发策略和用户召回\n• 与内容、产品、数据、投放、设计等团队协作，优化新用户引导流程、会员购买路径、内容推荐链路和关键转化页\n面\n• 建立用户分层运营体系，针对新用户、活跃用户、沉默用户、付费用户和高价值用户制定差异化运营策略\n• 跟踪和分析核心增长数据，包括新增、活跃、留存、转化、ARPU、LTV、CAC、ROI，输出数据洞察与优化建议\n• 策划并落地线上增长活动，如会员促销、限时权益、邀请奖励、内容专题、节日活动、社区互动活动等\n• 关注男同视频、成人内容、LGBTQ+ 社区、短视频、直播、订阅制产品等趋势，持续挖掘增长机会\n• 沉淀增长方法论、活动复盘、渠道评估模型和用户运营 SOP，提升团队整体增长效率\n任职要求\n• 2 年以上用户增长、用户运营、内容运营、社群运营、广告投放或平台增长相关经验\n• 熟悉内容平台、视频产品、社区产品、会员订阅产品或泛娱乐产品的用户增长逻辑\n• 具备较强的数据分析能力，能够基于数据发现问题、制定方案并推动落地\n• 熟悉常见增长手段，包括渠道投放、裂变活动、用户分层、召回运营、会员转化、A/B 测试等\n• 对男同用户群体、LGBTQ+ 文化、垂直内容消费习惯有理解，具备良好的用户敏感度和内容判断力\n• 具备较强的活动策划、文案表达、项目推进和跨团队协作能力\n• 结果导向，能够独立负责增长指标，并持续复盘优化\n• 对合规、平台规则、内容安全和用户隐私有基本认知，能够在合规边界内开展运营工作", "cat": "运营与市场"}, {"id": "297", "title": "中级运营（seo方向）", "salary": "10-20k", "location": "远程，可国内办公", "jd": "简历筛选要点\n1.3年及以上 SEO 或内容运营经验，做过英文站/海外流量站点，有独立负责站点或频道从 0 到有稳定自然流量的完整经验。\n2.理解搜索引擎抓取、索引、排名机制，清楚什么样的内容会被收录、什么样的不会，能讲清判断依据而非只背概念。\n3.熟练使用 Google Search Console 与 GA4，能从数据中定位问题（收录下降、点击率异常、流量突变），而不只是导出报表。\n4.会用至少一款关键词工具（Ahrefs / Semrush 或同类）做关键词研究、竞品分析和内容缺口判断。\n5.熟悉技术 SEO 基本概念（sitemap、canonical、hreflang、结构化数据、Core Web Vitals），能识别问题、准确描述现象并向开发提出可执行的修复需求。\n6.熟悉使用 AI 工具（Claude、ChatGPT 等）提升选题、内容生产、数据整理和文档效率。不是只会让 AI 批量出稿，必须能人工判断内容质量、事实准确性、重复度和被搜索引擎判定低质的风险。\n岗位职责\n1. 负责公司 内容站点矩阵的 SEO 落地与自然流量增长，包括关键词布局、栏目与页面结构、内链体系和内容模板的执行与优化，能按站点价值分配精力而非平均用力。\n2.基于关键词工具与搜索需求数据完成关键词研究、竞品分析和内容缺口判断，输出选题方向并转化为可执行的内容排期。\n3. 制定并维护内容生产的 SEO 规范（标题、描述、正文结构、内部链接、实体覆盖），保障批量产出的内容符合收录与排名要求。\n4. 负责 AI 批量生成内容的质量与合规审核，包括可读性、事实准确性、重复度和低质风险判断，避免低质内容进入线上。\n5. 通过 GSC / Bing Webmaster / IndexNow 等渠道跟踪收录率与索引状态，定位未收录、软 404、重复内容、抓取浪费等问题并推动解决。\n6. 建立日常 SEO 巡检机制，定义关键指标与告警阈值（收录率、抓取异常、结构化数据错误、流量突变），对异常分级响应并跟进修复闭环。\n识别技术 SEO 问题并向前端/后端提出明确修复需求，推动开发排期，修复后负责效果验证；与产品、开发、内容保持高效协作。\n7.  跟踪 Google 核心算法更新与政策变化（如 spam policy、site reputation abuse 等），评估对站群的影响并及时同步风险信号。\n8. 沉淀 SEO 操作规范、检查清单、内容模板和 AI 协作方法，提升多站点批量运营的整体交付效率。", "cat": "运营与市场"}, {"id": "298", "title": "中级运营（ai短剧制作方向）", "salary": "10-20k", "location": "远程，可国内办公", "jd": "适用于 AI 短剧从创意策划、视觉生成、视频制作到成片交付阶段的核心制作岗位招聘。\n岗位定位：负责将短剧脚本、角色设定和分镜需求转化为可交付的 AI 视频内容，统筹文生图、图生视频、配音、剪辑、包装等制作环节，提升短剧生产效率和成片质量。\n岗位职责\n-负责 AI 短剧项目的制作执行，包括剧本拆解、分镜规划、角色设定、场景设计、镜头生成、画面优化与成片交付。\n-使用 AI 工具完成短剧视觉内容生产，包括文生图、图生图、文生视频、图生视频、配音、字幕、剪辑等流程。\n-根据项目需求，协助完成短剧选题、剧情节奏、人物关系、爆点设计和平台化表达优化。\n-负责 AI 生成素材的筛选、修正与统一，保证角色一致性、画面风格统一、镜头连贯性和整体观感。\n-配合编剧、导演、运营、剪辑等团队推进项目落地，按时完成短剧内容生产任务。\n-沉淀 AI 短剧制作流程、提示词模板、角色资产、场景资产和常用工作流，持续提升团队生产效率。\n-跟踪 AI 视频、AI 影视、短剧内容平台的新工具、新玩法和行业趋势，持续优化制作方法。\n任职要求\n-熟悉短剧、网感内容、短视频平台内容逻辑，对剧情节奏、爽点、反转、情绪钩子有基本判断。\n-熟练使用一种或多种 AI 视觉 / 视频工具，如 Midjourney、Stable Diffusion、ComfyUI、Runway、Pika、可灵、即梦、剪映、CapCut 等。\n-具备一定审美能力，能把控人物造型、画面构图、色彩风格、镜头氛围和视觉一致性。\n-理解 AI 生成内容的常见问题，能针对角色漂移、画面崩坏、动作不连贯、镜头不稳定等问题进行修正。\n-有较强的执行力和学习能力，能快速适应 AI 工具更新和项目节奏。\n-具备良好的沟通协作能力，能根据反馈快速调整内容，并与编剧、剪辑、运营等角色高效配合。\n-有短剧、短视频、动画、影视后期、广告片、漫画、游戏美术、AIGC 内容制作经验者优先。", "cat": "内容与创作"}, {"id": "299", "title": "中级运营（吃瓜编辑）", "salary": "8-12k", "location": "远程，可国内办公", "jd": "## 岗位职责\n\n1. 跟踪全网热点、娱乐八卦、社会吃瓜事件，快速抓取事件线索，梳理事件时间线、人物关系，整理完整吃瓜素材。\n2. 负责吃瓜向内容生产，包括短文案、事件复盘、瓜料合集、热点解读，适配新媒体账号图文 / 短视频脚本输出，语言通俗有网感。\n3. 甄别网络信息真伪，做基础信息核实，剔除谣言，规避侵权、敏感风险，把控内容尺度。\n4. 监测评论区、社交平台用户讨论，挖掘网友高热度观点、二次梗点，反哺内容选题。\n5. 跟进热点生命周期，判断选题热度，复盘内容数据，迭代选题方向与写作风格。\n6. 整理瓜料素材库，沉淀热点事件档案，做好素材归档。\n\n## 任职要求\n\n1. 熟悉微博、小红书、抖音等社交平台，常年冲浪，对娱乐、社会热点八卦敏感度极高，5G 网上冲浪选手。\n2. 网感强，会抓梗，擅长叙事梳理，能把复杂事件讲得清晰易懂，写作节奏紧凑，懂吃瓜用户阅读偏好。\n3. 具备基础信息辨别能力，会多方比对信息，有风险意识，了解新媒体内容红线。\n4. 抗压能力强，热点突发时可以快速响应，赶稿出稿，能接受热点突发情况下的弹性工作。\n5. 有新媒体编辑、娱乐号、吃瓜号、自媒体内容实习 / 工作经验优先，可附过往作品。\n6. 思维灵活，善于拆解复杂多方事件，擅长梳理时间线、人物关系。", "cat": "内容与创作"}, {"id": "300", "title": "运营专员（偏剪辑，简历需带作品）", "salary": "8-12k", "location": "远程，可国内办公", "jd": "岗位职责\n1、根据脚本、运营需求完成短视频剪辑，包含素材筛选、粗剪精剪、调色、字幕花字、配乐音效、简单包装，独立输出竖屏成片。\n2、负责视频封面素材截取、封面剪辑排版、文字配色与出图，输出高吸引力封面图，配合提升点击率。\n3、把握视频节奏，打磨开头钩子，提升完播率；按照不同平台规范输出多版本物料，按时交付。\n4、接收反馈快速修改迭代，做好素材、工程文件、封面源文件归档，沉淀剪辑、封面模板。\n5、关注平台热点、爆款剪辑手法与封面风格，结合视频数据反馈优化剪辑与封面设计思路，参与内容头脑风暴。\n6、根据工作情况或团队安排，参与其他运营相关事项。\n7、完成其他视频相关的后期辅助工作。\n\n## 任职要求\n\n1、熟练 PR / 剪映，会达芬奇调色、AE 简单包装优先，能独立完成完整成片以及封面剪辑出图。\n2、1 年及以上短视频剪辑实战经验，网感好，懂短视频流量逻辑，有剪辑 + 封面作品作品集。\n3、镜头节奏感强，审美在线，理解脚本意图，对画面、字幕、音效、封面图文细节把控到位。\n4、执行力强，能接受修改迭代，抗压，守交付排期，沟通协作顺畅。\n5、加分：懂构图配色、有爆款视频 & 封面案例、会使用 AI 剪辑 / 作图工具。", "cat": "内容与创作"}, {"id": "301", "title": "ComfyUI 工程师", "salary": "10-20k", "location": "远程，可国内办公", "jd": "ComfyUI 工程师\n\n工作职责：\n1. 负责 AI 真人短剧男同 18+ 方向 ComfyUI 工作流的搭建、测试与迭代，确保出图、出视频的稳定性与画面质量达到短剧制作标准。\n2. 根据业务需求在 CivitAI、HuggingFace 等社区筛选合适的 Checkpoint、LoRA 及扩展节点，评估其风格适配度与底模兼容性。\n3. 设计并维护工作流模板库，覆盖生图、生视频等短剧生产高频场景，制定标准化节点连接规范。\n4. 搭建「工作流测试 + 效果验证」的评估流程，通过定量（良品率、显存占用、生成速度）与定性（构图/光影/一致性）分析定位问题并推动优化。\n5. 与 LoRA 训练师、技术、短剧制作团队协作，将工作流能力嵌入短剧生产管线，确保生成画面的质量符合短剧叙事需求。\n\n简历筛选要点：\n\n1.基本门槛\n- 2 年以上 AIGC 应用或相关工程经验。\n- 有制作过至少 2 个 18+ 短片（男同优先），单个时长不少于 1 分钟。\n- 本地有一台可以跑生视频工作流的电脑。\n\n2.技术能力\n- 熟悉 ComfyUI 节点逻辑，理解各参数对画面的具体影响，能独立排查工作流报错。\n- 熟悉 18+ 内容模型的生成特点与工作流适配方式。\n\n3.数据与资源能力\n- 具备扎实的模型检索与评估能力，能快速判断一个 LoRA 的底模兼容性及实际权重效果。\n- 熟练掌握 C 站等平台的检索技巧，有模型/LoRA 资产库搭建与归档经验。\n\n4.审美与业务理解\n- 具备基础的影视审美，能理解分镜、景别、机位等影视概念。\n- 能判断生成画面的构图、光影、色调是否符合短剧叙事需求。\n- 能判断生成的 18+ 画面的质量水平层级。\n\n5.加分项\n- 可以借助 AI 编写简单的自定义节点。\n- 在 AIGC 社区（CivitAI、Runninghub、HuggingFace、LiblibAI、B站等）有高质量工作流分享或技术内容输出。", "cat": "技术开发"}, {"id": "302", "title": "短剧编剧（男同）", "salary": "10-20k", "location": "远程，可国内办公", "jd": "岗位名称： 男男短剧编剧\n内容方向： 成人向 / 非成人向\n工作方式： 全职 / 远程\n\n01 · RESPONSIBILITIES\n你将负责\n研究男男题材受众、内容平台和流行趋势，参与成人向与非成人向项目的选题策划、内容调研和创意提案。\n独立或协同完成故事梗概、人物小传、关系线、分集大纲、剧本正文及相关创作说明。\n塑造具有主体性和可信动机的男性角色，设计清晰的关系推进、情感拉扯、核心冲突与成长变化。\n根据内容分级处理亲密关系与情欲表达，使成人向桥段服务于人物和剧情，非成人向项目保持适配受众与平台的表达尺度。\n确保成人向项目中的角色均为成年人，关系与情节建立在明确自愿和清晰边界之上，并符合适用法律、发布地区及平台规则。\n强化开篇钩子、单集卡点、情绪递进和关键反转，同时控制场景、角色与制作成本，保证拍摄可执行性。\n参与剧本评审与围读，根据制片、导演及运营反馈高效迭代，并结合成片和数据表现持续复盘。\n02 · REQUIREMENTS\n我们期待你\n年满18周岁，能够接受工作中接触成人向文字、视听素材及相关创作沟通。\n理解男男情感关系和相关受众需求，尊重多元性别与性倾向；本岗位不限定应聘者性别或性倾向。\n具备扎实的故事结构、人物塑造和对白写作能力，能避免人物工具化、标签化与关系逻辑失真。\n熟悉短剧叙事规律，理解前段抓人、强冲突推进、单集留钩和情绪兑现。\n能准确区分成人向与非成人向表达，具备清晰的同意意识、内容边界和平台合规意识。\n具备良好的沟通、协作和节点意识，能够理解反馈并在明确期限内完成高质量迭代。\n03 · NICE TO HAVE\n加分项\n有上线男男短剧、网剧、小说、漫画或互动叙事作品。\n擅长都市情感、甜虐、悬疑、成长等一种或多种类型。\n有成人向内容、IP改编或跨文化发行经验。\n了解现场拍摄、亲密场景沟通、制片成本或平台审核规则。\n04 · APPLICATION\n简历提交\n**代表作品：**1至3部男男题材作品或节选，注明成人向或非成人向及本人贡献。\n**创作样稿：**短剧大纲、人物小传或前3集剧本，重点展示人物关系与开篇钩子。", "cat": "内容与创作"}, {"id": "303", "title": "签证执行专员", "salary": "10 - 15K", "location": "远程，可国内办公", "jd": "一、岗位简介\n负责签证 / 移民事务的执行层支持，优先推进欧洲区域国家数字游民签证的实际办理进度，维护外部合作机构关系，为策略层提供底层整理与执行保障。本岗位仅提供整理与建议性支持，不代办申报、不代填官方表格。\n\n二、任职要求\n必须：有3年以上签证 / 移民相关工作经验，熟悉签证材料清单与申请流程\n必须：理解并严格遵守整理与建议 vs 代办申报的合规红线\n必须：有外部机构联络与跟进经验，能独立维护多方合作关系\n加分：有申根签证 / 欧洲签证实际操作经验\n加分：英文书面沟通能力\n\n三、岗位职责\n1.优先：推进欧洲区域数字游民签证的办理进度，独立跟进材料准备与外部机构沟通，充分利用现有合作机构体量落地执行\n2.机构管理：对接并维护外部持牌机构（移民律所 / 顾问机构）的联络清单与白名单，跟踪合作机构资质变化\n3.材料支持：整理签证 / 移民材料清单，跟踪案件关键节点与截止日期\n4.体系建设：协助移民策略专家建立标准路径库初始数据与材料清单模板体系\n5.建议支持：提供建议性信息支持，明确不代办申报、不代填官方政府表格的操作边界\n\n备注：\n1、面试时要求简单英文自我介绍\n2、该岗位招聘难度相对较高，在招聘触达阶段可以不告知我们所处行业的情况，减少留存难度，在后续的工作中面试官会铺垫告知所处行业的部分情况。", "cat": "职能与行政"}, {"id": "304", "title": "中级SSC", "salary": "10-15k", "location": "远程，可国内办公", "jd": "一、任职要求\n1. 大专及以上学历，行政管理、人力资源管理等相关专业优先；\n2. 3年以上人事行政相关工作经验，有互联网行业或远程办公场景经验者优先；\n3. 熟悉人事行政基础流程，熟练使用 Excel、Word、PPT 等办公软件；Excel 能力扎实（常用函数、数据透视、公式、数据清洗），具备较好的数据整理、统计与报表处理能力；\n4. 具备基础 AI 使用能力，能理解并配合 AI 工具辅助工作，并对 AI 输出具备基本核验意识；有 Claude（含 Claude Code / CC）、ChatGPT 等工具使用经验者优先，此项为重要加分项；\n5. 责任心强、执行闭环意识好，任务及时响应、主动跟进、问题主动认领与修正；抗压能力与稳定性好，能适应工作方式向标准化、数据化的转型；沟通协调能力和执行力良好，团队协作意识强；工作细致认真，能妥善处理敏感信息并适应多任务工作节奏。\n二、岗位职责\n1. 负责员工入职、离职、调岗、转正等异动流程办理与跟进，确保流程执行及时、规范；\n2. 负责员工信息、花名册、档案等基础资料的维护与更新，保障数据准确、完整；\n3. 负责考勤、费用及基础人事行政数据的统计、复核与相关报表输出；\n4. 执行日常人事行政基础流程，包括考勤管理、档案管理、制度落实及基础事务办理；\n5. 协助开展新人培训、员工培训及相关记录管理，支持培训流程顺利开展；\n6. 配合业务及相关协同部门完成对接，跟进异常问题及临时事项处理；\n7. 结合 AI 工具辅助完成数据整理、流程跟进及重复性事务处理，持续提升效率。", "cat": "职能与行政"}, {"id": "305", "title": "中高级人事专员 (台湾办公室岗位)", "salary": "45-55kTWD", "location": "远程，可国内办公", "jd": "🌟招聘需求\n1.人資相關制度規章辦法、流程與表單等維護、修訂或新增建立\n2.新人教育訓練/離職人員勸退訪談/人事資料管理與維護處理人員加、退勞健保與團保\n3.人員出勤管理，輸入匯入每日出勤表，了解人員實際出勤狀況\n4.員工相關福利建置/員工關係維護\n5.活動規範籌備(例:尾牙、部門聚餐、跨部門團康活動)\n6.薪資計算及審核\n7.對外接洽勞保局、健保局等政府單位窗口業務\n8.協助主管製作各類表單，及提供人事行政作業流程\n\n🌟專業知識與技能\n熟悉勞動基準法、勞工保險條例、全民健康保險法等相關勞動法規\n具備勞健保加退保實務操作經驗\n具備薪資計算與審核實務經驗\n熟悉勞資會議召開流程及會議紀錄撰寫\n具備政府機關公文寫作能力（正式行政文書往來經驗）\n有勞動檢查應對或勞資爭議調解處理經驗者優先\n\n🌟學經歷\n大學以上學歷，人力資源、勞工關係、法律、企業管理相關科系尤佳\n至少2年以上人資相關工作經驗\n\n🌟工具能力\n熟悉 Excel（含公式應用，如薪資計算、出勤統計等）\n熟悉 Word、PowerPoint 等辦公軟體\n具備 AI 工具應用能力（如運用 ChatGPT、Claude 等 AI 工具協助公文撰寫、資料整理、流程優化等）者優先\n\n🌟其他條件\n1、積極態度、主動負責。\n2、邏輯清晰，善於溝通協調。\n3、細心、耐心、配合度高、穩定性高。\n4、抗壓性佳，能應對政府單位稽查等突發狀況。", "cat": "职能与行政"}, {"id": "306", "title": "中级SSC", "salary": "10-15k", "location": "远程，可国内办公", "jd": "\"任职要求：\n1. 本科以上学历，行政管理、人力资源管理等相关专业优先；\n2. 具备4年以上人事行政相关工作经验，有互联网行业或远程办公场景经验者优先；\n3. 熟悉人事行政基础流程，能够熟练使用 Excel、Word、PPT 等办公软件，具备较好的数据整理、统计及报表处理能力；\n4. 具备基础 AI 使用能力，能够理解并配合 AI 工具辅助工作；有 OpenClaw、Claude 等工具使用经验者优先，此项为重要加分项；\n5. 具备良好的沟通协调能力和执行力，工作细致认真，责任心强，能够妥善处理敏感信息并适应多任务工作节奏。\n6. 具备较强的抗压能力，能够在多任务并行、节奏较快及事务繁杂的工作场景下保持稳定执行，确保工作质量和时效性。\n\n岗位职责：\n1. 负责员工入职、离职、调岗、转正等异动流程办理与跟进，确保流程执行及时、规范；\n2. 负责员工信息、花名册、档案等基础资料的维护与更新，保障数据准确、完整；\n3. 负责考勤、费用及基础人事行政数据的统计、复核与相关报表输出；\n4. 执行日常人事行政基础流程，包括考勤管理、档案管理、制度落实及基础事务办理；\n5. 配合业务、财务及相关协同部门完成对接工作，跟进异常问题及临时事项处理；\n6. 能结合 AI 工具辅助完成数据整理、流程跟进及重复性事务处理，持续提升工作效率。\"", "cat": "职能与行政"}, {"id": "307", "title": "中高级运营", "salary": "10-18k", "location": "远程，可国内办公", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。", "cat": "运营与市场"}, {"id": "308", "title": "编辑专员", "salary": "7K-10K", "location": "远程，可国内办公", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；黑料吃瓜等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "309", "title": "编辑专员", "salary": "7K-10K", "location": "远程，可国内办公", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；黑料吃瓜等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "310", "title": "舆情收集员", "salary": "10K-15K（优秀面议）", "location": "远程，可国内办公", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "311", "title": "AI视频创作（AI成人短剧方向）", "salary": "10K-20K（优秀者可面议）", "location": "远程，可国内办公", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\n优先考虑：\n1.有成熟AI视频作品集。\n2.有完整AI工作流搭建经验。\n3.有自动化（ComfyUI Workflow、API、脚本）经验。\n4.熟悉PR、AE、CapCut等后期工具。\n5.有团队协作及项目经验。\n\n面试要求：\n近三个月代表作品（图片或视频均可）\n工作流截图（ComfyUI等）\n常用模型及LoRA介绍\n常用Prompt示例\n独立完成的项目案例", "cat": "内容与创作"}, {"id": "312", "title": "中高级运营", "salary": "10k-18k", "location": "远程，可国内办公", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，熟练使用 Google GSC 站长平台|yandex站长平台，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。                                                                                                                                         9.懂社群运营，懂这些平台运营优先Telegram，Discord， X，WhatsApp。\n9、能接受远程办公，保证工作时间在线响应\n加分项：\n1、有成人向/泛娱乐/吃瓜类内容运营经验\n2、有矩阵账号批量运营经验\n3、熟悉Agent自动化发布流程以及各个平台多节API路径\"", "cat": "运营与市场"}, {"id": "313", "title": "主编", "salary": "10K-15K", "location": "远程，可国内办公", "jd": "岗位职责\n1. 负责平台热点内容的标题策划、正文撰写及内容包装；\n2. 根据热点事件快速输出具有点击力、传播力和讨论度的文案；\n3. 负责神评论、热评、互动评论及评论区趣味内容创作；\n4. 负责段子、网络梗、趣味表达及年轻化内容创作；\n5. 持续关注全网热点，挖掘适合平台用户的内容选题；\n6. 参与吃瓜原创关键词、网络热词、特色表达及内容标签的创作；\n7. 使用AI工具完成资料整理、信息提炼和初稿辅助，并进行人工深度创作；\n8. 根据内容点击率、阅读率及互动数据不断优化文案表达。\n\n任职要求\n1. 具备互联网内容、媒体、自媒体、新媒体或文案相关工作经验；\n2. 中文表达能力较强，能够独立完成标题、正文、评论及段子创作；\n3. 对娱乐热点、社会热点及网络流行文化敏感；\n4. 有较强的网感，熟悉年轻用户的语言习惯和内容偏好；\n5. 能够快速理解热点事件，并找到有吸引力的文案切入角度；\n6. 具备较强的原创意识，不依赖简单搬运和机械改写；\n7. 能熟练使用AI工具辅助创作，但具备独立思考和人工创意能力；\n8. 有爆款标题、爆款文章、热门评论或自媒体运营经验者优先。", "cat": "内容与创作"}, {"id": "314", "title": "编辑专员", "salary": "7K-10K", "location": "远程，可国内办公", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；针对、911爆料、91爆料、黑料吃瓜网等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "315", "title": "舆情收集员", "salary": "7k-15k", "location": "远程，可国内办公", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "316", "title": "AI视频创作（AI成人短剧方向）", "salary": "15K-20K（优秀面议）", "location": "远程，可国内办公", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\n优先考虑：\n1.有成熟AI视频作品集。\n2.有完整AI工作流搭建经验。\n3.有自动化（ComfyUI Workflow、API、脚本）经验。\n4.熟悉PR、AE、CapCut等后期工具。\n5.有团队协作及项目经验。\n\n面试要求：\n近三个月代表作品（图片或视频均可）\n工作流截图（ComfyUI等）\n常用模型及LoRA介绍\n常用Prompt示例\n独立完成的项目案例", "cat": "内容与创作"}, {"id": "317", "title": "舆情收集员", "salary": "10K-15K（优秀面议）", "location": "远程，可国内办公", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "318", "title": "AI视频创作（AI成人短剧方向）编剧", "salary": "10K-20K（优秀者可面议）", "location": "远程，可国内办公", "jd": "# AI短剧编剧\n\n## 岗位职责\n\n1. 负责AI短剧的选题、人物设定、剧情大纲、分集剧本及对白创作。\n2. 根据AI视频生成特点设计剧情、场景和人物动作，保证内容具备较强可执行性。\n3. 负责短剧开场钩子、冲突、反转、情绪递进及结尾悬念设计。\n4. 配合AI生成、剪辑及运营团队完成剧本落地，并根据数据反馈持续优化内容。\n5. 持续关注热门短剧、短视频及AI内容趋势，提升内容产出效率和点击表现。\n\n## 任职要求\n\n1. 2年以上短剧、网文、短视频或相关内容创作经验。\n2. 能独立完成故事大纲、人物设定及完整短剧剧本。\n3. 熟悉短剧节奏，具备较强的冲突、反转及对白设计能力。\n4. 有较强画面感，能够将剧情拆解成人物、场景、动作及镜头。\n5. 了解AI图片、AI视频生成逻辑，能够根据AI制作特点优化剧本。\n6. 网感强，熟悉热门内容及用户观看习惯。\n\n## 优先考虑\n\n1. 有成熟短剧或网文作品。\n2. 有AI短剧、真人短剧相关经验。\n3. 能完成分镜脚本或AI视频Prompt拆解。\n4. 有爆款内容或系列化项目经验。\n\n## 面试要求\n\n* 近期代表剧本或作品\n* 1个完整项目案例\n* 现场完成简单选题或剧情大纲测试", "cat": "内容与创作"}, {"id": "319", "title": "AI视频创作（AI成人短剧方向）", "salary": "10K-20K（优秀者可面议）", "location": "远程，可国内办公", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\n优先考虑：\n1.有成熟AI视频作品集。\n2.有完整AI工作流搭建经验。\n3.有自动化（ComfyUI Workflow、API、脚本）经验。\n4.熟悉PR、AE、CapCut等后期工具。\n5.有团队协作及项目经验。\n\n面试要求：\n近三个月代表作品（图片或视频均可）\n工作流截图（ComfyUI等）\n常用模型及LoRA介绍\n常用Prompt示例\n独立完成的项目案例", "cat": "内容与创作"}, {"id": "320", "title": "AI短视频编剧", "salary": "15k-25k", "location": "远程，可国内办公", "jd": "岗位职责：\n\n一、故事策划。根据项目定位及目标用户，完成题材研究、故事构思、世界观设定和整体内容规划。\n\n二、剧本创作。独立完成故事大纲、人物小传、分集梗概及完整剧本，确保剧情结构完整、逻辑合理。\n\n三、人物塑造。设计主要人物的背景、性格、动机及成长线，保证人物行为符合设定并具备辨识度。\n\n四、情节设计。负责冲突、悬念、反转、高潮及结局设计，强化故事吸引力和连续观看动力。\n\n五、对白创作。根据人物身份和情境设计自然、准确且具有记忆点的对白，避免人物语言同质化。\n\n六、剧本修改。根据审核意见、制作条件和数据反馈调整剧情、节奏、人物关系及台词，跟进至最终定稿。\n\n七、制作协同。与导演、运营、剪辑、美术及AI制作人员对接，将剧本转化为可执行的分镜和制作方案。\n\n八、内容研究。持续研究热门题材、用户偏好、平台趋势及优秀作品，沉淀故事结构、人物设定和剧情案例库。\n\n九、原创内容孵化。围绕平台方向开发原创故事、系列短剧、人物IP及可持续扩展的内容项目。\n\n十、数据复盘。结合播放量、完播率、留存率、互动率等数据，分析剧情表现并优化后续创作。\n\n十一、AI工具应用。使用AI辅助资料整理、创意发散、设定验证和初稿梳理，坚持“AI提升效率，编剧负责原创、判断和最终质量”。\n\n任职要求：\n\n一、3年以上编剧、影视策划、短剧创作、小说创作或相关内容工作经验。\n\n二、具备独立完成故事大纲、人物小传、分集梗概和完整剧本的能力。\n\n三、熟悉故事结构、人物弧光、戏剧冲突、悬念设置、节奏控制及情绪推进。\n\n四、文字功底扎实，具备较强的场景描写、人物塑造和对白创作能力。\n\n五、对短剧、网络影视、短视频及主流内容平台具有较强敏感度，了解用户观看习惯。\n\n六、具备较强的原创能力，能够围绕明确题材持续产出故事，不拼接、不抄袭、不依赖模板化生成。\n\n七、能够根据制作预算、拍摄条件、平台规则及审核意见调整剧本，兼顾创意与落地性。\n\n八、具备良好的沟通协作能力，能够与导演、运营、剪辑、美术及制作团队高效配合。\n\n九、有上线作品、热门短剧、成熟剧本或系列内容项目经验者优先。\n\n十、有悬疑、情感、都市、喜剧、成人向或强情节短剧创作经验者优先。\n\n十一、能够熟练使用AI工具辅助创作，但必须具备独立判断、深度修改和原创把控能力。\n\n作品要求：\n\n一、应聘时需提供至少1—2部本人主创的完整作品或剧本片段。\n\n二、作品需能够体现故事结构、人物塑造、情节设计和对白能力。\n\n三、如作品已上线，请补充本人承担的具体职责及可验证的作品信息。", "cat": "内容与创作"}, {"id": "321", "title": "AI视频创作（AI成人短剧方向）", "salary": "15K-20K（优秀面议）", "location": "远程，可国内办公", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\n优先考虑：\n1.有成熟AI视频作品集。\n2.有完整AI工作流搭建经验。\n3.有自动化（ComfyUI Workflow、API、脚本）经验。\n4.熟悉PR、AE、CapCut等后期工具。\n5.有团队协作及项目经验。\n\n面试要求：\n近三个月代表作品（图片或视频均可）\n工作流截图（ComfyUI等）\n常用模型及LoRA介绍\n常用Prompt示例\n独立完成的项目案例", "cat": "内容与创作"}, {"id": "322", "title": "舆情收集员", "salary": "8K-15K（优秀面议）", "location": "远程，可国内办公", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "323", "title": "编辑专员", "salary": "7K-10K", "location": "远程，可国内办公", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；针对、911爆料、91爆料、黑料吃瓜网等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "324", "title": "产品经理", "salary": "18-26k", "location": "远程，可国内办公", "jd": "一、岗位职责\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等工具，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4. 具备一定的团队管理经验，能够指导中初级产品成员开展工作，提升团队整体专业能力。\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n\n二、任职要求\n1. 本科及以上学历，产品、计算机、设计等相关专业优先。\n2. 5 年以上互联网/软件产品经理经验，至少具备 1 个从 0-1 独立负责并成功落地的项目经验。\n3. 熟练使用 Axure、墨刀、Figma 等原型工具，能独立完成 高保真交互原型设计，理解 UI/视觉基本规范及呈现逻辑。\n4. 具备 业务理解能力与数据分析能力，能够将业务需求转化为可实现的产品方案。\n5. 具备一定的 团队管理能力或带队经验，可以指导新人并进行工作拆解与质量把控。\n6. 具备良好的沟通能力、推动能力和跨部门协作能力，能够在多方需求中进行合理取舍与决策。\n7. 具备较强的文档能力，能够输出高质量的 PRD、交互文档、需求分析等。\n8. 抗压能力强，责任心强，具备较强的自驱力与主人翁意识。\n三、加分项\n1. 有大型互联网公司产品经验者优先。\n2. 有消费品、电商、社交、内容平台等行业经验者优先。\n3. 具备用户增长、商业化等方向项目经验更佳。\n4. 具备 UED/交互设计背景或视觉审美能力突出者优先。", "cat": "产品与管理"}, {"id": "325", "title": "SEO专员", "salary": "10-18k", "location": "远程，可国内办公", "jd": "一、岗位职责\n1、负责公司多个网站的 Google、Yandex SEO优化及日常维护，持续提升网站收录、关键词排名及自然搜索流量。\n2、负责网站日常SEO巡检及数据监控，通过 Google Search Console、GA4、Yandex Webmaster 等工具监控收录、排名、流量、Spider抓取及异常波动。\n3、负责网站基础及技术SEO优化，包括 TDK、H标签、Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL路由、分页、Tag、内链、结构化数据、HTML源码输出等。\n4、负责自然搜索流量下降、关键词排名下降、收录异常、404、异常URL、Spider抓取异常等问题的排查，并能够根据数据定位原因及提出解决方案。\n5、负责网站域名迁移、CDN域名、直连域名及多域名SEO相关工作，配合处理301重定向、域名规范、搜索引擎抓取、索引及流量承接等问题。\n6、根据SEO问题独立整理优化需求，与运营、产品、前端、后端及技术人员进行沟通，并负责测试服验收、正式服复查及上线后的数据验证。\n7、参与新站及网站重构项目SEO建设，制定和检查 URL、TDK、H标签、Sitemap、Robots、Tag体系、结构化数据及页面模板等基础SEO规范。\n8、负责关键词挖掘、竞争站分析、页面关键词优化及外链资源建设，持续扩大关键词覆盖及自然搜索流量。\n9、使用 ChatGPT、Claude、AI/SEO工具辅助数据分析、站点巡检、Spider模拟、异常URL筛选及需求整理，提高SEO工作效率。\n二、任职要求\n1、1年以上SEO实操经验优先，有独立负责网站SEO项目经验，有实际收录、关键词排名或自然搜索流量提升案例。\n2、熟悉 Google SEO基本机制，有 Yandex SEO实操经验优先。\n3、熟悉 GSC、GA4、Yandex Webmaster 等SEO及数据分析工具，能够独立完成基础数据分析。\n4、熟悉 Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL、Tag、结构化数据等技术SEO基础。\n5、能够看懂基础HTML源码及HTTP状态码，具备Spider抓取、页面状态及技术SEO问题的基本排查能力。\n6、具备一定前后端开发基础者优先，能够看懂基础 HTML、JavaScript 及常见前后端页面逻辑；理解服务端渲染、接口请求、URL路由、HTTP状态码及缓存等基础概念，能够初步判断SEO问题属于前端渲染、后端逻辑还是服务器/CDN配置问题。\n7、具备较好的数据分析及问题定位能力，面对流量、收录、排名异常时，能够从数据、页面、域名、抓取及技术实现多个维度进行排查。\n8、能够独立编写SEO需求文档，并与运营、产品及技术团队沟通推进开发、测试及上线验收。\n9、有多站点SEO、CDN、多域名管理、网站迁移、技术SEO经验者优先。\n10、有关键词挖掘、外链建设、Tag/聚合页及页面结构优化经验。", "cat": "运营与市场"}, {"id": "326", "title": "（新媒体）运营专员", "salary": "8-15k", "location": "远程，可国内办公", "jd": "岗位职责：\n1、负责海外社交媒体平台（X、Instagram、Facebook、TikTok、YouTube等）的账号矩阵搭建与日常运营维护\n2、负责多平台内容制作、编辑与发布，包括图文、短视频等内容形式，保持稳定的更新频率\n3、根据平台特性制定差异化内容策略，结合热点进行内容策划与执行，提升账号流量与互动\n4、跟踪并分析各平台运营数据（播放量、互动率、粉丝增长等），输出数据复盘与优化建议\n5、负责账号环境维护与安全管理，包括多账号隔离、养号、风控应对等\n6、配合团队完成跨平台活动策划与执行，推动用户增长与品牌曝光\n7、按要求完成日报、周报等数据汇报，及时反馈运营问题与解决方案\n任职要求：\n1、2年以上社交媒体运营经验，有海外平台（X、Instagram、TikTok、Facebook、YouTube）实操经验者优先\n2、熟悉海外主流社媒平台的算法机制、内容推荐逻辑和运营规则\n3、具备短视频剪辑能力，熟练使用剪映、PR、AE等至少一种剪辑工具\n4、具备基础数据分析能力，能根据数据反馈调整内容方向和发布策略\n5、有AI工具使用经验者优先（如ChatGPT、AI文案生成、自动发布工具、热点采集工具等）\n6、执行力强，能适应高频次内容产出节奏，保证日均发布量\n7、具备多账号并行运营能力，了解指纹浏览器、环境隔离等基础概念者优先\n8、能接受远程办公，保证工作时间在线响应\n加分项：\n1、有成人向/泛娱乐/吃瓜类内容运营经验\n2、有从0到1账号孵化或起号经验\n3、有矩阵账号批量运营经验\n4、熟悉Agent自动化发布流程以及各个平台多节API路径", "cat": "运营与市场"}, {"id": "327", "title": "后端工程师", "salary": "20k-40k", "location": "远程，可国内办公", "jd": "岗位职责：\n\n1、熟悉项目管理以及开发流程，能够根据产品/设计等资料结合需求会议反馈，按时保质保量完成项目迭代开发工作；\n2、具备架构思维能力，能够预判改动所涉及的影响点，独立开展项目安全加固、性能提升等改造工作；\n3、提出自己专业领域内的专业性意见和建议方案，有独立运维中小型项目能力，能够积极储备学习其它领域专业知识；\n4、需要适应一定工作压力，应对突发需求和线上bug，积极响应，与团队一起携手共进；\n5、AI效能领域：熟练使用 Codex/Cursor/Claude 等辅助编程代理，运用一些Agent/RAG等技术实现办公或业务提效。\n\n专业要求：\n\n1、计算机相关工作年限 6年以上；\n2、精通 PHP 语言，熟悉至少 1~2 门PHP 框架（如 Laravel/YAF/YII/Swoole 等），有其它第二后端语言开发能力（如 Golang/Python/Rust 等）； \n2、熟练掌握 MySQL，精通 SQL 查询调优；精通 Redis、Memcached 等开源 nosql 数据库；\n3、掌握 HTML/CSS/JS 以及前端 Vue/React 框架等技术，能够（或在AI辅助下）开展 Admin 业务后台页面开发；\n4、有过 docker/k8s 容器技术经验，入门一些大数据相关知识；\n5、加分项：媒体资讯类行业经验，全栈项目开发经验，有积极维护的开源项目。\n\n岗位要求：\n\n1、有较强的学习能力和主动性，积极响应运营群问题；\n2、良好的团队合作精神和严谨的工作态度；\n3、有一定的 AI Vibe Coding 经验，做过一些 Agent 项目。", "cat": "技术开发"}, {"id": "328", "title": "中高级产品运营", "salary": "15-20k", "location": "远程，可国内办公", "jd": "任职要求：\n1. 3年以上To C产品运营/内容运营经验，有内容平台或流媒体经验优先；\n2. 具备完整项目经验，能够主导负责项目全流程作业；\n3. 熟悉内容平台核心指标及增长逻辑，对用户行为与内容消费路径有深入理解；\n4. 具备扎实的数据分析能力，能够通过数据驱动运营决策与策略调整；\n5. 具备良好的产研跨部门协作能力；\n6. 对二次元、动漫内容有理解，有相关项目经验优先；\n7. 具备较强的执行力与抗压能力，适应快节奏业务环境；\n\n岗位职责：\n1. 负责二次元视频流媒体APP的运营策略制定，围绕内容分发效率、用户增长及会员转化优化；\n2. 制定并可持续迭代内容推荐、活动运营及用户运营策略；\n3. 以核心身份参与To C项目运营；\n4. 具备深度分析内容表现与用户行为路径的能力；\n5. 协同产品与技术团队，可不断提升产品整体价值；\n6. 搭建并完善数据指标体系，对核心指标（DAU、留存率、转化率等）进行持续监控与迭代优化；\n7. 结合二次元内容特性（番剧、IP、角色、社区文化等），设计差异化运营策略与用户增长路径；\n8. 沉淀可复用的运营策略方法论，协助团队提升效率；\n9. 能及时抓取国内热门次元IP并可利用该IP生成一系列活动", "cat": "运营与市场"}, {"id": "329", "title": "中高级产品运营", "salary": "15-20k", "location": "远程，可国内办公", "jd": "任职要求：\n1. 具备产品运营、用户运营、增长运营等相关经验。\n2. 具备较强的数据分析能力、策略判断能力和结果导向意识。\n3. 熟悉活动运营、转化优化、留存提升等核心运营模块。\n4. 具备较强的资源统筹和项目推进能力，能够协同多方推动复杂事项落地。\n5. 有互联网内容平台、社区平台或增长型产品相关经验者优先。\n6. 对二次元行业有较高兴趣和理解，熟悉二次元用户文化，对圈层热点和内容趋势敏感。\n7. 有二次元产品、内容平台、社区平台，或漫画 / 动漫 / 小说相关行业经验者优先。\n8. 对 Agent 工作流有一定认知，认可智能化协作方式，并具备主动学习和应用意识。\n\n岗位职责\n1. 搭建并优化内容供给结构、用户分层及增长模型，围绕新增、转化、留存等核心指标推动产品持续增长。\n2. 建立并完善产品运营数据指标体系，独立开展经营分析，输出问题判断、优化建议及阶段性策略支持。\n3. 结合产品定位和用户特征，制定周期活动、大促机制及长期激励体系，提升用户参与度、转化效率和留存表现。\n4. 围绕内容运营、用户运营、活动运营和转化优化等方向，推动产品运营策略落地执行，并持续跟踪效果、迭代优化。\n5. 协同多部门团队，推进重点项目、功能优化和增长策略落地，提升整体推进效率。\n6. 具备二次元用户和内容理解能力，熟悉漫画、动漫、小说、同人及IP话题等内容生态与用户表达方式。", "cat": "运营与市场"}, {"id": "330", "title": "中高级产品运营（加急）", "salary": "10-35k", "location": "远程，可国内办公", "jd": "任职要求：\n1. 5年以上互联网产品运营经验，有漫画/动漫/影视类产品从0到1运营经验优先；\n2. 对二次元文化（ACGN）有深入理解，熟悉ACGN用户行为及消费习惯；\n3. 数据驱动：能建立内容价值评估体系，通过数据建模解决结构性增长问题，驱动分发算法优化；\n4. 内容策略：具备S级内容全生命周期运营能力，有跨品类影漫游联动或破圈营销经验优先；\n5. 资源整合：具备大型跨部门项目主导经验，能平衡多方利益，有版权方/KOL资源优先；\n6. 创新落地：主导过AI辅助运营、流程优化或运营模式创新项目，有实际落地案例优先。\n\n岗位职责：\n1. 负责产品从0到1的运营搭建，制定产品增长策略及冷启动方案，推动DAU/新增/留存等核心指标达成；\n2. 负责内容全生命周期运营，包括内容引入、分发策略、标签体系、推荐算法优化，提升内容消费CTR及完读率；\n3. 制定并执行用户付费转化方案（VIP会员/漫画卡券/订阅等），提升ARPU值及付费转化率，保障商业化ROI达标；\n4. 定期输出ACGN行业趋势报告，监控竞品动态，维护核心二次元社群，建立创作者/KOL分发矩阵；\n5. 主导跨部门协作（技术、商务、渠道），推动项目关键节点100%达成；\n6. 输出标准化运营SOP，提升团队整体效率。", "cat": "运营与市场"}, {"id": "331", "title": "中高级产品内容运营", "salary": "10-35k", "location": "远程，可国内办公", "jd": "任职要求：\n1. 有3-5年成人行业工作经历\n2. 有完整参与或主导内容项目/产品从0到1或增长阶段的经验\n3. 具备较强的数据分析能力（能独立拆解问题并提出策略）\n4. 熟悉内容生产流程，具备内容判断与筛选能力\n5. 执行力强，能推动事情落地，沟通能力强，能跨团队协作，抗压能力强，适应快节奏环境\n\n岗位职责：\n1. 内容增长与策略执行：承接整体运营策略，围绕拉新、留存、转化、变现等核心指标推进落地\n2. 持续优化内容结构，提升点击率、留存率及付费转化\n3. 日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略\n4. 内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，优化内容结构（封面、标题、前3秒、标签等关键环节）建立可复用的内容生产标准与方法论\n5. 跨部门协作：与产品、技术、渠道等团队协同。推动内容相关功能优化与产品迭代", "cat": "内容与创作"}, {"id": "332", "title": "中高级产品运营（加急）", "salary": "10-35k", "location": "远程，可国内办公", "jd": "任职要求：\n1. 有3-5年成人行业工作经历\n2. 有完整参与或主导内容项目/产品从0到1或增长阶段的经验\n3. 具备较强的数据分析能力（能独立拆解问题并提出策略）\n4. 熟悉内容生产流程，具备内容判断与筛选能力\n5. 执行力强，能推动事情落地，沟通能力强，能跨团队协作，抗压能力强，适应快节奏环境\n\n岗位职责：\n1. 负责产品从0到1的运营搭建，制定产品增长策略及冷启动方案，推动DAU/新增/留存等核心指标达成\n2. 负责产品增长与变现，围绕用户增长（拉新）+内容留存+付费转化，推动内容体系持续优化与规模化产出。\n3. 承接整体运营策略，围绕拉新、留存、转化、变现等核心指标推进落地\n4. 日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略\n5. 内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，活动策划等\n6. 跨部门协作：与产品、技术、渠道等团队协同。推动产品相关功能优化与产品迭代", "cat": "运营与市场"}, {"id": "333", "title": "AI内容编辑（加急）", "salary": "18K – 25K", "location": "远程，可国内办公", "jd": "AI内容编辑（创作 / 漫改 / 魔改方向）\n\n岗位方向\n\n我们正在组建AI驱动的动漫、漫画内容团队。\n\n\n\n剧本内容由专门的剧本团队负责，本岗位主要负责将已有的剧本、分镜及内容创意，通过AI工具转化为动漫、漫画、短视频等视觉内容。\n\n\n\n我们不要求候选人一开始就具备非常完整的AI技术栈，更关注实际内容制作能力、基础视觉审美，以及对新工具、新工作流的学习和落地能力。\n\n\n\n有动漫、漫画、短视频、设计、AI创作等相关经验者优先考虑，其他类型经验如具备相关作品或较强学习能力，也可以投递。\n\n简历及作品要求\n\n投递时请提供简历及相关作品。\n\n\n\n作品形式不限，可以是：\n\n\n\nAI漫画、AI图片、AI短片；\n\n角色设计、场景设计；\n\n个人练习作品；\n\n商业项目或团队项目作品。\n\n\n\n不强制要求作品必须为独立完成，只要能够体现个人实际制作能力即可。\n\n\n\n如有以下内容，也欢迎一并提供：\n\n\n\nAI内容制作过程或工作流截图；\n\nComfyUI、Stable Diffusion等工具使用案例；\n\n个人运营的新媒体账号及相关作品数据。\n\n岗位职责\n\n根据剧本团队提供的脚本、分镜或内容需求，完成AI动漫、AI漫画、AI短视频等内容制作。\n\n\n\n使用AI绘图、AI视频等工具完成人物、场景及画面的生成、调整和优化，保证整体视觉效果符合项目要求。\n\n\n\n配合团队优化角色一致性、画面风格及内容呈现效果，提高内容制作效率。\n\n\n\n根据项目需要，对已有AI工作流进行使用、调整和优化。\n\n\n\n参与内容选题、IP方向及视觉风格讨论，从画面呈现及用户审美角度提供建议。\n\n\n\n持续关注AI绘图、AI视频领域的新模型、新工具及新玩法，并尝试应用到实际内容生产中。\n\n\n\n与剧本、运营及相关团队协作，根据反馈持续调整和优化内容。\n\n任职要求\n\n有AI绘图、AI视频、设计、动漫制作或其他相关内容创作实践经验，能够提供相关作品。\n\n\n\n使用过一种或多种主流AI创作工具，例如ComfyUI、Stable Diffusion、Midjourney、即梦、Kling、Vidu、Runway等。\n\n\n\n具备基本的图片或视频生成、调整能力，能够根据需求修改提示词、参数或现有工作流。\n\n\n\n对画面效果有基本判断能力，能够关注人物、构图、风格统一及内容呈现。\n\n\n\n学习能力较强，愿意主动学习新的AI模型、插件及内容制作方法。\n\n\n\n具备良好的沟通和协作能力，能够根据项目反馈及时调整作品。\n\n加分项\n\n有ComfyUI工作流搭建或优化经验。\n\n\n\n了解或使用过LoRA、ControlNet、IPAdapter等工具。\n\n\n\n有AI动漫短剧、AI漫画、条漫、漫改或小说改编项目经验。\n\n\n\n有角色一致性、批量出图、AI视频动态化等实际制作经验。\n\n\n\n会使用AE、Live2D、Blender、Nomad等设计或动画工具。\n\n\n\n有Python、自动化或批量内容处理经验。\n\n\n\n对动漫、漫画、二次元内容感兴趣，具备一定的视觉审美和内容判断能力。\n\n\n\n有二次元、新媒体、动漫账号运营经验，或对动漫、漫画、轻小说等内容趋势较为熟悉。", "cat": "内容与创作"}, {"id": "334", "title": "新媒体运营", "salary": "6k-10k", "location": "远程，可国内办公", "jd": "\"必须项\n简历➕运营数据或者案例\n运营过的账号案例\n 爆款内容链接\n 常用社媒平台ID（可选）\n 最喜欢的动漫/作品（加分项）\n 2年以上新媒体运营经验，有团队管理经验优先；\n 重度二次元用户，熟悉动漫、游戏、VTuber、Cosplay、同人文化等；\n 网感强，懂年轻人表达方式和互联网语境；\n 熟悉国内外主流社媒平台运营逻辑；\n 有成功账号运营案例或爆款内容经验；\n 具备优秀的内容策划与文案能力。\n加分项\n\n 有ACG、自媒体、动漫行业经验；\n 熟悉海外二次元社区文化；\n 有AIGC内容工具使用经验；\n 自己运营过账号；\n 懂梗、会玩梗、熟悉互联网亚文化。\"\n\"岗位职责\n\n 内容运营\n\n 负责公司二次元/动漫相关新媒体账号运营；\n 策划并输出符合年轻用户审美的内容，包括但不限于：\n\n   动漫热点\n   二创内容\n   meme梗图\n   角色向内容\n   圈层热点话题\n 根据不同平台特性制定内容策略，提升曝光、互动与粉丝增长；\n 独立完成热点策划与内容传播。\n\n\n\n 平台运营\n\n负责国内外社媒平台的内容运营与账号增长，包括但不限于：\n\n 国内平台\n\n B站\n 微博\n 小红书\n 抖音\n 微信公众号\n LOFTER\n\n 海外平台\n\n X（Twitter）\n TikTok\n Instagram\n YouTube\n Discord\n Reddit\n\n\n\n 用户与社区运营\n\n 深度理解二次元用户生态与圈层文化；\n 维护社区氛围，提高用户活跃度与粘性；\n 快速追踪ACG热点与用户情绪变化；\n 与UP主、Coser、绘师、KOL等建立合作关系。\"", "cat": "运营与市场"}, {"id": "335", "title": "UI设计师", "salary": "20k - 30k", "location": "远程，可国内办公", "jd": "一、岗位职责\n 1. 负责 Web/App 端界面 UI 视觉设计，产出高质量、可落地的 Figma 原型，并参与或主导 设计系统（Design System） 的搭建与维护（颜色、字体、间距、组件规范等）。\n 2. 负责公司日常运营视觉设计输出，包括但不限于：活动海报、Banner、专题页、推广图、品牌宣传物料、节日活动图等（日常工作中运营类设计约占60%，界面UI约占40%）。\n 3. 根据产品调性，完成 icon、logo、水印、启动页、落地页 等产品上线前所需物料，并按运营需求产出高质量视觉内容（活动弹窗、推广图等）。\n\n二、任职要求\n 1. 5年以上设计经验，精通 Figma，有实际从0到1建设或维护 设计系统（Design System） 的经验。\n 2. 熟练使用 AI 设计工具（Midjourney / ChatGPT / Agent 等），能够辅助创意生成与设计提效。\n 3. 熟练使用 Photoshop、Illustrator、Figma 等主流设计工具，具备良好的设计执行能力与规范意识。\n 4. 能高效配合运营、策划、产品等相关部门，在较快节奏下完成设计需求落地，并根据反馈及时优化迭代。\n\n三、作品集要求（投递必附）\n请随简历附上近期作品集（PDF或链接），需包含：\n • Web / App 界面设计案例\n • 运营类视觉设计案例（活动页、Banner、弹窗等）\n • （可选）设计系统 / 组件库相关产出", "cat": "内容与创作"}, {"id": "336", "title": "高级产品经理", "salary": "18k-35k", "location": "远程，可国内办公", "jd": "一、岗位职责：\n\n1. 负责付费内容APP（漫画/视频/动漫/小说等）整体产品规划、功能设计及版本迭代，业务覆盖多元内容形态，主导产品路线图制定与执行；\n2. 深入分析用户需求、市场趋势与竞品动态，制定产品发展策略，明确核心功能定位与迭代优先级；\n3. 持续优化现有变现体系（会员订阅、付费内容、广告等），平衡用户体验与商业变现，推动项目收益最大化；\n4. 对DAU、留存率、付费转化率等核心业务指标全面负责，建立数据监控与归因体系，持续推动指标提升；\n5. 熟悉内容产品「生产—分发—消费」全链路闭环，主导内容标签体系与推荐策略的建设与持续优化；\n6. 结合AI能力为业务赋能提效，将AI工具合理融入内容推荐、数据分析及产品设计日常工作；\n7. 与设计、研发、运营、市场等团队紧密协作，高效推动跨部门项目按期高质量落地；\n8. 持续跟踪行业动态与新技术趋势，探索差异化产品创新方向，保持产品竞争力；\n\n二、任职要求：\n\n1. 5年以上产品经理经验，其中2年以上内容平台产品经理经验，具备完整App产品0到1核心角色经历，独立主导过单一产品线或核心模块的长期迭代；\n2. 具备会员订阅、付费内容等流量变现成功实操经验，熟悉广告、会员、虚拟付费等多元变现模式；\n3. 数据能力扎实，理解数据「产生—收集—使用」完整闭环，有埋点设计、数据指标体系搭建经验，熟练运用A/B测试驱动产品优化，能独立出具数据分析报告，对数据波动具备敏锐感知与正确归因能力；\n4. 对AI能力边界有清晰认知，熟练使用Claude Code / Cursor / Codex等AI生产力工具，并能将AI合理应用于产品设计与日常工作提效；\n5. 具备优秀的跨部门沟通协作能力，能独立承接业务与运营诉求，主导复杂项目高效推进落地；\n6. 对二次元、ACGN内容生态有浓厚兴趣，具备二次元用户消费心理与社区文化认知者优先；", "cat": "产品与管理"}, {"id": "337", "title": "AI动漫短剧编剧", "salary": "18k-25k", "location": "远程，可国内办公", "jd": "AI动漫短剧编剧（小说改编方向）\n\n岗位介绍\n\n本岗位主要负责公司AI动漫短剧项目的剧本创作与小说改编工作。\n\n\n\n公司会提供已有小说、网文内容及基础项目方向，无需自行寻找内容来源。你需要结合AI动漫短剧的内容形式，对原有小说进行故事拆解、人物关系梳理、剧情取舍、节奏调整、结构重组及分集改编，最终输出具备实际制作可行性的短剧剧本。\n\n\n\n岗位核心工作以小说/网文改编为主，需要将篇幅较长、信息量较大的原著内容，转化为节奏更快、冲突更集中、画面表达更明确的AI动漫短剧内容。\n\n\n\n我们不要求候选人必须拥有成熟的AI动漫项目经验，更关注你的故事理解能力、剧情改编能力、短剧节奏感及持续学习能力。\n\n\n\n有短剧、网文、小说、漫画脚本、动漫剧情、影视、剧情短视频、游戏剧情等相关创作经验均可。\n\n岗位职责\n\n阅读并理解公司提供的小说、网文内容，快速梳理主要人物、人物关系、故事主线、核心冲突及内容卖点。\n\n\n\n根据AI动漫短剧的内容形式，对原小说进行剧情取舍、结构调整、节奏优化及适当重构。\n\n\n\n结合项目篇幅，对原著中的支线剧情、人物及事件进行合理删减、合并、前置或调整，使核心剧情更加集中。\n\n\n\n完成故事梗概、人物小传、分集大纲及完整分集剧本创作。\n\n\n\n将小说中的叙述、心理活动、背景介绍等文字内容，转化为具体的场景、人物动作、对白及可视化剧情表达。\n\n\n\n结合不同题材及目标受众，设计具有吸引力的开篇、冲突、爽点、情绪节点、反转、悬念及结尾钩子。\n\n\n\n在保证原故事核心设定和人物逻辑的基础上，对不适合短剧表达的内容进行合理改编。\n\n\n\n配合项目负责人，根据审核及制作反馈，对剧本内容进行修改和优化。\n\n\n\n逐步了解AI动漫制作的基本特点，在创作过程中兼顾人物数量、场景复杂度、动作设计及画面实现难度。\n\n\n\n与项目、制作等团队保持沟通，按计划同步创作进度及可能影响交付的问题。\n\n任职要求\n\n有编剧、网文创作、小说创作、漫画脚本、动漫剧情、短剧、剧情短视频、影视策划、游戏剧情等相关创作经验。\n\n\n\n具备较好的小说阅读和故事理解能力，能够快速提炼人物关系、核心矛盾及剧情重点。\n\n\n\n具备一定的内容改编能力，能够根据短剧篇幅对原小说进行删减、调整、压缩及结构重组。\n\n\n\n对短剧、网文、动漫、漫画等内容形式有一定了解，能够理解快节奏、强冲突、高情绪密度的内容表达方式。\n\n\n\n能够将文字剧情转化为具体场景、人物行为及对白，使剧本具备较好的画面感和制作可执行性。\n\n\n\n具备基本的剧情连续性和人物逻辑判断能力，能够保证改编后故事完整、人物行为合理。\n\n\n\n能够按照项目要求完成创作，并根据审核意见进行合理修改。\n\n\n\n具备良好的沟通、协作及时间管理能力。\n\n\n\n对AI动漫、AI短剧等新内容形式感兴趣，并愿意学习相关制作逻辑。\n\n加分项\n\n有短剧、动态漫、AI动漫或漫画项目经验。\n\n\n\n有小说、网文或成熟IP改编经验。\n\n\n\n有已上线、已制作或能够展示的完整编剧作品。\n\n\n\n擅长长篇小说的剧情压缩、短篇化改编及结构重组。\n\n\n\n熟悉男频逆袭、玄幻、都市、悬疑、复仇、冒险、热血等强情节题材。\n\n\n\n熟悉女频情感、甜宠、家庭、豪门、成长、虐恋等强情绪题材。\n\n\n\n有系列化剧情开发或连续人物塑造经验。\n\n\n\n具备较强的网感，对当前短剧、网文及动漫内容趋势有一定敏感度。\n\n\n\n了解AI图片、AI视频或AI动漫制作流程及基本能力边界。\n\n项目形式\n\n项目以小说、网文改编为主要内容方向，根据原著内容及项目需求进行AI动漫短剧化改编。\n\n\n\n单部短剧原则上约 8集，单集约 3–5分钟。\n\n\n\n具体集数、篇幅及内容结构可根据原著体量、剧情复杂度及实际制作要求进行调整。\n\n\n\n前期以熟悉项目标准及创作流程为主，稳定期月度完成约2部完整短剧，具体根据项目难度及团队排期安排。\n\n\n\n最终剧本需具备较完整的剧情结构、人物逻辑及画面表达，能够支持后续AI动漫制作环节推进。", "cat": "内容与创作"}, {"id": "338", "title": "渠道扩展专员", "salary": "18k-20k", "location": "远程，可国内办公", "jd": "任职要求：\n1：2-3年的渠道扩展经验，硬性条件：必须有播放器，直播，BC，炮台相关行业的投放经验\n2：具备从0-1的扩展能力， 能单独完成，找站，商务洽谈，数据分析，数据优化\n3：熟悉各种广告合作模式，专业术语，懂互联网营销优先\n4：需要级强的执行力与抗压能力，适应快节奏业务环境；\n\n岗位职责：\n1：针对公司缺量的产品进行寻找站点，进行投放。\n2：针对自己的数据进行分析，寻找可优化的方面进行优化调整\n3：配合团队处理其他方面事项", "cat": "运营与市场"}, {"id": "339", "title": "产品经理", "salary": "20-30", "location": "远程，可国内办公", "jd": "一、岗位职责\n\n负责公司核心业务线的产品全生命周期管理：涵盖成人内容平台、AI工具等业务线的产品规划、需求拆解、版本迭代推进。从0到1负责产品方案设计，包括用户路径设计、核心功能、后台配置、支付/订阅体系、内容消费流程、增长转化模块等。\n项目全流程管控：负责产品项目从立项、需求确认、开发、生产、测试/品控到上线交付的全周期管理。制定项目计划（WBS），明确里程碑、交付物和排期，协调产品、研发、设计、测试、运营等跨职能团队，推动需求评审、提测、验收、上线及版本复盘。\n用户与市场洞察：深入分析目标用户、竞品、海外市场趋势及业务数据，输出高质量的产品原型、PRD需求文档、流程图、交互说明、后台配置方案及验收标准。结合订阅产品、内容产品、工具类产品特点，持续优化用户体验和商业化路径（含会员权益、任务激励、邀请裂变、搜索推荐等机制）。\n数据驱动迭代：产品上线后负责关键指标跟踪与分析，包括注册转化、付费转化、留存、充值、内容消费、搜索/推荐效果、渠道ROI、复购等，基于数据快速调整产品策略和增长方案。\n跨部门协同与问题解决：对接运营、投放、客服及业务负责人，快速响应用户反馈、线上问题和业务调整需求。组建并推动跨团队协作，解决协作障碍，确保项目高效落地。\n风险与质量管理：识别项目潜在风险（技术、资源、市场等），制定应对预案；建立质量标准，组织UAT/测试，确保最终交付符合预期。项目结束后主导复盘，沉淀经验并优化流程。\n战略支持：理解公司战略，将业务目标拆解为可执行的产品任务，结合海外市场、灰度业务、Web3、AI及内容商业化趋势，持续推动产品创新与商业化优化。\n\n二、任职要求\n\n统招本科及以上学历，3年以上产品经理经验（5年以上优先），具备完整0-1产品从需求调研到上线复盘的全流程独立负责经验，至少主导过2个以上中大型产品项目。\n有以下任一领域经验优先：成人内容网站/平台、AI工具产品；熟悉C端产品设计，深刻理解用户转化路径、内容消费链路、支付订阅、会员体系、增长机制等。\n优秀的文档与设计能力：能独立输出高质量PRD、原型图、流程图、交互说明、后台配置文档及验收标准，逻辑清晰、结构严谨。\n数据敏感与业务判断力：对注册、付费、留存、复购、渠道效果等核心指标有敏锐洞察，能通过数据驱动产品决策和迭代。\n项目管理与推进能力：具备较强的项目规划、风险管理、资源协调和结果导向能力，能在需求变化快、多线并行、交付周期短的创业环境中高效推动进展。\n沟通协作与领导力：优秀的沟通影响力，能在产品、研发、设计、测试、运营等部门间推动共识，组建虚拟项目团队并有效管理。\n加分项：对海外产品市场、Web3、AI技术、内容商业化及成人内容生态有理解或浓厚兴趣；接受高强度工作节奏，适应模糊边界下的快速决策\"", "cat": "产品与管理"}, {"id": "340", "title": "新媒体运营", "salary": "12-15K", "location": "远程，可国内办公", "jd": "1. 岗位目标\n独立负责国内及海外新媒体矩阵账号，从账号定位、素材判断、 内容发布、达人合作到数据复盘形成完整闭环，并围绕产品UV、转化效率和获客成本持续优化结果\n2. 岗位职责\n1.   矩阵账号运营：独立负责多个账号的定位、搭建、 内容规划、发布节奏、 日常维护和阶段复盘，不是只参与单个账号的局部执行。\n2.   素材判断与优化：从内容池中判断具有爆款潜力的素材，结合平台机制、用户偏好和产品目标完成选题、改编、测试和复用。\n3.   国内外平台运营：根据不同平台的分发机制和公域流量特点调整内容，覆盖国内平台及至少两个海外平台。\n4.   达人合作：独立完成达人筛选、沟通、合作Brief撰写、脚本审核、视频内容验收、修改反馈和合作落地。\n5.   数据跟踪与复盘：持续跟踪浏览、点击或PV、产品UV、转化率和用户成本，能根据数据判断继续放大、调整或停止。\n6.   跨部门协作：与产品及相关团队确认推广链接可访问、数据可归因，并按推广结果推动素材、账号和合作方式调整。\n3. 任职要求\n●   总工作经验不少于3年；其中新媒体相关经验不少于1年，2C业务经验不少于2年。\n●   必须独立负责过矩阵账号运营，能够清楚说明账号数量、本人责任、运营周期、执行动作及最终数据结果。\n●    国内平台做过抖音、B站、小红书或视频号中的一种或多种。\n●   海外平台至少做过TikTok、YouTube、X、Instagram中的两个；有X和TikTok实操经验优先。\n●    网感好，能够判断什么内容具备爆款潜力，并能解释判断依据、测试方式和结果，而不是只凭个人感觉。\n●   理解不同平台的基础机制、公域流量分发方式和目标用户偏好，能够针对平台调整内容。\n●   有独立达人合作经验，能完成合作Brief、脚本及视频审核、沟通修改、验收和效果跟踪。\n●   具备数据意识，能从曝光、点击或PV、产品UV、转化率和获客成本判断问题所在。\n\n4. 加分项\n●    自带可直接对接的KOL或达人资源。\n●   有X、TikTok矩阵从0到1搭建及规模化运营案例。\n●   有通过素材测试、账号匹配或达人合作降低获客成本的明确案例。\n●   能独立完成脚本、Brief、数据复盘或基础可视化报告。\n5. 面试前需提供的证明材料\n●   本人实际参与并负责的相关作品，不要求提供账号登录信息。\n●   至少一个矩阵账号案例，说明平台、账号数量、运营周期、本人职责和结果。\n●   可核验的数据结果，例如浏览、涨粉、点击、转化、产品UV、获客成本或达人合作效果。\n●   达人合作案例中的Brief、脚本、审核反馈或结果复盘，可对敏感信息做脱敏处理。\n6. 筛选标准\n简历初筛必须同时满足\n●   总工作经验≥3年，新媒体经验≥1年。\n●    明确写出独立负责矩阵账号，而不是只写“参与运营”或“协助发布” 。\n●   具备国内平台经验，并具备至少两个海外平台经验。\n●   能够提供作品和数据结果，且能说明本人在结果中的实际责任。\n●   达人合作经历必须包含Brief、 内容审核、沟通修改和验收，不只做资源转交或商务联系", "cat": "运营与市场"}, {"id": "341", "title": "中级产品运营", "salary": "12-20k", "location": "远程，可国内办公", "jd": "1. 负责所属成人向长视频/短视频内容产品的日常运营，对日活、新增、留存、充值等核心数据指标负责。\n2. 执行组长制定的内容运营策略：日常内容更新、分类/专区/模块优化、依照筛选逻辑优化展示效果。\n3. 监控各项产品数据表现，理解各项数据指标的逻辑，并能够依照数据变化情况，及时进行反应以及调整。\n4. 每日进行产品巡检并分析使用体验，确保产品各项功能正常，包含展示与跳转、播放链路、支付流程等，发现异常及时反馈并跟进至解决。\n5. 收集并处理客服反馈、用户问卷等多渠道用户声音，转化为可执行的产品优化建议。\n6. 参与日度/周度/月度数据复盘会议，独立汇报所负责产品的数据表现及问题归因，并提出优化方针。\n7. 能够进行跨部门沟通协同，推进产品迭代与问题排查，对结果闭环负责。\n8. 为产品定制活动方案，能够利用活动达成指定数据指标的提升，并进行复盘与汇总\n\n任职要求\n\n1. 2年以上成人产品运营经验，有付费产品运营经验者优先；\n2. 有产品迭代经验，新品需求文档攥写能力；\n3. 具备较强的内容敏感度，能够保证更新内容具备吸引力，展示方式符合用户审美，具备视频剪辑 / 封面制作能力者优先；\n4. 数据敏感度强，能够做到问题归因以及提出针对性解决措施；", "cat": "运营与市场"}, {"id": "342", "title": "编剧（AI短剧/漫剧方向）", "salary": "15-30k", "location": "远程，可国内办公", "jd": "岗位职责\n1. 负责都市情感、婚姻家庭、女性成长、悬疑反转、银发情感等题材的选题策划与剧本创作。\n2. 完成故事大纲、人物小传、分集梗概、单集剧本及对白。\n3. 设计前三集钩子、单集冲突、集尾悬念和中后段付费卡点。\n4. 根据平台数据和用户反馈，快速调整剧情节奏、人物关系及情绪密度。\n5. 使用大语言模型等AI工具辅助选题、资料整理、剧情推演和版本迭代。\n6. 与AI分镜、视觉、配音、剪辑团队协作，保证剧本具备良好的生成和制作可行性。\n7. 关注主流短剧平台的热门题材及用户趋势。\n任职要求\n1. 具备网文、短剧、漫画、动画、游戏剧情或互动内容创作经验。\n2. 熟悉短剧叙事规律，能够快速建立冲突，并持续制造反转和情绪价值。\n3. 人物关系设计能力强，擅长成年人情感、利益博弈及现实议题。\n4. 能独立完成60—100集短剧的整体架构，单集时长适配3-5分钟。\n5. 具备较强的修改能力，能够接受快节奏、高频迭代的工作方式。\n6. 有版权意识和内容安全意识，能够主动规避低俗、侵权及平台审核风险。\n7. 对AI内容生产有兴趣，愿意持续学习新的生成工具和工作流。\n加分项\n• 有上线短剧、爆款网文或高流水项目经验；\n• 熟悉红果、抖音、快手等平台的内容偏好；\n• 有海外短剧、本地化改编或多语言内容经验；\n• 能使用AI完成角色设定、分镜提示词或视频预演；\n• 拥有可改编IP、成熟题材库或稳定创作搭档。", "cat": "内容与创作"}, {"id": "343", "title": "业务培训专家", "salary": "20K-35K", "location": "远程，可国内办公", "jd": "业务培训专家 JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n负责讲师资格库建设，优先挖掘业务一线 TOP 20% 高手担任兼职讲师，按季度核验讲师业务表现及授课质量，建立动态淘汰机制。\n对接 AI 工具厂商及外部讲师资源，评估其行业案例、ROI 数据及课程适配度，把控外部讲师引入标准。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n按季度组织业务复盘会，与业务一线、HRBP 对齐培训落地效果及业绩归因，持续优化课程内容和演武机制。\n任职要求\n5-8 年业务培训、业务赋能、培训运营或实战教练相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点，不只是做课程交付，而是能围绕业务结果设计培训方案。\n主导过 50 场以上实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n善于调动业务内部高绩效人员担任兼职讲师，能把一线优秀打法转化为可复制、可训练、可考核的课程和 SOP。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "职能与行政"}, {"id": "344", "title": "SOP工程专家", "salary": "20K-35K", "location": "远程，可国内办公", "jd": "岗位职责：\n接收经验萃取组输出的访谈纪要、案例材料和业务动作素材；\n将原始经验加工成标准SOP，包括适用场景、操作步骤、注意事项、验收标准；\n制作配套工具包，如流程图、检查清单、操作模板、话术模板、案例示例；\n参与SOP评审，根据业务负责人和一线骨干反馈进行修改优化；\n维护SOP版本、有效期、复测记录和知识库归档；\n协助搭建知识库，让SOP、案例、工具包可查询、可复用、可迭代。\n任职要求：\n3年以上流程设计、项目管理、产品运营、用户文档、培训内容、知识管理或SOP建设相关经验；\n结构化能力强，能把复杂业务动作拆解为清晰步骤；\n熟悉流程图、检查清单、操作模板、表格、决策树等表达方式；\n文档能力强，能写出简洁、清楚、可执行的SOP；\n注重细节，能发现流程遗漏、表达歧义和执行风险；\n能使用AI工具辅助起草、压缩、排版、流程图生成和工具包制作。\n有从0到1搭建SOP体系、知识库、案例库经验；\n有产品经理、项目经理、运营中台、技术写作、培训设计背景；\n有方法论Toolkit、培训课件、业务工具包制作经验；\n熟悉互联网产品、内容平台、To C业务或AI工具应用者优先", "cat": "技术开发"}, {"id": "345", "title": "业务萃取专家", "salary": "20K-35K", "location": "远程，可国内办公", "jd": "参与集团内各分公司、重点项目组及业务骨干的访谈、调研和复盘，了解业务背景、执行过程、关键动作及结果数据。\n根据访谈和业务资料，整理高质量访谈纪要，提炼核心业务动作、成功经验、失败教训及可复用方法。\n挖掘各产品、项目组、一线业务团队中具有复制价值的优秀打法、亮点案例和关键经验。\n将零散的业务经验和项目资料整理为结构化内容，包括业务背景、问题场景、关键动作、执行步骤、结果数据、适用场景和注意事项等。\n协助搭建并维护经验案例库、战法地图、知识库及待萃取素材清单，持续沉淀集团内部可复用的业务经验。\n与 SOP 工程化组、学习发展部及相关业务团队协作，推动经验素材转化为 SOP、工具包、培训课件、实战训练内容等可落地成果。\n结合业务需求，使用 AI 工具辅助访谈纪要整理、内容提炼、框架搭建和结构化输出，提升经验沉淀效率。\n跟进经验素材的应用反馈，持续优化案例内容、SOP 表达和工具包结构，提升内容的实用性和可复制性。", "cat": "职能与行政"}, {"id": "346", "title": "资深短剧编剧", "salary": "20-35k", "location": "远程，可国内办公", "jd": "【岗位定位】\n负责精品叙事类短剧的创作、评审与方法沉淀；不是简单使用AI生成文本，而是把控人物、逻辑、节奏和可制作性。\n\n【岗位职责】\n• 负责精品短剧、连续剧情及叙事类视频的原创、改编和剧本精修。\n• 完善世界观、人物关系、角色动机、成长线、核心冲突及分集结构。\n• 对AI生成或各业务线提交的剧本进行专业Review，解决人物扁平、逻辑断裂、节奏拖沓和情节雷同等问题。\n• 把控开场钩子、爽点密度、冲突升级、剧情反转和结尾断点。\n• 与AI视频制作人员联合评审，确保执行人员拿到剧本后不需要重新策划。\n• 结合采纳率、成片表现和用户数据，沉淀剧本模板、评审标准和创作方法。\n\n【重点技能】\n剧本结构；人物塑造；短剧节奏；AI剧本精修；剧本质检；制作可行性判断\n\n【任职要求】\n• 具备短剧、影视剧、动画或游戏剧情策划经验，有可核验的上线作品。\n• 具备扎实的剧本基本功，能够独立完成人物塑造、故事结构及分集节奏设计。\n• 有较强的剧本质检能力，能够快速判断剧本的问题、潜力和修改方向。\n• 理解短视频用户习惯，熟悉钩子、爽点、反转、断点和连续追剧动力。\n• 具备良好的审美、逻辑和内容判断力，不依赖AI完成核心创意与专业判断。\n• 能与导演、分镜、AI生成、美术和剪辑人员有效协作。\n\n【优先背景 / 作品要求】\n优先考虑短剧编剧、影视编剧、动画编剧、游戏剧情/文案策划，以及具备影视化改编能力的小说作者。需提供上线作品、脱敏剧本或修改前后版本。", "cat": "内容与创作"}, {"id": "347", "title": "角色IP策划", "salary": "20-35k", "location": "远程，可国内办公", "jd": "【岗位定位】\n负责角色世界观、人物线、关系网和视觉一致性，创造能够持续产生故事并长期被观众记住的角色资产。\n\n【岗位职责】\n• 负责角色IP定位、世界观、人物小传、性格、欲望、恐惧及成长线设计。\n• 搭建角色关系网、核心冲突和可持续发展的剧情空间。\n• 制定角色卡、三视图要求、面部锚点、服装特征、形象参数和素材规格。\n• 建立人格边界、行为规则和禁止清单，避免跨剧集设定冲突。\n• 配合编剧通过角色关系和核心冲突反向开发系列故事。\n• 配合AI工作流团队解决角色跨模型、跨场景和跨镜头的一致性问题。\n• 跟踪角色的参演内容、社媒反馈和业务表现并持续优化。\n\n【重点技能】\n人物塑造；世界观；关系网；长期故事线；视觉锚点；角色一致性；IP运营\n\n【任职要求】\n• 具备影视、动画、游戏、虚拟人或IP内容策划经验。\n• 擅长人物塑造、世界观设计、角色关系和长期故事线规划。\n• 理解三视图、面部锚点、视觉设定及跨场景一致性要求。\n• 能从内容、视觉和运营角度判断角色的长期发展潜力。\n• 原创能力强，能够避免角色同质化、标签化和脸谱化。\n• 具备良好的审美和跨团队协作能力。\n\n【优先背景 / 作品要求】\n优先考虑游戏IP/世界观策划、影视动画角色策划、虚拟偶像或数字人运营背景；有系列角色、角色联动或跨媒体IP经验者优先。", "cat": "内容与创作"}, {"id": "348", "title": "AI视频工作流专家", "salary": "20-35k", "location": "远程，可国内办公", "jd": "【岗位定位】\n熟练操作万桢、FRW及相关AI内容平台，把剧本和角色稳定转化为高质量视频，并沉淀可复制的标准工作流。\n\n【岗位职责】\n• 操作万桢、FRW、无限画布及相关工具，完成剧本到成片的端到端制作。\n• 完成角色、场景、分镜、参考图、图像生成、视频生成、配音、音效和剪辑拼接。\n• 根据项目选择模型、提示词、参考素材、参数和生成方案。\n• 解决角色一致性、动作自然度、镜头衔接、画面稳定性和剧情连贯性问题。\n• 沉淀示例画布、工作流节点、模型选择方法、质检标准和操作SOP。\n• 复盘效率、返工和成片表现，持续优化工作流并培训业务线人员。\n\n【重点技能】\n万桢/FRW；无限画布；多模型组合；角色一致性；分镜与剪辑；流程诊断；SOP与培训\n\n【任职要求】\n• 具备AI视频、AI动画、影视制作、视觉设计或内容后期的实际项目经验。\n• 有完整AI视频或AI动画作品，能够说明从剧本到成片的生产过程。\n• 熟悉文生图、图生视频、文生视频、多模型组合和参考图控制。\n• 理解镜头语言、构图、光影、动作、节奏、声音设计及基本剪辑逻辑。\n• 能够定位工作流问题，并通过调整模型、节点、提示词或素材解决。\n• 具备审美、质量意识、文档沉淀和培训能力。\n\n【优先背景 / 作品要求】\n优先考虑AI视频/动画、影视导演、分镜、动画制作、美术设计、剪辑及后期背景；有无限画布、ComfyUI或多模型节点式工作流经验者优先。", "cat": "内容与创作"}, {"id": "349", "title": "业务萃取专员", "salary": "15-25k", "location": "远程，可国内办公", "jd": "任职要求\n本科及以上学历，不限专业；\n1-3年App运营、产品运营或业务运营相关经验；\n具备较强的逻辑思维与数据分析能力，熟练使用Excel，能独立完成数据复盘与问题归因；\n熟悉App产品逻辑与基础技术概念（如版本管理、灰度发布、配置后台等）；\n跨部门沟通协调能力强，具备良好的项目推进与文档能力；\n细致严谨，责任心强，能在多任务下保证工作质量与时效；\n有结果导向意识，能从业务全局视角提出可落地的优化建议。", "cat": "职能与行政"}, {"id": "350", "title": "SOP工程专员", "salary": "15-25k", "location": "远程，可国内办公", "jd": "岗位职责：\n1、根据项目计划跟进任务、时间节点、负责人及完成情况，维护项目进度台账。\n2、负责会议预约、材料准备、会议纪要、待办整理及会后事项跟进。\n3、协助完成课程教材、项目方案、操作手册、推广文案、海报及通知等内容的整理与发布。\n4、参与AI Agent及相关工具的体验测试，整理功能说明、使用场景、截图、视频和体验报告。\n5、协助开展分公司推广执行，包括群内通知、需求表收集、培训安排、回放分发及使用反馈跟踪。\n6、整理访谈记录、用户反馈和项目数据，按照统一模板完成分类、归档与阶段汇总。\n7、配合项目负责人完成跨部门及分公司对接后的执行事项，及时反馈进度和风险。\n任职要求：\n1、本科及以上学历，3年以上项目运营、内容运营、培训运营、SOP或项目助理相关经验；\n2、执行力强，能够根据明确要求独立完成任务，并主动跟进结果。\n3、具备良好的文字整理能力，能够完成会议纪要、项目台账、需求文档及汇报材料。\n4、熟练使用Office、飞书等办公工具，愿意主动使用AI工具提升工作效率。\n5、做事细致、有责任心，对时间节点和交付质量有较强意识。\n6、具备良好的沟通协作能力，能够同时承接多个项目的执行工作。\n加分项：\n1、有AI Agent、SaaS产品、知识库或自动化工具使用经验；\n2、有课程运营、教材制作、企业培训或分公司推广经验；\n3、具备基础海报制作、视频剪辑或数据整理能力。", "cat": "技术开发"}, {"id": "351", "title": "HR助理（HRBP方向）", "salary": "£25,000 – £30,000 / 年", "location": "远程，可国内办公", "jd": "岗位职责\n业务理解与HRBP支持\n协助总监理解业务运作，识别组织问题并推进相关优化。\n人力规划与招聘支持\n参与人力需求评估及招聘支持，从业务角度判断人员匹配度。\n组织效率提升\n协助推动团队效率及整体组织绩效的提升。\n执行与制度落地\n协助相关工作的落地与跟进，并推动公司制度在各部门执行。\n\n任职要求\n基础要求\n本科及以上学历\n熟练使用办公工具（如Excel、Google Drive、WPS等）\n对使用AI工具提升工作效率具备积极态度\n中文流利\n核心能力\n执行力强，能够推动事情落地\n逻辑能力强，具备清晰的分析与判断能力\n学习能力强，能够快速成长\n候选人背景（需满足以下三类之一）\n人力资源专业背景（优先）\n人力资源管理或相关专业（如人力资源管理、组织管理等以人员与组织为核心的专业），具备扎实理论基础，并希望应用于实际工作\nCIPD发展路径人选\n已完成CIPD Level 3，并正在学习Level 5，对HRBP发展路径有明确规划\n具备管理经验并计划转型HR的人选\n过往工作中有实际带人或团队管理经验，对组织与人员问题有一定理解，有明确意愿转型HR，并计划未来考取CIPD", "cat": "职能与行政"}, {"id": "352", "title": "HRBP", "salary": "¥18K–25K/月,具体依能力面议", "location": "远程，可国内办公", "jd": "岗位职责\n编制管理:对口若干中后台部门,深入了解部门业务,持续评估编制合理性,参与入职审批环节并出具专业意见\n组织诊断与人效分析:定期与所辖部门负责人及团队访谈,诊断组织问题、协助管理改善;基于数据开展人效分析,输出可落地的结论与建议\n例常人事工作:月度组织架构与花名册核对、编制统计、各部门绩效与薪酬激励数据的收集、汇总与初审\n专项支持:组织调整期间的落地支持(员工沟通、去向协调、人员安置)及临时性专项任务\n制度建设:参与团队制度与流程的搭建与优化\n任职要求\n3 年以上 HRBP 相关经验,有组织诊断或人效改善的实际落地案例者优先\n执行力强,例常工作细致零差错,时间承诺可靠\n沟通能力出色:能坦率指出问题,也能维护好跨部门关系,推动问题落地解决\n对数据敏感,书面表达清晰,能独立产出结构完整的分析报告\n适应远程协作,自驱力强\n熟练使用 AI 工具提升工作效率者加分", "cat": "职能与行政"}, {"id": "353", "title": "项目助理 Project Assistant(1–2 名)", "salary": "试用期年薪 £25,000–28,000(按履历与面试表现定档)", "location": "远程，可国内办公", "jd": "主要职责\n商业伙伴关系\n与企业领导者密切合作，了解组织需求、团队结构和绩效挑战。\n组织诊断与问题解决\n找出组织和人员相关问题的根本原因，并提供务实的、以结果为导向的解决方案。\n员工队伍规划与人才决策\n从业务角度领导员工队伍规划、招聘决策和人才评估。\n实施与影响传递\n推动人员计划的执行，并确保组织绩效的可衡量改进。\n人力资源框架捐款（如适用）\n在必要时与相关职能部门（如COE）合作，为人力资源和社会保障框架和最佳实践做出贡献。\n\n要求\n经验\n具有支持业务团队（通常为50名员工）的成熟HRBP经验\n在解决组织或人员相关挑战方面展示了经验\n资格\nCIPD 5级或以上（或同等专业资格）\n核心竞争力\n具有较强的商业敏锐度和利益相关者管理能力\n较强的分析和解决问题的能力\n影响和挑战企业领导者的能力\n以结果为导向，采用务实、亲身实践的方法\n语言\n精通普通话", "cat": "产品与管理"}, {"id": "354", "title": "HRBP", "salary": "45，000英镑至65，000英镑", "location": "远程，可国内办公", "jd": "147", "cat": "职能与行政"}, {"id": "355", "title": "英国法务助理", "salary": "147", "location": "远程，可国内办公", "jd": "147", "cat": "职能与行政"}, {"id": "356", "title": "合规产品经理（工具/社交方向）", "salary": "15-25k", "location": "远程，可国内办公", "jd": "岗位职责\n\n1. 负责海外工具产品及社交产品的产品规划、需求分析、产品设计及版本迭代。\n\n2. 深入分析用户需求及业务目标，制定产品方案，持续优化产品体验及核心指标。\n\n3. 独立完成需求分析、原型设计、PRD编写，并推动研发、设计、测试等团队完成产品交付。\n\n4. 基于产品数据及用户反馈持续优化产品功能，提升用户留存、活跃及商业化能力。\n\n5. 与运营、市场等团队紧密配合，推动产品增长策略落地，支撑业务发展。\n\n6. 持续关注行业趋势及竞品动态，探索产品创新方向。\n\n任职要求\n\n1.本科及以上学历，3年以上互联网产品经理经验。\n\n2.能独立负责产品全生命周期管理，包括需求分析、原型设计、PRD输出、项目推进及上线复盘。\n\n3.有工具产品（AI、壁纸、浏览器、VPN、效率工具等）或社交产品经验优先。\n\n4.具备优秀的产品思维、数据分析能力及业务理解能力，能够通过数据驱动产品优化。\n\n5.具备较强的项目推动能力及跨部门沟通协调能力。\n\n6.对海外产品、AI产品或社区产品有一定理解者优先。\n\n加分项\n海外产品经验\nAI产品经验\n社交产品经验\n多产品并行负责经验\n英语读写能力良好", "cat": "产品与管理"}, {"id": "357", "title": "运营专员", "salary": "8-15k", "location": "远程，可国内办公", "jd": "运营专员（远程）| 8-15K\n\n【岗位职责】\n\n负责 App 日常运营执行，包括内容更新、活动上线、资源位配置。\n负责运营数据日常维护、监测与整理，输出常规报表。\n配合 Web 端运营，协助内容发布、页面维护、收录及引流执行。\n协助活动策划与执行，包括素材协调、上线跟进及数据整理。\n配合完成用户反馈收集、社群维护及日常运营支持。\n协同产品、内容、技术团队，保障运营工作按时落地。\n\n【任职要求】\n\n大专及以上学历，1 年以上互联网运营经验，优秀应届亦可。\n基础数据意识与工具能力（Excel 等），能独立整理数据、做报表。\n做事细致、执行力强。\n良好沟通协作与学习能力，能适应远程办公、主动跟进。\n对内容、社区或视频类产品有兴趣，愿在运营方向长期发展。\n\n【加分项】\n\n有社区产品、播放器产品相关经验者优先。\n有 App 或 Web 端运营执行、内容或社群运营经验。\n具备基础文案、设计或视频剪辑能力。\n有 AI 工具辅助运营或内容工作经验。", "cat": "运营与市场"}, {"id": "358", "title": "中高级产品运营", "salary": "15-25k", "location": "远程，可国内办公", "jd": "中高级产品运营（远程）| 15-25K\n\n【岗位职责】\n\n负责 App 类产品运营策略制定与落地，围绕新增、转化、留存推动增长。\n搭建并完善运营数据指标体系，独立开展经营分析，输出优化建议及阶段性策略。\n建立用户分层与生命周期运营体系，设计差异化激励、留存与转化策略。\n负责活动运营、内容运营及转化优化，独立输出策略方案并推动执行迭代。\n推进重点运营项目落地，协同产品、技术、内容多方，把控优先级与交付质量。\n参与运营体系与方法论建设，沉淀 SOP，提升整体效率。\n\n【任职要求】\n\n大专及以上学历，3 年以上 App 类产品运营经验，有独立操盘项目经验。\n熟悉 App 产品完整运营链路与业务逻辑，能拆解增长与留存问题。\n较强数据分析与策略判断能力，能搭建指标体系、定目标、拆指标。\n熟悉活动运营、用户运营、转化优化等核心模块，能独立负责完整闭环。\n较强资源统筹与项目推进能力，能协同多方推动复杂事项落地。\n较强自驱力与沟通协作能力，能适应远程办公。\n\n【加分项】\n\n有社区产品、播放器产品相关运营经验者优先。\n有内容平台、社区平台或增长型产品运营经验。\n有从 0-1 或规模化增长操盘经验。\n有团队管理或多项目统筹经验。\n有 AI / Agent 工具运营提效经验。", "cat": "运营与市场"}, {"id": "359", "title": "中高级产品经理", "salary": "20K-25K", "location": "远程，可国内办公", "jd": "海外产品经理（AI/社交/工具方向）\n\n岗位职责\n\n1. 负责海外产品0-1建设\n负责海外 APP 产品从需求分析、产品规划、设计开发到上线迭代的完整流程；\n根据目标市场用户需求，完成产品定位、功能规划及版本规划；\n\n独立输出：产品需求文档（PRD）；产品流程图；原型设计；功能验收标准；\n\n推动研发、设计、运营等团队协作，保障产品按计划上线。\n\n2. 负责产品策略及用户体验优化\n\n深入分析海外竞品及用户需求，制定产品优化方案；\n关注用户核心链路并基于数据分析持续优化产品体验。\n\n3. 负责增长及商业化设计结合产品目标设计策略\n\n4. 负责海外市场产品研究，关注欧美、东南亚等海外市场用户需求及行业趋势；研究海外竞品，输出竞品分析、产品策略及增长方案。\n\n5. 跨团队推进项目落地\n协调研发、UI、运营、投放团队推进项目；负责需求优先级管理及版本规划；跟进开发进度、测试验收及上线复盘；对产品最终效果负责。\n\n任职要求\n\n基础要求\n\n3年以上互联网产品经理经验；\n有完整负责产品上线经验；\n熟悉APP产品从0到1流程；\n具备较强的产品规划、需求拆解和项目推进能力。\n\n核心能力要求\n\n1. 产品能力\n熟悉：用户需求分析；产品架构设计；PRD输出；原型设计；数据分析；AB测试。\n\n能够独立完成：一个产品从想法到上线；一个版本从需求到交付。\n\n2. 增长能力\n了解：AARRR增长模型；用户生命周期运营；留存提升策略；付费转化优化。\n\n3. 海外经验优先\n\n优先考虑：海外APP产品经验；欧美市场产品经验；出海社交/工具/AI产品经验；App Store、Google Play上线经验。\n\n加分项\n\n独立负责百万级用户产品经验；\n熟悉海外支付、会员体系、广告变现。", "cat": "产品与管理"}, {"id": "360", "title": "UK中级运营", "salary": "24K-35K", "location": "", "jd": "岗位职责（偏品牌策划）\n1. 负责动漫/漫画及ACG内容的策划、编排与日常运营，维护内容调性与更新节奏，提升阅读、互动、留存与转化等核心指标。\n2. 运营多平台社媒账号矩阵（B站、微博、抖音、小红书、Lofter等），策划话题、专题及二创/UGC活动，提升粉丝活跃度与社区参与度。\n3. 结合IP上线节奏（新番、漫画更新、联动、版本活动等），承接宣发与运营动作，提升内容曝光与用户承接效率。\n4. 独立完成内容及活动全流程，包括选题策划、方案设计、内容包装、上线执行及跨部门协作落地。\n5. 监测内容与活动数据（阅读、互动、转化、留存等），输出复盘报告并持续优化运营策略。\n6. 关注二次元行业趋势与热门作品，挖掘内容机会与传播玩法。\n7. 协同产品、设计、技术团队推动内容与活动需求落地执行。\n\n任职要求：\n1.工作地点在伦敦，需具备合理通勤距离并可稳定到岗，混合办公制\n2.本科及以上学历，优先：QS Top 100 / 海外名校 / 重点院校；新闻传播、市场营销、广告、新媒体、中文、设计等相关专业优先\n3.1–3年内容运营 / 社媒运营 / 用户增长 / IP运营相关经验\n4. 重度二次元用户，熟悉主流动漫、漫画、二次元手游及其社区生态与梗文化（如《原神》《崩坏：星穹铁道》《碧蓝档案》《明日方舟》等）。 \n5. 有较强的文字与内容感知能力，能独立完成策划案、文案与活动方案。 \n6. 数据敏感，会用基础数据工具做分析与复盘。 7. 执行力强、沟通顺畅，能在快节奏下推进多个项目并行。\n\n加分项\n1.重度二次元用户，有长期ACG内容消费与社区参与经验，优先考虑自带二创博主资源\n2.有爆款内容或话题/活动案例\n3.熟悉Lofter、Pixiv、B站创作生态或海外同人社区\n4.有IP宣发或泛娱乐内容推广经验\n5.有AI工具辅助内容生产或运营经验\n6. 擅长SEO的加分", "cat": "运营与市场"}, {"id": "361", "title": "资深UI/UX设计师", "salary": "15-20K", "location": "远程，可国内办公", "jd": "1、资深UI/UX设计师\n\n薪资范围：15-20k\n计划招聘人数：1人\n岗位职责：\n独立负责海外APP从0到1的全链路UI/UX设计，包括需求理解、用户体验分析、交互方案、视觉设计、设计交付及上线验收；\n重点承接Bible、社交等产品方向，根据产品定位及目标市场用户特征输出完整设计方案；\n搭建并持续维护Design System、组件库及设计规范，保障多产品、多端设计的一致性及后续快速复用；\n负责核心页面及关键链路的高质量视觉设计，关注动效、微交互及细节体验，保证最终上线效果与设计方案一致；\n根据海外竞品、用户反馈及产品数据持续进行体验优化，协助提升用户注册、留存、互动及付费转化；\n与产品经理、运营及研发紧密协作，参与需求及设计评审，主动推进开发落地、设计验收及问题闭环；\n针对Bible等宗教文化类产品，在尊重目标用户文化背景的基础上，探索兼具庄重感、现代感及品牌辨识度的视觉表达。\n任职要求\n3年以上移动端UI/UX设计经验，具备完整APP从0到1设计及上线经验，能够独立承担完整产品设计；\n作品集为核心筛选条件，至少包含1个已上线完整项目，能够清晰展示从需求理解、方案推演到最终设计落地的完整过程；\n视觉基本功扎实，对布局、色彩、字体排印、图标、组件及整体视觉体系有较高要求；\n熟练使用Figma，具备Design System、组件库搭建或深度维护经验，能够进行组件化设计及团队协作交付；\n具备较强的UX及产品思维，不仅能够完成视觉执行，也能够发现产品体验问题并独立提出解决方案；\nOwnership意识强，能够在多项目并行及较快迭代节奏下独立推进工作并对最终交付结果负责；\n逻辑及沟通能力较强，能够说明设计决策依据，并高效完成产品、运营及研发之间的协作；\n具备良好的英文阅读能力，能够独立完成海外竞品走查及理解海外用户反馈。", "cat": "内容与创作"}, {"id": "362", "title": "信息流广告设计师", "salary": "18-25K", "location": "远程，可国内办公", "jd": "一、岗位职责\n负责公司海外产品的信息流广告素材设计，包括 Meta、Google、TikTok 等海外广告平台的图片、视频、动图、落地页素材等；\n根据产品定位、目标用户及投放市场，独立完成广告素材的创意策划、视觉设计及迭代优化；\n深入理解海外用户审美及不同国家、地区的内容偏好，能够针对欧美、东南亚、中东等市场进行差异化素材设计；\n与广告投放、产品、运营团队协作，根据 CTR、CVR、CPI、CPA、ROAS/ROI 等投放数据分析素材表现，并持续进行素材优化；\n负责广告素材的批量生产及A/B测试，根据数据快速迭代高潜素材，提升素材点击率、转化率及投放效率；\n关注海外广告市场及竞品素材趋势，持续研究 Meta、TikTok、Google等平台热门广告素材、创意形式及用户内容趋势；\n能够从用户痛点、产品卖点及商业化目标出发，主动提出广告创意，而不仅仅是根据需求执行设计；\n建立并持续完善广告素材库、素材标签及优秀案例库，提高团队素材生产效率。\n二、任职要求\n3年以上信息流广告设计、广告创意设计或买量素材设计经验，有成熟的海外广告素材作品；\n熟悉 Meta、Google、TikTok 等海外广告平台的素材规范及常见广告形式；\n有较强的视觉表现力和广告创意能力，能够独立完成从创意 → 设计 → 测试 → 数据复盘 → 迭代的完整流程；\n对广告素材有较强的数据意识，能够理解CTR、CVR、CPA、CPI、ROAS等核心投放指标，并根据数据判断素材问题；\n熟悉 Photoshop、Figma、Illustrator、After Effects、Premiere 等设计/视频工具中的一种或多种；\n有较强的海外用户审美判断能力，对欧美年轻用户的视觉风格、广告表达及内容趋势有一定理解；\n有 社交、AI、游戏、工具、内容类产品海外买量素材经验者优先；\n有短视频广告、UGC广告、AI生成素材经验者优先；\n具备较强的执行力和抗压能力，能够适应快速测试、快速迭代的工作节奏；\n能够接受以投放数据和实际转化效果作为素材评估的重要标准。\n三、我们希望你具备的能力\n创意能力 > 视觉能力 > 数据意识 > 执行效率\n我们不希望招聘一个单纯“把图做得好看”的设计师，而是希望找到能够理解买量逻辑的广告设计师。\n你需要能够回答：\n这个素材为什么用户会点击？\n用户看到的第一眼卖点是什么？\n为什么这个素材CTR高？\n为什么点击高但注册/付费低？\n同一个产品，欧美和东南亚应该怎么做素材差异化？\n如何通过10～20个素材快速找到有效方向？\n一个素材跑出来以后，如何继续拆解、变体和放量？\n四、加分项\n有海外信息流广告素材爆款案例；\n有实际素材数据案例，可提供投放前后CTR、CVR、CPA、ROAS等数据变化；\n有AI伴侣、Dating、社交、游戏、内容类产品经验；\n有UGC、真人口播、剧情类短视频广告经验；\n熟悉 Midjourney、即梦、Runway、可灵、ChatGPT 等AI创作工具；\n有从0到1搭建广告素材体系或素材团队经验。\n五、薪资福利\n薪资：18K–25K/月\n具体薪资根据候选人的作品质量、海外买量经验、数据能力及实际项目案例综合评估。\n优秀候选人可进一步面议。", "cat": "内容与创作"}, {"id": "363", "title": "动漫产品经理", "salary": "20-25K", "location": "远程，可国内办公", "jd": "产品经理（内容社区 / 泛娱乐方向）\n薪资范围：20–25K\n岗位职责：\n1. 负责公司内容产品的整体规划与持续迭代，覆盖 App 端及 Web 端，结合业务目标制定产品路线、版本计划和需求优先级，并推动方案落地。\n2. 深入理解用户在内容发现、搜索筛选、播放阅读、收藏追更、互动社区及个人中心等场景中的需求，持续优化核心使用路径和产品体验。\n3. 独立完成用户调研、竞品分析、需求梳理、功能架构、业务流程、产品原型及 PRD 撰写，确保需求逻辑清晰、规则完整并具备可执行性。\n4. 协同 UI/UX、研发、测试、内容运营及市场团队推进产品开发，跟进排期、评审、验收和上线过程，及时识别并解决项目中的风险与问题。\n5. 结合业务发展探索会员订阅、广告、虚拟权益、任务奖励、邀请推广等商业化及增长机制，在兼顾用户体验的基础上提升留存、活跃和付费转化。\n6. 建立并持续关注核心产品指标，通过用户反馈、行为数据和转化漏斗评估功能效果，定位问题并提出后续优化方案。\n7. 关注动漫、漫画、视频及内容社区行业趋势，持续研究同类产品的内容组织、推荐分发、社区互动和商业化模式，为产品创新提供可落地的建议。\n\n任职要求：\n1. 本科及以上学历，具有2年以上互联网产品相关经验，能够独立负责较完整的产品模块或版本迭代。\n2. 熟悉产品工作的完整流程，具备较强的需求分析、逻辑梳理、原型设计和文档表达能力，能够熟练使用 Figma、Axure、墨刀等产品工具。\n3. 具备良好的项目推动能力，能够协调设计、研发、测试和运营等不同团队，推动需求按计划落地。\n4. 具有数据意识，能够围绕用户活跃、留存、转化和付费等指标发现问题，并据此制定产品优化方案。\n5. 对内容社区、动漫漫画、视频娱乐或会员订阅类产品有一定理解，能够站在用户和业务两个角度思考产品方案。\n6. 沟通清晰、执行力强，对产品细节敏感，能够适应快速迭代及多任务并行的工作节奏，具备基本的平台内容安全与合规意识。\n\n加分项：\n1. 有内容社区、视频、漫画、二次元或海外互联网产品经验。\n2. 有从0到1参与产品搭建或新业务上线的实际经验。\n3. 熟悉会员订阅、广告变现、邀请裂变或用户激励体系。\n4. 具备基础的数据分析能力，熟练使用 Excel、SQL或相关数据分析工具。\n5. 对动漫、漫画及二次元内容有长期兴趣，熟悉国内外主流内容平台和用户生态。", "cat": "产品与管理"}, {"id": "364", "title": "运维工程师（非大陆区）", "salary": "20-35K", "location": "远程，可国内办公", "jd": "资深运维工程师（DevOps / AI 自动化方向）\n寻找实战经验扎实、能独立解决问题的运维工程师，负责业务系统稳定运行，并通过自动化和 AI 提升运维效率。\n工作职责\n• 负责服务器、网络、数据库及业务应用的部署、维护、监控与故障处理\n• 建立标准化发布、配置管理、回滚流程及应急预案，推动故障复盘\n• 负责账号权限、密钥管理、安全更新及云资源成本优化\n• 使用 Python / Shell 等实现巡检、部署、备份、日志处理自动化\n• 推动 AI 落地运维：告警归并、日志分析、故障辅助定位、知识库检索\n• 建设可追踪、可验证、可回滚的自动化流程，沉淀文档与故障案例\n任职要求\n• 有独立维护生产环境经验，能承担故障定位、业务恢复与改进\n• 熟悉 Linux 及 TCP/IP、DNS、HTTP/HTTPS、防火墙，具备实际排障能力\n• 熟练使用 Docker、Kubernetes、Nginx、Git 及 CI/CD，能独立完成部署、升级和回滚\n• 熟悉常用数据库维护、备份与恢复，有监控告警及日志管理经验\n• 熟练至少一种脚本语言，能编写含异常处理、日志记录和结果验证的脚本\n• 具备变更管理与安全意识，能明确操作影响范围并及时恢复业务\nAI 自动化要求\n• 有将大模型 API、AI 编程工具或 Agent 接入实际工作流的经验，能展示具体案例\n• 能通过 API / MCP 对接监控、日志、工单等运维系统，理解权限控制与敏感数据处理\n• 能区分确定性脚本任务与需 AI 辅助判断的任务，并验证 AI 生成的命令与结论\n• 为自动化操作设置审批、超时、重试、审计和回滚机制，高风险操作需人工确认\n• 能评估自动化效果：误报率、处置成功率、恢复时间、节省工时及模型调用成本\n加分项\n• Ansible、Terraform 实际使用经验\n• 自动巡检、故障自愈、运维机器人或内部运维平台建设经验\n• RAG 运维知识库、Agent 工作流或本地模型部署经验", "cat": "技术开发"}, {"id": "365", "title": "AI自动化工程师", "salary": "20-25K", "location": "远程，可国内办公", "jd": "### 岗位职责\n  1. 梳理各部门高频、重复和耗时的工作流程。\n  2. 设计并开发AI工具、Agent、自动化工作流和知识系统。\n  3. 连接大模型与内部系统、数据库、文档及第三方平台。\n  4. 建立人工审核、权限、重试、日志、监控和回退机制。\n  5. 评估准确率、完成率、成本、响应时间和人工接管率。\n  6. 推动工具在团队中落地，并沉淀SOP、组件和使用规范。\n  ### 任职要求\n  1. 2年以上软件开发经验，能够独立完成工具或业务系统上线。\n  2. 熟悉前后端、数据库和部署，掌握Python、TypeScript、Java或Go之一。\n  3. 有大模型API、RAG、工具调用或Agent工作流实战经验。\n  4. 能解决模型不稳定、调用失败、延迟和成本控制问题。\n  5. 具备产品和流程意识，能够量化节省工时、使用率及维护成本。\n  6. 理解权限、隐私和数据安全，能够深入业务并推动使用。\n  ### 加分项\n  有n8n、Dify、LangGraph、MCP或RPA经验；做过内容生产、知识库、客服或研发提效产品；具备模型评测、浏览器自动化、本地模型部署或长期运行的内部AI产品经验。", "cat": "技术开发"}, {"id": "366", "title": "产品增长运营（SEO/GEO方向）", "salary": "15-25K", "location": "远程，可国内办公", "jd": "### 岗位职责\n  1. 研究海外市场、竞品、关键词和搜索意图，持续发现产品及内容机会。\n  2. 负责SEO与GEO（生成式引擎优化），包括站点结构、技术SEO、内容规划、主题集群、结构化数据及AI搜索曝光。\n  3. 跟踪关键词排名、自然流量、搜索收录、AI引用及最终转化效果。\n  4. 与研发、设计协作，推动产品从调研、上线到持续迭代。\n  5. 探索社区、联盟、内容合作和广告等海外获客渠道。\n  6. 优化注册、激活、留存、订阅和付费转化漏斗。\n  7. 设计增长实验，评估转化率、收入、成本和投入产出比。\n  8. 使用AI完成关键词聚类、内容生产、用户分析和运营自动化。\n  ### 任职要求\n  1. 2年以上产品、增长、SEO或海外运营经验，完整负责过增长项目。\n  2. 有SEO实战经验，熟悉搜索意图、内容策略、站内优化、外链及效果分析。\n  3. 理解GEO基本方法，关注Google AI Overviews、ChatGPT等AI搜索和问答入口。\n  4. 能根据数据判断自然流量质量，而非只关注收录量和访问量。\n  5. 熟悉用户转化漏斗，会使用分析工具；掌握SQL或类似数据查询能力。\n  6. 能面向英文市场开展内容和增长工作。\n  7. 执行力和结果意识强，能够亲自制作内容、配置页面并推进实验。\n  ### 加分项\n  有内容、社交、订阅、工具或泛娱乐产品经验；熟悉Google Search Console、GA、Ahrefs或Semrush；做过程序化SEO、结构化数据、外链建设、数字公关或AI搜索曝光监测；有从零获得海外自然流量或收入的经历。", "cat": "运营与市场"}, {"id": "367", "title": "动漫中级运营", "salary": "10–20K", "location": "远程，可国内办公", "jd": "中级运营（内容 / 社区 / 社媒方向）\n\n薪资范围：10–20K\n\n岗位职责\n\n1. 负责动漫、漫画内容平台的日常运营，围绕业务目标制定并执行运营计划，提升内容消费、用户活跃与留存。\n2. 结合平台内容、用户兴趣及热点趋势，开展内容选题、推荐、专题和活动策划，提升优质内容的曝光与用户参与度。\n3. 负责社区及社群运营，通过话题互动、活动策划和用户激励等方式，维护社区氛围，促进用户交流，挖掘和维护核心用户。\n4. 参与 X（Twitter）、Telegram等渠道的内容发布、用户互动及推广，结合不同渠道的特点优化运营方式，提升品牌曝光与平台引流效果。\n5. 跟踪内容表现、用户行为及活动数据，定期复盘，持续优化运营策略，支持用户增长、留存及付费转化。\n6. 与产品、设计、研发等团队协作，整理用户反馈，推动运营需求落地，改善用户体验。\n\n任职要求\n\n1. 具备 2 年及以上互联网运营经验，有内容平台、社区或泛娱乐产品相关经验者优先。\n2. 具备良好的内容判断力、文案表达及策划能力，能够根据平台特点和用户偏好调整内容与沟通方式。\n3. 理解用户增长、活跃、留存和转化的基本逻辑，能够独立完成运营项目的策划、执行与复盘。\n4. 具备基础数据分析能力，能使用 Excel 等工具整理和分析运营数据，并提出可执行的优化方案。\n5. 主动性和执行力强，具备良好的沟通协作能力，能合理安排工作优先级并推动项目落地。\n\n加分项\n\n• 喜欢动漫、漫画，熟悉二次元文化、相关热点及用户兴趣。\n• 有 X（Twitter）、Telegram 等社媒或社群运营经验，有内容传播、用户增长或引流案例。\n• 了解 SEO，有关键词研究、内容优化或自然搜索流量增长经验。\n• 熟悉 AIGC 工具，能用于内容创作、图片或视频制作，提升运营效率。\n• 有内容付费、会员订阅或其他商业化运营经验。\n\n欢迎在投递时附上运营案例、账号链接或作品，并简要说明个人职责及项目成果。", "cat": "运营与市场"}, {"id": "368", "title": "中高级产品运营", "salary": "10K-30K", "location": "远程，可国内办公", "jd": "负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的视频产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营与市场"}, {"id": "369", "title": "高级技术架构师（Go方向）", "salary": "30K-50K", "location": "远程，可国内办公", "jd": "岗位职责\n1.负责公司核心系统的技术架构设计、评审与持续演进，结合业务发展制定可落地的技术方案。\n2.深度参与Go核心系统及关键模块研发，能够承担核心代码编写、代码评审、性能优化和复杂问题排查。\n3.接管现有产品及技术系统，梳理系统架构、代码资产、服务依赖、数据链路、基础设施和发布流程，建立完整的技术架构视图。\n4.对原有Go、PHP或Java系统进行技术分析，识别架构缺陷、历史技术债、性能瓶颈和稳定性风险，制定分阶段治理方案。\n5.负责高并发、高可用、分布式系统的架构设计与优化，提升系统的稳定性、扩展性、安全性和可维护性。\n6.负责关键技术选型及技术方案评审，在业务交付速度、系统稳定性、技术成本和长期演进之间作出合理判断。\n7.参与P0/P1线上故障处理，能够快速定位跨服务、跨语言及跨系统问题，制定止损、修复和长期优化方案。\n8.推动研发工程体系建设，包括代码规范、技术评审、单元测试、持续集成、灰度发布、监控告警及事故复盘等。\n9.指导高级及中初级工程师解决技术难题，通过代码评审、技术分享和项目实战提升团队整体技术能力。\n10.与产品、运营、渠道及项目管理团队协作，准确理解业务需求，评估技术风险、研发成本和交付周期。\n11.对重点项目的技术质量和交付结果负责，主动同步技术风险、资源缺口、解决方案及预计完成节点。\n12.根据公司发展需要，逐步承担技术团队规划、技术人员分工、核心人才培养及技术管理职责。\n任职要求\n1.本科及以上学历，计算机、软件工程或相关专业优先。\n2.8年以上服务端研发经验，3年以上核心系统架构设计或技术架构师经验。\n3.精通Go语言及其底层原理，具备扎实的编码能力和大型项目实战经验，能够独立完成核心模块设计与研发。\n4.除Go以外，至少深入掌握PHP或Java中的一门语言，能够阅读、维护和改造相关存量系统。\n5.具备扎实的分布式系统设计能力，熟悉微服务架构、服务拆分、服务发现、配置中心、API网关、分布式事务、分布式锁及一致性处理。\n6.熟练掌握MySQL，具备数据库设计、SQL优化、索引优化、读写分离、分库分表及数据迁移经验。\n7.熟悉Redis、Kafka、RocketMQ、RabbitMQ等缓存和消息中间件，理解其核心原理、适用场景及常见风险。\n8.熟悉Linux、Docker、Kubernetes及常见云服务，能够配合运维完成部署架构、资源规划、容量评估和故障排查。\n9.具备高并发、高可用系统设计与优化经验，能够解决性能瓶颈、服务雪崩、数据一致性和系统稳定性等复杂问题。\n10.具备较强的线上问题处理能力，能够结合日志、监控、链路追踪、数据库及服务状态快速定位根因。\n11.能够独立输出架构图、技术方案、接口规范、数据模型、技术风险清单及系统演进路线。\n12.具备较强的业务理解和沟通能力，能够把技术问题转化为业务可理解的影响、风险、方案和交付节点。\n13.具备较强的责任意识和结果意识，面对历史系统、遗留问题及高压交付时，能够保持稳定并推动问题闭环。\n优先考虑\n1.有存量系统接管、遗留系统重构或跨公司技术交接经验。\n2.有Go与PHP、Go与Java混合技术栈治理或系统迁移经验。\n3.有高流量、高并发、高可用业务系统的架构及性能优化经验。\n4.有海外产品、广告投放、内容、工具或多产品矩阵相关经验。\n5.有数据埋点、域名管理、打包发布、支付系统或渠道投放链路相关经验。\n6.有从0到1搭建技术架构、研发规范或工程效能体系的经验。\n7.有重大线上事故处理、核心系统重构或稳定性专项治理经验。\n9.有技术团队带教、技术小组管理或技术负责人经历。\n核心评价指标\n1.核心系统和业务链路掌握程度；\n2.核心代码及关键技术问题解决能力；\n3.P0/P1故障响应和根因解决效率；\n4.系统稳定性、性能及可维护性改善结果；\n5.技术债治理和架构演进进度；\n6.技术方案的合理性及实际落地效果；\n7.重点项目技术质量和按期交付情况；\n8.团队技术带教及跨部门协作效果。", "cat": "技术开发"}, {"id": "370", "title": "AI短剧编剧（兼选题、角色设定）", "salary": "12-20k", "location": "远程，可国内办公", "jd": "岗位职责\n1. 跟踪短剧、网文、漫画及社交平台热点，建立题材库和选题储备库。\n2. 结合目标用户、平台特点和商业化方向，完成竞品拆解及选题判断。\n3. 输出选题方案，明确受众、核心卖点、题材类型、主要冲突和差异化亮点。\n4. 完成世界观、人物关系、角色小传及主要角色的性格、外形、身份、动机和成长线设定。\n5. 完成故事大纲、分集梗概和分集剧本，设计前三集钩子、情绪爆点、反转及集尾悬念。\n6. 负责人物对白、动作、表情和场景描述，保证人物行为逻辑及剧情前后统一。\n7. 结合AI生成能力控制人物数量、场景数量、复杂动作和特效难度，提升剧本落地效率。\n8. 根据剧本审核、分镜及成片反馈及时修改，并沉淀人物档案和剧情时间线。\n\n任职要求\n1. 2年以上短剧、网文、漫画、影视编剧或内容策划经验。\n2. 至少熟悉男频、女频、甜宠、逆袭、悬疑、都市等一种主流题材。\n3. 具备选题判断、故事结构、人物塑造、冲突设计和对白创作能力。\n4. 熟悉短剧前三集留人、强情绪推进、连续反转及集尾卡点逻辑。\n5. 能够独立完成角色设定、故事大纲及分集剧本。\n6. 了解AI生图、视频生成的能力边界，能够编写适合AI制作的剧本。\n7. 熟练使用ChatGPT、Claude等AI工具辅助调研、创作和一致性检查。\n8. 应聘时需提供选题方案、人物小传、剧本或已上线作品。", "cat": "内容与创作"}, {"id": "371", "title": "AI短剧分镜师", "salary": "15k-23k", "location": "远程，可国内办公", "jd": "岗位定位\n负责将审核通过的剧本转化为可直接执行的镜头方案，是文字内容与AI视觉制作之间的核心衔接岗位。\n\n岗位职责\n1. 将分集剧本拆解为标准分镜脚本和镜头清单。\n2. 明确每个镜头的景别、机位、构图、角色、动作、表情、台词、时长和运镜方式。\n3. 设计镜头衔接、人物调度、节奏变化和情绪呈现。\n4. 根据角色设定及场景设定输出镜头画面描述、参考图需求和提示词方向。\n5. 结合AI生图及视频工具的能力边界判断镜头可实现性，减少复杂群像、动作和运镜返工。\n6. 控制单集镜头数量和制作难度，平衡成片效果、制作周期和生成成本。\n7. 与编剧确认剧情表达，与视频生成岗位确认技术实现，与剪辑岗位确认成片节奏。\n8. 审核生成的关键帧和视频镜头，根据样片效果补充、替换或调整分镜。\n9. 沉淀常用景别、动作、运镜和提示词模板，提高后续制作效率。\n\n任职要求\n1. 2年以上影视、动画、漫画、广告、短视频或动态漫分镜经验。\n2. 熟悉景别、构图、轴线、机位、人物调度和镜头叙事。\n3. 能够独立将文字剧本转化为结构清晰、可制作的镜头表。\n4. 理解主流AI生图及视频生成工具的能力边界。\n5. 具备较强的画面想象力、节奏感和成本意识。\n6. 具备绘画能力，或能够使用AI工具快速制作分镜参考图。\n7. 有AI短剧、动态漫画、漫剧或批量内容生产经验者优先。\n8. 应聘时需提供分镜作品或现场完成指定剧本的镜头拆解。", "cat": "内容与创作"}, {"id": "372", "title": "AI视频生成师", "salary": "18k-25k", "location": "远程，可国内办公", "jd": "岗位职责\n1. 根据角色设定、场景设定和分镜要求生成角色图、场景图及镜头关键帧。\n2. 运用提示词、参考图、模型、LoRA和节点工作流控制人物、服装、场景及画风一致性。\n3. 完成人物换装、表情调整、局部重绘、扩图、换背景和细节修复。\n4. 根据分镜完成图生视频或文生视频，实现人物动作、表情变化、镜头运动和环境变化。\n5. 处理人物变形、五官漂移、肢体异常、多指、背景抖动、画面闪烁及道具错误。\n6. 根据生成结果调整首尾帧、提示词、模型和参数，提高镜头成功率及稳定性。\n7. 与分镜师确认镜头实现方案，根据剪辑及质检反馈完成补镜、延展和返修。\n8. 对图片和视频素材进行筛选、命名、归档及版本管理。\n9. 记录模型、提示词、参数、生成次数、成本和失败原因，持续优化标准工作流。\n10. 持续测试不同生图及视频模型，形成适合不同题材、动作和运镜的工具方案。\n\n任职要求\n1. 1年以上AI生图、AI视频、动画、视觉设计或影视后期经验。\n2. 熟练使用至少一种主流AI生图工具及一种AI视频生成工具。\n3. 熟悉ComfyUI或其他节点式工作流。\n4. 熟悉LoRA、ControlNet、IP-Adapter、局部重绘、首尾帧控制等方法。\n5. 具备基础美术、构图、色彩、光影、镜头和人物动作判断能力。\n6. 能够解决角色一致性、场景一致性、画风漂移和视频稳定性问题。\n7. 具备较强的测试、复盘和成本意识，能适应批量生产及多轮返修。\n8. 应聘时需提供AI图片、AI视频作品及对应工具和工作流说明。", "cat": "内容与创作"}, {"id": "373", "title": "AI短剧配音师/音频制作", "salary": "18k-25k", "location": "远程，可国内办公", "jd": "岗位职责\n1. 根据人物年龄、性格、身份和情绪设计声音方案，建立角色声线档案。\n2. 使用真人或AI配音工具完成台词配音，保证角色声音前后一致。\n3. 根据剧情调整语速、停顿、重音、语气和情绪强度。\n4. 处理错读、吞字、机械感、情绪不符、音量不一及口型不同步问题。\n5. 完成音频降噪、剪切、音量统一和基础混音。\n6. 根据剧情需要配置环境音、动作音效及基础背景音乐建议。\n7. 与编剧确认台词含义，与剪辑确认节奏、口型和音画同步。\n8. 管理声音模型、音频素材、授权记录和版本文件，避免声音及音乐侵权。\n9. 根据质检反馈及时完成补录、替换及音频返修。\n\n任职要求\n1. 1年以上配音、音频制作、短剧后期或AI语音生成经验。\n2. 具备良好的语言表达、人物理解和情绪判断能力。\n3. 熟悉至少一种AI配音工具及基础音频编辑软件。\n4. 能够调整语速、停顿、重音、音色和情绪参数。\n5. 具备基础降噪、剪辑、混音和音量标准化能力。\n6. 对声音一致性、口型同步和音频版权风险具有较强敏感度。\n7. 有短剧、动画、有声书、游戏角色或多角色配音经验者优先。\n8. 应聘时需提供配音或音频制作作品。", "cat": "内容与创作"}, {"id": "374", "title": "AI短剧剪辑师", "salary": "10k-15k", "location": "远程，可国内办公", "jd": "岗位职责\n1. 根据剧本和分镜筛选镜头并完成粗剪、精剪和成片输出。\n2. 调整剧情节奏、人物情绪、镜头停留时间、转场和集尾卡点。\n3. 整合配音、背景音乐、环境音和关键音效，保证音画节奏统一。\n4. 完成字幕制作，检查错字、漏字、称谓、时间轴和字幕可读性。\n5. 处理画面比例、基础调色、转场、包装和平台规格适配。\n6. 识别缺失镜头、剧情断点、动作不连续及情绪不连贯问题，并提出补镜需求。\n7. 检查黑帧、跳帧、闪烁、人物变形、画面穿帮、音画不同步及音量异常。\n8. 根据审核和质检意见完成修改，并输出不同平台需要的尺寸、码率和格式。\n9. 管理剪辑工程、素材引用、成片版本和交付文件，保证可追溯。\n10. 结合完播率和用户流失节点复盘剪辑节奏，持续优化成片模板。\n\n任职要求\n1. 2年以上短剧、短视频、动画、影视或信息流视频剪辑经验。\n2. 熟练使用Premiere、DaVinci、Final Cut、剪映等至少一种剪辑工具。\n3. 对剧情节奏、人物情绪、声音表达和集尾悬念有较强判断。\n4. 具备字幕、配乐、音效、基础调色和画面包装能力。\n5. 能够识别AI视频常见的变形、跳变、闪烁和连续性问题。\n6. 工作细致，具备较强的质量意识和版本管理意识。\n7. 了解不同平台的视频规格及音乐、字体、声音等素材版权风险。\n8. 应聘时需提供完整短剧、动画或剧情类成片作品。", "cat": "内容与创作"}, {"id": "375", "title": "AI 研发效能工程师", "salary": "20K-35K", "location": "远程，可国内办公", "jd": "一、岗位职责\n1.搭建公司组件化研发体系与 AI 辅助研发规范，沉淀可复用的工程标准、脚手架与最佳实践；\n2.借助 AI 编程工具（Cursor、GitHub Copilot、Claude Code 等）高效完成研发任务，主导旧项目的翻新、重构与迁移；\n3.研发并沉淀一套通用业务模块组件库（IM 即时通讯、评论、抽奖、签到、支付、会员、推送等），形成标准化、可配置、可复用的“积木”；\n4.设计模块化、低耦合的工程架构与脚手架，使新产品能通过模块快速组合、像搭积木一样迅速搭建并上线；\n5.建立 AI 辅助研发工作流（需求拆解、代码生成、Code Review、测试、文档），提升团队整体研发效率与代码质量；\n6.制定研发规范与技术标准，沉淀技术文档与最佳实践，把控代码质量、安全与稳定性；\n7.持续调研 AI 研发工具与最佳实践，配合产品与运营需求快速验证并交付。\n二、任职要求\n1.具备 Web / App 全栈或前后端研发经验（资历不限，按能力定级），有从 0 到 1 或组件化 / 中台建设经验者优先；\n2.扎实的工程化与架构能力，最好擅长 Flutter、Go；技术栈相通，具备较强学习与迁移能力即可；\n3.熟练使用 AI 编程工具（Cursor、Copilot、Claude Code 等）并能显著提升产出效率；\n4.有 IM、评论、抽奖、签到、支付等通用模块的开发经验者优先；\n5.熟悉前后端分离、组件化、低代码 / 模板化开发思路者优先；\n6.具备组件化、可复用、可配置的设计思维，代码规范、文档意识强；接受成人视频行业，学习能力强；具备团队搭建 / 带队潜力者优先（后续可发展为组长）。\n投递说明：作品非强制，但携带相关作品者将优先考虑，如代表性项目 / 组件代码、可运行 Demo、GitHub 或作品链接等。", "cat": "技术开发"}, {"id": "376", "title": "高级 UI/UX 设计师（交友 / 社交方向）", "salary": "22-35k", "location": "远程，可国内办公", "jd": "【岗位职责】\n1. 主导 App 与网站的介面与体验设计，定义整体设计方向\n2. 从零建立并管理设计系统，确保可扩充性与跨端一致性\n3. 主导用户研究、资讯架构与流程设计，透过数据与可用性验证（含 A/B 测试）推动决策\n4. 独立产出高品质视觉与平面素材（H5 banner、封面、行销物料），把关团队整体设计品质\n5. 与 PM、工程师、运营等跨部门协作，推动设计落地\n\n【任职要求】\n1. 5 年以上 UI/UX 设计经验，能独立主导项目并定义设计方向\n2. 须提供作品集（Portfolio），需含主导的完整产品专桉，及设计系统建置桉例\n3. 设计相关科系毕业，或具同等实务经验\n4. 具备强系统感与设计判断力，能决策设计方向与优先顺序\n5. 精通 Figma，能建立可扩充、语意化的设计系统并落地，含 Library 管理与版本控管\n6. 完整 UX 功底：用户研究、资讯架构、流程设计、可用性验证与 A/B 测试\n7. 能撰写设计规范与设计决策文件，建立并优化团队设计流程\n8. 熟悉全栈 iOS / Android / RWD 介面设计与进阶互动原型\n9. 具备扎实平面设计能力，精通 Photoshop / Illustrator\n10. 能运用 AI 工具（AI 生成图、Figma AI、Claude 串接 MCP 等）提升设计与交付效率\n11. 具设计提桉与向上沟通能力，能向利害关係人说明并说服设计决策\n12. 具商业思维，能将商业目标转化为设计策略；能指导并提升团队设计水准\n13. 抗压性佳，能在快节奏迭代下维持设计品质\n\n【加分条件】\n\n・HTML/CSS\n\n・付费内容 / 社群平台设计经验\n\n・成人产业隐私与金流体验设计经验\n\n・暗色模式与多语系介面经验\n\n・国际化合规", "cat": "内容与创作"}, {"id": "377", "title": "供给增长运营专员", "salary": "20-30k", "location": "远程，可国内办公", "jd": "岗位职责\n资源挖掘与触达：通过社交 App（陌陌、Soul 等）、社群、内容平台、招募/兼职群等多平台多渠道，主动挖掘并触达陪玩、伴游、向导、网红、模特等供给资源。\n评估、洽谈与签约：对意向资源做初步评估与筛选，沟通讲解合作模式，完成洽谈与线上签约，持续扩充供给规模。\n资源维护与激活：维护已签约资源关系，用资源、分成、成长路径等卖点吸引并留住优质供给，保持其活跃与履约。\n线上获客渠道运营：拓展并运营短视频投流（抖音/快手等）、CPA/CPS 联盟、站长换量、达人/代理、社群等线上渠道，获取有陪玩/伴游需求及喜欢线上擦边社交的精准用户。\n私域承接与复购：将公域流量沉淀进私域，做社群运营、客户分层、促活与促复购，提升用户价值与生命周期贡献。\n渠道开发与测试：持续开发新的线上资源与获客渠道，做渠道测试与效果评估，保留优质渠道、淘汰低质渠道。\n资源库与台账管理：建立资源库、渠道台账与标签体系，沉淀可复用的资源与渠道资产。\n数据复盘与反作弊：监控资源数量与质量、获客成本（CPA）、付费转化、复购等核心指标，做归因分析、识别假量水量、优化预算。\n风控与协作：把控线上渠道与账号安全（防封号、防渠道失效），与产品、运营、资源 BD 团队协同推进。\n\n任职要求\n线上资源获取实战（硬性要求）：做过通过线上渠道挖掘、招募、签约供给资源（主播/达人/网红/模特/陪玩/伴游等），或线上获客的工作，并拿过结果。\n自带线上资源/渠道者优先：手握可直接动用的线上供给资源或获客渠道，进来即能产出。\n熟悉渠道玩法：多平台线上挖掘签约、短视频投流、CPA/CPS 联盟、站长换量、社群/私域裂变等。\n数据驱动 + 反作弊：对数据敏感，会做漏斗、归因与 ROI 分析，能识别联盟假量水量、把控渠道质量。\n过往业绩：简历需体现可量化的成果（签约资源数量、新增规模、获客成本、付费转化、复购等具体数字与优化幅度），并能讲清自身贡献。\n软性素质：沟通谈判强、嗅觉敏锐、执行力强、抗压。\n强烈优先：有娱乐经纪、直播公会、主播/达人招募、MCN，或陪玩、伴游、同城社交、交友、擦边社交类产品的线上渠道、招募或获客经验者。\n对擦边/灰色业务无顾虑。\n\n注：学历、年限不作硬性限制，以线上资源获取与转化成绩为准。", "cat": "运营与市场"}, {"id": "378", "title": "运营经理 （高级运营（成人、交友、AI）", "salary": "22-35k", "location": "远程，可国内办公", "jd": "负责社交/社区/成人向产品的运营与商业化，对核心经营指标负责。\n核心要求：数据导向 + 强实操——能自己取数、自己下场、用数据拿结果。\n\n岗位职责：\n\n主导产品整体运营策略与体系建设，对 DAU、留存、付费率、ARPU、营收/流水负责；每个指标有目标、有拆解、有周期复盘，涨跌能归因到具体动作。\n亲自操盘用户全生命周期（拉新→激活→留存→付费→召回），搭建分层、成长、激励、付费、召回机制，并落地执行、盯盘数据、快速迭代。\n设计并迭代会员、礼物、虚拟消费、私密内容付费解锁、订阅等变现玩法；针对大 R（高价值/重氪用户）做专属运营与维系，用数据定价格、定权益、定节奏。\n建设用户标签体系，跑 A/B 测试，做漏斗诊断与转化归因，基于数据制定并动态调整策略——结论用数据说话，不拍脑袋。\n亲手策划并落地运营活动，结合擦边/成人流量特点做私域承接与渠道运营（不依赖主流投放平台）；统筹成人向 IP、擦边网红 / 达人合作与跨团队资源，对重点项目与活动 ROI 负责。\n紧跟擦边/成人/AI C端/社交社区行业的玩法与趋势，把被验证有效的打法快速搬进来试、用数据验证后保留或淘汰。\n沉淀运营方法论与 SOP，指导初级运营，提升团队执行效率。\n\n任职要求：\n\n强实操：独立操盘过完整运营线或核心业务（用户线 / 付费线 / 某社交场景），从策略制定到落地执行真正拿过结果。\n数据导向（硬性）：能自己取数（SQL / BI 看板）、搭建指标与标签体系、设计 A/B 测试、做漏斗诊断与转化归因。\n突出业绩：做出过可量化的规模化成果（DAU、留存、付费率、营收/流水达行业可观量级），并能讲清自身关键作用。\n行业背景（以下之一即可）：擦边社交（如陌陌 / 探探 / Soul 类）、成人向、AI C 端产品、社交社区 / 语聊 / 直播；或伴游、楼凤、网聊、陪玩等成人/擦边服务赛道，有实际 C 端运营经验即可。\n熟悉社交/社区的用户增长与商业化：虚拟消费、会员、大 R、礼物打赏、私域。\n对擦边/成人向内容与业务无顾虑。\n工作效率高，推动力强，抗压能力好。\n\n注：学历、年限不作硬性限制，以操盘能力、实操与数据结果为准。\n\n加分项：\n有擦边社交、成人向、直播打赏、语聊、网聊、陪玩、伴游、楼凤、AI 陪伴等赛道的操盘经验。\n有 AI C 端 / AIGC 类产品的运营经验。\n有出海或海外华人市场运营经验。\n带过小团队或主导过跨团队项目。", "cat": "运营与市场"}, {"id": "379", "title": "高级 SEO 运营", "salary": "20k-30k", "location": "远程，可国内办公", "jd": "岗位职责：\n1、负责公司网站及内容矩阵的 SEO 增长策略制定与落地，围绕业务目标持续提升自然搜索流量、收录、关键词排名及转化效果。\n2、独立负责多个网站（品牌站、内容站、专题站、多语言站）的整体 SEO 运营，包括站点规划、架构优化、内容策略及增长方案制定。\n3、制定关键词策略，完成核心词、长尾词、热点词、商业词等关键词布局，并持续优化内容质量与页面排名。\n4、主导站内 SEO 优化，包括网站结构、URL、TDK、内链、聚合页、标签页、Schema、Core Web Vitals、页面体验等持续优化。\n5、建立完整的技术 SEO 规范，协同研发团队解决索引、抓取、重定向、Canonical、Sitemap、Robots、Hreflang 等技术问题。\n6、建立内容运营规范，制定内容更新机制、专题策划、AI 内容生产规范及内容质量评估体系，提高整体内容竞争力。\n7、建立外链增长体系，拓展行业媒体、Guest Post、资源合作等渠道，持续提升网站权重及品牌曝光。\n8、持续关注 Google、Bing 等搜索引擎算法变化，及时调整 SEO 策略，降低算法风险，保障网站稳定增长。\n9、 熟练使用 Google Search Console、Google Analytics 4、Ahrefs、SEMrush、Screaming Frog 等工具，对流量、收录、关键词、转化及用户行为进行数据分析。\n10、推动 SEO 自动化建设，参与 SEO 工具、数据平台及 AI 内容工具需求设计，提高运营效率。\n11、建立 SEO 数据监控体系，定期输出 SEO 分析报告、增长复盘及优化方案，为业务决策提供数据支持。\n12、负责 SEO 相关知识沉淀，制定 SOP、培训团队成员，并推动 SEO 最佳实践在团队内部落地。\n\n岗位要求\n必须项\n3 年以上 Google SEO 实战经验，至少独立负责过 1 个以上完整网站项目。\n熟悉 Google、Bing 等搜索引擎工作原理及最新排名机制。\n熟练掌握 On-page SEO、Technical SEO、Off-page SEO 及内容 SEO 等优化方法。\n熟练使用 Google Search Console、Google Analytics 4、Screaming Frog、Ahrefs 或 SEMrush 等 SEO 工具。\n熟悉网站索引、抓取、收录、关键词布局、页面优化及外链建设全流程。\n熟悉 HTML、CSS 基础知识，了解 JavaScript 对 SEO 的影响，能够与研发团队高效沟通。\n具备优秀的数据分析能力，能够根据排名、收录、流量及转化数据持续优化策略。\n熟悉 AI 工具在 SEO 场景中的应用，如内容生成、关键词分析、数据整理及自动化运营。\n加分项\n有海外网站运营经验，熟悉英语或多语言 SEO。\n有矩阵站、站群、多域名项目运营经验。\n有资讯站、内容聚合站、社区类网站运营经验。\n熟悉 Cloudflare、CDN、服务器基础配置及网站性能优化。\n熟悉 Python、SQL、Shell 等任一脚本语言，可实现 SEO 数据自动化分析。\n有独立运营个人网站、博客或副业站经验，并取得一定自然流量成果。\n熟悉 AI SEO、Programmatic SEO（程序化 SEO）、自动化内容生成等先进 SEO 技术。\n有成功将网站自然流量提升至百万级以上 PV 或显著增长案例。\n\n其他要求\n1、入职后负责制定年度及季度 SEO 增长规划，并建立完整的 KPI 指标体系（收录、关键词、流量、转化、ROI 等）。\n2、试用期（3 个月）需完成以下交付成果：\n3、网站 SEO 全面诊断报告（技术、内容、外链）\n4、6 个月 SEO 增长规划及执行方案\n5、完成至少 5 项关键技术 SEO 优化\n6、推动至少 1 个 SEO 自动化工具或流程优化上线\n7、每周输出 SEO 数据分析报告，每月完成增长复盘及下一阶段优化计划。\n8、面试需结合实际案例进行分享，重点考察网站诊断能力、技术 SEO 能力、数据分析能力及增长思维。", "cat": "运营与市场"}, {"id": "380", "title": "运营经理（高级网站运营）", "salary": "18K-28K", "location": "远程，可国内办公", "jd": "岗位职责\n1.负责网站整体运营工作，制定并落地网站运营策略，对新增用户、活跃用户、留存率、自然流量、转化率等核心业务指标负责。\n2.负责网站内容生态建设，包括栏目规划、内容规划、专题策划及运营策略制定，持续提升内容质量、用户体验及网站竞争力。\n3.负责网站核心页面（首页、频道页、详情页、专题页、搜索页、活动页等）的运营规划及持续优化，提升页面点击率、访问深度、停留时长及转化效果。\n4.建立网站数据分析体系，持续监控流量、用户行为、内容表现、SEO表现及业务指标，定期输出数据分析报告及优化建议。\n5.基于数据分析持续优化用户增长、用户留存、内容消费及转化路径，推动网站核心指标持续增长。\n6.制定网站内容运营策略，建立内容生产、审核、发布、更新及生命周期管理机制，持续提升内容价值及运营效率。\n7.配合 SEO 团队制定搜索流量增长策略，负责关键词规划、专题布局、内容优化、内链建设、页面结构优化及搜索体验提升，推动自然流量增长。\n8.与产品、研发、设计团队协同推进网站功能优化、后台工具建设、运营自动化及用户体验优化，提高整体运营效率。\n9.建立网站运营规范及 SOP，包括内容发布规范、页面检查机制、数据监控机制、质量管理机制及运营复盘体系。\n10.持续开展竞品分析及行业研究，跟踪行业动态、搜索趋势及用户需求变化，输出运营策略及产品优化建议。\n11.策划并推动专题活动、频道运营、榜单推荐、热点运营、内容合集等增长项目，提升网站流量、用户活跃度及内容传播效果。\n12.建立网站运营预警机制，及时发现流量异常、内容异常、SEO异常及用户行为变化，并推动相关团队快速完成问题闭环。\n13.统筹跨部门项目，协调产品、技术、SEO、设计、内容等团队资源，保障重点运营项目按计划交付并达成业务目标。\n14.定期输出网站运营日报、周报、月报及专项分析报告，为业务决策提供数据支持，并持续沉淀运营方法论。\n
