omfyUI 工作流搭建、LoRA 训练或自定义节点。\n- 带过人或牵头过小团队产出，有把流程标准化、可复制的经验。\n- 在 AI 影视 / 短片领域有公开作品、获奖或一定影响力。\n\n【我们提供】\n- 薪资：18K–24K，具体以面试评定及实操结果为准。具备独立带组交付能力，或有获奖代表作者，薪资可一事一议。\n- 年终奖：按公司经营情况与个人绩效发放。\n- 明确的成长通道：本岗按组长 / 创意负责人储备培养，路径清晰、不画饼。\n- 公司提供全套 AI 生产工具账号与算力资源，不让你自费会员。\n- 工作地点：[城市占位]　｜　公司：[公司名占位]\n\n【成长路径】\n高级 AIGC 创作岗 → 创意组长 / 创意负责人 → 创意总监\n\n投递请附：个人作品集 / showreel + 硬门槛证明材料。任职期间使用公司资源、为公司项目产出的 AI 作品及提示词资产，知识产权归公司所有。", "cat": "AI / AIGC"}, {"id": "6", "title": "编剧 / 剧本策划 (Screenwriter)", "salary": "12~18k", "location": "远程", "jd": "你是整条内容流水线的叙事源头——所有导演的分\n镜拆解、视频团队的画面生成，都建立在你输出\n的剧本之上。我们需要的不是\"会写字的人\"，而\n是一个深刻理解戏剧结构、角色弧光与情绪节奏\n的叙事工程师。你将为 AI 生产管线提供高质量、\n高密度、结构化的剧本原料，直接决定最终内容\n的叙事品质上限。\n剧本创作与改编（核心职责）\n独立完成原创短剧/长篇剧本的策划与写\n作，或基于现有网文 IP / 小说素材进行影视\n化改编。\n输出的剧本需遵循标准化格式（含场景描\n述、角色行动、台词、情绪标注等结构化\n信息），确保导演和视频生成团队可直接进\n行视觉化转制。\n1.\n叙事结构与节奏把控\n精准控制\"钩子-冲突-反转-高潮\"的戏剧节\n拍，尤其对短剧/竖屏剧的前3秒钩子设计\n和每集尾部悬念有极强的把控力。\n设计并维护角色弧光、人物关系网络、世界\n观设定等叙事资产，确保长线剧集的逻辑自\n洽与情感连贯。\n2.\n跨职能协作\n与导演紧密配合，在分镜转化阶段提供叙事\n意图说明与情绪指导。\n参与成片审阅，从叙事角度判断画面节奏、\n台词落点、情绪传递是否到位。\n3.\n硬性要求：\n✅ 专业影视剧集制作经验——有网剧、短剧、\n电影、动画剧集等项目的编剧/编审从业经历，\n深刻理解\"剧本是拍给镜头看的\"这一底层逻辑。\n✅ 叙事类文学创作或编辑经验——有网络小说\n写作（签约作者优先）、出版文学编辑、或叙事\n类内容策划的实际产出与发表记录。\n✅ 极强的戏剧结构感与对白功底——能写\n出\"角色说人话\"的台词，而非 AI 味浓重的书面\n腔。\n加分项：\n⭐ 熟练使用 AI Agent 工具辅助创作——如 \nAntigravity、Claude Code、Grok Build 等 AI \n编程/写作代理，能通过 AI 工具高效完成大纲\n生成、角色设计、多版本剧本迭代等工作。\n⭐ SillyTavern / NovelAI 深度玩家——熟悉角\n色卡（Character Card）、世界书（Lorebook）、\nSystem Prompt 等配置，理解如何通过精细化\n提示词控制 AI 的叙事输出风格与角色一致性。\n⭐ 有内容的写作经验，了解不同\n平台和地区的尺度红线与合规表达技巧。\n⭐ 熟悉当前热门网文品类（系统流、反派流、\n穿书流、修仙后宫等）的叙事套路与读者爽点。\n⭐ 有海外短剧（H5 矩阵、ReelShort 等）的剧\n本写作或改编经验。\n面议（根据经验与作品，提供行业有竞争力的待\n遇）\n投递说明：请附上已发表/已制作的剧本样\n本、小说作品链接或叙事类作品集。", "cat": "内容"}, {"id": "7", "title": "AI内容编辑", "salary": "45000-55000 NTD", "location": "台湾本地驻场办公/远程", "jd": "岗位定位：内容量产导向，负责原创短剧的剪辑与成片包装，把握短剧节奏与情绪，稳定产出高完播成片。\n\n一、工作内容\n1.基于原创短剧素材进行剪辑、番外重组与精编改版，负责单集从粗剪到成片的完整闭环。\n2.把握短剧的情节钩子、情绪推进与情感／情欲节拍，剪出能\"留人\"的开场与卡点，提升完播与转化。\n3.按周产能目标稳定出片，配合内容库填充计划（原片直上／二剪／番外多线并行）。\n4.完成字幕、音效、配乐、调色、片头片尾等标准化包装，产出符合平台上架规范的成片。\n5.关注完播率、点击、留存等数据，依反馈迭代剪辑手法与开场策略。\n6.规范素材命名与归档，维护素材库与成片库的可追溯性。\n\n二、必要条件\n1.熟练使用 Premiere／剪映专业版／Final Cut／DaVinci 等至少一款主力剪辑工具。\n2.具短剧、竖屏短视频或影视剧集类成片剪辑经验 1 年以上，能独立完成整集。\n3.对情感／情欲向短剧题材不排斥，能接受相对大胆的内容尺度（面试具体说明）。\n4.节奏感强，理解\"钩子—反转—卡点\"的短剧叙事逻辑，懂平台算法与完播逻辑。\n5.能扛量、抗压，适应量产节奏与周产能目标。\n6.需附上相关作品（短剧／竖屏成片优先，注明负责环节）。\n\n三、加分项目\n1.有女性向／情感向内容剪辑经验，能剪出女主视角的情绪与代入感。\n2.会调色、混音、简单特效，或会用 AI 工具（AI 换脸、AI 配音、AI 补帧等）辅助提效。\n3.有二剪／番外／混剪的\"素材增值\"经验，能一片多用。\n4.有稳定高完播／爆款作品案例。\n5.熟悉多平台上架规范与各平台内容偏好。\n\n四、应聘方式\n请附上：\n1.代表作品 2–3 支（短剧／竖屏成片优先，附上你负责的环节）；\n2.简历与期望薪资；\n3.（加分）一句话说明你剪短剧时最在意的一个点。", "cat": "AI / AIGC"}, {"id": "8", "title": "X 渠道运营专员", "salary": "NT$40,000–55,000/依经验与实际作品核薪", "location": "台湾本地驻场办公", "jd": "一、职位介绍\n目前团队旗下涵盖多条社群及产品线，包括 AI 生成内容与数字人 IP、AI／Web3 产品社群及品牌官方账号。\n现阶段将重点投入 X（Twitter）平台运营及账号矩阵建设，希望招募一位熟悉 X 生态、具备内容敏感度及社群冷启动能力的运营伙伴，能够独立负责账号从 0 到 1 的定位、内容、增长及社群互动。\n二、工作内容\nX 账号运营\n独立负责账号定位、内容调性、选题规划、发文节奏及日常运营。\n撰写贴文、Thread、迷因及互动型内容，中英文内容均能独立产出。\n矩阵账号运营\n同时管理多个自有账号。\n根据不同账号设定内容定位、人设及目标受众。\n规划账号间内容分发、互动及交叉导流策略。\n多平台内容分发\n熟悉 X、Telegram、Discord、Reddit、Instagram、TikTok、小红书等平台特性。\n能根据不同平台用户及算法机制调整内容形式，而非单纯复制发布。\n社群冷启动与增长\n负责种子用户招募及早期社群增长。\n规划并执行 KOC／社群大使计划。\n设计社群任务、活动及奖励机制，提高用户互动与留存。\n社群互动与舆情管理\n经营评论区及社群讨论氛围。\n处理负面评论及突发舆情。\n主动与用户、同赛道账号及 KOL 互动并建立关系。\n热点及内容增长\n持续关注网络热点、热门梗及行业话题。\n能快速判断适合账号参与的热点，并及时产出相关内容。\n数据分析与优化\n每周追踪曝光、互动、粉丝增长、导流等核心数据。\n根据数据表现提出下一阶段内容及运营优化方案。\n三、任职要求\n有实际社群账号运营经验，年资不限，实际成绩及作品优先。\n可提供过往运营账号及相关数据成果。\nX 平台深度用户，了解什么内容容易获得互动、转发及传播。\n具备良好的中英文内容能力，英文贴文表达自然，无明显翻译腔。\n熟悉各社群平台规则及红线，了解限流、封号风险及基本申诉处理方式。\n熟悉 Typefully、Hypefury、数据分析工具、Discord Bot、多账号管理等社群运营工具。\n对网络文化、热门梗及热点事件敏感，能够快速响应并转化为内容。\n具备较强的独立执行能力，无需持续跟进提醒，可主动推进账号运营。\n四、加分项\n有 Web3／Crypto／AI 产品社群运营经验。\n熟悉 AI 生图、AI 视频生成等工具。\n具备基础视频剪辑或平面设计能力。\n有账号从 0 到 1 冷启动及增长成功案例。\n自有 X 或其他社群账号具备一定粉丝量或影响力。\n五、面试准备\n面试请准备以下内容：\n过往运营账号：提供账号链接、负责内容及实际数据成果。\n3 条 X 内容提案：针对我们的 AI／数字人 IP／AI 或 Web3 产品，准备 3 条你实际会发布的 X 贴文。\n1 个冷启动案例：说明你如何从 0 开始建立账号或社群，包括策略、执行方式及最终成果。", "cat": "商务 / 市场"}, {"id": "9", "title": "AI内容剪辑", "salary": "12~18k", "location": "远程", "jd": "岗位定位：内容量产导向，负责原创短剧的剪辑与成片包装，把握短剧节奏与情绪，稳定产出高完播成片。\n一、工作内容1.基于原创短剧素材进行剪辑、番外重组与精编改版，负责单集从粗剪到成片的完整闭环。\n2.把握短剧的情节钩子、情绪推进与情感／情欲节拍，剪出能\"留人\"的开场与卡点，提升完播与转化。\n3.按周产能目标稳定出片，配合内容库填充计划（原片直上／二剪／番外多线并行）。\n4.完成字幕、音效、配乐、调色、片头片尾等标准化包装，产出符合平台上架规范的成片。\n5.关注完播率、点击、留存等数据，依反馈迭代剪辑手法与开场策略。\n6.规范素材命名与归档，维护素材库与成片库的可追溯性。\n二、必要条件\n1.熟练使用 Premiere／剪映专业版／Final Cut／DaVinci 等至少一款主力剪辑工具。\n2.具短剧、竖屏短视频或影视剧集类成片剪辑经验 1 年以上，能独立完成整集。\n3.对情感／情欲向短剧题材不排斥，能接受相对大胆的内容尺度（面试具体说明）。\n4.节奏感强，理解\"钩子—反转—卡点\"的短剧叙事逻辑，懂平台算法与完播逻辑。\n5.能扛量、抗压，适应量产节奏与周产能目标。\n6.需附上相关作品（短剧／竖屏成片优先，注明负责环节）。\n三、加分项目\n1.有预告片剪辑经验，能剪出情绪与代入感。\n2.会调色、混音、简单特效，或会用 AI 工具（AI 换脸、AI 配音、AI 补帧等）辅助提效。\n3.有二剪／番外／混剪的\"素材增值\"经验，能一片多用。\n4.有稳定高完播／爆款作品案例。\n5.熟悉多平台上架规范与各平台内容偏好。\n四、应聘方式\n请附上：\n1.代表作品 2–3 支（短剧／竖屏成片优先，附上你负责的环节）；\n2.简历与期望薪资；\n3.（加分）一句话说明你剪短剧时最在意的一个点。", "cat": "AI / AIGC"}, {"id": "10", "title": "渠道运营", "salary": "50,000-65,000NTD", "location": "台湾本地驻场办公", "jd": "工作内容：\n -负责自有影音平台的产品营运，规划站内内容排序、专题、首页版位与推播 -规划会员、付费与储值机制的营运活动（档期活动、促销方案、会员分级），并追踪转换成效 -制定内容上架排程与档期，跨部门协作，确保内容与宣传素材如期到位 -分析平台数据（DAU、留存、付费转换、ARPPU 等），产出周报／月报，提出优化方案 -规划导流路径与变现策略，追踪各流量来源的成效 -搜集用户回馈与竞品动态，提出产品功能与体验优化需求，对接技术团队验收上线 -主管交办事项条件要求： -工作经历：2 年以上 -学历：大学以上，科系不拘 -具数据分析能力，熟悉 Excel／Google Sheets（枢纽分析、函数） -逻辑清楚、数字敏感，具良好的沟通协调与专案管理能力加分条件： -具游戏平台、数位内容平台、电商产品营运经验 -操作过会员付费、储值、订阅制等变现机制 -熟悉 GA4、Looker Studio 等数据分析工具 -熟悉 Telegram、X 等社群平台生态", "cat": "商务 / 市场"}, {"id": "11", "title": "品牌AI内容编辑", "salary": "45,000-65,000 NTD", "location": "台湾本地驻场办公", "jd": "工作内容：\n -负责品牌的社群短影音、广告影片、宣传预告剪辑 -将正片素材再制为各平台社群版本（直式／横式、不同秒数） -运用 AI 生成工具产出影片素材，结合后制完成成品 -管理影音素材与版本，配合档期如期交付 -主管交办事项条件要求： -工作经历：1 年以上影片剪辑相关经验 -熟悉 Premiere Pro／CapCut 剪辑软体（至少 1 项）与After Effects -具字幕、调色、音效与节奏剪辑基本能力 -应征请附作品集加分条件： -具 AI 生成影像经验（Runway、Kling、Hailuo、Sora 等图生影／文生影工具） -具 AI 生图经验（Midjourney、Stable Diffusion、ComfyUI 等） -具社群短影音操作经验，了解各平台演算法与爆款节奏 -具动态图像（Motion Graphics）能力", "cat": "AI / AIGC"}, {"id": "12", "title": "AI 美术视觉资产设计师", "salary": "12~18k", "location": "远程", "jd": "1.短剧视觉资产生成（核心职责）\n-根据剧本、人物设定及制作需求，使用 AI 完成角色、场景、道具、服装造型等视觉资产的设计与生成。\n-按制作需求输出角色设定图、三视图、表情与造型变化、场景多角度视图、道具细节图等，供导演与视频制作团队使用。\n-维护同一角色在不同画面中的身份辨识度，以及场景、道具和整体美术风格的一致性。\n2.概念设计与视觉风格开发\n-结合短剧题材、故事氛围与目标受众，探索世界观概念、色彩方案、光影氛围和视觉风格。\n-将文字需求与视觉参考转化为明确的设计方案，通过多版本迭代确定适合项目的美术方向。\n3.数字营销资产制作（核心职责）\n-使用 AI 结合图像编辑与平面设计工具，制作剧集海报、主视觉（Key Visual）、角色宣传图、封面、社交媒体素材及广告投放素材。\n-根据传播目的安排画面焦点、人物关系、标题与信息层级，突出剧集题材、情绪与核心卖点。\n-按不同渠道的尺寸、比例及版式需求输出适配版本，并根据反馈持续优化。\n4.图像精修与品质把控\n-对生成结果进行筛选、局部重绘、合成、修图及调色，修正人物结构、材质、透视、光影与细节问题。\n-把控画面构图、质感与完成度，减少明显的 AI 生成瑕疵，确保交付素材满足后续制作或发布需求。\n5.团队协作与资产管理\n-与编剧、导演、视频制作及营销团队沟通，理解素材用途，按反馈调整并按时交付。\n-按项目规范整理参考图、提示词、生成参数、源文件与成品，做好命名、分类与版本管理，便于团队复用。\n\n硬性要求：\n1.具备可展示的相关作品集——能够体现你的审美、AI 图像生成能力与最终交付质量。未提供作品集者，不安排面试。\n2.熟练使用 AI 图像生成工具——掌握提示词编写、参考图控制、局部修改与多轮迭代，能根据明确需求稳定产出可用素材。\n3. 具备良好的美术与视觉设计基础——理解构图、色彩、光影、透视及材质表现，能够判断画面问题并提出具体改进方式。\n4. 具备角色与项目风格一致性的控制能力——能在连续剧集或同一组资产中维持统一的视觉标准。\n5. 具备图像后期与平面设计能力——熟悉 Photoshop 或同类工具，能够完成精修、合成、排版与多尺寸适配。\n6. 能理解需求并完成交付——能够将剧本描述、导演意见或营销需求转化为具体画面，愿意接受反馈并持续优化。\n加分项：\n⭐️ 具备 AI 视频生成能力——能基于已有角色、场景与关键画面生成视频，理解镜头语言、动作表现及画面连续性，可协助制作短剧片段或动态营销素材。\n⭐️ 有短剧、影视、动画、游戏等项目的美术或视觉资产制作经验。\n⭐️ 有剧集海报、商业主视觉、社交媒体或广告素材的实际制作经验，能围绕不同卖点提出视觉方案。\n⭐️ 熟悉可复用的 AI 生成工作流，能提升批量制作效率与资产一致性。", "cat": "AI / AIGC"}, {"id": "13", "title": "数位行销运营专员（SEO／投流／社群）", "salary": "50,000–60,000 NTD", "location": "台湾本地驻场办公", "jd": "一、SEO（搜寻经营）\n官网关键字策略与页面架构优化、收录与排名监控；品牌词搜寻防御（同名混淆与负面内容排挤处理）；新闻稿与媒体露出的外链布局，将公关发稿转化为长期搜寻资产。目标：品牌词搜寻结果第一页占位。\n二、投流（付费投放）受限产业可用渠道的开发与投放：原生广告联播网、成人向 DSP、Telegram 广告、联盟行销（Affiliate）；落地页 A/B 测试与下载转化优化；投放预算配置与 CAC 控管。目标：可规模化的付费获客管道跑通。\n三、数位行销（整合与归因）UTM 追踪体系与渠道码规范建置维护；GSC、GA4 与后台数据整合，监测自然＋付费流量的转化与留存；周期性成效报告与预算建议；日韩多语言市场的渠道调研与在地化关键字规划。目标：每一块流量都可归因、可覆盘。\n四、社群（导流协作）与社群矩阵运营协作：官方号与矩阵号的导流连结布局、贴文 SEO 化（关键字进文案）、大 V 推广与 KOL 露出的流量承接；社群活动的落地页与转化链路支援。目标：社群声量不白烧，都接进下载转化。\n【资格要求】工作地区可接受新北市inhouse为主二年以上数位行销实务经验，SEO 或付费投放至少精一项、另一项可协作熟悉 GSC、GA4、关键字工具（Ahrefs／Semrush 或同类），具 UTM 归因与转化漏斗分析能力能接受成人向内容产业（必要条件，面谈首轮确认）具内容判断力，能与公关、社群、素材制作跨组协作\n【加分项】成人、游戏、博弈等受限产业流量实战经验Affiliate 渠道建置或原生联播网投放经验外语能力；落地页转化优化（CRO）经验\n【KPI 方向】品牌词占位率／自然流量与收录成长／付费渠道 CAC 与下载转化／官网→下载页转化率／社群导流转化贡献", "cat": "运营"}, {"id": "14", "title": "中级运营", "salary": "10-15k", "location": "远程", "jd": "岗位职责\n负责影音／内容平台的日常运营，包括内容排期、上架、页面配置及质量检查，确保内容按计划上线。\n结合内容特点及用户偏好，优化标题、封面、推荐位与内容分类，提升点击率和观看表现。\n配合业务目标执行专题、推广及用户活动，跟进素材准备、上线进度与效果复盘。\n定期整理曝光、点击、观看、转化及留存数据，发现异常并提出可执行的优化建议。\n对接内容、设计及产品团队，明确需求与交付时间，推动日常运营问题解决。\n运用 AI 工具提高文案、资料整理及报表处理效率，沉淀常用模板与操作流程。\n\n任职要求\n具备 3 年以上内容或平台运营经验，有影音、短剧、娱乐内容相关经验者优先。\n能独立完成运营任务，从需求确认、执行上线到效果复盘形成完整闭环。\n具备内容判断力与文字表达能力，能根据用户偏好调整内容呈现方式。\n熟练使用 Excel 或在线表格，能通过基础数据分析发现问题、验证优化效果。\n工作细致、主动负责，具备良好的沟通能力和时间管理能力。\n能适应全职远程协作，在约定工作时段保持响应，主动同步进度并按时交付。\n\n加分项\n有提升内容点击、用户活跃或付费转化的实际案例。\n熟悉社群运营或海外内容平台。\n能熟练运用 AI 工具辅助日常运营。\n\n应聘时请提供\n个人简历及 1–2 个运营案例，简要说明负责内容、执行动作与实际成果。", "cat": "运营"}, {"id": "15", "title": "AI 短剧项目专员", "salary": "13–16K", "location": "远程\n具备远程办公的自律性，能够按公司要求完成工作、打卡及日常沟通。", "jd": "岗位介绍\n负责 AI 短剧项目的预算核算、乙方对账、付款跟进、月末结算及成片归档。目前每月约 80 部短剧，对接约 10 家乙方，主要按整部或按集交付、结算。\n我们希望你有项目结算、供应商对账或项目统筹经验，能够独立管理台账、发起付款申请，主动跟进进度，及时发现并协调处理异常。\n\n岗位职责\n次月预算核算\n提前一个月，根据业务负责人提供的项目计划、集数及约定单价，核算、汇总次月预算，并跟踪预算与实际费用的差异，及时反馈异常。\n乙方对账与月末结算\n根据约定价格、交付数量及业务负责人确认的验收结果，核对乙方账单；汇总月末费用、已付款及待付款情况，协调业务、财务及乙方解决账单差异。\n付款流程跟进\n收集、检查付款材料，发起付款申请，主动跟进审批与付款结果，更新付款状态，避免漏项、重复申请和延误。\n交付完整性检查\n核查成片数量、版本及文件是否齐全，跟进缺失内容补交；内容质量由业务负责人验收。\n资料交接与归档\n整理成片及剧名、集数、版本、验收记录等基础信息，按规范完成跨部门交接与归档，确保文件可查、版本清晰。\n台账维护与异常跟进\n持续更新预算、交付、验收、结算、付款及归档状态，主动追踪未完成事项，及时反馈风险并推动处理。\n\n任职要求\n有项目结算、供应商对账或项目统筹经验，能够独立负责台账维护及付款申请等流程。\n数字敏感、认真细致，能适应多项目并行，保证账单及台账准确。\n熟练使用 Excel、飞书表格等工具，能使用常用函数进行数据匹配、核对和汇总。\n能快速理解 AI 短剧的基本制作流程，理解交付要求并与乙方有效沟通。\n能使用 AI 工具辅助资料整理、数据汇总和账单检查，对关键金额及付款信息进行人工核验。\n主动跟进意识强，能与业务、财务及乙方协调，推动事项按时完成。\n具备远程办公的自律性，能够按公司要求完成工作、打卡及日常沟通。\n\n加分项\n有 AI 短剧、短剧或其他内容制作行业经验。\n有批量项目、多供应商对账或管理经验。\n有结算台账、交付归档或跨部门协作流程优化经验。", "cat": "AI / AIGC"}, {"id": "16", "title": "商服专员", "salary": "7K-10K", "location": "7.工作地点须在国内，不用海外人员。包括在东南亚生活或有东南亚工作经验人员。", "jd": "岗位职责\n\n1. 负责商务及日常行政支持相关工作的对接、协调与跟进，确保事项及时落实。\n2. 协助处理广告上下架、链接更换、资料整理、表格维护等日常支持性工作。\n3. 负责商务合作过程中相关资料的收集、整理、归档及信息核对。\n4. 跟进合作进度，及时做好信息同步与反馈，协助推进项目顺利开展。\n5. 协助整理日报、工作汇总、台账等相关文档，确保数据准确、更新及时。\n6. 协助跨部门沟通协调，推动各项工作有序开展并按时完成。\n7. 对日常工作中发现的问题进行记录、反馈，并协助跟进处理。\n\n岗位要求\n\n1. 大专及以上学历，专业不限，有商务助理、行政助理、运营支持或相关工作经验者优先。\n2. 具备良好的沟通协调能力和服务意识，能够高效配合各项工作开展。\n3. 工作认真细致，责任心强，具备较强的执行力和条理性。\n4. 熟练使用 Excel、Google Sheets 等办公工具，具备基础数据整理与文档处理能力。\n5. 能够适应多事项并行的工作节奏，具备较好的时间管理和任务跟进能力。\n6. 能接受表格整理、信息核对、资料归档、沟通跟进等日常支持类工作。\n7.工作地点须在国内，不用海外人员。包括在东南亚生活或有东南亚工作经验人员。\n8.有同行业经验、BC、资金盘等敏感业务经历的候选人，不予录用。\n9.年龄要求20-28岁\n\n优先条件\n\n1. 有商务支持、行政助理、运营支持、客户服务等相关经验者优先。\n2. 具备较强的表格整理、数据核对及文档处理能力。\n3. 工作积极主动，能够及时发现问题并做好反馈与跟进。\n4. 具备良好的团队协作意识，沟通顺畅，执行稳定。\n5. 应届毕业生，本科以上，执行力强有相关电脑操作，AI应用基础优先", "cat": "其他"}, {"id": "17", "title": "业务督导专员", "salary": "面议", "location": "未明确", "jd": "核心职责\n\n一、业务巡检与质检\n1. 对各业务岗位开展常态化巡检与专项抽查，核查工作质量与任务完成情况\n2. 核查新人带教与业务培训的落地情况，评估带教效果与培训覆盖率\n3. 核验业务部门日报、周报、会议纪要、巡检报告中的关键事项，识别异常、遗漏、拖延与执行偏差\n\n二、问题闭环与台账管理\n4. 跟进广告数字化、平台运营、商务服务、广告优化等销售转化业务链路中的问题闭环\n5. 建立并维护业务质检台账（问题来源/责任部门/责任人/整改时限/整改结果/复盘结论）\n6. 定期输出业务质检报告、风险提示、巡检结论及整改追踪材料\n\n三、会议协同与制度跟进\n7. 协助完成会议安排、纪要整理、行动项拆解及DDL追踪\n8. 协助发布制度通知、流程要求与规范文件，跟踪各部门反馈、执行情况与完成状态\n\n四、跨部门追踪与风险升级\n9. 跟踪跨部门事项进度，推动问题从\"提出\"走向\"解决\"，确保责任人、时间节点、交付物清晰可查\n10. 对高风险事项及时升级（流程倒挂、数据异常、执行延期、人员履职异常、信息安全及权限风险等）\n\n任职要求\n1. 本科及以上学历，英国G5顶尖院校背景优先；其他候选人若业务履历优秀亦可考虑\n2. 远程工作，需具备英国合法工作身份常驻英国，其他发达国家亦可，东南亚地区不做考虑\n3. 3年以上互联网/广告科技/流量变现/广告联盟/SaaS/平台运营/项目管理/商业分析/运营质检/业务风控相关经验优先\n4. 能理解广告投放、流量承接、线索转化、客户运营等基本业务流程\n5. 具备较强的信息核验、逻辑判断、问题拆解、事项统筹与闭环跟踪能力\n6. 口头与文字表达能力强，能独立整理清晰、准确、适合管理层阅读的材料\n7. 擅长使用AI工具，熟练操作Excel/Google Sheets、协作文档、项目管理工具\n8. 职场成熟度高，严谨细致，能同时处理多线程任务，接受高频沟通与临时专项任务\n9. 入职之前需提供学历证明\n\n加分项\n具备质检/督导/培训管理、总裁办/PMO/战略运营，或MarTech/AdTech/流量商业化增长相关经验者优先", "cat": "职能"}, {"id": "18", "title": "业务运营总监", "salary": "30k-40k", "location": "未明确", "jd": "业务运营总监 （渠道资源方向）\n需求：1人\n\n一、岗位名称\n\n广告数字化部｜广告联盟运营总监招募（渠道资源方向）\n\n二、岗位职责\n\n1. 负责广告联盟业务整体运营与渠道拓展\n\n• 统筹广告联盟业务运营管理，制定业务增长策略并推动落地；\n• 围绕联盟业务目标，拓展、整合并运营优质渠道资源，提升业务规模与合作质量。\n\n2. 引入并管理渠道资源\n\n• 基于现有行业经验和资源积累，快速引入可合作的渠道、流量方或相关合作资源；\n• 建立渠道合作机制，推动合作方的接入、转化、放量和长期维护。\n\n3. 推动业务增长与结果达成\n\n• 对联盟业务核心结果负责，包括渠道增长、资源引入、合作转化、业务规模提升等；\n• 能结合市场变化和业务阶段，及时调整合作策略与运营动作。\n\n4. 协调内部资源推动项目落地\n\n• 联动产品、技术、数据、商务等团队，推动渠道接入、合作上线和问题处理；\n• 对重点合作项目进行全流程推进，保障执行效率和结果交付。\n\n5. 搭建和优化运营机制\n\n• 完善联盟业务的渠道运营流程、合作标准、管理机制及风险控制体系；\n• 提升业务在高流量、高复杂度场景下的稳定性和运营效率。\n\n6. 团队管理与能力建设\n\n• 负责团队管理、目标拆解、过程跟进及人才培养；\n• 建立结果导向、协同高效的业务运营团队。\n\n───\n\n三、任职要求\n\n1. 本科及以上学历，具备 广告联盟、渠道拓展、流量合作、商业化运营 等相关经验；\n2. 有可转化的渠道资源积累，具备独立拓展和导入资源的能力；\n3. 熟悉广告联盟、流量平台、效果广告或相关业务逻辑，能够快速判断资源质量与合作价值；\n4. 具备较强的商务拓展能力、合作谈判能力和资源整合能力；\n5. 具备团队管理经验，能够带团队完成业务目标；\n6. 数据敏感度高，能结合数据判断业务问题、渠道质量与增长机会；\n7. 具备较强的跨部门协同和项目推进能力，能够推动复杂合作快速落地；\n8. 抗压能力强，有较强的结果意识和业务 ownership。\n\n───\n\n四、优先条件\n\n1. 自带广告渠道、流量渠道、联盟合作方资源者优先；\n2. 有成熟渠道网络，能够在短时间内推动资源落地者优先；\n3. 有广告联盟、商业化平台、效果投放、流量变现相关行业背景者优先；\n4. 有从 0 到 1 开拓渠道，或从 1 到 N 放大合作规模经验者优先。\n\n───\n\n五、我们重点看重\n\n• 是否 自带资源\n• 是否 能直接开合作\n• 是否 能把资源转成结果\n• 是否 能兼顾拓展 + 运营 + 管理", "cat": "运营"}, {"id": "19", "title": "渠道专员", "salary": "15k-25k", "location": "未明确", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "商务 / 市场"}, {"id": "20", "title": "中高级网站运营（SEO / Growth）", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n1.负责网站从 0 到 1 的整体运营工作，对网站流量增长及用户增长负责。\n2.制定并落地网站 SEO 策略，包括关键词规划、栏目建设、内容优化、内链布局及技术 SEO 优化。\n3.负责 Google Search Console、Google Analytics 等数据分析，持续优化网站收录、索引及自然搜索表现。\n4.规划网站内容体系、标签体系及专题页面，提高网站整体内容质量及搜索覆盖率。\n5.负责 X（Twitter）、Telegram、Reddit 等海外社交平台运营，提升品牌曝光及用户增长。\n6.持续跟踪行业动态及竞争对手，制定运营优化方案。\n7.与产品、开发团队协同推进运营需求，不断完善网站功能及用户体验。\n8.建立网站运营规范及数据分析体系，定期输出运营分析报告。\n\n任职要求\n1.3 年以上网站运营或 SEO 运营经验，有独立负责网站项目经验。\n2.熟悉 Google SEO 原理，具备完整的网站优化经验，能够独立制定并执行 SEO 策略。\n3.熟练使用 Google Search Console、Google Analytics（GA4）、Ahrefs、Semrush 等工具。\n4.熟悉网站收录、索引、关键词排名、内容规划及网站结构优化。\n5.熟悉海外社交媒体平台（X、Telegram、Reddit 等）运营规则，有实际增长经验者优先。\n6.具备较强的数据分析能力，能够根据数据发现问题并推动优化。\n7.具有良好的项目管理及跨部门沟通能力，具备较强的执行力和责任心。\n\n加分项\n1.有海外内容网站、资源站、媒体站、社区平台运营经验。\n2.有 AI 内容生产及 AI 工作流搭建经验。\n3.熟悉 Cloudflare、WordPress、HTML/CSS、Schema、Sitemap 等网站技术。\n4.有 Google Discover、Email Marketing、Affiliate、站群运营等经验。", "cat": "运营"}, {"id": "21", "title": "商务专员", "salary": "10-15k", "location": "未明确", "jd": "岗位职责\n\n1、独立客户开发：能够独立开展客户开发、商务洽谈及合作推进工作，持续提升新增客户数量与合作转化率\n2、重点合作推进：能够独立跟进重点客户、续费客户及复杂合作事项，处理合作中的常见问题，保障合作顺利落地与持续推进\n3、业务结果达成：对个人业绩目标、新增合作、续费推进及回款结果负责，结合业务情况及时调整跟进节奏并完成目标任务\n4、数据与经验沉淀：负责整理个人客户台账、业务数据及跟进经验，沉淀有效话术、方法和合作案例，提升个人业务复用效率\n5.特殊业务需求：熟悉男性向/同志向内容生态及私域社群场景，了解相关用户沟通方式、社群规则和客户需求；具备同性内容、成人传媒、私域流量、社群商务或相关广告推广资源经验优先。（第5条要求，岗位缺口一人）\n\n必备：执行力、学习能力、目标意识与独立推进能力、抗压能力、客户开发、关系维护、复杂问题处理能力", "cat": "商务 / 市场"}, {"id": "22", "title": "综合预算商务", "salary": "面议", "location": "未明确", "jd": "岗位职责\n拓展符合准入要求的网盟预算、电商预算和游戏预算，建立目标客户池。\n核实客户主体、行业、预算来源、付款主体、目标市场及投放内容。\n推进客户从线索、准入、报价、合同、付款到交付的完整流程。\n协同合规、法务及财务补齐KYB／KYC、合同、发票和付款材料。\n管理客户线索池、进度、问题和成交预测，定期输出商务管道报告。\n任职要求\n3年及以上海外广告、程序化、媒体投放或企业客户商务拓展经验。\n熟悉网盟、电商或游戏客户的预算决策链路、投放需求和成交流程，具备其中一类客户资源者优先。\n能识别客户主体、付款主体、合同及业务真实性的基本风险。\n具备英文商务沟通、跨时区协作和书面材料整理能力。\n结果导向，能独立推进客户开发、签约及广告预算引入。\n试用期核心交付：建立网盟、电商和游戏预算客户清单；推进至少1家合规客户进入准入／签约流程；形成线索到预算入账的商务跟进模板。\n\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "商务 / 市场"}, {"id": "23", "title": "海外商务总监", "salary": "面议", "location": "远程办公　·　签订正式合同　·　欧元发薪　·　薪资待遇：Open 底薪＋绩效提成　·　试用期：3个月", "jd": "岗位介绍\n我们正在寻找一位能够直接带入海外广告预算资源的商务总监，负责Admarq预算侧业务拓展、重点客户合作及商务团队建设。候选人需要理解广告行业与市场趋势，并能将既有客户关系转化为合规准入、合同签署、对公付款和实际投放。业务交付覆盖两条路径：在大媒体平台开户投放，以及在自有DSP平台完成程序化投放。\n带资源：本岗位的必备门槛\n候选人至少在以下方向具备一类可落地预算资源：D2C品牌与独立站、海外电商、海外游戏、国内CPA／应用推广；短剧、工具类或海外应用预算亦可。\n资源需能够直接触达预算决策人，预算需求、目标市场和投放平台相对明确，并具备在入职后30-60天内推动准入、签约或测试投放的现实基础。面试阶段可提交脱敏资源说明，无需披露客户机密。\n岗位职责\n负责海外广告预算侧商务拓展，制定客户开发策略、行业优先级、预算目标及阶段推进计划。\n持续跟踪D2C、海外电商、游戏、短剧、应用推广及效果营销趋势，识别可进入大媒体或DSP交付的预算机会。\n激活并维护自有客户资源，推动需求确认、商务谈判、准入审核、合同签署、付款及实际投放。\n深度理解客户的产品、GEO、平台、预算规模、ROI／ROAS目标和结算模式，协同投放及产品团队形成可执行方案。\n建立并持续更新预算资源池与销售漏斗，管理商机阶段、预计金额、启动时间、转化概率、实际消耗和续投计划。\n协同投放运营、产品研发、合规、法务及财务团队，解决开户、付款、素材审核、数据归因、对账和结算问题。\n负责商务团队的目标拆解、过程管理、业务辅导和结果复盘，对签约、消耗、收入、毛利及续投结果负责。\n任职要求\n具备5年及以上数字广告、效果营销、广告平台或海外增长相关商务经验，有重点客户或商务团队管理经验。\n必须具备可直接触达的预算资源，并能说明资源类型、主要市场、预算区间、决策链路、历史合作及预计启动条件。\n对海外广告生态、客户预算结构、媒体渠道和程序化投放趋势有较强理解，能够判断机会质量与交付风险。\n具备独立开发和服务重点客户的能力，能够完成从客户接洽、方案沟通、商务谈判到预算落地的完整流程。\n结果导向，愿意以有效商机、签约付款、实际消耗、收入毛利及客户续投作为核心业务结果。\n具备较强的跨部门协同和项目推进能力，能够与投放、产品、合规、法务、财务团队并行推进。\n具备英文读写与商务沟通能力，能够对接海外客户、合作伙伴及广告平台。\n\n面试资源核验\n提供脱敏资源清单：行业／产品、GEO、预算区间、投放平台、关系类型、决策人可达性、预计启动时间及历史落地案例。\n\n试用期结果验证\n0-30天完成资源分级和首批客户推进；31-60天推动重点客户进入准入、签约或测试；61-90天以实际付款、投放消耗和后续预算管线验收。具体金额以Offer确认目标为准。\n核心考核方向\n有效预算资源数量、金额、启动时间及销售漏斗准确度。\n完成准入、签约和对公付款的客户数量与转化周期。\n客户实际投放消耗、收入、毛利、续投率及扩量结果。\n重点客户稳定性、回款与对账质量，以及商务团队目标完成率。\n远程办公　·　签订正式合同　·　欧元发薪　·　薪资待遇：Open 底薪＋绩效提成　·　试用期：3个月\n\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "商务 / 市场"}, {"id": "24", "title": "SEO 工程师", "salary": "20k-25k", "location": "3. 责任心强，有团队协作意识，适应远程办公的工作方式", "jd": "一、岗位职责\n1. 负责公司在建和已上线站群的 SEO 优化，持续提升收录、排名和自然流量\n2. 针对 Google、Bing、Yandex 制定并落地 SEO 策略，按站点和项目目标选择合适的打法\n3. 直接在代码层面做技术 SEO 调整，包括 TDK、URL 结构、内链、sitemap、robots、结构化数据、多语言 hreflang 和页面速度等\n4. 在新站开发阶段参与评审，提前把 SEO 需求落进页面结构和模板里\n5. 排查收录、索引、降权、抓取异常等问题，长期跟踪数据，持续复盘优化\n6. 用 AI 工具提升内容生产、关键词挖掘和 SEO 批量处理的效率\n二、任职要求\n1. 学历、工作年限不限，以能力和实际成果为准\n2. 熟悉 Google、Bing、Yandex 的站长平台和收录、排名规则，有实际操作经验\n3. 能自己读懂和修改网页代码（HTML、基础 JS，以及 React/Next 等前端项目），独立完成 TDK、结构化数据等技术 SEO 改动\n4. 熟悉白帽、灰帽、黑帽等各类 SEO 手段，了解各自的效果和风险，能按项目目标灵活取舍\n5. 有站群 SEO 经验，熟悉站群的链接布局、内容策略和防关联\n6. 数据敏感，会用 GSC、Bing Webmaster、Yandex Webmaster、Ahrefs、Semrush 等工具分析问题、复盘效果\n7. 会用 ChatGPT、Claude、Cursor 等 AI 工具辅助日常工作\n综合素质\n1. 沟通能力强，乐于主动沟通，能和开发、运营等不同角色高效对接\n2. 能准确理解业务需求，清楚表达方案和进度，有问题及时反馈、主动推进\n3. 责任心强，有团队协作意识，适应远程办公的工作方式\n三、加分项\n• 有成功的站群或流量项目案例，能提供数据\n• 做过 AI 批量生成内容、程序化 SEO 相关的项目\n• 会写 Python 爬虫或自动化脚本\n• 投递时可附上做过的网站链接、排名或流量截图（选填，有则优先）", "cat": "技术 / 数据"}, {"id": "25", "title": "AI短剧导演", "salary": "面议", "location": "未明确", "jd": "1. 岗位职责：\n- 根据业务目标，负责AI短剧内容策划、项目规划及制作统筹，推进项目落地。\n- 搭建并完善制作流程，制定生产计划，合理安排任务，把控制作进度。\n- 协调编剧及视频制作人员，将剧本转化为可执行的制作方案，推动各环节协作。\n- 把控剧情表达、镜头呈现、视听节奏及整体风格，负责内容审核、成片质量和项目交付。\n- 根据项目反馈，持续优化选题方向、内容表现和制作流程，提升出片效率，积累可复用的制作方法及素材。\n\n2. 任职要求：\n- 有ai短剧、影视、动画、剧情短视频、广告短片或其他AI影像等相关内容制作经验，欢迎具备项目统筹和成片交付能力、希望向AI短剧方向发展的候选人。\n- 理解从策划、剧本、分镜到制作、剪辑及成片交付的基本流程，能够独立推动项目，并协调解决制作中的问题。\n- 具备内容判断和基础视听表达能力，能够对剧情节奏、镜头设计、画面风格及剪辑效果提出明确的修改意见。\n- 对AI内容制作有实践或基本了解，使用过相关AI创作工具；精通视频、绘图、配音和剪辑等工具，有持续学习能力，并能结合项目需求组织应用。\n- 具备计划执行、沟通协调及质量把控能力，能够合理安排任务，根据反馈推动修改，保证交付进度和质量。\n\n3. 加分项：\n- 有完整AI短剧、AI短片或其他AI影像项目经验。\n- 有小团队管理、项目带组或跨岗位协作经验。\n- 有制作流程搭建、工作方法沉淀或出片效率优化经验。\n\n4. 作品说明：\n- 欢迎随简历提供完整短片、剧情短视频、AI影像或其他相关代表作品，并注明本人负责的环节。\n商业项目、团队项目及个人创作均可，不强制要求已有完整AI短剧案例；团队作品需说明本人在策划、导演、制作或统筹中的具体贡献。", "cat": "AI / AIGC"}, {"id": "27", "title": "AI视频制作专员", "salary": "面议", "location": "未明确", "jd": "岗位职责：\n1. 负责AI短剧、短视频等内容制作与输出。\n2. 依据剧本完成AI画面、角色、场景及素材生成。\n3. 完成剪辑、配音、字幕、音效和后期制作。\n4. 配合编剧及负责人完成成片修改和优化。\n5. 维护制作素材库，持续改进制作效率与质量。\n任职要求：\n1. 具有AI视频制作、短视频剪辑或影视后期经验。\n2. 熟悉AI视频、AI绘图及音视频处理工具。\n3. 熟练使用剪映、Premiere等至少一种剪辑工具。\n4. 具备镜头语言、画面构图和视频节奏把控能力。\n5. 能独立完成从素材生成到成片交付，有作品案例者优先。", "cat": "AI / AIGC"}, {"id": "28", "title": "海外主体合规运营专员", "salary": "面议", "location": "工作方式： 远程办公，需要时赴欧洲出差（公证、开户等）\n• 能接受远程办公和不定期出差", "jd": "岗位概述\n工作方式： 远程办公，需要时赴欧洲出差（公证、开户等）\n负责公司立陶宛主体从 0 到 1 的设立，以及设立后的合规运营。先完成注册和开户，再支持当地业务拓展。\n▎阶段一：主体设立\n\n负责立陶宛 UAB 设立的全流程执行：在注册中心（Registrų centras）预留公司名称、登记注册地址、准备公证和认证文件、完成公司注册；董事会决议等公司文件经法务部审核后使用\n在 JANGIS 系统完成受益所有人登记\n配合法务部完成律所筛选（由法务部从专业线评估并主导选定），对接当地服务商完成税务局 VAT 登记\n和会计一起评估新设小企业所得税优惠的适用条件，做好税务规划\n完成支付账户开设（Paysera、Revolut Business 等），负责 KYC 材料的收集、整理和提交，提交前经法务部审核\n\n▎阶段二：合规与业务运营\n\n建立合同、发票、财务档案的完整管理体系，配合会计完成首年及日常申报\n负责受益所有人信息的准确申报和及时更新\n收集客户资质材料，配合合规部完成客户资质与行业合规审核，配合银行或 EMI 的定期复审\n按爱沙尼亚主体的业务定位（区域、广告类型）参与客户开发，使用经法务部审核的合同模板配合完成签约\n定期汇报主体运营、资金和合规情况\n\n✅ 任职要求\n• 有欧盟公司设立的实操经验：至少主导完成过 1 家欧盟公司从注册、开户到正常运营的全流程\n• 有 EMI 开户实操经验，能独立完成 KYC 并通过审核\n• 熟悉欧盟增值税登记和申报的逻辑\n• 英语可作为工作语言，能独立与服务商、会计师、律所和客户沟通\n• 能接受远程办公和不定期出差\n\n⭐️ 加分项\n• 有波罗的海或中东欧国家的市场或注册经验\n• 了解 UAB 注册流程、名称预留机制和 JANGIS 系统\n• 广告行业相关经验", "cat": "运营"}, {"id": "29", "title": "素材设计师", "salary": "10k-20k", "location": "未明确", "jd": "\"岗位职责：\n2年及以上品牌设计相关工作经验，有成功的案例展示;\n有较好的字体设计能力，logo设计出色，色彩敏锐度高\n负责广告投放素材设计（Banner、弹窗、启动页、信息流等），以提升CTR和转化为核心目标；\n根据投放数据反馈，持续优化素材表现，具备数据驱动设计能力（能根据CTR调整视觉与文案结构）；\n参与A/B测试素材设计，输出多版本创意（标题、配色、构图等），支持广告效果验证；\n能快速理解产品卖点，拆解用户点击动机，设计高转化素材（强钩子+视觉引导+CTA）；\n配合运营/优化团队，完成不同渠道、不同广告位尺寸的适配与批量产出；\n支持GIF/简单动效素材制作，有视频或动效经验优先；\n配合AI工具进行素材生成与优化（如批量出图、改版、扩展尺寸等），提升产出效率。\n\"", "cat": "设计"}, {"id": "30", "title": "资深广告策略优化师", "salary": "10k-30k", "location": "未明确", "jd": "\"岗位职责\n\n负责公司自有广告联盟平台的广告策略制定与持续优化，结合产品类型、用户画像、广告位特点及历史数据，制定具体的广告优化方案。\n\n持续监控曝光量、点击量、CTR、CVR、CPC、CPA、ROI、广告收入等核心指标，识别数据异常、素材疲劳、低效广告位及低效产品，并及时制定优化策略。\n\n负责广告素材策略制定，包括用户需求分析、核心卖点提炼、创意方向、文案策略、视觉表现及素材结构，并推动设计团队完成素材制作与上线。\n\n建立并执行A/B测试机制，对不同素材、文案、广告形式、广告位及用户群体进行测试，根据实际数据持续迭代优化。\n\n负责高CTR、高转化素材的分析与复盘，提炼不同产品、用户群体及广告位的有效素材规律，建立高效素材库及跨产品复用机制。\n\n负责广告位价值分析，识别高效与低效广告位，并针对低效位置提出素材替换、策略调整、资源重新分配或其他优化建议。\n\n结合历史数据分析素材生命周期及CTR变化趋势，建立素材疲劳预警、B方案储备及快速替换机制。\n\n参与公司广告BI看板、数据分析体系、广告收入归因体系及用户标签体系建设，提升广告优化工作的数据化与标准化水平。\n\n对不同产品和业务部门的广告表现进行横向分析，识别可复制的成功经验，并推动优秀素材和策略跨产品、跨部门应用。\n\n与商务、运营、产品、设计、技术及数据团队协作，推动广告优化从数据分析、策略制定、素材生产、上线测试到效果复盘的完整闭环。\n\n任职要求\n\n3年以上广告投放、广告策略、效果营销或广告优化相关工作经验，有资深广告优化师、广告策略师、Media Buyer或Performance Marketing相关经验优先。\n\n有主流媒体平台实际投放或优化经验，包括但不限于Google Ads、Meta Ads、TikTok Ads等；\n无需在本岗位中负责上述平台的日常投放，但需要理解成熟媒体平台的投放逻辑、测试方法及优化体系。\n\n具备较强的数据分析能力，能够独立分析曝光、点击、CTR、CVR、CPC、CPA、ROAS、ROI等指标，并能够从数据变化中判断素材、流量、广告位或用户匹配方面的问题。\n\n有博彩、社交、Dating、直播、游戏等产品投放或广告优化经验者优先，尤其欢迎具备博彩或社交类产品实际项目经验的候选人。\n\n具备较强的广告素材策略能力，能够从用户心理、产品卖点、文案钩子、视觉表现、广告场景及目标用户等维度判断素材效果。\n\n熟悉A/B测试方法，能够独立制定测试变量、测试周期、评价指标及后续优化动作。\n\n熟悉素材生命周期管理，能够判断素材疲劳、CTR衰退及异常数据，并及时制定替换或迭代方案。\n\n熟练使用Excel或Google Sheets进行数据分析；掌握Python、Power BI、Tableau等工具者优先。\n\n具备较强的逻辑分析和问题解决能力，能够将数据结论转化为明确、可执行的广告优化动作。\n\n具备良好的跨部门沟通能力，能够协调商务、设计、运营、产品及技术团队共同推进项目落地。\n\n加分项\n\n有Google、Meta、TikTok等大型媒体平台较大规模预算管理经验。\n有博彩、社交、Dating、直播或游戏行业成功优化案例。\n\n有自有广告平台、广告联盟、SSP、DSP、ADX或程序化广告相关经验。\n\n有从0到1搭建广告优化体系、A/B测试机制、高CTR素材库或数据分析体系的经验。\n\n熟悉AI工具在广告创意分析、素材生成、数据分析和批量生产中的应用。\"", "cat": "商务 / 市场"}, {"id": "31", "title": "业务审查储备组长", "salary": "12–18k", "location": "工作细致、原则性强，具备较高的风险意识、保密意识和远程办公自驱力。", "jd": "岗位职责\n负责关键词提醒、审查台账及出款单、让利单、补量单、上下架单等业务单据核查，确保当日事项及时处理、无漏审漏单。\n组织直属部门信息安全抽检及新人入职风控检查，发现问题及时整改，并依据《违规问题分级处置口径》完成问题定级及报告输出。\n负责组员日报审核、团队周报签发及组内复盘，持续跟进未闭环事项，并及时向上级反馈风险及卡点。\n对接各品牌商务组长、商务服务部、财务等部门推动问题整改，对现有制度及流程中的风险点提出优化建议。\n负责新人带教及审查员日常管理，包括独立上岗培养、工作质量考核及值班安排。\n配合开展专项核查，包括聊天记录审查、收款地址核验、降价续费核查、内部欠款及资金划转事项跟进等。\n推动 AI 在审查工作中的应用，包括关键词风险研判、台账异常比对、审查报告起草及案例分析，并将重复性核查工作沉淀为可复用流程；严格按照部门数据安全规范使用 AI 工具。\n\n任职要求\n\n大专及以上学历，财务、审计、法律、数据相关专业优先；1 年以上审计、风控、财务核查或合规经验，1 年以上带团队经验。\n具备较强的单据及业务核查能力，能够独立核对收款方、金额、时间、审批链与实际业务的一致性，并推动异常问题整改闭环。\n熟练使用 Excel、Google 表格，掌握筛选、透视、跨表引用等常用功能；熟悉 Telegram 群组协作优先。\n熟练使用 ChatGPT、Claude 等 AI 工具进行数据整理、异常筛查、文档撰写及案例分析，有 AI 融入实际工作流程的经验；能够理解基础表格公式或脚本输出，并具备数据安全意识。\n工作细致、原则性强，具备较高的风险意识、保密意识和远程办公自驱力。\n具备较好的书面表达能力，能够清晰区分事实、依据、判断及结论，独立完成审查报告。\n\n加分项\n具备广告 / 流量行业经验，了解 USDT 收付款及链上核验；熟悉 SQL、数据看板，或有 AI / 脚本自动化核查经验。", "cat": "其他"}, {"id": "33", "title": "高级商服专员", "salary": "12,000–18,000", "location": "7. 工作地点须在国内，不用海外人员，包括在东南亚生活或有东南亚工作经验人员。", "jd": "岗位职责\n1. 独立承接 1–2 个业务部门的商服全流程，包括广告上下架、链接与素材更换、排序及扩展配置、前端核验与台账维护，对该业务线交付结果负责。\n2. 负责广告后台迁移与批量操作，独立完成迁移前置核对、批量执行、前端验收及新旧后台对照记录。\n3. 负责前端巡检与异常闭环，能独立定位展示异常、链接失效、配置错误等问题的根因，并推动运营、技术等对口部门处理至闭环。\n4. 负责所辖业务线的数据口径与台账规范，保证后台、前端、表格三方一致，输出可复核的工作量与异常记录。\n5. 承担新人带教，沉淀操作 SOP 与常见问题文档，推动组内标准化。\n6. 应用 AI 工具与自动化手段优化重复性工作，提出并落地可量化的提效改进。\n7. 对接商务与广告主需求，独立完成需求确认、优先级判断与结果反馈，处理跨部门协调事项。\n岗位要求\n1. 本科及以上学历。\n2. 2 年以上广告运营、后台运营、商务支持或互联网运营支持经验，有独立承接业务模块的经历。\n3. 熟练使用 Excel、Google Sheets，掌握常用函数、数据透视与多表核对，能独立完成数据整理与异常排查。\n4. 具备 AI 工具应用能力，能借助 AI 完成信息整理、文档输出或流程优化。\n5. 具备问题定位与跨部门推动能力，能清楚描述问题现象、影响范围与处理进度。\n6. 工作细致、责任心强，能适应多业务线并行与高频批量任务节奏。\n7. 工作地点须在国内，不用海外人员，包括在东南亚生活或有东南亚工作经验人员。\n8. 有同行业经验、BC、资金盘等敏感业务经历的候选人，不予录用。\n9. 年龄 22–30 岁。\n优先条件\n1. 有广告投放后台、SSP/DSP 或同类广告管理系统操作经验者优先。\n2. 有自动化工具使用或搭建经验（脚本、机器人、表格自动化等）者优先。\n3. 有新人带教、SOP 编写或流程标准化经验者优先。\n4. 有跨部门项目推动或异常处置经验者优先。\n5. 具备数据敏感度，能从日常数据中主动发现异常并预警者优先。", "cat": "其他"}, {"id": "34", "title": "商服质量与数据专家", "salary": "18,000–23,000", "location": "7、工作地点须在国内，不用海外人员，包括在东南亚生活或有东南亚工作经验人员。", "jd": "岗位定位\n部门的质量管理、数据统计与流程标准负责人，为部门运营提供体系支撑与经营分析。\n\n岗位职责\n1、负责部门质量管理体系，建立并维护差错率、返工率、闭环率等质量指标，定期输出质量分析并推动问题改进。\n2、负责部门数据与统计体系，制定统一的统计口径与填报规范，输出周报、月报、季报的数据底稿。\n3、负责SOP体系的制定、更新与执行检查，将各组沉淀的操作方法统一整理为可执行的部门标准。\n4、负责新部门承接的流程标准与验收标准，为各组承接新业务提供统一的接入清单与检查规范。\n5、负责培训内容与带教体系建设，编写新人培训材料、操作手册与常见问题文档。\n6、负责跨部门协作流程规范，梳理商务、运营等部门的需求提交标准与信息对接要求。\n7、为部门提供经营数据分析与决策支持，识别运营风险并提出改进建议。\n\n岗位要求\n1、本科及以上学历。\n2、4年以上互联网运营、质量管理、数据分析或流程管理经验，有搭建质量体系、数据体系或流程标准的完整经历。\n3、熟练使用Excel、Google Sheets进行数据分析，掌握函数、数据透视与多表核对，能独立输出分析报告。\n4、具备体系化思维，能将分散的经验与问题归纳为可执行的标准和规则。\n5、具备出色的文档撰写与跨部门沟通能力，能推动规范在团队中落地执行。\n6、具备AI工具应用能力，能借助AI完成数据整理、文档输出与流程优化。\n7、工作地点须在国内，不用海外人员，包括在东南亚生活或有东南亚工作经验人员。\n8、有同行业经验、BC、资金盘等敏感业务经历的候选人，不予录用。\n9、年龄25–35岁。\n\n优先条件\n1、有广告运营或平台运营的质量管理、数据分析经验者优先。\n2、有SOP体系或培训体系从零搭建经验者优先。\n3、有SQL、BI工具等数据分析工具使用经验者优先。", "cat": "其他"}, {"id": "35", "title": "DSP运营（国内&海外", "salary": "面议", "location": "未明确", "jd": "岗位职责\n\n1. 协助流量接入：对接 SSP、广告网络和流量方的客户经理，跟进测试流程，整理并跟踪各家的流量规模、广告格式、竞价请求字段（设备 ID 等）和起投价。\n2. 流量源评估与筛选： 按规模、质量和成本对流量源做对比，协助建立合作、暂停或淘汰的标准。\n3. 广告数据分析： 每日监控展示、点击、转化、消耗和 ROI，分析 eCPM、胜率、点击率、转化率等指标，产出日报和周报，并提出可执行的优化建议。\n4. 转化回传与数据对账： 协助对接 S2S 回传，核对平台、广告主和第三方数据的差异，排查回传延迟或缺失。\n5. 流量质量监控： 识别点击率异常、无效流量和作弊嫌疑，跟流量方沟通并推动整改。\n6. 跨团队协作：配合投放、技术和商务团队，推动人群包上线、追踪设置和问题排查，跟进广告主的反馈。\n\n任职要求\n\n- 本科及以上学历，1 到 3 年程序化广告、广告联盟或 DSP / SSP 相关运营经验。\n- 熟悉 RTB 竞价流程，了解 CPM、CPC、CPA 等计费方式，以及展示、点击、转化的漏斗指标。\n- 对数据敏感，熟练使用 Excel 或 Google Sheets，会基本的 SQL 更佳。\n- 英语能达到日常邮件和沟通水平，可以直接和海外客户经理对接。\n- 沟通主动，责任心强，能同时跟进多个流量源和项目。\n\n加分项\n\n- 有 Adsterra、HilltopAds、Traforama 等网盟或类似推送、弹窗、原生流量的对接经验。\n- 熟悉 Keitaro、Voluum 等追踪工具，了解 S2S postback、子 ID 和归因规则。\n- 了解设备 ID（GAID / IDFA）、人群包和隐私合规要求。\n- 有东南亚、欧美市场投放经验，或电商、短剧类投放经验。\n- 使用过 BI 工具，或会 Python 做数据处理。", "cat": "运营"}, {"id": "36", "title": "Web端中高级内容运营", "salary": "18-22k", "location": "未明确", "jd": "1、岗位职责\n1、负责公司Web端产品的日常内容运营，包括内容更新、分类整理、专题策划及内容推荐。\n2、根据产品定位和用户需求，制定内容运营计划，持续提升网站内容质量和用户活跃度。\n3、负责短剧、视频、漫画、小说等内容的筛选、整理、上架及日常维护。\n4、关注行业热点及竞品动态，挖掘热门内容，策划相关专题及推广活动。\n5、结合网站访问量、内容点击量、用户浏览行为等数据，持续优化内容布局及推荐策略。\n6、配合产品、技术及推广团队，推动内容相关功能优化，提升用户体验。\n7、熟练运用AI工具辅助内容整理、文案创作、专题策划，提高运营效率。\n\n2、任职要求\n1、互联网内容运营经验，有网站或内容平台运营经验者优先。\n2、熟悉内容运营流程，具备较好的内容策划、编辑及组织能力。\n3、对互联网热点敏感，能够结合用户喜好挖掘有吸引力的内容。\n4、具备基础数据分析能力，能够根据运营数据调整内容策略。\n5、熟悉SEO基础知识，有内容型网站运营经验者优先。\n6、工作积极主动，具备较强的执行力、责任心及团队协作能力。\n7、有影视、短剧、漫画、小说、娱乐或成人内容平台运营经验者优先。", "cat": "内容"}, {"id": "37", "title": "APP端中高级内容运营", "salary": "18-22k", "location": "未明确", "jd": "一、岗位职责\n\n1、负责公司APP产品的日常内容运营，包括内容更新、推荐、分类管理及内容质量维护。\n2、根据APP产品定位及用户喜好，制定内容运营计划，提升用户活跃度及使用体验。\n3、负责热门内容筛选、专题策划、内容推荐及相关运营活动的执行。\n4、关注用户反馈及内容消费数据，持续优化内容推荐、展示方式及更新节奏。\n5、结合用户活跃、内容点击、观看时长及留存等数据，分析内容运营效果并进行优化。\n6、关注同类APP产品及行业热点，及时调整内容运营方向。\n7、配合产品及技术团队，提出内容展示、推荐机制及用户体验方面的优化建议。\n8、运用AI工具辅助内容策划、素材整理及日常运营工作，提高工作效率。\n\n二、任职要求\n1、APP内容运营或移动互联网运营经验。\n2、熟悉APP内容运营流程，具备内容策划、专题运营及内容推荐经验。\n3、对用户需求和内容热点具有较强的敏感度，能够判断用户喜好的内容方向。\n4、具备一定的数据分析能力，能够根据用户行为及运营数据优化内容运营。\n5、熟悉短剧、影视、漫画、小说、娱乐等内容产品者优先。\n6、具备良好的沟通协调能力、执行力及团队协作意识。\n7、有内容型APP、娱乐社区或成人内容平台运营经验者优先。", "cat": "内容"}, {"id": "39", "title": "高级UI设计师", "salary": "18-25K", "location": "未明确", "jd": "硬性条件要求：\n1.简历方向：重点挖掘人在国内，有过大厂UI履历的候选人；\n2.行业要求：近2年在海外做过BC/体育/游戏项目或相关背景的均不考虑；\n3.设计方向：作品需要以 UI 设计为主，纯视觉 / 平面设计背景的均不考虑；\n\n岗位职责\n1、负责公司核心产品（Web / App / 小程序等）的整体 UI 视觉设计与优化升级\n2、参与设计规范与设计系统（Design System）的搭建与维护\n3、深度参与产品需求讨论，提供专业的交互与视觉解决方案\n4、运用 AI 工具提升设计效率，包括但不限于：\n    ·使用 AI 进行界面草图生成、创意发散，视觉表达及设计提案输出\n    ·推动设计流程升级，探索 AI + 设计的新工作模式\n\n任职要求\n1、本科及以上学历，设计类相关专业优先\n2、5 年以上 UI / 视觉设计经验，有成熟线上产品案例（硬性要求）\n3、精通 Figma / Sketch / Adobe/ Photoshop / Illustrator 等设计工具\n4、具备良好的用户体验意识和交互理解能力\n5、具备完整的设计系统构建经验优先\n6、优先国内大厂经验\n\nAI 能力要求（重点）\n1、熟练使用主流 AI 工具提升设计效率，例如：\nChatGPT / Claude（用于设计思考与文案优化）\nMidjourney / Stable Diffusion（视觉创意生成）\nRunway / AI 视频工具（动态视觉探索）\n2、有 AI + 设计落地项目经验者优先", "cat": "设计"}, {"id": "40", "title": "白帽SEO", "salary": "10-25K", "location": "未明确", "jd": "岗位职责\n\n1、负责视频站在 Google、Bing、Yandex 三大搜索引擎的自然流量增长，独立承担收录量、关键词覆盖、自然流量等核心指标。\n\n2、基于三大引擎排名逻辑的差异（Google 侧重内容权威性与用户体验信号、Bing 更依赖结构化数据与页面规范、Yandex 以用户行为因子为主导），分别制定并落地差异化的优化方案，不套用单一打法。\n\n3、统筹视频内容从生产到分发全链路的 SEO 落地，包括页面结构、标题与描述规范、视频结构化数据（VideoObject）、视频站地图、转录文本与字幕、缩略图与内链体系，确保内容结构、技术架构与传播路径共同服务于多引擎搜索表现。\n\n4、搭建跨引擎的效果评估体系，拆解各平台流量增长的关键杠杆，输出定期数据复盘，为策略迭代与资源投入优先级提供依据。\n\n5、跟踪三大引擎的算法更新与生态变化，评估对现有策略的影响，及时推动方向调整。\n\n6、推动 SEO 要求前置到内容生产环节，与内容、产品、技术团队建立协同机制，将优化动作从事后补救转为事前内置。\n\n任职要求\n\n1、本科及以上学历，3 年以上 SEO 运营经验，有视频站、内容站或大型站点（十万级以上页面）实操经验者优先。\n\n2、具备至少两个搜索引擎的实战经验，熟悉 Google 之外 Bing 或 Yandex 的收录与排名机制，能说清各引擎的差异而非只做过 Google。\n\n3、熟练使用 Google Search Console、Bing Webmaster Tools、Yandex Webmaster 及主流第三方工具（Ahrefs／Semrush／GA4 等），具备独立的数据分析与归因能力。\n\n4、掌握技术 SEO 基础：抓取与索引机制、站点架构与内链、结构化数据、页面性能与 Core Web Vitals、站点地图与 robots 规则，能与研发有效对齐需求。\n\n5、具备良好的跨团队沟通与推动能力，能将 SEO 需求转化为内容与产品可执行的规范。", "cat": "运营"}, {"id": "41", "title": "高级前端开发工程师（H5)", "salary": "20-30k", "location": "未明确", "jd": "岗WEB高级开发（熟悉flutter）\n\n\n职位描述：\n岗位职责：\n1. 负责公司Web前端和flutter移动客户端相关产品的架构设计和开发、维护；\n2. 负责公司 api的制定，和相关设计文档的编写；\n3. 持续关注前端技术包括跨平台技术的最新发展趋势，不断优化公司web项目和app。\n任职要求：\n1. 本科及以上学历，计算机相关专业，5年以上web开发经验，2年以上flutter开发经验，有一定架构能力；\n2. 熟练掌握Vue、React、TypeScript、Node.js、flutter等主流的前端技术和框架，以及Webpack、Vite等主流前端工程化工具，主导过flutter客户端 app和大型前端系统的开发或重构；\n3. 必须有flutter开发经验和性能优化经验，能够在高并发和高流量环境下保证良好的用户体验和解决性能瓶颈；\n4. 精通HTML5、CSS3、JS等前端技术，熟悉nodejs，有较强的flutter、React、TypeScript开发经验，有seo项目经验；\n5. 在系统重构、模块化、性能优化、跨浏览器兼容、系统的扩展性提升有丰富经验；\n6. 对前端技术领域和移动客户端有良好的洞察力和极高的关注度，推动团队技术创新和技术进步；\n7. 较强的执行能力和团队合作能力，较强的责任心和积极性。\n8. 熟悉利用ai进行项目架构和开发，对ai要有较好的利用。", "cat": "技术 / 数据"}, {"id": "42", "title": "高级UI设计师", "salary": "18-25K", "location": "未明确", "jd": "硬性条件要求：\n1.简历方向：重点挖掘人在国内，有过大厂UI履历的候选人；\n2.行业要求：近2年在海外做过BC/体育/游戏项目或相关背景的均不考虑；\n3.设计方向：作品需要以 UI 设计为主，纯视觉 / 平面设计背景的均不考虑；\n\n岗位职责\n1、负责公司核心产品（Web / App / 小程序等）的整体 UI 视觉设计与优化升级\n2、参与设计规范与设计系统（Design System）的搭建与维护\n3、深度参与产品需求讨论，提供专业的交互与视觉解决方案\n4、运用 AI 工具提升设计效率，包括但不限于：\n    ·使用 AI 进行界面草图生成、创意发散，视觉表达及设计提案输出\n    ·推动设计流程升级，探索 AI + 设计的新工作模式\n\n任职要求\n1、本科及以上学历，设计类相关专业优先\n2、5 年以上 UI / 视觉设计经验，有成熟线上产品案例（硬性要求）\n3、精通 Figma / Sketch / Adobe/ Photoshop / Illustrator 等设计工具\n4、具备良好的用户体验意识和交互理解能力\n5、具备完整的设计系统构建经验优先\n6、优先国内大厂经验\n\nAI 能力要求（重点）\n1、熟练使用主流 AI 工具提升设计效率，例如：\nChatGPT / Claude（用于设计思考与文案优化）\nMidjourney / Stable Diffusion（视觉创意生成）\nRunway / AI 视频工具（动态视觉探索）\n2、有 AI + 设计落地项目经验者优先", "cat": "设计"}, {"id": "43", "title": "高级算法工程师", "salary": "35-50K", "location": "未明确", "jd": "岗位职责\n1、负责抖音业务推荐算法工作，与来自国内外名校、有丰富业界经验的同学合作，共同搭建行业顶级的推荐系统，为用户提供一流的产品体验；\n2、将最前沿的机器学习技术应用到抖音的核心场景业务，优化用户体验促进业务发展；\n3、研究方向包含且不局限于：深度学习、图神经网络、多任务学习、Learning To Rank、模型压缩和加速、多模态技术等，结合业务的实际问题来做好技术的探索和研究；\n4、和产品、运营团队紧密合作，通过对产品和用户的深入理解和分析，制定算法策略促进抖音生态的长期繁荣发\n\n任职要求\n1、具备优秀的编码能力，扎实的数据结构和算法功底；\n2、对机器学习有热情、乐于学习、思考和创新，有自然语言处理、数据挖掘、计算机视觉相关的工作经验；\n3、熟悉常见算法，如LR，GBDT，DNN等，具备推导， 实现， 应用能力；\n4、熟悉C++和Python语言，熟悉Linux开发环境；\n5、优秀的分析问题和解决问题的能力，有良好的沟通表达能力和团队精神。", "cat": "AI / AIGC"}, {"id": "44", "title": "高级AI视频创作", "salary": "15-30", "location": "未明确", "jd": "岗位职责：\n主导AI视觉内容生成流程的设计与优化，包括但不限于图像、视频、动画等多模态创作。\n\n构建并维护高质量的工作流体系（ComfyUI / Stable Diffusion / 视频生成模型等），实现风格统一、角色一致性与批量产出。\n\n探索前沿AI工具（视频生成、动作迁移、音频驱动、修复增强等），并快速落地为生产级方案。\n\n负责模型选型、LoRA/finetune微调、提示词工程与参数调优，提升画面质量与生成效率。\n\n协同创意、剪辑、后期团队，将AI素材无缝整合至完整作品，指导初级/中级创作者。\n\n沉淀技术文档、工作流规范与资产库，持续优化内容生产管线。\n\n任职要求：\n经验：3年以上视觉内容创作经验，至少1年专注AI生成方向，有成熟作品或项目案例。\n\n工具：深度掌握ComfyUI节点级开发与调优，熟练使用FFmpeg、PR/AE等后期软件；熟悉Python/Shell脚本者优先。\n\n能力：具备极强的审美能力与风格控制力，能独立完成从创意构思到成品输出的全流程。\n\n模型：熟悉主流视频/图像生成模型（如Wan2.2、HunyuanVideo、Flux、Sora等），有LoRA训练或模型微调经验。\n\n沟通：逻辑清晰，能跨团队协作，适应高频迭代与快速实验的创作节奏。\n\n加分项：有开源项目贡献、技术博客/作品集、团队管理或培训经验", "cat": "AI / AIGC"}, {"id": "45", "title": "高级运营", "salary": "20-35K", "location": "未明确", "jd": "岗位职责：\n1. 负责视频内容运营体系搭建，制定长期运营策略与发展规划\n2. 主导视频内容选题策划与分发管理，监控热点动态，把握市场最新优质视频内容趋势\n3. 分析视频运营数据，从数据中提炼优化方向，持续迭代运营方法论\n4. 独立孵化运营产品，提供从 0 到 1 的成功案例支撑\n5. 整合并落地项目资源，推动跨部门协作，达成业务增长目标\n\n任职要求：\n1. 5年以上中大型网站或平台运营经验，须有成人行业经验\n2. 有视频运营相关经验，熟悉主流视频平台（优酷、爱奇艺、B站、抖音等）运营规则\n3. 对视频市场保持高度敏感度，能快速识别并跟进最新热门内容动态\n4. 具备独立孵化运营产品能力，有从 0 到 1 的成功案例\n5. 具备可落地的项目资源，有明确资源整合方向与执行能力\n6. 具备项目管理经验，能够推动多项目并行\n7. 善于沟通协作，有跨团队协同经验优先", "cat": "运营"}, {"id": "46", "title": "产品经理", "salary": "20-40K", "location": "未明确", "jd": "1.负责投放系统 / 渠道系统的产品规划与迭代\n2.建设投放配置、渠道管理、规则引擎等核心能力\n3.推动投放流程自动化，提升投放效率与规模能力\n4.支撑投放团队日常放量、调价与效果分析\n5.协同广告系统、数据中心，保障投放数据一致性\n\n1.3–7 年产品经理经验，有买量 / 渠道 / 投放系统经验\n2.熟悉主流广告投放流程及相关平台\n3.具备数据分析能力，能基于数据优化产品设计\n4.执行力强，能推动复杂需求落地\n5.必须有toB相关经验\n6.运营系统和数据中心（DMP）相关经验加分", "cat": "产品"}, {"id": "47", "title": "高级运营", "salary": "20-35K", "location": "未明确", "jd": "岗位职责：\n\n1. 负责视频内容运营体系搭建，制定长期运营策略与发展规划\n2. 主导视频内容选题策划与分发管理，监控热点动态，把握市场最新优质视频内容趋势\n3. 分析视频运营数据，从数据中提炼优化方向，持续迭代运营方法论\n4. 独立孵化运营产品，提供从 0 到 1 的成功案例支撑\n5. 整合并落地项目资源，推动跨部门协作，达成业务增长目标\n\n任职要求：\n\n1. 5年以上中大型网站或平台运营经验\n2. 有视频运营相关经验，熟悉主流视频平台（优酷、爱奇艺、B站、抖音等）运营规则\n3. 对视频市场保持高度敏感度，能快速识别并跟进最新热门内容动态\n4. 具备独立孵化运营产品能力，有从 0 到 1 的成功案例\n5. 具备可落地的项目资源，有明确资源整合方向与执行能力\n6. 具备项目管理经验，能够推动多项目并行\n7. 善于沟通协作，有跨团队协同经验优先", "cat": "运营"}, {"id": "48", "title": "高级产品经理", "salary": "30K–50K", "location": "未明确", "jd": "岗位职责\n1、产品规划：结合业务目标和市场趋势，制定各业务线产品的中长期规划与版本路线图，明确优先级；\n2、产品设计：主导核心功能的需求分析与方案设计，输出原型和 PRD，组织评审并推动研发落地；\n3、创新方向：跟踪行业与竞品动态，挖掘用户需求，提出新产品、新功能方向（含 AI 能力的应用），做可行性验证和小范围试点；\n4、体验优化：建立移动端（App / H5）与 Web 端的体验标准和设计规范，定期做体验走查与数据分析，推动问题闭环；\n5、效果评估：搭建产品数据指标体系，对上线功能做效果追踪与复盘，用数据驱动迭代；\n6、跨团队协作：协调设计、研发、运营团队，统一各业务公司的产品标准，推动共性能力复用。\n\n任职要求\n\n1、本科及以上，8 年以上互联网产品经验，3 年以上产品总监或产品团队负责经验；\n2、主导过移动端与 Web 端产品从 0 到 1 或大版本改版，面试需展示代表作品及上线数据；\n3、具备优秀的 UI/UX 判断力，能快速识别体验问题并给出可执行的改进方案；\n4、有产品创新落地案例，能讲清发现机会、验证、上线、结果的完整过程；\n5、数据敏感，熟悉 A/B 测试、漏斗分析、留存分析等方法；\n6、熟练使用 Axure、墨刀、Figma 等工具，PRD 撰写和方案宣讲能力强；\n7、加分项：有视频 / 内容平台 / 多站点产品经验；有 AI 功能（推荐、搜索、Agent 等）的产品落地经验。", "cat": "产品"}, {"id": "49", "title": "新媒体运营（国外媒体方向）", "salary": "12-15k", "location": "未明确", "jd": "岗位名称\n\n高级自媒体运营\n 一、岗位职责\n1.负责X（Twitter）为核心的账号矩阵运营\n\n搭建并管理多账号矩阵（内容号 + 流量池号）\n\n制定内容策略，提升曝光、互动与粉丝增长\n\n通过推荐流机制放大内容，持续产出稳定流量\n\n多平台分发与放大\n\n将内容同步分发至 TikTok / Telegram / Instagram /  等平台\n\n\n2.建立跨平台流量回流链路\n\n搭建完整转化链路\n实现从「内容 → 点击 → TG/网站 → 转化」的闭环\n\n负责产品的导流策略\n\n优化主页、跳转路径、话术，提高转化率\n\n内容生产与爆款复制\n\n持续跟踪海外成人/AI/擦边内容趋势\n\n拆解爆款结构（标题/封面/视频节奏）并复用\n\n与运营/编剧/剪辑/协作，提升内容质量与产量\n\n3.数据分析与优化\n\n每日监控账号数据（曝光、点击、互动、转化）\n\n输出数据复盘，优化选题与内容结构\n\n通过数据驱动增长（而不是拍脑袋做内容）\n\n4.AI工具与自动化应用\n\n使用 AI 工具进行文案、图片、视频处理（如 ChatGPT / MJ / ComfyUI 等）\n\n配合 agent 实现内容生产、发布、数据监测自动化\n\n提升整体运营效率\n\n 二、任职要求\n1.经验要求\n\n3年以上海外自媒体运营经验\n熟悉 X（Twitter）平台机制（推荐流 / 标签 / 账号权重）\n\n有账号从0-1或矩阵运营经验优先\n\n2.能力要求\n\n具备完整的「内容 → 流量 → 转化」运营思维\n\n能独立完成选题、文案、发布及优化\n\n对数据敏感，能通过数据分析调整策略\n\n3.行业认知\n能接受成人内容方向\n对海外中文用户，其他用户偏好有一定理解\n\n熟悉擦边/成人内容边界与平台规则\n\n4.执行与协作能力\n\n结果导向，执行力强\n\n能与编剧、剪辑、产品团队高效配合\n\n 三、加分项\n1.有 成人站 / 色站  相关经验\n\n2.熟悉 Telegram 运营（频道 + 群 + 机器人玩法）\n\n3.有 矩阵号放量经验（10+账号以上）\n\n4.熟悉  TikTok / Porn类站点引流\n\n5.会使用 AI工具：\n\n有自动化/agent使用经验", "cat": "运营"}, {"id": "50", "title": "自媒体运营主管", "salary": "20-40K", "location": "未明确", "jd": "岗位定位： 全面负责新媒体业务，以海外新媒体为核心，兼顾国内平台。制定新媒体整体策略，搭建海外账号矩阵和团队体系，对账号增长、海外流量获取、产品导流及转化结果负第一责任。\n\n岗位职责\n制定以海外为重点的新媒体战略和年度、季度目标，规划平台布局、目标市场、资源投入和团队配置，把海外新媒体做成公司稳定的流量来源。\n重点统筹 X、TikTok、YouTube、Facebook、Instagram、Telegram、Reddit 等海外平台的矩阵运营，同时兼顾抖音、小红书等国内平台。按平台特性和不同地区用户习惯，制定差异化的内容策略和账号定位，不做简单搬运和重复分发。\n结合短剧、影视动漫、AI 工具、VPN 等产品，制定面向海外用户的推广和导流方案，对导流带来的访问、下载、注册及付费结果负责。\n搭建 Telegram 频道和社群体系，负责频道增长、社群活跃和用户承接，把社群做成产品导流和用户留存的重要阵地。\n搭建并管理新媒体团队，负责团队组建、分工、目标拆解、绩效考核和人员培养，建立可复制的海外账号运营和内容生产 SOP。\n建立新媒体数据体系，从曝光、播放、互动、涨粉，一直追踪到点击、下载、注册、转化全链路数据，以投入产出比衡量账号和内容价值，持续调整资源分配。\n研究海外各平台的推荐机制、热点趋势、地区文化差异和竞品打法，建立内容测试和放大机制，能快速验证有效模型并批量复制。\n建立海外账号风控体系，包括账号注册与养号、设备和网络环境管理、封号预防、备用账号储备和应急处理，保证矩阵稳定运行。\n推动 AI 工具在选题、脚本、多语种内容、素材生产和数据分析中的规模化应用，提升团队人效。\n任职要求\n5 年以上新媒体运营经验，其中 3 年以上海外社交媒体运营经验，2 年以上团队管理经验，带过 8 人以上团队；\n深度熟悉 X、TikTok、YouTube、Telegram 等海外主流平台的规则和推荐机制，有从 0 到 1 搭建海外账号矩阵的完整经验，单平台做出过十万级以上粉丝账号或爆款矩阵者优先；\n有可量化的海外业绩案例，能清楚说明过去负责的矩阵在曝光、涨粉、导流和转化上的结果，以及投入产出比；\n了解欧美、东南亚等主要市场的用户偏好和文化差异，能判断什么内容在哪个市场能起量；\n英语可作为工作语言，能独立审核英文内容，懂其他小语种者优先；\n熟悉海外平台风控逻辑，有批量账号运营、防封和应急处理的实战经验；\n数据驱动，看重实际点击、下载、注册和付费，而不只是播放和粉丝，熟悉数据分析工具者优先；\n具备战略思考、资源统筹和跨部门推动能力，结果导向，能在资源有限时做取舍；\n有短剧、影视动漫、工具类产品出海经验，或 Telegram 社群运营经验者优先。", "cat": "运营"}, {"id": "51", "title": "推荐与广告算法产品经理", "salary": "20-40K", "location": "未明确", "jd": "推荐与广告算法产品经理\n\n岗位职责\n\n负责公司视频、小说、漫画等内容场景的推荐系统产品建设，以及基于用户画像、兴趣标签和行为特征的广告推荐能力建设，推动用户行为数据、内容特征、广告数据与算法能力形成完整闭环。\n\n1. 内容推荐系统\n\n • 负责视频、小说、漫画等内容推荐系统的产品规划、需求设计及持续迭代。\n • 负责推荐场景梳理与产品设计，包括首页推荐流、猜你喜欢、相关推荐、内容详情页推荐、完播/完读后推荐等场景。\n • 参与推荐系统召回、粗排、精排、重排等核心链路的产品设计，与算法团队共同定义各阶段目标及策略。\n • 根据不同内容形态设计推荐目标，综合考虑 CTR、播放/阅读深度、完播/完读率、互动、留存、付费及长期用户价值。\n • 负责冷启动、探索与利用、热门内容、新内容扶持、兴趣衰减、多样性、去重、频控等推荐策略的产品设计。\n • 推动推荐策略配置化、实验化，建设策略管理、实验管理、效果监控及异常预警能力。\n • 建立推荐效果评估体系，通过 A/B Test、用户分层、漏斗分析等方式持续评估算法策略对业务指标的实际贡献。\n\n2. 用户画像与标签应用\n\n • 与 DMP / 数据团队共同建设推荐所需的用户特征体系，包括用户兴趣、内容偏好、活跃度、生命周期、消费能力、广告行为等特征。\n • 明确用户标签、实时行为特征、统计特征及算法 Embedding 等不同数据能力的使用边界。\n • 设计用户兴趣随行为变化的更新与衰减机制，支持短期兴趣与长期兴趣结合。\n • 推动用户、内容、场景等特征在推荐系统中的标准化接入与复用。\n • 参与用户冷启动、匿名用户、跨端用户识别等场景的推荐方案设计。\n\n3. 广告推荐与商业化\n\n • 负责基于用户画像、兴趣标签、行为特征及广告属性的广告匹配与推荐能力建设。\n • 建设广告候选集、定向条件、用户与广告匹配、频次控制、广告过滤等基础能力。\n • 与广告平台、DMP及算法团队协作，推动用户特征在广告推荐和商业化场景中的合理使用。\n • 参与广告 CTR、CVR、eCPM 等预估与排序策略的产品设计，并持续评估广告收益与用户体验之间的平衡。\n • 支持广告推荐效果分析，包括曝光、点击、CTR、转化、收入、eCPM、用户负反馈等指标。\n • 设计广告实验与流量分层机制，评估不同广告策略对广告收入、内容消费、留存及用户长期价值的影响。\n • 支持广告系统后续从规则匹配逐步向个性化推荐、智能排序及收益优化演进。\n\n4. 数据与实验体系\n\n • 建立推荐系统完整的数据指标体系，定义曝光、点击、播放、阅读、完播/完读、互动、留存、付费、广告转化等核心指标口径。\n • 与数据团队共同完善推荐与广告相关埋点、日志、特征及数据回流链路。\n • 建设推荐策略效果看板、模型版本看板、实验看板及异常监控体系。\n • 推动形成“用户行为 → 数据采集 → 用户/内容特征 → 模型训练 → 推荐结果 → 用户反馈 → 模型迭代”的完整闭环。\n • 能够识别 CTR 等短期指标与留存、LTV 等长期指标之间的冲突，合理设计推荐系统的评估指标与护栏指标。\n\n任职要求\n\n • 5 年以上互联网产品经验，3 年以上推荐、搜索、广告算法、增长算法或相关数据产品经验。\n • 有视频、小说、漫画、资讯、短剧、游戏、电商等大规模内容或推荐场景经验优先。\n • 真正参与过推荐系统建设，理解召回、粗排、精排、重排的基本工作机制及各阶段解决的问题。\n • 理解协同过滤、Embedding、向量召回、CTR/CVR 预估、Learning to Rank 等常见推荐算法的基本原理，不要求承担算法研发，但能够与算法工程师进行深入需求和方案沟通。\n • 熟悉推荐系统常见指标，包括 CTR、播放率、完播率、阅读深度、互动率、留存、付费率等，能够根据不同业务场景设计合理的目标指标。\n • 熟悉 A/B Test、实验分流、实验组/对照组、统计显著性及实验效果评估。\n • 具备较强的数据分析能力，能够通过数据发现推荐策略、内容供给或用户分层中的问题。\n • 理解用户画像、标签、实时特征、行为序列及内容特征在推荐系统中的作用。\n • 有广告推荐、广告排序、DMP、DSP、SSP、广告定向或程序化广告相关经验者优先。\n • 有大 DAU、高并发推荐系统经验者优先。\n\n核心能力要求\n\n我们重点关注候选人是否具备以下能力：\n\n 1 算法产品理解能力\n    能够理解推荐系统内部链路，知道召回、排序、策略和模型分别解决什么问题，而非只负责推荐页面和运营规则。\n 2 数据与指标能力\n    能够独立定义推荐效果指标，理解 CTR、完播/完读、留存、收入、LTV 等指标之间的关系，并能够设计实验验证方案。\n 3 用户理解能力\n    能够把用户行为转化为兴趣、偏好、生命周期等可供推荐系统使用的特征，并理解实时兴趣与长期兴趣的差异。\n 4 系统产品能力\n    能够设计推荐策略管理、实验平台、效果监控、模型版本管理等后台能力，将算法能力产品化、平台化。\n 5 商业化理解能力\n    能够理解内容推荐与广告推荐目标的差异，兼顾用户体验、内容消费和广告收入，避免单纯追求 CTR 或短期 eCPM。\n 6 跨团队推进能力\n    能够独立完成需求分析、PRD、原型、指标定义、技术与算法评审、研发推进、上线验收及效果复盘，与算法、数据、客户端、服务端、运营及广告团队协同推进项目。\n\n加分项\n\n • 有千万级 DAU 产品推荐系统经验。\n • 有短视频、长视频、小说、漫画、短剧等内容推荐经验。\n • 有广告推荐、广告排序或商业化算法产品经验。\n • 有 DMP / CDP / 用户画像平台建设经验。\n • 有搜索排序、向量检索、RAG 或 Embedding 相关产品经验。\n • 有推荐实验平台、特征平台、策略平台或模型管理平台建设经验。\n • 具备 SQL、Python 或数据分析能力，能够独立完成基础数据验证与问题定位。\n\n该岗位需要解决的核心问题\n\n • 如何判断一个用户当前最可能消费什么内容？\n • 如何同时利用长期兴趣和最近几分钟、几小时产生的短期兴趣？\n • 视频、小说、漫画三种内容是否应该共用一套用户兴趣体系，哪些能力可以复用，哪些需要独立建模？\n • 如何解决新用户、新内容和低曝光内容的冷启动问题？\n • 如何避免推荐系统为了提高 CTR 持续推荐标题党或低质量内容？\n • 如何衡量一次推荐策略升级究竟提高了短期点击，还是提高了长期留存与用户价值？\n • 如何在内容推荐流中合理插入广告，同时控制用户疲劳和负反馈？\n • 如何利用用户兴趣、消费能力、广告行为等特征提高广告匹配效率？\n • 如何判断哪些用户应该减少广告，哪些用户可以提高商业化强度？\n • 如何建立内容推荐、广告推荐、DMP、数据中心之间清晰且可长期演进的系统边界？", "cat": "产品"}, {"id": "52", "title": "内容生产总监", "salary": "30-50K", "location": "工作地点：国内", "jd": "【岗位职责】\n1. 盘活存量：统筹管理现有内容采集团队，优化内容筛选机制，提升现有业务流水线效率；\n2. 拓展增量：从0到1组建并管理内容生产团队，主导“视频剪辑、视频深度二创、短剧生成”等新业务的落地与量产；\n3. 产能统筹：协助一号位进行整体团队管理，拉通采集组与自产组资源，协调并大幅拉升各组产能；\n4. 体系搭建：建立从内容策划、制作到审核分发的工业化SOP标准。\n\n【任职要求】\n1. 懂内容：具备扎实的内容生产与策划能力（资深编辑、新媒体主编、短视频操盘手出身），网感极佳；\n2. 懂视频与新玩法：精通短视频剪辑与深度二创玩法，对“短剧生成”、AIGC辅助内容生产有实操经验或深入研究；\n3. 懂管理：具备成建制内容团队（几十人规模）的实战管理经验，懂“工业化流水线”作业，能带兵打仗拿结果；\n4. 懂战略：不只是执行者，必须具备业务视角的战略眼光，能为业务从“单纯采集”向“自产内容生态”转型提供破局思路。", "cat": "内容"}, {"id": "53", "title": "AI短剧编剧", "salary": "10K-20K", "location": "未明确", "jd": "【岗位定位】\n负责 AI 内容项目的整体创意策划与质量把控，从剧本构思到最终成片，对作品的内容质量与传播效果负责。\n【岗位职责】\n根据运营需求完成 AI 短剧、剧情视频、宣传片等内容策划；\n独立完成剧本、人物设定、故事结构、分镜设计及创意方案；\n制定整体内容风格、节奏、镜头语言及画面表现形式；\n指导 AI 创作者完成角色、场景及视频素材生成；\n与剪辑、设计等岗位协同，推进项目按计划落地；\n对最终成片进行内容质量审核，把控整体表现（涉及合规/风险的内容，需按公司要求同步相关审核）；\n持续研究行业爆款，总结创作方法，优化团队创作流程。\n【任职要求】\n有短剧、影视、自媒体、广告等内容策划经验，具备优秀的故事创作与剧本能力；\n熟悉短视频传播逻辑及用户喜好，具备较强的审美与画面感；\n沟通协调能力好，能推动团队协作完成项目；\n有 AI 内容创作经验者优先；真人影视/短剧背景者，需具备转型 AI 内容创作的意愿与能力（我们的内容方向以 AI 生成为主，纯真人制作背景、且无转型意愿者不匹配）。\n【加分项】\n熟悉 ChatGPT、Claude 等 AI 创作工具；\n有导演、影视、广告行业经验，或有爆款内容案例；\n熟悉海外内容平台。", "cat": "AI / AIGC"}, {"id": "54", "title": "高级安全攻防工程师（管理经验优先）", "salary": "40k-150k", "location": "未明确", "jd": "岗位职责\n\n一、红队实战与渗透攻击（核心）\n\n带队对公司全线业务（Web、APP、小程序、API、服务器、容器、多云环境）执行授权渗透测试与红队行动，以攻击者视角持续发现高危漏洞与利用链。\n主导年度红蓝对抗演练，设计攻击场景、投放载荷、绕过防御设备（WAF/EDR/HIDS），输出可量化的对抗结果。\n跟踪并复现业界最新攻击手法（0day、Nday、供应链攻击、云原生逃逸、AI相关攻击面），转化为内部攻击武器库与检测规则。\n\n二、攻防体系与团队建设\n规划公司攻防体系，组建并管理红队团队，建立攻击武器库、靶场环境、CTF训练体系。\n制定红队KPI（漏洞数量、漏洞等级、绕过成功率、驻留时长），持续提升团队实战能力。\n\n三、重大安全事件处置\n牵头重大事件的研判、指挥、止损、溯源反制与复盘，具备7×24小时响应能力。\n独立处置入侵、黑产攻击、API盗刷、业务薅羊毛、黑链、域名劫持、DNS污染、大流量DDoS、数据泄露、勒索攻击等场景。\n\n四、机制建设与跨团队协同\n建立授权测试流程、操作审计、漏洞分级（CVSS）、SLA修复机制与整改验收闭环。\n协调运维、研发、测试、CDN厂商、各BU技术负责人推动漏洞闭环。\n向CTO及管理层输出集团安全态势报告、重大风险预警与攻防整改建议。\n\n任职要求\n\n硬性门槛（必须满足）\n\n5年以上安全经验，其中至少3年红队/渗透测试/攻防对抗一线实战（纯合规、等保测评、SOC值班、被动防御背景不符合本岗位）。\n独立完成过10个以上大型目标的完整渗透项目（含Web/APP/内网横向/云环境）。\n熟练使用Burp Suite、Cobalt Strike、Metasploit、Nuclei、Xray、fscan、Impacket等主流攻防工具，有自研工具或武器化改造经验。\n精通OWASP Top 10、ATT&CK框架，能基于ATT&CK矩阵设计端到端攻击链。\n熟悉Web、API、APP、主机、容器（Docker/K8s逃逸）、云（AWS/阿里云/腾讯云）环境的攻击面与利用技术。\n具备真实入侵溯源案例：入侵排查、黑链清除、流量劫持溯源、DNS污染处置、DDoS对抗、数据泄露取证等至少3类的实战处置经验。\n熟悉Linux、Nginx、CDN、WAF、MongoDB、Redis、Kafka等组件的攻击面与绕过技术（不是\"知道怎么配\"，而是\"知道怎么打穿\"）。\n熟悉Go、Java、PHP中至少两种技术栈的代码审计，能独立审出RCE、反序列化、SSRF、SQL注入等高危漏洞。\n\n显著加分项（有其一者优先）\n\n参加过HW行动（担任红队队长 / 攻击队核心成员 / 蓝队指挥）。\n在知名攻防比赛（DEFCON、强网杯、天府杯、GeekPwn、XCTF）获奖或进入决赛。\n在CVE、CNVD、各大SRC（补天、漏洞盒子、字节/腾讯/阿里/美团SRC）有高危漏洞提交记录（简历请附编号或排名）。\n在知名安全会议（Blackhat、HITB、KCon、看雪SDC、XCon）做过议题分享。\n持有OSCP、OSEP、OSWE、CRTO、CISSP等国际认证。\n有大型互联网/游戏/直播/支付/电商等高对抗性业务的攻防经验。\n带过5人以上红队/安全团队", "cat": "测试 / 运维"}, {"id": "55", "title": "高级Java工程师", "salary": "25-40K", "location": "未明确", "jd": "岗位职责\n1.  参与项目组产品评审，根据需求进行功能梳理、开发计划及相关技术文档编写\n2.  参与项目组的任务开发，包括后台模块、接口开发\n3.  协作团队顺利推进项目进度，解决疑难问题\n4.  在计划内协作完成项目的交互，对项目实施提供支持和优化建议。\n\n任职要求\n1.  全日制本科及以上学历，计算机、软件工程等相关专业；\n2.  五年以上Java开发经验，有移动端互联网短视频相关行业经验者优先；\n3.  熟练掌握 Spring Boot/Spring Cloud、Dubbo、ZooKeeper、MyBatis、MySQL、MongoDB、Redis、RabbitMQ 等技术；\n4.  熟悉常见的中间件、分布式解决方案及其原理：分布式缓存、微服务、云原生、消息中间件、负载均衡、连接池等；\n5.  具备较强的分析设计能力，能够根据业务需求设计合理的技术解决方案。\n6.行业筛选做web3/区块链/包网/BC暂不考虑\n7.必须要有推荐系统相关经验，内容推荐或广告推荐", "cat": "技术 / 数据"}, {"id": "56", "title": "效能督查官", "salary": "18K-25K", "location": "未明确", "jd": "岗位名称：效能督查官\n\n汇报对象：CTO\n\n岗位职责\n\n1. 跟进各部门及项目组的进度执行情况，定期核查任务排期与里程碑达成情况是否符合既定节点。\n2. 核实各部门实际产出与汇报内容是否一致，发现进度失真、责任归属不清等问题时，及时与相关负责人核实并推动整改。\n3. 收集整理各部门的项目进度与产出数据，形成统一格式的督查报告，按周期汇总提交给上级。\n4. 对反复出现问题且未有效整改的部门或责任人，如实上报，保持客观公正，不做选择性汇报。\n5. 建立并维护可量化的进度跟踪机制，如项目清单、进度看板等，使督查工作有据可查。\n6. 视情况参与跨部门协调，推动阻塞事项落地，确保督查结果转化为实际改进。\n\n任职要求\n\n1. 具备较强的原则性与抗压能力，能够客观、坚定地指出问题，沟通专业、不情绪化。\n2. 逻辑清晰、表达直接，能够准确、简洁地传达复杂的进度信息。\n3. 具备项目管理、运营督导、审计或同类对结果负责岗位的相关经验者优先。\n4. 熟练使用表格及看板工具（如Excel、飞书多维表格、Notion等）进行数据整理与呈现。\n5. 对业务有基本理解，能够判断进度延误的真实原因。\n6. 具备良好的向上沟通能力，能够客观、完整地向管理层汇报情况。\n\n核心素质要求\n\n1. 标准统一、对事不对人，不因人情关系而调整判断尺度。\n2. 抗压能力强，能够承受督查过程中的抵触情绪。\n3. 结果导向，跟进问题直至闭环，而非止步于提醒。", "cat": "其他"}, {"id": "57", "title": "AI美术师", "salary": "10K-20K", "location": "未明确", "jd": "职位描述： 用生成式影像为故事提供视觉支撑，为角色注入灵魂，。\n核心职责：\n1.        视觉开发： 结合剧本和导演意图，利用AI图像工具创作具备“电影级质感”的关键帧。\n2.        核心资产生成与管理： 负责场景概念设定、角色设计及核心视觉资产的生成与优化，确保整体视觉风格的高度统一。\n3.        服务于故事的美学表达： 以叙事为驱动力，通过美术设定（服装、道具、场景细节）来暗示人物背景、强化矛盾冲突、烘托本土化的情绪氛围。\n任职要求：\n1.        叙事本位的美术思维： 深刻理解“美术是为了讲故事”，能准确捕捉并视觉化剧本中的情感内核。\n2.        极高的审美标准： 对光影、构图、色彩搭配有严苛的要求，能驾驭高品质的电影感视觉风格。\n3.        精通AI绘画工具： 熟练使用MJ、SD等工具，具备极强的生图控制力（如角色一致性控制、局部重绘、精准的光源及材质表达）。\n4.        扎实的美术基本功： 熟练掌握PS等后期修图软件，具备优秀的手绘基础或传统CG（Blender/Maya）经验，能对AI生成结果进行精细的后期处理与拼贴修正。\n5.        加分项： 对于comfyui等AI工作流有过深入研究。", "cat": "AI / AIGC"}, {"id": "58", "title": "运营主管", "salary": "30k-50K", "location": "未明确", "jd": "岗位职责\n负责所辖产品线(APP/WEB 内容产品)的整体运营,对 DAU、留存、付费/变现及 ROI 等核心指标负责;\n制定并落地用户增长与运营策略,统筹内容运营、渠道投流配合、活动配置、用户召回与留存提升;\n搭建并带领运营团队,拆分目标、排期与分工,带团队达成业务指标;\n数据驱动:建立新增—活跃—留存—付费漏斗的监控体系,定位问题、快速迭代;\n跨部门协同:与产品、技术、投放、SEO、商务紧密配合,打通\"流量获取—产品—变现\"闭环;\n复盘渠道效果与获客成本(CAC),优化投放与变现结构,持续提升人效与产出。\n任职要求\n本科及以上(重点院校或头部互联网公司背景优先);5 年以上互联网 C 端产品/内容运营经验、3 年以上团队管理经验,带过 10 人以上团队或独立操盘过完整产品线;\n有高流量 C 端产品/内容分发平台背景,主导过百万级 DAU 或规模化用户增长/变现项目,并有可量化的硬结果(DAU、留存、ROI、GMV 等);\n极强的数据驱动能力,能独立搭建指标体系,用数据(DAU/留存/LTV/ROI/漏斗)做决策与复盘;\n精通买量投放、内容运营、活动运营中至少两项,深刻理解从流量获取到变现的完整链路与经济模型(CAC/LTV/回收比);\n目标感与结果导向极强、能扛指标、抗压,能在快节奏下带团队持续拿结果;\n优秀的跨团队沟通、资源协调与团队搭建/人才培养能力。\n加分项\n有短剧 / 工具类 / 矩阵型产品运营经验;\n有完整 SEO 或渠道投流落地经验;\n有从 0 到 1 搭建运营体系或团队的经验。", "cat": "运营"}, {"id": "59", "title": "SEO主管", "salary": "20-40K", "location": "未明确", "jd": "SEO 主管\n\n岗位职责\n\n1、负责 SEO 业务整体策略与目标,对关键词排名、收录、流量及最终收款/转化结果负责,制定并落地月度、季度增长计划。\n\n2、白帽方向:搭建站内结构与技术 SEO、内容体系、优质外链矩阵,建立可持续、抗算法波动的排名基本盘。\n\n3、黑帽方向:熟练运用站群、快排、蜘蛛池、寄生虫、PBN、外链矩阵等快速起量手段做到规模化上词,同时能精准把控 K 站、降权、沙盒的风控边界,做到\"起得快、也扛得住\"。\n\n4、搭建关键词库、竞品监控、排名与流量数据看板,数据驱动优化投放与内容策略。\n\n5、带团队:负责 SEO 团队的分工、目标拆解、过程管控与人才培养,输出可复制的方法论与 SOP。\n\n6、跟踪百度、谷歌等主流引擎的算法更新,第一时间评估影响并调整策略,保障业务连续性。\n\n任职要求\n\n1、5 年以上 SEO 一线实操经验,2 年以上团队管理经验;学历不限,能力与实操案例说话。\n\n2、黑白帽双精通,必须有独立把大批量关键词做到首页/高权重的实操战绩,面试需用真实数据和案例佐证(排名、流量、收款量级)。\n\n3、精通站群、快排、蜘蛛池、寄生虫、外链等黑帽技术,并深刻理解各手段的风险边界与规避打法。\n\n4、熟悉百度/谷歌/必应等主流搜索引擎的排名机制与算法更新规律。\n\n5、懂技术:熟悉 HTML、网站结构、服务器、CMS、采集与批量建站,能与研发高效协作、自己也能上手搭站调站。\n\n6、数据敏感,熟练使用 5118、爱站、站长工具、Ahrefs、GSC 等 SEO 工具。\n\n7、结果导向,抗压能力强,能扛住量化 KPI(排名/流量/收款)。\n\n加分项\n\n有大规模站群或百万级流量站操盘经验;有谷歌 SEO/外贸多语言经验;自带外链、蜘蛛池、域名、服务器等资源;有网赚、流量站或垂直行业 SEO 背景。", "cat": "运营"}, {"id": "60", "title": "ai编导", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责\n1. 负责 AI 短剧项目*整体导演工作，包括剧本理解、剧情拆解、分镜设计、镜头调度及成片质量把控。\n2. 根据剧情设计景别、构图、运镜、人物表演及镜头衔接，强化人物情绪、剧情冲突及关键爆点。\n3. 将剧本转化为可执行的 AI 视频制作方案，明确镜头画面、人物动作、情绪及生成要求。\n4. 指导 AI 生成师使用 Seedance、可灵、ComfyUI 等工具完成镜头制作，并针对生成结果提出明确修改意见。\n5. 把控短剧整体节奏、人物一致性、画面连续性及剧情表达，与编剧、生成师、剪辑协作完成最终成片。\n6. 持续关注 AI 视频新技术及短剧市场趋势，不断优化制作流程和成片效果。\n\n任职要求\n1. 具备较强的导演思维、剧情理解能力及镜头语言能力，有短剧、影视、广告、动画、漫剧等相关导演经验。\n2. 熟悉短剧的剧情节奏、人物关系、情绪递进、冲突爆点及反转设计。\n3. 具备 AI 视频制作经验，熟悉 Seedance、可灵等主流 AI 视频工具，对 ComfyUI 工作流及 AI 视频生成逻辑有一定了解。\n4. 有半年以上 AI 短剧导演或相关项目经验，能够独立完成从剧本到成片的导演工作。\n5. 需提供个人作品或参与项目案例。\n\n加分项\n有擦边、成人向或强剧情短剧导演经验，有成熟爆款作品或完整 AI 短剧项目经验者优先。", "cat": "AI / AIGC"}, {"id": "61", "title": "内容主管", "salary": "30-40K", "location": "未明确", "jd": "岗位定位： 负责公司短剧、影视动漫、漫画、AI 内容等全线产品的内容体系建设与团队管理，对内容供给、内容质量、用户消费及留存付费结果负责，是内容方向的第一责任人。\n\n岗位职责\n制定各产品线的内容战略和年度、季度规划，明确内容定位、品类结构、更新节奏和资源投入，支撑产品增长目标。\n搭建并持续优化内容供给体系，统筹采集、采购、自制、AI 生成等多种来源，保证内容数量、质量和更新稳定。\n建立内容标准化体系，包括分类和标签体系、标题封面规范、质量分级、审核流程和内容 SOP，推动内容生产流程化、工业化。\n负责内容团队管理，统筹编辑、剪辑、内容治理、AI 内容生产等岗位，负责团队搭建、分工、目标拆解、绩效考核和人员培养。\n建立内容数据分析体系，跟踪内容曝光、点击、观看、完播、留存、付费转化等指标，以数据判断内容价值，持续淘汰低效内容、放大高效内容。\n推动内容与产品、SEO、新媒体、技术之间的协同，打通\"内容供给—分发推荐—用户消费—留存付费\"全链路，对内容带来的增长结果负责。\n主导 AI 在内容生产中的落地，包括 AI 短剧、AI 素材处理、批量去水印、自动打标签等，持续提升内容生产效率、降低成本。\n研究行业和竞品的内容策略、热门题材和用户偏好变化，快速判断趋势并推动内容方向调整。\n把控内容安全和风控边界，建立风险内容识别和处理机制，保障平台内容稳定运行。\n任职要求\n5 年以上内容运营或内容平台工作经验，其中 2 年以上内容团队管理经验，带过 10 人以上团队；\n有从 0 到 1 搭建内容体系的完整经验，能拿出实际落地过的分类标签体系、内容 SOP 或内容中台方案；\n有可量化的业绩案例，能清楚说明自己主导的内容策略带来了哪些观看、留存或付费方面的提升；\n对内容有很强的判断力，能说清楚一类内容为什么能留住用户、为什么能带来付费，而不只是\"热度高\"；\n数据能力强，能独立完成内容数据分析和归因，熟悉 SQL 或 BI 工具者优先；\n熟悉内容生产全流程和成本结构，有 AI 内容生产或规模化内容处理经验，能用工具和流程提升团队人效；\n具备较强的战略思考、跨部门推动和结果导向能力，能在资源有限的情况下做取舍；\n有短剧、影视动漫、漫画、视频平台的内容负责人经验，或海外内容运营经验者优先。", "cat": "内容"}, {"id": "62", "title": "技术负责人助理", "salary": "20-35K", "location": "未明确", "jd": "技术负责人助理\n\n## 岗位定位\n\n协助技术负责人开展技术管理、技术指导和跨团队协作。入职后参与重点项目及技术规范工作，逐步培养为能够独立负责技术团队或业务方向的技术负责人。\n\n## 岗位职责\n\n1. 参与重点项目的技术方案讨论与评审，关注架构合理性、开发质量、交付进度和线上稳定性，识别风险并提出改进建议。\n2. 协助指导各团队解决研发和交付过程中的技术问题；对跨团队依赖、反复出现的问题进行梳理，推动责任团队形成解决方案。\n3. 根据业务发展和实际问题，参与制定、完善及推广技术规范，并检查规范的执行效果，持续优化实施方式。\n4. 跟进重点项目从方案、开发、测试到上线的关键节点，核实风险和阻塞原因，推动问题闭环，并向技术负责人汇报需要决策的事项。\n5. 参与技术团队的经验沉淀、复盘和人才培养，促进技术方案及实践在不同团队之间共享。\n6. 随着能力和业务理解的提升，逐步独立承担指定项目、技术专项或团队的技术管理工作。\n\n## 任职要求\n\n1. 具备 **5 年及以上互联网研发经验**，有后端（go）核心开发、技术骨干、技术负责人或架构相关经历；能够独立分析和解决实际技术问题。\n2. 熟悉后端系统设计及研发交付流程，对数据库、缓存、消息队列、服务部署、性能优化和线上故障排查有实践经验。\n3. 具备技术方案分析能力，能够识别方案中的性能、稳定性、安全性及实施风险，并提出可落地的建议。\n4. 有项目推进或带领小团队的经验，能够在不同团队之间沟通技术问题、明确责任并推动结果。\n5. 具备清晰的书面和口头表达能力，能够将技术问题整理成方案、规范或复盘材料。\n6. 愿意承担技术管理责任，具备培养为技术负责人的意愿和潜力。\n\n## 加分项\n\n- 曾担任技术负责人、研发组长，或主导过跨团队技术专项。\n- 有高并发业务、线上稳定性治理、技术架构优化或研发规范建设经验。", "cat": "职能"}, {"id": "63", "title": "SEO外链建设专员", "salary": "15k-25k", "location": "未明确", "jd": "二、岗位职责\n外链策略制定： 分析竞品外链结构，制定外链建设计划（目标域名、锚文本分布、月度获取量）。\n外链获取执行：\n客座博文（Guest Post）、资源页外链、断链建设（Broken Link Building）\nDigital PR、媒体报道、HARO/Qwoted 类渠道\n行业目录、品牌提及转外链（Unlinked Mentions）\n合作置换、赞助、社区与论坛的合规曝光\n外链质量管理： 筛选站点（相关性、流量、垃圾程度），维护外链台账，监控外链存活情况。\n风险控制： 定期做外链体检，识别并处理垃圾/有毒外链（必要时 Disavow），避免触发 Google 惩罚。\n供应商与资源管理： 开发和维护媒体、站长、博主资源库，对接外链供应商，控制成本与质量。\n数据分析与汇报： 跟踪外链增长、引荐流量、关键词排名变化，输出周报/月报并给出优化建议。\n品牌信号建设： 配合做品牌词搜索量提升、社交媒体与 Google 商家资料等站外信号。\n三、任职要求\n必备条件\n2–3 年以上 SEO 经验，其中至少 1–2 年专职外链建设经验\n熟悉 Google 搜索算法与外链评估逻辑（相关性、权威度、锚文本、nofollow/dofollow、链接速度）\n熟练使用工具：Ahrefs、Semrush、Moz、Majestic 、Google Search Console\n有可验证的外链成果（能说明获取过哪些类型的站点、带来什么排名/流量变化）\n有 Digital PR 或媒体资源经验\n了解基础 HTML、内容营销和数据分析\n必须具备外链经验\n有处理过惩罚、负面 SEO 或外链清理的经验\n核心要求\n重视合规与长期价值，不依赖群发、PBN 等高风险手段\n结果导向，能独立设定指标并推进\n细致耐心，能承受高比例的拒绝与反复跟进", "cat": "运营"}, {"id": "64", "title": "SEO高级工程师", "salary": "20K-35K", "location": "未明确", "jd": "负责建站平台及旗下多模板、多站点的技术SEO建设，解决搜索引擎抓取、页面渲染、索引收录、重复内容及访问性能等问题。\n能够独立完成问题诊断、方案设计、代码落地、上线验证和效果跟踪，将单站优化经验沉淀为平台公共能力。\n\n 二、岗位职责\n1. 建立平台技术SEO规范\n- 制定多站点、多模板的SEO技术标准，覆盖URL、页面标题、描述、Canonical、Robots、Sitemap、结构化数据及站内链接。\n- 明确首页、频道、列表、详情、分页、搜索结果等页面的收录策略。\n- 建立新模板上线检查清单和版本回归机制，减少跨模板重复问题。\n2. 解决抓取与收录问题\n- 通过搜索平台报告、服务器日志和爬虫工具，分析页面未发现、抓取失败、重复索引及已抓取未收录等问题。\n- 排查状态码、重定向、软404、参数URL、无效链接及抓取资源浪费。\n- 设计适用于大规模内容站点的Sitemap生成、分片、更新及失效清理机制。\n3. 推动代码与架构优化\n- 理解JavaScript页面的渲染和抓取特点，协同前后端优化SSR、SSG或其他适合业务的渲染方案。\n- 排查服务端输出与客户端渲染不一致、元信息缺失、跨请求缓存污染等问题。\n- 参与路由、分页、内容上下架、缓存及域名配置等核心逻辑设计，避免功能迭代破坏SEO。\n- 能独立编写诊断脚本、自动化检查工具，并参与相关业务代码修改。\n 4. 建设多域名与迁移能力\n- 规范主域名、备用域名、HTTP/HTTPS及不同终端页面的访问与索引关系。\n- 制定域名切换、URL改版及新旧系统迁移方案，明确重定向映射、Canonical、站内链接和Sitemap更新要求。\n- 建立迁移前基线、上线检查、异常监测及回退方案，降低自然搜索流量损失风险。\n5. 优化页面性能与体验\n- 结合Core Web Vitals及实际访问数据，推动首屏渲染、图片加载、缓存和脚本执行优化。\n- 分析广告、埋点及第三方脚本对内容展示、交互和页面稳定性的影响。\n- 建立可复现的性能测试方法，区分实验室结果与真实用户数据。\n6. 建立监控与效果闭环\n- 建设SEO监控与告警，覆盖关键页面可访问性、索引指令、规范链接、Sitemap及自然搜索表现。\n- 跟踪有效页面收录、自然搜索曝光与点击、抓取异常及核心页面性能。\n- 区分版本影响、内容变化、统计口径变化及外部因素，不以单一排名或流量波动直接下结论。\n- 与产品、研发、测试和运营协同，为重点问题明确负责人、处理优先级和验收条件。\n\n三、任职要求\n1. 具备扎实的工程背景。 建议具有5年以上Web研发或相关技术经验，其中至少3年技术SEO实战经验；能力和项目成果突出者可适当放宽。\n2. 有完整项目经验。 主导过内容平台、建站系统或较大规模网站的技术SEO建设，能够说明问题、实施过程及可核验结果。\n3. 熟悉搜索引擎工作机制。 理解发现、抓取、渲染、索引与搜索展示之间的区别，能判断问题发生在哪一层。\n4. 具备实际编码能力。 熟悉JavaScript或TypeScript，能够使用Python、Node.js等至少一种语言开发分析及自动化工具。\n5. 理解Web基础设施。 熟悉HTTP状态码、重定向、DNS、CDN、缓存、反向代理及常见访问异常的排查方法。\n6. 熟悉现代前端应用。 有React、Vue及相关服务端渲染框架经验，能够分析页面源代码、渲染结果和网络请求。\n7. 具备数据分析能力。 能使用SQL或脚本分析日志和搜索数据，准确处理时间范围、去重、分母及指标口径。\n8. 具备跨团队推动能力。 能把SEO问题转化为研发任务、测试用例及发布验收标准，而不止提交问题清单。\n\n 加分条件\n- 有多租户、多模板、多域名建站平台经验。\n- 有百万级页面的抓取与索引治理经验。\n- 主导过域名迁移、站点重构或URL体系调整。\n- 熟悉Google Search Console、Bing Webmaster Tools，以及常用SEO爬虫和日志分析工具。\n- 有多语言站点、视频或其他富媒体内容的技术SEO经验。\n- 有SEO自动化巡检、持续集成检查或可观测性建设经验。\n- 能合理使用AI辅助代码和分析，并独立核验结果。", "cat": "技术 / 数据"}, {"id": "65", "title": "新媒体运营（TikTok方向）", "salary": "10-15K", "location": "未明确", "jd": "一、岗位职责\n1. 负责公司新媒体渠道（TikTok 等海外平台）的账号搭建、日常运营与内容策划；\n2. 独立策划并制作图文、短视频、话题等内容，把控内容质量与发布节奏，持续提升粉丝量、互动率及引流转化；\n3. 制定内容日历与投放策略，结合数据表现持续优化内容方向与选题，提升账号权重与曝光；\n4. 维护社群与粉丝关系，策划线上互动活动，提升用户活跃度、忠诚度与品牌口碑；\n5. 跟踪各平台规则与算法变化、行业热点与竞品玩法，及时调整策略并挖掘新渠道、新增长机会；\n6. 配合站内运营做好拉新引流与转化承接，沉淀可复用的内容与运营方法论。\n\n二、任职要求\n1. 3 年以上新媒体运营经验，有海外社交媒体或视频 / 娱乐 / 泛文化类账号运营经验者优先；\n2. 深入了解 TikTok 平台规则，尤其是限制级内容，熟悉 Twitter / X、Telegram 等平台规则、算法与内容玩法；\n3. 具备独立剪辑视频素材的能力，能够独自完成视频的切片，并根据视频播放数据调整视频切片格式；\n4. 具备较强的内容策划与文案能力，对网感与热点敏感，有爆款内容产出经验者优先；\n5. 数据驱动，能基于数据反馈快速复盘并优化运营策略；\n6. 英语读写能力良好，能独立运营海外账号者优先；具备短视频拍摄能力者加分。\n7.需要对行业及产品有了解。\n\n三、加分项\n1.最好有同行业的新媒体运营经验。", "cat": "运营"}, {"id": "66", "title": "AI全栈工程师", "salary": "25K–30K", "location": "未明确", "jd": "岗位介绍\n负责AI模型的工程落地、性能调优及配套应用开发，提升模型服务的效果、响应速度、吞吐和稳定性，交付可复用、可维护的模型能力。\n岗位职责\n1. 负责AI模型的接入、适配和服务封装，协同算法团队完成模型优化与效果验证。\n2. 优化模型推理流程、并发调度及资源使用，定位性能瓶颈，改善响应延迟、吞吐和运行成本。\n3. 开发后端接口、异步任务、状态查询、失败重试及结果存储等模块，保障服务可靠运行。\n4. 完成配套前端功能，包括模型调用、参数配置、任务管理、效果对比和结果展示。\n5. 接手维护现有代码，完善日志、测试、接口文档和版本管理，与相关团队完成联调、部署交付和验收。\n任职要求\n1. 具备扎实的后端开发能力，能够使用Python独立开发服务，熟悉FastAPI、Django等至少一种框架，有实际项目交付经验。\n2. 有AI模型工程化经验，理解模型输入输出、推理流程及效果评测，能分析速度、资源占用与模型效果之间的取舍。\n3. 熟悉数据库、缓存、消息队列及对象存储，能够处理并发、超时、重试与重复请求问题。\n4. 掌握JavaScript／TypeScript及React或Vue，能够独立完成业务页面和前后端联调。\n5. 熟悉Linux、Git、Docker，具备代码阅读、问题定位、性能分析和回归测试能力。\n6. 能使用AI编程工具提高效率，并独立审查、调试和验证生成的代码。\n加分项\n有模型推理加速、量化、批处理、GPU性能分析或多模态模型应用经验；有可展示的项目、代码作品或开源贡献。\n\n应聘材料\n请提供一个实际参与交付的项目，说明个人负责部分、技术方案、性能或稳定性问题及解决结果。涉及前雇主\n保密内容可脱敏说明，无需提供非公开源码。", "cat": "AI / AIGC"}, {"id": "67", "title": "支付客服 / 运营客服", "salary": "10-12k", "location": "未明确", "jd": "一、岗位名称\n\n支付客服 / 运营客服（必须在越南或英国）\n\n二、岗位职责\n负责日常商户咨询接待，及时响应并处理商户提出的问题。\n负责订单查询、订单核实、补单、掉单、异常订单跟进及处理。\n协助商户解决支付过程中出现的各类问题，提高商户满意度。\n跟进各支付通道运行情况，及时反馈异常信息，并协助推动问题解决。\n根据业务流程完成数据登记、信息整理及工作日报提交，确保数据准确、完整。\n对接财务、运营、技术等相关部门，协助完成订单核对、异常处理及业务协调。\n熟练使用公司各类后台系统及AI工具，提高工作效率和处理质量。\n严格执行公司业务流程及保密制度，确保客户信息及业务数据安全。\n完成上级安排的其他工作事项。\n三、岗位要求\n基本要求\n年龄20-35岁，学历不限制\n具备良好的服务意识及沟通表达能力。\n工作认真细致，责任心强，具备较强执行力。\n能接受轮班及节假日值班安排。\n能力要求\n熟练使用电脑办公软件（Word、Excel、WPS）。\n具备较强的数据分析及问题判断能力。\n学习能力强，能够快速熟悉业务流程。\n抗压能力较强，能够适应高并发业务环境。\n具有良好的团队协作意识。\n优先条件\n有支付行业、互联网客服、运营客服经验优先。\n有支付、金融、电商相关工作经验优先。\n熟悉USDT、银行卡、支付宝、微信等支付产品者优先。\n熟悉AI办公工具（如ChatGPT、Claude等）并能够提升工作效率者优先。\n四、岗位KPI\n客服响应时效\n工单处理及时率\n工单处理准确率\n商户满意度\n异常订单处理时效\n工作日报完成率\nAI工具使用率\nSOP执行率\n五、任职素质\n服务意识强\n沟通协调能力强\n学习能力强\n执行力强\n风险意识强\n工作细致认真\n保密意识强\n团队协作能力良好\n六、晋升路径\n\n客服专员 → 高级客服 → 客服组长 → 客服主管 \n\n七、工作目标\n\n通过专业、高效的客户服务，为商户提供及时、准确的业务支持，持续提升订单处理效率及客户满意度，保障支付业务稳定运行，并通过标准化流程及AI工具应用，不断提升团队整体运营效率与服务质量。", "cat": "客服 / 支持"}, {"id": "68", "title": "AI成人短剧编剧", "salary": "10-18k", "location": "未明确", "jd": "岗位职责：\n1.负责AI成人短剧剧本的原创与改编，独立完成分集大纲、对白与分镜设计\n2.把控剧情节奏、情绪张力与成人内容尺度，确保故事完整且具有传播性\n3.使用AI工具进行剧本优化、分镜调整与多轮内容迭代\n与生成、剪辑团队紧密配合，保障剧本最终落地效果\n任职要求：\n4.具备扎实的编剧功底，熟悉成人短剧的叙事结构与节奏把控\n5.热爱AI，有编剧相关经验或强烈兴趣,并对市面上一些新的agent和大模型的使用愿意去学习\n6.有成人向内容创作经验者优先\n7.能高效完成部门安排的紧急任务、临时任务、日常任务", "cat": "AI / AIGC"}, {"id": "69", "title": "高级市场营销策划师", "salary": "18k-25k", "location": "未明确", "jd": "岗位职责\n1. 营销策划 — 负责公司产品的整体营销策划，根据产品特点制定推广主题、传播策略及阶段性营销方案。\n2. 热点捕捉 — 关注互联网热点、娱乐热点及用户讨论趋势，快速判断热点与产品的结合方式，形成可执行方案。\n3. 内容传播 — 结合抖音、小红书、微博、X（Twitter）、Telegram 等平台特点，制定差异化内容传播策略。\n4. 资源整合 — 协调官号、KOL/KOC、达人及外部渠道等资源，完成营销推广。\n5. 活动策划 — 负责营销事件、线上活动、征集活动等策划，从选题到落地执行完整推进。\n6. 数据追踪 — 对营销结果负责，跟踪曝光、互动、涨粉、新增、付费及充值等数据，根据效果调整策略。\n7. 跨部门协作 — 与新媒体、渠道、产品、设计及剪辑团队协作，推动方案落地并完成复盘。\n任职要求\n1. 2年以上互联网营销/品牌策划/新媒体策划经验，有完整项目案例优先。\n2. 熟悉抖音、小红书、微博等主流社交媒体，有 X、Telegram 等海外平台经验加分。\n3. 热点敏感度高，能快速完成判断、选题包装和方案设计。\n4. 具备策划及文案能力，能独立输出营销方案及执行 SOP。\n5. 有数据意识，能从流量→新增→付费→充值完整链路判断营销效果。\n6. 有短剧、影视、娱乐、二次元、内容平台等行业经验优先。\n7. 有 KOL/KOC、MCN、媒体或社媒矩阵资源整合经验优先。\n 我们要的人 | 说明                     |\n| ----- | ---------------------- |\n| 懂营销   | 有系统的营销方法论，不是只会投流       |\n| 会手段   | 热点营销、内容营销、事件营销、活动策划等都会 |\n| 话题敏感  | 知道什么能火，什么能出圈           |\n| 思路开阔  | 不走寻常路，能发现别人没发现的切入点", "cat": "商务 / 市场"}, {"id": "71", "title": "AI视频生成师/剪辑师", "salary": "12-18K", "location": "未明确", "jd": "岗位职责\n1. 使用 AI 视频生成工具（Kling、Runway、Luma、可灵、即梦等）完成视频生成与优化。\n2. 熟练使用 LiblibAI、ComfyUI 画布 等平台/工具，搭建节点工作流，完成图像/视频的精细化生成与控制。\n3. 根据需求撰写和迭代提示词（Prompt），控制画面风格、运镜、角色一致性、动作连贯性等（非常重要）。\n4. 结合 AI 生成内容进行后期剪辑、调色、节奏调整，输出可直接使用的成片。\n5. 探索并落地 AI 视频生产流程，持续跟进新模型、新节点、新玩法。\n\n任职要求\n1. 熟悉 LiblibAI、ComfyUI 画布者优先（有节点工作流作品更佳）。\n2. 有第一人称/POV 视角视频制作或生成经验者优先。\n3. 有短视频平台内容产出经验，了解节奏和爆款逻辑。\n4. 能独立完成从提示词 → 生成 → 后期的完整流程。", "cat": "AI / AIGC"}, {"id": "72", "title": "AI 动漫内容创作／编剧", "salary": "12-18K", "location": "未明确", "jd": "岗位职责\n1. 独立或主导撰写R18动画短片、猎奇短片的内容创作。\n2. 熟悉短剧叙事逻辑，确保每集具备明确冲突、反转或情绪高潮，并设置有效悬念。\n3. 根据制作需求与反馈修改剧本，配合导演与团队推进内容落地。\n4. 持续提供符合风格定位的原创选题与系列化内容。\n\n任职要求\n1. 熟悉anime hentai、porn manhwa等动漫内容 。\n2. 文笔扎实，擅长营造氛围、处理欲望与恐惧交织的情节，逻辑清晰且富有想象力。\n3. 了解二次元市场用户需求，尤其是英语国家的二次元用户。\n4. 有成人向、恐怖或奇幻题材作品经验者优先。", "cat": "AI / AIGC"}, {"id": "73", "title": "工具类产品经理", "salary": "依能力与经验面议", "location": "未明确", "jd": "岗位职责\n1. 梳理产品现状、用户需求和核心使用场景，制定产品迭代计划，明确需求优先级与预期收益。\n2. 负责浏览器体验、会员权益、签到激励、邀请分享及内容消费等模块的产品设计，完成原型、需求文档和验收标准。\n3. 建立用户行为埋点与指标体系，分析用户从首次使用、持续活跃到会员付费的完整链路。\n4. 围绕新用户引导、免费与付费体验差异、会员到期承接等场景设计实验，提升留存和付费转化。\n5. 结合渠道质量、获客成本、用户生命周期价值及 ROI，判断当前阶段的业务重点，平衡活跃规模与商业化效率。\n6. 协调设计、研发、测试和运营推进需求上线，持续跟踪效果并复盘，对实际结果负责。\n\n任职要求\n1. 有工具类、浏览器、会员订阅或移动互联网产品经 n": "未明确", "jd": "岗位职责\n1. 负责多项目、多平台（App、Web）的数据埋点方案设计、评审、验收与版本管理；制定并维护统一的埋点规范、事件字典及指标口径标准，确保多端数据一致性。\n2. 通过数据埋点实时/准实时监控各端产品异常情况（数据丢失、漏埋、错埋、上报异常等），快速定位问题并推动相关团队闭环解决。\n3. 基于埋点数据评估各类活动效果、运营策略效果及功能迭代效果，输出分析报告与可落地的优化建议。\n4. 负责核心业务数据看板的搭建、迭代与日常维护，支撑业务监控、决策与复盘需求。\n5. 负责日常数据监控、数据质量稽核与异常核查，确保数据准确性、完整性与及时性。\n6. 在产品每次改版/迭代上线后，重点核查数据口径一致性，避免因口径变化或埋点调整导致指标异常，并形成标准化核查流程。\n\n任职要求\n1. 本科及以上学历，统计学、计算机、数学、数据科学等相关专业优先。\n2. 4年以上数据分析经验，具备多项目数据埋点管理与分析实战能力，熟悉埋点全流程（需求对接→方案设计→评审→开发联调→验收→上线监控）。\n3. 精通SQL，能独立完成复杂数据提取、清洗与分析；熟练使用Excel，掌握至少一种可视化/看板工具（如Tableau、Power BI、帆软、神策看板等）。\n4. 熟悉主流埋点/行为分析平台（如神策、GrowingIO、火山引擎DataFinder等）者优先；有埋点规范制定、事件字典维护经验者优先。\n5. 具备较强的数据敏感度、逻辑分析能力与问题排查能力，能独立完成数据异常诊断与口径核对。\n\n加分项\n有搭建过完整指标体系与数据质量监控体系的经验\n有参与过产品改版前后数据对比与口径治理的经验", "cat": "产品"}, {"id": "79", "title": "效能支撑部-项目经理", "salary": "12-20K", "location": "未明确", "jd": "岗位职责\n1.负责项目全生命周期跟踪，建立项目进度台账，及时掌握项目状态及关键节点完成情况；对延期风险、资源冲突及异常事项进行预警与升级处理。\n2.协调产品、研发、测试、运营等相关团队资源，推动跨部门协作问题解决；针对项目推进过程中的阻塞事项进行跟踪闭环，确保问题及时解决并形成明确结论。\n3.识别项目推进过程中的潜在风险与异常情况，建立项目风险清单；推动责任部门制定解决方案并跟踪落地，降低项目延期及交付风险。\n4.收集项目交付相关数据，分析延期、返工、协同效率等关键指标；定期输出项目效能分析报告，发现影响项目交付效率的关键问题并提出改善建议。\n5.参与项目管理机制建设与持续优化；推动跨部门协同机制、项目管理规范及问题升级机制落地，持续提升组织协作效率。\n6.整理项目典型案例、最佳实践及常见问题解决方案；建立项目经验库，推动优秀经验复制与推广。\n\n\n任职要求\n1.3年以上互联网、软件研发、项目管理、运营管理等相关工作经验；\n2.熟悉互联网产品研发流程，对产品、研发、测试、运营协作模式有较好理解；\n3.具备较强的项目推进意识和结果导向意识；\n4.具备优秀的沟通协调能力，能够推动跨部门问题解决；\n5.具备较强的问题分析能力，能够快速识别项目阻塞点及风险；\n6.具备较好的数据分析能力，能够通过数据发现问题并形成改善建议；\n7.具备较强的执行力与责任心，能够同时推进多个项目并保证跟踪质量；\n8.具备良好的文档编写及汇报能力，能够以结构化方式向管理层反馈项目情况；\n9.加分-有PMO、项目管理、项目运营相关经验者优先；\n10.加分-具备PMP、ACP等项目管理认证者优先；\n11.加分-有中大型互联网项目管理经验者优先", "cat": "职能"}, {"id": "80", "title": "产品专员", "salary": "20k-28k", "location": "未明确", "jd": "\"\n1.3年以上产品经理经验或3年以上UX\\UI经验； 低于2年 直接不考虑\n2.核心能力要求：洞察力、推动力、框架思考能力；\n3.全日制本科毕业；\n4.有跨欧洲时区工作条件优先，不可跨时区工作者无需熬夜；\n5.有统筹过百万DAU以上产品或产品矩阵经验优先；\n\"        \"【岗位职责】 \n1.对上百个产品有序做体验报告，生成优势说明、缺点清单、改进逻辑、改进方案，参考交互；\n2.从需求阶段介入每个产品的需求文档，对其中交互部分进行交互优化建议，降低后期成本；\n3.依据产品现状与行业领军产品制定交互规范，并监督规范落实到位，对于落实延期的产品要进行日、周总结和月度复盘；\n4.深度研究字节、腾讯等大流量产品的交互优势、适应人群等，形成通用需求文档交付给各个研发团队；\n5.监督测试团队的测试结果和落实结果；\n6.部门内其他交付的产品、交互、测试、运营相关的调研任务等；\"", "cat": "产品"}, {"id": "81", "title": "增长运营（SEO / GEO 方向）", "salary": "12-20k", "location": "未明确", "jd": "【岗位职责】\n1）负责 SEO 策略制定与执行，包括关键词研究、搜索意图分析、竞品分析及内容规划。\n2）围绕产品特点和用户需求，策划产品介绍、使用指南、场景专题、常见问题及对比评测等内容。\n3）推动网站基础 SEO 优化，与产品、研发协作改善页面标题、描述、内部链接、站点地图、抓取与索引等问题。\n4）研究 GEO（生成式引擎优化），分析用户在 AI 搜索中的提问方式，优化内容的清晰度、信息完整性、可信度及可引用性。\n5）建立目标问题与关键词清单，定期观察品牌在传统搜索及 AI 搜索中的展示、提及和引用情况，记录变化并验证优化效果。\n6）拓展相关社区、内容平台及合作渠道，积累有价值的品牌曝光、外部引用与引荐流量。\n7）跟踪自然搜索曝光、点击、注册、激活及付费转化，结合用户质量评估获客效果。\n8）与产品及用户运营合作，根据搜索需求和用户反馈优化落地页与转化路径。\n【任职要求】\n1）具备 2 年及以上互联网运营或内容增长经验，有 SEO 实操项目经验。\n2）理解搜索意图、关键词布局、页面优化、内部链接及抓取索引等基础知识。\n3）了解 GEO 的基本逻辑，能够区分搜索排名、AI 回答提及、来源引用与实际引流效果。\n4）熟悉 Google Search Console、GA4 等工具，能够分析搜索表现和用户转化。\n5）具备内容策划、撰写与编辑能力，能够围绕用户问题产出准确、有用的内容。\n6）能与研发沟通基础网站优化需求，并跟进实施与效果验证。\n7）具备数据分析和实验意识，能够说明做过的优化动作、结果及判断依据。\n【加分项】\n1）有 AI、社交、娱乐或订阅制产品的自然流量增长经验。\n2）有新网站从零获取自然流量的案例。\n3）有 AI 搜索可见度监测、内容引用分析或 GEO 实验经验。\n4）有英文内容运营、多语言网站或海外市场经验。\n5）能使用 AI 工具提升研究和内容制作效率，并进行事实核查与质量审核。", "cat": "商务 / 市场"}, {"id": "82", "title": "督导专员", "salary": "15-35k", "location": "未明确", "jd": "1.流程体系搭建与优化：\n建立并持续完善 项目管理标准流程（含立项、评审、变更等环节），输出标准化模板（如风险清单、交付文档等），推动跨部门协同流程落地，提升项目运作效率。​\n2.进度与风险管控：\n实时跟踪项目进度，识别项目中的关键风险点（如资源冲突、技术瓶颈、合规要求等），建立风险台账并制定应对预案，协调内外部资源解决项目阻塞问题，降低项目延期、返工风险。​\n3.数据复盘与赋能：\n收集项目核心数据，形成项目复盘报告，提炼经验教训并输出优化建议；搭建项目管理知识沉淀体系，赋能项目团队提升管理能力。​\n4.人才与事件追踪\n在所负责系统内主动观察一线人才，建立人才挖掘报告与持续跟踪机制；同时对部门内值得关注的事件进行追踪记录，形成事件库。\n\n任职要求\n1.6年以上IT系统管理、项目交付或产品管理相关经验。\n2、PMP等相关资质认证者优先；\n3、有良好的沟通能力，抗压能力强，能够适应较复杂的合作环境;\n4. 具备结构化复盘与表达能力，可以结论先行的方式向管理层汇报。", "cat": "其他"}, {"id": "83", "title": "商务专员", "salary": "12k-25k", "location": "未明确", "jd": "【岗位职责】\n1.负责品牌对外商务合作的开拓与维护，包括媒体资源对接等方向的前期沟通与落地推进\n2.独立跟进商务合作的合同签署、权益拆解、执行排期及效果复盘，确保每一项合作从谈判到落地的全程高质量交付，及时识别并处理执行过程中的异常与风险\n3.建立并持续维护品牌商务资源库，涵盖媒体合作方、行业资源方等，定期更新合作方评估记录，为后续合作决策提供数据支撑\n4.深度协同品牌内容、运营等团队，确保商务资源投放与内容节奏高效协同，最大化合作传播价值\n5.跟踪行业动态与竞品商务合作方向，定期输出市场资源整合建议\n6.熟练运用AI工具辅助商务资料整理、合作方案撰写与数据分析，提升工作效率\n【任职要求】\n7.本科及以上学历，35岁以下，具备2-3年商务合作或渠道资源对接相关工作经验\n8.具备较强的谈判能力与能独立主导商务合作的洽谈与推进\n9.熟悉媒体资源生态，有品牌合作项目落地经验者优先\n10.有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n11.逻辑清晰，执行力强，能同时推进多个合作项目并确保交付质量\n12.熟悉或愿意深度使用AI工具，具备用AI提效的主动意识\n13.远程，远程候选人需具备即刻上岗能力，能高效配合团队节奏，", "cat": "商务 / 市场"}, {"id": "84", "title": "经纪人及陪玩运营", "salary": "18~25K", "location": "未明确", "jd": "岗位职责\n经纪人拓展：开拓并签约外部经纪人、公会和中介机构，负责合作洽谈、资质审核和入驻，搭建陪玩供给渠道。\n经纪人体系搭建：制定经纪人的分级、考核、激励和淘汰机制，设计分成与返佣政策。\n陪玩入驻管理：负责经纪人带入和个人自主申请两类陪玩的入驻全流程，包括资质审核（实名认证、年满 18 周岁）、新人培训、冷启动跟进和档案状态维护。\n陪玩供给管理：通过经纪人渠道和平台直签两条线，保证各时段、各品类的供给数量和质量，搭建陪玩成长和激励机制。\n日常运营维护：建立经纪人和陪玩的沟通及例会机制，传达规则和活动，处理结算、纠纷和反馈。\n数据分析：搭建经纪人和陪玩的数据看板（拉新、在线时长、接通率、付费转化、留存、流水），定期复盘并推动优化。\n合规风控：执行平台规范，配合审核团队处理违规陪玩和违规经纪人，防范刷单、套现、私下引流等风险。\n跨部门协作：向产品团队反馈经纪人后台、陪玩工具和结算等需求，配合市场和活动团队落地供给侧活动。\n任职要求\n本科及以上学历，2 年以上直播、语聊、社交或陪伴类平台的公会、经纪人或陪玩运营经验。\n熟悉公会和经纪人的合作模式与分成结构，有陪玩招募、审核或入驻管理经验；有经纪人或公会资源者优先。\n对数据敏感，能熟练使用 Excel 或 SQL，能通过数据定位供给问题。\n沟通和谈判能力强，能同时维护多个外部合作方。\n规则意识和风控意识强，能在增长和合规之间把握分寸。\n抗压能力强，能适应业务快速变化和晚间高峰时段的工作节奏。\n加分项\n有从 0 到 1 搭建经纪人体系或陪玩供给渠道的经验\n了解海外或出海社交产品的运营模式\n手里有成熟的女孩供给资源", "cat": "运营"}, {"id": "85", "title": "高级品牌策划", "salary": "20-35K", "location": "工作形式：英国本地 / 远程均可", "jd": "岗位名称：高级品牌策划\n\n岗位职责\n1. 负责集团品牌整体策略规划、品牌定位迭代、品牌理念及价值体系搭建，输出标准化品牌策略方案。\n2. 统筹年度品牌传播主题、节点营销、品牌IP内容、全域传播策略的策划与落地，主导品牌升级、品牌焕新等重点专项项目。\n3. 深度拆解行业竞品品牌打法、市场趋势及用户偏好，输出品牌市场分析、策略优化报告，持续迭代品牌运营思路。\n4. 联动新媒体、社群、用户运营、设计等团队，统筹各类品牌内容、活动、传播物料的策略方向，保障品牌调性统一。\n5. 负责品牌项目全流程管控，包含方案输出、落地跟进、数据复盘、策略优化，沉淀可复用的品牌打法与案例体系。\n6. 能够对整体品牌团队进行协调管理，并保证方案的实际执行。\n7. 熟练运用AI工具辅助市场调研、策略 brainstorm、方案优化、内容选题，大幅提升品牌策划与迭代效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，3年以上品牌全案策划、品牌策略相关工作经验，有集团化品牌统筹经验优先。\n2. 具备完整的品牌策略搭建、品牌活动全案操盘、品牌内容体系搭建经验，能够独立输出高质量全案策略。\n3. 对新媒体热点、行业趋势、用户审美高度敏感，可结合品牌调性创新策划传播内容与营销玩法。\n4. 具备优秀的文案功底、逻辑思维和创意能力，策略落地性强，可高效联动多团队协同推进项目。\n5. 具备较强的数据复盘能力，能够依据传播数据、用户反馈持续优化品牌策略与内容方向。\n6. 有泛娱乐、互联网媒体、内容平台品牌策划经验者优先。\n7. 熟练或愿意深度使用各类AI工具，具备主动用AI提效、创新策划的工作意识。\n\n工作形式：英国本地 / 远程均可", "cat": "商务 / 市场"}, {"id": "86", "title": "项目经理", "salary": "依能力与经验面议", "location": "工作形式：远程", "jd": "岗位职责\n1. 负责 Web、App 及短视频/视频产品的品牌升级项目，统筹从品牌策略落地、视觉规范输出到全端换新上线的全过程，对进度、品质、成本与上线效果负责。\n2. 制定品牌升级整体计划与里程碑，拆解 Web 端、App 端、短视频账号及视频物料等各触点任务，确保多端同步推进、节点对齐。\n3. 把控品牌视觉在各端的落地品质，覆盖界面视觉、播放器与内容包装、运营物料等，保障风格统一、品牌识别一致。\n4. 组织品牌方案评审、设计验收与上线复核，明确各触点交付标准与验收口径，减少返工与品牌表达偏差。\n5. 协调品牌、设计、视频制作及市场传播等相关方，对齐升级节奏与发布档期，推动物料齐套、按时上线。\n6. 识别档期冲突、物料延期、多端不一致及成本风险并推动闭环；项目结束后完成复盘，沉淀品牌升级规范与资产。\n\n任职要求\n1. 本科及以上学历5年以上项目管理经验，其中 2年以上大型交付型项目管理经验。\n2. 具备 50 人以上项目团队的实际管理经验，能统筹跨职能协作、资源调配与效能提升。\n3. 有独立操盘并成功交付单体合同/预算 1000 万以上项目的真实案例，具备范围管理、成本核算与收益把控能力。\n4. 熟练掌握项目管理方法，能独立进行计划制定、WBS 拆解、里程碑监控、风险预警与变更管理。\n5. 持有 PMP 认证，熟悉 PMBOK 体系；具备极强的交付结果导向、风险预判、跨部门协调及向上汇报能力。\n\n加分项\n1. 有品牌升级、视觉焕新或 Web/App/短视频多端品牌落地经验。\n2. 有泛娱乐、短视频、新媒体、数字内容等相关行业背景。\n3. 兼具 ACP、Scrum Master 等认证，或具备 IPD 流程落地经验。\n4. 有大型软件开发、系统集成或复杂项目群交付经验。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "职能"}, {"id": "87", "title": "品牌策划专员", "salary": "12-20K", "location": "工作形式：远程", "jd": "岗位名称：品牌策划专员\n\n简历筛选要点：具备品牌策划、内容策划、活动执行实操经验；热点敏感度高，擅长落地执行与文案输出；会基础图文内容处理；熟练使用AI工具辅助工作；有成人行业泛娱乐、新媒体行业经验者优先。\n岗位职责\n1. 协助高级策划完成品牌策略落地、品牌活动、节点营销、话题传播的方案细化与执行落地。\n2. 负责品牌日常宣传文案、推文、新闻素材、活动话术、品牌故事等内容的撰写与优化。\n3. 跟踪行业热点、网络趋势、竞品动态，收集优质案例，输出素材汇总与基础分析内容，支撑品牌创新策划。\n4. 配合设计、新媒体、运营团队，完成各类品牌物料、传播内容的需求对接、内容审核、上线跟进。\n5. 负责品牌基础资产归档、宣传素材整理、活动复盘总结，沉淀标准化品牌执行资料。\n6. 运用AI工具辅助文案撰写、选题搜集、素材整理、基础数据分析，提升日常工作效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上品牌策划、内容策划、文案运营相关工作经验。\n2. 熟悉新媒体品牌传播逻辑，了解主流平台内容玩法，能够贴合品牌调性输出内容。\n3. 对网络热点、流行文化敏感，可快速结合热点适配品牌宣传场景。\n4. 文案功底扎实，写作风格灵活，可适配不同平台、不同场景的内容创作需求。\n5. 执行力强，具备良好的协同沟通能力，可高效配合多团队完成品牌落地工作。\n6. 有泛娱乐、内容媒体、互联网平台品牌相关经验者优先。\n7. 熟悉或愿意学习AI工具，具备借助工具提升内容产出与工作效率的意识。\n\n工作形式：远程", "cat": "商务 / 市场"}, {"id": "88", "title": "品牌平面设计", "salary": "12-20K", "location": "工作形式：远程", "jd": "具备品牌平面设计、视觉物料制作、品牌视觉落地实操经验；审美能力出众，擅长视觉适配、版式设计与画面优化；熟练掌握主流设计软件，会基础短视频封面、图文排版处理；熟练使用AI设计工具辅助创作；有成人行业泛娱乐、新媒体、互联网品牌设计经验者优先。\n岗位职责\n1. 协助资深设计完成品牌视觉体系落地，配合品牌营销、节点活动、话题传播、日常宣传等场景，完成各类平面视觉方案的细化设计与落地输出。\n2. 负责品牌日常宣传物料设计，包含公众号推文配图、海报、长图、banner、活动物料、宣传画册、品牌素材图、社交传播图等全品类平面视觉内容制作与优化。\n3. 跟踪行业视觉趋势、新媒体设计风格、竞品品牌视觉动态，收集优质视觉案例，完成素材汇总与视觉风格分析，为品牌视觉创新、风格迭代提供支撑。\n4. 配合品牌策划、新媒体、运营团队，对接各类视觉设计需求，精准理解策划方案与营销场景，完成物料设计、修改、审核、上线跟进，保障视觉内容
