围和视觉一致性。\n-理解 AI 生成内容的常见问题，能针对角色漂移、画面崩坏、动作不连贯、镜头不稳定等问题进行修正。\n-有较强的执行力和学习能力，能快速适应 AI 工具更新和项目节奏。\n-具备良好的沟通协作能力，能根据反馈快速调整内容，并与编剧、剪辑、运营等角色高效配合。\n-有短剧、短视频、动画、影视后期、广告片、漫画、游戏美术、AIGC 内容制作经验者优先。", "cat": "内容与创作"}, {"id": "283", "title": "中级运营（吃瓜编辑）", "salary": "8-12k", "location": "", "jd": "## 岗位职责\n\n1. 跟踪全网热点、娱乐八卦、社会吃瓜事件，快速抓取事件线索，梳理事件时间线、人物关系，整理完整吃瓜素材。\n2. 负责吃瓜向内容生产，包括短文案、事件复盘、瓜料合集、热点解读，适配新媒体账号图文 / 短视频脚本输出，语言通俗有网感。\n3. 甄别网络信息真伪，做基础信息核实，剔除谣言，规避侵权、敏感风险，把控内容尺度。\n4. 监测评论区、社交平台用户讨论，挖掘网友高热度观点、二次梗点，反哺内容选题。\n5. 跟进热点生命周期，判断选题热度，复盘内容数据，迭代选题方向与写作风格。\n6. 整理瓜料素材库，沉淀热点事件档案，做好素材归档。\n\n## 任职要求\n\n1. 熟悉微博、小红书、抖音等社交平台，常年冲浪，对娱乐、社会热点八卦敏感度极高，5G 网上冲浪选手。\n2. 网感强，会抓梗，擅长叙事梳理，能把复杂事件讲得清晰易懂，写作节奏紧凑，懂吃瓜用户阅读偏好。\n3. 具备基础信息辨别能力，会多方比对信息，有风险意识，了解新媒体内容红线。\n4. 抗压能力强，热点突发时可以快速响应，赶稿出稿，能接受热点突发情况下的弹性工作。\n5. 有新媒体编辑、娱乐号、吃瓜号、自媒体内容实习 / 工作经验优先，可附过往作品。\n6. 思维灵活，善于拆解复杂多方事件，擅长梳理时间线、人物关系。", "cat": "内容与创作"}, {"id": "284", "title": "运营专员（偏剪辑，简历需带作品）", "salary": "8-12k", "location": "", "jd": "岗位职责\n1、根据脚本、运营需求完成短视频剪辑，包含素材筛选、粗剪精剪、调色、字幕花字、配乐音效、简单包装，独立输出竖屏成片。\n2、负责视频封面素材截取、封面剪辑排版、文字配色与出图，输出高吸引力封面图，配合提升点击率。\n3、把握视频节奏，打磨开头钩子，提升完播率；按照不同平台规范输出多版本物料，按时交付。\n4、接收反馈快速修改迭代，做好素材、工程文件、封面源文件归档，沉淀剪辑、封面模板。\n5、关注平台热点、爆款剪辑手法与封面风格，结合视频数据反馈优化剪辑与封面设计思路，参与内容头脑风暴。\n6、根据工作情况或团队安排，参与其他运营相关事项。\n7、完成其他视频相关的后期辅助工作。\n\n## 任职要求\n\n1、熟练 PR / 剪映，会达芬奇调色、AE 简单包装优先，能独立完成完整成片以及封面剪辑出图。\n2、1 年及以上短视频剪辑实战经验，网感好，懂短视频流量逻辑，有剪辑 + 封面作品作品集。\n3、镜头节奏感强，审美在线，理解脚本意图，对画面、字幕、音效、封面图文细节把控到位。\n4、执行力强，能接受修改迭代，抗压，守交付排期，沟通协作顺畅。\n5、加分：懂构图配色、有爆款视频 & 封面案例、会使用 AI 剪辑 / 作图工具。", "cat": "内容与创作"}, {"id": "285", "title": "ComfyUI 工程师", "salary": "10-20k", "location": "", "jd": "ComfyUI 工程师\n\n工作职责：\n1. 负责 AI 真人短剧男同 18+ 方向 ComfyUI 工作流的搭建、测试与迭代，确保出图、出视频的稳定性与画面质量达到短剧制作标准。\n2. 根据业务需求在 CivitAI、HuggingFace 等社区筛选合适的 Checkpoint、LoRA 及扩展节点，评估其风格适配度与底模兼容性。\n3. 设计并维护工作流模板库，覆盖生图、生视频等短剧生产高频场景，制定标准化节点连接规范。\n4. 搭建「工作流测试 + 效果验证」的评估流程，通过定量（良品率、显存占用、生成速度）与定性（构图/光影/一致性）分析定位问题并推动优化。\n5. 与 LoRA 训练师、技术、短剧制作团队协作，将工作流能力嵌入短剧生产管线，确保生成画面的质量符合短剧叙事需求。\n\n简历筛选要点：\n\n1.基本门槛\n- 2 年以上 AIGC 应用或相关工程经验。\n- 有制作过至少 2 个 18+ 短片（男同优先），单个时长不少于 1 分钟。\n- 本地有一台可以跑生视频工作流的电脑。\n\n2.技术能力\n- 熟悉 ComfyUI 节点逻辑，理解各参数对画面的具体影响，能独立排查工作流报错。\n- 熟悉 18+ 内容模型的生成特点与工作流适配方式。\n\n3.数据与资源能力\n- 具备扎实的模型检索与评估能力，能快速判断一个 LoRA 的底模兼容性及实际权重效果。\n- 熟练掌握 C 站等平台的检索技巧，有模型/LoRA 资产库搭建与归档经验。\n\n4.审美与业务理解\n- 具备基础的影视审美，能理解分镜、景别、机位等影视概念。\n- 能判断生成画面的构图、光影、色调是否符合短剧叙事需求。\n- 能判断生成的 18+ 画面的质量水平层级。\n\n5.加分项\n- 可以借助 AI 编写简单的自定义节点。\n- 在 AIGC 社区（CivitAI、Runninghub、HuggingFace、LiblibAI、B站等）有高质量工作流分享或技术内容输出。", "cat": "技术开发"}, {"id": "286", "title": "LoRA训练师", "salary": "10-25k", "location": "", "jd": "工作职责：\n1. 负责AI真人短剧男同 18+ LoRA 模型训练与优化，确保角色画面达到短剧制作标准。\n2. 根据业务需求制定数据采集标准，并根据训练反馈持续迭代数据策略。\n3. 设计并维护分层标签体系，包括身份标签、属性标签（表情/动作/角度）、环境标签（光照/背景）等，制定触发词与反向提示词策略。\n4. 建立“自动打标+人工精修”的标注协作流程，根据各打标工具的精度差异选择合适方案，保障标注质量与效率。\n5. 搭建 ComfyUI 测试工作流，对 LoRA 模型进行系统性效果验证，通过定量与定性分析定位问题并推动模型迭代。\n6. 与美术、编导团队协作，将模型能力嵌入短剧生产管线，确保生成画面的构图、光影、色调符合短剧叙事需求。\n\n简历筛选要点：\n1.基本门槛\n- 2年以上 AIGC 模型训练或相关工程经验。\n- 有至少1个中型及以上规模 LoRA 项目的全流程经验，能独立完成从数据打标到模型交付的链路。\n- 熟悉 ComfyUI，能独立搭建工作流完成 LoRA 效果测试。\n\n2.技术能力\n- 熟练掌握至少一门主流 LoRA 训练工具，理解网络维度、学习率、正则化等核心参数对模型收敛和过拟合的影响。\n- 熟悉主流基模架构特性，有真人真实感方向调优经验。\n- 熟悉 NSFW 内容模型的训练特点。\n\n3.数据能力\n- 具备扎实的数据工程思维，能根据目标模型类型制定数据采集标准和标注规范。\n- 熟练掌握 NSFW 内容的打标规范，具备分层标签体系设计能力。\n- 熟悉不同自动打标工具的精度差异，有“自动打标+人工精修”协作流程的实际搭建经验。\n\n4.审美与业务理解\n- 具备基础的影视审美，能理解分镜、景别、机位等影视概念。\n- 能判断生成画面的构图、光影、色调是否符合短剧叙事需求。\n\n5.加分项\n- 在 AIGC 社区（CivitAI、LiblibAI等）有高质量模型发布或技术内容输出。\n- 有 NSFW 类 AIGC 项目落地经验。", "cat": "其他"}, {"id": "287", "title": "美术 / 分镜师", "salary": "10-15k", "location": "", "jd": "### 岗位职责\n\n- 根据剧本完成角色、场景、道具等视觉资产生成。\n- 制作角色、场景、道具参考图及 AI 生成提示词。\n- 将文字剧本拆解为分镜头脚本，明确景别、画面、动作、情绪、台词、运镜和时长。\n- 保证角色、场景及画面风格在不同镜头中的一致性。\n- 配合视频生成组解决画面穿帮、人物变形和镜头衔接问题。\n- 负责分镜脚本、参考图及视觉资产的整理和归档。\n\n### 招聘要求\n\n- 1 年及以上影视 / 动画 / 短视频分镜、美术资产相关工作经验。\n- 具备角色、场景、道具等视觉资产设计与生成能力。\n- 能独立完成分镜头脚本，理解景别、构图、动作、情绪、运镜和时长。\n- 熟悉至少一种 AI 图像或视频生成工具，能够编写有效提示词。\n- 具备较好的画面审美、镜头意识和故事理解能力。\n- 能保证角色、场景及画面风格的一致性。\n- 有 AI 短剧相关工作经验者优先择用。", "cat": "内容与创作"}, {"id": "288", "title": "视频生成专员", "salary": "12-20k", "location": "", "jd": "### 岗位职责\n\n- 根据分镜头脚本、参考图和提示词完成 AI 视频镜头生成。\n- 负责人物、场景、动作、表情、运镜等画面效果的生成与优化。\n- 根据审核意见修改镜头，提升有效镜头率。\n- 保证角色形象、服装、场景和画面风格在不同镜头中的一致性。\n- 配合剪辑组完成镜头交付，确保素材可剪辑、可上线。\n- 整理生成参数、提示词、参考图和成片素材，做好版本归档。\n\n### 招聘要求\n\n- 0.5 年及以上 AIGC 图像 / 视频生成实操经验。\n- 熟悉至少一种 AI 视频或图像生成工具，具备实际生成经验。\n- 能理解分镜头脚本，具备基础镜头语言和画面审美。\n- 能根据剧本和分镜要求编写、优化提示词。\n- 具备人物一致性、场景连续性和动作合理性的判断能力。\n- 能接受反复修改，按项目节点稳定交付镜头素材。\n- 有 AI 短剧相关工作经验者优先择用。", "cat": "内容与创作"}, {"id": "289", "title": "音频剪辑师", "salary": "8-12k", "location": "", "jd": "### 岗位职责\n\n- 根据剧本、分镜头脚本和生成素材完成短剧剪辑。\n- 负责画面组接、节奏把控、转场、字幕、音效、配乐和基础包装。\n- 对生成素材进行筛选、修正和二次处理，提升成片观感。\n- 负责 AI 配音或真人配音素材的整理、对齐和音画同步。\n- 完成成片质检，检查字幕、音频、画面、节奏和穿帮问题。\n- 按发布要求输出不同平台所需的视频版本。\n\n### 招聘要求\n\n- 1 年及以上短视频 / 短剧剪辑相关工作经验。\n- 熟悉短视频或短剧剪辑流程，具备独立剪辑成片能力。\n- 掌握常用剪辑软件，能完成字幕、音效、配乐和基础包装。\n- 具备较好的节奏感、叙事理解能力和画面审美。\n- 能处理 AI 生成素材中的衔接、瑕疵和节奏问题。\n- 熟悉 AI 配音、音效或字幕工具者优先。\n- 有 AI 短剧相关工作经验者优先择用。", "cat": "内容与创作"}, {"id": "290", "title": "数据发布专员", "salary": "8-12k", "location": "", "jd": "### 岗位职责\n\n- 负责短剧内容在各平台的发布、排期和账号维护。\n- 完成标题、封面、简介、标签及评论区运营。\n- 跟踪播放量、点击率、完播率、互动率和涨粉等核心数据。\n- 定期整理数据并输出复盘，提出内容、剪辑和发布优化建议。\n- 收集用户评论和反馈，及时回流给剧本、生成和剪辑团队。\n- 负责发布素材、账号数据和运营文件的整理归档。\n\n### 招聘要求\n\n- 1 年及以上短视频账号运营、数据复盘相关工作经验。\n- 熟悉短视频平台发布流程和基本运营规则。\n- 具备标题、封面和内容包装能力，了解短剧用户偏好。\n- 能使用表格或数据分析工具整理和分析运营数据。\n- 具备较强的数据敏感度，能够发现播放和转化问题。\n- 有短视频、短剧、内容运营或账号运营经验优先。\n- 有 AI 短剧相关工作经验者优先择用。", "cat": "其他"}, {"id": "291", "title": "高级前端工程师（全栈能力）", "salary": "15-35k", "location": "", "jd": "简历筛选要点\n1. 计算机相关专业，5 年以上前端开发经验，有中大型 Web 项目开发经验。\n2. 熟悉 React / Vue3 / Next.js / Nuxt.js 等主流前端框架，至少深入掌握其中一种，并具备实际项目落地经验。\n3. 熟悉 PC / H5 响应式开发，能够处理不同屏幕尺寸、浏览器兼容性、移动端适配、交互体验和性能优化问题。\n4. 熟练掌握 TypeScript，具备良好的类型设计、组件抽象、模块拆分和代码组织能力。\n5. 具备前端架构设计能力，熟悉组件化、模块化、状态管理、数据流设计及复杂业务拆解。\n6. 有 SEO 友好项目开发经验，理解 SSR、SSG、CSR、Hydration 等渲染模式的适用场景，能够针对搜索引擎收录、页面加载速度和内容可访问性进行优化。\n7. 熟悉浏览器渲染机制，具备 Web Vitals、首屏加载、LCP、CLS、FID / INP 等性能优化经验\n8. 有 Monorepo 项目开发和维护经验，熟悉 pnpm workspace / Turborepo / Nx / Rush 等相关工具中的一种或多种。\n9. 熟悉前端工程化体系，了解 Vite / Webpack / Rollup 等构建工具，具备构建优化、依赖治理、代码分包和性能分析能力。\n10. 具备一定后端开发能力，熟悉 Node.js / Go / PHP 等任一后端技术栈，能够独立完成接口开发或配合后端进行联调。\n11. 具备良好的代码质量意识、技术文档能力和团队协作能力，能够推动技术方案落地并持续优化。\n详细岗位JD\n1.负责开发、测试、预发布和生产环境的建设、维护及权限管理，保证环境稳定、一致和可追溯。\n2.负责 Docker、Kubernetes、Nginx、CI/CD、配置中心、密钥、域名证书、CDN和对象存储等平台能力建设。\n2.建立并维护监控、日志、告警、链路追踪、备份恢复和容量管理机制。\n4.参与业务和技术方案评审，识别核心业务链路、外部依赖、数据迁移、发布顺序、资源需求和回滚风险。\n5.支持 Web、App 和后端服务的发布、联调、性能分析及线上问题排查。\n6.负责线上故障响应、问题定位、临时止损、数据恢复、故障复盘和改进闭环。\n7.落实账号权限、安全基线、漏洞修复、操作审计、灾备和应急响应要求。\n8.使用 AI Coding 工具辅助编写脚本、CI 配置、IaC、日志分析和运维文档，并对生产变更进行人工校验。\n9.沉淀部署规范、值班手册、故障预案和标准操作流程，提高团队交付效率。", "cat": "技术开发"}, {"id": "292", "title": "DevOps / 运维工程师", "salary": "10-20k", "location": "", "jd": "简历筛选要点\n3 年以上 Linux、云平台或 DevOps 相关经验，有生产环境部署、监控和故障处理经验。\n熟悉 Docker、Kubernetes、Nginx，能够搭建和维护 CI/CD 自动化发布流程。\n熟悉云服务器、DNS、SSL、CDN、对象存储、负载均衡、网络和权限配置。\n熟悉 Prometheus、Grafana、ELK、OpenSearch、Loki、Sentry 等监控和日志工具中的一种或多种。\n能够维护 MySQL、PostgreSQL、Redis、消息队列等基础服务，具备备份、恢复、容量规划和高可用经验。\n具备安全意识，理解最小权限、密钥管理、漏洞修复、操作审计、灾备和变更回滚。\n有实际全栈项目经验，至少完整参与或独立交付过一个包含前端、后端、数据库和部署链路的项目，能够阅读应用代码并排查跨端问题。\n能理解业务优先级、核心业务链路、发布窗口、数据风险和故障影响，能够参与需求评审并制定上线及回滚方案。\n熟悉 Codex、Cursor、Claude Code、GitHub Copilot 等 AI Coding 工具，能够使用 AI 编写脚本、CI 配置、IaC、日志分析和运维文档。\n不能只依赖 AI 生成内容，必须能够人工检查命令安全、权限边界、环境差异和生产风险。\n沟通清晰、响应及时，能够主动汇报进度、风险和故障处理情况。", "cat": "技术开发"}, {"id": "293", "title": "App 开发工程师", "salary": "15-30k", "location": "", "jd": "简历筛选要点：\n5 年以上 App 客户端开发经验，有至少一个正式上线并持续迭代的 iOS 或 Android 应用。\n必须熟悉 Flutter 。\n熟悉客户端生命周期、状态管理、网络请求、本地存储、权限、推送、Deep Link 和版本升级。\n掌握接口鉴权、错误处理、自动重试、弱网处理、离线缓存、数据同步、崩溃分析和性能优化。\n熟悉 App Store 或 Google Play 的打包、签名、审核、灰度发布和线上版本管理流程。\n具备组件化、模块化、自动化测试、CI/CD 和多环境配置经验。\n有实际全栈项目经验，至少完整参与或独立交付过一个包含 App、后端接口、数据库或 Web 管理端的项目，能够修改后端接口并完成联调。\n能理解业务目标、用户角色、权限、订单或账户状态、异常分支和验收流程，能够将业务流程转化为稳定的客户端交互。\n熟悉 Codex、Cursor、Claude Code、GitHub Copilot 等 AI Coding 工具，能够使用 AI 辅助编码、测试、接口联调、崩溃分析和文档编写。\n不能只依赖 AI 生成代码，必须能够人工判断代码质量、隐私安全、权限边界、兼容性和商店合规风险。\n能够与产品、设计、后端、测试和运维协作推进完整交付。\n详细岗位jd\n负责公司 iOS、Android App 的架构设计、核心功能开发、版本迭代和线上维护。\n参与业务需求评审，梳理用户角色、权限、数据状态、异常流程、交互规则和验收标准。\n负责登录、账户、内容、订单、支付、消息、推送、文件或媒体等客户端模块的设计与实现。\n负责接口鉴权、弱网处理、离线缓存、数据同步、崩溃治理、启动速度、包体积和运行性能优化。\n参与全栈项目开发，根据业务需要完成后端接口、数据模型或 Web 管理端功能。\n与后端、Web、测试和运维协作，完成接口联调、异常场景验证和端到端问题定位。\n负责打包签名、自动化构建、多环境配置、灰度发布、商店审核和版本回滚。\n使用 AI Coding 工具提高代码草案、测试用例、接口适配、问题定位和文档编写效率，并人工审核生成内容。\n对客户端体验、稳定性、数据安全、隐私合规和上线质量负责。", "cat": "技术开发"}, {"id": "294", "title": "中高级后端工程师", "salary": "15-30k", "location": "", "jd": "简历筛选要点：\n3 年以上后端开发经验，有独立负责完整项目、核心模块或中大型业务系统的经验。\n熟悉 Go 和 PHP 后端开发，至少深入掌握其中一种，另一种能够阅读、维护和参与开发。\n熟悉 RESTful API、接口鉴权、权限控制、参数校验、错误码、接口版本和文档规范。\n熟悉 MySQL或PostgreSQL、Redis、消息队列、对象存储、定时任务和日志监控等后端基础能力。\n有用户、权限、订单、支付、账户、运营配置、通知、文件或数据统计等业务模块经验。\n掌握事务、幂等、并发控制、缓存一致性、慢 SQL、限流、重试和异常补偿等常见问题。\n有实际全栈项目经验，至少完整参与或独立交付过一个包含 Web 或 App、后端服务和数据库的项目，能够阅读和修改前端代码并完成联调。\n能理解业务目标、业务对象、用户角色、权限、数据状态、核心流程、异常分支和验收标准。\n能够参与需求评审、技术方案、接口设计、数据库设计、开发、联调、测试、上线和复盘的完整流程。\n熟悉 Codex、Cursor、Claude Code、GitHub Copilot 等 AI Coding 工具，能够使用 AI 辅助编码、测试、SQL、接口文档和日志分析。\n不能只依赖 AI 生成代码，必须能够人工判断业务逻辑、事务一致性、权限边界、异常场景、安全和上线风险。\n详细岗位jd\n负责公司 Go、PHP 后端项目的设计、开发和持续迭代，包括业务系统、后台管理、接口服务、数据模型、权限和配置模块。\n参与需求评审，梳理业务对象、用户角色、权限、数据状态、主流程、异常流程和验收标准。\n根据业务需求完成技术方案、接口设计、数据库设计、任务拆解、工作量评估和开发计划。\n独立或协同完成用户、权限、订单、支付、账户、运营配置、通知、文件服务和数据统计等核心功能。\n负责事务与幂等、并发控制、缓存一致性、消息处理、定时任务、异常补偿和数据对账。\n参与全栈项目开发，能够阅读和修改 Web 或 App 代码，完成接口联调和端到端问题定位。\n负责代码评审、自动化测试、慢 SQL 和性能优化、日志监控、线上问题排查及发布支持。\n使用 AI Coding 工具提高代码草案、测试用例、SQL、接口文档和日志分析效率，并人工审核生成内容。\n沉淀开发规范、接口规范、通用模块、技术文档和项目复盘，提高团队交付质量。", "cat": "技术开发"}, {"id": "295", "title": "签证执行专员", "salary": "10 - 15K", "location": "在线上进行远程招聘。员工在合作一段时间后，可以申请到香港或者境外的办公点进行线下办公。", "jd": "一、岗位简介\n负责签证 / 移民事务的执行层支持，优先推进欧洲区域国家数字游民签证的实际办理进度，维护外部合作机构关系，为策略层提供底层整理与执行保障。本岗位仅提供整理与建议性支持，不代办申报、不代填官方表格。\n\n二、任职要求\n必须：有3年以上签证 / 移民相关工作经验，熟悉签证材料清单与申请流程\n必须：理解并严格遵守整理与建议 vs 代办申报的合规红线\n必须：有外部机构联络与跟进经验，能独立维护多方合作关系\n加分：有申根签证 / 欧洲签证实际操作经验\n加分：英文书面沟通能力\n\n三、岗位职责\n1.优先：推进欧洲区域数字游民签证的办理进度，独立跟进材料准备与外部机构沟通，充分利用现有合作机构体量落地执行\n2.机构管理：对接并维护外部持牌机构（移民律所 / 顾问机构）的联络清单与白名单，跟踪合作机构资质变化\n3.材料支持：整理签证 / 移民材料清单，跟踪案件关键节点与截止日期\n4.体系建设：协助移民策略专家建立标准路径库初始数据与材料清单模板体系\n5.建议支持：提供建议性信息支持，明确不代办申报、不代填官方政府表格的操作边界\n\n备注：\n1、面试时要求简单英文自我介绍\n2、该岗位招聘难度相对较高，在招聘触达阶段可以不告知我们所处行业的情况，减少留存难度，在后续的工作中面试官会铺垫告知所处行业的部分情况。", "cat": "职能与行政"}, {"id": "296", "title": "中高级人事专员 (台湾办公室岗位)", "salary": "45-55kTWD", "location": "台湾办公室岗位", "jd": "🌟招聘需求\n1.人資相關制度規章辦法、流程與表單等維護、修訂或新增建立\n2.新人教育訓練/離職人員勸退訪談/人事資料管理與維護處理人員加、退勞健保與團保\n3.人員出勤管理，輸入匯入每日出勤表，了解人員實際出勤狀況\n4.員工相關福利建置/員工關係維護\n5.活動規範籌備(例:尾牙、部門聚餐、跨部門團康活動)\n6.薪資計算及審核\n7.對外接洽勞保局、健保局等政府單位窗口業務\n8.協助主管製作各類表單，及提供人事行政作業流程\n\n🌟專業知識與技能\n熟悉勞動基準法、勞工保險條例、全民健康保險法等相關勞動法規\n具備勞健保加退保實務操作經驗\n具備薪資計算與審核實務經驗\n熟悉勞資會議召開流程及會議紀錄撰寫\n具備政府機關公文寫作能力（正式行政文書往來經驗）\n有勞動檢查應對或勞資爭議調解處理經驗者優先\n\n🌟學經歷\n大學以上學歷，人力資源、勞工關係、法律、企業管理相關科系尤佳\n至少2年以上人資相關工作經驗\n\n🌟工具能力\n熟悉 Excel（含公式應用，如薪資計算、出勤統計等）\n熟悉 Word、PowerPoint 等辦公軟體\n具備 AI 工具應用能力（如運用 ChatGPT、Claude 等 AI 工具協助公文撰寫、資料整理、流程優化等）者優先\n\n🌟其他條件\n1、積極態度、主動負責。\n2、邏輯清晰，善於溝通協調。\n3、細心、耐心、配合度高、穩定性高。\n4、抗壓性佳，能應對政府單位稽查等突發狀況。", "cat": "职能与行政"}, {"id": "297", "title": "中高级人事专员", "salary": "40000-45000台币", "location": "", "jd": "🌟招聘需求\n1.人資相關制度規章辦法、流程與表單等維護、修訂或新增建立\n2.新人教育訓練/離職人員勸退訪談/人事資料管理與維護處理人員加、退勞健保與團保\n3.人員出勤管理，輸入匯入每日出勤表，了解人員實際出勤狀況\n4.員工相關福利建置/員工關係維護\n5.活動規範籌備(例:尾牙、部門聚餐、跨部門團康活動)\n6.薪資計算及審核\n7.對外接洽勞保局、健保局等政府單位窗口業務\n8.協助主管製作各類表單，及提供人事行政作業流程\n\n\n🌟專業知識與技能\n熟悉勞動基準法、勞工保險條例、全民健康保險法等相關勞動法規\n具備勞健保加退保實務操作經驗\n具備薪資計算與審核實務經驗\n熟悉勞資會議召開流程及會議紀錄撰寫\n具備政府機關公文寫作能力（正式行政文書往來經驗）\n有勞動檢查應對或勞資爭議調解處理經驗者優先\n\n\n🌟學經歷\n大學以上學歷，人力資源、勞工關係、法律、企業管理相關科系尤佳\n至少2年以上人資相關工作經驗\n\n\n🌟工具能力\n熟悉 Excel（含公式應用，如薪資計算、出勤統計等）\n熟悉 Word、PowerPoint 等辦公軟體\n具備 AI 工具應用能力（如運用 ChatGPT、Claude 等 AI 工具協助公文撰寫、資料整理、流程優化等）者優先\n\n\n🌟其他條件\n1、積極態度、主動負責。\n2、邏輯清晰，善於溝通協調。\n3、細心、耐心、配合度高、穩定性高。\n4、抗壓性佳，能應對政府單位稽查等突發狀況。", "cat": "职能与行政"}, {"id": "298", "title": "中高级运营", "salary": "10-18k", "location": "", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。", "cat": "运营与市场"}, {"id": "299", "title": "编辑专员", "salary": "7K-10K", "location": "", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；黑料吃瓜等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "300", "title": "编辑专员", "salary": "7K-10K", "location": "", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；黑料吃瓜等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "301", "title": "舆情收集员", "salary": "10K-15K（优秀面议）", "location": "", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "302", "title": "中高级运营", "salary": "10k-18k", "location": "9、能接受远程办公，保证工作时间在线响应", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，熟练使用 Google GSC 站长平台|yandex站长平台，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。                                                                                                                                         9.懂社群运营，懂这些平台运营优先Telegram，Discord， X，WhatsApp。\n9、能接受远程办公，保证工作时间在线响应\n加分项：\n1、有成人向/泛娱乐/吃瓜类内容运营经验\n2、有矩阵账号批量运营经验\n3、熟悉Agent自动化发布流程以及各个平台多节API路径\"", "cat": "运营与市场"}, {"id": "303", "title": "主编", "salary": "10K-15K", "location": "", "jd": "岗位职责\n1. 负责平台热点内容的标题策划、正文撰写及内容包装；\n2. 根据热点事件快速输出具有点击力、传播力和讨论度的文案；\n3. 负责神评论、热评、互动评论及评论区趣味内容创作；\n4. 负责段子、网络梗、趣味表达及年轻化内容创作；\n5. 持续关注全网热点，挖掘适合平台用户的内容选题；\n6. 参与吃瓜原创关键词、网络热词、特色表达及内容标签的创作；\n7. 使用AI工具完成资料整理、信息提炼和初稿辅助，并进行人工深度创作；\n8. 根据内容点击率、阅读率及互动数据不断优化文案表达。\n\n任职要求\n1. 具备互联网内容、媒体、自媒体、新媒体或文案相关工作经验；\n2. 中文表达能力较强，能够独立完成标题、正文、评论及段子创作；\n3. 对娱乐热点、社会热点及网络流行文化敏感；\n4. 有较强的网感，熟悉年轻用户的语言习惯和内容偏好；\n5. 能够快速理解热点事件，并找到有吸引力的文案切入角度；\n6. 具备较强的原创意识，不依赖简单搬运和机械改写；\n7. 能熟练使用AI工具辅助创作，但具备独立思考和人工创意能力；\n8. 有爆款标题、爆款文章、热门评论或自媒体运营经验者优先。", "cat": "内容与创作"}, {"id": "304", "title": "编辑专员", "salary": "7K-10K", "location": "", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；针对、911爆料、91爆料、黑料吃瓜网等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "305", "title": "舆情收集员", "salary": "10K-15K（优秀面议）", "location": "", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "306", "title": "舆情收集员", "salary": "8K-15K（优秀面议）", "location": "", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "307", "title": "编辑专员", "salary": "7K-10K", "location": "", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；针对、911爆料、91爆料、黑料吃瓜网等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "308", "title": "Flutter 高级研发工程师 (AI 赋能/高能效方向)", "salary": "20k-30k", "location": "", "jd": "职责描述 \n高质量研发： 负责公司核心业务的 Flutter 客户端开发，构建高性能、高可维护性的跨平台应用，确保极致的用户体验。\n研发效能升级： 深度实践“AI 驱动开发 (AI-Driven Development)”，通过 AI 工具进行高效的代码生成、重构、单元测试编写及 Bug 快速定位。\n架构设计与优化： 针对复杂业务场景设计灵活的架构方案，解决性能瓶颈，确保代码在 AI 辅助生成的情况下依然保持严谨的逻辑和一致的规范。\n技术标准定义： 在团队内推广 AI 赋能开发的最佳实践（如高效的 Prompt 策略、AI 代码评审流程），帮助团队整体提升交付能效。\n端到端交付： 独立负责从需求分析、技术方案设计到最终上线全链路，利用 AI 工具缩短研发周期。\n\n 任职要求 \n【Flutter 核心能力】\n\n深度精通： 3 年以上 Flutter 实际项目经验，对 Dart 语言特性、Flutter 渲染机制、状态管理（如 Riverpod, Bloc, Provider）有深刻理解。\n底层能力： 具备优秀的原生开发能力（iOS/Android），能处理复杂的 MethodChannel 通信及底层性能调优。\n工程化能力： 精通 CI/CD 流程，有良好的代码规范意识，能够编写高质量的测试用例。\n【AI 赋能能力】（核心区分点）\n\n工具链专家： 熟练使用 Cursor, GitHub Copilot, ChatGPT, Claude 等 AI 开发工具，并能将其融入到日常的编码、调试、重构全流程中。\nPrompt 工程能力： 能够通过精准的指令引导 AI 生成高质量、可直接上线的生产级代码，而非简单的 Demo 代码。\nAI 审慎力： 具备极强的代码审查能力，能够快速识别 AI 生成代码中的潜在缺陷（如内存泄漏、逻辑漏洞），确保 AI 赋能不以牺牲质量为代价。\n【综合素质】\n\n极强的自驱动力： 对新技术有极高的好奇心，能够快速迭代自己的工作流。\n结果导向： 关注交付效率与最终质量，不迷信工具，但擅长利用工具。", "cat": "技术开发"}, {"id": "309", "title": "产品经理", "salary": "18-26k", "location": "", "jd": "一、岗位职责\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等工具，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4. 具备一定的团队管理经验，能够指导中初级产品成员开展工作，提升团队整体专业能力。\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n\n二、任职要求\n1. 本科及以上学历，产品、计算机、设计等相关专业优先。\n2. 5 年以上互联网/软件产品经理经验，至少具备 1 个从 0-1 独立负责并成功落地的项目经验。\n3. 熟练使用 Axure、墨刀、Figma 等原型工具，能独立完成 高保真交互原型设计，理解 UI/视觉基本规范及呈现逻辑。\n4. 具备 业务理解能力与数据分析能力，能够将业务需求转化为可实现的产品方案。\n5. 具备一定的 团队管理能力或带队经验，可以指导新人并进行工作拆解与质量把控。\n6. 具备良好的沟通能力、推动能力和跨部门协作能力，能够在多方需求中进行合理取舍与决策。\n7. 具备较强的文档能力，能够输出高质量的 PRD、交互文档、需求分析等。\n8. 抗压能力强，责任心强，具备较强的自驱力与主人翁意识。\n三、加分项\n1. 有大型互联网公司产品经验者优先。\n2. 有消费品、电商、社交、内容平台等行业经验者优先。\n3. 具备用户增长、商业化等方向项目经验更佳。\n4. 具备 UED/交互设计背景或视觉审美能力突出者优先。", "cat": "产品与管理"}, {"id": "310", "title": "SEO专员", "salary": "10-18k", "location": "", "jd": "一、岗位职责\n1、负责公司多个网站的 Google、Yandex SEO优化及日常维护，持续提升网站收录、关键词排名及自然搜索流量。\n2、负责网站日常SEO巡检及数据监控，通过 Google Search Console、GA4、Yandex Webmaster 等工具监控收录、排名、流量、Spider抓取及异常波动。\n3、负责网站基础及技术SEO优化，包括 TDK、H标签、Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL路由、分页、Tag、内链、结构化数据、HTML源码输出等。\n4、负责自然搜索流量下降、关键词排名下降、收录异常、404、异常URL、Spider抓取异常等问题的排查，并能够根据数据定位原因及提出解决方案。\n5、负责网站域名迁移、CDN域名、直连域名及多域名SEO相关工作，配合处理301重定向、域名规范、搜索引擎抓取、索引及流量承接等问题。\n6、根据SEO问题独立整理优化需求，与运营、产品、前端、后端及技术人员进行沟通，并负责测试服验收、正式服复查及上线后的数据验证。\n7、参与新站及网站重构项目SEO建设，制定和检查 URL、TDK、H标签、Sitemap、Robots、Tag体系、结构化数据及页面模板等基础SEO规范。\n8、负责关键词挖掘、竞争站分析、页面关键词优化及外链资源建设，持续扩大关键词覆盖及自然搜索流量。\n9、使用 ChatGPT、Claude、AI/SEO工具辅助数据分析、站点巡检、Spider模拟、异常URL筛选及需求整理，提高SEO工作效率。\n二、任职要求\n1、1年以上SEO实操经验优先，有独立负责网站SEO项目经验，有实际收录、关键词排名或自然搜索流量提升案例。\n2、熟悉 Google SEO基本机制，有 Yandex SEO实操经验优先。\n3、熟悉 GSC、GA4、Yandex Webmaster 等SEO及数据分析工具，能够独立完成基础数据分析。\n4、熟悉 Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL、Tag、结构化数据等技术SEO基础。\n5、能够看懂基础HTML源码及HTTP状态码，具备Spider抓取、页面状态及技术SEO问题的基本排查能力。\n6、具备一定前后端开发基础者优先，能够看懂基础 HTML、JavaScript 及常见前后端页面逻辑；理解服务端渲染、接口请求、URL路由、HTTP状态码及缓存等基础概念，能够初步判断SEO问题属于前端渲染、后端逻辑还是服务器/CDN配置问题。\n7、具备较好的数据分析及问题定位能力，面对流量、收录、排名异常时，能够从数据、页面、域名、抓取及技术实现多个维度进行排查。\n8、能够独立编写SEO需求文档，并与运营、产品及技术团队沟通推进开发、测试及上线验收。\n9、有多站点SEO、CDN、多域名管理、网站迁移、技术SEO经验者优先。\n10、有关键词挖掘、外链建设、Tag/聚合页及页面结构优化经验。", "cat": "运营与市场"}, {"id": "311", "title": "支持专员（兼职管理方向）", "salary": "8-10k", "location": "", "jd": "（优先海外），最好是东南亚地区最佳（电商客服不合适）\n中级客服（兼职管理方向）\n岗位要求：\n1、大专级本科以上学历，具备稳定的电脑、网络及办公环境。\n2、熟练使用 Excel、在线表格等办公工具，具备基础数据统计能力。\n3、工作认真细致，责任心强，能够保证数据准确性和信息保密。\n4、具备良好的沟通协调能力，能够与兼职人员及协作团队保持高效沟通。\n5、具备较强的执行力和问题跟进意识，能够及时发现并处理异常情况。\n6、能适应多任务并行处理，具备一定的时间管理能力。\n7、有客服、社群管理、运营、兼职管理或数据统计相关经验者优先。\n\n岗位职责：\n1、负责兼职人员考勤、人员状态、任务完成情况等日常数据统计与维护。\n2、汇总并输出日报、周报、月报及各类专项数据报表，确保数据准确、及时。\n3、跟进请假、缺勤、失联、任务异常等情况，完成登记、反馈及闭环跟踪。\n4、协助兼职人员招聘、试岗、培训及日常管理，跟进新人试岗情况。\n5、负责发布工作通知、任务提醒及会议纪要，保证信息传达准确、统一。\n6、配合业务需求完成各类临时数据统计、人员调整及项目支持工作。\n7、做好兼职团队账号、数据及内部信息管理，协助开展风险排查与权限维护。", "cat": "其他"}, {"id": "312", "title": "支持专员（商务对接方向）", "salary": "8-10k", "location": "", "jd": "岗位职责：\n1、负责商务服务相关日常工作对接，及时跟进需求并做好反馈。\n2、协助处理广告上下架、链接更换、广告检查、数据整理及表格维护等工作。\n3、跟进商务合作过程中的资料收集、信息核对及进度同步。\n4、协助整理日报、周报、工作汇总及相关业务台账。\n5、负责跨部门沟通协调，推动相关事项按时落地。\n6、对日常工作中出现的问题进行记录、反馈，并协助推动解决。\n7、负责无极线、蝴蝶线广告业务相关基础执行及巡检工作。\n\n岗位要求：\n1、本科及以上学历，专业不限，有相关工作经验优先。\n2、沟通表达能力较好，做事细致认真，有责任心。\n3、能熟练使用 Excel、Google Sheets 等办公工具，具备基础数据整理能力。\n4、具备较强执行力，能适应多线程工作安排。\n5、有商务支持、运营支持、广告对接、客服或数据整理相关经验者优先。\n6、能够接受日常表格维护、信息核对、沟通跟进及业务检查类工作。\n\n优先条件：\n1、有广告投放、商务对接、运营支持相关经验。\n2、有较强表格处理能力，能够高效完成数据整理与核对。\n3、工作主动性强，能及时发现问题并反馈。\n4、有团队协作意识，沟通顺畅，执行稳定。\n\n岗位核心能力：\n• 沟通协调能力\n• 表格与数据整理能力\n• 执行力与细节把控能力\n• 问题反馈与跟进能力\n• 多任务并行处理能力", "cat": "运营与市场"}, {"id": "313", "title": "AI 内容部主管", "salary": "28–35K", "location": "", "jd": "岗位职责\n1. 负责 AI 短剧内容方向与整体品质，统一画面风格、声音设计、剪辑节奏和角色表现，对部门交付及单剧商业结果负责。\n2. 统筹剧本、美术、视频生成、剪辑音频等专业团队，建立清晰的任务分工、协作流程和验收标准。\n3. 组织剧本与制作可行性评估，确定分镜职责归属，审核关键分镜，推动剧本、资产、分镜、镜头和切片测试五个质量关口落地。\n4. 组织首轮切片测试，根据留存、完播及转化等数据，决定项目继续、调整、暂停或终止。\n5. 管理部门产能、制作成本、算力使用和剧本储备，持续降低返工，提升合格产出与交付稳定性。\n6. 协同运营团队明确交付需求、验收与数据回流机制，将上线表现转化为下一轮选题和制作改进。\n7. 参与关键岗位招聘，培养专业组长及储备主管，推动优秀作品、工作流和资产沉淀为可复制的方法。\n任职要求\n1. 有影视、短剧、动画或相关内容制作经验，带领过 30 人以上制作团队；具备完整交付经验、能力突出的组长可作为晋升候选。\n2. 具备较强的内容判断力和审美，能判断故事是否成立、节奏是否有效、画面与声音是否服务剧情。\n3. 熟悉从剧本到成片的制作链路，能够识别 AI 制作约束，协调不同专业解决质量和交付问题。\n4. 具备数据与成本意识，能结合内容表现、制作投入和商业反馈作出项目取舍。\n5. 具备团队搭建、任务分配、人才培养和跨部门沟通能力，能够通过流程和标准组织团队交付。\n6. 接受 AI 工作流、标准化生产和数据考核，能够将个人经验沉淀为团队方法。\n**优先背景：**短剧制作负责人、执行导演、制片主任，以及具备完整制作与团队管理能力的专业组长。", "cat": "内容与创作"}, {"id": "314", "title": "AI 短剧编剧组组长", "salary": "20–30K", "location": "", "jd": "岗位职责\n1. 负责选题池、开发池和可生产剧本库的建设，统筹内部创作、外包撰写及版权采购，保障与制作计划匹配的剧本供给。\n2. 指导编剧完成故事主线、人物设定、分集结构、对白、钩子与断点设计，使剧本达到制作人员无需重新策划即可执行的程度。\n3. 组织剧本质量及合规审核，与视频生成团队开展制作可行性会审；剧本未锁定、审核未通过，不进入资产生产。\n4. 管理外包与采购剧本的需求、交付和审核，核心主线、核心人设及合规风险判断由内部掌握。\n5. 跟踪剧本采纳率、可生产储备、上线表现及续作潜力，根据观众反馈和播放数据持续优化内容。\n6. 带领编剧及审核人员开展评本、互评和复盘，沉淀创作模板、审核标准与《AI 制作约束清单》。\n7. 培养储备组长，推动团队形成稳定的内容判断和交付能力。\n任职要求\n1. 有短剧编剧、影视策划、网文编辑或相关内容经验，具备可展示的作品、编辑案例或项目成果。\n2. 能判断题材价值、剧情逻辑、人物动机、冲突与情绪节奏，能够给出具体、可执行的修改意见。\n3. 理解短剧的开场吸引力、爽点、钩子及分集断点，能够兼顾内容效果与制作可行性。\n4. 具备带领编剧和审核人员协同工作的能力，能够指导他人产出、建立标准并培养人才。\n5. 接受 AI 辅助创作，能结合 AI 制作特点调整剧本表达，减少下游理解偏差和返工。\n6. 具备版权与内容合规意识，能够按公司标准组织审核；接受以采纳率、上线表现和储备质量衡量工作成果。\n**优先背景：**短剧编剧总监、网文平台主编、影视策划负责人或具备带队能力的资深编辑。", "cat": "内容与创作"}, {"id": "315", "title": "AI 内容美术组组长", "salary": "18–25K", "location": "", "jd": "岗位职责\n1. 根据导演确定的内容调性，统筹角色、场景、道具及视觉风格设计，保障跨镜头、跨剧集的视觉一致性。\n2. 组织核心角色和主要场景的设计、评审与锁定；关键资产未确认，不进入大规模生产。\n3. 制定并落实角色设定、三视图、参考图及资产规格，明确资产编号、版本和复用关系。\n4. 对接视频生成团队，将美术资产转化为可稳定使用的制作素材，及时解决角色漂移、场景不一致及素材不适配等问题。\n5. 配合导演和生成团队完成分镜所需的视觉支持；分镜具体归属由导演按项目确定。\n6. 建设部门共享资产库，沉淀优质角色、场景、风格及相关参数，提升复用率并按要求回流。\n7. 安排组员任务、审核美术交付、组织带教与复盘，培养储备组长。\n任职要求\n1. 有动画、游戏、影视或相关视觉设计经验，具备角色、场景或视觉设定作品及团队协作经验。\n2. 具备扎实的审美和设计判断力，能够把握角色特征、构图、色彩、风格及画面一致性。\n3. 熟悉或能够熟练适应 AI 图像制作流程，能将传统设计能力转化为可供 AI 视频生产使用的资产。\n4. 理解角色一致性、素材规格、版本管理及资产复用要求，具备建立资产规范的能力。\n5. 能与导演、编剧和生成团队有效沟通，将内容需求转化为明确、可执行的美术任务。\n6. 具备任务分配、质量把关和带教能力，接受标准化工作流及数据考核。\n**优先背景：**动画或游戏美术组长、角色设计负责人，以及具备 AI 工作流和带队经验的视觉设计骨干。", "cat": "内容与创作"}, {"id": "316", "title": "AI 短剧剪辑组组长", "salary": "18–25K", "location": "", "jd": "岗位职责\n1. 负责短剧剪辑、声音设计及后期交付，与导演对齐剪辑调性，保障剧情清楚、节奏顺畅、情绪表达准确。\n2. 统筹剪辑、配音配乐、音效、字幕及成片输出，推动音频工作纳入统一后期流程。\n3. 承担成片质检职责，按故事线、画面、语言、转场、配音、一致性六个维度组织验收，确保综合评分达到公司标准。\n4. 检查并推动清除成片硬性错误，对其他质量问题形成明确处理结论；核对封面、命名、分辨率、码率等交付要求。\n5. 严格执行素材准入要求，发现不合格镜头及时退回生成环节，避免依靠后期反复补救前端质量问题。\n6. 建立剪辑样板、成片检查清单及交叉复核机制，跟踪一次通过率、返工次数和交付周期。\n7. 负责组员任务安排、音频与剪辑带教，培养储备组长，并将上线反馈用于节奏和后期表现优化。\n任职要求\n1. 有短视频、短剧或影视后期经验，具备可展示的剪辑作品、审片案例或项目交付成果。\n2. 具备较强的叙事和节奏判断力，能够识别剧情衔接、信息重复、情绪断裂及声音表现等问题。\n3. 熟悉剪辑、配音配乐、字幕及视频输出流程，能够独立完成成片交付并指导组员。\n4. 具备成片质量判断能力，能够依据统一标准评分，并给出具体问题、退回理由和修改建议。\n5. 理解 AI 视频常见质量问题，能够区分应由前端重新生成的问题与可在后期合理修正的问题。\n6. 具备流程建设、任务统筹和带教能力，接受 AI 工具、标准化制作及数据考核。\n**优先背景：**短剧后期负责人、剪辑主管，或具备审片、质检及带教能力的资深剪辑师。", "cat": "内容与创作"}, {"id": "317", "title": "（新媒体）运营专员", "salary": "8-15k", "location": "8、能接受远程办公，保证工作时间在线响应", "jd": "岗位职责：\n1、负责海外社交媒体平台（X、Instagram、Facebook、TikTok、YouTube等）的账号矩阵搭建与日常运营维护\n2、负责多平台内容制作、编辑与发布，包括图文、短视频等内容形式，保持稳定的更新频率\n3、根据平台特性制定差异化内容策略，结合热点进行内容策划与执行，提升账号流量与互动\n4、跟踪并分析各平台运营数据（播放量、互动率、粉丝增长等），输出数据复盘与优化建议\n5、负责账号环境维护与安全管理，包括多账号隔离、养号、风控应对等\n6、配合团队完成跨平台活动策划与执行，推动用户增长与品牌曝光\n7、按要求完成日报、周报等数据汇报，及时反馈运营问题与解决方案\n任职要求：\n1、2年以上社交媒体运营经验，有海外平台（X、Instagram、TikTok、Facebook、YouTube）实操经验者优先\n2、熟悉海外主流社媒平台的算法机制、内容推荐逻辑和运营规则\n3、具备短视频剪辑能力，熟练使用剪映、PR、AE等至少一种剪辑工具\n4、具备基础数据分析能力，能根据数据反馈调整内容方向和发布策略\n5、有AI工具使用经验者优先（如ChatGPT、AI文案生成、自动发布工具、热点采集工具等）\n6、执行力强，能适应高频次内容产出节奏，保证日均发布量\n7、具备多账号并行运营能力，了解指纹浏览器、环境隔离等基础概念者优先\n8、能接受远程办公，保证工作时间在线响应\n加分项：\n1、有成人向/泛娱乐/吃瓜类内容运营经验\n2、有从0到1账号孵化或起号经验\n3、有矩阵账号批量运营经验\n4、熟悉Agent自动化发布流程以及各个平台多节API路径", "cat": "运营与市场"}, {"id": "318", "title": "中高级产品运营", "salary": "10-25k", "location": "", "jd": "任职要求：\n1. 3年以上To C产品运营/内容运营经验，有内容平台或流媒体经验优先；\n2. 具备完整项目经验，能够主导负责项目全流程作业；\n3. 熟悉内容平台核心指标及增长逻辑，对用户行为与内容消费路径有深入理解；\n4. 具备扎实的数据分析能力，能够通过数据驱动运营决策与策略调整；\n5. 具备良好的产研跨部门协作能力；\n6. 对二次元、动漫内容有理解，有相关项目经验优先；\n7. 具备较强的执行力与抗压能力，适应快节奏业务环境；\n\n岗位职责：\n1. 负责二次元视频流媒体APP的运营策略制定，围绕内容分发效率、用户增长及会员转化优化；\n2. 制定并可持续迭代内容推荐、活动运营及用户运营策略；\n3. 以核心身份参与To C项目运营；\n4. 具备深度分析内容表现与用户行为路径的能力；\n5. 协同产品与技术团队，可不断提升产品整体价值；\n6. 搭建并完善数据指标体系，对核心指标（DAU、留存率、转化率等）进行持续监控与迭代优化；\n7. 结合二次元内容特性（番剧、IP、角色、社区文化等），设计差异化运营策略与用户增长路径；\n8. 沉淀可复用的运营策略方法论，协助团队提升效率；\n9. 能及时抓取国内热门次元IP并可利用该IP生成一系列活动", "cat": "运营与市场"}, {"id": "319", "title": "中高级产品运营（加急）", "salary": "10-25k", "location": "", "jd": "任职要求：\n1. 有3-5年成人行业工作经历\n2. 有完整参与或主导内容项目/产品从0到1或增长阶段的经验\n3. 具备较强的数据分析能力（能独立拆解问题并提出策略）\n4. 熟悉内容生产流程，具备内容判断与筛选能力\n5. 执行力强，能推动事情落地，沟通能力强，能跨团队协作，抗压能力强，适应快节奏环境\n\n岗位职责：\n1. 负责产品从0到1的运营搭建，制定产品增长策略及冷启动方案，推动DAU/新增/留存等核心指标达成\n2. 负责产品增长与变现，围绕用户增长（拉新）+内容留存+付费转化，推动内容体系持续优化与规模化产出。\n3. 承接整体运营策略，围绕拉新、留存、转化、变现等核心指标推进落地\n4. 日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略\n5. 内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，活动策划等\n6. 跨部门协作：与产品、技术、渠道等团队协同。推动产品相关功能优化与产品迭代", "cat": "运营与市场"}, {"id": "320", "title": "AI内容编辑（加急）", "salary": "10K – 20K", "location": "", "jd": "AI内容编辑（创作 / 漫改 / 魔改方向）\n\n岗位方向\n\n我们正在组建AI驱动的动漫、漫画内容团队。\n\n\n\n剧本内容由专门的剧本团队负责，本岗位主要负责将已有的剧本、分镜及内容创意，通过AI工具转化为动漫、漫画、短视频等视觉内容。\n\n\n\n我们不要求候选人一开始就具备非常完整的AI技术栈，更关注实际内容制作能力、基础视觉审美，以及对新工具、新工作流的学习和落地能力。\n\n\n\n有动漫、漫画、短视频、设计、AI创作等相关经验者优先考虑，其他类型经验如具备相关作品或较强学习能力，也可以投递。\n\n简历及作品要求\n\n投递时请提供简历及相关作品。\n\n\n\n作品形式不限，可以是：\n\n\n\nAI漫画、AI图片、AI短片；\n\n角色设计、场景设计；\n\n个人练习作品；\n\n商业项目或团队项目作品。\n\n\n\n不强制要求作品必须为独立完成，只要能够体现个人实际制作能力即可。\n\n\n\n如有以下内容，也欢迎一并提供：\n\n\n\nAI内容制作过程或工作流截图；\n\nComfyUI、Stable Diffusion等工具使用案例；\n\n个人运营的新媒体账号及相关作品数据。\n\n岗位职责\n\n根据剧本团队提供的脚本、分镜或内容需求，完成AI动漫、AI漫画、AI短视频等内容制作。\n\n\n\n使用AI绘图、AI视频等工具完成人物、场景及画面的生成、调整和优化，保证整体视觉效果符合项目要求。\n\n\n\n配合团队优化角色一致性、画面风格及内容呈现效果，提高内容制作效率。\n\n\n\n根据项目需要，对已有AI工作流进行使用、调整和优化。\n\n\n\n参与内容选题、IP方向及视觉风格讨论，从画面呈现及用户审美角度提供建议。\n\n\n\n持续关注AI绘图、AI视频领域的新模型、新工具及新玩法，并尝试应用到实际内容生产中。\n\n\n\n与剧本、运营及相关团队协作，根据反馈持续调整和优化内容。\n\n任职要求\n\n有AI绘图、AI视频、设计、动漫制作或其他相关内容创作实践经验，能够提供相关作品。\n\n\n\n使用过一种或多种主流AI创作工具，例如ComfyUI、Stable Diffusion、Midjourney、即梦、Kling、Vidu、Runway等。\n\n\n\n具备基本的图片或视频生成、调整能力，能够根据需求修改提示词、参数或现有工作流。\n\n\n\n对画面效果有基本判断能力，能够关注人物、构图、风格统一及内容呈现。\n\n\n\n学习能力较强，愿意主动学习新的AI模型、插件及内容制作方法。\n\n\n\n具备良好的沟通和协作能力，能够根据项目反馈及时调整作品。\n\n加分项\n\n有ComfyUI工作流搭建或优化经验。\n\n\n\n了解或使用过LoRA、ControlNet、IPAdapter等工具。\n\n\n\n有AI动漫短剧、AI漫画、条漫、漫改或小说改编项目经验。\n\n\n\n有角色一致性、批量出图、AI视频动态化等实际制作经验。\n\n\n\n会使用AE、Live2D、Blender、Nomad等设计或动画工具。\n\n\n\n有Python、自动化或批量内容处理经验。\n\n\n\n对动漫、漫画、二次元内容感兴趣，具备一定的视觉审美和内容判断能力。\n\n\n\n有二次元、新媒体、动漫账号运营经验，或对动漫、漫画、轻小说等内容趋势较为熟悉。", "cat": "内容与创作"}, {"id": "321", "title": "新媒体运营", "salary": "6k-10k", "location": "", "jd": "\"必须项\n简历➕运营数据或者案例\n运营过的账号案例\n 爆款内容链接\n 常用社媒平台ID（可选）\n 最喜欢的动漫/作品（加分项）\n 2年以上新媒体运营经验，有团队管理经验优先；\n 重度二次元用户，熟悉动漫、游戏、VTuber、Cosplay、同人文化等；\n 网感强，懂年轻人表达方式和互联网语境；\n 熟悉国内外主流社媒平台运营逻辑；\n 有成功账号运营案例或爆款内容经验；\n 具备优秀的内容策划与文案能力。\n加分项\n\n 有ACG、自媒体、动漫行业经验；\n 熟悉海外二次元社区文化；\n 有AIGC内容工具使用经验；\n 自己运营过账号；\n 懂梗、会玩梗、熟悉互联网亚文化。\"\n\"岗位职责\n\n 内容运营\n\n 负责公司二次元/动漫相关新媒体账号运营；\n 策划并输出符合年轻用户审美的内容，包括但不限于：\n\n   动漫热点\n   二创内容\n   meme梗图\n   角色向内容\n   圈层热点话题\n 根据不同平台特性制定内容策略，提升曝光、互动与粉丝增长；\n 独立完成热点策划与内容传播。\n\n\n\n 平台运营\n\n负责国内外社媒平台的内容运营与账号增长，包括但不限于：\n\n 国内平台\n\n B站\n 微博\n 小红书\n 抖音\n 微信公众号\n LOFTER\n\n 海外平台\n\n X（Twitter）\n TikTok\n Instagram\n YouTube\n Discord\n Reddit\n\n\n\n 用户与社区运营\n\n 深度理解二次元用户生态与圈层文化；\n 维护社区氛围，提高用户活跃度与粘性；\n 快速追踪ACG热点与用户情绪变化；\n 与UP主、Coser、绘师、KOL等建立合作关系。\"", "cat": "运营与市场"}, {"id": "322", "title": "AI动漫短剧编剧", "salary": "10k-25k", "location": "", "jd": "AI动漫短剧编剧（小说改编方向）\n\n岗位介绍\n\n本岗位主要负责公司AI动漫短剧项目的剧本创作与小说改编工作。\n\n\n\n公司会提供已有小说、网文内容及基础项目方向，无需自行寻找内容来源。你需要结合AI动漫短剧的内容形式，对原有小说进行故事拆解、人物关系梳理、剧情取舍、节奏调整、结构重组及分集改编，最终输出具备实际制作可行性的短剧剧本。\n\n\n\n岗位核心工作以小说/网文改编为主，需要将篇幅较长、信息量较大的原著内容，转化为节奏更快、冲突更集中、画面表达更明确的AI动漫短剧内容。\n\n\n\n我们不要求候选人必须拥有成熟的AI动漫项目经验，更关注你的故事理解能力、剧情改编能力、短剧节奏感及持续学习能力。\n\n\n\n有短剧、网文、小说、漫画脚本、动漫剧情、影视、剧情短视频、游戏剧情等相关创作经验均可。\n\n岗位职责\n\n阅读并理解公司提供的小说、网文内容，快速梳理主要人物、人物关系、故事主线、核心冲突及内容卖点。\n\n\n\n根据AI动漫短剧的内容形式，对原小说进行剧情取舍、结构调整、节奏优化及适当重构。\n\n\n\n结合项目篇幅，对原著中的支线剧情、人物及事件进行合理删减、合并、前置或调整，使核心剧情更加集中。\n\n\n\n完成故事梗概、人物小传、分集大纲及完整分集剧本创作。\n\n\n\n将小说中的叙述、心理活动、背景介绍等文字内容，转化为具体的场景、人物动作、对白及可视化剧情表达。\n\n\n\n结合不同题材及目标受众，设计具有吸引力的开篇、冲突、爽点、情绪节点、反转、悬念及结尾钩子。\n\n\n\n在保证原故事核心设定和人物逻辑的基础上，对不适合短剧表达的内容进行合理改编。\n\n\n\n配合项目负责人，根据审核及制作反馈，对剧本内容进行修改和优化。\n\n\n\n逐步了解AI动漫制作的基本特点，在创作过程中兼顾人物数量、场景复杂度、动作设计及画面实现难度。\n\n\n\n与项目、制作等团队保持沟通，按计划同步创作进度及可能影响交付的问题。\n\n任职要求\n\n有编剧、网文创作、小说创作、漫画脚本、动漫剧情、短剧、剧情短视频、影视策划、游戏剧情等相关创作经验。\n\n\n\n具备较好的小说阅读和故事理解能力，能够快速提炼人物关系、核心矛盾及剧情重点。\n\n\n\n具备一定的内容改编能力，能够根据短剧篇幅对原小说进行删减、调整、压缩及结构重组。\n\n\n\n对短剧、网文、动漫、漫画等内容形式有一定了解，能够理解快节奏、强冲突、高情绪密度的内容表达方式。\n\n\n\n能够将文字剧情转化为具体场景、人物行为及对白，使剧本具备较好的画面感和制作可执行性。\n\n\n\n具备基本的剧情连续性和人物逻辑判断能力，能够保证改编后故事完整、人物行为合理。\n\n\n\n能够按照项目要求完成创作，并根据审核意见进行合理修改。\n\n\n\n具备良好的沟通、协作及时间管理能力。\n\n\n\n对AI动漫、AI短剧等新内容形式感兴趣，并愿意学习相关制作逻辑。\n\n加分项\n\n有短剧、动态漫、AI动漫或漫画项目经验。\n\n\n\n有小说、网文或成熟IP改编经验。\n\n\n\n有已上线、已制作或能够展示的完整编剧作品。\n\n\n\n擅长长篇小说的剧情压缩、短篇化改编及结构重组。\n\n\n\n熟悉男频逆袭、玄幻、都市、悬疑、复仇、冒险、热血等强情节题材。\n\n\n\n熟悉女频情感、甜宠、家庭、豪门、成长、虐恋等强情绪题材。\n\n\n\n有系列化剧情开发或连续人物塑造经验。\n\n\n\n具备较强的网感，对当前短剧、网文及动漫内容趋势有一定敏感度。\n\n\n\n了解AI图片、AI视频或AI动漫制作流程及基本能力边界。\n\n项目形式\n\n项目以小说、网文改编为主要内容方向，根据原著内容及项目需求进行AI动漫短剧化改编。\n\n\n\n单部短剧原则上约 8集，单集约 3–5分钟。\n\n\n\n具体集数、篇幅及内容结构可根据原著体量、剧情复杂度及实际制作要求进行调整。\n\n\n\n前期以熟悉项目标准及创作流程为主，稳定期月度完成约2部完整短剧，具体根据项目难度及团队排期安排。\n\n\n\n最终剧本需具备较完整的剧情结构、人物逻辑及画面表达，能够支持后续AI动漫制作环节推进。", "cat": "内容与创作"}, {"id": "323", "title": "渠道扩展专员", "salary": "18k-20k", "location": "", "jd": "任职要求：\n1：2-3年的渠道扩展经验，硬性条件：必须有播放器，直播，BC，炮台相关行业的投放经验\n2：具备从0-1的扩展能力， 能单独完成，找站，商务洽谈，数据分析，数据优化\n3：熟悉各种广告合作模式，专业术语，懂互联网营销优先\n4：需要级强的执行力与抗压能力，适应快节奏业务环境；\n\n岗位职责：\n1：针对公司缺量的产品进行寻找站点，进行投放。\n2：针对自己的数据进行分析，寻找可优化的方面进行优化调整\n3：配合团队处理其他方面事项", "cat": "运营与市场"}, {"id": "324", "title": "网站运营", "salary": "8k - 20k", "location": "", "jd": "网站运营\n\n岗位职责\n\n网站整体运营与增长\n\n负责网站日常运营及整体运营策略落地，围绕新增、活跃、留存、转化、付费及营收等核心指标制定并执行运营方案。\n\n参与网站从 0 到 1 的运营搭建，包括用户体系、内容体系、活动体系及运营流程建设，推动网站持续增长。\n\n根据业务发展阶段制定冷启动、用户增长及规模化运营策略，持续提升网站整体流量及用户规模。\n\n内容运营与用户留存\n\n负责网站内容体系的规划、运营及优化，根据用户需求和数据表现持续调整内容方向。\n\n优化网站首页、频道页、详情页、推荐位等核心页面的内容结构与展示逻辑，提升点击率、浏览深度、停留时长及用户留存。\n\n参与内容选题、专题策划、活动策划及内容分发，提升内容产出效率和内容对用户增长、留存及转化的贡献。\n\n建立内容运营标准及内容质量评估机制，持续提升网站内容质量和用户体验。\n\nSEO及流量增长\n\n负责网站 SEO 运营，包括关键词布局、页面结构、站内链接、专题页、内容优化及搜索流量增长等。\n\n分析自然搜索、社媒、外部渠道等不同流量来源，持续优化流量获取及分发策略。\n\n关注行业及竞品网站运营情况，挖掘新的流量增长机会，提升网站整体曝光及自然流量。\n\n数据分析与运营优化\n\n日常跟踪网站核心数据，包括 UV、PV、注册、DAU、留存、访问深度、跳出率、转化率、付费率及营收等。\n\n基于数据分析用户访问及转化路径，定位流量、内容、产品及转化环节中的问题，并提出可执行的优化方案。\n\n建立并持续完善网站运营数据指标体系，通过数据驱动内容、活动、页面及用户运营策略迭代。\n\n根据数据反馈持续进行 A/B Test 及运营策略调整，提升网站整体运营效率。\n\n用户增长与转化\n\n围绕“流量获取—用户注册—内容消费—用户留存—付费转化”完整链路进行运营优化。\n\n负责会员、付费内容、订阅、活动及其他商业化场景的运营，持续提升用户转化率及用户价值。\n\n针对不同用户生命周期制定差异化运营策略，提升用户活跃度、留存率及复购/续费率。\n\n活动及专题运营\n\n根据业务目标策划线上活动、专题活动、节日活动及用户增长活动，负责活动从策划、执行到复盘的完整流程。\n\n通过活动、专题及内容运营提升网站流量、用户活跃度、用户留存及付费转化。\n\n跨部门协作\n\n与产品、技术、设计、内容、渠道及商务等团队协同，推动网站功能、页面、内容及运营工具持续优化。\n\n能够独立梳理运营需求并推动产品、技术落地，持续改善网站用户体验及运营效率。\n\n定期复盘运营结果，沉淀可复制的网站运营方法论。\n\n任职要求\n\n2-5 年网站运营、互联网产品运营或内容运营相关工作经验，有网站/平台型产品运营经验优先。\n\n有完整参与或主导网站/互联网产品从 0 到 1 搭建、冷启动或增长阶段的经验，能够独立制定并执行运营策略。\n\n熟悉网站运营完整链路，对用户增长、内容运营、用户留存、转化及商业化有较深入理解。\n\n具备较强的数据分析能力，熟悉 Google Analytics、Search Console、数据报表等常用分析工具，能够通过数据独立拆解问题并提出优化方案。\n\n熟悉 SEO、网站流量增长、内容运营及用户运营，有成功的网站流量增长或用户增长案例优先。\n\n具备较强的内容判断能力，能够根据用户需求、行业趋势及数据表现制定内容方向和运营策略。\n\n具备较强的项目推进能力，能够协调产品、技术、设计、内容等多个团队推动项目落地。\n\n执行力强，责任心强，具备较好的沟通及协作能力，能够适应快节奏、高强度的互联网运营环境。\n\n有成人行业、泛娱乐、内容社区、视频/图片平台或海外互联网产品运营经验优先。\n\n有网站从 0 到 1 搭建、SEO 流量增长、会员/付费产品运营或海外网站运营经验者优先。", "cat": "运营与市场"}, {"id": "325", "title": "AI内容负责人（加急）", "salary": "15-25k", "location": "", "jd": "岗位职责\n\n统筹内容生产全流程\n负责从剧本策划、分镜设计、美术与素材、AI生成、剪辑制作到成片交付及首轮数据验证的完整生产闭环，对内容最终质量负责。\n\n建立统一的内容标准\n制定并持续优化团队的内容调性与制作标准，包括画面风格、镜头语言、声音设计、剪辑节奏等，推动剧本、美术、生成、剪辑等团队形成统一的内容判断标准。\n\n负责项目统筹与资源调配\n根据剧本体量、场次、镜头难度及项目节点，合理进行人员配置、任务拆分与资源调度，确保项目按计划、高质量完成。\n\n建立“测试—验证—放量”机制\n在整部内容批量生产前，推动核心片段或切片进行小规模测试，根据点击、完播、留存、付费转化等数据判断项目方向，及时做出继续、调整或终止的决策，控制无效产能与制作成本。\n\n对内容及商业结果负责\n结合项目数据持续优化内容方向，对单剧的内容表现、商业结果及投入产出负责；同时关注团队整体产能、单分钟制作成本、项目交付周期及剧本储备等核心经营指标。\n\n提升团队生产效率\n优化内容生产流程与协作机制，持续降低沟通成本和返工率，提升团队整体产能与交付质量。\n\n搭建人才梯队与方法论\n培养组长及核心骨干，建立人才梯队；将成熟的生产流程、制作标准和优秀案例沉淀为可复制的方法论，提升团队规模化生产能力。\n\n任职要求\n\n具备 20人以上内容、影视或短视频制作团队管理经验，有完整项目统筹及团队管理经验；\n\n对内容质量、市场趋势及用户反馈具备较强判断力，能够基于数据和项目实际情况做出明确的内容决策；\n\n熟悉内容生产流程，能够理解并平衡内容质量、制作周期、团队产能与成本；\n\n具备较强的项目管理和资源协调能力，能够推动多团队、多环节协同完成项目；\n\n有较强的经营意识，能够关注内容产出背后的成本、效率及商业结果，而不仅局限于内容制作本身；\n\n具备较强的团队管理和人才培养能力，能够搭建并持续优化内容生产团队；\n\n背景不限，可来自影视制作、短剧、短视频、内容平台或成熟内容团队，如执行导演、制片负责人、制作负责人、内容负责人等；\n\n对 AI短剧 / AI视频规模化生产模式有兴趣，并愿意探索AI对内容生产效率的提升。\n\n加分项\n\n有 AI短剧、AI漫剧、AI视频等相关项目经验；\n\n有从 0到1搭建内容团队或生产体系的经验；\n\n有完整负责过短剧、短视频或影视项目，并对项目最终商业结果负责；\n\n有通过数据测试进行内容筛选、项目调整或资源止损的实际经验；", "cat": "内容与创作"}, {"id": "326", "title": "AI 视频⽣成组⻓（加急）", "salary": "15-25k", "location": "", "jd": "岗位职责\n负责 AI 视频⽣成团队管理\n带领 8–10 ⼈的 AI 视频⽣成⼩组，根据项⽬排期、剧本场次及镜头难度合理拆分任务、分配\n⼈员，确保项⽬按计划完成。\n负责⽣成产能与交付质量\n建⽴并持续优化⼩组的产能标准，关注合格镜头率、⼀次通过率、返⼯率、单位算⼒产出及\n交付周期等核⼼指标，持续提升团队⽣产效率。\n负责镜头⽣成与质量把控\n根据分镜及制作要求，对镜头难度进⾏分级并制定对应的⽣成⽅案；重点把控⼈物⼀致性、\n动作⾃然度、场景稳定性、画⾯逻辑及镜头表现，确保最终⽣成效果符合项⽬要求。\n参与项⽬制作可⾏性评估\n在项⽬⽴项及分镜锁定阶段，与内容、剧本等团队共同进⾏制作可⾏性评估，提前识别 AI ⽣\n成难度较⾼、成本较⾼或存在较⼤不确定性的镜头，并提出调整⽅案。\n建⽴ AI ⽣成标准与规范\n根据实际⽣产经验，沉淀不同类型镜头的⽣成⽅法、提示词、模型组合、参数及常⻅问题解\n决⽅案，建⽴并持续更新《AI 制作约束清单》和⽣成 SOP。\n优化⼯具与⽣产流程\n持续关注 AI 视频、图像⽣成⼯具及模型能⼒变化，结合项⽬实际情况优化模型组合、⼯作\n流和⽣产⽅式，提升团队整体⽣成效率与成⽚稳定性。\n培养团队与储备组⻓\n负责组内⼈员能⼒培养和经验传承，建⽴新⼈培训及技能分级机制，培养核⼼⻣⼲及储备组\n⻓，保证团队持续稳定交付。\n任职要求\n2 年以上 AI 视频⽣成或相关内容制作经验，熟悉从分镜理解、素材准备到 AI ⽣成、筛选、\n修改及成⽚交付的完整流程；\n有 5–10 ⼈以上团队管理或项⽬带队经验，能够根据⼈员能⼒、镜头难度及项⽬进度合理分\n配⽣产任务；\n对镜头难度及 AI ⽣成可⾏性有较强判断能⼒，能够提前识别⾼难度镜头并制定对应解决⽅\n案；\n熟悉⼈物⼀致性、动作控制、场景稳定、镜头运动等 AI 视频⽣成中的常⻅问题及解决⽅式；\n具备较强的质量意识和结果意识，能够以合格成⽚分钟数、⼀次通过率、返⼯率、⽣产效率\n等指标管理团队；\n能够适应短周期、⾼产量的批量内容⽣产环境，并持续优化⽣产效率；\n具备较强的问题解决和团队协作能⼒，能够与内容、剧本、美术、剪辑等团队⾼效配合。\n加分项\n熟悉主流 AI 视频 / AI 图像⽣成⼯具及模型，能够根据不同镜头需求选择合适的⼯具和模型\n组合；\n有 AI 短剧、AI 漫剧、短视频或其他批量化内容⽣产经验；\n有从 0 到 1 搭建 AI 视频⽣成⼯作流、SOP 或团队⽣产体系的经验；\n有较强的提示词优化、⼯作流搭建或 AI ⼯具测试能⼒；\n有成熟的镜头难度分级、产能测算或成本控制经验；\n有组⻓、主管或 AI 视频⽣成项⽬负责⼈经验。", "cat": "内容与创作"}, {"id": "327", "title": "AI 内容镜头审核", "salary": "15-20k", "location": "", "jd": "岗位职责\n负责⽣成镜头质量审核\n对 AI ⽣成镜头进⾏逐镜审核，按照统⼀的 A / B / C 质量标准进⾏分级，确保镜头在画⾯、\n⼈物、动作、场景及镜头表现等⽅⾯达到对应要求。\n负责剪辑前质量卡点\n作为 AI ⽣成与后期剪辑之间的质量闸⻔，严格控制进⼊剪辑素材库的镜头质量。C 级镜头\n不得进⼊剪辑环节，避免依赖后期剪辑强⾏修复低质量素材。\n识别并记录镜头问题\n及时发现⼈物变形、⼈物不⼀致、动作异常、场景漂移、画⾯穿帮、镜头逻辑不合理、画质\n异常等问题，并准确标记问题类型及具体位置。\n控制漏检与下游返⼯\n关注镜头漏检率、审核准确率及因素材质量问题导致的下游返⼯率，确保进⼊剪辑环节的素\n材符合制作标准。\n推动前端⽣成质量提升\n汇总审核过程中发现的⾼频及共性问题，定期向 AI 视频⽣成组反馈，协助组⻓优化⽣成⽅\n法、提示词、模型及⽣产流程，从源头降低问题镜头产⽣率。\n沉淀审核标准与案例\n持续整理典型问题镜头及优秀案例，完善 A / B / C 分级标准、审核 SOP 及案例库，提升团\n队审核标准的⼀致性和稳定性。\n任职要求\n具备 AI 视频⽣成、后期制作、视频质检或相关内容制作经验，熟悉视频镜头质量判断；\n对⼈物⼀致性、动作⾃然度、场景稳定性、画⾯完整度、镜头逻辑等具备较强的识别能⼒；\n能够严格按照统⼀标准进⾏ A / B / C 分级，具备较⾼的审核准确率和标准⼀致性；\n细致、有耐⼼，对画⾯质量敏感，具备较强的标准意识和责任⼼；\n能够适应批量化、⾼频次的镜头审核⼯作，在较⼤审核量下保持稳定判断；\n能够准确描述问题并给出明确反馈，⽽不仅是判断“好 / 不好”；\n有较强的团队协作意识，能够与 AI ⽣成、剪辑等团队⾼效配合。\n加分项\n有 AI 视频⽣成或 AI 图像⽣成相关经验；\n有短剧、漫剧、短视频等批量内容⽣产经验；\n有视频后期质检、成⽚审核或影视制作质量管理经验；\n有从⽣成⼈员成⻓为⻣⼲、负责审核或质量把控的经验；\n熟悉主流 AI 视频⽣成⼯具及常⻅⽣成问题；\n有建⽴视频质量标准、质检 SOP 或镜头案例库的经验。", "cat": "内容与创作"}, {"id": "328", "title": "AI 内容剧本审核", "salary": "15-20k", "location": "", "jd": "岗位职责\n负责剧本终审与⽣产准⼊\n负责剧本进⼊制作前的最终审核，从题材价值、故事逻辑、⼈物设定、剧情节奏、商业潜⼒、\n制作可⾏性及内容合规等维度进⾏综合判断。未达到⽣产标准的剧本，不进⼊后续制作环节。\n把控剧本执⾏完整度\n判断剧本是否已经细化到可以直接进⼊分镜及⽣产阶段，确保⼈物、场景、剧情、镜头需求\n等关键内容清晰明确，避免进⼊制作后频繁返⼯或重新策划。\n提出明确的修改意⻅\n对不符合要求的剧本进⾏退回，并明确指出具体问题、修改⽅向及判断依据，推动编剧持续\n提升剧本质量，⽽不是只做简单的“通过 / 不通过”\n。\n参与制作可⾏性评估\n与 AI 视频⽣成、美术等团队共同参与剧本及分镜制作可⾏性会审，提前识别⼈物、场景、\n动作、特效等 AI ⽣成难度较⾼的内容，并将制作端反馈沉淀，反向优化剧本创作。\n负责内容合规审核\n建⽴并执⾏内容合规审核标准，负责题材、剧情、⼈物、台词、画⾯等⽅⾯的⻛险识别，熟\n悉不同平台的审核规则及内容红线，确保项⽬符合上线要求。合规审核环节不外包。\n提升剧本审核效率与标准化程度\n持续沉淀审核标准、典型案例及常⻅问题，完善剧本审核 SOP，在保证审核质量的同时提升\n审核效率和整体吞吐量。\n覆盖多来源剧本审核\n负责内部创作、外包制作及采购剧本的统⼀审核，确保不同来源的剧本按照同⼀套标准进⼊\n⽣产。\n任职要求\n具备 3 年以上剧本、编辑、影视内容或短剧相关经验，能够独⽴完成剧本判断和审核；\n具备较强的内容判断能⼒， 能够判断题材是否具备开发价值、故事逻辑是否成⽴、⼈物是否\n⽴得住、内容是否具备持续观看的基础，⽽⾮仅依据审核清单逐项核对；\n熟悉剧本结构、⼈物塑造、剧情节奏及短剧内容特点， 能够从执⾏层⾯判断剧本是否具备实\n际制作条件；\n熟悉主流内容平台的审核规则及常⻅内容⻛险，对题材、剧情、台词、⼈物及画⾯等合规问\n题具备较强的⻛险识别能⼒；\n审核效率⾼、判断准确，能够在较⼤审核量下保持稳定的审核标准；\n具备较强的沟通和反馈能⼒，能够给出具体、可执⾏的修改意⻅，推动编剧解决问题；\n能够适应快节奏、批量化的内容⽣产环境，并接受明确的审核效率与质量要求。\n加分项\n有 短剧、AI 短剧、AI 漫剧或短视频内容审核经验；\n有⽹⽂、短剧、影视项⽬的编辑或策划经验；\n熟悉多个内容平台的审核规则及合规差异；\n有外包、采购及内部多来源剧本审核经验；\n有建⽴剧本审核标准、审核 SOP 或内容合规体系的经验；\n对 AI 内容⽣产流程及 AI ⽣成限制有⼀定了解。", "cat": "内容与创作"}, {"id": "329", "title": "AI美术 / 角色场景设计师", "salary": "8k - 20k", "location": "", "jd": "岗位职责\n\n负责角色与场景美术设计\n根据剧本及项目视觉要求，完成角色、场景、道具等美术资产设计，产出角色三视图、角色设定及场景 / 道具素材，为后续AI视频生成提供标准化素材。\n\n负责分镜与画面设计\n根据剧本内容完成基础分镜脚本，合理规划人物站位、动作、景别及镜头衔接，确保画面逻辑清晰、镜头连续，并具备AI生成的可执行性。\n\n负责核心美术资产锁定\n配合内容负责人及生成团队完成男女主、主要配角、核心场景及关键道具的资产确认。核心资产未达到统一标准前，不进入大规模生产，避免后期出现人物及场景不一致。\n\n建立与维护美术资产库\n将项目中验证有效的角色、场景、道具及相关提示词、生成参数等进行整理和归档，沉淀至部门共享资产库，提高优质资产的复用效率。\n\n使用AI工具完成批量美术生产\n熟练使用AI绘画及相关工作流，根据不同项目需求进行角色设计、场景设计、素材生成及优化，并持续探索更高效的AI美术生产方式。\n\n参与生产问题优化\n根据AI视频生成及镜头审核反馈，持续调整角色、场景及道具资产，解决人物一致性、风格统一、场景稳定等问题，提升前后端生产衔接效率。\n\n任职要求\n\n具备一定的绘画、视觉设计或美术基础，美术、动画、游戏、平面设计等相关专业背景优先，有成熟作品亦可；\n\n对AI美术工具有兴趣并能够快速上手，是岗位核心要求；\n\n具备较强的学习能力和执行力，能够按照标准化流程完成角色、场景、三视图及分镜等生产任务；\n\n对画面、构图、人物比例、色彩及视觉统一性具备基本判断能力；\n\n能适应批量化、标准化的内容生产方式，具备较强的耐心和稳定性；\n\n不强制要求AI或短剧行业经验，欢迎应届生、跨行业转岗人员及有AI绘画实践经验的候选人；\n\n认同以实际产出、质量及熟练度为基础的数据化考核和阶梯成长机制。\n\n加分项\n\n有角色设计、人物设定、世界观设计或分镜相关经验；\n\n熟悉 Stable Diffusion、Midjourney 等主流AI绘画工具；\n\n了解 LoRA、模型微调、工作流搭建等相关概念；\n\n有游戏、动画、短剧、漫画等相关美术作品；\n\n有AI角色一致性、风格统一或批量资产生产经验。", "cat": "内容与创作"}, {"id": "330", "title": "新媒体运营", "salary": "12-15K", "location": "", "jd": "1. 岗位目标\n独立负责国内及海外新媒体矩阵账号，从账号定位、素材判断、 内容发布、达人合作到数据复盘形成完整闭环，并围绕产品UV、转化效率和获客成本持续优化结果\n2. 岗位职责\n1.   矩阵账号运营：独立负责多个账号的定位、搭建、 内容规划、发布节奏、 日常维护和阶段复盘，不是只参与单个账号的局部执行。\n2.   素材判断与优化：从内容池中判断具有爆款潜力的素材，结合平台机制、用户偏好和产品目标完成选题、改编、测试和复用。\n3.   国内外平台运营：根据不同平台的分发机制和公域流量特点调整内容，覆盖国内平台及至少两个海外平台。\n4.   达人合作：独立完成达人筛选、沟通、合作Brief撰写、脚本审核、视频内容验收、修改反馈和合作落地。\n5.   数据跟踪与复盘：持续跟踪浏览、点击或PV、产品UV、转化率和用户成本，能根据数据判断继续放大、调整或停止。\n6.   跨部门协作：与产品及相关团队确认推广链接可访问、数据可归因，并按推广结果推动素材、账号和合作方式调整。\n3. 任职要求\n●   总工作经验不少于3年；其中新媒体相关经验不少于1年，2C业务经验不少于2年。\n●   必须独立负责过矩阵账号运营，能够清楚说明账号数量、本人责任、运营周期、执行动作及最终数据结果。\n●    国内平台做过抖音、B站、小红书或视频号中的一种或多种。\n●   海外平台至少做过TikTok、YouTube、X、Instagram中的两个；有X和TikTok实操经验优先。\n●    网感好，能够判断什么内容具备爆款潜力，并能解释判断依据、测试方式和结果，而不是只凭个人感觉。\n●   理解不同平台的基础机制、公域流量分发方式和目标用户偏好，能够针对平台调整内容。\n●   有独立达人合作经验，能完成合作Brief、脚本及视频审核、沟通修改、验收和效果跟踪。\n●   具备数据意识，能从曝光、点击或PV、产品UV、转化率和获客成本判断问题所在。\n\n4. 加分项\n●    自带可直接对接的KOL或达人资源。\n●   有X、TikTok矩阵从0到1搭建及规模化运营案例。\n●   有通过素材测试、账号匹配或达人合作降低获客成本的明确案例。\n●   能独立完成脚本、Brief、数据复盘或基础可视化报告。\n5. 面试前需提供的证明材料\n●   本人实际参与并负责的相关作品，不要求提供账号登录信息。\n●   至少一个矩阵账号案例，说明平台、账号数量、运营周期、本人职责和结果。\n●   可核验的数据结果，例如浏览、涨粉、点击、转化、产品UV、获客成本或达人合作效果。\n●   达人合作案例中的Brief、脚本、审核反馈或结果复盘，可对敏感信息做脱敏处理。\n6. 筛选标准\n简历初筛必须同时满足\n●   总工作经验≥3年，新媒体经验≥1年。\n●    明确写出独立负责矩阵账号，而不是只写“参与运营”或“协助发布” 。\n●   具备国内平台经验，并具备至少两个海外平台经验。\n●   能够提供作品和数据结果，且能说明本人在结果中的实际责任。\n●   达人合作经历必须包含Brief、 内容审核、沟通修改和验收，不只做资源转交或商务联系", "cat": "运营与市场"}, {"id": "331", "title": "编剧（AI短剧/漫剧方向）", "salary": "15-30k", "location": "5. 具备较强的修改能力，能够接受快节奏、高频迭代的工作方式。", "jd": "岗位职责\n1. 负责都市情感、婚姻家庭、女性成长、悬疑反转、银发情感等题材的选题策划与剧本创作。\n2. 完成故事大纲、人物小传、分集梗概、单集剧本及对白。\n3. 设计前三集钩子、单集冲突、集尾悬念和中后段付费卡点。\n4. 根据平台数据和用户反馈，快速调整剧情节奏、人物关系及情绪密度。\n5. 使用大语言模型等AI工具辅助选题、资料整理、剧情推演和版本迭代。\n6. 与AI分镜、视觉、配音、剪辑团队协作，保证剧本具备良好的生成和制作可行性。\n7. 关注主流短剧平台的热门题材及用户趋势。\n任职要求\n1. 具备网文、短剧、漫画、动画、游戏剧情或互动内容创作经验。\n2. 熟悉短剧叙事规律，能够快速建立冲突，并持续制造反转和情绪价值。\n3. 人物关系设计能力强，擅长成年人情感、利益博弈及现实议题。\n4. 能独立完成60—100集短剧的整体架构，单集时长适配3-5分钟。\n5. 具备较强的修改能力，能够接受快节奏、高频迭代的工作方式。\n6. 有版权意识和内容安全意识，能够主动规避低俗、侵权及平台审核风险。\n7. 对AI内容生产有兴趣，愿意持续学习新的生成工具和工作流。\n加分项\n• 有上线短剧、爆款网文或高流水项目经验；\n• 熟悉红果、抖音、快手等平台的内容偏好；\n• 有海外短剧、本地化改编或多语言内容经验；\n• 能使用AI完成角色设定、分镜提示词或视频预演；\n• 拥有可改编IP、成熟题材库或稳定创作搭档。", "cat": "内容与创作"}, {"id": "332", "title": "中高级网站运营", "salary": "12k-16k", "location": "", "jd": "岗位职责\n1. 负责公司网站的整体运营，包括内容更新、栏目维护、页面配置、专题策划及日常运营管理；\n2. 负责首页、频道页、详情页、专题页、活动页等核心页面的内容规划、入口调整与转化优化；\n3. 围绕业务目标制定网站流量增长、用户转化、留存提升及内容运营方案，并推动执行落地；\n4. 跟踪分析访问量、流量来源、点击率、跳出率、转化率、留存率等核心数据，定期完成运营复盘；\n5. 根据用户行为和数据表现发现问题，提出页面、内容、路径及用户体验优化方案；\n6. 配合SEO工作，完成关键词布局、内容优化、内链建设、专题页规划及页面结构调整；\n7. 协同产品、技术、设计、SEO及内容团队，推动网站功能优化、后台工具改进和数据看板建设；\n8. 开展竞品及行业调研，分析同类网站的内容结构、流量来源、页面布局和运营策略；\n9. 策划并执行专题活动、内容合集、榜单推荐、频道运营等项目，提升网站活跃度与业务转化；\n10. 建立并持续优化网站运营SOP，包括内容发布、页面检查、数据复盘和问题反馈等流程；\n11. 定期输出运营周报、月报及专项分析报告，清晰汇报数据表现、项目进展和后续计划；\n12. 关注AI内容及原创AI短剧的发展趋势，探索相关内容在网站运营、流量获取和用户增长中的应用。\n\n任职要求\n1. 3年以上网站运营、平台运营、内容运营或增长运营经验，有独立负责网站运营项目的经历；\n2. 熟悉网站整体运营流程，能够独立完成内容规划、页面运营、活动策划、数据分析及效果复盘；\n3. 熟练使用网站后台或CMS系统，能够完成内容发布、栏目维护、标签管理、专题配置等工作；\n4. 具备较强的数据分析能力，能够通过流量、点击、转化、留存及跳出率等指标定位问题并制定优化方案；\n5. 理解基础SEO方法，熟悉关键词、标题与描述、内链、收录和页面结构对自然流量的影响；\n6. 具备良好的内容判断能力，能够从用户需求、平台定位、内容质量和转化目标等角度评估内容；\n7. 具备较强的项目推动能力，能够将运营目标拆解为具体任务，明确优先级并持续推进；\n8. 具备良好的跨团队沟通能力，能够准确表达运营需求，并协同产品、技术、设计、SEO等团队落地；\n9. 熟练使用Excel、Google Sheets、飞书表格等工具，能够进行数据整理、分析和报表制作；\n10. 自驱力和责任心强，对结果负责，能够适应快速变化的业务环境。\n\n加分项\n1. 具备成熟的外链建设经验，有稳定的外链拓展方法、渠道资源或成功案例；\n2. 有X（Twitter）、Telegram社群等海外渠道的内容推广、社区运营或品牌外宣经验；\n3. 有海外网站、内容站、工具站、平台型产品或出海业务运营经验；\n4. 有通过内容、SEO、外链或社群运营实现网站流量及转化增长的成功案例；\n5. 对原创AI短剧、AI视频及相关内容生态有浓厚兴趣，能够提出内容策划或运营思路；\n6. 有原创AI短剧、AI视频、剧本策划或相关运营作品者优先录用；\n7. 熟悉AI内容生产工具，并能将其应用于选题策划、内容制作、素材整理和运营提效。", "cat": "运营与市场"}, {"id": "333", "title": "中高级运营", "salary": "12K–20K", "location": "", "jd": "岗位介绍\n负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的成人产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营与市场"}, {"id": "334", "title": "业务培训专家", "salary": "20K-35K", "location": "", "jd": "业务培训专家 JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n负责讲师资格库建设，优先挖掘业务一线 TOP 20% 高手担任兼职讲师，按季度核验讲师业务表现及授课质量，建立动态淘汰机制。\n对接 AI 工具厂商及外部讲师资源，评估其行业案例、ROI 数据及课程适配度，把控外部讲师引入标准。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n按季度组织业务复盘会，与业务一线、HRBP 对齐培训落地效果及业绩归因，持续优化课程内容和演武机制。\n任职要求\n5-8 年业务培训、业务赋能、培训运营或实战教练相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点，不只是做课程交付，而是能围绕业务结果设计培训方案。\n主导过 50 场以上实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n善于调动业务内部高绩效人员担任兼职讲师，能把一线优秀打法转化为可复制、可训练、可考核的课程和 SOP。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "职能与行政"}, {"id": "335", "title": "业务萃取专家", "salary": "20K-35K", "location": "", "jd": "参与集团内各分公司、重点项目组及业务骨干的访谈、调研和复盘，了解业务背景、执行过程、关键动作及结果数据。\n根据访谈和业务资料，整理高质量访谈纪要，提炼核心业务动作、成功经验、失败教训及可复用方法。\n挖掘各产品、项目组、一线业务团队中具有复制价值的优秀打法、亮点案例和关键经验。\n将零散的业务经验和项目资料整理为结构化内容，包括业务背景、问题场景、关键动作、执行步骤、结果数据、适用场景和注意事项等。\n协助搭建并维护经验案例库、战法地图、知识库及待萃取素材清单，持续沉淀集团内部可复用的业务经验。\n与 SOP 工程化组、学习发展部及相关业务团队协作，推动经验素材转化为 SOP、工具包、培训课件、实战训练内容等可落地成果。\n结合业务需求，使用 AI 工具辅助访谈纪要整理、内容提炼、框架搭建和结构化输出，提升经验沉淀效率。\n跟进经验素材的应用反馈，持续优化案例内容、SOP 表达和工具包结构，提升内容的实用性和可复制性。", "cat": "职能与行政"}, {"id": "336", "title": "资深短剧编剧", "salary": "20-35k", "location": "", "jd": "【岗位定位】\n负责精品叙事类短剧的创作、评审与方法沉淀；不是简单使用AI生成文本，而是把控人物、逻辑、节奏和可制作性。\n\n【岗位职责】\n• 负责精品短剧、连续剧情及叙事类视频的原创、改编和剧本精修。\n• 完善世界观、人物关系、角色动机、成长线、核心冲突及分集结构。\n• 对AI生成或各业务线提交的剧本进行专业Review，解决人物扁平、逻辑断裂、节奏拖沓和情节雷同等问题。\n• 把控开场钩子、爽点密度、冲突升级、剧情反转和结尾断点。\n• 与AI视频制作人员联合评审，确保执行人员拿到剧本后不需要重新策划。\n• 结合采纳率、成片表现和用户数据，沉淀剧本模板、评审标准和创作方法。\n\n【重点技能】\n剧本结构；人物塑造；短剧节奏；AI剧本精修；剧本质检；制作可行性判断\n\n【任职要求】\n• 具备短剧、影视剧、动画或游戏剧情策划经验，有可核验的上线作品。\n• 具备扎实的剧本基本功，能够独立完成人物塑造、故事结构及分集节奏设计。\n• 有较强的剧本质检能力，能够快速判断剧本的问题、潜力和修改方向。\n• 理解短视频用户习惯，熟悉钩子、爽点、反转、断点和连续追剧动力。\n• 具备良好的审美、逻辑和内容判断力，不依赖AI完成核心创意与专业判断。\n• 能与导演、分镜、AI生成、美术和剪辑人员有效协作。\n\n【优先背景 / 作品要求】\n优先考虑短剧编剧、影视编剧、动画编剧、游戏剧情/文案策划，以及具备影视化改编能力的小说作者。需提供上线作品、脱敏剧本或修改前后版本。", "cat": "内容与创作"}, {"id": "337", "title": "角色IP策划", "salary": "20-35k", "location": "", "jd": "【岗位定位】\n负责角色世界观、人物线、关系网和视觉一致性，创造能够持续产生故事并长期被观众记住的角色资产。\n\n【岗位职责】\n• 负责角色IP定位、世界观、人物小传、性格、欲望、恐惧及成长线设计。\n• 搭建角色关系网、核心冲突和可持续发展的剧情空间。\n• 制定角色卡、三视图要求、面部锚点、服装特征、形象参数和素材规格。\n• 建立人格边界、行为规则和禁止清单，避免跨剧集设定冲突。\n• 配合编剧通过角色关系和核心冲突反向开发系列故事。\n• 配合AI工作流团队解决角色跨模型、跨场景和跨镜头的一致性问题。\n• 跟踪角色的参演内容、社媒反馈和业务表现并持续优化。\n\n【重点技能】\n人物塑造；世界观；关系网；长期故事线；视觉锚点；角色一致性；IP运营\n\n【任职要求】\n• 具备影视、动画、游戏、虚拟人或IP内容策划经验。\n• 擅长人物塑造、世界观设计、角色关系和长期故事线规划。\n• 理解三视图、面部锚点、视觉设定及跨场景一致性要求。\n• 能从内容、视觉和运营角度判断角色的长期发展潜力。\n• 原创能力强，能够避免角色同质化、标签化和脸谱化。\n• 具备良好的审美和跨团队协作能力。\n\n【优先背景 / 作品要求】\n优先考虑游戏IP/世界观策划、影视动画角色策划、虚拟偶像或数字人运营背景；有系列角色、角色联动或跨媒体IP经验者优先。", "cat": "内容与创作"}, {"id": "338", "title": "AI视频工作流专家", "salary": "20-35k", "location": "", "jd": "【岗位定位】\n熟练操作万桢、FRW及相关AI内容平台，把剧本和角色稳定转化为高质量视频，并沉淀可复制的标准工作流。\n\n【岗位职责】\n• 操作万桢、FRW、无限画布及相关工具，完成剧本到成片的端到端制作。\n• 完成角色、场景、分镜、参考图、图像生成、视频生成、配音、音效和剪辑拼接。\n• 根据项目选择模型、提示词、参考素材、参数和生成方案。\n• 解决角色一致性、动作自然度、镜头衔接、画面稳定性和剧情连贯性问题。\n• 沉淀示例画布、工作流节点、模型选择方法、质检标准和操作SOP。\n• 复盘效率、返工和成片表现，持续优化工作流并培训业务线人员。\n\n【重点技能】\n万桢/FRW；无限画布；多模型组合；角色一致性；分镜与剪辑；流程诊断；SOP与培训\n\n【任职要求】\n• 具备AI视频、AI动画、影视制作、视觉设计或内容后期的实际项目经验。\n• 有完整AI视频或AI动画作品，能够说明从剧本到成片的生产过程。\n• 熟悉文生图、图生视频、文生视频、多模型组合和参考图控制。\n• 理解镜头语言、构图、光影、动作、节奏、声音设计及基本剪辑逻辑。\n• 能够定位工作流问题，并通过调整模型、节点、提示词或素材解决。\n• 具备审美、质量意识、文档沉淀和培训能力。\n\n【优先背景 / 作品要求】\n优先考虑AI视频/动画、影视导演、分镜、动画制作、美术设计、剪辑及后期背景；有无限画布、ComfyUI或多模型节点式工作流经验者优先。", "cat": "内容与创作"}, {"id": "339", "title": "业务萃取专员", "salary": "15-25k", "location": "", "jd": "任职要求\n本科及以上学历，不限专业；\n1-3年App运营、产品运营或业务运营相关经验；\n具备较强的逻辑思维与数据分析能力，熟练使用Excel，能独立完成数据复盘与问题归因；\n熟悉App产品逻辑与基础技术概念（如版本管理、灰度发布、配置后台等）；\n跨部门沟通协调能力强，具备良好的项目推进与文档能力；\n细致严谨，责任心强，能在多任务下保证工作质量与时效；\n有结果导向意识，能从业务全局视角提出可落地的优化建议。", "cat": "职能与行政"}, {"id": "340", "title": "HR助理（HRBP方向）", "salary": "£25,000 – £30,000 / 年", "location": "工作地点：伦敦", "jd": "岗位职责\n业务理解与HRBP支持\n协助总监理解业务运作，识别组织问题并推进相关优化。\n人力规划与招聘支持\n参与人力需求评估及招聘支持，从业务角度判断人员匹配度。\n组织效率提升\n协助推动团队效率及整体组织绩效的提升。\n执行与制度落地\n协助相关工作的落地与跟进，并推动公司制度在各部门执行。\n\n任职要求\n基础要求\n本科及以上学历\n熟练使用办公工具（如Excel、Google Drive、WPS等）\n对使用AI工具提升工作效率具备积极态度\n中文流利\n核心能力\n执行力强，能够推动事情落地\n逻辑能力强，具备清晰的分析与判断能力\n学习能力强，能够快速成长\n候选人背景（需满足以下三类之一）\n人力资源专业背景（优先）\n人力资源管理或相关专业（如人力资源管理、组织管理等以人员与组织为核心的专业），具备扎实理论基础，并希望应用于实际工作\nCIPD发展路径人选\n已完成CIPD Level 3，并正在学习Level 5，对HRBP发展路径有明确规划\n具备管理经验并计划转型HR的人选\n过往工作中有实际带人或团队管理经验，对组织与人员问题有一定理解，有明确意愿转型HR，并计划未来考取CIPD", "cat": "职能与行政"}, {"id": "341", "title": "HRBP", "salary": "¥18K–25K/月,具体依能力面议", "location": "英国远程都可以", "jd": "岗位职责\n编制管理:对口若干中后台部门,深入了解部门业务,持续评估编制合理性,参与入职审批环节并出具专业意见\n组织诊断与人效分析:定期与所辖部门负责人及团队访谈,诊断组织问题、协助管理改善;基于数据开展人效分析,输出可落地的结论与建议\n例常人事工作:月度组织架构与花名册核对、编制统计、各部门绩效与薪酬激励数据的收集、汇总与初审\n专项支持:组织调整期间的落地支持(员工沟通、去向协调、人员安置)及临时性专项任务\n制度建设:参与团队制度与流程的搭建与优化\n任职要求\n3 年以上 HRBP 相关经验,有组织诊断或人效改善的实际落地案例者优先\n执行力强,例常工作细致零差错,时间承诺可靠\n沟通能力出色:能坦率指出问题,也能维护好跨部门关系,推动问题落地解决\n对数据敏感,书面表达清晰,能独立产出结构完整的分析报告\n适应远程协作,自驱力强\n熟练使用 AI 工具提升工作效率者加分", "cat": "职能与行政"}, {"id": "342", "title": "项目助理 Project Assistant(1–2 名)", "salary": "试用期年薪 £25,000–28,000(按履历与面试表现定档)", "location": "工作地点:伦敦(办公室办公初筛问题", "jd": "主要职责\n商业伙伴关系\n与企业领导者密切合作，了解组织需求、团队结构和绩效挑战。\n组织诊断与问题解决\n找出组织和人员相关问题的根本原因，并提供务实的、以结果为导向的解决方案。\n员工队伍规划与人才决策\n从业务角度领导员工队伍规划、招聘决策和人才评估。\n实施与影响传递\n推动人员计划的执行，并确保组织绩效的可衡量改进。\n人力资源框架捐款（如适用）\n在必要时与相关职能部门（如COE）合作，为人力资源和社会保障框架和最佳实践做出贡献。\n\n要求\n经验\n具有支持业务团队（通常为50名员工）的成熟HRBP经验\n在解决组织或人员相关挑战方面展示了经验\n资格\nCIPD 5级或以上（或同等专业资格）\n核心竞争力\n具有较强的商业敏锐度和利益相关者管理能力\n较强的分析和解决问题的能力\n影响和挑战企业领导者的能力\n以结果为导向，采用务实、亲身实践的方法\n语言\n精通普通话", "cat": "产品与管理"}, {"id": "343", "title": "HRBP", "salary": "45，000英镑至65，000英镑", "location": "工作地点：伦敦", "jd": "岗位职责\n编制管理:对口若干中后台部门,深入了解部门业务,持续评估编制合理性,参与入职审批环节并出具专业意见\n组织诊断与人效分析:定期与所辖部门负责人及团队访谈,诊断组织问题、协助管理改善;基于数据开展人效分析,输出可落地的结论与建议\n例常人事工作:月度组织架构与花名册核对、编制统计、各部门绩效与薪酬激励数据的收集、汇总与初审\n专项支持:组织调整期间的落地支持(员工沟通、去向协调、人员安置)及临时性专项任务\n制度建设:参与团队制度与流程的搭建与优化\n任职要求\n3 年以上 HRBP 相关经验,有组织诊断或人效改善的实际落地案例者优先\n执行力强,例常工作细致零差错,时间承诺可靠\n沟通能力出色:能坦率指出问题,也能维护好跨部门关系,推动问题落地解决\n对数据敏感,书面表达清晰,能独立产出结构完整的分析报告\n适应远程协作,自驱力强\n熟练使用 AI 工具提升工作效率者加分", "cat": "职能与行政"}, {"id": "344", "title": "生活助理（英国本地）", "salary": "约 £4,000/月", "location": "", "jd": "岗位职责\n\n现招聘生活助理，主要负责日常出行、生活事务及部分陪同安排。\n\n具体工作内容包括：\n负责家庭成员日常伦敦市区内接送及相关出行安排；\n协助处理日常生活及临时事务；\n偶尔陪同老板进行PC游戏娱乐；\n配合完成其他交办事项；\n能接受日常超时及周六加班安排。\n\n任职要求\n年龄35岁以下优先。\n必须会开车，驾驶技术熟练，熟悉市区道路者优先（要求英国驾照）\n熟悉PC游戏，平时有PC游戏经验者优先；\n做事靠谱，执行力强，反应快；\n性格稳定，守时，有责任心；\n能接受每周休息1天的工作节奏；\n目前需具备合法工作身份，不提供工作签证。\n\n薪资待遇\n\n综合年包\n年综合收入不低于£52,000（税前）\n\n薪资结构\n基础月薪：£2,800\n加班及周六工作补贴：£1,200/月\n综合实际月收入：约 £4,000\n享有13薪\n表现优异可15薪\n\n工作时间与休息\n实际工作节奏为：每周休息1天\n日常可能存在超时工作\n周六通常需要配合工作安排（不需要固定时间，可灵活调休）\n具体工作时间根据实际事务灵活安排", "cat": "职能与行政"}, {"id": "345", "title": "公司治理法务", "salary": "", "location": "", "jd": "待Jims发布", "cat": "职能与行政"}, {"id": "346", "title": "AI与知识产权法务", "salary": "", "location": "", "jd": "待Jims发布", "cat": "职能与行政"}, {"id": "347", "title": "英国法务助理", "salary": "", "location": "", "jd": "（源表未填写JD）", "cat": "职能与行政"}, {"id": "348", "title": "合规产品经理（工具/社交方向）", "salary": "15-25k", "location": "", "jd": "岗位职责\n\n1. 负责海外工具产品及社交产品的产品规划、需求分析、产品设计及版本迭代。\n\n2. 深入分析用户需求及业务目标，制定产品方案，持续优化产品体验及核心指标。\n\n3. 独立完成需求分析、原型设计、PRD编写，并推动研发、设计、测试等团队完成产品交付。\n\n4. 基于产品数据及用户反馈持续优化产品功能，提升用户留存、活跃及商业化能力。\n\n5. 与运营、市场等团队紧密配合，推动产品增长策略落地，支撑业务发展。\n\n6. 持续关注行业趋势及竞品动态，探索产品创新方向。\n\n任职要求\n\n1.本科及以上学历，3年以上互联网产品经理经验。\n\n2.能独立负责产品全生命周期管理，包括需求分析、原型设计、PRD输出、项目推进及上线复盘。\n\n3.有工具产品（AI、壁纸、浏览器、VPN、效率工具等）或社交产品经验优先。\n\n4.具备优秀的产品思维、数据分析能力及业务理解能力，能够通过数据驱动产品优化。\n\n5.具备较强的项目推动能力及跨部门沟通协调能力。\n\n6.对海外产品、AI产品或社区产品有一定理解者优先。\n\n加分项\n海外产品经验\nAI产品经验\n社交产品经验\n多产品并行负责经验\n英语读写能力良好", "cat": "产品与管理"}, {"id": "349", "title": "运营专员", "salary": "8-15k", "location": "", "jd": "运营专员（远程）| 8-15K\n\n【岗位职责】\n\n负责 App 日常运营执行，包括内容更新、活动上线、资源位配置。\n负责运营数据日常维护、监测与整理，输出常规报表。\n配合 Web 端运营，协助内容发布、页面维护、收录及引流执行。\n协助活动策划与执行，包括素材协调、上线跟进及数据整理。\n配合完成用户反馈收集、社群维护及日常运营支持。\n协同产品、内容、技术团队，保障运营工作按时落地。\n\n【任职要求】\n\n大专及以上学历，1 年以上互联网运营经验，优秀应届亦可。\n基础数据意识与工具能力（Excel 等），能独立整理数据、做报表。\n做事细致、执行力强。\n良好沟通协作与学习能力，能适应远程办公、主动跟进。\n对内容、社区或视频类产品有兴趣，愿在运营方向长期发展。\n\n【加分项】\n\n有社区产品、播放器产品相关经验者优先。\n有 App 或 Web 端运营执行、内容或社群运营经验。\n具备基础文案、设计或视频剪辑能力。\n有 AI 工具辅助运营或内容工作经验。", "cat": "运营与市场"}, {"id": "350", "title": "中高级产品经理", "salary": "20K-25K", "location": "", "jd": "海外产品经理（AI/社交/工具方向）\n\n岗位职责\n\n1. 负责海外产品0-1建设\n负责海外 APP 产品从需求分析、产品规划、设计开发到上线迭代的完整流程；\n根据目标市场用户需求，完成产品定位、功能规划及版本规划；\n\n独立输出：产品需求文档（PRD）；产品流程图；原型设计；功能验收标准；\n\n推动研发、设计、运营等团队协作，保障产品按计划上线。\n\n2. 负责产品策略及用户体验优化\n\n深入分析海外竞品及用户需求，制定产品优化方案；\n关注用户核心链路并基于数据分析持续优化产品体验。\n\n3. 负责增长及商业化设计结合产品目标设计策略\n\n4. 负责海外市场产品研究，关注欧美、东南亚等海外市场用户需求及行业趋势；研究海外竞品，输出竞品分析、产品策略及增长方案。\n\n5. 跨团队推进项目落地\n协调研发、UI、运营、投放团队推进项目；负责需求优先级管理及版本规划；跟进开发进度、测试验收及上线复盘；对产品最终效果负责。\n\n任职要求\n\n基础要求\n\n3年以上互联网产品经理经验；\n有完整负责产品上线经验；\n熟悉APP产品从0到1流程；\n具备较强的产品规划、需求拆解和项目推进能力。\n\n核心能力要求\n\n1. 产品能力\n熟悉：用户需求分析；产品架构设计；PRD输出；原型设计；数据分析；AB测试。\n\n能够独立完成：一个产品从想法到上线；一个版本从需求到交付。\n\n2. 增长能力\n了解：AARRR增长模型；用户生命周期运营；留存提升策略；付费转化优化。\n\n3. 海外经验优先\n\n优先考虑：海外APP产品经验；欧美市场产品经验；出海社交/工具/AI产品经验；App Store、Google Play上线经验。\n\n加分项\n\n独立负责百万级用户产品经验；\n熟悉海外支付、会员体系、广告变现。", "cat": "产品与管理"}, {"id": "351", "title": "UK中级运营", "salary": "24K-35K", "location": "英国线上办公\n1.工作地点在伦敦，需具备合理通勤距离并可稳定到岗，混合办公制", "jd": "岗位职责（偏品牌策划）\n1. 负责动漫/漫画及ACG内容的策划、编排与日常运营，维护内容调性与更新节奏，提升阅读、互动、留存与转化等核心指标。\n2. 运营多平台社媒账号矩阵（B站、微博、抖音、小红书、Lofter等），策划话题、专题及二创/UGC活动，提升粉丝活跃度与社区参与度。\n3. 结合IP上线节奏（新番、漫画更新、联动、版本活动等），承接宣发与运营动作，提升内容曝光与用户承接效率。\n4. 独立完成内容及活动全流程，包括选题策划、方案设计、内容包装、上线执行及跨部门协作落地。\n5. 监测内容与活动数据（阅读、互动、转化、留存等），输出复盘报告并持续优化运营策略。\n6. 关注二次元行业趋势与热门作品，挖掘内容机会与传播玩法。\n7. 协同产品、设计、技术团队推动内容与活动需求落地执行。\n\n任职要求：\n1.工作地点在伦敦，需具备合理通勤距离并可稳定到岗，混合办公制\n2.本科及以上学历，优先：QS Top 100 / 海外名校 / 重点院校；新闻传播、市场营销、广告、新媒体、中文、设计等相关专业优先\n3.1–3年内容运营 / 社媒运营 / 用户增长 / IP运营相关经验\n4. 重度二次元用户，熟悉主流动漫、漫画、二次元手游及其社区生态与梗文化（如《原神》《崩坏：星穹铁道》《碧蓝档案》《明日方舟》等）。 \n5. 有较强的文字与内容感知能力，能独立完成策划案、文案与活动方案。 \n6. 数据敏感，会用基础数据工具做分析与复盘。 7. 执行力强、沟通顺畅，能在快节奏下推进多个项目并行。\n\n加分项\n1.重度二次元用户，有长期ACG内容消费与社区参与经验，优先考虑自带二创博主资源\n2.有爆款内容或话题/活动案例\n3.熟悉Lofter、Pixiv、B站创作生态或海外同人社区\n4.有IP宣发或泛娱乐内容推广经验\n5.有AI工具辅助内容生产或运营经验\n6. 擅长SEO的加分", "cat": "运营与市场"}, {"id": "352", "title": "信息流广告设计师", "salary": "18-25K", "location": "", "jd": "一、岗位职责\n负责公司海外产品的信息流广告素材设计，包括 Meta、Google、TikTok 等海外广告平台的图片、视频、动图、落地页素材等；\n根据产品定位、目标用户及投放市场，独立完成广告素材的创意策划、视觉设计及迭代优化；\n深入理解海外用户审美及不同国家、地区的内容偏好，能够针对欧美、东南亚、中东等市场进行差异化素材设计；\n与广告投放、产品、运营团队协作，根据 CTR、CVR、CPI、CPA、ROAS/ROI 等投放数据分析素材表现，并持续进行素材优化；\n负责广告素材的批量生产及A/B测试，根据数据快速迭代高潜素材，提升素材点击率、转化率及投放效率；\n关注海外广告市场及竞品素材趋势，持续研究 Meta、TikTok、Google等平台热门广告素材、创意形式及用户内容趋势；\n能够从用户痛点、产品卖点及商业化目标出发，主动提出广告创意，而不仅仅是根据需求执行设计；\n建立并持续完善广告素材库、素材标签及优秀案例库，提高团队素材生产效率。\n二、任职要求\n3年以上信息流广告设计、广告创意设计或买量素材设计经验，有成熟的海外广告素材作品；\n熟悉 Meta、Google、TikTok 等海外广告平台的素材规范及常见广告形式；\n有较强的视觉表现力和广告创意能力，能够独立完成从创意 → 设计 → 测试 → 数据复盘 → 迭代的完整流程；\n对广告素材有较强的数据意识，能够理解CTR、CVR、CPA、CPI、ROAS等核心投放指标，并根据数据判断素材问题；\n熟悉 Photoshop、Figma、Illustrator、After Effects、Premiere 等设计/视频工具中的一种或多种；\n有较强的海外用户审美判断能力，对欧美年轻用户的视觉风格、广告表达及内容趋势有一定理解；\n有 社交、AI、游戏、工具、内容类产品海外买量素材经验者优先；\n有短视频广告、UGC广告、AI生成素材经验者优先；\n具备较强的执行力和抗压能力，能够适应快速测试、快速迭代的工作节奏；\n能够接受以投放数据和实际转化效果作为素材评估的重要标准。\n三、我们希望你具备的能力\n创意能力 > 视觉能力 > 数据意识 > 执行效率\n我们不希望招聘一个单纯“把图做得好看”的设计师，而是希望找到能够理解买量逻辑的广告设计师。\n你需要能够回答：\n这个素材为什么用户会点击？\n用户看到的第一眼卖点是什么？\n为什么这个素材CTR高？\n为什么点击高但注册/付费低？\n同一个产品，欧美和东南亚应该怎么做素材差异化？\n如何通过10～20个素材快速找到有效方向？\n一个素材跑出来以后，如何继续拆解、变体和放量？\n四、加分项\n有海外信息流广告素材爆款案例；\n有实际素材数据案例，可提供投放前后CTR、CVR、CPA、ROAS等数据变化；\n有AI伴侣、Dating、社交、游戏、内容类产品经验；\n有UGC、真人口播、剧情类短视频广告经验；\n熟悉 Midjourney、即梦、Runway、可灵、ChatGPT 等AI创作工具；\n有从0到1搭建广告素材体系或素材团队经验。\n五、薪资福利\n薪资：18K–25K/月\n具体薪资根据候选人的作品质量、海外买量经验、数据能力及实际项目案例综合评估。\n优秀候选人可进一步面议。", "cat": "内容与创作"}, {"id": "353", "title": "运维工程师（非大陆区）", "salary": "20-35K", "location": "", "jd": "资深运维工程师（DevOps / AI 自动化方向）\n寻找实战经验扎实、能独立解决问题的运维工程师，负责业务系统稳定运行，并通过自动化和 AI 提升运维效率。\n工作职责\n• 负责服务器、网络、数据库及业务应用的部署、维护、监控与故障处理\n• 建立标准化发布、配置管理、回滚流程及应急预案，推动故障复盘\n• 负责账号权限、密钥管理、安全更新及云资源成本优化\n• 使用 Python / Shell 等实现巡检、部署、备份、日志处理自动化\n• 推动 AI 落地运维：告警归并、日志分析、故障辅助定位、知识库检索\n• 建设可追踪、可验证、可回滚的自动化流程，沉淀文档与故障案例\n任职要求\n• 有独立维护生产环境经验，能承担故障定位、业务恢复与改进\n• 熟悉 Linux 及 TCP/IP、DNS、HTTP/HTTPS、防火墙，具备实际排障能力\n• 熟练使用 Docker、Kubernetes、Nginx、Git 及 CI/CD，能独立完成部署、升级和回滚\n• 熟悉常用数据库维护、备份与恢复，有监控告警及日志管理经验\n• 熟练至少一种脚本语言，能编写含异常处理、日志记录和结果验证的脚本\n• 具备变更管理与安全意识，能明确操作影响范围并及时恢复业务\nAI 自动化要求\n• 有将大模型 API、AI 编程工具或 Agent 接入实际工作流的经验，能展示具体案例\n• 能通过 API / MCP 对接监控、日志、工单等运维系统，理解权限控制与敏感数据处理\n• 能区分确定性脚本任务与需 AI 辅助判断的任务，并验证 AI 生成的命令与结论\n• 为自动化操作设置审批、超时、重试、审计和回滚机制，高风险操作需人工确认\n• 能评估自动化效果：误报率、处置成功率、恢复时间、节省工时及模型调用成本\n加分项\n• Ansible、Terraform 实际使用经验\n• 自动巡检、故障自愈、运维机器人或内部运维平台建设经验\n• RAG 运维知识库、Agent 工作流或本地模型部署经验", "cat": "技术开发"}, {"id": "354", "title": "AI自动化工程师", "salary": "20-25K", "location": "", "jd": "### 岗位职责\n  1. 梳理各部门高频、重复和耗时的工作流程。\n  2. 设计并开发AI工具、Agent、自动化工作流和知识系统。\n  3. 连接大模型与内部系统、数据库、文档及第三方平台。\n  4. 建立人工审核、权限、重试、日志、监控和回退机制。\n  5. 评估准确率、完成率、成本、响应时间和人工接管率。\n  6. 推动工具在团队中落地，并沉淀SOP、组件和使用规范。\n  ### 任职要求\n  1. 2年以上软件开发经验，能够独立完成工具或业务系统上线。\n  2. 熟悉前后端、数据库和部署，掌握Python、TypeScript、Java或Go之一。\n  3. 有大模型API、RAG、工具调用或Agent工作流实战经验。\n  4. 能解决模型不稳定、调用失败、延迟和成本控制问题。\n  5. 具备产品和流程意识，能够量化节省工时、使用率及维护成本。\n  6. 理解权限、隐私和数据安全，能够深入业务并推动使用。\n  ### 加分项\n  有n8n、Dify、LangGraph、MCP或RPA经验；做过内容生产、知识库、客服或研发提效产品；具备模型评测、浏览器自动化、本地模型部署或长期运行的内部AI产品经验。", "cat": "技术开发"}, {"id": "355", "title": "产品增长运营（SEO/GEO方向）", "salary": "15-25K", "location": "", "jd": "### 岗位职责\n  1. 研究海外市场、竞品、关键词和搜索意图，持续发现产品及内容机会。\n  2. 负责SEO与GEO（生成式引擎优化），包括站点结构、技术SEO、内容规划、主题集群、结构化数据及AI搜索曝光。\n  3. 跟踪关键词排名、自然流量、搜索收录、AI引用及最终转化效果。\n  4. 与研发、设计协作，推动产品从调研、上线到持续迭代。\n  5. 探索社区、联盟、内容合作和广告等海外获客渠道。\n  6. 优化注册、激活、留存、订阅和付费转化漏斗。\n  7. 设计增长实验，评估转化率、收入、成本和投入产出比。\n  8. 使用AI完成关键词聚类、内容生产、用户分析和运营自动化。\n  ### 任职要求\n  1. 2年以上产品、增长、SEO或海外运营经验，完整负责过增长项目。\n  2. 有SEO实战经验，熟悉搜索意图、内容策略、站内优化、外链及效果分析。\n  3. 理解GEO基本方法，关注Google AI Overviews、ChatGPT等AI搜索和问答入口。\n  4. 能根据数据判断自然流量质量，而非只关注收录量和访问量。\n  5. 熟悉用户转化漏斗，会使用分析工具；掌握SQL或类似数据查询能力。\n  6. 能面向英文市场开展内容和增长工作。\n  7. 执行力和结果意识强，能够亲自制作内容、配置页面并推进实验。\n  ### 加分项\n  有内容、社交、订阅、工具或泛娱乐产品经验；熟悉Google Search Console、GA、Ahrefs或Semrush；做过程序化SEO、结构化数据、外链建设、数字公关或AI搜索曝光监测；有从零获得海外自然流量或收入的经历。", "cat": "运营与市场"}, {"id": "356", "title": "动漫中级运营", "salary": "10–20K", "location": "", "jd": "中级运营（内容 / 社区 / 社媒方向）\n\n薪资范围：10–20K\n\n岗位职责\n\n1. 负责动漫、漫画内容平台的日常运营，围绕业务目标制定并执行运营计划，提升内容消费、用户活跃与留存。\n2. 结合平台内容、用户兴趣及热点趋势，开展内容选题、推荐、专题和活动策划，提升优质内容的曝光与用户参与度。\n3. 负责社区及社群运营，通过话题互动、活动策划和用户激励等方式，维护社区氛围，促进用户交流，挖掘和维护核心用户。\n4. 参与 X（Twitter）、Telegram等渠道的内容发布、用户互动及推广，结合不同渠道的特点优化运营方式，提升品牌曝光与平台引流效果。\n5. 跟踪内容表现、用户行为及活动数据，定期复盘，持续优化运营策略，支持用户增长、留存及付费转化。\n6. 与产品、设计、研发等团队协作，整理用户反馈，推动运营需求落地，改善用户体验。\n\n任职要求\n\n1. 具备 2 年及以上互联网运营经验，有内容平台、社区或泛娱乐产品相关经验者优先。\n2. 具备良好的内容判断力、文案表达及策划能力，能够根据平台特点和用户偏好调整内容与沟通方式。\n3. 理解用户增长、活跃、留存和转化的基本逻辑，能够独立完成运营项目的策划、执行与复盘。\n4. 具备基础数据分析能力，能使用 Excel 等工具整理和分析运营数据，并提出可执行的优化方案。\n5. 主动性和执行力强，具备良好的沟通协作能力，能合理安排工作优先级并推动项目落地。\n\n加分项\n\n• 喜欢动漫、漫画，熟悉二次元文化、相关热点及用户兴趣。\n• 有 X（Twitter）、Telegram 等社媒或社群运营经验，有内容传播、用户增长或引流案例。\n• 了解 SEO，有关键词研究、内容优化或自然搜索流量增长经验。\n• 熟悉 AIGC 工具，能用于内容创作、图片或视频制作，提升运营效率。\n• 有内容付费、会员订阅或其他商业化运营经验。\n\n欢迎在投递时附上运营案例、账号链接或作品，并简要说明个人职责及项目成果。", "cat": "运营与市场"}, {"id": "357", "title": "中高级产品运营", "salary": "10K-30K", "location": "", "jd": "负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的视频产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营与市场"}, {"id": "358", "title": "AI短剧编剧（兼选题、角色设定）", "salary": "12-20k", "location": "", "jd": "岗位职责\n1. 跟踪短剧、网文、漫画及社交平台热点，建立题材库和选题储备库。\n2. 结合目标用户、平台特点和商业化方向，完成竞品拆解及选题判断。\n3. 输出选题方案，明确受众、核心卖点、题材类型、主要冲突和差异化亮点。\n4. 完成世界观、人物关系、角色小传及主要角色的性格、外形、身份、动机和成长线设定。\n5. 完成故事大纲、分集梗概和分集剧本，设计前三集钩子、情绪爆点、反转及集尾悬念。\n6. 负责人物对白、动作、表情和场景描述，保证人物行为逻辑及剧情前后统一。\n7. 结合AI生成能力控制人物数量、场景数量、复杂动作和特效难度，提升剧本落地效率。\n8. 根据剧本审核、分镜及成片反馈及时修改，并沉淀人物档案和剧情时间线。\n\n任职要求\n1. 2年以上短剧、网文、漫画、影视编剧或内容策划经验。\n2. 至少熟悉男频、女频、甜宠、逆袭、悬疑、都市等一种主流题材。\n3. 具备选题判断、故事结构、人物塑造、冲突设计和对白创作能力。\n4. 熟悉短剧前三集留人、强情绪推进、连续反转及集尾卡点逻辑。\n5. 能够独立完成角色设定、故事大纲及分集剧本。\n6. 了解AI生图、视频生成的能力边界，能够编写适合AI制作的剧本。\n7. 熟练使用ChatGPT、Claude等AI工具辅助调研、创作和一致性检查。\n8. 应聘时需提供选题方案、人物小传、剧本或已上线作品。", "cat": "内容与创作"}, {"id": "359", "title": "AI短剧分镜师", "salary": "15k-23k", "location": "", "jd": "岗位定位\n负责将审核通过的剧本转化为可直接执行的镜头方案，是文字内容与AI视觉制作之间的核心衔接岗位。\n\n岗位职责\n1. 将分集剧本拆解为标准分镜脚本和镜头清单。\n2. 明确每个镜头的景别、机位、构图、角色、动作、表情、台词、时长和运镜方式。\n3. 设计镜头衔接、人物调度、节奏变化和情绪呈现。\n4. 根据角色设定及场景设定输出镜头画面描述、参考图需求和提示词方向。\n5. 结合AI生图及视频工具的能力边界判断镜头可实现性，减少复杂群像、动作和运镜返工。\n6. 控制单集镜头数量和制作难度，平衡成片效果、制作周期和生成成本。\n7. 与编剧确认剧情表达，与视频生成岗位确认技术实现，与剪辑岗位确认成片节奏。\n8. 审核生成的关键帧和视频镜头，根据样片效果补充、替换或调整分镜。\n9. 沉淀常用景别、动作、运镜和提示词模板，提高后续制作效率。\n\n任职要求\n1. 2年以上影视、动画、漫画、广告、短视频或动态漫分镜经验。\n2. 熟悉景别、构图、轴线、机位、人物调度和镜头叙事。\n3. 能够独立将文字剧本转化为结构清晰、可制作的镜头表。\n4. 理解主流AI生图及视频生成工具的能力边界。\n5. 具备较强的画面想象力、节奏感和成本意识。\n6. 具备绘画能力，或能够使用AI工具快速制作分镜参考图。\n7. 有AI短剧、动态漫画、漫剧或批量内容生产经验者优先。\n8. 应聘时需提供分镜作品或现场完成指定剧本的镜头拆解。", "cat": "内容与创作"}, {"id": "360", "title": "AI视频生成师", "salary": "18k-25k", "location": "", "jd": "岗位职责\n1. 根据角色设定、场景设定和分镜要求生成角色图、场景图及镜头关键帧。\n2. 运用提示词、参考图、模型、LoRA和节点工作流控制人物、服装、场景及画风一致性。\n3. 完成人物换装、表情调整、局部重绘、扩图、换背景和细节修复。\n4. 根据分镜完成图生视频或文生视频，实现人物动作、表情变化、镜头运动和环境变化。\n5. 处理人物变形、五官漂移、肢体异常、多指、背景抖动、画面闪烁及道具错误。\n6. 根据生成结果调整首尾帧、提示词、模型和参数，提高镜头成功率及稳定性。\n7. 与分镜师确认镜头实现方案，根据剪辑及质检反馈完成补镜、延展和返修。\n8. 对图片和视频素材进行筛选、命名、归档及版本管理。\n9. 记录模型、提示词、参数、生成次数、成本和失败原因，持续优化标准工作流。\n10. 持续测试不同生图及视频模型，形成适合不同题材、动作和运镜的工具方案。\n\n任职要求\n1. 1年以上AI生图、AI视频、动画、视觉设计或影视后期经验。\n2. 熟练使用至少一种主流AI生图工具及一种AI视频生成工具。\n3. 熟悉ComfyUI或其他节点式工作流。\n4. 熟悉LoRA、ControlNet、IP-Adapter、局部重绘、首尾帧控制等方法。\n5. 具备基础美术、构图、色彩、光影、镜头和人物动作判断能力。\n6. 能够解决角色一致性、场景一致性、画风漂移和视频稳定性问题。\n7. 具备较强的测试、复盘和成本意识，能适应批量生产及多轮返修。\n8. 应聘时需提供AI图片、AI视频作品及对应工具和工作流说明。", "cat": "内容与创作"}, {"id": "361", "title": "AI短剧配音师/音频制作", "salary": "18k-25k", "location": "", "jd": "岗位职责\n1. 根据人物年龄、性格、身份和情绪设计声音方案，建立角色声线档案。\n2. 使用真人或AI配音工具完成台词配音，保证角色声音前后一致。\n3. 根据剧情调整语速、停顿、重音、语气和情绪强度。\n4. 处理错读、吞字、机械感、情绪不符、音量不一及口型不同步问题。\n5. 完成音频降噪、剪切、音量统一和基础混音。\n6. 根据剧情需要配置环境音、动作音效及基础背景音乐建议。\n7. 与编剧确认台词含义，与剪辑确认节奏、口型和音画同步。\n8. 管理声音模型、音频素材、授权记录和版本文件，避免声音及音乐侵权。\n9. 根据质检反馈及时完成补录、替换及音频返修。\n\n任职要求\n1. 1年以上配音、音频制作、短剧后期或AI语音生成经验。\n2. 具备良好的语言表达、人物理解和情绪判断能力。\n3. 熟悉至少一种AI配音工具及基础音频编辑软件。\n4. 能够调整语速、停顿、重音、音色和情绪参数。\n5. 具备基础降噪、剪辑、混音和音量标准化能力。\n6. 对声音一致性、口型同步和音频版权风险具有较强敏感度。\n7. 有短剧、动画、有声书、游戏角色或多角色配音经验者优先。\n8. 应聘时需提供配音或音频制作作品。", "cat": "内容与创作"}, {"id": "362", "title": "AI短剧剪辑师", "salary": "10k-15k", "location": "", "jd": "岗位职责\n1. 根据剧本和分镜筛选镜头并完成粗剪、精剪和成片输出。\n2. 调整剧情节奏、人物情绪、镜头停留时间、转场和集尾卡点。\n3. 整合配音、背景音乐、环境音和关键音效，保证音画节奏统一。\n4. 完成字幕制作，检查错字、漏字、称谓、时间轴和字幕可读性。\n5. 处理画面比例、基础调色、转场、包装和平台规格适配。\n6. 识别缺失镜头、剧情断点、动作不连续及情绪不连贯问题，并提出补镜需求。\n7. 检查黑帧、跳帧、闪烁、人物变形、画面穿帮、音画不同步及音量异常。\n8. 根据审核和质检意见完成修改，并输出不同平台需要的尺寸、码率和格式。\n9. 管理剪辑工程、素材引用、成片版本和交付文件，保证可追溯。\n10. 结合完播率和用户流失节点复盘剪辑节奏，持续优化成片模板。\n\n任职要求\n1. 2年以上短剧、短视频、动画、影视或信息流视频剪辑经验。\n2. 熟练使用Premiere、DaVinci、Final Cut、剪映等至少一种剪辑工具。\n3. 对剧情节奏、人物情绪、声音表达和集尾悬念有较强判断。\n4. 具备字幕、配乐、音效、基础调色和画面包装能力。\n5. 能够识别AI视频常见的变形、跳变、闪烁和连续性问题。\n6. 工作细致，具备较强的质量意识和版本管理意识。\n7. 了解不同平台的视频规格及音乐、字体、声音等素材版权风险。\n8. 应聘时需提供完整短剧、动画或剧情类成片作品。", "cat": "内容与创作"}, {"id": "363", "title": "LLM 应用研发工程师", "salary": "20-35k", "location": "", "jd": "LLM应用研发工程师\n岗位职责\n1. 图像与视频生成：基于 ComfyUI 搭建生图、生视频工作流，完成文生图、文生视频、图生视频、视频插帧等任务，支持内容批量生产。\n2. 人物一致性与画面优化：实现视频换头、换脸及人物一致性控制，优化人脸对齐、特征融合与时序连贯性，修复人物变形、画面闪烁等问题。\n3. 工作流沉淀与自动化：沉淀提示词模板、LoRA 配置与工作流 SOP，使用 Python 完成调试、批量处理及业务接口对接，提升生成效率并控制算力成本。\n4. 业务效果迭代：根据业务反馈持续优化内容质量，配合完成 AI 角色相关的图像、视频内容生成与交付。\n任职要求\n1. 具备 1–3 年 AIGC 图像或视频生成实战经验，能独立完成工作流搭建、效果调优与内容交付，学历不限。\n2. 熟练使用 ComfyUI，能够独立搭建、调试复杂工作流；熟悉 Stable Diffusion、FLUX、LTX 系列等模型，掌握 ControlNet、LoRA 的应用。\n3. 熟悉人脸检测、对齐及图像融合方法，了解 MTCNN、RetinaFace 等工具，能够处理人物一致性和视频连贯性问题。\n4. 具备基础 Python 编程能力，能够进行工作流调试、接口调用与批量任务处理。\n5. 具备画面审美和内容质量判断能力，会使用剪映或 Premiere 完成基础剪辑与后期处理。\n6. 需提供本人参与的作品或落地案例，说明使用的模型、工作流、个人负责部分及解决的具体问题。\n加分项\n- 有视频换脸、数字人或 AI 角色内容批量生产经验。\n- 有 LoRA 训练、数据集整理或开源模型 GPU 部署与性能优化经验。\n- 有 LLM 应用经验，能够将 Prompt、Agent 工具调用或 RAG 与内容生成工作流结合。\n- 有 ComfyUI 自定义节点开发、TTS 语音生成或音画同步经验。\n- 熟悉二次元、网文、AI 陪伴或海外成人向互动娱乐内容，能够理解相关业务需求。", "cat": "技术开发"}, {"id": "364", "title": "高级 UI/UX 设计师（交友 / 社交方向）", "salary": "22-35k", "location": "", "jd": "【岗位职责】\n1. 主导 App 与网站的介面与体验设计，定义整体设计方向\n2. 从零建立并管理设计系统，确保可扩充性与跨端一致性\n3. 主导用户研究、资讯架构与流程设计，透过数据与可用性验证（含 A/B 测试）推动决策\n4. 独立产出高品质视觉与平面素材（H5 banner、封面、行销物料），把关团队整体设计品质\n5. 与 PM、工程师、运营等跨部门协作，推动设计落地\n\n【任职要求】\n1. 5 年以上 UI/UX 设计经验，能独立主导项目并定义设计方向\n2. 须提供作品集（Portfolio），需含主导的完整产品专桉，及设计系统建置桉例\n3. 设计相关科系毕业，或具同等实务经验\n4. 具备强系统感与设计判断力，能决策设计方向与优先顺序\n5. 精通 Figma，能建立可扩充、语意化的设计系统并落地，含 Library 管理与版本控管\n6. 完整 UX 功底：用户研究、资讯架构、流程设计、可用性验证与 A/B 测试\n7. 能撰写设计规范与设计决策文件，建立并优化团队设计流程\n8. 熟悉全栈 iOS / Android / RWD 介面设计与进阶互动原型\n9. 具备扎实平面设计能力，精通 Photoshop / Illustrator\n10. 能运用 AI 工具（AI 生成图、Figma AI、Claude 串接 MCP 等）提升设计与交付效率\n11. 具设计提桉与向上沟通能力，能向利害关係人说明并说服设计决策\n12. 具商业思维，能将商业目标转化为设计策略；能指导并提升团队设计水准\n13. 抗压性佳，能在快节奏迭代下维持设计品质\n\n【加分条件】\n\n・HTML/CSS\n\n・付费内容 / 社群平台设计经验\n\n・成人产业隐私与金流体验设计经验\n\n・暗色模式与多语系介面经验\n\n・国际化合规", "cat": "内容与创作"}, {"id": "365", "title": "供给增长运营专员", "salary": "20-30k", "location": "", "jd": "岗位职责\n资源挖掘与触达：通过社交 App（陌陌、Soul 等）、社群、内容平台、招募/兼职群等多平台多渠道，主动挖掘并触达陪玩、伴游、向导、网红、模特等供给资源。\n评估、洽谈与签约：对意向资源做初步评估与筛选，沟通讲解合作模式，完成洽谈与线上签约，持续扩充供给规模。\n资源维护与激活：维护已签约资源关系，用资源、分成、成长路径等卖点吸引并留住优质供给，保持其活跃与履约。\n线上获客渠道运营：拓展并运营短视频投流（抖音/快手等）、CPA/CPS 联盟、站长换量、达人/代理、社群等线上渠道，获取有陪玩/伴游需求及喜欢线上擦边社交的精准用户。\n私域承接与复购：将公域流量沉淀进私域，做社群运营、客户分层、促活与促复购，提升用户价值与生命周期贡献。\n渠道开发与测试：持续开发新的线上资源与获客渠道，做渠道测试与效果评估，保留优质渠道、淘汰低质渠道。\n资源库与台账管理：建立资源库、渠道台账与标签体系，沉淀可复用的资源与渠道资产。\n数据复盘与反作弊：监控资源数量与质量、获客成本（CPA）、付费转化、复购等核心指标，做归因分析、识别假量水量、优化预算。\n风控与协作：把控线上渠道与账号安全（防封号、防渠道失效），与产品、运营、资源 BD 团队协同推进。\n\n任职要求\n线上资源获取实战（硬性要求）：做过通过线上渠道挖掘、招募、签约供给资源（主播/达人/网红/模特/陪玩/伴游等），或线上获客的工作，并拿过结果。\n自带线上资源/渠道者优先：手握可直接动用的线上供给资源或获客渠道，进来即能产出。\n熟悉渠道玩法：多平台线上挖掘签约、短视频投流、CPA/CPS 联盟、站长换量、社群/私域裂变等。\n数据驱动 + 反作弊：对数据敏感，会做漏斗、归因与 ROI 分析，能识别联盟假量水量、把控渠道质量。\n过往业绩：简历需体现可量化的成果（签约资源数量、新增规模、获客成本、付费转化、复购等具体数字与优化幅度），并能讲清自身贡献。\n软性素质：沟通谈判强、嗅觉敏锐、执行力强、抗压。\n强烈优先：有娱乐经纪、直播公会、主播/达人招募、MCN，或陪玩、伴游、同城社交、交友、擦边社交类产品的线上渠道、招募或获客经验者。\n对擦边/灰色业务无顾虑。\n\n注：学历、年限不作硬性限制，以线上资源获取与转化成绩为准。", "cat": "运营与市场"}, {"id": "366", "title": "运营经理 （高级运营（成人、交友、AI）", "salary": "22-35k", "location": "", "jd": "负责社交/社区/成人向产品的运营与商业化，对核心经营指标负责。\n核心要求：数据导向 + 强实操——能自己取数、自己下场、用数据拿结果。\n\n岗位职责：\n\n主导产品整体运营策略与体系建设，对 DAU、留存、付费率、ARPU、营收/流水负责；每个指标有目标、有拆解、有周期复盘，涨跌能归因到具体动作。\n亲自操盘用户全生命周期（拉新→激活→留存→付费→召回），搭建分层、成长、激励、付费、召回机制，并落地执行、盯盘数据、快速迭代。\n设计并迭代会员、礼物、虚拟消费、私密内容付费解锁、订阅等变现玩法；针对大 R（高价值/重氪用户）做专属运营与维系，用数据定价格、定权益、定节奏。\n建设用户标签体系，跑 A/B 测试，做漏斗诊断与转化归因，基于数据制定并动态调整策略——结论用数据说话，不拍脑袋。\n亲手策划并落地运营活动，结合擦边/成人流量特点做私域承接与渠道运营（不依赖主流投放平台）；统筹成人向 IP、擦边网红 / 达人合作与跨团队资源，对重点项目与活动 ROI 负责。\n紧跟擦边/成人/AI C端/社交社区行业的玩法与趋势，把被验证有效的打法快速搬进来试、用数据验证后保留或淘汰。\n沉淀运营方法论与 SOP，指导初级运营，提升团队执行效率。\n\n任职要求：\n\n强实操：独立操盘过完整运营线或核心业务（用户线 / 付费线 / 某社交场景），从策略制定到落地执行真正拿过结果。\n数据导向（硬性）：能自己取数（SQL / BI 看板）、搭建指标与标签体系、设计 A/B 测试、做漏斗诊断与转化归因。\n突出业绩：做出过可量化的规模化成果（DAU、留存、付费率、营收/流水达行业可观量级），并能讲清自身关键作用。\n行业背景（以下之一即可）：擦边社交（如陌陌 / 探探 / Soul 类）、成人向、AI C 端产品、社交社区 / 语聊 / 直播；或伴游、楼凤、网聊、陪玩等成人/擦边服务赛道，有实际 C 端运营经验即可。\n熟悉社交/社区的用户增长与商业化：虚拟消费、会员、大 R、礼物打赏、私域。\n对擦边/成人向内容与业务无顾虑。\n工作效率高，推动力强，抗压能力好。\n\n注：学历、年限不作硬性限制，以操盘能力、实操与数据结果为准。\n\n加分项：\n有擦边社交、成人向、直播打赏、语聊、网聊、陪玩、伴游、楼凤、AI 陪伴等赛道的操盘经验。\n有 AI C 端 / AIGC 类产品的运营经验。\n有出海或海外华人市场运营经验。\n带过小团队或主导过跨团队项目。", "cat": "运营与市场"}, {"id": "367", "title": "运营经理（高级网站运营）", "salary": "18K-28K", "location": "", "jd": "岗位职责\n1.负责网站整体运营工作，制定并落地网站运营策略，对新增用户、活跃用户、留存率、自然流量、转化率等核心业务指标负责。\n2.负责网站内容生态建设，包括栏目规划、内容规划、专题策划及运营策略制定，持续提升内容质量、用户体验及网站竞争力。\n3.负责网站核心页面（首页、频道页、详情页、专题页、搜索页、活动页等）的运营规划及持续优化，提升页面点击率、访问深度、停留时长及转化效果。\n4.建立网站数据分析体系，持续监控流量、用户行为、内容表现、SEO表现及业务指标，定期输出数据分析报告及优化建议。\n5.基于数据分析持续优化用户增长、用户留存、内容消费及转化路径，推动网站核心指标持续增长。\n6.制定网站内容运营策略，建立内容生产、审核、发布、更新及生命周期管理机制，持续提升内容价值及运营效率。\n7.配合 SEO 团队制定搜索流量增长策略，负责关键词规划、专题布局、内容优化、内链建设、页面结构优化及搜索体验提升，推动自然流量增长。\n8.与产品、研发、设计团队协同推进网站功能优化、后台工具建设、运营自动化及用户体验优化，提高整体运营效率。\n9.建立网站运营规范及 SOP，包括内容发布规范、页面检查机制、数据监控机制、质量管理机制及运营复盘体系。\n10.持续开展竞品分析及行业研究，跟踪行业动态、搜索趋势及用户需求变化，输出运营策略及产品优化建议。\n11.策划并推动专题活动、频道运营、榜单推荐、热点运营、内容合集等增长项目，提升网站流量、用户活跃度及内容传播效果。\n12.建立网站运营预警机制，及时发现流量异常、内容异常、SEO异常及用户行为变化，并推动相关团队快速完成问题闭环。\n13.统筹跨部门项目，协调产品、技术、SEO、设计、内容等团队资源，保障重点运营项目按计划交付并达成业务目标。\n14.定期输出网站运营日报、周报、月报及专项分析报告，为业务决策提供数据支持，并持续沉淀运营方法论。\n15.持续探索 AI 工具、自动化运营及数据化管理能力，不断提升网站运营效率和团队交付能力。\n\n岗位要求\n\n1.3 年以上网站运营、平台运营、内容运营、增长运营等相关经验，具备独立负责网站运营项目经验。\n2.熟悉网站整体运营体系，能够独立制定运营策略、拆解业务目标并推动项目落地。\n3.熟悉 CMS、网站后台及页面配置，具备栏目规划、专题运营、内容管理及页面优化经验。\n4.具备优秀的数据分析能力，熟悉新增、DAU、PV、UV、CTR、CVR、留存率、跳出率、用户路径等核心运营指标，并能够通过数据驱动业务优化。\n5.熟悉 Google SEO 运营体系，理解关键词规划、页面结构、内容优化、内链建设、Schema、收录机制及自然流量增长逻辑。\n6.具备网站增长思维，熟悉用户增长、内容增长及搜索增长策略，能够独立制定增长方案并推动落地。\n7.具备较强的项目管理能力，能够统筹多个运营项目，合理协调资源并确保项目按计划完成。\n8.具备优秀的问题分析及解决能力，能够快速定位业务问题并提出可执行的优化方案。\n9.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Looker Studio 等数据分析工具，能够独立完成数据分析及业务复盘。\n10.熟练使用 Excel、Google Sheets、飞书表格等办公工具，能够建立数据模型及运营报表。\n11.具备优秀的沟通协调能力，能够高效协同产品、研发、SEO、设计及内容团队推进项目落地。\n12.具备较强的学习能力和业务敏感度，持续关注行业趋势、搜索算法及用户需求变化。\n13.具备2年以上团队管理经验，有网站运营团队、内容运营团队或项目团队管理经验，能够进行目标拆解、任务分配、绩效管理及团队培养，推动团队高效达成业务目标。\n\n加分项\n\n1.有大型内容平台、社区平台、资讯平台、聚合平台或流量站运营经验。\n2.有海外中文网站、Google SEO 流量站或海外互联网产品运营经验。\n3.有多站点、矩阵站点或国际化网站运营经验。\n4.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Ahrefs、SEMrush、Screaming Frog、Looker Studio 等工具。\n5.有网站增长、SEO增长、内容增长或用户增长成功案例，能够量化展示业务成果。\n6.熟悉 AI 工具在网站运营中的应用，具备内容生成、数据分析或运营自动化实践经验。\n7.熟悉 SQL、Python、Shell 等工具，可进行数据分析、运营自动化及批量处理。\n8.有 Telegram、Twitter（X）、Facebook、Reddit、Discord 等海外渠道运营经验。\n9.有产品运营、商业化运营、团队管理或跨部门项目管理经验。\n\n我们希望你具备\n\n1.具备网站整体运营思维，能够从业务目标出发制定运营策略。\n2.结果导向，对流量增长、用户增长、留存及转化等核心指标负责。\n3.数据敏感，能够通过数据分析发现问题并持续优化业务表现。\n4.具备较强的项目管理能力，能够统筹资源推动重点项目落地。\n5.关注用户体验，持续优化内容质量、页面结构及用户访问路径。\n6.主动发现问题，能够独立提出解决方案并推动闭环执行。\n7.具备优秀的跨团队沟通能力，与产品、研发、SEO、设计及内容团队高效协作。\n8.保持学习和创新意识，持续关注行业趋势、AI 工具及运营新模式。\n9.善于复盘总结，沉淀运营方法论，持续提升团队运营效率。", "cat": "运营与市场"}, {"id": "368", "title": "编辑专员", "salary": "8k-12k", "location": "", "jd": "岗位职责\n\n1. 负责黑料、吃瓜、八卦类内容整理和原创编辑。\n2. 根据 TG、推特、黑料网站等渠道，跟进热点并及时产出内容。\n3. 负责标题、简介、正文、封面、图片/视频基础处理。\n4. 能独立完成素材分类、内容包装和发布前检查。\n5. 每月按指标完成内容产出，对内容质量负责。\n\n 任职要求\n\n1. 最好有成人内容、黑料、吃瓜、八卦类相关经验\n2. 平时喜欢看片，经常刷 TG、推特、黑料网站。\n3. 文案能力强，能把素材整理成有看点的内容。\n4. 会基础剪辑、封面制作、图片处理、批量压缩。\n5. 能自己找素材、做分类，并完成原创内容输出。\n6. 有黑料写手、TG 频道、推特运营经验优先。\n\n 简历筛选重点\n\n1. 对成人行业了解，能接受成人行业。\n2. 重点了解是否经常刷 TG、推特、黑料网站。\n3. 看文案编辑能力和热点敏感度。\n4. 确认是否会剪辑、封面制作、批量压缩。\n5. 有黑料写手经验优先。", "cat": "内容与创作"}, {"id": "369", "title": "中级运营（数据分析师）", "salary": "16K–28K", "location": "", "jd": "岗位职责\n\n1. 负责公司核心业务的数据分析工作，建立和完善数据分析体系、指标体系及数据监控机制，为业务决策提供数据支持。\n2. 深入分析用户、产品、运营、销售及市场等业务数据，识别业务增长机会、风险及关键影响因素，输出具有业务价值的分析报告和优化建议。\n3. 主导专题分析项目，包括用户增长、留存分析、转化漏斗分析、渠道效果分析、经营分析、用户画像及 A/B Test 效果评估，推动业务持续优化。\n4. 搭建并维护 BI 看板、经营分析报表及数据可视化平台，持续提升数据分析效率和数据质量。\n5. 与产品、运营、市场、研发等团队紧密合作，深入理解业务需求，推动数据驱动的产品优化、运营策略及业务决策落地。\n6. 参与数据仓库、数据模型及指标口径建设，优化数据分析流程，提升数据治理能力。\n\n任职要求\n\n1. 本科及以上学历，统计学、数学、计算机、信息管理、经济学等相关专业。\n2. 5 年及以上数据分析相关工作经验，有互联网、Web平台、社交产品、电商行业经验者优先。\n3. 精通 SQL，具备复杂数据查询、数据建模及性能优化能力。\n4. 熟练使用 Python（Pandas、NumPy 等）进行数据分析，能够独立完成数据处理及专题分析。\n5. 熟悉 Power BI、Tableau、Looker、FineBI 等至少一种 BI 工具，能够独立搭建数据分析看板。\n6. 熟悉统计分析方法、A/B Test、漏斗分析、留存分析、用户画像等常用分析方法，具备较强的商业分析和数据洞察能力。\n7. 具备优秀的逻辑思维、沟通协调及项目管理能力，能够推动跨部门协作并促进分析成果落地。\n8. 具有较强的业务敏感度，能够将数据洞察转化为可执行的业务策略。\n\n加分项\n\n熟悉 Hive、Spark、ClickHouse 等大数据平台。\n具备数据仓库（Data Warehouse）、ETL 或数据治理经验。\n有预测分析、机器学习或推荐算法相关经验。\n有团队管理或大型数据分析项目负责人经验。", "cat": "运营与市场"}, {"id": "370", "title": "运营经理（流量（WEB）部副主管）", "salary": "20-35k", "location": "", "jd": "岗位职责\n1、负责网站整体运营管理，制定并落实网站运营策略，推动业务目标达成。\n2、负责网站内容运营、协助SEO优化、首页及频道页运营、专题策划等工作，持续提升网站流量及用户活跃度。\n3、负责网站核心数据监控与分析，包括新增用户、DAU、PV、UV、留存率、跳出率、收录量、关键词排名等，并制定优化方案。\n4、负责网站内容规划与运营规范建设，持续优化栏目结构、页面布局及用户体验。\n5、制定并执行Google SEO及站内SEO优化策略，推动网站收录、关键词排名及自然流量持续增长。\n6、协同产品、研发、设计等部门推进网站功能优化、需求迭代及项目落地，确保按计划交付。\n7、建立网站运营SOP、数据分析体系及工作流程，提高团队执行效率和运营质量。\n8、负责运营团队日常管理，包括工作安排、任务跟进、绩效考核、培训指导及人才培养。\n9、定期开展行业研究及竞品分析，结合业务目标提出运营优化方案。\n\n\n岗位要求\n\n熟悉网站运营全流程，具备独立负责网站运营项目经验。\n熟悉Google SEO、站内SEO及基础技术SEO知识。\n具备较强的数据分析能力，能够根据数据制定优化策略。\n熟悉内容运营、流量运营、用户运营及增长运营。\n能独立制定运营计划、项目推进方案及阶段性复盘。\n具备优秀的跨部门沟通协调及项目管理能力。\n\n加分项\n1、有Google、yandex SEO成功增长案例。\n2、有百万级以上流量网站运营经验优先。\n3、有资讯、视频、小说、漫画、社区等内容平台运营经验。\n4、有网站从0到1搭建或改版经验。\n5、有运营团队（5人以上）管理经验。\n6、有数据分析、A/B测试及增长运营经验。\n7、熟悉AI内容生产、自动化运营工具及工作流。\n\n我们希望你具备\n\n1、强烈的目标意识和结果导向，对业务增长负责。\n2、良好的逻辑思维能力，能够通过数据发现问题并提出解决方案。\n3、优秀的执行力和推动力，能够高效推进项目落地。\n4、较强的责任心，能够主动承担工作并持续优化流程。\n5、良好的团队管理能力，能够培养团队成员成长。\n6、优秀的沟通协调能力，能够高效协同产品、研发、设计等部门。\n7、持续学习能力，关注行业动态、新工具及运营方法论。\n\n试用期交付要求\n\n试用期内需完成：\n\n1、熟悉公司产品、网站业务及运营流程，了解各网站定位、运营模式及核心业务指标。\n2、对负责网站进行全面诊断，输出《网站运营分析报告》，至少提出20项可落地的优化建议（包含内容运营、SEO、页面体验、产品功能、数据分析等方向）。\n3、梳理当前网站运营流程，识别存在的问题，并提出优化方案及优先级。\n4、完成网站核心数据分析，建立基础运营数据看板，并形成日报、周报模板。\n5、制定未来1个月网站运营计划，包括内容运营、内容SEO优化、专题运营、用户增长等重点工作安排。\n6、推动至少1项运营优化需求或项目落地，并完成效果验证及复盘。\n7、与产品、研发、设计等相关团队建立协作机制，能够独立推进需求评审及项目跟进。", "cat": "运营与市场"}, {"id": "371", "title": "中级运营（资源供给运营（代理/聊手）", "salary": "12-22k", "location": "", "jd": "岗位类型：全职，合作（区域代理/夜店营销等）\n\n岗位职责\n1. 挖掘与签约：通过内容平台、达人社群、MCN 等多渠道主动挖掘触达优质内容创作者 / 达人 / KOL/酒吧/商k/夜场/伴游/地陪等资源，完成评估、洽谈与线上签约，持续扩充合规供给规模；\n2. 维护与激活：维护已签约创作者关系，用流量扶持、分成收益、成长路径等留住优质供给，保持其活跃与内容产出；\n3. 渠道运营与数据复盘：拓展并运营达人代理、MCN、商k/夜场/伴游/地陪，创作者社群等供给侧获取渠道，监控签约数量与质量、获取成本、留存产出等核心指标，做归因与 ROI 优化，并确保创作者与内容合规。\n\n任职要求\n1. 有创作者 / 达人 / 主播/商k/夜场/伴游/地陪招募签约或供给侧 BD 实战经验，并拿过可量化结果；\n2. 熟悉内容平台达人生态与签约玩法，数据敏感，会做漏斗、归因与 ROI 分析、把控渠道质量；\n3. 沟通谈判强、嗅觉敏锐、执行力强、抗压，简历能体现可量化成果（签约数、供给规模、获取成本、留存产出等）。\n\n加分条件\n1. 自带可直接动用的创作者资源或达人渠道，进来即能产出；\n2. 有 MCN、直播公会、达人经纪、内容平台创作者增长经验；\n3. 熟悉多平台线上挖掘签约、达人代理合作、商k/夜场/伴游/地陪/社群 / 私域裂变等供给侧玩法。", "cat": "运营与市场"}, {"id": "372", "title": "中级运营（网站内容运营）", "salary": "15-22k", "location": "", "jd": "网站内容运营\n岗位职责\n1、负责网站的日常运营与管理，对网站收录、关键词排名、流量增长及用户数据负责。\n2、制定并执行网站内容运营计划，规划选题方向和内容更新节奏，把控内容质量及上线审核。\n3、跟踪分析 GSC、GA4 等数据，定期输出运营报告，根据数据调整内容策略和优化方向。\n4、负责网站日常巡检与维护，及时发现和跟进收录异常、死链、页面速度等问题。\n5、关注行业动态与竞品网站，分析同行内容策略及增长打法，输出可落地的优化建议。\n6、协同 SEO、内容编辑、技术等团队，推动网站优化项目落地。\n任职要求\n1、2 年以上网站运营或独立站运营经验，有内容型网站（视频、漫画、小说、资讯等）运营经验优先。\n2、了解 Google SEO，Yandex 优化逻辑，熟悉影响收录和排名的核心因素。\n3、熟练使用 GA4、GSC、Ahrefs 等工具，具备良好的数据分析能力，能用数据驱动运营决策。\n4、会使用 ChatGPT、Claude 等 AI 工具提升工作效率。\n5、工作细致、责任心强，具备良好的沟通协调能力和执行力。\n加分项\n1、有海外网站、多语言网站或站群 / 精品站运营经验。\n2、有成人行业相关网站运营经验。\n3、有成功的网站流量增长案例。\n4、有内容团队管理或 SOP 搭建经验。", "cat": "内容与创作"}, {"id": "373", "title": "中级运营（网站产品运营）", "salary": "16k–25k", "location": "远程办公\n工作模式", "jd": "网站产品运营 | HC：1 | 全远程\n\n品牌：（面向英国、欧洲高端跨文化社交平台）\n\n岗位简介\n\n我们是聚焦欧洲市场的出海初创增长团队，核心成员拥有英国本地互联网运营经验，现阶段冷启动深耕英国、欧洲高端跨文化社交赛道。本岗位是自然流量增长核心岗：把搜索流量转化为注册用户与付费会员。\n核心硬性要求：具备英文PC/M网站站独立实操能力，熟悉欧洲用户搜索习惯，拒绝模板化套用；优先英国/欧洲/北美/澳洲留学经历或海外出海项目经验，英语可借助AI工具辅助产出，熟悉欧美澳年轻人网络黑话、社交语境，对海外文化高度感兴趣、学习意愿强；深度玩过各类海内外交友软件，自带产品洞察，是互联网重度冲浪选手，具备极强热点敏感度与网感。\n\n你的核心工作内容\n\n1. 英国&欧洲市场PC/M网站策略落地：结合海外交友用户真实行为习惯调研本地搜索意图，制定全域关键词布局方案；负责站内页面技术优化、监控Google收录、排名、流量数据，定期复盘搜索流量→注册→付费的全转化链路。\n\n2. 全站核心页面日常运营：维护首页、欧洲各城市落地页、Creator主页、视频页、品牌介绍页，结合社交产品用户浏览偏好优化页面结构，保障页面信息合规完整、适配Google收录规则；批量优化标题、Meta Description、内链结构。\n\n3. 三条英文内容线运营（本地化优先）\n\n◦ 博客线：紧跟海外情感、婚恋、社交热点，借助AI工具完成英文内容撰写后人工校对润色，贴合英式表达习惯，面向英国高净值本土用户，沉淀长期Google搜索权重；\n\n◦ 故事线：快速捕捉留学、跨文化交友全网热门话题，灵活运用欧美澳网络流行话术、年轻人常用黑话，产出匿名故事撬动社交分享长尾流量；\n\n◦ 问答线：结构化整理欧美交友用户高频搜索问题，全覆盖长尾关键词流量入口，文案风格贴合本地年轻人说话习惯。\n\n4. Creator档案全流程上架管理：基于平台用户喜好维护头像、封面、素材、简介、城市标签、活跃状态；严格遵循英国GDPR、欧盟内容版权与隐私法规，上架前全维度合规审核，全年无重大合规事故。\n\n必备任职要求\n\n1. 有相关SEO经验，懂欧美搜索引擎底层逻辑，可独立完成关键词调研、页面优化、收录问题排查，只会套用固定模板勿投；\n\n2. 具备基础英文读写能力，可熟练借助AI翻译、润色工具产出地道文案，能自主校对修正AI生硬表达；愿意主动学习欧美澳年轻人俚语、网络黑话，理解海外社交语境；\n\n3. 熟练使用Google Search Console、GA4等海外官方数据分析工具，能通过数据定位流量问题、迭代优化方案；\n\n4. 重度互联网冲浪，长期玩各类海内外交友、约会类软件，懂用户痛点、社交玩法与传播逻辑，能快速捕捉全网最新热点、流行玩法，具备天然网感；思想开放包容，对欧美、澳洲生活与社交文化抱有浓厚兴趣；\n\n5. 会基础图片裁剪、压缩、素材上传；具备极强合规意识，熟悉海外版权、用户隐私规范，工作严谨细致。\n\n优先加分项\n\n1. 拥有英国/欧洲/北美/澳洲留学经历，或海外市场本土网站完整实战案例；\n\n2. 有社交平台、创作者经济、海外留学社区、会员订阅制平台运营经验；\n\n3. 熟练运用AI工具批量产出内容，同时具备人工精细化校对能力，把控本地化内容质量。\n\n\n工作模式\n\n全远程灵活办公\n全国均可居家办公；日常国内作息即可，只需工作时段可与英国总部办公时间重合，同步海外流量节点迭代。\n \n无名海象已参与此文档。", "cat": "运营与市场"}, {"id": "374", "title": "中级运营（海外平台创作者运营）", "salary": "15k–22k", "location": "远程办公", "jd": "女性用户增长运营（交友平台｜小红书/私域｜全远程）\n\nHC：1｜国内全远程\n\n岗位简介\n\n我们正在打造一款面向英国及欧洲市场的高端 Dating & Lifestyle 平台。\n\n现阶段处于用户冷启动期，本岗位核心负责平台女性用户供给侧增长：通过小红书、社群、KOC/KOL、校园及私域等渠道持续获取目标女性用户，并完成从发现、触达、沟通、入驻到激活、留存和裂变的完整增长闭环。\n\n这不是单纯发内容的岗位，核心目标是：持续为平台带来真实、优质且活跃的女性用户。\n\n核心工作\n1，从0到1搭建女性用户招募渠道及增长漏斗，对有效入驻数量和质量负责；\n2，通过小红书、微信/留学群、女性社群、校园渠道、KOC/KOL及私域等方式寻找目标用户；\n3，策划招募内容、私信话术及合作方案，持续测试不同渠道的获客效果；\n4，主动进行一对一沟通，引导意向用户完成注册、资料提交及 Profile 完善；\n5，维护已入驻女性用户，提高活跃、留存及推荐裂变；建立渠道及用户数据看板，持续优化获客成本和转化效率；收集女性用户真实反馈，同步产品团队优化体验。\n\n我们希望你\n1，有用户增长、私域运营、女性社群、KOC/KOL招募、达人商务、校园推广或平台入驻运营相关经验；\n2，熟悉小红书，真正做过搜索获客、内容发布、私信触达或站外转化；\n沟通能力强，愿意主动找人、私信和长期跟进，不排斥高频一对一沟通；\n3，对年轻女性、留学生、Dating/Lifestyle 等用户圈层有较好的理解；\n数据和结果意识强，能自己找渠道、测试方法、复盘并拿到结果；\n国内全远程，不要求英语能力。\n\n加分项：有美妆、医美、模特、摄影、留学、女性社区、Dating/社交平台等相关用户资源或招募经验。", "cat": "内容与创作"}, {"id": "375", "title": "中级运营（海外私域流量运营）", "salary": "15k-22k", "location": "远程办公", "jd": "# 海外私域流量运营 | HC：1| 全远程\n\n品牌：（面向英国、欧洲高端跨文化社交平台）\n\n## 岗位简介\n\n我们正在寻找一位海外私域运营，负责平台用户的承接、转化、留存与复购。岗位核心不是单纯做曝光，而是围绕官网注册用户、咨询用户、付费用户和创作者线索，搭建一套稳定的私域运营体系，把站外流量和站内用户沉淀到可持续触达、可持续转化、可持续复购的私域池中。\n\n本岗位面向英国、欧洲市场，重点通过 WhatsApp、Telegram、Email、站内消息、社群群组、CRM 自动化触达 等方式，完成用户注册后的激活、会员转化、内容互动、创作者入驻跟进与流失召回。\n\n### 核心硬性要求\n\n* 有海外私域运营、用户运营、CRM 运营、社群运营或转化运营经验；\n* 熟悉欧美用户对私域触达、消息频率、隐私边界和沟通节奏的接受方式；\n* 能独立使用英文进行沟通，可借助 AI 工具提升写作与翻译效率，但需要自己判断语气和边界；\n* 熟悉 WhatsApp、Telegram、Email、Instagram DM、Facebook Group 等私域触达方式；\n* 理解英国、欧洲、北美或澳洲的留学生社群、跨文化社交和会员型产品的基本运营逻辑；\n* 具备较强的用户分层、标签管理、转化跟进和复盘能力；\n* 能接受 18+ 成人关系社交平台的业务属性，理解授权、隐私、合规与内容边界。\n\n## 你的核心工作内容\n\n### 1. 用户私域承接与转化\n\n* 承接来自官网、站外社媒、合作渠道和活动页的注册用户、咨询用户和高意向用户；\n* 按用户状态进行分层管理：新注册用户、浏览未注册用户、已咨询未付费用户、已付费会员、流失会员、创作者线索；\n* 通过站内消息、Email、WhatsApp、Telegram 等方式推动用户完成注册激活、首次互动、会员付费和持续留存；\n* 建立不同用户类型对应的话术、触达频率和转化节奏，避免过度打扰或低质量轰炸；\n* 跟进高意向用户的咨询、异议处理和付费推进，提升注册到付费的转化效率。\n\n### 2. CRM 标签体系与自动化运营\n\n* 搭建基础 CRM 标签体系，记录用户来源、城市、语言、兴趣、会员状态、互动偏好、内容偏好和活跃状态；\n* 设计欢迎语、激活提醒、未读消息提醒、会员到期提醒、内容更新提醒、创作者上新提醒等自动化触达；\n* 根据用户行为数据做分层触达，例如：注册后 24 小时未激活、浏览多次未注册、会员到期前提醒、沉默用户召回等；\n* 配合产品和技术团队优化触达链路，提升消息打开率、回复率和转化率；\n* 定期检查自动化流程，避免触达过密、重复触达或误发。\n\n### 3. 社群与私域池运营\n\n* 维护海外用户社群、留学生社群、会员群组和兴趣群组；\n* 通过群内话题、活动预告、内容分发、问答互动、会员福利和创作者动态，提高社群活跃度；\n* 负责社群规则、入群审核、群内秩序和基础风控；\n* 结合平台活动、创作者更新和内容节点，策划私域专属互动玩法；\n* 将社群中高意向用户导回站内会员体系、内容消费和创作者互动页面。\n\n\n## 必备任职要求\n\n1. 有私域运营、用户运营、CRM 运营、社群运营或转化运营经验；\n2. 具备较强英文沟通能力，能独立完成私信、邮件、社群消息和转化跟进；\n3. 对欧美用户、留学生社群、会员产品和跨文化沟通有基本理解；\n4. 熟悉 WhatsApp、Telegram、Email、站内消息或 CRM 工具中的至少一种；\n5. 能长期、细致地跟进用户状态，不怕重复沟通和多轮推进；\n6. 具备数据意识，能清楚记录来源、转化结果和留存情况；\n7. 能接受 18+ 成人关系社交平台的业务属性，理解授权、隐私与合规边界。\n\n## 优先加分项\n\n1. 有英国 / 欧洲 / 北美 / 澳洲留学经历，或熟悉当地社群生态；\n2. 有 Dating、会员制产品、社群产品、创作者平台或海外增长经验；\n3. 熟悉 WhatsApp、Telegram、Reddit、小红书、Instagram 等平台的社群管理和私域转化玩法；\n4. 能独立搭建基础私域分层、标签和跟进机制；\n5. 对英国本地高端人群、留学生群体和城市生活方式内容有敏感度；\n6. 有小规模社群、会员池、KOC 或博主合作经验。\n\n## 核心考核指标\n\n* 私域有效触达量与有效回复率；\n* 注册用户激活率与会员转化率；\n* 社群活跃度与复购率；\n* 创作者入驻线索转化率；\n* 用户召回率与流失挽回率。\n\n## 工作模式\n\n* 全远程灵活办公；\n* 全国均可居家办公；\n* 日常国内作息即可，但需要在关键时间段覆盖英国及欧洲活跃时段；\n* 与产品、站内运营、内容、增长和技术团队保持高频同步。", "cat": "运营与市场"}, {"id": "376", "title": "运营专员（视频剪辑专员）", "salary": "6k-10k", "location": "", "jd": "视频剪辑专员\n岗位职责\n\n1、根据平台内容定位、更新策略及用户需求，自主收集、筛选并整理相应的成人类视频资源。\n2、负责视频素材的剪辑、裁切、转码、画面调整、水印添加及基础包装，确保成片符合平台发布标准。\n3、使用 Photoshop 独立完成视频封面制作，包括素材处理、人物排版、标题设计及整体视觉优化。\n4、根据视频内容编写标题、简介等相关文案，准确匹配分类及标签。\n5、熟悉成人视频内容体系，能够准确判断不同题材、演员、剧情、场景及内容特征，避免分类和标签错误。\n6、结合平台数据、用户偏好及行业热点，持续优化选片、剪辑、封面和内容发布方向。\n7、按照平台要求完成视频质量检查，重点检查清晰度、音画同步、画面比例、水印、黑帧及内容完整性。\n8、负责素材归档、文件命名及资源管理，建立清晰、可追溯的视频素材库。\n9、配合内容运营团队完成视频批量处理、上传发布、内容调整及其他相关工作。\n10、遵守平台内容规范、版权要求及审核机制，及时处理不符合标准的素材。\n\n岗位要求\n1、具备视频剪辑相关经验，有成人内容平台、影视平台或短视频平台工作经验者优先。\n2、熟练使用 Premiere Pro、剪映等剪辑软件，能够独立完成完整的视频处理流程。\n3、熟悉 Photoshop，能够独立制作视频封面，并具备一定的排版、配色和视觉审美能力。\n4、能够接受成人内容工作环境，对成人类视频具备一定的理解和判断能力。\n5、熟悉常见成人视频题材、分类及标签，能够准确完成内容归类和标签匹配。\n6、具备较强的资源收集、筛选及整理能力，能够根据平台更新策略主动寻找合适内容。\n7、了解常见视频格式、分辨率、码率及画面比例，具备基础的视频质量判断能力。\n8、工作认真细致，具备较强的执行力、责任心及时间管理能力，能够按要求完成每日任务。\n9、具备良好的团队协作意识，能够及时沟通素材、剪辑及内容发布过程中出现的问题。\n\n加分项\n1、有成人视频、影视、短视频或内容平台剪辑经验。\n2、熟悉主流成人内容网站、资源渠道及行业热门内容趋势。\n3、了解 FFmpeg 或其他批量视频处理工具。\n4、具备批量剪辑、批量转码、批量加水印或自动化处理经验。\n5、有独立搭建素材库、分类体系或视频处理 SOP 的经验。\n6、具备较强的热点判断能力，能够根据用户偏好快速调整选片方向。\n7、有 AI 工作流使用经验，能够运用 ChatGPT、Claude、Gemini 等工具辅助资源整理、标题文案、分类标签、封面设计及批量视频处理；有相关自动化流程搭建经验者优先。\n8、有 Telegram（TG）频道运营经验，熟悉频道内容发布、资源整理、用户维护及基础数据统计者优先。\n\n我们希望你具备\n1、能够根据平台更新策略主动收集和筛选资源，而不仅是等待分配素材。\n2、能够独立完成从资源筛选、视频剪辑、封面制作到分类标签填写的完整流程。\n3、对成人内容分类和用户偏好有一定敏感度，能够准确判断视频的核心特点。\n4、具备基础审美和质量意识，能够持续优化画面、封面及内容呈现效果。\n5、能够在保证质量的前提下提高工作效率，按时完成批量内容生产任务。\n6、保持学习意识，持续关注行业趋势、剪辑方法、AI 工具及平台内容变化。", "cat": "内容与创作"}, {"id": "377", "title": "产品经理（中高级/高级 · 流量方向）", "salary": "20k-35k", "location": "", "jd"
