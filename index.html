营策略，围绕拉新、留存、转化、变现等核心指标推进落地\n2. 持续优化内容结构，提升点击率、留存率及付费转化\n3. 日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略\n4. 内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，优化内容结构（封面、标题、前3秒、标签等关键环节）建立可复用的内容生产标准与方法论\n5. 跨部门协作：与产品、技术、渠道等团队协同。推动内容相关功能优化与产品迭代", "cat": "内容与创作"}, {"id": "288", "title": "AI内容编辑（加急）", "salary": "10K – 20K", "location": "", "jd": "AI内容编辑（创作 / 漫改 / 魔改方向）\n\n岗位方向\n\n我们正在组建AI驱动的动漫、漫画内容团队。\n\n\n\n剧本内容由专门的剧本团队负责，本岗位主要负责将已有的剧本、分镜及内容创意，通过AI工具转化为动漫、漫画、短视频等视觉内容。\n\n\n\n我们不要求候选人一开始就具备非常完整的AI技术栈，更关注实际内容制作能力、基础视觉审美，以及对新工具、新工作流的学习和落地能力。\n\n\n\n有动漫、漫画、短视频、设计、AI创作等相关经验者优先考虑，其他类型经验如具备相关作品或较强学习能力，也可以投递。\n\n简历及作品要求\n\n投递时请提供简历及相关作品。\n\n\n\n作品形式不限，可以是：\n\n\n\nAI漫画、AI图片、AI短片；\n\n角色设计、场景设计；\n\n个人练习作品；\n\n商业项目或团队项目作品。\n\n\n\n不强制要求作品必须为独立完成，只要能够体现个人实际制作能力即可。\n\n\n\n如有以下内容，也欢迎一并提供：\n\n\n\nAI内容制作过程或工作流截图；\n\nComfyUI、Stable Diffusion等工具使用案例；\n\n个人运营的新媒体账号及相关作品数据。\n\n岗位职责\n\n根据剧本团队提供的脚本、分镜或内容需求，完成AI动漫、AI漫画、AI短视频等内容制作。\n\n\n\n使用AI绘图、AI视频等工具完成人物、场景及画面的生成、调整和优化，保证整体视觉效果符合项目要求。\n\n\n\n配合团队优化角色一致性、画面风格及内容呈现效果，提高内容制作效率。\n\n\n\n根据项目需要，对已有AI工作流进行使用、调整和优化。\n\n\n\n参与内容选题、IP方向及视觉风格讨论，从画面呈现及用户审美角度提供建议。\n\n\n\n持续关注AI绘图、AI视频领域的新模型、新工具及新玩法，并尝试应用到实际内容生产中。\n\n\n\n与剧本、运营及相关团队协作，根据反馈持续调整和优化内容。\n\n任职要求\n\n有AI绘图、AI视频、设计、动漫制作或其他相关内容创作实践经验，能够提供相关作品。\n\n\n\n使用过一种或多种主流AI创作工具，例如ComfyUI、Stable Diffusion、Midjourney、即梦、Kling、Vidu、Runway等。\n\n\n\n具备基本的图片或视频生成、调整能力，能够根据需求修改提示词、参数或现有工作流。\n\n\n\n对画面效果有基本判断能力，能够关注人物、构图、风格统一及内容呈现。\n\n\n\n学习能力较强，愿意主动学习新的AI模型、插件及内容制作方法。\n\n\n\n具备良好的沟通和协作能力，能够根据项目反馈及时调整作品。\n\n加分项\n\n有ComfyUI工作流搭建或优化经验。\n\n\n\n了解或使用过LoRA、ControlNet、IPAdapter等工具。\n\n\n\n有AI动漫短剧、AI漫画、条漫、漫改或小说改编项目经验。\n\n\n\n有角色一致性、批量出图、AI视频动态化等实际制作经验。\n\n\n\n会使用AE、Live2D、Blender、Nomad等设计或动画工具。\n\n\n\n有Python、自动化或批量内容处理经验。\n\n\n\n对动漫、漫画、二次元内容感兴趣，具备一定的视觉审美和内容判断能力。\n\n\n\n有二次元、新媒体、动漫账号运营经验，或对动漫、漫画、轻小说等内容趋势较为熟悉。", "cat": "内容与创作"}, {"id": "289", "title": "新媒体运营组长（加急）", "salary": "20k - 25k", "location": "", "jd": "\"必看项\n1. 负责公司二次元 / 动漫相关新媒体账号整体运营，统筹国内外主流社媒平台内容运营与账号增长，包括但不限于：B 站、微博、小红书、抖音、微信公众号、LOFTER（国内），以及 X（Twitter）、TikTok、Instagram、YouTube、Discord、Reddit（海外）。\n2. 负责策划并输出符合年轻用户审美的 ACG 内容，包括但不限于：动漫热点追踪、二创内容、meme 梗图、角色向内容、圈层热点话题；根据不同平台特性制定差异化内容策略，提升账号曝光、互动率与粉丝增长；可独立完成热点策划与内容传播全流程。\n3. 深度理解二次元用户生态与圈层文化，维护社区氛围，提升用户活跃度与粘性；快速追踪 ACG 热点与用户情绪变化；与 UP 主、Coser、绘师、KOL 等建立并维护合作关系，扩大内容影响力。\n4. 带领运营团队推进内容项目，制定内容节奏与运营目标，根据数据反馈持续优化内容方向与传播策略，确保各平台账号持续健康增长\n\"\n\"3年以上新媒体运营经验，有团队管理经验优先；\n重度二次元用户，熟悉动漫、游戏、VTuber、Cosplay、同人文化等；\n网感强，懂年轻人表达方式和互联网语境；\n熟悉国内外主流社媒平台运营逻辑；\n有成功账号运营案例或爆款内容经验；\n具备优秀的内容策划与文案能力。\"", "cat": "运营与市场"}, {"id": "290", "title": "新媒体运营", "salary": "6k-10k", "location": "", "jd": "\"必须项\n简历➕运营数据或者案例\n运营过的账号案例\n 爆款内容链接\n 常用社媒平台ID（可选）\n 最喜欢的动漫/作品（加分项）\n 2年以上新媒体运营经验，有团队管理经验优先；\n 重度二次元用户，熟悉动漫、游戏、VTuber、Cosplay、同人文化等；\n 网感强，懂年轻人表达方式和互联网语境；\n 熟悉国内外主流社媒平台运营逻辑；\n 有成功账号运营案例或爆款内容经验；\n 具备优秀的内容策划与文案能力。\n加分项\n\n 有ACG、自媒体、动漫行业经验；\n 熟悉海外二次元社区文化；\n 有AIGC内容工具使用经验；\n 自己运营过账号；\n 懂梗、会玩梗、熟悉互联网亚文化。\"\n\"岗位职责\n\n 内容运营\n\n 负责公司二次元/动漫相关新媒体账号运营；\n 策划并输出符合年轻用户审美的内容，包括但不限于：\n\n   动漫热点\n   二创内容\n   meme梗图\n   角色向内容\n   圈层热点话题\n 根据不同平台特性制定内容策略，提升曝光、互动与粉丝增长；\n 独立完成热点策划与内容传播。\n\n\n\n 平台运营\n\n负责国内外社媒平台的内容运营与账号增长，包括但不限于：\n\n 国内平台\n\n B站\n 微博\n 小红书\n 抖音\n 微信公众号\n LOFTER\n\n 海外平台\n\n X（Twitter）\n TikTok\n Instagram\n YouTube\n Discord\n Reddit\n\n\n\n 用户与社区运营\n\n 深度理解二次元用户生态与圈层文化；\n 维护社区氛围，提高用户活跃度与粘性；\n 快速追踪ACG热点与用户情绪变化；\n 与UP主、Coser、绘师、KOL等建立合作关系。\"", "cat": "运营与市场"}, {"id": "291", "title": "AI动漫短剧编剧", "salary": "10k-25k", "location": "", "jd": "AI动漫短剧编剧（小说改编方向）\n\n岗位介绍\n\n本岗位主要负责公司AI动漫短剧项目的剧本创作与小说改编工作。\n\n\n\n公司会提供已有小说、网文内容及基础项目方向，无需自行寻找内容来源。你需要结合AI动漫短剧的内容形式，对原有小说进行故事拆解、人物关系梳理、剧情取舍、节奏调整、结构重组及分集改编，最终输出具备实际制作可行性的短剧剧本。\n\n\n\n岗位核心工作以小说/网文改编为主，需要将篇幅较长、信息量较大的原著内容，转化为节奏更快、冲突更集中、画面表达更明确的AI动漫短剧内容。\n\n\n\n我们不要求候选人必须拥有成熟的AI动漫项目经验，更关注你的故事理解能力、剧情改编能力、短剧节奏感及持续学习能力。\n\n\n\n有短剧、网文、小说、漫画脚本、动漫剧情、影视、剧情短视频、游戏剧情等相关创作经验均可。\n\n岗位职责\n\n阅读并理解公司提供的小说、网文内容，快速梳理主要人物、人物关系、故事主线、核心冲突及内容卖点。\n\n\n\n根据AI动漫短剧的内容形式，对原小说进行剧情取舍、结构调整、节奏优化及适当重构。\n\n\n\n结合项目篇幅，对原著中的支线剧情、人物及事件进行合理删减、合并、前置或调整，使核心剧情更加集中。\n\n\n\n完成故事梗概、人物小传、分集大纲及完整分集剧本创作。\n\n\n\n将小说中的叙述、心理活动、背景介绍等文字内容，转化为具体的场景、人物动作、对白及可视化剧情表达。\n\n\n\n结合不同题材及目标受众，设计具有吸引力的开篇、冲突、爽点、情绪节点、反转、悬念及结尾钩子。\n\n\n\n在保证原故事核心设定和人物逻辑的基础上，对不适合短剧表达的内容进行合理改编。\n\n\n\n配合项目负责人，根据审核及制作反馈，对剧本内容进行修改和优化。\n\n\n\n逐步了解AI动漫制作的基本特点，在创作过程中兼顾人物数量、场景复杂度、动作设计及画面实现难度。\n\n\n\n与项目、制作等团队保持沟通，按计划同步创作进度及可能影响交付的问题。\n\n任职要求\n\n有编剧、网文创作、小说创作、漫画脚本、动漫剧情、短剧、剧情短视频、影视策划、游戏剧情等相关创作经验。\n\n\n\n具备较好的小说阅读和故事理解能力，能够快速提炼人物关系、核心矛盾及剧情重点。\n\n\n\n具备一定的内容改编能力，能够根据短剧篇幅对原小说进行删减、调整、压缩及结构重组。\n\n\n\n对短剧、网文、动漫、漫画等内容形式有一定了解，能够理解快节奏、强冲突、高情绪密度的内容表达方式。\n\n\n\n能够将文字剧情转化为具体场景、人物行为及对白，使剧本具备较好的画面感和制作可执行性。\n\n\n\n具备基本的剧情连续性和人物逻辑判断能力，能够保证改编后故事完整、人物行为合理。\n\n\n\n能够按照项目要求完成创作，并根据审核意见进行合理修改。\n\n\n\n具备良好的沟通、协作及时间管理能力。\n\n\n\n对AI动漫、AI短剧等新内容形式感兴趣，并愿意学习相关制作逻辑。\n\n加分项\n\n有短剧、动态漫、AI动漫或漫画项目经验。\n\n\n\n有小说、网文或成熟IP改编经验。\n\n\n\n有已上线、已制作或能够展示的完整编剧作品。\n\n\n\n擅长长篇小说的剧情压缩、短篇化改编及结构重组。\n\n\n\n熟悉男频逆袭、玄幻、都市、悬疑、复仇、冒险、热血等强情节题材。\n\n\n\n熟悉女频情感、甜宠、家庭、豪门、成长、虐恋等强情绪题材。\n\n\n\n有系列化剧情开发或连续人物塑造经验。\n\n\n\n具备较强的网感，对当前短剧、网文及动漫内容趋势有一定敏感度。\n\n\n\n了解AI图片、AI视频或AI动漫制作流程及基本能力边界。\n\n项目形式\n\n项目以小说、网文改编为主要内容方向，根据原著内容及项目需求进行AI动漫短剧化改编。\n\n\n\n单部短剧原则上约 8集，单集约 3–5分钟。\n\n\n\n具体集数、篇幅及内容结构可根据原著体量、剧情复杂度及实际制作要求进行调整。\n\n\n\n前期以熟悉项目标准及创作流程为主，稳定期月度完成约2部完整短剧，具体根据项目难度及团队排期安排。\n\n\n\n最终剧本需具备较完整的剧情结构、人物逻辑及画面表达，能够支持后续AI动漫制作环节推进。", "cat": "内容与创作"}, {"id": "292", "title": "网站运营", "salary": "8k - 20k", "location": "", "jd": "网站运营\n\n岗位职责\n\n网站整体运营与增长\n\n负责网站日常运营及整体运营策略落地，围绕新增、活跃、留存、转化、付费及营收等核心指标制定并执行运营方案。\n\n参与网站从 0 到 1 的运营搭建，包括用户体系、内容体系、活动体系及运营流程建设，推动网站持续增长。\n\n根据业务发展阶段制定冷启动、用户增长及规模化运营策略，持续提升网站整体流量及用户规模。\n\n内容运营与用户留存\n\n负责网站内容体系的规划、运营及优化，根据用户需求和数据表现持续调整内容方向。\n\n优化网站首页、频道页、详情页、推荐位等核心页面的内容结构与展示逻辑，提升点击率、浏览深度、停留时长及用户留存。\n\n参与内容选题、专题策划、活动策划及内容分发，提升内容产出效率和内容对用户增长、留存及转化的贡献。\n\n建立内容运营标准及内容质量评估机制，持续提升网站内容质量和用户体验。\n\nSEO及流量增长\n\n负责网站 SEO 运营，包括关键词布局、页面结构、站内链接、专题页、内容优化及搜索流量增长等。\n\n分析自然搜索、社媒、外部渠道等不同流量来源，持续优化流量获取及分发策略。\n\n关注行业及竞品网站运营情况，挖掘新的流量增长机会，提升网站整体曝光及自然流量。\n\n数据分析与运营优化\n\n日常跟踪网站核心数据，包括 UV、PV、注册、DAU、留存、访问深度、跳出率、转化率、付费率及营收等。\n\n基于数据分析用户访问及转化路径，定位流量、内容、产品及转化环节中的问题，并提出可执行的优化方案。\n\n建立并持续完善网站运营数据指标体系，通过数据驱动内容、活动、页面及用户运营策略迭代。\n\n根据数据反馈持续进行 A/B Test 及运营策略调整，提升网站整体运营效率。\n\n用户增长与转化\n\n围绕“流量获取—用户注册—内容消费—用户留存—付费转化”完整链路进行运营优化。\n\n负责会员、付费内容、订阅、活动及其他商业化场景的运营，持续提升用户转化率及用户价值。\n\n针对不同用户生命周期制定差异化运营策略，提升用户活跃度、留存率及复购/续费率。\n\n活动及专题运营\n\n根据业务目标策划线上活动、专题活动、节日活动及用户增长活动，负责活动从策划、执行到复盘的完整流程。\n\n通过活动、专题及内容运营提升网站流量、用户活跃度、用户留存及付费转化。\n\n跨部门协作\n\n与产品、技术、设计、内容、渠道及商务等团队协同，推动网站功能、页面、内容及运营工具持续优化。\n\n能够独立梳理运营需求并推动产品、技术落地，持续改善网站用户体验及运营效率。\n\n定期复盘运营结果，沉淀可复制的网站运营方法论。\n\n任职要求\n\n2-5 年网站运营、互联网产品运营或内容运营相关工作经验，有网站/平台型产品运营经验优先。\n\n有完整参与或主导网站/互联网产品从 0 到 1 搭建、冷启动或增长阶段的经验，能够独立制定并执行运营策略。\n\n熟悉网站运营完整链路，对用户增长、内容运营、用户留存、转化及商业化有较深入理解。\n\n具备较强的数据分析能力，熟悉 Google Analytics、Search Console、数据报表等常用分析工具，能够通过数据独立拆解问题并提出优化方案。\n\n熟悉 SEO、网站流量增长、内容运营及用户运营，有成功的网站流量增长或用户增长案例优先。\n\n具备较强的内容判断能力，能够根据用户需求、行业趋势及数据表现制定内容方向和运营策略。\n\n具备较强的项目推进能力，能够协调产品、技术、设计、内容等多个团队推动项目落地。\n\n执行力强，责任心强，具备较好的沟通及协作能力，能够适应快节奏、高强度的互联网运营环境。\n\n有成人行业、泛娱乐、内容社区、视频/图片平台或海外互联网产品运营经验优先。\n\n有网站从 0 到 1 搭建、SEO 流量增长、会员/付费产品运营或海外网站运营经验者优先。", "cat": "运营与市场"}, {"id": "293", "title": "AI内容负责人（加急）", "salary": "15-25k", "location": "", "jd": "岗位职责\n\n统筹内容生产全流程\n负责从剧本策划、分镜设计、美术与素材、AI生成、剪辑制作到成片交付及首轮数据验证的完整生产闭环，对内容最终质量负责。\n\n建立统一的内容标准\n制定并持续优化团队的内容调性与制作标准，包括画面风格、镜头语言、声音设计、剪辑节奏等，推动剧本、美术、生成、剪辑等团队形成统一的内容判断标准。\n\n负责项目统筹与资源调配\n根据剧本体量、场次、镜头难度及项目节点，合理进行人员配置、任务拆分与资源调度，确保项目按计划、高质量完成。\n\n建立“测试—验证—放量”机制\n在整部内容批量生产前，推动核心片段或切片进行小规模测试，根据点击、完播、留存、付费转化等数据判断项目方向，及时做出继续、调整或终止的决策，控制无效产能与制作成本。\n\n对内容及商业结果负责\n结合项目数据持续优化内容方向，对单剧的内容表现、商业结果及投入产出负责；同时关注团队整体产能、单分钟制作成本、项目交付周期及剧本储备等核心经营指标。\n\n提升团队生产效率\n优化内容生产流程与协作机制，持续降低沟通成本和返工率，提升团队整体产能与交付质量。\n\n搭建人才梯队与方法论\n培养组长及核心骨干，建立人才梯队；将成熟的生产流程、制作标准和优秀案例沉淀为可复制的方法论，提升团队规模化生产能力。\n\n任职要求\n\n具备 20人以上内容、影视或短视频制作团队管理经验，有完整项目统筹及团队管理经验；\n\n对内容质量、市场趋势及用户反馈具备较强判断力，能够基于数据和项目实际情况做出明确的内容决策；\n\n熟悉内容生产流程，能够理解并平衡内容质量、制作周期、团队产能与成本；\n\n具备较强的项目管理和资源协调能力，能够推动多团队、多环节协同完成项目；\n\n有较强的经营意识，能够关注内容产出背后的成本、效率及商业结果，而不仅局限于内容制作本身；\n\n具备较强的团队管理和人才培养能力，能够搭建并持续优化内容生产团队；\n\n背景不限，可来自影视制作、短剧、短视频、内容平台或成熟内容团队，如执行导演、制片负责人、制作负责人、内容负责人等；\n\n对 AI短剧 / AI视频规模化生产模式有兴趣，并愿意探索AI对内容生产效率的提升。\n\n加分项\n\n有 AI短剧、AI漫剧、AI视频等相关项目经验；\n\n有从 0到1搭建内容团队或生产体系的经验；\n\n有完整负责过短剧、短视频或影视项目，并对项目最终商业结果负责；\n\n有通过数据测试进行内容筛选、项目调整或资源止损的实际经验；", "cat": "内容与创作"}, {"id": "294", "title": "AI 视频⽣成组⻓（加急）", "salary": "15-25k", "location": "", "jd": "岗位职责\n负责 AI 视频⽣成团队管理\n带领 8–10 ⼈的 AI 视频⽣成⼩组，根据项⽬排期、剧本场次及镜头难度合理拆分任务、分配\n⼈员，确保项⽬按计划完成。\n负责⽣成产能与交付质量\n建⽴并持续优化⼩组的产能标准，关注合格镜头率、⼀次通过率、返⼯率、单位算⼒产出及\n交付周期等核⼼指标，持续提升团队⽣产效率。\n负责镜头⽣成与质量把控\n根据分镜及制作要求，对镜头难度进⾏分级并制定对应的⽣成⽅案；重点把控⼈物⼀致性、\n动作⾃然度、场景稳定性、画⾯逻辑及镜头表现，确保最终⽣成效果符合项⽬要求。\n参与项⽬制作可⾏性评估\n在项⽬⽴项及分镜锁定阶段，与内容、剧本等团队共同进⾏制作可⾏性评估，提前识别 AI ⽣\n成难度较⾼、成本较⾼或存在较⼤不确定性的镜头，并提出调整⽅案。\n建⽴ AI ⽣成标准与规范\n根据实际⽣产经验，沉淀不同类型镜头的⽣成⽅法、提示词、模型组合、参数及常⻅问题解\n决⽅案，建⽴并持续更新《AI 制作约束清单》和⽣成 SOP。\n优化⼯具与⽣产流程\n持续关注 AI 视频、图像⽣成⼯具及模型能⼒变化，结合项⽬实际情况优化模型组合、⼯作\n流和⽣产⽅式，提升团队整体⽣成效率与成⽚稳定性。\n培养团队与储备组⻓\n负责组内⼈员能⼒培养和经验传承，建⽴新⼈培训及技能分级机制，培养核⼼⻣⼲及储备组\n⻓，保证团队持续稳定交付。\n任职要求\n2 年以上 AI 视频⽣成或相关内容制作经验，熟悉从分镜理解、素材准备到 AI ⽣成、筛选、\n修改及成⽚交付的完整流程；\n有 5–10 ⼈以上团队管理或项⽬带队经验，能够根据⼈员能⼒、镜头难度及项⽬进度合理分\n配⽣产任务；\n对镜头难度及 AI ⽣成可⾏性有较强判断能⼒，能够提前识别⾼难度镜头并制定对应解决⽅\n案；\n熟悉⼈物⼀致性、动作控制、场景稳定、镜头运动等 AI 视频⽣成中的常⻅问题及解决⽅式；\n具备较强的质量意识和结果意识，能够以合格成⽚分钟数、⼀次通过率、返⼯率、⽣产效率\n等指标管理团队；\n能够适应短周期、⾼产量的批量内容⽣产环境，并持续优化⽣产效率；\n具备较强的问题解决和团队协作能⼒，能够与内容、剧本、美术、剪辑等团队⾼效配合。\n加分项\n熟悉主流 AI 视频 / AI 图像⽣成⼯具及模型，能够根据不同镜头需求选择合适的⼯具和模型\n组合；\n有 AI 短剧、AI 漫剧、短视频或其他批量化内容⽣产经验；\n有从 0 到 1 搭建 AI 视频⽣成⼯作流、SOP 或团队⽣产体系的经验；\n有较强的提示词优化、⼯作流搭建或 AI ⼯具测试能⼒；\n有成熟的镜头难度分级、产能测算或成本控制经验；\n有组⻓、主管或 AI 视频⽣成项⽬负责⼈经验。", "cat": "内容与创作"}, {"id": "295", "title": "AI 内容镜头审核", "salary": "15-20k", "location": "", "jd": "岗位职责\n负责⽣成镜头质量审核\n对 AI ⽣成镜头进⾏逐镜审核，按照统⼀的 A / B / C 质量标准进⾏分级，确保镜头在画⾯、\n⼈物、动作、场景及镜头表现等⽅⾯达到对应要求。\n负责剪辑前质量卡点\n作为 AI ⽣成与后期剪辑之间的质量闸⻔，严格控制进⼊剪辑素材库的镜头质量。C 级镜头\n不得进⼊剪辑环节，避免依赖后期剪辑强⾏修复低质量素材。\n识别并记录镜头问题\n及时发现⼈物变形、⼈物不⼀致、动作异常、场景漂移、画⾯穿帮、镜头逻辑不合理、画质\n异常等问题，并准确标记问题类型及具体位置。\n控制漏检与下游返⼯\n关注镜头漏检率、审核准确率及因素材质量问题导致的下游返⼯率，确保进⼊剪辑环节的素\n材符合制作标准。\n推动前端⽣成质量提升\n汇总审核过程中发现的⾼频及共性问题，定期向 AI 视频⽣成组反馈，协助组⻓优化⽣成⽅\n法、提示词、模型及⽣产流程，从源头降低问题镜头产⽣率。\n沉淀审核标准与案例\n持续整理典型问题镜头及优秀案例，完善 A / B / C 分级标准、审核 SOP 及案例库，提升团\n队审核标准的⼀致性和稳定性。\n任职要求\n具备 AI 视频⽣成、后期制作、视频质检或相关内容制作经验，熟悉视频镜头质量判断；\n对⼈物⼀致性、动作⾃然度、场景稳定性、画⾯完整度、镜头逻辑等具备较强的识别能⼒；\n能够严格按照统⼀标准进⾏ A / B / C 分级，具备较⾼的审核准确率和标准⼀致性；\n细致、有耐⼼，对画⾯质量敏感，具备较强的标准意识和责任⼼；\n能够适应批量化、⾼频次的镜头审核⼯作，在较⼤审核量下保持稳定判断；\n能够准确描述问题并给出明确反馈，⽽不仅是判断“好 / 不好”；\n有较强的团队协作意识，能够与 AI ⽣成、剪辑等团队⾼效配合。\n加分项\n有 AI 视频⽣成或 AI 图像⽣成相关经验；\n有短剧、漫剧、短视频等批量内容⽣产经验；\n有视频后期质检、成⽚审核或影视制作质量管理经验；\n有从⽣成⼈员成⻓为⻣⼲、负责审核或质量把控的经验；\n熟悉主流 AI 视频⽣成⼯具及常⻅⽣成问题；\n有建⽴视频质量标准、质检 SOP 或镜头案例库的经验。", "cat": "内容与创作"}, {"id": "296", "title": "AI 内容剧本审核", "salary": "15-20k", "location": "", "jd": "岗位职责\n负责剧本终审与⽣产准⼊\n负责剧本进⼊制作前的最终审核，从题材价值、故事逻辑、⼈物设定、剧情节奏、商业潜⼒、\n制作可⾏性及内容合规等维度进⾏综合判断。未达到⽣产标准的剧本，不进⼊后续制作环节。\n把控剧本执⾏完整度\n判断剧本是否已经细化到可以直接进⼊分镜及⽣产阶段，确保⼈物、场景、剧情、镜头需求\n等关键内容清晰明确，避免进⼊制作后频繁返⼯或重新策划。\n提出明确的修改意⻅\n对不符合要求的剧本进⾏退回，并明确指出具体问题、修改⽅向及判断依据，推动编剧持续\n提升剧本质量，⽽不是只做简单的“通过 / 不通过”\n。\n参与制作可⾏性评估\n与 AI 视频⽣成、美术等团队共同参与剧本及分镜制作可⾏性会审，提前识别⼈物、场景、\n动作、特效等 AI ⽣成难度较⾼的内容，并将制作端反馈沉淀，反向优化剧本创作。\n负责内容合规审核\n建⽴并执⾏内容合规审核标准，负责题材、剧情、⼈物、台词、画⾯等⽅⾯的⻛险识别，熟\n悉不同平台的审核规则及内容红线，确保项⽬符合上线要求。合规审核环节不外包。\n提升剧本审核效率与标准化程度\n持续沉淀审核标准、典型案例及常⻅问题，完善剧本审核 SOP，在保证审核质量的同时提升\n审核效率和整体吞吐量。\n覆盖多来源剧本审核\n负责内部创作、外包制作及采购剧本的统⼀审核，确保不同来源的剧本按照同⼀套标准进⼊\n⽣产。\n任职要求\n具备 3 年以上剧本、编辑、影视内容或短剧相关经验，能够独⽴完成剧本判断和审核；\n具备较强的内容判断能⼒， 能够判断题材是否具备开发价值、故事逻辑是否成⽴、⼈物是否\n⽴得住、内容是否具备持续观看的基础，⽽⾮仅依据审核清单逐项核对；\n熟悉剧本结构、⼈物塑造、剧情节奏及短剧内容特点， 能够从执⾏层⾯判断剧本是否具备实\n际制作条件；\n熟悉主流内容平台的审核规则及常⻅内容⻛险，对题材、剧情、台词、⼈物及画⾯等合规问\n题具备较强的⻛险识别能⼒；\n审核效率⾼、判断准确，能够在较⼤审核量下保持稳定的审核标准；\n具备较强的沟通和反馈能⼒，能够给出具体、可执⾏的修改意⻅，推动编剧解决问题；\n能够适应快节奏、批量化的内容⽣产环境，并接受明确的审核效率与质量要求。\n加分项\n有 短剧、AI 短剧、AI 漫剧或短视频内容审核经验；\n有⽹⽂、短剧、影视项⽬的编辑或策划经验；\n熟悉多个内容平台的审核规则及合规差异；\n有外包、采购及内部多来源剧本审核经验；\n有建⽴剧本审核标准、审核 SOP 或内容合规体系的经验；\n对 AI 内容⽣产流程及 AI ⽣成限制有⼀定了解。", "cat": "内容与创作"}, {"id": "297", "title": "中级运营（加急）", "salary": "20-30k", "location": "", "jd": "岗位职责\n\n1. 负责二次元内容类 APP / Web 产品的数值体系搭建、梳理及持续优化，包括金币、会员、积分、任务奖励、签到、活动奖励、充值优惠等核心数值模块；\n2. 梳理现有产品数值规则，建立统一、清晰的数值测算逻辑及标准，解决不同产品之间数值体系混乱、规则不统一、缺乏测算依据等问题；\n3. 结合用户行为及经营目标，对金币产出与消耗、会员价格梯度、付费权益、优惠力度、活动奖励等进行测算，保证数值体系的合理性及长期稳定性；\n4. 负责用户新增、活跃、留存、付费、首充、复购/续费、ARPU、ARPPU、LTV 等核心指标分析，定位数据异常及业务问题；\n5. 针对产品改版、会员调整、活动上线等业务需求进行前置测算，评估不同方案对用户转化、收入及成本的影响，为运营及产品决策提供依据；\n6. 建立数值调整后的数据验证及复盘机制，通过 A/B 测试、用户分层、数据对比等方式持续验证并优化方案；\n7. 与产品、运营、技术等团队协作，推动数值方案从设计、配置、上线到数据验证完整落地。\n\n任职要求\n\n1. 具备较强的数据敏感度、逻辑分析及数值建模能力，能够独立完成业务问题拆解和数值方案设计；\n2. 对内容类产品商业化有较好的理解，熟悉会员、虚拟币/金币、付费内容、活动促销等常见商业化模式；\n3. 能够独立进行金币产消、价格梯度、活动成本、用户价值、付费转化等相关测算，而非仅进行基础数据统计；\n4. 熟练使用 Excel 等数据分析工具，具备 SQL 数据查询能力；掌握 Python 或其他数据分析工具优先；\n5. 具备较强的业务理解能力，能够将数据分析结果转化为实际的产品或运营优化方案；\n6. 有 APP、Web、内容社区、漫画/动漫、短剧、游戏等相关行业数值运营、商业化运营或数值策划经验优先；\n7. 熟悉二次元用户群体，对动漫、漫画、二次元内容及相关用户消费习惯有一定理解者优先；\n8. 能熟练使用 AI 工具辅助数据处理、分析及方案测算，同时具备独立判断分析结果合理性的能力。\n\n我们更看重\n\n我们希望你不仅能够“看数据”，更能够理解数字背后的业务逻辑。\n\n面对一个现有的金币、会员或活动体系，你需要能够判断：\n\n现在的数值是否合理 → 问题在哪里 → 应该如何重新设计 → 调整后可能产生什么影响 → 如何通过数据验证。\n\n最终逐步建立一套稳定、可测算、可验证、可持续迭代的产品数值体系。", "cat": "运营与市场"}, {"id": "298", "title": "网站运营组长", "salary": "8k - 20k", "location": "", "jd": "网站运营\n\n岗位职责\n\n网站整体运营与增长\n\n负责网站日常运营及整体运营策略落地，围绕新增、活跃、留存、转化、付费及营收等核心指标制定并执行运营方案。\n\n参与网站从 0 到 1 的运营搭建，包括用户体系、内容体系、活动体系及运营流程建设，推动网站持续增长。\n\n根据业务发展阶段制定冷启动、用户增长及规模化运营策略，持续提升网站整体流量及用户规模。\n\n内容运营与用户留存\n\n负责网站内容体系的规划、运营及优化，根据用户需求和数据表现持续调整内容方向。\n\n优化网站首页、频道页、详情页、推荐位等核心页面的内容结构与展示逻辑，提升点击率、浏览深度、停留时长及用户留存。\n\n参与内容选题、专题策划、活动策划及内容分发，提升内容产出效率和内容对用户增长、留存及转化的贡献。\n\n建立内容运营标准及内容质量评估机制，持续提升网站内容质量和用户体验。\n\nSEO及流量增长\n\n负责网站 SEO 运营，包括关键词布局、页面结构、站内链接、专题页、内容优化及搜索流量增长等。\n\n分析自然搜索、社媒、外部渠道等不同流量来源，持续优化流量获取及分发策略。\n\n关注行业及竞品网站运营情况，挖掘新的流量增长机会，提升网站整体曝光及自然流量。\n\n数据分析与运营优化\n\n日常跟踪网站核心数据，包括 UV、PV、注册、DAU、留存、访问深度、跳出率、转化率、付费率及营收等。\n\n基于数据分析用户访问及转化路径，定位流量、内容、产品及转化环节中的问题，并提出可执行的优化方案。\n\n建立并持续完善网站运营数据指标体系，通过数据驱动内容、活动、页面及用户运营策略迭代。\n\n根据数据反馈持续进行 A/B Test 及运营策略调整，提升网站整体运营效率。\n\n用户增长与转化\n\n围绕“流量获取—用户注册—内容消费—用户留存—付费转化”完整链路进行运营优化。\n\n负责会员、付费内容、订阅、活动及其他商业化场景的运营，持续提升用户转化率及用户价值。\n\n针对不同用户生命周期制定差异化运营策略，提升用户活跃度、留存率及复购/续费率。\n\n活动及专题运营\n\n根据业务目标策划线上活动、专题活动、节日活动及用户增长活动，负责活动从策划、执行到复盘的完整流程。\n\n通过活动、专题及内容运营提升网站流量、用户活跃度、用户留存及付费转化。\n\n跨部门协作\n\n与产品、技术、设计、内容、渠道及商务等团队协同，推动网站功能、页面、内容及运营工具持续优化。\n\n能够独立梳理运营需求并推动产品、技术落地，持续改善网站用户体验及运营效率。\n\n定期复盘运营结果，沉淀可复制的网站运营方法论。\n\n任职要求\n\n2-5 年网站运营、互联网产品运营或内容运营相关工作经验，有网站/平台型产品运营经验优先。\n\n有完整参与或主导网站/互联网产品从 0 到 1 搭建、冷启动或增长阶段的经验，能够独立制定并执行运营策略。\n\n熟悉网站运营完整链路，对用户增长、内容运营、用户留存、转化及商业化有较深入理解。\n\n具备较强的数据分析能力，熟悉 Google Analytics、Search Console、数据报表等常用分析工具，能够通过数据独立拆解问题并提出优化方案。\n\n熟悉 SEO、网站流量增长、内容运营及用户运营，有成功的网站流量增长或用户增长案例优先。\n\n具备较强的内容判断能力，能够根据用户需求、行业趋势及数据表现制定内容方向和运营策略。\n\n具备较强的项目推进能力，能够协调产品、技术、设计、内容等多个团队推动项目落地。\n\n执行力强，责任心强，具备较好的沟通及协作能力，能够适应快节奏、高强度的互联网运营环境。\n\n有成人行业、泛娱乐、内容社区、视频/图片平台或海外互联网产品运营经验优先。\n\n有网站从 0 到 1 搭建、SEO 流量增长、会员/付费产品运营或海外网站运营经验者优先。", "cat": "运营与市场"}, {"id": "299", "title": "新媒体运营", "salary": "12-15K", "location": "", "jd": "1. 岗位目标\n独立负责国内及海外新媒体矩阵账号，从账号定位、素材判断、 内容发布、达人合作到数据复盘形成完整闭环，并围绕产品UV、转化效率和获客成本持续优化结果\n2. 岗位职责\n1.   矩阵账号运营：独立负责多个账号的定位、搭建、 内容规划、发布节奏、 日常维护和阶段复盘，不是只参与单个账号的局部执行。\n2.   素材判断与优化：从内容池中判断具有爆款潜力的素材，结合平台机制、用户偏好和产品目标完成选题、改编、测试和复用。\n3.   国内外平台运营：根据不同平台的分发机制和公域流量特点调整内容，覆盖国内平台及至少两个海外平台。\n4.   达人合作：独立完成达人筛选、沟通、合作Brief撰写、脚本审核、视频内容验收、修改反馈和合作落地。\n5.   数据跟踪与复盘：持续跟踪浏览、点击或PV、产品UV、转化率和用户成本，能根据数据判断继续放大、调整或停止。\n6.   跨部门协作：与产品及相关团队确认推广链接可访问、数据可归因，并按推广结果推动素材、账号和合作方式调整。\n3. 任职要求\n●   总工作经验不少于3年；其中新媒体相关经验不少于1年，2C业务经验不少于2年。\n●   必须独立负责过矩阵账号运营，能够清楚说明账号数量、本人责任、运营周期、执行动作及最终数据结果。\n●    国内平台做过抖音、B站、小红书或视频号中的一种或多种。\n●   海外平台至少做过TikTok、YouTube、X、Instagram中的两个；有X和TikTok实操经验优先。\n●    网感好，能够判断什么内容具备爆款潜力，并能解释判断依据、测试方式和结果，而不是只凭个人感觉。\n●   理解不同平台的基础机制、公域流量分发方式和目标用户偏好，能够针对平台调整内容。\n●   有独立达人合作经验，能完成合作Brief、脚本及视频审核、沟通修改、验收和效果跟踪。\n●   具备数据意识，能从曝光、点击或PV、产品UV、转化率和获客成本判断问题所在。\n\n4. 加分项\n●    自带可直接对接的KOL或达人资源。\n●   有X、TikTok矩阵从0到1搭建及规模化运营案例。\n●   有通过素材测试、账号匹配或达人合作降低获客成本的明确案例。\n●   能独立完成脚本、Brief、数据复盘或基础可视化报告。\n5. 面试前需提供的证明材料\n●   本人实际参与并负责的相关作品，不要求提供账号登录信息。\n●   至少一个矩阵账号案例，说明平台、账号数量、运营周期、本人职责和结果。\n●   可核验的数据结果，例如浏览、涨粉、点击、转化、产品UV、获客成本或达人合作效果。\n●   达人合作案例中的Brief、脚本、审核反馈或结果复盘，可对敏感信息做脱敏处理。\n6. 筛选标准\n简历初筛必须同时满足\n●   总工作经验≥3年，新媒体经验≥1年。\n●    明确写出独立负责矩阵账号，而不是只写“参与运营”或“协助发布” 。\n●   具备国内平台经验，并具备至少两个海外平台经验。\n●   能够提供作品和数据结果，且能说明本人在结果中的实际责任。\n●   达人合作经历必须包含Brief、 内容审核、沟通修改和验收，不只做资源转交或商务联系", "cat": "运营与市场"}, {"id": "300", "title": "中级产品运营", "salary": "12-20k", "location": "", "jd": "1. 负责所属成人向长视频/短视频内容产品的日常运营，对日活、新增、留存、充值等核心数据指标负责。\n2. 执行组长制定的内容运营策略：日常内容更新、分类/专区/模块优化、依照筛选逻辑优化展示效果。\n3. 监控各项产品数据表现，理解各项数据指标的逻辑，并能够依照数据变化情况，及时进行反应以及调整。\n4. 每日进行产品巡检并分析使用体验，确保产品各项功能正常，包含展示与跳转、播放链路、支付流程等，发现异常及时反馈并跟进至解决。\n5. 收集并处理客服反馈、用户问卷等多渠道用户声音，转化为可执行的产品优化建议。\n6. 参与日度/周度/月度数据复盘会议，独立汇报所负责产品的数据表现及问题归因，并提出优化方针。\n7. 能够进行跨部门沟通协同，推进产品迭代与问题排查，对结果闭环负责。\n8. 为产品定制活动方案，能够利用活动达成指定数据指标的提升，并进行复盘与汇总\n\n任职要求\n\n1. 2年以上成人产品运营经验，有付费产品运营经验者优先；\n2. 有产品迭代经验，新品需求文档攥写能力；\n3. 具备较强的内容敏感度，能够保证更新内容具备吸引力，展示方式符合用户审美，具备视频剪辑 / 封面制作能力者优先；\n4. 数据敏感度强，能够做到问题归因以及提出针对性解决措施；", "cat": "运营与市场"}, {"id": "301", "title": "编剧（AI短剧/漫剧方向）", "salary": "15-30k", "location": "5. 具备较强的修改能力，能够接受快节奏、高频迭代的工作方式。", "jd": "岗位职责\n1. 负责都市情感、婚姻家庭、女性成长、悬疑反转、银发情感等题材的选题策划与剧本创作。\n2. 完成故事大纲、人物小传、分集梗概、单集剧本及对白。\n3. 设计前三集钩子、单集冲突、集尾悬念和中后段付费卡点。\n4. 根据平台数据和用户反馈，快速调整剧情节奏、人物关系及情绪密度。\n5. 使用大语言模型等AI工具辅助选题、资料整理、剧情推演和版本迭代。\n6. 与AI分镜、视觉、配音、剪辑团队协作，保证剧本具备良好的生成和制作可行性。\n7. 关注主流短剧平台的热门题材及用户趋势。\n任职要求\n1. 具备网文、短剧、漫画、动画、游戏剧情或互动内容创作经验。\n2. 熟悉短剧叙事规律，能够快速建立冲突，并持续制造反转和情绪价值。\n3. 人物关系设计能力强，擅长成年人情感、利益博弈及现实议题。\n4. 能独立完成60—100集短剧的整体架构，单集时长适配3-5分钟。\n5. 具备较强的修改能力，能够接受快节奏、高频迭代的工作方式。\n6. 有版权意识和内容安全意识，能够主动规避低俗、侵权及平台审核风险。\n7. 对AI内容生产有兴趣，愿意持续学习新的生成工具和工作流。\n加分项\n• 有上线短剧、爆款网文或高流水项目经验；\n• 熟悉红果、抖音、快手等平台的内容偏好；\n• 有海外短剧、本地化改编或多语言内容经验；\n• 能使用AI完成角色设定、分镜提示词或视频预演；\n• 拥有可改编IP、成熟题材库或稳定创作搭档。", "cat": "内容与创作"}, {"id": "302", "title": "中高级运营", "salary": "12K–20K", "location": "", "jd": "岗位介绍\n负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的成人产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营与市场"}, {"id": "303", "title": "短剧运营", "salary": "12K–20K", "location": "", "jd": "岗位职责\n1. 短剧选品：跟踪热门成人题材、用户偏好和竞品表现，评估剧本、人设、开篇钩子、剧情节奏及制作质量，建立选品标准，制定引入、测试和上新计划。\n2. Web 端运营：负责剧集落地页、试看节点、付费路径和活动配置；结合渠道数据优化点击、播放、付费转化及投放回收效果。\n3. App 端运营：负责首页推荐、榜单、专题、站内活动及消息触达；通过内容编排和用户分层提升追剧率、留存、复看及用户价值。\n4. 数据复盘：跟踪单剧从曝光、开播、完播到付费或广告变现的表现，测试剧名、封面、简介和素材，及时调整选品与分发策略。\n5. 跨团队协作：与内容、产品、投放及版权团队协作，推动剧集上线、运营和复盘闭环。\n任职要求\n•  有短剧、视频平台或内容产品运营经验，具备独立选品及项目复盘能力。\n•  熟悉当前短剧市场，对都市情感、女性成长、悬疑、古装及漫剧等方向有内容判断力，能说明某部剧适合什么用户、通过什么渠道推广。\n•  清楚 Web 端与 App 端的运营差异：理解 Web 端的流量承接和即时转化，也理解 App 端的内容分发、用户留存和长期运营。\n•  具备数据分析能力，能根据播放、转化、留存和收益数据提出可执行的优化方案。\n•  重视内容质量、沟通推进能力强。", "cat": "内容与创作"}, {"id": "304", "title": "高级 Flutter 工程师（Android / iOS / Web）", "salary": "面议", "location": "", "jd": "岗位职责：\n负责公司核心产品 Flutter 架构设计与开发；\n负责 Android、iOS、Web 三端应用开发与维护；\n负责 Flutter Plugin 开发及原生能力集成；\n负责系统性能优化、技术攻关及代码质量建设；\n利用 AI 工具提升研发效率，推动 AI 辅助开发落地。\n\n任职要求：\n8年以上开发经验，5年以上 Flutter 项目经验；\n精通 Dart、Flutter 框架及工程化开发；\n具备 Android、iOS、Web 三端实际开发经验；\n熟悉状态管理、网络通信、本地存储及性能优化；\n熟悉 Git 及团队协作开发流程；\n具备良好的架构设计能力和问题解决能力。\n\n核心要求（重点）：\n能独立开发 Flutter Plugin；\n熟悉 MethodChannel、EventChannel、FFI 等技术；\n熟悉 Kotlin、Java、Swift，能够处理原生层开发与问题排查；\n具备大型项目架构设计及性能优化经验；\n能独立负责项目从设计到上线全过程。\n\nAI 能力要求：\n熟练使用 Cursor、ChatGPT、Claude、Copilot、Windsurf 等 AI 开发工具；\n能利用 AI 完成代码生成、重构、测试、文档编写及 Bug 排查；\n有 AI Agent、MCP、RAG 或大模型接入经验优先；\n熟悉 OpenAI、Claude、Gemini 等模型 API 接入优先。\n\n加分项：\n发布过 App Store 或 Google Play 上线项目；\n有 Flutter Plugin 发布经验；\n有 AI 产品开发经验；\n有 IM、音视频等大型项目经验；\n有开源项目或技术社区贡献经验。\n\n我们希望你：\n热爱技术，持续学习；\n具备优秀工程化思维；\n对代码质量有追求；\n能独立承担核心模块设计与开发工作。", "cat": "技术开发"}, {"id": "305", "title": "Golang、PHP开发工程师", "salary": "面议", "location": "", "jd": "岗位职责：\n负责基于PHP语言和Golang语言的Web应用后端开发，完成系统架构设计与核心模块编码，开发维护现有的项目\n使用主流PHP框架（如Laravel、Symfony）和Golang框（如Gin）进行高效开发，确保代码可维护性和扩展性\n设计并优化数据库结构，熟练使用Mongodb数据库，能编写高性能语句和索引优化\n开发RESTful风格API接口，支持前端及移动端业务调用，保障数据交互安全与稳定\n运用Redis、Memcached等缓存技术提升系统响应速度，参与高并发场景下的性能调优\n配合前端团队完成页面集成，协同测试人员完成缺陷修复与系统迭代\n\n任职要求：\n1、8年以上后端开发经验，有中大型项目或复杂业务模块开发经验；\n2、需要同时具备PHP和Golang开发经验\n3、熟悉Mongodb数据库设计与优化\n4、熟悉Redis、Memcached等缓存技术的应用场景与实现方式\n5、具备良好的代码规范意识、问题排查能力和系统性能优化经验\n6、具有良好的沟通协作能力，能适应快节奏开发环境，具备较强的责任心与学习能力\n\nAI 能力要求：\n熟练使用 Cursor、ChatGPT、Claude、Copilot、Windsurf 等 AI 开发工具；\n能利用 AI 完成代码生成、重构、测试、文档编写及 Bug 排查；\n有 AI Agent、MCP、RAG 或大模型接入经验优先；\n熟悉 OpenAI、Claude、Gemini 等模型 API 接入优先。\n\n我们希望你：\n工作积极主动，态度踏实认真，有较强的职业素养和工作操守\n对技术有激情，喜欢钻研，能快速接受和掌握新技术，学习能力和工作责任心强，良好的沟通表达能力和团队协作能力", "cat": "技术开发"}, {"id": "306", "title": "短剧内容增长运营（国内社媒）", "salary": "12k-15k", "location": "工作地点：远程 / 英国本地 ，英国本地：£2,000–£2,500 / 月，转正后可根据导流与账号数据设置绩效奖金（细则面议），提供账号链接或作品数据，并增加一个 24 小时内提交的剪辑小作业", "jd": "岗位目标\n负责公司原创 AI 短剧在国内社媒（小红书、抖音为主）的内容化推广：从原创短剧中剪辑、二创出适合公开平台传播的内容，建立账号矩阵并持续产出爆款，把平台流量引到产品。\n岗位职责\n内容策划：深度理解年轻女性用户在短视频 / 短剧上的偏好（题材、人设、节奏、情绪点、评论区话题），为每部原创短剧制定社媒传播方案，确定切片角度与钩子。\n剪辑二创：独立完成短剧的切片、混剪、卡点、字幕与封面，产出符合小红书、抖音调性的传播版本（合规、可公开），保证每周稳定产量。\n标签与分类：熟悉短剧 / 短视频的题材标签体系（如霸总、替身、追妻、重生、先婚后爱、强制爱等），能对素材做标签分类，并据此规划账号内容方向与话题运营。\n账号运营：搭建并运营小红书、抖音账号矩阵，负责发布节奏、话题选择、评论互动、私信引导与账号安全；跟踪各平台规则变化。\n数据复盘：每周复盘播放、互动、涨粉与导流数据，找到有效内容形式并放大；输出可复用的选题与剪辑 SOP。\n协同：与 AI 短剧制作组对接选题与素材需求，反哺剧本创作（哪类桥段在社媒更容易引起共鸣）；与产品运营对接落地页与转化链路。\n任职要求\n3 年以上短视频 / 短剧内容运营经验，有小红书或抖音账号从 0 做起的成功案例（请附账号或作品链接及数据）。\n资深短剧用户，对当下热门短剧、爆款切片和年轻女性受众的喜好有明确判断，能说清“为什么这条会火”。\n熟练使用剪映 / Premiere 等剪辑工具，独立完成剪辑、字幕、封面全流程；有网感，标题与文案能引发共鸣。\n熟悉短剧 / 短视频标签体系，有素材分类或选题库搭建经验。\n熟悉小红书、抖音的内容规范与流量机制，有内容合规意识。\n结果导向，能接受以播放量、涨粉、导流数据为核心的考核。\n加分项\n有 AI 短剧制作经验（即梦、可灵、Runway 等工具，或 AI 分镜 / 生图 / 生视频流程），了解 AI 短剧的制作逻辑与可剪辑点。\n有女性向内容（言情、耽美、乙女向）平台或账号的运营经验。\n有海外社媒（YouTube Shorts、TikTok、X）运营经验，可兼顾海外推广。\n有引流转化经验，做过从社媒到 App / 站点的导流链路。\n考核指标（试用期）\n账号矩阵搭建完成，每周稳定产出 N 条二创内容（入职后按平台定量）。\n首月内跑出至少 1 条播放量破 10 万的内容，明确可复制的内容形式。\n月度社媒导流新增用户量与产品注册转化，作为转正核心指标。", "cat": "内容与创作"}, {"id": "307", "title": "UI设计师", "salary": "12K—20K", "location": "", "jd": "岗位职责：\n1.负责日常渠道运营相关的设计需求，包括但不限于活动海报、banner、落地页、推文配图、运营物料等视觉产出，保障渠道视觉风格统一且高效落地。\n2.根据产品需求，输出完整的UI设计方案，涵盖页面结构、交互逻辑、视觉规范及适配方案，确保设计与产品目标高度匹配。\n3.负责项目内部视觉设计方案的制定与执行，包括品牌视觉延展、项目视觉体系搭建、内部宣发物料及演示方案设计。\n4.与产品、运营、开发等团队紧密协作，跟进设计落地效果，及时优化迭代。\n5.持续关注行业设计趋势与用户体验，提升整体视觉品质与转化效果。\n\n任职要求：\n1.扎实的视觉设计功底，精通构图、色彩、字体层级与质感表现，能精准平衡界面整体氛围和信息传达效率。\n2.3-5年（或以上）UI/视觉设计经验，有渠道运营设计、活动视觉或互联网产品设计经验者优先。\n3.熟练掌握 Figma、Sketch、Photoshop、Illustrator 等主流设计工具，具备良好的视觉审美与排版能力。\n4.能独立完成从需求理解到方案输出的完整设计流程，具备较强的需求拆解与方案表达能力。\n5.对用户体验有基本认知，能根据业务目标平衡美观与转化效果。\n6.沟通协作能力强，抗压能力好，能适应多需求并行的工作节奏。\n\n加分项：\n1.对AI工具有实际应用经验，熟练使用以下一种或多种工具并能融入真实工作流，持续关注AI设计领域最新工具与方法进展，具备主动学习和迭代工作流的意识：\n· 图像生成：GPT image 2、MJ、SD、Comfyui、即梦等；\n· 设计提效：Figma  Ai（FigmaMake）等；\n· 内容辅助：GPT、Claude等LLM在方案分析，文案撰写，设计推导中 的实际应用。\n2.建立过一套Ai可消费的设计系统，将设计语言沉淀为design tokens、组件库和书面设计规则，使产品经理和运营能直接用Ai工具生成符合规范的新页面和日常功能迭代界面，无需设计师逐一参与。", "cat": "内容与创作"}, {"id": "308", "title": "业务培训专家", "salary": "20K-35K", "location": "", "jd": "业务培训专家 JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n负责讲师资格库建设，优先挖掘业务一线 TOP 20% 高手担任兼职讲师，按季度核验讲师业务表现及授课质量，建立动态淘汰机制。\n对接 AI 工具厂商及外部讲师资源，评估其行业案例、ROI 数据及课程适配度，把控外部讲师引入标准。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n按季度组织业务复盘会，与业务一线、HRBP 对齐培训落地效果及业绩归因，持续优化课程内容和演武机制。\n任职要求\n5-8 年业务培训、业务赋能、培训运营或实战教练相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点，不只是做课程交付，而是能围绕业务结果设计培训方案。\n主导过 50 场以上实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n善于调动业务内部高绩效人员担任兼职讲师，能把一线优秀打法转化为可复制、可训练、可考核的课程和 SOP。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "职能与行政"}, {"id": "309", "title": "业务萃取专家", "salary": "20K-35K", "location": "", "jd": "参与集团内各分公司、重点项目组及业务骨干的访谈、调研和复盘，了解业务背景、执行过程、关键动作及结果数据。\n根据访谈和业务资料，整理高质量访谈纪要，提炼核心业务动作、成功经验、失败教训及可复用方法。\n挖掘各产品、项目组、一线业务团队中具有复制价值的优秀打法、亮点案例和关键经验。\n将零散的业务经验和项目资料整理为结构化内容，包括业务背景、问题场景、关键动作、执行步骤、结果数据、适用场景和注意事项等。\n协助搭建并维护经验案例库、战法地图、知识库及待萃取素材清单，持续沉淀集团内部可复用的业务经验。\n与 SOP 工程化组、学习发展部及相关业务团队协作，推动经验素材转化为 SOP、工具包、培训课件、实战训练内容等可落地成果。\n结合业务需求，使用 AI 工具辅助访谈纪要整理、内容提炼、框架搭建和结构化输出，提升经验沉淀效率。\n跟进经验素材的应用反馈，持续优化案例内容、SOP 表达和工具包结构，提升内容的实用性和可复制性。", "cat": "职能与行政"}, {"id": "310", "title": "资深短剧编剧", "salary": "20-35k", "location": "", "jd": "【岗位定位】\n负责精品叙事类短剧的创作、评审与方法沉淀；不是简单使用AI生成文本，而是把控人物、逻辑、节奏和可制作性。\n\n【岗位职责】\n• 负责精品短剧、连续剧情及叙事类视频的原创、改编和剧本精修。\n• 完善世界观、人物关系、角色动机、成长线、核心冲突及分集结构。\n• 对AI生成或各业务线提交的剧本进行专业Review，解决人物扁平、逻辑断裂、节奏拖沓和情节雷同等问题。\n• 把控开场钩子、爽点密度、冲突升级、剧情反转和结尾断点。\n• 与AI视频制作人员联合评审，确保执行人员拿到剧本后不需要重新策划。\n• 结合采纳率、成片表现和用户数据，沉淀剧本模板、评审标准和创作方法。\n\n【重点技能】\n剧本结构；人物塑造；短剧节奏；AI剧本精修；剧本质检；制作可行性判断\n\n【任职要求】\n• 具备短剧、影视剧、动画或游戏剧情策划经验，有可核验的上线作品。\n• 具备扎实的剧本基本功，能够独立完成人物塑造、故事结构及分集节奏设计。\n• 有较强的剧本质检能力，能够快速判断剧本的问题、潜力和修改方向。\n• 理解短视频用户习惯，熟悉钩子、爽点、反转、断点和连续追剧动力。\n• 具备良好的审美、逻辑和内容判断力，不依赖AI完成核心创意与专业判断。\n• 能与导演、分镜、AI生成、美术和剪辑人员有效协作。\n\n【优先背景 / 作品要求】\n优先考虑短剧编剧、影视编剧、动画编剧、游戏剧情/文案策划，以及具备影视化改编能力的小说作者。需提供上线作品、脱敏剧本或修改前后版本。", "cat": "内容与创作"}, {"id": "311", "title": "AI视频工作流专家", "salary": "20-35k", "location": "", "jd": "【岗位定位】\n熟练操作万桢、FRW及相关AI内容平台，把剧本和角色稳定转化为高质量视频，并沉淀可复制的标准工作流。\n\n【岗位职责】\n• 操作万桢、FRW、无限画布及相关工具，完成剧本到成片的端到端制作。\n• 完成角色、场景、分镜、参考图、图像生成、视频生成、配音、音效和剪辑拼接。\n• 根据项目选择模型、提示词、参考素材、参数和生成方案。\n• 解决角色一致性、动作自然度、镜头衔接、画面稳定性和剧情连贯性问题。\n• 沉淀示例画布、工作流节点、模型选择方法、质检标准和操作SOP。\n• 复盘效率、返工和成片表现，持续优化工作流并培训业务线人员。\n\n【重点技能】\n万桢/FRW；无限画布；多模型组合；角色一致性；分镜与剪辑；流程诊断；SOP与培训\n\n【任职要求】\n• 具备AI视频、AI动画、影视制作、视觉设计或内容后期的实际项目经验。\n• 有完整AI视频或AI动画作品，能够说明从剧本到成片的生产过程。\n• 熟悉文生图、图生视频、文生视频、多模型组合和参考图控制。\n• 理解镜头语言、构图、光影、动作、节奏、声音设计及基本剪辑逻辑。\n• 能够定位工作流问题，并通过调整模型、节点、提示词或素材解决。\n• 具备审美、质量意识、文档沉淀和培训能力。\n\n【优先背景 / 作品要求】\n优先考虑AI视频/动画、影视导演、分镜、动画制作、美术设计、剪辑及后期背景；有无限画布、ComfyUI或多模型节点式工作流经验者优先。", "cat": "内容与创作"}, {"id": "312", "title": "培训运营专员", "salary": "15-25k", "location": "", "jd": "培训运营 专员JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前3- 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n\n任职要求\n5年或以上人才发展、业务赋能、培训运营或相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点。\n独立实施过多次实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "运营与市场"}, {"id": "313", "title": "HR助理（HRBP方向）", "salary": "£25,000 – £30,000 / 年", "location": "工作地点：伦敦", "jd": "岗位职责\n业务理解与HRBP支持\n协助总监理解业务运作，识别组织问题并推进相关优化。\n人力规划与招聘支持\n参与人力需求评估及招聘支持，从业务角度判断人员匹配度。\n组织效率提升\n协助推动团队效率及整体组织绩效的提升。\n执行与制度落地\n协助相关工作的落地与跟进，并推动公司制度在各部门执行。\n\n任职要求\n基础要求\n本科及以上学历\n熟练使用办公工具（如Excel、Google Drive、WPS等）\n对使用AI工具提升工作效率具备积极态度\n中文流利\n核心能力\n执行力强，能够推动事情落地\n逻辑能力强，具备清晰的分析与判断能力\n学习能力强，能够快速成长\n候选人背景（需满足以下三类之一）\n人力资源专业背景（优先）\n人力资源管理或相关专业（如人力资源管理、组织管理等以人员与组织为核心的专业），具备扎实理论基础，并希望应用于实际工作\nCIPD发展路径人选\n已完成CIPD Level 3，并正在学习Level 5，对HRBP发展路径有明确规划\n具备管理经验并计划转型HR的人选\n过往工作中有实际带人或团队管理经验，对组织与人员问题有一定理解，有明确意愿转型HR，并计划未来考取CIPD", "cat": "职能与行政"}, {"id": "314", "title": "HRBP", "salary": "¥18K–25K/月,具体依能力面议", "location": "远程", "jd": "岗位职责\n编制管理:对口若干中后台部门,深入了解部门业务,持续评估编制合理性,参与入职审批环节并出具专业意见\n组织诊断与人效分析:定期与所辖部门负责人及团队访谈,诊断组织问题、协助管理改善;基于数据开展人效分析,输出可落地的结论与建议\n例常人事工作:月度组织架构与花名册核对、编制统计、各部门绩效与薪酬激励数据的收集、汇总与初审\n专项支持:组织调整期间的落地支持(员工沟通、去向协调、人员安置)及临时性专项任务\n制度建设:参与团队制度与流程的搭建与优化\n任职要求\n3 年以上 HRBP 相关经验,有组织诊断或人效改善的实际落地案例者优先\n执行力强,例常工作细致零差错,时间承诺可靠\n沟通能力出色:能坦率指出问题,也能维护好跨部门关系,推动问题落地解决\n对数据敏感,书面表达清晰,能独立产出结构完整的分析报告\n适应远程协作,自驱力强\n熟练使用 AI 工具提升工作效率者加分", "cat": "职能与行政"}, {"id": "315", "title": "项目助理 Project Assistant(1–2 名)", "salary": "试用期年薪 £25,000–28,000(按履历与面试表现定档)", "location": "工作地点:伦敦(办公室办公初筛问题", "jd": "主要职责\n商业伙伴关系\n与企业领导者密切合作，了解组织需求、团队结构和绩效挑战。\n组织诊断与问题解决\n找出组织和人员相关问题的根本原因，并提供务实的、以结果为导向的解决方案。\n员工队伍规划与人才决策\n从业务角度领导员工队伍规划、招聘决策和人才评估。\n实施与影响传递\n推动人员计划的执行，并确保组织绩效的可衡量改进。\n人力资源框架捐款（如适用）\n在必要时与相关职能部门（如COE）合作，为人力资源和社会保障框架和最佳实践做出贡献。\n\n要求\n经验\n具有支持业务团队（通常为50名员工）的成熟HRBP经验\n在解决组织或人员相关挑战方面展示了经验\n资格\nCIPD 5级或以上（或同等专业资格）\n核心竞争力\n具有较强的商业敏锐度和利益相关者管理能力\n较强的分析和解决问题的能力\n影响和挑战企业领导者的能力\n以结果为导向，采用务实、亲身实践的方法\n语言\n精通普通话", "cat": "产品与管理"}, {"id": "316", "title": "HRBP", "salary": "45，000英镑至65，000英镑", "location": "工作地点：伦敦", "jd": "岗位职责\n编制管理:对口若干中后台部门,深入了解部门业务,持续评估编制合理性,参与入职审批环节并出具专业意见\n组织诊断与人效分析:定期与所辖部门负责人及团队访谈,诊断组织问题、协助管理改善;基于数据开展人效分析,输出可落地的结论与建议\n例常人事工作:月度组织架构与花名册核对、编制统计、各部门绩效与薪酬激励数据的收集、汇总与初审\n专项支持:组织调整期间的落地支持(员工沟通、去向协调、人员安置)及临时性专项任务\n制度建设:参与团队制度与流程的搭建与优化\n任职要求\n3 年以上 HRBP 相关经验,有组织诊断或人效改善的实际落地案例者优先\n执行力强,例常工作细致零差错,时间承诺可靠\n沟通能力出色:能坦率指出问题,也能维护好跨部门关系,推动问题落地解决\n对数据敏感,书面表达清晰,能独立产出结构完整的分析报告\n适应远程协作,自驱力强\n熟练使用 AI 工具提升工作效率者加分", "cat": "职能与行政"}, {"id": "317", "title": "法务专员", "salary": "", "location": "", "jd": "岗位职责\n参与公司海外主体搭建与治理，包括跨国基金、境外公司的设立、架构设计及日常合规维护\n支持投融资项目全流程法律工作：尽职调查、交易文件起草与谈判、交割及投后管理，覆盖公司融资与对外投资两端\n负责短剧等内容业务的版权与 AI 相关法律事务：版权权属与授权、AI 生成内容合规、平台合作协议审核\n起草、审核各类商业合同，识别法律风险并提出解决方案\n跟进相关领域法律法规及监管动态，输出合规建议\n\n任职要求与优先条件\n具备以下三个方向中至少两个方向的实践经验：\n海外公司治理：跨国基金或境外公司设立、架构搭建及治理\n投融资项目：融资与投资项目均有参与经验\nAI 与版权：短剧或内容行业的版权及 AI 合规经验\n具备良好的英文读写及法律文件起草能力\n学习能力强、主动性高，能在业务快速变化中独立推进工作\n有跨境交易或海外合规项目经验\n对短剧、AI 内容行业有持续关注和理解", "cat": "职能与行政"}, {"id": "318", "title": "中高级产品经理", "salary": "20K-25K", "location": "", "jd": "海外产品经理（AI/社交/工具方向）\n\n岗位职责\n\n1. 负责海外产品0-1建设\n负责海外 APP 产品从需求分析、产品规划、设计开发到上线迭代的完整流程；\n根据目标市场用户需求，完成产品定位、功能规划及版本规划；\n\n独立输出：产品需求文档（PRD）；产品流程图；原型设计；功能验收标准；\n\n推动研发、设计、运营等团队协作，保障产品按计划上线。\n\n2. 负责产品策略及用户体验优化\n\n深入分析海外竞品及用户需求，制定产品优化方案；\n关注用户核心链路并基于数据分析持续优化产品体验。\n\n3. 负责增长及商业化设计结合产品目标设计策略\n\n4. 负责海外市场产品研究，关注欧美、东南亚等海外市场用户需求及行业趋势；研究海外竞品，输出竞品分析、产品策略及增长方案。\n\n5. 跨团队推进项目落地\n协调研发、UI、运营、投放团队推进项目；负责需求优先级管理及版本规划；跟进开发进度、测试验收及上线复盘；对产品最终效果负责。\n\n任职要求\n\n基础要求\n\n3年以上互联网产品经理经验；\n有完整负责产品上线经验；\n熟悉APP产品从0到1流程；\n具备较强的产品规划、需求拆解和项目推进能力。\n\n核心能力要求\n\n1. 产品能力\n熟悉：用户需求分析；产品架构设计；PRD输出；原型设计；数据分析；AB测试。\n\n能够独立完成：一个产品从想法到上线；一个版本从需求到交付。\n\n2. 增长能力\n了解：AARRR增长模型；用户生命周期运营；留存提升策略；付费转化优化。\n\n3. 海外经验优先\n\n优先考虑：海外APP产品经验；欧美市场产品经验；出海社交/工具/AI产品经验；App Store、Google Play上线经验。\n\n加分项\n\n独立负责百万级用户产品经验；\n熟悉海外支付、会员体系、广告变现。", "cat": "产品与管理"}, {"id": "319", "title": "信息流广告设计师", "salary": "18-25K", "location": "", "jd": "一、岗位职责\n负责公司海外产品的信息流广告素材设计，包括 Meta、Google、TikTok 等海外广告平台的图片、视频、动图、落地页素材等；\n根据产品定位、目标用户及投放市场，独立完成广告素材的创意策划、视觉设计及迭代优化；\n深入理解海外用户审美及不同国家、地区的内容偏好，能够针对欧美、东南亚、中东等市场进行差异化素材设计；\n与广告投放、产品、运营团队协作，根据 CTR、CVR、CPI、CPA、ROAS/ROI 等投放数据分析素材表现，并持续进行素材优化；\n负责广告素材的批量生产及A/B测试，根据数据快速迭代高潜素材，提升素材点击率、转化率及投放效率；\n关注海外广告市场及竞品素材趋势，持续研究 Meta、TikTok、Google等平台热门广告素材、创意形式及用户内容趋势；\n能够从用户痛点、产品卖点及商业化目标出发，主动提出广告创意，而不仅仅是根据需求执行设计；\n建立并持续完善广告素材库、素材标签及优秀案例库，提高团队素材生产效率。\n二、任职要求\n3年以上信息流广告设计、广告创意设计或买量素材设计经验，有成熟的海外广告素材作品；\n熟悉 Meta、Google、TikTok 等海外广告平台的素材规范及常见广告形式；\n有较强的视觉表现力和广告创意能力，能够独立完成从创意 → 设计 → 测试 → 数据复盘 → 迭代的完整流程；\n对广告素材有较强的数据意识，能够理解CTR、CVR、CPA、CPI、ROAS等核心投放指标，并根据数据判断素材问题；\n熟悉 Photoshop、Figma、Illustrator、After Effects、Premiere 等设计/视频工具中的一种或多种；\n有较强的海外用户审美判断能力，对欧美年轻用户的视觉风格、广告表达及内容趋势有一定理解；\n有 社交、AI、游戏、工具、内容类产品海外买量素材经验者优先；\n有短视频广告、UGC广告、AI生成素材经验者优先；\n具备较强的执行力和抗压能力，能够适应快速测试、快速迭代的工作节奏；\n能够接受以投放数据和实际转化效果作为素材评估的重要标准。\n三、我们希望你具备的能力\n创意能力 > 视觉能力 > 数据意识 > 执行效率\n我们不希望招聘一个单纯“把图做得好看”的设计师，而是希望找到能够理解买量逻辑的广告设计师。\n你需要能够回答：\n这个素材为什么用户会点击？\n用户看到的第一眼卖点是什么？\n为什么这个素材CTR高？\n为什么点击高但注册/付费低？\n同一个产品，欧美和东南亚应该怎么做素材差异化？\n如何通过10～20个素材快速找到有效方向？\n一个素材跑出来以后，如何继续拆解、变体和放量？\n四、加分项\n有海外信息流广告素材爆款案例；\n有实际素材数据案例，可提供投放前后CTR、CVR、CPA、ROAS等数据变化；\n有AI伴侣、Dating、社交、游戏、内容类产品经验；\n有UGC、真人口播、剧情类短视频广告经验；\n熟悉 Midjourney、即梦、Runway、可灵、ChatGPT 等AI创作工具；\n有从0到1搭建广告素材体系或素材团队经验。\n五、薪资福利\n薪资：18K–25K/月\n具体薪资根据候选人的作品质量、海外买量经验、数据能力及实际项目案例综合评估。\n优秀候选人可进一步面议。", "cat": "内容与创作"}, {"id": "320", "title": "动漫产品经理", "salary": "20-25K", "location": "", "jd": "产品经理（内容社区 / 泛娱乐方向）\n薪资范围：20–25K\n岗位职责：\n1. 负责公司内容产品的整体规划与持续迭代，覆盖 App 端及 Web 端，结合业务目标制定产品路线、版本计划和需求优先级，并推动方案落地。\n2. 深入理解用户在内容发现、搜索筛选、播放阅读、收藏追更、互动社区及个人中心等场景中的需求，持续优化核心使用路径和产品体验。\n3. 独立完成用户调研、竞品分析、需求梳理、功能架构、业务流程、产品原型及 PRD 撰写，确保需求逻辑清晰、规则完整并具备可执行性。\n4. 协同 UI/UX、研发、测试、内容运营及市场团队推进产品开发，跟进排期、评审、验收和上线过程，及时识别并解决项目中的风险与问题。\n5. 结合业务发展探索会员订阅、广告、虚拟权益、任务奖励、邀请推广等商业化及增长机制，在兼顾用户体验的基础上提升留存、活跃和付费转化。\n6. 建立并持续关注核心产品指标，通过用户反馈、行为数据和转化漏斗评估功能效果，定位问题并提出后续优化方案。\n7. 关注动漫、漫画、视频及内容社区行业趋势，持续研究同类产品的内容组织、推荐分发、社区互动和商业化模式，为产品创新提供可落地的建议。\n\n任职要求：\n1. 本科及以上学历，具有2年以上互联网产品相关经验，能够独立负责较完整的产品模块或版本迭代。\n2. 熟悉产品工作的完整流程，具备较强的需求分析、逻辑梳理、原型设计和文档表达能力，能够熟练使用 Figma、Axure、墨刀等产品工具。\n3. 具备良好的项目推动能力，能够协调设计、研发、测试和运营等不同团队，推动需求按计划落地。\n4. 具有数据意识，能够围绕用户活跃、留存、转化和付费等指标发现问题，并据此制定产品优化方案。\n5. 对内容社区、动漫漫画、视频娱乐或会员订阅类产品有一定理解，能够站在用户和业务两个角度思考产品方案。\n6. 沟通清晰、执行力强，对产品细节敏感，能够适应快速迭代及多任务并行的工作节奏，具备基本的平台内容安全与合规意识。\n\n加分项：\n1. 有内容社区、视频、漫画、二次元或海外互联网产品经验。\n2. 有从0到1参与产品搭建或新业务上线的实际经验。\n3. 熟悉会员订阅、广告变现、邀请裂变或用户激励体系。\n4. 具备基础的数据分析能力，熟练使用 Excel、SQL或相关数据分析工具。\n5. 对动漫、漫画及二次元内容有长期兴趣，熟悉国内外主流内容平台和用户生态。", "cat": "产品与管理"}, {"id": "321", "title": "产品增长运营（SEO/GEO方向）", "salary": "15-25K", "location": "", "jd": "### 岗位职责\n  1. 研究海外市场、竞品、关键词和搜索意图，持续发现产品及内容机会。\n  2. 负责SEO与GEO（生成式引擎优化），包括站点结构、技术SEO、内容规划、主题集群、结构化数据及AI搜索曝光。\n  3. 跟踪关键词排名、自然流量、搜索收录、AI引用及最终转化效果。\n  4. 与研发、设计协作，推动产品从调研、上线到持续迭代。\n  5. 探索社区、联盟、内容合作和广告等海外获客渠道。\n  6. 优化注册、激活、留存、订阅和付费转化漏斗。\n  7. 设计增长实验，评估转化率、收入、成本和投入产出比。\n  8. 使用AI完成关键词聚类、内容生产、用户分析和运营自动化。\n  ### 任职要求\n  1. 2年以上产品、增长、SEO或海外运营经验，完整负责过增长项目。\n  2. 有SEO实战经验，熟悉搜索意图、内容策略、站内优化、外链及效果分析。\n  3. 理解GEO基本方法，关注Google AI Overviews、ChatGPT等AI搜索和问答入口。\n  4. 能根据数据判断自然流量质量，而非只关注收录量和访问量。\n  5. 熟悉用户转化漏斗，会使用分析工具；掌握SQL或类似数据查询能力。\n  6. 能面向英文市场开展内容和增长工作。\n  7. 执行力和结果意识强，能够亲自制作内容、配置页面并推进实验。\n  ### 加分项\n  有内容、社交、订阅、工具或泛娱乐产品经验；熟悉Google Search Console、GA、Ahrefs或Semrush；做过程序化SEO、结构化数据、外链建设、数字公关或AI搜索曝光监测；有从零获得海外自然流量或收入的经历。", "cat": "运营与市场"}, {"id": "322", "title": "动漫中级运营", "salary": "10–20K", "location": "", "jd": "中级运营（内容 / 社区 / 社媒方向）\n\n薪资范围：10–20K\n\n岗位职责\n\n1. 负责动漫、漫画内容平台的日常运营，围绕业务目标制定并执行运营计划，提升内容消费、用户活跃与留存。\n2. 结合平台内容、用户兴趣及热点趋势，开展内容选题、推荐、专题和活动策划，提升优质内容的曝光与用户参与度。\n3. 负责社区及社群运营，通过话题互动、活动策划和用户激励等方式，维护社区氛围，促进用户交流，挖掘和维护核心用户。\n4. 参与 X（Twitter）、Telegram等渠道的内容发布、用户互动及推广，结合不同渠道的特点优化运营方式，提升品牌曝光与平台引流效果。\n5. 跟踪内容表现、用户行为及活动数据，定期复盘，持续优化运营策略，支持用户增长、留存及付费转化。\n6. 与产品、设计、研发等团队协作，整理用户反馈，推动运营需求落地，改善用户体验。\n\n任职要求\n\n1. 具备 2 年及以上互联网运营经验，有内容平台、社区或泛娱乐产品相关经验者优先。\n2. 具备良好的内容判断力、文案表达及策划能力，能够根据平台特点和用户偏好调整内容与沟通方式。\n3. 理解用户增长、活跃、留存和转化的基本逻辑，能够独立完成运营项目的策划、执行与复盘。\n4. 具备基础数据分析能力，能使用 Excel 等工具整理和分析运营数据，并提出可执行的优化方案。\n5. 主动性和执行力强，具备良好的沟通协作能力，能合理安排工作优先级并推动项目落地。\n\n加分项\n\n• 喜欢动漫、漫画，熟悉二次元文化、相关热点及用户兴趣。\n• 有 X（Twitter）、Telegram 等社媒或社群运营经验，有内容传播、用户增长或引流案例。\n• 了解 SEO，有关键词研究、内容优化或自然搜索流量增长经验。\n• 熟悉 AIGC 工具，能用于内容创作、图片或视频制作，提升运营效率。\n• 有内容付费、会员订阅或其他商业化运营经验。\n\n欢迎在投递时附上运营案例、账号链接或作品，并简要说明个人职责及项目成果。", "cat": "运营与市场"}, {"id": "323", "title": "短剧编导", "salary": "20-25K", "location": "", "jd": "岗位职责：\n1. 负责 AI 短剧、漫剧项目的选题策划、剧本评估与改编，把控故事结构、人物设定与节奏；\n2. 将剧本拆解为可执行的分镜脚本，明确镜头语言、场景、角色状态与生成要求，对接 AIGC 制作环节；\n3. 统筹单个项目从剧本到成片的制作进度与质量，组织样片评审，提出修改意见；\n4. 跟踪平台数据与用户反馈，沉淀题材、节奏、钩子等方面的创作经验，反哺剧本库与制作标准；\n5. 参与制作 SOP 与剧本评级标准的建设与迭代。\n\n任职要求：\n1. 责任心强，对项目结果负责，能够同时推进多个项目并按时交付，具备良好的跨部门沟通与团队协作能力；\n2. 影视、戏剧、编导、中文等相关专业，3 年以上短剧、网剧或短视频内容策划/编导经验，有独立完成短剧项目的作品；\n3. 具备扎实的剧本判断能力和分镜拆解能力，熟悉竖屏短剧的叙事节奏与付费点设计；\n4. 了解 AI 生成内容的制作逻辑与局限，能够按 AI 生产方式改写剧本与分镜，有 AI 短剧/漫剧项目经验者优先。", "cat": "内容与创作"}, {"id": "324", "title": "AIGC制作", "salary": "15-20K", "location": "", "jd": "岗位职责：\n1. 根据分镜脚本，使用 AI 工具完成角色、场景、道具的视觉资产生成，并保证跨镜头一致性；\n2. 完成图生视频/文生视频、配音配乐、字幕与后期剪辑，输出符合平台规范的成片；\n3. 维护角色卡、场景卡、提示词库等制作资产，按 SOP 归档，保证可复用；\n4. 参与制作流程与工具的测试、反馈与优化，配合技术侧完成自动化工具的验证；\n5. 按项目排期完成产量与质量指标。\n\n任职要求：\n1. 责任心强，工作细致，能够按排期保质保量完成任务，对自己产出的每一个镜头负责；\n2. 影视、动画、设计、数字媒体等相关专业，2 年以上视频剪辑或视觉设计经验；\n3. 熟练使用主流 AI 生成工具（如 Midjourney、Stable Diffusion/ComfyUI、即梦、可灵、Runway等），熟悉提示词编写与参数调整，有角色一致性控制经验者优先；\n4. 熟练使用剪辑与后期软件（Premiere、After Effects、剪映等），具备良好的画面审美和镜头感；\n5. 学习能力强，对新工具、新模型敏感，能够快速掌握并应用于生产；\n6. 中高级剪辑师简历池中有意愿转制者，具备第 1、4、5 条即可，AI 工具部分由部门安排培训。", "cat": "其他"}, {"id": "325", "title": "中级UI/UX设计师", "salary": "15-20k", "location": "", "jd": "薪资范围：15-20K\n岗位职责\n1.负责Web、H5、APP等产品的UI/UX设计，包括需求分析、交互设计、视觉设计及落地验收。\n2.负责设计规范与组件库建设，确保多端设计的一致性与可复用性。\n3.熟练运用AI工具辅助设计，提高设计效率与交付质量。\n4.运用VibeCoding进行页面开发、交互验证及原型实现，推动设计高效落地。\n\n任职要求\n1.2年以上UI/UX设计经验，具备优秀的视觉审美、交互设计能力及完整项目经验。\n2.精通Figma，熟悉Web、H5、APP设计规范及响应式设计。\n3.熟练使用ChatGPT、Claude、Midjourney等AI工具，具备AI辅助设计工作流经验。\n4.具备VibeCoding能力，熟悉Cursor、Codex等工具，能够通过AI辅助完成前端页面及交互开发。\n5.了解HTML、CSS等前端基础技术，能够与开发团队高效协作。\n6.具备良好的产品思维、沟通能力及独立解决问题的能力，配合意识强。", "cat": "内容与创作"}, {"id": "326", "title": "中高级产品运营", "salary": "10K-30K", "location": "", "jd": "负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的视频产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营与市场"}, {"id": "327", "title": "AI短剧编剧（兼选题、角色设定）", "salary": "12-20k", "location": "", "jd": "岗位职责\n1. 跟踪短剧、网文、漫画及社交平台热点，建立题材库和选题储备库。\n2. 结合目标用户、平台特点和商业化方向，完成竞品拆解及选题判断。\n3. 输出选题方案，明确受众、核心卖点、题材类型、主要冲突和差异化亮点。\n4. 完成世界观、人物关系、角色小传及主要角色的性格、外形、身份、动机和成长线设定。\n5. 完成故事大纲、分集梗概和分集剧本，设计前三集钩子、情绪爆点、反转及集尾悬念。\n6. 负责人物对白、动作、表情和场景描述，保证人物行为逻辑及剧情前后统一。\n7. 结合AI生成能力控制人物数量、场景数量、复杂动作和特效难度，提升剧本落地效率。\n8. 根据剧本审核、分镜及成片反馈及时修改，并沉淀人物档案和剧情时间线。\n\n任职要求\n1. 2年以上短剧、网文、漫画、影视编剧或内容策划经验。\n2. 至少熟悉男频、女频、甜宠、逆袭、悬疑、都市等一种主流题材。\n3. 具备选题判断、故事结构、人物塑造、冲突设计和对白创作能力。\n4. 熟悉短剧前三集留人、强情绪推进、连续反转及集尾卡点逻辑。\n5. 能够独立完成角色设定、故事大纲及分集剧本。\n6. 了解AI生图、视频生成的能力边界，能够编写适合AI制作的剧本。\n7. 熟练使用ChatGPT、Claude等AI工具辅助调研、创作和一致性检查。\n8. 应聘时需提供选题方案、人物小传、剧本或已上线作品。", "cat": "内容与创作"}, {"id": "328", "title": "AI短剧分镜师", "salary": "15k-23k", "location": "", "jd": "岗位定位\n负责将审核通过的剧本转化为可直接执行的镜头方案，是文字内容与AI视觉制作之间的核心衔接岗位。\n\n岗位职责\n1. 将分集剧本拆解为标准分镜脚本和镜头清单。\n2. 明确每个镜头的景别、机位、构图、角色、动作、表情、台词、时长和运镜方式。\n3. 设计镜头衔接、人物调度、节奏变化和情绪呈现。\n4. 根据角色设定及场景设定输出镜头画面描述、参考图需求和提示词方向。\n5. 结合AI生图及视频工具的能力边界判断镜头可实现性，减少复杂群像、动作和运镜返工。\n6. 控制单集镜头数量和制作难度，平衡成片效果、制作周期和生成成本。\n7. 与编剧确认剧情表达，与视频生成岗位确认技术实现，与剪辑岗位确认成片节奏。\n8. 审核生成的关键帧和视频镜头，根据样片效果补充、替换或调整分镜。\n9. 沉淀常用景别、动作、运镜和提示词模板，提高后续制作效率。\n\n任职要求\n1. 2年以上影视、动画、漫画、广告、短视频或动态漫分镜经验。\n2. 熟悉景别、构图、轴线、机位、人物调度和镜头叙事。\n3. 能够独立将文字剧本转化为结构清晰、可制作的镜头表。\n4. 理解主流AI生图及视频生成工具的能力边界。\n5. 具备较强的画面想象力、节奏感和成本意识。\n6. 具备绘画能力，或能够使用AI工具快速制作分镜参考图。\n7. 有AI短剧、动态漫画、漫剧或批量内容生产经验者优先。\n8. 应聘时需提供分镜作品或现场完成指定剧本的镜头拆解。", "cat": "内容与创作"}, {"id": "329", "title": "AI视频生成师", "salary": "18k-25k", "location": "", "jd": "岗位职责\n1. 根据角色设定、场景设定和分镜要求生成角色图、场景图及镜头关键帧。\n2. 运用提示词、参考图、模型、LoRA和节点工作流控制人物、服装、场景及画风一致性。\n3. 完成人物换装、表情调整、局部重绘、扩图、换背景和细节修复。\n4. 根据分镜完成图生视频或文生视频，实现人物动作、表情变化、镜头运动和环境变化。\n5. 处理人物变形、五官漂移、肢体异常、多指、背景抖动、画面闪烁及道具错误。\n6. 根据生成结果调整首尾帧、提示词、模型和参数，提高镜头成功率及稳定性。\n7. 与分镜师确认镜头实现方案，根据剪辑及质检反馈完成补镜、延展和返修。\n8. 对图片和视频素材进行筛选、命名、归档及版本管理。\n9. 记录模型、提示词、参数、生成次数、成本和失败原因，持续优化标准工作流。\n10. 持续测试不同生图及视频模型，形成适合不同题材、动作和运镜的工具方案。\n\n任职要求\n1. 1年以上AI生图、AI视频、动画、视觉设计或影视后期经验。\n2. 熟练使用至少一种主流AI生图工具及一种AI视频生成工具。\n3. 熟悉ComfyUI或其他节点式工作流。\n4. 熟悉LoRA、ControlNet、IP-Adapter、局部重绘、首尾帧控制等方法。\n5. 具备基础美术、构图、色彩、光影、镜头和人物动作判断能力。\n6. 能够解决角色一致性、场景一致性、画风漂移和视频稳定性问题。\n7. 具备较强的测试、复盘和成本意识，能适应批量生产及多轮返修。\n8. 应聘时需提供AI图片、AI视频作品及对应工具和工作流说明。", "cat": "内容与创作"}, {"id": "330", "title": "AI短剧配音师/音频制作", "salary": "18k-25k", "location": "", "jd": "岗位职责\n1. 根据人物年龄、性格、身份和情绪设计声音方案，建立角色声线档案。\n2. 使用真人或AI配音工具完成台词配音，保证角色声音前后一致。\n3. 根据剧情调整语速、停顿、重音、语气和情绪强度。\n4. 处理错读、吞字、机械感、情绪不符、音量不一及口型不同步问题。\n5. 完成音频降噪、剪切、音量统一和基础混音。\n6. 根据剧情需要配置环境音、动作音效及基础背景音乐建议。\n7. 与编剧确认台词含义，与剪辑确认节奏、口型和音画同步。\n8. 管理声音模型、音频素材、授权记录和版本文件，避免声音及音乐侵权。\n9. 根据质检反馈及时完成补录、替换及音频返修。\n\n任职要求\n1. 1年以上配音、音频制作、短剧后期或AI语音生成经验。\n2. 具备良好的语言表达、人物理解和情绪判断能力。\n3. 熟悉至少一种AI配音工具及基础音频编辑软件。\n4. 能够调整语速、停顿、重音、音色和情绪参数。\n5. 具备基础降噪、剪辑、混音和音量标准化能力。\n6. 对声音一致性、口型同步和音频版权风险具有较强敏感度。\n7. 有短剧、动画、有声书、游戏角色或多角色配音经验者优先。\n8. 应聘时需提供配音或音频制作作品。", "cat": "内容与创作"}, {"id": "331", "title": "AI短剧剪辑师", "salary": "10k-15k", "location": "", "jd": "岗位职责\n1. 根据剧本和分镜筛选镜头并完成粗剪、精剪和成片输出。\n2. 调整剧情节奏、人物情绪、镜头停留时间、转场和集尾卡点。\n3. 整合配音、背景音乐、环境音和关键音效，保证音画节奏统一。\n4. 完成字幕制作，检查错字、漏字、称谓、时间轴和字幕可读性。\n5. 处理画面比例、基础调色、转场、包装和平台规格适配。\n6. 识别缺失镜头、剧情断点、动作不连续及情绪不连贯问题，并提出补镜需求。\n7. 检查黑帧、跳帧、闪烁、人物变形、画面穿帮、音画不同步及音量异常。\n8. 根据审核和质检意见完成修改，并输出不同平台需要的尺寸、码率和格式。\n9. 管理剪辑工程、素材引用、成片版本和交付文件，保证可追溯。\n10. 结合完播率和用户流失节点复盘剪辑节奏，持续优化成片模板。\n\n任职要求\n1. 2年以上短剧、短视频、动画、影视或信息流视频剪辑经验。\n2. 熟练使用Premiere、DaVinci、Final Cut、剪映等至少一种剪辑工具。\n3. 对剧情节奏、人物情绪、声音表达和集尾悬念有较强判断。\n4. 具备字幕、配乐、音效、基础调色和画面包装能力。\n5. 能够识别AI视频常见的变形、跳变、闪烁和连续性问题。\n6. 工作细致，具备较强的质量意识和版本管理意识。\n7. 了解不同平台的视频规格及音乐、字体、声音等素材版权风险。\n8. 应聘时需提供完整短剧、动画或剧情类成片作品。", "cat": "内容与创作"}, {"id": "332", "title": "SEO 专员", "salary": "15K-25K", "location": "", "jd": "一、岗位职责\n1.        负责公司 Web 站点的 SEO 优化与自然流量增长，制定并执行站内外优化方案，推动收录量、关键词排名与自然流量（UV）持续提升；\n2.        负责站内 SEO 优化，涵盖关键词研究与布局、TDK、URL 结构、内链体系、站点地图、结构化数据（Schema）、页面加载速度与移动端体验等，提升搜索引擎友好度；\n3.        负责站外 SEO 与外链建设，拓展高质量外链与合作渠道，提升域名权重（DR / PA）与品牌曝光；\n4.        配合内容团队规划选题与发布机制，结合关键词与用户搜索需求布局长尾流量，提升内容页收录与排名；\n5.        跟踪 Google、Bing 等搜索引擎算法与规则变化及竞品策略，及时调整优化方案，规避降权 / 沙盒等风险；\n6.        协同研发推动 SEO 技术需求落地，解决索引、抓取、重定向、Canonical、Sitemap、Robots、Hreflang 等技术问题；\n7.        建立 SEO 数据监控体系，定期输出流量、收录、排名、外链等数据报告，量化运营成果并提出优化建议。\n二、任职要求\n1.        2 年以上 SEO / Web 运营相关经验，有内容 / 视频 / 工具类站点自然流量增长经验者优先；\n2.        熟悉 SEO 原理与站内外实操，了解搜索引擎收录与排名机制，有实际的关键词排名与流量增长案例；\n3.        熟练使用 Google Search Console、Google Analytics、Ahrefs、SEMrush、Screaming Frog、5118 等 SEO / 数据分析工具；\n4.        了解 HTML、网站结构与基础前端知识，能与研发协作推动 SEO 技术需求落地；\n5.        有海外 / 多语言站点 SEO 经验者优先，具备一定内容运营与文案策划能力；\n6.        数据驱动、结果导向，学习能力强，思想开放、接受成人内容行业。", "cat": "运营与市场"}, {"id": "333", "title": "新媒体运营", "salary": "10k-16k", "location": "", "jd": "一、岗位职责\n1. 根据业务需求，开展国内KOL合作推广或海外社交媒体运营，提升品牌曝光、用户增长及引流转化；\n2. 拓展和维护国内KOL、达人及垂类创作者资源，完成达人筛选、主动触达、合作洽谈、内容沟通与上线跟进，持续优化合作效果；\n3. 负责海外社交媒体渠道（TikTok、Discord、Reddit、Twitter / X、Telegram、Instagram等）的账号或社群搭建、日常运营与推广，结合不同平台特点制定内容与互动策略；\n4. 策划图文、短视频、话题及社群活动，制定内容日历与推广计划，把控内容质量和发布节奏，提升粉丝增长、互动率与用户活跃度；\n5. 跟踪达人合作及各渠道推广数据，围绕曝光、互动、引流、注册和转化等指标复盘，持续优化达人选择、内容方向与推广方式；\n6. 关注平台规则、行业热点及竞品动态，挖掘新渠道与合作机会，配合站内运营做好流量承接，沉淀可复用的推广方法。\n二、任职要求\n1. 具备2年以上新媒体运营、达人合作或社交媒体推广相关经验，有视频、娱乐、泛文化类项目经验者优先；\n2. 具备以下任一方向的能力或经验：\n   - **国内KOL方向：**熟悉抖音、小红书、B站、微博等平台的达人生态，能够独立完成KOL筛选、主动触达、合作推进及关系维护；有成熟达人资源或成功合作案例者优先；\n   - **海外推广方向：**具备海外多平台新媒体推广实操经验，熟悉TikTok、Discord、Reddit等平台中的至少两个，能够结合平台规则、内容形式及社区文化开展内容推广、社群互动与用户增长；\n3. 具备良好的内容策划、文案表达与沟通协调能力，对热点和用户兴趣敏感，能够推进合作内容或推广活动落地；\n4. 具备数据分析与复盘能力，能根据推广效果调整策略；有可展示的达人合作、账号增长或引流转化案例者优先；\n5. 海外推广方向需具备良好的英语读写能力，能够独立完成英文内容发布及社区沟通；具备短视频制作、剪辑或其他语言能力者加分。", "cat": "运营与市场"}, {"id": "334", "title": "中高级产品运营", "salary": "10k-15k", "location": "", "jd": "岗位职责\n1. 产品运营与迭代推进：负责某AI全系产品的日常运营工作，深度对接产品、技术团队，收集用户反馈、使用痛点及功能需求，整理数据复盘报告，输出产品优化建议，推动产品功能迭代、体验升级，提升产品核心竞争力。\n2. 用户全链路运营：搭建并完善用户运营体系，负责新用户拉新、留存、激活、转化全流程工作；维护核心用户社群，日常答疑、互动活跃，挖掘高价值用户，搭建用户成长体系，提升用户粘性、复购率及口碑传播力。\n3. 内容与渠道运营：独立策划、产出适配AI产品的推广内容（干货教程、使用案例、功能拆解、行业方案等），覆盖公众号、小红书、抖音、知乎、社群等全渠道；负责各运营渠道的日常维护、流量撬动、内容分发，持续拓宽产品曝光渠道，获取精准用户流量。\n4. 活动策划与落地：结合产品节点、市场热点、用户需求，独立策划拉新、促活、转化、裂变类运营活动，完成活动方案撰写、落地执行、数据追踪、复盘优化全流程，达成月度/季度用户增长、营收转化目标。\n5. 数据复盘与策略优化：建立日常运营数据监测体系，重点监控用户新增、活跃度、留存率、转化率、渠道ROI等核心数据，定期输出运营复盘报告，基于数据问题迭代运营策略，持续提升运营效率与成果。\n6. 品牌与市场辅助：协助完成产品品牌基础曝光、行业资源对接、合作渠道维护，整理产品案例、行业解决方案，助力某AI产品品牌影响力持续提升，配合完成团队其他运营相关工作。\n\n任职要求\n1. 学历经验：本科及以上学历，3-5年及以上互联网产品运营、用户运营、内容运营相关全职经验，有AI工具、SaaS产品、互联网初创团队运营经验者优先\n2. 能力要求：熟悉互联网产品运营全流程，具备独立策划运营活动、产出推广内容、运营用户社群的能力；具备基础数据分析能力，能够通过数据发现问题、优化策略。\n3. 行业认知：对AI行业、智能工具产品有浓厚兴趣，愿意深耕AI产品运营领域，了解主流AI产品玩法及用户需求痛点者优先。\n4. 核心素养：逻辑清晰、执行力强，具备良好的自主驱动力和问题解决能力；擅长沟通协作，能够高效对接跨部门团队；抗压能力强，目标感明确，适配初创团队快节奏工作模式。\n5. 技能加分：擅长文案撰写、短视频内容制作、新媒体渠道运营；有私域裂变、用户增长、ToB产品运营实战经验者优先。", "cat": "运营与市场"}, {"id": "335", "title": "LLM 应用研发工程师", "salary": "20-35k", "location": "", "jd": "LLM应用研发工程师\n岗位职责\n1. 图像与视频生成：基于 ComfyUI 搭建生图、生视频工作流，完成文生图、文生视频、图生视频、视频插帧等任务，支持内容批量生产。\n2. 人物一致性与画面优化：实现视频换头、换脸及人物一致性控制，优化人脸对齐、特征融合与时序连贯性，修复人物变形、画面闪烁等问题。\n3. 工作流沉淀与自动化：沉淀提示词模板、LoRA 配置与工作流 SOP，使用 Python 完成调试、批量处理及业务接口对接，提升生成效率并控制算力成本。\n4. 业务效果迭代：根据业务反馈持续优化内容质量，配合完成 AI 角色相关的图像、视频内容生成与交付。\n任职要求\n1. 具备 1–3 年 AIGC 图像或视频生成实战经验，能独立完成工作流搭建、效果调优与内容交付，学历不限。\n2. 熟练使用 ComfyUI，能够独立搭建、调试复杂工作流；熟悉 Stable Diffusion、FLUX、LTX 系列等模型，掌握 ControlNet、LoRA 的应用。\n3. 熟悉人脸检测、对齐及图像融合方法，了解 MTCNN、RetinaFace 等工具，能够处理人物一致性和视频连贯性问题。\n4. 具备基础 Python 编程能力，能够进行工作流调试、接口调用与批量任务处理。\n5. 具备画面审美和内容质量判断能力，会使用剪映或 Premiere 完成基础剪辑与后期处理。\n6. 需提供本人参与的作品或落地案例，说明使用的模型、工作流、个人负责部分及解决的具体问题。\n加分项\n- 有视频换脸、数字人或 AI 角色内容批量生产经验。\n- 有 LoRA 训练、数据集整理或开源模型 GPU 部署与性能优化经验。\n- 有 LLM 应用经验，能够将 Prompt、Agent 工具调用或 RAG 与内容生成工作流结合。\n- 有 ComfyUI 自定义节点开发、TTS 语音生成或音画同步经验。\n- 熟悉二次元、网文、AI 陪伴或海外成人向互动娱乐内容，能够理解相关业务需求。", "cat": "技术开发"}, {"id": "336", "title": "高级 UI/UX 设计师（交友 / 社交方向）", "salary": "22-35k", "location": "", "jd": "【岗位职责】\n1. 主导 App 与网站的介面与体验设计，定义整体设计方向\n2. 从零建立并管理设计系统，确保可扩充性与跨端一致性\n3. 主导用户研究、资讯架构与流程设计，透过数据与可用性验证（含 A/B 测试）推动决策\n4. 独立产出高品质视觉与平面素材（H5 banner、封面、行销物料），把关团队整体设计品质\n5. 与 PM、工程师、运营等跨部门协作，推动设计落地\n\n【任职要求】\n1. 5 年以上 UI/UX 设计经验，能独立主导项目并定义设计方向\n2. 须提供作品集（Portfolio），需含主导的完整产品专桉，及设计系统建置桉例\n3. 设计相关科系毕业，或具同等实务经验\n4. 具备强系统感与设计判断力，能决策设计方向与优先顺序\n5. 精通 Figma，能建立可扩充、语意化的设计系统并落地，含 Library 管理与版本控管\n6. 完整 UX 功底：用户研究、资讯架构、流程设计、可用性验证与 A/B 测试\n7. 能撰写设计规范与设计决策文件，建立并优化团队设计流程\n8. 熟悉全栈 iOS / Android / RWD 介面设计与进阶互动原型\n9. 具备扎实平面设计能力，精通 Photoshop / Illustrator\n10. 能运用 AI 工具（AI 生成图、Figma AI、Claude 串接 MCP 等）提升设计与交付效率\n11. 具设计提桉与向上沟通能力，能向利害关係人说明并说服设计决策\n12. 具商业思维，能将商业目标转化为设计策略；能指导并提升团队设计水准\n13. 抗压性佳，能在快节奏迭代下维持设计品质\n\n【加分条件】\n\n・HTML/CSS\n\n・付费内容 / 社群平台设计经验\n\n・成人产业隐私与金流体验设计经验\n\n・暗色模式与多语系介面经验\n\n・国际化合规", "cat": "内容与创作"}, {"id": "337", "title": "供给增长运营专员", "salary": "20-30k", "location": "", "jd": "岗位职责\n资源挖掘与触达：通过社交 App（陌陌、Soul 等）、社群、内容平台、招募/兼职群等多平台多渠道，主动挖掘并触达陪玩、伴游、向导、网红、模特等供给资源。\n评估、洽谈与签约：对意向资源做初步评估与筛选，沟通讲解合作模式，完成洽谈与线上签约，持续扩充供给规模。\n资源维护与激活：维护已签约资源关系，用资源、分成、成长路径等卖点吸引并留住优质供给，保持其活跃与履约。\n线上获客渠道运营：拓展并运营短视频投流（抖音/快手等）、CPA/CPS 联盟、站长换量、达人/代理、社群等线上渠道，获取有陪玩/伴游需求及喜欢线上擦边社交的精准用户。\n私域承接与复购：将公域流量沉淀进私域，做社群运营、客户分层、促活与促复购，提升用户价值与生命周期贡献。\n渠道开发与测试：持续开发新的线上资源与获客渠道，做渠道测试与效果评估，保留优质渠道、淘汰低质渠道。\n资源库与台账管理：建立资源库、渠道台账与标签体系，沉淀可复用的资源与渠道资产。\n数据复盘与反作弊：监控资源数量与质量、获客成本（CPA）、付费转化、复购等核心指标，做归因分析、识别假量水量、优化预算。\n风控与协作：把控线上渠道与账号安全（防封号、防渠道失效），与产品、运营、资源 BD 团队协同推进。\n\n任职要求\n线上资源获取实战（硬性要求）：做过通过线上渠道挖掘、招募、签约供给资源（主播/达人/网红/模特/陪玩/伴游等），或线上获客的工作，并拿过结果。\n自带线上资源/渠道者优先：手握可直接动用的线上供给资源或获客渠道，进来即能产出。\n熟悉渠道玩法：多平台线上挖掘签约、短视频投流、CPA/CPS 联盟、站长换量、社群/私域裂变等。\n数据驱动 + 反作弊：对数据敏感，会做漏斗、归因与 ROI 分析，能识别联盟假量水量、把控渠道质量。\n过往业绩：简历需体现可量化的成果（签约资源数量、新增规模、获客成本、付费转化、复购等具体数字与优化幅度），并能讲清自身贡献。\n软性素质：沟通谈判强、嗅觉敏锐、执行力强、抗压。\n强烈优先：有娱乐经纪、直播公会、主播/达人招募、MCN，或陪玩、伴游、同城社交、交友、擦边社交类产品的线上渠道、招募或获客经验者。\n对擦边/灰色业务无顾虑。\n\n注：学历、年限不作硬性限制，以线上资源获取与转化成绩为准。", "cat": "运营与市场"}, {"id": "338", "title": "运营经理 （高级运营（成人、交友、AI）", "salary": "22-35k", "location": "", "jd": "负责社交/社区/成人向产品的运营与商业化，对核心经营指标负责。\n核心要求：数据导向 + 强实操——能自己取数、自己下场、用数据拿结果。\n\n岗位职责：\n\n主导产品整体运营策略与体系建设，对 DAU、留存、付费率、ARPU、营收/流水负责；每个指标有目标、有拆解、有周期复盘，涨跌能归因到具体动作。\n亲自操盘用户全生命周期（拉新→激活→留存→付费→召回），搭建分层、成长、激励、付费、召回机制，并落地执行、盯盘数据、快速迭代。\n设计并迭代会员、礼物、虚拟消费、私密内容付费解锁、订阅等变现玩法；针对大 R（高价值/重氪用户）做专属运营与维系，用数据定价格、定权益、定节奏。\n建设用户标签体系，跑 A/B 测试，做漏斗诊断与转化归因，基于数据制定并动态调整策略——结论用数据说话，不拍脑袋。\n亲手策划并落地运营活动，结合擦边/成人流量特点做私域承接与渠道运营（不依赖主流投放平台）；统筹成人向 IP、擦边网红 / 达人合作与跨团队资源，对重点项目与活动 ROI 负责。\n紧跟擦边/成人/AI C端/社交社区行业的玩法与趋势，把被验证有效的打法快速搬进来试、用数据验证后保留或淘汰。\n沉淀运营方法论与 SOP，指导初级运营，提升团队执行效率。\n\n任职要求：\n\n强实操：独立操盘过完整运营线或核心业务（用户线 / 付费线 / 某社交场景），从策略制定到落地执行真正拿过结果。\n数据导向（硬性）：能自己取数（SQL / BI 看板）、搭建指标与标签体系、设计 A/B 测试、做漏斗诊断与转化归因。\n突出业绩：做出过可量化的规模化成果（DAU、留存、付费率、营收/流水达行业可观量级），并能讲清自身关键作用。\n行业背景（以下之一即可）：擦边社交（如陌陌 / 探探 / Soul 类）、成人向、AI C 端产品、社交社区 / 语聊 / 直播；或伴游、楼凤、网聊、陪玩等成人/擦边服务赛道，有实际 C 端运营经验即可。\n熟悉社交/社区的用户增长与商业化：虚拟消费、会员、大 R、礼物打赏、私域。\n对擦边/成人向内容与业务无顾虑。\n工作效率高，推动力强，抗压能力好。\n\n注：学历、年限不作硬性限制，以操盘能力、实操与数据结果为准。\n\n加分项：\n有擦边社交、成人向、直播打赏、语聊、网聊、陪玩、伴游、楼凤、AI 陪伴等赛道的操盘经验。\n有 AI C 端 / AIGC 类产品的运营经验。\n有出海或海外华人市场运营经验。\n带过小团队或主导过跨团队项目。", "cat": "运营与市场"}, {"id": "339", "title": "运营经理（高级网站运营）", "salary": "18K-28K", "location": "", "jd": "岗位职责\n1.负责网站整体运营工作，制定并落地网站运营策略，对新增用户、活跃用户、留存率、自然流量、转化率等核心业务指标负责。\n2.负责网站内容生态建设，包括栏目规划、内容规划、专题策划及运营策略制定，持续提升内容质量、用户体验及网站竞争力。\n3.负责网站核心页面（首页、频道页、详情页、专题页、搜索页、活动页等）的运营规划及持续优化，提升页面点击率、访问深度、停留时长及转化效果。\n4.建立网站数据分析体系，持续监控流量、用户行为、内容表现、SEO表现及业务指标，定期输出数据分析报告及优化建议。\n5.基于数据分析持续优化用户增长、用户留存、内容消费及转化路径，推动网站核心指标持续增长。\n6.制定网站内容运营策略，建立内容生产、审核、发布、更新及生命周期管理机制，持续提升内容价值及运营效率。\n7.配合 SEO 团队制定搜索流量增长策略，负责关键词规划、专题布局、内容优化、内链建设、页面结构优化及搜索体验提升，推动自然流量增长。\n8.与产品、研发、设计团队协同推进网站功能优化、后台工具建设、运营自动化及用户体验优化，提高整体运营效率。\n9.建立网站运营规范及 SOP，包括内容发布规范、页面检查机制、数据监控机制、质量管理机制及运营复盘体系。\n10.持续开展竞品分析及行业研究，跟踪行业动态、搜索趋势及用户需求变化，输出运营策略及产品优化建议。\n11.策划并推动专题活动、频道运营、榜单推荐、热点运营、内容合集等增长项目，提升网站流量、用户活跃度及内容传播效果。\n12.建立网站运营预警机制，及时发现流量异常、内容异常、SEO异常及用户行为变化，并推动相关团队快速完成问题闭环。\n13.统筹跨部门项目，协调产品、技术、SEO、设计、内容等团队资源，保障重点运营项目按计划交付并达成业务目标。\n14.定期输出网站运营日报、周报、月报及专项分析报告，为业务决策提供数据支持，并持续沉淀运营方法论。\n15.持续探索 AI 工具、自动化运营及数据化管理能力，不断提升网站运营效率和团队交付能力。\n\n岗位要求\n\n1.3 年以上网站运营、平台运营、内容运营、增长运营等相关经验，具备独立负责网站运营项目经验。\n2.熟悉网站整体运营体系，能够独立制定运营策略、拆解业务目标并推动项目落地。\n3.熟悉 CMS、网站后台及页面配置，具备栏目规划、专题运营、内容管理及页面优化经验。\n4.具备优秀的数据分析能力，熟悉新增、DAU、PV、UV、CTR、CVR、留存率、跳出率、用户路径等核心运营指标，并能够通过数据驱动业务优化。\n5.熟悉 Google SEO 运营体系，理解关键词规划、页面结构、内容优化、内链建设、Schema、收录机制及自然流量增长逻辑。\n6.具备网站增长思维，熟悉用户增长、内容增长及搜索增长策略，能够独立制定增长方案并推动落地。\n7.具备较强的项目管理能力，能够统筹多个运营项目，合理协调资源并确保项目按计划完成。\n8.具备优秀的问题分析及解决能力，能够快速定位业务问题并提出可执行的优化方案。\n9.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Looker Studio 等数据分析工具，能够独立完成数据分析及业务复盘。\n10.熟练使用 Excel、Google Sheets、飞书表格等办公工具，能够建立数据模型及运营报表。\n11.具备优秀的沟通协调能力，能够高效协同产品、研发、SEO、设计及内容团队推进项目落地。\n12.具备较强的学习能力和业务敏感度，持续关注行业趋势、搜索算法及用户需求变化。\n13.具备2年以上团队管理经验，有网站运营团队、内容运营团队或项目团队管理经验，能够进行目标拆解、任务分配、绩效管理及团队培养，推动团队高效达成业务目标。\n\n加分项\n\n1.有大型内容平台、社区平台、资讯平台、聚合平台或流量站运营经验。\n2.有海外中文网站、Google SEO 流量站或海外互联网产品运营经验。\n3.有多站点、矩阵站点或国际化网站运营经验。\n4.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Ahrefs、SEMrush、Screaming Frog、Looker Studio 等工具。\n5.有网站增长、SEO增长、内容增长或用户增长成功案例，能够量化展示业务成果。\n6.熟悉 AI 工具在网站运营中的应用，具备内容生成、数据分析或运营自动化实践经验。\n7.熟悉 SQL、Python、Shell 等工具，可进行数据分析、运营自动化及批量处理。\n8.有 Telegram、Twitter（X）、Facebook、Reddit、Discord 等海外渠道运营经验。\n9.有产品运营、商业化运营、团队管理或跨部门项目管理经验。\n\n我们希望你具备\n\n1.具备网站整体运营思维，能够从业务目标出发制定运营策略。\n2.结果导向，对流量增长、用户增长、留存及转化等核心指标负责。\n3.数据敏感，能够通过数据分析发现问题并持续优化业务表现。\n4.具备较强的项目管理能力，能够统筹资源推动重点项目落地。\n5.关注用户体验，持续优化内容质量、页面结构及用户访问路径。\n6.主动发现问题，能够独立提出解决方案并推动闭环执行。\n7.具备优秀的跨团队沟通能力，与产品、研发、SEO、设计及内容团队高效协作。\n8.保持学习和创新意识，持续关注行业趋势、AI 工具及运营新模式。\n9.善于复盘总结，沉淀运营方法论，持续提升团队运营效率。", "cat": "运营与市场"}, {"id": "340", "title": "中级运营（数据分析师）", "salary": "16K–28K", "location": "", "jd": "岗位职责\n\n1. 负责公司核心业务的数据分析工作，建立和完善数据分析体系、指标体系及数据监控机制，为业务决策提供数据支持。\n2. 深入分析用户、产品、运营、销售及市场等业务数据，识别业务增长机会、风险及关键影响因素，输出具有业务价值的分析报告和优化建议。\n3. 主导专题分析项目，包括用户增长、留存分析、转化漏斗分析、渠道效果分析、经营分析、用户画像及 A/B Test 效果评估，推动业务持续优化。\n4. 搭建并维护 BI 看板、经营分析报表及数据可视化平台，持续提升数据分析效率和数据质量。\n5. 与产品、运营、市场、研发等团队紧密合作，深入理解业务需求，推动数据驱动的产品优化、运营策略及业务决策落地。\n6. 参与数据仓库、数据模型及指标口径建设，优化数据分析流程，提升数据治理能力。\n\n任职要求\n\n1. 本科及以上学历，统计学、数学、计算机、信息管理、经济学等相关专业。\n2. 5 年及以上数据分析相关工作经验，有互联网、Web平台、社交产品、电商行业经验者优先。\n3. 精通 SQL，具备复杂数据查询、数据建模及性能优化能力。\n4. 熟练使用 Python（Pandas、NumPy 等）进行数据分析，能够独立完成数据处理及专题分析。\n5. 熟悉 Power BI、Tableau、Looker、FineBI 等至少一种 BI 工具，能够独立搭建数据分析看板。\n6. 熟悉统计分析方法、A/B Test、漏斗分析、留存分析、用户画像等常用分析方法，具备较强的商业分析和数据洞察能力。\n7. 具备优秀的逻辑思维、沟通协调及项目管理能力，能够推动跨部门协作并促进分析成果落地。\n8. 具有较强的业务敏感度，能够将数据洞察转化为可执行的业务策略。\n\n加分项\n\n熟悉 Hive、Spark、ClickHouse 等大数据平台。\n具备数据仓库（Data Warehouse）、ETL 或数据治理经验。\n有预测分析、机器学习或推荐算法相关经验。\n有团队管理或大型数据分析项目负责人经验。", "cat": "运营与市场"}, {"id": "341", "title": "运营经理（流量（WEB）部副主管）", "salary": "20-35k", "location": "", "jd": "岗位职责\n1、负责网站整体运营管理，制定并落实网站运营策略，推动业务目标达成。\n2、负责网站内容运营、协助SEO优化、首页及频道页运营、专题策划等工作，持续提升网站流量及用户活跃度。\n3、负责网站核心数据监控与分析，包括新增用户、DAU、PV、UV、留存率、跳出率、收录量、关键词排名等，并制定优化方案。\n4、负责网站内容规划与运营规范建设，持续优化栏目结构、页面布局及用户体验。\n5、制定并执行Google SEO及站内SEO优化策略，推动网站收录、关键词排名及自然流量持续增长。\n6、协同产品、研发、设计等部门推进网站功能优化、需求迭代及项目落地，确保按计划交付。\n7、建立网站运营SOP、数据分析体系及工作流程，提高团队执行效率和运营质量。\n8、负责运营团队日常管理，包括工作安排、任务跟进、绩效考核、培训指导及人才培养。\n9、定期开展行业研究及竞品分析，结合业务目标提出运营优化方案。\n\n\n岗位要求\n\n熟悉网站运营全流程，具备独立负责网站运营项目经验。\n熟悉Google SEO、站内SEO及基础技术SEO知识。\n具备较强的数据分析能力，能够根据数据制定优化策略。\n熟悉内容运营、流量运营、用户运营及增长运营。\n能独立制定运营计划、项目推进方案及阶段性复盘。\n具备优秀的跨部门沟通协调及项目管理能力。\n\n加分项\n1、有Google、yandex SEO成功增长案例。\n2、有百万级以上流量网站运营经验优先。\n3、有资讯、视频、小说、漫画、社区等内容平台运营经验。\n4、有网站从0到1搭建或改版经验。\n5、有运营团队（5人以上）管理经验。\n6、有数据分析、A/B测试及增长运营经验。\n7、熟悉AI内容生产、自动化运营工具及工作流。\n\n我们希望你具备\n\n1、强烈的目标意识和结果导向，对业务增长负责。\n2、良好的逻辑思维能力，能够通过数据发现问题并提出解决方案。\n3、优秀的执行力和推动力，能够高效推进项目落地。\n4、较强的责任心，能够主动承担工作并持续优化流程。\n5、良好的团队管理能力，能够培养团队成员成长。\n6、优秀的沟通协调能力，能够高效协同产品、研发、设计等部门。\n7、持续学习能力，关注行业动态、新工具及运营方法论。\n\n试用期交付要求\n\n试用期内需完成：\n\n1、熟悉公司产品、网站业务及运营流程，了解各网站定位、运营模式及核心业务指标。\n2、对负责网站进行全面诊断，输出《网站运营分析报告》，至少提出20项可落地的优化建议（包含内容运营、SEO、页面体验、产品功能、数据分析等方向）。\n3、梳理当前网站运营流程，识别存在的问题，并提出优化方案及优先级。\n4、完成网站核心数据分析，建立基础运营数据看板，并形成日报、周报模板。\n5、制定未来1个月网站运营计划，包括内容运营、内容SEO优化、专题运营、用户增长等重点工作安排。\n6、推动至少1项运营优化需求或项目落地，并完成效果验证及复盘。\n7、与产品、研发、设计等相关团队建立协作机制，能够独立推进需求评审及项目跟进。", "cat": "运营与市场"}, {"id": "342", "title": "中级运营（网站产品运营）", "salary": "16k–25k", "location": "远程办公", "jd": "网站产品运营 | HC：1 | 全远程\n\n品牌：（面向英国、欧洲高端跨文化社交平台）\n\n岗位简介\n\n我们是聚焦欧洲市场的出海初创增长团队，核心成员拥有英国本地互联网运营经验，现阶段冷启动深耕英国、欧洲高端跨文化社交赛道。本岗位是自然流量增长核心岗：把搜索流量转化为注册用户与付费会员。\n核心硬性要求：具备英文PC/M网站站独立实操能力，熟悉欧洲用户搜索习惯，拒绝模板化套用；优先英国/欧洲/北美/澳洲留学经历或海外出海项目经验，英语可借助AI工具辅助产出，熟悉欧美澳年轻人网络黑话、社交语境，对海外文化高度感兴趣、学习意愿强；深度玩过各类海内外交友软件，自带产品洞察，是互联网重度冲浪选手，具备极强热点敏感度与网感。\n\n你的核心工作内容\n\n1. 英国&欧洲市场PC/M网站策略落地：结合海外交友用户真实行为习惯调研本地搜索意图，制定全域关键词布局方案；负责站内页面技术优化、监控Google收录、排名、流量数据，定期复盘搜索流量→注册→付费的全转化链路。\n\n2. 全站核心页面日常运营：维护首页、欧洲各城市落地页、Creator主页、视频页、品牌介绍页，结合社交产品用户浏览偏好优化页面结构，保障页面信息合规完整、适配Google收录规则；批量优化标题、Meta Description、内链结构。\n\n3. 三条英文内容线运营（本地化优先）\n\n◦ 博客线：紧跟海外情感、婚恋、社交热点，借助AI工具完成英文内容撰写后人工校对润色，贴合英式表达习惯，面向英国高净值本土用户，沉淀长期Google搜索权重；\n\n◦ 故事线：快速捕捉留学、跨文化交友全网热门话题，灵活运用欧美澳网络流行话术、年轻人常用黑话，产出匿名故事撬动社交分享长尾流量；\n\n◦ 问答线：结构化整理欧美交友用户高频搜索问题，全覆盖长尾关键词流量入口，文案风格贴合本地年轻人说话习惯。\n\n4. Creator档案全流程上架管理：基于平台用户喜好维护头像、封面、素材、简介、城市标签、活跃状态；严格遵循英国GDPR、欧盟内容版权与隐私法规，上架前全维度合规审核，全年无重大合规事故。\n\n必备任职要求\n\n1. 有相关SEO经验，懂欧美搜索引擎底层逻辑，可独立完成关键词调研、页面优化、收录问题排查，只会套用固定模板勿投；\n\n2. 具备基础英文读写能力，可熟练借助AI翻译、润色工具产出地道文案，能自主校对修正AI生硬表达；愿意主动学习欧美澳年轻人俚语、网络黑话，理解海外社交语境；\n\n3. 熟练使用Google Search Console、GA4等海外官方数据分析工具，能通过数据定位流量问题、迭代优化方案；\n\n4. 重度互联网冲浪，长期玩各类海内外交友、约会类软件，懂用户痛点、社交玩法与传播逻辑，能快速捕捉全网最新热点、流行玩法，具备天然网感；思想开放包容，对欧美、澳洲生活与社交文化抱有浓厚兴趣；\n\n5. 会基础图片裁剪、压缩、素材上传；具备极强合规意识，熟悉海外版权、用户隐私规范，工作严谨细致。\n\n优先加分项\n\n1. 拥有英国/欧洲/北美/澳洲留学经历，或海外市场本土网站完整实战案例；\n\n2. 有社交平台、创作者经济、海外留学社区、会员订阅制平台运营经验；\n\n3. 熟练运用AI工具批量产出内容，同时具备人工精细化校对能力，把控本地化内容质量。\n\n\n工作模式\n\n全远程灵活办公\n全国均可居家办公；日常国内作息即可，只需工作时段可与英国总部办公时间重合，同步海外流量节点迭代。\n \n无名海象已参与此文档。", "cat": "运营与市场"}, {"id": "343", "title": "中级运营（海外私域流量运营）", "salary": "15k-22k", "location": "远程办公", "jd": "# 海外私域流量运营 | HC：1| 全远程\n\n品牌：（面向英国、欧洲高端跨文化社交平台）\n\n## 岗位简介\n\n我们正在寻找一位海外私域运营，负责平台用户的承接、转化、留存与复购。岗位核心不是单纯做曝光，而是围绕官网注册用户、咨询用户、付费用户和创作者线索，搭建一套稳定的私域运营体系，把站外流量和站内用户沉淀到可持续触达、可持续转化、可持续复购的私域池中。\n\n本岗位面向英国、欧洲市场，重点通过 WhatsApp、Telegram、Email、站内消息、社群群组、CRM 自动化触达 等方式，完成用户注册后的激活、会员转化、内容互动、创作者入驻跟进与流失召回。\n\n### 核心硬性要求\n\n* 有海外私域运营、用户运营、CRM 运营、社群运营或转化运营经验；\n* 熟悉欧美用户对私域触达、消息频率、隐私边界和沟通节奏的接受方式；\n* 能独立使用英文进行沟通，可借助 AI 工具提升写作与翻译效率，但需要自己判断语气和边界；\n* 熟悉 WhatsApp、Telegram、Email、Instagram DM、Facebook Group 等私域触达方式；\n* 理解英国、欧洲、北美或澳洲的留学生社群、跨文化社交和会员型产品的基本运营逻辑；\n* 具备较强的用户分层、标签管理、转化跟进和复盘能力；\n* 能接受 18+ 成人关系社交平台的业务属性，理解授权、隐私、合规与内容边界。\n\n## 你的核心工作内容\n\n### 1. 用户私域承接与转化\n\n* 承接来自官网、站外社媒、合作渠道和活动页的注册用户、咨询用户和高意向用户；\n* 按用户状态进行分层管理：新注册用户、浏览未注册用户、已咨询未付费用户、已付费会员、流失会员、创作者线索；\n* 通过站内消息、Email、WhatsApp、Telegram 等方式推动用户完成注册激活、首次互动、会员付费和持续留存；\n* 建立不同用户类型对应的话术、触达频率和转化节奏，避免过度打扰或低质量轰炸；\n* 跟进高意向用户的咨询、异议处理和付费推进，提升注册到付费的转化效率。\n\n### 2. CRM 标签体系与自动化运营\n\n* 搭建基础 CRM 标签体系，记录用户来源、城市、语言、兴趣、会员状态、互动偏好、内容偏好和活跃状态；\n* 设计欢迎语、激活提醒、未读消息提醒、会员到期提醒、内容更新提醒、创作者上新提醒等自动化触达；\n* 根据用户行为数据做分层触达，例如：注册后 24 小时未激活、浏览多次未注册、会员到期前提醒、沉默用户召回等；\n* 配合产品和技术团队优化触达链路，提升消息打开率、回复率和转化率；\n* 定期检查自动化流程，避免触达过密、重复触达或误发。\n\n### 3. 社群与私域池运营\n\n* 维护海外用户社群、留学生社群、会员群组和兴趣群组；\n* 通过群内话题、活动预告、内容分发、问答互动、会员福利和创作者动态，提高社群活跃度；\n* 负责社群规则、入群审核、群内秩序和基础风控；\n* 结合平台活动、创作者更新和内容节点，策划私域专属互动玩法；\n* 将社群中高意向用户导回站内会员体系、内容消费和创作者互动页面。\n\n\n## 必备任职要求\n\n1. 有私域运营、用户运营、CRM 运营、社群运营或转化运营经验；\n2. 具备较强英文沟通能力，能独立完成私信、邮件、社群消息和转化跟进；\n3. 对欧美用户、留学生社群、会员产品和跨文化沟通有基本理解；\n4. 熟悉 WhatsApp、Telegram、Email、站内消息或 CRM 工具中的至少一种；\n5. 能长期、细致地跟进用户状态，不怕重复沟通和多轮推进；\n6. 具备数据意识，能清楚记录来源、转化结果和留存情况；\n7. 能接受 18+ 成人关系社交平台的业务属性，理解授权、隐私与合规边界。\n\n## 优先加分项\n\n1. 有英国 / 欧洲 / 北美 / 澳洲留学经历，或熟悉当地社群生态；\n2. 有 Dating、会员制产品、社群产品、创作者平台或海外增长经验；\n3. 熟悉 WhatsApp、Telegram、Reddit、小红书、Instagram 等平台的社群管理和私域转化玩法；\n4. 能独立搭建基础私域分层、标签和跟进机制；\n5. 对英国本地高端人群、留学生群体和城市生活方式内容有敏感度；\n6. 有小规模社群、会员池、KOC 或博主合作经验。\n\n## 核心考核指标\n\n* 私域有效触达量与有效回复率；\n* 注册用户激活率与会员转化率；\n* 社群活跃度与复购率；\n* 创作者入驻线索转化率；\n* 用户召回率与流失挽回率。\n\n## 工作模式\n\n* 全远程灵活办公；\n* 全国均可居家办公；\n* 日常国内作息即可，但需要在关键时间段覆盖英国及欧洲活跃时段；\n* 与产品、站内运营、内容、增长和技术团队保持高频同步。", "cat": "运营与市场"}, {"id": "344", "title": "运营专员（视频剪辑专员）", "salary": "6k-10k", "location": "", "jd": "视频剪辑专员\n岗位职责\n\n1、根据平台内容定位、更新策略及用户需求，自主收集、筛选并整理相应的成人类视频资源。\n2、负责视频素材的剪辑、裁切、转码、画面调整、水印添加及基础包装，确保成片符合平台发布标准。\n3、使用 Photoshop 独立完成视频封面制作，包括素材处理、人物排版、标题设计及整体视觉优化。\n4、根据视频内容编写标题、简介等相关文案，准确匹配分类及标签。\n5、熟悉成人视频内容体系，能够准确判断不同题材、演员、剧情、场景及内容特征，避免分类和标签错误。\n6、结合平台数据、用户偏好及行业热点，持续优化选片、剪辑、封面和内容发布方向。\n7、按照平台要求完成视频质量检查，重点检查清晰度、音画同步、画面比例、水印、黑帧及内容完整性。\n8、负责素材归档、文件命名及资源管理，建立清晰、可追溯的视频素材库。\n9、配合内容运营团队完成视频批量处理、上传发布、内容调整及其他相关工作。\n10、遵守平台内容规范、版权要求及审核机制，及时处理不符合标准的素材。\n\n岗位要求\n1、具备视频剪辑相关经验，有成人内容平台、影视平台或短视频平台工作经验者优先。\n2、熟练使用 Premiere Pro、剪映等剪辑软件，能够独立完成完整的视频处理流程。\n3、熟悉 Photoshop，能够独立制作视频封面，并具备一定的排版、配色和视觉审美能力。\n4、能够接受成人内容工作环境，对成人类视频具备一定的理解和判断能力。\n5、熟悉常见成人视频题材、分类及标签，能够准确完成内容归类和标签匹配。\n6、具备较强的资源收集、筛选及整理能力，能够根据平台更新策略主动寻找合适内容。\n7、了解常见视频格式、分辨率、码率及画面比例，具备基础的视频质量判断能力。\n8、工作认真细致，具备较强的执行力、责任心及时间管理能力，能够按要求完成每日任务。\n9、具备良好的团队协作意识，能够及时沟通素材、剪辑及内容发布过程中出现的问题。\n\n加分项\n1、有成人视频、影视、短视频或内容平台剪辑经验。\n2、熟悉主流成人内容网站、资源渠道及行业热门内容趋势。\n3、了解 FFmpeg 或其他批量视频处理工具。\n4、具备批量剪辑、批量转码、批量加水印或自动化处理经验。\n5、有独立搭建素材库、分类体系或视频处理 SOP 的经验。\n6、具备较强的热点判断能力，能够根据用户偏好快速调整选片方向。\n7、有 AI 工作流使用经验，能够运用 ChatGPT、Claude、Gemini 等工具辅助资源整理、标题文案、分类标签、封面设计及批量视频处理；有相关自动化流程搭建经验者优先。\n8、有 Telegram（TG）频道运营经验，熟悉频道内容发布、资源整理、用户维护及基础数据统计者优先。\n\n我们希望你具备\n1、能够根据平台更新策略主动收集和筛选资源，而不仅是等待分配素材。\n2、能够独立完成从资源筛选、视频剪辑、封面制作到分类标签填写的完整流程。\n3、对成人内容分类和用户偏好有一定敏感度，能够准确判断视频的核心特点。\n4、具备基础审美和质量意识，能够持续优化画面、封面及内容呈现效果。\n5、能够在保证质量的前提下提高工作效率，按时完成批量内容生产任务。\n6、保持学习意识，持续关注行业趋势、剪辑方法、AI 工具及平台内容变化。", "cat": "内容与创作"}, {"id": "345", "title": "产品经理（中高级/高级 · 数据增长方向）", "salary": "20k-35k", "location": "", "jd": "岗位：产品经理（中高级/高级 · 流量方向）｜HC 1\n\n岗位职责\n1、负责内容流量类 Web 产品矩阵（漫画、视频、资讯等多站点）核心模块的规划与迭代，对自然流量增长、搜索收录与排名、用户留存及广告变现等核心指标负责。\n2、主导 SEO 类需求的产品化落地：站内结构与页面模板优化、聚合页与内链体系、收录与状态码治理等，与 SEO 团队协作制定并推进增长方案。\n3、参与广告变现体系设计与迭代：广告版位规划与配置、变现效率优化，兼顾用户体验与收益平衡。\n4、基于数据分析、用户行为与竞品洞察，挖掘流量增长与商业化机会，推动产品创新。\n5、搭建产品关键指标体系，通过漏斗分析、A/B 测试及分层运营持续优化转化与留存。\n6、独立负责需求全流程：需求梳理、原型设计、评审排期、测试验收、上线复盘，多产品线并行推进。\n7、跨团队（研发、设计、SEO、运营、商业化）协同推动项目高质量落地，对产品经营结果负责，定期复盘并制定增长策略。\n\n任职要求\n1、本科及以上学历，3 年以上互联网 C 端产品经验；5 年以上且有独立带线经验者按高级评估。\n2、具备完整产品生命周期管理经验，独立负责或主导过日活 10 万以上量级的 Web/内容类 C 端产品，并取得可量化的流量增长、留存或商业化成果；主导过日活 30 万以上产品且有完整增长案例者优先。\n3、产品背景不限于内容站，资讯、漫画、视频、工具导航、社区等以自然流量为主的 to C 产品经验均可。\n4、熟悉 SEO 与自然流量增长机制（收录、排名、站内结构、内容聚合、多站点矩阵），有可验证的实操成功案例者优先。\n5、理解广告变现模式（展示广告、联盟、直客版位）及会员订阅、增值服务等付费场景设计。\n6、数据驱动，熟练运用数据分析、A/B 测试与漏斗模型发现问题、验证假设并指导决策；逻辑清晰，结构化思维能力强。\n7、具备出色的 0-1 落地与实操能力，原型与需求文档功底扎实，入职一周内可独立接手需求，即到即战。\n8、能适应多产品线并行的工作节奏，兼具单线深耕与多项目统筹、优先级管理能力；工作时间可配合覆盖平日晚间及周六时段。\n9、工作效率高，具备较强的创业精神与业务推动力，能在快速变化、资源有限的环境下持续创造价值。\n10、熟悉简中互联网内容生态与用户心智；对站群运营、程序化 SEO、AI 辅助内容生产等方向有理解者优先。", "cat": "产品与管理"}, {"id": "346", "title": "AI内容编辑（AI短剧编剧）", "salary": "12K–15K", "location": "", "jd": "AI短剧编剧（AI Screenwriter）\n\n岗位职责\n负责 AI 漫剧项目的世界观设定、人物设定、剧情开发及系列化内容策划；\n独立完成故事梗概（Logline）、故事简介（Synopsis）、分集大纲（Episode Outline）、场次设计（Scene Breakdown）及完整剧本创作；\n建立人物弧光（Character Arc）、剧情弧线（Story Arc）及人物关系网，保证长线剧情逻辑统一；\n完成剧情节拍（Beat）、戏剧冲突、情绪节点、反转、悬念、集尾钩子及付费点设计；\n控制信息释放节奏、剧情密度及人物动机，提高用户留存率及完播率；\n与导演共同开展故事板开发（Storyboard Workshop），参与剧本可视化设计及场次拆分；\n根据项目数据持续优化剧情结构、对白节奏及角色塑造。\n\n任职要求\n具备完整的商业剧本开发能力，能够独立完成故事梗概、剧情架构、分集大纲、场次拆分及系列剧本创作，并建立完整的人物弧光、剧情弧线及人物关系体系。\n熟悉三幕式、五幕式等经典叙事结构，能够合理设计剧情节拍、戏剧冲突、人物动机、剧情反转及集尾悬念，在保证故事逻辑的同时兼顾商业化节奏。\n具备较强的角色塑造能力，能够通过对白、行为及剧情推进体现人物成长，并根据导演及制作需求持续优化剧本内容。\n熟悉短剧、动画、漫画或影视剧创作流程，对系列化 IP 开发及长线剧情设计有一定理解，有实际作品者优先。\n\n加分项\n有动画、漫画、短剧、影视剧本创作经验；\n熟悉 AI 辅助编剧工作流；\n有商业化内容创作经验或爆款作品。", "cat": "内容与创作"}, {"id": "347", "title": "AI内容编辑（AI短剧导演）", "salary": "15K–18K", "location": "", "jd": "AI短剧导演\n\n岗位职责\n根据剧本完成故事板设计及镜头语言设计；\n与编剧共同进行故事板开发，完成剧本可视化；\n输出故事板、镜头表、机位设计、景别设计及镜头调度方案；\n制定人物调度、演员调度、场面调度及镜头运动方案；\n控制画面节奏、叙事节奏、情绪节奏及视觉重心；\n指导 AI 视频制作完成镜头落地，并进行镜头审核；\n完成精剪，优化节奏、转场、蒙太奇关系及镜头衔接；\n对整集内容的视觉表达及最终成片质量负责。\n\n任职要求\n能够独立完成剧本可视化，根据剧本输出专业故事板、镜头表及导演阐述，并具备完整的镜头设计能力。\n熟悉镜头语言、场面调度、人物调度、景别设计及镜头运动设计，能够合理运用构图法则、轴线原则、连续性剪辑及蒙太奇等影视语言完成视觉叙事。\n具备较强的画面节奏控制能力，能够根据剧情调整镜头节奏、情绪节奏及视觉重心，并完成成片精剪及最终质量把控。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro，具有动画、短剧、影视或 AI 内容导演经验者优先。", "cat": "内容与创作"}, {"id": "348", "title": "AI内容编辑（AI视频制作）", "salary": "15K–18K", "location": "", "jd": "AI视频制作（AI Production Artist）\n\n岗位职责\n\n根据导演输出的故事板及镜头表完成 AI 内容生产；\n建立角色一致性（Character Consistency）、场景一致性（Environment Consistency）及数字资产库（Asset Library）；\n完成角色生成、场景生成、图生视频、镜头动画及素材制作；\n搭建并优化 AI 制作工作流，包括提示词工程、参考图控制、节点式工作流及模型调用；\n完成视频粗剪（Rough Cut）、字幕、配音、音效及初版包装；\n配合导演完成修改意见，输出最终交付版本。\n\n任职要求\n熟悉 AI 内容生产流程，能够根据故事板独立完成角色生成、场景生成、图生视频及整集内容制作，并保证角色一致性、场景一致性及整体视觉风格统一。\n熟悉提示词工程、参考图控制、节点式工作流及 AI 工作流搭建，能够根据项目需求优化生成效率及画面质量。\n能够独立完成素材整理、粗剪、字幕、音效、基础包装等后期制作，并具备一定的问题排查及工作流优化能力。\n熟悉 ComfyUI、Flux、Midjourney、Runway、Veo、Kling、Seedance 等 AI 工具中的一种或多种，有完整 AI 短剧、AI 动画或 AI 漫剧制作经验者优先。\n\n熟悉以下 AI 工具（至少部分）\nComfyUI，Flux，Midjourney，Stable Diffusion，Veo，Kling，Seedance，Runway，Pika，Luma\n\n熟练使用Premiere Pro，DaVinci Resolve或其他非线软件", "cat": "内容与创作"}, {"id": "349", "title": "AI内容编辑（AI短剧后期剪辑师）", "salary": "12K–18K", "location": "", "jd": "AI短剧后期剪辑师\n\n岗位职责\n负责 AI 漫剧项目的后期制作，根据导演完成的精剪版本进行成片精修，在不改变导演叙事意图的前提下，进一步优化剪辑点、动作衔接、视听连续性及整体完成度；\n负责对白、配音、环境声、拟音、音效及音乐的声音编辑与混音处理，根据剧情节拍建立完整的声音层次、情绪推进及视听节奏；\n负责 AI 生成素材的后期修整，处理生成镜头中常见的跳帧、闪烁、动作断裂、时序不连续、画面抖动及镜头衔接问题，并通过变速、补帧、遮罩、跟踪、合成等方式提高镜头可用性；\n根据项目视觉规范完成基础调色、镜头匹配、曝光及色彩统一，保证不同模型、不同批次生成素材之间的视觉连续性；\n负责字幕、片头片尾、基础动效、转场及项目包装，并按照平台技术规范完成母版输出、版本管理及最终交付；\n与导演共同完成终剪审核，根据修改意见完成后期调整，对成片的技术质量、声音质量及最终包装完成度负责。\n\n任职要求\n具备完整的影视后期制作能力，能够理解导演的剪辑意图和叙事节奏，熟悉连续性剪辑、动作匹配、视线匹配、节奏剪辑、平行蒙太奇、交叉剪辑等剪辑逻辑，能够判断一个剪辑点成立的叙事原因，而不是单纯按照音乐节拍拼接素材。\n具备较强的声音设计意识，能够完成对白编辑、降噪、响度控制、环境声铺设、拟音、音效设计及音乐编辑，并能够利用声音桥、声画对位、声画同步等方式强化场景空间感、情绪及戏剧节奏。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro 中至少一种专业非线性剪辑软件；能够完成基础调色、遮罩、跟踪、变速、关键帧及简单合成。熟悉 After Effects、Fusion、Audition 等后期工具者优先。\n需要理解 AI 生成视频的素材特性，能够识别并处理人物动作连续性、口型同步、画面闪烁、时序一致性、角色漂移、背景形变等常见问题。有 AI 漫剧、动画、短剧、影视后期或商业内容制作经验者优先。\n不接受仅会使用剪映套模板、自动字幕、卡点及预设转场，但缺乏影视剪辑逻辑和声音设计能力的候选人。\n作品要求\n面试需提供至少一部能够体现完整后期能力的作品，并说明本人具体负责的工作范围。\n作品审核重点关注：叙事节奏、剪辑点选择、动作连续性、声音设计、音乐使用、镜头匹配及整体完成度，不以单纯的特效数量或包装复杂程度作为评价标准。", "cat": "内容与创作"}, {"id": "350", "title": "AI内容编辑（网络小说作家）", "salary": "8K–14K", "location": "", "jd": "网络小说作家\n\n岗位职责\n负责 AI 短剧项目的前期 IP 内容开发，根据项目方向完成题材调研、内容策划及小说改编工作；\n深度研究网络文学市场，持续分析热门题材、爆款作品及用户阅读偏好，总结不同题材的核心爽点、人物关系、剧情节奏及商业化规律；\n根据项目需求，对指定题材或已有内容进行二次创作、剧情扩写、结构重组及人物深化，形成适合影视开发的小说版本；\n建立完整的世界观设定、人物关系网、人物成长线及剧情主线，保证长线剧情逻辑统一；\n完成剧情节拍设计、情绪推进、反转、悬念、高潮、集尾钩子等商业化内容设计，提高内容吸引力及持续阅读体验；\n输出完整的小说开发稿，包括人物设定、世界观设定、故事简介、章节内容及完整小说版本，并交付编剧进行剧本开发；\n持续建立公司 IP 储备库，沉淀原创故事、人物设定及可持续开发的内容资产。\n\n任职要求\n深度阅读网络文学，熟悉男频、女频、都市、悬疑、玄幻、仙侠、系统、重生、无限流、恋爱、校园等主流题材，能够准确分析作品爆点及商业价值。\n具备成熟的长篇小说创作能力，能够围绕人物成长、剧情推进及情绪节奏完成剧情扩写、人物深化及系列化内容开发，保证故事具有持续吸引力。\n熟悉网络文学创作规律，能够设计爽点、打脸、升级、反转、修罗场、悬念、人物成长及章节留钩，并理解不同平台读者的阅读偏好。\n具有优秀的文字驾驭能力，能够独立完成中长篇小说创作，有签约网络小说作者、责编、内容编辑或成熟创作经验者优先。\n能够熟练使用 AI 辅助创作工具进行资料整理、世界观整理及内容辅助创作，但具备独立完成原创及改编内容开发的能力。\n\n优先考虑\n有签约网络小说作者经历；\n有百万字以上完结作品；\n有短剧、漫画、动漫、游戏剧情创作经验；\n有 IP 改编或影视化开发经验。", "cat": "内容与创作"}, {"id": "351", "title": "AI内容编辑（AI影视资产生成）", "salary": "12K–18K", "location": "", "jd": "AI影视资产生成\n\n岗位职责\n负责公司 AI 影视数字资产体系建设，根据项目需求持续开发可重复使用的角色资产、场景资产、道具资产、服装资产、载具资产及环境资产；\n建立统一的数字资产规范，包括角色设定、风格规范、命名规则、版本管理、资产分类及数字资产库维护，保证不同项目之间的资产可复用性及一致性；\n根据导演及制作团队需求完成影视场景搭建、角色开发、服装设计、道具开发及风格设定，为内容制作提供标准化资产支持；\n搭建 AI 资产生产工作流，建立角色一致性、场景一致性、风格一致性及参考图控制方案，提高内容生产效率；\n建立 AI 工作流模板、模型预设、提示词模板及节点式工作流，持续优化数字资产生产效率；\n配合 AI 视频制作团队完成资产调试、问题修复及资产迭代，保证资产在不同模型及不同项目中的稳定调用；\n持续沉淀公司数字资产库，建立可持续迭代的影视资产体系，为后续项目及资产商业化提供基础支持。\n\n任职要求\n\n熟悉影视美术设计流程，具备较强的角色设计、场景设计、服装设计及道具设计能力，能够建立统一的视觉风格及数字资产规范。\n熟悉 AI 数字资产开发流程，能够完成角色一致性、场景一致性、风格统一、参考图控制及数字资产标准化管理，并理解资产复用及模块化开发理念。\n熟悉提示词工程、节点式工作流、模型管理及参考图工作流，能够独立搭建高复用性的 AI 资产生产流程，并持续优化生成效率及资产质量。\n熟悉数字资产管理、版本管理及命名规范，能够建立完整的资产分类体系及数字资产库，具备良好的工程化思维及团队协作能力。\n熟悉 ComfyUI、Stable Diffusion、FLUX、Midjourney 等 AI 图像工具，理解 LoRA、ControlNet、IP Adapter 等一致性控制技术，有 AI 影视、AI 动画、游戏美术或数字资产开发经验者优先。\n\n优先考虑\n有 Technical Artist（TA）、Environment Artist、Character Artist、Concept Artist、Asset Artist 等相关工作经验；\n有游戏、影视、动画、数字孪生或虚拟制作项目经验；\n熟悉 Blender、Maya、Cinema 4D、Unreal Engine、Houdini 等数字内容创作工具；\n有大型数字资产库建设或团队资产管理经验；\n有 AI 工作流开发、模型训练或 LoRA 制作经验。", "cat": "内容与创作"}, {"id": "352", "title": "SEO 专员", "salary": "20k-30k", "location": "", "jd": "岗位职责：\n1、负责公司网站及内容矩阵的 SEO 增长策略制定与落地，围绕业务目标持续提升自然搜索流量、收录、关键词排名及转化效果。\n2、独立负责多个网站（品牌站、内容站、专题站、多语言站）的整体 SEO 运营，包括站点规划、架构优化、内容策略及增长方案制定。\n3、制定关键词策略，完成核心词、长尾词、热点词、商业词等关键词布局，并持续优化内容质量与页面排名。\n4、主导站内 SEO 优化，包括网站结构、URL、TDK、内链、聚合页、标签页、Schema、Core Web Vitals、页面体验等持续优化。\n5、建立完整的技术 SEO 规范，协同研发团队解决索引、抓取、重定向、Canonical、Sitemap、Robots、Hreflang 等技术问题。\n6、建立内容运营规范，制定内容更新机制、专题策划、AI 内容生产规范及内容质量评估体系，提高整体内容竞争力。\n7、建立外链增长体系，拓展行业媒体、Guest Post、资源合作等渠道，持续提升网站权重及品牌曝光。\n8、持续关注 Google、Bing 等搜索引擎算法变化，及时调整 SEO 策略，降低算法风险，保障网站稳定增长。\n9、 熟练使用 Google Search Console、Google Analytics 4、Ahrefs、SEMrush、Screaming Frog 等工具，对流量、收录、关键词、转化及用户行为进行数据分析。\n10、推动 SEO 自动化建设，参与 SEO 工具、数据平台及 AI 内容工具需求设计，提高运营效率。\n11、建立 SEO 数据监控体系，定期输出 SEO 分析报告、增长复盘及优化方案，为业务决策提供数据支持。\n12、负责 SEO 相关知识沉淀，制定 SOP、培训团队成员，并推动 SEO 最佳实践在团队内部落地。\n\n岗位要求\n必须项\n3 年以上 Google SEO 实战经验，至少独立负责过 1 个以上完整网站项目。\n熟悉 Google、Bing 等搜索引擎工作原理及最新排名机制。\n熟练掌握 On-page SEO、Technical SEO、Off-page SEO 及内容 SEO 等优化方法。\n熟练使用 Google Search Console、Google Analytics 4、Screaming Frog、Ahrefs 或 SEMrush 等 SEO 工具。\n熟悉网站索引、抓取、收录、关键词布局、页面优化及外链建设全流程。\n熟悉 HTML、CSS 基础知识，了解 JavaScript 对 SEO 的影响，能够与研发团队高效沟通。\n具备优秀的数据分析能力，能够根据排名、收录、流量及转化数据持续优化策略。\n熟悉 AI 工具在 SEO 场景中的应用，如内容生成、关键词分析、数据整理及自动化运营。\n加分项\n有海外网站运营经验，熟悉英语或多语言 SEO。\n有矩阵站、站群、多域名项目运营经验。\n有资讯站、内容聚合站、社区类网站运营经验。\n熟悉 Cloudflare、CDN、服务器基础配置及网站性能优化。\n熟悉 Python、SQL、Shell 等任一脚本语言，可实现 SEO 数据自动化分析。\n有独立运营个人网站、博客或副业站经验，并取得一定自然流量成果。\n熟悉 AI SEO、Programmatic SEO（程序化 SEO）、自动化内容生成等先进 SEO 技术。\n有成功将网站自然流量提升至百万级以上 PV 或显著增长案例。\n\n其他要求\n1、入职后负责制定年度及季度 SEO 增长规划，并建立完整的 KPI 指标体系（收录、关键词、流量、转化、ROI 等）。\n2、试用期（3 个月）需完成以下交付成果：\n3、网站 SEO 全面诊断报告（技术、内容、外链）\n4、6 个月 SEO 增长规划及执行方案\n5、完成至少 5 项关键技术 SEO 优化\n6、推动至少 1 个 SEO 自动化工具或流程优化上线\n7、每周输出 SEO 数据分析报告，每月完成增长复盘及下一阶段优化计划。\n8、面试需结合实际案例进行分享，重点考察网站诊断能力、技术 SEO 能力、数据分析能力及增长思维。", "cat": "运营与市场"}, {"id": "353", "title": "数据工程师（数据采集方向）", "salary": "20K-35K", "location": "", "jd": "岗位职责\n1. 负责小说、漫画、视频网站等内容平台的数据采集系统设计、开发与维护。\n2. 负责多源站点的数据抓取、解析、清洗、去重、入库与质量校验，保障数据稳定、完整、及时。\n3. 设计高可用、高并发、可扩展的爬虫架构，支持任务调度、代理池、失败重试、限速控制、监控告警等能力。\n4. 针对复杂页面、动态渲染、登录态、风控策略等场景，制定稳定、合规、可持续的采集方案。\n5. 结合 AI 编程工具提升研发效率，包括代码生成、脚本开发、数据解析规则生成、异常定位、测试用例生成等。\n6. 负责采集链路性能优化，包括抓取效率、资源消耗、存储结构、任务吞吐与异常恢复能力。\n7. 与产品、内容、后端团队协作，支撑小说、漫画、视频等业务数据的搜索、推荐、聚合、更新与运营需求。\n8. 建立爬虫工程规范，包括代码规范、数据校验规范、异常处理规范、监控与日志规范。\n\n岗位要求\n1. 5 年以上后端或爬虫系统开发经验，至少 2 年以上复杂爬虫架构设计经验。\n2. 熟练掌握 PHP、Go、Python，具备线上高并发服务或大规模任务系统开发经验。\n3. 熟悉 Python 爬虫生态，如 Requests、httpx、aiohttp、Scrapy、BeautifulSoup、lxml、Playwright、Selenium 等。\n4. 熟悉 HTTP/HTTPS、Cookie、Session、Token、Headers、Referer、CORS、WebSocket 等网络协议与机制。\n5. 熟悉 HTML、CSS、XPath、正则、JSON、DOM 解析，能够处理多种网页结构与接口数据。\n6. 熟悉小说、漫画、视频类站点的数据结构特点，如章节、图片资源、播放源、剧集、清晰度、字幕、封面、标签、作者、更新状态等。\n7. 熟悉 MySQL、Redis、MongoDB、Elasticsearch 等常见存储或检索组件，有大数据量处理经验。\n8. 熟悉任务队列、定时任务、分布式调度、消息队列等机制，如 Redis Queue、RabbitMQ、Kafka、NSQ 等。\n9. 熟悉反爬与风控常见机制，具备代理池、UA 池、请求签名分析、动态参数解析、JS 渲染处理等实践经验。\n10. 熟练使用 AI 编程工具，如 ChatGPT、Claude、Cursor、GitHub Copilot、Codex 等，能结合业务场景提升开发、调试和文档产出效率。\n11. 熟悉 Linux 环境，具备 Shell 脚本、日志分析、服务部署、性能排查能力。\n12. 具备良好的工程质量意识，能够编写可维护、可监控、可回滚的生产级代码。\n\n加分项\n1. 有小说、漫画、短视频、长视频、影视聚合、内容搜索、资源站采集相关项目经验优先。\n2. 有 Go 高并发爬虫框架、PHP 业务后台、Python 分布式采集系统建设经验优先。\n3. 熟悉 Playwright、Puppeteer、Selenium、Chrome DevTools Protocol 等浏览器自动化工具优先。\n4. 熟悉 FFmpeg、M3U8、HLS、MP4、图片切片、视频播放源解析等音视频相关技术优先。\n5. 有大规模代理池、账号池、验证码识别、分布式采集节点管理经验优先。\n6. 有数据质量监控、内容去重、相似度识别、增量更新策略设计经验优先。\n7. 有 AI Agent、自动化代码生成、Prompt Engineering、RAG、LLM API 调用或 MCP 工具链使用经验优先。\n8. 有利用 AI 辅助爬虫规则生成、网页结构分析、异常日志归因、数据清洗策略生成经验优先。\n\n任职素质\n1. 对技术细节敏感，具备较强的问题定位和逆向分析能力。\n2. 有较强的系统性思维，能从稳定性、扩展性、成本和风险角度设计方案。\n3. 对新技术保持关注，能主动使用 AI 工具提升个人和团队研发效率。\n4. 责任心强，能保障核心数据链路稳定运行。\n5. 具备良好的沟通能力，能和产品、后端、运维、内容团队高效协作。", "cat": "采集与逆向"}, {"id": "354", "title": "测试工程师", "salary": "15K-28k", "location": "", "jd": "岗位职责\n1. 负责交友/社交类产品的测试工作，包括 App、H5、后台管理系统、服务端接口等核心链路。\n2. 深度参与需求评审、技术方案评审，识别产品、技术、数据、风控等潜在风险，制定测试计划和测试策略。\n3. 负责用户注册登录、资料编辑、匹配推荐、聊天 IM、动态广场、附近的人、会员权益、充值支付、举报拉黑、内容审核等核心功能测试。\n4. 设计并维护高质量测试用例，覆盖功能、接口、兼容性、性能、安全、异常场景及灰度发布验证。\n5. 推动自动化测试、接口测试、回归测试体系建设，提升测试效率和交付质量。\n6. 跟进线上问题定位与复盘，推动研发、产品、运营共同优化质量流程。\n7. 关注交友类业务特性，包括用户安全、隐私保护、反作弊、内容合规、风控策略等质量保障工作。\n8. 指导初中级测试工程师，沉淀测试规范、测试资产和质量标准。\n\n岗位要求\n1. 本科及以上学历，计算机、软件工程等相关专业优先。\n2. 6年以上测试经验，至少 2 年以上移动端 App 或社交/内容/直播/社区类产品测试经验。\n3. 熟悉 Android、iOS、H5、小程序等多端测试方法，具备较强的兼容性和用户体验测试意识。\n4. 熟悉服务端接口测试，能使用 Postman、Charles、Fiddler、JMeter、Apifox 等工具进行抓包、接口验证和问题定位。\n5. 熟悉 MySQL、Redis、日志查询等基础排查手段，能够协助定位数据、缓存、接口异常问题。\n6. 熟悉常见自动化测试框架或工具，如 Appium、Selenium、pytest、Jenkins、GitLab CI 等，有实际落地经验优先。\n7. 具备较强的业务理解能力，能从用户关系链、匹配效率、聊天转化、会员付费、内容安全等角度设计测试场景。\n8. 有较强的问题推动能力、沟通能力和风险意识，能在快节奏迭代中保障核心链路质量。\n\n加分项\n1. 有交友、婚恋、社交、直播、社区、陌生人社交产品测试经验。\n2. 熟悉 IM 即时通讯、音视频通话、推荐算法、LBS 定位、支付会员体系测试。\n3. 有性能测试、稳定性测试、自动化测试平台建设经验。\n4. 熟悉内容审核、用户举报、黑产作弊、风控策略相关测试。\n5. 有线上质量监控、灰度发布、崩溃分析、埋点验证经验。\n\n岗位亮点\n- 核心业务岗位，深度参与交友社交产品质量体系建设。\n- 业务场景复杂，覆盖 IM、推荐、支付、风控、内容安全等多模块。\n- 团队重视质量效率和技术沉淀，有较大成长空间。", "cat": "技术开发"}, {"id": "355", "title": "运营专员（数据分析师）", "salary": "15K-20k", "location": "", "jd": "岗位职责:\n1、负责公司旗下各App、网站产品的运营数据支持，包括日/周/月报的撰写与输出。\n2、及时发现并排查数据异常波动，并输出异常分析与处理建议。\n3、响应业务方提出的临时数据需求，帮助解决指标口径、数据提取、数据解读等问题。\n4、针对业务痛点开展专题分析，输出有洞察力的分析报告，辅助决策落地。\n5、参与数据治理相关工作，包括埋点需求评审与验收、数据质量监控及后台数据产品需求的提出与跟进。\n6、与产品、运营、开发等团队保持紧密沟通，识别业务中的增长机会、留存风险与异动原因，为业务迭代提供数据建议。\n\n任职要求：\n基本要求\n1、本科及以上学历，统计学、数学、计算机、信息管理或相关专业优先。\n2、三年以上数据分析相关工作经验，有移动端App或互联网运营分析经验者优先。\n3、熟练使用SQL，能够独立完成数据提取与多表关联查询；熟悉Python、R中的至少一种分析工具。\n4、熟悉常用数据分析方法，掌握留存分析、漏斗分析、同期群分析、转化归因等常用分析框架。\n5、具备良好的数据可视化能力，熟练使用Excel、BI工具（如Tableau、Power BI、DataEase等）或Python可视化库。\n6、具备较强的逻辑思维和业务理解能力，能够从数据中发现真实业务问题并给出可落地建议。\n7、具备良好的口头与书面表达能力，能清晰地向业务负责人和跨团队伙伴解释数据结论与分析逻辑。\n\n加分项\n有内容类、社交类、网站类的数据分析经验。\n有指标体系搭建或数据看板建设经验。\n能适应快节奏业务，有较强的自驱力和多任务并行处理能力。", "cat": "运营与市场"}, {"id": "356", "title": "ai工作流工程师", "salary": "25k-38k", "location": "", "jd": "AI 工作流工程师\n\n招聘人数：3人\n岗位级别：高级 / 资深\n技术栈：React / TypeScript + Go\n业务方向：在线视频 · 交友 · 出海社交\n\n📌 岗位职责\n\n1. 负责在线视频、交友类产品的全栈架构设计与核心功能开发，覆盖 H5 / PC / WebView 多端及服务端。\n2. 参与用户体系、视频播放、互动聊天、动态广场、关系链、推荐匹配、会员权益、支付结算等核心业务模块建设。\n3. 基于 React 进行组件化开发，使用 Go 进行高并发服务端开发，持续提升系统的可扩展性与稳定性。\n4. 参与工程化建设，覆盖构建优化、CI/CD、监控埋点、服务治理、限流降级等。\n5. 推进 AI 能力在全栈场景的应用落地，覆盖文本（对话/翻译/文案）、图像（生成/修图）、音频（TTS/语音识别）、视频（特效/理解/审核）等多模态方向。\n6. 参与 AI 工作流与 Agent 编排能力的工程化建设，包括流程配置、多模型串联、工具调用（Function Calling）等。\n7. 构建 AI 服务的稳定性保障体系，包括输出校验、安全过滤、成本控制、语义缓存、异常熔断与降级，将不稳定的模型输出转化为可靠可控的业务接口。\n\n🎯 任职要求\n\n1. 本科及以上学历，5 年以上开发经验。\n2. 前端能力：熟练掌握 React 及 TypeScript，具备大型项目开发经验。\n3. 后端能力：熟练掌握 Go 语言，有微服务或高并发系统经验（同时具备 PHP 经验者优先）。\n4. 熟悉 MySQL、Redis、消息队列等中间件，具备数据库建模与性能优化能力。\n5. 熟悉 Linux 环境，具备线上问题定位、服务部署与故障处理能力。\n6. 熟悉高并发、高可用架构设计，对限流、熔断、降级、灰度发布等有深入理解。\n7. 熟悉移动端 H5 开发，能处理适配、兼容、弱网、缓存等常见问题。\n8. AI 工程化：熟悉大模型 API 调用与调优，有文本/图像/音频/视频等至少一类多模态 AI 能力的实际集成经验；了解 Embedding、向量检索、RAG、AI Agent 等工作流相关技术。\n9. AI 稳定性：能够通过工程手段（格式校验、语义缓存、降级熔断、成本监控等）将不稳定的 AI 输出转化为稳定可靠的业务接口。\n10. 具备较强的技术探索意愿和产品意识，能在 AI 技术快速迭代的环境中主动跟进并推动落地。\n\n⭐ 加分项\n\n1. 有在线视频、直播、社交、交友、IM、音视频互动类产品经验。\n2. 熟悉视频播放器、HLS、WebRTC、弹幕、连麦等相关技术。\n3. 有跨端框架（React Native / Flutter）开发经验。\n4. 有大模型、RAG、AI Agent、智能客服或 AI 社交产品落地经验。\n5. 有 AI 多模态服务（图像生成/理解、TTS、视频处理等）落地经验。\n6. 有 AI 输出质量评估、幻觉检测、安全过滤方案落地经验。\n7. 有团队技术负责人或核心模块 Owner 经验。\n\n✨ 岗位亮点\n\n• 核心业务：千万级海外用户的视频社交产品，场景丰富。\n• AI 前沿：覆盖文本/图像/音频/视频全模态，涉及大模型工程化、向量检索、Agent 编排。\n• 全栈视野：从前端交互到服务端架构，完整技术链路掌控。\n• 成长空间：高级/资深岗位，技术决策空间大，鼓励创新与实验。\n• 国际化：全球化团队协作，开放的技术氛围。", "cat": "技术开发"}, {"id": "357", "title": "后端工程师", "salary": "28k-42k", "location": "", "jd": "1.\n负责在线视频、交友类 APP 及 Web 业务的服\n务端架构设计、核心功能开发与性能优化。\n2.\n参与用户体系、内容发布、视频播放、互动聊\n天、关系链、推荐匹配、会员权益、支付等核\n心业务模块建设。\n3.\n负责 PHP / Go 服务端系统开发，持续提升系\n统高并发、高可用、可扩展和可维护能力。\n4.\n参与 Web / H5 页面、Flutter 跨平台 APP、运\n营管理后台及内部工具开发，完成页面交互、\n接口联调和业务功能交付。\n5.\n具备从需求分析、数据建模、接口设计到前端\n实现、测试部署的全栈交付能力，推动前后端\n协同与公共能力复用。\n6.\n负责数据库、缓存、消息队列、异步任务等基\n础能力建设，优化核心链路性能。\n7.\n关注业务安全、风控、反作弊、接口防刷和内\n容安全，保障前后端鉴权、数据访问及核心业\n务链路安全。\n8.\n指导团队成员进行技术方案设计、代码 \nReview 和线上问题排查。\n9.\n将 AI 编程工具融入日常研发，辅助需求拆\n解、代码开发、重构、测试用例编写和技术文\n档整理，提升交付效率并对代码质量负责。\n1.\n本科及以上学历，计算机相关专业优先，8 \n年以上服务端开发经验。\n2.\n熟练掌握 PHP，具备 LNMP 架构下大型业务\n系统开发和调优经验。\n3.\n熟悉 Go 语言，有 Go 服务开发、微服务治理\n或高并发系统经验。\n4.\n熟悉 MySQL、Redis、消息队列等常用中间\n件，具备数据库建模、索引优化、缓存设计\n能力。\n5.\n熟悉 Linux 环境，具备线上问题定位、性能\n分析、服务部署和故障处理能力。\n6.\n具备复杂业务系统设计能力，能独立完成核\n心模块和关键服务架构设计。\n7.\n熟悉 HTML、CSS、JavaScript / \nTypeScript，熟练使用 Vue 或 React 至少一\n种主流前端框架，具备实际 Web / H5 或管理\n后台开发经验。\n8.\n熟悉 Dart / Flutter，具备跨平台 APP 开发经\n验，能够完成页面开发、路由与状态管理、\n网络请求及接口联调，了解 Android / iOS 平\n台适配和打包发布流程。\n9.\n对高并发、高可用、限流、降级、熔断、灰\n度发布、日志监控等工程实践有深入理解。\n10.\n熟悉前端组件化、路由、状态管理和构建工\n具，能够独立完成页面开发、接口联调、权\n限控制及常见兼容性与性能问题排查。\n11.\n具备端到端交付意识，能够统筹前后端接口\n契约、异常处理、测试验证、部署发布和线\n上监控。\n12.\n具备良好的业务理解能力、沟通协作能力和\n技术推动能力。\n13.\n具备 AI 编程工具的实际使用经验，如 \nCursor、Claude Code、Codex、GitHub \nCopilot 等，能结合项目上下文清晰描述任\n务、拆分需求并迭代验证结果。\n14.\n能独立理解、审查和调试 AI 生成的代码，通\n过测试与接口联调验证正确性，关注依赖兼\n容、权限边界及敏感数据保护。\n1.\n有在线视频、直播、短视频、社交、交友、\nIM、音视频互动类项目经验。\n2.\n有推荐匹配、用户画像、会员订阅、支付结\n算、内容审核、风控反作弊经验。\n3.\n有独立负责全栈项目、从 0 到 1 交付业务系\n统，或同时承担服务端与前端核心模块开发的\n经验。\n4.\n有复杂运营后台、移动端 H5、实时聊天界\n面、视频播放页面或 WebSocket 实时交互开\n发经验。\n5.\n有前端工程化、组件库建设、页面性能优化、\n自动化测试及 CI/CD 实践经验。\n6.\n有 Flutter 音视频播放、即时通信、原生插件\n集成、性能优化或 Android / iOS 双端上线经\n验。\n7.\n有大型 PHP 项目重构、PHP 到 Go 服务迁\n移、微服务拆分经验。\n8.\n有团队技术负责人、架构师或核心模块 \nOwner 经验。\n9.\n有利用 AI 工具完成跨端功能开发、旧项目重\n构、自动化测试或问题排查的实际案例，能说\n明本人贡献、提效效果及质量验证方式。\n1.\n以服务端架构与核心业务开发为主，兼顾全栈\n交付，深度参与在线视频与社交互动主链路建\n设。\n2.\n业务场景丰富，覆盖音视频、社交、推荐、\nWeb / H5、Flutter 跨平台 APP、运营后台、\n内容安全和商业化能力。\n3.\n资深/专家通道，具备较大的架构设计和技术\n决策空间。", "cat": "技术开发"}, {"id": "358", "title": "运营专员 (内容运营）", "salary": "8k-10k", "location": "", "jd": "内容运营（站内内容方向）\n\n岗位定位：负责角色、创作模板和站内素材的供给与维护，让用户看得懂、选得准、用得上。\n\n岗位职责：\n1、编辑和维护角色名称、简介、人设、开场白、标签及封面，核对角色设定与实际互动表现。\n2、整理创作模板的名称、分类、封面、素材要求、使用说明和示例效果，并实际试用验证。\n3、按计划完成内容筛选、编辑、上架、下架及推荐位调整，维护分类、标签和更新记录。\n4、管理封面、示例和说明素材，完成基础图片处理与文案编辑；结合点击、使用及评价优化内容供给。\n5、向产品运营反馈模板步骤、素材要求或生成效果不一致的问题，并为新媒体运营提供准确的产品内容素材。\n\n任职要求：1年以上内容运营、编辑或素材库运营经验；文字表达清晰，具备基本审美和图片处理能力，能独立完成内容整理、发布和更新。角色设定、互动娱乐、小说、音频或创作模板经验优先，不要求同时精通所有创作类型。\n\n主要交付：角色与模板内容库、上新计划、可用示例及内容调整记录。", "cat": "内容与创作"}, {"id": "359", "title": "运营专员 (用户运营)", "salary": "10k-12k", "location": "", "jd": "用户运营（活跃与留存方向）\n\n岗位定位：负责新用户上手、持续使用和问题跟进，推动用户反馈形成可执行的改进事项。\n\n岗位职责：\n1、梳理首次使用障碍，维护入门指引和常见问题，帮助用户完成第一次有效对话或成功创作。\n2、根据用户使用、付费及反馈情况开展分层引导、活跃和召回，并跟踪效果。\n3、在已批准的规则和预算内执行用户活动，核对通知、配置、奖励及权益兑现情况。\n4、组织种子用户测试、访谈和回访，了解使用、付费与流失原因。\n5、统一接收和跟进用户问题；功能问题协同产品运营，内容问题协同内容运营，订单及权益问题按公司流程处理。\n\n任职要求：2年以上用户运营、会员运营或相关经验；独立执行过新用户引导、活跃、留存或召回项目；沟通耐心，能整理用户反馈并结合基础数据制定措施。付费用户维护、用户访谈或从零开展体验用户运营经验优先。\n\n主要交付：新用户指引与FAQ、用户问题跟进记录、用户需求整理、活动与留存复盘。", "cat": "运营与市场"}, {"id": "360", "title": "运营专员 (新媒体运营)", "salary": "10k-12k", "location": "", "jd": "新媒体运营（官方账号方向） \n\n岗位定位：负责官方账号内容和自然传播，将产品功能转化为用户看得懂、愿意尝试的内容。\n\n岗位职责：\n1、运营公司确定的官方账号，制定选题和发布计划，完成内容发布及日常维护。\n2、围绕真实使用场景制作图文、视频脚本、产品录屏、基础剪辑、教程、使用案例和版本更新内容。\n3、与产品、内容运营核对功能步骤、使用条件和展示效果，确保对外表达准确，并遵循公司内容规范及平台规则。\n4、根据平台特点优化标题、封面和内容形式，跟进公开评论与基础私信；需持续处理的用户问题转交用户运营。\n5、跟踪曝光、完播、互动、自然访问和试用情况，持续调整选题与发布安排。\n\n任职要求：2年以上新媒体、内容营销或产品官方账号运营经验，能提供本人参与的账号或作品；具备选题、文案、脚本、录屏、基础剪辑及效果复盘能力。产品教程、功能演示或上线宣传经验优先，熟练使用AI工具辅助内容制作可加分。\n\n主要交付：选题与发布计划、图文及视频内容、官方账号维护记录、内容效果复盘。", "cat": "运营与市场"}, {"id": "361", "title": "运营专员（内容运营专员（AI动漫 / AI漫剧方向）", "salary": "12k-18k", "location": "", "jd": "招聘岗位：内容运营专员（AI动漫 / AI漫剧方向）\n\n岗位类型： 全职\n\n一、岗位职责\n\n1. 网站内容运营与日常维护\n\n负责 AI动漫、AI漫剧、漫画等相关内容的搜集、整理、分类、编辑和发布。\n根据网站定位规划内容分类、题材标签及内容展示。\n跟进内容更新，检查页面展示、链接及内容信息，保证网站内容正常维护。\n根据用户需求和内容热度，持续优化内容结构和浏览体验。\n\n2. 社交媒体运营与内容发布\n\n负责 Telegram（TG）、Twitter（X）等社交平台的日常运营。\n定期发布作品推荐、内容介绍、宣传文案及活动信息。\n根据不同平台的特点调整内容形式，提高曝光、互动和用户访问。\n跟进评论、反馈及社群情况，整理用户需求。\n\n3. 内容策划与宣传素材制作\n\n围绕 AI动漫、AI漫剧及热门题材策划宣传内容。\n制作作品推荐、专题介绍、热点话题及推广素材。\n配合项目推广需求，完成基础图片处理、视频剪辑、封面制作等工作。\n根据推广效果持续调整内容形式和宣传方向。\n\n4. 文案撰写与内容优化\n\n独立撰写网站简介、作品介绍、推广文案、社交媒体帖子及软植入内容。\n优化标题、简介、关键词及内容表达，提高点击率和阅读体验。\n根据不同推广渠道调整文案风格，确保内容清晰、有吸引力。\n\n5. 数据跟踪与运营复盘\n\n定期整理网站访问、内容浏览、社交媒体互动及渠道引流等数据。\n分析不同内容和推广渠道的表现，找出有效的运营方式。\n根据数据反馈优化内容选题、发布频率及推广策略。\n\n6 竞品调研与选题规划\n\n关注 AI动漫、AI漫剧、漫画及相关内容平台的动态。\n收集竞品的内容分类、热门题材、页面布局和推广方式。\n整理可参考的运营思路，并结合项目实际情况提出优化建议。\n二、任职要求\n有 1 年以上内容运营、新媒体运营或网站运营经验，能够独立运营网站或社交媒体账号者优先。\n对成人向漫画、动漫及相关内容有一定了解，有相关行业经验者优先。\n具备良好的文字表达能力，能够独立完成内容编辑、作品介绍、推广文案及软植入。\n具备基础图片处理和视频剪辑能力，熟悉 Photoshop（PS）、Premiere（PR）等工具。\n了解 Telegram（TG）、Twitter（X）等平台的内容发布及运营方式。\n具备较强的执行力、责任心和沟通能力，能够按照项目计划推进工作。\n具备信息搜集、竞品分析和内容整理能力，能够根据实际效果持续优化运营工作。\n能适应内容更新和推广节奏，按时完成日常运营任务。\n三、加分条件\n有 TG、Twitter（X）账号或社群的实际运营经验。\n有成人向漫画、AI动漫、AI漫剧或漫画网站的运营经验。\n了解 SEO、关键词布局、外链建设及网站流量增长。\n有内容营销、软植入、社群推广或外部渠道引流经验。\n能独立策划宣传主题，并完成文案、图片、视频等推广素材。\n有网站用户增长、留存、转化或数据分析经验。\n使用过 AI 图片生成、AI 视频制作或其他 AI 内容创作工具。\n四、我们希望你具备的能力\n内容判断力： 能识别值得推广的作品和热门题材。\n执行能力： 能独立完成内容搜集、编辑、发布及推广工作。\n运营思维： 不只完成发布任务，也会思考如何提升曝光和引流效果。\n优化意识： 能根据数据和用户反馈持续调整内容与推广方式。\n主动性： 遇到问题能主动沟通，并提出可执行的解决方案。\n五、投递要求\n\n请在简历中尽量提供以下材料：\n\n过往运营过的网站、TG 频道、Twitter（X）账号或其他社交媒体账号。\n个人撰写的推广文案、作品介绍或软植入案例。\n图片设计、视频剪辑或宣传素材作品。\nSEO 优化、外部引流、流量增长等相关案例（如有）。\n简单说明你在过往项目中负责的工作，以及取得的实际效果。\n\n有实际运营案例者优先。", "cat": "内容与创作"}, {"id": "362", "title": "运营专员（中级运营／交友类）", "salary": "12k-18k", "location": "", "jd": "# 运营专员（中级运营/交友类）\n\n## 岗位职责\n\n1. 平台日常运营： 负责平台日常运营工作，包括内容更新、商品上架、推荐置顶、活动执行、用户反馈处理及运营异常跟进，确保日常运营工作有序开展，提升平台运营效率与用户体验；\n\n2. 内容运营与推广： 负责平台内容的筛选、整理、发布及优化，结合产品定位制定内容运营方案，通过 TG、X 等线上渠道开展内容分发与推广，提升内容曝光、用户触达及平台影响力；\n\n3. 用户增长与留存： 围绕用户新增、活跃、留存及付费转化等目标，执行拉新、促活、用户召回及社群活动，持续优化运营策略，提升用户参与度与用户价值；\n\n4. 数据监控与复盘： 跟进新增、日活、充值、留存及复费率等核心运营指标，完成数据统计、日报周报及业务复盘，及时发现运营问题，提出可执行的优化建议；\n\n5. 产品协同与项目推进： 收集整理用户反馈及业务需求，对接产品、研发推进功能优化、问题修复及版本迭代，跟进 AI 短剧等新产品的开发进度、内容配置、上线准备及运营推广，确保相关事项按计划推进；\n\n6. 渠道拓展与合作维护： 拓展并维护线上推广渠道、内容合作方及社群资源，探索有效的流量获取和用户转化方式，跟踪渠道效果，持续优化推广质量与运营投入产出。\n\n## 任职要求\n\n1. 具备平台运营、内容运营、用户运营、社群运营或新媒体运营相关经验，有实际运营成果者优先；\n\n2. 熟悉 TG、X 或其他线上内容推广渠道，能够独立完成内容发布、活动执行、用户维护及日常运营任务；\n\n3. 具备一定的数据分析能力，能够根据新增、活跃、充值、留存等指标判断运营效果，并制定相应的优化措施；\n\n4. 具备良好的沟通协调能力、执行力及问题解决能力，能够主动跟进业务事项，推动问题处理与结果闭环；\n\n5. 工作认真负责，具备较强的学习能力、抗压能力和目标意识，能够适应多任务并行的工作节奏；\n\n6. 具备良好的团队协作意识，能够配合产品、研发及其他业务岗位推进项目落地。\n\n## 加分条件\n\n1. 有社交平台、视频平台、短剧平台或互联网内容产品运营经验；\n\n2. 有 TG 社群运营、私域流量运营、线上推广、用户增长或活动策划经验；\n\n3. 有 AI 短剧、AI 视频内容运营、新产品上线或产品迭代跟进经验；\n\n4. 熟悉运营数据报表、数据看板及自动化工具，能够通过工具提升工作效率；\n\n5. 拥有稳定的内容资源、推广渠道或社群资源，能够快速开展业务并取得实际成果；\n\n6. 有运营流程优化、跨部门项目推进或团队协作管理经验。\n\n岗位目标： 通过日常运营、内容建设、用户增长、数据复盘及产品协同，持续提升平台活跃度、用户留存、付费转化与整体运营效率。", "cat": "运营与市场"}, {"id": "363", "title": "QA（网站质检专员）", "salary": "8k-10k", "location": "", "jd": "QA（网站质检专员） hc1 薪资：8-10k\n招聘要求：\n\n负责公司网站、APP、新媒体及外链渠道的日常质量检查、问题记录与修复跟进，主要包括：\n\n一、网站质检\n\n- 每日检查各网站及备用域名能否正常访问，记录访问速度和异常状态；\n- 检查首页、分类页、搜索页、详情页、播放页等核心页面；\n- 检查封面、图片、视频、字幕及其他媒体资源能否正常加载和播放；\n- 检查页面链接、导航、搜索、登录、注册、收藏等基础功能；\n- 检查电脑端与手机端的页面显示、布局及浏览器兼容性；\n- 排查404、接口报错、加载超时、异常跳转、内容缺失等问题；\n- 检查域名解析、DNS、HTTPS、TLS证书、API及CDN资源状态；\n- 使用Chrome开发者工具初步定位前端、接口或资源加载问题。\n\n二、APP产品质检\n\n- 检查Android及iOS端APP的下载、安装、启动、更新和卸载流程；\n- 检查注册、登录、搜索、播放、收藏、分享等核心功能；\n- 检查APP内图片、封面、视频、字幕及接口数据加载情况；\n- 检查不同手机型号、系统版本和网络环境下的兼容性；\n- 检查APP内网页、外部浏览器、客服及下载链接的跳转情况；\n- 排查闪退、卡顿、黑屏、加载失败、接口报错及页面错位等问题；\n- 协助完成新版本上线前验收、版本回归测试和上线后复测。\n\n三、新媒体质检\n\n- 检查各新媒体账号主页、头像、简介、置顶内容及联系方式；\n- 检查发布内容的标题、文案、图片、视频、字幕和话题标签；\n- 检查内容是否存在错别字、素材错误、重复发布或显示异常；\n- 检查发布后的图片和视频清晰度、播放状态及页面展示效果；\n- 检查主页链接、推广链接和内容跳转是否准确有效；\n- 记录账号限制、内容下架、链接失效及其他平台异常；\n- 配合整理新媒体账号及内容发布情况。\n\n四、外链质检\n\n- 定期检查推广链接、短链接、落地页及下载链接是否有效；\n- 检查外链跳转地址是否正确，是否出现404、超时或异常跳转；\n- 检查不同设备、浏览器和网络环境下的外链访问情况；\n- 检查链接参数、渠道标识及统计数据是否正常；\n- 及时记录失效外链，并跟进更换及修复结果。\n\n五、问题管理与报告\n\n- 发现问题后及时截图或录屏；\n- 准确记录问题页面、链接、设备、系统、浏览器及网络环境；\n- 提供清晰、完整且可以重复操作的问题复现步骤；\n- 按照严重程度对问题进行分类和标记；\n- 跟进问题修复进度，完成复测并更新处理状态；\n- 整理并提交每日质检报告、异常清单及阶段性问题汇总。\n\n任职要求\n\n- 熟悉电脑端和手机端浏览器的基本操作；\n- 熟悉Android或iOS APP的安装、更新及常用功能测试；\n- 熟练使用Chrome浏览器，能够进行基础的网站检查和问题排查；\n- 工作认真细致、责任心强，具备较强的问题发现能力；\n- 逻辑清晰、表达准确，能够完整描述问题现象和复现步骤；\n- 具备基础测试思维，能够区分页面、资源、接口、APP及网络问题；\n- 了解域名、DNS、HTTPS、TLS、API、CDN及外链跳转等基础知识；\n- 了解常见新媒体平台的内容发布和页面展示规则；\n- 能够使用Chrome开发者工具查看控制台及网络请求者优先；\n- 有网站或APP测试、内容审核、新媒体运营、产品运营经验者优先。", "cat": "职能与行政"}, {"id": "364", "title": "AI Algorithm Engineer", "salary": "年薪20万美金内", "location": "可远程", "jd": "Responsibilities\n\n• Lead research, pre-training, optimization, and iteration of Vision Foundation Models, including Stable Diffusion, DiT, Vision Transformer (ViT), Segment Anything Model (SAM), CLIP, and other cutting-edge computer vision models.\n\n• Design and fine-tune vision models for business scenarios such as AI image generation, image editing, multimodal understanding, and intelligent visual applications.\n\n• Lead Supervised Fine-Tuning (SFT), Parameter-Efficient Fine-Tuning (PEFT), LoRA, ControlNet, Adapter tuning, and related optimization techniques.\n\n• Explore and improve generative model architectures and visual feature extraction networks to enhance image quality, stability, resolution, inference efficiency, and multimodal alignment.\n\n• Collaborate with engineering teams to deploy large-scale AI models into production and optimize inference performance through quantization, pruning, inference acceleration, memory optimization, and deployment tuning.\n\n• Continuously track the latest academic research, open-source projects, and industry trends in Computer Vision (CV), Multimodal AI, and Generative AI, rapidly transforming new technologies into business value.\n\nRequirements\n\nEducation\n• Bachelor's degree or above in Computer Science, Artificial Intelligence, A
