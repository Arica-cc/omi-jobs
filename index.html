Gemini / Kimi / 豆包 / DeepSeek 等模型能力差异有 AI 产品、Agent、AI 工作流、生成式编辑器设计经验。\n2.会用 Cursor / Claude Code / v0 / Lovable / Figma Make 做真实原型懂 React / Tailwind / shadcn/ui / Framer Motion。\n3.有上线作品、真实用户、GitHub 项目、设计系统或个人产品。\n4.有海外产品、英文环境、全球 AI 产品研究经验。\n5.有长期打磨作品的经历，而不是只做过一次性概念稿。", "cat": "内容与创作"}, {"id": "195", "title": "AI 短剧制作 / AI 短剧运营", "salary": "15-20k", "location": "", "jd": "AI 短剧制作 / AI 短剧运营\n\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧生产执行、内容运营、数据复盘\n\n岗位定位：\n负责 AI 短剧的日常生产和运营执行，需要既懂内容，也能使用 AI 工具推进产出，是连接制作和运营的数据型岗位。\n\n岗位职责：\n\n1. 负责 AI 短剧日常选题、素材整理、提示词生成、视频产出和内容发布。\n2. 配合编剧、生成师、剪辑师推进项目进度。\n3. 负责标题、封面、标签、简介、合集、推荐位等运营配置。\n4. 跟进播放、点击、收藏、评论、转化等数据表现。\n5. 拆解爆款内容，沉淀选题方向、标题模板和内容结构。\n6. 协助维护创作者、外包团队和内容供应方。\n7. 推动内容批量生产流程，提高产出效率和上线稳定性。\n\n任职要求：\n\n1. 有短视频运营、内容运营、短剧运营、社区运营经验优先。\n2. 熟悉内容平台用户心理，懂标题、封面、标签和热点追踪。\n3. 会使用 AI 工具进行文案、图片、视频或素材处理。\n4. 能接受成人向 AIGC 内容方向。\n5. 数据意识强，能根据结果调整运营动作。\n6. 执行力强，能处理重复但重要的内容上线工作。\n\n作品要求：\n\n1. 面试需提供运营账号、内容案例、数据截图或项目经验说明。\n2. 有内容从选题到发布再到复盘的完整经验优先。\n3. 可接受现场拆解一个爆款内容的运营逻辑。", "cat": "内容与创作"}, {"id": "196", "title": "AI 短剧导演 / 制片", "salary": "15-20k", "location": "", "jd": "AI 短剧导演 / 制片\n\n招聘人数：1 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧项目统筹、内容质量把控\n\n岗位定位：\n负责 AI 短剧从选题到上线的整体推进，是内容质量和交付效率的负责人，需要懂剧本、分镜、AI 生成、剪辑和运营数据。\n\n岗位职责：\n\n1. 负责 AI 短剧项目选题、剧本、分镜、生成、剪辑、上线全流程统筹。\n2. 制定项目排期，协调编剧、AI 视频生成师、剪辑师和运营人员。\n3. 把控内容风格、剧情节奏、画面质量、人物一致性和成片标准。\n4. 根据平台内容方向，规划系列短剧、栏目和爆款题材。\n5. 建立 AI 短剧生产流程，包括选题会、脚本评审、素材审核、成片复盘。\n6. 根据数据反馈优化制作方式，提高内容产出效率和商业转化。\n7. 管理项目素材、版权信息、发布版本和内容档案。\n\n任职要求：\n\n1. 有短剧导演、制片、内容统筹、影视项目管理经验优先。\n2. 熟悉短剧生产流程，懂剧本、镜头、剪辑和上线节奏。\n3. 对 AIGC 内容生产有理解，愿意探索新工具和新流程。\n4. 能接受成人向 AIGC 内容方向，并具备风险判断能力。\n5. 沟通推进能力强，能带团队按时交付。\n6. 对数据敏感，能根据播放和转化结果调整内容策略。\n\n作品要求：\n\n1. 面试需提供过往项目案例或项目统筹经验说明。\n2. 有完整短剧、栏目、账号或内容项目从 0 到 1 经验优先。\n3. 可接受现场拆解一个 AI 短剧项目执行方案。", "cat": "内容与创作"}, {"id": "197", "title": "AI 短剧后期剪辑师", "salary": "15-20k", "location": "", "jd": "AI 短剧后期剪辑师\n\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧剪辑、包装、成片输出\n\n岗位定位：\n负责 AI 短剧素材的后期整合，把零散 AI 镜头剪成完整短剧成片，重点把控节奏、情绪、字幕、音效、转场和完播率。\n\n岗位职责：\n\n1. 负责 AI 短剧素材剪辑、镜头排序、节奏调整和成片输出。\n2. 完成字幕、音效、配乐、转场、调色、降噪、封面截取等后期工作。\n3. 根据剧情节奏优化开头吸引力、关键转折和结尾留钩。\n4. 制作正片版、预告版、短切版、引流版等不同发布版本。\n5. 配合导演和运营，根据数据反馈调整剪辑节奏。\n6. 建立短剧剪辑模板、字幕模板、音效模板和包装规范。\n7. 管理素材文件，保证项目文件清晰可复用。\n\n任职要求：\n\n1. 熟练使用剪映、Premiere、Final Cut Pro、DaVinci Resolve 等剪辑工具。\n2. 有短剧、剧情号、信息流广告、影视混剪、内容号剪辑经验优先。\n3. 对节奏、情绪、爽点、反转和完播率有判断力。\n4. 能接受成人向 AIGC 内容方向。\n5. 具备基础审美，能保证画面、字幕和声音统一。\n6. 工作细致，能适应批量内容生产。\n\n作品要求：\n\n1. 面试需提供 2-3 条剪辑作品。\n2. 有短剧、剧情视频、AI 视频剪辑案例优先。\n3. 可接受现场剪辑测试或提供改版思路。", "cat": "内容与创作"}, {"id": "198", "title": "AI 视频生成师", "salary": "15-20k", "location": "", "jd": "AI 视频生成师\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 视频生成、角色一致性、镜头画面制作**\n\n岗位定位：\n负责把剧本和分镜转化为 AI 视频画面，核心能力是会用 AI 工具稳定出片，并解决人物一致性、动作连贯、场景稳定和画面质感问题。\n\n岗位职责：\n\n1. 根据剧本、分镜和导演要求，使用 AI 视频工具生成短剧镜头。\n2. 负责人物形象一致性、服装一致性、场景一致性和镜头连续性。\n3. 使用 AI 工具完成图生视频、文生视频、视频延展、局部重绘、动作优化等工作。\n4. 配合编剧优化提示词，让剧本更适合 AI 工具生成。\n5. 配合剪辑师整理可用素材，提高成片效率。\n6. 持续测试新工具、新模型和新工作流，沉淀高成功率提示词模板。\n7. 建立角色库、场景库、镜头库、动作库和参数模板。\n\n任职要求：\n\n1. 熟悉至少一种 AI 视频工具，如可灵、即梦、Runway、Pika、Luma、ComfyUI 等。\n2. 有图生视频、角色一致性、AI 短片、AI 广告片或 AI 剧情视频经验优先。\n3. 具备基础镜头语言、构图、光影、人物动作和画面审美能力。\n4. 能接受成人向 AIGC 内容方向，理解内容尺度和画面边界。\n5. 能快速试错，愿意持续研究工具更新。\n6. 有稳定作品集或完整项目经验者优先。\n\n作品要求：\n\n1. 面试需提供 AI 视频作品或生成案例。\n2. 最好能说明使用工具、制作流程、提示词思路和成片周期。\n3. 可接受现场测试一个短镜头生成方案。", "cat": "内容与创作"}, {"id": "199", "title": "AI短剧编剧", "salary": "12-20k", "location": "", "jd": "1. 短剧编剧\n招聘人数：2 人 \n薪资范围：12K-20K / 月\n岗位方向：成人向 AIGC 短剧剧本创作、系列内容策划\n\n岗位定位：\n负责成人向 AIGC 短剧的故事创作与剧本产出，需要把题材、人物、情绪、反转和用户爽点结合起来，写出适合 AI 视频生成和平台传播的短剧内容。\n\n岗位职责：\n\n1. 负责短剧选题、故事大纲、人物设定、分集剧情和完整剧本撰写。\n2. 根据成人向内容平台用户偏好，设计强冲突、强关系、强反转、强追更的剧情结构。\n3. 将剧情拆解为适合 AI 生产的镜头段落，配合 AI 视频生成师完成画面落地。\n4. 参与系列 IP 规划，包括角色关系、人物标签、剧情主线、分季节奏等。\n5. 根据播放、点击、收藏、评论等数据反馈，持续优化题材方向和剧本节奏。\n6. 配合运营完成标题、简介、封面文案、标签关键词和推广短文案。\n7. 建立可复用的题材库、人物库、剧情模板和爆款结构库。\n\n任职要求：\n\n1. 有短剧、网文、影视、漫画、情感故事、成人向内容创作经验优先。\n2. 熟悉短剧节奏，懂开头钩子、剧情反转、情绪推进和结尾悬念。\n3. 具备较强文字表达能力，能稳定输出成体系剧本。\n4. 能接受成人向 AIGC 内容方向，具备内容边界和平台审核意识。\n5. 了解 AI 工具能力边界，能把剧本文字转化为可执行画面描述。\n6. 执行力强，能适应高频产出和快速修改。\n\n作品要求：\n\n1. 面试需提供 1-3 篇过往剧本、故事大纲或短剧案例。\n2. 有已上线作品、爆款案例、网文连载经验者优先。\n3. 可接受现场试写短剧大纲或 1 集分镜脚本。", "cat": "内容与创作"}, {"id": "200", "title": "新媒体运营", "salary": "10-15K", "location": "", "jd": "一、岗位定位\n负责品牌在海外/外网平台的内容运营与传播执行，围绕品牌曝光、用户触达、内容引流及社群沉淀，推动外网传播体系搭建与持续优化。\n二、岗位职责\n1. 负责 Twitter、Instagram、Telegram 等外网平台的日常内容运营与账号维护。\n2. 围绕品牌传播、用户增长和产品引流目标，策划并执行外网内容发布及互动运营。\n3. 跟踪平台数据表现，持续优化内容方向、发布时间及互动策略。\n4. 结合社群、KOC/KOL、渠道合作等形式，提升品牌曝光和用户引流效率。\n5. 熟悉平台风险边界，在合规前提下推进内容传播与引流动作。\n\n三、任职要求\n1. 3年以上海外社媒、外网运营或出海内容平台相关经验。\n2. 熟悉 Twitter、Instagram、Telegram 等平台规则、调性及传播机制。\n3. 具备明确的引流意识，有账号引流、社群沉淀或转化承接经验。\n4. 执行力强，具备良好的数据分析能力、协作沟通能力和推动落地能力。\n\n四、加分项\n1. 有成人行业、情趣用品、两性健康品牌或二次元品牌相关经验。\n2. 有外网 KOL/KOC、社群、媒体或渠道合作资源。\n3. 有从0到1搭建外网账号矩阵或引流体系经验。\n4. 对用户参与机制、活动传播链路和品牌互动方式有较强洞察。", "cat": "运营与市场"}, {"id": "201", "title": "新媒体运营", "salary": "10-20k", "location": "", "jd": "岗位职责\n1.负责国内及海外社媒平台账号运营（抖音、快手、小红书、视频号、微博、B站、TikTok、Instagram、Facebook、YouTube、X、Telegram等），完成账号起号、养号、内容发布及矩阵运营。\n2.围绕产品特点和平台调性，独立完成短视频、图文内容的选题、脚本、标题、封面及素材制作，内容方向包括吃瓜、话题、猎奇、擦边、短剧切片等。\n3.负责主页包装、评论区互动、私信承接、关键词布局、社群引导等引流工作，关注账号安全，降低限流和封号风险。\n4.跟踪账号数据（播放、互动、涨粉、私信、进群等），定期复盘并优化内容方向；关注竞品及平台规则变化，挖掘自然流量机会。\n5.配合产品、运营、商务团队完成活动宣传、素材测试及用户引导，沉淀可复用的内容打法和SOP。\n\n任职要求\n• 1年以上新媒体运营或账号孵化经验，熟悉至少1-2个主流社媒平台，有实际运营经验。\n• 有从0到1起号经验，有涨粉、引流或转化的实际案例。\n• 能独立产出内容——选题、脚本、标题、封面文案、图文、短视频。\n• 懂平台推荐机制和互动增长逻辑，清楚养号、内容测试、评论区维护、私信承接等基础玩法。\n• 了解平台违规边界，对内容尺度、擦边表达、导流方式有基本认知。\n• 执行力强，能适应多账号矩阵及快速测试的节奏。\n• 能接受成人行业方向。\n\n加分项\n• 有成人、擦边、吃瓜、情感、短剧号运营经验\n• 有海外平台（TikTok、IG、X、Telegram等）运营经验\n• 会使用AI工具（ChatGPT、AI图片、AI视频等）\n• 熟悉基础剪辑和图片处理", "cat": "运营与市场"}, {"id": "202", "title": "内容运营", "salary": "7-15k / 月", "location": "", "jd": "岗位职责：\n\n1. 负责播放器内容的日常运营，包括内容整理、上架、分类、推荐位配置及数据跟踪；\n2. 根据用户偏好和内容表现，优化内容分发策略，提升点击率、播放时长和转化效果；\n3. 跟进重点内容更新节奏，结合热点、节日及活动节点策划内容运营动作；\n4. 协同产品、技术、设计等团队，推动播放器页面内容体验持续优化；\n5. 定期复盘内容数据，包括曝光、点击、播放、留存等核心指标，输出优化建议并推动落地；\n6. 关注竞品动态及行业内容趋势，持续优化内容结构和运营策略。\n\n任职要求：\n\n1. 大专及以上学历，有内容运营、产品运营或平台运营经验优先；\n2. 对内容敏感度高，具备基础的数据分析能力，能根据数据发现问题并推动优化；\n3. 逻辑清晰，执行力强，能独立推进日常内容运营工作；\n4. 熟悉常见内容平台、短视频、影视、社区类产品内容逻辑者优先；\n5. 具备较强的沟通协调能力和责任心。\n\n加分项：\n\n1. 有播放器、视频平台、内容平台相关经验；\n2. 有推荐位运营、活动内容策划或用户增长相关经验；\n3. 熟悉 Excel / Google Sheets，能做基础数据整理和复盘；\n4. 会使用 AI 工具提升工作效率，如内容整理、文案优化、数据分析、素材处理、信息检索等；\n5. 熟悉 AI 工具使用，有借助 AI 提升内容运营效率的实际经验者优先。", "cat": "内容与创作"}, {"id": "203", "title": "内容运营", "salary": "7-15k / 月", "location": "", "jd": "岗位职责：\n\n1. 负责播放器内容的日常运营，包括内容整理、上架、分类、推荐位配置及数据跟踪；\n2. 根据用户偏好和内容表现，优化内容分发策略，提升点击率、播放时长和转化效果；\n3. 跟进重点内容更新节奏，结合热点、节日及活动节点策划内容运营动作；\n4. 协同产品、技术、设计等团队，推动播放器页面内容体验持续优化；\n5. 定期复盘内容数据，包括曝光、点击、播放、留存等核心指标，输出优化建议并推动落地；\n6. 关注竞品动态及行业内容趋势，持续优化内容结构和运营策略。\n\n任职要求：\n\n1. 大专及以上学历，有内容运营、产品运营或平台运营经验优先；\n2. 对内容敏感度高，具备基础的数据分析能力，能根据数据发现问题并推动优化；\n3. 逻辑清晰，执行力强，能独立推进日常内容运营工作；\n4. 熟悉常见内容平台、短视频、影视、社区类产品内容逻辑者优先；\n5. 具备较强的沟通协调能力和责任心。\n\n加分项：\n\n1. 有播放器、视频平台、内容平台相关经验；\n2. 有推荐位运营、活动内容策划或用户增长相关经验；\n3. 熟悉 Excel / Google Sheets，能做基础数据整理和复盘；\n4. 会使用 AI 工具提升工作效率，如内容整理、文案优化、数据分析、素材处理、信息检索等；\n5. 熟悉 AI 工具使用，有借助 AI 提升内容运营效率的实际经验者优先。", "cat": "内容与创作"}, {"id": "204", "title": "中高级运营", "salary": "12k-25k", "location": "", "jd": "（一）岗位职责\n1、核心指标负责：负责产品运营策略的制定与执行，持续优化DAU、新增、留存、充值、会员转化等核心指标。\n2、内容运营：负责内容供给、分类、推荐、封面、标题等模块的策略优化，提升用户体验与内容转化效率。\n3、增长与转化：通过活动运营、会员体系、用户召回等手段，提升用户价值与付费转化。\n4、数据闭环：负责运营数据的分析与复盘，定位业务问题并推动方案落地与效果验证，驱动产品迭代。\n5、机制建设：建立并完善内容审核、上架、巡检、复盘等运营SOP，提升团队执行效率与质量。\n6、AI提效：运用AI工具与自动化能力优化数据分析、内容生产、用户运营等场景，提升运营效率。\n\n（二）岗位要求\n1、1年以上互联网运营经验，具备从0到1搭建运营体系，或推动业务流程规范化的实践经验。\n2、具备较强的内容判断能力，能够分析封面、标题、分类、推荐策略对用户行为的影响。\n3、能够独立完成数据分析、问题定位、方案制定、效果验证的完整运营闭环。\n4、熟练使用AI工具（ChatGPT、Claude等），具备AI辅助运营与自动化提效意识。\n5、结果导向，抗压能力强，具备主动推动意识，能够协调产品、技术、设计等多方资源达成目标。\n\n（三）加分项\n具备成人APP/网站、视频平台、社区平台或AI产品的运营经验。", "cat": "运营与市场"}, {"id": "205", "title": "中高级运营", "salary": "12k-25k", "location": "", "jd": "（一）岗位职责\n1、核心指标负责：负责产品运营策略的制定与执行，持续优化DAU、新增、留存、充值、会员转化等核心指标。\n2、内容运营：负责内容供给、分类、推荐、封面、标题等模块的策略优化，提升用户体验与内容转化效率。\n3、增长与转化：通过活动运营、会员体系、用户召回等手段，提升用户价值与付费转化。\n4、数据闭环：负责运营数据的分析与复盘，定位业务问题并推动方案落地与效果验证，驱动产品迭代。\n5、机制建设：建立并完善内容审核、上架、巡检、复盘等运营SOP，提升团队执行效率与质量。\n6、AI提效：运用AI工具与自动化能力优化数据分析、内容生产、用户运营等场景，提升运营效率。\n\n（二）岗位要求\n1、1年以上互联网运营经验，具备从0到1搭建运营体系，或推动业务流程规范化的实践经验。\n2、具备较强的内容判断能力，能够分析封面、标题、分类、推荐策略对用户行为的影响。\n3、能够独立完成数据分析、问题定位、方案制定、效果验证的完整运营闭环。\n4、熟练使用AI工具（ChatGPT、Claude等），具备AI辅助运营与自动化提效意识。\n5、结果导向，抗压能力强，具备主动推动意识，能够协调产品、技术、设计等多方资源达成目标。\n\n（三）加分项\n具备成人APP/网站、视频平台、社区平台或AI产品的运营经验。", "cat": "运营与市场"}, {"id": "206", "title": "中高级运营", "salary": "12k-25k", "location": "", "jd": "（一）岗位职责\n1、核心指标负责：负责产品运营策略的制定与执行，持续优化DAU、新增、留存、充值、会员转化等核心指标。\n2、内容运营：负责内容供给、分类、推荐、封面、标题等模块的策略优化，提升用户体验与内容转化效率。\n3、增长与转化：通过活动运营、会员体系、用户召回等手段，提升用户价值与付费转化。\n4、数据闭环：负责运营数据的分析与复盘，定位业务问题并推动方案落地与效果验证，驱动产品迭代。\n5、机制建设：建立并完善内容审核、上架、巡检、复盘等运营SOP，提升团队执行效率与质量。\n6、AI提效：运用AI工具与自动化能力优化数据分析、内容生产、用户运营等场景，提升运营效率。\n\n（二）岗位要求\n1、1年以上互联网运营经验，具备从0到1搭建运营体系，或推动业务流程规范化的实践经验。\n2、具备较强的内容判断能力，能够分析封面、标题、分类、推荐策略对用户行为的影响。\n3、能够独立完成数据分析、问题定位、方案制定、效果验证的完整运营闭环。\n4、熟练使用AI工具（ChatGPT、Claude等），具备AI辅助运营与自动化提效意识。\n5、结果导向，抗压能力强，具备主动推动意识，能够协调产品、技术、设计等多方资源达成目标。\n\n（三）加分项\n具备成人APP/网站、视频平台、社区平台或AI产品的运营经验。", "cat": "运营与市场"}, {"id": "207", "title": "seo专员", "salary": "8K-15K", "location": "", "jd": "岗位职责\n    负责Google/Bing等搜索引擎关键词挖掘及整理。\n    根据业务方向（成人、吃瓜、黑料、短剧等）建立关键词库，持续扩充核心词、长尾词及热点词。\n    分析竞品网站关键词布局，整理可覆盖的流量机会。\n    定期输出关键词分类及SEO优化建议，为内容建设提供数据支持。\n    跟踪关键词排名及搜索趋势，持续优化关键词策略。\n\n任职要求\n    熟悉SEO基础知识，了解关键词研究方法。\n    熟练使用关键词工具（Ahrefs、Semrush、Google Keyword Planner、5118等优先）。\n    具备较强的数据整理及分析能力。\n    工作认真细致，执行力强。\n    有SEO、网站运营或内容运营经验优先。\n    \n加分项\n    有成人、影视、吃瓜等行业SEO经验。\n    有Google SEO项目经验。\n    熟悉Excel、Google Sheets等数据处理工具。", "cat": "其他"}, {"id": "208", "title": "高级AI短剧制作", "salary": "20K-50K", "location": "", "jd": "投递要求：必须提供本人视频作品，可提供自媒体账号、作品链接或视频文件\n\n岗位职责\n根据剧本独立完成剧情拆解、分镜设计、角色设定及场景设计；\n独立完成AI出图、图生视频、动作生成、配音配乐、剪辑包装及成片交付；\n把控人物一致性、服装造型、画面风格、动作自然度、剧情节奏和镜头衔接；\n修复人物变形、肢体异常、穿模、画面闪烁、镜头抖动、画风不统一等问题；\n根据业务反馈快速完成修改和迭代，稳定承接日常内容产能；\n沉淀提示词、角色模板、人物LoRA、制作模板及批量化生产SOP；\n配合编剧、导演及运营团队完成短剧内容交付。\n\n任职要求\n有成熟的AI短剧、AI剧情视频或相关视频项目经验；\n能够独立完成从剧本、分镜、角色设定到成片交付的完整流程；\n入职后能够直接承接项目，不依赖长期手把手培训；\n熟悉可灵、即梦、Seedance、Runway、Pika、Midjourney、Stable Diffusion、ComfyUI等一种或多种工具；\n熟练使用剪映、Premiere、After Effects、达芬奇等剪辑软件；\n具备较强的剧情理解、分镜设计、镜头语言及画面审美能力；\n能够处理人物一致性、动作异常、镜头衔接及画面质量问题；\n能适应快速迭代、远程协作和稳定量产。\n\n优先条件\n有完整AI短剧成片及连续剧集制作经验；\n熟悉ComfyUI、LoRA、角色一致性和动作控制；\n有批量内容生产、平台发布或短剧项目经验；\n有成人向AI短剧项目经验优先，但不强制要求提供成人作品；\n能接受实际参与成人向剧情内容制作。\n\n作品要求\n必须提供视频作品，可提供本人自媒体账号、平台主页、作品链接或视频文件；\n作品类型包括AI短剧、AI动漫、动态漫、剧情视频、广告视频、短视频等；\n至少提供能够体现本人实际制作能力的完整作品或连续片段；\n如为团队项目，需明确说明本人负责的具体环节；\n面试及测试环节需能够讲清作品的制作流程、使用工具、提示词及后期处理方式；\n无视频作品、无法提供账号/链接或无法说明本人实际贡献的候选人，原则上不进入后续面试。", "cat": "内容与创作"}, {"id": "209", "title": "二次元动漫原画师（AI生成方向）", "salary": "20K-50K", "location": "", "jd": "二次元动漫原画师（AI生成方向）\n岗位定位\n\n本岗位面向具有动漫原画、角色设计、插画或相关美术经验的人才。入职后公司将提供AI短剧制作培训，帮助其逐步掌握AI图像及视频生成流程，并培养成为能够独立完成二次元动漫短剧的生成师。\n\n岗位职责\n根据短剧剧本完成剧情理解、人物分析、场景拆解及基础分镜设计。\n运用原画及美术能力，完成人物形象、服装、表情、动作和场景的视觉设计。\n在培训后使用 Seedance、ComfyUI、可灵等工具完成人物、场景及动漫视频镜头生成。\n根据剧情设计景别、构图、人物动作、情绪表演及镜头衔接，强化故事节奏和关键情绪。\n负责筛选、调整和优化AI生成结果，处理人物五官、肢体、服装及画面细节问题。\n保证同一剧集中人物形象、服装、场景、画风及镜头表现的一致性。\n配合导演及编剧完成镜头修改，并逐步具备独立负责完整剧集或主要镜头段落的能力。\n持续学习新的AI动漫制作工具和工作流，提升内容质量与生产效率。\n任职要求\n具备动漫原画、角色设计、漫画、插画、二次元游戏美术或相关工作经验。\n对二次元文化有成熟理解和长期热爱，熟悉不同动漫题材、人物属性及画风特点。\n具备良好的造型、人体结构、透视、色彩、构图及光影基础。\n具备一定的画面叙事和镜头意识，能够根据文字内容设计人物动作、表情及场景氛围。\n愿意从传统原画或插画方向转向AI动漫短剧制作，并接受系统培训。\n学习能力和执行力较强，能够快速掌握新的AI工具及制作流程。\n具备良好的沟通能力和责任心，能够根据反馈快速修改并稳定交付。\n应聘时需提供能够体现二次元审美、角色塑造及画面表现能力的作品集。\n\n加分项\n有动漫、动态漫、短剧、漫画或游戏项目经验。\n具备分镜、关键帧或连续剧情画面设计能力。\n使用过 ComfyUI、Midjourney、Seedance、可灵等工具。\n了解角色一致性、LoRA训练或AI美术资产制作。\n能够独立完成基础剪辑、镜头组合或短片制作。", "cat": "内容与创作"}, {"id": "210", "title": "AI短剧制作", "salary": "12K-22K", "location": "", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "内容与创作"}, {"id": "211", "title": "AI短剧制作", "salary": "12K-22K", "location": "", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "内容与创作"}, {"id": "212", "title": "国内精准获客运营", "salary": "10k-30k", "location": "", "jd": "（打色粉方向）薪资：10K–30K＋提成，带团队入驻可面谈学历：不限，以实际出粉能力和项目结果为主要筛选标准\n\n岗位职责\n\n负责国内平台的精准用户获取、内容运营及引流工作，包括但不限于抖音、小红书、快手、视频号、贴吧等渠道。\n\n根据目标用户的年龄、性别、地区、兴趣及行为特征制定获客策略，提高有效用户比例及精准度。\n\n独立完成账号定位、从0到1起号、选题策划、素材制作、内容发布、数据测试及用户引导。\n\n持续测试不同平台、账号、内容形式和素材方向，寻找出粉量稳定、用户精准且成本可控的获客方式。\n\n跟踪每日出粉量、有效粉比例、用户精准度及获客成本，并根据数据持续优化运营策略。\n\n结合实际操作持续总结平台玩法、内容模型、用户筛选方式及获客路径，沉淀可复用的工作流程和SOP。\n\n负责账号及内容的日常维护，保障项目能够长期、稳定出粉。\n\n所有获客及运营行为须遵守相关法律法规和平台规则。\n\n任职要求\n\n学历不限，必须有真实的国内打色粉或精准获客项目经验。\n\n熟悉抖音、小红书、快手、视频号、贴吧等国内主流流量平台及内容获客方式。\n\n具备从0到1起号、内容测试、用户筛选及精准获客经验。\n\n有实际起量、稳定出粉或持续获客成果，能够兼顾出粉量、有效粉比例、用户精准度及获客成本。\n\n熟悉目标用户画像，能够根据年龄、性别、地区、兴趣等维度进行用户筛选。\n\n能够独立完成“账号搭建—内容生产—发布测试—用户筛选—精准获客—数据复盘”的完整流程。\n\n具备数据分析和复盘能力，能够根据实际结果持续优化平台、账号、内容及素材方向。\n\n应聘时需提供过往项目、操作平台、实际出粉量、有效粉比例、获客成本及相关后台截图；涉及保密项目的可脱敏处理。\n\n加分项\n\n做过成人、两性、泛娱乐、社交等相关垂类项目；\n\n有账号矩阵或多账号运营经验；\n\n有明确的日均出粉量、月度出粉量或稳定获客案例；\n\n具备多设备、多账号运营条件；\n\n能够带团队或自带成熟团队入驻。", "cat": "运营与市场"}, {"id": "213", "title": "Java工程师", "salary": "25-30K", "location": "", "jd": "【任职要求】\n1.计算机或相关专业，精通Java开发语言技术栈，具备五年以上开发经验;\n2.熟悉常用的框架以及组件:SpringBoot、 SpringCloud、 RabbitMQ、Kafka、 Redis、 MySQL,PolarDB、MongoDB等;\n3.有大型复杂分布式、高并发、高负载、高可用性系统架构设计经验、调优经验;\n4.具备复杂业务需求梳理能力，较强的产品思维能力和问题分析能力，具备优秀的沟通以及团队感染力;\n5.有创新精神和较强的自驱力，具备发现问题和解决问题的能力;\n6.具备项目管理经验，具备将技术方案推动落实到研发人员的落地能力;7.深入阅读过开源项目源码，能理解开源项目实现原理;\n8.对AI的发展有较高的关注度，有实际AI开发工具的使用经验。", "cat": "技术开发"}, {"id": "214", "title": "AI内容生成师", "salary": "12k-22k", "location": "", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "内容与创作"}, {"id": "215", "title": "AI应用开发（模型/Agent / AIGC ）", "salary": "25K-40k", "location": "", "jd": "岗位职责\n一、Agent 与自动化流程\n负责 Agent、Skill、AI 工作流的设计与落地，包括任务规划、工具调用、记忆、RAG、多 Agent 协作。\n设计提示词结构、节点编排、异常处理与结果校验，实现业务自动化闭环。\n负责 OpenClaw 、dify、脚本执行器或同类 Agent 平台的 Skill 接入、调试与部署。\n统一封装 Claude、ChatGPT、Gemini、DeepSeek、Qwen、MiniMax 等模型 API，并打通 Agent 与业务系统、第三方接口、MCP、浏览器自动化工具的调用。\n持续优化流程的稳定性、任务成功率、上下文管理与执行效率。\n\n二、图像与视频生成\n负责 Stable Diffusion / SDXL / FLUX 等模型的工程化应用，搭建文生图、图生图、局部重绘、参考图生成、角色一致性等工作流，并针对业务调优参数。\n负责图生视频、文生视频等能力的接入与工作流建设，处理首尾帧、角色一致性、镜头与动作控制、多镜头连续生成等场景。\n基于 FFmpeg 完成拼接、转码、字幕、音频、抽帧、补帧、超分等后处理。\n\n三、开源模型部署与调试\n负责开源大模型（DeepSeek、Qwen、Llama、GLM 等）的本地化部署、服务化与调优，基于 vLLM、SGLang、Ollama、TGI 等推理框架对外提供统一接口。\n负责开源图像、视频模型权重的获取、版本管理与兼容性调试，处理依赖冲突、环境适配、节点与模型版本不匹配等问题。\n负责模型效果的对比评测与选型，结合业务场景验证开源模型与商用 API 的效果差异。\n跟进开源社区进展，持续引入新模型、新工作流并完成验证与落地。\n\n四、ComfyUI 工程化与推理优化\n负责复杂 ComfyUI 工作流的设计、调试与服务化，封装为 REST API / WebSocket 接入业务系统。\n开发或改造自定义节点，管理模型、LoRA、VAE、ControlNet 等资源的动态加载。\n负责 GPU 推理环境搭建，优化任务队列、并发控制、显存溢出恢复与失败重试。\n分析显存占用、GPU 利用率、推理耗时，通过量化、并行等方式持续优化生成速度与质量。\n\n五、业务系统与协作\n开发配套的前端页面、后端接口与数据处理逻辑，对接第三方系统完成数据同步、消息通知、报表等集成。\n配合产品、运营完成流程优化、问题排查、上线支持与效果迭代。\n\n\n任职要求\n计算机、人工智能、软件工程等相关专业，本科及以上学历优先。\n5 年以上开发经验，熟练掌握 Python / Node.js / Java / Go 中至少一种，Python 熟练者优先；具备基础前端能力，能用 Vue / React 完成页面开发。\n有真实的 LLM / Agent 项目开发经验，而非仅调用 Chat API；熟悉提示词工程、工具调用、结构化输出、RAG、记忆、工作流等核心技术。\n熟悉至少一种 Agent 框架或平台：LangGraph / AutoGen / LlamaIndex / Spring AI / Dify / Coze / OpenClaw 等。\n有开源模型的实际部署与调试经验，熟悉 PyTorch、CUDA 环境搭建，用过 vLLM / SGLang / Ollama / TGI 等推理框架或 Hugging Face 技术栈中的至少一种，能独立解决环境依赖、版本兼容、显存不足等问题。\n熟练使用 ComfyUI，能独立设计和调试复杂工作流；有 LoRA、ControlNet、IP-Adapter、Inpainting 实际使用经验。\n有至少一种主流 AI 视频模型的实际使用经验，如 Wan、HunyuanVideo、CogVideoX、LTX-Video、AnimateDiff 等。\n熟悉 Linux、Docker、Git，能独立处理接口异常、流程中断、结果不稳定、显存溢出等问题。\n能独立完成从技术调研、Demo 验证到生产上线的完整过程，并推动需求落地。\n\n\n加分项\n有 AI 短剧、AI 漫剧、数字人、AI 广告、AI 视频生产平台等项目经验。\n有角色一致性、多人物一致性、参考图重绘、视频一致性相关项目经验。\n有 ComfyUI 自定义节点开发、LoRA 训练或模型微调经验。\n有 Agent / Skill 的开发部署维护经验；日常使用 Claude Code、Cursor 等 AI 开发工具。\n熟悉 Diffusers、Transformers、Accelerate 等技术栈，了解 DiT、Flow Matching、VAE、CLIP 等生成模型原理。\n熟悉 FP16 / BF16 / FP8 / INT8 等量化加速方式，有多 GPU、模型并行、GPU 资源池、Kubernetes GPU 调度经验。\n有 MCP、浏览器自动化、Playwright 等 Agent 工具开发经验，或 Agent 链路追踪、效果评测体系建设经验。\n有自动化平台、RPA、审批流、爬虫、报表平台等业务集成经验，或高并发 AI SaaS 平台、模型 API 网关建设经验", "cat": "其他"}, {"id": "216", "title": "AI短剧导演", "salary": "28K-35K", "location": "", "jd": "岗位职责\n\n1. 负责 AI 短剧项目整体导演工作，包括剧本理解、剧情拆解、分镜设计、镜头调度及成片质量把控。\n2. 根据剧情设计景别、构图、运镜、人物表演及镜头衔接，强化人物情绪、剧情冲突及关键爆点。\n3. 将剧本转化为可执行的 AI 视频制作方案，明确镜头画面、人物动作、情绪及生成要求。\n4. 指导 AI 生成师使用 Seedance、可灵、ComfyUI 等工具完成镜头制作，并针对生成结果提出明确修改意见。\n5. 把控短剧整体节奏、人物一致性、画面连续性及剧情表达，与编剧、生成师、剪辑协作完成最终成片。\n6. 持续关注 AI 视频新技术及短剧市场趋势，不断优化制作流程和成片效果。\n\n任职要求\n\n1. 具备较强的导演思维、剧情理解能力及镜头语言能力，有短剧、影视、广告、动画、漫剧等相关导演经验。\n2. 熟悉短剧的剧情节奏、人物关系、情绪递进、冲突爆点及反转设计。\n3. 具备 AI 视频制作经验，熟悉 Seedance、可灵等主流 AI 视频工具，对 ComfyUI 工作流及 AI 视频生成逻辑有一定了解。\n4. 有半年以上 AI 短剧导演或相关项目经验，能够独立完成从剧本到成片的导演工作。\n5. 需提供个人作品或参与项目案例。\n\n加分项\n\n有擦边、成人向或强剧情短剧导演经验，有成熟爆款作品或完整 AI 短剧项目经验者优先。", "cat": "内容与创作"}, {"id": "217", "title": "AI短剧导演", "salary": "15K-35k", "location": "", "jd": "我们是一支专注于AI短剧内容创作及工具研发的团队，现招聘AI短剧导演。不论你是导演/影视制作背景，或是拥有丰富的AI短剧创作经验，欢迎投递。\n\n岗位职责\n    结合AI视频生成等短剧工具，探索并深度优化短剧创作流程及技巧，推动传统导演经验与AI生产方式融合；\n    研究剧本及镜头创作技巧，沉淀创作方法；\n    对运营团队的短剧剧本创作、镜头创作进行培训与指导；\n    与编剧、AI技术/工具团队、后期制作等角色协同配合，确保创作意图在AI生成环节被准确执行。\n    负责AI短剧从剧本到最终成片的全流程制作，把控成片质量和创作方向；\n     根据剧本完成分镜设计、镜头规划及视觉表达，确保画面呈现符合剧情表达需求；\n    对剧情节奏、人物表演、画面质感及后期效果进行把控，以及沉淀相应方法论和技巧。\n\n\n任职要求\n    熟悉短剧剧本结构与创作方法，能对剧本创作提出专业的修改和指导意见；\n    熟悉AI视频生成工具的创作流程与使用技巧，有AI内容创作经验者优先；\n    有完整作品者优先，请附作品集。\n    具备影视内容全流程制作经验，熟悉剧本→表演→摄影→构图→镜头→灯光→声音→剪辑→成片的完整链路；\n    具备较强的导演能力、镜头语言表达能力和审美判断力；\n    具备短剧内容创作经验，或影视、网剧、广告、短视频导演经验（两者满足其一即可）；\n\n综合素质：\n    对短剧竖屏叙事节奏、观众留存逻辑有一定认知，能在有限时长内完成有效的情绪与剧情表达；\n    具备培训与指导能力，善于将创作经验总结提炼为可复用的方法并传授给他人；\n    愿意尝试并适应AI驱动的新型制作流程，不局限于传统拍摄思维，能持续研究和优化创作方法；\n    沟通表达能力强，能与编剧、技术、后期、运营等多角色高效协作。\n\n加分项\n    有独立完成的短剧、网剧、广告等完整导演作品；\n    有AI短剧成片作品，且有一定播放/传播数据支撑；\n    有AI生成视频（文生视频、图生视频、数字人等）相关制作经验；\n    熟悉短剧行业常见节奏套路（如开篇强冲突、分集钩子设计等）；\n    有培训、带教经验，或有创作方法总结、教程等沉淀成果。", "cat": "内容与创作"}, {"id": "218", "title": "内容运营（吃瓜 / 黑料方向）", "salary": "面议", "location": "", "jd": "岗位职责\n    每天从 TG 频道、X、短视频平台、论坛社区、搜索热榜抓当日热点，判断哪一条值得做——这是本岗位最核心的工作。\n    素材处理与加工：去水印、图片加 Logo 出封面（1–3 张拼接、人脸对齐不切脸）、视频套站点片头。工具与参数全部现成，不用自己折腾规格。\n    撰写结构化 SEO 文章并录入后台：标题、摘要、SEO 简介、标签、关键词、正文、配图；正文 3–5 个 H2 分段、每段穿插配图。\n    按固定格式整理成 TG 消息，同步到频道与社群，一次生产多端分发。\n    跟踪自己内容的数据表现，复盘哪类选题有效、哪类没人看，并用结论调整下一轮选题。\n任职要求\n    对热点有判断力，而且是「今天的」热点：能从多个平台判断出哪条正在起量、哪条已经过峰，并说得出理由。翻几个月前的旧料重新剪一遍再发一次，在我们这里不算产出。\n    会找「有人搜」的词：明白用户搜的是具体人名与具体事件，不是「反差女神」这类泛词。动手前就能判断这条有没有搜索量。\n    看得懂数据并用它改下一篇：我们会给后台与统计权限，你要能随时回答「你这周哪篇内容带来了流量、为什么是它」。\n    接受按结果考核，不按发布篇数考核：我们宁可你一天做 5 条条条有人看，也不要一天 20 条篇篇零观看。产出数量只是基础线，不是成绩。\n    能接受成人向擦边内容环境（网红黑料、明星八卦、不雅事件等），这一点请在投递前想清楚。\n    沟通及时：选题、素材、排期都靠即时沟通，消息需在合理时间内回应。\n    具备远程工作的自驱力。\n加分项\n    做过娱乐、八卦、成人向账号或站点，有可展示的数据结果。\n    懂 SEO：知道长尾词、标题写法、收录是怎么回事，会看搜索下拉词与相关搜索判断需求。\n    会用 AI 工具（Grok / ChatGPT / Claude）提效，但知道产出必须自己把关——人物类内容编错名字是事故。\n    有自己的素材渠道积累（TG 频道、爆料源、素材站），带资源进场者优先。\n    会基础图片与视频处理。\n    做过内容型站点从 0 到日 UV 万级的完整经历。", "cat": "内容与创作"}, {"id": "219", "title": "广告平台专家（技术方向 / 产品运营方向）", "salary": "20K-35k", "location": "", "jd": "本岗位面向广告平台对接、投放支持与系统建设全链路工作，不局限于开发背景，以下两类候选人均可申请：\n\n    技术方向：具备 Go 后端开发经验，负责广告相关系统的架构设计与开发；\n产品/运营方向：具备广告投放实操经验，精通主流广告平台的规则、配置与运营策略，负责账户配置、投放策略制定、效果分析与平台规则适配。\n\n    两类候选人在\"广告平台对接与投放运营\"部分职责与要求基本一致，技术方向额外承担系统架构与后端建设工作，产品/运营方向额外承担投放策略与业务运营工作。请在任职要求中选择匹配自身背景的方向阅读。\n\n岗位职责\n    一、广告平台对接与投放运营（通用，两个方向均涉及）\n熟悉并对接主流广告平台（巨量引擎 / 腾讯广告 / 快手广告 / 百度营销 / 广点通 / Google / Meta (Facebook) / TikTok / Apple Search Ads / Amazon / Microsoft 等）的开放 API、SDK、数据协议及后台操作规则；\n    负责投放账户、计划、单元、创意、人群定向、出价策略的配置、调试与上线支持；\n    负责投放数据回收、实时监控、效果分析（曝光、点击、CTR、CVR、CPA、CPC、ROAS、ROI 等）；\n    负责投放异常排查、平台规则适配、数据对账与归因核对；\n    处理跨区域数据合规（GDPR / CCPA / PIPL）、iOS 端 SKAdNetwork 归因、IDFA 弱化后的隐私优先归因、Conversion API / S2S 回传、多币种结算等海外特有场景的业务落地。\n\n    二、广告系统架构与技术建设（技术方向）\n    主导广告投放管理系统、账户与权限体系、预算与出价控制系统的架构设计与开发；\n    负责广告对账与计费系统、归因与转化追踪系统、人群与创意分析系统的建设；\n    负责实时投放监控大盘、ROI 归因、转化漏斗、异常告警等核心模块建设；\n建设广告数据\"采集 → 传输 → 存储 → 实时计算 → 效果分析\"全链路，与大数据    平台（Kafka / Flink / Doris / ClickHouse）深度集成；\n    支持 oCPM / oCPC / OCPA、RTB 实时竞价、归因窗口、人群定向等业务核心场景落地。\n\n    三、核心后端架构工作（技术方向）\n     负责核心后端系统的架构设计、技术方案设计及落地，参与高并发、高可用、分布式系统的建设与持续优化。\n    负责大型业务系统的服务架构设计，包括服务拆分、流量治理、负载均衡、容灾、高可用、数据一致性及性能优化等。\n    负责设计和建设 CDN + 应用层 + Redis 等多级缓存体系，解决热点数据、高并发访问、缓存穿透、缓存击穿、缓存雪崩、缓存一致性及大规模流量场景下的性能问题。\n\n    参与大型企业级统一入口 / 统一接入体系建设，包括 API Gateway、统一域名入口、流量调度、服务发现、健康检查、限流、熔断、故障切换等，并建设相应的监控及管理面板。\n    负责生产环境完整的监控、可观测性及故障定位体系建设，能够从基础设施、网络、网关、应用、数据库、缓存到业务指标建立完整的监控体系。\n基于 OpenTelemetry 建立统一的 Metrics、Logs、Traces 可观测性体系，实现跨服务的全链路追踪，并通过 TraceID、日志、指标、调用链等信息快速定位生产环境问题。\n    建立生产环境故障快速定位和分析机制，能够针对 CPU、内存、网络、连接池、GC、线程/Goroutine、QPS、错误率、P99 延迟、缓存命中率、数据库慢查询、消息堆积等问题进行快速分析和定位。\n    参与大数据及实时数据处理相关系统建设，负责海量日志、用户行为、订单、风控事件等数据的采集、处理、分析及查询架构设计。\n    参与或负责基于 Flink 的实时计算、实时风控、实时指标及事件处理系统建设，理解 State、Checkpoint、Watermark、Window、Exactly-Once 等核心机制。\n    参与 Doris / Elasticsearch / ClickHouse 等大数据及分析系统的建设、性能优化和生产环境运维，解决海量数据写入、查询、索引、分片、数据生命周期及集群扩展等问题。\n    参与大型日志平台、风控系统、数据分析平台或实时监控平台建设，能够针对海量数据场景进行系统容量规划、性能优化及故障排查。\n    积极使用 AI 提升研发效率，包括 AI Coding、代码分析、问题排查、技术方案设计、测试生成、日志分析等场景。\n\n    四、投放策略与业务运营（产品/运营方向）\n    制定并持续优化各广告平台的投放策略、账户结构搭建方案与预算分配方案；\n跟踪各广告平台的规则、政策与产品功能更新，输出平台规则差异对比与风险预警；\n    建立投放 SOP 与配置规范，支撑跨平台、跨账户的标准化操作与批量管理；\n    对接广告平台方（销售、技术支持、代理商）跟进账户问题、政策申诉与资源支持；\n    定期输出投放效果复盘报告，基于数据提出优化建议，支撑业务决策；\n    与技术团队协作，梳理并输出清晰的业务需求文档（PRD/需求说明），推动投放相关系统功能迭代；\n    积极使用 AI 提升工作效率，包括 AI 辅助数据分析、报表生成、规则研究、文档撰写等场景。\n\n任职要求\n    请根据自身背景选择匹配的方向，满足其中一个方向的要求即可：\n\n技术方向\n    5 年以上后端开发经验，3 年以上 Go 开发经验，具备扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、网络编程及 Go 服务性能优化。\n具备较强的系统架构设计能力，有实际负责大型分布式系统、高并发系统或核心业务系统架构设计和落地经验。\n    有丰富的 CDN + 应用缓存 + Redis 多级缓存架构经验，理解缓存一致性、热点数据、缓存穿透/击穿/雪崩等问题。\n    有大型企业统一入口 / 统一接入平台建设经验，熟悉 API Gateway、流量治理、限流、熔断、服务发现、健康检查、故障切换等。\n    有完整的生产环境监控和可观测性体系建设经验，能够从 0 到 1 设计和建设一套覆盖基础设施、网络、网关、应用、数据库、中间件及业务指标的监控体系。\n    具备较强的线上问题快速定位能力，能够通过 Metrics、Logs、Traces、调用链、系统指标及业务指标，快速判断问题所在层级，并建立从「发现问题 → 告警 → 定位 → 分析 → 处理 → 复盘」的完整闭环。\n    有 OpenTelemetry 或同类可观测性体系的实际使用经验，理解 Metrics、Logs、Traces、TraceID、Span、Context Propagation 等概念。\n    具备较好的大数据系统经验，有海量日志、实时数据、用户行为分析、风控、监控或数据分析平台的实际项目经验。\n    对以下技术有实际生产环境使用经验：Flink / Doris / Elasticsearch / ClickHouse（不要求每项都达到专家级，但至少有 1～2 项较深入的生产实践）。\n有大规模日志系统 / 实时风控系统 / 实时监控系统 / 数据分析平台中的一种或多种实际建设经验。\n    具备一定的 AI 工具使用经验，能够使用 AI 辅助编码、代码阅读、问题排查、技术方案设计、测试及日常研发工作。\n\n产品/运营方向\n    3  年以上广告投放、广告平台产品或广告运营相关经验，有实际操盘账户的经验（甲方、乙方或代理商背景均可）。\n    精通至少 2-3 个主流广告平台（巨量引擎 / 腾讯广告 / 快手广告 / 百度营销 / 广点通 / Google / Meta (Facebook) / TikTok / Apple Search Ads / Amazon / Microsoft 等）的后台操作、账户结构、计费规则、审核规则与归因规则。\n    具备账户搭建、预算与出价策略制定、人群定向、创意优化的实操经验，能独立完成投放配置与调优。\n    数据敏感，具备较强的数据分析能力，能独立完成效果分析（CTR、CVR、CPA、CPC、ROAS、ROI 等核心指标）、异常排查与复盘总结。\n熟悉 oCPM / oCPC / OCPA、RTB 实时竞价、归因窗口等核心投放机制及其对配置策略的影响。\n    了解跨区域合规要求（GDPR / CCPA / PIPL）、iOS 端 SKAdNetwork 归因、IDFA 隐私政策变化对投放策略的影响者优先。\n    具备良好的跨部门沟通与文档能力，能与技术团队高效协作，输出清晰的业务需求文档。\n    具备一定的 AI 工具使用经验，能够使用 AI 辅助数据分析、报表处理、规则研究及日常工作。\n\n加分项\n有国内外主流广告平台综合投放或系统对接经验，同时熟悉多个平台的规则差异与最新政策变化。\n有大型互联网、金融、电商、支付、广告、内容平台等高并发业务或大规模投放业务经验。\n技术方向加分：熟悉 Kafka、Pulsar 等消息队列的大规模生产实践；熟悉 Kubernetes、Docker、云原生及微服务体系；熟悉 Prometheus、Grafana、Loki、Tempo、Jaeger 等监控及可观测性组件；熟悉 MySQL / PostgreSQL，并具备数据库性能优化经验；有 Iceberg、数据湖、实时数仓等相关经验；有大型风控规则引擎、实时决策引擎或事件驱动系统建设经验；有大型企业基础设施平台、统一接入平台、监控平台或内部 PaaS 平台建设经验。\n产品/运营方向加分：有投放自动化工具、批量账户管理工具、规则引擎类产品的使用或产品设计经验；有广告投放团队管理或跨平台投放策略统筹经验；持有主流广告平台官方认证（如巨量引擎、Google Ads、Meta Blueprint 等）者优先。\n有 AI Agent、RAG、MCP、AI Coding 或其他 AI 工程实践经验。", "cat": "技术开发"}, {"id": "220", "title": "AI创意产品经理", "salary": "15K-30K", "location": "", "jd": "岗位职责\n1、自动化流程设计\n梳理短剧内容生产全链路（选题、剧本、分镜、素材生成、剪辑合成、审核、发布）现状，识别人工瓶颈环节；\n设计自动化生产流程方案，推动技术团队落地，并建立效果监控机制持续迭代优化；\n\n2、AI工具功能研究设计\n持续跟踪文生图、图生视频、AI剧本生成、语音合成、数字人等相关工具的能力边界与行业最新进展；\n输出工具选型评估及能力对比测评报告，识别可产品化的AI能力，推动其嵌入生产流程和产品功能；\n\n3、短剧创作流程及方案优化\n结合短剧行业标准创作流程（立项、剧本、分镜、成片、审核发布）与AI生产的特殊性，制定/优化内容生产标准流程及质量把控节点；\n建立生产效率与内容质量的评估指标，持续优化方案，平衡产出速度与成片质感；\n\n4、短剧创作创意构思\n负责短剧选题策划、故事大纲及剧本创作，把控内容方向与创意质量；\n结合平台数据反馈（完播率、互动数据等）持续优化创作思路，为AI生成环节提供高质量的内容输入。\n\n任职要求\n熟悉内容生产类自动化流程的设计逻辑，具备将复杂业务流程拆解为可执行自动化方案的能力；\n精通主流AI生成工具的使用（文生图、图生视频、AI剧本生成、语音合成、数字人等），能熟练运用AI工具提升内容生产及日常工作效率；\n具备短剧剧本/故事创作能力，能独立完成选题策划、故事大纲及剧本撰写，有基本的叙事节奏和情节把控能力；\n熟悉短剧行业标准创作流程（立项、剧本、分镜、生成/拍摄、剪辑、审核发布），了解各环节关键要点及常见问题；\n\n综合素质：\n逻辑思维清晰，具备较强的结构化分析与方案设计能力；\n文档输出能力强，能产出清晰的流程图、方案文档及规范说明；\n沟通协调能力强，能与技术、运营、内容审核等多角色高效协作推进项目；\n对短剧内容及AI技术发展保持敏感度和好奇心，愿意持续学习新工具、新方法。\n\n加分项\n有短剧/短视频/影视行业从业经验；\n有独立短剧剧本代表作品，或参与过完整短剧项目的创作/制作；\n有AI内容生产平台、自动化工具类产品经验；\n有数据分析能力，能通过数据反馈驱动创作和流程优化。", "cat": "产品与管理"}, {"id": "221", "title": "新媒体推广专员", "salary": "10K-18k", "location": "", "jd": "一、岗位背景\n\n为承接后续规模化拉粉、内容运营和引流转化,现招聘 1-2 名专职新媒体推广专员,负责多产品线的海外社交平台矩阵运营,直接对接产品 GMV 增长。\n\n二、岗位职责\n\n1、账号矩阵运营(核心)\n\n独立运营 X(推特)/ Instagram / Telegram等海外社交平台的官方账号、官方频道、官方群\n每人负责 2-3 个产品线的账号矩阵搭建、养号、日常发布\n完成账号从冷启动到粉丝规模化的全流程\n\n2、内容策划与生产\n\n根据不同平台特性差异化策划内容\n生产擦边封面、短视频剪辑、图文文案、话题标签\n内容水印规范化,引流回产品的路径设计\n每日发布量 ≥ 3 条/账号\n\n3、引流转化\n\n建立\"官方号 → 自建号 → 落地页\"引流闭环\n跟踪各平台新增用户数据 + 引流转化率 + LTV\n与产品运营配合,优化转化路径\n\n4、粉丝运营\n\n官方群/官方频道日常维护、答疑、活跃互动\n拉粉策略执行(SEO 优化 + 话题 hijack + 跨平台导流)\n粉丝规模 KPI 达成(月度净增 ≥ 3,000/账号)\n\n5、数据复盘\n\n每周输出各账号数据日报 / 周报(粉丝增长、发文量、互动率、引流数)\n每月输出账号矩阵 ROI 分析,与副主管对齐下月优化方向\n三、任职要求\n\n硬性条件\n\n1 年以上海外社交平台运营经验(推特 / IG / TG/TK等 至少 2 个平台有实操经验)\n熟悉海外社交平台的算法规则、内容边界、防封号技巧\n熟练使用外事邮箱、VPN、多账号管理工具\n能独立完成简单视频剪辑、图文封面设计(会 PS / 剪映 / CapCut 至少一款)\n有引流 / 拉粉的实战成功案例(能提供数据佐证)\n\n优先条件\n\n有成人向 / 擦边内容 / 影视资源 / 短剧类账号运营经验\n有海外社交平台\"矩阵账号 + 引流转化\"完整经验(粉丝规模 10 万+)\n有 TG 频道/群 拉粉、SEO、话题运营经验\n熟悉推特算法(推荐机制、话题榜、互动加权)\n\n软技能\n\n内容嗅觉敏锐,能快速捕捉热点\n抗压能力强,能接受较高的日发文量\n数据敏感,以 KPI 为导向\n团队协作能力(需与渠道组员、产品运营频繁沟通)\n四、加分项\n自有大号资源(可带号入职)\n熟悉 AI 素材生产工具(Midjourney / SD / Runway 等)\n有 BOT 自动化发文经验\n有海外营销号灰产/黑产对抗经验(防封号、防限流)\n有小红书 / 抖音 / 快手 主流平台运营经验(用于跨平台复用素材)\n五、我们提供\n\n薪酬\n\n底薪 [面议,10-18k] + 绩效奖金 + 项目分成\n绩效奖金按月度 KPI 完成率发放:\n粉丝规模达标 → 基础奖金\n引流转化超预期 → 阶梯奖金(单账号月度引流新增 ≥ 5,000 用户即触发)\n年终奖 + 项目激励\n试用期考核标准(3 个月)", "cat": "其他"}, {"id": "222", "title": "AI短剧编剧", "salary": "12k-20k", "location": "", "jd": "岗位职责\n负责 AI成人向剧情短剧的选题策划、人物设定、故事大纲及分集剧本创作，结合AI制作特点设计可落地的剧情，与制作团队配合，保证故事吸引力、叙事节奏和交付效率。\n岗位要求\n1：有短剧、影视、网文或漫画等相关创作履历，面试需提供剧本或已上线作品；\n2：了解成人向题材的受众偏好，擅长人物关系、情绪张力、剧情冲突及悬念设计；\n3：熟悉短剧叙事结构，能把控开篇吸引力、分集节奏、剧情转折和集尾钩子；\n4：具备画面化写作能力，能清晰描述场景、动作与情绪，合理控制人物数量和制作复杂度；\n5：能独立完成选题、大纲及分集剧本，并根据制作反馈和上线表现调整内容；\n6：具备良好的沟通能力、责任心及团队配合意识，能够按排期稳定交稿。\n加分项：\n有已上线短剧、成熟连载作品、爆款内容或AI短剧编剧经验者优先。", "cat": "内容与创作"}, {"id": "223", "title": "短剧审核（剧本）", "salary": "10k-18k", "location": "", "jd": "岗位职责\n负责 AI成人短剧剧本的内容审核，包括选题方向、人物设定、冲突埋点、剧情逻辑、分集节奏及制作可行性评估，输出明确的修改意见并跟进复核，保证剧本质量符合平台定位与制作要求。\n岗位要求\n1：有短剧编剧、剧本评审、文学编辑或影视策划等相关项目履历，面试需提供创作作品或评审案例；\n2：了解成人向剧情题材及用户偏好，能判断选题吸引力、人物关系、剧情冲突和持续追剧价值；\n3：熟悉短剧叙事结构，能识别开篇乏力、节奏拖沓、情节重复、转折生硬及集尾悬念不足等问题；\n4：具备严谨的逻辑判断能力，能检查人物动机、行为逻辑、时间线及前后情节的一致性；\n5：了解AI短剧制作特点，能评估人物、场景、动作等制作难度，提出兼顾剧情表现与落地效率的修改建议；\n6：具备良好的文字表达、沟通能力及责任心，能依据统一标准审核，清晰标注问题并跟进修改闭环。\n加分项：\n有已上线短剧、成熟连载作品、AI短剧编剧或剧本统筹经验，参与建立剧本评审标准者优先。\n具体薪资根据能力、经验及评审水平确定。", "cat": "内容与创作"}, {"id": "224", "title": "短剧审核（镜头）", "salary": "12k-20k", "location": "", "jd": "岗位职责\n负责 AI短剧分镜、生成镜头及成片的视觉质量审核，检查剧情表达、人物一致性、画面细节、动作表现与镜头衔接、画面剪辑，输出准确到镜号或时间点的修改意见并跟进返修复核，保证镜头质量与交付标准统一。\n\n岗位要求\n1：有短剧制作、影视后期、动画、分镜设计或视频质检等相关项目履历，面试需提供作品或镜头评审案例；\n2：理解基础镜头语言，能判断景别、机位、构图、视线及空间关系是否合理，镜头是否准确表达剧情与人物情绪；\n3：具备人物及场景一致性判断能力，能检查角色外貌、服装、道具、光线及环境在不同镜头中的连续性；\n4：熟悉AI生成视频的常见问题，能识别肢体变形、动作异常、物体漂移、画面闪烁及穿帮等缺陷；\n5：能结合前后镜头检查动作衔接、叙事连贯及音画配合，明确区分需重新生成、后期修正和可优化的问题；\n6：观察细致，具备良好的沟通能力、责任心及团队配合意识，能准确标注问题、跟进返修并完成版本复核。\n\n加分项：\n有AI短剧生成、剪辑、动画质检或完整剧集制作经验，熟悉AI生图、生视频工具，参与建立镜头验收标准者优先。\n具体根据能力、经验及专业水平确定。", "cat": "内容与创作"}, {"id": "225", "title": "运营组长", "salary": "14k-25k", "location": "", "jd": "岗位定位：负责 AI 短剧产品的内容运营与用户增长，带领运营团队建立高效的内容供给和运营机制，对用户活跃、留存及付费转化结果负责。\n\n岗位职责\n1. 业务目标与团队管理：**制定阶段性运营策略，拆解 DAU、新增、留存、充值、会员转化等目标，组织团队执行、复盘并持续优化。\n2. 内容运营：统筹 AI 短剧的内容供给、上架、分类、推荐及封面标题优化，结合播放、完播、追剧和付费数据提升内容表现。\n3. 增长与转化：策划活动、会员运营和用户召回方案，优化从内容触达到观看、追剧、付费的关键路径。\n4. 数据驱动：建立日常数据监测与复盘机制，定位业务问题，推动运营方案及产品迭代落地，并验证效果。\n5. 机制建设：完善内容审核、上架、巡检、活动执行和数据复盘等 SOP，提升团队交付质量与效率。\n6. 协同与提效：与产品、技术、设计及内容团队协作，推动关键项目落地；运用 AI 工具优化内容生产、素材测试、数据分析等工作。\n\n岗位要求\n1. 3 年以上互联网内容或产品运营经验，有独立负责业务指标、带领小团队或牵头跨职能项目的经验。\n2. 熟悉短剧、短视频或内容产品的用户消费路径，能够判断题材、剧情节奏、封面标题及推荐策略对用户行为的影响。\n3. 具备完整的数据分析与运营闭环能力，能从指标变化中定位问题、制定方案并推动结果改善。\n4. 有运营体系搭建或流程规范化经验，既能制定策略，也能带团队深入执行。\n5. 熟练使用 AI 工具，能够将其应用于内容运营和团队提效，并对 AI 生成内容保持质量判断。\n6. 结果导向，具备较强的沟通协调和推进能力，能在业务变化中合理安排优先级。\n\n加分项\n有短剧平台、视频平台、付费内容产品或 AI 内容产品运营经验；有内容商业化、会员体系或从 0 到 1 搭建运营团队的实践经验。", "cat": "运营与市场"}, {"id": "226", "title": "短剧内容策划", "salary": "10-25k", "location": "", "jd": "岗位职责\n1.持续关注热点事件、社交平台热门话题及热门短剧，挖掘具有传播潜力的故事素材。\n2.负责将素材改编为短剧剧本，设计开场钩子、剧情反转与结尾悬念，确保每集内容具备持续吸引力。\n3.借助 AI 工具完成分镜脚本与人物设定；制定选图标准，从 AI 批量生成结果中确定最符合剧情的版本。负责成人向情节的节奏、细节与画面呈现的把控与优化。\n4.负责成片验收，对未达标内容提出修改要求，确保内容质量符合上线标准。\n5.结合播放量、完播率、付费转化等数据进行复盘，总结受众偏好，持续优化选题方向。\n\n任职要求\n硬性要求：\n1.具备较强的故事创作能力，有热点事件、情感故事、娱乐资讯、小说推文等内容创作经验，可提供过往作品。\n2.熟悉短内容的开篇设计，能够在内容开头迅速吸引用户注意力。\n3.具备良好的网络敏感度，持续关注短视频及社交平台，了解当前热门内容趋势。\n4.具备 AI 写作及出图工具的使用能力，或有较强的学习意愿。\n5.具备成人向内容的审美判断能力，能够把握情节铺垫、情绪张力与画面呈现，提升内容吸引力。\n6.严格遵守内容规范：所有角色均为成年人设定，不涉及任何违法违规内容。\n加分项：\n1.有短视频账号或自媒体运营经验，有单条高播放量作品数据。\n2.有网络小说、剧本或漫画脚本的创作经验。\n3.有 AI 辅助写作或出图的实际创作经验。\n4.具备数据分析意识，能够根据用户反馈调整内容方向。", "cat": "内容与创作"}, {"id": "227", "title": "产品经理", "salary": "20-25K", "location": "", "jd": "职位描述\n1.负责播放器类产品核心体验设计，包括播放页、推荐流、弹幕/评论等关键交互功能的规划与持续优化。\n2.基于用户行为数据，拆解推荐系统需求，参与评估召回、排序等模块效果，推动推荐体验提升。\n3.负责产品版本规划与需求管理，输出 PRD、流程图、原型图等产品文档，协调研发、设计、测试等团队，保障按期高质量交付。\n4.结合数据分析（如留存率、DAU、完播率、播放时长等），识别产品体验问题，提出并推动优化方案落地。\n5.持续关注并分析长视频、短视频、直播等行业竞品，为产品规划与决策提供依据。\n6.与运营、内容、商务等团队紧密协作，推动内容策略、活动玩法、会员体系等产品方案落地。\n\n任职要求\n1.本科及以上学历，3 年及以上 C 端产品经理经验，有播放器类、视频类或内容消费类产品经验者，熟练使用AI工作输出经验优先。\n2.具备扎实的产品方法论，能够独立完成需求拆解、方案设计与产品落地。\n3.熟悉内容推荐或信息流产品逻辑，对推荐系统的基本原理与产品形态有清晰认知者优先。\n4.数据敏感度高，能够基于数据发现问题、验证假设并形成优化方案。\n5.对用户增长有体系化理解，熟悉并能应用核心指标体系：CTR、完播率、留存率、活跃度、播放时长等。\n6.具备较强的跨团队沟通与协调能力，能够在多角色协作环境中推进项目落地，具备良好的执行力与结果导向意识，能快速推动需求闭环。", "cat": "产品与管理"}, {"id": "228", "title": "AIGC内容编辑师（ComfyUI工程师 ）", "salary": "15-30K", "location": "", "jd": "岗位职责：  \n1. 根据项目需求制作AIGC图片、视频及短剧素材。\n2. 统一角色、场景、道具及整体画面风格，保障角色一致性和多镜头连续性。\n3. 使用ComfyUI、MiniMax H3等工具完成文生图、图生图、图生视频、视频重绘及局部重绘。\n4. 根据分镜完成镜头拆分、批量生成、素材管理及交付。\n5. 配合后期完成短剧成片制作。\n6. 持续优化AI工作流，沉淀提示词库、角色库、场景库及标准化流程。\n7. 培训团队成员使用相关工作流。\n岗位要求：  \n1. 熟练使用ComfyUI，具备云端或本地部署经验，能独立搭建、调整工作流并排查问题。\n2. 能够独立搭建MiniMax H3本地或云端完整生产链路，并用于AIGC视频内容生产。\n3. 熟悉LoRA、IPAdapter、ControlNet、FaceSwap等角色一致性方案。\n4. 熟悉Flux、SDXL等主流模型及生态。\n5. 了解即梦、可灵、Runway、Pika、Luma、PixVerse、海螺等AI视频工具。\n6. 具备良好的审美、镜头意识、批量生产及问题排查能力。\n7. 具备教学能力，能够培训团队成员独立使用工作流。\n其他要求：\n有AI短剧、AI漫剧、广告素材或成人向剧情内容制作经验者优先。", "cat": "内容与创作"}, {"id": "229", "title": "中高级运营", "salary": "12-20k", "location": "", "jd": "岗位职责：\n1. 内容增长与策略执行：承接整体运营策略，围绕拉新、留存、转化、变现等核心指标推进落地 \n2. 持续优化内容结构，提升点击率、留存率及付费转化 \n3. 日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略 \n4. 内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，优化内容结构（封面、标题、前3秒、标签等关键环节）建立可复用的内容生产标准与方法论 \n5. 跨部门协作：与产品、技术、渠道等团队协同。推动内容相关功能优化与产品迭代\n岗位要求：\n1. 有3-5年成人行业工作经历 \n2. 有完整参与或主导内容项目/产品从0到1或增长阶段的经验 \n3. 具备较强的数据分析能力（能独立拆解问题并提出策略） \n4. 熟悉内容生产流程，具备内容判断与筛选能力 \n5. 执行力强，能推动事情落地，沟通能力强，能跨团队协作，抗压能力强，适应快节奏环境", "cat": "运营与市场"}, {"id": "230", "title": "中级运营", "salary": "12-15k", "location": "", "jd": "岗位职责：\n1. 3年以上To C产品运营、产品运营或内容产品相关经验，有内容站、社区产品、泛娱乐产品（包括但不限于视频、交友、直播等）产品经验优先；\n2. 必须具备产品0-1搭建或核心项目从规划到落地的完整经验，能够独立推动需求设计、项目落地及后续迭代优化经验；\n3. 熟悉产品迭代流程，能够结合业务目标、用户反馈及数据表现，持续推进产品功能优化与版本迭代；\n4. 具备基础原型输出能力，能够独立完成基础原型图、流程图、页面逻辑梳理，并与产品、设计、技术高效协同；\n5. 熟悉内容类产品运营逻辑，对内容板块搭建、内容分发、内容消费链路及内容生态优化有一定经验；\n6. 具备用户增长思维，对拉新、留存、活跃、转化等核心增长指标有实践经验，能够围绕目标制定增长策略；\n7. 具备较强的数据分析能力，能够通过数据发现问题、定位原因，并推动产品与运营方案优化；\n8. 对AI产品或AI工具有一定理解和应用经验，能够结合AI能力推动业务提效、内容优化或产品创新者优先；\n9. 具备良好的跨团队沟通协作能力，能够与产品、技术、设计、运营等多角色高效配合，推动事项落地；\n10. 具备较强的执行力、责任心和项目推进能力，能够适应业务快速变化与多任务并行节奏。\n\n岗位要求：\n1. 负责内容类产品的中后台及用户侧运营工作，围绕产品迭代、内容优化、用户增长及转化提升等方向，持续推进业务发展；\n2. 参与产品需求规划与版本迭代，能够结合业务目标、用户需求及数据反馈，提出优化方案并推动落地；\n3. 独立输出基础原型图、页面逻辑及流程方案，协助完成产品方案梳理、需求评审及开发对接；\n4. 负责内容板块的规划、调整与优化，持续提升内容曝光效率、用户消费效率及整体内容体验；\n5. 围绕用户增长目标，制定并推进拉新、促活、留存、转化等相关运营策略，提升产品核心指标表现；\n6. 分析用户行为及内容数据，重点关注DAU、留存率、转化率、内容点击率、消费时长等指标，并输出优化建议；\n7. 协同产品、技术、设计等团队推进产品功能落地，跟进项目排期、开发进度、测试上线及效果复盘；\n8. 结合内容生态和用户需求，持续优化内容结构、页面体验及功能策略，提升用户活跃度与产品使用体验；\n9. 探索AI在产品和运营场景中的应用，推动AI能力在内容生产、内容分发、用户运营或效率提升方面的落地；\n10. 沉淀产品运营方法论与项目流程规范，为后续业务复制和团队协同提供支持。\n\n必备条件：\n视频平台、AI互动产品、社区平台、社交平台等泛娱乐行业经验；\n具备产品0-1搭建或核心项目从规划到落地的完整经验；\n具备用户增长思维，对拉新、留存、活跃、转化等核心增长指标有实践经验，能够围绕目标制定增长策略；\n具备较强的数据分析能力，能够通过数据发现问题、定位原因，并推动产品与运营方案优化；\n跨职能岗位协调经验丰富，能够进行快速协调技术岗位推动整体项目开发进度；\n思维活跃实事求是，能够洞察工作环节的缺失点进行汇总，并进行有效整改。", "cat": "运营与市场"}, {"id": "231", "title": "国内新媒体运营", "salary": "15k-20k", "location": "", "jd": "岗位职责：\n1. 负责国内主流媒体平台整体运营规划，包括但不限于小红书、抖音、视频号、微博、公众号等平台；\n2. 根据业务发展方向制定平台运营策略、账号矩阵规划及阶段性增长目标；\n3. 深度研究各平台流量机制、推荐逻辑及内容生态，结合平台规则持续优化运营策略；\n4. 负责内容运营体系搭建，包括选题策划、内容方向、用户增长、互动运营及传播转化；\n5. 独立推进账号从0-1孵化及成熟账号增长，对账号数据结果负责；\n6. 定期分析平台数据及竞品动态，输出运营复盘及优化方案；\n7. 协调内容、设计、商务及技术等团队资源，推进项目执行及活动落地；\n8. 建立账号运营标准及管理机制，降低平台风险，保障账号稳定运营。\n\n任职要求：\n1. 大专及以上学历，3年以上国内主流媒体平台运营经验；\n2. 熟悉小红书、抖音、视频号等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知；\n3. 具备成熟账号操盘经验，有成功案例或账号增长成果优先；\n4. 具备较强的数据分析及运营复盘能力，能够通过数据驱动内容及运营优化；\n5. 具备较强的项目推进及统筹能力，能够独立负责平台整体运营工作；\n6. 对热点趋势、内容传播及用户心理有较高敏感度；\n7. 具备团队协作及基础管理能力，有运营团队管理经验优先；\n8. 有AI内容、互联网科技类项目运营经验者优先。\n\n加分项：\n1. 有百万级曝光或成熟账号矩阵运营经验；\n2. 熟悉短视频内容运营及投流逻辑；\n3. 有品牌营销、活动运营或商业化增长经验；\n4. 具备基础视频剪辑、内容策划或达人合作经验。", "cat": "运营与市场"}, {"id": "232", "title": "AI内容工程师（AI视频生产）", "salary": "15k-20k", "location": "", "jd": "一、岗位职责：\n1. AI剧情真人剧全流程制作：基于剧本完成分镜拆解、角色形象生成、多镜头剧情视频生成与后期剪辑，产出具备完整故事线和人物表演的AI真人短剧。\n2. AI成人影视全流程制作：完成影视角色与场景生成、静态画面动态化处理、镜头运动与配音配乐整合，产出高质量动态漫剧视频。\n3. 角色一致性与风格统一控制：通过LoRA、IPAdapter、ControlNet、FaceSwap等技术，确保同一角色在多集、多场景中的面部、服饰、姿态保持一致，并维护漫剧视觉风格统一。\n4. AI生产工作流搭建与效率优化：基于ComfyUI、扣子、Dify等工具构建标准化AI视频生产流水线，建立可复用的角色库、场景库与提示词体系，支撑剧情剧与漫剧的量产。\n5. 质量把控与新技术验证：对生成内容进行叙事节奏、画面质量的审核与修复，持续测试最新AI视频模型，优化效果与效率。\n\n二、任职要求：\n1. 1年以上AI视频实战经验，有成人经验更佳；\n2. 深度掌握核心AI工具链：图像生成，视频生成工作流搭建（ComfyUI）及基础后期剪辑\n3. 能独立完成从剧本到分镜的转化，理解景别、运镜、正反打等镜头语言，并通过提示词精准控制角色表演、情绪张力与镜头节奏。\n4.快速上手新AI视频模型，主动优化生产流程以支撑剧集化量产，并对生成瑕疵进行人工修复与质量把关。", "cat": "内容与创作"}, {"id": "233", "title": "中高级运营专员（创作者社区运营）", "salary": "15–25k", "location": "", "jd": "一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕创作者运营、用户运营、内容运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责创作者运营管理，推动创作者引入、分层、激励、活跃维护及产出提升，保障内容持续供给；\n5. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n6. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n7. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进；\n8. 根据业务发展需要，参与活动运营、专题策划、转化路径优化及其他与产品增长相关的专项工作。\n\n二、任职要求\n1. 3年以上互联网运营经验，社区运营、用户运营、内容运营方向优先；\n2. 具备完整项目运营经验，能够独立负责从目标制定、策略拆解、执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有0-1项目搭建经验、复杂业务增长经验、多平台运营经验者优先；\n8. 有团队管理或带教经验者优先；\n9. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "内容与创作"}, {"id": "234", "title": "中高级运营（内容方向）", "salary": "15k-20k", "location": "", "jd": "简历筛选要点：优先考虑具备 Twitter（X）、Telegram、Facebook 等海外社媒运营经验，有内容矩阵搭建、用户增长、爆款内容打造经验者；电商背景暂不考虑，同时重点关注候选人对 ChatGPT、Claude、Gemini、AI Agent 等AI工具的使用经验、学习兴趣及实际应用能力。\n\n岗位职责\n1. 结合业务与用户需求，制定整体内容策略（定位、调性、矩阵），规划各阶段选题方向，并搭建可持续生产的内容体系；\n2. 能独立撰写内容，完成相关平台账号（海外平台为主）的运营，确保内容质量与账号安全；\n3. 建立全渠道分发矩阵，制定差异化运营策略，并联动内外部资源（如换量、付费推广）放大内容影响力；\n4. 通过数据分析（打开率、转化率等）反推内容优化，利用内容手段提升拉新、激活、留存等核心指标，并建立用户画像与标签体系；\n5. 关注行业热点及AI发展趋势，探索并运用AI工具提升内容生产及运营效率。\n\n任职要求\n1. 本科及以上学历，3-5年以上内容运营经验，有成功案例优先；\n2. 熟悉国内外社媒及平台规则，尤其是 Twitter（X）、Telegram、Facebook 等平台运营经验丰富者优先；\n3. 具有良好的网感，对内容传播及热点趋势具备较强敏感度，并有独立的内容见解；\n4. 具备成熟的用户洞察能力，能够以业务增长为导向，产出高传播性内容；\n5. 对AI工具有浓厚兴趣，熟悉 ChatGPT、Claude、Gemini 等主流大模型产品，有实际使用经验优先；\n6. 关注 AI Agent、自动化工作流等发展趋势，具备持续学习和应用新工具解决运营问题的能力。\n\n加分项\n* 有从0到1搭建内容体系、账号矩阵或爆款内容打造经验；\n* 有成人娱乐、泛娱乐、海外流量等相关行业经验；\n* 有AI辅助内容创作、数据分析、账号运营或自动化工作流搭建经验；\n* 熟悉AI Agent产品或有相关实践案例。", "cat": "内容与创作"}, {"id": "235", "title": "AI内容编剧（偏内容剧本创意）", "salary": "15k-30k", "location": "", "jd": "简历筛选要点：\n有AI内容创作实操经验，需提供过往本人实际产出的AI视频剧本/内容作品\n\n岗位JD描述\n一、岗位职责：\n1. AI剧情真人剧全流程制作：基于剧本完成分镜拆解、角色形象生成、多镜头剧情视频生成与后期剪辑，产出具备完整故事线和人物表演的AI真人短剧。\n2. AI漫剧全流程制作：完成漫剧角色与场景生成、静态画面动态化处理、镜头运动与配音配乐整合，产出高质量动态漫剧视频。\n3. 角色一致性与风格统一控制：通过LoRA、IPAdapter、ControlNet、FaceSwap等技术，确保同一角色在多集、多场景中的面部、服饰、姿态保持一致，并维护漫剧视觉风格统一。\n4. AI生产工作流搭建与效率优化：基于ComfyUI、扣子、Dify等工具构建标准化AI视频生产流水线，建立可复用的角色库、场景库与提示词体系，支撑剧情剧与漫剧的量产。\n5. 质量把控与新技术验证：对生成内容进行叙事节奏、画面质量的审核与修复，持续测试最新AI视频模型，优化效果与效率。\n\n二、任职要求：\n1. 1年以上AI视频实战创意经验，有成人经验更佳，有创意剧本经验；\n2. 深度掌握核心AI工具链：图像生成，视频生成工作流搭建（ComfyUI）及基础后期剪辑\n3. 能独立完成从剧本到分镜的转化，理解景别、运镜、正反打等镜头语言，并通过提示词精准控制角色表演、情绪张力与镜头节奏。\n4.快速上手新AI视频模型，主动优化生产流程以支撑剧集化量产，并对生成瑕疵进行人工修复与质量把关。", "cat": "内容与创作"}, {"id": "236", "title": "高级产品经理", "salary": "20k-30k", "location": "", "jd": "岗位JD：\n一、岗位职责\n负责视频、漫画、小说、短剧等业务的产品规划与交付，连接用户体验、内容生态与商业增长；在复杂协作环境中将业务目标转化为可落地的产品成果，并通过 AI 提升产品全链路效率与质量。\n\n1.制定产品战略、产品路线图及需求优先级，覆盖用户端、创作者端及运营后台，推动从用户研究、方案设计、研发上线到数据复盘的完整闭环。\n2.持续优化视频播放、漫画/小说阅读、短剧观看及社区互动体验，关注内容发现、推荐分发、性能稳定性、跨端一致性及用户留存。\n3.设计粉丝经济与商业化体系，包括会员订阅、内容付费、虚拟商品、打赏、广告、及创作者激励等，兼顾收入增长、用户体验、创作者收益与平台生态。\n4.建立核心指标及实验机制，对活跃、留存、内容消费、付费转化、和内容供给等指标负责，通过数据发现问题并持续迭代。\n5.统筹产品、研发、设计、测试、数据、内容、运营、等资源，明确项目范围、里程碑、依赖、风险及验收标准；能在资源受限、目标变化时快速决策并保障交付。\n6.主导 AI 在用户研究、数据分析、PRD/原型、测试及运营工作流中的应用；建立效果评测、人机协作、成本、安全等机制，沉淀可复用能力。\n7. 拥有成人行业经验，若其他方面特别优秀，无成人行业经验可放宽限制 \n备注：\n1.请候选人投递简历时准备不少于1个经脱敏的代表案例，形式不限，可为PRD、HTML、原型、数据看板或编排好的工作流；至少包含1个内容/商业化项目或1个AI赋能项目。\n2.面试作业考察。候选人需在面试结束后，根据面试官提供的任务要求，在指定时间内完成并提交一个作业。\n\n二、任职要求\n1.6年以上互联网产品经验，具备复杂产品主导经验及可量化业绩，拥有从0→1及规模化迭代案例。\n2.具备视频、漫画、小说、短剧等内容产品经验，至少两个方向有实际项目经历，其中一个方向达到核心负责人深度。\n3.熟悉内容平台、创作者生态、社区运营、内容分发及粉丝商业化，能够平衡用户价值、内容供给与商业目标。\n4.具备项目管理视角、强执行力和主人翁意识，能够拆解模糊目标、协调多团队、处理冲突并对最终结果负责。\n5.具备良好的商业判断、数据分析、用户洞察和技术理解；有推荐系统、付费转化、广告体系等经验者优先。\n6.有 AI 协作经验 或 AI 工作流的真实落地成果，能够说明场景选择、方案边界、上线指标、投入成本及业务价值。", "cat": "产品与管理"}, {"id": "237", "title": "AI视频剪辑师（短剧/影视二创）", "salary": "12k-20k", "location": "", "jd": "岗位JD描述\n负责短剧、电影、网剧等影视素材的AI辅助二创、剧情重组及内容魔改，结合剪辑能力与AI工具产出具备传播力的短视频内容。\n\n一、岗位职责\n\n1. 完成影视素材筛选、剧情拆解、混剪、魔改及剧情重组；\n2. 提炼高潮、冲突、反转等关键内容，优化短视频节奏和叙事效果；\n3. 使用AI工具完成风格化、换脸、换装、场景替换、画质增强、补帧、字幕等处理；\n4. 根据运营需求及热点方向快速制作影视二创及不同平台适配版本；\n5. 独立完成选题、素材处理、AI制作、剪辑包装到最终成片；\n6. 沉淀素材库、模板、AI工作流及二创SOP，提高批量生产效率；\n7. 根据播放、完播、互动等数据持续优化内容。\n\n二、任职要求\n\n1. 有视频剪辑经验，有短剧二创、影视混剪、电影解说、剧情魔改经验优先；\n2. 熟练使用PR、AE、剪映等工具，具备良好的剪辑节奏、调色、字幕及特效能力；\n3. 有AI视频实操经验，熟悉AI图像、AI视频、FaceSwap、AI配音等相关工具；\n4. 理解影视叙事、镜头语言及短视频传播逻辑，具备内容审美和爆款意识；\n5. 执行力强、出片速度快，能够适应多任务并行；\n6. 有AI工作流、批量生产、模板或SOP搭建经验优先。", "cat": "内容与创作"}, {"id": "238", "title": "AI视频内容工程师（AI短剧/AIGC）", "salary": "15k-20k", "location": "", "jd": "岗位JD描述\n负责AI短剧、动态漫剧等内容从剧本、分镜、角色、场景到视频成片的全流程生产，并搭建可复制、可规模化的AI视频生产工作流。\n\n一、岗位职责\n\n1. 根据剧本完成剧情拆解、分镜、角色、场景及多镜头AI视频制作；\n2. 制作AI真人短剧、动态漫剧、漫改剧等内容；\n3. 通过提示词及AI模型控制角色表演、镜头效果和视觉风格；\n4. 使用LoRA、IPAdapter、ControlNet、FaceSwap等技术解决角色一致性问题；\n5. 基于ComfyUI搭建标准化AI视频生产工作流及角色库、场景库、提示词库；\n6. 结合扣子、Dify等工具优化重复流程，提升批量生产效率；\n7. 处理人物崩坏、角色漂移、画面闪烁等生成问题；\n8. 持续测试新模型、新节点及新工作流，并推动实际生产落地。\n\n二、任职要求\n\n1. 有AI视频、AI短剧、动态漫剧或AIGC内容实际制作经验；\n2. 熟悉AI图像、AI视频及ComfyUI工作流；\n3. 能够完成剧本到分镜的转化，理解景别、构图、运镜及人物情绪表达；\n4. 熟悉LoRA、IPAdapter、ControlNet、FaceSwap等角色一致性技术；\n5. 能够独立完成至少一种AI视频内容从剧本到成片的完整流程；\n6. 具备基础视频剪辑及AI生成内容修复能力；\n7. 学习能力强，能够快速测试并落地新的AI视频模型。\n\n加分项\n有AI剧集批量生产、LoRA训练、ComfyUI工作流搭建、Python/API、模型部署或自动化生产经验优先。", "cat": "内容与创作"}, {"id": "239", "title": "AI视频剪辑师", "salary": "15-25K", "location": "", "jd": "岗位职责\n\n1. 负责品牌日常短视频、活动节点、专题宣传物料的 AI辅助剪辑、包装、调色、字幕及多版本导出；\n2. 独立承接 漫改二创、动漫混剪、剧情重组、氛围感卡点类视频 的全流程制作，并结合 AI 工具提升效率与表现力；\n3. 配合运营理解脚本意图，自主优化镜头节奏、转场、字幕、配乐及视觉包装，提升成片质感和完播体验；\n4. 结合 AI 工具完成 素材扩展、局部补帧、动态处理、封面优化、文案/字幕辅助生成 等工作；\n5. 统一品牌矩阵视频的视觉风格、配色、包装与模板规范，保持系列内容高级质感和一致性；\n6. 搭建并维护素材库、模板库、封面规范及 AI 剪辑工作流，沉淀可复用 SOP，提升团队整体交付效率；\n7. 跟踪播放、点击、互动等数据，持续优化剪辑节奏、封面风格和二创叙事逻辑；\n8. 适配业务紧急需求，快速产出热点专题、限时活动、深夜专区等高质感 AI 视频内容。\n\n二、任职要求\n\n1. 3年以上视频剪辑/后期相关经验，有短视频、二创、漫改、娱乐内容方向经验优先；\n2. 熟练使用 PR、AE、剪映 等剪辑工具，具备较强的节奏把控、调色、动态字幕、视觉包装和特效合成能力；\n3. 具备 AI 视频相关实操经验，能够使用 AI 工具辅助完成 视频生成、素材处理、字幕配音、封面优化、剪辑提效；\n4. 熟悉漫改二创、动漫素材拆解、情绪卡点、剧情重组、同人改编等内容表达方式；\n5. 具备较强审美和镜头语言认知，能独立把控画面质感、内容氛围和平台适配效果；\n6. 可独立完成从素材整理、粗剪、精剪、包装、字幕、封面到多规格导出的完整流程；\n7. 执行力强、抗压性高，适应快节奏和多任务并行交付；\n8. 有 AI 剪辑工作流搭建、模板沉淀、批量内容生产经验者优先；\n9. 有品牌矩阵统一风格管理、二创赛道经验或沉淀过视频 SOP 规范者优先。", "cat": "内容与创作"}, {"id": "240", "title": "中高级AI短剧编剧", "salary": "15K–25K", "location": "", "jd": "岗位JD：\n一、岗位职责\n1、原创博主IP短剧开发\n基于公司现有博主形象、人设及内容资产，完成世界观、人物关系、核心冲突和故事主线设计，开发具有鲜明辨识度、可持续连载和商业化潜力的原创短剧。\n2、热点IP改编与二次创作\n持续研究热门小说、影视剧、短剧及社会热点，提炼其中具有传播潜力的题材、人物和情节，在版权及平台合规范围内进行本土化、短剧化和差异化改编。\n3、完整剧本创作\n独立完成故事提案、人物小传、分集大纲及逐集剧本，强化开场钩子、矛盾升级、情绪刺激、反转节点和结尾悬念，确保内容符合短剧观看节奏及AI制作条件。\n4、建立剧本选题与评审机制\n从用户需求、内容差异化、制作难度、传播潜力和商业价值等维度评估选题，建立立项、评审、修改和定稿标准，提高优质剧本的筛选效率和落地成功率。\n5、筹建剧本库及资产管理体系\n建立原创、改编、储备剧本的分类体系，实现剧本资产的统一管理和复用。\n6、梳理剧本生产SOP\n搭建“选题研究—创意提案—大纲评审—剧本创作—定稿交付—成片复盘—数据反馈”的工作流程，沉淀创作模板、审核标准和质量检查清单。\n7、推动剧本落地与持续迭代\n与AI制作、剪辑、运营及产品团队协作，根据制作可行性优化场景、人物和情节设计；结合播放、完播、互动及付费数据复盘内容表现，持续调整创作方向。\n\n二、任职要求\n1、具备5年以上短剧、网文、影视剧、互动内容或相关领域的策划与编剧经验，有成熟作品或商业化项目案例。\n2、具备原创开发和改编能力，能够从零搭建人物与故事体系，也能将长篇小说、影视内容或热点题材重构为快节奏短剧。\n3、熟悉华人男性用户的内容偏好，能够准确把握冲突、悬念、反转、爽点和情绪价值，并将其转化为可持续连载的剧情。\n4、具备较强的系列化创作能力，能够统筹人物成长、故事主线、单集钩子和阶段性高潮，避免剧情同质化或简单套用模板。\n5、了解AI视频生产的基本特点，能够兼顾人物一致性、场景复杂度、制作成本和镜头实现难度，确保剧本具有实际可制作性。\n6、具备剧本库、内容资产或创作流程建设经验，能够承担标准制定、质量审核和方法论沉淀，不局限于单纯完成写稿。\n7、具备良好的数据意识和跨团队协作能力，能够根据用户反馈及产品数据快速调整剧本，并推动内容顺利进入制作环节。", "cat": "内容与创作"}, {"id": "241", "title": "视频剪辑师", "salary": "10k-15k", "location": "", "jd": "岗位JD描述\n一、岗位职责\n1.负责品牌日常短视频、活动节点、专题宣传物料的剪辑、视觉包装、调色精修及多版本导出；\n2.承接AI素材加工、二创、同人混剪、人物剧情重组、氛围感卡点视频剪辑制作\n3.配合运营拆解脚本意图，优化镜头节奏、转场配乐、字幕版式，把控成片质感与完播体验；\n4.统一全品牌视频视觉配色、包装体系与风格规范，保持系列内容高级质感与统一性；\n5.搭建分类素材库、剪辑模板与封面规范，沉淀复用流程，提升团队交付效率与标准化；\n6.参考视频播放、点击率、互动数据，迭代剪辑节奏与封面风格；\n7.适配业务紧急需求，快速产出深夜专区、限时活动、热点专题等高质感宣传剪辑物料。\n\n二、任职要求\n1.3年以上专业视频剪辑经验，有娱乐社群、信息流、IP同人二创剪辑经验优先；\n2.精通PR/AE，熟练使用剪映，具备专业调色、动态包装、特效合成能力，可独立高质量完成剪辑出片；\n3.具备相关剪辑作品集，擅长镜头解构、剧情重组、情绪卡点，有较强节奏把控与数据意识；\n4.网感审美在线，熟悉平台内容调性、热门玩法，可基于现有素材完成IP二次改编剪辑；\n5.能够利用AI输出素材进行视频加工剪辑，拒绝简单粗暴素材拼接；\n6.沟通协作顺畅，可多任务并行，接受高频迭代、排期管理与节点加急产出；\n7.有素材库搭建、剪辑模板沉淀、内容SOP标准化经验者优先。", "cat": "内容与创作"}, {"id": "242", "title": "AI陪伴产品运营（AI女友方向）", "salary": "12K-18K", "location": "", "jd": "岗位JD描述\n一、岗位职责\n1.负责成人向AI女友陪伴产品的整体运营，参与产品定位、目标用户分析、运营策略制定及上线冷启动，推动产品从0到1落地；\n2.围绕用户情感陪伴和成人互动需求，规划AI女友角色矩阵，包括人设、关系定位、对话风格、故事背景、互动场景及内容更新节奏；\n3.设计用户从注册、首次对话、关系升级到付费转化的完整运营路径，优化新用户激活、互动频次、次日及长期留存；\n4.策划会员订阅、虚拟礼物、剧情解锁、角色权益、限时活动等商业化玩法，持续提升付费率、客单价及用户生命周期价值；\n5.结合用户对话反馈和行为数据，协同产品及AI团队优化角色Prompt、回复质量、长期记忆、情绪反馈和内容丰富度，改善陪伴真实感与沉浸体验；\n6.搭建产品核心数据指标及复盘机制，持续跟踪注册转化、首聊率、互动轮次、留存率、付费率、ARPPU等指标，通过用户分层和A/B测试推动运营迭代；\n7.建立用户反馈、核心用户维护、流失召回及投诉处理机制，识别高价值用户需求，沉淀可复用的用户运营策略；\n8.负责竞品研究及行业趋势跟踪，持续分析AI陪伴、虚拟恋人、成人社交等产品的内容形态、商业模式及运营玩法；\n\n二、任职要求\n1.3年以上互联网产品运营、用户运营或内容运营经验，有AI陪伴、虚拟社交、聊天交友、互动娱乐、游戏或付费内容产品经验者优先；\n2.了解AI大模型及对话类产品的基本逻辑，能够参与角色Prompt、人设规则、对话效果及互动流程的配置、测试和优化；\n3.具备较强的用户洞察和内容策划能力，能够理解男性用户在情感陪伴、虚拟关系及成人互动场景中的核心需求；\n4.具备完整的用户增长和商业化思维，熟悉“拉新—激活—留存—付费—召回”运营链路，能够独立设计付费转化方案；\n5.数据敏感度较高，能够独立搭建指标体系、分析转化漏斗，并根据数据和用户反馈提出明确的优化方案；\n6.具备较强的文案及角色内容策划能力，能够独立完成人设、对话场景、关系成长线和活动方案设计；\n7.具备从0到1推进新产品或新项目的经验，目标意识强，能够主动拆解任务并推动跨部门协作落地；\n8.关注AI应用及成人内容行业发展，对新产品、新玩法和用户趋势保持敏感，能够接受成人向业务形态；", "cat": "运营与市场"}, {"id": "243", "title": "中高级运营专员", "salary": "15–20k", "location": "", "jd": "一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责创作者运营管理，推动创作者引入、分层、激励、活跃维护及产出提升，保障内容持续供给；\n5. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n6. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n7. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进；\n8. 根据业务发展需要，参与活动运营、专题策划、转化路径优化及其他与产品增长相关的专项工作。\n\n二、任职要求\n1. 3年以上互联网运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立负责从目标制定、策略拆解、执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有0-1项目搭建经验、复杂业务增长经验、多平台运营经验者优先；\n8. 有团队管理或带教经验者优先；\n9. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "运营与市场"}, {"id": "244", "title": "中高级运营专员（偏社区产品方向）", "salary": "12-16k", "location": "", "jd": "岗位JD描述\n岗位职责：\n1、参与社区产品的运营规划和迭代优化，并全盘负责产品日常维护。\n2、每日/每周监控内容发布后的核心数据。\n3、运用AI工具制作和统计基础的数据报表，能够发现数据异常。\n4、对热点敏感，知道平台用户喜欢看什么。\n5、配合其他岗位，完成活动任务或其他即时性任务。\n\n任职要求：\n1. 至少2年以上社区类、视频web类产品运营经验。\n2. 熟练使用AI工具及常用办公软件。\n3. 不抗拒看数据，能从枯燥的数据中发现问题。\n4. 需要具备良好的执行力、观察力，以及一定的抗压能力。", "cat": "运营与市场"}, {"id": "245", "title": "中高级运营专员（海外新媒体运营）", "salary": "13K-18K", "location": "", "jd": "岗位JD描述                                                                                                                                                                                                                                一、岗位职责：  \n  1. 负责公司视频App在海外主流社交平台（Twitter/X、TikTok、Instagram、YouTube、Facebook等）的账号运营与内容策划，实现用户引流与品牌曝光；\n  2. 根据各平台算法机制、内容调性及用户画像，制定差异化运营策略与内容分发方案；                                         \n  3. 策划并执行日常内容排期，包括图文、短视频、话题互动、社群运营等多种形式，持续提升账号活跃度与粉丝增长；\n  4. 紧跟海外社交平台热点趋势，快速策划借势内容，提升内容传播力与互动率；                                               \n  5. 搭建并维护各平台数据监控体系，定期输出运营数据报告（曝光、互动、导流转化等），基于数据持续优化运营策略；           \n  6. 对接内部内容创作、设计、产品团队，协调资源推动项目落地，确保内容产出质量与效率；                                                 \n   \n二、任职要求：                                                                                                        \n  1. 本科及以上学历，市场营销、新闻传播、新媒体、数字营销等相关专业优先，三年以上新媒体运营经验；                       \n  2. 熟悉Twitter/X、TikTok、Instagram、YouTube、Facebook等海外主流平台的运营规则、推荐算法及内容生态；\n  3. 有明确的导流/拉新成功案例，具备从内容到转化的全链路思维；                                                          \n  4. 具备较强的内容策划与文案撰写能力，对短视频及社交媒体内容有敏锐的网感；\n  5. 熟练使用数据分析工具，具备数据驱动运营的意识与能力；                                                               \n  6. 具备良好的跨团队沟通与项目推进能力，能独立负责多平台并行运营；                                                     \n  7.  简历请附过往运营案例或数据成果。", "cat": "运营与市场"}, {"id": "246", "title": "兼职AI短剧编剧", "salary": "一、计价口径\n以每部15集、单集2—3分钟为标准，交付内容包括故事提案、人物设定、分集大纲及完整分集剧本。\n二、价格标准\n付费试稿：400元/次\n交付3集分集大纲及1集完整剧本，按要求完成即可结算。\n1、IP改编／魔改项目：200元/集\n15集项目合计3000元。\n2、原创IP项目：400元/集\n15集项目合计6000元。\n特殊题材、紧急项目或质量要求较高的项目，可在基础价格上上浮10%—20%。\n三、结算方式\n结算：大纲通过后支付30%，完成一半剧集支付40%，全部验收后支付剩余30%。\n项目费用包含两轮合理修改；确认创作方向后因需求变化产生的大幅重写，费用另行协商。", "location": "", "jd": "一、主要工作内容\n1. 原创IP短剧开发\n 基于现有博主形象、人设及内容资产，完成人物关系、核心冲突、故事主线及系列剧情设计，开发适合持续连载和商业化的原创短剧。\n2. 热点题材改编与二次创作\n   研究热门小说、影视剧、短剧及社会热点，提炼具有传播潜力的题材和情节，在版权及平台合规范围内进行本土化、短剧化和差异化改编。\n3. 完整剧本交付\n   根据项目要求完成故事提案、人物小传、分集大纲及逐集剧本，重点强化开场钩子、矛盾升级、情绪刺激、剧情反转、付费卡点及结尾悬念。\n4. 男性向及成人向内容设计\n   熟悉华人男性用户的内容偏好，能够将爽点、情感关系及成人元素自然融入剧情，避免情节割裂、简单堆砌或低俗化表达。\n5. 配合剧本修改与项目落地\n   根据内部评审、AI制作可行性及成片数据反馈完成合理修改，与AI制作、剪辑和运营人员协作，推动剧本顺利进入制作环节。\n\n二、任职要求\n1. 必须为编剧科班出身，编剧、戏剧影视文学、电影学、广播电视编导等影视创作相关专业毕业，并接受过系统的剧本创作训练。\n2. 具备短剧、影视剧、网文的创作经验，有成熟作品、上线项目或商业化案例者优先。\n3. 具备原创开发及IP改编能力，能够独立完成从选题策划、人物设定、故事主线、分集大纲到逐集剧本的完整创作。\n4. 熟悉男性向短剧的冲突、悬念、反转、爽点及付费卡点设计，了解成人向内容创作逻辑者优先。\n5. 了解AI视频制作的基本特点，能够合理控制人物数量、场景切换、动作设计及镜头复杂度，保证剧本具备实际制作可行性。\n6. 具备稳定的兼职时间和交付能力，能够按照项目排期完成创作及修改，并及时响应项目沟通。\n7. 能够接受成人向内容题材，并严格遵守相关法律法规、版权规范、平台规则及项目保密要求。\n\n三、合作与结算方式\n1. 采用远程兼职、按项目合作的方式，不要求坐班。\n2. 首次合作需完成付费试稿，通过评审后进入正式项目。\n3. 正式合作可按集或按项目结算，具体单价根据个人经验、作品质量、项目难度及交付效率综合确定。\n4. 希望每月能够稳定承接至少1个短剧项目，交付质量优秀者可持续合作，并根据合作表现提高项目单价。\n\n四、应聘需提供\n1. 个人简历及编剧学习、从业经历介绍；\n2. 编剧相关专业、毕业院校及学历信息；\n3. 1—3份代表作品、剧本节选或上线作品链接，并注明本人负责的具体部分；\n4. 擅长的题材及内容类型；\n5. 每周可投入时间及预计月度产能；\n6. 按集或按项目的期望报价。", "cat": "内容与创作"}, {"id": "247", "title": "AI视频内容工程师", "salary": "15k-20k", "location": "", "jd": "\"岗位JD描述\n负责AI短剧、动态漫剧等内容从剧本、分镜、角色、场景到视频成片的全流程生产，并搭建可复制、可规模化的AI视频生产工作流。\n一、岗位职责\n1. 根据剧本完成剧情拆解、分镜、角色、场景及多镜头AI视频制作；\n2. 制作AI真人短剧、动态漫剧、漫改剧等内容；\n3. 通过提示词及AI模型控制角色表演、镜头效果和视觉风格；\n4. 使用LoRA、IPAdapter、ControlNet、FaceSwap等技术解决角色一致性问题；\n5. 基于ComfyUI搭建标准化AI视频生产工作流及角色库、场景库、提示词库；\n6. 结合扣子、Dify等工具优化重复流程，提升批量生产效率；\n7. 处理人物崩坏、角色漂移、画面闪烁等生成问题；\n8. 持续测试新模型、新节点及新工作流，并推动实际生产落地。\n二、任职要求\n1. 有AI视频、AI短剧、动态漫剧或AIGC内容实际制作经验；\n2. 熟悉AI图像、AI视频及ComfyUI工作流；\n3. 能够完成剧本到分镜的转化，理解景别、构图、运镜及人物情绪表达；\n4. 熟悉LoRA、IPAdapter、ControlNet、FaceSwap等角色一致性技术；\n5. 能够独立完成至少一种AI视频内容从剧本到成片的完整流程；\n6. 具备基础视频剪辑及AI生成内容修复能力；\n7. 学习能力强，能够快速测试并落地新的AI视频模型。\n加分项\n有AI剧集批量生产、LoRA训练、ComfyUI工作流搭建、Python/API、模型部署或自动化生产经验优先。\"", "cat": "内容与创作"}, {"id": "248", "title": "创作者运营", "salary": "12k-18k", "location": "", "jd": "简历筛选要点：\n1. 有影视类从业经验优先\n2. 具备有实际拍摄/导演/剧本策划经验和能力\n3. 有过往案例可查阅\n\n岗位JD描述\n一、岗位职责：\n1. 对已入驻的创作者，完成“冷启动”引导；\n2. 建立A/B/C多级创作者画像，制定差异化的扶持政策和激励方案；\n3. 引导创作者生产符合自身定位和平台调性的高质内容，有实际拍摄和剧本策划经验和能力；\n4. 解答创作者日常疑问，协助调查创作者违规情况，建立平台忠诚度；\n5. 收集创作者对创作工具、运营措施的需求，推动创作者生态搭建。\n\n二、任职要求：\n1. 3年以上影视类创作者运营&孵化经验，有MCN机构经历者优先；\n2. 极强的沟通协调能力，对创作者进行日常维护；\n3. 适应高强度节奏，能接受“管家式”服务属性。", "cat": "内容与创作"}, {"id": "249", "title": "高级内容运营", "salary": "20k-35k", "location": "", "jd": "【任职要求】（优先考虑境外办公人才，但需要是中国籍）\n\n本科及以上学历，专业不限。\n2年以上付费内容平台/泛娱乐类APP内容运营经验，有大流量内容产品经验者优先。\n需有完整的内容运营项目经历，主导过至少1个产品内容体系从搭建到稳定运营全流程。\n\n专业技能：深度理解内容生态与用户消费心理，具备独立制定内容策略、内容选品标准及审核机制的能力。\n熟悉内容生命周期管理，能主导内容分区规划、标签体系建设与内容质量持续优化。\n具备数据驱动内容决策的能力，能通过点击率、完播率、转化率等内容指标洞察用户偏好并调整策略。\n有二创内容、封面素材、推广物料的策划与审核经验，具备基本的内容审美与平台调性把控力。\n熟悉产品迭代流程，能从内容视角提出功能需求，跟进上线验收。\n熟练使用Excel/Google Sheets等数据工具；有BI看板或内容管理系统使用经验者优先。\n\n软性技能：对内容有热情，能快速理解不同产品的用户圈层与内容偏好。\n逻辑清晰，结果导向，能独立推动内容项目从策划到落地完整闭环。\n强责任心与自驱力，在多产品并行环境下能有效管理内容优先级。\n\n优先条件：有内容冷启动或内容体系从0到1搭建经验者优先；有AI工具辅助内容生产/审核经验者优先；有用户UGC/PGC内容运营成功案例者优先。\n\n───\n\n【岗位职责】\n\n主导所辖产品内容体系建设，负责内容分区规划、标签体系设计与内容选品标准制定，持续提升内容与用户需求的匹配度。\n深度把控内容质量，制定内容审核标准与上架规则，定期进行内容走查，校准产品调性，保障内容生态健康稳定。\n推动二创内容、封面素材、推广物料的持续产出与迭代，联动设计、技术资源，提升内容吸引力与点击转化。\n通过内容数据（点击率、完播率、付费转化等）深度洞察用户行为，定期输出内容分析报告，驱动内容选品与运营策略持续优化。\n策划并执行大促节点内容活动（节日专题、预购联动等），从内容角度放大活动声量，完成活动物料审核与数据复盘。\n构建并维护各产品内容需求池，推动内容相关产品功能的迭代优化，参与需求评审并完成上线前内容走查验收。\n跟踪用户付费行为与内容消费路径，参与用户分层运营，针对高价值用户设计差异化内容触达策略。\n持续关注行业内容趋势，引入优质内容资源与创新玩法，为产品内容竞争力提供持续输入。", "cat": "内容与创作"}, {"id": "250", "title": "高级产品经理", "salary": "20k-30k", "location": "软性技能：优秀的线上沟通与协作能力，完全适应全远程工作模式。", "jd": "【任职要求】（优先考虑境外办公人才，但需要是中国籍） \n本科及以上学历，985/211优先，专业不限。\n5年以上互联网C端产品经验，至少3年大流量to C产品经验（日活百万级以上优先）\n需要有一线产品正规行业完整的项目经历（在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等大厂有完整项目经历者优先），不要近几年有bc行业经验的\n专业技能：完整主导过至少1-2个现象级功能或从0到1项目，有显著数据提升案例。\n深刻理解内容生态、推荐算法、社区玩法、会员/付费体系、商业化变现等C端核心逻辑。\n熟练使用Axure、Figma等原型工具，精通Tableau、PowerBI、Excel等数据分析工具，能独立完成PRD撰写与数据埋点方案。\n熟练主导A/B测试、用户调研、增长实验，具备从数据洞察到策略落地的闭环能力。\n优秀的项目管理、需求优先级判断与跨部门推动能力。\n软性技能：优秀的线上沟通与协作能力，完全适应全远程工作模式。\n极强的逻辑思维、用户同理心与结果导向，能在不确定性中快速决策。\n抗压能力强，拥有强烈的责任心与自驱力。\n远程工作要求：稳定高速网络与独立安静的办公环境，能适应跨时区会议。\n熟练使用Lark（飞书）、Zoom等主流远程协作工具。\n优先条件:拥有日活百万级以上优先；在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等大厂有完整项目经历者优先；具备团队管理或指导经验。\n\n岗位职责:\n负责公司产品规划、需求挖掘、功能设计与全生命周期管理。\n深度洞察用户需求与行业趋势，结合数据分析与用户调研，主导从0到1或从1到100的核心功能迭代，覆盖内容推荐、会员体系、互动社区、商业化等模块。\n制定清晰的产品目标与核心指标（DAU、留存、时长、付费率、ARPU、GMV等），通过策略设计与快速试验持续推动指标增长。\n协调产品、设计、研发、运营、商务等团队资源，推动产品高效上线并实现预期目标。\n参与公司级产品战略制定，具备跨业务线资源整合与推动能力。", "cat": "产品与管理"}, {"id": "251", "title": "高级产品经理（增长方向）", "salary": "20k-30k", "location": "", "jd": "【岗位职责】\n\n1. 负责免费视频 App 整体运营策略制定与落地**\n（1）围绕用户增长、活跃、留存、转化及商业化目标，制定以**产品功能驱动**的阶段性运营规划并推动执行。\n（2）负责平台级内容运营、用户运营、活动运营、渠道运营等综合运营工作的**产品化落地**，通过机制与工具提升产品整体用户规模和活跃度。\n（3）对 DAU、MAU、次日留存、7日留存、30日留存、人均观看时长、播放转化率等核心指标负责。\n\n2. 负责全平台获客链路与获客矩阵建设\n（1）搭建免费视频 App 的用户获客链路及获客矩阵，主导 **Deeplink（深度链接）**、**智能邀请码**及**分享回流**等获客产品机制的设计，拓展站内外获客渠道。\n（2）制定渠道投放、自然增长、裂变增长、用户召回等多维度获客策略，将增长方法论固化为**后台可配置的自动化工具**，持续优化用户获取成本与转化效率。\n（3）基于 AARRR 用户增长模型，系统推进拉新、激活、留存、转化、复购/召回等运营策略的产品化落地。\n\n3. 负责数据分析与增长模型优化**\n（1）精通流量运营全链路，负责搭建增长数据看板与预警体系**，通过漏斗分析、留存分析、转化分析，敏锐定位业务问题并提出优化方案。\n（2）主导 A/B 测试需求，从文案、交互路径到算法策略分层，以数据结论驱动产品迭代。\n（3）对 DAU/MAU、留存率、ROI、LTV、ARPU、播放完成率、点击率、转化率等关键指标有极强敏感度和责任心。\n（4）通过数据看板、埋点分析、A/B 测试等方式，持续监控拉新、留存、活跃、转化等关键指标，及时发现问题并推动产品、内容、渠道策略优化。\n\n4. 负责产品优化与迭代规划**\n（1）深入分析用户使用路径和内容消费行为（如播放完成率、退出节点），识别产品在首页推荐、频道页、播放页、搜索、收藏、追更、推送、互动等环节的优化机会。\n（2）基于用户反馈、数据表现和业务目标，输出产品优化建议，推动产品需求立项、设计、研发、上线和复盘。\n（3）参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设，抽象通用组件与模块，提升运营效率。\n（4）负责阶段性产品迭代规划，推动产品体验、内容分发效率和用户留存能力持续提升。\n\n5. 负责用户矩阵与社群矩阵运营**\n（1）负责社媒矩阵及社群矩阵的整体产品化布局，包括账号体系规划、内容策略制定、渠道联动、用户分层及转化路径设计，打通公域引流与私域沉淀的产品闭环。\n（2）设计精准的**沉睡用户唤醒机制**与**流失预警模型**，通过 Push、短信及邮件等触达通道的产品化配置，提升用户粘性和回访频次。\n（3）建设**用户标签系统（CDP）**与**分层运营中台**，针对新用户、活跃用户、沉默用户、流失用户制定差异化产品策略。\n\n6. 负责活动运营与内容运营\n（1）抽象通用活动组件（如签到、抽奖、集卡、限时任务），搭建**低门槛活动配置后台，赋能运营团队快速上线节日活动、专题活动、召回活动、用户激励活动等重点项目。\n（2）结合热点、内容资源、用户兴趣和平台目标，通过活动玩法创新与推荐策略优化，提升活动参与率、内容曝光效率、用户活跃和留存表现。\n（3）负责活动方案设计、资源协调、上线执行、数据跟踪和复盘优化，建立标准化的活动复盘数据看板。\n\n7. 负责跨部门协作与项目推进\n（1）协同产品、研发、设计、算法、内容、渠道等团队推进重点项目及运营需求落地。\n（2）建立高效协同机制，保障项目按照运营目标和业务节奏推进。\n（3）关注行业趋势、竞品动态（含海外竞品）及新型增长方式，持续沉淀运营方法论，支持业务长期增长。\n\n\n【任职要求】\n\n1、本科及以上学历，3 年以上互联网产品运营、用户运营、增长运营、内容运营或平台运营经验。\n\n2、有视频、短视频、内容平台、社区、工具类 App、泛娱乐平台运营经验者优先，有从 0 到 1 搭建增长中台或运营后台者优先。\n\n3、熟悉 AARRR 用户增长模型，理解拉新、激活、留存、转化、召回的完整运营逻辑，并能将其转化为产品解决方案。\n\n4、具备极强数据分析能力，能够通过数据发现问题、拆解问题并推动解决。精通 Excel、数据看板、BI 工具，有 SQL、埋点分析、A/B 测试经验者优先。\n\n5、熟悉 DAU、MAU、留存率、LTV、ARPU、ROI、转化率、播放完成率等核心指标，并能围绕指标制定运营策略。\n\n6、具备产品思维，能够基于用户路径和数据结果提出产品优化及迭代建议，有参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设经验者优先。\n\n7、具备较强项目管理能力，能独立完成策略制定、项目推进、跨部门协作和结果复盘。\n\n8、目标感强，结果导向，对 DAU、留存、活跃、转化等核心指标有高度责任感与担当。\n\n\n 【加分项】\n\n1、有海外 Google Play / App Store 应用商店运营优化（ASO）经验。\n\n2、熟悉海外社交平台（如 TikTok、Instagram、YouTube）的引流产品机制。\n\n3、有自动化营销工具（MA）或用户分群工具（如 GrowingIO / 神策）的实际使用经验。", "cat": "产品与管理"}, {"id": "252", "title": "中高级UI设计师", "salary": "10k-30k", "location": "", "jd": "【岗位职责】 （优先考虑境外办公人才，但需要是中国籍）不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n\n负责公司相关产品（Web/H5/App等）的整体UI界面设计，熟练使用Figma等设计工具，主导产品视觉风格和规范的制定。\n根据产品调性，完成icon、logo、水印、启动页、落地页等产品上线前所需物料，包括但不限于静态图、动态图、MG动画；根据运营需求设计活动banner、弹窗等，覆盖节日活动、补间活动、社区日常推荐活动等场景。\n具备二次元视觉风格设计能力，能够产出符合二次元审美的界面、角色、插画及运营物料，理解二次元用户圈层喜好与视觉偏好。\n利用Make、Stitch等AIGC工具完成从构想到Figma成品交付，了解各类大模型用途及ComfyUI工作流搭建与节点使用。\n\n【任职要求】\n\n本科及以上学历，美术、视觉传达、计算机学等相关专业优先；\n5年以上UI设计及平面设计经验（两者均需具备）；\n专业技能：Figma、Photoshop、Illustrator、Adobe Effects、ComfyUI、Claude；\n有二次元风格设计作品集，优先考虑有动漫、游戏、虚拟IP等相关项目经验；\n优先考虑境外办公人才（中国籍）；\n近期有博彩、棋牌、区块链相关背景者不予考虑。\n\n【加分项】\n\n会使用Claude与Figma进行交互，可反推Frame文件生成；会用Make进行低保真生成，会用Stitch进行概念设计；\n会使用Blender、C4D等三维软件；\n有前端经验，会Python；\n深度理解ComfyUI各节点含义，能自写节点并搭建复杂工作流；\n有二次元IP设计、虚拟形象设计或Live2D相关经验者优先。", "cat": "内容与创作"}, {"id": "253", "title": "中高级运营专员", "salary": "10K-35K", "location": "", "jd": "岗位JD描述：岗位职责  不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n岗位定位：中级运营专员是业务增长的核心执行者与推动者，能够独立负责产品或业务模块运营工作，通过数据分析、活动运营、用户运营及产品优化，推动新增、留存、活跃、转化等核心指标持续提升，主动发现业务问题、提出解决方案并推动落地，对产品经营结果负责，以及跨部门沟通保障项目高效推进。\n岗位职责\n\n用户运营与社区运营\n负责用户分层及生命周期运营；\n推动社区内容建设与用户互动氛围打造；\n收集用户反馈并推动问题解决；\n提升用户留存、活跃及复购能力。\n\n独立策划并执行活动方案\n推动会员体系、充值活动、节日活动等运营项目；\n优化用户转化路径，提高付费转化率；\n对活动效果进行分析与复盘。\n\n数据分析与业务诊断\n监控新增、留存、充值、活跃等核心数据；\n输出专项分析报告；\n分析业务异常并提出解决方案；\n跟踪优化结果并持续复盘\n\n产品运营管理\n负责产品日常运营及数据监控；\n跟进产品版本迭代、功能测试及上线验收；\n定期开展产品走查，发现问题并提出优化建议；\n推动产品需求、活动需求及优化方案落地。\n\n任职要求\n2-3年以上互联网运营经验；\n具备产品运营、用户运营、活动运营相关经验；\n熟悉互联网产品运营逻辑及增长模型；\n能适应快节奏业务环境，具备较强执行力与责任心。\n熟悉产品运营全流程；\n能独立完成新增、留存、活跃、转化等数据分析，能根据数据发现问题并制定优化方案；\n能独立策划、执行及复盘运营活动； 熟悉会员体系、充值活动、节日活动等运营模式；\n了解用户生命周期管理；能进行用户分层运营；具备社区运营、内容运营经验优先；能通过运营手段提升留存与活跃。", "cat": "运营与市场"}, {"id": "254", "title": "中高级运营专员（综合类方向）", "salary": "10K-35K", "location": "", "jd": "岗位职责  （优先考虑境外办公人才，但需要是中国籍）如果简历中没有提到过留存，次留，用户增长，日活这样的关键词，不考虑\n1、负责免费视频 App 整体运营策略制定与落地\n（1）围绕用户增长、活跃、留存、转化及商业化目标，制定阶段性运营规划并推动执行。\n（2）负责平台级内容运营、用户运营、活动运营、渠道运营等综合运营工作，提升产品整体用户规模和活跃度。\n（3）对 DAU、MAU、次日留存、7日留存、30日留存、人均观看时长、播放转化率等核心指标负责。\n2、负责全平台获客链路与获客矩阵建设\n（1）搭建免费视频 App 的用户获客链路及获客矩阵，拓展站内外获客渠道。\n（2）制定渠道投放、自然增长、裂变增长、用户召回等多维度获客策略，持续优化用户获取成本与转化效率。\n（3）基于 AARRR 用户增长模型，系统推进拉新、激活、留存、转化、复购 / 召回等运营策略落地。\n3、负责数据分析与增长模型优化\n（1）精通流量运营全链路，能够围绕用户增长模型、漏斗分析、留存分析、转化分析，发现业务问题并提出优化方案。\n（2）具备项目管理能力，能制定阶段性运营目标、拆解 KPI，并推动执行落地。\n（3）对 DAU / MAU、留存率、ROI、LTV、ARPU、播放完成率、点击率、转化率等关键指标有较强敏感度和责任心。\n（4）通过数据看板、埋点分析、A/B 测试等方式，持续监控拉新、留存、活跃、转化等关键指标，及时发现问题并推动产品、内容、渠道策略优化。\n4、负责产品优化与迭代规划\n（1）深入分析用户使用路径和内容消费行为，识别产品在首页推荐、频道页、播放页、搜索、收藏、追更、推送、互动等环节的优化机会。\n（2）基于用户反馈、数据表现和业务目标，输出产品优化建议，推动产品需求立项、设计、研发、上线和复盘。\n（3）参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设，提升运营效率。\n（4）负责阶段性产品迭代规划，推动产品体验、内容分发效率和用户留存能力持续提升。\n5、负责用户矩阵与社群矩阵运营\n（1）负责社媒矩阵及社群矩阵的整体布局与运营，包括账号体系规划、内容策略制定、渠道联动、用户分层及转化路径设计。\n（2）制定用户召回、活跃提升、会员 / 重点用户维护等策略，提升用户粘性和回访频次。\n（3）建立用户分层运营体系，针对新用户、活跃用户、沉默用户、流失用户制定差异化运营策略。\n6、负责活动运营与内容运营\n（1）策划并推动节日活动、专题活动、召回活动、用户激励活动等重点项目落地。\n（2）结合热点、内容资源、用户兴趣和平台目标，提升活动参与率、内容曝光效率、用户活跃和留存表现。\n（3）负责活动方案设计、资源协调、上线执行、数据跟踪和复盘优化。\n7、负责跨部门协作与项目推进\n（1）协同产品、研发、设计、算法、内容、渠道等团队推进重点项目及运营需求落地。\n（2）建立高效协同机制，保障项目按照运营目标和业务节奏推进。\n（3）关注行业趋势、竞品动态及新型增长方式，持续沉淀运营方法论，支持业务长期增长。\n任职要求\n1、本科及以上学历，3 年以上互联网产品运营、用户运营、增长运营、内容运营或平台运营经验。\n2、有视频、短视频、内容平台、社区、工具类 App、泛娱乐平台运营经验者优先。\n3、熟悉 AARRR 用户增长模型，理解拉新、激活、留存、转化、召回的完整运营逻辑。\n4、具备较强数据分析能力，能够通过数据发现问题、拆解问题并推动解决。\n5、熟悉 DAU、MAU、留存率、LTV、ARPU、ROI、转化率、播放完成率等核心指标，并能围绕指标制定运营策略。\n6、熟练使用 Excel、数据看板、BI 工具，有 SQL、埋点分析、A/B 测试经验者优先。\n7、具备产品思维，能够基于用户路径和数据结果提出产品优化及迭代建议。\n8、具备较强项目管理能力，能独立完成策略制定、项目推进、跨部门协作和结果复盘。\n9、目标感强，结果导向，对 DAU、留存、活跃、转化等核心指标有责任心。", "cat": "运营与市场"}, {"id": "255", "title": "中高级运营专员（二次元方向）", "salary": "10K-35K", "location": "", "jd": "岗位职责（优先考虑境外办公人才，但需要是中国籍）\n1、负责免费视频 App 二次元垂类运营策略制定与落地\n（1）负责动漫、番剧、国创、漫画改编、游戏改编、虚拟偶像、ACG 社区文化等二次元内容方向的运营规划。\n（2）围绕二次元用户增长、活跃、留存、内容消费和互动目标，制定阶段性运营方案并推动执行。\n（3）对二次元频道 DAU、垂类用户留存、追番转化率、播放完成率、互动率、人均观看时长等指标负责。\n2、负责二次元用户增长与获客矩阵建设\n（1）搭建二次元用户获客链路及获客矩阵，拓展站内推荐、社媒平台、社群、内容 IP、话题热点等多类获客渠道。\n（2）基于 AARRR 模型制定二次元用户拉新、激活、留存、召回和转化策略。\n（3）结合新番上线、热门 IP、角色话题、声优热点、漫展节点、游戏联动等机会，提升用户新增和回访。\n3、负责二次元用户数据分析与留存优化\n（1）建立二次元垂类运营数据分析体系，持续监控 DAU、MAU、次日留存、7日留存、30日留存、追番率、播放完成率、互动率等核心指标。\n（2）通过漏斗分析、留存分析、用户分层分析、内容消费分析，识别用户流失节点和增长机会。\n（3）针对新用户、追番用户、活跃用户、沉默用户、流失用户制定差异化运营策略。\n（4）对关键指标变化保持敏感，能够快速定位问题并推动内容、产品、推荐、渠道等环节优化。\n4、负责二次元产品优化与迭代规划\n（1）结合二次元用户需求，推动追番提醒、番剧日历、角色标签、兴趣订阅、弹幕互动、评论氛围、榜单机制、内容推荐等功能优化。\n（2）基于用户行为数据、社群反馈和竞品分析，输出二次元频道产品优化建议。\n（3）参与产品需求讨论、功能验收、上线数据跟踪和复盘，推动频道体验和用户留存持续提升。\n（4）协同产品、算法、内容、设计、研发团队，提升二次元内容分发效率和用户互动体验。\n5、负责二次元社媒矩阵与社群矩阵运营\n（1）负责二次元社媒账号及社群矩阵布局，包括账号定位、内容策略、话题运营、用户沉淀和转化路径设计。\n（2）熟悉 B 站、小红书、微博、抖音、贴吧、TapTap、NGA、QQ群 / 微信群等二次元用户活跃平台。\n（3）通过社媒内容、话题互动、社群活动、用户共创等方式提升二次元用户活跃和留存。\n6、负责二次元活动运营与 IP 运营\n（1）策划新番季、暑期档、周年庆、角色生日、追番挑战、投票打榜、弹幕互动、IP 联动等活动。\n（2）结合热门番剧、国创、游戏、漫展、声优、角色、CP 等内容热点，提升频道活跃度和用户粘性。\n（3）负责活动从方案设计、资源协调、上线执行到数据复盘的完整闭环。\n7、负责行业趋势与竞品研究\n（1）关注二次元行业趋势、竞品动态、新番周期、社区热点及新型增长方式。\n（2）持续沉淀二次元用户运营、内容运营和社群增长方法论，支持业务长期增长。\n任职要求\n1、本科及以上学历，3 年以上互联网运营经验，有视频平台、动漫平台、社区、游戏、泛娱乐、内容平台经验优先。\n2、深度了解二次元文化，熟悉番剧、国创、漫画、虚拟偶像、游戏改编、ACG 社区等内容生态。\n3、熟悉二次元用户行为，理解追番、补番、弹幕、评论、角色互动、IP 情感连接等用户需求。\n4、熟悉 AARRR 增长模型，能够围绕拉新、激活、留存、转化、召回设计运营策略。\n5、具备较强数据分析能力，能够对 DAU、留存、追番率、播放完成率、互动率、转化率等指标负责。\n6、具备漏斗分析、留存分析、用户分层、内容消费分析能力，能够通过数据定位问题并推动优化。\n7、具备产品优化意识，能够从二次元用户体验出发，提出频道、功能、互动机制和推荐策略优化建议。\n8、熟悉社媒矩阵、社群矩阵运营，有二次元社群、账号、活动或 IP 运营经验者优先。\n9、具备较强项目管理能力，能独立完成方案制定、跨部门协作、上线执行和数据复盘。\n10、网感好，对热点敏感，目标感强，能承担 DAU、留存、活跃、转化等核心指标压力。", "cat": "运营与市场"}, {"id": "256", "title": "中高级内容运营专员", "salary": "10K-35K", "location": "", "jd": "岗位定位，（优先考虑境外办公人才，但需要是中国籍））负责成人内容业务方向的内容数据增长与SEO优化，围绕成人视频、图片、文章等内容的自然流量增长、内容质量提升和站点表现，推动从内容策划、生产到页面优化、流量转化的全链路工作\n\n岗位职责\n• 根据业务目标，负责成人内容方向的内容增长规划、SEO优化执行及结果跟踪，聚焦高转化成人关键词的流量获取\n• 负责成人关键词处理（长尾高搜词）、内容规划（标题/标签/描述）、页面SEO优化及站内调整，持续提升收录率、关键词覆盖率和自然搜索流量\n• 定期跟踪核心数据（收录量、关键词排名、自然流量、跳出率、停留时长、转化表现），发现问题并快速推动优化迭代\n• 熟练结合AI工具完成成人关键词挖掘、内容生成/改写、标题与Meta优化、批量图片/视频描述提效等工作\n• 与内容制作、技术开发、推广团队协同，推动成人内容优化策略高效落地，确保站点在搜索引擎中的曝光与竞争力\n• \n任职要求\n• 大专及以上学历，3以上年内容运营/成人内容型站点相关经验\n• 熟悉Google等搜索引擎机制，掌握成人行业关键词研究、内容SEO优化、自然流量增长的核心逻辑（熟悉成人长尾词、高意图搜索词优先）\n• 熟练使用GSC、GA等工具，\n• 对成人内容敏感度高，具备较强的数据分析能力，能基于流量、留存、转化数据发现问题并提出针对性优化方案\n• 执行力强，有强烈的结果导向意识，能独立推动成人内容项目落地并承担业绩结果\n• \n加分项\n• 有成人内容网站、成人资讯站、聚合站、多站点运营经验\n• 有成人新站从0到1起盘、历史内容批量优化、专题页/落地页搭建的成功案例\n• 熟悉AI辅助成人内容生产（剧本生成、标题党优化、标签系统、批量描述生成等）和规模化优化经验\n• 具有SEO优化及站内调整经验，持续提升收录率、关键词覆盖和自然搜索流量", "cat": "内容与创作"}, {"id": "257", "title": "中高级运营专员", "salary": "20K-35K", "location": "", "jd": "岗位定位（优先考虑境外办公人才，但需要是中国籍）\n负责整体用户增长方向的策略制定与落地，通过网站优化、内容增长策略、SEO体系搭建，系统性提升站点用户规模与自然流量。该岗位需具备跨站点/跨模块统筹能力，能够独立搭建增长体系并带领团队实现阶段性增长目标。\n\n岗位职责\n\n• 负责用户增长方向的整体策略规划，通过网站优化、内容增长、SEO体系建设持续提升站点用户规模\n• 统筹多个内容/SEO增长模块，制定阶段性目标并推动团队落地，对整体增长结果负责\n• 建立关键词体系、内容矩阵规划及专题页搭建策略，系统性提升站点收录与自然流量\n• 主导竞品分析与用户需求洞察，结合搜索引擎规则变化，持续迭代增长策略\n• 建立核心数据监控体系，包括收录、关键词排名、自然流量、用户留存等，驱动持续优化\n• 推动AI工具在内容生产、流程自动化、数据分析中的规模化应用，提升团队整体效率\n• 与产品、技术、运营等团队深度协同，推动站点技术SEO优化与增长策略的系统性落地\n• 负责团队培养与方法论沉淀，打造可复制的内容增长与SEO增长能力\n\n任职要求\n\n• 本科及以上，5年以上内容运营/SEO/用户增长相关经验，有团队管理经验优先\n• 具备系统性的用户增长思维，能通过网站优化、内容策略、SEO体系实现用户规模提升\n• 熟悉Google等搜索引擎核心算法逻辑，有成功的自然流量增长项目经验\n• 熟练使用GSC、GA、Ahrefs、SEMrush等工具，具备较强数据分析与策略制定能力\n• 有多站点/跨模块统筹经验，具备较强项目推进与跨团队协调能力\n• 结果导向，能在复杂环境下推动事项落地并持续优化\n\n加分项\n\n• 有内容型网站、聚合站、资讯站从0到1起盘或规模化增长经验\n• 主导过SEO体系或内容增长体系搭建，有可量化的增长结果\n• 有AI工具规模化落地经验，能推动团队效率系统性提升\n• 具备一定的产品思维，能参与站点功能优化与用户体验改进", "cat": "运营与市场"}, {"id": "258", "title": "中级远程社媒运营（KOL & 内容方向）", "salary": "12-15K", "location": "中级远程社媒运营（KOL & 内容方向）", "jd": "岗位JD描述：岗位职责（不要过往行业经历只有web3的）\n负责 TG、Twitter/X、TikTok、Reddit 等海外社交媒体账号矩阵搭建与日常运营（养号、发布、引流）；\n负责短视频、图文等内容策划与制作，为矩阵和投放持续供给素材；\n负责 KOL/网红资源洽谈、投放与 ROI 优化；\n通过数据分析迭代内容与投放策略，推动海外流量到产品下载、转化闭环。\n\n任职要求：\n熟悉海外社媒平台运营、内容制作、KOL 对接及基础数据分析；具备执行力、学习能力、沟通协作能力，能适应远程协作。", "cat": "内容与创作"}, {"id": "259", "title": "初/中级运营专员", "salary": "7-15K", "location": "", "jd": "岗位定位\n\n负责内容的基础内容搜集、素材整理，根据安排的内容方向，协助完善素材池、专题池与日常更新资料，为内容编写、上架更新提供基础支持。\n\n岗位职责\n\n• 负责吃瓜、热点话题、黑料爆点等方向的日常内容线索搜集与整理\n• 关注 Telegram、Twitter（X）、抖音、小红书、微博等平台，搜集热点事件可用素材\n• 对搜集到的内容进行基础筛选、分类和整理，提炼标题、爆点、人物关系、事件脉络等基础信息\n• 负责基础素材整理，去水印、视频拼接处理等\n• 配合运营和内容需求，对热点内容进行补充搜集、持续跟进及资料更新\n• 与内容、运营等团队协同，提高内容更新效率和素材整理效率\n\n任职要求\n\n• 有内容搜集、资料整理、热点追踪相关经验者优先\n• 对热点内容、吃瓜内容有一定兴趣和敏感度，愿意长期做内容搜集与整理工作\n• 熟悉 Telegram、Twitter（X）、抖音、微博、小红书等常见平台者优先\n• 具备基础的信息搜集、筛选和整理能力，能够按照要求完成素材归类和内容提取\n• 有一定文字理解和资料归纳能力，能把零散内容整理成清晰可用的基础资料\n• 执行力较好，工作细致，能适应较快的内容更新节奏\n• 具备基本团队协作意识，能配合完成日常内容支持工作\n\n加分项\n\n• 有成人站、吃瓜站、热点资讯类网站相关内容搜集经验\n• 有素材整理、专题归纳、资料库整理经验\n• 网感较好，平时关注热点内容和平台趋势\n• 有耐心，能长期稳定做素材搜集和资料整理工作\n\n补充说明\n\n• 本岗位以基础执行和资料整理为主\n• 更看重执行力、稳定性和学习意愿\n• 业务方向和内容判断可在入职后逐步培训\"", "cat": "运营与市场"}, {"id": "260", "title": "ToC网站综合运营", "salary": "10K-35K", "location": "", "jd": "岗位JD描述\n\n岗位职责：\n\n负责网站整体框架的日常巡检，确保页面正常访问；配合产品和技术团队持续优化网站UI/UX，提升用户浏览体验。\n负责网站各版块的内容策划、撰写与更新；结合SEO策略进行关键词布局，提升网站自然搜索排名。\n根据节假日、行业热点或公司营销节点策划线上活动；负责活动页面原型输出、跟进开发上线，并对活动效果进行追踪和复盘。\n关注网站注册用户的活跃度与留存，建立用户触达与激活机制；收集用户反馈，为产品迭代提供运营视角的建议。\n熟练使用Google Analytics等数据工具，按日/周/月输出网站数据报表（PV、UV、跳出率、转化率等）；通过数据分析定位问题，提出并落地CRO优化方案。\n\n任职要求：\n\n本科及以上学历，3年以上网站运营或综合运营相关工作经验。\n具备扎实的文字功底，能独立完成软文、活动文案及产品包装文案的撰写。\n了解基础SEO知识，熟悉搜索引擎收录与排名规则。\n执行力强，具备良好的跨部门沟通协调能力，需频繁对接设计和技术团队。\n责任心强，抗压能力好，有团队合作精神。\n\n加分项：\n\n有账号矩阵从0到1起量并达成涨粉及曝光KPI实战经验者优先。\n熟练使用AI工具（文本生成、图像处理、音视频辅助等）并能建立内容生产SOP者优先。\n掌握基础HTML/CSS，能进行简单页面代码调整者优先。\n熟悉PS、Figma等设计工具，能独立完成简单配图处理者优先。\n了解Python脚本、自动化抓取工具或Telegram Bot搭建者优先。", "cat": "运营与市场"}, {"id": "261", "title": "SEO专员", "salary": "10K-35K", "location": "", "jd": "岗位JD描述\n\n岗位职责：\n\n全盘负责站点底层SEO架构优化；精细化管理动态Sitemap生成机制、robots.txt规则配置与爬虫抓取频次管理，确保千万级视频页面被高效抓取与收录。\n制定视频内容搜索排名核心策略；深度应用视频结构化数据（Schema Markup/VideoObject），优化视频聚合页与播放页的内部链接结构，提升核心页面权重。\n结合AI工具建立规模化的网页TDK生产SOP；搭建自动化长尾词挖掘与内容分发工作流，通过程序化SEO批量获取长尾流量。\n规划高质量外链建设方案，结合Facebook、X、Telegram等渠道的社交流量信号，综合提升网站DA/DR和搜索引擎信任度。\n建立SEO数据监控看板（基于Google Search Console、日志分析等）；定期进行全站爬虫日志分析，快速定位并解决死链、蜘蛛陷阱、降权等流量异常问题。\n\n任职要求：\n\n本科及以上学历，3年以上大型ToC网站SEO实操经验，有从0到1搭建SEO架构或流量翻倍的成功案例。\n深度了解Google、Bing、Yandex等主流搜索引擎排名机制与反作弊算法，精通白帽SEO，持续关注算法更新趋势。\n熟悉HTML/CSS/JavaScript对SEO的影响，了解AMP/SSR等移动端技术，能与技术团队无障碍沟通并推动SEO需求落地。\n数据敏感度强，具备日志分析能力，能从大规模服务器日志中发现爬虫抓取规律与瓶颈。\n执行力强，能独立推进SEO需求从分析到落地的全流程。\n\n加分项：\n\n熟练掌握Python，能独立编写脚本或自动化抓取工具进行竞品分析与数据处理者优先。\n有将业务数据或流量预警通过API接入Telegram Bot进行程序化管理经验者优先。\n有站群运营或大规模社媒账号矩阵流量协同经验者优先。", "cat": "运营与市场"}, {"id": "262", "title": "初/中级运营专员", "salary": "7-15K", "location": "", "jd": "岗位职责\n1、负责APP内视频内容日常运营，根据运营规范完成内容发布、审核、上下架及维护，确保内容及时上线及正常展示；\n2、负责内容包装优化，包括标题、封面、标签、简介等，不断提升内容点击率、曝光率及基础转化率；\n3、每日监控核心运营数据，输出运营日报，对播放、点击、会员转化、付费转化等指标进行分析，发现异常并及时反馈；\n4、参与平台活动运营，包括专题策划、活动配置、数据跟踪及活动复盘，持续优化活动效果；\n5、维护内容资源池，结合用户偏好及平台需求，不断丰富内容标签及素材，提高平台内容供给质量；\n6、对接产品、审核、视频等相关部门，跟进运营需求落地，推动问题解决及项目执行；\n7、完成领导安排的其他运营工作。\n任职要求\n基本要求\n大专及以上学历，专业不限；\n1年以内运营经验，应届优秀毕业生亦可；\n熟悉短视频、影视、内容平台产品，对视频行业有浓厚兴趣；\n熟练使用Excel，具备基础数据分析能力（如透视表、VLOOKUP等优先）；\n工作细心，责任心强，执行力高，能够适应重复性工作。\n优先考虑\n有视频平台、短剧平台、小说平台、直播平台、内容社区运营经验；\n有内容审核、内容运营、活动运营经验；\n有一定数据敏感度，能够发现异常数据并提出优化建议；\n熟悉用户增长、会员转化、内容推荐逻辑者优先。", "cat": "运营与市场"}, {"id": "263", "title": "中高级产品经理（AI C 端产品方向）", "salary": "15-35k", "location": "", "jd": "岗位 JD 描述\n岗位职责：\n1. 参与公司级产品战略制定，具备跨业务线、跨职能部门整合资源与推动能力。负责公司产品的整体规划、需求挖掘、功能设计与全生命周期管理，推动产品从需求定义、方案设计、研发落地到上线迭代的完整闭环。\n2. 深度洞察用户需求、行业趋势与大模型能力演进路径，结合数据分析与用户调研，主导产品从 0 到 1 落地或从 1 到 100 的核心功能迭代。\n3. 制定清晰的产品目标与核心指标，包括 DAU、留存、使用时长、付费率、ARPU、GMV、AI 调用满意度等，并持续推动核心指标增长。\n4. 负责 AI 内容生产、智能推荐、AI 助手 / Agent、互动社区、AI 创作工具、商业化变现等核心模块的产品规划与功能设计。\n5. 负责产品商业化路径设计，探索订阅、增值服务、Token 计费、内容付费等变现模式，并推动商业化指标提升。\n6. 主导功能的灰度策略、A/B 测试、用户调研和增长实验，建立从数据洞察到产品策略落地的闭环机制。\n7. 能熟练使用AI工具提升工作效率，结合 Prompt 优化、模型选型、RAG、Agent 工作流、多模态等能力，设计具备差异化体验的产品方案。推动 AI 能力在多业务场景中的复用与落地。\n\n\n任职要求：\n1. 本科及以上学历，985 / 211 优先，计算机、人工智能、产品设计、数据科学等相关专业优先，专业不限。\n2. 5 年以上互联网 C 端产品经验， 完整主导过至少 1-2 个 产品从 0 到 1 落地，或现象级产品，有显著数据提升案例，如活跃、留存、付费、满意度等。\n3. 深刻理解内容平台、社区产品、视频产品、娱乐互动产品、会员付费产品或创作者生态产品。\n4. 深刻理解会员体系、付费体系及商业化变现路径，能够设计变现策略，包括订阅、增值服务、Token 计费、内容付费等。\n5. 深刻理解 AI 内容生态，包括 AIGC 内容生产、智能推荐、AI 互动玩法、AI 创作工具、智能体 Agent 应用、虚拟人 / 数字人等 C 端典型场景。\n6. 熟练使用 Axure、Figma 等原型工具，以及AI工具辅助工作，独立输出产品需求。\n7. 熟练使用数据分析工具，具备数据分析、数据埋点方案设计及指标拆解能力。\n8. 需要有一线大厂或正规行业完整项目经历，在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等公司有完整项目经历者优先；不接受近几年有 BC 行业经验的候选人。\n\n\n加分项：\n1. 拥有日活百万级以上产品落地经验者优先。\n2. 具备团队管理经验和优秀的项目管理能力，或有 AI 产品方向方法论沉淀、产品指导经验者优先。\n3. AI 工具深度用户，有个人 AI 作品、AI 项目、Agent 工作流或产品案例沉淀者优先。", "cat": "产品与管理"}, {"id": "264", "title": "中高级UI设计师", "salary": "10k-30k", "location": "", "jd": "【岗位职责】 （优先考虑境外办公人才，但限制中国籍）不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n\n负责常规界面设计时顺便制作基础的微交互（如按钮点击、页面跳转过渡）。\n侧重逻辑流向，产出动效规范（Timing、Easing、状态变化说明文档）。大厂或高品质项目中负责炫酷动画、复杂转场和品牌化动效。\n负责公司相关产品（Web/H5/App等）的整体UI界面设计，熟练使用Figma等设计工具，主导产品视觉风格和规范的制定。\n根据产品调性，完成icon、logo、水印、启动页、落地页等产品上线前所需物料，包括但不限于静态图、动态图、MG动画；根据运营需求设计活动banner、弹窗等，覆盖节日活动、补间活动、社区日常推荐活动等场景。\n具备二次元视觉风格设计能力，能够产出符合二次元审美的界面、角色、插画及运营物料，理解二次元用户圈层喜好与视觉偏好。\n利用Make、Stitch等AIGC工具完成从构想到Figma成品交付，了解各类大模型用途及ComfyUI工作流搭建与节点使用。\n\n【任职要求】\n\n本科及以上学历，美术、视觉传达、计算机学等相关专业优先；\n5年以上UI设计及平面设计经验（两者均需具备）；\n专业技能：Figma、Photoshop、Illustrator、Adobe Effects、ComfyUI、Claude；\n有二次元风格设计作品集，优先考虑有动漫、游戏、虚拟IP等相关项目经验；\n优先考虑境外办公人才（中国籍）；\n近期有博彩、棋牌、区块链相关背景者不予考虑。\n\n【加分项】\n\n会使用Claude与Figma进行交互，可反推Frame文件生成；会用Make进行低保真生成，会用Stitch进行概念设计；\n会使用Blender、C4D等三维软件；\n有前端经验，会Python；\n深度理解ComfyUI各节点含义，能自写节点并搭建复杂工作流；\n有二次元IP设计、虚拟形象设计或Live2D相关经验者优先。", "cat": "内容与创作"}, {"id": "265", "title": "运营副主管（网站运营）40K-65K/月", "salary": "40k-65k", "location": "", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n\n岗位职责：\n\n协助主管制定并执行网站运营策略，确保网站运营方向与公司业务目标保持一致，围绕流量增长、内容质量、用户体验、转化提升及运营效率优化推进整体工作。\n负责网站日常运营统筹管理，覆盖内容、页面、功能、更新维护等核心环节，保障网站稳定、高效运行。\n建立并持续优化网站运营流程、管理制度及SOP，提升团队整体执行效率和业务协同能力。\n持续监控网站流量、用户行为、转化率及其他关键运营指标，及时识别问题并提出数据驱动的优化方案。\n推动网站用户体验（UX）及转化率优化（CRO），持续改善用户旅程、内容承接效率和业务转化效果。\n推动SEO策略落地及相关技术优化，协同提升网站自然搜索表现、内容可见度及流量增长。\n协调产品、设计、开发等部门资源，推进网站功能优化、运营需求及数字化项目按计划落地。\n监督网站系统运行、安全性及性能表现，及时协调处理异常问题，降低运营风险。\n协助主管进行团队管理，包括工作规划、任务分配、绩效跟进、培训辅导及人才培养，保障团队稳定输出。\n\n任职要求：\n\n本科及以上学历，具备网站运营、内容运营、流量运营或相关岗位工作经验，有网站业务管理经验者优先。\n熟悉网站日常运营逻辑，对流量增长、内容质量、搜索表现、用户体验和转化优化有较强理解。\n具备较强的数据分析能力，能够围绕流量、行为、转化等核心指标进行问题判断与优化推进。\n熟悉SEO基础逻辑，能够协同推进自然流量增长及网站结构、内容、页面等优化工作。\n具备较强的组织协调能力、跨部门推动能力和问题闭环意识，能够推进事项按节点落地。\n有一定团队管理、项目推进或带教经验，能够协助主管完成团队管理和业务统筹。\n责任意识强，抗压能力较好，能够在多项目并行情况下保持稳定推进。\n\n加分项：\n\n有多网站或内容平台运营管理经验者优先。\n有SEO、CRO、UX优化相关经验者优先。\n有网站改版、功能优化或数字化项目推进经验者优先。\n有团队管理、绩效跟进及人才培养经验者优先。\n熟悉AI工具在网站运营、内容生产及效率优化场景中的应用者优先。", "cat": "运营与市场"}, {"id": "266", "title": "运营副主管（40K-65K/月）", "salary": "40k-65k", "location": "", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n岗位定位：\n协助开展团队管理与业务推进，承接部门经营目标及运营策略拆解，负责重点项目推进、团队执行管理、日常运营保障及跨部门协同，对分管业务模块的经营结果、项目交付质量和团队执行效率负责。\n核心职责：\n1. 承接制定的年度、季度及月度经营目标，拆解阶段性任务，推动各项运营工作按计划执行，并对分管业务结果负责。\n2. 负责重点运营项目推进，包括产品运营、内容运营、用户增长、流量增长、活动运营、转化优化等专项，统筹资源推动项目从方案、执行到数据复盘完整闭环。\n3. 持续跟踪新增、活跃、留存、充值、转化等核心指标，分析用户行为和业务问题，输出数据驱动的优化方案，并推动产品、运营动作持续迭代。\n4. 协助进行团队日常管理，包括任务分配、过程跟进、结果验收、绩效辅导、新人培养及团队梯队建设，提升团队执行力和交付质量。\n5. 负责运营流程、管理制度及SOP的落地和持续优化，推动日常运营标准化、流程化，降低执行偏差与运营风险。\n6. 统筹产品日常运营、内容质量、用户体验及异常问题处理，及时发现业务风险并推动闭环，保障产品稳定运营。\n7. 协调产品、研发、设计、数据、渠道等相关部门资源，推动重点功能、活动及运营需求按节点交付，提升跨部门协同效率。\n8.结果导向：对分管业务模块的经营指标达成、重点项目交付、转化与留存改善、运营执行质量、团队执行效率及问题闭环结果负责，保障制定的经营策略高质量落地。\n\n任职要求：\n1. 具备基础管理思维和较强的业务执行、项目推进及结果交付能力。\n2. 具备业务拆解、问题研判、数据分析及资源统筹能力，能够基于经营指标发现问题并推动解决。\n3. 具备较强的跨部门沟通协同能力，能够推动产品、研发、设计、数据等多方资源完成项目落地。\n4. 具备团队带教和过程管理能力，能够协助提升团队整体执行效率。\n5. 熟练使用数字化工具赋能运营工作，有实际提效成果者优先。\n\n加分项：\n有独立负责核心产品或重点运营项目的成功经验，能够通过数据分析定位业务问题，并推动产品、活动、用户增长或转化优化方案落地；\n具备 AI/Agent自动化应用、跨部门复杂项目推进、从0到1搭建运营机制或带队完成明确业绩增长 的实际案例者优先。\n有异常与风险处理能力，在系统故障、数据异常、转化下滑等情况下，能够快速判断优先级、协调资源并完成止损闭环。\n有从0到1搭建运营机制经验，如SOP、数据看板、用户分层、活动机制、内容体系或运营流程，并能够复制推广。", "cat": "运营与市场"}, {"id": "267", "title": "中高级平面设计师", "salary": "10-30K", "location": "", "jd": "岗位定位：\n负责产品视频封面的制作以及日常活动的视觉设计，良好的沟通能力和自主设计能力，积极配合产品活动项目落地以及推广，设计产出符合大众审美并带来强烈的点击欲望，实现产品的点击量的持续增长和增加用户粘。\n\n岗位职责：\n要求候选人具有一定的审美能力，在日常运营工作中的设计产品封面/推广等工作，能够根据视频精彩内容输出美观吸睛的作品，并且按照相关需求输出动效活动banner以及会员卡/弹窗/海报等物料。\n\n团队与创意协同：\n与设计/内容团队协作优化视觉并进行审核，最终落地推广。\n\nAI 应用：\n运用 AI 工具完成整个设计流程，提高设计效率和质量。\n\n任职要求\n大专及以上学历，有3年以上平面/视觉相关经验者优先；\n熟悉主流设计方向，有良好审美和原创能力，有一定的figma基础，注重设计细节以及良好的沟通协作能力，精通（PS/Ai/AE/Pr/C4d）等软件，输出动效类的推广banner/海拔/弹窗等活动图。\n\n结果导向：具备良好的审美能力、沟通协调、抗压能力与团队协作意识，能适应快节奏工作；熟练运用 AI 工具辅助设计，候选人在国内和海外都可以。\n\n加分项：\n有成人行业经验首选，其次为传媒/视频/直播公司相关经验，会使用AE/C4d/figma等相关3d动效类的候选者优先考虑。", "cat": "内容与创作"}, {"id": "268", "title": "PMO/项目管理", "salary": "8-10K", "location": "", "jd": "岗位定位：作为GM经营管理辅助角色，协助推进重点业务及项目，强化过程管控、跨部门协调及结果闭环，推动经营目标有效落地。\n\n岗位职责：\n1、项目统筹与进度管理：负责各部门重点项目全生命周期跟踪，定期收集、汇总及评估项目进展，围绕关键节点、交付结果及目标偏差进行过程管控，及时识别风险并推动解决。\n2、重点事项推进与业务协同：参与重点业务事项及跨部门项目的过程管理，对GM及管理层明确的重点任务进行拆解、跟进和协调，推动责任人按计划完成关键节点；针对进度偏差、协同卡点及重大风险及时介入，并做好阶段性进展及节点结果汇报。\n3、经营会议及决议闭环：负责重点跨部门会议、GM例会等管理会议的组织与信息梳理，提炼关键决议、责任人及完成节点，并持续跟进决议事项落地，对延期、未闭环事项及时预警及推动解决。\n4、管理信息及项目看板建设：建立并持续优化重点项目及任务管理看板，定期输出周报/月报，清晰呈现项目进度、关键成果、风险问题及待决策事项，为GM及管理层掌握业务进展、资源协调和管理决策提供支持。                                                        \n\n\n任职要求\n1. 具备较强的项目管理、任务拆解和进度推进能力，能够独立跟踪多部门、多项目事项。\n2. 具备良好的跨部门沟通协调能力，能够有效推动责任人完成任务并解决协同问题。\n3. 具备较强的逻辑分析、信息整合和书面表达能力，能够高效输出会议纪要、项目报告、周报及月报。\n4. 具备风险意识和结果导向，能够及时发现进度偏差、潜在风险及未闭环事项，并推动解决。\n5. 熟练使用Excel、PowerPoint等办公工具，具备数据整理、项目看板及经营信息呈现能力。\n6. 工作认真细致、责任心强，具备较强的执行力、抗压能力和保密意识。\n7. 有经营管理、项目管理、PMO、总经理助理、业务运营或跨部门协同相关经验者优先。", "cat": "产品与管理"}, {"id": "269", "title": "剧本组长（35K-55K/月）", "salary": "20-35K", "location": "", "jd": "岗位职责；负责剧本组整体产出与储备；（1）对剧本采纳率、剧本储备月数（稳定 2–3 个月，含外包与采购）负责。；（2）统筹内部原创、外包撰写、剧本采购三条来源，合理分配产能。；（3）组员任务分配，跟踪各集剧本进度与质量。；负责剧本评审与方法沉淀；（1）组织本子评审，把控剧情成立、时长可控、钩子/爽点/断点有效。；（2）沉淀跑出成绩的结构、开场钩子、爽点、断点为方法，指导本组创作。；（3）参与立项前制作可行性会审，判断内容值不值得做。；负责不可外包内容的最终把关；（1）守住核心主线设定、男女主角核心人设、成片整体节奏，不外包、不放松。；（2）确保外包与采购剧本进入审核序列，不绕过卡点 1。；负责编剧梯队建设；（1）搭建编剧梯队并组织互评，培养储备组长。；（2）新入职编剧的带教与适应期缩短。；任职要求；本科及以上学历，5 年以上编剧/内容创作经验，其中 2 年以上团队带教或统筹经验。；具备带编剧团队的能力（核心要求）——各线最缺的不是编剧，是能带编剧的人。；有网文/短剧/动漫/影视等成规模内容的主创或统筹经验，有代表作品。；深刻理解爽点、钩子、断点、节奏等短剧/网文创作规律。；具备内容判断力与评本能力，能快速判断本子优劣与改进方向。；熟悉外包协作与剧本采购流程者优先。；自带成熟编剧团队者优先。；关键考核指标：剧本储备月数、采纳率、上线后相对表现、续作能力、是否带出储备组长。；", "cat": "内容与创作"}, {"id": "270", "title": "编剧", "salary": "15-25K", "location": "", "jd": "岗位职责；负责核心剧本与爆款项目创作；（1）撰写项目核心主线、分集剧本、锁定版剧本，确保剧情成立、时长可控。；（2）设计开场钩子、爽点节奏、集末断点，提升留存与完播。；（3）参与男女主核心人设与标志性场景的设定。；负责剧本迭代与数据响应；（1）参与立项前制作可行性会审，与生成组确认镜头可制作性。；（2）根据上线数据（前 3 秒留存、完播率、付费转化、转发）与观众口碑，调整后续剧集与选题。；配合审核与制作；（1）配合剧本审核在卡点 1 完成锁定，及时响应修改意见。；（2）配合导演与生成组，保障剧本到分镜的顺畅转化。；任职要求；大专/本科及以上学历，2 年以上编剧经验（短剧、网文、动漫、影视方向）。；有真实代表作品，审美与内容判断力优先于 AI 工具操作能力。；精通爽文/短剧叙事套路，熟悉钩子、反转、爽点、断点设计。；有单部完整作品的创作经验，能独立产出成熟分集剧本（成熟编剧月产约 2 部）。；对上线数据敏感，愿意以市场反馈迭代创作。；有女频/男频、悬疑、都市、玄幻等热门题材经验者优先。；关键考核指标：剧本采纳率、上线后相对表现、续作能力（不按写了多少集评价）。；", "cat": "内容与创作"}, {"id": "271", "title": "视频生成组长（50K-70K/月）", "salary": "30-50K", "location": "", "jd": "岗位职责；负责生成产能组织与调度；（1）按剧本场次数分配生成人力（投入人数 > 场次数则边际效益迅速下降；最小作业单元 1 导演 + 3 生成）。；（2）保障目标产能 2–3 分钟/人/天（通过卡点 4 的合格成片分钟数）。；（3）管理动态额度申请，优先保障高质量有效产出。；负责生成质量把控；（1）对合格镜头率、一次通过率、单位算力产出负责。；（2）与导演对齐分镜归属与画面风格。；负责工具回流与资产沉淀；（1）回流生产数据与优质参数至技术团队与共享资产库。；任职要求；大专/本科及以上，3 年以上视频制作/AIGC 视频生成经验，1 年以上带组经验。；精通主流 AI 视频生成工具链与工作流，理解人物稳定、动作自然、场景不漂移的控制方法。；具备产能组织能力，能按场次数与难度合理排产。；对算力成本与产出效率敏感。；自带成熟编剧团队者优先。；关键考核指标：合格镜头率、单位算力产出、单人日产能、一次通过率、是否带出储备组长。；", "cat": "内容与创作"}, {"id": "272", "title": "AI 视频生成（20-50K/月）", "salary": "20-50K", "location": "", "jd": "岗位职责；负责镜头视频生成；（1）依据分镜脚本生成镜头素材，保证人物稳定、动作自然、场景不漂移。；（2）达成目标产能 2–3 分钟/人/天（指通过卡点 4 的合格成片分钟数）。；（3）常规对话、静态场景可批量生成；高难度打斗、多人复杂互动为重点攻坚。；负责生成质量与自检；（1）对一次通过率、合格镜头率负责，减少返工。；（2）瑕疵镜头初筛，配合镜头审核执行卡点 4。；配合资产与参数沉淀；（1）回流优质随机种子、构图参数、微调资产至共享库。；任职要求；大专及以上学历，1 年以上视频制作、后期或 AIGC 相关经验（应届优秀者可放宽）。；熟练使用 AI 视频生成工具，理解提示词、参数、种子对稳定性的影响。；有画面审美与镜头感，能判断生成结果是否达标。；细致、有耐心，能承担产量与一次通过率压力。；现有剪辑/后期人员经培训可内部转岗。；关键考核指标：产量、一次通过率、合格镜头率、单位算力产出。；", "cat": "内容与创作"}, {"id": "273", "title": "剪辑", "salary": "10-15K", "location": "", "jd": "岗位职责；负责成片剪辑；（1）按导演调性完成镜头拼接、节奏处理、转场，产出二次修改视频与最终成片。；（2）A 级硬错误清零，B 级问题给出处理结论。；负责音频与字幕；（1）完成 AI 配音、音效配乐拼接、统一字幕（经音频培训后并入）。；配合交付规范；（1）确保格式、码率、分辨率、时长、命名符合统一规范。；任职要求；大专及以上，2 年以上剪辑经验（短剧/短视频/影视方向）。；熟练使用主流剪辑与音频软件，具备节奏感与画面审美。；有 AI 配音、批量字幕、成片规范化经验者优先。；现有剪辑人员可内部转岗。；关键考核指标：交付质量、单条平均返工次数、成片一次通过率。；", "cat": "内容与创作"}, {"id": "274", "title": "发布与数据", "salary": "10-18K", "location": "", "jd": "岗位职责；负责首轮发布测试与切片投放；（1）执行首集/切片上线测试，取得可判断的留存与完播数据，支撑卡点 5 决策。；负责量化体系维护；（1）维护生产账号体系，关联团队/项目/剧集/镜头，记录投入、产出、质量、效率四维数据。；（2）执行基础额度 + 动态额度分配口径，跟踪算力—收益投产比并动态预警。；负责数据回流；（1）按统一口径、约定周期，将播放数据（有效播放、完播、跳出、续看、付费转化等）关联到项目/镜头/模型版本/生成参数。；（2）配合技术团队采集与关联，向中台回流。 4.（P0 首发阶段）兼任项目负责人职责，从立项跟到交付。；任职要求；本科及以上，2 年以上数据运营/内容运营/BI 相关经验。；具备较强数据分析能力，熟悉留存、完播、转化等内容指标口径。；熟悉数据看板/报表工具，能维护量化体系。；有视频/内容平台运营或投放经验者优先；现有运营人员可内部转岗。；关键考核指标：数据回流及时性与完整性、量化体系维护质量、切片测试有效性。；", "cat": "其他"}, {"id": "275", "title": "中级运营", "salary": "10-20k", "location": "", "jd": "岗位职责\n1，平台增长与商业化运营\n深度参与用户增长、留存及商业变现相关工作，协助优化平台盈利模式，逐步独立承担运营策略制定与落地工作。\n2，内容运营与流量优化\n负责内容选题策划、制作发布与数据复盘优化，依托优质内容助推用户增长与转化；具备短视频剪辑、SEO 优化任一专项能力即可，可独立完成视频剪辑成片，或熟练掌握关键词布局、站内优化、流量引流等 SEO 实操技巧，全方位提升内容曝光与自然流量。\n3，用户精细化运营\n结合用户行为数据与真实反馈，深挖用户需求、梳理使用路径，参与用户分层运营，搭建精细化运营体系。\n4，活动策划与转化提升\n主导并配合完成平台各类运营活动策划与落地，持续优化活动玩法，有效拉升用户活跃度与商业转化效果。\n5，AI 工具赋能提效\n灵活运用各类 AI 工具赋能内容生产、日常运营工作，积极探索全新使用场景，大幅提升整体工作效率。\n6，项目执行与复盘迭代\n独立负责对应运营模块及重点项目推进，完成全流程落地执行，定期开展工作复盘，总结经验并输出优化方案，持续迭代运营打法。\n简历筛选核心要点\n1，从业经验要求\n有海外社交产品、同志社群平台（LGBTQ+）、兴趣社区、情感陪伴类产品运营经验者优先，熟悉相关用户群体特征、内容生态及用户增长逻辑。\n必备专项技能（二选一）\n① 短视频剪辑：熟练使用主流剪辑软件，可独立完成短视频剪辑、包装产出，具备内容审美与网感优先；\n② SEO 优化：熟悉搜索引擎规则，精通关键词挖掘、页面优化、流量提升等实操方法，有自然流量增长实操经验优先。\n2，具备商业化运营思维\n无需全盘操盘变现业务，熟知运营动作与营收收益的关联逻辑；有会员运营、付费内容推广、付费转化活动相关经验优先，洞悉用户付费需求者加分。\n3，拥有用户思维与数据分析能力\n善于站在用户视角思考问题，能整理分析用户反馈、研判用户行为，具备基础数据复盘与需求拆解能力，有用户分层、用户运营相关经验更佳。\n4，具备独立策略思考能力（重点）\n拥有主动思考与自主优化意识，可独立参与内容规划、活动设计、运营策略调整等工作，只要具备主动优化、积极复盘的思维，均可邀约面试。", "cat": "运营与市场"}, {"id": "276", "title": "新媒体运营专员（英国本地/远程）", "salary": "英国本地：GBP2500-3000/月\n远程：10-15k（特别优秀可谈）", "location": "", "jd": "核心任务：从 0 到 1 快速起号与矩阵构建\n 我们需要一位深谙海外社交媒体底层逻辑的“操盘手”。你不仅要懂内容，更要懂流量分发机制，能够带领账号在短时间内突破新手期并实现粉丝指数级增长。\n \n 具体职责：\n 1. 全平台起号： 负责 Twitter (X)、Facebook、Instagram 等海外主流平台的账号矩阵搭建与起号工作，能在 1-3 个月内实现粉丝数从 0 到万级的突破。\n 2. 内容策略： 制定并执行各平台差异化内容方案，包括短视频、图文及热点推文，确保内容具备病毒式传播潜力。\n 3. 矩阵化运营： 熟练运用账号矩阵策略，通过号群联动、交叉引流，低成本获取高精准流量。\n 4. 数据复盘： 实时监控运营数据（播放量、点击率、留存率、转化率等），并根据数据反馈快速迭代内容方向。\n 5. 粉丝转化： 提升账号活跃度与互动率，通过社群运营或私域转化，实现品牌曝光与业务增长双赢。\n 6.内容剪辑：有剪辑视频，二创能力，具备基础的内容整合视频剪辑技能。\n简历筛选要点：\n• 硬核实操： 3 年及以上海外媒体运营经验，拥有可验证的从 0-1 起号成功案例（面试需展示过往账号数据及增长曲线）。\n • 平台精通： 深度理解 Twitter、Facebook、Instagram 的算法推荐逻辑、风控规则及广告投放工具。\n • 矩阵思维： 有账号矩阵运营实操经验，了解防关联技术、号群分配及自动化管理工具者优先。\n • 敏锐嗅觉： 能够捕捉海外流行趋势及梗文化，迅速产出符合当地受众审美的爆款内容。\n • 语言能力： 优秀的英文/中文读写能力，能够独立进行文案创作及粉丝互动。\n • 目标导向： 对数据敏感，极强的抗压能力和自驱力，以结果为导向。\n 加分项 (Plus)\n • 有 TikTok 或 推特 成功起号经验者优先。\n • 具备 AI 工具辅助生产高效内容的技能。\n • 有海外广告投放（FB Ads/X Ads）推广号投流经验，能实现“内容+付费”协同增长。", "cat": "运营与市场"}, {"id": "277", "title": "产品经理", "salary": "15-30k", "location": "", "jd": "岗位职责\n1.负责内容社区类产品的产品设计、迭代与体验优化，对核心链路指标（拉新、留存等）负责。\n2.参与产品规划与版本节奏管理，完成需求调研、需求分析、方案设计、原型输出与 PRD/交互说明撰写。\n3.主导或参与核心模块建设与持续迭代，包括但不限于：内容发布与管理、内容分发、社区互动、播放/阅读体验、会员与广告体系等。\n4.建立并完善埋点与指标体系，结合数据表现与用户反馈，持续推进功能优化与体验提升，形成“上线-验证-复盘-迭代”的闭环。\n5.协调设计、研发、测试、运营等团队资源，推动需求评审、排期、联调、验收与上线，确保项目高质量按期交付。\n6.参与用户增长与商业化相关功能设计、支持广告与会员体系在产品侧的体验优化与链路打通。\n7.持续跟踪行业趋势与竞品动态，沉淀方法论与产品规范，提升产品竞争力。\n\n任职要求\n1.重点强调细心、主动性强、沟通理解能力强；\n2.本科及以上学历，3-5 年互联网产品经理经验；有内容社区产品经验优先。\n3.熟悉移动端产品设计流程，能够独立完成需求分析、原型设计（Figma/Axure/墨刀等）及 PRD/交互文档撰写。\n4.对内容社区产品核心链路有理解：内容供给、分发机制、互动体系与社区治理基础能力（至少熟悉其中 1-2 个模块）。\n5.具备基础数据分析能力与数据意识：能定义关键指标与埋点需求，能基于数据与反馈提出可落地的改进方案。\n6.具备良好的沟通协调与推进能力，能跨团队推动项目落地并处理风险与问题。\n7.学习能力强、逻辑清晰、责任心强，具备较强的问题拆解与解决能力，抗压与自驱力佳。\n8.熟练使用AI Agent提升工作效率，可AI搭建产品；\n\n\n加分项\n1.男同优先；\n2.做过内容推荐/Feed 流策略相关产品。\n3.做过会员/广告产品链路相关体验优化。\n\n应聘材料\n简历 + 代表作品（可附原型/PRD节选/作品集链接，脱敏即可）。", "cat": "产品与管理"}, {"id": "278", "title": "AI内容运营（BL方向）", "salary": "10-20k", "location": "", "jd": "岗位定位：\n负责Gshort项目内容运营及内容生态建设，围绕BL向短剧完成内容引入、创作者运营、渠道推广及用户增长相关工作。\n\n岗位职责：\n1. 负责短剧内容搜集、整理、审核、上架及内容库维护；\n2. 招募并维护创作者，建立稳定内容供给体系；\n3. 负责BL向短剧选题策划、内容包装及亮点提炼；\n4. 参与用户渠道拓展、活动策划及社媒运营推广；\n5. 跟踪内容数据表现，持续优化内容方向及运营策略。\n\n任职要求：\n1. 1-3年以上内容运营、推广运营、创作者运营或短视频运营经验；\n2. 对BL内容、短剧、网文、漫画、影视、二次元内容有兴趣及理解；\n3. 具备内容敏感度及基础文案能力；\n4. 熟悉或愿意学习ComfyUI、LiblibAI、RunningHub等AIGC工具；\n5. 执行力强，能适应项目早期快速迭代节奏。\n\n优先录用：\n• BL内容运营经验\n• 男性向内容运营经验\n• 短剧/网文/漫画平台运营经验\n• 创作者运营经验\n• AIGC内容制作经验\n• TikTok、小红书、B站、X(Twitter)运营经验", "cat": "内容与创作"}, {"id": "279", "title": "内容运营专员(新岗位)", "salary": "10-20k", "location": "", "jd": "## 关于我们\n\n我们运营一个面向华语男同群体的内容平台(站点导航 + 视频 + 图文指南),团队精简、流程高度工具化:素材收录、合规改写、封面、发布、SEO 巡检都有现成脚本与 SOP,你只需要按规范执行和判断,不需要从零摸索。\n\n特别说明:平台内容涉及男同成人题材。应聘者须年满 18 岁,并确认自己能长期、稳定、无心理负担地接触和处理此类内容。\n\n## 工作职责\n\n1. 吃瓜素材搜寻与瓜源维护\n   持续发掘、跟踪瓜源渠道(Telegram 群组/频道、X、微博等),筛选有传播价值的素材;按收录规范整理(去重、编号归档、标注风险点),保证素材供给稳定、可追溯。\n\n2. 微信公众号内容跟踪\n   定期读取指定公众号的更新,提取可用图文素材与选题线索,整理成规范素材包交付流水线。\n\n3. 视频封面选择\n   从抽帧图/原始封面中为每条视频挑选画面清晰、有点击吸引力且符合站内尺度规范的封面,按命名规范归档(有明确的选帧标准和示例)。\n\n4. 文案清洗(合规化改写)\n   按合规规范改写视频标题、简介与标签:去除风险词、统一格式、保留信息量与可读性,产出规范的数据文件供批量上传(有完整的改写规则与正反例)。\n\n5. 预览视频剪辑\n   从源视频截取 15–60 秒预览片段,统一分辨率与输出格式;剪映/PR/FCP 任一熟练即可,不要求特效包装。\n\n6. 内容 SEO 维护\n   对新上线的视频/指南/专题做例行巡检:标题与描述长度、重复度、摘要补写、死链检查等,按 checklist 执行并记录;有自动化巡检工具辅助,你负责人工判断与补写文案。\n\n7. 需求看板维护\n   维护 Trello 运营看板:需求收集建卡、进度更新、完成项归档、输出简要日报,保证团队对运营进展一目了然。\n\n## 任职要求\n\n- 年满 18 岁;完全接受男同成人内容题材(硬性要求,请慎重确认后再投递);\n- 中文文案功底扎实,改写通顺自然、有分寸感;细心、有条理,能严格按 SOP 执行;\n- 具备基础视频剪辑能力(剪映/PR/FCP 任一);\n- 会用或能快速上手 AI自动化、Telegram、Trello;\n- 远程自驱型:每日可保证稳定在线时段(与北京时间工作时段有重叠),响应及时、交付可靠;\n- 保密意识强:素材、账号与内部流程不外传,可签保密协议。\n\n## 加分项\n\n- 有 SEO 基础(懂 title/description/重复内容的基本逻辑);\n- 熟悉吃瓜社区、LGBTQ+ 社群内容生态;\n- 会用 AI 工具辅助改写/整理,并有辨别 AI 产出质量的能力;\n- 会简单的表格/脚本自动化。", "cat": "内容与创作"}, {"id": "280", "title": "用户增长运营", "salary": "10-20k", "location": "", "jd": "岗位定位\n负责男同视频内容平台或社区产品的用户增长工作，围绕拉新、转化、留存、召回和付费增长，搭建可持续的增\n长策略与运营机制，提升核心用户规模、用户活跃度和商业转化效率。\n工作职责\n• 制定并执行用户增长策略，围绕注册、激活、留存、付费、复购等关键环节，持续提升用户规模与用户质量\n• 负责增长渠道拓展，包括社交媒体、内容平台、社群、KOL/KOC、联盟渠道、SEO/ASO、广告投放等，评估渠道\n效果并优化获客成本\n• 结合男同内容消费场景和目标用户画像，设计拉新活动、裂变机制、会员转化活动、内容分发策略和用户召回\n• 与内容、产品、数据、投放、设计等团队协作，优化新用户引导流程、会员购买路径、内容推荐链路和关键转化页\n面\n• 建立用户分层运营体系，针对新用户、活跃用户、沉默用户、付费用户和高价值用户制定差异化运营策略\n• 跟踪和分析核心增长数据，包括新增、活跃、留存、转化、ARPU、LTV、CAC、ROI，输出数据洞察与优化建议\n• 策划并落地线上增长活动，如会员促销、限时权益、邀请奖励、内容专题、节日活动、社区互动活动等\n• 关注男同视频、成人内容、LGBTQ+ 社区、短视频、直播、订阅制产品等趋势，持续挖掘增长机会\n• 沉淀增长方法论、活动复盘、渠道评估模型和用户运营 SOP，提升团队整体增长效率\n任职要求\n• 2 年以上用户增长、用户运营、内容运营、社群运营、广告投放或平台增长相关经验\n• 熟悉内容平台、视频产品、社区产品、会员订阅产品或泛娱乐产品的用户增长逻辑\n• 具备较强的数据分析能力，能够基于数据发现问题、制定方案并推动落地\n• 熟悉常见增长手段，包括渠道投放、裂变活动、用户分层、召回运营、会员转化、A/B 测试等\n• 对男同用户群体、LGBTQ+ 文化、垂直内容消费习惯有理解，具备良好的用户敏感度和内容判断力\n• 具备较强的活动策划、文案表达、项目推进和跨团队协作能力\n• 结果导向，能够独立负责增长指标，并持续复盘优化\n• 对合规、平台规则、内容安全和用户隐私有基本认知，能够在合规边界内开展运营工作", "cat": "运营与市场"}, {"id": "281", "title": "中级运营（seo方向）", "salary": "10-20k", "location": "", "jd": "简历筛选要点\n1.3年及以上 SEO 或内容运营经验，做过英文站/海外流量站点，有独立负责站点或频道从 0 到有稳定自然流量的完整经验。\n2.理解搜索引擎抓取、索引、排名机制，清楚什么样的内容会被收录、什么样的不会，能讲清判断依据而非只背概念。\n3.熟练使用 Google Search Console 与 GA4，能从数据中定位问题（收录下降、点击率异常、流量突变），而不只是导出报表。\n4.会用至少一款关键词工具（Ahrefs / Semrush 或同类）做关键词研究、竞品分析和内容缺口判断。\n5.熟悉技术 SEO 基本概念（sitemap、canonical、hreflang、结构化数据、Core Web Vitals），能识别问题、准确描述现象并向开发提出可执行的修复需求。\n6.熟悉使用 AI 工具（Claude、ChatGPT 等）提升选题、内容生产、数据整理和文档效率。不是只会让 AI 批量出稿，必须能人工判断内容质量、事实准确性、重复度和被搜索引擎判定低质的风险。\n岗位职责\n1. 负责公司 内容站点矩阵的 SEO 落地与自然流量增长，包括关键词布局、栏目与页面结构、内链体系和内容模板的执行与优化，能按站点价值分配精力而非平均用力。\n2.基于关键词工具与搜索需求数据完成关键词研究、竞品分析和内容缺口判断，输出选题方向并转化为可执行的内容排期。\n3. 制定并维护内容生产的 SEO 规范（标题、描述、正文结构、内部链接、实体覆盖），保障批量产出的内容符合收录与排名要求。\n4. 负责 AI 批量生成内容的质量与合规审核，包括可读性、事实准确性、重复度和低质风险判断，避免低质内容进入线上。\n5. 通过 GSC / Bing Webmaster / IndexNow 等渠道跟踪收录率与索引状态，定位未收录、软 404、重复内容、抓取浪费等问题并推动解决。\n6. 建立日常 SEO 巡检机制，定义关键指标与告警阈值（收录率、抓取异常、结构化数据错误、流量突变），对异常分级响应并跟进修复闭环。\n识别技术 SEO 问题并向前端/后端提出明确修复需求，推动开发排期，修复后负责效果验证；与产品、开发、内容保持高效协作。\n7.  跟踪 Google 核心算法更新与政策变化（如 spam policy、site reputation abuse 等），评估对站群的影响并及时同步风险信号。\n8. 沉淀 SEO 操作规范、检查清单、内容模板和 AI 协作方法，提升多站点批量运营的整体交付效率。", "cat": "运营与市场"}, {"id": "282", "title": "中级运营（ai短剧制作方向）", "salary": "10-20k", "location": "", "jd": "适用于 AI 短剧从创意策划、视觉生成、视频制作到成片交付阶段的核心制作岗位招聘。\n岗位定位：负责将短剧脚本、角色设定和分镜需求转化为可交付的 AI 视频内容，统筹文生图、图生视频、配音、剪辑、包装等制作环节，提升短剧生产效率和成片质量。\n岗位职责\n-负责 AI 短剧项目的制作执行，包括剧本拆解、分镜规划、角色设定、场景设计、镜头生成、画面优化与成片交付。\n-使用 AI 工具完成短剧视觉内容生产，包括文生图、图生图、文生视频、图生视频、配音、字幕、剪辑等流程。\n-根据项目需求，协助完成短剧选题、剧情节奏、人物关系、爆点设计和平台化表达优化。\n-负责 AI 生成素材的筛选、修正与统一，保证角色一致性、画面风格统一、镜头连贯性和整体观感。\n-配合编剧、导演、运营、剪辑等团队推进项目落地，按时完成短剧内容生产任务。\n-沉淀 AI 短剧制作流程、提示词模板、角色资产、场景资产和常用工作流，持续提升团队生产效率。\n-跟踪 AI 视频、AI 影视、短剧内容平台的新工具、新玩法和行业趋势，持续优化制作方法。\n任职要求\n-熟悉短剧、网感内容、短视频平台内容逻辑，对剧情节奏、爽点、反转、情绪钩子有基本判断。\n-熟练使用一种或多种 AI 视觉 / 视频工具，如 Midjourney、Stable Diffusion、ComfyUI、Runway、Pika、可灵、即梦、剪映、CapCut 等。\n-具备一定审美能力，能把控人物造型、画面构图、色彩风格、镜头氛
