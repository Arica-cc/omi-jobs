调整\n6.        有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n7.        熟悉或愿意深度使用AI工具，具备用AI提效的主动意识\n\n工作形式：远程", "cat": "内容"}, {"id": "98", "title": "品牌策略负责人", "salary": "12K-20K", "location": "工作形式：远程", "jd": "岗位职责\n1. 从 0 到 1 设计并落地对内复制 + 对外赋能体系：标准、SOP、课程路径与材料包\n2. 把策略、案例、复盘转化为可带走的课程与工具，支撑业务与合作方独立运转\n3. 建立训后反馈与迭代机制，用真实反馈持续升级内容质量与落地效果\n4. 推动赋能动作嵌入项目节点（开工包、关键节点赋能、结项回收与课例沉淀）\n5. 与市场心智、舆情协同，把最新口径与框架同步进课程，保持体系不过时\n6. 跟踪赋能采用率与效果，输出迭代清单，对体系是否跑得起来负责\n\n任职要求\n1. 本科及以上，3 年以上企业培训、组织发展、方法论沉淀或品牌/运营赋能经验\n2. 有从 0 到 1 搭培训/赋能体系的经历，能独立完成课程产品化与落地推动\n3. 善于把复杂内容拆成可复制路径（课、包、SOP），表达清楚、结构感强\n4. 结果导向，关注采用与效果，不满足于「讲完课」\n\n加分项\n有 ToB 赋能或多组织落地经验；有品牌/策略内容转化经验；有训后效果评估体系搭建经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议", "cat": "商务 / 市场"}, {"id": "99", "title": "AI镜头生成师", "salary": "依能力与经验面议", "location": "工作形式：远程", "jd": "岗位职责\n1、负责AI电影、AI短剧全片镜头素材生产与视觉落地，统筹AI素材生成、画面品质把控、视觉风格统一全流程，对素材质量、量产效率、画面统一性全权负责；\n2、根据项目整体里程碑与分镜脚本，拆解镜头生成、素材优化、风格校准等工作任务，同步跟进项目进度，保障素材生产与整体制作节奏对齐；\n3、严格把控全片镜头画面、人物形象、场景色调、光影质感的落地品质，统一整部剧集视觉风格与品牌视觉识别体系；\n4、执行素材日常评审、瑕疵筛查、成片镜头验收，明确AI镜头素材交付标准，规避画面崩坏、人物畸形、镜头断层、风格混乱等问题，减少素材返工；\n5、对接项目总监、创意编剧、后期制作岗位，对齐画面制作标准、素材交付档期，保障素材高效量产、物料齐套交付；\n6、识别素材生成低效、画面bug频发、风格不统一等生产风险，及时优化参数与流程并闭环解决，项目结束后复盘沉淀AI镜头生成参数模板、风格规范与优质素材资产库。\n\n任职要求\n1、本科及以上学历，1年以上AI视频、AI影视镜头生产实操经验，有短剧素材量产落地经验优先；\n2、具备独立批量生产AI影视镜头素材的能力，可高效完成多场景、多镜头素材迭代输出；\n3、熟练掌握Pika、Runway、Stable Diffusion、Sora等主流AI视频工具，精通关键词撰写、参数调试、光影运镜调控；\n4、熟悉AI画面各类bug的规避与修复方法，素材良品率高，能严格把控全片视觉统一性；\n5、具备优秀的影视构图、光影审美、色彩搭配能力，适配多题材影视风格制作；6、执行力强、抗压性高，具备良好的协作能力，适配短剧快速迭代、高频量产的工作节奏。\n\n加分项\n1、有短视频、AI短剧多风格视觉焕新、画面统一落地实操经验；\n2、具备泛娱乐、影视新媒体行业从业背景，熟悉影视视觉流行风格；\n3、拥有个人AI关键词库、参数模板库、镜头素材库，量产效率极高；\n4、可配合完成LoRA模型微调、专属风格模型训练，定制化输出剧集视觉素材；\n5、擅长古风、现代、科幻、悬疑等多题材画面创作，适配全品类剧集制作。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例", "cat": "AI / AIGC"}, {"id": "100", "title": "AI成片后期精修师", "salary": "依能力与经验面议", "location": "工作形式：远程", "jd": "岗位职责\n1、负责AI电影、AI短剧成片后期制作与视觉质感升级，统筹剪辑精修、调色包装、配音音效、字幕特效全流程，对成片品质、观影质感、交付效果全权负责；\n2、根据项目量产里程碑，拆解成片剪辑、画质修复、色调统一、音频包装、物料输出等工作任务，保障后期制作与前端生产节奏同步对齐；\n3、把控全片后期落地品质，覆盖剪辑节奏、画面调色、光影精修、音频适配、字幕包装、特效风格，实现全片质感统一、品牌视觉规范落地；\n4、执行成片初审、精修复核、上线验收，明确后期交付标准与验收口径，修复AI素材瑕疵、色彩失真、节奏卡顿等问题，减少成片返工；\n5、对接项目总监、AI素材生产、运营岗位，对齐成片制作标准、交付档期、上线需求，保障成片按时保质交付上线；\n6、识别后期制作延期、画质不达标、风格不统一等风险并闭环优化，项目结束后复盘沉淀后期调色模板、剪辑规范、音频包装资产库。\n\n任职要求\n1、本科及以上学历，1年以上影视、短剧后期制作经验，有AI影视成片精修经验优先；\n2、可独立完成短剧全流程后期制作，具备完整成片交付落地能力；\n3、熟练使用PR、AE、达芬奇、剪映专业版等后期工具，精通短剧剪辑节奏与影视调色技法；\n4、熟练掌握ElevenLabs、讯飞配音等AI配音工具，可精准匹配剧情情绪与人设音色；\n5、熟悉AI视频素材特性，能快速修复各类画面瑕疵、优化成片质感；\n6、审美在线、细心严谨，抗压能力强，适配高频次、快节奏的短剧量产交付模式。\n\n加分项\n1、有短视频、AI短剧多端内容视觉焕新、质感升级落地经验；\n2、具备泛娱乐、新媒体影视行业背景，熟悉平台短剧成片审美与流量适配标准；\n3、拥有成熟的影视调色预设、剪辑模板、音效素材库，量产效率高；\n4、擅长AI素材画质修复、瑕疵优化，可最大化提升AI成片高级质感；\n5、具备多题材后期制作经验，可快速适配不同风格剧集的包装调色需求。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例", "cat": "AI / AIGC"}, {"id": "101", "title": "AI 视频制作师", "salary": "依能力与经验面议", "location": "工作形式：远程", "jd": "岗位职责\n1. 负责短视频、产品宣传视频、品牌创意视频等全类型视频的AI全流程制作，熟练运用各类AI视频工具，完成脚本落地、素材生成、剪辑合成、特效包装、调色输出等工作，产出高质量原创视频内容。\n2. 结合品牌视觉规范、产品特性及短视频平台调性，优化AI视频创作逻辑，定制视频画面风格、镜头语言、字幕包装，保障视频内容优质、风格统一、贴合品牌调性。\n3. 探索并落地各类新型AI视频生成工具、AI剪辑、AI特效、数字人、AI配音等技术，持续优化视频制作流程，提升出片效率与内容质感，实现批量、高效、精品化内容产出。\n4. 配合品牌升级、产品运营、市场推广需求，承接Web、App、短视频账号等多端视频物料制作，严格按照交付标准、档期要求完成物料输出，保障多端视频视觉统一、内容合规。\n5. 参与视频创意脚本研讨、方案评审，根据品牌规范、运营反馈、用户喜好优化视频内容，整改画面瑕疵、风格偏差等问题，持续提升视频传播力与观感体验。\n6. 沉淀AI视频制作素材库、模板库、操作规范及创作方法论，整理优质视频案例，固化品牌视频包装标准，为常态化内容产出和品牌视觉统一提供支撑。\n\n任职要求\n1. 本科及以上学历，2年以上AI视频制作、短视频剪辑、影视后期相关工作经验，熟练掌握AI视频创作全流程，有成熟的个人视频作品案例。\n2. 熟练使用主流AI视频工具，精通剪映、PR、AE等后期剪辑包装软件，掌握AI文生视频、图生视频、AI特效、AI修图、数字人视频制作等技能，能独立完成全流程视频产出。\n3. 具备优秀的视觉审美、镜头语感和色彩把控能力，熟悉短视频、互联网品牌视频的创作逻辑，能精准贴合品牌风格完成差异化视频创作。\n4. 具备高效的内容产出能力，能适配多场景物料制作需求，严格把控交付进度与成片质量，抗压能力强，可配合项目档期高效完成工作。\n5. 具备良好的沟通协作能力，能配合品牌、运营、市场团队对齐需求，精准落地创作要求，主动复盘优化制作流程，持续提升内容品质与出片效率。\n\n加分项\n1. 有互联网品牌、短视频、泛娱乐行业AI视频制作经验，参与过品牌视觉升级、多端视频物料统一落地项目者优先。\n2. 熟练掌握Runway、Pika、即梦等主流AI视频工具，具备AI视频创意优化、瑕疵修复、高质量成片打磨经验。\n3. 具备脚本撰写、创意策划能力，可独立完成视频创意+AI制作全链路工作。\n4. 有品牌全案视频、产品宣传片、矩阵短视频批量制作经验，熟悉多平台视频内容规则与传播逻辑。\n\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\n备注：倾向女性候选人跟gay", "cat": "AI / AIGC"}, {"id": "102", "title": "游戏运营", "salary": "15-25K", "location": "未明确", "jd": "岗位职责\nAI 角色与剧情运营：负责 AI 角色、世界观和剧情线的规划与上新节奏，参与角色人设、对话风格和剧情分支的设计，保持内容新鲜度。\nAI 体验调优：编写和迭代角色设定与提示词（Prompt），评估对话质量（人设一致性、沉浸感、回复质量），收集体验问题并推动模型和策略优化。\n活动策划与执行：策划节日限定角色、剧情活动、玩家共创等活动，负责方案、奖励配置、上线和复盘。\n用户运营：搭建玩家分层体系，做好新手引导、活跃提升、流失召回和核心玩家维护；挖掘高粘性玩法和优质对话案例，用于拉新和传播。\n商业化运营：设计付费角色、剧情解锁、会员、道具等付费点和定价策略，优化付费转化、ARPU 和付费留存。\n社区与 UGC 运营：运营官方社群（TG、Discord、X 等），推动玩家自建角色、分享对话和二创内容，处理玩家反馈和舆情。\n数据分析：搭建核心数据看板（新增、DAU、留存、对话轮次、会话时长、付费率、ARPU），定期复盘，推动运营策略和产品优化。\n内容安全：配合审核和技术团队，制定 AI 生成内容的安全规范，处理违规内容和越狱行为，确保产品合规。\n跨部门协作：向产品、算法和研发团队反馈玩家需求与问题，推动功能迭代；跟踪同类 AI 产品（如 Character.AI、Talkie、星野等），输出竞品分析。\n任职要求\n本科及以上学历，2 年以上游戏、AI 陪伴或互动内容产品的运营经验。\n深度使用过 AI 对话或 AI 角色类产品，对 AI 互动体验有自己的判断。\n具备一定的 Prompt 编写能力，能独立完成角色设定并调试对话效果。\n有内容策划或剧情创作能力，能理解人设塑造、剧情节奏和玩家情绪需求。\n有活动策划和商业化运营经验，对数据敏感，能熟练使用 Excel 或 SQL。\n沟通协调能力强，能推动产品、算法、研发等多方协作。\n加分项\n有 AI 陪伴、乙女 / 互动叙事类产品的运营经验\n有网文、剧本、游戏文案等创作经验\n有出海产品或 TG、Discord 社群运营经验", "cat": "运营"}, {"id": "103", "title": "经营决策主管", "salary": "20K–30K", "location": "未明确", "jd": "1.分析各业务线的经营情况、问题和机会，形成初步判断。\n2.跟踪市场、竞品和用户变化，提炼对业务有用的信息并落地成方案。\n3.参与新项目和重点事项评估，提出继续、调整、加码或暂停建议。\n4.输出分析结论和汇报材料，并跟踪后续结果。\n任职要求\n1.有业务运营、产品运营、增长、策略或分析相关经验，互联网行业。\n2.能快速理解业务，从复杂信息中抓住重点并形成观点。\n3.能结合基础数据和业务事实说明自己的判断。\n4.文字表达清楚，能够独立完成分析和汇报。\n加分项\n1.有互联网或线上业务相关经验5年以上。\n2.参与过新/老项目评估、业务调整或经营复盘的核心决策。", "cat": "商务 / 市场"}, {"id": "104", "title": "运营发展主管", "salary": "20K–30K", "location": "未明确", "jd": "1.梳理重点事项、协同需求和资源需求，形成处理建议。\n2.将确认事项拆解为责任人、时间节点、交付结果和验收标准。\n3.跟踪跨部门事项进展，发现延期或卡点并推动解决。\n4.维护事项清单，定期输出进展、问题和复盘结论。\n任职要求\n1.有项目运营、业务运营、PMO、项目管理或交付管理相关经验。\n2.能把模糊问题整理成清晰的任务和推进计划。\n3.沟通和推动能力较强，能够协调不同团队持续跟进。\n4.有优先级和结果意识，做事有条理，能够推动事项闭环。\n加分项\n1.推动过多个部门共同参与的项目，自己是核心成员或负责人。", "cat": "运营"}, {"id": "105", "title": "中级客服专员", "salary": "9K-13K", "location": "未明确", "jd": "岗位职责\n\n1. 通过线上文字处理售后咨询、客户投诉与客户关怀事项，按照公司QA标准及回复SOP提供服务。\n2. 独立处理复杂客情、情绪激烈及存在服务风险的问题，识别需升级的情形，及时反馈并跟进处理结果。\n3. 跟踪异常问题及跨团队协同事项，记录问题、处理进展与结果，推动事项闭环。\n4. 配合使用AI工具开展问题查询、资料整理、话术优化及流程跟进，对AI生成内容进行核实，判断需要人工介入的场景。\n5. 总结复杂问题处理经验，协助更新知识库、FAQ、服务话术及客服流程，完成相关客服支持与协同工作。\n\n任职要求\n\n1. 具备至少2年客服相关工作经验，能够独立处理售后问题与客户投诉。\n2. 沟通表达清晰，待人亲和，具备良好的服务意识与情绪稳定性，能够耐心处理重复咨询及投诉。\n3. 具备问题分析、总结与复盘能力，能够梳理客户诉求、判断问题优先级并持续跟进。\n4. 积极主动，具备责任心、执行力及团队配合意识，能够适应AI协同工作模式与公司排班安排。\n5. 具备基础 AI 工具使用经验（如 ChatGPT、Claude 等），能使用公司 AI 客服与内部查询工具，判断 AI 回复是否正确，并区分可由 AI 辅助和必须人工处理的场景。\n实际场景包括：\n-纠正 AI 错答：用户转人工并表示 AI 答错时，查询知识库与后台后给出正确答复，并记录错答内容。\n-补充知识库：同类问题反复未命中或转人工时，整理成标准问题、相似问法和标准回复，提交更新。\n-辅助高情绪客诉：用 AI 梳理诉求、起草回复，再由本人核对规则、订单状态和语气后发送，不直接照搬。\n-发现系统异常：发现转人工突然增多或 AI 集中答错时，及时收集案例并上报，不只逐单处理。\n-工作复盘：用 AI 整理当班问题和交接内容，人工抽查确认后再提交。\n\n加分项\n\n1. 有复杂客诉、异常升级或高情绪客户处理经验。\n2. 有知识库、FAQ、客服话术或服务流程优化经验。\n3. 有使用AI工具辅助客服工作、提升回复质量与处理效率的实际经验。\n\n备注：\n早班：10:00-22:00\n夜班：22:00-10:00\n是否需要轮班：需轮班", "cat": "客服 / 支持"}, {"id": "106", "title": "SEO运营专员 （AI工具赋能方向）", "salary": "18-35", "location": "未明确", "jd": "SEO运营专员（AI工具赋能方向）\n\n【岗位职责】\n\n1. 负责 App、品牌自建站及自媒体矩阵的海外自然搜索流量增长，围绕 Google、Bing 等主流搜索引擎制定并执行 SEO 优化策略，提升核心关键词排名、页面收录量及自然流量转化效果。\n2. 负责站内 SEO 优化工作，包括 TDK 布局、页面结构优化、关键词部署、内容更新、内链建设、结构化数据优化、爬虫抓取异常排查、收录与排名监控等，保障网站具备良好的搜索引擎友好度。\n3. 借助 AI 工具提升 SEO 内容生产效率，完成多语种关键词挖掘、长尾词库搭建、内容选题规划、文案初稿生成、多语言内容改写、内容质检与基础纠错等工作，并结合人工二次精修，确保内容符合海外用户搜索意图、原创性要求和本地化表达习惯。\n4. 负责海外站外 SEO 建设，包括优质外链资源拓展、软文发布、友链合作、品牌相关内容铺设等，持续提升网站权重、品牌曝光度及海外搜索端正向声量。\n5. 每日监控网站流量、关键词排名、收录量、点击率、跳出率、停留时长等核心数据，熟练使用 SEO 工具进行数据分析、问题归因和效果复盘，定期输出 SEO 优化报告及可落地的迭代方案。\n6. 持续关注 Google 等搜索引擎算法更新及海外 SEO 趋势，结合数据变化及时调整优化策略，降低因算法波动导致的降权、收录下降、排名异常等风险。\n7. 与品牌运营、内容、技术/前端团队协作，推动页面内容、站点结构、加载性能、索引体验及品牌搜索口碑的持续优化。\n\n【任职要求】\n\n1. 大专及以上学历，3年以上 SEO 运营实战经验，有海外站点、英文站、多语言站、内容站、品牌站或 App 推广相关 SEO 经验优先。\n2. 熟悉 Google、Bing 等海外主流搜索引擎的排名机制，掌握白帽 SEO 方法论，能够独立完成关键词策略、站内优化、内容规划、外链建设、数据分析及效果复盘。\n3. 熟练使用 Google Search Console、Google Analytics、Ahrefs、SEMrush、SimilarWeb 等常用 SEO 工具，能够独立诊断网站收录、排名、流量及页面质量问题。\n4. 具备较强的 AI 工具应用能力，能使用 ChatGPT、Claude、Gemini 或其他 AI 工具辅助完成关键词拓展、内容生产、多语言改写、数据整理和文案优化；同时具备内容判断力，能够识别 AI 内容同质化、低质化、语义不自然等问题，并进行人工校准。\n5. 具备良好的文案能力和海外用户搜索意图分析能力，能够根据目标市场用户习惯优化标题、摘要、页面结构和内容表达，提升自然点击率和页面停留表现。\n6. 具备较强的数据敏感度和执行力，能从排名、流量、收录、点击、转化等数据中发现问题，并持续推动优化闭环。\n7. 工作细致，结果导向，具备良好的跨团队沟通能力，能够与内容、品牌、技术团队协同推进 SEO 项目落地。\n\n【加分项】\n1. 有海外多语种站点 SEO 操盘经验，熟悉英文、小语种内容优化优先。\n2. 有 App SEO、ASO、品牌词优化、舆情搜索优化经验优先。\n3. 了解 SSR、站点性能、结构化数据、sitemap、robots、canonical 等技术 SEO 基础优先。\n4. 有通过 AI 工具搭建 SEO 工作流、关键词库、内容生产流程或数据看板经验优先。\n\n筛选重点\n\n1. 是否有真实海外 SEO 项目经验，而不是只做过国内平台内容运营。\n2. 是否能独立说明关键词策略、内容策略、站内优化、外链建设和数据复盘方法。\n3. 是否熟悉 Google Search Console、GA、Ahrefs、SEMrush 等工具，并能结合数据定位问题。\n4. 是否真正会使用 AI 提升 SEO 效率，而不是只会用 AI 生成文章。\n5. 是否坚持白帽 SEO，避免黑帽外链、关键词堆砌、批量低质伪原创等高风险操作。", "cat": "AI / AIGC"}, {"id": "107", "title": "代码审计工程师 （Go 后端 安全与 AI 方向）", "salary": "18-28k", "location": "未明确", "jd": "Go 后端代码审计工程师（安全与 AI 方向）\n\n 🛠 岗位职责\n\n1. 负责 Go 后端项目的代码审计与质量评估，从代码规范、架构设计、并发安全、性能隐患、数据安全及可维护性等维度开展系统审查。\n2. 深入阅读业务代码，识别 SQL 注入、越权访问、敏感信息泄露、鉴权缺陷、接口滥用、并发竞态、资源泄漏等问题，输出审计报告及整改建议。\n3. 结合业务场景评估系统安全边界，重点审查 API、数据库、缓存、消息队列、文件上传及第三方服务调用等关键链路。\n4. 对审计发现的问题进行风险分级，提供可落地的修复方案，必要时参与核心模块重构、漏洞修复及复审验收。\n5. 参与制定 Go 编码规范、安全开发规范及 Code Review 流程，推动静态扫描、依赖检测和 CI 安全门禁落地。\n6. 结合 Claude Code、Codex、Cursor 等 AI 工具建设自动化代码审查流程，提升漏洞识别、问题分类及审计报告生成效率。\n\n🎯 任职要求\n\n1. 本科及以上学历，计算机相关专业优先，3 年以上 Go 后端开发经验。\n2. 扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、内存管理及并发模型，能够识别常见并发与性能问题。\n3. 熟悉 Gin、Go-Zero、Kratos、GORM 等常用框架或组件，具备中大型后端系统开发经验。\n4. 熟悉 MySQL、Redis、Kafka/RabbitMQ 等基础设施，能够审查数据库设计、缓存策略及消息处理链路。\n5. 具备较强的代码阅读和问题定位能力，有 Code Review、代码审计、安全评审或线上故障排查经验。\n6. 熟悉常见 Web 及 API 安全风险，包括 SQL 注入、XSS、CSRF、SSRF、文件上传、鉴权绕过、越权访问和敏感数据泄露等。\n7. 能够清晰输出审计结论、风险等级、影响范围、修复建议及复审结果。\n8. 熟练使用 Claude Code、Codex、Cursor 等 AI 编程工具，能够运用 AI 提升代码审查和漏洞分析效率。\n\n✨ 加分项\n\n* 具备网络安全、渗透测试、SDL 安全开发或企业代码安全审计经验。\n* 熟悉 OWASP Top 10、CWE、CVSS 等漏洞分类和风险评估标准。\n* 使用过 Semgrep、SonarQube、CodeQL、Gosec、Trivy、Snyk 等代码与依赖安全扫描工具。\n* 具备高并发、微服务、分布式系统或支付、账户、权限等高风险业务开发经验。\n* 熟悉 Docker、Kubernetes、Linux 及 CI/CD，能够排查配置、镜像、依赖和部署环节的安全风险。\n* 有漏洞挖掘、攻防演练、CTF、SRC 漏洞提交或安全认证经历。\n* 有基于 LLM 搭建自动化 Code Review、漏洞识别或审计报告生成工具的实际经验。\n\n 🤝 我们期待的你\n\n👉 **代码审查能力强**：能够快速读懂陌生项目，识别真正影响业务安全和稳定性的核心问题。\n\n👉 **安全意识敏锐**：不只关注代码能否运行，也关注权限边界、数据安全、攻击风险和异常场景。\n\n👉 **结果导向**：能够独立完成审计、报告、整改推动及复审闭环，而非只发现问题。\n\n👉 **拥抱 AI 提效**：善于使用 AI 工具提升审计效率，同时能够判断和验证 AI 输出的准确性。", "cat": "AI / AIGC"}, {"id": "108", "title": "数据分析师/游戏数据运营", "salary": "15k-30k\n优秀可谈", "location": "未明确", "jd": "学历要求严格\n最好是硕士，必须有游戏行业经验，简历优先看有游戏项目经验  + 懂游戏产品分析，能用数据推动产品和运营优化的人才\n岗位职责：\n1、负责游戏项目的数据分析与数据运营工作，围绕新增、活跃、留存、付费、LTV、玩法参与、活动效果等核心指标，持续监控项目经营情况，及时发现数据异常和业务问题。\n2、深入参与游戏产品调优，结合玩家行为数据，对新手流程、核心玩法、养成系统、关卡/副本体验等进行分析，定位流失点、转化断点和体验问题，并输出可落地的优化建议。\n3、负责版本、活动和商业化专项分析，包括版本前后效果对比、活动参与与转化分析、礼包/商品表现分析、付费用户分层、付费路径分析、渠道用户质量分析等，为产品迭代和运营决策提供数据支持。\n4、参与游戏数据分析体系建设，包括埋点方案设计、日志上报验收、指标口径定义、数据质量检查、看板搭建与维护，保障数据可用、口径清晰、分析结果可信。\n5、协同运营、研发团队推进问题闭环，将数据结论转化为产品优化方向、运营动作，并跟进上线后的效果验证。\n岗位要求：\n1、本科及以上学历，1–5年游戏数据分析经验（必须有游戏行业经验），RPG、卡牌、二游等品类经验优先。\n2、热爱游戏，平时有较多游戏体验，能够理解游戏系统、玩家成长、付费设计、活动节奏和版本迭代逻辑；能结合游戏内容判断数据变化背后的原因；\n3、具备良好的数据敏感度和业务判断力，能够从留存、漏斗、付费、活跃、玩法参与等数据中发现问题；\n4、熟练使用 SQL、Excel，能够独立完成数据提取、清洗、统计和分析工作；有建模/算法能力为加分项；\n5、具备数据可视化和看板搭建能力，熟悉数数 BI 平台者优先；\n6、具备较强的沟通表达能力，能够把复杂数据问题讲清楚，输出结构化分析结论，并推动运营、研发团队形成共识和行动。", "cat": "技术 / 数据"}, {"id": "109", "title": "高级服务器开发工程师", "salary": "高级，20-30k", "location": "未明确", "jd": "岗位定位\n负责 RPG 游戏服务端业务模块开发及运行维护。要求具备实际的 Go + TCP Socket RPG 游戏服务端项目开发经验，能够独立完成业务模块从需求分析、编码开发、客户端联调到上线交付的完整流程。\n岗位职责\n1、使用 Go 开发和维护 RPG 游戏服务端，根据项目需求独立完成角色、背包、任务、活动、公会、排行榜等业务模块，负责业务逻辑、接口及数据结构设计。\n2、基于 TCP Socket 长连接实现和维护客户端与服务端通信，处理连接管理、消息编解码、消息路由、心跳检测、超时及断线重连等逻辑。\n3、使用 MySQL、Redis 完成玩家数据持久化与缓存设计，处理并发更新、重复请求及异常中断等场景，保障玩家数据的正确性和一致性。\n4、运用 Go 并发编程机制处理业务请求与后台任务，排查并解决数据竞争、死锁、协程泄漏及性能瓶颈等问题。\n5、与策划、Unity3D 客户端及测试团队协作，明确功能规则、通信协议和异常处理逻辑，完成联调、测试问题修复及版本交付。\n5、在 Linux 环境下完成服务部署与运行维护，通过日志及必要的分析工具定位、处理服务异常，跟进问题修复和验证。\n7、使用 Git 进行代码版本管理，维护必要的模块设计、接口及部署文档，参与代码评审。\n任职要求｜必须满足\n1、3 年及以上游戏服务端开发经验，具备实际使用 Go 开发 RPG 游戏服务端的项目经历。\n2、具备 Go + TCP Socket 长连接的实际开发经验，熟悉连接管理、消息编解码、消息路由、心跳检测及断线重连机制，能够说明相关实现方案及异常处理方式。\n3、能够独立完成游戏业务模块开发，至少独立承担过角色、背包、任务、活动、公会、排行榜等模块之一，具备从需求理解、开发联调到交付验证的完整实践。\n4、熟悉 Go 并发编程，掌握 goroutine、channel、锁及常用同步机制，能够处理并发访问、数据竞争、死锁和协程生命周期管理等问题。\n5、熟悉 MySQL、Redis，具备玩家数据持久化、缓存读写及并发一致性处理经验，能够说明实际项目中的数据保存策略与异常处理方案。\n6、熟悉 Linux、Git，能够独立完成服务部署、日志分析及常见故障排查。\n7、具备良好的沟通与交付能力，能够与策划、客户端及测试团队协作，主动识别需求边界和开发风险，推进所负责模块按节点交付。\n优先考虑\n1、有 RPG 游戏正式上线或持续运营经验，参与过线上问题处理。\n2、有 RPG 游戏经济、道具发放、交易、支付、战斗或跨服相关模块开发经验。\n3、有服务端性能优化、压测或玩家数据异常修复经验，能够结合实际问题说明处理过程及结果。\n4、熟悉 Unity3D 客户端与 Go 服务端联调流程。", "cat": "技术 / 数据"}, {"id": "110", "title": "中高级运营", "salary": "15K\n经验丰富者视能力定岗定薪", "location": "远程", "jd": "岗位职责：\n1、玩家阵地精细化运营：统筹平台、媒体、论坛等核心玩家阵地的生态维护，制定巡查机制与垃圾广告治理方案，牵头基础用户答疑及高价值问题闭环处理，提升用户活跃度与阵地口碑；\n2、数据驱动运营优化：负责后台核心数据跟踪、多维度分析（含用户行为、内容效果、活动转化等），输出结构化数据报告并提炼可落地优化建议，支撑运营策略迭代；\n3、运营活动统筹执行：协助策划阶段性运营活动，主导活动后台用户管理、页面生命周期管控及发奖全流程统筹，联动跨部门推进活动落地，对活动参与度、留存率等关键指标负责；\n4、海外内容生态搭建：建立海内外热门单机游戏更新动态的常态化监测机制，深度挖掘优质内容素材，指导并协同内容团队完成素材筛选、本地化适配与排版优化，提升内容传播力。\n\n岗位要求\n1、经验与学历：2-3年游戏行业相关经验，接受211/985本科及以上应届生（需具备丰富的游戏运营相关实习经历）；\n2、游戏认知：深度PC单机游戏玩家，精通海内外单机游戏圈生态、热门IP动态及圈层黑话，具备玩家社群/论坛核心用户或运营经验，能精准洞察玩家需求；\n3、核心能力：具备较强的策略思维与统筹协调能力，执行力扎实且注重细节，熟练运用Excel（VLOOKUP、数据透视表等）及常用数据分析工具，能独立完成数据复盘与报告输出；\n4、语言与视野：英语CET-4及以上水平，可独立阅读海外游戏更新日志、社群讨论等内容，具备国际化内容视野，能快速捕捉海外游戏圈热点并转化为运营动作；\n加分项：有游戏社群从零到一搭建或活动策划落地经验者优先；具备基础图文排版设计能力（如熟悉PS、秀米等工具）者优先。", "cat": "运营"}, {"id": "111", "title": "初级运营专员", "salary": "10K", "location": "远程", "jd": "岗位职责\n1.        负责平台、媒体、论坛等玩家阵地的日常巡查、垃圾广告清理与基础用户答疑；\n2.        协助数据分析，跟踪后台数据，整理数据日报；\n3.        协助运营活动开展，负责后台用户管理、活动页面上下架及发奖流程执行；\n4.        收集海内外热门单机游戏的更新动态，协助内容团队进行图文素材搬运与排版。\n岗位要求\n1.        1-2年海外互联网运营经验或211本科应届毕业生；\n2.        骨灰级PC游戏玩家，熟知单机游戏圈的黑话与热点，有重度海外游戏玩家社群论坛水友经验；\n3.        执行力极强，踏实细心，熟练使用Excel等基础办公软件；\n4.        英语CET-4以上，能借助翻译软件无障碍阅读海外游戏更新日志及社群内容。", "cat": "运营"}, {"id": "112", "title": "双语技术支持专家/中英文客服", "salary": "10-15K", "location": "1、远程", "jd": "岗位职责\n 1. 熟练使用中英文，快速响应全球用户的技术求助，并提供有效解决方案；\n 2. 提炼高频常见问题，撰写剪辑并持续维护通俗易懂的双语FAQ文档；\n 3. 针对尝试订阅失败或申请退款的用户，进行积极的沟通干预与指导，降低付费环节的技术流失率；\n 4. 将用户报错转化为结构化的技术工单，协助研发团队快速定位代码层面的Bug并督促修复进度。\n 岗位要求\n 1. 极度了解PC软硬件运行原理与Windows系统架构（尤其是注册表、运行库、各主流杀软机制），有技术客服、IT运维或PC单机游戏发行技术支持经验；\n 2. 情绪稳定，极具耐心与服务意识，能承受大量重复性的基础咨询及偶尔的负面情绪宣泄；\n 3. 中英双语文字表达专业且富有温度，能熟练使用各类客诉管理软件系统。", "cat": "客服 / 支持"}, {"id": "113", "title": "社媒运营", "salary": "12k-22k", "location": "未明确", "jd": "必须有游戏行业经验\n必须提供过往曾运营的社媒账号链接、负责账号的具体时间\n\"学历：本科及以上  \n岗位职责\n活动策划与执行：独立负责平台活动（节日活动、版本活动、拉新促活等）及社媒、社群活动的全流程，包括方案设计、资源协调、落地执行与效果复盘；\n社媒运营：负责官方账号的内容策划与日常运营，维护账号人设，提升粉丝量与互动率；\n社群运营：策划社群专属活动与玩法，提升社群活跃度与用户归属感；\n用户增长与维系：围绕拉新、促活、留存设计运营策略，搭建用户激励与成长体系，提升核心用户粘性；\nUGC 生态与 KOC 合作：策划二创激励、同人征集等 UGC 活动，联 KOC 进行内容传播与用户拉新；\n数据复盘：跟踪活动效果与用户数据（活跃、留存、转化等），定期输出复盘报告，持续迭代运营打法；\n\"任职要求\n3 年以上二次元、游戏或泛娱乐平台的运营经验；\n有从 0 到 1 搭建社群或社媒账号的成功经历；\n独立运营过有一定粉丝规模的社媒账号；\n熟悉B站、抖音或小红书等主流平台的内容生态与运营玩法；\n有完整的运营活动策划与执行经验，能提供可量化的成功案例（活动参与量、拉新量、互动数据等）；\n具备数据意识，能独立完成活动数据分析与复盘；\n文案功底扎实，有创意、执行力强，具备良好的跨部门沟通协调能力；\n加分项：深度理解二次元文化，熟悉圈层用户的喜好、语言和梗。", "cat": "运营"}, {"id": "114", "title": "游戏平台运营", "salary": "12-18k", "location": "未明确", "jd": "• SDK迭代的运营对接\n跟进SDK版本更新，负责运营侧需求收集、验收与问题反馈；参与接入文档的编辑与维护；推动接入问题排查修复，降低因此产生的转化流失与用户投诉。\n • 跨部门推进与落地\n主动对接产品、技术、客服团队，推动需求排期上线；清晰表达需求背景、目标与优先级；跟进关键节点，遇阻力主动协调。对最终结果负责，而不仅仅是提出建议。\n • 推荐与排序机制优化\n维护平台推荐位及榜单排序逻辑，优化资源位分配效率；依据数据表现动态调整曝光权重，让流量流向高转化产品，削减无效曝光。\n • 用户负反馈治理\n分析退款、差评与高频投诉根因；识别冲动消费、价格敏感等用户行为特征并反哺定价与活动策略；监控负反馈趋势，对改善结果负责。\n • 产品理解与选品评估\n持续跟踪市面游戏产品，熟悉主流品类、玩法与题材趋势；对拟引入产品完成质量与商业化潜力评估；结合平台用户画像输出选品与标签化建议；定期对标竞品平台的活动形式与资源位机制。\n我们希望你具备：\n • 3年以上游戏、内容或平台类运营经验\n • 有完整的活动策划、执行与收入复盘经验，能独立承接全流程\n • 对数据高度敏感，能独立分析并得出可执行结论\n • 熟练使用Excel或同类数据分析工具\n • 具备较强问题拆解能力，能从数据中定位核心矛盾，而非停留在表象\n • 熟悉市面主流游戏产品与品类趋势，有基本的产品鉴别与商业化判断力\n • 以结果为导向，不满足于”完成任务”\n加分项\n • 有单机游戏 / Steam类平台、发行或分发平台经验\n • 有推荐算法、曝光权重或资源位机制的优化实践\n • 有SDK接入、渠道包管理等技术对接经验\n • 熟练使用SQL、BI或AI工具提升分析与运营效率\n • 有跨团队项目推进或小团队管理经验", "cat": "运营"}, {"id": "115", "title": "资深SEO运营/自动化增长", "salary": "20K", "location": "远程", "jd": "岗位职责\n1.        挖掘建立PC端游戏工具平台SEO矩阵；\n2.        协同技术研发团队完成程序化SEO需求。确保自动化生成高转化率的多语种落地页，并完成主要引擎的抓取收录；\n3.        主导全站点的技术SEO优化，监控并优化页面跳出率，提升在主要引擎的核心关键词占比和排名；\n4.        针对高热度关键词，策划并实施海量域名站群建设，运用泛解析、泛目录等技术快速截流，获取游戏媒体与相关论坛的引流。\n岗位要求\n1.        本科及以上学历，具有5年以上SEO优化经验，有大型软件分发站、游戏门户或电商平台优化经验者为必选项；\n2.        精通GSC、Ahrefs等工具。熟练掌握国内外各类蜘蛛池搭建与快速收录机制，有千万级页面收录与应对搜索引擎核心算法打击的实战规避经验；具备百度、Google等主流搜索引擎双端黑白帽SEO实操经验者优先。\n3.        具备极强的技术理解力，熟悉前沿的程序化SEO逻辑和利用AI工具批量生成高质量网页内容的流程；\n4.        数据导向，能清晰核算SEO带来的自然流量在转化漏斗中的最终价值，抗压能力强。", "cat": "商务 / 市场"}, {"id": "116", "title": "AI 视频设计师", "salary": "15000-20000", "location": "远程", "jd": "岗位职责：\n1、负责 AI 动漫短视频、AI 游戏介绍动画等内容全流程制作\n2、根据剧本完成分镜构思、AI 视频生成、配音配乐、剪辑及交付\n3、把控人物一致性、画面风格、剧情节奏和镜头衔接\n4、修复人物崩坏、穿模、画面抖动等问题\n任职要求：\n1、熟悉 AI 视频、AI 动漫制作流程\n2、必须熟练使用 ComfyUI / WebUI 工具和 Wan 2.2、LTX 2.3 等 AI 开源视频模型——不熟悉开源视频模型的请勿投递\n3、能够自行搭建工作流，或根据通用工作流添加节点，搭建特殊的动作迁移、视频转绘、视频去水印等视频编辑工作流\n4、能独立完成分镜设计、视频提示词搭建、生成视频及配音等制作\n5、必须提供AI视频作品集\n加分项：\n1、有 Wan 或 LTX 的视频 LoRA 制作经验\n2、有其他图片 LoRA 训练经验\n3、有 AI 语音合成经验（ElevenLabs、GPT-SoVITS 等）\n4、有二次元 / 卡牌 / RPG / 美女向 / 男性向内容视频经验\n5、有海外市场（中华圈、韩国、日本）视觉偏好理解\n6、曾独立主导某款漫剧或短剧作品的完整宣发流程", "cat": "AI / AIGC"}, {"id": "117", "title": "技术项目经理（游戏运维中台方向）", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责\n一、负责游戏运维中台建设项目的推进，制定项目计划、跟进研发排期、保障按期交付。\n二、对接研发、发行、平台、运维等多方，梳理业务流程与需求，组织方案评审。\n三、推动合服开服、版本发布、生产变更管控、监控告警等运维场景的线上化与流程卡口建设。\n四、识别并推动解决项目中的技术卡点与资源瓶颈。\n五、推动中台在各游戏项目落地使用，收集反馈并持续迭代优化。\n六、探索 AI 工具在项目管理与运维流程中的应用，提升团队效率。\n七、建立并维护配套流程规范（SOP），推动系统与制度协同生效。\n\n【任职要求】\n一、本科及以上学历，计算机相关专业优先。\n二、1 年以上游戏行业技术类项目管理经验，有游戏内部系统或工具平台的交付经历。\n三、熟悉游戏运维场景（版本发布、合服开服、停服维护、热更新等），具备技术理解能力，能读懂技术方案、与研发有效沟通并评估工作量。\n四、熟悉并能实际运用 AI 工具解决工作问题，有用 AI 提效或搭建自动化流程的实践经验。\n五、具备多方协调推动能力，能对接研发、发行、平台、运维等团队达成目标；对流程敏感，善于发现重复性人工操作与易错环节并推动系统化解决。\n六、责任心强，能适应项目关键节点及线上紧急事件支持；后续有出国工作机会\n\n【加分项】\n一、熟悉 Jira、GitLab、CI/CD、监控告警等工具链。\n二、具备代码或脚本编写能力。\n三、有内部工具在团队成功推广落地的经验。\n四、有 AI Agent、工作流自动化相关实践。", "cat": "测试 / 运维"}, {"id": "118", "title": "互动影游主创 / 导演 （影视体验 / 创作统筹）", "salary": "25–35K", "location": "未明确", "jd": "岗位定位：以沉浸式影视体验为核心，把故事、表演、镜头和互动组织为完整作品，对整体创作体验负责。\n\n1、确定题材、故事方向、人物关系和视听风格，与叙事策划共同打磨故事大纲及关键抉择。\n2、将剧本转化为文字与图像分镜，设计角色调度、视角、构图、运镜和情绪节奏，明确AI制作依据。\n3、从导演视角确定互动切入、停顿与恢复方式，让选择发生在具有情绪或戏剧意义的时刻，保持观看流畅。\n4、审核角色表演、生成镜头、剪辑及声音，判断不同路径的情绪铺垫和人物反应，统筹补镜与修改。\n5、主持可玩版本评审，结合观看和操作体验调整演出，控制场景、镜头与分支规模，完成首作创作验收。\n6、参与成人向内容定位与商业化评审，判断不同受众为何关注、持续观看和付费，评估内容承诺与实际体验的一致性。\n\n交付与边界：创作方案、图像分镜、演出标准及成片审核；负责影视表达与整体取舍，分支细稿和条件表由叙事策划负责。\n\n任职要求：\n1、有完整叙事影像的主创、编导或导演经历，能展示从剧本理解、分镜到成片的本人贡献。\n2、具备扎实的镜头语言、人物表演、剪辑节奏和审美判断，能说明具体镜头为何成立。\n3、理解互动影像的玩家视角，能判断何时给予选择、哪些信息应当呈现、如何在等待和跳转中维持情绪。\n4、有AI影像制作实践，能评估生成可行性、跨镜头连续性和返工代价，提出可执行修改意见。\n5、能统筹小团队创作、组织试玩并落实反馈，在制作约束下保持关键场面的表现力。\n6、理解R18成人影像（包括AV／porn）的类型、受众偏好与付费动机，能分析感官吸引、欲望投射、亲密关系幻想和叙事期待的差异，并形成角色定位、内容分级与演出方向判断。\n\n作品要求：\n提交1–2部叙事作品，附一场戏的分镜与成片、本人贡献说明。可补充互动作品或交互改编方案。\n\n面试重点：\n把一场戏改编为互动片段，说明视角、选择时机、等待演出及结果镜头。\n\n加分项：\n互动电影导演、叙事游戏演出或完整AI短片经验。\n\n成人向评估：\n提交非露骨的类型分析，说明目标受众、吸引力、付费理由及证据，区分个人偏好与用户需求。", "cat": "内容"}, {"id": "119", "title": "AIGC影像制作师 （连续影像 / 剪辑合成）", "salary": "根据实际能力面议", "location": "未明确", "jd": "岗位定位：将导演分镜制作成可接入互动作品的视听片段，对影像执行质量及基础后期交付负责。\n\n1、建立角色定妆、场景和关键帧资产，依据分镜完成AI图像与视频生成，控制表演、构图和镜头运动。\n2、解决角色、服饰、道具、光影及动作连续性问题，完成候选筛选、局部修正、合成和补镜。\n3、根据选择结果制作必要的反应与分支变体，保证人物状态、叙事线索和情绪变化准确，维护共享素材与差异版本。\n4、完成短篇原型的剪辑、基础调色、字幕、对白清理与音效编排，处理选择等待、片段跳转及分支汇合的音画衔接。\n5、按节点和版本交付成片、字幕、分轨及工程，在可玩版本中复核效果；复杂合成或专业混音按需求拆包协作。\n\n交付与边界：参考资产、镜头与分支成片包、基础后期工程；执行导演创作标准，反馈制作风险并完成修改。\n\n任职要求：\n1、有连续叙事AI影像作品，能独立完成从参考资产、生成到基础剪辑的制作流程，并说明本人贡献。\n2、熟练使用AI图像与视频工具，能稳定管理跨镜头角色和场景一致性，并适配项目既定制作流程。\n3、理解镜头语言、光影、动作和表演，能识别生成瑕疵并提供可用修正方案。\n4、熟练使用一种主力剪辑工具，具备基础调色、对白处理、字幕及分轨输出能力。\n5、理解非线性片段的连续性要求，能按节点、状态与版本归档，在实际交互播放中检查成片并迭代。\n6、能够接受并专业处理R18成人向项目，理解不同内容分级的视觉表达和受众预期，能准确执行导演要求并管理分级素材版本。\n\n作品要求：\n提交60–120秒连续叙事片段及修正前后对照，附本人后期工程；补充同一场景的不同反应或分支衔接样例。\n\n面试重点：\n验证角色一致性、表演筛选与两个分支间的剪辑和声音衔接。\n\n加分项：\n互动影像制作、合成、声音设计或可复用AI工作流经验。", "cat": "AI / AIGC"}, {"id": "120", "title": "AI 短剧编剧", "salary": "18-22k\n优秀可谈", "location": "远程", "jd": "岗位职责：\n1. 负责竖屏短剧的选题、大纲、分集结构及剧本细写，运用 LLM 工具辅助创作，题材方向以情感向、强冲突题材为主，具体项目内容以沟通为准；需具备可流畅使用相关工具的设备。\n2. 输出可直接进入制作的场次脚本，明确每场的事件、人物动作、对白、情绪走向及环境描述，为导演设计镜头提供依据。\n3. 建立并维护人物文字设定，提供准确、统一的外观描述，支持角色资产生成及跨镜头一致性控制。\n4. 根据竖屏短剧的观看特点设计每集钩子、反转及结尾悬念，保持情节吸引力与情绪推进。\n5. 在创作阶段考虑 AI 生成的可行性，针对复杂动作、多人互动、精细道具操作及长镜头连续对话等难点调整情节表达，减少后续制作返工。具体镜头方案由导演负责。\n任职要求：\n1. 有完整的短剧、网文、漫剧或影视剧本作品，能够提供成稿。\n2. 理解竖屏短剧的结构逻辑，能够把握强钩子、快节奏及高密度反转，理解其与长剧写法的区别。\n3. 熟练使用 LLM 辅助剧本创作，具备独立判断与修改能力，能够对 AI 生成内容进行筛选、重写和完善，而非直接提交 AI 稿；有本地生成环境、能够自行验证镜头者优先。\n4. 对项目题材方向持开放态度，具体内容以沟通为准。\n加分项：\n1. 有已上线短剧作品，能够提供创作过程文件及交付记录。\n2. 有 ACGN、二次元或漫剧领域的内容积累。\n3. 具备本地生成环境，能够自行验证剧本相关镜头的生成可行性。\n作品要求：\n提交一集完整剧本及对应人物设定。剧本需包含场次划分、人物动作、对白与情绪走向，人物设定需包含用于保持跨镜头一致性的外观描述；同时注明本人具体分工、使用的 AI 工具及对生成内容所做的修改。\n※评估将关注剧本的 AI 制作可行性，仅提交成稿、未说明创作过程的，将影响评估。", "cat": "AI / AIGC"}, {"id": "121", "title": "AI 短剧剪辑师", "salary": "18-26k\n优秀可谈", "location": "远程", "jd": "岗位职责：\n1. 从大量 AI 生成素材中筛选可用镜头，完成竖屏短剧的粗剪与精剪。\n2. 针对 AI 素材碎片化、跨镜头色调漂移、帧率不统一等问题，通过跳切、变速、局部放大、遮挡等剪辑手段修补缺陷，提升成片可用性。\n3. 完成全片调色与画面统一，使不同批次生成的素材在整体视觉上保持一致。\n4. 独立承担成片全部声音工作，包括 AI 配音生成、角色跨集及跨镜头音色统一、对白口型与语气匹配、音效铺设、BGM 选配、AI 原生音轨精修及整体混音。\n5. 根据竖屏短剧的观看特点控制节奏，通过画面与声音配合推进情绪，提升观众留存及完播表现。\n6. 向 AI 制作端反馈需重新生成的镜头，明确具体缺陷、修改方向及使用需求。\n任职要求：\n1. 自备高性能设备，显卡需达到 RTX 4090 级别及以上，显存 24G 起。\n2. 具备 AI 声音处理能力，能够独立完成配音生成、角色音色统一、音轨精修及混音等全片声音工作。此项为硬性要求，须在入职前具备。\n3. 熟练使用 Premiere Pro 或 DaVinci Resolve，能够独立完成从素材整理到成片输出的制作全流程。\n4. 有竖屏短剧、AI 短剧或漫剧的实际成片经验。\n5. 具备视听叙事能力，理解镜头衔接、节奏控制及情绪铺垫，能够根据素材情况调整剪辑方案。\n6. 熟悉 AI 后期工具，能够实际运用补帧、超分、去闪烁、抠像等多项处理方法。\n7. 对项目题材方向持开放态度，具体内容以沟通为准。\n加分项：\n1. 有作品上线数据，关注完播率、3 秒跳出率等指标，能够说明剪辑调整对数据表现的影响。\n2. 有日更或高频交付经验，能够说明实际单日产出量。\n3. 熟悉主流 AI 配音工具，了解各自在音色、情绪表达及中文语感上的差异。\n4. 有声音设计或混音的系统训练背景。\n硬性要求：\n1. 具备独立完成全片 AI 声音处理的能力。2. 自备高性能设备：（RTX 4090 级别及以上、显存 24GB 起）。\n作品要求：\n提交一条不少于 60 秒、画面后期与声音均由本人完成的成片，附原始 AI 素材与成片效果对照，说明具体补救处理，并注明配音工具、角色音色统一方法及音效、BGM 的选用思路。\n※未提供声音制作说明的作品不予评估。", "cat": "AI / AIGC"}, {"id": "122", "title": "AI 创作者平台运营", "salary": "25–35K", "location": "未明确", "jd": "岗位职责\n1. 参与产品早期规划，制定创作者入驻、内容发布与审核、作者扶持、订阅和单购等运营规则。\n2. 负责平台冷启动，招募种子创作者，规划初期内容供给及创作者激励机制。\n3. 制定用户增长、海外推广和付费转化方案，持续优化注册、创作、发布、内容消费和复购。\n4. 与产品及研发协作，提出创作者管理、内容审核、活动和推广工具等需求，并参与上线验收。\n5. 跟踪创作者活跃、内容供给、用户留存、付费转化和收入表现，定期复盘并推动优化。\n6. 配合相关团队完善AI内容标识、内容审核、投诉和下架等运营流程。\n\n任职要求\n1. 有内容平台、创作者平台、UGC社区、订阅产品或商业化运营经验，主导过上线、冷启动或增长项目。\n2. 能独立制定运营方案，并推动产品、研发、内容等团队协作落地。\n3. 熟悉创作者招募与成长、用户增长、订阅或单购等付费模式。\n4. 了解AI图片、AI视频或短剧创作；有成人内容或AI内容平台经验者优先。", "cat": "AI / AIGC"}, {"id": "123", "title": "产品数据分析师", "salary": "22–30K", "location": "未明确", "jd": "岗位职责\n1. 与产品、运营和研发共同建立用户、创作者、内容、付费、收入及AI创作成本等核心指标口径。\n2. 规划产品埋点、事件追踪和数据看板，跟进需求落地，并完成埋点及数据质量验收。\n3. 分析访问、注册、创作、发布、关注、订阅、单购、续费和复购等关键路径，定位转化和留存问题。\n4. 分析AI生成任务量、成功率、失败退款、Token消耗及模型调用成本，评估业务成本和收入表现。\n5. 分析推广渠道、创作者激励和运营活动效果，定期输出经营报告及优化建议。\n6. 协助核对充值、钱包消费、平台收入、退款、作者收益和提现等经营数据。\n\n任职要求\n1. 有互联网产品、内容平台、游戏或商业化数据分析经验，独立负责过分析项目或指标体系建设。\n2. 熟练使用SQL，掌握Python及常见BI工具，能独立完成数据分析和可视化。\n3. 熟悉产品埋点、指标体系、漏斗、留存、同期群分析及A/B测试。\n4. 理解订阅、单购、钱包、虚拟货币、平台分成和退款等业务模式。\n5. 有AI产品、海外内容平台、UGC社区或创作者平台经验者优先。", "cat": "技术 / 数据"}, {"id": "124", "title": "渠道拓展专员（国内流量渠道方向）", "salary": "12-15k＋渠道业绩提成\n（具体金额另行商定）", "location": "远程\n5. 工作方式：适应远程线上协作，熟练使用 Telegram 等即时通讯工具开展工作，响应及时、执行力强、结果导向。", "jd": "岗位职责\n1. 渠道开发与建联：以国内渠道为主、兼顾海外，主动寻找并接洽各类流量渠道，包括但不限于广告联盟／网盟、站长及站群流量主、垂直媒体站点、QQ／微信／Telegram 等社群与频道、KOL 及导流账号等，持续扩充渠道储备池。\n2. 商务谈判与合作落地：与渠道方洽谈合作模式与价格（CPT 包断、CPS、CPM 等），索取并核验对方流量构成与后台数据佐证，推动合作条款确认与广告位上刊测试。\n3. 渠道数据跟进与质量评估：跟进合作渠道的曝光、点击、注册、付费等数据表现，甄别异常流量与假量，参与回本测算，输出渠道留用、优化或下架建议。\n4. 渠道关系与资源台账维护：维护合作渠道的长期关系并定期复盘合作效果；维护渠道资源台账（渠道信息、报价、数据表现、对接记录），保证资源可沉淀、可交接。\n5. 新人带教与方法沉淀：负责新入职拓展人员的培训与带教，输出建联话术、谈判要点、拓量 SOP 等标准化文档，指导新人在规定周期内独立完成渠道开发。\n6. 配合团队整体工作：协助上级完成渠道报价收集与对比、合作方案整理、结算对接及周期性汇报。\n任职要求\n（一）硬性要求\n1. 行业经验：1 年以上国内流量渠道开发、媒介商务或广告渠道 BD 经验，熟悉 CPT、CPS、CPM 等主流合作模式及市场行情。\n2. 自带流量资源：拥有可立即对接启用的渠道资源（站长、联盟、社群、媒体任一类别均可）；投递及面试须提供资源清单、过往合作案例与量级数据。\n3. 带教能力：有带新人或带小组的经验，能够将个人方法整理为话术、SOP 等文档并指导他人执行。\n4. 专业能力：商务谈判与沟通推进能力强，对数据敏感，能独立完成渠道从建联到上刊的全流程。\n5. 工作方式：适应远程线上协作，熟练使用 Telegram 等即时通讯工具开展工作，响应及时、执行力强、结果导向。\n（二）优先条件（加分项）\n1. 有男性向／成人向产品、H5 游戏或泛娱乐类产品的渠道投放经验；\n2. 有站群、广告联盟后台的实际操作经验；\n3. 有渠道团队管理经验；\n4. 有海外流量渠道经验或资源，可兼顾海外渠道对接（具备基础英文读写能力更佳）。", "cat": "商务 / 市场"}, {"id": "125", "title": "AI买量小游戏策划", "salary": "18-28K（优秀候选人可谈）", "location": "未明确", "jd": "岗位职责\n \n1. 负责出海买量小游戏的AI原生策划与独立落地，借助AI完成从买量素材洞察、玩法原型、需求拆解、内容生产到原型验证的全链路工作，独立产出可验证Demo。\n​\n2. 使用AI Agent、AIGC工具搭建可复用策划工作流，自动化生成玩法原型、关卡、数值、脚本、买量概念稿，提升小游戏从idea到可测试版本的迭代效率。\n​\n3. 主导买量小游戏核心玩法、数值、关卡、系统设计，对齐买量素材逻辑，兼顾素材吸量能力、产品留存与商业化变现效果。\n​\n4. 持续跟踪前沿AI模型、AIGC生产方案与海外买量市场趋势，结合小游戏业务做落地验证，沉淀团队AI生产规范与素材-玩法联动方法论。\n​\n5. 协同美术、研发、投放团队，推进项目快速上线与版本迭代；能够独立用AI产出原型、素材初稿，支撑买量快速测品。\n \n任职要求\n \n1. 2–8年游戏策划经验，熟悉出海买量小游戏、合成/消除/模拟/超休闲品类优先，有买量测品项目经验加分。\n​\n2. 深度实操各类AIGC、AI Agent工具；具备独立用AI完成小游戏原型搭建、Demo快速产出、自动化内容生产落地经验，可以单人完成从创意到可玩原型的闭环。\n​\n3. 优秀的玩法设计、逻辑拆解能力，强数据敏感度，熟悉买量逻辑，能从投放素材反推玩法，具备商业化变现思维。\n​\n4. 学习能力强，对AI重构小游戏买量生产模式有强烈热情，自驱力强，适应快速测品、高频迭代的工作节奏。\n​\n5. 拥有出海小游戏完整项目、买量测品实战经验优先。", "cat": "AI / AIGC"}, {"id": "126", "title": "产品经理", "salary": "20-25k", "location": "远程", "jd": "岗位职责：\n1.平台基础体系：负责注册登录、创作者入驻、用户成长、积分/TOKEN体系、活动中心、社区互动等核心模块的产品规划与迭代\n2.商业化主导：主导平台商业化产品设计，包括订阅/付费体系、虚拟货币/充值、权益商城、创作者分成与变现路径优化等，对ARPU、付费率、LTV等核心商业指标负责\n3.数据驱动：基于用户分层和漏斗分析，识别增长与变现机会，输出可落地的产品方案，与数据分析师协同建立指标体系\n4.跨部门协同：联动游戏、技术、制作平台、运营、客服等团队，保持高效协作\n5.行业洞察：持续研究OnlyFans等创作者平台和TapTap、小黑盒等头部社区的产品形态，将成熟方法论本地化落地；参与后续平台从0到1的规划\n岗位要求：\n1.本科及以上，5年以上互联网/游戏产品经验，有平台/会员/商业化方向相关经历\n2.有完整的平台型产品落地案例（用户体系/积分/会员/付费体系任一深度经验）\n3.数据能力扎实：能独立用BI工具进行分析，对核心指标（DAU/留存/ARPU/LTV）有清晰认知\n4.对创作者经济、AI内容生成和二次元/游戏社区有深度用户级理解\n5.具备从0到1搭建产品体系的耐心，能在不完善的环境下推动事情落地", "cat": "产品"}, {"id": "127", "title": "AI视频制作师", "salary": "13-18K", "location": "远程", "jd": "工作内容：\n1.负责海外AI真人短剧制作工作。Al视觉生成，到后期合成、成片交付。\n2.严格把控项目周期，确保能在1个月内完成单部高质量海外AI真人短剧，主导AI图像生成工作，精准把控人物形象、场景风格的统一性，优化光影质感、场景细节及色彩调性，确保画面符合短剧定位无生成的违和感、细节缺失等问题。\n3.视频流与动作优化:熟练运用各类图生视频AI工具，保障视频流畅度与合理性。\n4.团队协同，明确各环节交付标准、时间节点，同步AI生成的核心要求;每日组织项目复盘，梳理当日进度、解决卡点问题，推动项目高效推进，确保无流程内耗、无进度延误。\n\n基础要求：\n1、学历与专业:本科及以上学历，编导、影视制作、数字媒体、视觉设计等相关专业优先;有1年及以上AI短剧/AI视频创作经验者，学历可适当放宽。-审美与专业能力:具备优秀的视听语言功底，精通镜头调度、景别运用、画面构图及短剧叙事节奏，能精准把握不同题材短剧的风格调性，具备良好的审美判断力和细节把控力。抗压与执行能力:具备极强的逻辑思维、问题解决能力，能适应高强度、快节奏的创作环境(单月单剧交付)，善于拆解复杂任务，高效推进项目落地。\n2、工具技能要求(必备)- 图形生成工具:熟练运用Midjourney(精准把控构图、色彩、人物质感)、Nano BananaPro，精通ControlNet控图、Img2lmg等技术,能独立完成人物/场景素材的AI生成与优化。- 视频生成工具:熟练掌握至少2种及以上主流图生视频AI工具，熟悉各类工具的优势与局限，能根据需求灵活选择工具组合，高效完成视频生成。-剪辑工具:熟练操作后期剪辑工具(如PR、剪映)，能配合后期团队完成镜头衔接、简单调色等工作;熟悉AI提示词编写技巧，能通过精准提示词提升AI生成效率与质量。\n\n加分项：\n1-作品要求:有成熟的AI真人短片/短剧作品(需附带作品链接或高清成片)，作品画面质感佳、叙事流畅，能体现AI技术的灵活运用。\n2、-行业经验:有传统剧组导演、分镜师、影视后期导演经验;或参与过大电影、大型游戏动画、精品短剧的制作，熟悉影视制作全流程。\n3、-专业背景:美院相关专业毕业，具备极强的视觉设计与审美能力;或编导专业毕业，有扎实的剧本解读与叙事能力", "cat": "AI / AIGC"}, {"id": "128", "title": "游戏广告视频设计师", "salary": "18-22k", "location": "远程", "jd": "岗位职责：\n1. 负责游戏买量视频素材的创意、制作与迭代，根据投放需求及使用场景交付竖屏、横屏、方形等多尺寸版本。\n2. 结合 AI 生成与实拍制作素材，通过 AI 快速产出场景、角色及多版本变体，以实拍补充真实感与表现张力。\n3. 围绕买量素材前 3 秒的吸引点开展多版本测试，根据投放数据筛选创意并调整内容。\n4. 跟踪素材表现，识别效果衰退节点趋势，提前补充新素材，保持投放素材的持续供应，避免投放端断档。\n5. 沉淀素材模板及可复用资产，提升制作效率和出素材效率，配合投放团队排期实现稳定交付。\n6. 需具备可流畅完成剪辑与合成的设备，支持日常制作及高频迭代；能本地运行ComfyUI者优先。\n任职要求：\n1. 必须具备二次元游戏相关经验，有游戏买量素材制作经历，能够结合实际投放数据说明制作效果。\n2. 不考虑博彩类设计师，以及作品仅覆盖欧美风格的设计师。熟悉 ComfyUI，能够理解并调整工作流，批量制作变体及本地化版本；具备本地运行条件者优先。\n3. 理解买量逻辑，能够看懂 CTR、CPI、ROAS、完播率等指标，并据此提出明确的素材优化方向。\n4. 熟练使用 Premiere Pro、After Effects 等剪辑及合成工具，能够独立完成从素材到成片的制作。\n5. 具备实拍能力，能够独立完成口播、手持、UGC 风格等轻量拍摄，或远程指导拍摄。\n6. 熟悉 AI 生成工具，能够使用 AI 快速制作多版本素材用于测试。\n7. 具备产能及交付意识，能够适应高频、持续的制作与迭代需求。\n加分项：\n1. 有爆量素材案例，能够结合创意、迭代过程及数据说明有效原因。\n2. 有海外买量经验，了解不同市场的素材偏好及文化差异。\n3. 懂游戏、能够快速提炼游戏产品卖点，并转化为素材创意。\n4. 有 LoRA 训练或角色一致性控制经验。\n5. 熟悉主流视频生成工具及各自的适用场景。", "cat": "设计"}, {"id": "129", "title": "AI视频抽卡师", "salary": "14-16k", "location": "远程", "jd": "岗位职责：\n1. 按照导演及制作端确定的镜头方案批量生成素材，筛选符合要求的可用镜头，重点把控产能、跨镜头一致性及筛选质量。\n2. 控制角色、场景、服装及风格的跨镜头一致性，使同组素材能够衔接使用。\n3. 根据制作需求调整 ComfyUI 工作流及生成参数，解决生成效果不稳定的问题；需具备可运行 ComfyUI 的本地设备，或能够使用云端算力。\n4. 记录有效提示词、参数组合及种子，沉淀可复用的工作流与生成经验。\n5. 向制作端反馈生成限制，说明难以实现的镜头及可尝试的替代方案。\n6. 按排期稳定交付可用素材，对生成产能负责。\n任职要求：\n1. 熟练使用 ComfyUI，能够理解、修改并搭建工作流，具备独立操作能力，不限于套用现成模板，此项为硬性要求。\n2. 熟悉主流图像及视频生成模型，了解不同模型的适用场景与参数差异。\n3. 有角色一致性控制经验，能够实际运用 LoRA、参考图、IPAdapter 等多种方法。\n4. 具备基本的画面判断力，能够识别生成缺陷，依据镜头要求判断素材是否可用。\n5. 能够适应高频、重复的生成与筛选工作，具备素材判断力及产能意识，按排期稳定交付。\n加分项：\n1. 有 AI 短剧、漫剧或 AI 影像的实际产出经验，能够说明实际单日产出量。\n2. 有 LoRA 训练经验。\n3. 熟悉主流视频生成工具，了解各自的优缺点及适用场景。\n4. 有素材库或资产管理经验。\n5. 能编写简单脚本进行批量处理。", "cat": "AI / AIGC"}, {"id": "130", "title": "游戏 Mod 适配工程师", "salary": "10-15k", "location": "远程", "jd": "岗位职责\n负责基于 Node.js / TypeScript 技术栈，设计并实现跨平台游戏 Mod 管理器的自动化安装与卸载系统，确保多类型游戏 Mod 的高效识别、精准部署与安全回滚。\n1. 独立负责 Mod 自动识别与分类逻辑的设计与开发，实现对替换式、脚本类、资源类、工具类等多类型 Mod 包的智能分析与路径适配。\n2. 基于文件系统操作（fs / path）与正则匹配机制，构建自动化安装流程，实现一键部署、版本验证与文件回滚。\n3. 设计并维护插件化接口体系（如 install / uninstall / verify 等），支持多游戏引擎与版本的通用适配。\n4. 集成外部工具（如资源打包、RPF/PAK 文件操作、脚本注入器等），实现对多格式 Mod 文件的自动读取、写入与动态构建。\n5. 参与优化安装事务逻辑、安全校验与日志追踪机制，持续提升安装稳定性与用户体验。\n6. 完善系统的异常恢复、路径验证与可扩展性架构，确保自动化流程的跨平台兼容与可持续演进。\n任职要求\n1. 熟悉 JavaScript / TypeScript，具备 Node.js 实际开发经验。\n2. 熟悉 Electron 框架，了解主进程与渲染进程通信（IPC），具备桌面应用开发与调试能力。\n3. 熟悉 Windows 文件系统，能使用 Node.js 处理文件、目录、路径及外部进程。\n4. 有 PC 游戏 Mod 安装和排错经验，理解前置依赖、加载顺序及版本兼容。\n5. 能独立分析 Mod 包结构和安装文档，编写可维护的识别及部署规则。\n6. 具备良好的问题定位和测试习惯，关注原文件保护、卸载恢复和异常处理。\n加分项\n1. 熟悉 BepInEx、UE4SS、FOMOD、Mod Engine 等任一 Mod 加载框架或安装体系。\n2. 有 Mod 制作、Mod 管理器扩展开发或自动化测试经验。", "cat": "技术 / 数据"}, {"id": "131", "title": "海外社媒运营", "salary": "8-18k", "location": "远程", "jd": "岗位职责\n1. 负责品牌海外社交媒体矩阵运营，包括X、Facebook、YouTube、B站等平台的内容发\n布、用户互动及账号增长。\n2. 负责海外用户社群的日常运营，重点维护Discord/Reddit等社区渠道,制定与完善社群\n规则与板块结构，维护社群秩序，提升活跃度与用户粘性。\n3. 收集玩家舆情、Bug、玩法建议及技术问题，整理反馈并输出报告，为研发决策提供支\n持。\n4. 负责平台广告投放，制定预算与投放计划，检测自然流量、广告流量、CPM等数据并动\n态优化。\n任职要求\n1. 1-3 年以上海外社媒运营、内容营销或品牌传播经验，有X/YouTube/Facebook等平台\n运营经验。\n2.英文具备优秀的内容创作能力，书面表达清晰，可用双语产出内容文案。\n3.了解游戏 MOD 生态：熟悉 NexusMods、WeMod/Wand、风灵月影等平台的产品\n形态、社区文化与用户习惯。\n2. 有 Discord 或 Reddit 社群运营经验，具备0-1 搭建或日常运营均可。\n4. 熟练使用视频剪辑与图片设计工具，能自主产出短视频、海报等基础素材。\n5.热爱游戏，熟悉欧美玩家文化与社区语言。\n加分项- 游戏社区版主 / 创作者（含 MOD 作者）经历。\n- 长尾 SEO 内容经验。", "cat": "运营"}, {"id": "132", "title": "测试工程师", "salary": "6-15k", "location": "远程", "jd": "欢迎硬核单机玩家，人肉评测达人，排错找茬高手，踏实肯干的网瘾少年少女，\n岗位职责：\n负责海量游戏试玩评测，进行游戏辅助工具与Mod 在不同软硬件环境及平台下的可用性与兼容性测试。\n处理全球玩家的线上报错，在游戏中实际测试并精准复现游戏及辅助工具问题。\n协助产出游戏工具及MOD图文教程，记录其在游戏内的具体表现。\n参与PC桌面端、Android客户端与Web网站的基础功能回归与验收。\n任职要求：\n具有丰富的单机游戏经验，了解各类游戏类型的机制与系统生态。\n使用过加速器、MOD、修改器、游戏盒子等平台工具，了解SKSE等前置插件、存档替换、游戏本体目录结构等基础概念。\n具备良好的逻辑思维和理解力，能从玩家反馈中抽丝剥茧，定位测试问题。\n责任心强，有沉浸心，能耐得住性子测试游戏中触发特定条件以验证工具功能的稳定性。\n加分项：\n做过游戏攻略、工具或MOD作者、写过游戏深度评测，或在相关社区担任过版主。\n掌握基础的英语阅读能力，能看懂Reddit、UnknownCheats等渠道的报错贴和更新日志。", "cat": "测试 / 运维"}, {"id": "133", "title": "手游活动运营", "salary": "15-25k", "location": "未明确", "jd": "岗位职责\n1. 游戏评测与分析：体验并评测不同品类手游，从核心玩法、成长节奏、活动体系、付费设计及用户体验等维度进行分析，输出评测报告与可执行的优化建议。\n2. 活动策划与方案输出：结合产品阶段、用户特点及拉新、活跃、留存、付费等运营目标，独立撰写活动策划案，明确活动规则、参与流程、奖励配置、商业化设计及效果评估指标。\n3. 商业化设计与优化：参与礼包、限时促销、节庆活动等商业化内容的设计与调整，结合用户分层和游戏经济体系，平衡营收目标与玩家体验。\n4. 效果跟踪与复盘：跟踪活动参与、转化及收入等关键数据，结合玩家反馈评估活动效果，定位问题并提出迭代建议，沉淀可复用的活动方案与经验。\n任职要求\n1. 有手游运营、活动策划或相关工作经验，能够独立完成从需求分析、方案撰写到上线跟进、效果复盘的完整流程。\n2. 熟悉多品类游戏产品，对卡牌、RPG、SLG、放置、模拟经营等品类中的多个方向有较深入体验，能理解不同产品的玩法特点、用户需求及付费逻辑。\n3. 具备一定的活动策划能力，能够将运营目标转化为清晰、可执行的活动机制，兼顾活动吸引力、开发成本与落地可行性。\n4. 具备商业化意识，理解用户分层、付费转化、礼包定价及奖励投放的基本逻辑，能够结合产品特点提出合理的商业化建议。\n5. 逻辑清晰，具备良好的文档表达、数据分析及沟通协调能力；执行力强，能主动推进问题解决，并对上线效果持续跟进。", "cat": "运营"}, {"id": "134", "title": "产运负责人", "salary": "3000-7500U", "location": "未明确", "jd": "成人内容平台运营\n负责成人内容平台整体运营工作，对用户增长、活跃、留存及营收结果负责；\n制定并执行内容运营策略，提升平台内容丰富度及用户消费意愿；\n负责用户分层运营，建立会员体系及付费转化机制；\n持续优化用户体验，提升用户留存率和复购率；\n负责平台活动策划，包括会员活动、充值活动、节日活动等；\n跟踪海外成人内容行业动态及竞品数据，制定针对性运营策略；\n与产品、技术、市场团队协同，推动运营需求落地；\n通过数据分析发现问题并制定优化方案，实现平台收入持续增长。\nVPN产品运营\n负责 VPN 产品用户增长及商业化运营；\n建立用户转化漏斗，优化注册、试用、付费及续费流程；\n负责会员体系及订阅业务运营，提高续费率和用户生命周期价值；\n策划用户增长活动，提升自然增长及付费转化效果；\n分析产品数据，持续优化用户体验及核心指标；\n研究海外工具类产品运营模式及行业趋势，制定增长策略；\n与投放团队配合，优化流量获取及转化效率。\n\n任职要求\n3年以上互联网运营经验；\n有内容平台、流量平台、工具类产品或会员订阅产品运营经验；\n具备较强的数据分析能力，能够独立完成运营数据复盘；\n熟悉用户增长、用户留存及商业化运营逻辑；\n具备较强的项目管理和跨部门协作能力；\n对海外互联网产品有较深理解；\n结果导向，对数据和营收目标负责。", "cat": "其他"}, {"id": "135", "title": "业务经理助理 / 项目经理", "salary": "面议", "location": "未明确", "jd": "岗位介绍\n本岗位承担项目推进（PMO）与执行督导双重职责：将业务经理的想法与指令转化为可落地项目，全程跟进至结果交付，确保事事有回音、件件有着落。\n岗位职责\n1.指令落地：将想法与指令拆解为可执行任务，明确目标、节点与责任人，建立任务台账并持续跟踪。\n2.项目推进：统筹跨团队项目进度，建立汇报与复盘机制，识别风险、协调资源、推动问题闭环。\n3.执行督导：对进度滞后、执行敷衍、质量不达标及时纠偏问责，守住交付标准。\n4.事务协同：管理上级时间与信息流，过滤信息、排列优先级、预判风险，提供决策支持。\n5.AI 提效：熟练运用 AI 工具与工作流（写作、数据分析、自动化、Agent 等），提升团队产出效率。\n6.结果复盘：验收关键事项成果，沉淀方法与机制，持续优化执行效率。\n任职要求\n1.目标感强，有信念，愿意为结果负责到底。执行力强，说到做到，能在复杂环境下推动事情拿到结果，原则性强，敢于对事不对人地推动与问责，抗压，不回避冲突。\n2.有 PMO、项目推进、运营或团队管理经验，熟悉目标拆解、进度管理与风险管控。\n3.AI 工具重度使用者，能搭建提示词、自动化、数据分析等提效流程。\n4.熟悉成熟平台相关行业实际运作规则，善于在复杂局面中破局，具备底线与合规意识。\n5.沟通清晰、逻辑严密，适应高强度快节奏。\n加分项\n1.有高管助理、总裁办或业务线管理支持经验。\n2.有从 0 到 1 或创业项目经验。\n3.有 AI 工作流、Agent、自动化工具落地经验。\n4.数据敏感，习惯用数据驱动决策。", "cat": "职能"}, {"id": "136", "title": "高级 SEO 专家", "salary": "20-40", "location": "未明确", "jd": "岗位职责：\n1、负责成熟平台内容站点在 Google 及 Yandex 搜索引擎的整体 SEO 策略制定与流量突破，监控与分析竞争对手的 SEO 策略及流量结构，持续优化自身的差异化竞争优势\n2、负责 Technical SEO 优化，改进网站架构、页面加载速度、索引收录及移动端体验\n3、制定并执行外链建设策略，拓展和维护高质量的外链资源与渠道\n4、追踪 Search Console、Yandex Webmaster 等平台的关键数据，定期输出数据分析报告与优化方案\n任职要求：\n1、3 年以上 SEO 实战经验，精通 Google 与 Yandex 的排名机制与算法更新\n2、 具备成熟题材行业（Adult）或高风险流量站点的 SEO 实战案例与成功经验\n3、熟练使用主流 SEO 工具，如 Ahrefs、Semrush、Screaming Frog、Yandex.Metrica 等\n4、熟悉 Technical SEO，能够独立排查和解决网站收录异常、惩罚降权等技术问题\n5、具备强烈的数据驱动意识、独立解决复杂问题的能力及较强的抗压能力\n加分项：\n1、具备大型流量站点（日均 IP 10万+）的成功优化案例\n2、熟悉黑帽/灰帽 SEO 常用手法及防封禁、降权恢复策略\n3、具备基础的前端开发能力（HTML/CSS/JavaScript），能独立配合技术团队推进代码级优化\n4、熟悉 PBN（私人博客网络）搭建与运维管理", "cat": "运营"}, {"id": "137", "title": "运营专员", "salary": "Open", "location": "未明确", "jd": "岗位职责：\n1、渠道获客：开拓并维护海外及特定市场获客渠道（广告网络、网盟AFF、TG/DC生态、特种流量等），控制获客成本，提升ROI与LTV。\n2、用户转化： 针对AI短剧与特色娱乐用户，搭建AARRR增长漏斗，优化内容推荐策略与付费阶梯，提升留存率与ARPU值。\n3、数据复盘：监控拉新、活跃、留存及变现全流程数据，基于归因分析快速迭代运营与变现策略。\n任职资格：\n1、具备 2 年以上 Adult 站点 / 特色娱乐平台的实际运营经验（无色站经验者勿投）。\n2、 熟悉 AI 成人短剧赛道，了解其内容形态、受众心理及变现路径（或具备成熟的色站全流程运营与流量资源）。\n3、精通用户增长（Growth Hacking）、网盟推广（AFF）及社群裂变等高转化玩法。\n4、 具备特种流量渠道（广告网络、暗流等）的开拓、谈判与数据监控能力。\n5、熟练运用转化漏斗与生命周期模型，具备强数据敏感度，能精准优化 LTV / CAC。\n6、 深刻洞察目标用户付费心理，抗压与执行力强，适应极速迭代业务。\n加分项：\n1、 具备华语市场的本地化推广、特种流量投放或出海产品运营成功案例者优先。\n2、 熟悉海外黑灰产流量机制、隐蔽渠道买量、防封控手段及规避敏感审查的实操经验者优先。\n3、 能熟练运用 Midjourney、ComfyUI、Sora、Codex 等 AI 工具辅助快速生成宣传素材、短剧剧本或运营文案者优先。\n4、自带 Adult 领域优质网盟（AFF）、站长（Webmaster）、KOL 或特种广告主资源者优先。", "cat": "运营"}, {"id": "138", "title": "AI全栈开发工程师（后端 Go 方向）", "salary": "20-30", "location": "未明确", "jd": "AI全栈开发工程师（后端 Go 方向）\n\n职位概述\n负责视频资料检索平台后端架构与核心业务开发，以 Go 为核心技术栈，覆盖搜索聚合、播放服务、用户行为等业务线，并承担高并发稳定性、数据缓存、CDN 与播放链路等关键能力的建设与治理。本岗位要求具备全栈开发能力、精通 AI 工具并拥有产品思维，能够将业务需求转化为可上线、可观测、可扩容的技术方案。\n岗位画像：Go + 全栈开发能力 + 精通 AI 工具 + X 站经验优先 + 产品思维\n能力优先级：Go → AI 工具 → X 站经验 → 全栈开发能力\n\n一、岗位职责\n1、核心业务开发与架构设计：负责平台后端架构与核心业务开发，覆盖搜索聚合、影片与创作者资料、播放服务、用户行为、收藏历史、排行榜及内容运营等业务线；主导需求评审与技术方案设计，推动业务目标落地\n2、高并发服务与稳定性建设：以 Go 为核心构建高并发 API 服务，落地多级缓存、请求合并、异步队列、限流、熔断、降级与热点数据保护，保障突发流量下的服务可用性\n3、AI 工具应用与全栈交付：精通 AI 编程工具与 AI 工作流，持续提升个人及团队研发效率；具备全栈开发能力，可独立完成前后端端到端交付\n4、数据层与缓存体系：负责 MySQL 数据模型设计、索引优化、慢查询治理与读写链路优化；建设 Redis 缓存体系，系统解决缓存穿透、击穿、雪崩、大 Key、热 Key 与失效风暴等典型问题\n5、CDN 与视频播放链路：负责 Cloudflare / CDN 接入与治理（Cache Rules、缓存键、TTL、回源保护、WAF、Rate Limiting、防盗链、多线路切换）；保障 HLS 播放链路（m3u8、TS 分片、AES-128、鉴权 URL、回源与边缘缓存）稳定运行\n6、可观测性与工程效能：完善日志、指标、链路追踪与告警体系，快速定位线上性能问题，对容量、故障与发布风险负责；推动代码评审、自动化测试、灰度发布与技术文档建设，带领团队建立稳定的工程规范\n\n二、任职资格\n1、精通 Go（第一优先级）：深入理解 goroutine 并发模型、channel 与内存管理，具备 pprof、GC 调优等性能优化实战能力，有常驻进程 / 高并发服务线上经验\n2、精通 AI 工具：熟练运用 Cursor、Copilot 等 AI 编程工具与 AI 工作流，能显著提升个人及团队研发效率\n3、X 站经验优先：具有相关视频平台开发与运维经验者优先\n4、全栈开发能力：具备前端基础，能独立完成从后端服务到前端页面（Web/H5）的端到端交付\n5、产品思维：理解业务核心指标与用户场景，能够用数据驱动技术选型与需求优先级判断，主动推动方案落地，拒绝被动式纯编码\n6、5 年以上后端开发经验，其中至少 2 年承担核心系统或技术负责人角色；具备真实大流量线上项目经验，能够清晰阐述业务规模、峰值 QPS、容量瓶颈、优化过程与最终结果\n7、精通 MySQL 与 Redis：具备数据库性能分析、缓存架构设计与线上数据问题处置能力\n8、具备 Cloudflare 或主流 CDN 生产经验；熟悉 Linux、Nginx / HAProxy、Docker、Git 与 CI/CD，可独立完成服务部署、排障与性能调优；重视接口鉴权、权限控制与数据边界安全\n\n优先条件（加分项）\n1、具有大型视频、直播、内容社区、短视频或大规模媒体资源平台经验\n2、具有 PHP→Go 迁移经验，或熟悉 Hyperf、Swoole、RoadRunner 等常驻内存 / 异步框架\n3、具有 Elasticsearch / OpenSearch、ClickHouse、Kafka、RabbitMQ 等组件的生产实践\n4、具有 AWS、对象存储、CloudFront、Cloudflare Workers / R2 或多 CDN 调度经验\n5、具有反爬、防盗链、风控、攻击流量治理经验", "cat": "AI / AIGC"}, {"id": "139", "title": "内容运营岗", "salary": "10k-25k", "location": "未明确", "jd": "内容运营岗\n岗位类型：全职\n办公方式：远程\n薪资范围：10k-25k\n一、岗位职责\n1、平台内容运营：负责平台日常内容的策划、上架、更新与维护，把控内容质量和更新节奏，优化内容推荐位及分发策略；\n2、社群维护：负责用户社群的日常运营与管理，包括入群审核、话题引导、活动策划、答疑互动，持续提升社群活跃度和用户粘性；\n3、用户洞察：收集并整理用户反馈，分析用户行为和偏好，反哺内容选题与运营策略；\n4、数据复盘：跟踪内容曝光、互动、留存等核心指标，输出周/月运营数据复盘，推动运营动作迭代；\n5、跨部门协作：与产品、技术团队协同，跟进内容相关功能优化与活动落地。\n二、任职要求\n1、2-3 年平台运营或社群运营经验，有内容平台从业背景者优先；\n2、对成人向/色站内容平台的内容风格有基本认知，不排斥相关内容（必须项）；\n3、思维活跃、有想法，具备较强的内容敏感度和创意策划能力，能独立产出运营方案；\n4、沟通表达能力强，擅长活跃氛围、处理用户关系；\n5、责任心强，执行力高，能适应快节奏的内容更新要求。\n三、加分项\n1、有 18+ 内容平台、社区或兴趣社群运营经验；\n2、熟悉主流社交平台运营玩法，有从 0-1 建群/运营经历；\n3、优秀的AI工具应用能力。", "cat": "内容"}, {"id": "140", "title": "投放运营经理", "salary": "30-50K/月", "location": "办公形式：远程办公", "jd": "投放运营经理\n岗位类型：全职\n薪资范围：30-50K/月　　\n办公形式：远程办公\n一、岗位职责\n1、负责海外垂直内容平台整体流量增长，对用户新增、活跃、留存及营收结果负责；\n2、制定并执行投放策略，精通色站投量、色站投放及换量模式，独立操盘产品大规模流量增长；\n3、自带投量/换量资源或具备成熟渠道置换能力，负责渠道拓展、商务谈判与日常关系维护，保障流量供给稳定可控；\n4、建立并持续优化用户转化漏斗，提升注册→试用→付费→续费各环节转化率，持续优化获客成本（CPA/CAC）与投产比（ROI）；\n5、负责会员体系及订阅业务运营，提升续费率和用户生命周期价值（LTV）；\n6、策划用户增长活动（会员活动、充值活动、节日活动等），提升自然增长及付费转化效果；\n7、跟踪海外垂直内容行业动态及竞品投放数据，制定针对性投放与增长策略；\n8、通过数据分析监控投放效果，独立完成投放数据复盘，发现问题并制定优化方案，实现平台收入持续增长；\n9、与产品、技术团队协同，推动运营与投放需求落地。\n二、任职要求\n1、3年以上互联网运营/投放经验，有成人内容平台、流量平台、工具类产品或会员订阅产品运营经验；\n2、精通色站投量、色站投放及换量玩法，必须提供可验证的色站投放成功数据案例，或自带可用的投量/换量资源；\n3、对数据高度敏感，具备较强的数据分析能力，能够独立完成投放数据复盘与ROI测算；\n4、熟悉用户增长、留存及商业化运营逻辑，对海外互联网产品有较深理解；\n5、具备较强的项目管理和跨部门协作能力；\n6、结果导向，能独立完成产品大规模流量增长目标，对数据和营收结果负责。", "cat": "商务 / 市场"}, {"id": "141", "title": "AI内容生成专员 （视频剪辑）", "salary": "5-20k", "location": "办公方式：远程办公\n5、责任心强、自驱力好，具备良好的沟通协作能力，适应远程办公节奏。", "jd": "AI内容生成专员\n（视频剪辑）\n岗位性质：全职 \n办公方式：远程办公 \n薪资范围：5-20K\nHC数量：80个\n一、岗位职责\n1、使用主流剪辑工具，独立完成短视频的剪辑、包装与成片输出；\n2、熟练运用AI工具完成视频所需图片素材的生成，对人物细节、画面质感把控到位；\n3、具备较强的提示词（Prompt）编写能力，能精准表达画面需求，高效产出符合要求的素材；\n4、配合团队完成内容创意与成片交付，保障产出效率与质量。\n二、任职要求\n1、熟练使用剪映等剪辑工具，能独立完成视频剪辑；\n2、有相关剪辑或视频作品，提供30秒以内的成片样片；\n3、会使用AI进行生图，人物细节表现力好；\n4、提示词使用能力较好，能够通过文字精准控制生成效果；\n5、责任心强、自驱力好，具备良好的沟通协作能力，适应远程办公节奏。\n\n\n加分项：\n1、有AI视频生成（图生视频/文生视频）相关经验；\n2、熟悉多款剪辑或AI工具，具备一定审美与创意能力。\n提供完整的成人视频作品的可以快速安排面试。", "cat": "AI / AIGC"}, {"id": "142", "title": "AI成人短剧编剧", "salary": "15-30k", "location": "办公方式：远程办公", "jd": "AI成人短剧编剧\n岗位性质：全职 \n办公方式：远程办公 \n薪资范围：15-30K\nHC数量：20个\n一、岗位介绍\n1、负责成熟题材、情感向 AI 短剧的选题策划、热点分析、剧本创作与内容开发。\n2、需要具备专业的编剧能力和敏锐的网络热点捕捉能力，能够从社会热点、情感事件。\n3、本岗位接受成熟题材、海外泛娱乐内容创作方向。\n二、岗位职责\n1、负责成熟题材 AI 短剧的选题策划、故事构思和剧本创作。\n2、持续关注网络热点、社会话题、情感事件及短视频平台趋势，保持强网感，敏锐捕捉热点与爆点，挖掘适合短剧开发的高热度素材。\n3、对热点内容进行二次创作，完成原创化、戏剧化和系列化改编，擅长将话题爆点转化为剧情爽点、泪点和反转点。\n4、负责故事梗概、人物小传、人物关系、世界观设定及分集大纲的设计。独立完成短剧剧本、分集剧本、场景描述、人物对白等内容。\n应聘时需提供个人相关作品（剧本、短剧、分镜表、短视频脚本或作品集）。\n加分项\n1、有成熟题材短剧、情感向影视、AI 漫剧等剧本创作经验有短剧爆款、网络小说、短视频脚本或高传播内容作品。\n2、熟悉 Seedance 2、LibTV、无限画布等 AI 内容创作工具。具备 AI 编剧、提示词撰写或 AI 视频生产流程经验。\n3、熟悉短剧平台、短视频平台及网络热点传播规律，网感突出，有爆款选题或热点借势案例。有成熟的题材库、人物库或连续剧开发经验。\n4可提供分镜表、分镜脚本、已上线作品或完整剧本案例者可以快速安排面试", "cat": "AI / AIGC"}, {"id": "143", "title": "初级编辑", "salary": "8K - 10k", "location": "未明确", "jd": "岗位职责：\n1.负责网站内容的收集、撰写、剪辑及日常发布；\n2.具备良好的沟通能力，思维灵活、逻辑清晰；\n3.密切关注社交媒体热榜，快速响应热门内容、话题\n\n任职要求：\n1.大专及以上学历，有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者", "cat": "其他"}, {"id": "144", "title": "初级运营专员", "salary": "8K - 13k", "location": "未明确", "jd": "一，岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\n\n二，任职要求\n1.大专及以上学历，2年以上网站或APP实际运营经验，能独立策划和执行活动，具备较强的数据分析能力，AI应用或自动化系统落地经验，有基于 OpenClaw 构建实际项目经验者优先。\n熟悉 OpenClaw 框架逻辑，能够独立设计 Agent 执行流程与任务拆解结构。\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求", "cat": "运营"}, {"id": "145", "title": "产品运营专员", "salary": "8K - 13k", "location": "未明确", "jd": "1.大专及以上学历，有1年以上内容运营经验，或具备独立运营网站内容或社媒平台账号的能力（社交媒体方向优先）\n2.对成人类行业内容有一定了解和接触；\n3.具备剪辑经验，能够熟练使用 Pr / Ps 等工具；\n4.有良好的写作能力，文案输出，文字功底，思维逻辑良好，能独立完成标题、内容、关键词抓取、文案撰写\n任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解或接触，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者", "cat": "运营"}, {"id": "146", "title": "初中级AI内容制作师（成人向内容）", "salary": "10-15K", "location": "未明确", "jd": "岗位名称：AI视频生成师\n岗位别称：AI抽卡师  AIGC视频制作师  AI视觉生成师\n岗位定位：根据剧本和分镜生成、筛选及优化人物、场景、道具和动态镜头素材，重点保障素材可用性、角色一致性和跨镜头连续性。\n岗位职责\n1. 拆解分镜中的人物、场景、动作、表情、构图、光影、景别和运镜要求。\n2. 使用AI生图和生视频工具完成人物设定、场景、道具、首帧和动态视频素材。\n3. 编写并优化提示词，合理使用参考图、种子、模型和控制参数提升稳定性。\n4. 批量生成和筛选素材，剔除五官畸形、肢体错误、动作穿模、画面闪烁及构图失衡的结果。\n5. 保证人物五官、发型、服装、身形、道具及整体画风在不同镜头中的一致性。\n6. 完成图生视频、首尾帧控制、人物动作、表情变化和镜头运动。\n7. 使用修图或AI工具完成局部重绘、扩图、高清修复和基础画面清理。\n8. 按镜头编号整理并归档人物、场景、道具、提示词、参数和成品素材。\n9. 配合导演和后期完成补镜、改动作、换景别及素材重生成。\n10. 持续测试新工具和工作流，提高可用素材率并降低生成成本。\n任职要求\n1. 大专及以上学历，熟悉AI图像或AI视频生成流程，有短剧、漫剧、动画或视觉制作经验。\n2. 至少熟练使用两类主流AI生成工具，如即梦、可灵、Vidu、海螺、Stable Diffusion或ComfyUI。\n3. 能够独立编写和优化文生图、图生图、文生视频及图生视频提示词。\n4. 理解景别、机位、构图、焦点、运镜和镜头连续性。\n5. 具备良好审美，能判断人物形象、表情、动作、色彩和光影是否符合要求。\n6. 能够发现并解决人物变脸、服饰漂移、左右手错误、道具错位和背景不连续等问题。\n7. 能够理解剧本和角色情绪，保证镜头服务剧情。\n8. 工作细致、有耐心，能够适应反复生成、筛选和迭代。\n优先条件\n有完整AI短剧、AI漫剧或AI真人短剧作品。\n熟悉角色LoRA、ControlNet、IP Adapter或节点式工作流。\n具有人物口型、动作驱动、首尾帧或镜头延长经验。\n会使用Photoshop、Premiere、After Effects或剪映。\n有可复用的角色库、场景库和提示词模板建设经验。\n投递材料\nAI视频或AI短剧代表作品。\n同一角色在多个场景和景别中的一致性案例。\n参考图、提示词及最终结果对比。\n本人负责范围、使用工具和主要工作流程说明。\n工作结果关注项\n可用素材通过率\n单个有效镜头平均生成次数\n人物与风格一致性\n镜头返工率\n按时交付率\n素材归档规范率", "cat": "AI / AIGC"}, {"id": "147", "title": "AI短剧中级剪辑师（成人向内容）", "salary": "13-18K", "location": "未明确", "jd": "AI短剧剪辑师（成人向内容）\n岗位职责\n1. 根据剧本、分镜及AI生成素材，独立完成短剧粗剪、精剪、字幕、配音、配乐、音效及成片输出。\n2. 理解成年受众的观剧偏好，抓住人物关系、情绪张力与剧情冲突，做好开场钩子、情节推进和结尾悬念。\n3. 对AI素材进行筛选与重组，处理人物动作不连贯、口型不同步、镜头衔接生硬等问题，并提出补镜需求。\n4. 配合编剧、分镜及AI视频制作人员，优化镜头安排与素材质量，提升成片连贯性和观感。\n5. 根据发布平台要求，完成不同比例、时长及版本的剪辑交付，整理工程文件和素材。\n6. 结合完播率、留存率等反馈调整剪辑节奏，持续优化内容表现。\n任职要求\n1. 大专及以上学历，熟练使用剪映专业版、Premiere或DaVinci Resolve，能够独立完成短剧后期制作；掌握AE者优先。\n2. 有短剧、剧情短视频、动态漫或AI视频剪辑经验，具备完整作品或可展示片段。\n3. 具备叙事意识和审美判断，能通过镜头、声音与节奏表现人物情绪，避免单纯堆砌转场和特效。\n4. 了解AI视频素材特点，能判断素材可用性，并通过剪辑、声音设计或补镜方案解决问题。\n5. 能理解成人向题材的表达侧重尺度和内容\n6. 沟通清晰、交付稳定，能够根据反馈完成修改并做好版本管理。\n加分项\n- 有情感、都市、悬疑等成人受众题材的成熟作品。\n- 熟悉可灵、即梦、Runway等AI视频工具及AI配音流程。\n- 有基础调色、声音处理、或画面修复经验。\n- 参与过短剧账号运营，能结合数据说明剪辑优化思路。\n2—3部代表作品（短剧方向", "cat": "AI / AIGC"}, {"id": "148", "title": "AI 短剧中级编剧", "salary": "15-20K", "location": "未明确", "jd": "岗位名称：短剧编剧\n岗位别称：竖屏短剧编剧  AI短剧编剧  短剧内容编剧\n岗位定位：负责原创短剧或IP改编的全流程剧本创作，保证故事逻辑、人物动机、情绪密度和分集钩子满足短视频观看习惯。\n岗位职责\n1. 负责原创短剧及IP改编项目的选题、人物小传、故事大纲、分集梗概、分场剧本和对白创作。\n2. 根据目标用户和内容方向设计开场钩子、核心冲突、爽点、反转及集尾悬念。\n3. 将小说、故事梗概或已有IP转化为可拍摄、可生成、可剪辑的短剧剧本。\n4. 控制人物数量、场景数量和剧情复杂度，兼顾内容效果与实际制作条件。\n5. 参与选题会、剧本会和围读，根据导演、制片及内容审核意见完成修改。\n6. 跟进制作过程，对台词、场景和剧情执行中的问题提供调整方案。\n7. 根据前5秒留存、平均观看时长、完播率、掉点和互动数据优化开场、节奏与信息释放。\n8. 关注短剧市场题材和受众偏好，持续拆解优秀项目并沉淀创作方法。\n9. 保证剧本人物设定、时间线、伏笔、道具和前后情节连续。\n10. 遵守平台内容规范和版权要求，杜绝抄袭、洗稿及未经授权的改编。\n任职要求\n1. 大专及以上学历，有短剧、网剧、剧情短视频或网络文学创作经验，能够独立完成完整故事。\n2. 熟悉竖屏短剧的叙事特点，理解强钩子、强冲突、高情绪密度和集尾留扣。\n3. 能独立完成人物小传、故事大纲、分集大纲和分场剧本。\n4. 具备清晰的逻辑能力，能处理人物动机、因果关系、伏笔回收和长线连续性。\n5. 对白简洁、自然、有情绪张力，并具备明确的画面感和可表演性。\n6. 熟悉至少一个主流题材方向，如都市情感、甜宠、家庭、逆袭、悬疑或男频成长。\n7. 具备数据意识，能够结合观看留存和掉点分析内容问题。\n8. 能够接受多轮修改并按照项目节点稳定交稿。\n优先条件\n有已经过稿、拍摄或上线的短剧作品。\n独立主笔过至少一部完整短剧。\n有网文、小说、漫画或游戏剧情改编经验。\n熟悉红果、抖音、快手、小程序短剧等内容形态。\n有AI短剧、动态漫或AI辅助创作经验。\n投递材料\n个人代表作品或剧本节选。\n上线作品链接及本人负责范围。\n擅长题材和男频或女频方向说明。\n没有上线作品者可提供原创大纲和连续分集样稿。\n工作结果关注项\n按时交稿率\n剧本一审通过率\n修改轮次与问题闭环\n开场及分集钩子质量\n上线后的留存和完播表现", "cat": "AI / AIGC"}, {"id": "149", "title": "中级seo专员", "salary": "12K - 16k", "location": "未明确", "jd": "岗位职责： \n1、SEO策略制定与执行：根据公司业务目标，制定并执行 纯白帽SEO优化方案。 进行关键词研究、网站结构优化、内容规划与落地。 \n2、站内优化：提升网站的页面速度、结构化数据、内链优化、URL规范化。优化页面标题、元描述、H标签、内容布局，提升用户体验与排名。 \n3、站外优化：制定高质量外链建设计划（客座博客、行业合作、媒体推广等）。 严格遵守搜索引擎规则，杜绝黑帽/灰帽手法。 \n4、效果监控与数据分析：定期监控网站SEO指标（收录量、排名、自然流量、转化率等）。 输出数据报告，并根据结果调整策略。 \n5、跨部门协作：与内容、产品、技术、市场团队合作，确保SEO优化顺利实施。 6、行业跟踪与优化迭代：跟进搜索引擎算法更新，保持优化手段的前沿性和合规性。 不断迭代SEO策略，提升长期自然流量和品牌影响力。 \n招聘要求 ;\n1、1-3年以上SEO工作经验，市场营销、电子商务、新闻传播、计算机相关专业优先，大专以上学历。 \n2、熟悉搜索引擎工作原理（Google、Bing、百度等）。精通 白帽SEO 优化策略（关键词研究、网站结构优化、内容优化、外链建设等）。 \n3、熟练使用常用SEO工具（如 Ahrefs、SEMrush、Google Analytics、Search Console、Screaming Frog 等）。了解HTML、CSS、基础JS，能与技术团队沟通实现优化需求。 \n4、有独立操作中大型网站SEO优化成功案例（尤其是自然流量提升）。数据分析能力强，能根据数据调整优化策略。", "cat": "运营"}, {"id": "150", "title": "高级产品经理", "salary": "20K - 30k", "location": "未明确", "jd": "一、岗位职责\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等工具，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4. 具备一定的团队管理经验，能够指导中初级产品成员开展工作，提升团队整体专业能力。\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n7. 可基于业务场景做 AI 能力封装、角色定义、智能流程编排，区分 AI 辅助能力和核心业务逻辑边界\n\n二、任职要求\n1. 本科及以上学历，产品、计算机、设计等相关专业优先。\n2. 5 年以上互联网/软件产品经理经验，至少具备 1 个从 0-1 独立负责并成功落地的项目经验。\n3. 熟练使用 Axure、墨刀、Figma 等原型工具，能独立完成 高保真交互原型设计，理解 UI/视觉基本规范及呈现逻辑。对 AI 新能力保持敏感度，持续跟进行业 AI 产品方案，主动探索产品内 AI 新增价值场景。\n4. 具备 业务理解能力与数据分析能力，能够将业务需求转化为可实现的产品方案。\n5. 具备一定的 团队管理能力或带队经验，可以指导新人并进行工作拆解与质量把控。\n6. 具备良好的沟通能力、推动能力和跨部门协作能力，能够在多方需求中进行合理取舍与决策。\n7. 具备较强的文档能力，能够输出高质量的 PRD、交互文档、需求分析等。\n8. 抗压能力强，责任心强，具备较强的自驱力与主人翁意识。\n\n三、加分项\n1. 有大型互联网公司产品经验者优先。\n2. 有消费品、电商、社交、内容平台等行业经验者优先。有 AI 商业化、AI 付费、AI 会员、AI 增值功能设计经验优先\n3. 具备用户增长、商业化等方向项目经验更佳。\n4. 具备 UED/交互设计背景或视觉审美能力突出者优先", "cat": "产品"}, {"id": "151", "title": "高级UI设计师", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n- 负责公司Web端、移动端等产品的UI视觉设计，输出高质量设计方案；\n- 参与需求分析和产品讨论，结合用户体验与业务目标提出设计建议；\n- 完成界面布局、视觉风格、图标及动效等设计工作；\n- 建立并持续维护设计规范、组件库和视觉资产，保证产品体验的一致性；\n- 与产品经理、交互设计师及研发团队协作，跟进设计落地并进行设计验收；\n- 关注行业趋势与优秀案例，持续优化产品视觉表现和使用体验。\n任职要求\n- 视觉传达、数字媒体、艺术设计等相关专业；\n• 5年以上互联网产品UI设计经验，有完整项目经验；\n- 熟练使用Figma、Sketch、Photoshop、Illustrator等设计工具；\n- 具备扎实的视觉设计能力，对色彩、字体、排版和细节有良好把控；\n- 熟悉iOS、Android及Web端设计规范，了解响应式设计；\n- 具备良好的沟通协作、需求理解和问题解决能力；\n- 有责任心，能够按时交付高质量设计成果；\n- 应聘时请提供可以看的figma项目文件链接。", "cat": "设计"}, {"id": "152", "title": "中级运营专员", "salary": "10K - 20K", "location": "未明确", "jd": "一、任职要求\n1、具有3年以上互联网产品运营经验，有视频类、内容社区类、短剧类App或Web产品运营经验优先。\n2、熟悉互联网产品运营体系，具备用户增长、用户生命周期管理、内容运营、活动运营等相关经验。\n3、具备较强的数据分析能力，熟悉DAU、MAU、留存率、转化率、用户活跃、付费等核心指标，能够通过数据分析发现问题、制定策略并验证效果。\n4、具备较强的业务分析及运营策略能力，能够结合市场趋势、竞品分析、用户需求及经营数据，独立制定产品运营及增长方案。\n5、具备一定的产品思维，能够分析用户体验问题，判断产品需求价值，协同产品及技术团队推动产品迭代优化。\n6、具备较强的目标管理、执行推动及跨部门协作能力，能够独立负责运营项目并推动结果落地。\n7、高级运营候选人需具备团队管理或业务统筹经验，能够进行目标拆解、任务分配、团队培养及绩效管理。\n\n二、岗位职责\n\n1. 产品运营与业务增长\n·负责所辖App/Web产品的整体运营规划，制定阶段性运营目标及增长策略。\n·对产品DAU、MAU、用户留存、活跃度、付费转化及收入等核心经营指标负责。\n·定期分析产品经营数据，识别增长瓶颈及业务问题，制定改善方案并推动执行。\n·研究市场趋势、竞品动态及用户需求，探索产品增长机会及运营策略。\n\n2. 用户运营与商业化\n·建立用户生命周期运营策略，围绕拉新、促活、留存、召回及付费转化开展运营工作。\n·通过用户分层、行为分析、运营活动及激励机制，提升用户活跃度与留存表现。\n·分析用户付费行为及转化路径，协同优化会员、充值、付费内容等商业化体系。\n·持续跟踪运营策略实施效果，通过数据复盘推动业务指标改善。\n\n3. 内容运营与产品优化\n·负责内容运营策略制定，优化内容供给、内容质量、内容推荐及用户消费体验。\n·结合内容播放、点击、互动、完播率等数据，分析用户偏好并推动内容策略调整。\n·结合用户反馈、竞品研究及业务数据，发现产品体验问题，提出合理的产品优化建议。\n·协同产品、技术等部门推进功能迭代，并跟踪上线后的实际运营效果。\n\n4. 团队管理与跨部门协作\n·根据业务目标制定运营工作计划，推动重点运营项目按期落地。\n·协助部门负责人开展运营团队管理，包括任务分配、人员培养、工作监督及绩效评估。\n·建立运营工作复盘机制，持续优化运营流程及执行效率。\n·协同产品、技术、内容、新媒体及其他业务团队，推动重点项目及增长策略落地。\n\n三、加分项\n1、具有视频平台、内容社区、短剧平台等相关产品运营经验，独立负责过产品增长或从0到1的业务建设。\n2、具有成熟的用户增长案例，能够提供具体的增长策略、执行过程及实际数据成果。\n3、具有会员体系、内容付费、充值转化、用户激励等商业化运营经验。\n4、具有SEO、渠道增长、流量转化或多产品矩阵运营经验。\n5、熟悉AI工具应用，能够利用AI辅助数据分析、内容运营、竞品研究及运营效率提升。\n6、具有跨部门项目统筹、运营团队搭建或业务管理经验。", "cat": "运营"}, {"id": "153", "title": "高级运营专员", "salary": "20K -  35K", "location": "未明确", "jd": "一、任职要求\n1、具有3年以上互联网产品运营经验，有视频类、内容社区类、短剧类App或Web产品运营经验优先。\n2、熟悉互联网产品运营体系，具备用户增长、用户生命周期管理、内容运营、活动运营等相关经验。\n3、具备较强的数据分析能力，熟悉DAU、MAU、留存率、转化率、用户活跃、付费等核心指标，能够通过数据分析发现问题、制定策略并验证效果。\n4、具备较强的业务分析及运营策略能力，能够结合市场趋势、竞品分析、用户需求及经营数据，独立制定产品运营及增长方案。\n5、具备一定的产品思维，能够分析用户体验问题，判断产品需求价值，协同产品及技术团队推动产品迭代优化。\n6、具备较强的目标管理、执行推动及跨部门协作能力，能够独立负责运营项目并推动结果落地。\n7、高级运营候选人需具备团队管理或业务统筹经验，能够进行目标拆解、任务分配、团队培养及绩效管理。\n\n二、岗位职责\n\n1. 产品运营与业务增长\n·负责所辖App/Web产品的整体运营规划，制定阶段性运营目标及增长策略。\n·对产品DAU、MAU、用户留存、活跃度、付费转化及收入等核心经营指标负责。\n·定期分析产品经营数据，识别增长瓶颈及业务问题，制定改善方案并推动执行。\n·研究市场趋势、竞品动态及用户需求，探索产品增长机会及运营策略。\n\n2. 用户运营与商业化\n·建立用户生命周期运营策略，围绕拉新、促活、留存、召回及付费转化开展运营工作。\n·通过用户分层、行为分析、运营活动及激励机制，提升用户活跃度与留存表现。\n·分析用户付费行为及转化路径，协同优化会员、充值、付费内容等商业化体系。\n·持续跟踪运营策略实施效果，通过数据复盘推动业务指标改善。\n\n3. 内容运营与产品优化\n·负责内容运营策略制定，优化内容供给、内容质量、内容推荐及用户消费体验。\n·结合内容播放、点击、互动、完播率等数据，分析用户偏好并推动内容策略调整。\n·结合用户反馈、竞品研究及业务数据，发现产品体验问题，提出合理的产品优化建议。\n·协同产品、技术等部门推进功能迭代，并跟踪上线后的实际运营效果。\n\n4. 团队管理与跨部门协作\n·根据业务目标制定运营工作计划，推动重点运营项目按期落地。\n·协助部门负责人开展运营团队管理，包括任务分配、人员培养、工作监督及绩效评估。\n·建立运营工作复盘机制，持续优化运营流程及执行效率。\n·协同产品、技术、内容、新媒体及其他业务团队，推动重点项目及增长策略落地。\n\n三、加分项\n1、具有视频平台、内容社区、短剧平台等相关产品运营经验，独立负责过产品增长或从0到1的业务建设。\n2、具有成熟的用户增长案例，能够提供具体的增长策略、执行过程及实际数据成果。\n3、具有会员体系、内容付费、充值转化、用户激励等商业化运营经验。\n4、具有SEO、渠道增长、流量转化或多产品矩阵运营经验。\n5、熟悉AI工具应用，能够利用AI辅助数据分析、内容运营、竞品研究及运营效率提升。\n6、具有跨部门项目统筹、运营团队搭建或业务管理经验。", "cat": "运营"}, {"id": "154", "title": "短剧编剧", "salary": "10-20k", "location": "未明确", "jd": "岗位职责\n负责短剧项目的剧本创作与内容策划，根据小说、故事梗概或创意进行短剧化改编及创作。\n负责小说及原始故事的剧情梳理与重构，根据短剧节奏对剧情进行删减、合并、拆分、调整及二次创作。\n负责短剧分集及分镜设计，为短剧制作师提供完整、清晰、可直接执行的分镜卡。\n根据短剧特点设计剧情冲突、情绪节点、反转、爽点及集尾钩子，确保剧情节奏紧凑、内容具有持续观看吸引力。\n根据项目需求进行原创、续写、剧情改编及人物线、故事线设计。\n与短剧制作团队协作，根据制作需求持续优化剧本及分镜内容。\n\n任职要求\n具备专业的剧本创作及分镜编写能力，熟悉短剧创作流程及叙事规律。\n具备较强的剧情重构能力，能够准确提炼故事主线，并对原有剧情进行有效删减、重组及二次创作。\n具备较强的短剧节奏感、网感及内容判断能力，熟悉冲突、反转、爽点、悬念及钩子的设计。\n具备原创故事、续写及改编能力，能够根据创意或故事开篇独立发展后续剧情。\n必须具备短剧、影视、网文、漫画/漫剧等相关编剧工作经验，有完整项目作品。\n有爆款短剧、爆款网文或其他高传播内容作品及成功项目履历者优先。\n具备较强的文字表达能力、逻辑能力及内容执行能力。", "cat": "内容"}, {"id": "155", "title": "渠道运营专员", "salary": "15-25k", "location": "本岗位为海外投放方向，要求人在海外。", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "商务 / 市场"}, {"id": "156", "title": "AI短剧制作", "salary": "10-25k", "location": "未明确", "jd": "1.负责AI短剧选题策划与剧本创作，把控故事节奏、人设和情感钩子，确保内容符合平台调性及用户偏好；\n2.运用AI视频生成工具完成分镜设计与画面生成，保证画面质量、角色一致性和叙事连贯性；\n3.独立完成短剧的剪辑、配音配乐、特效包装及成片输出，把控成片节奏和情绪表达；\n4.跟踪AI视频生成、语音合成、图像处理等相关工具及模型的更新迭代，持续优化制作流程，提升出片效率与质量；\n5.关注短剧行业内容趋势及爆款案例，结合数据反馈迭代选题方向和制作手法；\n6.配合项目排期，独立或协同完成从选题到成片的全流程产出，对内容质量和产出效率负责。\n任职要求\n1.大专及以上学历，影视、传媒、编导、新媒体等相关专业优先；\n2.1年以上短视频/短剧内容制作经验，有AI短剧视频制作经验者优先；\n3.熟练使用至少一种AI视频生成工具及Pr、剪映等剪辑软件；\n4.具备较强的故事策划与文案能力，能独立完成剧本创作或改编；\n5.对AI内容生成工具敏感度高，学习能力强，能快速掌握新工具新玩法；\n6.责任心强，能承受一定的产出节奏和排期压力，具备良好的时间管理能力。\n加分项\n1.有短剧平台过稿或爆款作品案例；\n2.有独立账号运营或内容数据分析经验。", "cat": "AI / AIGC"}, {"id": "157", "title": "中级运营（成人网站/app）", "salary": "P0（紧急/高）", "location": "未明确", "jd": "（源表未填写JD）", "cat": "运营"}, {"id": "158", "title": "新媒体运营", "salary": "P0（紧急/高）", "location": "未明确", "jd": "（源表未填写JD）", "cat": "运营"}, {"id": "159", "title": "中级运营（成人网站/app）", "salary": "P0（紧急/高）", "location": "未明确", "jd": "（源表未填写JD）", "cat": "运营"}, {"id": "160", "title": "中级运营（成人网站/app）", "salary": "P0（紧急/高）", "location": "未明确", "jd": "（源表未填写JD）", "cat": "运营"}, {"id": "161", "title": 运营"}, {"id": "167", "title": "AI短剧制作", "salary": "12K-22K", "location": "未明确", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "AI / AIGC"}, {"id": "168", "title": "AI短剧制作", "salary": "12K-22K", "location": "未明确", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "AI / AIGC"}, {"id": "169", "title": "AI短剧制作", "salary": "12k-22k", "location": "未明确", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "AI / AIGC"}, {"id": "170", "title": "AI短剧导演", "salary": "18K-28K", "location": "未明确", "jd": "岗位职责\n\n1. 负责 AI 短剧项目整体导演工作，包括剧本理解、剧情拆解、分镜设计、镜头调度及成片质量把控。\n2. 根据剧情设计景别、构图、运镜、人物表演及镜头衔接，强化人物情绪、剧情冲突及关键爆点。\n3. 将剧本转化为可执行的 AI 视频制作方案，明确镜头画面、人物动作、情绪及生成要求。\n4. 指导 AI 生成师使用 Seedance、可灵、ComfyUI 等工具完成镜头制作，并针对生成结果提出明确修改意见。\n5. 把控短剧整体节奏、人物一致性、画面连续性及剧情表达，与编剧、生成师、剪辑协作完成最终成片。\n6. 持续关注 AI 视频新技术及短剧市场趋势，不断优化制作流程和成片效果。\n\n任职要求\n\n1. 具备较强的导演思维、剧情理解能力及镜头语言能力，有短剧、影视、广告、动画、漫剧等相关导演经验。\n2. 熟悉短剧的剧情节奏、人物关系、情绪递进、冲突爆点及反转设计。\n3. 具备 AI 视频制作经验，熟悉 Seedance、可灵等主流 AI 视频工具，对 ComfyUI 工作流及 AI 视频生成逻辑有一定了解。\n4. 有半年以上 AI 短剧导演或相关项目经验，能够独立完成从剧本到成片的导演工作。\n5. 需提供个人作品或参与项目案例。\n\n加分项\n\n有擦边、成人向或强剧情短剧导演经验，有成熟爆款作品或完整 AI 短剧项目经验者优先。", "cat": "AI / AIGC"}, {"id": "171", "title": "AI短剧导演", "salary": "15K-35k", "location": "未明确", "jd": "我们是一支专注于AI短剧内容创作及工具研发的团队，现招聘AI短剧导演。不论你是导演/影视制作背景，或是拥有丰富的AI短剧创作经验，欢迎投递。\n\n岗位职责\n    结合AI视频生成等短剧工具，探索并深度优化短剧创作流程及技巧，推动传统导演经验与AI生产方式融合；\n    研究剧本及镜头创作技巧，沉淀创作方法；\n    对运营团队的短剧剧本创作、镜头创作进行培训与指导；\n    与编剧、AI技术/工具团队、后期制作等角色协同配合，确保创作意图在AI生成环节被准确执行。\n    负责AI短剧从剧本到最终成片的全流程制作，把控成片质量和创作方向；\n     根据剧本完成分镜设计、镜头规划及视觉表达，确保画面呈现符合剧情表达需求；\n    对剧情节奏、人物表演、画面质感及后期效果进行把控，以及沉淀相应方法论和技巧。\n\n\n任职要求\n    熟悉短剧剧本结构与创作方法，能对剧本创作提出专业的修改和指导意见；\n    熟悉AI视频生成工具的创作流程与使用技巧，有AI内容创作经验者优先；\n    有完整作品者优先，请附作品集。\n    具备影视内容全流程制作经验，熟悉剧本→表演→摄影→构图→镜头→灯光→声音→剪辑→成片的完整链路；\n    具备较强的导演能力、镜头语言表达能力和审美判断力；\n    具备短剧内容创作经验，或影视、网剧、广告、短视频导演经验（两者满足其一即可）；\n\n综合素质：\n    对短剧竖屏叙事节奏、观众留存逻辑有一定认知，能在有限时长内完成有效的情绪与剧情表达；\n    具备培训与指导能力，善于将创作经验总结提炼为可复用的方法并传授给他人；\n    愿意尝试并适应AI驱动的新型制作流程，不局限于传统拍摄思维，能持续研究和优化创作方法；\n    沟通表达能力强，能与编剧、技术、后期、运营等多角色高效协作。\n\n加分项\n    有独立完成的短剧、网剧、广告等完整导演作品；\n    有AI短剧成片作品，且有一定播放/传播数据支撑；\n    有AI生成视频（文生视频、图生视频、数字人等）相关制作经验；\n    熟悉短剧行业常见节奏套路（如开篇强冲突、分集钩子设计等）；\n    有培训、带教经验，或有创作方法总结、教程等沉淀成果。", "cat": "AI / AIGC"}, {"id": "172", "title": "AI短剧编剧", "salary": "12k-20k", "location": "未明确", "jd": "岗位职责\n负责 AI成人向剧情短剧的选题策划、人物设定、故事大纲及分集剧本创作，结合AI制作特点设计可落地的剧情，与制作团队配合，保证故事吸引力、叙事节奏和交付效率。\n岗位要求\n1：有短剧、影视、网文或漫画等相关创作履历，面试需提供剧本或已上线作品；\n2：了解成人向题材的受众偏好，擅长人物关系、情绪张力、剧情冲突及悬念设计；\n3：熟悉短剧叙事结构，能把控开篇吸引力、分集节奏、剧情转折和集尾钩子；\n4：具备画面化写作能力，能清晰描述场景、动作与情绪，合理控制人物数量和制作复杂度；\n5：能独立完成选题、大纲及分集剧本，并根据制作反馈和上线表现调整内容；\n6：具备良好的沟通能力、责任心及团队配合意识，能够按排期稳定交稿。\n加分项：\n有已上线短剧、成熟连载作品、爆款内容或AI短剧编剧经验者优先。", "cat": "AI / AIGC"}, {"id": "173", "title": "短剧审核（剧本）", "salary": "10k-18k", "location": "未明确", "jd": "岗位职责\n负责 AI成人短剧剧本的内容审核，包括选题方向、人物设定、冲突埋点、剧情逻辑、分集节奏及制作可行性评估，输出明确的修改意见并跟进复核，保证剧本质量符合平台定位与制作要求。\n岗位要求\n1：有短剧编剧、剧本评审、文学编辑或影视策划等相关项目履历，面试需提供创作作品或评审案例；\n2：了解成人向剧情题材及用户偏好，能判断选题吸引力、人物关系、剧情冲突和持续追剧价值；\n3：熟悉短剧叙事结构，能识别开篇乏力、节奏拖沓、情节重复、转折生硬及集尾悬念不足等问题；\n4：具备严谨的逻辑判断能力，能检查人物动机、行为逻辑、时间线及前后情节的一致性；\n5：了解AI短剧制作特点，能评估人物、场景、动作等制作难度，提出兼顾剧情表现与落地效率的修改建议；\n6：具备良好的文字表达、沟通能力及责任心，能依据统一标准审核，清晰标注问题并跟进修改闭环。\n加分项：\n有已上线短剧、成熟连载作品、AI短剧编剧或剧本统筹经验，参与建立剧本评审标准者优先。\n具体薪资根据能力、经验及评审水平确定。", "cat": "客服 / 支持"}, {"id": "174", "title": "运营组长", "salary": "25k-35k", "location": "未明确", "jd": "岗位定位：负责 AI 短剧产品的内容运营与用户增长，带领运营团队建立高效的内容供给和运营机制，对用户活跃、留存及付费转化结果负责。\n\n岗位职责\n1. 业务目标与团队管理：**制定阶段性运营策略，拆解 DAU、新增、留存、充值、会员转化等目标，组织团队执行、复盘并持续优化。\n2. 内容运营：统筹 AI 短剧的内容供给、上架、分类、推荐及封面标题优化，结合播放、完播、追剧和付费数据提升内容表现。\n3. 增长与转化：策划活动、会员运营和用户召回方案，优化从内容触达到观看、追剧、付费的关键路径。\n4. 数据驱动：建立日常数据监测与复盘机制，定位业务问题，推动运营方案及产品迭代落地，并验证效果。\n5. 机制建设：完善内容审核、上架、巡检、活动执行和数据复盘等 SOP，提升团队交付质量与效率。\n6. 协同与提效：与产品、技术、设计及内容团队协作，推动关键项目落地；运用 AI 工具优化内容生产、素材测试、数据分析等工作。\n\n岗位要求\n1. 3 年以上互联网内容或产品运营经验，有独立负责业务指标、带领小团队或牵头跨职能项目的经验。\n2. 熟悉短剧、短视频或内容产品的用户消费路径，能够判断题材、剧情节奏、封面标题及推荐策略对用户行为的影响。\n3. 具备完整的数据分析与运营闭环能力，能从指标变化中定位问题、制定方案并推动结果改善。\n4. 有运营体系搭建或流程规范化经验，既能制定策略，也能带团队深入执行。\n5. 熟练使用 AI 工具，能够将其应用于内容运营和团队提效，并对 AI 生成内容保持质量判断。\n6. 结果导向，具备较强的沟通协调和推进能力，能在业务变化中合理安排优先级。\n\n加分项\n有短剧平台、视频平台、付费内容产品或 AI 内容产品运营经验；有内容商业化、会员体系或从 0 到 1 搭建运营团队的实践经验。", "cat": "运营"}, {"id": "175", "title": "短剧内容策划", "salary": "10-25k", "location": "未明确", "jd": "岗位职责\n1.持续关注热点事件、社交平台热门话题及热门短剧，挖掘具有传播潜力的故事素材。\n2.负责将素材改编为短剧剧本，设计开场钩子、剧情反转与结尾悬念，确保每集内容具备持续吸引力。\n3.借助 AI 工具完成分镜脚本与人物设定；制定选图标准，从 AI 批量生成结果中确定最符合剧情的版本。负责成人向情节的节奏、细节与画面呈现的把控与优化。\n4.负责成片验收，对未达标内容提出修改要求，确保内容质量符合上线标准。\n5.结合播放量、完播率、付费转化等数据进行复盘，总结受众偏好，持续优化选题方向。\n\n任职要求\n硬性要求：\n1.具备较强的故事创作能力，有热点事件、情感故事、娱乐资讯、小说推文等内容创作经验，可提供过往作品。\n2.熟悉短内容的开篇设计，能够在内容开头迅速吸引用户注意力。\n3.具备良好的网络敏感度，持续关注短视频及社交平台，了解当前热门内容趋势。\n4.具备 AI 写作及出图工具的使用能力，或有较强的学习意愿。\n5.具备成人向内容的审美判断能力，能够把握情节铺垫、情绪张力与画面呈现，提升内容吸引力。\n6.严格遵守内容规范：所有角色均为成年人设定，不涉及任何违法违规内容。\n加分项：\n1.有短视频账号或自媒体运营经验，有单条高播放量作品数据。\n2.有网络小说、剧本或漫画脚本的创作经验。\n3.有 AI 辅助写作或出图的实际创作经验。\n4.具备数据分析意识，能够根据用户反馈调整内容方向。", "cat": "内容"}, {"id": "176", "title": "剪辑师", "salary": "10k-18k", "location": "未明确", "jd": "岗位职责\n1. 根据剧本、分镜及导演要求，完成AI短剧的粗剪、精剪和成片交付。\n2. 负责镜头筛选、节奏把控、剧情衔接、情绪推进及结尾悬念设计。\n3. 完成配音、音效、BGM、字幕、调色、转场及片头片尾包装。\n4. 处理AI生成素材中的人物变形、画面闪烁、动作不连贯、穿帮及镜头跳变等问题。\n5. 保持人物、服装、场景、画风及镜头前后的一致性。\n6. 根据业务、导演及运营反馈快速修改，保证内容按时交付。\n7. 沉淀剪辑模板、素材规范及批量化制作SOP，稳定完成日常产能。\n8. 配合团队完成成人向剧情短剧项目制作，并遵守内容合规要求。\n任职要求\n1. 有短剧、影视、动态漫、广告、剧情视频或短视频剪辑经验。\n2. 能独立完成从素材整理到完整成片的剪辑流程。\n3. 熟练使用剪映专业版、Premiere、After Effects、达芬奇等剪辑软件。\n4. 熟悉竖屏短剧节奏，能够把控前几秒吸引力、冲突推进及情绪爆点。\n5. 具备较好的音乐、音效、字幕、画面节奏及视觉审美能力。\n6. 熟悉AI生成视频素材的剪辑和问题修复，有AI短剧、AI漫剧作品者优先。\n7. 执行力强、沟通及时，能够适应远程协作、快速迭代和稳定量产。\n8. 能够接受成人向剧情内容制作方向。\n作品要求\n1. 必须提供本人视频作品，可提供自媒体账号、作品链接或视频文件。\n2. 作品类型包括短剧、影视、动态漫、AI视频、广告或剧情类短视频等。\n3. 需说明本人在项目中具体负责的剪辑及后期环节。\n4. 通过初筛后需完成剪辑测试，重点考察节奏、镜头衔接、音效字幕及成片完整度。", "cat": "内容"}, {"id": "177", "title": "新媒体运营（越南市场男生）", "salary": "18-20k", "location": "未明确", "jd": "岗位职责：\n1. 负责面向越南市场的新媒体账号运营，包括内容策划、文案撰写、发布及日常维护。\n2. 围绕短剧内容制作推广素材，结合越南用户偏好优化选题、标题及内容呈现。\n3. 跟进越南当地热点、热门内容及同类账号，持续调整运营策略。\n4. 负责评论、私信及用户互动，收集用户反馈，提升账号活跃度。\n5. 跟踪曝光、互动、涨粉及引流转化数据，复盘内容效果，推动有效用户增长。\n\n岗位要求：\n1. 熟练使用越南语，能够独立撰写自然、符合当地表达习惯的运营文案，并能用中文与团队沟通。\n2. 熟悉越南市场及用户偏好，了解TikTok、Facebook、YouTube等平台的内容形式与运营规则。\n3. 具备新媒体运营经验，能够独立完成内容策划、发布及效果复盘。\n4. 具备基础视频剪辑能力，能够制作适合社交平台传播的短视频素材。\n5. 对热点和内容有敏感度，执行力强，具备用户增长及转化意识。\n\n加分项：\n1. 有越南市场账号运营经验，能提供账号或代表案例。\n2. 有短剧、影视娱乐类内容运营经验。\n3. 有从零起号、爆款内容、社群运营或达人合作经验。\n\n紧急程度：紧急", "cat": "商务 / 市场"}, {"id": "178", "title": "前端开发工程师（seo方向）", "salary": "面议", "location": "未明确", "jd": "岗位职责\n    负责站群多主题模板体系：服务端渲染模板的组件化与皮肤化，让同一套结构长出多张不同的脸。\n    对 Core Web Vitals（LCP / CLS / INP）负责：首屏 CSS 拆包、资源哈希与长缓存、图片自适应与懒加载。\n    HTML 语义化与页面结构：标题层级（单一 H1、H2–H6 不跳级）、article / section / nav / main 等语义标签用对、图片 alt、链接可抓取，让爬虫能读懂页面在讲什么。\n    落地结构化数据（JSON-LD）、canonical / hreflang / og、分页与内链结构，直接影响收录与排名。\n    支撑多语言站扩张（繁体及多国语言）：多语言 URL 结构与 hreflang、语言切换、界面文案全量外置、不同语种文案长度差异的布局适配。\n    运营后台迭代（Vue3 + Vite + TypeScript + Element Plus）：内容管理、批量操作、权限菜单、大列表性能。\n    短剧 App 客户端迭代（Flutter 安卓 + Web）：播放器、追剧、会员支付、性能与包体优化。\n任职要求\n    2 年以上前端开发经验，至少一个完整项目从 0 到上线的主力经历。\n    不限框架（Vue / React / Svelte / Flutter / 原生 SSR 模板均可），但需具备「SEO 友好渲染」或「App 端开发」其中一项硬能力。\n    熟练使用 AI 编码工具（硬性要求），能用 Agent 批量生产模板与组件并保证质量一致。\n    能 1:1 像素级还原 Figma 设计稿，这是我们的硬性交付标准。\n    严格遵守多语言（i18n）架构：界面文案一律走词条不写死，布局能容纳不同语种的长度差异——这是我们的团队红线。\n    懂 SEO 站的前端优化点：HTML 语义化与标题层级、图片 alt 与懒加载对收录的影响、内链与锚文本、rel 属性（nofollow / sponsored / ugc）、noindex 的正确用法。我们靠搜索引擎流量吃饭，模板写法直接决定收录。\n    理解浏览器渲染、缓存与性能指标，能自己定位性能问题。\n加分项\n    有 SEO 站、内容站、站群前端经验，做过收录与排名相关优化并有数据结果。\n    有服务端渲染（任意技术栈）的深度实践。\n    有 Flutter 或音视频播放（HLS、加密流、自定义播放器）经验。\n    有多主题、多品牌换肤体系的设计与实现经验。\n    做过多语言站或国际化项目，处理过 hreflang、繁简差异、RTL 等问题。\n    熟悉 Node 工程化，能自己写构建脚本与自动化工具。", "cat": "技术 / 数据"}, {"id": "179", "title": "测试工程师", "salary": "10-20k", "location": "未明确", "jd": "岗位职责\n负责播放器、AI工具、自动户平台、小程序、SEO站群的及 SaaS平台的测试工作，覆盖 Web、移动端、小程序、接口及后台管理系统。\n参与需求评审，梳理复杂业务流程、异常场景和边界条件，输出测试方案、测试用例及测试报告。\n负责功能、接口、兼容性、性能、稳定性及权限/多租户等测试，推动问题定位和闭环。\n建设和维护自动化测试，包括接口自动化、UI 自动化及回归测试体系，并接入 CI/CD 流程。\n结合 AI 工具提升测试效率，例如辅助生成测试用例、测试数据、自动化脚本及缺陷分析。\n参与 AI 应用功能测试，关注提示词、模型输出质量、内容安全、稳定性、异常兜底及用户体验。\n与产品、研发、运维协作，持续完善质量规范和线上质量监控能力。\n\n任职要求\n5年及以上测试经验，有复杂业务系统、AI工具、自动户平台、小程序、SEO站、SaaS 平台或中后台系统测试经验。\n熟悉测试流程与方法，能独立制定测试方案，具备较强的风险识别和问题分析能力。\n有接口测试和自动化测试经验，熟悉 Postman、Apifox、JMeter 等工具之一。\n至少掌握一种自动化测试语言或框架，如 Python + Pytest、Java + TestNG、Playwright、Selenium、Cypress 等。\n熟悉 HTTP/HTTPS、RESTful API、JSON、数据库 SQL，能够定位常见前后端及接口问题。\n有内容平台、音视频播放器、直播/点播、CMS、SaaS 多租户、权限体系等相关经验优先。\n有 AI 工具实际使用基础，了解大模型应用的常见测试点，如输出准确性、幻觉、上下文、提示词注入、敏感内容及稳定性。\n责任心强，沟通顺畅，能推动跨团队问题解决。\n\n加分项\n有播放器相关测试经验：播放控制、清晰度切换、字幕、倍速、弱网、断点续播、兼容性等。\n有性能测试、压测、监控告警或线上故障排查经验。\n有 AI 产品、智能客服、知识库/RAG、内容生成类产品测试经验。\n有 CI/CD、Docker、GitLab CI/Jenkins 使用经验。", "cat": "测试 / 运维"}, {"id": "180", "title": "Golang后端工程师", "salary": "面议", "location": "具备远程工作的自驱力。", "jd": "岗位职责\n    负责黄豆App（短剧App）核心后端的迭代与维护：这是一套跑在生产环境的 Go 服务，服务近 600 万注册用户的会员、支付、内容分发全链路，不是练手项目。\n    会员与支付相关功能开发：充值、VIP 套餐、权益补偿、优惠券等碰钱的逻辑，容不得重复扣款或超发，每个改动都要经得起资损审计。\n    渠道分销（CPS 代理）体系的后端开发与维护：佣金结算、提现、代付、对账、代理层级管理。\n    社区功能的后端支撑与迭代：UP 主创作体系、动态、评论、剧照与角色档案等。\n    内容链路对接：与资源池、转码服务、CDN 协同，保证内容同步与加密分发的正确性。\n    消息队列（RabbitMQ）与 MongoDB 的日常使用：消费上游消息、保证幂等、处理对账与补偿场景。\n    配合技术负责人做安全加固：接口限流、权限收紧、支付回调校验等生产安全工作。\n    线上问题排查与根因定位：真实在跑的生产系统，出问题要能当天定位、当天修复。\n任职要求\n    3 年以上 Go 语言后端开发经验，有扎实的生产项目经历，不是仅接触过。\n    必须有支付 / 会员 / 资金相关系统的开发经验：理解幂等、防重放、防超发这些资金安全的基本设计原则，这是硬性门槛。\n    熟悉 MongoDB，关系型数据库至少掌握一种，能独立设计数据模型。\n    熟悉消息队列（RabbitMQ / Kafka 均可）的使用与常见坑：消息丢失、重复消费、顺序性。\n    熟练使用 AI 编码工具进行工程开发（硬性要求）：Claude Code、Codex、Cursor 等 Agent 类工具日常主力使用，能写规格驱动产出、能有效审查与验证 AI 代码。\n    能独立排查线上问题：看日志、定位根因、评估影响面，不是只会在本地跑通。\n    具备远程工作的自驱力。\n加分项\n    有高并发、百万级以上用户规模的生产系统实战经验。\n    做过第三方支付中台对接（微信 / 支付宝 / USDT / 海外支付渠道等）。\n    懂安全：限流设计、幂等键设计、针对资损场景的对抗性测试思维。\n    做过内容 / 社区类产品（UGC、评论、创作者体系）。\n    有短剧、视频、直播等内容型 App 的后端经验。\n    懂运维：Linux、Docker、AWS，能独立排查生产环境问题。", "cat": "技术 / 数据"}, {"id": "181", "title": "Flutter客户端工程师", "salary": "面议", "location": "具备远程工作的自驱力。", "jd": "岗位职责\n    负责短剧AppFlutter客户端的持续迭代与维护：新功能开发、存量模块改造，自己排查线上崩溃与卡顿问题，不是只写页面。\n    短剧内容体验：剧集播放、断点续播与本地观看历史、下载缓存与离线播放，这是内容流产品区别于电商/社交类App的核心难点。\n    多CDN线路容灾与择优：素材多条线路的测速选线、失败自动回退默认线路、上次最优结果持久化复用，保证弱网环境下的加载体验。\n    统一跳转与深链接：公告、任务、Banner、推送等十几种跳转场景收敛到单一分发入口，保证底部Tab状态与页面状态一致，不出现\"页面已跳转、Tab还停在原处\"这类割裂体验。\n    会员与支付相关前端对接：充值、VIP套餐、权益补偿等碰钱逻辑的客户端联调，容不得重复扣款或状态不同步。\n    社区功能前端：UP主动态、评论、IM私信（自研IM插件）等模块的开发与维护。\n    多环境与发布：flavors多环境配置（黄豆App正式版与免费版两套租户并行）、打包签名、灰度发布、崩溃监控。\n任职要求\n    2 年以上Flutter开发经验，至少一个正式上线App的主力开发经历，不是仅接触过demo或练手项目。\n    熟练掌握GoRouter路由与深链接、Dio网络层（鉴权拦截、自动刷新、错误收口）、本地数据持久化（SQLite/Drift、Hive均可）。\n    有响应式状态管理实战经验（Riverpod / Bloc / GetX / Signals 均可），能快速上手不同技术选型，不绑定单一状态管理框架。\n    理解客户端工程化：flavors多环境配置、打包签名、多渠道上架、灰度发布、崩溃监控（Crashlytics等）。\n    熟练使用 AI 编码工具进行工程开发（硬性要求）：Claude Code、Codex、Cursor 等 Agent 类工具日常主力使用，能写规格驱动产出、能有效审查与验证 AI 代码。\n    能独立排查线上问题：看崩溃日志、定位根因、评估影响面，不是只会在本地跑通。\n    具备远程工作的自驱力。\n加分项\n    做过短剧、长视频、直播等内容流产品，理解长列表性能优化、视频流内存释放、下载缓存等重内容场景的特殊考量。\n    做过IM/即时通讯功能（心跳检测、断线重连、离线消息补拉）。\n    做过微信/支付宝等第三方支付对接，理解支付回调幂等与金额校验。\n    懂一点后端（Go / Java 均可），能读懂接口文档、必要时读一段后端代码辅助联调，不需要会写。\n    做过多CDN/多线路容灾选型的客户端实现。\n    有百万级注册用户规模的生产App实战经验", "cat": "技术 / 数据"}, {"id": "182", "title": "客服运营（短剧海外推广 / 网站运营）", "salary": "8k-10k", "location": "未明确", "jd": "1. 负责公司短剧项目在 Twitter/X 等海外社交媒体平台的日常运营，根据短剧内容策划视频、文案、标题、话题标签等推广素材，持续提升内容曝光和用户触达。\n\n2. 负责短剧视频的日常宣发，包括短视频选片、素材整理、剧情卖点提炼、标题文案撰写、热点结合、账号发布及内容排期，提升视频播放量、互动量及网站引流效果。\n\n3. 根据不同短剧题材、剧情冲突点、人物关系及目标用户群体，制定差异化推广策略，持续优化视频标题、文案、标签、封面及发布时间。\n\n4. 负责 Twitter/X 账号矩阵的日常维护与运营，包括内容更新、账号活跃、热点互动、评论区运营及账号数据分析，持续提升账号权重和粉丝增长。\n\n5. 负责海外外网渠道推广，根据短剧项目寻找适合的海外流量平台，包括 Reddit、YouTube、Instagram、Facebook、论坛、社区、博客、影视娱乐网站等渠道进行内容分发和推广。\n\n6. 挖掘海外短剧、影视、娱乐、社区等相关垂直平台及流量渠道，持续拓展新的推广入口，提高短剧品牌及网站在海外互联网的曝光度。\n\n7. 负责通过帖子、视频、图片、评论、话题讨论等形式进行站外内容推广，并根据不同平台规则调整内容形式，提升推广内容的自然曝光和点击效果。\n\n8. 负责短剧网站的站外引流工作，通过社交媒体、社区平台、内容平台及其他海外流量渠道，将目标用户引导至短剧网站，提高网站访问量及有效流量。\n\n9. 关注海外热门短剧、影视娱乐、网络热点及社交媒体趋势，及时挖掘热门话题、流行梗、热门剧集及用户关注方向，并快速结合短剧内容进行推广。\n\n10. 负责竞品推广渠道调研，分析同行短剧网站、影视网站及海外内容平台的流量来源、推广方式、账号布局及热门内容，整理可复制的推广思路。\n\n11. 持续测试不同推广渠道、内容形式及引流方式，根据曝光量、播放量、互动率、点击率、网站访问量等数据评估推广效果，并优化推广策略。\n\n12. 建立并维护海外推广渠道资源库，包括社交媒体账号、论坛、社区、内容平台、博客及其他可推广渠道，定期更新渠道质量及推广效果。\n\n13. 配合网站运营及 SEO 工作，进行海外站外内容曝光、品牌词推广、内容分发及相关资源拓展，提升网站整体流量和品牌曝光。\n\n14. 定期整理推广数据及运营结果，输出阶段性数据总结，包括账号增长、内容曝光、视频播放、网站引流、渠道效果等，并根据数据制定后续推广计划。\n\n## 任职要求\n\n1. 大专及以上学历，专业不限，有互联网运营、新媒体运营、海外运营、短视频运营或推广相关经验优先。\n\n2. 熟悉 Twitter/X 等海外社交媒体平台，对内容发布、账号运营、热点话题、标签及基础流量机制有一定了解。\n\n3. 对 Reddit、YouTube、Instagram、Facebook、海外论坛及社区类平台有一定了解，有实际推广经验者优先。\n\n4. 对短剧、影视、短视频及娱乐内容敏感，能够快速提炼剧情卖点、冲突点、爽点、反转及用户感兴趣的传播点。\n\n5. 具备较好的内容策划及文案能力，能够独立完成视频标题、推广文案、帖子内容及话题标签。\n\n6. 具备较强的互联网信息检索和渠道挖掘能力，能够主动寻找新的海外推广平台及流量入口。\n\n7. 具备基础数据分析能力，能够根据曝光、播放、互动、点击、网站访问等数据判断推广效果并及时调整策略。\n\n8. 具备较强的执行力、学习能力和结果导向意识，能够持续测试不同推广方式并总结有效方法。\n\n9. 能够熟练使用 Excel、Google Sheets 等基础办公工具。\n\n10. 具备基础英文阅读能力，能够浏览海外网站、论坛及社交媒体内容，并完成基础英文推广内容处理。\n\n## 加分项\n\n- 有 Twitter/X、Reddit、YouTube、Instagram、Facebook 等海外平台推广经验；\n- 有短剧、影视、网文、小说、娱乐行业相关经验；\n- 有海外网站引流、站外推广、社区营销或内容分发经验；\n- 有短视频剪辑、封面制作、字幕处理能力；\n- 熟悉 CapCut、剪映、Canva、Photoshop、Premiere 等内容制作工具；\n- 了解 SEO、外链、内容营销、网站流量分析等相关知识；\n- 有海外账号矩阵运营或从 0 到 1 搭建推广渠道经验。\n\n## 岗位核心目标\n\n围绕公司短剧项目，通过 Twitter/X 及各类海外社交媒体、社区、论坛、内容平台持续进行短剧内容宣发和站外推广，不断拓展海外流量渠道，为短剧网站获取稳定、有效的海外用户流量，并通过数据分析持续优化推广效率。", "cat": "客服 / 支持"}, {"id": "183", "title": "UI 设计师（高级 ）", "salary": "15k-25k", "location": "4. 有远程工作经验者优先；", "jd": "岗位职责：\n1. 负责平台各业务模块（长短视频、圈子社区、漫画小说、美图、AI 工具、活动等）的视觉与交互设计，保证高质量交付；\n2. 遵循团队设计规范，熟练使用 Figma 组件库进行设计，保持产品视觉与体验的一致性；\n3. 对接产品、运营等需求方，准确理解需求并转化为设计方案，参与设计评审、按节奏完成交付；\n4. 从 C 端用户视角打磨界面与交互细节，关注可用性与体验，不停留在视觉层面；\n5. 运用 AI 工具辅助设计工作（如出图、设计方案、素材生成、文案辅助等），提升个人产出效率；\n6. 配合团队规范与协作流程，在远程环境下自我管理、主动同步进度、高效推进工作。\n\n岗位要求：\n1. 5 年以上 UI 设计经验，有完整的项目设计与交付经验；\n2. 扎实的视觉设计功底，作品集能体现良好的 C 端产品设计能力；\n3. 有 C 端产品设计经验，理解 C 端用户习惯；\n4. 具备基本的交互和用户体验意识，不只是出图；\n5. 熟练使用 Figma，能在团队设计规范和组件库基础上高效产出；\n6. 会使用 AI 设计 / 效率工具辅助设计工作；\n7. 具备良好的沟通能力，能顺畅对接产品、运营等需求方；\n8. 具备远程协作能力，能自我管理、主动推进，靠谱、注重细节。\n\n其他要求：\n1. 有泛娱乐类产品（视频、社区、内容、社交、直播、漫画阅读等）设计经验优先；\n2. 有多业务线 / 综合内容平台的设计经验优先；\n3. 用过设计系统 / 组件库（了解 Component、Variants）者优先；\n4. 有远程工作经验者优先；\n5. 投递请附作品集，可重点体现设计思路、C 端 / 泛娱乐相关项目及交互体验思考。", "cat": "设计"}, {"id": "184", "title": "AIGC编剧制作师", "salary": "12–25K", "location": "未明确", "jd": "岗位职责\n1. 根据项目定位完成 AI 短剧、AI 漫剧和短视频内容的选题策划、故事构思及剧本创作。\n2. 独立完成故事梗概、主题设定、人物小传、人物关系、分集大纲和分集剧本。\n3. 负责剧本正文、对白、旁白、动作描写、场景描写和情绪表达的撰写与修改。\n4. 根据短视频和短剧传播特点设计开篇钩子、核心冲突、剧情反转、情绪节点和集尾卡点。\n5. 将完整故事拆分为适合 AIGC 制作的场景、镜头、人物动作、表情、对白和画面要求。\n6. 根据项目需要完成分镜脚本，明确镜号、场景、景别、画面内容、人物动作、台词、时长及转场要求。\n7. 使用 ChatGPT、Claude、DeepSeek、豆包等 AI 工具辅助进行选题分析、资料整理、剧情设计和文本修改。\n8. 根据 AI 生成效果与美术、导演、后期团队沟通，及时调整剧本、对白、镜头和制作方案。\n9. 负责已有剧本的结构优化、节奏调整、对白润色、逻辑修正和内容完善。\n10. 负责纯绿色、健康合规内容的策划与剧本制作，确保内容符合平台规范。\n11. 跟进作品播放、点赞、收藏、完播和涨粉等数据，根据用户反馈优化选题和剧情方向。\n12. 持续沉淀题材库、人物库、剧情模板、剧本模板、分镜模板和标准化编剧流程。\n岗位要求\n1. 具备扎实的剧本创作能力，能够独立完成从选题、大纲到分集剧本的完整创作。\n2. 熟悉短剧、漫剧、短视频、网文或影视内容的叙事结构和创作方法。\n3. 具备较强的故事构建、人物塑造、人物关系设计、对白设计和情节推进能力。\n4. 熟悉短视频内容节奏，能够设计开篇吸引力、冲突升级、情绪递进和结尾悬念。\n5. 能够将文字剧本拆分为清晰、具体、可执行的分镜脚本。\n6. 具备较好的画面感，能够准确描述场景、人物动作、表情、镜头和视觉重点。\n7. 能够使用 AI 工具辅助完成资料整理、情节推演、文本改写和剧本润色，但具备独立判断和修改能力。\n8. 具备较强的内容敏感度、原创意识和合规意识，能够独立完成纯绿色内容创作。\n9. 具备良好的沟通能力、执行能力和团队协作意识，能够适应批量化内容生产。\n10. 能够按时交付大纲、分集梗概、剧本初稿、修改稿和分镜脚本。\n加分项\n- 有短剧、漫剧、网文、动画、影视编剧或短视频编剧经验。\n- 有成熟剧本案例、上线作品或完整项目作品集。\n- 有 AI 短剧、AI 漫剧或 AIGC 内容生产经验。\n- 熟悉竖屏短剧、系列化 IP、角色 IP 或绿色内容渠道的创作特点。\n- 具备一定的分镜、导演或影视后期基础。", "cat": "AI / AIGC"}, {"id": "185", "title": "产品经理", "salary": "20k-30k", "location": "未明确", "jd": "岗位职责：\n负责视频内容产品规划与迭代\n负责公司视频内容类产品的整体规划、功能设计和持续优化，覆盖短视频、长视频、直播、内容社区、创作者体系、内容运营后台等相关方向。能够结合业务目标、用户需求、竞品情况和数据表现，制定清晰的产品路线图和阶段性目标。\n优化视频内容消费体验\n围绕视频播放、推荐流、详情页、搜索、评论、点赞、收藏、分享、关注、举报反馈等核心链路，持续提升用户体验和产品效率。重点关注播放量、完播率、人均观看时长、互动率、留存率等核心指标。\n推动内容生态建设\n参与内容生产、审核、分发、消费、沉淀的完整链路设计，推动内容标签、内容分层、优质内容识别、低质内容治理、创作者激励等机制建设，提升平台内容供给质量和内容分发效率。\n数据驱动产品增长\n建立和完善视频内容产品的数据指标体系，通过数据分析发现问题、验证假设、制定优化方案。能够独立完成需求效果复盘、漏斗分析、用户分层分析、AB 实验方案设计，并推动产品持续增长。\n跨团队项目推进\n负责重点项目从需求调研、方案设计、PRD 编写、评审推进、研发跟进、测试验收、上线发布到数据复盘的完整闭环。协调研发、设计、算法、运营、审核、数据、市场等团队资源，保障项目高质量交付。\n负责产品团队管理\n负责产品团队的目标拆解、任务分配、过程跟进和质量把控，能够指导团队成员提升需求分析、产品设计、数据分析、项目推进和业务理解能力，推动团队形成规范化、高效率的产品工作机制。\n\n岗位要求：\n本科及以上学历，5 年以上互联网产品经验，其中至少 2 年视频内容、短视频、直播、内容社区、信息流推荐或内容平台相关经验。\n视频内容产品能力\n熟悉视频内容产品核心链路，理解内容生产、内容审核、推荐分发、播放互动、内容运营、创作者体系等模块的产品设计逻辑。对短视频、直播、社区内容、UGC/PGC 内容生态有较深入理解。\n数据分析能力\n具备较强的数据意识和指标拆解能力，熟悉播放量、曝光点击率、完播率、互动率、关注转化率、留存率、内容供给量、优质内容占比等常见指标，能够通过数据定位问题并推动优化。\n项目推进能力\n具备复杂项目管理经验，能够在多部门协作场景下明确目标、拆解任务、推动执行、识别风险，并保证项目按计划落地。具备较强的沟通协调能力和问题解决能力。\n团队管理能力\n具备 2 年以上产品团队管理经验，有管理 3 人及以上产品团队经验优先。能够进行团队目标管理、过程管理、人才培养和结果复盘，带领团队持续交付高质量产品成果。\n加分项\n\n有短视频平台、直播平台、内容社区、影视内容平台、在线教育视频、新闻资讯视频化产品经验者优先。\n\n有推荐系统、内容标签、内容审核、创作者平台、内容商业化、会员付费、广告变现等相关经验者优先。\n\n有 AI 视频生成、智能剪辑、视频理解、智能审核、AIGC 内容生产工具相关经验者优先。\n\n熟悉 SQL、埋点体系、AB 实验、BI 数据看板、用户增长模型者优先。\"\n\n其他要求：数据分析", "cat": "产品"}, {"id": "186", "title": "平面设计师（营销视觉）", "salary": "15-25k", "location": "未明确", "jd": "岗位方向： 媒体广告、营销推广、动态创意、落地页设计\n岗位职责：\n负责各类成人向产品的广告推广素材设计，包括 Banner、广告图片、信息流广告、活动宣传图等；\n负责 GIF、短视频广告、静态/动态 Banner 等推广素材的创意设计与动效制作；\n负责产品推广落地页（Landing Page）、H5 活动页面的视觉设计与优化；\n根据不同媒体平台的广告规范，完成多尺寸、多比例、多版本的素材适配；\n理解运营推广需求，结合产品特点、目标用户及营销卖点，输出具有吸引力和转化导向的视觉方案；吸引用户强烈的点击欲望，实现产品的点击量的持续增长和增加用户粘。\n岗位要求：\n具备成人、影视、短视频或内容平台相关行业 3 年及以上视觉设计、广告设计或营销创意设计相关经验；\n具备较强的视觉审美、构图、排版、色彩、字体及人物处理能力，能够独立完成不同风格的平面视觉设计；\n精通常用设计工具和 AI 设计工具，能够利用 AI 辅助生成图片、视频及广告创意素材；\n能够独立完成 GIF、动态广告及基础视频广告制作；\n具备落地页、H5 页面设计经验，了解 Web / 移动端设计规范；\n了解主流媒体平台的广告素材规范，能够快速完成多尺寸、多版本素材制作；\n具备一定的营销思维，能够理解广告卖点及用户需求，设计具有吸引力的推广素材；\n具备良好的沟通能力、执行效率及团队协作意识，能够适应多项目并行及快速迭代的工作节奏。\n其他要求：\n展示个人以往较优秀且具有代表性的平面设计作品\n如有使用 AI 工具完成的设计项目，需展示 AI 生成素材 + 后期设计/精修后的最终成品\n展示个人以往较优秀且具有代表性的平面设计作品\n如有使用 AI 工具完成的设计项目，需展示 AI 生成素材 + 后期设计/精修后的最终成品", "cat": "设计"}, {"id": "187", "title": "中级运营", "salary": "12-15k", "location": "未明确", "jd": "岗位职责：  \n1. 内容交付与上架闭环：承接短剧/站点内容批次（建剧、挂载、封面、免费集、题材与上架），按台账推进到可核验终态，减少积压与缺源/转码卡点空转  \n2. 内容结构与转化优化：围绕点击、完播、留存、付费转化，持续优化封面、标题、前3秒、标签与分发结构，沉淀可复用的内容生产与质检标准  \n3. 数据跟踪与问题拆解：日常跟踪新增、活跃、留存、转化等核心指标，定位内容/分发/页面问题，提出可执行优化方案并推动落地  \n4. 标准与协作：与产品、研发、测试、运维协同，推动内容相关功能与后台能力迭代；把「UAT 为源、同步到产」等口径写清并盯回执，避免环境各做一套  \n5. 过程管理：独立整理会议纪要（结论、待办、负责人、完成时间），持续跟进延期与阻碍，及时升级需协调事项  \n\n岗位要求：  \n1. 3–5 年内容/短剧/站点运营经验（有成人内容或强合规内容经验优先）  \n2. 有完整参与或主导内容项目从 0 到 1，或增长阶段批量上架/改版经验  \n3. 数据分析能力强，能独立拆问题、定策略、用结果验收，不空报「已完成」  \n4. 熟悉内容生产全流程，具备内容判断与筛选能力；能建立封面/标题/免费集等可复用标准  \n5. 执行力与跨团队推动力强，抗压，适应快节奏多线并行（批次交付 + 数据优化同时推进）  \n6. 熟练 Excel / WPS / Google Sheets（函数、筛选、透视表），能独立完成运营数据整理与分析  \n7. 能独立写纪要并跟进待办，对延期、卡点、需上级拍板事项及时反馈", "cat": "运营"}, {"id": "188", "title": "中高级运营专员（创作者社区运营）", "salary": "15–25k", "location": "未明确", "jd": "一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕创作者运营、用户运营、内容运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责创作者运营管理，推动创作者引入、分层、激励、活跃维护及产出提升，保障内容持续供给；\n5. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n6. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n7. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进；\n8. 根据业务发展需要，参与活动运营、专题策划、转化路径优化及其他与产品增长相关的专项工作。\n\n二、任职要求\n1. 3年以上互联网运营经验，社区运营、用户运营、内容运营方向优先；\n2. 具备完整项目运营经验，能够独立负责从目标制定、策略拆解、执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有0-1项目搭建经验、复杂业务增长经验、多平台运营经验者优先；\n8. 有团队管理或带教经验者优先；\n9. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "运营"}, {"id": "189", "title": "高级产品经理", "salary": "20k-25k", "location": "未明确", "jd": "岗位JD：\n一、岗位职责\n负责视频、漫画、小说、短剧等业务的产品规划与交付，连接用户体验、内容生态与商业增长；在复杂协作环境中将业务目标转化为可落地的产品成果，并通过 AI 提升产品全链路效率与质量。\n\n1.制定产品战略、产品路线图及需求优先级，覆盖用户端、创作者端及运营后台，推动从用户研究、方案设计、研发上线到数据复盘的完整闭环。\n2.持续优化视频播放、漫画/小说阅读、短剧观看及社区互动体验，关注内容发现、推荐分发、性能稳定性、跨端一致性及用户留存。\n3.设计粉丝经济与商业化体系，包括会员订阅、内容付费、虚拟商品、打赏、广告、及创作者激励等，兼顾收入增长、用户体验、创作者收益与平台生态。\n4.建立核心指标及实验机制，对活跃、留存、内容消费、付费转化、和内容供给等指标负责，通过数据发现问题并持续迭代。\n5.统筹产品、研发、设计、测试、数据、内容、运营、等资源，明确项目范围、里程碑、依赖、风险及验收标准；能在资源受限、目标变化时快速决策并保障交付。\n6.主导 AI 在用户研究、数据分析、PRD/原型、测试及运营工作流中的应用；建立效果评测、人机协作、成本、安全等机制，沉淀可复用能力。\n7. 拥有成人行业经验，若其他方面特别优秀，无成人行业经验可放宽限制 \n备注：\n1.请候选人投递简历时准备不少于1个经脱敏的代表案例，形式不限，可为PRD、HTML、原型、数据看板或编排好的工作流；至少包含1个内容/商业化项目或1个AI赋能项目。\n2.面试作业考察。候选人需在面试结束后，根据面试官提供的任务要求，在指定时间内完成并提交一个作业。\n\n二、任职要求\n1.6年以上互联网产品经验，具备复杂产品主导经验及可量化业绩，拥有从0→1及规模化迭代案例。\n2.具备视频、漫画、小说、短剧等内容产品经验，至少两个方向有实际项目经历，其中一个方向达到核心负责人深度。\n3.熟悉内容平台、创作者生态、社区运营、内容分发及粉丝商业化，能够平衡用户价值、内容供给与商业目标。\n4.具备项目管理视角、强执行力和主人翁意识，能够拆解模糊目标、协调多团队、处理冲突并对最终结果负责。\n5.具备良好的商业判断、数据分析、用户洞察和技术理解；有推荐系统、付费转化、广告体系等经验者优先。\n6.有 AI 协作经验 或 AI 工作流的真实落地成果，能够说明场景选择、方案边界、上线指标、投入成本及业务价值。", "cat": "产品"}, {"id": "190", "title": "中高级产品运营", "salary": "15K-25K", "location": "未明确", "jd": "一、岗位职责：\n1.负责产品的整体运营策略制定与落地，对日活、用户时长、留存率等核心指标负责。\n2.负责制定并执行用户增长策略，搭建完善增长体系及精细化运营体系，维护健康的产品生态。\n3.主导内容生态搭建，提升内容消费效率与用户互动率；负责社区氛围营造，提升用户粘性与归属感。\n4.建立完善的运营数据监控体系，通过数据优化运营策略。\n5.关注行业动态与竞品策略，推动运营模式与活动形式的创新。\n\n二、任职要求：\n1.本科及以上，3-5 年 +视频 / 短剧/社交APP 运营经验。\n2.精通运营全流程（增长 / 内容 / 社区 / 活动/数据 / 商业化），能够独立制定并落地完整的运营策略。\n3.能够熟练使用数据分析工具，从数据中发现问题、解决问题。\n4.社交 / 视频赛道深度理解，结果导向，抗压能力强。", "cat": "运营"}, {"id": "191", "title": "平面设计师", "salary": "10k-18k", "location": "未明确", "jd": "一、岗位职责\n1.负责品牌日常视觉设计工作，包括海报、宣传物料、活动主视觉、社媒配图等输出；\n2.配合运营及内容团队，完成营销活动相关视觉创意及落地设计；\n3.参与品牌视觉体系优化，统一整体视觉风格及设计规范；\n4.根据项目需求，独立完成创意构思、排版设计及素材整合；\n5.结合 AI 工具（如 Midjourney、Claude、PS AI 等）提升设计效率与视觉创新能力；\n6.跟进设计物料最终落地效果，保证输出质量与时效；\n7.负责视频封面设计，结合内容主题与平台调性，输出高吸引力封面素材；\n8.配合视频运营团队，完成贴片广告、缩略图等视频相关视觉物料；\n\n二、任职要求\n1.大专及以上学历，视觉传达、平面设计、美术相关专业优先；\n2.熟练使用 Photoshop、Illustrator、Figma 等设计软件；\n3.具备良好的审美能力、版式能力及视觉表达能力；\n4.有品牌宣传、活动视觉、电商或新媒体设计经验优先；\n5.对 AI 视觉创作有一定了解，愿意学习并尝试 AI 设计工具；\n6.具备良好的沟通能力和执行力，能够高效推进项目落地；\n7.有视频封面设计经验，了解不同平台（抖音、YouTube、B站等）封面设计规范与点击率逻辑\n简历需附作品集（重点展示视频封面、活动视觉、品牌设计或创意案例）", "cat": "设计"}, {"id": "192", "title": "AI视频剪辑师（短剧/影视二创）", "salary": "10k-15k", "location": "未明确", "jd": "负责短剧、电影、网剧等影视素材的AI辅助二创、剧情重组及内容魔改，结合剪辑能力与AI工具产出具备传播力的长、短视频内容。\n\n一、岗位职责\n\n1. 完成影视素材筛选、剧情拆解、混剪、魔改及剧情重组；\n2. 提炼高潮、冲突、反转等关键内容，优化短视频节奏和叙事效果；\n3. 使用AI工具完成风格化、换脸、换装、场景替换、画质增强、补帧、字幕等处理；\n4. 根据运营需求及热点方向快速制作影视二创及不同平台适配版本；\n5. 独立完成选题、素材处理、AI制作、剪辑包装到最终成片；\n6. 沉淀素材库、模板、AI工作流及二创SOP，提高批量生产效率；\n7. 根据播放、完播、互动等数据持续优化内容。\n\n二、任职要求\n\n1. 有视频剪辑经验，有短剧二创、影视混剪、电影解说、剧情魔改经验优先；\n2. 熟练使用PR、AE、剪映等工具，具备良好的剪辑节奏、调色、字幕及特效能力；\n3. 有AI视频实操经验，熟悉AI图像、AI视频、FaceSwap、AI配音等相关工具；\n4. 理解影视叙事、镜头语言及短视频传播逻辑，具备内容审美和爆款意识；\n5. 执行力强、出片速度快，能够适应多任务并行；\n6. 有AI工作流、批量生产、模板或SOP搭建经验优先。\n\n三、作品要求\n面试需提供2—3个影视二创、短剧剪辑或AI视频代表作品，并能够说明个人负责内容、AI工具使用方式及制作思路。有播放、完播、互动等实际数据案例优先。\n\n四、岗位核心交付\n能够独立完成影视二创项目，并逐步建立稳定的内容产能及标准化AI二创生产流程。", "cat": "AI / AIGC"}, {"id": "193", "title": "中高级平面设计", "salary": "10k-18k", "location": "未明确", "jd": "一、岗位职责：\n\n1.主要负责各类成人向产品的视频封面设计，包括批量封面制作、视觉优化及不同题材风格适配；\n2.根据产品定位、内容特点及运营需求，持续优化封面的构图、人物处理、字体、色彩及视觉吸引力；\n3.负责其他日常及临时性平面设计需求，包括静态/动态宣传图、落地页、活动海报、引流图等；\n4.配合运营及相关业务部门完成设计调整、版本迭代及多尺寸适配，保障需求按时交付；\n5.结合AI设计工具及相关工作流提升素材处理、批量制作及设计效率。\n\n二、任职要求\n\n1. 有成人、影视、短视频或内容平台相关行业经验，具备视频封面、影视海报、人物类宣传视觉等相关项目经验者优先；\n2. 具备较强的视觉审美、构图、排版、色彩、字体及人物处理能力，能够独立完成不同风格的平面视觉设计；\n3. 熟悉主流AI图像生成及辅助设计工具，能够结合AI完成人物、场景、素材生成、高清修复、背景替换、风格调整及批量处理；\n4. 具备AI素材二次设计与精修能力，不依赖单纯生成结果，能够完成合成、细节修正及商业化视觉落地；\n5. 能够适应批量封面、多项目并行及临时加急需求，在保证设计质量的同时兼顾交付效率；\n6. 具备较强的学习能力和设计敏感度，能够主动关注并尝试新的AI工具、模型及设计工作流；\n7. 具备良好的沟通与需求理解能力，能够根据产品定位、内容题材及运营反馈快速完成设计调整与优化。\n\n三、作品要求\n\n1. 展示个人以往较优秀且具有代表性的平面设计作品，至少包含2类及以上，如：视频封面、影视海报、人物类宣传图、活动视觉、字体设计等；\n2. 作品集中需包含一定数量的人物类及封面类设计作品，能够体现构图、人物处理、排版、字体、色彩及视觉氛围塑造能力；\n3. 如有使用AI工具完成的设计项目，需展示AI生成素材 + 后期设计/精修后的最终成品；\n4. 有批量封面、系列化视觉或多风格设计案例者优先展示；\n5. 可提供 PDF、图片整理文件或在线作品集链接，作品需清晰标注个人实际参与及负责内容。", "cat": "设计"}, {"id": "194", "title": "TG社群运营", "salary": "10k-15K", "location": "未明确", "jd": "一、岗位职责\n1.负责黄果 Telegram 社群的日常运营，包括社群炒群活跃、话题策划、互动引导、内容发布及用户维护，持续提升社群活跃度。\n2.根据社群用户特点，策划日常互动话题、福利活动及热点讨论，带动群内交流氛围，提高用户参与度及留存率。\n3.负责TG社群拉新及用户增长，通过社群推广、资源互换、跨群合作等方式，持续扩大社群用户规模。\n4.配合产品宣传及推广需求，发布产品内容、活动信息及渠道链接，引导社群用户访问产品，提升注册及下载转化。\n5.负责社群日常管理，处理用户咨询、广告刷屏及违规内容，维护良好的社群交流环境。\n6.定期统计社群新增人数、活跃人数、互动情况及渠道引流数据，分析运营效果并持续优化社群运营策略。\n7.关注竞品TG社群运营方式，学习优秀社群的互动玩法及增长策略，持续优化社群活跃及用户维护机制。\n\n二、任职要求\n1.具备1年以上社群运营相关经验，有色站 Telegram 社群运营、炒群活跃或用户增长经验者优先。\n2.熟悉 Telegram 群组、频道及机器人等基础功能，了解TG社群日常管理及运营方式。\n3.具备较强的社群互动及话题引导能力，能够主动营造聊天氛围，调动群成员参与讨论。\n4.熟悉互联网热点及网络流行文化，具备一定的文案能力，能够结合热点快速策划社群互动内容。\n5.具备一定的用户增长意识，了解社群拉新、促活、留存及产品引流的基本运营逻辑。\n6.工作积极主动，执行力强，能够及时响应社群动态，独立处理日常运营问题。", "cat": "运营"}, {"id": "195", "title": "AI成人短剧编剧", "salary": "15k-20k", "location": "未明确", "jd": "岗位JD描述\n负责AI成人短剧选题策划、欲望线与人物关系设计、剧本创作及分集内容开发。结合AI视频制作特点，创作具备强开场、强欲望、强冲突、强情绪、持续钩子和可生产性的18+短剧剧本，并在平台合规边界内控制尺度；根据审核意见及上线数据持续迭代内容。\n一、岗位职责\n1、负责AI成人短剧选题策划、故事构思、人物设定（须全员明确18岁以上）、欲望线设计、剧情结构及分集剧本创作。\n2、设计开场钩子、核心欲望冲突、情绪/情欲爆点、关系反转及集尾悬念，提高内容吸引力、完播率和续看动力。\n3、根据AI视频生产特点合理控制人物数量、场景数量、服装造型、复杂动作、多人同框及制作难度，提升剧本可生产性；情欲场面需可分镜、可生成、可过审。\n4、在公司内容红线与各分发平台规则内规划尺度档位，避免未成年及人兽相关的违禁题材及其他不可上线内容。\n5、根据剧本审核意见完成修改、版本迭代及剧本锁定；对审核打回的尺度、人设、节奏问题快速返修。\n6、配合主管、美术、分镜及视频生成团队处理制作过程中出现的剧情、尺度执行和镜头可生成问题。\n7、持续储备新题材、新故事及可系列化内容（都市外围、重逢交易、权力关系、职场禁忌、古风权谋情欲、恶搞成人向等），维护团队成人剧本库和可生产剧本储备。\n8、使用AI辅助写作工具提升资料整理、创意拓展、分集扩写和剧本迭代效率；对模型拒写、安全过滤导致的改写需求能独立给出可生产替代方案。\n9、结合首轮上线数据复盘开场、尺度节奏、完播、续看、付费转化等表现，为后续剧本优化提供依据。\n二、任职要求\n1、具备较强的故事创作、剧情结构设计、人物塑造和文字表达能力；能写清楚人物动机、关系张力与情欲推进，而不是堆砌露骨描写。\n2、熟悉或长期关注成人短剧、言情/都市情色网文、影视限制级内容、漫画、剧本杀或剧情类短视频；对「先欲后情 / 先情后欲」两类结构有基本判断。\n3、能够理解并运用强开场、强欲望、强冲突、强情绪、连续钩子等短剧创作逻辑；懂得把情欲场面当作戏剧节拍，而不是独立黄段。\n4、接受AI辅助创作及标准化剧本生产流程，愿意根据审核意见快速修改；能接受公司对尺度、人设、台词的统一规范。\n5、网文作者（言情/都市/情色向）、短剧编剧、剧本杀作者、内容编辑、影视策划及优秀写作爱好者优先；有成人向连载或付费内容经验者优先。\n6、不要求必须具备AI视频制作经验，但需要理解「可制作性」并主动学习AI生产限制（人物一致性、场景复用、动作复杂度、服装遮挡、敏感词与模型拒图等）。\n7、具备基本合规意识：所有角色必须成年；不写、不美化涉及未成年人的任何性内容；能区分违法、违禁题材。\n8、接受以剧本采纳率、可生产率、返修情况、审核通过率及后续上线表现（完播、续看、付费）作为重要评价依据。\n9、对成人题材无道德洁癖，能稳定产出，不因个人尺度不适中途拒写已立项方案。\n三、加分项（非必须）\n1、能独立完成人物小传、关系图、分集大纲、分集剧本、分镜提示词（静帧描述+运动）中的两项以上。\n2、有系列化开发经验，能把单集冲突做成可续更的人物关系和欲望闭环。\n3、了解国内/海外成人短剧或短视频平台的常见审核口径，能提前规避高风险桥段。\n4、有与美术、分镜、生成同事协作的经验，能用「可执行语言」改剧本，而不是只强调文学性。", "cat": "AI / AIGC"}, {"id": "196", "title": "AI视频内容工程师（短剧/影视二创）", "salary": "12k-18k", "location": "未明确", "jd": "岗位JD描述\n负责成人向短剧、电影、网剧等影视素材的AI辅助二创、剧情重组及内容魔改，结合剪辑能力与AI工具产出具备传播力的成人向短视频内容。\n\n一、岗位职责\n\n完成成人向影视素材筛选、剧情拆解、混剪、魔改及剧情重组；\n提炼高潮、冲突、反转、情色元素等关键内容，优化短视频节奏和叙事效果；\n使用AI工具完成风格化、换脸、换装、场景替换、画质增强、补帧、字幕、AI配音等处理（支持成人向内容）；\n根据运营需求及热点方向快速制作成人向影视二创及不同平台适配版本；\n独立完成选题、素材处理、AI制作、剪辑包装到最终成片；\n沉淀成人向素材库、模板、AI工作流及二创SOP，提高批量生产效率；\n根据播放、完播、互动等数据持续优化内容。\n二、任职要求\n\n有视频剪辑经验，有成人向短剧二创、影视混剪、剧情魔改经验优先；\n熟练使用PR、AE、剪映等工具，具备良好的剪辑节奏、调色、字幕及特效能力；\n有AI视频实操经验，熟悉AI图像、AI视频、FaceSwap、AI配音等相关工具（支持成人向内容处理）；\n理解影视叙事、镜头语言及短视频传播逻辑，具备内容审美和爆款意识；\n执行力强、出片速度快，能够适应多任务并行；\n有AI工作流、批量生产、模板或SOP搭建经验优先。\n三、作品要求\n面试需提供2—3个成人向影视二创、短剧剪辑或AI视频代表作品，并能够说明个人负责内容、AI工具使用方式及制作思路。有播放、完播、互动等实际数据案例优先。\n\n四、岗位核心交付\n能够独立完成成人向影视二创项目，并逐步建立稳定的内容产能及标准化AI二创生产流程。", "cat": "AI / AIGC"}, {"id": "197", "title": "后端工程师", "salary": "21k-37k", "location": "未明确", "jd": "负责视频类后端核心模块的系统设计、技术方案评审与落地，包括内容发布、内容分发、播放服务、互动系统、账号体系、运营后台与监控体系。  \n基于微服务/模块化架构主导服务拆分与演进，优化接口链路、数据库访问与异步任务机制。  \n设计并保障视频全链路稳定运行：上传 → 转码 → 存储 → 分发 → 播放统计的可用性与可观测性。  \n建设高并发能力：限流、熔断、降级、幂等、重试、异步化、队列化等高可用与韧性能力。  \n推动监控体系建设，建立关键指标体系（播放成功率、首帧耗时、转码成功率、接口 P99、错误率、任务积压、核心链路超时率）并持续迭代。  \n负责数据库与缓存治理：索引优化、冷热数据策略、分片/分库分表评估、SQL 调优与存储成本控制。  \n组织并推动接口文档、联调、Code Review、发布评审与回归，保障交付质量和线上稳定。  \n与客户端、算法、前端、测试、运维协作，制定版本计划、排期和风险清单，推动问题闭环。  \n指导初中级工程师，沉淀架构方案、开发规范与故障处置文档，提升团队交付效率。\n任职要求\n本科及以上学历，计算机相关专业优先。  \n5 年以上后端开发经验，3 年以上大流量互联网服务经验，具备从零到一或一到多迭代落地能力。  \n精通至少一种后端语言（Node.js、PHP、Go 中至少一种），并有线上高并发服务开发与问题排障经历。  \n熟悉服务架构与接口设计（RESTful / RPC）、鉴权与权限体系、消息队列、缓存、数据库建模与优化。  \n有能力独立定位并优化性能瓶颈（数据库、缓存、I/O、事件循环/协程、连接池、慢查询、死锁等）。  \n熟悉日志、监控、告警、链路追踪工具，具备线上故障应急处理和复盘能力。  \n对业务有产品化思维，能够把业务目标拆解为可执行的技术方案和里程碑。  \n良好的沟通与协作能力，能在跨部门环境中推动复杂需求落地。\n技术栈要求（必须）\n编程语言：Node.js、PHP、Go（至少熟练掌握 1 门，熟悉其中 2 门更佳）  \n框架/运行时：  Node.js：NestJS / Koa / Express（至少一项）  \nPHP：Laravel / ThinkPHP / Symfony（至少一项）  \nGo：Gin / Kratos / Go-zero（至少一项）\n\n数据存储：  MySQL（主库/从库）  \nRedis（缓存、限流、队列）  \n可选：MongoDB / ClickHouse / Elasticsearch（按业务场景）\n\n消息与异步：Kafka / RocketMQ / RabbitMQ / SQS（至少一种）  \n对象存储与分发：OSS / COS / S3 + CDN  \n视频链路能力：FFmpeg、HLS/DASH、转码任务编排、文件状态流转、播放埋点  \n容器与部署：Docker + Kubernetes（或云原生托管）+ CI/CD（GitLab CI / Jenkins）  \n监控与可观测：Prometheus + Grafana + ELK（或等效）+ 分布式追踪（Jaeger / SkyWalking）  \n版本管理与协作：Git、CI/CD、项目管理工具（Jira/TAPD/禅道等）\n加分项\n有短视频、UGC/PGC 或直播/点播平台后端经验。  \n有上传转码、播放链路、内容推荐或弹性扩容实战。  \n有反作弊、内容安全、版权风控或风控模型接入经验。  \n有大规模数据治理与性能容量规划经验（QPS、并发连接、秒级故障恢复）。  \n有团队技术规划、架构评审、技术债治理经验。", "cat": "技术 / 数据"}, {"id": "198", "title": "高级全栈工程师（PHP 为主，Flutter / Vue 方向）", "salary": "36-42K", "location": "未明确", "jd": "## 岗位定位\n\n以 PHP 后端开发为核心，围绕 MongoDB、Redis、Elasticsearch 构建和优化业务系统；具备 Flutter 或 Vue 开发能力，能够独立完成相关功能的前后端交付。具备架构设计及落地能力，熟练运用 AI 工具提升研发效率，有 Go 开发经验者优先。\n\n## 岗位职责\n\n1. 负责后端核心模块的技术方案设计与开发，参与系统架构优化，结合业务规模、性能要求及交付成本，制定可落地的技术方案。\n2. 独立完成需求分析、接口设计、数据建模、代码实现及上线迭代，对代码质量、系统稳定性和交付结果负责。\n3. 负责 MongoDB 数据模型、索引及查询优化，设计 Redis 缓存策略，开发消息队列与异步任务，解决业务增长及高并发场景下的性能问题。\n4. 负责 Elasticsearch 索引设计、检索功能开发及查询优化，支撑全文检索及相关业务需求。\n5. 根据项目需要，承担 Flutter 客户端或 Vue 管理后台的功能开发，完成前后端联调、问题排查及功能交付。\n6. 将 Claude、Codex、Cursor 等 AI 工具融入日常研发，用于代码开发、重构、测试、故障排查及文档编写，并通过代码审查和测试验证生成结果。\n7. 结合业务需求，参与大模型接入、内部 Agent、Skill 或自动化工具开发，提升业务处理及团队协作效率。\n8. 参与代码评审、技术规范制定和核心文档建设，推动模块复用、工程质量提升及线上问题治理。\n\n## 任职要求\n\n1. 计算机相关专业本科及以上学历，8 年以上 PHP 开发经验，有复杂业务系统或中大型项目开发经验。\n2. 精通 PHP，深入理解面向对象、常用设计模式及工程化实践；深度使用过 Phalcon、Laravel、ThinkPHP 中至少一种框架，理解其核心机制。\n3. 具备架构思维及实际落地经验，能够独立完成模块划分、接口设计、数据建模及技术选型，合理权衡扩展性、可维护性、性能与开发成本。\n4. 熟练掌握 Flutter、Vue 中至少一种，并有实际项目交付经验：\n   - Flutter 方向：能够独立完成客户端功能开发、状态管理、接口接入及问题排查，具备 Android、iOS 或 Web 端项目经验。\n   - Vue 方向：能够独立完成管理后台的页面、组件、表单及权限相关功能开发，并完成接口联调。\n5. 熟练使用 MongoDB，具备文档模型设计、索引优化、聚合管道优化及慢查询排查能力。\n6. 熟练使用 Redis，理解常见缓存策略，具备缓存一致性、热点数据及高并发问题的实际处理经验。\n7. 掌握 RabbitMQ、Kafka、Redis Stream 中至少一种消息队列，理解消息重试、消费幂等及异常补偿机制。\n8. 熟练使用 Elasticsearch，具备索引设计、DSL 查询及检索性能优化经验。\n9. 熟练使用 AI 编程工具，并持续应用于实际项目；能够有效拆解任务、组织上下文、指导工具执行，并通过代码审查与测试保障交付质量。\n10. 熟悉 Linux、Nginx、
