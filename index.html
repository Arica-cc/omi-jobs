时长等核心数据，熟练使用 SEO 工具进行数据分析、问题归因和效果复盘，定期输出 SEO 优化报告及可落地的迭代方案。\n6. 持续关注 Google 等搜索引擎算法更新及海外 SEO 趋势，结合数据变化及时调整优化策略，降低因算法波动导致的降权、收录下降、排名异常等风险。\n7. 与品牌运营、内容、技术/前端团队协作，推动页面内容、站点结构、加载性能、索引体验及品牌搜索口碑的持续优化。\n\n【任职要求】\n\n1. 大专及以上学历，3年以上 SEO 运营实战经验，有海外站点、英文站、多语言站、内容站、品牌站或 App 推广相关 SEO 经验优先。\n2. 熟悉 Google、Bing 等海外主流搜索引擎的排名机制，掌握白帽 SEO 方法论，能够独立完成关键词策略、站内优化、内容规划、外链建设、数据分析及效果复盘。\n3. 熟练使用 Google Search Console、Google Analytics、Ahrefs、SEMrush、SimilarWeb 等常用 SEO 工具，能够独立诊断网站收录、排名、流量及页面质量问题。\n4. 具备较强的 AI 工具应用能力，能使用 ChatGPT、Claude、Gemini 或其他 AI 工具辅助完成关键词拓展、内容生产、多语言改写、数据整理和文案优化；同时具备内容判断力，能够识别 AI 内容同质化、低质化、语义不自然等问题，并进行人工校准。\n5. 具备良好的文案能力和海外用户搜索意图分析能力，能够根据目标市场用户习惯优化标题、摘要、页面结构和内容表达，提升自然点击率和页面停留表现。\n6. 具备较强的数据敏感度和执行力，能从排名、流量、收录、点击、转化等数据中发现问题，并持续推动优化闭环。\n7. 工作细致，结果导向，具备良好的跨团队沟通能力，能够与内容、品牌、技术团队协同推进 SEO 项目落地。\n\n【加分项】\n1. 有海外多语种站点 SEO 操盘经验，熟悉英文、小语种内容优化优先。\n2. 有 App SEO、ASO、品牌词优化、舆情搜索优化经验优先。\n3. 了解 SSR、站点性能、结构化数据、sitemap、robots、canonical 等技术 SEO 基础优先。\n4. 有通过 AI 工具搭建 SEO 工作流、关键词库、内容生产流程或数据看板经验优先。\n\n筛选重点\n\n1. 是否有真实海外 SEO 项目经验，而不是只做过国内平台内容运营。\n2. 是否能独立说明关键词策略、内容策略、站内优化、外链建设和数据复盘方法。\n3. 是否熟悉 Google Search Console、GA、Ahrefs、SEMrush 等工具，并能结合数据定位问题。\n4. 是否真正会使用 AI 提升 SEO 效率，而不是只会用 AI 生成文章。\n5. 是否坚持白帽 SEO，避免黑帽外链、关键词堆砌、批量低质伪原创等高风险操作。", "cat": "运营与市场"}, {"id": "105", "title": "效能官", "salary": "25-35k", "location": "", "jd": "【岗位职责】\n深入各业务线，理解业务流程、岗位分工和关键痛点，识别高价值的 AI 替代、增强和自动化场景。\n独立负责 AI 提效项目从 0 到 1 落地，包括需求调研、流程拆解、方案设计、Agent 工作流搭建、测试验证、上线推广和持续优化。\n设计并落地 Agent 自动化工作流，覆盖信息收集、内容生成、数据整理、流程提醒、报表汇总、客服辅助、运营提效等业务场景。\n主导内部 AI 工具选型、搭建、培训与推广，提升业务团队对 AI 工具的使用效率和接受度。\n建立 AI 效能评估体系，围绕节省工时、降低人力成本、提升产出效率、减少错误率、提升响应速度等指标，量化每个项目的 ROI。\n持续跟踪 AI 模型、Agent 平台、自动化工具和行业最佳实践，将新工具、新能力快速转化为业务可用方案。\n定期输出项目进展、问题复盘、提效成果和下阶段计划，向 GM、业务负责人及效能中心进行汇报。\n作为 AI 能力在业务侧的落地窗口，支持业务团队需求沟通、方案解释、使用培训及跨部门协作推进。\n【任职要求】\n熟练掌握 Python、Node.js、PHP、Go 等开发语言中的至少一种，能够独立完成脚本编写、数据抓取、API 调用、简单服务搭建和工具集成。\n熟悉 Claude、GPT、Gemini 等主流大模型产品或 API，具备 Prompt 设计、上下文管理、工具调用、知识库配置和效果调优能力。\n具备 Coze、Dify、FastGPT、扣子、n8n、Make、Zapier 等 Agent 或自动化平台的实际使用经验，能够独立搭建并上线可用的业务工作流。\n有真实 Agent 工作流搭建经验，能够独立完成需求分析、流程设计、节点配置、知识库接入、工具调用、异常处理和上线测试。\n具备较强的业务理解能力，能够快速理解陌生业务的核心流程、关键角色、主要成本和效率瓶颈。\n能够根据业务场景判断适合使用 Agent、RPA、脚本、低代码平台，还是传统系统改造，而不是为了 AI 而 AI。\n具备一定的数据处理能力，能够对业务数据、表格数据、日志数据进行清洗、统计、汇总和自动化输出。\n具备项目推进能力，能够独立跟进 AI 提效项目的需求确认、排期、测试、上线、培训和复盘。\n具备良好的沟通和文档能力，能够输出需求文档、流程图、操作手册、项目复盘、周报和提效成果报告。\n具备结果导向意识，能够用数据证明 AI 项目的实际价值，而不是只停留在工具搭建或概念展示。\n面试需提供过往 AI 工具、Agent 工作流、自动化脚本或提效项目案例，有作品演示者优先。\n【加分项】\n熟悉 RPA 工具，如 UiPath、影刀、来也、Power Automate 等，有结合 LLM 实现网页操作、表单填写、数据抓取、系统录入等自动化经验。\n有出海、泛娱乐、游戏买量、内容运营、客服运营、社群运营、直播、电商等业务场景经验，能快速理解业务语言和运营链路。\n曾负责企业内部效能工具、B 端产品、运营工具、数据看板、自动化平台等项目，有产品经理或项目 Owner 经验优先。\n有企业内部 AI 工具推广经验，包括培训、使用手册、落地复盘、数据追踪和用户反馈收集者优先。", "cat": "其他"}, {"id": "106", "title": "代码审计工程师 （Go 后端 安全与 AI 方向）", "salary": "18-28k", "location": "", "jd": "Go 后端代码审计工程师（安全与 AI 方向）\n\n 🛠 岗位职责\n\n1. 负责 Go 后端项目的代码审计与质量评估，从代码规范、架构设计、并发安全、性能隐患、数据安全及可维护性等维度开展系统审查。\n2. 深入阅读业务代码，识别 SQL 注入、越权访问、敏感信息泄露、鉴权缺陷、接口滥用、并发竞态、资源泄漏等问题，输出审计报告及整改建议。\n3. 结合业务场景评估系统安全边界，重点审查 API、数据库、缓存、消息队列、文件上传及第三方服务调用等关键链路。\n4. 对审计发现的问题进行风险分级，提供可落地的修复方案，必要时参与核心模块重构、漏洞修复及复审验收。\n5. 参与制定 Go 编码规范、安全开发规范及 Code Review 流程，推动静态扫描、依赖检测和 CI 安全门禁落地。\n6. 结合 Claude Code、Codex、Cursor 等 AI 工具建设自动化代码审查流程，提升漏洞识别、问题分类及审计报告生成效率。\n\n🎯 任职要求\n\n1. 本科及以上学历，计算机相关专业优先，3 年以上 Go 后端开发经验。\n2. 扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、内存管理及并发模型，能够识别常见并发与性能问题。\n3. 熟悉 Gin、Go-Zero、Kratos、GORM 等常用框架或组件，具备中大型后端系统开发经验。\n4. 熟悉 MySQL、Redis、Kafka/RabbitMQ 等基础设施，能够审查数据库设计、缓存策略及消息处理链路。\n5. 具备较强的代码阅读和问题定位能力，有 Code Review、代码审计、安全评审或线上故障排查经验。\n6. 熟悉常见 Web 及 API 安全风险，包括 SQL 注入、XSS、CSRF、SSRF、文件上传、鉴权绕过、越权访问和敏感数据泄露等。\n7. 能够清晰输出审计结论、风险等级、影响范围、修复建议及复审结果。\n8. 熟练使用 Claude Code、Codex、Cursor 等 AI 编程工具，能够运用 AI 提升代码审查和漏洞分析效率。\n\n✨ 加分项\n\n* 具备网络安全、渗透测试、SDL 安全开发或企业代码安全审计经验。\n* 熟悉 OWASP Top 10、CWE、CVSS 等漏洞分类和风险评估标准。\n* 使用过 Semgrep、SonarQube、CodeQL、Gosec、Trivy、Snyk 等代码与依赖安全扫描工具。\n* 具备高并发、微服务、分布式系统或支付、账户、权限等高风险业务开发经验。\n* 熟悉 Docker、Kubernetes、Linux 及 CI/CD，能够排查配置、镜像、依赖和部署环节的安全风险。\n* 有漏洞挖掘、攻防演练、CTF、SRC 漏洞提交或安全认证经历。\n* 有基于 LLM 搭建自动化 Code Review、漏洞识别或审计报告生成工具的实际经验。\n\n 🤝 我们期待的你\n\n👉 **代码审查能力强**：能够快速读懂陌生项目，识别真正影响业务安全和稳定性的核心问题。\n\n👉 **安全意识敏锐**：不只关注代码能否运行，也关注权限边界、数据安全、攻击风险和异常场景。\n\n👉 **结果导向**：能够独立完成审计、报告、整改推动及复审闭环，而非只发现问题。\n\n👉 **拥抱 AI 提效**：善于使用 AI 工具提升审计效率，同时能够判断和验证 AI 输出的准确性。", "cat": "技术开发"}, {"id": "107", "title": "业务 HRBP", "salary": "13-18K", "location": "", "jd": "业务HRBP\n岗位定位：作为业务近端的人才与组织支持者，深入理解业务目标，负责人才判断、组织诊断、管理支持及人员风险闭环。\n岗位职责：\n负责成人内容平台相关业务线的HRBP支持，理解内容供给、流量分发、用户增长、留存转化及付费变现等业务链路。\n结合业务规划判断招聘需求、岗位优先级、人才画像、职级薪酬及资源投入，参与重点、紧急和疑难岗位的人才评估。\n跟进招聘进度及转化数据，诊断岗位画像、薪酬竞争力、人才供给或面试标准等问题，推动关键岗位及时补位。\n开展人才盘点、绩效面谈、低绩效判断、核心骨干保留及人才梯队建设，为管理者提供人员与组织建议。\n支持编制规划、组织调整、岗位整合、人员调动及优化事项，评估业务影响、人员风险和交接要求。\n通过周报、问题看板及项目管理机制明确责任人、完成节点和交付结果，推动招聘、人才及组织问题持续闭环。\n任职要求：\n具备产品经理、项目经理、PMO、产品运营或复杂项目管理经验者优先。（运营、商务经验优先）\n3年以上互联网、内容平台、短视频、成人娱乐或出海业务HRBP经验。\n具备业务招聘、人才评估、组织诊断、绩效管理及管理者支持经验，能看懂基础业务和人效指标。\n业务判断、沟通影响及问题推动能力强，能够适应快速变化、高压和多事项并行的工作环境。", "cat": "职能与行政"}, {"id": "108", "title": "数据分析师/游戏数据运营", "salary": "15k-30k\n优秀可谈", "location": "", "jd": "学历要求严格\n最好是硕士，必须有游戏行业经验，简历优先看有游戏项目经验  + 懂游戏产品分析，能用数据推动产品和运营优化的人才\n岗位职责：\n1、负责游戏项目的数据分析与数据运营工作，围绕新增、活跃、留存、付费、LTV、玩法参与、活动效果等核心指标，持续监控项目经营情况，及时发现数据异常和业务问题。\n2、深入参与游戏产品调优，结合玩家行为数据，对新手流程、核心玩法、养成系统、关卡/副本体验等进行分析，定位流失点、转化断点和体验问题，并输出可落地的优化建议。\n3、负责版本、活动和商业化专项分析，包括版本前后效果对比、活动参与与转化分析、礼包/商品表现分析、付费用户分层、付费路径分析、渠道用户质量分析等，为产品迭代和运营决策提供数据支持。\n4、参与游戏数据分析体系建设，包括埋点方案设计、日志上报验收、指标口径定义、数据质量检查、看板搭建与维护，保障数据可用、口径清晰、分析结果可信。\n5、协同运营、研发团队推进问题闭环，将数据结论转化为产品优化方向、运营动作，并跟进上线后的效果验证。\n岗位要求：\n1、本科及以上学历，1–5年游戏数据分析经验（必须有游戏行业经验），RPG、卡牌、二游等品类经验优先。\n2、热爱游戏，平时有较多游戏体验，能够理解游戏系统、玩家成长、付费设计、活动节奏和版本迭代逻辑；能结合游戏内容判断数据变化背后的原因；\n3、具备良好的数据敏感度和业务判断力，能够从留存、漏斗、付费、活跃、玩法参与等数据中发现问题；\n4、熟练使用 SQL、Excel，能够独立完成数据提取、清洗、统计和分析工作；有建模/算法能力为加分项；\n5、具备数据可视化和看板搭建能力，熟悉数数 BI 平台者优先；\n6、具备较强的沟通表达能力，能够把复杂数据问题讲清楚，输出结构化分析结论，并推动运营、研发团队形成共识和行动。", "cat": "运营与市场"}, {"id": "109", "title": "高级Unity3D开发工程师", "salary": "高级，20-30k", "location": "", "jd": "高级 Unity3D 游戏开发工程师\nAPK 安全方向  招聘岗位说明\n岗位职责\n1. 负责 Unity3D 游戏客户端的架构设计、核心功能开发及性能优化，保障产品稳定性与可维护性。\n2. 负责 Android APK 安全体系建设，包括代码混淆、加固、签名校验、完整性校验及资源保护。\n3. 针对反编译、二次打包、动态调试、Hook、内存篡改等风险，设计并落地防护方案。\n4. 熟悉 Unity Mono / IL2CPP 的运行机制与安全特点，优化 C#、Java/Kotlin 和 Native 层之间的安全交互。\n5. 与服务端配合建设反作弊机制，完善关键数据校验、通信安全、异常行为检测及风险处置流程。\n6. 开展安全测试与漏洞排查，跟踪线上作弊和破解问题，完成定位、修复及防护策略迭代。\n7. 评估安全方案对性能、包体、兼容性及发布流程的影响，推动安全能力融入构建与发布流程。\n任职要求\n1. 5 年及以上游戏客户端开发经验，3 年及以上 Unity3D 实战经验，参与过至少一款正式上线的 Android 游戏。\n2. 精通 C#，熟悉 Unity 引擎架构、资源管理、热更新、内存管理及性能优化。\n3. 具备丰富的 Android APK 安全实战经验，主导或深度参与过已上线游戏的防破解、反篡改或反作弊建设。\n4. 熟悉 APK 结构、DEX、SO 动态库、Android 签名机制、JNI/NDK，具备 Java/Kotlin 与 C/C++ 代码分析能力。\n5. 熟悉 Mono / IL2CPP 构建流程，理解托管代码、元数据及 Native 代码面临的安全风险。\n6. 熟练使用 JADX、Apktool、Ghidra/IDA、Frida 等工具开展授权安全分析与防护验证。\n7. 具备反调试、反 Hook、完整性检测、资源加密和密钥保护等方案的落地经验，能够分析其防护边界与绕过风险。\n8. 理解客户端环境不可信原则，能够结合服务端权威校验设计安全方案，避免仅依赖客户端检测。\n9. 具备良好的问题定位、技术文档编写和跨团队协作能力，能够独立推进复杂安全问题闭环。\n加分项\n1. 有中大型联网游戏、竞技游戏或高对抗场景的反作弊经验。\n2. 有 IL2CPP 安全防护、Native 层安全分析或自研安全组件经验。\n3. 有 Play Integrity API、设备风险识别或第三方安全 SDK 接入经验。\n4. 有安全自动化测试、风险监控及灰度发布经验。\n5. 能提供脱敏项目案例，清晰说明威胁场景、防护措施、上线效果及性能代价。", "cat": "技术开发"}, {"id": "110", "title": "高级服务器开发工程师", "salary": "高级，20-30k", "location": "", "jd": "岗位职责\n1. 负责游戏服务端核心系统的设计、开发与维护，包括账号、角色、背包、任务、活动、排行榜及公会等业务模块。\n2. 根据游戏玩法需求，完成通信协议、业务逻辑及数据存储设计，与 Unity3D 客户端协作完成联调和上线。\n3. 负责服务端性能优化，定位并解决高并发场景下的延迟、资源占用、数据库瓶颈及服务稳定性问题。\n4. 保障游戏数据的正确性与一致性，处理并发操作、重复请求、断线重连及异常恢复等场景。\n5. 落实服务端权威校验，对登录、道具发放、交易、支付及结算等关键流程进行安全控制，防范数据篡改、请求重放和业务逻辑漏洞。\n6. 完善日志、监控、告警及自动化部署流程，参与线上故障排查、应急处理和问题复盘。\n7. 编写技术设计及接口文档，参与代码评审，持续改进服务端代码质量和开发效率。\n任职要求\n1. 3 年及以上服务端开发经验，具备游戏服务端开发经历；参与过至少一款正式上线游戏的开发或持续运营。\n2. 熟练掌握 Go、Java、C++、C# 等至少一种服务端开发语言，具备良好的编码习惯和独立模块设计能力。\n3. 熟悉 TCP、UDP、HTTP、WebSocket 等常见网络协议，理解连接管理、心跳、超时、重试及消息序列化机制。\n4. 熟练使用 MySQL 等关系型数据库及 Redis，具备表结构设计、索引优化、慢查询分析和缓存设计经验。\n5. 理解多线程、异步编程及并发控制，能够处理竞态条件、死锁、重复执行和数据一致性问题。\n6. 熟悉 Linux 开发与运行环境，能够通过日志、监控及性能分析工具定位线上问题。\n7. 熟悉常见分布式系统设计，理解幂等、限流、熔断、消息队列及故障恢复等机制，能够结合业务合理应用。\n8. 具备客户端不可信的安全意识，能够独立实现身份鉴权、权限校验、关键业务校验及接口防滥用措施。\n9. 具备良好的沟通协作能力，能够与策划、客户端及测试团队配合，独立推进功能从需求分析到上线交付。\n高级岗位补充要求\n1. 5 年及以上服务端开发经验，主导过游戏核心系统或服务端架构设计。\n2. 有高并发或大规模在线业务的实践经验，能够结合实际数据说明容量规划、性能瓶颈及优化效果。\n3. 具备复杂线上故障的独立排查与处置能力，能够推动系统性改进。\n4. 能够承担技术方案评审、关键模块把关及中初级工程师指导工作。\n加分项\n1. 有实时对战、帧同步、状态同步、匹配或跨服系统开发经验。\n2. 有游戏支付、经济系统、交易系统及反作弊相关经验。\n3. 熟悉 Docker、Kubernetes 或公有云服务，有自动化部署和弹性扩缩容实践。\n4. 有压测、容量评估、灰度发布、数据迁移或不停服更新经验。\n5. 熟悉 Unity3D 客户端协作流程，能够快速定位客户端与服务端交互问题。", "cat": "技术开发"}, {"id": "111", "title": "中高级运营", "salary": "15K\n经验丰富者视能力定岗定薪", "location": "远程", "jd": "岗位职责：\n1、玩家阵地精细化运营：统筹平台、媒体、论坛等核心玩家阵地的生态维护，制定巡查机制与垃圾广告治理方案，牵头基础用户答疑及高价值问题闭环处理，提升用户活跃度与阵地口碑；\n2、数据驱动运营优化：负责后台核心数据跟踪、多维度分析（含用户行为、内容效果、活动转化等），输出结构化数据报告并提炼可落地优化建议，支撑运营策略迭代；\n3、运营活动统筹执行：协助策划阶段性运营活动，主导活动后台用户管理、页面生命周期管控及发奖全流程统筹，联动跨部门推进活动落地，对活动参与度、留存率等关键指标负责；\n4、海外内容生态搭建：建立海内外热门单机游戏更新动态的常态化监测机制，深度挖掘优质内容素材，指导并协同内容团队完成素材筛选、本地化适配与排版优化，提升内容传播力。\n\n岗位要求\n1、经验与学历：2-3年游戏行业相关经验，接受211/985本科及以上应届生（需具备丰富的游戏运营相关实习经历）；\n2、游戏认知：深度PC单机游戏玩家，精通海内外单机游戏圈生态、热门IP动态及圈层黑话，具备玩家社群/论坛核心用户或运营经验，能精准洞察玩家需求；\n3、核心能力：具备较强的策略思维与统筹协调能力，执行力扎实且注重细节，熟练运用Excel（VLOOKUP、数据透视表等）及常用数据分析工具，能独立完成数据复盘与报告输出；\n4、语言与视野：英语CET-4及以上水平，可独立阅读海外游戏更新日志、社群讨论等内容，具备国际化内容视野，能快速捕捉海外游戏圈热点并转化为运营动作；\n加分项：有游戏社群从零到一搭建或活动策划落地经验者优先；具备基础图文排版设计能力（如熟悉PS、秀米等工具）者优先。", "cat": "运营与市场"}, {"id": "112", "title": "初级运营专员", "salary": "10K", "location": "远程", "jd": "岗位职责\n1.        负责平台、媒体、论坛等玩家阵地的日常巡查、垃圾广告清理与基础用户答疑；\n2.        协助数据分析，跟踪后台数据，整理数据日报；\n3.        协助运营活动开展，负责后台用户管理、活动页面上下架及发奖流程执行；\n4.        收集海内外热门单机游戏的更新动态，协助内容团队进行图文素材搬运与排版。\n岗位要求\n1.        1-2年海外互联网运营经验或211本科应届毕业生；\n2.        骨灰级PC游戏玩家，熟知单机游戏圈的黑话与热点，有重度海外游戏玩家社群论坛水友经验；\n3.        执行力极强，踏实细心，熟练使用Excel等基础办公软件；\n4.        英语CET-4以上，能借助翻译软件无障碍阅读海外游戏更新日志及社群内容。", "cat": "运营与市场"}, {"id": "113", "title": "双语技术支持专家/中英文客服", "salary": "10-15K", "location": "1、远程", "jd": "岗位职责\n 1. 熟练使用中英文，快速响应全球用户的技术求助，并提供有效解决方案；\n 2. 提炼高频常见问题，撰写剪辑并持续维护通俗易懂的双语FAQ文档；\n 3. 针对尝试订阅失败或申请退款的用户，进行积极的沟通干预与指导，降低付费环节的技术流失率；\n 4. 将用户报错转化为结构化的技术工单，协助研发团队快速定位代码层面的Bug并督促修复进度。\n 岗位要求\n 1. 极度了解PC软硬件运行原理与Windows系统架构（尤其是注册表、运行库、各主流杀软机制），有技术客服、IT运维或PC单机游戏发行技术支持经验；\n 2. 情绪稳定，极具耐心与服务意识，能承受大量重复性的基础咨询及偶尔的负面情绪宣泄；\n 3. 中英双语文字表达专业且富有温度，能熟练使用各类客诉管理软件系统。", "cat": "技术开发"}, {"id": "114", "title": "QA测试工程师", "salary": "15-20K", "location": "远程", "jd": "岗位职责：\n1、负责游戏项目的功能测试、回归测试、版本验收、兼容性测试、专项测试，确保版本质量与上线稳定性。\n2、根据需求文档、策划方案、接口文档、数值配置等，完成测试点分析、测试用例编写与执行。\n3、针对游戏核心模块进行深度测试，例如：账号登录、角色创建、成长养成、任务系统；卡牌收集、升级、升星、技能、羁绊等养成链路；回合制战斗、技能释放、伤害计算、BUFF/DEBUFF；关卡、副本、活动、资源产出、奖励发放；商城、充值、支付、礼包、广告、排行榜、公会、社交等系统。\n4、对游戏中的配置表、数值逻辑、状态流转、条件触发、时间限制、奖励发放规则进行验证，发现逻辑异常、边界问题和配置问题。\n5、熟练使用缺陷管理工具提交Bug，跟踪问题修复进度，推动缺陷关闭并进行回归验证。\n6、协同策划、开发、运维、运营等角色，参与需求评审、版本评审、上线验收、灰度发布及线上问题分析。\n7、能通过日志、抓包、接口返回、数据库结果等方式辅助定位问题，提升缺陷分析效率。\n8、参与测试流程优化，完善测试规范、测试覆盖率和质量保障体系。\n任职要求：\n1、本科及以上学历，计算机相关专业优先。\n2、有1-3年及以上软件测试经验，熟悉测试生命周期、测试方法和质量保障流程。\n3、熟悉游戏测试特点，能够从玩法逻辑、系统规则、数值配置、状态变化、奖励结算等维度发现问题。\n4、对游戏中的战斗机制、成长线、活动系统、经济系统、付费点、数值平衡有较强敏感度。\n5、有实际游戏体验或测试经验者优先。\n6、逻辑清晰，责任心强，具备良好的沟通协作能力和抗压能力。\n7、具备较强的问题分析能力，能够独立复现、定位、验证缺陷。", "cat": "技术开发"}, {"id": "115", "title": "资深活动运营（游戏方向）", "salary": "12k-22k", "location": "", "jd": "必须有游戏行业经验\n必须提供过往活动落地页、曾运营的社媒账号链接、负责账号的具体时间\n\"学历：本科及以上  \n岗位职责\n活动策划与执行：独立负责平台活动（节日活动、版本活动、拉新促活等）及社媒、社群活动的全流程，包括方案设计、资源协调、落地执行与效果复盘；\n社媒运营：负责官方账号的内容策划与日常运营，维护账号人设，提升粉丝量与互动率；\n社群运营：策划社群专属活动与玩法，提升社群活跃度与用户归属感；\n用户增长与维系：围绕拉新、促活、留存设计运营策略，搭建用户激励与成长体系，提升核心用户粘性；\nUGC 生态与 KOC 合作：策划二创激励、同人征集等 UGC 活动，联 KOC 进行内容传播与用户拉新；\n数据复盘：跟踪活动效果与用户数据（活跃、留存、转化等），定期输出复盘报告，持续迭代运营打法；\n\"任职要求\n3 年以上二次元、游戏或泛娱乐平台的用户 / 活动 / 社区运营经验；\n有完整的活动策划与执行经验，能提供可量化的成功案例（活动参与量、拉新量、互动数据等）；\n熟悉微博、B站、抖音、小红书等主流平台的内容生态与运营玩法；\n具备数据意识，能独立完成活动数据分析与复盘；\n有从 0 到 1 搭建社群或社媒账号的成功经历；\n个人运营过有一定粉丝规模的社媒账号；\n文案功底扎实，有创意、执行力强，具备良好的跨部门沟通协调能力；\n加分项：深度理解二次元文化，熟悉圈层用户的喜好、语言和梗。", "cat": "运营与市场"}, {"id": "116", "title": "发行侧运营负责人", "salary": "20-30K", "location": "远程", "jd": "岗位职责\n1. 平台运营规划与全球化布局\n--负责游戏生态与分发平台的全面运营战略规划、核心业务目标制定与全球化落地，对平台整体 DAU、MAU、生态健康度及商业化营收全面负责。\n--统筹平台在海外重点市场的本地化运营与破局，制定差异化的海外市场推广策略及用户获取（UA）方案。\n2. 海外市场推广与用户增长\n--主导全球化流量获客与品牌声量打造，擅长结合海外主流社媒生态（如 Discord、Reddit、X、TikTok、YouTube 等）开展裂变增长与矩阵式社群搭建。\n--建立并管理海外发行运营团队，深度拓展并维护与海外渠道、本地媒体及核心合作伙伴的战略合作关系。\n3. 具备全球化内容生态与创作者搭建能力\n--搭建面向全球的 UGC 创作者、开发者及工会/公会招募、孵化与全生命周期管理体系，驱动内容生态自循环。\n--把控平台内容安全、合规性及海外本地化标准（如 GDPR 隐私保护、版权规范与内容审查机制等）。\n4. 商业化闭环与精细化运营\n--统筹平台多元化商业化变现路径（如付费订阅、全球化支付生态、分成机制等），持续优化全球不同区域的 ARPU 值与 ROI 模型。\n--建立科学的全球化数据监控与漏斗分析体系，通过数据驱动产品迭代、跨国本地化适配及精细化用户分层运营。\n5. 跨部门统筹与项目全盘管理\n--站在平台全局视角，高效协同产品、技术、海外发行、设计与本地化团队，输出高质量的需求规划（PRD）、用户流程及全球化交互设计规范。\n--严控项目排期与技术架构风险（如全球服务器并发、大文件分发、海外网络延迟优化等），保障平台在全球范围内的平稳高效运转。\n任职要求\n1. 基本背景\n统招本科及以上学历，具备 6-10年及以上 互联网/游戏行业从业经验，其中至少 3-5年 大中型游戏平台、应用分发平台或出海工具/社区产品的核心运营负责人管理经验。\n具备成熟的海外游戏发行或海外平台运营实战操盘战绩，有完整大体量出海项目成功落地经验。\n2. 核心专业能力\n全球化视野与海外推广能力：深刻理解海外主流游戏文化及用户心智，精通海外社媒裂变及本地化获客底层逻辑。\n平台级统筹与架构破局能力：不局限于单点业务，具备大盘视角，能统筹“技术-产品-运营-商业化-海外发行”的全链路闭环。\n商业化与创作者经济操盘经验：对全球化平台的变现模式、分成机制及创作者生态有深刻认知，具备跨国商业合作谈判与 ROI 优化能力。\n3. 软性素质\n团队管理与跨部门协同能力：具备优秀的大局观与跨文化团队管理经验，能够在执行层面扎实落地的同时，具备主动思考、前瞻性全球规划及跨部门高压协同的领导力。", "cat": "运营与市场"}, {"id": "117", "title": "资深SEO运营/自动化增长", "salary": "20K", "location": "远程", "jd": "岗位职责\n1.        挖掘建立PC端游戏工具平台SEO矩阵；\n2.        协同技术研发团队完成程序化SEO需求。确保自动化生成高转化率的多语种落地页，并完成主要引擎的抓取收录；\n3.        主导全站点的技术SEO优化，监控并优化页面跳出率，提升在主要引擎的核心关键词占比和排名；\n4.        针对高热度关键词，策划并实施海量域名站群建设，运用泛解析、泛目录等技术快速截流，获取游戏媒体与相关论坛的引流。\n岗位要求\n1.        本科及以上学历，具有5年以上SEO优化经验，有大型软件分发站、游戏门户或电商平台优化经验者为必选项；\n2.        精通GSC、Ahrefs等工具。熟练掌握国内外各类蜘蛛池搭建与快速收录机制，有千万级页面收录与应对搜索引擎核心算法打击的实战规避经验；具备百度、Google等主流搜索引擎双端黑白帽SEO实操经验者优先。\n3.        具备极强的技术理解力，熟悉前沿的程序化SEO逻辑和利用AI工具批量生成高质量网页内容的流程；\n4.        数据导向，能清晰核算SEO带来的自然流量在转化漏斗中的最终价值，抗压能力强。", "cat": "运营与市场"}, {"id": "118", "title": "AI 视频设计师", "salary": "15000-20000", "location": "远程", "jd": "岗位职责：\n1、负责 AI 动漫短视频、AI 游戏介绍动画等内容全流程制作\n2、根据剧本完成分镜构思、AI 视频生成、配音配乐、剪辑及交付\n3、把控人物一致性、画面风格、剧情节奏和镜头衔接\n4、修复人物崩坏、穿模、画面抖动等问题\n任职要求：\n1、熟悉 AI 视频、AI 动漫制作流程\n2、必须熟练使用 ComfyUI / WebUI 工具和 Wan 2.2、LTX 2.3 等 AI 开源视频模型——不熟悉开源视频模型的请勿投递\n3、能够自行搭建工作流，或根据通用工作流添加节点，搭建特殊的动作迁移、视频转绘、视频去水印等视频编辑工作流\n4、能独立完成分镜设计、视频提示词搭建、生成视频及配音等制作\n5、必须提供AI视频作品集\n加分项：\n1、有 Wan 或 LTX 的视频 LoRA 制作经验\n2、有其他图片 LoRA 训练经验\n3、有 AI 语音合成经验（ElevenLabs、GPT-SoVITS 等）\n4、有二次元 / 卡牌 / RPG / 美女向 / 男性向内容视频经验\n5、有海外市场（中华圈、韩国、日本）视觉偏好理解\n6、曾独立主导某款漫剧或短剧作品的完整宣发流程", "cat": "内容与创作"}, {"id": "119", "title": "游戏广告素材设计师", "salary": "13000-18000", "location": "", "jd": "岗位职责：\n1、负责手游及内容平台的广告素材设计与制作:静态图、GIF、短视频、信息流素材、原生广告、开屏广告等\n2、根据投放需求与产品定位，拆解卖点并转化为高点击率的视觉表现\n3、熟练使用 AI 生图与 AI 视频工具（Midjourney / ComfyUI / Flux / 即梦 / Runway / Kling 等）大幅提升素材产出效率，同时保证质量稳定性与角色/风格一致性\n4、针对不同投放渠道产出差异化尺寸与调性的素材版本\n5、建立高效率素材工作流：多版本快速产出 → A/B 测试 → 数据回收 → 复用有效元素\n6、结合投放数据反馈，总结高转化元素并沉淀为可复用的模板 / LoRA / 提示词库\n7、针对不同投放渠道的审核规则，输出「尺度分级版」素材（严格版 / 合规版 / 高转化版），配合买量团队通过审核\n任职要求：\n1、2 年以上手游 / 信息流 / 买量广告素材经验（有真实投放数据案例者优先）\n2、必须熟练运用 AI 生图工具（Midjourney / Stable Diffusion / ComfyUI / Flux / 即梦 至少 3 款），具备扎实的提示词、LoRA、Checkpoint 使用能力\n3、会使用至少一款 AI 视频生成工具（Runway / Kling / MiniMax 海螺 / 即梦视频 / Sora / Pika 等），能输出 15 秒以内的短视频素材\n4、必须对二次元文化具备真实理解，手游玩家优先考虑\n5、具备扎实的视觉设计基础，对构图、色彩、信息层级、字体排版有清晰判断\n6、熟练使用 Photoshop、AE（或 CapCut / Premiere），具备基础动效与视频剪辑能力\n7、了解手游 & 内容平台广告素材的常见形式，对用户注意力机制、前 3 秒钩子有基本认知\n8、能理解产品卖点，并将其转化为有效的视觉表达\n9、必须提供 AI 生成作品集（AI 生图 + AI 视频，最好包含尺度作品）\n加分项：\n1、有二次元 / 卡牌 / RPG / SLG / 美女向 / 男性向手游素材经验\n2、有海外（中华圈、韩国、日本、东南亚）或成人向市场投放素材经验\n3、熟悉 ComfyUI 工作流搭建、LoRA 训练、图像扩展、局部重绘、图生视频等高级 AI 应用\n4、有真实投放数据支撑（CTR、CVR、eCPM 优化案例）\n5、能独立完成从卖点拆解 → 概念构思 → AI 生成 → 后期加工 → 多版本迭代的完整流程\n6、对数据反馈敏感，愿意根据 A/B 测试结果快速调整设计方向\n7、有 Meta / TikTok / Google 等主流投放平台素材审核规则的实战经验", "cat": "内容与创作"}, {"id": "120", "title": "AI应用后端工程师（AI Agent方向）", "salary": "20000-25000", "location": "", "jd": "职位描述\n负责公司AI游戏资产管理助手一期系统的设计与研发。通过大模型、Agent和智能搜索技术，实现游戏美术资源自动分析、自动分类、智能检索和资产管理，提升研发、美术团队资源查找和复用效率。\n工作职责\n•负责AI游戏资产管理平台后端系统设计与开发，包括资源管理、数据服务、搜索服务等核心模块。\n•负责接入大模型能力，实现游戏资源自动分析、描述生成、标签分类、智能搜索等功能。\n•负责AI Agent能力开发，基于OpenClaw、MCP等技术实现自然语言查询、工具调用和智能任务处理。\n•负责向量搜索、RAG等AI应用技术落地，持续优化资源搜索效果。\n•负责系统部署、性能优化和稳定性维护，保障平台稳定运行。\n任职要求\n•熟悉Python开发，具备FastAPI等后端框架开发经验。\n•熟悉数据库设计，掌握PostgreSQL、Redis等常用技术。\n•了解大模型应用开发，有LLM API调用经验。\n•了解Prompt设计、Embedding、RAG、向量检索等AI应用技术。\n•了解OpenClaw、MCP、LangChain、LangGraph等Agent相关技术。\n•熟悉Linux环境，具备Docker部署和服务维护经验。\n•具备独立分析问题和快速开发能力。                                                                                                                                                                                                                                                                                                 \n•学历一本以上、学习能力强（硬性要求）\n•有游戏后端开发经验（硬性要求）\n•有丰富AI使用经历（硬性要求）   \n加分项\n•有AI Agent项目落地经验。\n•有多模态模型应用经验。\n•有搜索系统、向量数据库经验。\n•有Unity/Cocos或游戏资源管理经验。\n•熟悉Claude Code、Cursor、Codex等AI辅助开发工具。", "cat": "技术开发"}, {"id": "121", "title": "技术项目经理（游戏运维中台方向）", "salary": "15K-20K", "location": "", "jd": "岗位职责\n一、负责游戏运维中台建设项目的推进，制定项目计划、跟进研发排期、保障按期交付。\n二、对接研发、发行、平台、运维等多方，梳理业务流程与需求，组织方案评审。\n三、推动合服开服、版本发布、生产变更管控、监控告警等运维场景的线上化与流程卡口建设。\n四、识别并推动解决项目中的技术卡点与资源瓶颈。\n五、推动中台在各游戏项目落地使用，收集反馈并持续迭代优化。\n六、探索 AI 工具在项目管理与运维流程中的应用，提升团队效率。\n七、建立并维护配套流程规范（SOP），推动系统与制度协同生效。\n\n【任职要求】\n一、本科及以上学历，计算机相关专业优先。\n二、1 年以上游戏行业技术类项目管理经验，有游戏内部系统或工具平台的交付经历。\n三、熟悉游戏运维场景（版本发布、合服开服、停服维护、热更新等），具备技术理解能力，能读懂技术方案、与研发有效沟通并评估工作量。\n四、熟悉并能实际运用 AI 工具解决工作问题，有用 AI 提效或搭建自动化流程的实践经验。\n五、具备多方协调推动能力，能对接研发、发行、平台、运维等团队达成目标；对流程敏感，善于发现重复性人工操作与易错环节并推动系统化解决。\n六、责任心强，能适应项目关键节点及线上紧急事件支持；后续有出国工作机会\n\n【加分项】\n一、熟悉 Jira、GitLab、CI/CD、监控告警等工具链。\n二、具备代码或脚本编写能力。\n三、有内部工具在团队成功推广落地的经验。\n四、有 AI Agent、工作流自动化相关实践。", "cat": "技术开发"}, {"id": "122", "title": "互动影游主创 / 导演 （影视体验 / 创作统筹）", "salary": "25–35K", "location": "", "jd": "岗位定位：以沉浸式影视体验为核心，把故事、表演、镜头和互动组织为完整作品，对整体创作体验负责。\n\n1、确定题材、故事方向、人物关系和视听风格，与叙事策划共同打磨故事大纲及关键抉择。\n2、将剧本转化为文字与图像分镜，设计角色调度、视角、构图、运镜和情绪节奏，明确AI制作依据。\n3、从导演视角确定互动切入、停顿与恢复方式，让选择发生在具有情绪或戏剧意义的时刻，保持观看流畅。\n4、审核角色表演、生成镜头、剪辑及声音，判断不同路径的情绪铺垫和人物反应，统筹补镜与修改。\n5、主持可玩版本评审，结合观看和操作体验调整演出，控制场景、镜头与分支规模，完成首作创作验收。\n6、参与成人向内容定位与商业化评审，判断不同受众为何关注、持续观看和付费，评估内容承诺与实际体验的一致性。\n\n交付与边界：创作方案、图像分镜、演出标准及成片审核；负责影视表达与整体取舍，分支细稿和条件表由叙事策划负责。\n\n任职要求：\n1、有完整叙事影像的主创、编导或导演经历，能展示从剧本理解、分镜到成片的本人贡献。\n2、具备扎实的镜头语言、人物表演、剪辑节奏和审美判断，能说明具体镜头为何成立。\n3、理解互动影像的玩家视角，能判断何时给予选择、哪些信息应当呈现、如何在等待和跳转中维持情绪。\n4、有AI影像制作实践，能评估生成可行性、跨镜头连续性和返工代价，提出可执行修改意见。\n5、能统筹小团队创作、组织试玩并落实反馈，在制作约束下保持关键场面的表现力。\n6、理解R18成人影像（包括AV／porn）的类型、受众偏好与付费动机，能分析感官吸引、欲望投射、亲密关系幻想和叙事期待的差异，并形成角色定位、内容分级与演出方向判断。\n\n作品要求：\n提交1–2部叙事作品，附一场戏的分镜与成片、本人贡献说明。可补充互动作品或交互改编方案。\n\n面试重点：\n把一场戏改编为互动片段，说明视角、选择时机、等待演出及结果镜头。\n\n加分项：\n互动电影导演、叙事游戏演出或完整AI短片经验。\n\n成人向评估：\n提交非露骨的类型分析，说明目标受众、吸引力、付费理由及证据，区分个人偏好与用户需求。", "cat": "内容与创作"}, {"id": "123", "title": "互动叙事策划 / 编剧 （人物 / 选择 / 多路径）", "salary": "根据实际能力面议", "location": "", "jd": "岗位定位：让观众以角色身份参与故事，对人物动机、选择意义及多路径叙事完整性负责。\n\n1、依据创作方向完成大纲、人物小传、分场剧本及对白，围绕角色目标组织冲突与情绪推进。\n2、设计关键选择，说明玩家已知信息、抉择动机、取舍、即时反应和后续影响；让选择改变关系、信息或局面。\n3、设计分支、汇合和结局，输出节点、触发条件、状态变化与素材需求，保证不同路径的人物动机及信息一致。\n4、按剧情需要设计轻量调查、限时回应或关系反馈，明确其叙事作用；与导演协商互动频次，避免打断关键表演。\n5、配置并走查互动脚本，检查漏选、重复体验、回看和多路径逻辑；根据试玩反馈修正选项误解、后果突兀及叙事断层。\n6、参与成人向角色路线及付费内容规划，明确每条路线的人物体验、关系发展和内容价值，保证分支差异与交付承诺一致。\n\n交付与边界：剧本、分支图、选择后果表、可配置节点及路径复核；负责写作和互动逻辑，导演负责镜头与成片表达。\n\n任职要求：\n1、有完整剧本、互动小说或叙事游戏创作经验，能展示本人作品；须能提供可体验的分支样例，个人原型亦可。\n2、具备角色塑造、戏剧冲突和对白能力，能写出符合人物身份与情境的表达。\n3、理解选择与后果的因果关系，能区别情绪表达、信息探索和路线改变等互动价值，并设计充分铺垫。\n4、能维护分支图、条件与变量表，通过Twine、Ink或项目配置工具交付互动内容并完成逻辑走查。\n5、具备影视化写作和制作成本意识，能在有限场景、角色和镜头量内形成有差异的路径体验。\n6、熟悉成人向影视、互动小说或视觉小说，能从人物吸引力、关系幻想、情感投入与内容期待分析成人用户的观看及付费意愿，并通过用户反馈验证判断。\n\n作品要求：\n提交一场完整戏及可体验分支样例，附节点图；说明选择前的信息、人物反应、延迟后果及汇合方式。\n\n面试重点：\n用有限镜头设计两种有意义的选择，解释如何兼顾人物、情绪与制作量。\n\n加分项：\n互动影游、视觉小说或叙事游戏实装经验；影视剧本创作经验。\n\n成人向评估：\n以非露骨梗概说明两条角色路线的体验差异、吸引人群和付费内容价值，不以尺度大小代替分析。", "cat": "内容与创作"}, {"id": "124", "title": "AIGC影像制作师 （连续影像 / 剪辑合成）", "salary": "根据实际能力面议", "location": "", "jd": "岗位定位：将导演分镜制作成可接入互动作品的视听片段，对影像执行质量及基础后期交付负责。\n\n1、建立角色定妆、场景和关键帧资产，依据分镜完成AI图像与视频生成，控制表演、构图和镜头运动。\n2、解决角色、服饰、道具、光影及动作连续性问题，完成候选筛选、局部修正、合成和补镜。\n3、根据选择结果制作必要的反应与分支变体，保证人物状态、叙事线索和情绪变化准确，维护共享素材与差异版本。\n4、完成短篇原型的剪辑、基础调色、字幕、对白清理与音效编排，处理选择等待、片段跳转及分支汇合的音画衔接。\n5、按节点和版本交付成片、字幕、分轨及工程，在可玩版本中复核效果；复杂合成或专业混音按需求拆包协作。\n\n交付与边界：参考资产、镜头与分支成片包、基础后期工程；执行导演创作标准，反馈制作风险并完成修改。\n\n任职要求：\n1、有连续叙事AI影像作品，能独立完成从参考资产、生成到基础剪辑的制作流程，并说明本人贡献。\n2、熟练使用AI图像与视频工具，能稳定管理跨镜头角色和场景一致性，并适配项目既定制作流程。\n3、理解镜头语言、光影、动作和表演，能识别生成瑕疵并提供可用修正方案。\n4、熟练使用一种主力剪辑工具，具备基础调色、对白处理、字幕及分轨输出能力。\n5、理解非线性片段的连续性要求，能按节点、状态与版本归档，在实际交互播放中检查成片并迭代。\n6、能够接受并专业处理R18成人向项目，理解不同内容分级的视觉表达和受众预期，能准确执行导演要求并管理分级素材版本。\n\n作品要求：\n提交60–120秒连续叙事片段及修正前后对照，附本人后期工程；补充同一场景的不同反应或分支衔接样例。\n\n面试重点：\n验证角色一致性、表演筛选与两个分支间的剪辑和声音衔接。\n\n加分项：\n互动影像制作、合成、声音设计或可复用AI工作流经验。", "cat": "内容与创作"}, {"id": "125", "title": "互动影游开发工程师 （交互播放 / 叙事系统）", "salary": "20–35K", "location": "", "jd": "岗位定位：将影像、选择与剧情状态接成流畅可玩的作品，对交互响应、播放连续性与版本稳定性负责。\n\n1、实现视频播放与选择界面协同，处理选项出现、等待、默认/超时选择及分支切换，保持字幕和音画同步。\n2、建立剧情节点、条件和状态系统，支持关系/信息变化、路径汇合与结局判断，确保选择后果可配置和可验证。\n3、实现存档、回看、已读跳过和重试，明确回溯时的状态恢复规则，保证重新选择后剧情正确推进。\n4、与叙事策划按需求实现轻量调查或限时交互，提供资源接入、变量查看和节点跳转等配置调试能力。\n5、优化预加载、缓存及加载失败恢复，测试连续操作、重复触发和跨路径状态，完成打包、源码和运行文档。\n\n交付与边界：可玩版本、交互播放与叙事配置系统、调试工具及测试记录；负责功能实现，选择设计与演出由创作岗位确定。\n\n任职要求：\n1、有至少1个可运行的游戏、互动影像或多媒体应用，能展示本人代码、实现取舍及完整交付过程。\n2、熟练掌握一种语言及框架/引擎，具备事件处理、状态管理、配置读取和异步加载能力。\n3、有音视频接入经验，能定位播放切换、加载延迟、操作响应及音画同步问题。\n4、理解分支触发、条件判断与存档恢复，能设计关键路径和异常测试，协助非技术人员调试内容。\n5、掌握Git、测试与日志排障，能使用Codex等辅助开发并独立审查和验证生成代码。\n6、能够参与成人向产品开发，按产品要求实现年龄访问限制、内容分级及付费权益校验，并保证不同版本的资源与权限对应。\n\n作品要求：\n提交可运行作品及本人贡献，附播放/状态流程、配置和测试样例。\n\n面试重点：\n修改一处分支，演示连续播放、重新选择、回看与读档后的状态正确性。\n\n加分项：\n互动电影、视觉小说、视频预加载、叙事编辑工具或多端交付经验。", "cat": "技术开发"}, {"id": "126", "title": "高级 Unity 开发工程师（Senior Unity Developer）", "salary": "20-30K\n（经验丰富者视能力定岗定薪）", "location": "", "jd": "岗位职责：\n负责核心系统/框架的设计与开发（架构、基础库、通用系统）。\n主导或深度参与技术方案选型与落地（热更新、资源管理、网络、UI 框架等）。\n解决项目中的疑难技术问题（性能瓶颈、内存泄漏、崩溃、复杂业务逻辑等）。\n推动代码规范、开发流程和工程化建设。\n指导初中级程序员，进行 Code Review 和技术分享。\n与策划、程序负责人一起评估需求可行性与排期风险。\n关注新技术，评估并引入对项目有价值的方案。\n\n任职要求：\n6 年以上 Unity 开发经验，至少主导或核心参与过 1～2 个完整上线项目。\n精通 C#，深入理解 CLR、GC、多线程、异步编程、内存管理。\n精通 Unity 引擎机制，熟悉以下内容：\n渲染管线（URP/HDRP/Built-in）原理与优化\n资源管理与加载策略（AssetBundle, Addressables 深度使用经验优先）\n打包流程、多平台适配（Android/iOS/PC/小游戏）,熟悉至少一种热更新方案，并有实际落地经验。\n具备较强的架构设计能力，能设计可扩展、可维护的系统框架。\n有丰富的性能优化实战经验（CPU、GPU、内存、包体、启动速度等）,具备较强的问题排查能力（Profiler、Memory Profiler、Frame Debugger、日志分析等）。\n有带人或指导他人的经验，能推动技术规范落地。\n熟悉 Shader / 图形学，能独立完成中等复杂度特效或优化。\n有弱联网/强联网游戏经验（状态同步、帧同步、网络优化）。\n关注 Unity 新特性（DOTS、ECS、Burst、Jobs 等）并有实践。", "cat": "技术开发"}, {"id": "127", "title": "中级 Unity 开发工程师（Mid-level Unity Developer）", "salary": "15-20K\n（经验丰富者视能力定岗定薪）", "location": "", "jd": "岗位职责：\n负责游戏功能模块的开发与实现（玩法、UI、系统等）。\n根据策划需求完成功能开发，保证代码质量和性能。\n参与 Bug 修复、性能优化和线上问题排查。\n与策划、美术、测试协作，推进需求落地。\n参与 Code Review，遵守团队开发规范。\n协助完善工具链和开发流程。\n\n任职要求：\n2～6 年 Unity 实际项目经验。\n熟练掌握 C#，理解面向对象、委托、事件、协程、异步（async/await）等。\n熟练使用 Unity 引擎，熟悉以下至少大部分内容：\nUGUI / UI Toolkit\n动画系统（Animator、Animation Clip）\n物理系统（2D/3D Physics）\n资源管理（Resources、AssetBundle 或 Addressables）\n场景管理、Prefab 使用规范\n熟悉常用设计模式（单例、观察者、对象池、MVC/MVP/MVVM 等）并有实际应用经验。\n具备基本的性能优化意识（Draw Call、GC、Overdraw、合批等）。\n熟悉 Git 版本管理，有良好的代码规范和注释习惯。\n能独立完成中等复杂度功能模块的开发与自测。\n熟悉 Shader 基础或 Shader Graph。\n了解热更新方案（HybridCLR、ILRuntime、xLua 等）。\n熟悉常用第三方插件（DOTween、TextMeshPro 等）。", "cat": "技术开发"}, {"id": "128", "title": "中级 Go 语言开发工程师 / Mid-level Golang Developer", "salary": "根据实际能力面议", "location": "", "jd": "岗位职责：\n负责公司后端服务的开发与维护，使用 Go 语言实现高并发、高可用的业务系统。\n参与系统架构设计，合理拆分微服务，优化接口性能与稳定性。\n编写高质量、可维护的代码，完成单元测试、集成测试，保证代码质量。\n排查线上问题，进行性能优化、内存与并发问题定位。\n与前端、测试、产品等团队协作，推进需求落地。\n参与 Code Review，推动团队技术规范和最佳实践落地。\n根据业务需要，参与部分中间件、基础设施的开发与维护。\n\n任职要求：\n2～6 年后端开发经验，其中 至少 1.5～2 年纯 Go 语言实际项目经验。\n扎实的计算机基础：数据结构、算法、操作系统、网络（TCP/IP、HTTP/HTTPS）、数据库原理。\n精通 Go 语言核心特性：\n并发模型（goroutine、channel、select、sync 包）\n内存模型、垃圾回收机制\n接口、反射、错误处理、context 使用\n常用标准库（net/http、encoding/json、database/sql 等）\n数据库：MySQL / PostgreSQL（熟练使用，了解索引优化、事务、锁）\n缓存：Redis（常用数据结构、过期策略、分布式锁）\n服务发现与配置：Etcd / Consul / Nacos\n熟悉 RESTful API 设计，了解 gRPC。\n具备基本的 Linux 操作能力和 Shell 脚本编写能力。熟悉 Git，Docker等常用工具，有良好的代码规范和文档习惯。\n有实际排查过线上问题的经验（性能瓶颈、内存泄漏、死锁、goroutine 泄漏等）。\n有微服务架构实际落地经验（服务拆分、熔断、限流、链路追踪）。了解分布式事务、一致性协议（Raft、Paxos 等）相关知识。", "cat": "技术开发"}, {"id": "129", "title": "核心导演 / 总策划", "salary": "根据实际能力面议", "location": "", "jd": "岗位职责\n负责AI漫剧项目的整体风格定调、剧本视觉转化与分镜节奏把控。\n统筹项目全流程进度，协调编剧、生图、后期等各环节高效配合。\n把控AI生成素材质量，审核并指导画面连贯性、角色一致性及成片效果。\n跟进AI前沿技术与工具，优化团队工业化制作管线与工作流。\n\n任职要求\n大专及以上学历，影视动画、数字媒体、编导等相关专业优先，3-5年及以上动画、短剧或游戏行业导演/\n策划经验，具备成熟AI商业项目落地案例。\n具备扎实的视听语言基础与分镜构图能力，熟悉网文、短视频及漫剧爽点设计。\n深度了解主流AI生成工具（如Midjourney、Stable Diffusion、Sora/Kling等）的技术边界与应用场景。\n具备优秀的统筹管理、跨团队沟通能力及强烈的抗压能力。", "cat": "内容与创作"}, {"id": "130", "title": "AI 短剧编剧", "salary": "18-20k\n优秀可谈", "location": "远程", "jd": "岗位职责：\n1. 负责竖屏短剧的选题、大纲、分集结构与剧本细写，题材方向以情感向、强冲突题材为主，具体项目内容以沟通为准。\n2. 输出可直接用于 AI 生成的分镜脚本，明确每个镜头的景别、人物动作、表情、环境与情绪，确保制作端能够直接按照脚本进行生成。\n3. 建立并维护人物文字设定，对角色外观进行精确且固定的描述，用于生成角色资产，并保持角色跨镜头的一致性。\n4. 按照竖屏短剧的留人逻辑设计剧情结构，包括每集的钩子、反转及结尾悬念落点。\n任职要求：\n1. 有完整的短剧、网文、漫剧或影视剧本作品，能够提供完整成稿。\n2. 理解竖屏短剧的结构逻辑，包括强钩子、快节奏、高反转密度，理解其与长剧写法的区别。\n3. 熟练使用 LLM 工具进行剧本相关工作，能够判断 AI 产出质量，并对生成内容进行修改完善，而非直接提交 AI 稿。\n4. 能流畅使用 LLM 工具；有本地生成环境、能够自行验证镜头者优先。\n5. 理解 AI 生成端的能力边界，能够针对复杂动作、多人互动、精细道具操作、长镜头连续对话等生成难点，合理设计分镜与表现方式，规避生成过程中的问题，并将剧本转化为可直接生成的分镜脚本。\n6. 对项目题材方向持开放态度，具体以沟通为准。\n加分项：\n1. 有已上线短剧作品，并可提供相应的创作过程文件及交付记录。\n2. 有 ACGN、二次元或漫剧领域相关内容积累或创作经验。\n作品要求：\n需提交以下两项：\n1. 一集完整剧本，包含分镜脚本格式，能够体现镜头描述的可生成性。\n2. 一份剧本所涉及的人物设定，包含用于保持跨镜头一致性的外观描述。\n※投递时需说明：作品中本人的具体分工、使用了哪些 AI 工具，以及对 AI 生成结果进行了哪些修改。仅提交成稿而未说明创作过程，将无法判断实际贡献，并影响评估。", "cat": "内容与创作"}, {"id": "131", "title": "AI 短剧剪辑师", "salary": "18-20k\n优秀可谈", "location": "远程", "jd": "岗位职责：\n1. 从 AI 生成的大量素材中筛选可用镜头，完成竖屏短剧的粗剪与精剪。\n2. 针对 AI 素材碎片化、高废片率，以及跨镜头色调漂移、帧率不统一等问题，通过跳切、变速、局部放大、遮挡等剪辑方式进行补救，将存在缺陷的素材处理为可用成片。\n3. 完成全片调色统一，使不同批次生成的镜头在整体视觉上保持一致。\n4. 处理对白、音效与 BGM，包括 AI 配音的口型与语气对齐、情绪铺垫及节奏卡点。\n5. 向 AI 制作端反馈重跑需求，明确说明问题镜头的具体缺陷及修改方向，而非仅反馈“这条不行”。\n任职要求：\n1. 自备高性能设备，显卡需达到 RTX 4090 级别及以上，显存 24G 起。\n2. 熟练使用 PR 或达芬奇，能够独立完成从素材到成片的全流程。\n3. 有竖屏短剧、AI 短剧或漫剧的实际成片经验，有上线数据更好。\n4. 具备视听叙事能力，理解镜头衔接、节奏控制和情绪铺垫，而非仅按照脚本进行素材拼接。\n5. 熟悉 AI 后期工具，补帧、超分、去闪烁、抠像等能力中至少有几项能够实际应用。\n6. 具备从大量 AI 废片中筛选可用镜头的判断力，以及针对不完美素材进行补救并完成成片的能力，不仅限于软件操作熟练度。\n7. 对项目题材方向持开放态度，具体内容以沟通为准。\n加分项：\n1. 会使用 AI 处理声音，包括配音生成、音色统一、原生音轨精修。\n2. 有完播率、3 秒跳出率等数据意识，能够说明如何通过剪辑影响相关指标。\n3. 有日更或高频交付的产能经验，能够说明实际单日产出量。\n作品要求：\n提交一条不低于 60 秒的成片，并附素材到成片的对照说明：将原始 AI 素材与剪辑后的成片效果进行对照，并说明具体进行了哪些补救处理。\n※仅提交成片而未说明制作过程的，将无法判断实际贡献，并会影响评估。", "cat": "内容与创作"}, {"id": "132", "title": "游戏策划", "salary": "15-25K", "location": "", "jd": "【岗位定位】\n\n与现有主策划协同推进产品研发，重点负责市场调研、竞品分析及产品方向验证，将研究结论转化为可落地的玩法、系统、数值及商业化方案，并参与研发跟进与上线调优。\n\n【岗位职责】\n\n1、负责目标市场及细分游戏品类研究，分析用户需求、产品趋势与市场机会，为产品定位、目标用户选择及差异化设计提供依据。\n2、持续跟踪并深度体验竞品，拆解核心玩法循环、新手体验、系统开放节奏、数值经济、长线成长、社交机制及商业化设计，输出竞品分析报告与可执行的产品建议。\n3、与现有策划共同完善整体游戏产品方案、核心玩法循环（Core Loop）及游戏设计文档（GDD），结合调研结论提出设计方案，并按分工推动落地。\n4、参与搭建和优化游戏核心数值框架、经济系统及长线成长体系，结合竞品研究和实际测试数据，平衡可玩性、成长体验与商业化潜力。\n5、围绕关键设计假设制定验证方案，通过原型体验、小规模测试、用户反馈及行为数据，判断方案效果，推动产品迭代与需求优先级调整。\n6、结合目标用户偏好与竞品美术表现，协同明确美术风格和资产规范，向美术外包团队清晰传达需求，并参与资产验收与监修。\n7、与 Unity 客户端及后端主程紧密配合，明确玩法规则、网络交互及数值需求，跟进开发与验收，确保设计准确实现。\n8、在前期小型网络游戏快速验证、后期向大型网络手游演进的过程中，持续更新市场判断和产品设计方案，兼顾验证效率、开发成本与长期扩展需求。\n\n【任职要求】\n\n1、大专及以上学历，5 年以上游戏行业策划经验，具备主策划或核心策划工作经历。\n2、至少完整经历过 1–2 款上线网络游戏（非纯单机）的全流程研发，熟悉从立项、设计、开发到测试上线及迭代优化的过程。\n3、具备市场调研及竞品分析能力，能够结合实际游戏体验、公开市场信息、用户反馈及数据形成判断，识别产品机会与风险，并将结论转化为具体设计建议。\n4、具备核心玩法、数值体系、经济系统和长线成长体系设计经验，能够分析竞品设计背后的目标、适用条件与取舍，提出适合本项目的方案。\n5、具备较强的逻辑思维、数据分析和文档编写能力，能够输出结构清晰的竞品分析报告、GDD、系统策划案及数值平衡表。\n6、对 Unity 客户端及网络游戏服务端架构有基本认知，能够与程序有效沟通，理解设计方案的实现成本与技术约束。\n7、具备良好的审美能力和美术监修意识，能够从目标用户及产品定位出发，提出明确的美术需求和验收意见。\n8、具备良好的协作与独立判断能力，能够与现有主策划明确分工、协同推进，基于事实和验证结果讨论方案；抗压能力强，对落地效果负责。\n\n【加分项】\n\n1、有通过市场调研或竞品分析推动产品立项、玩法调整、留存提升或商业化优化的实际案例。\n2、熟悉常用游戏市场及数据分析工具，能够区分数据来源、估算口径与结论局限。\n3、有小团队快速原型验证、网络游戏从 0 到 1 或海外市场产品研发经验。", "cat": "产品与管理"}, {"id": "133", "title": "产运负责人", "salary": "3000-7500U", "location": "", "jd": "成人内容平台运营\n负责成人内容平台整体运营工作，对用户增长、活跃、留存及营收结果负责；\n制定并执行内容运营策略，提升平台内容丰富度及用户消费意愿；\n负责用户分层运营，建立会员体系及付费转化机制；\n持续优化用户体验，提升用户留存率和复购率；\n负责平台活动策划，包括会员活动、充值活动、节日活动等；\n跟踪海外成人内容行业动态及竞品数据，制定针对性运营策略；\n与产品、技术、市场团队协同，推动运营需求落地；\n通过数据分析发现问题并制定优化方案，实现平台收入持续增长。\nVPN产品运营\n负责 VPN 产品用户增长及商业化运营；\n建立用户转化漏斗，优化注册、试用、付费及续费流程；\n负责会员体系及订阅业务运营，提高续费率和用户生命周期价值；\n策划用户增长活动，提升自然增长及付费转化效果；\n分析产品数据，持续优化用户体验及核心指标；\n研究海外工具类产品运营模式及行业趋势，制定增长策略；\n与投放团队配合，优化流量获取及转化效率。\n\n任职要求\n3年以上互联网运营经验；\n有内容平台、流量平台、工具类产品或会员订阅产品运营经验；\n具备较强的数据分析能力，能够独立完成运营数据复盘；\n熟悉用户增长、用户留存及商业化运营逻辑；\n具备较强的项目管理和跨部门协作能力；\n对海外互联网产品有较深理解；\n结果导向，对数据和营收目标负责。", "cat": "其他"}, {"id": "134", "title": "运营经理", "salary": "30-50K", "location": "", "jd": "海外垂直内容平台平台运营\n负责海外垂直内容平台平台整体运营工作，对用户增长、活跃、留存及营收结果负责；\n制定并执行内容运营策略，提升平台内容丰富度及用户消费意愿；\n负责用户分层运营，建立会员体系及付费转化机制；\n持续优化用户体验，提升用户留存率和复购率；\n负责平台活动策划，包括会员活动、充值活动、节日活动等；\n跟踪海外垂直内容行业动态及竞品数据，制定针对性运营策略；\n与产品、技术、市场团队协同，推动运营需求落地；\n通过数据分析发现问题并制定优化方案，实现平台收入持续增长。\nVPN产品运营\n负责 VPN 产品用户增长及商业化运营；\n建立用户转化漏斗，优化注册、试用、付费及续费流程；\n负责会员体系及订阅业务运营，提高续费率和用户生命周期价值；\n策划用户增长活动，提升自然增长及付费转化效果；\n分析产品数据，持续优化用户体验及核心指标；\n研究海外工具类产品运营模式及行业趋势，制定增长策略；\n与投放团队配合，优化流量获取及转化效率。\n\n任职要求\n3年以上互联网运营经验；\n有内容平台、流量平台、工具类产品或会员订阅产品运营经验；\n具备较强的数据分析能力，能够独立完成运营数据复盘；\n熟悉用户增长、用户留存及商业化运营逻辑；\n具备较强的项目管理和跨部门协作能力；\n对海外互联网产品有较深理解；\n结果导向，对数据和营收目标负责。", "cat": "运营与市场"}, {"id": "135", "title": "产品经理", "salary": "15-25K，合适可以放宽", "location": "", "jd": "一、岗位职责\n\n1. 负责公司 VPN/海外垂直内容平台 / 泛娱乐内容平台/AI 产品等任意一条业务线的产品规划、需求拆解和版本推进。\n2. 基于业务目标，完成从 0 到 1 的产品方案设计，包括用户路径、核心功能、后台配置、支付/订阅、内容消费、增长转化等模块。\n3. 深入分析目标用户、竞品和业务数据，输出产品原型、需求文档、流程图、交互说明和验收标准。\n4. 协同研发、设计、测试、运营推进项目落地，跟进需求评审、开发排期、提测、验收、上线和版本复盘。\n5. 负责产品上线后的数据跟踪，包括注册转化、付费转化、留存、充值、内容消费、搜索/推荐效果、渠道 ROI 等关键指标。\n6. 能够结合海外市场、灰度业务、订阅产品、内容产品或工具类产品特点，持续优化用户体验和商业化路径。\n7. 对接运营、投放、客服和业务负责人，快速响应用户反馈、线上问题和业务调整需求。\n\n二、任职要求\n\n1. 3 年以上产品经理经验，有完整 0-1 产品经验，能独立负责从需求调研到上线复盘的全流程。\n2. 有以下任一方向经验优先：VPN / 加速器 / 海外垂直内容平台 / 泛娱乐内容平台 / AI 工具。\n3. 熟悉 C 端产品设计，理解用户转化路径、内容消费链路、支付订阅、会员权益、任务激励、邀请裂变等常见产品机制。\n4. 能独立输出高质量 PRD、原型、流程图、后台配置说明和验收标准，逻辑清晰，推进力强。\n5. 对数据敏感，能围绕访问、注册、付费、留存、复购、渠道效果等指标做产品判断。\n6. 能适应创业团队节奏，接受需求变化快、项目多线并行、交付周期短的工作环境。\n7. 沟通协作能力强，能在产品、研发、设计、测试、运营之间推动共识和结果。\n8. 对海外产品、Web3、AI、内容商业化、成人内容生态有理解或兴趣优先。\n\n三、加分项\n\n1. 有 VPN、代理、节点订阅、套餐支付、权益系统相关经验。\n2. 有海外垂直内容平台 / 泛娱乐内容平台、视频站、图片站、搜索站、社区或角色互动产品经验。\n3. 有 AI 生图、AI 视频、AI 聊天、AI 换脸、AI 内容工具产品经验。\n4. 有海外支付、订阅制、Stripe、虚拟币支付、渠道投放转化经验。\n5. 有小团队从 0-1 项目经验，能自己画原型、拆需求、盯研发、做验收。\n6. 英文阅读能力良好，能看海外竞品、产品文档和用户反馈。\n\n四、岗位特质要求\n\n我们希望你是一个能在创业环境里把事情推进落地的人：\n\n• 不只写需求，也能判断优先级；\n• 不只画原型，也能盯上线结果；\n• 不只听业务说什么，也能拆出真正要解决的问题；\n• 能接受业务变化快、信息不完全、节奏紧，但仍然把产品做成。\n\n五、薪资与发展\n\n薪资面议，根据经验、项目匹配度和过往成果综合评估。表现优秀者可负责完整业务线产品规划，并参与核心项目从 0 到 1 搭建", "cat": "产品与管理"}, {"id": "136", "title": "AI成人短剧生成", "salary": "面议", "location": "", "jd": "岗位介绍\n    \n    负责成人向短剧、情感短剧及成熟题材内容的 AI 创意策划、剧本开发、视觉生成、视频剪辑与后期制作。\n    \n    该岗位需要熟悉 AIGC 视频生产流程，能够将故事创意转化为完整的短剧内容，并在保证人物一致性、画面质量和叙事节奏的同时，严格遵守内容分级、版权、肖像权、平台规则及未成年人保护要求。\n    \n    岗位职责\n    \n    1. 负责成人向短剧项目的前期策划、选题开发、内容创意和制作执行。\n    2. 参与剧本创作、故事梗概、人物设定搭建及分集内容设计。\n    3. 根据剧本完成角色设定、场景设计、镜头拆解和视觉风格规划。\n    4. 使用 AI 工具完成文生图、图生视频、文生视频、数字角色等内容制作。\n    5. 负责短剧分镜设计、画面构图、镜头衔接、情绪表达和整体节奏把控。\n    6. 完成视频剪辑、字幕、配音、音乐、音效、转场、特效及成片包装。\n    7. 对 AI 生成素材进行筛选、优化、重绘和修复，解决人物一致性、场景连续性、动作自然度、口型同步和画面稳定性等问题。\n    8. 根据不同题材和内容定位，持续优化人物关系、剧情冲突、情感推进和故事节奏。\n    9. 配合设计、制片及运营团队，按照项目计划推进内容生产并完成交付。\n    10. 负责成片质量检查，确保画面、声音、字幕、节奏、内容分级和平台发布要求符合标准。\n    11. 持续关注 AIGC、短剧、成人内容及短视频行业趋势，探索更高效的 AI 短剧制作流程。\n    \n    任职要求\n    \n    1. 大专及以上学历，影视制作、动画、数字媒体、视觉设计、编导、数字艺术等相关专业优先。\n    2. 有短剧、短视频、动画、广告片、影视后期、网络内容或 AIGC 视频制作经验。\n    3. 熟悉 AI 短剧从策划、剧本、分镜、素材生成到剪辑交付的完整流程。\n    4. 熟悉文生图、图生视频、文生视频、数字人、AI 配音及视频修复等常见 AI 制作方式。\n    5. 熟练使用剪映、Premiere、After Effects、DaVinci Resolve 等剪辑或后期软件中的一种或多种。\n    6. 具备良好的审美能力、镜头语言、画面表达能力和短剧节奏感。\n    7. 能够理解剧本并完成场景拆分、镜头设计、画面描述和素材组织。\n    8. 具备较强的人物一致性、场景连续性和画面质量控制能力。\n    9. 具备较强的执行力、学习能力和问题解决能力，能够适应快速迭代的项目节奏。\n    10. 有良好的团队协作意识和时间管理能力，能够按计划完成制作任务。\n    11. 能够接受成人向、情感向及成熟题材内容的创作方向，并遵守公司内容规范。\n    12. 有个人作品集、短剧成片或 AIGC 项目案例者优先。\n\n加分项\n    \n    1. 有 AI 成人短剧、AI 漫剧、情感短剧或 AIGC 视频作品。\n    2. 熟悉 seedance2， libtv，及无限画布使用方式\n    3. 有人物一致性、角色换装、表情控制、动作优化、口型同步或视频修复经验。\n    4. 有都市情感、悬疑、剧情、幻想、科幻、二次元、女性向或成人情感题材制作经验。\n    5. 具备较强的提示词撰写能力，能够建立可复用的角色、场景和镜头提示词体系。\n    6. 能够使用海外 AI 工具。", "cat": "内容与创作"}, {"id": "137", "title": "Golang语言开发工程师", "salary": "20-30", "location": "", "jd": "岗位职责\n\n1. 核心业务开发\n\n负责视频资料检索平台的后端架构与核心业务开发，覆盖搜索聚合、影片与创作者资料、播放服务、用户行为、收藏历史、排行榜及内容运营等业务线\n将业务需求转化为可上线、可观测、可扩容的技术方案并推动落地\n\n2. 高并发与系统稳定性\n\n设计并持续优化高并发 API，落地多级缓存、请求合并、异步队列、限流、熔断、降级与热点数据保护，保障突发流量下的可用性\n\n3. 数据层\n\n负责 MySQL 数据模型设计、索引优化、慢查询治理与读写链路优化，处理缓存与数据库一致性、数据回填、幂等和任务重试等问题\n\n4. 缓存体系\n\n建设 Redis 缓存体系，针对缓存穿透、击穿、雪崩、大 Key、热 Key 和缓存失效风暴制定可执行方案并落地\n\n5. CDN 与网络治理\n\n参与 Cloudflare / CDN 接入与治理，包括 Cache Rules、缓存键、TTL、回源保护、主动刷新、WAF、Rate Limiting、防盗链和多线路切换\n\n6. 视频播放链路\n\n负责播放链路后端能力：HLS/m3u8、TS 分片、AES-128 Key、播放清单改写、鉴权 URL、回源与边缘缓存\n\n7. 可观测性与运维\n\n完善日志、指标、链路追踪和告警体系，能快速定位线上性能问题，并对容量、故障和发布风险负责\n\n8. 工程效能与团队\n\n- 推动代码评审、自动化测试、灰度发布、回滚和技术文档建设，带领团队形成稳定的工程规范\n\n任职要求\n\n- 5 年以上后端开发经验，至少 2 年承担核心系统或技术负责人角色\n- 精通 Golang，熟悉 goroutine 并发模型、channel、内存管理与性能调优（pprof、GC 调优等），有常驻进程 / 高并发服务实战经验\n- 必须具备真实的大用户量或高并发线上项目经验，能清晰说明业务规模、峰值 QPS、容量瓶颈、优化过程与最终结果\n- 熟练掌握 MySQL 与 Redis，具备数据库性能分析、缓存架构设计和线上数据问题处置能力\n- 必须具备 Cloudflare 或主流 CDN 的生产经验，理解浏览器缓存、边缘缓存、源站缓存及缓存键对命中率的影响\n- 熟悉 Linux、Nginx 或 HAProxy、Docker、Git 和 CI/CD，能独立完成服务部署、排障和性能调优\n- 熟悉 RESTful API、签名鉴权、权限控制、文件上传安全和第三方接口对接，重视安全与数据边界\n- 具备清晰的系统设计能力和主人翁意识，能把需求转化为可上线、可观测、可扩容的技术方案\n\n加分项\n\n- 有视频、直播、内容社区、图片搜索、短视频或大规模媒体资源平台经验\n- 熟悉 Hyperf、Swoole、RoadRunner 等常驻内存或异步框架，处理过连接泄漏与内存增长问题；有 PHP→Golang 迁移经验者优先\n- 有 Elasticsearch / OpenSearch、ClickHouse、Kafka、RabbitMQ 等组件的生产实践\n- 有 AWS、跨账号网络、对象存储、CloudFront、Cloudflare Workers/R2 或多 CDN 调度经验\n- 有反爬、防盗链、风控、攻击流量治理或大规模图片处理经验", "cat": "技术开发"}, {"id": "138", "title": "AI短剧编导", "salary": "面议", "location": "", "jd": "岗位介绍\n负责成熟题材、情感向 AI 短剧的选题策划、热点分析、剧本创作与内容开发。\n需要具备专业的编剧能力和敏锐的网络热点捕捉能力，能够从社会热点、情感事件、流行话题及用户讨论中提炼高传播潜力的故事素材，创作具有强冲突、强情绪、强反转和持续追更动力的成熟题材短剧剧本。\n本岗位涉及成熟题材内容创作。\n岗位职责\n1.        负责成熟题材 AI 短剧的选题策划、故事构思和剧本创作。\n2.        持续关注网络热点、社会话题、情感事件及短视频平台趋势，挖掘适合短剧开发的高热度素材。\n3.        对热点内容进行二次创作，完成原创化、戏剧化和系列化改编。\n4.        负责故事梗概、人物小传、人物关系、世界观设定及分集大纲的设计。\n5.        独立完成短剧剧本、分集剧本、场景描述、人物对白等内容。\n6.        设计剧情冲突、情感推进、人物反转、悬念节点和结尾钩子，提升内容的完播率和追更率。\n7.        与 AI 制作团队协作，参与剧本修改和成片优化。\n8.        根据数据反馈、用户评论及运营需求，持续调整剧情节奏、人物设定和内容方向。\n9.        参与建立成熟题材 AI 短剧的题材库、人物库、热点素材库及可复用剧本模板。\n10.        负责对剧本进行内容审核，确保剧情表达、人物关系及题材方向符合公司内容规范及平台发布要求。\n任职要求\n1.        大专及以上学历，戏剧影视文学、编剧、广播电视编导、中文、网络文学、广告及相关专业优先。\n2.        具有成熟题材影视编剧经验者优先。\n3.        具备专业的编剧能力，熟悉短剧、网文、影视剧或短视频内容创作流程。\n4.        有较强的网络热点捕捉、信息筛选和趋势判断能力，能够快速从热点中提炼故事创意。\n5.        脑洞丰富，想象力强，擅长构建人物关系、情感冲突、戏剧反转和高张力情节。\n6.        熟悉短剧剧本结构，能够掌握开篇吸引力、分集悬念、情绪递进和结尾钩子。\n7.        具备成熟的文字表达能力，能够独立完成故事大纲、人物设定、分集剧本及对白创作。\n8.        了解都市情感、悬疑、剧情、幻想、女性向及婚恋情感等题材的内容特点。\n9.        能够接受成熟题材、情感向的创作方向，并遵守公司内容规范。\n10.        具备较强的审美能力、用户意识和商业内容判断力，理解短视频平台的传播逻辑。\n11.        具备良好的沟通能力、执行力和抗压能力，能够适应快速创作、快速修改和持续迭代的工作节奏。\n12.        具备版权意识、合规意识和职业操守，能够对热点素材进行合法、规范的原创转化。\n13.        有短剧剧本、网络小说、短视频脚本、影视项目或个人作品集者优先。\n加分项\n1.        有成熟题材短剧、情感向影视、AI 漫剧等剧本创作经验。\n2.        有短剧爆款、网络小说、短视频脚本或高传播内容作品。\n3.        熟悉 Seedance 2、LibTV、无限画布等 AI 内容创作工具。\n4.        具备 AI 编剧、提示词撰写或 AI 视频生产流程经验。\n5.        熟悉短剧平台、短视频平台及网络热点传播规律。\n6.        有成熟的题材库、人物库或连续剧开发经验。\n7.        能够使用 AI 工具辅助完成资料整理、创意发散、剧本优化及内容迭代。\n8.        可提供个人作品集、已上线作品或完整剧本案例者优先。", "cat": "内容与创作"}, {"id": "139", "title": "业务经理助理 / 项目经理", "salary": "面议", "location": "", "jd": "岗位介绍\n本岗位承担项目推进（PMO）与执行督导双重职责：将业务经理的想法与指令转化为可落地项目，全程跟进至结果交付，确保事事有回音、件件有着落。\n岗位职责\n1.指令落地：将想法与指令拆解为可执行任务，明确目标、节点与责任人，建立任务台账并持续跟踪。\n2.项目推进：统筹跨团队项目进度，建立汇报与复盘机制，识别风险、协调资源、推动问题闭环。\n3.执行督导：对进度滞后、执行敷衍、质量不达标及时纠偏问责，守住交付标准。\n4.事务协同：管理上级时间与信息流，过滤信息、排列优先级、预判风险，提供决策支持。\n5.AI 提效：熟练运用 AI 工具与工作流（写作、数据分析、自动化、Agent 等），提升团队产出效率。\n6.结果复盘：验收关键事项成果，沉淀方法与机制，持续优化执行效率。\n任职要求\n1.目标感强，有信念，愿意为结果负责到底。执行力强，说到做到，能在复杂环境下推动事情拿到结果，原则性强，敢于对事不对人地推动与问责，抗压，不回避冲突。\n2.有 PMO、项目推进、运营或团队管理经验，熟悉目标拆解、进度管理与风险管控。\n3.AI 工具重度使用者，能搭建提示词、自动化、数据分析等提效流程。\n4.熟悉成熟平台相关行业实际运作规则，善于在复杂局面中破局，具备底线与合规意识。\n5.沟通清晰、逻辑严密，适应高强度快节奏。\n加分项\n1.有高管助理、总裁办或业务线管理支持经验。\n2.有从 0 到 1 或创业项目经验。\n3.有 AI 工作流、Agent、自动化工具落地经验。\n4.数据敏感，习惯用数据驱动决策。", "cat": "产品与管理"}, {"id": "140", "title": "高级 SEO 专家", "salary": "20-40", "location": "", "jd": "岗位职责：\n1、负责成熟平台内容站点在 Google 及 Yandex 搜索引擎的整体 SEO 策略制定与流量突破，监控与分析竞争对手的 SEO 策略及流量结构，持续优化自身的差异化竞争优势\n2、负责 Technical SEO 优化，改进网站架构、页面加载速度、索引收录及移动端体验\n3、制定并执行外链建设策略，拓展和维护高质量的外链资源与渠道\n4、追踪 Search Console、Yandex Webmaster 等平台的关键数据，定期输出数据分析报告与优化方案\n任职要求：\n1、3 年以上 SEO 实战经验，精通 Google 与 Yandex 的排名机制与算法更新\n2、 具备成熟题材行业（Adult）或高风险流量站点的 SEO 实战案例与成功经验\n3、熟练使用主流 SEO 工具，如 Ahrefs、Semrush、Screaming Frog、Yandex.Metrica 等\n4、熟悉 Technical SEO，能够独立排查和解决网站收录异常、惩罚降权等技术问题\n5、具备强烈的数据驱动意识、独立解决复杂问题的能力及较强的抗压能力\n加分项：\n1、具备大型流量站点（日均 IP 10万+）的成功优化案例\n2、熟悉黑帽/灰帽 SEO 常用手法及防封禁、降权恢复策略\n3、具备基础的前端开发能力（HTML/CSS/JavaScript），能独立配合技术团队推进代码级优化\n4、熟悉 PBN（私人博客网络）搭建与运维管理", "cat": "运营与市场"}, {"id": "141", "title": "运营专员", "salary": "Open", "location": "", "jd": "岗位职责：\n1、渠道获客：开拓并维护海外及特定市场获客渠道（广告网络、网盟AFF、TG/DC生态、特种流量等），控制获客成本，提升ROI与LTV。\n2、用户转化： 针对AI短剧与特色娱乐用户，搭建AARRR增长漏斗，优化内容推荐策略与付费阶梯，提升留存率与ARPU值。\n3、数据复盘：监控拉新、活跃、留存及变现全流程数据，基于归因分析快速迭代运营与变现策略。\n任职资格：\n1、具备 2 年以上 Adult 站点 / 特色娱乐平台的实际运营经验（无色站经验者勿投）。\n2、 熟悉 AI 成人短剧赛道，了解其内容形态、受众心理及变现路径（或具备成熟的色站全流程运营与流量资源）。\n3、精通用户增长（Growth Hacking）、网盟推广（AFF）及社群裂变等高转化玩法。\n4、 具备特种流量渠道（广告网络、暗流等）的开拓、谈判与数据监控能力。\n5、熟练运用转化漏斗与生命周期模型，具备强数据敏感度，能精准优化 LTV / CAC。\n6、 深刻洞察目标用户付费心理，抗压与执行力强，适应极速迭代业务。\n加分项：\n1、 具备华语市场的本地化推广、特种流量投放或出海产品运营成功案例者优先。\n2、 熟悉海外黑灰产流量机制、隐蔽渠道买量、防封控手段及规避敏感审查的实操经验者优先。\n3、 能熟练运用 Midjourney、ComfyUI、Sora、Codex 等 AI 工具辅助快速生成宣传素材、短剧剧本或运营文案者优先。\n4、自带 Adult 领域优质网盟（AFF）、站长（Webmaster）、KOL 或特种广告主资源者优先。", "cat": "运营与市场"}, {"id": "142", "title": "中级运营专员", "salary": "10K - 15k", "location": "", "jd": "一，岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\n\n二，任职要求\n\"1.大专及以上学历，3年以上网站或APP实际运营经验，能独立策划和执行活动，具备较强的数据分析能力，AI应用或自动化系统落地经验，有基于 OpenClaw 构建实际项目经验者优先。\n熟悉 OpenClaw 框架逻辑，能够独立设计 Agent 执行流程与任务拆解结构。\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求\"", "cat": "运营与市场"}, {"id": "143", "title": "初级运营专员", "salary": "8K - 13k", "location": "", "jd": "一，岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\n\n二，任职要求\n\"1.大专及以上学历，2年以上网站或APP实际运营经验，能独立策划和执行活动，具备较强的数据分析能力，AI应用或自动化系统落地经验，有基于 OpenClaw 构建实际项目经验者优先。\n熟悉 OpenClaw 框架逻辑，能够独立设计 Agent 执行流程与任务拆解结构。\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求", "cat": "运营与市场"}, {"id": "144", "title": "初级编辑", "salary": "8K - 13k", "location": "", "jd": "1.高中及以上学历，有1年以上内容运营经验，或具备独立运营网站内容或社媒平台账号的能力（社交媒体方向优先）\n2.对成人类行业内容有一定了解和接触；\n3.具备剪辑经验，能够熟练使用 Pr / Ps 等工具；\n4.有良好的写作能力，文案输出，文字功底，思维逻辑良好，能独立完成标题、内容、关键词抓取、文案撰写\n任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解或接触，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者\"", "cat": "内容与创作"}, {"id": "145", "title": "中级运营专员", "salary": "10K - 15k", "location": "", "jd": "高中及以上学历，有3年以上内容运营经验，或具备独立运营网站内容或社媒平台账号的能力（社交媒体方向优先）\n岗位职责\n1. 内容管理与优化：\n内容筛选： 负责视频资源的采集、筛选与审核，确保视频画质高清、分类准确（标签化管理）。\n文案撰写： 为视频撰写吸引人的标题和描述（SEO优化），提升搜索权重和点击率。\n内容排期： 策划每日/每周的推荐内容，优化首页布局，提高用户点击率。\n2. 流量获取与增长：\n渠道推广： 负责在社交媒体（Twitter/X, Telegram, Reddit, Instagram等）进行内容分发，引导流量回流。\nSEO/ASO优化： 研究成人关键词趋势，通过关键词优化提升搜索引擎自然排名。\n活动策划： 策划节日或热点相关的专题活动，提升新用户注册率。\n3. 用户增长与留存：\n社群运营： 管理用户社群/评论区，引导用户互动，收集用户对内容的需求反馈。\n数据分析： 监控日活(DAU)、留存率、跳出率等核心指标，分析用户观看习惯，优化内容推送逻辑。\n4. 竞品分析：持续追踪国内外主流AV站点的功能更新、内容趋势和营销手段，并提出改进建议。\n\n任职要求\n1. 基本素质：\n心态开放： 对成人内容持开放、专业的态度，能够客观地面对并处理各类色情影像资料。\n审美能力： 对“好内容”有敏锐的感知力，知道什么样的封面和标题能吸引用户。\n2. 专业能力：\n运营经验： 3年以上互联网运营经验（有视频平台、社交平台或成人行业经验者优先）。\n工具使用： 熟练使用基础的图像/视频剪辑工具（如CapCut, Premiere, Photoshop），能简单制作吸引人的缩略图。\n语言能力： 具备良好的英文阅读能力（能处理外网资源及分析全球趋势），会日语者优先。\nSEO基础： 了解基础的SEO逻辑，懂得如何利用关键词获取流量。\n3. 加分项：\n是资深的成人内容消费者，对各类片商、演员、流派有深入了解。\n熟悉Telegram Bot或自动化营销工具。\n有过从0到1搭建流量池的成功经验。", "cat": "运营与市场"}, {"id": "146", "title": "初级编辑", "salary": "8K - 13k", "location": "", "jd": "1.高中及以上学历，有1年以上内容运营经验，或具备独立运营网站内容或社媒平台账号的能力（社交媒体方向优先）\n2.对成人类行业内容有一定了解和接触；\n3.具备剪辑经验，能够熟练使用 Pr / Ps 等工具；\n4.有良好的写作能力，文案输出，文字功底，思维逻辑良好，能独立完成标题、内容、关键词抓取、文案撰写\n任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解或接触，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者", "cat": "内容与创作"}, {"id": "147", "title": "编辑", "salary": "8K - 10k", "location": "", "jd": "任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者\n\n岗位职责：\n1.负责网站内容的收集、撰写、剪辑及日常发布；\n2.具备良好的沟通能力，思维灵活、逻辑清晰；\n3.密切关注社交媒体热榜，快速响应热门内容、话题", "cat": "内容与创作"}, {"id": "148", "title": "AI短剧剪辑师（成人向内容）", "salary": "10-15K", "location": "", "jd": "AI短剧剪辑师（成人向内容）\n岗位职责\n1. 根据剧本、分镜及AI生成素材，独立完成短剧粗剪、精剪、字幕、配音、配乐、音效及成片输出。\n2. 理解成年受众的观剧偏好，抓住人物关系、情绪张力与剧情冲突，做好开场钩子、情节推进和结尾悬念。\n3. 对AI素材进行筛选与重组，处理人物动作不连贯、口型不同步、镜头衔接生硬等问题，并提出补镜需求。\n4. 配合编剧、分镜及AI视频制作人员，优化镜头安排与素材质量，提升成片连贯性和观感。\n5. 根据发布平台要求，完成不同比例、时长及版本的剪辑交付，整理工程文件和素材。\n6. 结合完播率、留存率等反馈调整剪辑节奏，持续优化内容表现。\n任职要求\n1. 熟练使用剪映专业版、Premiere或DaVinci Resolve，能够独立完成短剧后期制作；掌握AE者优先。\n2. 有短剧、剧情短视频、动态漫或AI视频剪辑经验，具备完整作品或可展示片段。\n3. 具备叙事意识和审美判断，能通过镜头、声音与节奏表现人物情绪，避免单纯堆砌转场和特效。\n4. 了解AI视频素材特点，能判断素材可用性，并通过剪辑、声音设计或补镜方案解决问题。\n5. 能理解成人向题材的表达侧重尺度和内容\n6. 沟通清晰、交付稳定，能够根据反馈完成修改并做好版本管理。\n加分项\n- 有情感、都市、悬疑等成人受众题材的成熟作品。\n- 熟悉可灵、即梦、Runway等AI视频工具及AI配音流程。\n- 有基础调色、声音处理、或画面修复经验。\n- 参与过短剧账号运营，能结合数据说明剪辑优化思路。\n2—3部代表作品（短剧方向", "cat": "内容与创作"}, {"id": "149", "title": "AI 短剧导演兼后期制作", "salary": "15-20K", "location": "", "jd": "岗位定位\n\n负责成人向 AI 短剧从剧本到成片的全流程制作，兼具导演思维、视听审美与后期执行能力。能够理解人物关系与情绪张力，运用 AI 工具完成镜头制作，并独立把控剪辑、声音及最终交付质量。\n\n岗位职责\n\n1. 根据剧本确定影片风格、角色形象、场景设计和视听表达，完成分镜脚本及制作规划。\n\n2. 把控角色神态、肢体动作、对白节奏及人物互动，使表演呈现符合剧情与情绪逻辑。\n\n3. 运用 AI 图像、视频及声音工具完成素材生成与迭代，解决人物一致性、镜头衔接和动作自然度等问题。\n\n4. 独立完成剪辑、调色、配音整合、音效、配乐、字幕及必要的合成修复，交付完整成片。\n\n5. 理解成人题材的叙事特点，通过构图、光影、声音和剪辑营造吸引力，把握亲密关系、暧昧氛围与戏剧冲突的表达尺度。\n\n6. 与编剧协作评估制作可行性，优化难以生成或成本过高的场景，平衡质量、周期与成本。\n\n7. 建立角色、场景、镜头及声音资产库，沉淀可复用的制作流程。\n\n任职要求\n\n1. 有短剧、影视、广告、动画或 AI 视频制作经验，具备可展示的完整作品。\n\n2. 同时具备导演能力与后期能力，能够独立完成从分镜到成片的制作。\n\n3. 熟悉镜头语言、场面调度、表演逻辑与叙事节奏，能够解释镜头和剪辑选择的原因。\n\n4. 熟练使用至少一款专业剪辑软件，具备调色、声音处理及基础合成能力。\n\n5. 熟悉 AI 图像与视频生成工作流，能够持续测试工具并解决实际制作问题。\n\n6. 能够接受成人内容业务方向，对成年受众的内容偏好与观看心理有理解。\n\n7. 具备良好的沟通能力、交付意识和项目保密意识。\n\n加分项\n\n有成人向、情感、悬疑或强人物关系题材经验；有独立导演并完成后期的作品；熟悉制作模型、角色一致性控制、批量制作；有小型团队管理及交付经验。\n\n应聘材料\n\n提供 2—3 部代表作品，注明本人负责环节；至少一个从剧本或分镜到最终成片的案例；说明常用工具、单集制作周期及可承担的工作范围。", "cat": "内容与创作"}, {"id": "150", "title": "AI 短剧编剧", "salary": "15-20K", "location": "", "jd": "岗位名称：AI短剧导演制片\n岗位别称：AI漫剧导演制片  AIGC内容导演  AI项目导演\n岗位定位：同时承担AI短剧的创作导演与制片管理责任，统筹剧本视听化、视觉定调、分镜执行、成片质量、预算排期、团队协作和最终交付。\n岗位职责\n1. 负责AI短剧从立项、剧本确认、视觉开发、分镜制作、AI素材生成到后期成片交付的全流程统筹。\n2. 解读和评估剧本，明确每集核心冲突、人物情绪、爽点、反转及集尾悬念。\n3. 将剧本转化为可执行分镜，明确景别、机位、构图、人物调度、动作、表情、运镜和镜头衔接。\n4. 制定人物、场景、服装、道具、色彩、光影和整体画风方案，并审核核心视觉资产。\n5. 指导AI视频生成师完成提示词、参考图和动态镜头，解决人物变脸、动作错误、空间混乱和风格漂移。\n6. 指导配音、音乐、音效和后期剪辑，统一声音、节奏、情绪和成片风格。\n7. 负责样片、单集及整剧审核，明确补镜、重生成、重剪和声音修改意见。\n8. 根据集数、镜头量和制作难度制定制作周期、人员配置、成本预算及交付计划。\n9. 统筹编剧、分镜、AI生成、配音和后期岗位，明确各环节负责人、质量标准和交付节点。\n10. 建立并维护项目排期、镜头任务、素材状态、修改记录和版本管理机制。\n11. 跟进制作进度和团队产能，及时处理剧本延误、资产缺失、生成失败和后期积压等风险。\n12. 管理AI工具点数、API、算力、存储、外包及其他项目成本，控制无目标重做和重复生成。\n13. 跟进平台规范和版权要求，排查素材、字体、音乐、声音和形象授权风险。\n14. 根据前5秒留存、平均观看时长、完播率和掉点数据组织复盘，优化后续内容与制作流程。\n15. 沉淀分镜、视觉、生成、审核、成本和交付标准，推动团队稳定量产。\n任职要求\n1. 有短剧、动画、动态漫、影视、广告、游戏CG或剧情短视频导演及项目统筹经验。\n2. 具备完整的视听叙事能力，熟悉构图、机位、运镜、剪辑、声音和表演调度。\n3. 能够独立完成剧本拆解、分镜设计、视觉定调、成片审核和项目排期。\n4. 熟悉AI生图、生视频的生产逻辑和限制，能够判断问题并组织解决。\n5. 熟悉两类以上AI图像或视频生成工具，了解相关点数、算力和成本结构。\n6. 能够控制角色、场景、动作和视觉风格的跨镜头一致性。\n7. 熟悉竖屏短剧叙事，理解前5秒留人、高情绪密度和集尾钩子。\n8. 能够估算镜头量、素材量、生成次数、后期工作量和制作周期。\n9. 具备预算、人员、外包、版本和交付管理能力。\n10. 具备较强的团队管理和跨岗位沟通能力，能给出明确、可执行的修改意见。\n11. 能够结合观看数据复盘内容和制作问题，不只依赖个人审美判断。\n12. 具备版权、内容合规和资料保密意识。\n优先条件\n独立导演并完整负责过上线的AI短剧或AI漫剧项目。\n有批量内容生产或连续剧集管理经验。\n具备成熟的分镜设计、后期审片和项目管理能力。\n熟悉角色模型、首尾帧、动作控制和镜头延长流程。\n有外包、供应商或远程团队管理经验。\n能搭建镜头级生产管理表及标准化工作流程。\n有短剧观看数据复盘和内容迭代经验。\n投递材料\n一至三部导演或统筹制作的代表作品。\n分镜稿、视觉设定和最终成片对比。\n本人职责、团队规模、制作周期和交付结果说明。\n项目排期、流程管理或AI生成问题解决案例，可隐去敏感信息。\n工作结果关注项\n成片叙事与视听质量\n分镜和视觉执行质量\n准时交付率\n预算与生成成本控制\n一审通过率\n返工率\n人物和视觉一致性\n留存与完播表现\n团队产能与流程建设\n", "cat": "内容与创作"}, {"id": "151", "title": "编剧(资深短剧编剧) AI 内容编辑", "salary": "15-20K", "location": "", "jd": "岗位定位\n\n负责成人向 AI 短剧的选题、故事开发及剧本创作。能够围绕人物欲望、关系变化与冲突设计故事，同时理解 AI 制作特点，写出具有吸引力、便于视听呈现且可执行的短剧剧本。\n\n岗位职责\n\n1. 根据目标受众及内容定位开发选题，完成故事概念、人物小传、关系设定和分集大纲。\n\n2. 独立撰写分集剧本，包括场景、动作、对白与关键情绪节点，保证叙事清晰、人物动机成立。\n\n3. 设计开场钩子、剧情推进、反转及结尾悬念，适应短剧的观看节奏和连续追看需求。\n\n4. 围绕成年角色的情感、欲望与关系冲突展开创作，使成人元素服务于人物塑造和故事发展。\n\n5. 理解 AI 制作的能力与限制，合理控制角色数量、场景数量、动作复杂度和连续性要求。\n\n6. 与导演共同打磨剧本，根据分镜、素材生成和成片效果调整场景与对白。\n\n7. 建立选题库、人物设定库和系列故事框架，根据反馈持续优化内容。\n\n任职要求\n\n1. 有短剧、影视、网络小说、漫画或互动剧情等创作经验，能够提供完整作品或剧本样稿。\n\n2. 具备独立完成选题、大纲和分集剧本的能力，能够持续产出原创故事。\n\n3. 擅长人物关系、情绪递进、戏剧冲突和对白，让不同角色具有可辨识的性格与表达方式。\n\n4. 熟悉短篇叙事，能够在有限时长内完成有效的情节推进。\n\n5. 能够接受成人内容业务方向，对成年受众的情感诉求和内容偏好有理解。\n\n6. 具备画面思维，能够将心理活动转化为可拍摄、可生成的动作与场景。\n\n7. 能够使用 AI 工具辅助构思与修改，并对最终剧本的逻辑、原创性和完成度负责。\n\n8. 接受团队讨论与多轮修改，具备稳定交付和保密意识。\n\n加分项\n\n有成人向、情感关系、悬疑或互动叙事作品；有已上线短剧、连载故事或商业化内容创作经验；参与过 AI 视频项目；能够开发系列人物和持续更新的故事线。\n\n应聘材料\n\n提供 1—2 份代表性剧本或故事作品，注明原创及参与情况；一份包含人物设定、故事大纲和完整单集的样稿；说明擅长题材、可接受的内容尺度及稳定产能。", "cat": "内容与创作"}, {"id": "152", "title": "中级运营专员（内容文案方向）", "salary": "10K - 20K", "location": "", "jd": "岗位职责\n1. 负责娱乐、社会热点内容的标题创作、正文撰写及内容包装；\n2. 跟进全网热点，挖掘适合平台用户的选题；\n3. 参与评论区内容创作，产出神评、热评、段子、网络梗等互动内容；\n4. 使用 AI 工具完成资料整理和初稿辅助，在此基础上进行人工改写与再创作；\n5. 根据点击率、阅读率、互动数据调整内容表达方式。\n\n任职要求\n1. 学历专业不限，有内容、媒体、自媒体、文案相关经验优先，接受应届生和转行；\n2. 中文表达流畅，能把一件事写清楚，会起标题；\n3. 关注娱乐热点和网络流行文化，日常刷微博、抖音、小红书、贴吧等；\n4. 有网感，了解年轻用户的语言习惯；\n5. 愿意用 AI 工具提效，但不接受纯搬运和机械洗稿；\n6. 有爆款标题、10万+ 文章、热门评论或个人账号运营经验者优先", "cat": "内容与创作"}, {"id": "153", "title": "高级运营专员（内容文案方向）", "salary": "20K -  35K", "location": "", "jd": "内容策划（高级）\n\n岗位职责\n1. 负责娱乐、社会热点内容的标题创作、正文撰写及内容包装；\n2. 跟进全网热点，挖掘适合平台用户的选题；\n3. 负责文案团队的任务分配、进度跟进及日常工作协调；\n4. 审核和优化团队文案，把控标题、正文及互动内容质量；\n5. 沉淀并优化文案标准和审核规则，定期复盘团队内容质量；\n6. 参与评论区互动文案策划，产出神评、热评、段子及网络梗；\n7. 使用AI工具完成资料整理和初稿辅助，并组织团队进行人工改写和再创作；\n8. 根据点击率、阅读率、互动率等数据调整内容方向和表达方式。\n\n任职要求\n1. 2年以上内容、媒体、自媒体或文案相关经验；\n2. 有团队管理、项目统筹或内容审核经验，有带项目经验者亦可；\n3. 中文表达流畅，能够独立完成标题、正文、评论及段子创作；\n4. 熟悉微博、抖音、小红书、贴吧等平台，关注娱乐热点和网络流行文化；\n5. 有较好的网感，了解年轻用户的语言习惯；\n6. 具备任务分配、进度跟进和文案质量把控能力；\n7. 能够使用AI工具提升效率，并对生成内容进行人工修改和优化；\n8. 有爆款内容、热门评论或个人账号运营经验者优先。", "cat": "内容与创作"}, {"id": "154", "title": "中级seo专员", "salary": "12K - 16k", "location": "", "jd": "招聘要求 1、1-3年以上SEO工作经验，市场营销、电子商务、新闻传播、计算机相关专业优先。 2、熟悉搜索引擎工作原理（Google、Bing、百度等）。精通 白帽SEO 优化策略（关键词研究、网站结构优化、内容优化、外链建设等）。 3、熟练使用常用SEO工具（如 Ahrefs、SEMrush、Google Analytics、Search Console、Screaming Frog 等）。了解HTML、CSS、基础JS，能与技术团队沟通实现优化需求。 4、有独立操作中大型网站SEO优化成功案例（尤其是自然流量提升）。数据分析能力强，能根据数据调整优化策略。 岗位职责： 1、SEO策略制定与执行：根据公司业务目标，制定并执行 纯白帽SEO优化方案。 进行关键词研究、网站结构优化、内容规划与落地。 2、站内优化：提升网站的页面速度、结构化数据、内链优化、URL规范化。优化页面标题、元描述、H标签、内容布局，提升用户体验与排名。 3、站外优化：制定高质量外链建设计划（客座博客、行业合作、媒体推广等）。 严格遵守搜索引擎规则，杜绝黑帽/灰帽手法。 4、效果监控与数据分析：定期监控网站SEO指标（收录量、排名、自然流量、转化率等）。 输出数据报告，并根据结果调整策略。 5、跨部门协作：与内容、产品、技术、市场团队合作，确保SEO优化顺利实施。 6、行业跟踪与优化迭代：跟进搜索引擎算法更新，保持优化手段的前沿性和合规性。 不断迭代SEO策略，提升长期自然流量和品牌影响力。 @yf_yyds 根据目前项目属性再优化一下，提交给 孙老师 中级SEO 2人", "cat": "其他"}, {"id": "155", "title": "高级产品经理", "salary": "20K - 30k", "location": "", "jd": "一、岗位职责\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等工具，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4. 具备一定的团队管理经验，能够指导中初级产品成员开展工作，提升团队整体专业能力。\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n\n二、任职要求\n1. 本科及以上学历，产品、计算机、设计等相关专业优先。\n2. 5 年以上互联网/软件产品经理经验，至少具备 1 个从 0-1 独立负责并成功落地的项目经验。\n3. 熟练使用 Axure、墨刀、Figma 等原型工具，能独立完成 高保真交互原型设计，理解 UI/视觉基本规范及呈现逻辑。\n4. 具备 业务理解能力与数据分析能力，能够将业务需求转化为可实现的产品方案。\n5. 具备一定的 团队管理能力或带队经验，可以指导新人并进行工作拆解与质量把控。\n6. 具备良好的沟通能力、推动能力和跨部门协作能力，能够在多方需求中进行合理取舍与决策。\n7. 具备较强的文档能力，能够输出高质量的 PRD、交互文档、需求分析等。\n8. 抗压能力强，责任心强，具备较强的自驱力与主人翁意识。\n三、加分项\n1. 有大型互联网公司产品经验者优先。\n2. 有消费品、电商、社交、内容平台等行业经验者优先。\n3. 具备用户增长、商业化等方向项目经验更佳。\n4. 具备 UED/交互设计背景或视觉审美能力突出者优先", "cat": "产品与管理"}, {"id": "156", "title": "产品质检员", "salary": "15K - 20k", "location": "", "jd": "产品质量督导\n【岗位职责】\n1. 负责网站、H5、APP等产品版本上线前验收，根据需求文档、原型及业务规则开展功能验证，保障版本上线质量。\n2. 负责产品日常质量巡检，覆盖核心功能、页面展示、业务流程、运营配置、内容质量、用户体验及SEO基础配置等场景，及时发现问题并推动解决。\n3. 跟进产品项目及需求进度，关注任务目标、优先级、排期及上线节点，对延期、执行偏差及风险及时反馈并推动处理。\n4. 跟踪线上问题及用户反馈，完成问题复现、影响评估、问题分级、整改跟进及复验闭环。\n5. 负责运营内容质量检查，包括标题、标签、正文、图片、视频、内容关联、重复内容、失效资源及发布规范等问题。\n6. 负责业务SOP、上线标准及日常维护规范的执行检查，发现流程偏差并推动整改。\n7. 负责质量数据统计与分析，输出巡检报告、验收报告及质量分析报告，跟踪缺陷趋势、整改效率及重点风险。\n8. 参与验收标准、巡检规则、问题分级标准及质量管理机制建设，持续优化质量管理流程。\n9. 协同产品、研发、测试、运营等团队推动问题解决，对重大风险、任务延期及跨团队协作问题进行跟踪反馈。\n10. 参与AI及自动化巡检能力建设，提升巡检效率、覆盖率及问题发现准确率。\n\n【任职要求】\n1. 本科及以上学历，专业不限，1年以上互联网产品质量、测试、运营质检或相关工作经验。\n2. 熟悉互联网产品生命周期及需求、开发、测试、验收、上线、运营维护等基本流程。\n3. 熟悉功能测试、产品验收、缺陷管理、线上巡检及问题闭环流程，具备较强的问题发现和风险判断能力。\n4. 具备一定的产品思维和用户体验意识，能够发现功能、页面、交互、内容及业务流程中的问题。\n5. 具备线上问题分析、复现、定位及跟踪能力，能够独立推动问题闭环。\n6. 具备一定的数据分析能力，能够独立输出验收报告、巡检报告及质量分析报告。\n7. 具备较强的责任心、执行力、风险意识及跨团队沟通推动能力。\n8. 熟悉 Jira、TAPD、禅道、飞书、多维表格、Google Sheet 等工具者优先。\n9. 有AI工具、自动化测试、Playwright、Python或自动化巡检相关经验者优先。", "cat": "职能与行政"}, {"id": "157", "title": "中级客服专员", "salary": "8K - 10k", "location": "", "jd": "支持组招聘需求（支持组 / 商务服务方向）\n\n招聘岗位：客服专员\n招聘人数：2人\n\n岗位职责：\n1、负责商务服务相关日常工作对接，及时跟进需求并做好反馈。\n2、协助处理广告上下架、链接更换、广告检查、数据整理及表格维护等工作。\n3、跟进商务合作过程中的资料收集、信息核对及进度同步。\n4、协助整理日报、周报、工作汇总及相关业务台账。\n5、负责跨部门沟通协调，推动相关事项按时落地。\n6、对日常工作中出现的问题进行记录、反馈，并协助推动解决。\n7、负责广告业务相关基础执行及巡检工作。\n\n岗位要求：\n1、本科及以上学历，专业不限，有相关工作经验优先。\n2、沟通表达能力较好，做事细致认真，有责任心。\n3、能熟练使用 Excel、Google Sheets 等办公工具，具备基础数据整理能力。\n4、具备较强执行力，能适应多线程工作安排。\n5、有商务支持、运营支持、广告对接、客服或数据整理相关经验者优先。\n6、能够接受日常表格维护、信息核对、沟通跟进及业务检查类工作。\n\n优先条件：\n1、有广告投放、商务对接、运营支持相关经验。\n2、有较强表格处理能力，能够高效完成数据整理与核对。\n3、工作主动性强，能及时发现问题并反馈。\n4、有团队协作意识，沟通顺畅，执行稳定。\n\n岗位核心能力：\n• 沟通协调能力\n• 表格与数据整理能力\n• 执行力与细节把控能力\n• 问题反馈与跟进能力\n• 多任务并行处理能力\n\n招聘说明：\n该岗位主要偏向商务支持、服务执行及日常业务协同，需要候选人具备较好的沟通能力、执行能力及基础数据处理能力，能够配合完成广告业务相关日常工作，保障各项事务稳定推进。", "cat": "运营与市场"}, {"id": "158", "title": "产品经理 (AI 赋能/高能效方向)", "salary": "20K - 30k", "location": "", "jd": "职责描述 \n需求定义与方案设计： 负责产品的需求分析、功能定义及原型设计，确保产品方案能真正解决用户痛点，并具备极强的竞争力。\nAI 驱动的工作流革新： 深度实践“AI 赋能产品研发”，利用 LLMs (大语言模型) 进行竞品快速分析、用户反馈聚类、PRD 自动化生成及流程图优化，将工作能效提升至极致。\n方案合理性判断： 在方案设计阶段，能够客观评估“AI 解决”与“传统逻辑解决”的成本、效率及用户体验，避免盲目堆砌 AI 功能，确保方案的最优解。\n跨职能高效协作： 利用 AI 工具将需求转化为更精准的技术语言，降低与研发（尤其是 AI 赋能的研发）之间的沟通成本，加速交付闭环。\n数据洞察与迭代： 利用 AI 数据分析工具快速处理用户行为数据，从中提取关键洞察，驱动产品的快速迭代。\n\n【核心 PM 能力】\n\n专业功底： 3 年以上产品设计经验，精通原型设计（Axure/Figma 等）、PRD 编写，具备强大的逻辑分析能力和闭环思考能力。\n业务洞察： 能快速进入新业务领域，通过底层逻辑推演精准定义产品路径。\n用户共情： 能够深刻洞察用户潜在需求，将其转化为可落地的功能定义。\n【AI 赋能能力】（核心区分点）\n\nAI 工具链熟练度： 深度使用 ChatGPT, Claude, Perplexity, Notion AI 等工具进行信息搜集、文档撰写和逻辑梳理，已形成一套成熟的“AI 辅助工作流”。\nPrompt 操盘能力： 能够编写复杂的 Prompt 来模拟用户画像、进行压力测试或优化 PRD 的结构，使输出结果达到生产级标准。\nAI 认知力： 了解当前大模型的能力边界（如幻觉问题、Token 成本、响应延迟），能够基于此设计出鲁棒性强的产品方案。\n【综合素质】\n\n极强的学习进化力： 对 AI 领域的新工具、新模式有强烈的好奇心，并能迅速将新工具转化为生产力。\n结果导向： 不追求工具的华丽，而追求交付结果的精准度和速度。", "cat": "产品与管理"}, {"id": "159", "title": "AI影像制作师", "salary": "面谈", "location": "", "jd": "岗位职责：\n1、负责AI短剧、AI漫剧及原创内容制作，通过AI工具完成剧本拆解、人物生成、视频生成、剪辑包装及最终交付，持续优化AI工作流，提高内容生产效率和质量。\n2、AI制作包含全流程过程，剧本撰写/拆解、分镜设计、Prompt编写、AI人物生成、AI视频生成、视频剪辑、配音、字幕、包装、成片输出\n3、AI视频制作内容包含，真人AI短剧、AI漫剧、二创视频、宣传视频、IP动画\n4、AI人物制作负责人物一致性、人物三视图、角色LoRA、人物模型、人物Prompt、人物资产沉淀\n\n岗位要求：\n1、具备AI工具实战能力，必须熟练包含不限Seedance 2.0、ComfyUI、Kling（可灵）、Runway Gen-4、Veo、Hailuo（海螺）等至少 3 款主力工具的实际产出经验。\n2、具备AI生图、AI视频制作、视频剪辑能力。\n3、照稿出片能力强，能依据现有特定脚本，独立生成镜头素材，能批量稳定产出\n4、剪辑感、字幕功底、调色能力、音频处理、转场衔接、基础特效都需要过硬\n5、能够承接限制级 / 成人尺度题材的 AI 短剧、漫剧制作\n\n加分项：\n1、有完整的 AI 短剧 / 漫剧成片作品集（必须附链接 / Demo）\n2、自建可复用 prompt 库 / 工作流\n\n应聘必交：\n1、AI 成片作品集（最重要，无作品不约）\n2、列出常用的 AI 工具及各自产出占比\n3、说明独立完成的最复杂一部作品的全流程（生成 + 剪辑部分）", "cat": "内容与创作"}, {"id": "160", "title": "AI短剧编剧", "salary": "面谈", "location": "", "jd": "岗位职责：\n1、选题与故事策划，覆盖玄幻、系统、逆袭、末日、悬疑、规则怪谈、武侠、动漫/IP、都市情感、男性向等题材。\n2、AI短剧剧本创作，独立完成：故事梗概 → 人物小传 → 故事大纲 → 分集大纲 → 分集剧本 → 台词 → 单集钩子\n3、小说/IP改编，负责小说、动漫、影视及成熟故事的短剧化改编。\n4、人物及角色IP塑造，能够设计具有明显辨识度的角色。\n5、系列化内容设计，不能只写“一个好故事”，需要具备连续剧意识。\n6、AI可制作性适配，需要理解AI视频当前的制作边界。\n7、内容资产沉淀，持续建立题材库、爆款案例库、人设库等资产\n岗位要求：\n1、2年以上短剧/短视频/影视编剧相关经验，有AI短剧、漫剧、短剧平台或网文改编经验。\n2、会用AI辅助写作（Claude/GPT等）提效，但具备独立写作优化能力。\n3、短视频感强，理解前三秒、节奏、用户注意力和平台传播逻辑\n4、镜头能力强，能够独立完成文字分镜并指导制作\n5、AI理解能力强，知道AI视频能做什么、不能做什么、怎么降低制作难度\n应聘必交：\n1、1-3部代表作品\n2、至少1份完整分集剧本\n3、已上线作品的数据表现（如有）\n加分项：\n如果有10集以上完整短剧作品，并能够提供上线数据，优先级最高。", "cat": "内容与创作"}, {"id": "161", "title": "AI视频生成师", "salary": "15K - 20K", "location": "", "jd": "岗位别称：AI抽卡师  AIGC视频制作师  AI视觉生成师\n岗位定位：根据剧本和分镜生成、筛选及优化人物、场景、道具和动态镜头素材，重点保障素材可用性、角色一致性和跨镜头连续性。\n岗位职责\n1. 拆解分镜中的人物、场景、动作、表情、构图、光影、景别和运镜要求。\n2. 使用AI生图和生视频工具完成人物设定、场景、道具、首帧和动态视频素材。\n3. 编写并优化提示词，合理使用参考图、种子、模型和控制参数提升稳定性。\n4. 批量生成和筛选素材，剔除五官畸形、肢体错误、动作穿模、画面闪烁及构图失衡的结果。\n5. 保证人物五官、发型、服装、身形、道具及整体画风在不同镜头中的一致性。\n6. 完成图生视频、首尾帧控制、人物动作、表情变化和镜头运动。\n7. 使用修图或AI工具完成局部重绘、扩图、高清修复和基础画面清理。\n8. 按镜头编号整理并归档人物、场景、道具、提示词、参数和成品素材。\n9. 配合导演和后期完成补镜、改动作、换景别及素材重生成。\n10. 持续测试新工具和工作流，提高可用素材率并降低生成成本。\n任职要求\n1. 熟悉AI图像或AI视频生成流程，有短剧、漫剧、动画或视觉制作经验。\n2. 至少熟练使用两类主流AI生成工具，如即梦、可灵、Vidu、海螺、Stable Diffusion或ComfyUI。\n3. 能够独立编写和优化文生图、图生图、文生视频及图生视频提示词。\n4. 理解景别、机位、构图、焦点、运镜和镜头连续性。\n5. 具备良好审美，能判断人物形象、表情、动作、色彩和光影是否符合要求。\n6. 能够发现并解决人物变脸、服饰漂移、左右手错误、道具错位和背景不连续等问题。\n7. 能够理解剧本和角色情绪，保证镜头服务剧情。\n8. 工作细致、有耐心，能够适应反复生成、筛选和迭代。\n优先条件\n·      有完整AI短剧、AI漫剧或AI真人短剧作品。\n·      熟悉角色LoRA、ControlNet、IP Adapter或节点式工作流。\n·      具有人物口型、动作驱动、首尾帧或镜头延长经验。\n·      会使用Photoshop、Premiere、After Effects或剪映。\n·      有可复用的角色库、场景库和提示词模板建设经验。\n投递材料\n·      AI视频或AI短剧代表作品。\n·      同一角色在多个场景和景别中的一致性案例。\n·      参考图、提示词及最终结果对比。\n·      本人负责范围、使用工具和主要工作流程说明。\n工作结果关注项\n·      可用素材通过率\n·      单个有效镜头平均生成次数\n·      人物与风格一致性\n·      镜头返工率\n·      按时交付率\n·      素材归档规范率", "cat": "内容与创作"}, {"id": "162", "title": "资料员", "salary": "8K - 13k", "location": "", "jd": ".一、资料提交标准\n每条资料必须包含以下内容：\n**图片：**不少于 5 张\n**视频：**不少于 1 个\n日期\n今日资料编号\n标题\n关键词标签（3-5个）\n内容文案（事件简介）\n二、资料内容要求\n内容方向\n\n以桃色、吃瓜、热点事件相关内容为主，优先选择传播度高、讨论度高的话题。\n\n重点关注：\n\n桃色事件\n网红八卦\n明星爆料\n反差事件\n热门视频\n社交平台热议事件\n三、资料筛选标准\n\n优先选择：\n\n最新发生的热点事件\n讨论热度高的内容\n图片、视频质量清晰\n素材完整（图文+视频）\n有持续传播价值的话题\n\n尽量挖掘当天最新内容，保证资料时效性。\n\n四、资料来源\n\n重点资料来源包括：\n\n国内平台\n微博热搜\n抖音热点\n微信、QQ吃瓜群\n海角社区（热门内容）\n其他公开热点资讯平台\n海外平台\nX（Twitter）热点事件\nOnlyFans 热门亚洲创作者（日韩、港台、中国等）公开更新内容\n其他公开社交平台热点\n五、资料质量要求\n\n优先选择：\n\n高清图片\n高清视频\n内容完整\n有标题、有事件背景\n图片与视频对应同一事件\n\n避免：\n\n图片模糊\n视频时长过短\n重复内容\n无事件价值内容\n六、禁止提交内容\n\n以下资料禁止提交：\n\n极度血腥、暴力内容\n涉及儿童、未成年人相关内容\n明显违法违规内容\n无法确认来源或真实性过低的内容\n重复、多次传播的旧资料（无新增内容）\n七、工作要求\n每日持续关注热点动态，及时整理最新资料。\n保证资料真实、完整、清晰。\n优先整理国内热点事件，国外内容作为补充。\n提交前完成编号、标题、标签及文案整理。\n发现优质、爆款潜力内容，第一时间提交，不等待统一汇总。", "cat": "职能与行政"}, {"id": "163", "title": "初级编辑", "salary": "8K - 13k", "location": "", "jd": "编辑候选人附带一份完整的文章成果 ，内容需要包含、标题、文案、关键词、标签、图片和视频                                                               \n 1.专科及以上学历，有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）\n2.对成人类内容有一定了解；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具者；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写\n任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者", "cat": "内容与创作"}, {"id": "164", "title": "中高级运营专员", "salary": "10k-30k", "location": "", "jd": "岗位职责：\n1. 负责公司核心业务的整体运营工作，根据业务目标制定阶段性运营策略，并推动落地执行。\n2. 围绕业务增长、用户活跃、转化提升、留存复购等核心指标，制定运营方案并持续优化。\n3. 负责运营体系建设，包括但不限于活动运营、用户运营、内容运营、数据复盘、流程机制和 SOP 搭建。\n4. 带领运营团队完成日常管理工作，包括目标拆解、任务分配、过程跟进、绩效辅导、能力培养与团队氛围建设。\n5. 基于业务数据分析，识别问题与增长机会，独立输出优化建议，并推动跨部门协同落地。\n6. 与产品、技术、渠道、商务、客服等相关部门紧密配合，推进重点项目执行，确保结果交付。\n7. 负责重点项目从策划、执行到复盘的全流程管理，提升团队整体效率与运营质量。\n8. 持续关注行业动态、竞品策略及用户需求变化，结合业务现状提出可落地的优化方向。\n\n任职要求：\n1. 本科及以上学历\n2. 5年以上运营工作经验，2年以上团队管理经验\n3. 有团队管理、目标分解、过程跟进和结果复盘经验\n4. 有从0-1搭建或1-10放大的实际案例\n5. 有明确业务结果产出，能用数据体现成绩\n6. 熟悉活动运营、用户运营、内容运营或业务运营其中一个或多个模块\n7. 具备较强的数据分析能力，能通过数据发现问题并推动优化\n8. 有跨部门沟通协作经验，能协调产品、技术、渠道、商务等团队推进项目\n9. 有运营体系、流程机制或SOP搭建经验优先\n10. 具备较强执行力、责任心和团队管理能力\n11. 职业经历相对稳定，有持续成长路径优先\n12. 有同行业或相关业务经验者优先", "cat": "运营与市场"}, {"id": "165", "title": "中级运营专员（短剧内容运营方向）", "salary": "10k-25k", "location": "", "jd": "1.负责短剧内容矩阵的整体运营策略制定，包括选题方向、内容排期、发布节奏的统筹规划；\n2.跟踪短剧内容数据表现（播放、完播、转化等），持续分析优化内容策略及运营打法，定期输出数据分析报告支撑业务决策；\n3.统筹站外推广工作，包括自媒体矩阵、TG频道、外链渠道等内容分发及曝光提升策略；\n4.带领并考核初级运营团队，把控内容更新、文案优化、专题活动等产出质量，对接网站/平台端内容规范落地；\n5.对齐业务目标，推动跨团队协作，完成短剧内容相关的临时性/专项工作。\n任职要求\n1.本科及以上学历，3年以上内容运营/短视频运营相关经验，有短剧行业经验者优先；\n2.具备较强的数据分析能力，能通过数据驱动内容策略迭代；\n3.有站外推广、自媒体矩阵运营或社群运营经验，熟悉TG频道运营者优先；\n4.具备一定的团队协作或带教经验，能统筹多任务并推进落地；\n5.责任心强，抗压能力好，能适应快节奏的业务需求。", "cat": "内容与创作"}, {"id": "166", "title": "中高级运营专员", "salary": "10k-20k", "location": "", "jd": "岗位职责：\n1.转化链路优化：负责全渠道流量监控，通过优化官网点击率、各端安装率（iOS/安卓）及渠道转化逻辑，提升整体获客效率。\n2.用户活跃与拉单：通过前端逻辑调整与策略干预，提升用户拉单触发频率，通过高频行为带动商业化转化。\n3.商业化策略设计：\n首充转化：设计低门槛首充产品（如周会员），降低付费门槛，提升新增付费率。\n客单价提升：规划高价值套餐（月/季包）及代金币体系，优化定价策略，提升 ARPPU 表现。\n续费召回：通过 Push、站内信等手段建立老用户触达机制，扭转续费下滑趋势，提高老用户充值占比。\n数据建模与实验：基于“拉单-付费率-ARPU”的影响机制进行实验验证，通过数据反馈不断迭代增长路径。\n4.核心考核指标 (KPI)\n获客质量：官网点击转化率、点击安装率、渠道转化率。\n增长规模：拉单触发频次、拉单率。\n变现效率：新增付费率、ARPPU、综合 ARPU。\n存量经营：老用户续费召回率、老用户充值占比。\n\n任职要求：\n1.获客与转化优化（前端漏斗）\n2.行为策略与增长实验（活跃增长）\n3.商业化与定价策略（收益提升）\n4.存量用户精细化运营（留存召回）\n\n专业技能词库（简历高频词）：\n模型思维：能够理清各数据指标间的联动关系，擅长通过拆解“提升路径”寻找业务增长点。\n实操经验：有视频、工具或订阅类产品运营背景，熟悉付费门槛设置、套餐定价及代金币体系设计。\n执行能力：具备优秀的产品逻辑梳理能力，能推动前端逻辑调整、支付开发及运营配置高效落地。\n数据驱动：具备严谨的数据分析能力，能从复杂的指标波动中定位核心问题并产出解决方案。\n核心指标： ARPU、ARPPU、付费渗透率、拉单率、安装转化率。\n业务逻辑： 商业化建模、定价策略、代金币体系、分层运营、用户召回、A/B Testing。\n加分项：\n具备自动化任务跟进或多 Agent 协同工作意识。\n有视频播放器、动漫或垂直内容领域成功增长案例者优先。", "cat": "运营与市场"}, {"id": "167", "title": "中高级运营", "salary": "10-30k", "location": "", "jd": "1. 2 年以上网站运营、内容运营、平台运营或增长运营经验。\n2. 熟悉网站运营流程，能独立完成内容规划、页面配置、数据分析和运营复盘。\n3. 熟悉网站后台 / CMS 操作，能完成内容发布、栏目维护、标签管理、专题配置等工作。\n4. 具备数据分析能力，能通过流量、点击、转化、留存、跳出率等数据发现问题。\n5. 理解基础 SEO，了解关键词、标题、描述、内链、收录、页面结构对网站流量的影响。\n6. 具备内容判断能力，能判断内容是否符合用户需求、网站定位和转化目标。\n7. 具备较强执行力，能把运营计划拆解成具体动作，并持续推进。\n8. 能与产品、技术、SEO、设计、数据等团队协作，清楚表达运营需求并推动落地。\n9. 熟练使用 Excel / Google Sheets / 飞书表格等办公工具，能整理数据和制作报表。\n\n---\n加分项\n1. 有内容聚合类、资讯类、社区类、垂直行业网站运营经验。\n2. 有海外中文站点、Google 流量站、SEO 流量站运营经验。\n3. 有多站点 / 矩阵站点运营经验。\n4. 熟悉 Google Analytics、Google Search Console、Ahrefs、SEMrush、Screaming Frog 等工具。\n5. 有 SEO 内容运营经验，能配合完成关键词布局、专题页规划、内链优化和内容优化。\n6. 有 Telegram、Twitter、Facebook、Reddit 等海外渠道运营经验。\n7. 有基础 Python / Shell / SQL 能力，可辅助数据整理、内容批量处理或运营自动化。\n8. 自己运营过个人网站、博客、频道、社群或副业项目。\n9. 有成功的网站增长案例，能说明自己负责的动作、数据变化和结果。\n我们希望你具备\n- 执行力强，能持续推进运营计划\n- 结果导向，关注流量、转化和用户行为变化\n- 细节意识强，能发现页面、内容、入口和数据异常\n- 主动性强，能主动发现问题并提出解决方案\n- 学习能力强，能关注行业变化、竞品动态和用户需求\n- 沟通能力好，能和技术、SEO、设计、数据团队高效协作\n- 有复盘意识，能从数据结果中总结经验并持续优化\n\"岗位职责\n\n1. 负责网站日常运营，包括内容更新、栏目维护、页面配置、专题策划等工作。\n2. 负责网站核心页面运营，包括首页、频道页、详情页、专题页、活动页等页面的内容管理和入口优化。\n3. 根据网站目标，制定内容运营、流量增长、用户转化和留存提升方案。\n4. 负责网站数据跟踪与分析，包括访问量、来源渠道、点击率、跳出率、转化率、留存率等数据。\n5. 根据数据表现发现问题，提出优化方案，并推动落地执行。\n6. 配合 SEO 团队，完成关键词布局、内容优化、内链建设、专题页规划和页面结构调整。\n7. 配合技术团队，推动网站功能优化、后台工具改进、数据看板建设和用户体验提升。\n8. 负责竞品调研，分析同类网站的内容结构、流量来源、页面布局和运营策略。\n9. 策划并执行网站运营活动，如专题活动、内容合集、榜单推荐、频道运营等。\n10. 建立并优化网站运营 SOP，包括内容发布规范、页面检查规范、数据复盘机制和问题反馈流程。\n11. 定期输出运营日报、周报、月报，汇报网站数据、运营问题、优化进展和后续计划。\n试用期内需完成：\n\n1. 网站运营现状诊断报告  \n2. 3 个月网站运营优化计划  \n3. 核心页面内容与入口优化方案  \n4. 至少 3 个运营问题或用户路径问题的优化落地  \n5. 每周网站数据复盘报告\"", "cat": "运营与市场"}, {"id": "168", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "\"\n2年以上运营经验，专科及专科以上学历\n熟练掌握办公自动化软件。\n熟练掌握数据分析和处理能力，能够对项目数据进行跟踪和分析。\n优秀的文笔写作能力，文案策划能力。\n良好的服务意识，优秀的分析、沟通、协调、谈判能力，团队合作精神佳。\n具备强烈的责任心及较好的职业素养，工作踏实、耐心细致。\n会图片处理、编辑能力（如：PR、PS、Canva、剪映）。\"\"负责公司新媒体平台（包括但不限于抖音、小红书、快手、youtube、tiktok、facebook等）的运营和推广，提升公司产品曝光和知名度，增强公司在新媒体领域的影响力。\n负责新媒体平台的内容策划、撰写、编辑和发布，确保内容质量和风格符合公司品牌形象和市场需求。\n根据公司业务和产品特点，制定并实施新媒体平台的数据分析、运营策略和内容计划，包括但不限于粉丝增长、阅读量提升等。\n与公司内部团队保持紧密沟通，跟踪、分析平台运营数据，提出优化建议，并提高新媒体、流量运营能力。\"", "cat": "运营与市场"}, {"id": "169", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "1.会制作AI视频、懂AI短剧内容形式者优先。\n2.负责网站日常运营管理，包括内容更新、资源发布、分类维护、页面巡检，保障网站稳定运营。\n3.根据运营规划完成视频、图文等内容的编辑、发布及优化，持续提升内容质量和用户体验。\n4.负责站外推广工作，包括网站运营、TG频道发布、外链建设、自媒体内容发布等，提升网站曝光及用户增长。\n5.根据运营数据分析用户行为及内容表现，持续优化标题、关键词、推荐位及运营策略，提高用户活跃度和转化效果。\n6.负责网站日常巡检，检查页面展示、视频播放、广告位、链接跳转等功能，发现异常及时反馈并跟进处理。\n7.配合团队完成运营活动策划、项目推进及其他临时性工作，确保各项运营目标顺利达成。", "cat": "运营与市场"}, {"id": "170", "title": "中级运营专员", "salary": "10K-30K", "location": "", "jd": "1、负责网站整体运营工作，包括内容运营、用户增长、SEO优化、频道规划及数据增长目标；\n 2、制定网站分类、标签、专题、搜索页等内容策略，提升网站流量、用户留存与转化效率；\n 3、负责热点内容方向制定与运营节奏把控，结合行业趋势快速推动内容上线与传播；\n 4、定期对网站数据进行复盘，包括流量来源、搜索关键词、用户行为、转化路径等，并输出优化方案；\n 5、负责网站内容生态优化，提升内容质量、用户互动、社区活跃度与用户粘性；\n 6、协助产品与技术团队推动功能迭代，包括推荐机制、搜索优化、内容分发、用户体验等方向；\n 7、跟踪行业及竞品动态，持续优化网站运营策略与增长模型；\n 8、参与重点项目推进，包括专题活动、频道改版、内容增长、流量承接及商业化优化等。", "cat": "运营与市场"}, {"id": "171", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "重点筛选有 App、盒子、视频、动漫、小说、社区、内容平台等基础运营经验的候选人；关注是否具备内容发布、素材整理、链接维护、后台配置、数据填报、用户反馈处理、活动配置等实际执行经验；优先考虑熟悉 Excel、飞书表格、运营后台、数据整理工具的候选人；关注候选人是否具备基础数据意识，能看懂点击、安装、活跃、充值、内容更新量等基础指标；重点评估执行力、细心程度、任务稳定交付能力、沟通反馈意识和多任务处理能力；有 AI 工具或自动化工具使用经验，能够提升基础工作效率者优先。\"岗位职责：负责 App、盒子等项目的日常基础运营工作，包括内容发布、素材整理、群组维护、页面检查、后台配置更新等，确保产品内容正常上线和展示；负责每日运营数据整理与填报，包括流量、点击、安装、活跃、充值、内容更新等基础数据，及时发现异常并反馈；负责官网、落地页、外部链接、推广链接等基础检查与维护，定期测试链接连通性，发现失效、跳转异常、无法访问等问题及时登记并跟进处理；协助收集用户反馈、群组问题、产品异常、播放异常、支付异常等信息，按照流程整理并同步相关负责人，推动问题闭环；根据运营需求，协助完成会员活动、充值活动、弹窗、Push、站内信、广告位等基础配置和上线检查；根据项目需求完成视频、漫画、小说、图片、专题等内容更新工作，并配合执行拉新、活跃、召回等基础运营动作；按要求完成日报、周报及任务进度汇报，对完成事项、异常问题、处理进度和次日计划进行清晰记录。\n\n核心考核指标：每日内容发布数量、链接检查数量、配置执行完成率、任务准时完成率；日报数据、内容数据、链接数据、异常记录的准确率和完整度；异常发现及时性、问题记录规范度、问题跟进闭环率；日常运营任务处理速度、重复性任务完成效率、跨项目协作配合度；内容更新稳定性、产品基础活跃数据、用户反馈处理质量、运营动作执行效果。\n\n任职要求：执行力强，能按照要求完成日常运营任务，具备责任心和时间意识，能够保证任务稳定交付；细心认真，对数据、链接、内容、配置等基础工作有耐心，能够及时发现问题并准确记录；学习能力强，愿意学习产品后台、数据表格、AI 工具、自动化工具等基础运营工具，能快速适应新的工作流程；沟通反馈及时，遇到问题能够主动反馈，能配合组长及相关部门推进问题处理；具备基础数据意识，能看懂点击、安装、活跃、充值、内容更新量等基础运营数据，并能根据数据变化发现简单问题；能适应多项目、多任务并行的工作节奏，具备较好的稳定性和团队配合意识。\"", "cat": "运营与市场"}, {"id": "172", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "\"\n1.大专及以上学历，3年以上实际运营经验，能独立策划和执行活动，具备较强的数据分析能力\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求\n\"\"岗位职责\n1.负责APP日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\"", "cat": "运营与市场"}, {"id": "173", "title": "渠道专员", "salary": "15K-25K", "location": "要求人在海外", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "运营与市场"}, {"id": "174", "title": "远程中高级运营专员", "salary": "10-15k", "location": "远程中高级运营专员", "jd": "远程中级运营专员\n\n人数：1名\n\n\n【岗位职责】\n\n- 视频资源统筹与处理： 负责视频站每日内容的生命周期管理，包括视频上架、标签分类、标题与描述优化、封面质检等；熟练使用剪映等工具，对原始视频资源进行剪辑、去重或二次包装处理。\n    \n- 帖子板块运营： 负责网站资讯板块的日常高频更新。密切追踪全网热点与“吃瓜”情报，快速产出自带流量与讨论度的图文帖子；同时针对站内核心视频，撰写逻辑清晰、引人入胜的图文剧情解说帖。\n    \n- SEO优化与AI工具应用： 熟练运用AI文本大模型辅助撰写高点击率文案，利用AI生图工具制作精美吸睛的封面。负责站内SEO的深度优化，包括但不限于关键词矩阵布局、H2/H3标签规范、图片ALT属性完善及内链网络搭建；定期拓展高质量外部链接与友情链接，提升网站整体搜索引擎权重与自然搜索流量。\n    \n- 网站健康监测与数据复盘： 每日进行网站常规巡检（如404死链排查、页面加载状态、视频播放连通性等）；熟练使用各类站长统计工具，追踪UV/PV、跳出率及用户停留时长，输出数据报告并指导内容策略调整。\n    \n- 全域内容分发： 将站内优质图文与视频内容矩阵化分发至外部平台，构建外部流量池，实现多渠道引流。\n    \n- 工作流自动化： 具备强烈的效率意识，能够梳理日常的巡检、发帖、分发等重复性工作，借助AI工具、自动化脚本或现有系统能力，将其转化为自动化操作，持续提升人效。\n\n\n【任职要求】\n\n- 学历与经验： 大专及以上学历，1-2年以上内容运营、网站运营或新媒体相关经验。有视频网站或泛娱乐资讯平台运营经验者优先。\n    \n- 深入了解SEO机制： 熟悉主流搜索引擎的收录与排名规则，有实际的白帽SEO实操经验（不仅限于内容排版，需懂内链逻辑、外链建设及基础的代码级SEO优化）。\n    \n- 网感与内容把控： 冲浪在一线的“吃瓜”达人和重度社交媒体用户，对全网热梗、八卦资讯极度敏感，能第一时间响应并产出内容；具备优秀的视觉审美，对帖子排版、封面配色有较强的判断力。\n    \n- 加分项： 熟悉或能快速上手各类自动化工具（如批量分发、监控告警），懂得如何通过非人工模拟的方式（如API接口思维）解决机械性任务者优先。", "cat": "运营与市场"}, {"id": "175", "title": "远程初级运营专员", "salary": "8-12k", "location": "远程初级运营专员", "jd": "远程初级运营8-12k\n\n人数：3\n\n岗位职责\n\n1. 内容管理与优化：\n\n内容筛选： 负责视频资源的采集、筛选与审核，确保视频画质高清、分类准确（标签化管理）。\n\n文案撰写： 为视频撰写吸引人的标题和描述（SEO优化），提升搜索权重和点击率。\n\n内容排期： 策划每日/每周的推荐内容，优化首页布局，提高用户点击率。\n\n2. 流量获取与增长：\n\n渠道推广： 负责在社交媒体（Twitter/X, Telegram, Reddit, Instagram等）进行内容分发，引导流量回流。\n\nSEO/ASO优化： 研究成人关键词趋势，通过关键词优化提升搜索引擎自然排名。\n\n活动策划： 策划节日或热点相关的专题活动，提升新用户注册率。\n\n3. 用户增长与留存：\n\n社群运营： 管理用户社群/评论区，引导用户互动，收集用户对内容的需求反馈。\n\n数据分析： 监控日活(DAU)、留存率、跳出率等核心指标，分析用户观看习惯，优化内容推送逻辑。\n\n4. 竞品分析：持续追踪国内外主流AV站点的功能更新、内容趋势和营销手段，并提出改进建议。\n\n  \n\n任职要求\n\n\n1. 基本素质：\n\n心态开放： 对成人内容持开放、专业的态度，能够客观地面对并处理各类色情影像资料。\n\n审美能力： 对“好内容”有敏锐的感知力，知道什么样的封面和标题能吸引用户。\n\n2. 专业能力：\n\n运营经验： 1-3年互联网运营经验（有视频平台、社交平台或成人行业经验者优先）。\n\n工具使用： 熟练使用基础的图像/视频剪辑工具（如剪映、PR），熟练使用AI生图制作精美的封面。\n\n\nSEO基础： 了解基础的SEO逻辑，懂得如何利用关键词获取流量。\n\n3. 加分项：\n\n是资深的成人内容消费者，对各类片商、演员、流派有深入了解。\n\n熟悉Telegram Bot或自动化营销工具。\n\n有过从0到1搭建流量池的成功经验。", "cat": "运营与市场"}, {"id": "176", "title": "商务专员", "salary": "10k-30k", "location": "", "jd": "岗位职责\n1.  负责公司广告资源位（含APP、网站、盒子等各类流量渠道）的商务拓展与客户开发，通过多渠道（老客户转介绍、渠道资源、自主开发等）挖掘潜在广告主。\n2.  独立完成客户从初步接触、需求沟通、报价谈判到签约打款的全流程商务谈判，达成CPT/CPA/CPC/CPS等多种计费模式的合作。\n3.  负责存量客户的续费维护，跟进客户投放效果、及时处理客户异议，提升客户续费率与客单价。\n4.  根据公司月度/季度业绩目标，制定个人拉新、续费、冲刺及兜底方案，并按时保质完成收款指标。\n5.  根据客户投放需求，跟进广告位上下架、素材更换、位置分配等日常执行工作，与相关部门协同对接，跟进需求落地进度。\n6.  及时、准确填报客户台账、日清日报、缺口冲刺表等业务数据表格，配合团队进行业绩复盘与风险预警。\n7.  运营、产品、审计等部门协同配合，处理客户投放中的异常情况，防范合规与舆情风险。\n\n任职要求\n1.  大专及以上学历，市场营销、商务管理等相关专业优先，也接受有相关行业经验的其他专业背景。\n2.  1年以上互联网广告、流量变现、渠道销售或相关商务拓展经验，有CPT/CPA/CPC/CPS等广告计费模式从业经验者优先。\n3.  具备较强的商务谈判能力和抗压能力，能够独立完成从客户开发到签约回款的全流程闭环。\n4.  沟通表达能力强，逻辑清晰，能准确把握客户诉求并快速给出应对方案。\n5.  数据敏感度高，能够熟练使用Excel等办公软件进行业绩数据整理与分析。\n6.  责任心强、目标导向，能承受一定的业绩压力，认同\"结果导向\"的团队文化。\n7.  具备良好的职业操守，能够严格遵守公司合规要求，无违规操作记录。\n\n加分项\n•  有成熟的广告主/渠道资源，具备快速起量能力。\n•  熟悉App、网站等流量渠道的广告位商务合作，了解广告主的谈判逻辑与合作模式者优先。", "cat": "运营与市场"}, {"id": "177", "title": "SEO专员", "salary": "10k-15k", "location": "", "jd": "岗位职责\n负责网站 SEO 内容运营，围绕核心业务、用户搜索需求及关键词布局制定内容策略，持续提升网站自然搜索流量、关键词排名及用户转化。\n负责 SEO 内容生产与优化，包括文章、专题、分类页、聚合页等内容的策划、撰写、编辑及审核，优化 Title、Description、H 标签、正文结构、内链等页面 SEO 要素。\n负责关键词及搜索需求挖掘，结合 Google 及行业平台分析用户搜索意图，建立关键词库，并根据搜索量、竞争度、相关性及转化价值制定内容生产计划。\n负责网站内容结构优化，定期分析网站分类、标签、专题及内容页面表现，优化栏目架构、内容聚合及内链策略，提升页面收录效率与站内权重传递。\n负责网站外链建设与发布，能够自主寻找行业相关、质量较高的外链资源，通过内容投稿、资源合作、行业网站、社区等渠道持续获取有效外链，并对外链质量及效果进行跟踪。\n持续跟踪 SEO 数据表现，通过 GA4、Google Search Console 等工具监控自然流量、关键词排名、收录、曝光、CTR、用户行为及转化数据，定期进行数据复盘并制定优化方案。\n关注行业趋势及热点内容，快速挖掘具有搜索增长潜力的话题和关键词，结合热点生命周期及时产出内容，获取趋势搜索流量。\n协同产品及技术团队推进 SEO 优化，根据数据及用户搜索行为发现网站问题和增长机会，推动页面模板、站点结构、用户体验及相关功能持续优化。\n负责竞品 SEO 分析，持续跟踪竞品关键词布局、流量页面、内容策略、网站结构及外链情况，分析竞品优质外链来源，挖掘可复制的外链及内容增长机会。\n探索 AI + SEO 内容生产工作流，利用 AI、自动化工具提升关键词研究、内容策划、内容生产、优化及数据分析效率。", "cat": "运营与市场"}, {"id": "178", "title": "内容运营（动漫 / 二次元方向）", "salary": "8-12k", "location": "", "jd": "岗位职责\n\n1、**内容库管理与上架运营**\n负责平台里番、漫剧、H漫等内容的上架管理，包括内容排期、元数据维护（标题、简介、标签、分类）、封面与物料把控；建立并持续优化内容标签体系，保障片库结构清晰，对站内检索、内容推荐及用户浏览友好。\n\n2、**内容编排与运营位管理**\n负责首页、频道页、分类页、专题页等核心流量场的内容编排，策划片单、专题、榜单等运营栏目；结合播放数据、用户偏好及热点动态调整推荐位，提高优质内容曝光效率、点击率及播放转化。\n\n3、**内容排播与节奏运营**\n制定新内容上线节奏及更新排播计划，包括定档、预告、上线、连载更新、完结等内容运营节奏；配合重点内容进行站内宣发及资源位配置，放大头部内容的拉新、活跃及留存价值。\n\n4、**播放数据分析**\n持续跟踪播放量、点击率、完播率、人均观看时长、内容拉新及留存贡献等核心指标，定期进行内容消费数据复盘；通过数据识别高潜题材、热门标签及用户内容偏好，并转化为选片、编排及推荐调整策略。\n\n5、**内容引入支持**\n参与内容评估及引入建议，包括题材热度、目标用户匹配度、内容质量、同类型内容历史表现等；协助对接内容方、制作方或版权方，完成内容物料交付、信息整理及上线跟进。\n\n6、**会员与活动内容运营**\n参与付费内容、会员专享内容及重点内容的运营策略制定，结合新番季、节假日、热点事件及平台活动完成内容侧策划与落地，提升会员内容消费及付费转化。\n\n---\n\n## 任职要求\n\n1、本科及以上学历，3年以上视频平台内容运营经验；有二次元平台、动漫平台、漫剧平台内容运营经验者优先。\n\n2、**必须对成人向动漫、里番、同人本子等内容有长期兴趣和较深了解，里番爱好者或本子爱好者优先作为核心筛选条件。** 能够接受长期接触、筛选、整理及运营相关内容。\n\n3、熟悉里番、成人动漫、同人本子等内容的常见题材、标签体系、画风及用户偏好，能够快速判断一部内容的核心卖点、受众及运营价值。\n\n4、对漫剧、动漫内容具备较强判断力，熟悉主流内容品类及题材趋势，能够判断什么内容具备流量潜力，在选片、推荐及内容编排方面有自己的方法论。\n\n5、熟悉内容运营全链路，包括排期上架、元数据管理、标签分类、运营位编排、专题策划等，至少独立负责过其中两个核心环节。\n\n6、具备较强的数据敏感度，能够看懂内容播放漏斗，独立完成内容消费数据复盘，并根据数据提出具体的选片、推荐位及内容编排调整动作。\n\n7、具备基本的文案及审美能力，能够独立完成专题标题、内容简介、推荐语、标签及封面物料把控。\n\n8、对成人二次元内容具有较强的内容敏感度，了解不同题材、标签及用户搜索习惯，对近期热门作品、热门题材和用户口味变化保持持续关注。\n\n---\n\n## 加分项\n\n1、有成人动漫、里番、本子、二次元垂类网站或相关内容平台实际运营经验；\n\n2、有内容采买评估、版权方或内容制作方对接经验；\n\n3、有会员付费内容、单片付费、内容解锁或类似商业化运营经验；\n\n4、熟悉推荐系统基本逻辑，有根据用户行为数据优化内容推荐或与算法团队协作的经验；\n\n5、熟练使用 AI 工具提升内容运营效率，例如批量整理元数据、标签生成、简介生成、封面初筛及内容分类等。\n\n---\n\n## 投递要求\n\n投递时请附：\n\n* 1–2 个本人实际操盘过的专题、内容编排或排播案例，可附截图及数据说明；\n* 简单说明自己平时关注的里番 / 本子题材、偏好类型或常用内容平台，用于判断对成人二次元内容领域的实际熟悉程度。\n\n本岗位会长期接触成人向动漫及相关内容，无法接受相关内容或对该领域完全不了解者不建议投递。", "cat": "内容与创作"}, {"id": "179", "title": "AI短剧制作", "salary": "10-25k", "location": "", "jd": "1.负责AI短剧选题策划与剧本创作，把控故事节奏、人设和情感钩子，确保内容符合平台调性及用户偏好；\n2.运用AI视频生成工具完成分镜设计与画面生成，保证画面质量、角色一致性和叙事连贯性；\n3.独立完成短剧的剪辑、配音配乐、特效包装及成片输出，把控成片节奏和情绪表达；\n4.跟踪AI视频生成、语音合成、图像处理等相关工具及模型的更新迭代，持续优化制作流程，提升出片效率与质量；\n5.关注短剧行业内容趋势及爆款案例，结合数据反馈迭代选题方向和制作手法；\n6.配合项目排期，独立或协同完成从选题到成片的全流程产出，对内容质量和产出效率负责。\n任职要求\n1.大专及以上学历，影视、传媒、编导、新媒体等相关专业优先；\n2.1年以上短视频/短剧内容制作经验，有AI短剧视频制作经验者优先；\n3.熟练使用至少一种AI视频生成工具及Pr、剪映等剪辑软件；\n4.具备较强的故事策划与文案能力，能独立完成剧本创作或改编；\n5.对AI内容生成工具敏感度高，学习能力强，能快速掌握新工具新玩法；\n6.责任心强，能承受一定的产出节奏和排期压力，具备良好的时间管理能力。\n加分项\n1.有短剧平台过稿或爆款作品案例；\n2.有独立账号运营或内容数据分析经验。", "cat": "内容与创作"}, {"id": "180", "title": "初级运营专员（剪辑文案方向）", "salary": "8-10k", "location": "", "jd": "1.负责相关文案撰写，包括标题、简介、推广文案及社群、自媒体发布内容；\n2.完成视频剪辑及包装工作，对素材进行剪辑、配乐、字幕、成片输出，保障内容质量与产出效率；\n3.根据内容数据反馈，优化文案角度、标题及包装形式，提升内容点击及转化效果；\n4.配合团队完成临时性剪辑、文案支持工作。\n任职要求\n1.大专及以上学历，中文、新闻、传媒、影视等相关专业优先；\n2.具备基础剪辑软件操作能力（PR、剪映等），有剪辑作品或实习经验优先；\n3.文字表达能力强，能独立完成标题、简介、推广文案等内容创作；\n4.对短剧、短视频内容形式敏感，有一定内容审美和节奏把控能力；\n5.工作细致、执行力强，能适应一定的产出节奏。", "cat": "内容与创作"}, {"id": "181", "title": "初级运营专员（内容运营方向）", "salary": "8-10k", "location": "", "jd": "1.负责网站/平台日常内容运营管理，包括内容更新、资源发布、分类维护及页面巡检，保障平台稳定运营；\n2.跟踪热点及行业动态，结合用户兴趣完成内容选题策划与排期，完成图文、短视频脚本、推文等内容的撰写与编辑；\n3.对接设计、剪辑等协作方，推动内容按时上线，持续提升内容质量和用户体验；\n4.负责站外推广工作，包括TG频道发布、外链建设、自媒体内容发布等，提升平台曝光及用户增长；\n5.根据阅读量、完读率、互动率、转化率等数据，持续优化标题、关键词、推荐位及内容结构，提高用户活跃度和转化效果；\n6.负责日常巡检，检查页面展示、视频播放、广告位、链接跳转等功能，发现异常及时反馈跟进；\n7.配合团队完成运营活动策划、项目推进及其他临时性工作。\n任职要求\n1.大专及以上学历，专业不限，新媒体、传媒相关专业优先；\n2.具备基本的文字功底和选题敏感度，能独立完成图文/脚本类内容撰写；\n3.熟悉常见内容发布及自媒体平台操作，学习能力强；\n4.工作细致耐心，责任心强，能适应日常巡检类重复性工作；\n5.有内容运营、新媒体运营相关实习或工作经验者优先。", "cat": "内容与创作"}, {"id": "182", "title": "渠道专员", "salary": "15-25k", "location": "", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "运营与市场"}, {"id": "183", "title": "AI 应用 Golang 后端工程师", "salary": "20k-30k", "location": "沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。", "jd": "一、招聘要求\n\n【硬性要求】\n\n学历/经验：本科及以上学历，5 年以上后端开发经验，计算机相关专业优先。\n\n主力语言：Golang 为主（精通）；PHP 能读能改（能维护存量业务、参与迁移）。\n\nAI 开发（核心）：有大模型（LLM）应用落地经验，包括接入 OpenAI / Claude 等大模型 API、\nPrompt 工程、RAG（向量检索问答）、Function Calling / Agent 编排、流式输出（SSE）。\n能把模型能力工程化成稳定、可控成本的线上服务。\n\n框架能力：熟悉 Gin / Go-Zero / Kratos 等 Go 框架，理解框架设计原理；\nPHP 侧了解 Laravel / ThinkPHP。\n\n数据库：精通 MySQL（表设计、索引优化、SQL 调优）；熟练 Redis（缓存 / 分布式锁 / 限流）；\n熟悉 Elasticsearch（索引设计、检索调优，向量检索加分）。\n\n容器与编排：熟练 Docker；有生产级 Kubernetes（k8s）使用经验；了解 k3s（轻量 / 边缘集群）加分。\n\n架构能力：熟悉微服务架构、分布式系统设计，有高并发项目实战经验。\n\n工具链：熟练使用 Git、Linux 环境，熟悉 CI/CD 流程。\n\n质量意识：具备良好的代码规范意识，熟悉单元测试、接口测试。\n\n沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。\n\n【加分项】\n- 有向量数据库经验（Milvus / Qdrant / pgvector / ES kNN）\n- 熟悉 LLMOps / 模型推理服务部署（vLLM、Ollama、Triton）\n- 有消息队列 / 大数据管道经验（Kafka 等）\n- 有开源贡献或技术博客", "cat": "技术开发"}, {"id": "184", "title": "产品专员", "salary": "15-30k", "location": "", "jd": "产品专员：\n\n岗位职责：\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等传统原型工具，同时能够借助 AI 工具提升原型设计效率，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4、从需求洞察 → 产品设计 →AI工具辅助提效 →推动上线 → 数据迭代，负责完整闭环\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n7、具备产品拆解能力，能快速分析竞品并输出结构化结论（功能、路径、商业模式）\n\n任职要求：\n1、3年以上产品经理经验，至少完整做过1个0-1项目\n2、能独立完成高质量原型设计（熟练使用Axure），同时具备使用 AI 设计工具辅助原型产出的实际经验，例如通过 AI 生产可交互的原型设计，显著提升出图效率。\n3、具备较强的结构化思维与复杂问题拆解能力\n4、有跨团队推动能力，能把事情真正落地\n5、有较强执行力和抗压能力，能处理需求冲突与优先级判断，独自推进项目落地\n6、具备较强的owner意识，对结果负责\n7、在日常工作中已将 AI 工具深度融入产品工作流，包括但不限于：使用 AI 辅助需求分析、竞品调研、文档撰写、原型生成、数据洞察等环节，能主动探索并落地 AI 提效手段。\n8、有团队管理经验或带人经验更佳\n\n加分项：\n1、熟练使用一种或多种 AI 原型/设计工具（如：Figma AI、Codex、Claude AI、chatgtp、grok、cursor 等），能提供使用 AI 工具生成的原型案例作为参考。\n2、有播放器 / 内容 / 消费 / 社交 / 咨询等行业经验\n3、做过增长、商业化相关项目\n4、有技术背景或设计背景\n\n注意：\n1、需要看axure历史原型设计案例，准备自认为最好的1-2套即可，若没有直接pass\n2、使用 AI 设计工具辅助生成的原型案例，说明使用了哪些 AI 工具提升工作效率", "cat": "其他"}, {"id": "185", "title": "AI短剧制作", "salary": "10-25k", "location": "", "jd": "1.负责AI短剧选题策划与剧本创作，把控故事节奏、人设和情感钩子，确保内容符合平台调性及用户偏好；\n2.运用AI视频生成工具完成分镜设计与画面生成，保证画面质量、角色一致性和叙事连贯性；\n3.独立完成短剧的剪辑、配音配乐、特效包装及成片输出，把控成片节奏和情绪表达；\n4.跟踪AI视频生成、语音合成、图像处理等相关工具及模型的更新迭代，持续优化制作流程，提升出片效率与质量；\n5.关注短剧行业内容趋势及爆款案例，结合数据反馈迭代选题方向和制作手法；\n6.配合项目排期，独立或协同完成从选题到成片的全流程产出，对内容质量和产出效率负责。\n任职要求\n1.大专及以上学历，影视、传媒、编导、新媒体等相关专业优先；\n2.1年以上短视频/短剧内容制作经验，有AI短剧视频制作经验者优先；\n3.熟练使用至少一种AI视频生成工具及Pr、剪映等剪辑软件；\n4.具备较强的故事策划与文案能力，能独立完成剧本创作或改编；\n5.对AI内容生成工具敏感度高，学习能力强，能快速掌握新工具新玩法；\n6.责任心强，能承受一定的产出节奏和排期压力，具备良好的时间管理能力。\n加分项\n1.有短剧平台过稿或爆款作品案例；\n2.有独立账号运营或内容数据分析经验。", "cat": "内容与创作"}, {"id": "186", "title": "AI产品运营", "salary": "15k-20k", "location": "", "jd": "# AI产品运营\n\n招聘人数：1人\n方向：AI内容创作 / AI视频 / AI工作流平台\n\n## 岗位职责\n\n1. 负责AI创作平台的产品运营，包括用户需求收集、功能体验优化、运营策略制定及数据跟踪。\n2. 深度体验AI图片、AI视频、无限画布、工作流等核心功能，结合用户实际创作场景提出产品优化建议。\n3. 负责AI模型及功能的运营包装，包括模型测试、效果对比、使用场景设计、模板/案例搭建及教程输出。\n4. 跟踪用户从注册、体验、生成到付费的完整链路，通过数据分析持续优化激活率、留存率、付费转化率及用户使用频次。\n5. 关注AI创作行业及竞品动态，定期分析即梦、小云雀、LibTV等同类产品的功能、模型、工作流、会员体系及运营策略。\n6. 协同产品、研发、设计及AI内容团队推进功能上线，并负责上线后的用户反馈收集、数据复盘及持续迭代。\n7. 结合AI短剧、AI漫剧、短视频等创作场景，探索模板、工作流、素材库等内容生态建设。\n\n## 任职要求\n\n1. 有即梦、小云雀、LibTV等AI创作平台深度使用或相关从业经验优先。\n2. 熟悉主流AI图片、AI视频生成工具及模型，对文生图、图生视频、角色一致性、分镜、工作流等有实际使用经验。\n3. 对AI创作产品有较强理解，能够从“创作者真实使用场景”出发发现问题，而不仅是做活动、写文案。\n4. 具备基础产品思维和数据分析能力，能够根据用户行为、留存、付费等数据提出优化方案。\n5. 对AI行业保持高敏感度，愿意持续体验和研究新的模型、工具及创作方式。\n6. 有AI短剧、AI漫剧、AI视频制作或无限画布/节点工作流产品经验者优先。", "cat": "运营与市场"}, {"id": "187", "title": "comfyui内容工程师", "salary": "13–18K", "location": "", "jd": "任职要求\n1.熟练使用 ComfyUI（不是只用过）\n2.对Stable Diffusion 有较深理解\n3.模型经验（硬性要求懂LTX.WAN）\n4.自动化能力（会用 Python / Node.js 做简单自动化能调用 ComfyUI API/有批量生成经验）\n5.熟练使用ai工具，定期输出原创定制内容\n 岗位职责\n1.基于 ComfyUI 搭建稳定的生成工作流\n2.实现以下内容的批量生产：\nAI图片（人物 / 场景 / 反差 / fetish等风格）\nAI短视频（图生视频 / 连贯帧生成）\nAI换脸 / 风格迁移 / 去衣等模型应用（合规范围内）\n3.搭建 ComfyUI 节点流：\n文生图 / 图生图 / ControlNet / LoRA加载\n设计可复用模板\n4.内容质量与一致性控制\n解决人物脸崩、结构异常、风格漂移问题\n建立内容质量评分机制（可规则 / AI辅助）\n提高生成成功率 & 可用率（不是只出图，是可用图）\n前沿能力探索（加分项）\n1.视频生成（AnimateDiff / SVD 等），AI换脸 / 人物一致性（IP角色）\n多模态内容（图 → 视频 → 剧情）\n2.有成人内容生成经验\n3.会训练：LoRA / DreamBooth有GPU部署经验：本地 / 云GPU（如RunPod、Lambda等）\n4.部署过agent，玩过openclew", "cat": "内容与创作"}, {"id": "188", "title": "AI产品经理", "salary": "20-40k", "location": "", "jd": "AI 产品经理 / AI Product Builder \n\n一、任职要求\n1. 必须有 AI Builder 作品(硬门槛,见下)\n2. 1-3 年产品经理经验,有 AI 方向项目经历(实习 / 在校 / Hackathon / 个人作品均认可)\n3. 产品判断力——能讲清作品的目标用户、核心痛点、设计取舍、效果验证。\n4. 技术背景:理工科或等效自学能力;能读 Python / JS / TS;SQL 必备,Python 数据分析优先;能直接读英文 API 文档。\n5. 熟悉至少一个大模型 API,理解 Prompt、RAG、Tool Calling / Function Calling、Agent 等基础概念。\n6. 至少参与过一个完整产品周期,有真实数据可复盘。\n7. 能跟算法、工程建立技术信任,能在一周内把一个清晰问题推进到可演示 demo。\n\n二、加分项\n1. AI 重度付费用户(强信号)：ChatGPT Plus / Claude Pro 连续 6 个月以上,或月付 $100+ 的高阶订阅(Claude Max / ChatGPT Pro 等),或自费 API 月均 $50+。\n2.国际化背景：海外留学,或长期英文工作 / 学习环境(2 年以上),能直接读论文与一线英文讨论。\n3.更强的技术背景：工程师 / 算法 / 数据科学家转岗 PM;GitHub 有持续项目;独立跑过 RAG / Fine-tuning / Agent;熟悉 MCP、LangSmith 等工具链。\n4.其他加分:Agent 产品经验、AI 评测与监控经验、出海或垂直行业 AI 落地经验、技术 Blog 或行业分享。\n\n三、AI Builder 作品门槛\n1. 面试演示至少 1 个本人主导完成的作品,需同时满足:\n    a.真实可访问链接(Vercel / Cloudflare / 自建),不接受截图或 Figma\n    b.调过大模型 API,能解释代码结构、能现场改代码跑通\n    c.解决了一个具体问题(非 Hello World)\n    d.能讲清产品逻辑——为谁做、为什么这样做、怎么验证\n2. 工具不限:Cursor / Claude Code / Lovable /CodeX等。强加分:有真实用户(哪怕 10 个),或在 GitHub / X / 即刻 / 小红书 有过自然传播。", "cat": "产品与管理"}, {"id": "189", "title": "AI测试工程师", "salary": "15-25k", "location": "", "jd": "一、岗位职责\n\n1.负责 Web、App、管理后台、API 的功能、回归、兼容性测试\n2.参与需求评审,基于 PRD 与接口文档输出测试计划与用例\n3.提交高质量 Bug 并推动闭环;负责上线前回归与线上问题复盘\n4.编写并维护接口自动化脚本,提升核心链路回归效率\n5.根据项目需要参与 UI 自动化或性能测试\n6.从 0 到 1 搭建 AI 测试工作流——覆盖 Prompt 管理、评测流程、Bad Case 闭环、版本回归机制,形成可复用 SOP 与文档\n7.负责 AI 产品的质量测试,覆盖对话、Agent、AIGC、数字人等场景\n8.建立并维护 Bad Case 库(幻觉、答非所问、风格漂移、安全边界等)\n9.参与 Prompt 版本回归 与 A/B 测试,输出测试报告与改进建议\n\n二、任职要求\n\n1.本科及以上,3 年以上软件测试经验,熟悉 Web / App / API 测试全流程\n2.熟悉接口测试工具(Postman / Apifox)与抓包工具(Charles / Fiddler)\n3.熟悉至少一种自动化框架:Pytest / Selenium / Playwright / Appium / JMeter\n4.熟悉 Git 与 Jira / 禅道 / Tapd 等协作工具\n5.具备从 0 到 1 搭建测试流程 / 规范的意识和能力,能独立梳理 SOP,而不是只执行别人定的流程\n6.对 AI 产品有真实兴趣并有动手经验——用过 ChatGPT / Claude / 豆包 / Coze 等,自己写过 Prompt 或做过小项目\n沟通清晰、执行力强,能跨产品 / 研发 / 算法推动问题闭环\n\n三、加分项\n\n1.有 AI 产品(对话、AIGC、Agent、数字人)测试经验\n2.有 Prompt 回归、Bad Case 分析、模型输出评测经验\n3.有从 0 到 1 搭建过测试体系 / 测试平台 / 质量流程的经历\n4.用过 Promptfoo / LangSmith / Langfuse 等 AI 测试工具\n5.了解 RAG、Function Calling、Agent Workflow 等概念\n6.大厂或成熟互联网公司 QA 经历\n7.英文阅读流畅,可直接看 OpenAI / Anthropic 文档", "cat": "技术开发"}, {"id": "190", "title": "高级ai剪辑", "salary": "13-18k", "location": "", "jd": "岗位职责：\n1.精通市场上各类剪辑软件，独立输出项目\n2.至少熟悉并使用市场上3款成人ai软件\n3.有搭建AI远程AI服务器的能力优先\n4.有作品（硬性要求）：最少3部原创ai成人作品5分钟以上，或者懂ai漫剧有成功制作成人漫剧经验）\"\n\n任职要求\n1.熟练使用 ComfyUI（不是只用过）\n2.对Stable Diffusion 有较深理解\n3.模型经验（硬性要求懂LTX.WAN）\n4.自动化能力（会用 Python / Node.js 做简单自动化能调用 ComfyUI API/有批量生成经验）\n5.熟练使用ai工具，定期输出原创定制内容\n 岗位职责\n\n1.基于 ComfyUI 搭建稳定的生成工作流\n\n2.实现以下内容的批量生产：\nAI图片（人物 / 场景 / 反差 / fetish等风格）\nAI短视频（图生视频 / 连贯帧生成）\nAI换脸 / 风格迁移 / 去衣等模型应用（合规范围内）\n\n3.搭建 ComfyUI 节点流：\n文生图 / 图生图 / ControlNet / LoRA加载\n设计可复用模板\n\n4.内容质量与一致性控制\n解决人物脸崩、结构异常、风格漂移问题\n建立内容质量评分机制（可规则 / AI辅助）\n提高生成成功率 & 可用率（不是只出图，是可用图）\n\n\n前沿能力探索（加分项）\n\n1.视频生成（AnimateDiff / SVD 等），AI换脸 / 人物一致性（IP角色）\n多模态内容（图 → 视频 → 剧情）\n\n2.有成人内容生成经验\n\n3.会训练：LoRA / DreamBooth有GPU部署经验：本地 / 云GPU（如RunPod、Lambda等）\n\n4.部署过agent，玩过openclew", "cat": "内容与创作"}, {"id": "191", "title": "中级运营（流量增长）", "salary": "9K+提成", "location": "", "jd": "岗位职责\n1.负责网站产品的友链互换：寻找合适的友链资源，评估对方网站的质量、相关性和健康度。\n2.通过 Telegram、邮件等方式主动联系站长，洽谈并促成友链交换。\n3.使用公司后台添加和管理友链、广告位（操作简单，入职提供培训）。\n4.维护友链健康度：定期检查对方是否撤链、链接是否有效、是否存在掉权或风险站点。\n5.配合开展灰度引流，通过多渠道为网站产品稳定导入流量。\n6.记录友链与引流数据，定期整理来源、数量、转化情况并复盘优化。\n任职要求\n1.有网站运营、简单SEO了解 或外链建设基础，理解友链、反链对网站权重和收录的作用。\n2.有灰度引流经验（硬性要求）。\n3.熟悉 Telegram、邮件等沟通工具，沟通主动、执行力强、不怕被拒。\n4.做事细心，能记录问题、整理数据并持续优化。\n5.学习能力强，能快速上手后台操作。\n加分项\n1.手上有现成的友链资源或站长人脉。\n2.做过泛娱乐、成人或灰色类网站的引流与外链。\n3.懂基础 SEO（关键词、收录、外链质量判断）。\n4.有多平台引流、投放或社群导流经验", "cat": "运营与市场"}, {"id": "192", "title": "高级后端工程师（Java/Go双栈）", "salary": "20-30k", "location": "", "jd": "高级后端开发工程师（Java/Go双栈）\n岗位职责\n1、负责核心后端服务的设计、开发、优化与维护。\n2、参与系统架构及技术方案设计，保障系统稳定性和可扩展性。\n3、负责业务接口、服务模块及数据处理流程开发。\n4、参与数据库设计、服务治理、性能优化和异常排查。\n5、协同产品、前端、测试及运维团队推动需求落地。\n6、推进研发规范、代码质量及AI辅助研发流程建设。\n任职要求\n1、本科及以上学历，5年以上后端研发经验。\n2、精通Java，熟悉JVM、JUC、Spring Boot、Spring Cloud、MyBatis-Plus及Dubbo。\n3、熟练掌握Go，理解goroutine、channel、GC及并发机制，具备生产项目经验。\n4、熟悉Gin、gRPC、Protobuf、go-zero或Kratos等Go技术框架。\n5、熟悉MySQL、Redis、Kafka或RabbitMQ等常用中间件。\n6、熟悉微服务、数据库建模、接口设计、性能优化及系统治理。\n7、能够独立承担核心模块开发，具备良好的沟通协作能力。\n8必须熟练使用Claude Code、Cursor、Codex等AI编程工具进行日常研发。\n加分项\n*熟悉JavaScript、TypeScript、Vue 3或React，具备前端开发能力。\n*有Java与Go技术栈迁移经验。\n*有AI Agent、RAG或大模型应用经验。\n*有高并发、分布式系统项目经验。\n*熟悉Docker、Kubernetes及DevOps。", "cat": "技术开发"}, {"id": "193", "title": "流量运营（增长方向）", "salary": "15-18K", "location": "", "jd": "1,必须要有从0-1的起量经验（只有优化经验的不要）\n2.必须要有明确运营数据（SEO / 投放 / 联盟 / 社区 / 站群）对应结果\n3.着重勘查是否有低成本获客经验（免费流量/自然流量/低成本投放）\n4.行业匹配优先级（成人 / 灰产 / 边缘行业/海外流量项目工具站 / 内容站优先）\n5.“野路子”能力：简历内有组合流量增长或非常规渠道合并能力者优先\n\n任职要求：\n\n1.2年以上流量运营/增长经验，必须具备从0到1冷启动经验（核心要求）\n2.熟悉主流流量获取渠道，至少精通2种以上，并有实际结果(SEO/信息流投放/联盟/CPS/渠道分发/社区/论坛/内容分发/站群/外链体系）\n3.具备独立获客能力：有低成本引流经验，能在预算有限情况下完成起量\n4.熟悉完整流量转化链路（曝光→点击→注册→转化），具备转化优化经验\n5.具备数据分析能力：可独立拆解流量来源、用户路径、转化漏斗，并持续优化ROI\n6.有成人行业或灰度行业经验优先，了解相关流量生态与玩法\n必须具备实际流量增长案例（需提供数据：UV、转化、渠道占比等）\n\n岗位职责：\n\n1.负责网站从0起步的流量搭建，制定并执行冷启动引流方案\n2.从0获取首批种子用户，完成基础流量池搭建\n3.拓展并维护多渠道流量来源（SEO / 联盟 / 社区 / 渠道分发等）\n4.制定阶段性增长策略，对流量结果负责（UV、注册量、转化率）\n5.搭建并优化流量转化路径，提升整体转化效率\n6.持续降低获客成本（CAC），提升投入产出比\n7.建立流量数据监控体系，每周输出分析报告并进行策略迭代\n8.持续测试新渠道、新玩法，推动流量规模化增长\n\n前沿能力探索（加分项）：\n\n1. 有AI辅助流量运营经验（ChatGPT辅助文案、SEO优化等）\n2. 熟悉海外流量渠道（TikTok、Pinterest、Googleads等）\n3. 有灰度流量获取经验\n4. 具备Private蟹道流量优化案例\n5. 有工具化/自动化流量运营经验", "cat": "运营与市场"}, {"id": "194", "title": "AI设计师/ UI", "salary": "20-40k", "location": "", "jd": "AI设计师/ AI designer\n我们要找的是一位审美强、懂 AI 产品、理解全球 AI 模型变化、能快速做出可运行原型，并且有耐心把细节打磨到位的 AI 产品体验设计师。\n你需要参与 Web、App、Agent 工作流和 AI 原生产品的体验设计，和产品、工程一起探索：当 AI 不再只是一个聊天框，而是能生成、理解、执行和协作时，用户应该如何与它交互。\n\n⸻\n\n你需要负责\n\n1.负责 Web / App / 后台 / Agent 工作流等 AI 产品体验设计。\n2.从 PRD 中识别模糊需求，补全页面结构、交互路径和关键状态。\n3.设计 AI 产品特有体验：对话、流式输出、生成失败、重新生成、结果编辑、版本回退、用户确认、Agent 步骤可视化等。\n4.关注 Claude、GPT、Gemini、Kimi、豆包、DeepSeek 等全球主流模型能力变化，并把模型新能力转化为产品体验机会。\n5.用 Lovable、Figma Make、Cursor、Claude Code 等工具快速产出可点击、可演示、可迭代的 Web/App 原型。\n6.与 PM 和工程师协作，用原型、设计判断和产品逻辑推动方案落地。\n7.对设计细节有耐心，能持续打磨产品细节，直到达到可交付标准。\n\n⸻\n\n我们希望你具备\n\n1.1-3 年 UI / UX / 产品设计经验，作品强可放宽。\n2.有 Web、App、SaaS、AI 产品、工具产品或后台系统设计经验。\n3.审美扎实，能做出高级、克制、清晰、可信的产品界面。\n4.理解 AI 产品和普通 SaaS 产品的区别。\n5.关注全球 AI 产品和模型能力变化\n熟悉至少一种 AI 原型或 AI 编码工具\n不抗拒代码，能理解基础 HTML /CSS / React / Tailwind 更好。\n6.有强执行力，能把模糊需求快速推进到可演示、可评审、可迭代的结果\n有耐心和细节意识，不只做首屏效果图，也愿意反复打磨状态、流程、边界和交互体验。\n7.能讲清每一个设计决策背后的用户问题、产品逻辑和交互取舍。\n\n⸻\n\n作品要求\n\n面试请准备至少 1 个本人主导作品：\n\n有真实可访问链接，优先 Web/App 原型\na.不接受只有截图、纯 Figma 静态稿或纯视觉海报\nb.能讲清用户问题、设计目标、核心路径和关键设计决策\nc.最好包含 AI 原生交互，例如对话、Agent 步骤、流式输出、生成结果编辑、结果回退、模型失败处理等。\n\n⸻\n\n加分项\n\n1.熟悉 Claude / GPT /
