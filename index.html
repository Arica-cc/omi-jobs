遇到的效率或一致性痛点反馈给研发团队，协助提炼标准化 Prompt 模板及迭代内部 Workflow。\n\n**投递说明**：请附上个人作品集。导演岗请附上代表作片段或过往分镜头脚本；AIGC 视频生成专员请附上个人剪辑、摄像作品或 AI 影视生成 Demo。\"", "cat": "内容与创作"}, {"id": "5", "title": "AIGC 视频导演", "salary": "12K-22K", "location": "远程\n- 工作地点：[城市占位]　｜　公司：[公司名占位]", "jd": "高级 AIGC 创作岗（Senior AIGC Creator）｜创意负责人储备\n\n【团队定位】\n我们是一支专注 AI 影视内容生产的创意团队，用工业化的 AIGC 工作流批量产出 AI 短剧、AI 电影与短片。从「导演讲戏 → 美术定妆与角色设定 → 分镜落镜（提示词工程）→ 声音设计 → 视频生成 → take 筛选 → 剪辑合成 → 交付」全链路打通。\n\n这个岗位的核心不是「执行别人定好的画面」，而是定义画面该长什么样，并保证整片不跑偏。往上一步，就是组长 / 创意负责人。\n\n【岗位职责】\n- 创意与视觉定调：定义单个项目（短剧 / 电影 / 短片）的创意方向、镜头语言与整体视觉基线，对成片质量负最终责任。\n- 分镜与镜头设计：将剧本 / 脚本拆解为可执行的分镜与镜头表，主导关键镜头的提示词设计，确保镜头语言服务于叙事与商业目标。\n- 跨镜头 / 跨集一致性把控：对角色、场景、光线、风格在整片乃至整季的视觉一致性负责，建立并维护角色设定、参考图与资产锁定机制。\n- 质量终审：对 take 筛选与剪辑成片做最终把关，定义「能交付 / 要重做」的标准。\n- 规范制定：制定并维护团队的提示词工程规范、资产命名与管理规范、工作流 SOP，把个人经验沉淀为团队可复用的方法。\n- 指导与带人：指导 4–7 名基础执行岗，做日常派活、产出审核、技术辅导与成长培养。\n- 效率与成本：在质量达标前提下优化出片效率与生成成本，对单片工时与算力消耗有量化意识。\n- 工具迭代与内容合规：持续跟踪 AI 视频 / 图像 / 后期工具的版本与能力边界，引入更优工作流；确保产出符合平台与监管的内容安全规范。\n\n【任职要求】\n\n硬门槛（以下两条满足其一即可，且均需可验证）\n1. 行业经验路线：具备 2 年以上 动画 / 影视 / TVC 广告 内容制作经验，且有可署名的完整项目 credit（分镜 / 导演 / 美术 / 后期任一核心环节），需提供片名、平台与本人承担环节。\n2. AI 影像赛事路线：即使没有传统行业经验，但参加过 AI 电影节并进入过主竞赛单元（或在同等量级 AI 影像节展 / 赛事中获入围及以上认可），需提供电影节 / 赛事名称、入围或参赛届次、作品链接与可查证明。\n\n通用硬门槛（无论走①或②，均须满足）\n- 提交个人作品集 / showreel：至少 2 条完整 AI 影像作品，注明所用工具与本人负责环节。无作品集无法进入评估。\n- 通过实操试岗：现场完成一段「分镜落镜 + 提示词迭代」。经验与获奖决定面不面，作品与试岗决定要不要。\n\n软要求\n- 扎实的视听语言基础：懂分镜、景别、运镜、调度、节奏与剪辑逻辑，能讲清楚「这个镜头为什么这么拍」。\n- 熟练驾驭主流 AI 视频生成工具，精通其一并了解各家差异：Seedance 2.0、即梦、可灵（Kling）、Runway、Vidu 等。\n- 熟练使用 AI 图像工具完成角色设定与关键帧：Midjourney、Nano Banana、Seedream、Stable Diffusion / ComfyUI 等。\n- 成体系的提示词工程能力：角色锁定、跨镜头一致性控制、风格统一与参数化复用，而非靠运气抽卡。\n- 掌握后期剪辑与合成：剪映 / Premiere / DaVinci Resolve / After Effects 熟练其一，能完成 take 筛选到成片的闭环。\n\n【加分项】\n- 有完整 AI 短剧 / AI 电影从 0 到交付的主导经验。\n- 有声音设计、配乐或 AI 配音（如 ElevenLabs）的实操能力。\n- 熟悉 ComfyUI 工作流搭建、LoRA 训练或自定义节点。\n- 带过人或牵头过小团队产出，有把流程标准化、可复制的经验。\n- 在 AI 影视 / 短片领域有公开作品、获奖或一定影响力。\n\n【我们提供】\n- 薪资：18K–24K，具体以面试评定及实操结果为准。具备独立带组交付能力，或有获奖代表作者，薪资可一事一议。\n- 年终奖：按公司经营情况与个人绩效发放。\n- 明确的成长通道：本岗按组长 / 创意负责人储备培养，路径清晰、不画饼。\n- 公司提供全套 AI 生产工具账号与算力资源，不让你自费会员。\n- 工作地点：[城市占位]　｜　公司：[公司名占位]\n\n【成长路径】\n高级 AIGC 创作岗 → 创意组长 / 创意负责人 → 创意总监\n\n投递请附：个人作品集 / showreel + 硬门槛证明材料。任职期间使用公司资源、为公司项目产出的 AI 作品及提示词资产，知识产权归公司所有。", "cat": "内容与创作"}, {"id": "6", "title": "AIGC 视频生成师", "salary": "12K-22K", "location": "远程\n- 工作地点：[城市占位]　｜　公司：[公司名占位]", "jd": "基础 AIGC 影像创作岗（执行）｜带成长通道，定向通往高级创作岗\n\n【团队定位】\n我们是一支工业化运作的 AI 影视内容生产团队，主做 AI 短剧，用 AIGC 工具批量出片。这不是「试试 AI 能不能拍片」的实验室，而是有完整流水线的出片体系，每个环节专人专责，跨镜头、跨集的视觉一致性和出片效率是生命线。\n\n这个岗位是流水线上的执行主力。你的任务是把别人定好的镜头、风格、角色，又快又稳地变成可用的画面与片段——以高质量执行打基础，配套清晰的成长路径通向高级创作岗。\n\n【岗位职责】\n- 按分镜批量出图 / 出片：根据导演与分镜师给定的镜头表与提示词，用 Midjourney / 即梦 / Nano Banana / Seedream 等批量产出画面素材，按短剧拍摄节奏完成每个镜头需要的备选量。\n- 跑视频生成与续跑：用 Seedance 2.0 / 即梦 / 可灵等执行视频生成、首尾帧续跑、镜头延长，盯住生成队列，处理失败重跑。\n- 提示词微调与返工：在既定风格与角色设定框架内迭代提示词——景别、动作、光线、镜头不对就改了重跑，单条镜头出可用 take 直至导演验收通过，不出一版就交差。\n- take 初筛：对大量 take 做第一轮筛选，剔除崩坏、漂移、穿帮、不合分镜的废片，把可用候选整理给上一级复筛。\n- 整理角色 / 场景资产：维护角色设定图、场景参考、风格参考（sref / 锁脸图 / 色卡）资产库，保证跨集调用拿到的是对的那一版。\n- 命名与归档规范：严格按团队约定命名、分版本、归档，记录每条镜头的提示词参数与 seed，保证任何人都能快速找到对应镜头的对应版本。\n- 基础剪辑合成：用剪映 / Premiere / CapCut / DaVinci 做拼接、套底、对轨、初剪，配合后期完成合成。\n- 配合声音与后期：按声音设计和后期要求对齐、补、改素材，把链路上下游接顺。\n\n【任职要求】\n\n硬门槛（必须满足）\n- 1–2 年相关出片经验；或应届 / 转行但有拿得出手的个人作品（短片、剪辑、AI 出图出片、设计、摄影作品集均可），能提交本人 AI 作品证明。\n- 审美与镜头常识在线：看得懂景别、构图、光线，分辨得出崩坏、漂移、穿帮、廉价感，知道什么叫「这条废了」。（与「只会抽卡」的真正分界线，不满足直接 pass。）\n- 至少熟练使用一类 AI 图像工具 或 一类 AI 视频工具，上手即用，不是只看过教程。\n- 会基础剪辑：剪映 / Premiere / CapCut / DaVinci 任一能独立完成拼接、对轨、初剪。\n- 扛得住量：能接受批量、重复、需要耐心的生产工作，出片高峰期顶得住节奏。\n- 肯打磨、守规范：愿意为一个镜头反复返工，严格执行命名、版本、归档约定。\n\n软要求\n- 学习速度快：AI 工具半年一换代，你得能自己看文档、追新模型。\n- 沟通顺畅：能准确理解导演和分镜师意图，做不到的地方主动反馈。\n- 有责任心：交出去的素材自己先过一遍，不把废片当成品往上递。\n\n【加分项（有则更好，非必须）】\n- 有短视频 / 网络短剧 / 广告片的实际出片或参与经验。\n- 懂一点分镜、摄影或镜头语言。\n- 投过 AI 影展 / AI 影像比赛，或有公开发布的 AI 影像作品。\n- 熟悉提示词工程，能自己拆解和复现一种风格。\n- 有美术、设计、摄影、动画相关背景（科班加分，但非门槛）。\n\n【我们提供】\n- 薪资：10K–15K，具体以面试评定及实操结果为准。能力梯度参考：10–13K 对应能独立完成单条分镜落镜与抽卡迭代；13–15K 对应能独立交付完整短剧的画面层（落镜 + 出片 + 粗剪）。晋升高级岗即进入 18K+ 区间。\n- 年终奖：按公司经营情况与个人绩效发放。\n- 真实项目、真实出片量——你做的东西会被剪进真正交付的片子，不是练手 demo。\n- 工业化工作流和现成的提示词规范、资产体系，有方法可依。\n- 公司提供全套付费 AI 图像 / 视频工具账号与算力，不用自费会员。\n- 老带新：高级创作岗和导演带着你过片、讲为什么这个镜头不行。\n- 工作地点：[城市占位]　｜　公司：[公司名占位]\n\n【成长路径】\n基础 AIGC 影像创作岗 → 高级 AIGC 创作岗（组长 / 创意负责人储备）\n1. 稳定执行期（0–6 个月）：出图出片、take 初筛、资产归档做到又快又稳又规范。\n2. 质量进阶期（6–18 个月）：从「执行别人的镜头」到「对单条镜头质量负责」，提示词工程从微调走向独立设计单镜头解法。\n3. 创意起步期（18 个月以上）：参与分镜落镜、风格设定、跨镜头一致性把控，能带新人过片，向高级岗分水岭靠拢。\n\n走到那一步，对应的就是 18K–24K 的高级 AIGC 创作岗。\n\n投递请附简历 + 个人作品集 / 代表作（务必附作品）。任职期间使用公司资源、为公司项目产出的 AI 作品及提示词资产，知识产权归公司所有。", "cat": "内容与创作"}, {"id": "7", "title": "编剧 / 剧本策划 (Screenwriter)", "salary": "12~18k", "location": "远程", "jd": "你是整条内容流水线的叙事源头——所有导演的分\n镜拆解、视频团队的画面生成，都建立在你输出\n的剧本之上。我们需要的不是\"会写字的人\"，而\n是一个深刻理解戏剧结构、角色弧光与情绪节奏\n的叙事工程师。你将为 AI 生产管线提供高质量、\n高密度、结构化的剧本原料，直接决定最终内容\n的叙事品质上限。\n剧本创作与改编（核心职责）\n独立完成原创短剧/长篇剧本的策划与写\n作，或基于现有网文 IP / 小说素材进行影视\n化改编。\n输出的剧本需遵循标准化格式（含场景描\n述、角色行动、台词、情绪标注等结构化\n信息），确保导演和视频生成团队可直接进\n行视觉化转制。\n1.\n叙事结构与节奏把控\n精准控制\"钩子-冲突-反转-高潮\"的戏剧节\n拍，尤其对短剧/竖屏剧的前3秒钩子设计\n和每集尾部悬念有极强的把控力。\n设计并维护角色弧光、人物关系网络、世界\n观设定等叙事资产，确保长线剧集的逻辑自\n洽与情感连贯。\n2.\n跨职能协作\n与导演紧密配合，在分镜转化阶段提供叙事\n意图说明与情绪指导。\n参与成片审阅，从叙事角度判断画面节奏、\n台词落点、情绪传递是否到位。\n3.\n硬性要求：\n✅ 专业影视剧集制作经验——有网剧、短剧、\n电影、动画剧集等项目的编剧/编审从业经历，\n深刻理解\"剧本是拍给镜头看的\"这一底层逻辑。\n✅ 叙事类文学创作或编辑经验——有网络小说\n写作（签约作者优先）、出版文学编辑、或叙事\n类内容策划的实际产出与发表记录。\n✅ 极强的戏剧结构感与对白功底——能写\n出\"角色说人话\"的台词，而非 AI 味浓重的书面\n腔。\n加分项：\n⭐ 熟练使用 AI Agent 工具辅助创作——如 \nAntigravity、Claude Code、Grok Build 等 AI \n编程/写作代理，能通过 AI 工具高效完成大纲\n生成、角色设计、多版本剧本迭代等工作。\n⭐ SillyTavern / NovelAI 深度玩家——熟悉角\n色卡（Character Card）、世界书（Lorebook）、\nSystem Prompt 等配置，理解如何通过精细化\n提示词控制 AI 的叙事输出风格与角色一致性。\n⭐ 有内容的写作经验，了解不同\n平台和地区的尺度红线与合规表达技巧。\n⭐ 熟悉当前热门网文品类（系统流、反派流、\n穿书流、修仙后宫等）的叙事套路与读者爽点。\n⭐ 有海外短剧（H5 矩阵、ReelShort 等）的剧\n本写作或改编经验。\n面议（根据经验与作品，提供行业有竞争力的待\n遇）\n投递说明：请附上已发表/已制作的剧本样\n本、小说作品链接或叙事类作品集。", "cat": "内容与创作"}, {"id": "8", "title": "品牌平面设计师", "salary": "45,000-55,000 NTD", "location": "台湾本地驻场办公", "jd": "工作内容：\n -负责品牌的社群贴文图、封面、Banner 与活动主视觉设计 -设计官网、产品或其他专案相关平面视觉（版位图、专题页、活动页） -制作广告投放与导流素材，依成效数据调整设计方向 -运用 AI 生成工具产出视觉素材，并进行修图、合成与延伸设计 -维护品牌视觉规范，确保各平台视觉一致性 -主管交办事项条件要求： -工作经历：1 年以上平面设计相关经验 -熟悉 Photoshop、Illustrator（Figma 佳） -具良好的排版、配色与字体运用能力 -应征请附作品集加分条件： -具 AI 生图经验（Midjourney、Stable Diffusion、ComfyUI、Flux 等） -具 AI 修图、局部重绘、角色一致性控制经验 -具 UI 或网页视觉设计经验 -具基础动态设计能力（AE、GIF 动图）", "cat": "内容与创作"}, {"id": "9", "title": "AI内容编辑", "salary": "45000-55000 NTD", "location": "台湾本地驻场办公/远程", "jd": "岗位定位：内容量产导向，负责原创短剧的剪辑与成片包装，把握短剧节奏与情绪，稳定产出高完播成片。\n\n一、工作内容\n1.基于原创短剧素材进行剪辑、番外重组与精编改版，负责单集从粗剪到成片的完整闭环。\n2.把握短剧的情节钩子、情绪推进与情感／情欲节拍，剪出能\"留人\"的开场与卡点，提升完播与转化。\n3.按周产能目标稳定出片，配合内容库填充计划（原片直上／二剪／番外多线并行）。\n4.完成字幕、音效、配乐、调色、片头片尾等标准化包装，产出符合平台上架规范的成片。\n5.关注完播率、点击、留存等数据，依反馈迭代剪辑手法与开场策略。\n6.规范素材命名与归档，维护素材库与成片库的可追溯性。\n\n二、必要条件\n1.熟练使用 Premiere／剪映专业版／Final Cut／DaVinci 等至少一款主力剪辑工具。\n2.具短剧、竖屏短视频或影视剧集类成片剪辑经验 1 年以上，能独立完成整集。\n3.对情感／情欲向短剧题材不排斥，能接受相对大胆的内容尺度（面试具体说明）。\n4.节奏感强，理解\"钩子—反转—卡点\"的短剧叙事逻辑，懂平台算法与完播逻辑。\n5.能扛量、抗压，适应量产节奏与周产能目标。\n6.需附上相关作品（短剧／竖屏成片优先，注明负责环节）。\n\n三、加分项目\n1.有女性向／情感向内容剪辑经验，能剪出女主视角的情绪与代入感。\n2.会调色、混音、简单特效，或会用 AI 工具（AI 换脸、AI 配音、AI 补帧等）辅助提效。\n3.有二剪／番外／混剪的\"素材增值\"经验，能一片多用。\n4.有稳定高完播／爆款作品案例。\n5.熟悉多平台上架规范与各平台内容偏好。\n\n四、应聘方式\n请附上：\n1.代表作品 2–3 支（短剧／竖屏成片优先，附上你负责的环节）；\n2.简历与期望薪资；\n3.（加分）一句话说明你剪短剧时最在意的一个点。", "cat": "内容与创作"}, {"id": "10", "title": "AIGC 生产 Agent / Skill 工程师", "salary": "18-24k", "location": "远程", "jd": "这是一个给 AIGC 生产人员造工具的岗位，不是替他们多写一段 Prompt。你要把隐性经验变成可复用、可测试、可追踪、可维护的 Agent / Skill 和生产节点。\n\n一、我们为什么招这个岗位\n我们的 AIGC 影视生产涉及编剧、导演 / 分镜、图像与视频生成、资产管理、质量审核、剪辑和声音等角色。真正的问题不是工具太少，而是工具更新快、经验散落在人脑里、交接不稳定、返工难归因。\n这个岗位要把优秀生产人员已经验证过的方法，沉淀成 Agent / Skill、结构化输入输出、可执行节点、人工审批门禁和回归评测，让个人能力变成团队可复用的生产力。\n二、岗位使命\n深入真实生产现场，找到高频、高成本、可标准化的环节，设计并交付能被生产人员长期使用的 Agent / Skill。你的结果不以“能跑”为准，而以节省时间、减少返工、提升一致性、可追责和可维护为准。\n三、你将负责\n        •        生产调研：跟编剧、导演、生成师、剪辑和审核人员一起工作，拆清输入、判断、交付物、异常、人工审批点和上下游依赖。\n        •        Skill / Agent 设计：定义触发条件、输入输出契约、结构化 schema、内部步骤、上下文边界、工具调用、失败兜底、人工确认和禁止事项。\n        •        功能节点开发：使用 Python / TypeScript 等实现 CLI、API、工具封装和工作流节点，处理并发、重试、限流、降级、幂等、队列、状态和权限。\n        •        生产链路集成：围绕剧本 → 分镜 → 资产 → 图像 / 视频生成 → QC → 后期的真实流程，打通可验证节点，不为“全自动”牺牲质量和控制权。\n        •        评测与回归：建设触发路由测试、固定夹具、结构校验、质量评分、失败样本库和回归门禁；记录版本、成本、时延、成功率和人工返工。\n        •        技术评估：持续跟进新模型、新 Agent 框架、新协议和新生产工具，用小规模真实任务做对照，形成采用、观察或淘汰结论。\n        •        推广与维护：写清使用说明、边界和排障路径，陪生产人员完成试点，把反馈变成版本计划，而不是交付后失联。\n四、硬性要求\n        •        成熟项目经验：至少 1 个你深度参与、能够现场演示的成熟项目。可以是公司、创业、开源或个人项目；学历、公司名和项目规模都不能替代真实证据。\n        •        Agent / Skill 工艺：能明确区分聊天 Prompt、Agent 产品和可复用 Skill；理解触发条件、输入输出契约、结构化输出、上下文、工具调用、编排、Hook / 门禁和 Human-in-the-loop。\n        •        亲手工程能力：能够使用 Python 或 TypeScript 独立交付可运行代码，熟悉 API / CLI、数据 schema、测试、Git、依赖管理和基本部署，不是只画架构图。\n        •        AIGC 生产实操：至少真正做过一种图像、视频、音频、分镜或内容生产链路；知道生成结果不稳定、资产一致性、人工筛选和返工意味着什么。\n        •        审美与内容判断：具备稳定的视觉与叙事审美，能判断构图、镜头、光色、材质、节奏、角色一致性和成片完成度；能说明取舍，并把审美判断转化为参考样本、生成约束与可执行的 QC 标准。\n        •        系统可靠性：能处理第三方模型不稳定、并发、超时、重试、降级、成本失控、脏输出和中断恢复，并让问题可观察。\n        •        需求翻译能力：能听懂生产人员的话，把“想要更有电影感”“角色老漂”“太慢”转成可测的约束、样本和验收标准。\n        •        持续学习：对新技术有长期热情，主动试、主动比较、主动记录；能说清一个新方案为什么没进生产，而不是只会追热词。\n五、成熟项目必须展示什么\n个人项目同样有效，前提是它已经跨过“Demo”阶段：\n        •        有真实用户或明确生产对象，完成了输入 → 处理 → 输出 → 反馈 / 复用的闭环。\n        •        能现场展示运行结果、关键仓库或等价证据，并讲清本人亲手负责的文件、模块和决策。\n        •        能展示输入输出契约、工具链、失败处理、版本记录、测试 / Eval、日志或实际使用数据。\n        •        能说清至少一次失控或返工：为什么发生、怎样定位、怎样修、修完如何防止复发。\n        •        如果项目使用了多个 Agent 或模型，能解释为什么要拆、怎样防上下文污染、怎样决定人工接管。\n        •        审美案例：至少展示 1 个能证明审美判断的真实案例，说明目标与参考、候选结果、筛选理由、修改前后对比，以及最终成片或生产结果。\n聊天机器人套壳、Prompt 合集、只跑通一次的自动化、无法打开实现的概念视频，以及把团队整体成绩当个人成果，不算成熟 Agent / Skill 项目。\n\n六、我们怎样判断你是否真的追新技术\n投递时请附最近 6 个月至少一项主动技术验证：可以是新模型、新 Agent 框架、MCP / 工具协议、图像视频工作流或 Eval 方案。请说明问题、基线、实验、失败、结论和是否落地。我们更喜欢一个被你严谨否决的方案，也不喜欢十个没有验证的“看起来很强”。\n七、加分项\n        •        写过可维护的 SKILL.md / Agent 指令体系，做过多 Agent 编排、Hook、MCP、工具权限或确定性门禁。\n        •        做过图像 / 视频生成 pipeline、ComfyUI、主流生成 API、媒体处理、资产版本和批量任务编排。\n        •        懂 Prompt 的可控性、参考图 / 角色一致性、跨镜头连续性、结构化分镜和自动 QC。\n        •        做过 Eval harness、Golden cases、回归测试、可观测性、成本台账、重放和故障恢复。\n        •        有全栈界面或内部工具经验，能把工程能力包装成非技术生产人员真正会用的产品。\n        •        有影视、动画、广告、短剧或内容生产经历，熟悉镜头语言、成片标准和真实审核链路。\n        •        维护过有真实用户的开源项目、插件、CLI 或自动化工具。\n八、投递材料与面试方式\n        •        请附 1–3 个代表项目：演示 / 链接、架构或流程图、本人贡献、真实用户或生产结果、指标、失败案例和迭代记录。\n        •        请尽量附一个你写过的 Skill、Agent、插件、工作流定义、Eval 或自动化节点；涉及保密内容可脱敏。\n        •        第一轮以项目现场演示和逐层追问为主，重点验证“是不是你做的”和“是否真的被使用”。\n        •        审美判断会单独验证：面试将提供一组 AIGC 图像、视频或分镜结果，请完成筛选、排序和修改建议；重点看判断是否稳定、具体、可解释，并能转化为生成策略或 QC 规则。\n        •        技术轮会让你把一句话剧情设计成结构化分镜 Skill，讲清触发、输入输出、边界、失败和下游消费。\n        •        限时作业如采用，建议上限 3 小时：SKILL.md + 能跑的最小实现（含并发 / 重试 / 降级）+ 设计取舍与 Eval；题目不直接进入商业生产。\n九、这类人不适合\n        •        把 Agent 理解成一个聊天页面，把 Skill 理解成一段更长的 Prompt。\n        •        只想做产品规划或技术管理，不愿亲手写代码、查日志、跑真实任务和处理脏输出。\n        •        不了解生产人员的真实流程，却执着于一上来全自动、无人化。\n        •        只会列工具名，不能拿出项目、实验、失败记录和可复现结果。\n        •        不尊重人工审批、版权、隐私、密钥与付费调用边界。", "cat": "技术开发"}, {"id": "11", "title": "X 渠道运营专员", "salary": "NT$40,000–55,000/依经验与实际作品核薪", "location": "台湾本地驻场办公", "jd": "一、职位介绍\n目前团队旗下涵盖多条社群及产品线，包括 AI 生成内容与数字人 IP、AI／Web3 产品社群及品牌官方账号。\n现阶段将重点投入 X（Twitter）平台运营及账号矩阵建设，希望招募一位熟悉 X 生态、具备内容敏感度及社群冷启动能力的运营伙伴，能够独立负责账号从 0 到 1 的定位、内容、增长及社群互动。\n二、工作内容\nX 账号运营\n独立负责账号定位、内容调性、选题规划、发文节奏及日常运营。\n撰写贴文、Thread、迷因及互动型内容，中英文内容均能独立产出。\n矩阵账号运营\n同时管理多个自有账号。\n根据不同账号设定内容定位、人设及目标受众。\n规划账号间内容分发、互动及交叉导流策略。\n多平台内容分发\n熟悉 X、Telegram、Discord、Reddit、Instagram、TikTok、小红书等平台特性。\n能根据不同平台用户及算法机制调整内容形式，而非单纯复制发布。\n社群冷启动与增长\n负责种子用户招募及早期社群增长。\n规划并执行 KOC／社群大使计划。\n设计社群任务、活动及奖励机制，提高用户互动与留存。\n社群互动与舆情管理\n经营评论区及社群讨论氛围。\n处理负面评论及突发舆情。\n主动与用户、同赛道账号及 KOL 互动并建立关系。\n热点及内容增长\n持续关注网络热点、热门梗及行业话题。\n能快速判断适合账号参与的热点，并及时产出相关内容。\n数据分析与优化\n每周追踪曝光、互动、粉丝增长、导流等核心数据。\n根据数据表现提出下一阶段内容及运营优化方案。\n三、任职要求\n有实际社群账号运营经验，年资不限，实际成绩及作品优先。\n可提供过往运营账号及相关数据成果。\nX 平台深度用户，了解什么内容容易获得互动、转发及传播。\n具备良好的中英文内容能力，英文贴文表达自然，无明显翻译腔。\n熟悉各社群平台规则及红线，了解限流、封号风险及基本申诉处理方式。\n熟悉 Typefully、Hypefury、数据分析工具、Discord Bot、多账号管理等社群运营工具。\n对网络文化、热门梗及热点事件敏感，能够快速响应并转化为内容。\n具备较强的独立执行能力，无需持续跟进提醒，可主动推进账号运营。\n四、加分项\n有 Web3／Crypto／AI 产品社群运营经验。\n熟悉 AI 生图、AI 视频生成等工具。\n具备基础视频剪辑或平面设计能力。\n有账号从 0 到 1 冷启动及增长成功案例。\n自有 X 或其他社群账号具备一定粉丝量或影响力。\n五、面试准备\n面试请准备以下内容：\n过往运营账号：提供账号链接、负责内容及实际数据成果。\n3 条 X 内容提案：针对我们的 AI／数字人 IP／AI 或 Web3 产品，准备 3 条你实际会发布的 X 贴文。\n1 个冷启动案例：说明你如何从 0 开始建立账号或社群，包括策略、执行方式及最终成果。", "cat": "运营与市场"}, {"id": "12", "title": "AI内容编辑", "salary": "12~18k", "location": "远程", "jd": "岗位定位：内容量产导向，负责原创短剧的剪辑与成片包装，把握短剧节奏与情绪，稳定产出高完播成片。\n一、工作内容1.基于原创短剧素材进行剪辑、番外重组与精编改版，负责单集从粗剪到成片的完整闭环。\n2.把握短剧的情节钩子、情绪推进与情感／情欲节拍，剪出能\"留人\"的开场与卡点，提升完播与转化。\n3.按周产能目标稳定出片，配合内容库填充计划（原片直上／二剪／番外多线并行）。\n4.完成字幕、音效、配乐、调色、片头片尾等标准化包装，产出符合平台上架规范的成片。\n5.关注完播率、点击、留存等数据，依反馈迭代剪辑手法与开场策略。\n6.规范素材命名与归档，维护素材库与成片库的可追溯性。\n二、必要条件\n1.熟练使用 Premiere／剪映专业版／Final Cut／DaVinci 等至少一款主力剪辑工具。\n2.具短剧、竖屏短视频或影视剧集类成片剪辑经验 1 年以上，能独立完成整集。\n3.对情感／情欲向短剧题材不排斥，能接受相对大胆的内容尺度（面试具体说明）。\n4.节奏感强，理解\"钩子—反转—卡点\"的短剧叙事逻辑，懂平台算法与完播逻辑。\n5.能扛量、抗压，适应量产节奏与周产能目标。\n6.需附上相关作品（短剧／竖屏成片优先，注明负责环节）。\n三、加分项目\n1.有预告片剪辑经验，能剪出情绪与代入感。\n2.会调色、混音、简单特效，或会用 AI 工具（AI 换脸、AI 配音、AI 补帧等）辅助提效。\n3.有二剪／番外／混剪的\"素材增值\"经验，能一片多用。\n4.有稳定高完播／爆款作品案例。\n5.熟悉多平台上架规范与各平台内容偏好。\n四、应聘方式\n请附上：\n1.代表作品 2–3 支（短剧／竖屏成片优先，附上你负责的环节）；\n2.简历与期望薪资；\n3.（加分）一句话说明你剪短剧时最在意的一个点。", "cat": "内容与创作"}, {"id": "13", "title": "渠道运营", "salary": "50,000-65,000NTD", "location": "台湾本地驻场办公", "jd": "工作内容：\n -负责自有影音平台的产品营运，规划站内内容排序、专题、首页版位与推播 -规划会员、付费与储值机制的营运活动（档期活动、促销方案、会员分级），并追踪转换成效 -制定内容上架排程与档期，跨部门协作，确保内容与宣传素材如期到位 -分析平台数据（DAU、留存、付费转换、ARPPU 等），产出周报／月报，提出优化方案 -规划导流路径与变现策略，追踪各流量来源的成效 -搜集用户回馈与竞品动态，提出产品功能与体验优化需求，对接技术团队验收上线 -主管交办事项条件要求： -工作经历：2 年以上 -学历：大学以上，科系不拘 -具数据分析能力，熟悉 Excel／Google Sheets（枢纽分析、函数） -逻辑清楚、数字敏感，具良好的沟通协调与专案管理能力加分条件： -具游戏平台、数位内容平台、电商产品营运经验 -操作过会员付费、储值、订阅制等变现机制 -熟悉 GA4、Looker Studio 等数据分析工具 -熟悉 Telegram、X 等社群平台生态", "cat": "运营与市场"}, {"id": "14", "title": "品牌AI内容编辑", "salary": "45,000-65,000 NTD", "location": "台湾本地驻场办公", "jd": "工作内容：\n -负责品牌的社群短影音、广告影片、宣传预告剪辑 -将正片素材再制为各平台社群版本（直式／横式、不同秒数） -运用 AI 生成工具产出影片素材，结合后制完成成品 -管理影音素材与版本，配合档期如期交付 -主管交办事项条件要求： -工作经历：1 年以上影片剪辑相关经验 -熟悉 Premiere Pro／CapCut 剪辑软体（至少 1 项）与After Effects -具字幕、调色、音效与节奏剪辑基本能力 -应征请附作品集加分条件： -具 AI 生成影像经验（Runway、Kling、Hailuo、Sora 等图生影／文生影工具） -具 AI 生图经验（Midjourney、Stable Diffusion、ComfyUI 等） -具社群短影音操作经验，了解各平台演算法与爆款节奏 -具动态图像（Motion Graphics）能力", "cat": "内容与创作"}, {"id": "15", "title": "商服专员", "salary": "7K-10K", "location": "7.工作地点须在国内，不用海外人员。包括在东南亚生活或有东南亚工作经验人员。", "jd": "岗位职责\n\n1. 负责商务及日常行政支持相关工作的对接、协调与跟进，确保事项及时落实。\n2. 协助处理广告上下架、链接更换、资料整理、表格维护等日常支持性工作。\n3. 负责商务合作过程中相关资料的收集、整理、归档及信息核对。\n4. 跟进合作进度，及时做好信息同步与反馈，协助推进项目顺利开展。\n5. 协助整理日报、工作汇总、台账等相关文档，确保数据准确、更新及时。\n6. 协助跨部门沟通协调，推动各项工作有序开展并按时完成。\n7. 对日常工作中发现的问题进行记录、反馈，并协助跟进处理。\n\n岗位要求\n\n1. 大专及以上学历，专业不限，有商务助理、行政助理、运营支持或相关工作经验者优先。\n2. 具备良好的沟通协调能力和服务意识，能够高效配合各项工作开展。\n3. 工作认真细致，责任心强，具备较强的执行力和条理性。\n4. 熟练使用 Excel、Google Sheets 等办公工具，具备基础数据整理与文档处理能力。\n5. 能够适应多事项并行的工作节奏，具备较好的时间管理和任务跟进能力。\n6. 能接受表格整理、信息核对、资料归档、沟通跟进等日常支持类工作。\n7.工作地点须在国内，不用海外人员。包括在东南亚生活或有东南亚工作经验人员。\n8.有同行业经验、BC、资金盘等敏感业务经历的候选人，不予录用。\n9.年龄要求20-28岁\n\n优先条件\n\n1. 有商务支持、行政助理、运营支持、客户服务等相关经验者优先。\n2. 具备较强的表格整理、数据核对及文档处理能力。\n3. 工作积极主动，能够及时发现问题并做好反馈与跟进。\n4. 具备良好的团队协作意识，沟通顺畅，执行稳定。\n5. 应届毕业生，本科以上，执行力强有相关电脑操作，AI应用基础优先", "cat": "运营与市场"}, {"id": "16", "title": "产品定价专家", "salary": "20K-30k", "location": "", "jd": "岗位职责：\n1. 定价体系搭建\n  • 统筹各分公司广告位定价、产品定价、流量评估\n  • 建立标准化定价模型（成本 + 市场 + 竞品 + 流量价值）\n2. 定价审核与管控\n  • 月度复核分公司报价合理性，避免低价竞争或定价过高失单\n  • 输出《集团产品定价手册》，分公司报价需在框架内执行\n3. 产品标准化\n  • 推动产品标准化、套餐化设计，减少分公司各自为政\n  • 定期输出定价分析及优化建议报告\n\n任职要求：\n1. 学历与经验：\n  • 本科及以上学历，财务、经济、市场营销等相关专业优先\n  • 3年以上定价策略、商业分析或产品运营经验，有广告/媒体行业定价经验优先\n2. 核心能力：\n  • 精通数据建模与财务分析\n  • 能从成本、市场、竞品多维度构建定价体系\n  • 逻辑严谨、数字敏感度高\n  • 敢于对不合理报价说\"不\"，原则性强\n3. 加分项：\n  • 有定价模型搭建或定价手册编写经验\n  • 有广告/媒体行业从业背景", "cat": "产品与管理"}, {"id": "17", "title": "业务督导专员", "salary": "面议", "location": "", "jd": "核心职责\n\n一、业务巡检与质检\n1. 对各业务岗位开展常态化巡检与专项抽查，核查工作质量与任务完成情况\n2. 核查新人带教与业务培训的落地情况，评估带教效果与培训覆盖率\n3. 核验业务部门日报、周报、会议纪要、巡检报告中的关键事项，识别异常、遗漏、拖延与执行偏差\n\n二、问题闭环与台账管理\n4. 跟进广告数字化、平台运营、商务服务、广告优化等销售转化业务链路中的问题闭环\n5. 建立并维护业务质检台账（问题来源/责任部门/责任人/整改时限/整改结果/复盘结论）\n6. 定期输出业务质检报告、风险提示、巡检结论及整改追踪材料\n\n三、会议协同与制度跟进\n7. 协助完成会议安排、纪要整理、行动项拆解及DDL追踪\n8. 协助发布制度通知、流程要求与规范文件，跟踪各部门反馈、执行情况与完成状态\n\n四、跨部门追踪与风险升级\n9. 跟踪跨部门事项进度，推动问题从\"提出\"走向\"解决\"，确保责任人、时间节点、交付物清晰可查\n10. 对高风险事项及时升级（流程倒挂、数据异常、执行延期、人员履职异常、信息安全及权限风险等）\n\n任职要求\n1. 本科及以上学历，英国G5顶尖院校背景优先；其他候选人若业务履历优秀亦可考虑\n2. 远程工作，需具备英国合法工作身份常驻英国，其他发达国家亦可，东南亚地区不做考虑\n3. 3年以上互联网/广告科技/流量变现/广告联盟/SaaS/平台运营/项目管理/商业分析/运营质检/业务风控相关经验优先\n4. 能理解广告投放、流量承接、线索转化、客户运营等基本业务流程\n5. 具备较强的信息核验、逻辑判断、问题拆解、事项统筹与闭环跟踪能力\n6. 口头与文字表达能力强，能独立整理清晰、准确、适合管理层阅读的材料\n7. 擅长使用AI工具，熟练操作Excel/Google Sheets、协作文档、项目管理工具\n8. 职场成熟度高，严谨细致，能同时处理多线程任务，接受高频沟通与临时专项任务\n9. 入职之前需提供学历证明\n\n加分项\n具备质检/督导/培训管理、总裁办/PMO/战略运营，或MarTech/AdTech/流量商业化增长相关经验者优先", "cat": "运营与市场"}, {"id": "18", "title": "业务运营总监", "salary": "30k-40k", "location": "", "jd": "业务运营总监 （渠道资源方向）\n需求：1人\n\n一、岗位名称\n\n广告数字化部｜广告联盟运营总监招募（渠道资源方向）\n\n二、岗位职责\n\n1. 负责广告联盟业务整体运营与渠道拓展\n\n• 统筹广告联盟业务运营管理，制定业务增长策略并推动落地；\n• 围绕联盟业务目标，拓展、整合并运营优质渠道资源，提升业务规模与合作质量。\n\n2. 引入并管理渠道资源\n\n• 基于现有行业经验和资源积累，快速引入可合作的渠道、流量方或相关合作资源；\n• 建立渠道合作机制，推动合作方的接入、转化、放量和长期维护。\n\n3. 推动业务增长与结果达成\n\n• 对联盟业务核心结果负责，包括渠道增长、资源引入、合作转化、业务规模提升等；\n• 能结合市场变化和业务阶段，及时调整合作策略与运营动作。\n\n4. 协调内部资源推动项目落地\n\n• 联动产品、技术、数据、商务等团队，推动渠道接入、合作上线和问题处理；\n• 对重点合作项目进行全流程推进，保障执行效率和结果交付。\n\n5. 搭建和优化运营机制\n\n• 完善联盟业务的渠道运营流程、合作标准、管理机制及风险控制体系；\n• 提升业务在高流量、高复杂度场景下的稳定性和运营效率。\n\n6. 团队管理与能力建设\n\n• 负责团队管理、目标拆解、过程跟进及人才培养；\n• 建立结果导向、协同高效的业务运营团队。\n\n───\n\n三、任职要求\n\n1. 本科及以上学历，具备 广告联盟、渠道拓展、流量合作、商业化运营 等相关经验；\n2. 有可转化的渠道资源积累，具备独立拓展和导入资源的能力；\n3. 熟悉广告联盟、流量平台、效果广告或相关业务逻辑，能够快速判断资源质量与合作价值；\n4. 具备较强的商务拓展能力、合作谈判能力和资源整合能力；\n5. 具备团队管理经验，能够带团队完成业务目标；\n6. 数据敏感度高，能结合数据判断业务问题、渠道质量与增长机会；\n7. 具备较强的跨部门协同和项目推进能力，能够推动复杂合作快速落地；\n8. 抗压能力强，有较强的结果意识和业务 ownership。\n\n───\n\n四、优先条件\n\n1. 自带广告渠道、流量渠道、联盟合作方资源者优先；\n2. 有成熟渠道网络，能够在短时间内推动资源落地者优先；\n3. 有广告联盟、商业化平台、效果投放、流量变现相关行业背景者优先；\n4. 有从 0 到 1 开拓渠道，或从 1 到 N 放大合作规模经验者优先。\n\n───\n\n五、我们重点看重\n\n• 是否 自带资源\n• 是否 能直接开合作\n• 是否 能把资源转成结果\n• 是否 能兼顾拓展 + 运营 + 管理", "cat": "运营与市场"}, {"id": "19", "title": "渠道专员", "salary": "15k-25k", "location": "", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "运营与市场"}, {"id": "20", "title": "中高级网站运营（SEO / Growth）", "salary": "20-30k", "location": "", "jd": "中高级网站运营（SEO / Growth）\n\n岗位职责\n1.负责网站从 0 到 1 的整体运营工作，对网站流量增长及用户增长负责。\n2.制定并落地网站 SEO 策略，包括关键词规划、栏目建设、内容优化、内链布局及技术 SEO 优化。\n3.负责 Google Search Console、Google Analytics 等数据分析，持续优化网站收录、索引及自然搜索表现。\n4.规划网站内容体系、标签体系及专题页面，提高网站整体内容质量及搜索覆盖率。\n5.负责 X（Twitter）、Telegram、Reddit 等海外社交平台运营，提升品牌曝光及用户增长。\n6.持续跟踪行业动态及竞争对手，制定运营优化方案。\n7.与产品、开发团队协同推进运营需求，不断完善网站功能及用户体验。\n8.建立网站运营规范及数据分析体系，定期输出运营分析报告。\n\n任职要求\n1.3 年以上网站运营或 SEO 运营经验，有独立负责网站项目经验。\n2.熟悉 Google SEO 原理，具备完整的网站优化经验，能够独立制定并执行 SEO 策略。\n3.熟练使用 Google Search Console、Google Analytics（GA4）、Ahrefs、Semrush 等工具。\n4.熟悉网站收录、索引、关键词排名、内容规划及网站结构优化。\n5.熟悉海外社交媒体平台（X、Telegram、Reddit 等）运营规则，有实际增长经验者优先。\n6.具备较强的数据分析能力，能够根据数据发现问题并推动优化。\n7.具有良好的项目管理及跨部门沟通能力，具备较强的执行力和责任心。\n\n加分项\n1.有海外内容网站、资源站、媒体站、社区平台运营经验。\n2.有 AI 内容生产及 AI 工作流搭建经验。\n3.熟悉 Cloudflare、WordPress、HTML/CSS、Schema、Sitemap 等网站技术。\n4.有 Google Discover、Email Marketing、Affiliate、站群运营等经验。", "cat": "运营与市场"}, {"id": "21", "title": "AI 研发工程师", "salary": "面议", "location": "•AI 原生团队：远程优先、少政治、快速出成果，鼓励一切能提效的做法。", "jd": "既能搭复杂业务系统（CRM / ERP / OA / 审批流 / 权限 / 报表），也能把 AI 能力做进系统里——以后端为主的全栈研发，深度使用 AI 编程工具高效交付。\n这个岗位做什么\n你负责公司核心业务系统（CRM、ERP、OA、审批流、权限体系、订单、客户、项目、报表 等）的设计、开发与维护，并把 AI 能力（智能客服 / Agent / RAG / 自动化）做进这些系统。\n以 后端为主、具备全栈能力；工作以 平台研发（把共性能力沉淀成可复用模块）和 方案落地（把需求快速做成能跑的系统并持续迭代）两件事为主。\n\n岗位职责\n一、复杂业务系统研发（后端为主，含前端联调）\n•负责核心业务系统（CRM / ERP / OA / 审批流 / 权限体系 / 订单 / 客户 / 项目 / 报表 等）的设计、开发与维护。\n•参与业务建模、接口设计、数据库设计、系统架构与性能优化。\n•拆解并实现复杂业务流程，处理多角色、多权限、多状态、多流程等业务场景。\n•参与前端功能开发与联调，独立完成中后台页面、表单、列表、详情、配置页等常见功能。\n•负责线上问题排查、故障定位、数据修复与系统持续优化。\n•与产品、业务、测试团队协作，理解业务需求并转化为稳定、可维护的技术方案。\n二、AI 平台研发与能力落地\n•把共性能力抽成可复用平台模块：知识库管理、Prompt 管理、模型调用与成本监控、权限系统、任务流、评测 Gate、灰度发布、日志审计。\n•把 AI 能力做进业务系统：智能客服、Agent、RAG、自动化——参与系统融合与可观测，快速做 MVP、私有化部署、灰度上线、跟数据迭代。\n三、AI 原生研发方式\n•用 AI Coding / Vibe Coding 工具贯穿全流程：需求拆解、代码生成、重构、测试补全、问题定位、文档生成，显著提升交付效率。\n\n硬性要求\n以下三条是筛选核心，任一不达标不予考虑。\n① AI 原生工作方式 · 会用更会判断（一票否决）\n•深度、高强度、日常使用 Cursor、Claude Code、Codex、GitHub Copilot 等 AI 编程工具进行真实生产开发——是 AI Coding / Vibe Coding 深度用户，把它当主力生产力，不是「试用过」。\n•能用 AI 工具贯穿需求拆解、代码生成、重构、测试补全、问题定位、文档生成，展示把交付效率提升 数倍。\n•关键：具备判断 AI 生成代码质量的能力——能识别错误实现、边界遗漏、性能问题和安全风险，并完成工程化落地。会用 AI，但不盲信 AI 输出。\n•熟练用 AI Agent 框架 / 工具链 搭建过真实系统，对提示工程、上下文工程、Agent 编排、评测（Eval）有实战理解。\n\n② 现场展示过往项目（硬性，无法豁免）\n•面试须 现场演示并讲解你亲手做过的 2–3 个真实项目（非教程复刻、非纯 Demo）。\n•其中 至少 1 个必须是使用 AI Agent / AI 工具链构建的项目。\n•现场要讲清：项目背景、你的角色、架构如何设计、用了哪些 AI 工具、具体怎么用、踩过什么坑、效果如何量化；我们可能要求你 现场用 AI 工具做一段真实编码 / 线上排障。\n\n③ 端到端闭环能力（能独当一面，不是螺丝钉）\n•能独立推进一件事的全过程：需求理解 → 方案设计 → 开发实现 → 验证上线 都能闭环，能端到端 own 一个系统。\n•懂 Linux + Docker 生产部署与排障，具备 SRE 素养：能扛线上事故、做灰度与回滚。\n•有 安全与合规意识：鉴权 / 越权 / 密钥 / 审计不是事后补，而是设计本能。\n\n任职要求\n•本科及以上学历，计算机、软件工程或相关专业优先。\n•5 年以上后端或全栈开发经验，有 复杂业务系统开发经验（CRM / ERP / OA / 进销存 / 供应链 / 人事 / 财务 / 项目管理 / 审批流 等经验者优先）。\n•熟悉至少一种后端技术栈（Java / Go / Python / Node.js 等，团队以 Python 为主力），服务端能力扎实。\n•熟悉关系型数据库（MySQL / PostgreSQL），具备良好的表结构设计、SQL 优化与事务处理能力。\n•熟悉 Redis、消息队列、定时任务、权限体系、组织架构、角色权限、审批流等企业系统常见能力。\n•熟悉前端开发，掌握 Vue / React / TypeScript 中至少一种，能独立完成中后台管理系统页面。\n•较强的业务抽象能力：能从复杂需求中拆出清晰的数据模型、流程模型和权限模型。\n•落地过至少一个 LLM / Agent 生产应用（RAG / Function Call / Agent 编排），能说清命中率、失败率怎么量出来并优化。\n•能接受多时区 / 夜间响应线上告警的 oncall 节奏。\n\n加分项\n•有大型中后台系统从 0 到 1 建设经验。\n•有微服务、DDD、流程引擎、规则引擎、低代码平台、报表系统经验。\n•有复杂权限模型、审批流引擎、动态表单、业务配置平台等设计经验。\n•有 Agentic Coding、AI 辅助重构、AI 生成测试用例、AI 参与代码评审等实践经验。\n•有使用 AI 编程工具提升 CRM / ERP / OA 等复杂业务系统开发效率的实际案例。\n•有可观测 / 度量体系（OTel / Prometheus / Grafana）或工作流引擎（Temporal / Cadence / Airflow）生产落地经验。\n•Telegram Bot / MTProto / 千群级并发系统实战；链上数据对接（Tron / EVM）；多租户 B2B 平台设计。\n•熟悉 DevOps、CI/CD、容器化部署、云服务者优先。\n\n我们希望你具备\n•不只是写接口，而是能 理解业务逻辑、系统边界和长期演进成本。\n•能在复杂业务中 建立清晰的模型，而不是堆功能。\n•重视 稳定性、可维护性和数据一致性。\n•能熟练使用 AI 工具提升效率，但不会盲信 AI 输出。\n•能 独立推进问题，从需求理解、方案设计、开发实现到验证上线都能闭环。\n\n面试流程\n1.简历初筛：重点看 AI 工具使用深度与复杂业务系统 / 真实项目质量。\n2.技术面 + 现场项目展示：演示 2–3 个真实项目，含 ≥1 个使用 AI Agent 的项目。\n3.现场实操：用 AI 工具做一段真实编码 / 排障，并评审一段 AI 生成代码的质量。\n4.团队与业务面：技术深度复核 + 业务性质的双向确认。\n5.发放 Offer。\n\n我们能提供什么\n•月薪 30–40K + 奖金，按能力与资历定档。\n•AI 原生团队：远程优先、少政治、快速出成果，鼓励一切能提效的做法。\n•顶配 AI 工具与算力：Cursor / Claude Code / Codex 等付费额度管够。\n•需求清晰、目标明确的工作机制，不做无头绪的活。\n•真实进生产的系统与数据：我们做的是能跑、被真实使用、能规模复制的系统，不做 PPT 工程。\n\n业务性质与投递说明\n请先确认自己能接受以下业务特点\n•业务处于出海营销 / 流量赛道，重度使用 Telegram 生态，涉及链上结算与站群、商务自动化。\n•交付以 私有化部署 为主，对安全与风控敏感。\n•节奏快、需求变化频繁，需接受多时区 / 夜间响应。\n•介意以上任一点的候选人请勿投递——我们希望在第一步就双向筛掉不匹配，节省彼此时间。\n\n投递请附\n1.个人简历。\n2.2–3 个最能代表你能力的项目说明，务必包含 至少 1 个用 AI Agent / 工具链做的项目，写清你用了什么工具、具体怎么用、成果如何量化。\n3.（可选）GitHub / 作品链接。", "cat": "技术开发"}, {"id": "22", "title": "业务审查员", "salary": "8-10k", "location": "", "jd": "岗位名称： 业务审查员\n\nJD：\n\n岗位职责：\n1、监控各业务群日常运营数据，核查打款金额、到期时间、收款地址、商品上下架状态等关键信息，及时发现并标记异常情况；\n2、核实风险事项（包括地址变更、异常打款、漏登、错登等），跟进问题处理进度并推动闭环解决；\n3、结合聊天记录、业务数据及相关台账，识别私下交易、违规操作、异常资金往来等风险事项，开展核实与跟进工作；\n4、负责台账登记、业务数据核对及信息复查，确保数据录入准确、完整、可追溯；\n5、按周/月输出审查报告及专项审查分析报告，汇总风险案例并提炼共性问题。\n\n任职要求：\n1、大专及以上学历，审计、财务、风控、数据分析等相关专业优先；\n2、细心认真、责任心强，能够长期从事核查、复核类重复性工作，保持稳定的工作质量；\n3、具备较强的风险意识和逻辑分析能力，能够从数据和信息中发现异常线索；\n4、熟练使用Google Sheets、Excel等在线表格工具，能够进行数据筛选、比对与基础统计分析；\n5、具备AI工具使用能力，能够熟练使用ChatGPT、Claude等AI工具辅助开展信息整理、数据分析、风险排查及报告编写工作；\n6、保密意识强，原则性强，具备良好的沟通协作能力，能够与多部门协同推进问题处理。\n\n加分项：\n\n有风控、审计、反舞弊、资金核查相关工作经验；\n熟悉互联网广告投放、渠道合作及结算业务流程；\n有数据分析、稽查或合规相关工作经验。", "cat": "其他"}, {"id": "23", "title": "初级素材设计师", "salary": "7-10k", "location": "", "jd": "工作内容\n    1. 使用 Photoshop /剪映进行广告图素材制作，包括但不限于：图片排版、尺寸调整、视频简单剪辑/添加字幕等；\n    2. 配合团队修改图片、视频及不同尺寸的广告素材；\n    3. 按照工作要求，及时完成日常素材制作任务。\n任职要求\n    1. 会使用 Photoshop，能够完成基础的抠图、修图、排版和图片合成；\n    2. 会使用剪映，能够完成基础短视频剪辑；\n    3. 有一定的审美，对颜色、字体和画面排版有基本感觉；\n    4. 能够接受成人行业相关的工作内容；\n    5. 工作认真，有责任心，执行力较强；\n    6. 能够根据要求及时修改和完成素材；\n    7. 有平面设计、广告设计、电商设计或视频剪辑经验者优先。\n    8. \n经验要求\n    1. 不限行业经验，应届生或初级设计人员均可；\n    2. 有基础的软件操作能力即可；\n    3. 有相关作品者可提供作品集，没有正式商业作品的，也可以提供平时练习的海报、修图、排版或短视频作品。", "cat": "内容与创作"}, {"id": "24", "title": "商务专员", "salary": "10-15k", "location": "", "jd": "岗位职责\n\n1、独立客户开发：能够独立开展客户开发、商务洽谈及合作推进工作，持续提升新增客户数量与合作转化率\n2、重点合作推进：能够独立跟进重点客户、续费客户及复杂合作事项，处理合作中的常见问题，保障合作顺利落地与持续推进\n3、业务结果达成：对个人业绩目标、新增合作、续费推进及回款结果负责，结合业务情况及时调整跟进节奏并完成目标任务\n4、数据与经验沉淀：负责整理个人客户台账、业务数据及跟进经验，沉淀有效话术、方法和合作案例，提升个人业务复用效率\n5.特殊业务需求：熟悉男性向/同志向内容生态及私域社群场景，了解相关用户沟通方式、社群规则和客户需求；具备同性内容、成人传媒、私域流量、社群商务或相关广告推广资源经验优先。（第5条要求，岗位缺口一人）\n\n必备：执行力、学习能力、目标意识与独立推进能力、抗压能力、客户开发、关系维护、复杂问题处理能力", "cat": "运营与市场"}, {"id": "25", "title": "DTC预算商务", "salary": "面议", "location": "", "jd": "岗位职责\n拓展符合DTC业务要求的企业客户，引入可实际测试和持续交付的广告预算。\n确认客户主体、行业、预算来源、付款主体、目标市场及投放内容。\n推进客户从线索、准入、报价、合同、付款到交付的完整流程。\n协同合规、法务及财务补齐KYB／KYC、合同、发票和付款材料。\n管理客户线索池、进度、问题和成交预测，定期输出管道报告。\n任职要求\n3年及以上海外广告、程序化、媒体投放或企业客户商务拓展经验。\n熟悉DTC／电商客户的预算决策链路、获客目标、投放模式和成交流程。\n能识别客户主体、付款主体、合同及业务真实性的基本风险。\n具备英文商务沟通、跨时区协作和书面材料整理能力。\n结果导向，愿意从0到1建立合规客户拓展SOP。\n试用期核心交付：建立DTC目标客户清单；找到至少1家可实际测试的DTC客户；推进准入、报价、签约及预算引入。\n\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "运营与市场"}, {"id": "26", "title": "综合流量拓展商务", "salary": "面议", "location": "", "jd": "岗位职责\n拓展大媒体、网盟、站点、应用及其他可审核的流量供应渠道。\n评估流量来源、覆盖地区、用户画像、库存规模、计费方式和质量风险。\n推进供应方准入、测试、报价、合同、接口／账户配置与对账。\n与交付运营配合，根据客户市场、行业和目标匹配可用流量。\n建立流量供应方池及质量档案，持续跟踪效果、异常和整改。\n任职要求\n3年及以上程序化广告、Affiliate、Ad Network、SSP／DSP或媒体商务经验。\n理解CPM、CPC、CPA、POP等主要采购及结算方式。\n具备流量质量、归因、作弊风险和投放凭证的基本判断能力。\n有大媒体、网盟、出海应用或站长资源者优先。\n英文可用于邮件、合同材料和日常商务沟通。\n试用期核心交付：建立可审核流量池；完成至少2家供应方评估／测试；输出供应方准入、测试和质量记录模板。\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "运营与市场"}, {"id": "27", "title": "综合预算商务", "salary": "面议", "location": "", "jd": "岗位职责\n拓展符合准入要求的网盟预算、电商预算和游戏预算，建立目标客户池。\n核实客户主体、行业、预算来源、付款主体、目标市场及投放内容。\n推进客户从线索、准入、报价、合同、付款到交付的完整流程。\n协同合规、法务及财务补齐KYB／KYC、合同、发票和付款材料。\n管理客户线索池、进度、问题和成交预测，定期输出商务管道报告。\n任职要求\n3年及以上海外广告、程序化、媒体投放或企业客户商务拓展经验。\n熟悉网盟、电商或游戏客户的预算决策链路、投放需求和成交流程，具备其中一类客户资源者优先。\n能识别客户主体、付款主体、合同及业务真实性的基本风险。\n具备英文商务沟通、跨时区协作和书面材料整理能力。\n结果导向，能独立推进客户开发、签约及广告预算引入。\n试用期核心交付：建立网盟、电商和游戏预算客户清单；推进至少1家合规客户进入准入／签约流程；形成线索到预算入账的商务跟进模板。\n\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "运营与市场"}, {"id": "28", "title": "DSP／AdX交付运营", "salary": "面议", "location": "", "jd": "岗位职责\n负责白名单、代理、代投、DTC及AdX业务的开户、配置和日常交付。\n核对准入结果、合同、付款、账户额度和投放要求后启动业务。\n执行广告活动配置、素材上线、数据监控、问题跟进和客户同步。\n整理投放数据、交付凭证、对账单和结算材料，确保系统与财务记录一致。\n收集产品缺口和交付问题，与产品技术组推进修复。\n任职要求\n2年及以上DSP、AdX、媒体投放、广告运营或账户管理经验。\n熟悉广告开户、预算、素材、审核、投放、数据和对账基本流程。\n对数据敏感，能够使用表格和广告后台完成分析与排查。\n细致、责任心强，能严格按准入、付款和审核结果执行。\n具备跨部门沟通、问题记录和SOP撰写能力。\n试用期核心交付：独立完成至少1个客户／项目的开户至对账流程；建立日常交付检查表和问题台账。\n\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "运营与市场"}, {"id": "29", "title": "风控审核专员", "salary": "面议", "location": "", "jd": "岗位职责\n执行白名单企业、代理公司、流量供应方的KYB／KYC及准入审核。\n核验公司主体、UBO、签字人、业务真实性、资金来源和付款主体。\n审核广告内容、投放国家、流量来源、交付凭证和异常处理材料。\n根据一票否决及风险分级标准，给出通过、补件、暂缓或拒绝结论。\n维护审核记录、材料版本、决策依据和后续监控台账。\n任职要求\n2年及以上KYB／KYC、AML、广告审核、商户审核或风控运营经验。\n熟悉企业注册材料、UBO、银行账户、合同及交易凭证的核验思路。\n能理解程序化广告、代理、代投、AdX及DTC业务的基本链路。\n具备强风险意识、证据思维和文档留痕习惯，可独立写出审核意见。\n英文可用于企业信息、制裁名单及业务材料查询。\n试用期核心交付：完成首批企业及合作方审核；建立审核台账；将准入标准转换为可执行检查表。\n\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "其他"}, {"id": "30", "title": "广告销售专员", "salary": "12k-15k", "location": "", "jd": "岗位职责\n**客户开发：**负责联盟广告及站点广告位销售，独立挖掘潜在广告主，开展客户开发、需求沟通及商务洽谈，推动新增合作。\n**合作推进：**根据客户推广需求，协调广告资源、报价及合作条款，跟进合作确认、广告上线等环节，推动合作落地。\n**客户维护：**持续维护合作客户，跟进投放反馈与后续需求，及时协调处理合作问题，推动续费及长期合作。\n**业绩达成：**对个人销售目标、新增合作、客户续费及回款结果负责，合理安排客户跟进节奏，推进目标完成。\n**数据与经验沉淀：**及时维护客户台账、合作进度及回款记录，整理有效销售话术、客户开发方法和合作案例，提升业务效率。\n岗位要求\n具备客户开发、商务洽谈及关系维护能力，能够独立推进从客户接触到合作落地的完整流程。\n有传统销售经验者优先，有广告销售、联盟广告或站点广告位销售经验者优先。\n自带广告主资源者优先，重点包括炮台、博彩、直播等方向。\n具备良好的执行力、学习能力及目标意识，能够主动拓展客户、持续跟进并推动结果达成。\n具备良好的沟通协调、抗压及问题处理能力，能够应对客户异议与合作中的复杂问题。\n接受外部招聘、内部调岗及内部兼职；内部兼职人员需能够保障必要的工作投入、客户响应及合作跟进。\n\n注意：不需要和人选沟通是否可以接受成人行业，详细业务内容不沟通，具体的面试聊，工作内容以jd描述的去介绍就行", "cat": "运营与市场"}, {"id": "31", "title": "产品组长（内容/视频站）", "salary": "30-50K", "location": "", "jd": "产品主管（内容/视频平台）岗位职责\n职级：P6-P7\n薪资：面议\n\n岗位核心定位\n负责内容/视频平台的产品规划、核心内容消费链路建设、数据增长、用户留存及产品团队管理，能够从业务目标出发，推动产品能力持续升级，并通过专业管理提升产品团队整体产出与业务支撑能力。\n\n任职要求\n本科及以上学历；8年以上互联网产品经验，其中 3 年以上内容产品/视频平台经验；\n有20人及以上团队的管理经验；\n熟悉视频内容产品核心指标体系（CTR、VV、完播率、DAU、人均时长等），能独立进行数据拆解与归因分析；\n具备较强逻辑思维与问题拆解能力，善于将模糊问题结构化，并将数据洞察转化为可执行的产品方案；\n对内容消费行为有深刻理解，能够将优化方向精准落到具体功能与交互细节；\n有过成人内容平台 / 泛娱乐视频站经验者优先；具备推荐系统基础认知者加分。\n加分项\n有独立主导过 DAU / 时长增长专项，且有清晰的数据结论与产品沉淀；\n对推荐算法、内容标签体系、用户画像有实际落地经验；\n具备出海内容平台或多语言产品经验。\n\n能力要求\n一、产品规划与业务发展\n负责内容/视频平台整体产品规划与发展方向制定，结合业务目标、用户需求及市场变化，明确产品建设重点与阶段性规划。\n统筹推荐流、播放器、内容详情页等核心内容消费链路的产品建设与持续优化，提升用户消费体验及平台业务价值。\n围绕DAU、用户时长、留存率、CTR、VV、完播率等核心指标，识别产品增长机会，推动重点产品优化与业务目标达成。\n\n二、核心产品能力与数据增长\n深入分析用户内容消费行为，拆解用户触达、播放、消费及留存过程中的关键问题，并转化为具体产品方案。\n主导核心产品功能设计与迭代，重点关注推荐策略、内容分发、播放体验及用户消费路径的优化。\n主导重点增长专项及A/B实验，基于数据分析和效果验证，持续优化产品策略，沉淀可复用的增长方法论。\n推动推荐系统、内容标签体系、用户画像等能力在产品中的实际应用，提升内容匹配效率及用户消费价值。\n\n三、产品团队管理与专业建设\n负责产品团队的日常管理与专业能力建设，明确产品经理工作标准、职责分工及发展方向。\n指导产品经理开展需求分析、方案设计及产品迭代，提升团队整体产品能力与交付质量。\n建立产品评审、项目跟进及数据复盘机制，推动产品经验沉淀与专业方法优化。\n参与产品岗位招聘、人才识别及培养，完善产品团队能力梯队。\n\n四、跨部门协同与产品落地\n统筹产品与设计、研发、测试、运营等团队的协作，推动核心产品需求从规划、设计到上线的全流程落地。\n结合业务优先级协调产品资源，明确重点项目的交付目标与推进节奏，保障产品建设质量。\n跟进产品上线后的业务表现及用户反馈，推动问题闭环与持续迭代。", "cat": "内容与创作"}, {"id": "32", "title": "SEO 运营", "salary": "10-20K", "location": "", "jd": "岗位职责\n\n1、负责视频站在 Google、Bing、Yandex 三大搜索引擎的自然流量增长，独立承担收录量、关键词覆盖、自然流量等核心指标。\n\n2、基于三大引擎排名逻辑的差异（Google 侧重内容权威性与用户体验信号、Bing 更依赖结构化数据与页面规范、Yandex 以用户行为因子为主导），分别制定并落地差异化的优化方案，不套用单一打法。\n\n3、统筹视频内容从生产到分发全链路的 SEO 落地，包括页面结构、标题与描述规范、视频结构化数据（VideoObject）、视频站地图、转录文本与字幕、缩略图与内链体系，确保内容结构、技术架构与传播路径共同服务于多引擎搜索表现。\n\n4、搭建跨引擎的效果评估体系，拆解各平台流量增长的关键杠杆，输出定期数据复盘，为策略迭代与资源投入优先级提供依据。\n\n5、跟踪三大引擎的算法更新与生态变化，评估对现有策略的影响，及时推动方向调整。\n\n6、推动 SEO 要求前置到内容生产环节，与内容、产品、技术团队建立协同机制，将优化动作从事后补救转为事前内置。\n\n任职要求\n\n1、本科及以上学历，3 年以上 SEO 运营经验，有视频站、内容站或大型站点（十万级以上页面）实操经验者优先。\n\n2、具备至少两个搜索引擎的实战经验，熟悉 Google 之外 Bing 或 Yandex 的收录与排名机制，能说清各引擎的差异而非只做过 Google。\n\n3、熟练使用 Google Search Console、Bing Webmaster Tools、Yandex Webmaster 及主流第三方工具（Ahrefs／Semrush／GA4 等），具备独立的数据分析与归因能力。\n\n4、掌握技术 SEO 基础：抓取与索引机制、站点架构与内链、结构化数据、页面性能与 Core Web Vitals、站点地图与 robots 规则，能与研发有效对齐需求。\n\n5、具备良好的跨团队沟通与推动能力，能将 SEO 需求转化为内容与产品可执行的规范。", "cat": "运营与市场"}, {"id": "33", "title": "高级算法工程师", "salary": "25-40K", "location": "", "jd": "岗位职责\n1、负责抖音业务推荐算法工作，与来自国内外名校、有丰富业界经验的同学合作，共同搭建行业顶级的推荐系统，为用户提供一流的产品体验；\n2、将最前沿的机器学习技术应用到抖音的核心场景业务，优化用户体验促进业务发展；\n3、研究方向包含且不局限于：深度学习、图神经网络、多任务学习、Learning To Rank、模型压缩和加速、多模态技术等，结合业务的实际问题来做好技术的探索和研究；\n4、和产品、运营团队紧密合作，通过对产品和用户的深入理解和分析，制定算法策略促进抖音生态的长期繁荣发\n\n任职要求\n1、具备优秀的编码能力，扎实的数据结构和算法功底；\n2、对机器学习有热情、乐于学习、思考和创新，有自然语言处理、数据挖掘、计算机视觉相关的工作经验；\n3、熟悉常见算法，如LR，GBDT，DNN等，具备推导， 实现， 应用能力；\n4、熟悉C++和Python语言，熟悉Linux开发环境；\n5、优秀的分析问题和解决问题的能力，有良好的沟通表达能力和团队精神。", "cat": "技术开发"}, {"id": "34", "title": "高级AI视频创作", "salary": "15-30", "location": "", "jd": "岗位职责：\n主导AI视觉内容生成流程的设计与优化，包括但不限于图像、视频、动画等多模态创作。\n\n构建并维护高质量的工作流体系（ComfyUI / Stable Diffusion / 视频生成模型等），实现风格统一、角色一致性与批量产出。\n\n探索前沿AI工具（视频生成、动作迁移、音频驱动、修复增强等），并快速落地为生产级方案。\n\n负责模型选型、LoRA/finetune微调、提示词工程与参数调优，提升画面质量与生成效率。\n\n协同创意、剪辑、后期团队，将AI素材无缝整合至完整作品，指导初级/中级创作者。\n\n沉淀技术文档、工作流规范与资产库，持续优化内容生产管线。\n\n任职要求：\n经验：3年以上视觉内容创作经验，至少1年专注AI生成方向，有成熟作品或项目案例。\n\n工具：深度掌握ComfyUI节点级开发与调优，熟练使用FFmpeg、PR/AE等后期软件；熟悉Python/Shell脚本者优先。\n\n能力：具备极强的审美能力与风格控制力，能独立完成从创意构思到成品输出的全流程。\n\n模型：熟悉主流视频/图像生成模型（如Wan2.2、HunyuanVideo、Flux、Sora等），有LoRA训练或模型微调经验。\n\n沟通：逻辑清晰，能跨团队协作，适应高频迭代与快速实验的创作节奏。\n\n加分项：有开源项目贡献、技术博客/作品集、团队管理或培训经验", "cat": "内容与创作"}, {"id": "35", "title": "GO开发工程师", "salary": "20K–28K", "location": "", "jd": "Go 高级开发工程师\n岗位职责：\n- 负责公司核心业务模块的设计与开发，编写高质量、高可维护性的 Go 代码\n- 参与高并发服务的设计与实现，保障系统在高流量场景下的稳定性与性能\n- 负责服务接口设计与开发，确保 API 的兼容性、安全性与高效性\n- 进行数据库设计与优化，编写高性能 SQL，处理复杂业务场景下的数据一致性问题\n- 参与技术方案评审，进行 Code Review，推动团队代码质量与工程效率提升\n- 配合运维团队完成服务的容器化部署、监控告警配置及线上问题排查\n    \n\n任职要求：\n- 计算机相关专业本科及以上学历，4 年以上后端开发经验，2 年以上 Go 语言实战经验\n- 精通 Go 语言特性，深入理解 goroutine 调度、channel 通信、内存管理及 GC 原理\n- 熟练掌握至少一种 Go Web 框架（Gin/Echo/Go-zero 等），具备丰富的 RESTful/GRPC API 开发经验\n- 熟悉 MySQL/MongoDB，具备索引优化、慢查询分析、事务处理及分库分表实践经验\n- 熟练使用 Redis，掌握缓存设计模式，能够处理缓存穿透、击穿、雪崩等问题\n- 熟悉消息队列（Kafka/RocketMQ/RabbitMQ）的使用场景与最佳实践\n- 具备高并发系统开发经验，掌握常见的并发设计模式与性能调优手段（pprof、trace 等）\n- 熟悉 Docker、Kubernetes 等容器化技术，了解 CI/CD 流程与 DevOps 实践\n- 具备良好的系统设计与抽象能力，能独立完成模块级技术方案设计与落地", "cat": "技术开发"}, {"id": "36", "title": "百度 SEO 优化专员", "salary": "10-30K", "location": "", "jd": "岗位职责\n\n1、负责泛站的搭建与优化，包括域名资源规划、泛解析配置、模板设计、批量建站与分组管理。\n\n2、负责海量长尾词的挖掘与页面级布局，提升收录量、关键词排名与自然流量。\n\n3、执行站内优化、结构优化与外链建设，搭建采集与内容处理规则，控制重复度与低质风险。\n\n4、优化收录效率，通过蜘蛛引导、批量提交、外推等手段提升收录率与速度。\n\n5、监控批量站点数据，输出效果分析与优化报告。\n\n6、处理降权、掉收录、排名波动等异常，做好备份与切换，保障流量盘稳定。\n\n7、跟踪百度算法动态，前置评估影响并调整方案。\n\n岗位要求\n\n1、3 年以上百度 SEO 经验，必须有独立操作泛站的完整案例，可展示收录与流量数据。\n\n2、熟悉泛解析原理与配置，掌握主流站群程序或自研系统，会评估老域名，了解服务器与 IP 分散部署。\n\n3、懂站点架构、robots、sitemap、加载速度与移动端适配；熟悉 HTML、PHP，能改模板、排故障。\n\n4、熟练使用 5118、爱站、百度统计、百度站长平台，能处理成百上千站点的批量数据。\n\n5、会 Python 或 Shell，能自己写批量建站、采集、监控类工具。\n\n6、细致、数据敏感、有风险意识，结果导向。", "cat": "运营与市场"}, {"id": "37", "title": "产品经理", "salary": "20-40K", "location": "", "jd": "1.负责投放系统 / 渠道系统的产品规划与迭代\n2.建设投放配置、渠道管理、规则引擎等核心能力\n3.推动投放流程自动化，提升投放效率与规模能力\n4.支撑投放团队日常放量、调价与效果分析\n5.协同广告系统、数据中心，保障投放数据一致性\n\n1.3–7 年产品经理经验，有买量 / 渠道 / 投放系统经验\n2.熟悉主流广告投放流程及相关平台\n3.具备数据分析能力，能基于数据优化产品设计\n4.执行力强，能推动复杂需求落地\n5.必须有toB相关经验\n6.运营系统和数据中心（DMP）相关经验加分", "cat": "产品与管理"}, {"id": "38", "title": "高级运营", "salary": "20-35K", "location": "", "jd": "岗位职责：\n\n1. 负责视频内容运营体系搭建，制定长期运营策略与发展规划\n2. 主导视频内容选题策划与分发管理，监控热点动态，把握市场最新优质视频内容趋势\n3. 分析视频运营数据，从数据中提炼优化方向，持续迭代运营方法论\n4. 独立孵化运营产品，提供从 0 到 1 的成功案例支撑\n5. 整合并落地项目资源，推动跨部门协作，达成业务增长目标\n\n任职要求：\n\n1. 5年以上中大型网站或平台运营经验\n2. 有视频运营相关经验，熟悉主流视频平台（优酷、爱奇艺、B站、抖音等）运营规则\n3. 对视频市场保持高度敏感度，能快速识别并跟进最新热门内容动态\n4. 具备独立孵化运营产品能力，有从 0 到 1 的成功案例\n5. 具备可落地的项目资源，有明确资源整合方向与执行能力\n6. 具备项目管理经验，能够推动多项目并行\n7. 善于沟通协作，有跨团队协同经验优先", "cat": "运营与市场"}, {"id": "39", "title": "中级运营", "salary": "10-20K", "location": "", "jd": "岗位职责：\n\n1. 负责视频内容运营，包括但不限于视频选题策划、内容分发及数据追踪\n2. 监控视频平台热点动态，及时掌握市场最新优质视频内容趋势\n3. 分析视频运营数据，优化内容策略，提升用户活跃与留存\n4. 协助产品增长目标，制定并执行日常运营方案\n\n任职要求：\n\n1. 3 年以上中大型网站或平台运营经验\n2. 有视频运营相关经验，熟悉主流视频平台（优酷、爱奇艺、B站、抖音等）运营规则\n3. 对视频市场保持敏感度，能快速识别并跟进最新热门内容动态\n4. 具备数据分析能力，能从数据中提炼优化方向\n5. 善于沟通协作，具备跨部门协同经验优先", "cat": "运营与市场"}, {"id": "40", "title": "运维助理", "salary": "10-15k", "location": "要求员工base国内或者中国台湾地区；", "jd": "岗位职责\n（一）K8s服务器运维\n- 熟练操作K8s集群，负责部署、配置、监控及故障排查，管理Pod、Service等核心资源，保障集群稳定运行。\n- 优化K8s组件运维，推进IaC实践，使用Terraform、Helm等工具实现集群自动化部署；搭建监控告警体系，快速处置异常并输出优化方案。\n- 配合研发完成容器化改造，优化Docker镜像流程，衔接CI/CD流水线，实现研发交付自动化。\n（二）海外服务器统筹管理\n- 协助负责人管理海外多区域200台服务器，完成初始化、安全加固及资产台账管理，确保资产可追溯。\n- 负责海外服务器日常监控与故障处置，制定应急预案，保障海外业务连续性，处理网络、合规及安全相关问题。\n- 优化服务器资源分配，配合海外业务团队提供技术支持；建立运维规范，推动运维自动化。\n（三）DevOps体系与协同支持\n- 优化CI/CD流水线，推动研发运维一体化，提升交付效率；选型并开发运维自动化工具，解决重复性工作。\n- 对接各团队提供DevOps技术支持，协助负责人开展团队培训，参与重大故障排查与优化。\nPS:需具备较强的问题解决、跨区域协同及应急处置能力，能独立承担核心运维任务，助力全球业务稳定发展", "cat": "技术开发"}, {"id": "41", "title": "高级VPN运营", "salary": "15-30k", "location": "", "jd": "岗位职责\n\n1. 负责VPN产品整体运营策略制定与落地，构建从用户获取、激活、留存到付费转化的完整运营体系\n2. 深度分析产品核心数据指标（DAU、付费率、ARPU、留存率、流失率等），独立完成数据拆解与归因分析，驱动运营决策\n3. 主导用户增长专项，制定并执行拉新、促活、召回等运营方案，持续提升用户规模与付费转化\n4. 跟踪竞品动态及行业趋势，结合用户行为数据持续迭代运营方法论\n5. 协同产品、技术、市场团队推动运营方案落地，确保各项目按节点交付\n6. 建立运营数据看板，定期输出运营报告，为产品迭代和商业决策提供数据支撑\n\n**任职要求**\n\n1. 5年以上互联网产品运营经验，有VPN、工具类或海外产品运营经验者优先\n2. 有完整的运营体系搭建经验，能从战略层面规划运营方向并拆解落地\n3. 极强的数据敏感度，能独立完成数据分析、问题定位及策略优化闭环\n4. 具备清晰的运营逻辑思维，能将业务目标拆解为可执行的运营动作\n5. 有带领运营团队或主导跨部门协作的经验，执行力强\n6. 适应快节奏迭代环境，结果导向\n\n**加分项**\n\n- 有付费订阅类产品运营经验\n- 熟悉海外市场用户行为及增长策略\n- 有用户分层运营及精细化运营实战经验\n- 有工具类产品从0到1孵化成功案例", "cat": "运营与市场"}, {"id": "42", "title": "中高级漫画运营", "salary": "15-30K", "location": "", "jd": "**高级动漫运营岗位 JD**\n\n岗位职责\n\n1. 负责动漫内容全链路运营，涵盖内容筛选引入、更新排期、分发策略制定，从0到1搭建及维护动漫内容生态。\n2. 主导动漫用户增长策略，结合二次元用户偏好设计拉新、促活、召回方案，实现用户规模与使用时长持续增长。\n3. 搭建内容质量分级体系，基于点击率、完读/完播率、追更率等数据动态调整资源位与流量分配，提升优质番剧/漫画曝光效率。\n4. 建立用户反馈反哺机制，跟踪评论区、弹幕等社区数据，反哺选品与内容排期优化，提升用户粘性与追更率。\n5. 制定内容标签与题材分类体系，联动算法/技术团队优化个性化推荐链路，提升内容分发效率与人均观看时长。\n6. 统筹动漫业务日活/GMV目标，输出可复用的选品与运营方法论，支撑团队指标达成。\n\n任职要求\n\n1. 5年以上互联网内容行业运营经验，其中3年以上动漫/二次元/ACG内容平台运营经验，须有内容行业背景。\n2. 深度熟悉二次元圈层文化、热门IP及题材趋势，对动漫/漫画市场保持高度敏感度。\n3. 有从0到1搭建内容生态或冷启动成功案例，独立操盘过日活规模化增长项目。\n4. 具备扎实的数据分析能力，能独立完成内容标签体系、流量分配模型的搭建与迭代。\n5. 熟悉内容分发算法协同逻辑，有与算法团队联合优化推荐策略的实际经验。\n6. 具备较强的团队管理与跨部门协作能力，有带教/培养团队经验者优先。\n\n加分项\n\n- 有漫画/番剧/轻小说等多品类内容生态搭建经验\n- 有独立主导追更率/留存提升专项且有清晰数据结论与方法论沉淀", "cat": "运营与市场"}, {"id": "43", "title": "运营客服（12小时轮班）", "salary": "8-15k", "location": "人选在越南或英国", "jd": "岗位职责\n负责日常商户咨询接待，及时响应并处理商户提出的问题。\n负责订单查询、订单核实、补单、掉单、异常订单跟进及处理。\n协助商户解决支付过程中出现的各类问题，提高商户满意度。\n跟进各支付通道运行情况，及时反馈异常信息，并协助推动问题解决。\n根据业务流程完成数据登记、信息整理及工作日报提交，确保数据准确、完整。\n对接财务、运营、技术等相关部门，协助完成订单核对、异常处理及业务协调。\n熟练使用公司各类后台系统及AI工具，提高工作效率和处理质量。\n严格执行公司业务流程及保密制度，确保客户信息及业务数据安全。\n完成上级安排的其他工作事项。\n\n岗位要求\n年龄20-35岁，学历不限制\n具备良好的服务意识及沟通表达能力。\n工作认真细致，责任心强，具备较强执行力。\n能接受轮班及节假日值班安排。\n熟练使用电脑办公软件（Word、Excel、WPS）。\n具备较强的数据分析及问题判断能力。\n抗压能力较强，能够适应高并发业务环境。\n\n优先条件\n有支付行业、互联网客服、运营客服经验优先。\n有支付、金融、电商相关工作经验优先。\n熟悉USDT、银行卡、支付宝、微信等支付产品者优先。\n熟悉AI办公工具（如ChatGPT、Claude等）并能够提升工作效率者优先。", "cat": "运营与市场"}, {"id": "44", "title": "推荐与广告算法产品经理", "salary": "20-40K", "location": "", "jd": "推荐与广告算法产品经理\n\n岗位职责\n\n负责公司视频、小说、漫画等内容场景的推荐系统产品建设，以及基于用户画像、兴趣标签和行为特征的广告推荐能力建设，推动用户行为数据、内容特征、广告数据与算法能力形成完整闭环。\n\n1. 内容推荐系统\n\n • 负责视频、小说、漫画等内容推荐系统的产品规划、需求设计及持续迭代。\n • 负责推荐场景梳理与产品设计，包括首页推荐流、猜你喜欢、相关推荐、内容详情页推荐、完播/完读后推荐等场景。\n • 参与推荐系统召回、粗排、精排、重排等核心链路的产品设计，与算法团队共同定义各阶段目标及策略。\n • 根据不同内容形态设计推荐目标，综合考虑 CTR、播放/阅读深度、完播/完读率、互动、留存、付费及长期用户价值。\n • 负责冷启动、探索与利用、热门内容、新内容扶持、兴趣衰减、多样性、去重、频控等推荐策略的产品设计。\n • 推动推荐策略配置化、实验化，建设策略管理、实验管理、效果监控及异常预警能力。\n • 建立推荐效果评估体系，通过 A/B Test、用户分层、漏斗分析等方式持续评估算法策略对业务指标的实际贡献。\n\n2. 用户画像与标签应用\n\n • 与 DMP / 数据团队共同建设推荐所需的用户特征体系，包括用户兴趣、内容偏好、活跃度、生命周期、消费能力、广告行为等特征。\n • 明确用户标签、实时行为特征、统计特征及算法 Embedding 等不同数据能力的使用边界。\n • 设计用户兴趣随行为变化的更新与衰减机制，支持短期兴趣与长期兴趣结合。\n • 推动用户、内容、场景等特征在推荐系统中的标准化接入与复用。\n • 参与用户冷启动、匿名用户、跨端用户识别等场景的推荐方案设计。\n\n3. 广告推荐与商业化\n\n • 负责基于用户画像、兴趣标签、行为特征及广告属性的广告匹配与推荐能力建设。\n • 建设广告候选集、定向条件、用户与广告匹配、频次控制、广告过滤等基础能力。\n • 与广告平台、DMP及算法团队协作，推动用户特征在广告推荐和商业化场景中的合理使用。\n • 参与广告 CTR、CVR、eCPM 等预估与排序策略的产品设计，并持续评估广告收益与用户体验之间的平衡。\n • 支持广告推荐效果分析，包括曝光、点击、CTR、转化、收入、eCPM、用户负反馈等指标。\n • 设计广告实验与流量分层机制，评估不同广告策略对广告收入、内容消费、留存及用户长期价值的影响。\n • 支持广告系统后续从规则匹配逐步向个性化推荐、智能排序及收益优化演进。\n\n4. 数据与实验体系\n\n • 建立推荐系统完整的数据指标体系，定义曝光、点击、播放、阅读、完播/完读、互动、留存、付费、广告转化等核心指标口径。\n • 与数据团队共同完善推荐与广告相关埋点、日志、特征及数据回流链路。\n • 建设推荐策略效果看板、模型版本看板、实验看板及异常监控体系。\n • 推动形成“用户行为 → 数据采集 → 用户/内容特征 → 模型训练 → 推荐结果 → 用户反馈 → 模型迭代”的完整闭环。\n • 能够识别 CTR 等短期指标与留存、LTV 等长期指标之间的冲突，合理设计推荐系统的评估指标与护栏指标。\n\n任职要求\n\n • 5 年以上互联网产品经验，3 年以上推荐、搜索、广告算法、增长算法或相关数据产品经验。\n • 有视频、小说、漫画、资讯、短剧、游戏、电商等大规模内容或推荐场景经验优先。\n • 真正参与过推荐系统建设，理解召回、粗排、精排、重排的基本工作机制及各阶段解决的问题。\n • 理解协同过滤、Embedding、向量召回、CTR/CVR 预估、Learning to Rank 等常见推荐算法的基本原理，不要求承担算法研发，但能够与算法工程师进行深入需求和方案沟通。\n • 熟悉推荐系统常见指标，包括 CTR、播放率、完播率、阅读深度、互动率、留存、付费率等，能够根据不同业务场景设计合理的目标指标。\n • 熟悉 A/B Test、实验分流、实验组/对照组、统计显著性及实验效果评估。\n • 具备较强的数据分析能力，能够通过数据发现推荐策略、内容供给或用户分层中的问题。\n • 理解用户画像、标签、实时特征、行为序列及内容特征在推荐系统中的作用。\n • 有广告推荐、广告排序、DMP、DSP、SSP、广告定向或程序化广告相关经验者优先。\n • 有大 DAU、高并发推荐系统经验者优先。\n\n核心能力要求\n\n我们重点关注候选人是否具备以下能力：\n\n 1 算法产品理解能力\n    能够理解推荐系统内部链路，知道召回、排序、策略和模型分别解决什么问题，而非只负责推荐页面和运营规则。\n 2 数据与指标能力\n    能够独立定义推荐效果指标，理解 CTR、完播/完读、留存、收入、LTV 等指标之间的关系，并能够设计实验验证方案。\n 3 用户理解能力\n    能够把用户行为转化为兴趣、偏好、生命周期等可供推荐系统使用的特征，并理解实时兴趣与长期兴趣的差异。\n 4 系统产品能力\n    能够设计推荐策略管理、实验平台、效果监控、模型版本管理等后台能力，将算法能力产品化、平台化。\n 5 商业化理解能力\n    能够理解内容推荐与广告推荐目标的差异，兼顾用户体验、内容消费和广告收入，避免单纯追求 CTR 或短期 eCPM。\n 6 跨团队推进能力\n    能够独立完成需求分析、PRD、原型、指标定义、技术与算法评审、研发推进、上线验收及效果复盘，与算法、数据、客户端、服务端、运营及广告团队协同推进项目。\n\n加分项\n\n • 有千万级 DAU 产品推荐系统经验。\n • 有短视频、长视频、小说、漫画、短剧等内容推荐经验。\n • 有广告推荐、广告排序或商业化算法产品经验。\n • 有 DMP / CDP / 用户画像平台建设经验。\n • 有搜索排序、向量检索、RAG 或 Embedding 相关产品经验。\n • 有推荐实验平台、特征平台、策略平台或模型管理平台建设经验。\n • 具备 SQL、Python 或数据分析能力，能够独立完成基础数据验证与问题定位。\n\n该岗位需要解决的核心问题\n\n • 如何判断一个用户当前最可能消费什么内容？\n • 如何同时利用长期兴趣和最近几分钟、几小时产生的短期兴趣？\n • 视频、小说、漫画三种内容是否应该共用一套用户兴趣体系，哪些能力可以复用，哪些需要独立建模？\n • 如何解决新用户、新内容和低曝光内容的冷启动问题？\n • 如何避免推荐系统为了提高 CTR 持续推荐标题党或低质量内容？\n • 如何衡量一次推荐策略升级究竟提高了短期点击，还是提高了长期留存与用户价值？\n • 如何在内容推荐流中合理插入广告，同时控制用户疲劳和负反馈？\n • 如何利用用户兴趣、消费能力、广告行为等特征提高广告匹配效率？\n • 如何判断哪些用户应该减少广告，哪些用户可以提高商业化强度？\n • 如何建立内容推荐、广告推荐、DMP、数据中心之间清晰且可长期演进的系统边界？", "cat": "产品与管理"}, {"id": "45", "title": "内容生产总监", "salary": "30-50K", "location": "工作地点：国内", "jd": "【岗位职责】\n1. 盘活存量：统筹管理现有内容采集团队，优化内容筛选机制，提升现有业务流水线效率；\n2. 拓展增量：从0到1组建并管理内容生产团队，主导“视频剪辑、视频深度二创、短剧生成”等新业务的落地与量产；\n3. 产能统筹：协助一号位进行整体团队管理，拉通采集组与自产组资源，协调并大幅拉升各组产能；\n4. 体系搭建：建立从内容策划、制作到审核分发的工业化SOP标准。\n\n【任职要求】\n1. 懂内容：具备扎实的内容生产与策划能力（资深编辑、新媒体主编、短视频操盘手出身），网感极佳；\n2. 懂视频与新玩法：精通短视频剪辑与深度二创玩法，对“短剧生成”、AIGC辅助内容生产有实操经验或深入研究；\n3. 懂管理：具备成建制内容团队（几十人规模）的实战管理经验，懂“工业化流水线”作业，能带兵打仗拿结果；\n4. 懂战略：不只是执行者，必须具备业务视角的战略眼光，能为业务从“单纯采集”向“自产内容生态”转型提供破局思路。", "cat": "内容与创作"}, {"id": "46", "title": "AI短剧编剧", "salary": "10K-20K", "location": "", "jd": "【岗位定位】\n负责 AI 内容项目的整体创意策划与质量把控，从剧本构思到最终成片，对作品的内容质量与传播效果负责。\n【岗位职责】\n根据运营需求完成 AI 短剧、剧情视频、宣传片等内容策划；\n独立完成剧本、人物设定、故事结构、分镜设计及创意方案；\n制定整体内容风格、节奏、镜头语言及画面表现形式；\n指导 AI 创作者完成角色、场景及视频素材生成；\n与剪辑、设计等岗位协同，推进项目按计划落地；\n对最终成片进行内容质量审核，把控整体表现（涉及合规/风险的内容，需按公司要求同步相关审核）；\n持续研究行业爆款，总结创作方法，优化团队创作流程。\n【任职要求】\n有短剧、影视、自媒体、广告等内容策划经验，具备优秀的故事创作与剧本能力；\n熟悉短视频传播逻辑及用户喜好，具备较强的审美与画面感；\n沟通协调能力好，能推动团队协作完成项目；\n有 AI 内容创作经验者优先；真人影视/短剧背景者，需具备转型 AI 内容创作的意愿与能力（我们的内容方向以 AI 生成为主，纯真人制作背景、且无转型意愿者不匹配）。\n【加分项】\n熟悉 ChatGPT、Claude 等 AI 创作工具；\n有导演、影视、广告行业经验，或有爆款内容案例；\n熟悉海外内容平台。", "cat": "内容与创作"}, {"id": "47", "title": "高级剪辑", "salary": "10K-20K", "location": "", "jd": "【岗位定位】\n负责 AI 内容制作全流程，从 AI 素材生成到视频包装，独立完成高质量内容输出，对最终成片效果负责。\n【岗位职责】\n根据剧本完成 AI 图片、视频等素材生成，使用 AI 工具制作角色、场景、镜头及动画；\n独立完成视频剪辑、字幕、配音、转场及节奏优化；\n完成封面、海报、宣传图等平面设计工作；\n持续优化 AI 生成效果，提升内容质量与制作效率；\n与编剧保持沟通，确保作品风格统一；\n建立 AI 创作素材库及项目模板，提高团队复用效率。\n【任职要求 · 必备】\n熟练掌握 Premiere、剪映、Final Cut、DaVinci 等至少一款剪辑软件；\n对镜头节奏、画面构图及视觉表达有较强理解，审美与内容包装能力强；\n能独立完成从素材制作到最终成片的全部流程。\n\n【任职要求 · 熟悉即可（可入职后补齐）】\n熟悉 Midjourney、Flux、Runway、Veo、Kling、即梦等 AI 生成工具；\n熟悉 Photoshop、Figma、Canva 等设计工具。\n\n【加分项】\n\n有 AI 短剧制作经验或影视后期经验；\n熟悉 AIGC 工作流；\n熟悉短视频平台内容传播规律。", "cat": "内容与创作"}, {"id": "48", "title": "高级安全攻防工程师（管理经验优先）", "salary": "35k-70k", "location": "", "jd": "岗位职责\n负责公司网络安全攻防体系规划和团队日常管理。\n制定安全测试及红蓝对抗计划。\n组织对公司网站、APP、API、服务器和云环境进行授权渗透测试。\n负责重大安全事件的研判、指挥、止损、溯源和复盘。\n建立攻防测试授权、操作审计、漏洞分级和修复验收机制。\n协调运维、研发、测试、CDN及各公司技术负责人完成安全整改。\n评估新的攻击方式，并转化为内部防护方案。\n向CTO输出集团安全风险报告和重点整改建议。\n\n任职要求\n5年以上网络安全、渗透测试或应急响应经验。\n熟悉Web、API、APP、主机、容器、云环境的常见攻击面。\n能独立处理入侵、黑链、盗流、域名劫持、DNS污染、DDoS、数据泄露等事件。\n熟悉Linux、Nginx、CDN、WAF、MongoDB、Redis、Kafka等常见环境的安全风险。\n熟悉Go、Java、PHP中至少两种技术栈的代码安全问题。\n具备较强的跨团队推动和风险判断能力。\n有大型互联网业务、红蓝对抗或重大应急事件经验优先。", "cat": "安全攻防"}, {"id": "49", "title": "高级Java工程师（推荐系统方向）", "salary": "25-40K", "location": "", "jd": "岗位职责\n1.  参与项目组产品评审，根据需求进行功能梳理、开发计划及相关技术文档编写\n2.  参与项目组的任务开发，包括后台模块、接口开发\n3.  协作团队顺利推进项目进度，解决疑难问题\n4.  在计划内协作完成项目的交互，对项目实施提供支持和优化建议。\n\n任职要求\n1.  全日制本科及以上学历，计算机、软件工程等相关专业；\n2.  五年以上Java开发经验，有移动端互联网短视频相关行业经验者优先；\n3.  熟练掌握 Spring Boot/Spring Cloud、Dubbo、ZooKeeper、MyBatis、MySQL、MongoDB、Redis、RabbitMQ 等技术；\n4.  熟悉常见的中间件、分布式解决方案及其原理：分布式缓存、微服务、云原生、消息中间件、负载均衡、连接池等；\n5.  具备较强的分析设计能力，能够根据业务需求设计合理的技术解决方案。\n6.行业筛选做web3/区块链/包网/BC暂不考虑\n7.必须要有推荐系统相关经验，内容推荐或广告推荐", "cat": "技术开发"}, {"id": "50", "title": "AI 内容训练师", "salary": "9k-14K", "location": "", "jd": "我们在做什么\n我们自研了一套多模态内容理解系统,每天处理数万次内容判定。模型能力的上限,取决于喂给它的数据质量 —— 这就是这个岗位的价值:你标什么,模型就学成什么样。\n岗位职责\n一、模型训练数据生产\n1.按标签体系对图片、视频、文本做合规性标注,输出违规类型、风险等级与判定依据。\n2.标注视频精彩片段、图片组优选结果 —— 这部分靠内容判断力:哪一帧适合做封面、哪一段值得推荐,标准不是死的。\n3.对「检索词 — 召回内容」做相关性打分,标注错召、漏召样本。\n二、内容生产与校对\n4.为模型撰写标准范例:针对视频/图片撰写标题、摘要、素材描述,作为模型学习的黄金样本。\n5.校对模型生成的标题与描述,判断是否准确、是否过度弱化或过度暗示,给出修改后的正确版本。\n6.复核线上模型误判样本,给出正确结论并归因,回流训练集。\n7.维护标注进度与质量看板,输出日/周数据;跟进业务方反馈的问题样本;记录规范执行中的歧义点并提报。\n三、质量与标准（高级）\n8.质量把关:抽检团队产出(抽检率 ≥10%),计算准确率与多人一致性,输出质检报告。\n9.标准制定:维护标注规范与标签体系,把「什么算精彩」「什么算好标题」这类主观判断,收敛成可执行的文档。\n10.黄金样本集建设:主导优质范例的撰写与评审,这套样本直接决定模型的输出上限。\n11.训练集管理:管理已标注数据的版本、分布与去重,避免类别塌陷。\n12.效果闭环:跟踪模型上线后准确率变化,定位是数据问题还是模型问题,反向指导下一轮标注重点。\n13.组织团队培训与对齐会,仲裁歧义样本。\n任职要求\n●大专及以上\n●有内容感知力 —— 能说清楚「这个封面为什么比那个好」「这个标题差在哪」。这是本岗位最看重的一点,比学历和过往经验都重要\n●文字表达通顺,能独立写出准确、不夸张的内容描述与标题\n●性格稳定、耐心细致,能长期执行标准化流程\n●熟练使用电脑与基础办公软件\n●保密意识强,严格遵守数据安全规定\n加分项\n●有内容编辑、新媒体、短视频、内容平台、数据标注或内容审核相关经验\n●1 年以上相关经验,做过质检或带过小团队\n●能把主观判断写成客观规范 —— 本岗位最核心也最稀缺的能力,面试重点考察\n熟练使用 Excel(透视表、基础函数);了解准确率/召回率等基本概念,或愿意快速学习", "cat": "内容与创作"}, {"id": "51", "title": "商务数据分析专员", "salary": "7-10k", "location": "", "jd": "岗位职责：\n一、广告主效果分析\n跟踪各广告主投放数据（曝光、点击、CTR、转化、ROI），定期输出客户效果报告\n对比不同广告类型（棋牌、播放器、直播、约炮等）的整体效果表现，发现高价值/高风险客户\n分析客户续费率与投放效果的关系，为商务团队续约谈判提供数据支撑\n监控异常数据（点击作弊、转化突降），及时预警并协助排查\n二、产品广告效果分析\n分析APP内各广告位的点击率、完播率、用户行为路径\n按用户画像（新老用户、活跃度、地域、设备）拆分广告响应差异\n追踪广告对用户留存和活跃的影响，平衡变现与用户体验\n三、广告位优化\n梳理全部广告位分布，如（启动页、banner、信息流、插屏等），建立位置效果矩阵\n通过A/B测试评估不同位置、尺寸、频次的收益差异，输出优化建议\n协助产品团队调整广告加载策略和展示逻辑，提升整体eCPM\n定期输出广告库存利用率分析，识别未充分变现的流量\n四、商务运营数据支持\n搭建商务团队日常看板：收款进度、目标完成率、客户结构、到期预警\n为定价策略提供数据依据（按位置/类型/时段的市场价对比）\n协助商务做客户提案——根据广告主行业和预算推荐投放组合方案\n月度/季度商务复盘报告，识别业绩波动原因和增长机会\n\n任职要求\n1:大专及以上学历，1年以上数据分析经验，有互联网广告、流量变现或内容平台方向优先\n2:熟练Excel/Google Sheets（数据透视、VLOOKUP、条件函数等）\n3:用过数据看板工具（Tableau、Metabase或类似的都行）\n4:有数据敏感度，看到数据波动能主动追原因，不是只出报表\n5:能接受成人内容行业，心态开放不抵触\n6:沟通直接，能把数据结论讲清楚给非技术同事听\n\n加分项：\n熟悉广告变现指标（CPM、CPC、CPA、eCPM等）\n会Python做批量数据处理或自动化报表\n做过广告位优化、用户分层或A/B测试相关工作\n有视频/直播/内容平台的从业经验", "cat": "运营与市场"}, {"id": "52", "title": "AI美术师", "salary": "10K-20K", "location": "", "jd": "职位描述： 用生成式影像为故事提供视觉支撑，为角色注入灵魂，。\n核心职责：\n1.        视觉开发： 结合剧本和导演意图，利用AI图像工具创作具备“电影级质感”的关键帧。\n2.        核心资产生成与管理： 负责场景概念设定、角色设计及核心视觉资产的生成与优化，确保整体视觉风格的高度统一。\n3.        服务于故事的美学表达： 以叙事为驱动力，通过美术设定（服装、道具、场景细节）来暗示人物背景、强化矛盾冲突、烘托本土化的情绪氛围。\n任职要求：\n1.        叙事本位的美术思维： 深刻理解“美术是为了讲故事”，能准确捕捉并视觉化剧本中的情感内核。\n2.        极高的审美标准： 对光影、构图、色彩搭配有严苛的要求，能驾驭高品质的电影感视觉风格。\n3.        精通AI绘画工具： 熟练使用MJ、SD等工具，具备极强的生图控制力（如角色一致性控制、局部重绘、精准的光源及材质表达）。\n4.        扎实的美术基本功： 熟练掌握PS等后期修图软件，具备优秀的手绘基础或传统CG（Blender/Maya）经验，能对AI生成结果进行精细的后期处理与拼贴修正。\n5.        加分项： 对于comfyui等AI工作流有过深入研究。", "cat": "内容与创作"}, {"id": "53", "title": "运营主管", "salary": "30k-50K", "location": "", "jd": "岗位职责\n负责所辖产品线(APP/WEB 内容产品)的整体运营,对 DAU、留存、付费/变现及 ROI 等核心指标负责;\n制定并落地用户增长与运营策略,统筹内容运营、渠道投流配合、活动配置、用户召回与留存提升;\n搭建并带领运营团队,拆分目标、排期与分工,带团队达成业务指标;\n数据驱动:建立新增—活跃—留存—付费漏斗的监控体系,定位问题、快速迭代;\n跨部门协同:与产品、技术、投放、SEO、商务紧密配合,打通\"流量获取—产品—变现\"闭环;\n复盘渠道效果与获客成本(CAC),优化投放与变现结构,持续提升人效与产出。\n任职要求\n本科及以上(重点院校或头部互联网公司背景优先);5 年以上互联网 C 端产品/内容运营经验、3 年以上团队管理经验,带过 10 人以上团队或独立操盘过完整产品线;\n有高流量 C 端产品/内容分发平台背景,主导过百万级 DAU 或规模化用户增长/变现项目,并有可量化的硬结果(DAU、留存、ROI、GMV 等);\n极强的数据驱动能力,能独立搭建指标体系,用数据(DAU/留存/LTV/ROI/漏斗)做决策与复盘;\n精通买量投放、内容运营、活动运营中至少两项,深刻理解从流量获取到变现的完整链路与经济模型(CAC/LTV/回收比);\n目标感与结果导向极强、能扛指标、抗压,能在快节奏下带团队持续拿结果;\n优秀的跨团队沟通、资源协调与团队搭建/人才培养能力。\n加分项\n有短剧 / 工具类 / 矩阵型产品运营经验;\n有完整 SEO 或渠道投流落地经验;\n有从 0 到 1 搭建运营体系或团队的经验。", "cat": "运营与市场"}, {"id": "54", "title": "SEO主管", "salary": "20-40K", "location": "", "jd": "SEO 主管\n\n岗位职责\n\n1、负责 SEO 业务整体策略与目标,对关键词排名、收录、流量及最终收款/转化结果负责,制定并落地月度、季度增长计划。\n\n2、白帽方向:搭建站内结构与技术 SEO、内容体系、优质外链矩阵,建立可持续、抗算法波动的排名基本盘。\n\n3、黑帽方向:熟练运用站群、快排、蜘蛛池、寄生虫、PBN、外链矩阵等快速起量手段做到规模化上词,同时能精准把控 K 站、降权、沙盒的风控边界,做到\"起得快、也扛得住\"。\n\n4、搭建关键词库、竞品监控、排名与流量数据看板,数据驱动优化投放与内容策略。\n\n5、带团队:负责 SEO 团队的分工、目标拆解、过程管控与人才培养,输出可复制的方法论与 SOP。\n\n6、跟踪百度、谷歌等主流引擎的算法更新,第一时间评估影响并调整策略,保障业务连续性。\n\n任职要求\n\n1、5 年以上 SEO 一线实操经验,2 年以上团队管理经验;学历不限,能力与实操案例说话。\n\n2、黑白帽双精通,必须有独立把大批量关键词做到首页/高权重的实操战绩,面试需用真实数据和案例佐证(排名、流量、收款量级)。\n\n3、精通站群、快排、蜘蛛池、寄生虫、外链等黑帽技术,并深刻理解各手段的风险边界与规避打法。\n\n4、熟悉百度/谷歌/必应等主流搜索引擎的排名机制与算法更新规律。\n\n5、懂技术:熟悉 HTML、网站结构、服务器、CMS、采集与批量建站,能与研发高效协作、自己也能上手搭站调站。\n\n6、数据敏感,熟练使用 5118、爱站、站长工具、Ahrefs、GSC 等 SEO 工具。\n\n7、结果导向,抗压能力强,能扛住量化 KPI(排名/流量/收款)。\n\n加分项\n\n有大规模站群或百万级流量站操盘经验;有谷歌 SEO/外贸多语言经验;自带外链、蜘蛛池、域名、服务器等资源;有网赚、流量站或垂直行业 SEO 背景。", "cat": "运营与市场"}, {"id": "55", "title": "ai编导", "salary": "10K-20K", "location": "", "jd": "岗位职责\n1. 负责 AI 短剧项目整体导演工作，包括剧本理解、剧情拆解、分镜设计、镜头调度及成片质量把控。\n2. 根据剧情设计景别、构图、运镜、人物表演及镜头衔接，强化人物情绪、剧情冲突及关键爆点。\n3. 将剧本转化为可执行的 AI 视频制作方案，明确镜头画面、人物动作、情绪及生成要求。\n4. 指导 AI 生成师使用 Seedance、可灵、ComfyUI 等工具完成镜头制作，并针对生成结果提出明确修改意见。\n5. 把控短剧整体节奏、人物一致性、画面连续性及剧情表达，与编剧、生成师、剪辑协作完成最终成片。\n6. 持续关注 AI 视频新技术及短剧市场趋势，不断优化制作流程和成片效果。\n\n任职要求\n1. 具备较强的导演思维、剧情理解能力及镜头语言能力，有短剧、影视、广告、动画、漫剧等相关导演经验。\n2. 熟悉短剧的剧情节奏、人物关系、情绪递进、冲突爆点及反转设计。\n3. 具备 AI 视频制作经验，熟悉 Seedance、可灵等主流 AI 视频工具，对 ComfyUI 工作流及 AI 视频生成逻辑有一定了解。\n4. 有半年以上 AI 短剧导演或相关项目经验，能够独立完成从剧本到成片的导演工作。\n5. 需提供个人作品或参与项目案例。\n\n加分项\n有擦边、成人向或强剧情短剧导演经验，有成熟爆款作品或完整 AI 短剧项目经验者优先。", "cat": "内容与创作"}, {"id": "56", "title": "AI成人短剧编剧", "salary": "10-13k", "location": "", "jd": "岗位职责：\n负责AI成人短剧剧本的原创与改编，独立完成分集大纲、对白与分镜设计\n把控剧情节奏、情绪张力与成人内容尺度，确保故事完整且具有传播性\n使用AI工具进行剧本优化、分镜调整与多轮内容迭代\n与生成、剪辑团队紧密配合，保障剧本最终落地效果\n任职要求：\n具备扎实的编剧功底，熟悉成人短剧的叙事结构与节奏把控\n热爱AI，有AI视频/短剧相关经验或强烈兴趣\n能独立完成高完成度剧本，对情欲表达、人物情绪与镜头语言有敏锐感知\n有成人向内容创作经验者优先\n沟通顺畅，能高效配合团队完成内容交付", "cat": "内容与创作"}, {"id": "57", "title": "AI成人短剧剪辑师", "salary": "10k-12k", "location": "", "jd": "岗位职责\n- 负责 AI 成人向短剧、剧情视频及动画内容的剪辑、声音设计和后期包装；\n- 对 AI 生成的图片、视频、对白、配音及音效素材进行筛选与整合；\n- 通过镜头节奏、反应镜头、声音和留白强化暧昧感、情欲张力及人物关系；\n- 优化开场钩子、冲突节点、情绪高潮和结尾卡点，提高完播率与追看欲；\n- 使用 AI 工具完成补帧、扩图、画面修复、口型同步、素材生成及局部调整；\n- 处理人物变形、角色漂移、画面闪烁、动作断裂及镜头不连贯等常见问题；\n- 根据不同平台要求，控制成人向内容的表现尺度，输出相应版本。\n任职要求\n- 熟练使用剪映、Premiere、Final Cut Pro、DaVinci Resolve或同类剪辑软件；\n- 必须掌握至少一种 AI 图片或视频生成工具，能够独立补充所需素材；\n- 熟悉成人向、两性情感或强情绪短剧的剪辑节奏；\n- 对人物呼吸、眼神、肢体距离、声音氛围及情绪停顿具有较强感知；\n\n- 网感强，理解短视频用户的观看习惯及内容钩子；\n- 有成人向短剧、剧情号、漫剧或信息流视频作品者优先。", "cat": "内容与创作"}, {"id": "58", "title": "AI成人短剧生成师", "salary": "10k-12k", "location": "", "jd": "岗位职责\n- 根据成人向短剧剧本、角色设定及导演分镜，生成所需图片和视频素材；\n- 负责成年角色定妆、人物形象、服装造型、场景氛围及关键画面设计；\n- 编写并持续优化图片、视频生成提示词，准确呈现暧昧、浪漫、危险感及情绪拉扯；\n- 通过构图、光影、服装、表情和肢体距离营造成熟的成人向视觉氛围；\n- 保持同一项目中人物面貌、身材特征、服装、场景和画风的一致性；\n- 针对角色漂移、多人互动错误、肢体异常及动作失真进行返修；\n- 配合导演和剪辑师完成补镜、局部修改、首尾帧衔接及素材版本管理；\n- 确保所有生成内容中的角色均为明确成年形象，并符合项目合规要求。\n任职要求\n- 熟悉主流 AI 图片及视频生成工具，具备完整的生成工作流；\n- 对成年角色形象、人物魅力、暧昧氛围及情绪表达有较好审美；\n- 熟悉提示词编写、参考图控制、图生视频、首尾帧及角色一致性方法；\n- 具备基础的摄影、构图、光影、表演和镜头语言知识；\n- 能理解成人向内容需求，并将抽象氛围转化为可执行的生成方案；\n- 有 AI 短剧、成人向视觉内容、剧情广告或人物类生成案例者优先。", "cat": "内容与创作"}, {"id": "59", "title": "AI短剧内容质量审核（QC）", "salary": "10k-15k", "location": "", "jd": "我们正在寻找一位对剧情、画面和剪辑质量敏感的伙伴，负责AI短剧从剧本到成片的全流程质量把控。\n### 岗位职责\n- 审核剧本逻辑、人物设定、对白和剧情节奏；\n- 检查AI生成画面中的人物崩坏、动作异常、穿帮及连续性问题；\n- 审核剪辑成片的节奏、镜头衔接、字幕、音画同步及整体完成度；\n- 准确记录问题，并向编剧、生成师和剪辑师提出明确修改建议；\n- 对作品给出“通过、修改后通过或退回重做”的审核结论。\n### 任职要求\n- 具备良好的影视审美、剧情理解和细节观察能力；\n- 能快速发现画面、剧情及剪辑中的不合理之处；\n- 了解AI图片、AI视频常见生成问题；\n- 工作认真负责，能够清晰说明问题及修改方向；\n- 有短剧、编剧、导演、场记、剪辑、影视审核或AI视频制作经验者优先。\n### 我们更看重\n学历和履历不是唯一标准，我们更看重你的：\n- 剧情判断力；\n- 视觉找错能力；\n- 成片质量判断能力；\n- 沟通与问题反馈能力。\n### 应聘方式\n面试环节将安排一次简短审片测试，请候选人找出剧本、AI生成素材或成片中的问题，并提出修改建议。", "cat": "内容与创作"}, {"id": "60", "title": "高级视频策划导演", "salary": "15 - 25k", "location": "", "jd": "岗位职责：\n在 AI 工具已能高效生成素材的当下，\"\"镜头语言\"\"与\"\"艺术决策审美\"\" 才是真正的竞争护城河。你不仅是整个影像叙事的最终决策者，也是剧本文字与 AI 画面生成之间的关键翻译层。你需要将剧本转化为可执行的视觉蓝图，并把控从文字到画面的完整影视化转化。\n1. **剧本视觉化转化（核心职责）\n   - 负责将文字剧本逐场拆解、转制成**可用于 AI 生产的分镜头脚本**，包含景别、构图、角色站位、视线方向、运镜轨迹等完整指令信息。\n   - 为后续 AIGC 视频生成环节提供精准的视觉锚点，确保每一帧生成结果都能直接达到视频制作标准。\n2. 图像分镜产出（核心职责）\n   - 不仅输出文字化的分镜脚本，还需要产出**可视化的图像分镜**——通过 3D 布图工具进行空间预演，或使用**主流 AI 图像生成模型**快速生成分镜参考图。\n   - 图像分镜需准确传达构图、景别、光源方向与角色空间关系，作为 AIGC 视频生成专员的直接生产依据，最大限度减少生成损耗与返工。\n3. 镜头语言把控与美学筛选\n   - 设计并把控每一场戏的镜头组接逻辑（特写/中景/全景的切换节奏），严格遵守轴线规则，杜绝跳轴与视点混乱。\n   - 把控角色间的空间关系与调度；从 AI 视频生成专员产出的素材中进行专业级的**美学筛选**。\n4. 影片产出与成片把控（核心职责）\n   - 不只是出分镜就交付——需**全流程跟进影片从素材生成到成片输出**，对剪辑节奏、配音配乐、调色、字幕等关键节点进行导控。\n   - 作为成片质量的**最终责任人**，与 AI 视频生成专员、后期剪辑形成闭环协作，确保最终影片严格符合分镜阶段确立的艺术意图。\n5. \"\"1+1\"\" 双轨内容导控\n   - 按照 Sinema 的模块化生产策略，把控\"\"合规引流版（SFW）\"\"与\"\"深度版（NSFW）\"\"两套成片在叙事节奏、情绪曲线和镜头编排上的各自完整性。\n6. SOP 与模板沉淀\n   - 参与/主导分镜 SOP、Prompt 模板、风格标签库的沉淀；与技术组（Tim）协同迭代内容创作智能体 v4.5 的 RAG 标签体系，让本人的分镜方法论可被流水线复用。\"", "cat": "内容与创作"}, {"id": "61", "title": "多语言AI短剧编剧", "salary": "15K–25K", "location": "", "jd": "岗位职责：\n\n负责多语言AI短剧剧本创作，独立完成故事大纲、分集剧本与分镜脚本\n根据不同语言市场特点，灵活融入当地俚语、网络热梗与流行文化元素\n使用AI工具辅助剧本生成与优化，保证内容节奏与情绪表达\n与剪辑、生成团队协作，持续迭代剧本内容\n\n任职要求：\n\n充分熟练至少一门外语（英语、东南亚语、日语、阿拉伯语等不限）\n熟悉对应地区的俚语、网络热梗，能自然把当地梗融入短剧内容\n热爱AI，有AI内容创作或提示词优化经验优先\n具备编剧经验，对短剧节奏与受众喜好敏感\n有海外生活/留学经验或长期接触目标语言文化者优先", "cat": "内容与创作"}, {"id": "62", "title": "跨文化AI内容创作师", "salary": "15K–25K", "location": "", "jd": "围绕不同国家/地区文化背景，进行AI短剧内容策划与创作\n深度结合当地网络热梗、俚语与流行趋势，打造有强传播力的跨文化内容\n负责从创意到脚本的全流程，并用AI工具提升创作效率与质量\n持续研究海外短视频平台热点，输出符合当地审美的内容方向\n\n任职要求：\n\n充分熟练外语（语种不限，英语、东南亚语、日语、阿拉伯语等均可）\n真正懂当地文化与网络语境，能把“梗”玩活、玩准\n热爱AI，对AI短剧、短视频内容创作有热情与实践经验\n具备跨文化内容创作或海外内容运营相关经验优先\n抗压能力强，执行力高，结果导向", "cat": "内容与创作"}, {"id": "63", "title": "AI短剧本地化内容专家", "salary": "15K–25K", "location": "", "jd": "岗位职责：\n\n负责AI短剧内容的本地化改编与创作，针对特定语言市场做深度适配\n将当地俚语、热梗、文化习惯自然融入剧本与镜头表达\n使用AI工具完成剧本优化、分镜调整与内容迭代\n与生成、剪辑团队紧密配合，确保本地化内容落地效果\n\n任职要求：\n\n充分熟练目标外语（不限制语种，英语、东南亚语、日语、阿拉伯语等均可）\n熟悉当地网络热梗与俚语，能灵活运用到AI短剧内容中\n热爱AI，有AI视频/短剧相关经验或强烈兴趣\n具备编剧、内容本地化或海外内容创作经验优先\n对短剧节奏、情绪与传播效果有敏锐感知", "cat": "内容与创作"}, {"id": "64", "title": "AI短剧文化内容专家", "salary": "10-12k", "location": "", "jd": "岗位职责：\n负责AI成人短剧剧本的原创与改编，独立完成分集大纲、对白与分镜设计\n把控剧情节奏、情绪张力与成人内容尺度，确保故事完整且具有传播性\n使用AI工具进行剧本优化、分镜调整与多轮内容迭代\n与生成、剪辑团队紧密配合，保障剧本最终落地效果\n任职要求：\n具备扎实的编剧功底，熟悉成人短剧的叙事结构与节奏把控\n热爱AI，有AI视频/短剧相关经验或强烈兴趣\n能独立完成高完成度剧本，对情欲表达、人物情绪与镜头语言有敏锐感知\n有成人向内容创作经验者优先\n沟通顺畅，能高效配合团队完成内容交付", "cat": "内容与创作"}, {"id": "65", "title": "AI成人短剧剧本创作师", "salary": "10-12k", "location": "", "jd": "岗位职责：\n独立负责AI成人短剧剧本创作，完成分集故事、对白、分镜与情绪节点设计\n把控成人向内容的尺度与节奏，确保剧情流畅、情绪到位、传播性强\n使用AI工具完成剧本优化、分镜调整与内容迭代\n与生成、剪辑团队紧密配合，保障剧本高效落地任职要求：\n具备扎实编剧能力，熟悉成人短剧的叙事逻辑与高潮设计\n热爱AI短剧，有相关创作经验或强烈学习意愿\n能独立完成高质量剧本，对情欲张力、人物心理与镜头表达有敏锐感知\n有成人向内容创作经验者优先\n沟通高效，能适应团队协作与快速产出要求", "cat": "内容与创作"}, {"id": "66", "title": "专案经理（短剧方向）", "salary": "22k-32k", "location": "", "jd": "岗位职责：\n\n• 负责短剧内容产品的整体规划与迭代，涵盖短剧播放器、推荐信息流、内容发现与付费闭环\n• 设计前端产品原型：沉浸式短剧播放器、个性化推荐 Feed、剧集详情页、付费解锁与会员权益中心\n• 搭建后端产品逻辑：短剧内容管理后台（CMS）、推荐策略引擎、用户付费与分账系统、创作者入驻与作品管理平台\n• 制定短剧内容分发策略：冷启动流量池机制、热门榜单算法、新人保护期规则、高质量内容加权模型\n• 搭建付费变现体系：单集付费、全集打包、会员订阅、广告解锁等多模式定价方案，持续优化付费转化漏斗\n• 协同运营与算法团队，设计用户增长策略：分享裂变（截屏分享/剧情卡点）、Push 追剧召回、新用户首集免费引导路径\n• 监控并持续优化核心指标：DAU、人均观看时长、次留/7留/30留、免费→付费转化率、ARPU、LTV\n\n任职要求：\n\n• 3年以上内容型/视频/短视频/阅读类产品经验，有短剧或网文付费产品经验者优先\n• 具备完整的内容消费产品设计能力，熟悉视频播放器交互规范与内容推荐机制\n• 具备优秀的前端页面设计审美与高保真原型输出能力，能独立使用 Figma / Sketch 等工具产出可直接交付 UI 开发的交互原型，对视觉层级、动效过渡、移动端适配有系统性认知\n• 有付费产品设计经验，理解单集付费、会员订阅、广告变现等多模式定价逻辑\n• 熟悉内容创作者生态，了解创作者入驻、作品审核、分成结算等后台业务流\n• 数据驱动，精通漏斗分析与 A/B 实验方法论，能通过数据定位增长瓶颈并推动策略迭代\n• 具备较强的跨团队协作能力，能高效协同运营、算法、研发、设计等多角色推进项目落地\n短剧行业背景是必须要求", "cat": "内容与创作"}, {"id": "67", "title": "AI成人短剧导演", "salary": "12k-15k", "location": "", "jd": "岗位职责\n- 负责 AI 成人向短剧从剧本分析、视觉设定、分镜设计到成片交付的整体导演工作；\n- 围绕成年人的情感、欲望和关系博弈，设计具有暧昧感、吸引力与情绪张力的视听表达；\n- 把控故事节奏、演员表演、人物关系、镜头尺度及成人氛围，确保内容具有传播性；\n- 将剧本拆解为可执行的场景、镜头、动作、表情及 AI 生成任务；\n- 指导 AI 生成师、动画生成师和剪辑师完成素材生产，把控人物一致性及镜头连续性；\n- 审核生成素材与初剪版本，及时提出补镜、重做及节奏调整方案；\n- 在合规范围内平衡成人向表达、视觉吸引力与平台审核要求。\n任职要求\n- 熟悉成人向短剧、两性情感、都市关系或强情绪内容的创作规律；\n- 具备扎实的镜头语言、视听叙事和现场调度思维；\n- 对暧昧氛围、人物吸引力、情绪拉扯和关系变化具有敏锐感知；\n- 了解主流 AI 图片、视频及声音生成工具的能力边界；\n- 能够统筹编剧、生成和剪辑团队，高效推进项目交付；\n- 有短剧、漫剧、互动影游、剧情广告或成人向内容导演经验者优先。", "cat": "内容与创作"}, {"id": "68", "title": "AI成人动画生成师", "salary": "10k-13k", "location": "", "jd": "岗位职责\n- 负责成人向二维动画、动态漫画、三维动画及风格化剧情内容的生成；\n- 根据剧本和分镜完成人物动作、表情、互动关系及镜头画面制作；\n- 通过人物眼神、肢体语言、空间距离和动作节奏呈现成人情感及暧昧张力；\n- 保证角色造型、服装、身材比例、场景和整体画风的一致性；\n- 使用 AI 动画、动作驱动、口型同步及图生视频工具提高生产效率；\n- 处理人物穿模、肢体异常、动作僵硬、画面闪烁和风格漂移等问题；\n- 配合导演与剪辑师完成镜头修改、动作调整和版本交付；\n- 根据平台标准合理控制画面尺度，保证内容合规。\n任职要求\n- 熟悉 AI 动画、动态漫画或 AI 视频生成工作流；\n- 具备动画原理、角色表演、分镜构图和镜头节奏基础；\n- 对成人向人物设计、情绪表达和关系张力有较好的理解；\n- 能独立解决角色一致性、动作连续性及多人互动问题；\n- 会使用 After Effects、Blender、C4D、Live2D 或其他动画软件者优先；\n- 有成人向动画、漫剧、互动影游或风格化角色作品者优先。", "cat": "其他"}, {"id": "69", "title": "英文翻译（影视行业）", "salary": "12k-20k", "location": "", "jd": "【岗位职责】\n\n1、负责公司影视剧（含长篇电影、微短剧等）的剧本、台词及最终视频字幕的中英双向翻译与深度润色。\n\n2、准确把握影视作品的戏剧张力与人物性格，精准传达短剧特有的“爽点”与情绪爆发，确保译文地道、生动且极具感染力。\n\n3、对已有的翻译内容进行精校，处理俚语、双关语及网络流行语的本地化表达，符合海外目标观众的阅读与文化习惯。\n\n4、与制作团队紧密配合，协助完成字幕的排版及语意核对，确保最终视听效果的统一。\n【任职要求】\n\n1、语言能力： 具备英语专业八级（TEM-8）或同等以上水平，中英文功底深厚，具备优秀的文字转换能力和文学素养。\n\n2、专业经验： 拥有影视行业背景，有长篇电影、剧集或微短剧台词/剧本翻译经验者优先。\n\n3、文化嗅觉： 热爱影视内容，具备良好的“网感”，熟悉海外社交媒体流行语及欧美本土文化。\n\n4、综合技能： 了解影视后期制作流程，熟悉基础视频剪辑工具（如剪映、Final Cut Pro）；能熟练运用大语言模型等AI工具辅助翻译、校对，提升交付效率者优先。\n\n5、工作节奏： 具备良好的时间管理能力，执行力强，能适应不同体裁项目（从长片精细打磨到短片快速迭代）的交付周期。\n\n6、多语种优势（加分项）： 在精通英语的基础上，熟练掌握第二外语（如日语、西班牙语、韩语等）是重要加分项。", "cat": "内容与创作"}, {"id": "70", "title": "高级市场营销策划师", "salary": "18k-25k", "location": "", "jd": "岗位职责\n\n1. 营销策划 — 负责公司产品的整体营销策划，根据产品特点制定推广主题、传播策略及阶段性营销方案。\n2. 热点捕捉 — 关注互联网热点、娱乐热点及用户讨论趋势，快速判断热点与产品的结合方式，形成可执行方案。\n3. 内容传播 — 结合抖音、小红书、微博、X（Twitter）、Telegram 等平台特点，制定差异化内容传播策略。\n4. 资源整合 — 协调官号、KOL/KOC、达人及外部渠道等资源，完成营销推广。\n5. 活动策划 — 负责营销事件、线上活动、征集活动等策划，从选题到落地执行完整推进。\n6. 数据追踪 — 对营销结果负责，跟踪曝光、互动、涨粉、新增、付费及充值等数据，根据效果调整策略。\n7. 跨部门协作 — 与新媒体、渠道、产品、设计及剪辑团队协作，推动方案落地并完成复盘。\n任职要求\n1. 2年以上互联网营销/品牌策划/新媒体策划经验，有完整项目案例优先。\n2. 熟悉抖音、小红书、微博等主流社交媒体，有 X、Telegram 等海外平台经验加分。\n3. 热点敏感度高，能快速完成判断、选题包装和方案设计。\n4. 具备策划及文案能力，能独立输出营销方案及执行 SOP。\n5. 有数据意识，能从流量→新增→付费→充值完整链路判断营销效果。\n6. 有短剧、影视、娱乐、二次元、内容平台等行业经验优先。\n7. 有 KOL/KOC、MCN、媒体或社媒矩阵资源整合经验优先。\n 我们要的人 | 说明                     |\n| ----- | ---------------------- |\n| 懂营销   | 有系统的营销方法论，不是只会投流       |\n| 会手段   | 热点营销、内容营销、事件营销、活动策划等都会 |\n| 话题敏感  | 知道什么能火，什么能出圈           |\n| 思路开阔  | 不走寻常路，能发现别人没发现的切入点", "cat": "产品与管理"}, {"id": "71", "title": "前端负责人(视频播放器 & 直播方向)", "salary": "20-35K", "location": "", "jd": "播放器体验指标全责:起播耗时、首帧口径、卡顿率、seek 体验、弱网/跨境链路下的表现,实现从埋点定义、数据验收到优化落地的完整闭环\n双端播放内核的深水区:Web 端 hls.js 的加载器/ABR 定制,移动端 Flutter 播放插件的原生层改造;\n直播业务前端从零到一:直播间播放(低延迟链路选型)、弹幕/IM、送礼与激励互动、付费直播门禁机制,以及配套的运营工具与数据看板前端;\n前端可观测性:播放质量埋点、崩溃采集、真机日志体系的建设与口径维护,与数据侧对齐指标定义;\n硬性要求\n8 年以上前端经验,其中 5 年以上流媒体播放方向,带过人或实际承担过技术负责角色;\n深入过多个播放内核,深入的标准是:能解释 hls.js 的 startLevel/ABR 决策链,和ExoPlayer 的轨道选择、带宽估计与缓冲语义,而不只是会调 API;\n懂 HTTP 缓存与 CDN 分层:能读多级 CDN 的缓存头、区分边缘/中间层/回源各自的命中语义,定位\"慢在哪一层\";理解清单/分片的缓存策略对起播的影响;\n工程正确性素养:乐观更新与竞态、请求去重与幂等、会话与环境隔离、灰度与强更链路;\n熟练 React 与 TypeScript;Flutter 或原生端(Android/iOS);\n以实测为准的工作习惯:结论必须有数据或可复现的验证路径,给服务端提问题时能附上判据与验收方式。\n加分项\n做过直播:低延迟 HLS/WebRTC/FLV 选型、IM 与弹幕系统、礼物与互动玩法前端;\n在跨境/弱网环境下优化过播放(大陆访问境外源站的场景尤佳);\n自建过前端可观测性(埋点 SDK、崩溃采集、性能 trace),而非只接过第三方;\n改过开源播放器内核或 Flutter 插件原生层并能拿出 diff;\n对指标口径敏感:能识别\"完播率里混着拖到片尾的水分\"这类数据陷阱。", "cat": "内容与创作"}, {"id": "72", "title": "直播前端开发工程师", "salary": "20K～30K", "location": "", "jd": "岗位职责\n\n负责短剧、女性向产品的 H5 / Web / App 前端开发及版本迭代。\n负责视频播放、内容推荐、会员/付费、互动等核心页面和功能开发。\n配合产品、UI、后端完成需求评审、联调、上线及问题修复。\n优化页面性能、加载速度及不同机型、浏览器的兼容性。\n\n任职要求\n\n3年以上前端开发经验，熟悉 Vue / React 等主流前端框架。\n有短剧、泛娱乐、内容社区、女性向产品相关项目经验优先。\n有 H5、移动端适配及视频类产品开发经验。\n能独立承接模块开发，沟通和问题处理能力较好。\n有 Flutter / React Native 或混合开发经验优先。\n\n如果是放招聘表里的简单版JD，可以直接写：\n\n负责短剧、女性向产品前端开发及迭代，要求5年以上前端经验，熟悉 Vue/React，有H5、视频播放、内容社区或泛娱乐项目经验；有短剧、女性向产品经验优先。", "cat": "技术开发"}, {"id": "73", "title": "直播产品经理", "salary": "20K～30K", "location": "", "jd": "负责直播产品从需求规划到上线迭代的全流程，包括主播开播、用户观看、互动、内容审核、直播管理及运营后台等核心功能；结合用户、主播及运营反馈持续优化产品体验，协调研发、测试、运营等角色推进需求落地，并通过数据及线上问题复盘持续优化产品。\n任职要求\n本科及以上学历，3年以上互联网产品经验，有直播、短视频、内容社区或泛娱乐平台产品经验优先；熟悉直播核心业务流程，具备较强的需求分析、产品设计、项目推进及跨团队协调能力，能够独立负责完整产品模块。\n加分项\n有直播平台从0到1建设经验，熟悉主播、公会、内容审核、直播互动或商业化业务，有海外直播产品经验优先。", "cat": "产品与管理"}, {"id": "74", "title": "后台产品经理", "salary": "20K～30K", "location": "", "jd": "1. 后台结构梳理与重构\n盘清现有各后台的功能边界与数据模型，找出重复建设、口径冲突、权限混乱的地方，输出可落地的收敛方案。\n设计信息架构、模块边界、角色权限模型（RBAC）与通用能力层，推动多业务线的相似功能收敛成一套可配置能力，而不是各建一套。\n重构要有前后对比：改之前结构问题是什么、改之后哪些指标变了。\n1. CMS、内容链路与运营效率\n盘清现有各后台的功能边界与数据模型，找出重复建设、口径冲突、权限混乱的地方，输出可落地的收敛方案.\n负责视频 / 短剧 / 动漫 / 小说内容从入库、转码、打标、审核、上架、下架、推荐位配置的全链路产品设计。\n设计内容模型（单片 / 分集 / 剧集 / 合集 / 专题）与状态机，覆盖版权状态、可见范围、多端差异、定时发布等实际场景。\n把 SEO 需求前置到内容模型：URL 与 canonical、标题 / 描述模板、结构化数据、sitemap、内链与聚合页、多语言别名、图片 alt 等，分别需要 CMS 里有哪些字段、哪些可运营编辑、哪些自动生成；专题 / 标签 / 聚合页要做成可配置，而不是每次找开发加页面。\n支撑规模化运营：批量上下架与打标、模板化配置、导入导出、操作留痕与回滚；以「运营完成一件事的耗时与操作步数」作为迭代验收指标。\n3. 埋点、看数与归因\n输出开发照着就能实现的埋点需求文档（事件名、触发时机、参数、示例 payload、边界情况），判断什么该前端埋、什么必须服务端落库；跟进联调与上线验收，确认埋点真的落了、参数没漏。\n维护你负责模块的指标口径，口径变更有记录、有影响面评估。\n定义后台侧关键指标（内容周转时长、审核时效、上架成功率、运营操作耗时、功能使用率），功能上线后主动回看数据，判断是真解决了问题还是只交付了需求；没人用的功能敢下掉。\n用归因看清效果：渠道归因与站内归因（内容、推荐位、落地页对播放、留存、付费的贡献拆分），知道不同归因模型为什么会给出打架的结论、各自适用在什么场景。\n4. 与研发对齐后台架构\n看得懂接口文档与数据表结构，能和后端讨论表设计、接口粒度、分页与性能、权限校验位置、异步任务与队列。\nPRD 写到开发照着就能实现：字段、状态流转、边界与异常、权限矩阵都写清楚。\n任职要求\n必须\n3 年以上 B 端 / 后台产品经验，主导或作为核心负责过一套内容后台 / CMS 的从 0 到 1，或一次结构性重构（只负责提需求排期的不算）。\n做过视频 / 短剧 / 直播 / 资讯等内容业务，清楚内容生产与分发链路上真实的卡点在哪。\n能独立写出埋点需求文档：理解事件模型与指标口径，跟过埋点联调与上线验收。\n熟悉即可，不要求精通\n神策 / GrowingIO / Amplitude 等任一平台的数据模型与限制。\n归因：说得清 first / last touch、线性、时间衰减等模型的差异与适用边界。\nSEO：说得清 canonical、标题描述模板、结构化数据、sitemap、聚合页这些分别需要 CMS 提供什么字段与能力。\n后台架构常识：数据表与接口设计、RBAC、状态机、审核流、任务队列、操作日志，能和研发讨论方案而不是只画原型。", "cat": "产品与管理"}, {"id": "75", "title": "KOL 投放增长运营", "salary": "20K-35K", "location": "", "jd": "岗位职责\n\n负责X（Twitter）平台KOL投放及增长工作，围绕拉新、注册、入金、交易转化等目标制定投放策略。\n挖掘并建立海外KOL资源库，根据粉丝画像、内容质量、互动数据及历史转化筛选合作对象。\n负责KOL建联、商务谈判、合作方案制定、内容审核、排期上线及费用结算等全流程管理。\n结合平台活动和产品卖点，策划推文、Space、视频、交易活动及邀请码推广等合作内容。\n跟踪曝光、互动、点击、注册、首充、交易量及投放ROI，定期复盘并优化投放策略。\n监测异常流量及虚假数据，控制刷量、低质用户和投放成本风险。\n持续关注行业热点、竞品动态及X平台趋势，快速策划并落地热点增长活动。\n协同产品、商务、品牌、设计及数据团队，推动活动素材、落地页和转化链路优化。\n\n任职要求\n\n具备2年以上KOL投放、海外增长或社交媒体运营经验，有X（Twitter）平台实操经验。\n熟悉KOL筛选、建联、议价、内容投放及数据复盘的完整流程。\n具备较强的数据分析能力，能够根据转化成本、用户质量及ROI评估投放效果。\n熟悉海外社交媒体内容生态、用户习惯及热点传播逻辑。\n具备良好的英语沟通及书面表达能力，能够独立对接海外KOL。\n目标导向，具备较强的执行力、商务沟通能力和跨团队协作能力。\n能够适应互联网业务的快速节奏，及时处理投放过程中的临时问题。\n\n优先条件\n\n有Web3、加密货币、交易所或金融科技行业经验。\n掌握海外加密领域KOL、社区或代理资源。\n有从0到1搭建KOL投放体系或资源库的经验。\n有通过KOL投放实现注册、入金或交易增长的成功案例。\n熟悉Telegram、YouTube、Discord等海外平台的联动运营。", "cat": "运营与市场"}, {"id": "76", "title": "资深UI设计师", "salary": "15-22K", "location": "", "jd": "UI视觉设计师 / UI设计师\n岗位职责\n负责公司产品的 UI 视觉设计工作，包括 Web、APP、后台系统等相关界面设计；\n能够独立负责一个项目的设计工作，熟悉从需求理解、界面设计、视觉规范、设计交付到开发跟进的完整 UI 设计流程；\n负责运营视觉相关设计，包括 Banner、活动图、广告图、宣传图、运营动图及其他营销视觉素材；\n根据产品及运营需求，完成简单动效、视频剪辑及相关视觉内容制作；\n配合产品、开发及运营团队推进项目落地，并对最终上线效果进行视觉验收和优化；\n能根据不同项目定位，准确把握品牌调性，并持续优化产品整体视觉表现。\n任职要求\n熟练使用 Figma，能够高效完成 UI 设计、组件搭建、设计规范整理及设计交付；\n具备独立负责项目设计的能力，熟悉 UI 设计完整工作流程；\n具备良好的审美能力，对色彩、排版、构图、字体及页面布局有较好的理解和判断；\n具备较强的运营视觉设计能力，有 Banner、活动页、运营图、广告图、动效图等设计经验UI可薄弱；\n会基础动效制作及视频剪辑，能够独立完成简单的动态视觉内容；\n有较好的沟通能力、执行力及责任心，能够配合项目节奏独立推进设计工作。\n加分项\n有良好的手绘基础或插画能力；\n熟悉 AE、PS、AI、PR 等设计及视频工具；\n有直播、社交、娱乐、短视频、活动运营类项目经验；\n有较强的视觉创意能力，能独立完成从创意到落地的完整设计；\n有动效、MG 动画、品牌视觉或营销视觉设计经验优先。", "cat": "内容与创作"}, {"id": "77", "title": "直播中台内容专员", "salary": "10-15k", "location": "", "jd": "直播中台内容专员\n岗位简介：\n直播中台支撑岗位，服务公司数百个直播间矩阵。主打标准化内容体系搭建 + 主播点对点内容优化，通过 IP 人设、剧情钩子、话术体系、竞品调研，整体提升全矩阵直播间停留与内容质量。\n\n岗位职责\n1.IP 人设体系搭建\n搭建矩阵通用主播人设模板、风格框架，统一内容标准；针对不同主播特质，输出个性化人设优化方案，打造差异化标签。\n2.直播内容 & 钩子 & 话术中台建设\n沉淀全矩阵通用直播流程、留人剧情、开场 / 中场 / 收尾钩子、互动控场话术库。输出可批量复用的内容模板，同时针对主播表达、节奏、留人短板，做点对点优化指导。\n3.行业 & 竞品调研分析\n持续拆解行业头部及对标直播间，分析竞品人设打法、内容结构、留人逻辑、节奏玩法，输出调研总结与可落地迭代方案；同步梳理内容合规红线，规避矩阵批量违规风险。\n4.数据复盘与内容迭代\n基于矩阵直播数据，复盘整体内容问题，输出批量优化方案及单个主播提升建议，持续更新中台内容素材与方法论。\n5.内容赋能落地\n输出培训素材、话术模拟、内容纠错，帮团队主播统一提升内容能力。\n\n任职要求\n1.熟悉直播内容逻辑，懂人设打造、剧情设计、留人钩子、直播节奏与话术优化。\n2.具备优秀的竞品拆解、行业分析、总结归纳能力，能产出标准化、可复用的中台内容方案。\n3.视野偏向矩阵批量赋能，不局限单直播间单点运营思维。\n4.文案清晰、逻辑强，可独立输出方案、整改建议与内容素材库。\n\n优先经验\n1.有娱乐直播、剧情直播赛道内容中台从业经验优先。\n2.有服务200 + 以上直播间矩阵、规模化主播内容赋能经验优先。\n3.有话术库、人设库、直播内容体系搭建、批量竞品拆解项目经验优先。\n4.熟悉直播风控合规，有内容风险梳理经验优先。", "cat": "内容与创作"}, {"id": "78", "title": "AI 短剧导演 / 编剧", "salary": "15-22K", "location": "", "jd": "岗位职责\n1. 独立产出样片、固化模型边界\n独立完成样片全流程：剧本 → 分镜 → 角色 / 场景设计 → 图生视频抽卡 → TTS + 口型 → 剪辑拼装 → 质检。\n系统性测试模型能力上限：角色一致性、动作复杂度、镜头语言、多人同框、时长等，并沉淀成 prompt 与工作流模板。\n2. 审剧本、初审成片\n审核创作者的剧本：可拍性(模型拍得出来吗)、钩子与节奏、合规红线，并给出可执行的修改意见。\n按分级标准初审收片，出评级与打回意见，作为结算依据。\n3. 调研新型内容形式\n互动剧(分支叙事 / 多结局)、竖屏微短剧结构、AI 可交互角色、UGC 共创等。\n输出可行性判断，并主导小成本试点，不停在 PPT 上。\n4. 支撑创作者网络\n输出题材 brief 与制作规范，给外部工作室 / 创作者做培训与答疑，工作流经验复制出去。\n任职要求\n有可直接观看的作品：AI 生成或传统拍摄都可以，我们看叙事能力与成片完成度，不卡传统影视履历；投递必须附链接(见「投递要求」)。\n会独立用 AI 工具做完一支片，具体指：\nComfyUI 工作流搭建与调参(不只是点按钮，能改节点)；\n熟练使用 Wan 系、Seedance(SD) 系等图生视频模型：Wan 系为自托管主力，要求能独立配 workflow、调 sampler / step / CFG / motion 参数、挂 LoRA、按镜头需求控制运动幅度与时长；Seedance / 可灵等 API 模型要求会调参、会用它们做分镜与定妆；同时了解 HunyuanVideo、LTX、CogVideoX 等，能讲清各自特点与取舍；\n角色一致性方案(LoRA 训练、FLUX Kontext / IPAdapter / ControlNet 任一路线)；\nTTS 配音 + lipsync；\n剪辑(Pr / 达芬奇 / 剪映)与基础调色、音乐。\n能一个人扛完一支片(编剧 + 导演 + 抽卡 + 粗剪)，不是只做其中一环、其余靠协作。\n对竖屏短剧的钩子与节奏有方法论：前 3 秒、每 15 秒卡点、单集结尾钩子、一季的爽点分布。\n有成本意识：知道抽卡废片是真金白银，会用工作流和写本方式压废片率。\n加分项\n互动剧 / 游戏叙事(分支、多结局、玩家选择设计)经验。\n带过外包团队或外部创作者，输出过制作规范。\n数据意识：看得懂完播率 / 留存曲线，并据此改片、改钩子。\n自己训过 LoRA、写过自动化批处理 / agentic 流程。\n双语题材能力(面向出海市场)。\n投递要求\n以下 1–3 项缺一不进初筛：\nAI 作品链接：至少 1 支你本人主导生成的 AI 视频作品，B 站 / YouTube / 网盘直链均可，别发压缩包、别发需要申请权限的链接。\n作品说明：每支片注明——用了什么模型与工作流(如 Wan 2.2 I2V + 某 LoRA)、你在其中具体做了哪几环(编剧 / 分镜 / 抽卡 / 剪辑 / 配音)、是否有他人协作、大致抽卡量与制作耗时。\nComfyUI 工作流画布：截图、workflow JSON 或在线链接均可。\n剧本样本(有则附)：一集竖屏短剧剧本或分镜脚本，PDF / 在线文档均可。\n我们只看能点开的成片，不看纯文字描述的项目经历；作品若为团队协作，请如实标注你的角色——面试会针对你标注的环节追问细节。", "cat": "内容与创作"}, {"id": "79", "title": "中高级产品经理（女性向播放器方向）", "salary": "15-30K", "location": "", "jd": "负责女性向播放器产品的规划、设计与迭代；\n 围绕用户增长、留存、会员转化、内容消费等核心指标开展产品设计；\n 负责播放、推荐、搜索、收藏、互动等核心功能设计；\n 深入研究女性用户内容消费习惯及情感需求，持续优化产品体验；\n 协同研发、设计、运营团队推动产品从0到1落地及持续迭代；\n 关注行业趋势及竞品动态，持续探索新的产品机会。\n\n任职要求\n\n 本科及以上学历，5年以上互联网产品经验；\n 具备完整0-1产品经验；\n 有视频平台、内容平台、社区产品、内容消费产品经验优先；\n 熟悉DAU、留存、转化率、会员付费等核心指标；\n具备优秀的用户洞察能力、数据分析能力和项目推动能力；\n能适应快速迭代和高不确定性的创新业务环境。\n\n加分项\n乙女游戏从业 ｜ 晋江、Lofter、长佩、B站国创 ｜ 同人二创 ｜ 成人向行业经历（加分，不减分）\n 有女性向内容产品、社区产品、短剧产品经验；\n 有会员体系、推荐系统、内容分发产品经验；\n 有成功增长案例或爆款产品经验；\n 对女性用户内容消费和内容偏好有深入理解。", "cat": "产品与管理"}, {"id": "80", "title": "小说产品经理", "salary": "15-30K", "location": "", "jd": "岗位职责\n1、负责小说/网文阅读器核心体验产品设计与迭代，主导阅读页交互、排版渲染、翻页逻辑、阅读工具、沉浸式体验等核心模块优化，持续提升用户阅读时长、完读率与留存。\n\n2、负责阅读器全链路体验优化，包括字号字体、行间距、排版适配、异形屏适配、护眼模式、夜间模式、断章纠错、预加载、离线缓存、多设备进度同步等核心场景。\n\n3、负责阅读工具体系建设，涵盖书签、笔记、划线、听书、自动翻页、防误触、文本操作等功能迭代，持续优化用户沉浸式阅读体验。\n\n4、平衡用户体验与商业化需求，负责阅读场景广告、付费权益、VIP阅读体系、章节解锁等产品策略设计，合理控制商业化阈值，实现收益与用户体验双赢。\n\n5、对接内容风控、自动化质检体系，梳理内容错章、漏章、乱码、敏感内容脱敏等场景，优化内容校验规则，降低用户投诉与阅读故障率。\n\n6、基于用户行为数据、版本数据、用户反馈，定位体验短板，输出迭代方案，持续优化核心数据指标。\n\n7、独立完成需求调研、需求梳理、优先级判断、PRD输出、原型设计、版本评审、迭代跟进、灰度上线与版本复盘，推动研发、测试、运营高效落地。\n\n任职要求\n\n1、本科及以上学历，2年及以上网文/小说阅读器产品经验，熟悉阅读器底层体验与行业玩法。\n\n2、深刻理解长文本阅读场景，对排版、渲染、翻页手感、卡顿、加载速度等细节有极强敏感度。\n\n3、具备成熟的需求优先级判断能力，能够区分核心需求、迭代需求与伪需求，具备独立负责版本迭代的能力。\n\n4、有网文免费/付费商业化产品经验，熟悉广告激励、会员体系、阅读权益设计者优先。\n\n5、具备基础数据分析能力，能够通过数据发现问题、拆解问题、驱动产品优化。\n\n6、逻辑清晰、执行力强、抗压能力强，沟通推进能力优秀，能高效跨部门协同。", "cat": "产品与管理"}, {"id": "81", "title": "直播运营专员", "salary": "12-15k", "location": "", "jd": "负责直播间内容审核,确保内容符合平台规范及监管要求\n处理主播在直播过程中遇到的问题及突发情况,及时响应协调\n跟进主播开播时长、房间状态等日常运营数据\n配合主播招募、公会对接等相关运营支持工作\n参与平台活动执行、主播激励政策落地\n任职要求:\n本科及以上学历\n1年以上直播平台运营/审核相关经验,有成人内容审核经验优先\n工作细致、责任心强,能承受一定内容审核压力\n沟通协调能力强,能妥善处理主播突发问题\n能适应晚班/轮班工作制(直播行业黄金时段为晚8点-12点)\n认同平台内容尺度定位,心理素质稳定", "cat": "运营与市场"}, {"id": "82", "title": "效能支撑部-项目助理", "salary": "12-20K", "location": "", "jd": "岗位职责\n1.负责项目全生命周期跟踪，建立项目进度台账，及时掌握项目状态及关键节点完成情况；对延期风险、资源冲突及异常事项进行预警与升级处理。\n2.协调产品、研发、测试、运营等相关团队资源，推动跨部门协作问题解决；针对项目推进过程中的阻塞事项进行跟踪闭环，确保问题及时解决并形成明确结论。\n3.识别项目推进过程中的潜在风险与异常情况，建立项目风险清单；推动责任部门制定解决方案并跟踪落地，降低项目延期及交付风险。\n4.收集项目交付相关数据，分析延期、返工、协同效率等关键指标；定期输出项目效能分析报告，发现影响项目交付效率的关键问题并提出改善建议。\n5.参与项目管理机制建设与持续优化；推动跨部门协同机制、项目管理规范及问题升级机制落地，持续提升组织协作效率。\n6.整理项目典型案例、最佳实践及常见问题解决方案；建立项目经验库，推动优秀经验复制与推广。\n\n\n任职要求\n1.3年以上互联网、软件研发、项目管理、运营管理等相关工作经验；\n2.熟悉互联网产品研发流程，对产品、研发、测试、运营协作模式有较好理解；\n3.具备较强的项目推进意识和结果导向意识；\n4.具备优秀的沟通协调能力，能够推动跨部门问题解决；\n5.具备较强的问题分析能力，能够快速识别项目阻塞点及风险；\n6.具备较好的数据分析能力，能够通过数据发现问题并形成改善建议；\n7.具备较强的执行力与责任心，能够同时推进多个项目并保证跟踪质量；\n8.具备良好的文档编写及汇报能力，能够以结构化方式向管理层反馈项目情况；\n9.加分-有PMO、项目管理、项目运营相关经验者优先；\n10.加分-具备PMP、ACP等项目管理认证者优先；\n11.加分-有中大型互联网项目管理经验者优先", "cat": "产品与管理"}, {"id": "83", "title": "产品专员", "salary": "20k-28k", "location": "", "jd": "\"\n1.3年以上产品经理经验或3年以上UX\\UI经验； 低于3年 直接不考虑\n2.核心能力要求：洞察力、推动力、框架思考能力；\n3.全日制本科毕业；\n4.有跨欧洲时区工作条件优先，不可跨时区工作者无需熬夜；\n5.有统筹过百万DAU以上产品或产品矩阵经验优先；\n\"        \"【岗位职责】 \n1.对上百个产品有序做体验报告，生成优势说明、缺点清单、改进逻辑、改进方案，参考交互；\n2.从需求阶段介入每个产品的需求文档，对其中交互部分进行交互优化建议，降低后期成本；\n3.依据产品现状与行业领军产品制定交互规范，并监督规范落实到位，对于落实延期的产品要进行日、周总结和月度复盘；\n4.深度研究字节、腾讯等大流量产品的交互优势、适应人群等，形成通用需求文档交付给各个研发团队；\n5.监督测试团队的测试结果和落实结果；\n6.部门内其他交付的产品、交互、测试、运营相关的调研任务等；\"", "cat": "其他"}, {"id": "84", "title": "督导专员", "salary": "15-35k", "location": "", "jd": "1.流程体系搭建与优化：\n建立并持续完善 项目管理标准流程（含立项、评审、变更等环节），输出标准化模板（如风险清单、交付文档等），推动跨部门协同流程落地，提升项目运作效率。​\n2.进度与风险管控：\n实时跟踪项目进度，识别项目中的关键风险点（如资源冲突、技术瓶颈、合规要求等），建立风险台账并制定应对预案，协调内外部资源解决项目阻塞问题，降低项目延期、返工风险。​\n3.数据复盘与赋能：\n收集项目核心数据，形成项目复盘报告，提炼经验教训并输出优化建议；搭建项目管理知识沉淀体系，赋能项目团队提升管理能力。​\n4.人才与事件追踪\n在所负责系统内主动观察一线人才，建立人才挖掘报告与持续跟踪机制；同时对部门内值得关注的事件进行追踪记录，形成事件库。\n\n任职要求\n1.6年以上IT系统管理、项目交付或产品管理相关经验。\n2、PMP等相关资质认证者优先；\n3、有良好的沟通能力，抗压能力强，能够适应较复杂的合作环境;\n4. 具备结构化复盘与表达能力，可以结论先行的方式向管理层汇报。", "cat": "运营与市场"}, {"id": "85", "title": "高级品牌策划", "salary": "20-35K", "location": "工作形式：英国本地 / 远程均可", "jd": "岗位名称：高级品牌策划\n\n岗位职责\n1. 负责集团品牌整体策略规划、品牌定位迭代、品牌理念及价值体系搭建，输出标准化品牌策略方案。\n2. 统筹年度品牌传播主题、节点营销、品牌IP内容、全域传播策略的策划与落地，主导品牌升级、品牌焕新等重点专项项目。\n3. 深度拆解行业竞品品牌打法、市场趋势及用户偏好，输出品牌市场分析、策略优化报告，持续迭代品牌运营思路。\n4. 联动新媒体、社群、用户运营、设计等团队，统筹各类品牌内容、活动、传播物料的策略方向，保障品牌调性统一。\n5. 负责品牌项目全流程管控，包含方案输出、落地跟进、数据复盘、策略优化，沉淀可复用的品牌打法与案例体系。\n6. 能够对整体品牌团队进行协调管理，并保证方案的实际执行。\n7. 熟练运用AI工具辅助市场调研、策略 brainstorm、方案优化、内容选题，大幅提升品牌策划与迭代效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，3年以上品牌全案策划、品牌策略相关工作经验，有集团化品牌统筹经验优先。\n2. 具备完整的品牌策略搭建、品牌活动全案操盘、品牌内容体系搭建经验，能够独立输出高质量全案策略。\n3. 对新媒体热点、行业趋势、用户审美高度敏感，可结合品牌调性创新策划传播内容与营销玩法。\n4. 具备优秀的文案功底、逻辑思维和创意能力，策略落地性强，可高效联动多团队协同推进项目。\n5. 具备较强的数据复盘能力，能够依据传播数据、用户反馈持续优化品牌策略与内容方向。\n6. 有泛娱乐、互联网媒体、内容平台品牌策划经验者优先。\n7. 熟练或愿意深度使用各类AI工具，具备主动用AI提效、创新策划的工作意识。\n\n工作形式：英国本地 / 远程均可", "cat": "运营与市场"}, {"id": "86", "title": "项目经理", "salary": "依能力与经验面议", "location": "工作形式：远程", "jd": "岗位职责\n1. 负责 Web、App 及短视频/视频产品的品牌升级项目，统筹从品牌策略落地、视觉规范输出到全端换新上线的全过程，对进度、品质、成本与上线效果负责。\n2. 制定品牌升级整体计划与里程碑，拆解 Web 端、App 端、短视频账号及视频物料等各触点任务，确保多端同步推进、节点对齐。\n3. 把控品牌视觉在各端的落地品质，覆盖界面视觉、播放器与内容包装、运营物料等，保障风格统一、品牌识别一致。\n4. 组织品牌方案评审、设计验收与上线复核，明确各触点交付标准与验收口径，减少返工与品牌表达偏差。\n5. 协调品牌、设计、视频制作及市场传播等相关方，对齐升级节奏与发布档期，推动物料齐套、按时上线。\n6. 识别档期冲突、物料延期、多端不一致及成本风险并推动闭环；项目结束后完成复盘，沉淀品牌升级规范与资产。\n\n任职要求\n1. 本科及以上学历5年以上项目管理经验，其中 2年以上大型交付型项目管理经验。\n2. 具备 50 人以上项目团队的实际管理经验，能统筹跨职能协作、资源调配与效能提升。\n3. 有独立操盘并成功交付单体合同/预算 1000 万以上项目的真实案例，具备范围管理、成本核算与收益把控能力。\n4. 熟练掌握项目管理方法，能独立进行计划制定、WBS 拆解、里程碑监控、风险预警与变更管理。\n5. 持有 PMP 认证，熟悉 PMBOK 体系；具备极强的交付结果导向、风险预判、跨部门协调及向上汇报能力。\n\n加分项\n1. 有品牌升级、视觉焕新或 Web/App/短视频多端品牌落地经验。\n2. 有泛娱乐、短视频、新媒体、数字内容等相关行业背景。\n3. 兼具 ACP、Scrum Master 等认证，或具备 IPD 流程落地经验。\n4. 有大型软件开发、系统集成或复杂项目群交付经验。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "产品与管理"}, {"id": "87", "title": "品牌策划专员", "salary": "12-20K", "location": "工作形式：远程", "jd": "岗位名称：品牌策划专员\n\n简历筛选要点：具备品牌策划、内容策划、活动执行实操经验；热点敏感度高，擅长落地执行与文案输出；会基础图文内容处理；熟练使用AI工具辅助工作；有成人行业泛娱乐、新媒体行业经验者优先。\n岗位职责\n1. 协助高级策划完成品牌策略落地、品牌活动、节点营销、话题传播的方案细化与执行落地。\n2. 负责品牌日常宣传文案、推文、新闻素材、活动话术、品牌故事等内容的撰写与优化。\n3. 跟踪行业热点、网络趋势、竞品动态，收集优质案例，输出素材汇总与基础分析内容，支撑品牌创新策划。\n4. 配合设计、新媒体、运营团队，完成各类品牌物料、传播内容的需求对接、内容审核、上线跟进。\n5. 负责品牌基础资产归档、宣传素材整理、活动复盘总结，沉淀标准化品牌执行资料。\n6. 运用AI工具辅助文案撰写、选题搜集、素材整理、基础数据分析，提升日常工作效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上品牌策划、内容策划、文案运营相关工作经验。\n2. 熟悉新媒体品牌传播逻辑，了解主流平台内容玩法，能够贴合品牌调性输出内容。\n3. 对网络热点、流行文化敏感，可快速结合热点适配品牌宣传场景。\n4. 文案功底扎实，写作风格灵活，可适配不同平台、不同场景的内容创作需求。\n5. 执行力强，具备良好的协同沟通能力，可高效配合多团队完成品牌落地工作。\n6. 有泛娱乐、内容媒体、互联网平台品牌相关经验者优先。\n7. 熟悉或愿意学习AI工具，具备借助工具提升内容产出与工作效率的意识。\n\n工作形式：远程", "cat": "运营与市场"}, {"id": "88", "title": "高级UI设计师", "salary": "18-25K", "location": "工作形式：远程", "jd": "岗位名称：高级UI设计师\n\n岗位职责\n1. 负责集团相关产品、平台、社媒载体的UI界面设计、视觉规范搭建与落地，保障整体视觉统一。\n2. 主导用户体验（UX）优化，梳理用户操作路径、交互逻辑，输出原型、交互方案、体验优化迭代建议。\n3. 结合品牌调性与平台风格，完成页面视觉、活动专题、弹窗、功能界面、社群素材等设计工作。\n4. 联动运营、策划、产品团队，理解业务需求，输出适配传播与用户使用场景的设计方案。\n5. 跟踪用户体验反馈、页面数据表现，持续迭代视觉与交互设计，提升用户使用体验与视觉质感。\n6. 运用AI设计工具辅助素材生成、视觉迭代、版式优化，提升设计产出效率与创意丰富度。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上UI/UX设计、互联网视觉设计相关工作经验。\n2. 熟练掌握UI设计、交互设计方法，精通各类设计软件，具备独立完成界面设计、原型设计、体验优化的能力。\n3. 审美优秀，熟悉年轻化、泛娱乐、新媒体视觉风格，贴合网络流行审美趋势。\n4. 具备良好的需求理解能力与逻辑思维，有独立主导过完整产品视觉体系搭建经验，可结合用户行为与业务目标优化设计方案。\n5. 具备数据意识，可根据用户反馈、页面数据持续优化视觉与交互体验。\n6. 有泛娱乐产品、内容平台、社群产品设计经验者优先。\n7. 熟练或愿意学习AI设计工具，具备借助AI提升设计效率与创意输出的能力。\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "89", "title": "AI影视制片运营", "salary": "依能力与经验面议", "location": "", "jd": "岗位职责\n负责AI影视项目制片统筹与全平台内容运营，制定项目排期、内容发布及账号运营计划，协调制作、运营和市场资源，持续跟踪内容数据、流量表现及商业化效果，并通过复盘优化内容生产、分发及变现策略。\n任职要求\n本科及以上学历，1年以上影视短剧制片、新媒体或短视频运营经验，具备项目统筹、资源协调及进度管理能力；熟悉抖音、快手、小红书、视频号等平台内容规则，具备内容包装、数据分析、流量运营及商业化意识。\n加分项\n有AI短剧、短视频账号矩阵运营经验，有爆款内容或账号增长案例，熟悉短剧付费、广告合作、内容带货等商业化模式优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "90", "title": "AI影视项目总监", "salary": "依能力与经验面议", "location": "", "jd": "岗位职责\n负责AI电影、AI短剧项目整体统筹，制定项目计划及里程碑，协调编剧、AI生成、后期、运营等岗位协作，对项目进度、制作质量、成本、量产效率及最终交付负责，同时建立项目制作、验收及复盘机制。\n任职要求\n本科及以上学历，2年以上AI影视、AI短剧或相关内容项目管理经验，有完整项目操盘及交付案例；具备团队统筹、进度管理、成本与质量控制能力，熟悉主流AI影视制作工具及工作流程，能够识别风险并推动问题解决。\n加分项\n有爆款AI短剧、AI影视内容项目经验，具备泛娱乐、新媒体、影视行业背景，或有PMP等项目管理认证及标准化工作流搭建经验优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "91", "title": "AI影视生成师（视频 / 镜头方向）", "salary": "依能力与经验面议", "location": "", "jd": "负责AI影视镜头及视频素材生成，根据剧本和分镜完成画面生产、参数调试、素材优化及风格统一，持续处理人物、场景、镜头及画面质量问题，提高素材良品率和量产效率，并沉淀Prompt、参数及视觉风格模板。\n任职要求\n本科及以上学历，1年以上AI视频或AI影视生成实操经验，能够独立完成多场景、多镜头素材生产；熟练使用Runway、Pika、Stable Diffusion、Sora等AI工具，熟悉Prompt及参数调试，具备较好的影视构图、光影、色彩及画面审美能力。\n加分项\n有AI短剧批量生产经验，会LoRA微调或风格模型训练，拥有成熟Prompt库、参数模板、镜头素材库或个人AI影视作品集优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "92", "title": "品牌与市场策略负责人", "salary": "依能力与经验面议", "location": "", "jd": "负责多产品线品牌与市场策略建设，从0到1搭建品类认知、品牌定位及核心传播框架；持续开展行业趋势、竞品及市场研究，为品牌升级提供策略判断，并推动品牌策略、传播口径及方法论在具体项目中落地。\n任职要求\n本科及以上学历，3年以上品牌策略、市场洞察、品类研究等相关经验，有从0到1搭建品牌或策略体系的经历；具备较强的市场分析、结构化思考、策略输出及跨团队推动能力，自驱力和结果意识强。\n加分项\n有互联网、内容、泛娱乐行业经验，多产品线品牌策略经验，或品牌定位、品牌升级、传播策略等完整项目案例优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "运营与市场"}, {"id": "93", "title": "AI影视编剧 / 分镜策划", "salary": "依能力与经验面议", "location": "", "jd": "岗位职责\n负责AI电影、AI短剧的剧本创作、人物设定、场景设计及分镜策划，根据AI生成特点优化剧情结构、镜头设计及生成关键词，把控内容节奏和整体调性，并与AI生成、后期岗位协作，保障内容可制作、可量产、可落地。\n任职要求\n本科及以上学历，1年以上短剧、影视编剧或内容策划经验，具备独立完成剧本、人设及分镜设计能力；熟悉短剧剧情节奏、钩子、冲突及反转逻辑，了解AI影视生成特点，具备良好的文字表达、镜头审美及跨岗位协作能力。\n加分项\n有AI短剧、AI影视实际创作案例，擅长甜宠、悬疑、科幻、古风等多题材创作，拥有成熟剧本模板、分镜体系或Prompt素材库优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "94", "title": "AI影视后期制作师", "salary": "依能力与经验面议", "location": "", "jd": "岗位职责\n负责AI电影、AI短剧成片后期制作，包括剪辑、调色、画面修复、音频、字幕及特效处理，把控整体剪辑节奏、视觉风格和成片质量，解决AI素材常见瑕疵，并沉淀剪辑、调色及音频模板，提高后期量产效率。\n任职要求\n本科及以上学历，1年以上影视、短剧后期制作经验，可独立完成完整短剧后期；熟练使用PR、AE、达芬奇、剪映等工具，熟悉AI视频素材特点，具备良好的剪辑节奏、视觉审美、画面修复及成片质量把控能力。\n加分项\n有AI影视或AI短剧后期制作经验，熟悉AI配音工具，有成熟剪辑模板、调色预设、音效素材库或完整成片案例优先。", "cat": "内容与创作"}, {"id": "95", "title": "中级运营-内容运营方向", "salary": "12-20K", "location": "", "jd": "岗位职责】\n1.        负责品牌社媒平台（国内及国外）的日常内容策划与发布执行\n2.        结合平台热点与品牌调性，策划品牌相关互动话题、内容系列与传播节点\n3.        跟踪各平台内容数据表现，定期输出分析报告，持续优化内容方向与发布策略\n4.        配合设计组完成社媒物料的需求沟通与上线跟进，确保内容与视觉高度协同\n5.        维护社媒账号日常互动，提升用户粘性与品牌好感度，独立负责内容方向策划与选题体系搭建，有可量化的内容产出目标（如涨粉/互动率）\n6.        熟练运用AI工具辅助选题策划、文案撰写与数据分析，提升内容产出效率\n\n【任职要求】\n1.        本科及以上学历，35岁以下，至少1年社媒运营或内容运营相关工作经验\n2.        熟悉国内外等主流平台的内容逻辑与算法规则\n3.        对娱乐热点、网络梗文化高度敏感，具备将热点转化为品牌内容的能力\n4.        文案表达能力强，风格活泼自然，能快速产出符合平台调性的内容\n5.        数据意识强，能通过数据反馈独立判断内容方向并推动调整\n6.        有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n7.        熟悉或愿意深度使用AI工具，具备用AI提效的主动意识", "cat": "内容与创作"}, {"id": "96", "title": "AI游戏制作师", "salary": "20-30K", "location": "工作形式：远程", "jd": "岗位名称：女性向AI游戏设计师\n\n岗位职责\n1. 专注女性向AI游戏、情感互动内容、轻量化乙系互动产品的视觉设计、角色设计、场景氛围设计，贴合女性用户审美与情感需求。\n2. 依托AI工具完成游戏人设、立绘、CG插图、场景道具、剧情视觉素材的批量生成与精细化二次优化，统一整体美术风格与故事氛围。\n3. 结合女性向内容调性、情感叙事逻辑、热点流行元素，设计差异化角色形象、互动场景与视觉体系，打造高质感、高共情的游戏视觉体验。\n4. 配合策划团队完成剧情脚本、互动玩法、故事分镜的视觉落地，根据剧情情绪、人物人设调整画面质感、光影与氛围细节。\n5. 收集用户反馈与行业女性向游戏流行趋势，持续迭代视觉风格、角色体系、画面表现，优化内容吸引力与用户沉浸感。\n6. 沉淀女性向AI游戏设计标准、提示词模板、素材资源库与风格规范，利用AI工具持续提升内容产出效率与创意上限。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上游戏美术、游戏设计、AI内容创作相关工作经验，有女性向/乙女游戏设计经验优先。\n2. 具备扎实的美术审美与色彩、光影、造型功底，精准拿捏女性向唯美、治愈、氛围感、精致化视觉风格。\n3. 熟练掌握Midjourney、Stable Diffusion等主流AI设计工具，精通提示词工程、模型调用、细节可控出图，可独立完成高质量AI美术内容创作与优化。\n4. 深度了解女性向游戏用户喜好、情感需求、审美趋势，熟悉乙游、情感陪伴、沉浸式叙事类内容玩法与视觉逻辑。\n5. 具备良好的剧情理解能力与创意思维，可结合故事内容输出适配的视觉画面与场景氛围。\n6. 有女性向游戏、AI互动视觉、情感类内容、虚拟角色设计落地经验者优先。\n7. 主动钻研AI新工具、新玩法，具备持续用AI迭代设计质量、提升产出效率的工作意识。\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "97", "title": "内容策略经理", "salary": "12K-20K", "location": "工作形式：远程", "jd": "岗位名称：高级内容策略\n\n\n【岗位职责】\n1.        负责品牌社媒平台（国内及国外）的日常内容策划与发布执行\n2.        结合平台热点与品牌调性，策划品牌相关互动话题、内容系列与传播节点\n3.        跟踪各平台内容数据表现，定期输出分析报告，持续优化内容方向与发布策略\n4.        配合设计组完成社媒物料的需求沟通与上线跟进，确保内容与视觉高度协同\n5.        维护社媒账号日常互动，提升用户粘性与品牌好感度，独立负责内容方向策划与选题体系搭建，有可量化的内容产出目标（如涨粉/互动率）\n6.        熟练运用AI工具辅助选题策划、文案撰写与数据分析，提升内容产出效率\n\n【任职要求】\n1.        本科及以上学历，35岁以下，至少1年社媒运营或内容运营相关工作经验\n2.        熟悉国内外等主流平台的内容逻辑与算法规则\n3.        对娱乐热点、网络梗文化高度敏感，具备将热点转化为品牌内容的能力\n4.        文案表达能力强，风格活泼自然，能快速产出符合平台调性的内容\n5.        数据意识强，能通过数据反馈独立判断内容方向并推动调整\n6.        有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n7.        熟悉或愿意深度使用AI工具，具备用AI提效的主动意识\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "98", "title": "舆情与危机公关负责人", "salary": "12-20K", "location": "工作形式：远程", "jd": "\"岗位职责\n1. 从 0 到 1 搭建分品类情报监测与分级预警机制（渠道、频率、黄橙红分级、处置闭环）\n2. 打通客服及相关业务侧数据协同，把外部声量与内部信号合成统一风险判断\n3. 主导升级/上线等关键窗口的风险预研、表达抽检与口径输出，前置拦截高风险表述\n4. 独立推进重大负面与突发舆情的处置方案与复盘，沉淀口径库、案例库与制度\n5. 推动预警机制嵌入项目流程，确保风险可预警、可跟进、可关闭\n6. 管理外部监测资源（如有），完善内部流转、复盘与风控机制\n\n任职要求\n1. 本科及以上，3 年以上舆情、公关、内容风控或相关质量分析经验\n2. 有完整舆情/风控机制搭建落地经验，能独立判断风险并给出口径与动作建议\n3. 反应快、文字功底扎实，能在压力下跨部门推动整改与对齐\n4. 原则清晰，熟悉主流平台内容规则与监测工具使用\n\n加分项\n有窗口期监测或危机处置成功案例；有竞品舆论攻防经验；有服务商管理经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "99", "title": "AI 视频制作师", "salary": "20K–30K", "location": "工作形式：远程", "jd": "\"岗位职责\n1. 负责短视频、产品宣传视频、品牌创意视频等全类型视频的AI全流程制作，熟练运用各类AI视频工具，完成脚本落地、素材生成、剪辑合成、特效包装、调色输出等工作，产出高质量原创视频内容。\n2. 结合品牌视觉规范、产品特性及短视频平台调性，优化AI视频创作逻辑，定制视频画面风格、镜头语言、字幕包装，保障视频内容优质、风格统一、贴合品牌调性。\n3. 探索并落地各类新型AI视频生成工具、AI剪辑、AI特效、数字人、AI配音等技术，持续优化视频制作流程，提升出片效率与内容质感，实现批量、高效、精品化内容产出。\n4. 配合品牌升级、产品运营、市场推广需求，承接Web、App、短视频账号等多端视频物料制作，严格按照交付标准、档期要求完成物料输出，保障多端视频视觉统一、内容合规。\n5. 参与视频创意脚本研讨、方案评审，根据品牌规范、运营反馈、用户喜好优化视频内容，整改画面瑕疵、风格偏差等问题，持续提升视频传播力与观感体验。\n6. 沉淀AI视频制作素材库、模板库、操作规范及创作方法论，整理优质视频案例，固化品牌视频包装标准，为常态化内容产出和品牌视觉统一提供支撑。\n\n任职要求\n1. 本科及以上学历，2年以上AI视频制作、短视频剪辑、影视后期相关工作经验，熟练掌握AI视频创作全流程，有成熟的个人视频作品案例。\n2. 熟练使用主流AI视频工具，精通剪映、PR、AE等后期剪辑包装软件，掌握AI文生视频、图生视频、AI特效、AI修图、数字人视频制作等技能，能独立完成全流程视频产出。\n3. 具备优秀的视觉审美、镜头语感和色彩把控能力，熟悉短视频、互联网品牌视频的创作逻辑，能精准贴合品牌风格完成差异化视频创作。\n4. 具备高效的内容产出能力，能适配多场景物料制作需求，严格把控交付进度与成片质量，抗压能力强，可配合项目档期高效完成工作。\n5. 具备良好的沟通协作能力，能配合品牌、运营、市场团队对齐需求，精准落地创作要求，主动复盘优化制作流程，持续提升内容品质与出片效率。\n\n加分项\n1. 有互联网品牌、短视频、泛娱乐行业AI视频制作经验，参与过品牌视觉升级、多端视频物料统一落地项目者优先。\n2. 熟练掌握Runway、Pika、即梦等主流AI视频工具，具备AI视频创意优化、瑕疵修复、高质量成片打磨经验。\n3. 具备脚本撰写、创意策划能力，可独立完成视频创意+AI制作全链路工作。\n4. 有品牌全案视频、产品宣传片、矩阵短视频批量制作经验，熟悉多平台视频内容规则与传播逻辑。\n\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "内容与创作"}, {"id": "100", "title": "高级运营-社媒运营", "salary": "12K-20K", "location": "工作形式：远程", "jd": "\"岗位职责\n1. 负责公司产品、短视频及新媒体矩阵整体运营工作，制定阶段性运营策略、年度/季度运营目标与落地计划，统筹推进全渠道运营工作，对用户增长、活跃度、内容曝光、转化数据等核心指标负责。\n2. 统筹各平台账号日常运营，涵盖短视频平台、App、Web端及新媒体渠道，负责内容选题、节奏规划、活动策划、热度追踪等工作，搭建标准化运营体系，保障账号稳定更新与数据持续增长。\n3. 结合产品特性、用户画像及行业热点，策划线上运营活动、话题营销、内容专题等，联动内容、视频、市场团队落地执行，提升品牌曝光、用户粘性及产品影响力，助力用户拉新、留存、促活。\n4. 负责运营数据监控与分析，定期梳理播放量、互动率、涨粉量、转化率等核心数据，复盘运营动作效果，挖掘数据问题与增长机会，持续优化运营策略、内容结构与推广方式。\n5. 对接品牌升级、内容焕新项目，对齐全渠道运营视觉风格、内容调性与传播节奏，统筹各渠道物料上线、内容分发与宣传推广，保障多端运营内容统一、节奏同步。\n6. 跟踪行业动态、竞品运营模式与平台规则变化，快速迭代运营打法，搭建用户运营、内容运营、活动运营标准化流程，沉淀运营SOP、案例库与方法论，提升整体运营效能。\n7. 统筹跨部门协作，对接视频制作、设计、市场、产品等团队，对齐运营需求、排期与交付标准，推动运营项目、营销活动高效落地，及时解决推进过程中的各类问题并闭环优化。\n\n任职要求\n1. 本科及以上学历，3年以上互联网、短视频、新媒体、泛娱乐行业运营管理经验，具备成熟的全渠道运营体系搭建与落地经验。\n2. 精通短视频、新媒体、产品线上运营逻辑，熟悉各大主流平台规则、流量机制与传播玩法，具备独立策划、落地运营项目及营销活动的实战能力。\n3. 具备优秀的数据洞察与复盘能力，能够通过数据拆解目标、定位问题、优化策略，有成功的账号增长、活动转化、用户运营落地案例优先。\n4. 拥有良好的热点敏感度、内容审美与营销思维，擅长结合行业热点打造优质内容与爆款活动，具备较强的用户思维与市场判断力。\n5. 具备出色的跨部门沟通、统筹协调与项目推进能力，目标感强、执行力高，可高效统筹多任务并行，抗压能力强，能适配项目节奏与迭代需求。\n6. 具备系统化运营思维，擅长流程搭建、标准梳理与团队效能优化，能够沉淀可复用的运营方法论，推动团队运营工作标准化、精细化落地。\n\n加分项\n1. 有短视频矩阵、新媒体品牌账号、互联网产品运营操盘经验，拥有百万曝光、爆款内容打造或用户规模化增长案例。\n2. 熟悉AI内容、AI视频行业，具备AI产品、数字内容相关行业运营经验，了解AI内容创作与传播逻辑。\n3. 具备品牌营销、内容策划、用户增长、活动运营专项优势，有完整的项目全案操盘与复盘经验。\n4. 有远程团队协作、跨团队项目统筹经验，擅长精细化运营与数据化管理。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "101", "title": "品牌策略负责人", "salary": "12K-20K", "location": "工作形式：远程", "jd": "岗位职责\n1. 从 0 到 1 设计并落地对内复制 + 对外赋能体系：标准、SOP、课程路径与材料包\n2. 把策略、案例、复盘转化为可带走的课程与工具，支撑业务与合作方独立运转\n3. 建立训后反馈与迭代机制，用真实反馈持续升级内容质量与落地效果\n4. 推动赋能动作嵌入项目节点（开工包、关键节点赋能、结项回收与课例沉淀）\n5. 与市场心智、舆情协同，把最新口径与框架同步进课程，保持体系不过时\n6. 跟踪赋能采用率与效果，输出迭代清单，对体系是否跑得起来负责\n\n任职要求\n1. 本科及以上，3 年以上企业培训、组织发展、方法论沉淀或品牌/运营赋能经验\n2. 有从 0 到 1 搭培训/赋能体系的经历，能独立完成课程产品化与落地推动\n3. 善于把复杂内容拆成可复制路径（课、包、SOP），表达清楚、结构感强\n4. 结果导向，关注采用与效果，不满足于「讲完课」\n\n加分项\n有 ToB 赋能或多组织落地经验；有品牌/策略内容转化经验；有训后效果评估体系搭建经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议", "cat": "运营与市场"}, {"id": "102", "title": "经营决策主管", "salary": "20K–30K", "location": "", "jd": "1.分析各业务线的经营情况、问题和机会，形成初步判断。\n2.跟踪市场、竞品和用户变化，提炼对业务有用的信息并落地成方案。\n3.参与新项目和重点事项评估，提出继续、调整、加码或暂停建议。\n4.输出分析结论和汇报材料，并跟踪后续结果。\n任职要求\n1.有业务运营、产品运营、增长、策略或分析相关经验，互联网行业。\n2.能快速理解业务，从复杂信息中抓住重点并形成观点。\n3.能结合基础数据和业务事实说明自己的判断。\n4.文字表达清楚，能够独立完成分析和汇报。\n加分项\n1.有互联网或线上业务相关经验5年以上。\n2.参与过新/老项目评估、业务调整或经营复盘的核心决策。", "cat": "产品与管理"}, {"id": "103", "title": "运营发展主管", "salary": "20K–30K", "location": "", "jd": "1.梳理重点事项、协同需求和资源需求，形成处理建议。\n2.将确认事项拆解为责任人、时间节点、交付结果和验收标准。\n3.跟踪跨部门事项进展，发现延期或卡点并推动解决。\n4.维护事项清单，定期输出进展、问题和复盘结论。\n任职要求\n1.有项目运营、业务运营、PMO、项目管理或交付管理相关经验。\n2.能把模糊问题整理成清晰的任务和推进计划。\n3.沟通和推动能力较强，能够协调不同团队持续跟进。\n4.有优先级和结果意识，做事有条理，能够推动事项闭环。\n加分项\n1.推动过多个部门共同参与的项目，自己是核心成员或负责人。", "cat": "运营与市场"}, {"id": "104", "title": "SEO运营专员 （AI工具赋能方向）", "salary": "18-35", "location": "", "jd": "SEO运营专员（AI工具赋能方向）\n\n【岗位职责】\n\n1. 负责 App、品牌自建站及自媒体矩阵的海外自然搜索流量增长，围绕 Google、Bing 等主流搜索引擎制定并执行 SEO 优化策略，提升核心关键词排名、页面收录量及自然流量转化效果。\n2. 负责站内 SEO 优化工作，包括 TDK 布局、页面结构优化、关键词部署、内容更新、内链建设、结构化数据优化、爬虫抓取异常排查、收录与排名监控等，保障网站具备良好的搜索引擎友好度。\n3. 借助 AI 工具提升 SEO 内容生产效率，完成多语种关键词挖掘、长尾词库搭建、内容选题规划、文案初稿生成、多语言内容改写、内容质检与基础纠错等工作，并结合人工二次精修，确保内容符合海外用户搜索意图、原创性要求和本地化表达习惯。\n4. 负责海外站外 SEO 建设，包括优质外链资源拓展、软文发布、友链合作、品牌相关内容铺设等，持续提升网站权重、品牌曝光度及海外搜索端正向声量。\n5. 每日监控网站流量、关键词排名、收录量、点击率、跳出率、停留
