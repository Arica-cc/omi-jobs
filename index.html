pplied Mathematics, or related fields.\n\nTechnical Skills\n\n• Strong expertise in Vision Foundation Models and a deep understanding of Diffusion Models, Vision Transformers (ViT), MAE, and related architectures.\n\n• Experience participating in or leading the complete pre-training lifecycle of large-scale vision or multimodal models with hundreds of millions (or billions) of parameters.\n\n• Strong understanding of dataset construction, data cleaning, training stability, and large-scale model optimization.\n\n• Hands-on experience with AIGC technologies, including Text-to-Image, Image-to-Image, and multimodal generation.\n\n• Proficient in Python and C++, with strong experience using PyTorch and excellent source code reading and secondary development capabilities.\n\n• Familiar with distributed training frameworks such as DeepSpeed, Megatron-LM, and FSDP, with hands-on experience in multi-node, multi-GPU training and compute resource management.\n\nPreferred Qualifications\n\n• Publications in top-tier AI conferences such as CVPR, ICCV, ECCV, NeurIPS, or ICLR.\n\n• Active contributor to GitHub, Hugging Face, or other open-source AI communities.\n\n• High-ranking achievements in AI competitions such as Kaggle.\n\n• Experience with TensorRT, CUDA programming, and low-level operator optimization.\n\n• Experience with High Performance Computing (HPC) environments.", "cat": "技术开发"}, {"id": "365", "title": "AI短剧编剧（欧美出海方向）", "salary": "面谈", "location": "", "jd": "岗位职责\n1. 负责欧美出海短剧的选题策划、故事构思、人物设定及完整剧本创作；\n2. 结合欧美观众的文化背景和内容偏好，设计开篇钩子、剧情冲突、情绪爽点及付费卡点；\n3. 把控故事结构、人物关系、剧情节奏和单集信息密度，确保剧本适合短剧形式；\n4. 持续研究海外短剧平台的热门题材、爆款作品及市场趋势，输出可落地的内容方向；\n5. 根据项目数据、用户反馈及制作要求，持续优化剧本节奏和情节设置；\n6. 使用AI工具辅助完成资料调研、创意拓展、剧本分析及内容优化；\n7. 与制片、分镜、生成、剪辑及运营人员协作，推动剧本顺利进入制作环节。\n\n任职要求\n1. 具备短剧编剧、网络文学、影视剧本或相关内容创作经验；\n2. 具备完整的故事创作能力，能够独立完成人物设定、故事大纲、分集梗概及剧本；\n3. 熟悉强冲突、快节奏、高情绪密度的短剧创作方式；\n4. 了解欧美文化、审美偏好及内容消费习惯，对海外短剧市场有一定研究；\n5. 具备良好的英语读写能力，能够阅读英文资料、理解英文剧本；\n6. 能够熟练使用ChatGPT、Claude、Grok等AI工具辅助创作；\n7. 具备良好的沟通协作能力，能够根据制作要求及时调整剧本。\n\n优先考虑（加分项）\n1. 有欧美出海短剧、海外网文或ReelShort类项目经验；\n2. 有已上线短剧作品或完整项目经验；\n3. 熟悉海外短剧付费模式及卡点设计；\n4. 能够提供完整剧本、上线作品或过往项目案例。\n\n应聘资料\n请提供个人简历、代表作品及相关项目案例，并注明个人在项目中负责的具体内容", "cat": "内容与创作"}, {"id": "366", "title": "中级运营专员", "salary": "10K–20K", "location": "", "jd": "岗位职责\n1. 独立负责产品运营工作，包括产品规划、内容运营、用户运营、活动策划及商业化转化；\n2. 根据产品目标制定阶段性运营方案，拆解关键指标并推动执行落地；\n3. 持续跟踪新增、活跃、留存、内容消费及付费等核心数据，发现问题并提出优化方案；\n4. 负责用户路径、内容结构、会员权益及付费场景的分析与优化；\n5. 结合市场趋势、竞品动态和用户需求，提出产品迭代及新方向建议；\n6. 协调产品、技术、设计、内容及渠道等岗位，推动需求按计划上线；\n7. 建立运营SOP、数据看板及复盘机制，提升团队执行效率；\n8. 能够独立承接项目，对项目进度、运营数据和最终结果负责。\n\n任职要求\n1. 具备3年以上互联网产品运营、内容运营或用户运营经验，有完整项目经验；\n2. 熟悉产品运营全流程，能够独立完成方案制定、执行推进及数据复盘；\n3. 具备较强的数据分析能力，能够通过数据定位问题并推动业务优化；\n4. 对用户增长、内容消费、留存提升及商业化转化有实际经验；\n5. 具备良好的项目管理和跨部门协作能力，能够推动复杂事项落地；\n6. 具备较强的业务判断能力，能够主动发现问题并提出解决方案；\n7. 结果导向，执行力强，能够适应项目快速调整和多任务推进；\n8. 具备团队管理、项目负责人或小组管理经验者优先。\n\n优先考虑\n1. 有视频、短剧、内容平台、社区或泛娱乐产品运营经验；\n2. 有海外产品、出海内容或海外用户运营经验；\n3. 有产品从0到1搭建、老产品优化或商业化提升经验；\n4. 熟悉AI工具，并能够应用于内容生产、数据分析及日常运营；\n5. 能够提供过往项目数据、运营案例或完整复盘材料。", "cat": "运营与市场"}, {"id": "367", "title": "新媒体运营", "salary": "12K–16K", "location": "", "jd": "岗位职责\n1. 负责国内外新媒体平台的账号矩阵搭建、内容运营及流量增长；\n2. 根据不同平台的用户特点，制定账号定位、内容方向、发布策略及增长计划；\n3. 独立完成选题策划、素材判断、文案包装、内容发布及数据复盘；\n4. 持续研究平台算法、热门内容和竞品账号，测试并沉淀可复制的流量打法；\n5. 负责账号养护、风险控制及异常处理，提高账号使用率和存活率；\n6. 跟踪曝光、互动、涨粉、点击及引流转化等数据，持续优化内容和承接路径；\n7. 配合产品、内容及运营团队完成活动推广、品牌传播和用户引流；\n8. 建立账号管理、素材管理、发布排期及数据复盘等标准化流程；\n9. 能够独立负责平台或项目方向，并对阶段性流量及转化结果负责。\n\n任职要求\n1. 具备3年以上新媒体运营、内容增长或海外社媒运营经验；\n2. 熟悉X（Twitter）、Telegram、TikTok、YouTube、Instagram等海外平台，或抖音、快手、小红书等国内平台；\n3. 具备成熟的选题策划、内容包装及账号运营能力，有从0到1起号经验；\n4. 熟悉平台推荐机制、账号风控及内容审核规则；\n5. 具备较强的数据分析能力，能够通过数据判断内容效果并快速调整方向；\n6. 对热点、用户兴趣及内容趋势敏感，能够持续测试新的内容形式；\n7. 具备较强的执行力和结果意识，能够同时管理多个账号或平台；\n8. 具备良好的沟通协作能力，能够与内容、设计、剪辑及运营团队高效配合。\n\n优先考虑\n1. 有海外新媒体矩阵、出海产品推广或海外用户增长经验；\n2. 有成功起号、爆款内容、账号涨粉或引流转化案例；\n3. 熟悉视频、短剧、泛娱乐或内容产品推广；\n4. 能够使用AI工具完成选题、文案、素材处理及数据分析；\n5. 具备新媒体团队管理或项目负责人经验；\n6. 能够提供运营账号、数据截图或过往项目案例。\n\n应聘资料\n请提供个人简历及相关项目案例，并说明：\n主要负责过的平台及账号类型；\n账号规模、涨粉及引流转化数据；\n个人负责的具体工作和取得的结果。", "cat": "运营与市场"}, {"id": "368", "title": "短剧生成师学徒", "salary": "6K–10K", "location": "", "jd": "岗位职责\n1.使用ChatGPT及其他AI工具生成短剧内容，包括创意构思、故事大纲、分集梗概及单集对白；\n2.根据短剧内容特点，设计剧情冲突、情绪爽点、人物关系及结尾钩子；\n3.测试不同的Prompt策略和生成方式，寻找质量更稳定、出稿效率更高的方法；\n4.参与剧目选题和内容方向讨论，判断不同题材的看点、爆点及用户吸引力；\n5.对AI生成的内容进行筛选、修改和优化，解决剧情不顺、逻辑不通及对白生硬等问题；\n6.拆解热门短剧的题材、结构、节奏及钩子设计，总结可以复用的内容方法；\n7.协助整理短剧生成流程、Prompt模板及操作SOP，将有效的方法沉淀下来。\n\n任职要求\n1.不限专业及科班背景，但需要对故事、情绪和人物关系有一定感觉；\n2.具备基本的内容审美，能够判断一段剧情是否有吸引力；\n3.使用过ChatGPT或类似AI工具，愿意反复测试、调整和优化生成结果；\n4.平时有观看短剧、影视剧或阅读小说的习惯，知道短剧开场要抓人、结尾要留钩子；\n5.具备基本的文字表达能力，写过日记、评论、剧评、故事或文案均可；\n6.对热门内容有好奇心，看到爆款作品愿意主动拆解其结构和爆点；\n7.学习能力和执行力强，能够接受反复修改，并按要求完成阶段性任务；\n8.具备良好的沟通协作能力，能够及时理解并落实修改意见。\n\n优先考虑\n1.写过剧本、小说、故事或其他原创内容；\n2.有短视频、自媒体或其他内容创作经验；\n3.对Prompt设计或AI内容生成流程有自己的理解；\n4.使用过多种大模型或其他AI内容工具；\n5.能够提供文字作品、内容账号或AI创作案例。\n\n应聘资料\n请提供个人简历，并简要说明：\n1.使用过哪些AI工具，主要用于哪些场景；\n2.平时是否观看短剧，熟悉或感兴趣的题材有哪些；\n3.是否有故事、剧本、评论、剧评或短视频文案等创作经历；\n4.对AI内容生成或Prompt测试有哪些实际经验；\n5.如有相关文字作品、内容账号或AI创作案例，请一并提供。", "cat": "内容与创作"}, {"id": "369", "title": "AI短剧生成师（画面生成方向）", "salary": "15K–18K", "location": "", "jd": "岗位职责\n1. 根据剧本和分镜要求，使用MiniMax、Seedance等AI工具生成短剧视频镜头；\n2. 完成人物定妆、场景设计、参考图制作及基础视觉风格确定；\n3. 负责图片和视频提示词设计、参数调试、任务生成及失败任务重做；\n4. 控制角色形象、服装、场景及画面风格的一致性；\n5. 发现并处理角色漂移、动作异常、画面失真、镜头穿帮等问题；\n6. 根据剪辑和质检反馈完成镜头返修、补帧、重生成及素材替换；\n7. 按照项目要求完成素材命名、分类、整理及交付；\n8. 记录生成数量、成功率、返修率、耗时及制作成本，配合优化生产效率；\n9. 与编剧、分镜、工作流工程师、剪辑及质检人员协作，确保项目按时交付。\n\n任职要求\n1. 熟悉MiniMax、Seedance等AI视频生成工具，具备实际生成经验；\n2. 熟悉主流AI生图工具，能够完成人物定妆、场景图及镜头参考图制作；\n3. 具备较强的提示词设计和参数调试能力；\n4. 能够理解剧本和分镜，并将文字要求准确转化为可用画面；\n5. 具备基础的镜头语言、构图、光影、色彩及视觉审美能力；\n6. 具备角色一致性和画面连续性控制意识；\n7. 执行力强，能够按照标准流程完成批量化生产任务；\n8. 具备良好的沟通能力，能够快速理解修改意见并完成返修。\n\n 优先考虑\n1. 有AI短剧、AI漫剧或批量视频生成经验；\n2. 熟悉ComfyUI基础操作及常用生图工作流；\n3. 熟悉Flux、SDXL、LoRA、ControlNet等模型或技术；\n4. 具备分镜设计、剪辑或影视制作经验；\n5. 能够提供AI生成短剧、人物定妆图、分镜或视频作品。\n\n应聘资料\n请提供个人简历及相关作品，并简要说明：\n常用的AI生图和视频生成工具；\n日常可完成的视频镜头数量；\n角色一致性及异常画面处理经验；\n个人在相关项目中负责的具体工作。", "cat": "内容与创作"}, {"id": "370", "title": "AI 模型训练师 / AIGC 模型工程师", "salary": "15K–25K", "location": "", "jd": "岗位候选人画像：模型训练 + 本身用模型就做出产品 \n岗位职责\nLLM 大模型微调\n负责主流开源大语言模型的微调、评测与部署，包括 Qwen、DeepSeek、Llama 等；\n熟悉 SFT、LoRA、QLoRA、PEFT 等微调技术，能够完成数据准备、训练、评测、模型迭代全流程；\n能够针对垂直业务场景构建训练数据集，并持续优化模型效果。\nAIGC 图像 / 视频模型训练\n负责 Stable Diffusion、FLUX、Qwen-Image/Qwen-Image-Edit 等图像模型的 LoRA 微调及效果优化；\n熟悉角色 LoRA、风格 LoRA、服装/场景 LoRA 等训练方式；\n能针对 AI 短剧场景优化人物一致性、画风一致性、场景一致性及连续镜头效果；\n了解图生图、文生图、图生视频、视频生成等主流 AIGC 技术。\nComfyUI 工作流开发\n熟练使用 ComfyUI，能够独立搭建、调试和优化复杂工作流；\n熟悉 ControlNet、IP-Adapter、LoRA、Face/ID Reference、Inpainting、Upscale 等常见能力；\n能够将 ComfyUI Workflow 封装为 API，并接入实际业务生产系统；\n能够定位显存溢出、节点依赖、模型兼容、推理速度等问题。\n模型推理与性能优化\n负责模型推理性能、显存占用、吞吐量和响应时间优化；\n熟悉 FP16/BF16/FP8/INT8/INT4 等量化及混合精度方案；\n了解 vLLM、TensorRT-LLM、SGLang、ONNX Runtime、Torch Compile 等推理加速技术；\n了解 Tensor Parallel、Pipeline Parallel、多 GPU 推理及模型并行；\n能根据 GPU 型号、显存和业务并发设计合理的部署方案。\nAI 短剧生产能力建设\n参与 AI 短剧「剧本 → 分镜 → 角色 → 图片 → 视频 → 配音 → 成片」生产链路建设；\n研究角色一致性、连续分镜、动作控制、表情控制、镜头控制等关键技术；\n熟悉主流图片/视频生成模型及相关工作流；\n能针对短剧生产中的质量、速度、成本进行模型选型和优化。\nLinux / GPU 环境运维\n熟悉 Linux 常用命令、Shell、进程/端口/磁盘/网络等基础运维；\n能独立完成 NVIDIA Driver、CUDA、cuDNN、PyTorch 等 GPU 环境搭建和问题排查；\n熟悉 Docker，能够完成 AI 模型服务容器化部署；\n能处理显存不足、CUDA OOM、驱动版本冲突、依赖冲突、多 GPU 调度等常见问题；\n了解 Nginx、Docker Compose、Kubernetes 者优先。\n任职要求\n计算机、人工智能、软件工程等相关专业，有 AI 模型训练或 AIGC 项目经验；\n熟练掌握 Python、PyTorch，具备实际模型训练和调优能力；\n有 LLM SFT / LoRA / QLoRA 实际项目经验；\n有 Stable Diffusion、FLUX、Qwen-Image 等图像模型 LoRA 训练经验；\n熟练使用 ComfyUI，能够独立设计复杂 Workflow；\n对 GPU、CUDA、显存、模型量化和推理优化有较深入理解；\n熟悉 Linux 环境，具备基本服务器部署和故障排查能力；\n对 AI 图片、AI 视频、数字人、AI 短剧等方向有较强兴趣和技术敏感度；\n具备较强的模型效果分析能力，能够通过数据、Prompt、训练参数、模型结构和工作流持续改善最终效果。\n加分项\n有 AI 短剧、漫剧、AI 视频生成项目实际落地经验；\n有角色一致性、人物 LoRA、风格 LoRA、视频 LoRA 训练经验；\n熟悉 Diffusers、Transformers、PEFT、DeepSpeed、Accelerate；\n熟悉 Wan、HunyuanVideo、Seedance、Kling、Veo、MiniMax 等视频生成模型或平台；\n有 vLLM / SGLang / TensorRT-LLM 大模型推理部署经验；\n有多卡训练、分布式训练、Tensor Parallel 实战经验；\n熟悉 FFmpeg、OpenCV、视频抽帧、数据清洗及自动标注；\n有模型数据集构建、Caption、自动打标、数据质量治理经验；\n有 4090 / 5090 / A100 / H100 等 GPU 服务器实际部署和优化经验；\n具备 Docker / Kubernetes / GPU 集群运维经验。\n核心能力关键词\nLLM / SFT / LoRA / QLoRA / PEFT / PyTorch / Transformers / Diffusers / ComfyUI / Stable Diffusion / FLUX / Qwen-Image / ControlNet / IP-Adapter / AIGC / AI Video / AI短剧 / vLLM / SGLang / TensorRT-LLM / CUDA / Multi-GPU / Docker / Linux / FFmpeg\n我们希望你是\n不是单纯“调用模型 API”的应用开发，而是能够真正深入到 数据 → 训练 → 模型 → 推理 → 工作流 → GPU 部署 → 业务效果 整个链路的人。\n最终目标是：把模型训出来、把效果调出来、把推理速度提上去，并真正投入 AI 短剧生产。", "cat": "技术开发"}, {"id": "371", "title": "agent架构师", "salary": "20k-35k", "location": "", "jd": "AI平台架构师 / AI 基础设施架构师\n岗位方向：AI Platform / Agent Infrastructure / Cloud Native / GPU Infrastructure\n经验要求：8 年以上开发/架构经验，3 年以上 AI 相关项目经验优先\n岗位职责\n负责公司 AI 平台及 AI 应用基础设施的整体架构设计与技术落地，支撑 AI Agent、AIGC 图像/视频、大模型 API、模型推理等业务稳定运行。\n不仅要求具备传统后端及云原生架构能力，还需要理解当前 AI 应用的技术体系，能够完成从：\nAI 应用 → Agent → 模型服务 → GPU 算力 → Kubernetes → DevOps → 可观测性\n的完整技术架构设计。\n1. AI 平台架构\n负责公司 AI 平台整体技术架构设计、技术选型及核心模块建设。\n负责 AI Agent、LLM、AIGC 图像/视频等业务的基础架构设计。\n建设统一 AI Gateway，对接 OpenAI、Claude、Gemini、DeepSeek、Qwen、MiniMax 及私有部署模型。\n设计统一模型调用层，实现模型路由、Fallback、负载均衡、限流、熔断、重试及成本控制。\n设计 Agent Runtime / Tool Runtime，支撑 Tool Calling、MCP、Workflow、异步任务等能力。\n建设模型、Prompt、Agent、Workflow 的版本管理和发布体系。\n负责 AI 服务高可用、高并发、可扩展架构设计。\n2. Python / Go 后端架构\n熟练使用 Python + Go 进行后端及基础设施开发。\nPython 方向熟悉 FastAPI、Pydantic、AsyncIO、Celery 等常见技术。\nGo 方向熟悉 Gin、Fiber、gRPC 等技术体系。\n熟悉 REST API、WebSocket、SSE、gRPC 等通信方式。\n熟悉微服务、分布式系统、任务队列、缓存、数据库及对象存储等基础架构。\n能够针对 AI 长任务、GPU 任务设计异步任务系统。\n具备高并发、限流、熔断、降级、幂等、重试、分布式锁等实际工程经验。\n3. Kubernetes / 云原生\n精通 Kubernetes 生产环境部署及运维。\n熟悉 Deployment、StatefulSet、DaemonSet、Job、CronJob、Service、Ingress、HPA、PVC 等核心资源。\n熟悉 Helm / Kustomize。\n能够设计多 Namespace、多环境、多集群部署架构。\n熟悉 Pod 调度、资源限制、健康检查、滚动更新、自动扩缩容。\n能够快速定位 Pod Pending、OOMKilled、CrashLoopBackOff、MinimumReplicasUnavailable 等常见问题。\n熟悉 GPU Kubernetes 调度，包括 NVIDIA Device Plugin、GPU Resource、Node Selector、Affinity/Taint/Toleration 等。\n有 EKS / ACK / GKE / Azure AKS 等公有云 Kubernetes 生产经验优先。\n4. GPU / AI Infra\n理解 GPU 推理服务的部署和资源管理。\n熟悉 NVIDIA GPU、CUDA、显存、GPU Utilization 等基本概念。\n能够设计 GPU 资源池及任务调度机制。\n熟悉多 GPU / 多节点推理场景。\n熟悉模型加载、模型缓存、冷启动、显存回收及 OOM 处理。\n理解 FP16 / BF16 / FP8 / INT8 / INT4 等推理优化方式。\n有 vLLM、SGLang、TensorRT-LLM、Triton Inference Server 等经验优先。\n有 ComfyUI / Diffusers / 图像视频生成任务的 GPU 调度经验优先。\n5. CI/CD & DevOps\n负责公司 AI 系统完整 DevOps 体系建设，包括：\nGit → Build → Test → Image → Registry → Deploy → Monitor → Rollback\n熟悉 Git / Gitea。\n能够基于 Gitea Actions / Drone / Jenkins / Argo CD 等建设自动化流水线。\n熟悉 Docker 镜像构建及镜像优化。\n熟悉 Harbor 或其他 Docker Registry。\n熟悉 Helm 自动化部署。\n熟悉 GitOps。\n能够设计 Dev / Test / Staging / Production 多环境发布体系。\n支持灰度发布、滚动发布、蓝绿发布及快速回滚。\n建设代码、镜像、配置、模型、Workflow 的版本追踪体系。\n6. 云计算架构\n熟悉 AWS / 阿里云 / 腾讯云 / GCP 等至少一种主流云平台。\n熟悉 VPC、Subnet、NAT Gateway、Load Balancer、安全组、DNS 等基础网络。\n熟悉对象存储 S3 / OSS。\n熟悉 CDN。\n熟悉云数据库、Redis、消息队列等云服务。\n能够设计跨区域 / 多云架构。\n能够针对 AI GPU 业务进行云资源成本优化。\n有混合云 / 本地 GPU + 云 GPU 架构经验优先。\n7. 可观测性与稳定性\n建设完整的：\nMetrics + Logs + Traces + Alerts\n可观测体系。\n熟悉：\nPrometheus\nGrafana\nLoki / ELK / OpenSearch\nOpenTelemetry\nJaeger / Tempo\n能够针对 AI 系统建立：\nAPI 请求耗时\nToken 消耗\n模型成功率\nAgent Task 成功率\nWorkflow 执行时间\nGPU 利用率\nGPU 显存\nQueue Length\n模型推理耗时\n单任务成本\n等关键指标。\n负责线上故障定位、容量规划、性能优化及稳定性治理。\n任职要求\n必备能力\n计算机相关专业本科及以上学历优先。\n8 年以上软件开发 / 架构相关经验。\n有大型互联网系统、AI 平台或云原生平台架构经验。\n熟练掌握 Python 和 Go，至少一门达到高级水平。\n熟悉 Linux / Docker / Kubernetes。\n有 Kubernetes 生产环境实际管理经验，而不仅仅是部署过 Demo。\n熟悉微服务及分布式系统设计。\n熟悉 MySQL / PostgreSQL / Redis / MQ / Object Storage 等基础组件。\n熟悉 Gitea / GitLab / GitHub 等代码管理体系。\n有完整 CI/CD Pipeline 建设经验。\n熟悉至少一种主流公有云。\n有良好的系统设计能力。", "cat": "技术开发"}, {"id": "372", "title": "AI应用工程师", "salary": "20k-30k", "location": "", "jd": "AI Agent / AIGC 开发工程师\n岗位方向：AI Agent + ComfyUI + 图像/视频生成\n经验要求：3-8 年开发经验，有 AI Agent / AIGC 项目落地经验优先\n岗位职责\nAI Agent 系统开发\n负责 AI Agent 应用的架构设计、开发与落地，包括任务规划、Tool Calling、Workflow、Memory、RAG、多 Agent 协作等能力。\n基于 LangGraph、AutoGen、LlamaIndex、Spring AI 等框架构建 Agent 工作流。\n负责大模型 API 接入与统一封装，包括 OpenAI、Claude、Gemini、DeepSeek、Qwen、MiniMax 等模型。\n设计 Agent 与业务系统、第三方 API、MCP、浏览器自动化工具之间的调用机制。\n优化 Agent 的稳定性、任务成功率、上下文管理、Token 成本及执行效率。\nAIGC 图像生成能力建设\n负责 Stable Diffusion / SDXL / FLUX 等图像生成模型的工程化应用。\n熟悉 ComfyUI 工作流设计、节点开发、API 化及生产环境部署。\n能够搭建文生图、图生图、局部重绘、参考图生成、角色一致性、多图参考等工作流。\n熟悉 ControlNet、IP-Adapter、LoRA、Inpainting、FaceSwap、超分等常见技术。\n能够针对业务场景进行 Prompt、Sampler、Scheduler、CFG、Steps、LoRA 权重等参数调优。\nAI 视频生成能力建设\n负责图生视频、文生视频、参考视频生成等 AIGC 视频能力的接入和工作流建设。\n有 Wan、HunyuanVideo、CogVideoX、LTX-Video、AnimateDiff 或其他主流视频模型使用经验。\n熟悉首尾帧、角色一致性、镜头控制、动作控制、多镜头连续生成等视频生成场景。\n能够结合 FFmpeg 完成视频拼接、转码、字幕、音频、抽帧、补帧、超分等后处理流程。\n对视频生成速度、显存占用、推理成本及生成质量进行持续优化。\nComfyUI 工程化\n负责复杂 ComfyUI Workflow 的设计、调试和服务化。\n能够将 ComfyUI Workflow 封装为 REST API / WebSocket 服务并接入业务系统。\n开发或改造 ComfyUI Custom Nodes。\n处理模型、LoRA、VAE、ControlNet 等资源的动态加载和管理。\n优化 GPU 调度、任务队列、并发控制、OOM 恢复及任务失败重试机制。\n模型部署与推理优化\n负责 GPU 推理环境搭建及模型部署。\n熟悉 PyTorch、CUDA、Docker 等基础技术。\n熟悉 FP16 / BF16 / FP8 / INT8 / INT4 等常见量化及推理优化方式。\n能够分析 GPU 显存、利用率、推理耗时等性能指标。\n有多 GPU、模型并行、任务调度、Kubernetes GPU 部署经验优先。\n任职要求\n必备能力\n计算机、人工智能、软件工程等相关专业，本科及以上学历优先。\n3 年以上 Python / Java / Go 等至少一种语言的实际开发经验，Python 熟练者优先。\n有真实 LLM / AI Agent 项目开发经验，而非仅调用 Chat API。\n熟悉 Prompt Engineering、Function Calling / Tool Calling、RAG、Memory、Workflow 等 Agent 核心技术。\n熟悉至少一种 Agent 框架：LangGraph / AutoGen / LlamaIndex / Spring AI 等。\n熟练使用 ComfyUI，能够独立设计和调试复杂 Workflow。\n熟悉 Stable Diffusion / SDXL / FLUX 等 Diffusion / Flow Matching 图像生成技术。\n有 LoRA、ControlNet、IP-Adapter、Inpainting 等实际使用经验。\n有至少一种主流 AI 视频模型的实际使用经验。\n熟悉 Linux、Docker、Git，具备基本 GPU / CUDA 环境排查能力。\n能够独立完成从技术调研、Demo 验证到生产系统落地的完整过程。\n加分项\n有 ComfyUI Custom Node 开发经验。\n有 LoRA 训练、DreamBooth、模型微调经验。\n熟悉 Diffusers、Transformers、Accelerate 等 Hugging Face 技术栈。\n熟悉 DiT、Diffusion、Flow Matching、VAE、CLIP、Transformer 等生成模型基本原理。\n有角色一致性、多人物一致性、参考图重绘、视频一致性相关项目经验。\n有 AI 短剧、AI 漫剧、数字人、AI 广告、AI 视频生产平台等项目经验。\n有图像/视频模型推理加速经验。\n有多 GPU 推理、GPU 资源池、K8s GPU 调度经验。\n有 MCP / Browser Automation / Playwright 等 Agent 工具开发经验。\n有 Agent Observability、Tracing、Prompt/模型效果评测体系建设经验。\n有高并发 AI SaaS 平台或模型 API Gateway 建设经验。\n我们希望你解决的问题\n这个岗位不是单纯做“大模型 API 调用”，也不是单纯配置 ComfyUI。\n我们希望候选人能够把：\nLLM → Agent → Workflow → ComfyUI → 图像模型 → 视频模型 → GPU 推理 → 业务系统\n真正串成完整的生产链路。\n例如：\n用户输入需求\n→ Agent 理解需求\n→ 自动拆解任务\n→ 生成角色 / 场景 / 分镜\n→ 自动选择模型、LoRA 和 Workflow\n→ ComfyUI 生成角色与场景\n→ 图生视频\n→ FFmpeg 后处理\n→ Agent 检查结果并自动重试 / 调参\n→ 输出最终视频。\n最终目标是建设一套能够自动完成 “创意 → 图片 → 视频 → 成片” 的 Agentic AIGC 生产系统。\n核心技术关键词\nAI Agent\nLLM / Agent / LangGraph / AutoGen / LlamaIndex / Spring AI / ReAct / Tool Calling / MCP / RAG / Memory / Workflow / Multi-Agent\nAIGC\nComfyUI / Stable Diffusion / SDXL / FLUX / LoRA / ControlNet / IP-Adapter / Inpainting / Diffusers\nAI Video\nWan / HunyuanVideo / CogVideoX / LTX-Video / AnimateDiff / Image-to-Video / Text-to-Video\n工程化\nPython / PyTorch / CUDA / Docker / Kubernetes / FFmpeg / REST API / WebSocket / GPU Scheduling", "cat": "技术开发"}, {"id": "373", "title": "产品经理", "salary": "20k-30k", "location": "", "jd": "AI 产品经理 / 项目运营\n岗位方向：AI Agent / AIGC / AI 视频 / 项目管理 / 产品运营\n经验要求：3-7 年产品或项目经验，有 AI 产品经验优先\n岗位职责\n负责公司 AI 产品从 市场调研 → 产品设计 → 项目推进 → 上线 → 数据分析 → 用户反馈 → 持续迭代 的完整生命周期。\n产品主要涉及：\nAI Agent、AI 工作流、AIGC 图像生成、AI 视频生成、AI 短剧/内容生产、无限画布等方向。\n要求既具备产品经理能力，也能够承担项目管理及产品运营工作。\n1. AI 产品规划\n负责 AI 产品整体规划、需求分析和版本迭代。\n深入理解用户在 AI 图片、AI 视频、AI Agent、内容创作等场景下的实际需求。\n将用户需求转化为明确的产品方案、业务流程和 PRD。\n设计产品核心功能、用户路径及交互逻辑。\n根据业务目标制定产品 Roadmap 和版本计划。\n持续跟踪 AI 行业变化，快速判断新模型、新技术的产品价值。\n重点关注：\nAI Agent\nAI Workflow\nAI 图片生成\nAI 视频生成\nAI 短剧\n无限画布\n角色一致性\n多图参考\n图生视频\n文生视频\n数字人\nAI 内容生产\n2. AI 产品体验与效果评测\n能够从用户和产品角度评估不同 AI 模型及方案。\n例如：\n同一个需求分别使用多个模型进行测试，对：\n生成质量 / 角色一致性 / 指令遵循 / 视频稳定性 / 生成速度 / 成本 / 成功率\n进行横向比较。\n建立产品内部 AI 能力评测标准，协助研发决定：\n什么场景使用什么模型，什么时候切换模型，以及哪些模型值得接入。\n不要求候选人训练模型，但需要理解：\nLLM\nAgent\nPrompt\nComfyUI\nStable Diffusion\nLoRA\n图生图\n图生视频\n文生视频\n等基本概念。\n3. PRD 与原型设计\n负责输出完整产品文档，包括：\n产品需求文档 PRD\nUser Story\nUser Flow\n功能流程图\n产品原型\n验收标准\n埋点方案\n版本 Release Notes\n熟练使用：\nFigma / Axure / MasterGo / 墨刀等产品设计工具。\n能够把复杂 AI 能力设计成普通用户能够理解和使用的产品功能。\n尤其关注 AI 产品中的：\n等待、失败、重试、任务队列、进度展示、模型选择、参数配置、历史记录、结果对比\n等交互体验。\n4. 项目管理与推进\n承担项目 Owner / 项目经理职责。\n协调：\n产品 / UI / 前端 / 后端 / Agent / 算法 / AIGC / 测试 / 运维\n共同推进项目。\n负责：\n需求拆解\n任务排期\n优先级管理\nSprint 规划\n每日进度跟踪\n风险识别\nBug 跟踪\n上线验收\n项目复盘\n能够明确：\n谁负责、什么时候完成、当前卡在哪里、如何解决。\n确保产品按照计划上线，而不是 PRD 写完后等待研发推动。\n5. 产品运营\n产品上线后持续跟踪真实使用情况。\n重点关注：\nDAU / MAU\n新增用户\n用户留存\n功能使用率\nAI 任务创建量\nAI 任务成功率\n图片/视频生成成功率\n用户平均生成次数\n用户付费转化\nARPU\nToken / GPU 成本\n单图片成本\n单视频成本\n根据数据和用户反馈持续优化产品。\n能够发现：\n用户在哪里流失、哪些功能没人用、哪些功能成本过高、哪些 AI 效果用户不满意。\n6. 用户与社区运营\n负责收集真实用户反馈。\n通过：\n用户访谈\n用户群\nDiscord / Telegram\nReddit\nX\nYouTube\nTikTok\n小红书\n抖音\nB站\n等渠道了解 AI 用户需求及行业趋势", "cat": "产品与管理"}, {"id": "374", "title": "项目开发工程师-视频站方向（Golang）", "salary": "20k-30k", "location": "", "jd": "岗位职责\n1. 负责视频平台核心链路的设计与研发，包括视频上传、转码调度、播放鉴权、CDN 分发、弹幕评论等业务的高并发、大流量系统建设，持续优化 QPS 与 P99 延迟，做好容量预估、热点缓存与无状态扩缩容。\n2. 负责服务端性能优化，包括路由优化、连接池管理、数据库查询优化、缓存设计、静态化及消息队列等能力建设，保障媒资处理与播放链路的稳定高效。\n3. 负责服务端高可用与稳定性建设，包括限流、降级、熔断、重试、超时控制、监控告警及灰度发布、回滚机制，保障大促、直播高峰等场景下的可用性。\n4. 参与数据库架构优化，包括表结构设计、索引优化、分库分表方案设计、业务一致性保障及数据迁移方案制定，支撑海量视频元数据与用户行为数据。\n5. 推动工程化体系建设，包括单元测试、集成测试、CI/CD 流程、监控体系、日志追踪及代码规范落地。\n6. 参与系统架构评审，输出技术方案文档，推动跨团队协作与项目落地（涉及转码、CDN、播放器、内容安全等团队）。\n7. 持续优化系统性能、稳定性及研发效率，支撑视频业务快速发展。\n\n任职要求\n\n1. 3 年以上后端开发经验，熟练使用主流 Go 开发框架（Gin、go-zero、Kratos 任一），具备扎实的 Go 语言开发能力。\n2. 熟练使用 mongo-go-driver、go-redis、go-elasticsearch 等数据访问客户端，具备相关项目实践经验。\n3. 熟悉 gRPC、Protobuf，能够独立完成服务间接口设计与开发。\n4. 具备完整的 CI/CD 及容器化交付经验，熟悉 Docker、Kubernetes、GitLab CI 或 GitHub Actions。\n5. 熟悉 zap 或 slog 日志体系、Prometheus 监控指标及 OpenTelemetry 链路追踪，具备良好的代码规范与工程化意识。\n\n加分项\n\n1. 具备高并发系统开发经验，熟悉 Redis、Kafka、RabbitMQ、Redis Stream 等中间件的应用与优化。\n2. 熟悉 Elasticsearch 索引设计、聚合查询及性能调优，具备问题排查与优化经验。\n3. 了解视频处理相关技术栈，熟悉 FFmpeg、HLS/DASH、CDN 分发、视频转码或直播协议（RTMP/HLS/WebRTC）者优先。\n4. 具备 MySQL 性能优化、慢 SQL 分析、Nginx 调优经验，具备较强的问题定位及线上故障排查能力。\n5. 具备前端基础能力，了解 HTML、CSS、JavaScript 及 SEO 相关原理。", "cat": "内容与创作"}, {"id": "375", "title": "UI 设计师（视频网站）", "salary": "15k-22k", "location": "", "jd": "岗位：UI 设计师（视频网站）\n岗位职责\n\n- 负责视频网站 Web 端 / App 端 UI 设计，覆盖首页、频道页、播放页、搜索、个人中心等核心页面\n- 和产品、前端一起做需求评审，输出高保真设计稿、切图标注和交互说明\n- 建立并维护设计规范（组件库、色板、字号、间距），保证多端体验一致\n- 跟进设计还原度，上线前走查，有问题及时改\n- 关注竞品和设计趋势，定期给团队分享可落地的改进点\n\n要求\n\n- 3 年以上 UI 设计经验，有完整的视频 / 内容类产品项目经历（带作品集）\n- 熟练使用 Figma、Sketch、PS 等工具，动效工具（AE、Principle）会加分\n- 懂视频场景的设计逻辑：封面信息层级、进度条 / 弹幕 / 倍速等控件交互、暗色模式适配\n- 有国际化设计经验，能处理以下场景：\n  - 多语言适配：文案长度弹性、语言切换后的布局自动适配\n  - 多地区审美差异：欧美、东南亚、中东等不同市场的封面风格、色彩偏好、本地化素材\n  - 本地化规范：币种、时区、日期格式、分级制度在不同地区的展示\n- 理解基础前端实现（HTML/CSS），知道什么设计能落地、什么做不了\n- 沟通直接，能说清设计理由，不闷头画图\n- 有责任心，自己出的稿子自己跟到上线\n\n加分项\n\n- 做过出海产品，熟悉 TikTok、YouTube、Netflix 等海外产品的设计模式\n- 有设计系统搭建经验\n- 有长视频 / 短视频 / 直播类产品经验", "cat": "内容与创作"}, {"id": "376", "title": "编剧", "salary": "10-20k", "location": "", "jd": "岗位职责\n1. 结合内容方向、用户偏好、平台热点和商业目标，制定选题计划并完成故事概念、人物设定及剧情大纲。\n2. 将小说、故事梗概、网文素材或原创创意改编为符合短剧节奏的剧本，完成删减、合并、重组和二次创作。\n3. 设计人物关系、故事线、冲突、情绪节点、反转、爽点及集尾钩子，确保内容具有持续观看吸引力。\n4. 输出分集大纲、正文剧本和分镜卡，明确场景、角色、动作、镜头意图及关键画面需求，为导演和AI生成提供清晰输入。\n5. 与导演、AI生成师、剪辑师协作，根据生成效果、制作限制和用户反馈持续调整剧本与分镜。\n6. 沉淀选题库、题材模板、故事结构和创作规范，参与项目复盘并持续提升内容生产效率。\n任职要求\n1. 大专及以上学历，影视、中文、新闻、编导、新媒体等相关专业优先。\n2. 2年以上短剧、网文、影视、动漫或短视频编剧经验，具备完整项目作品或可验证的作品集。\n3. 熟悉短剧或短视频叙事节奏，能够设计强冲突、强反转、强钩子并控制单集信息密度。\n4. 具备较强的故事拆解、剧情重构、人物塑造和台词表达能力，能独立完成从大纲到成稿的创作。\n5. 对AI图片、AI视频生成流程有基本了解，愿意根据模型能力调整剧本与分镜表达。\n6. 沟通和执行能力强，能够适应较快的内容生产节奏，并对交付质量负责。\n加分项\n• 有爆款短剧、爆款网文、漫剧或高传播内容项目经验。\n• 完整参与过AI短剧从选题、剧本、生成到成片的全流程。\n• 具备基础数据分析意识，能够根据完播率、互动率等指标优化剧情结构。", "cat": "内容与创作"}, {"id": "377", "title": "开发工程师", "salary": "20-35k", "location": "7. 认可远程协作方式，核心工作时段能稳定在线、响应及时、交付稳定，能适应高频沟通和快速迭代节奏。", "jd": "岗位职责\n1. 具备全栈理解能力，能贯通产品需求、前端页面、后端接口、数据流转和部署上线全链路，不局限于单一模块或单一网站，在自己的主攻方向上能独立判断、能兜底。\n2. 面向公司多条网站产品线，开发内容管理、素材库、任务编排、审核流转、跨站分发、数据看板等平台级通用能力，避免各产品线重复造轮子。\n3. 建设AI能力接入层，包括大模型、图像/视频生成模型及第三方API的调用，基于 Go、Python 处理异步任务、流式输出、限流、重试、降级和成本控制，支撑文案生成、封面生成、内容生成等多种AI使用场景。\n4. 建设日志、权限、告警、质量追踪等基础设施，保障多站点平台的稳定性、安全性与可观测性；参与代码评审、测试、部署和性能优化，推动研发规范落地。\n5. 把AI工具实际用进日常开发、联调、排障和文档沉淀，持续提升个人和团队的交付效率。\n6. 具备强自驱和强复盘意识，能把踩坑经验、技术方案、操作规范和排障案例系统性沉淀为团队资产，推动团队形成统一的工程质量标准。\n7. 与内容、运营、SEO等多个业务方保持高频沟通，能把不同产品线偏模糊、甚至相互冲突的诉求，转化为可执行、可复用的技术方案。\n任职要求\n1. 本科及以上学历，计算机、软件工程、人工智能等相关专业优先。\n2. 3年以上后端、全栈或平台型产品开发经验，最好有同时支撑多个网站/产品线的经验，能独立负责模块从设计到上线的完整过程。\n3. 熟练掌握 Go、Python，两项技术栈均具备实际项目开发经验，具备扎实的工程能力、编码规范和代码质量意识；能够根据不同业务场景合理选择技术方案。\n4. 熟悉RESTful API、数据库、缓存、消息队列或任务调度，能处理高并发、幂等、异步任务和异常恢复问题，有支撑多站点/多业务线的架构经验优先。\n5. 了解大模型API调用、Prompt工程、RAG、Function Calling或Agent工作流中的至少两个方向，对AI开发工具有研究或强烈兴趣，能够使用Python完成AI能力接入及相关服务开发。\n6. 熟悉Linux、Docker及至少一种云服务或容器部署环境，具备CI/CD和线上问题排查经验。\n7. 认可远程协作方式，核心工作时段能稳定在线、响应及时、交付稳定，能适应高频沟通和快速迭代节奏。", "cat": "技术开发"}, {"id": "378", "title": "Prompt优化工程师", "salary": "15-25k", "location": "6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。", "jd": "岗位职责\n1.具备从选题、内容形态到最终呈现效果的全链路理解能力，覆盖文案、图片、视频等多种内容形态，不局限于写Prompt本身。\n2.梳理编辑、运营、AI生成、剪辑等岗位的实际生产场景，分别定义可复用的文本类Prompt规范（标题、文案、SEO内容）和视觉类Prompt规范（封面、画面生成），建立结构化模板及负面提示词库。\n3.对主流文本大模型、图像和视频生成模型进行系统性对比测试，记录不同内容场景下的模型能力边界、参数效果、失败模式和成本差异，在自己主攻的方向上能独立判断、能兜底。\n4.设计A/B测试与量化评测指标，衡量可用率、一致性、点击率/审美质量、生成耗时和单条素材成本，用数据而非主观感受驱动优化。\n5.与运营、AI生成师和开发团队协作，把验证有效的Prompt和评测方法沉淀到平台、工作流或自动化评测工具中，让好经验能够复用推广。\n6.具备强自驱和强复盘意识，持续跟踪模型更新和行业实践，把踩坑记录、失败模式和最佳实践系统性整理为团队资产，并组织内部培训，推动团队形成统一的提示词工程标准。\n任职要求\n1.本科及以上学历，中文、新闻、设计、计算机、人工智能等相关专业优先。\n2.2年以上AIGC、Prompt工程、内容生产或模型评测经验，具备可验证的项目案例。\n3.熟悉主流文本大模型及文生图、视频生成模型，理解文案生成、参考图、首尾帧、镜头控制、风格迁移和一致性控制等不同方法。\n4.具备较强的文字表达、结构化思考和实验设计能力，能把个人经验转化为可复用的模板、流程和评测标准。\n5.能阅读模型文档、英文资料和社区案例，独立快速验证新技术并形成结论。\n6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。\n7.对内容质量和数据结果敏感，具备跨团队沟通和培训输出能力。\n加分项\n1.具备Python脚本、数据处理或自动化评测能力。\n熟悉ComfyUI、LoRA、模型微调或本地推理。", "cat": "技术开发"}, {"id": "379", "title": "中高级产品经理", "salary": "15-30k", "location": "", "jd": "岗位职责\n一、产品规划与需求分析\n负责 C 端产品及核心功能的规划与迭代；\n结合业务目标、用户需求、市场趋势及竞品情况制定产品方案；\n深入分析需求背景及目标，能够识别真实用户需求，而非简单承接业务需求；\n完成产品原型、PRD、业务流程及功能逻辑设计；\n持续优化产品架构、核心功能及用户体验。\n二、用户体验与产品迭代\n关注用户使用路径及核心业务场景；\n通过用户反馈、行为数据及业务数据发现产品问题；\n持续优化注册、使用、内容消费、互动、留存、付费等核心链路；\n关注产品细节及交互体验，推动体验问题持续改善；\n结合产品不同生命周期制定对应的迭代策略。\n三、数据分析与增长\n建立数据驱动的产品工作方式；\n关注新增、活跃、留存、转化、付费等核心产品指标；\n通过数据分析定位产品问题及增长机会；\n针对重点功能制定上线目标及效果验证指标；\n持续跟踪版本上线后的数据表现，形成“需求—上线—数据—复盘—迭代”闭环。\n四、项目推动与落地\n负责需求从规划、评审、设计、研发、测试、验收到上线的完整推进；\n制定合理的版本计划及项目排期；\n协调 UI、研发、测试、运营等相关团队推进项目落地；\n及时识别项目风险、资源冲突及进度问题，并推动解决；\n对负责产品的交付质量、上线结果及后续表现持续跟进。\n五、市场与竞品研究\n持续关注行业趋势、用户变化及竞争产品动态；\n定期开展竞品分析及市场调研；\n能够从竞品中分析产品定位、业务模式、用户场景及核心策略，而非简单进行功能对比；\n结合业务实际提出具有可落地性的产品优化及创新方案。\n⸻\n任职要求\n基本要求\n3年以上互联网 C 端产品经理相关经验；\n具备完整的产品需求分析、产品设计及项目落地经验；\n能够独立负责产品或核心业务模块；\n熟悉互联网产品研发流程及产品生命周期管理；\n熟练使用 Axure、Figma、墨刀等产品设计工具及常用项目管理工具；\n具备基本的数据分析能力，能够通过数据辅助产品判断。\n能力要求\n具备较强的 C 端产品思维和用户意识，能够站在用户、业务及产品多个角度分析问题；\n具备良好的需求分析能力，能够从表层需求进一步拆解业务目标和真实用户需求；\n具备较强的逻辑思维及产品架构能力，能够独立完成复杂业务及功能设计；\n具备数据驱动意识，能够通过数据发现问题、验证需求及评估版本效果；\n具备较强的项目推动能力，能够主动协调资源并推动问题解决；\n具备良好的沟通表达、跨部门协作及执行能力。\n加分项\n有内容社区、短视频、社交、泛娱乐、工具类等 C 端产品经验；\n有从 0-1 产品建设或核心产品重大版本迭代经验；\n有用户增长、会员体系、付费转化、社区互动等产品经验；\n有成熟产品的数据分析、用户研究及增长实验经验；\n具备一定商业化产品思维，能够兼顾用户体验与业务经营目标；\n熟悉 AI 产品或能够将 AI 工具应用于需求分析、竞品研究、产品设计及日常工作。\n4.有跨团队推动能力，能把事情真正落地。\n5.有较强执行力和抗压能力，能处理需求冲突与优先级判断，独立推进项目落地。\n6.具备较强的Owner意识，对结果负责。\n7.在日常工作中已将AI工具深度融入产品工作流，包括但不限于：使用AI辅助需求分析、竞品调研、文档撰写、原型生成、数据洞察等环节，能主动探索并落地AI提效手段。\n8.有团队管理经验或带教经验者优先。\n三、加分项\n1.熟练使用一种或多种AI原型/设计工具（如Figma AI、Codex、Claude AI、ChatGPT、Grok、Cursor等），能提供使用AI工具生成的原型案例作为参考。\n2.有播放器、内容、消费、社交、资讯等行业经验。\n3.做过增长、商业化相关项目。\n4.有技术背景或设计背景。", "cat": "产品与管理"}, {"id": "380", "title": "高级增长运营", "salary": "10-30k", "location": "", "jd": "岗位职责\n1.负责全渠道流量转化链路优化，通过优化官网点击率、各端安装率（iOS/安卓）及渠道转化逻辑，提升整体获客效率。\n2.通过前端逻辑调整与策略干预，提升用户拉单触发频率，以高频行为带动商业化转化。\n3.设计商业化策略：包括低门槛首充产品（如周会员）设计以降低付费门槛、提升新增付费率；规划高价值套餐（月/季包）及代金币体系，优化定价策略提升ARPPU表现；通过Push、站内信等手段建立老用户触达机制，提升续费召回率与老用户充值占比。\n4.基于\"拉单-付费率-ARPU\"等核心影响链路开展数据建模与实验验证，通过数据反馈持续迭代增长路径。\n5.建立数据看板与归因分析机制，围绕获客质量（点击转化率、安装转化率、渠道转化率）、增长规模（拉单率、拉单触发频次）、变现效率（新增付费率、ARPPU、综合ARPU）、存量经营（续费召回率、充值占比）等核心指标持续复盘优化。\n6.沉淀增长打法、实验结论和SOP，推动团队及其他产品线复用有效经验。\n任职要求\n1.5年以上用户增长、运营增长或商业化运营经验，有从0到1、1到10或规模化增长项目经验，能用数据说明个人贡献和业务结果。\n2.具备成熟的模型思维，能理清获客、拉单、付费、留存各环节指标间的联动关系，擅长拆解\"提升路径\"寻找业务增长点。\n3.有视频、工具或订阅类产品运营背景，熟悉付费门槛设置、套餐定价及代金币体系设计。\n4.具备扎实的数据分析能力，能从ARPU、ARPPU、付费渗透率、拉单率、安装转化率等指标波动中定位核心问题并产出解决方案。\n5.具备优秀的产品逻辑梳理能力，能推动前端逻辑调整、支付配置及运营策略高效落地。\n6.有跨部门沟通协作经验，能协调产品、技术、渠道、商务等团队推进项目落地。\n加分项\n1.具备自动化任务跟进或多Agent协同工作意识。\n2.有视频、内容或垂直领域成功增长案例。\n熟练使用SQL、BI工具或增长实验平台。", "cat": "运营与市场"}, {"id": "381", "title": "高级产品运营", "salary": "10-30k", "location": "", "jd": "岗位职责\n1.负责平台内容的上架管理，包括内容排期、元数据维护（标题、简介、标签、分类）、封面与物料把控；建立并持续优化内容标签体系，保障内容库结构清晰，对站内检索、推荐及用户浏览友好。\n2.负责首页、频道页、分类页、专题页等核心流量场的内容编排，策划片单、专题、榜单等运营栏目；结合播放数据、用户偏好及热点动态调整推荐位，提高优质内容曝光效率、点击率及播放转化。\n3.制定内容上线节奏及更新排播计划，包括定档、预告、上线、连载更新、完结等运营节奏；配合重点内容进行站内宣发及资源位配置，放大头部内容的拉新、活跃及留存价值。\n4.持续跟踪播放量、点击率、完播率、人均观看时长、内容拉新及留存贡献等核心指标，定期进行内容消费数据复盘，将结论转化为选片、编排及推荐调整策略。\n5.参与内容评估及引入建议，协助对接内容方、制作方或版权方，完成内容物料交付、信息整理及上线跟进。\n6.参与付费内容、会员专享内容及重点内容的运营策略制定，结合节假日、热点事件及平台活动完成内容侧策划与落地，提升会员内容消费及付费转化。\n任职要求\n1.本科及以上学历，3年以上视频/内容平台产品运营经验。\n2.熟悉内容运营全链路，包括排期上架、元数据管理、标签分类、运营位编排、专题策划等，至少独立负责过其中两个核心环节。\n3.具备较强的数据敏感度，能看懂内容播放漏斗，独立完成内容消费数据复盘，并根据数据提出具体的选片、推荐位及内容编排调整动作。\n4.对内容具备较强判断力，熟悉主流内容品类及题材趋势，能判断内容是否具备流量潜力，在选片、推荐及内容编排方面有自己的方法论。\n5.具备基本的文案及审美能力，能独立完成专题标题、内容简介、推荐语、标签及封面物料把控。\n6.有会员付费内容、单片付费、内容解锁或类似商业化运营经验者优先。\n加分项\n1.有内容采买评估、版权方或内容制作方对接经验。\n2.熟悉推荐系统基本逻辑，有根据用户行为数据优化内容推荐或与算法团队协作的经验。\n3.熟练使用AI工具提升内容运营效率，例如批量整理元数据、标签生成、简介生成、封面初筛及内容分类等。", "cat": "运营与市场"}, {"id": "382", "title": "中高级内容运营", "salary": "10-30k", "location": "", "jd": "岗位职责\n要求有成人行业经验\n1.负责平台整体内容运营，制定内容分类、标签、专题、搜索页等内容策略，提升内容流量、用户留存与转化效率。\n2.负责内容矩阵的选题方向制定与更新排期统筹，跟踪内容数据表现（播放、完播、转化等），持续分析优化内容策略及运营打法，定期输出数据分析报告支撑业务决策。\n3.统筹站外推广工作，包括自媒体矩阵、TG频道、外链渠道等内容分发及曝光提升策略，跟踪竞品及行业动态持续优化增长模型。\n4.带领并考核内容/运营团队成员，把控内容更新、文案优化、专题活动等产出质量，对接平台端内容规范落地。\n5.定期对内容数据进行复盘，包括流量来源、搜索关键词、用户行为、转化路径等，形成优化方案并推动落地执行。\n6.建设选题库、素材库、标签体系和内容SOP，提升团队协作效率与内容复用率。\n7.对齐业务目标，推动跨团队协作，完成内容相关的临时性/专项工作。\n任职要求\n1.本科及以上学历，3年以上内容运营、短视频运营或网站运营相关经验，有细分内容领域行业经验者优先。\n2.具备较强的数据分析能力，能通过流量、留存、转化、用户行为等核心数据发现问题并制定优化策略。\n3.熟悉内容生态与SEO运营逻辑，对分类结构、标签体系、专题页、关键词布局、搜索流量增长等有实战经验。\n4.有站外推广、自媒体矩阵运营或社群运营经验，熟悉TG频道运营者优先。\n5.具备一定的团队协作或带教经验，能统筹多任务并推进落地。\n6.责任心强，抗压能力好，能适应快节奏的业务需求。\n加分项\n1.熟悉Google Analytics、Search Console等数据工具，有搜索引擎流量增长经验优先。\n2.有多站点/矩阵站点运营经验。\n3.有海外渠道（Telegram、Twitter、Facebook、Reddit等）运营经验。", "cat": "内容与创作"}, {"id": "383", "title": "AI生成师（必须会剪辑）", "salary": "10-30k", "location": "", "jd": "岗位职责\n1. 理解剧本、分镜和视觉参考，拆分角色、场景、道具、动作和镜头，形成结构化的生成任务。\n2. 根据不同内容需求选择文生图、图生视频、首尾帧、参考图等生成方式，配置模型、参数和生成工作流。\n3. 进行批量生成与“抽卡”筛选，从构图、角色一致性、动作自然度、光影、风格和瑕疵等维度判断素材可用性。\n4. 维护角色、场景、服装、道具和风格资产库，记录Prompt、参数、版本、成本及最终选用结果。\n5. 针对生成失败、连贯性不足、画面崩坏等问题持续迭代提示词和工作流，提升一次通过率与批量生产效率。\n6. 与编剧、导演、剪辑和开发团队协作，反馈工具问题，沉淀提示词模板、案例库和标准操作流程。\n任职要求\n1. 大专及以上学历，数字媒体、动画、视觉设计、影视制作、美术等相关专业优先。\n2. 1年以上AIGC内容生产经验，或具备能够证明生成能力的作品集与项目案例。\n3. 熟悉主流文生图、图生视频及视频生成工具，理解常用参数、参考图、首尾帧和风格控制方法。\n4. 具备较强的视觉审美和画面判断能力，能够识别角色漂移、结构错误、运动异常等常见问题。\n5. 具备提示词编写、结构化实验和持续迭代能力，能够承担一定强度的批量生产任务。\n6. 工作细致、耐心、责任心强，能够适应快速变化的模型和工具生态。\n加分项\n• 熟悉ComfyUI、工作流编排、LoRA训练或模型部署。\n• 有AI短剧、AI漫剧、广告或内容平台的稳定量产经验。\n• 能够编写脚本或小工具提高素材整理、批量生成和评测效率。", "cat": "内容与创作"}, {"id": "384", "title": "编辑专员", "salary": "8-12k", "location": "", "jd": "岗位职责\n1. 根据选题和资料分工，完成素材整理、标题撰写、封面选择、正文排版、关键词及标签填写，并按规范发布内容。\n2. 检查图片、视频、链接和页面展示效果，发现无法播放、跳转错误或内容缺失等问题及时反馈。\n3. 配合热点内容更新、专题整理、合集维护及基础宣发工作。\n4. 遵守内容审核标准与发布流程，完成修改意见的落实和复查。\n\n**任职要求**\n\n1. 具备基本的文字表达、信息检索和图片处理能力，能熟练使用PS/PR等常见办公工具。\n2. 做事细致，能够按标准检查标题、封面、排版、标签和素材质量。\n3. 对热点内容有一定敏感度，愿意学习内容运营和数据基础知识。\n4. 有内容编辑、社区运营或短视频相关经验者优先；优秀应届生亦可。\n\n**岗位成长方向**\n\n熟练掌握内容制作与审核标准后，逐步承担独立选题、合集策划、质量复审和新人带教工作。\n\n岗位要求：带作品，包含  标题、文案、关键词、标签以及图片视频处理前和处理后的", "cat": "内容与创作"}, {"id": "385", "title": "中高级运营", "salary": "8-15k", "location": "", "jd": "岗位职责\n1. 负责指定网站或 App 的日常运营，跟踪 DAU、MAU、新增、留存、流量来源和内容表现，输出经营简报。\n2. 组织内容更新、专题活动、首页推荐和站点巡检，发现访问、播放、链接、评论及页面展示异常并推动处理。\n3. 分析数据波动，区分搜索、直连、推荐等来源变化，提出调整方案并跟踪结果。\n4. 与产品、技术、SEO等团队协作，明确需求、验收标准和完成时间，推动问题闭环。\n5. 指导编辑执行内容标准，开展抽检、反馈和复查。\n\n**任职要求**\n\n1. 具备网站或 App 运营经验，能够独立负责一个项目的日常运营。\n2. 熟悉 GA4、BI 或同类数据工具，能完成基础的数据对比、异常定位和复盘。\n3. 理解内容质量、访问链路、搜索流量和产品体验对业务指标的影响。\n4. 具备较强的执行、沟通和问题跟进能力，能清楚区分“已提出、推进中、已上线、已验收”。\n\n**考核关注**\n\n负责项目的数据稳定性、问题闭环率、内容质量、需求落地情况及复盘质量。", "cat": "运营与市场"}, {"id": "386", "title": "编辑专员", "salary": "8-12k", "location": "", "jd": "简历必须附带作品\n岗位职责\n1. 根据选题和资料分工，完成素材整理、标题撰写、封面选择、正文排版、关键词及标签填写，并按规范发布内容。\n2. 检查图片、视频、链接和页面展示效果，发现无法播放、跳转错误或内容缺失等问题及时反馈。\n3. 配合热点内容更新、专题整理、合集维护及基础宣发工作。\n4. 遵守内容审核标准与发布流程，完成修改意见的落实和复查。\n\n**任职要求**\n\n1. 具备基本的文字表达、信息检索和图片处理能力，能熟练使用PS/PR等常见办公工具。\n2. 做事细致，能够按标准检查标题、封面、排版、标签和素材质量。\n3. 对热点内容有一定敏感度，愿意学习内容运营和数据基础知识。\n4. 有内容编辑、社区运营或短视频相关经验者优先；优秀应届生亦可。\n\n**岗位成长方向**\n\n熟练掌握内容制作与审核标准后，逐步承担独立选题、合集策划、质量复审和新人带教工作。", "cat": "内容与创作"}, {"id": "387", "title": "中高级运营", "salary": "8-15k", "location": "", "jd": "简历必须附带作品\n岗位职责\n1. 负责指定网站或 App 的日常运营，跟踪 DAU、MAU、新增、留存、流量来源和内容表现，输出经营简报。\n2. 组织内容更新、专题活动、首页推荐和站点巡检，发现访问、播放、链接、评论及页面展示异常并推动处理。\n3. 分析数据波动，区分搜索、直连、推荐等来源变化，提出调整方案并跟踪结果。\n4. 与产品、技术、SEO等团队协作，明确需求、验收标准和完成时间，推动问题闭环。\n5. 指导编辑执行内容标准，开展抽检、反馈和复查。\n\n任职要求\n\n1. 具备网站或 App 运营经验，能够独立负责一个项目的日常运营。\n2. 熟悉 GA4、BI 或同类数据工具，能完成基础的数据对比、异常定位和复盘。\n3. 理解内容质量、访问链路、搜索流量和产品体验对业务指标的影响。\n4. 具备较强的执行、沟通和问题跟进能力，能清楚区分“已提出、推进中、已上线、已验收”。\n\n考核关注\n\n负责项目的数据稳定性、问题闭环率、内容质量、需求落地情况及复盘质量。", "cat": "运营与市场"}, {"id": "388", "title": "编辑专员", "salary": "8-12k", "location": "", "jd": "任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者\n\n岗位职责：\n1.负责网站内容的收集、撰写、剪辑及日常发布；\n2.具备良好的沟通能力，思维灵活、逻辑清晰；\n3.密切关注社交媒体热榜，快速响应热门内容、话题；", "cat": "内容与创作"}, {"id": "389", "title": "运营专员", "salary": "8-15k", "location": "", "jd": "岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态", "cat": "运营与市场"}, {"id": "390", "title": "UI设计", "salary": "10-20k", "location": "", "jd": "任职要求\n近期的（一两年）工作是体育/bc的作品不考虑。\n1.3年以上UI设计经验,有独立负责完整产品视觉的经验。\n2.精通Figma/Sketch/PS,能输出规范的设计稿与标注文件。\n3.熟悉Web、H5、App多端设计规范,理解响应式与适配原则。\n4.具备搭建和维护设计规范/组件库的能力,保证多端视觉一致性。\n5.熟悉交互设计基础,能配合产品完成原型到高保真的输出。\n6.具备一定动效设计能力,熟悉常见动效实现方式(Lottie等)。\n7.熟悉图标、插画、专题页等多种设计形式的产出。\n8.能理解业务目标与用户体验,主动提出优化建议而非被动执行。\n9.能与前端工程师紧密协作,把控还原度,推动设计走查。\n10.熟练使用AI辅助设计工具(如Midjourney、即梦等)提升效率。\n\n详细岗位JD\n1.负责App、Web、H5等多端产品的UI视觉设计与迭代。\n2.参与需求评审,理解产品目标与用户场景,输出设计方案。\n3.搭建和维护设计规范、组件库,保障多端体验一致性。\n4.配合产品完成交互原型,输出高保真设计稿与切图标注。\n5.负责专题页、运营活动页、广告banner等物料设计。\n6.把控前端还原度,组织设计走查,推动细节优化。\n7.关注行业设计趋势与竞品动态,持续提升产品视觉水平。\n8.沉淀设计规范文档与素材库,提高团队协作效率。", "cat": "内容与创作"}, {"id": "391", "title": "中高级白帽SEO优化专员", "salary": "12–20K", "location": "远程招聘｜中高级白帽SEO优化专员\n工作方式： 远程办公", "jd": "远程招聘｜中高级白帽SEO优化专员\n招聘人数： 2人\n薪酬范围： 10–18K，具体根据经验及能力面议\n工作方式： 远程办公\n主要方向： Google / Yandex SEO、内容型网站、多站点优化、技术SEO\n我们希望你能够独立负责网站SEO工作，不仅能发现问题、分析数据，也能制定优化方案，与运营及技术团队协作，推动需求开发、上线验收及后续效果验证。\n一、岗位职责\n1. 多站点SEO管理与日常巡检\n负责公司多个网站的Google、Yandex SEO优化及日常维护，根据各站点现状制定优化计划与执行优先级，持续提升有效收录、关键词覆盖及自然搜索流量。定期检查站点可访问性、页面状态、抓取与索引情况，以及站长平台异常、安全和版权相关通知，及时记录并协同处理。\n2. 数据监控与流量异常诊断\n使用Google Search Console、GA4、Yandex Webmaster 等工具，跟踪搜索点击、展示、点击率、排名、收录及自然搜索流量变化。\n能够按站点、目录、页面类型、查询词、设备及地区等维度拆解数据，结合网站改动记录、页面检查和必要的访问日志，排查流量下滑、排名下降、收录异常及爬虫访问异常，输出有依据的原因判断、优化方案和验证方法。\n3. 技术SEO与页面模板优化\n负责网站技术SEO检查及优化，包括TDK、H标签、Robots、Sitemap、Canonical、Noindex、HTTP状态码、301/302重定向、404及5xx错误、URL路由、分页、内链、结构化数据和HTML源码输出 等。\n检查页面源代码与渲染后的关键内容，定位模板重复、标签冲突、异常URL、重定向链、内容不可抓取等问题，并推动修复。\n4. 多域名管理与网站迁移\n负责主域名、www与非www、历史域名、镜像或备用域名等场景下的SEO规范，明确业务页面、CDN资源域名及源站直连地址的访问与索引边界。\n参与域名迁移及域名规范化工作，制定URL映射、重定向、Canonical、站内链接及Sitemap调整方案，并跟进迁移前检查、上线验收及迁移后的抓取、索引和流量变化。\n5. 新站建设与网站改版\n参与新站上线、网站重构及页面模板调整，在开发前制定SEO基础规范，覆盖URL结构、TDK、H标签、Robots、Sitemap、Tag体系、分页、内链、结构化数据及关键内容输出。\n识别改版对原有URL、收录页面和自然搜索流量的潜在影响，配合制定上线检查清单及异常处理方案。\n6. 优化需求编写与开发验收\n根据实际问题独立编写SEO需求文档，明确问题证据、影响范围、优先级、修改建议及验收标准，与运营、产品、前端、后端及运维人员沟通推进。\n负责测试服验收、正式服复查及上线后的数据跟踪，形成“问题发现—需求提交—开发调整—验收上线—复查验证”的完整工作流程。\n7. 关键词、内容与白帽外链建设\n开展关键词挖掘、搜索意图分析及竞争站研究，规划首页、分类页、Tag页、专题页和内容页的关键词布局，协同运营优化内容质量、页面结构及内链关系。\n通过优质内容传播、相关资源合作等合规方式开展外链建设，重视链接来源的相关性与真实性，不以链接数量作为唯一目标。\n8. AI与自动化工具应用\n使用AI工具及现有SEO Agent或自动化工作流，辅助开展站点巡检、搜索数据分析、抓取测试、异常URL筛选、报表生成及需求整理。\n能够对工具输出进行核验，发现误判、缺失数据和不合理建议；参与优化巡检规则、分析模板及工作流程，提高多站点管理效率。\n二、任职要求\n1. 具备独立负责SEO项目的经验\n原则上具备3年及以上SEO实操经验，有独立负责网站SEO项目的完整经历，能够提供真实、可核验的收录改善、关键词排名或自然搜索流量增长案例。项目经验扎实、能力突出者可适当放宽年限。\n2. 熟悉Google SEO，具备白帽优化意识\n熟悉Google搜索的抓取、渲染、索引及排名相关基础机制，能够围绕搜索需求、内容质量、网站结构及技术可访问性开展优化；了解Yandex Webmaster及常见抓取、索引问题，有Yandex项目经验者优先。\n坚持白帽SEO，不采用黑链、刷点击、站群作弊、面向搜索引擎的欺骗性内容展示或批量生成低价值页面等方式开展优化。\n3. 能够独立分析数据并定位问题\n熟练使用GSC、GA4等数据工具，能够区分搜索表现数据与站内访问数据，按页面类型、查询词及时间周期拆解变化，并进行必要的交叉验证。\n面对流量、排名或收录异常，能够提出可验证的排查假设，提供对应证据与处理优先级，而不只是汇总数据或给出泛泛建议。\n4. 具备扎实的技术SEO与基础开发理解能力\n熟悉Robots、Sitemap、Canonical、Noindex、重定向、HTTP状态码、URL、分页、Tag及结构化数据等技术SEO事项。\n能够阅读基础HTML、CSS、JavaScript，理解服务端渲染、客户端渲染、接口请求、URL路由、缓存及CDN等基础概念，初步判断问题属于页面模板、前端渲染、后端逻辑，还是服务器/CDN配置。不要求承担完整开发工作，但需要能够与技术人员有效沟通。\n5. 能够推动需求落地并完成验收\n能够独立编写清晰、可执行的SEO需求文档，向运营、产品及技术人员说明问题、修改目标和验收标准。\n具备测试与复查意识，能够核对实际源码、页面响应、重定向路径及上线配置，持续跟进问题解决，而不止于提交建议。\n6. 具备远程协作与多项目管理能力\n具备较强的自驱力、责任心和书面沟通能力，能够独立安排工作、管理多个站点的任务优先级，并按约定时间参与协作。\n能够及时同步重要异常、需求进度和阻塞事项，保留必要的检查记录、需求文档及验收结果。\n三、加分项\n有大体量内容站、多站点管理、网站迁移、网站重构，或Tag及分类聚合页质量治理经验。\n有Yandex SEO实操经验，能够结合站长平台数据、页面检查及日志分析抓取与索引问题。\n具备Python、正则表达式、API取数、BI看板或AI Agent工作流经验，能够编写或调整简单脚本；有CDN、缓存、WAF及访问日志排查经验。\n四、应聘资料\n请提供简历及1–2个代表性SEO项目案例，说明网站类型、负责周期、主要问题、本人承担的工作、具体优化措施及结果。\n可附脱敏后的GSC/Yandex数据、技术SEO排查报告、优化需求文档或上线验收记录。涉及保密项目，可隐藏域名及敏感业务数据，重点展示分析过程和个人实际贡献。", "cat": "运营与市场"}, {"id": "392", "title": "新媒体运营", "salary": "10–16K", "location": "", "jd": "一、岗位职责：\n1. 负责国外主流媒体平台整体运营规划，包括但不限于TikTok、YouTube、Instagram、Facebook、X 等平台；\n2. 根据业务发展方向制定平台运营策略、账号矩阵规划及阶段性增长目标；\n3. 深度研究各平台流量机制、推荐逻辑及内容生态，结合平台规则持续优化运营策略；\n4. 负责内容运营体系搭建，包括选题策划、内容方向、用户增长、互动运营及传播转化；\n5. 独立推进账号从0-1孵化及成熟账号增长，对账号数据结果负责；\n6. 定期分析平台数据及竞品动态，输出运营复盘及优化方案；\n7. 立账号运营标准及管理机制，降低平台风险，保障账号稳定运营。\n\n二、任职要求：\n\n1. 大专及以上学历，3年以上国外主流媒体平台运营经验；\n2. 熟悉TikTok、YouTube、Instagram、Facebook、X等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知；\n3. 具备成熟账号操盘经验，有成功案例或账号增长成果优先；\n4. 具备较强的数据分析及运营复盘能力，能够通过数据驱动内容及运营优化；\n5. 对热点趋势、内容传播及用户心理有较高敏感度；\n\n加分项：\n1. 有百万级曝光或成熟账号矩阵运营经验；\n2. 熟悉各个平台的成人内容账号起量手法/运营逻辑和安全风险规避，有可验证的成功的账号最佳\n3. 熟悉短视频内容运营及投流逻辑；\n4. 具备基础视频剪辑、内容策划或达人合作经验。", "cat": "运营与市场"}, {"id": "393", "title": "美术（专门作图）", "salary": "10-20k", "location": "", "jd": "岗位职责\n1.根据剧本、角色设定、分镜及视觉参考，使用AI生图工具完成角色、场景、服装、道具等资产图与宣发物料周边的生成与制作。\n2.根据不同项目风格和内容需求，选择合适的模型、参考图、Prompt及生成方式，输出符合项目要求的高质量视觉资产。\n3.负责AI生成图片的筛选和质量把控，从人物美感、构图、比例、光影、色彩、服装、材质及风格一致性等维度判断素材可用性。\n4.持续维护角色、场景、服装、道具及风格资产库，保证同一角色和同一项目下视觉风格、人物特征及整体质感统一。\n5.针对人物崩脸、手部异常、结构错误、服装穿帮、背景异常、风格漂移等问题持续调整Prompt、参考图及生成参数，提高资产一次通过率。\n6.与AI生图师、导演、编剧、剪辑等团队协作，根据项目需求快速调整视觉方案，并沉淀高质量资产模板和生成规范。\n任职要求\n大专及以上学历，美术、视觉设计、动画、数字媒体、影视制作等相关专业优先。\n1年以上AI生图、视觉设计、插画、原画或相关内容制作经验，有能够体现审美能力和AI生成能力的作品集。\n熟悉主流AI生图工具，能够熟练使用参考图、Prompt、局部重绘、图生图等方式完成资产生成。\n具备较高的视觉审美和画面判断能力，对人物五官、身材比例、服装搭配、构图、光影、色彩及整体质感有较强把控能力。\n能够快速识别AI图片中的人物漂移、结构错误、比例异常、风格不统一等问题，并通过调整生成方案进行优化。\n具备较强的风格理解和复刻能力，能够根据参考图快速还原指定美术风格，并保持批量素材的一致性。\n工作细致、耐心、责任心强，能够适应较快的内容生产节奏及一定规模的批量资产生成任务。\n加分项\n• 熟悉ComfyUI、Stable Diffusion、Flux、Midjourney等AI生图工具及相关工作流。\n• 熟悉LoRA、ControlNet、IP-Adapter、局部重绘、姿态控制、角色一致性等生成方法。\n• 有AI短剧、AI漫画、广告、游戏或内容平台资产批量生产经验。\n• 有较强的人像审美，尤其擅长人物脸型、五官、发型、服装、妆造及角色整体视觉包装。\n• 能够沉淀Prompt、工作流、模型、参数和参考图模板，提高团队批量生产效率。", "cat": "内容与创作"}, {"id": "394", "title": "AI视频剪辑师", "salary": "15-25K", "location": "", "jd": "岗位职责\n\n1. 负责品牌日常短视频、活动节点、专题宣传物料的 AI辅助剪辑、包装、调色、字幕及多版本导出；\n2. 独立承接 漫改二创、动漫混剪、剧情重组、氛围感卡点类视频 的全流程制作，并结合 AI 工具提升效率与表现力；\n3. 配合运营理解脚本意图，自主优化镜头节奏、转场、字幕、配乐及视觉包装，提升成片质感和完播体验；\n4. 结合 AI 工具完成 素材扩展、局部补帧、动态处理、封面优化、文案/字幕辅助生成 等工作；\n5. 统一品牌矩阵视频的视觉风格、配色、包装与模板规范，保持系列内容高级质感和一致性；\n6. 搭建并维护素材库、模板库、封面规范及 AI 剪辑工作流，沉淀可复用 SOP，提升团队整体交付效率；\n7. 跟踪播放、点击、互动等数据，持续优化剪辑节奏、封面风格和二创叙事逻辑；\n8. 适配业务紧急需求，快速产出热点专题、限时活动、深夜专区等高质感 AI 视频内容。\n\n二、任职要求\n\n1. 3年以上视频剪辑/后期相关经验，有短视频、二创、漫改、娱乐内容方向经验优先；\n2. 熟练使用 PR、AE、剪映 等剪辑工具，具备较强的节奏把控、调色、动态字幕、视觉包装和特效合成能力；\n3. 具备 AI 视频相关实操经验，能够使用 AI 工具辅助完成 视频生成、素材处理、字幕配音、封面优化、剪辑提效；\n4. 熟悉漫改二创、动漫素材拆解、情绪卡点、剧情重组、同人改编等内容表达方式；\n5. 具备较强审美和镜头语言认知，能独立把控画面质感、内容氛围和平台适配效果；\n6. 可独立完成从素材整理、粗剪、精剪、包装、字幕、封面到多规格导出的完整流程；\n7. 执行力强、抗压性高，适应快节奏和多任务并行交付；\n8. 有 AI 剪辑工作流搭建、模板沉淀、批量内容生产经验者优先；\n9. 有品牌矩阵统一风格管理、二创赛道经验或沉淀过视频 SOP 规范者优先。", "cat": "内容与创作"}, {"id": "395", "title": "中高级AI短剧编剧", "salary": "15K–25K", "location": "", "jd": "岗位JD：\n一、岗位职责\n1、原创博主IP短剧开发\n基于公司现有博主形象、人设及内容资产，完成世界观、人物关系、核心冲突和故事主线设计，开发具有鲜明辨识度、可持续连载和商业化潜力的原创短剧。\n2、热点IP改编与二次创作\n持续研究热门小说、影视剧、短剧及社会热点，提炼其中具有传播潜力的题材、人物和情节，在版权及平台合规范围内进行本土化、短剧化和差异化改编。\n3、完整剧本创作\n独立完成故事提案、人物小传、分集大纲及逐集剧本，强化开场钩子、矛盾升级、情绪刺激、反转节点和结尾悬念，确保内容符合短剧观看节奏及AI制作条件。\n4、建立剧本选题与评审机制\n从用户需求、内容差异化、制作难度、传播潜力和商业价值等维度评估选题，建立立项、评审、修改和定稿标准，提高优质剧本的筛选效率和落地成功率。\n5、筹建剧本库及资产管理体系\n建立原创、改编、储备剧本的分类体系，实现剧本资产的统一管理和复用。\n6、梳理剧本生产SOP\n搭建“选题研究—创意提案—大纲评审—剧本创作—定稿交付—成片复盘—数据反馈”的工作流程，沉淀创作模板、审核标准和质量检查清单。\n7、推动剧本落地与持续迭代\n与AI制作、剪辑、运营及产品团队协作，根据制作可行性优化场景、人物和情节设计；结合播放、完播、互动及付费数据复盘内容表现，持续调整创作方向。\n\n二、任职要求\n1、具备5年以上短剧、网文、影视剧、互动内容或相关领域的策划与编剧经验，有成熟作品或商业化项目案例。\n2、具备原创开发和改编能力，能够从零搭建人物与故事体系，也能将长篇小说、影视内容或热点题材重构为快节奏短剧。\n3、熟悉华人男性用户的内容偏好，能够准确把握冲突、悬念、反转、爽点和情绪价值，并将其转化为可持续连载的剧情。\n4、具备较强的系列化创作能力，能够统筹人物成长、故事主线、单集钩子和阶段性高潮，避免剧情同质化或简单套用模板。\n5、了解AI视频生产的基本特点，能够兼顾人物一致性、场景复杂度、制作成本和镜头实现难度，确保剧本具有实际可制作性。\n6、具备剧本库、内容资产或创作流程建设经验，能够承担标准制定、质量审核和方法论沉淀，不局限于单纯完成写稿。\n7、具备良好的数据意识和跨团队协作能力，能够根据用户反馈及产品数据快速调整剧本，并推动内容顺利进入制作环节。", "cat": "内容与创作"}, {"id": "396", "title": "视频剪辑师", "salary": "10k-15k", "location": "", "jd": "岗位JD描述\n一、岗位职责\n1.负责品牌日常短视频、活动节点、专题宣传物料的剪辑、视觉包装、调色精修及多版本导出；\n2.承接AI素材加工、二创、同人混剪、人物剧情重组、氛围感卡点视频剪辑制作\n3.配合运营拆解脚本意图，优化镜头节奏、转场配乐、字幕版式，把控成片质感与完播体验；\n4.统一全品牌视频视觉配色、包装体系与风格规范，保持系列内容高级质感与统一性；\n5.搭建分类素材库、剪辑模板与封面规范，沉淀复用流程，提升团队交付效率与标准化；\n6.参考视频播放、点击率、互动数据，迭代剪辑节奏与封面风格；\n7.适配业务紧急需求，快速产出深夜专区、限时活动、热点专题等高质感宣传剪辑物料。\n\n二、任职要求\n1.3年以上专业视频剪辑经验，有娱乐社群、信息流、IP同人二创剪辑经验优先；\n2.精通PR/AE，熟练使用剪映，具备专业调色、动态包装、特效合成能力，可独立高质量完成剪辑出片；\n3.具备相关剪辑作品集，擅长镜头解构、剧情重组、情绪卡点，有较强节奏把控与数据意识；\n4.网感审美在线，熟悉平台内容调性、热门玩法，可基于现有素材完成IP二次改编剪辑；\n5.能够利用AI输出素材进行视频加工剪辑，拒绝简单粗暴素材拼接；\n6.沟通协作顺畅，可多任务并行，接受高频迭代、排期管理与节点加急产出；\n7.有素材库搭建、剪辑模板沉淀、内容SOP标准化经验者优先。", "cat": "内容与创作"}, {"id": "397", "title": "AI陪伴产品运营（AI女友方向）", "salary": "12K-18K", "location": "", "jd": "岗位JD描述\n一、岗位职责\n1.负责成人向AI女友陪伴产品的整体运营，参与产品定位、目标用户分析、运营策略制定及上线冷启动，推动产品从0到1落地；\n2.围绕用户情感陪伴和成人互动需求，规划AI女友角色矩阵，包括人设、关系定位、对话风格、故事背景、互动场景及内容更新节奏；\n3.设计用户从注册、首次对话、关系升级到付费转化的完整运营路径，优化新用户激活、互动频次、次日及长期留存；\n4.策划会员订阅、虚拟礼物、剧情解锁、角色权益、限时活动等商业化玩法，持续提升付费率、客单价及用户生命周期价值；\n5.结合用户对话反馈和行为数据，协同产品及AI团队优化角色Prompt、回复质量、长期记忆、情绪反馈和内容丰富度，改善陪伴真实感与沉浸体验；\n6.搭建产品核心数据指标及复盘机制，持续跟踪注册转化、首聊率、互动轮次、留存率、付费率、ARPPU等指标，通过用户分层和A/B测试推动运营迭代；\n7.建立用户反馈、核心用户维护、流失召回及投诉处理机制，识别高价值用户需求，沉淀可复用的用户运营策略；\n8.负责竞品研究及行业趋势跟踪，持续分析AI陪伴、虚拟恋人、成人社交等产品的内容形态、商业模式及运营玩法；\n\n二、任职要求\n1.3年以上互联网产品运营、用户运营或内容运营经验，有AI陪伴、虚拟社交、聊天交友、互动娱乐、游戏或付费内容产品经验者优先；\n2.了解AI大模型及对话类产品的基本逻辑，能够参与角色Prompt、人设规则、对话效果及互动流程的配置、测试和优化；\n3.具备较强的用户洞察和内容策划能力，能够理解男性用户在情感陪伴、虚拟关系及成人互动场景中的核心需求；\n4.具备完整的用户增长和商业化思维，熟悉“拉新—激活—留存—付费—召回”运营链路，能够独立设计付费转化方案；\n5.数据敏感度较高，能够独立搭建指标体系、分析转化漏斗，并根据数据和用户反馈提出明确的优化方案；\n6.具备较强的文案及角色内容策划能力，能够独立完成人设、对话场景、关系成长线和活动方案设计；\n7.具备从0到1推进新产品或新项目的经验，目标意识强，能够主动拆解任务并推动跨部门协作落地；\n8.关注AI应用及成人内容行业发展，对新产品、新玩法和用户趋势保持敏感，能够接受成人向业务形态；", "cat": "运营与市场"}, {"id": "398", "title": "中高级运营专员", "salary": "15–20k", "location": "", "jd": "一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责创作者运营管理，推动创作者引入、分层、激励、活跃维护及产出提升，保障内容持续供给；\n5. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n6. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n7. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进；\n8. 根据业务发展需要，参与活动运营、专题策划、转化路径优化及其他与产品增长相关的专项工作。\n\n二、任职要求\n1. 3年以上互联网运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立负责从目标制定、策略拆解、执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有0-1项目搭建经验、复杂业务增长经验、多平台运营经验者优先；\n8. 有团队管理或带教经验者优先；\n9. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "运营与市场"}, {"id": "399", "title": "中高级运营专员（偏社区产品方向）", "salary": "12-16k", "location": "", "jd": "岗位JD描述\n岗位职责：\n1、参与社区产品的运营规划和迭代优化，并全盘负责产品日常维护。\n2、每日/每周监控内容发布后的核心数据。\n3、运用AI工具制作和统计基础的数据报表，能够发现数据异常。\n4、对热点敏感，知道平台用户喜欢看什么。\n5、配合其他岗位，完成活动任务或其他即时性任务。\n\n任职要求：\n1. 至少2年以上社区类、视频web类产品运营经验。\n2. 熟练使用AI工具及常用办公软件。\n3. 不抗拒看数据，能从枯燥的数据中发现问题。\n4. 需要具备良好的执行力、观察力，以及一定的抗压能力。", "cat": "运营与市场"}, {"id": "400", "title": "中高级运营专员（海外新媒体运营）", "salary": "13K-18K", "location": "", "jd": "岗位JD描述                                                                                                                                                                                                                                一、岗位职责：  \n  1. 负责公司视频App在海外主流社交平台（Twitter/X、TikTok、Instagram、YouTube、Facebook等）的账号运营与内容策划，实现用户引流与品牌曝光；\n  2. 根据各平台算法机制、内容调性及用户画像，制定差异化运营策略与内容分发方案；                                         \n  3. 策划并执行日常内容排期，包括图文、短视频、话题互动、社群运营等多种形式，持续提升账号活跃度与粉丝增长；\n  4. 紧跟海外社交平台热点趋势，快速策划借势内容，提升内容传播力与互动率；                                               \n  5. 搭建并维护各平台数据监控体系，定期输出运营数据报告（曝光、互动、导流转化等），基于数据持续优化运营策略；           \n  6. 对接内部内容创作、设计、产品团队，协调资源推动项目落地，确保内容产出质量与效率；                                                 \n   \n二、任职要求：                                                                                                        \n  1. 本科及以上学历，市场营销、新闻传播、新媒体、数字营销等相关专业优先，三年以上新媒体运营经验；                       \n  2. 熟悉Twitter/X、TikTok、Instagram、YouTube、Facebook等海外主流平台的运营规则、推荐算法及内容生态；\n  3. 有明确的导流/拉新成功案例，具备从内容到转化的全链路思维；                                                          \n  4. 具备较强的内容策划与文案撰写能力，对短视频及社交媒体内容有敏锐的网感；\n  5. 熟练使用数据分析工具，具备数据驱动运营的意识与能力；                                                               \n  6. 具备良好的跨团队沟通与项目推进能力，能独立负责多平台并行运营；                                                     \n  7.  简历请附过往运营案例或数据成果。", "cat": "运营与市场"}, {"id": "401", "title": "创作者运营", "salary": "12k-18k", "location": "", "jd": "简历筛选要点：\n1. 有影视类从业经验优先\n2. 具备有实际拍摄/导演/剧本策划经验和能力\n3. 有过往案例可查阅\n\n岗位JD描述\n一、岗位职责：\n1. 对已入驻的创作者，完成“冷启动”引导；\n2. 建立A/B/C多级创作者画像，制定差异化的扶持政策和激励方案；\n3. 引导创作者生产符合自身定位和平台调性的高质内容，有实际拍摄和剧本策划经验和能力；\n4. 解答创作者日常疑问，协助调查创作者违规情况，建立平台忠诚度；\n5. 收集创作者对创作工具、运营措施的需求，推动创作者生态搭建。\n\n二、任职要求：\n1. 3年以上影视类创作者运营&孵化经验，有MCN机构经历者优先；\n2. 极强的沟通协调能力，对创作者进行日常维护；\n3. 适应高强度节奏，能接受“管家式”服务属性。", "cat": "内容与创作"}, {"id": "402", "title": "中高级运营专员", "salary": "12k-15k", "location": "", "jd": "简历筛选要点：\n1. 有视频站、短剧从业经验\n\n岗位JD描述\n一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n5. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n6. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进。\n\n二、任职要求\n1. 3年以上互联网运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "运营与市场"}, {"id": "403", "title": "运营专员（动漫方向）", "salary": "12k-15k", "location": "", "jd": "简历筛选要点：\n1. 有二次元平台从业经验\n\n岗位JD描述\n一、岗位职责\n1. 负责成人二次元产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n5. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n6. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进。\n\n二、任职要求\n1. 3年以上二次元平台运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有成人二次元产品或运营经验者优先。", "cat": "运营与市场"}, {"id": "404", "title": "seo专员", "salary": "12k-18k", "location": "", "jd": "简历筛选要点：\n既懂 SEO、又具备产品经理思维，负责通过搜索流量增长带动业务转化。该岗位不只是做关键词和内容，更需要拆解产品需求、内容策略、技术优化和自动化工作流，并熟练使用 AI 工具提升效率。\n\n岗位JD描述\n一、岗位职责\n1. 负责公司 SEO 增长策略，包括关键词研究、竞品分析、内容规划、页面优化、站内结构优化和效果复盘。\n2. 从用户搜索意图出发，规划可落地的 SEO 页面、专题页、内容矩阵和转化路径。\n3. 与产品、技术、内容、运营团队协作，将 SEO 需求转化为清晰的 PRD、任务拆解和优先级排序。\n4. 使用 AI 工具搭建 SEO 工作流，例如关键词聚类、内容大纲生成、批量页面优化、标题/描述生成、内容质检、数据监控等。\n5. 能够使用 ChatGPT、Claude、Gemini、Perplexity、Notion AI、Airtable、Zapier、Make、n8n 等工具中的一种或多种，提高 SEO 生产和分析效率。\n6. 跟踪 SEO 数据表现，包括收录、排名、点击率、自然流量、转化率等，并定期输出优化建议。\n7. 关注搜索引擎算法、AI 搜索、AEO/GEO 等趋势，探索 AI 时代下新的搜索流量机会。\n\n二、任职要求\n1. 至少3年以上SEO相关经验，有独立负责SEO增长项目的经验。\n理解产品经理工作方式，能写需求文档、拆任务、排优先级，并推动跨团队落地。\n2. 熟悉关键词研究、内容 SEO、技术 SEO、站内链接、页面结构、Search Console、GA 等基础方法和工具。\n3. 对 AI 工具有实际使用经验，能把 AI 融入稳定的日常工作流。\n4. 具备较强的数据分析能力，能从流量、排名、转化等数据中发现问题并提出解决方案。\n5. 具备良好的内容判断力，能识别低质量 AI 内容，并建立内容质量标准。\n6. 自驱力强，能从模糊目标中拆出可执行方案。\n\n加分项\n有 SaaS、工具类产品、内容站、出海产品或平台型产品 SEO 经验。\n熟悉 Ahrefs、SEMrush、Screaming Frog、SurferSEO、Frase 等 SEO 工具。\n会使用 n8n、Make、Zapier、Airtable、Google Sheets、API 或简单脚本搭建自动化流程。\n对 AI Search、Google AI Overview、Perplexity、ChatGPT 搜索推荐机制有研究。\n有从 0 到 1 搭建 SEO 内容体系或 SEO 自动化流程的经验。", "cat": "其他"}, {"id": "405", "title": "紫禁内容线主管", "salary": "面议", "location": "", "jd": "岗位职责：\n1. 制定紫禁内容线业务规划及AI视频、短剧、漫画、小说生产目标。\n2. 统筹编剧、导演、美术、视频生成、剪辑、漫画及小说团队。\n3. 建立选题、生产、审核、交付、发布及复盘流程。\n4. 跟踪产量、周期、合格率、返工率、成本及内容效果。\n5. 统筹人员、工具、素材、预算及版权合规管理。\n6. 负责团队建设、绩效管理、人才培养及结果验收。\n\n任职要求：\n1. 具备内容、影视、短剧、漫画、小说或AIGC业务经验。\n2. 具备团队管理、目标拆解、资源统筹和项目推进能力。\n3. 熟悉规模化内容生产、质量管理和数据指标体系。\n4. 熟悉主流AI内容工具，具备成本及经营结果意识。\n5. 具备版权合规、内容安全和风险判断能力。\n6. 面试须提供代表性项目、团队管理案例、量化成果及30/60/90天规划。", "cat": "内容与创作"}, {"id": "406", "title": "承天海外线主管（短剧／AI内容）", "salary": "面议", "location": "", "jd": "海外业务主管（短剧／AI内容）\n\n岗位介绍\n负责海外短剧业务从市场选择、产品启动到增长与商业化的整体推进，统筹内容、运营及产品团队，对阶段性经营结果负责。\n业务涵盖普通向及成人向短剧，产品形态包括 Web 与 App。目标国家及上线顺序将结合市场研究与业务验证确定。\n\n岗位职责\n1.市场研究与业务规划\n研究不同国家的用户需求、竞争格局、内容消费及付费习惯，评估市场机会与进入条件，制定目标市场、产品定位和阶段性业务计划。\n2.产品从零到一建设\n联动产品与研发团队，明确 Web、App 的功能范围、需求优先级及上线节奏，推动内容发现、观看、付费和回访等核心体验建设，并根据用户反馈持续优化。\n3.内容策略与供给管理\n结合目标市场确定题材、内容形态及本地化方向，统筹 AIGC 内容团队的生产排期、质量与成本，推动内容表现复盘及供给优化。\n4.用户增长与运营\n组织社媒自然流量、SEO、合作渠道或付费推广等获客工作，优化站外传播到站内观看、付费与留存的转化路径，提升用户质量和投入效率。\n5.商业化与数据分析\n联动团队制定并验证收费方式、会员权益及用户运营策略，跟踪获客成本、观看转化、付费、留存、收入和内容成本，依据数据调整业务方向及资源投入。\n6.团队管理与跨部门协作\n统筹内容、运营及产品团队，明确目标、分工和验收标准，推进关键岗位建设、人才培养及跨团队问题解决。\n7.预算与业务风险管理\n管理业务预算及阶段性投入，协同法务、支付、技术等相关团队落实目标市场的内容、版权、隐私、年龄访问及平台要求，保障业务持续运营。\n\n任职要求\n1.具备海外互联网业务经验，有内容平台、数字内容付费、用户增长、产品运营或相关业务管理经历，能够说明本人承担的职责与实际成果。\n2.有从零到一启动产品、新市场或新业务的完整项目经验，能够在信息和资源有限的情况下确定优先级、组织验证并推动落地。\n3.具备产品判断能力，能够将用户需求及业务问题转化为产品方案，与产品、研发团队共同完成需求取舍、上线验收和效果验证。\n4.具备内容判断与商业意识，理解内容吸引力、持续消费及用户付费之间的关系，能够结合目标受众制定内容与本地化策略。\n5.熟悉至少一种海外获客方式，如社媒自然增长、SEO、达人合作、联盟渠道或付费投放，具备从获客到站内转化的实践经验。\n6.具备较强的数据分析和经营意识，能够结合用户行为、收入与成本判断业务效果，制定可执行的优化方案。\n7.有团队管理或跨职能项目统筹经验，能够协调不同专业团队，明确责任、解决分歧，并对结果负责。\n8.英语能够支持日常业务研究、资料阅读与工作沟通；对文化差异及海外业务规则具备敏感度，能够识别需要专项核实的问题。\n能够接受并负责普通向及成人向内容业务的产品与运营管理工作。\n\n加分项\n有海外网赚、联盟营销、CPS／CPA 分销或流量变现经验，熟悉渠道合作、效果归因及收益核算，具备可说明的项目成果者优先。\n有海外短剧、网文、流媒体、互动娱乐或订阅制内容产品经验。\n有 Web 与 App 协同运营、支付转化或会员商业化经验。\n有成人向内容平台相关业务经验。\n有多个国家的市场进入、本地化或增长经验。\n有 AIGC 内容生产协同、内容成本管理或制作流程建设经验。", "cat": "内容与创作"}, {"id": "407", "title": "AIGC短剧编剧组组长", "salary": "20K-35K", "location": "", "jd": "岗位职责：\n1. 制定短剧选题方向、剧本计划及生产目标。\n2. 建立选题、大纲、分集、剧本、审核和定稿流程。\n3. 制定剧本模板、Prompt规范和质量标准。\n4. 负责剧本审核、修改指导及交付验收。\n5. 协同导演、美术、视频生成及剪辑团队完成内容生产。\n6. 负责编剧团队分工、培训和能力建设。\n\n任职要求：\n1. 具备短剧、影视、小说或漫画编剧经验。\n2. 具备人物塑造、剧情设计、对白及节奏控制能力。\n3. 熟悉短剧冲突、反转及结尾留钩等创作方法。\n4. 熟悉AI写作工具、Prompt设计和剧本审核。\n5. 具备生产排期和编剧带教能力。\n6. 面试须提供完整剧本、人物设定、故事及分集大纲和上线数据。", "cat": "内容与创作"}, {"id": "408", "title": "AIGC短剧编剧", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究热点题材、目标用户及短剧趋势。\n2. 完成选题、人物设定、故事梗概、分集大纲及剧本创作。\n3. 使用AI工具辅助创意、扩写、改写和优化。\n4. 根据审核意见完成剧本修改及版本迭代。\n5. 配合导演和制作团队调整剧本可执行性。\n\n任职要求：\n1. 具备良好的文字表达和故事创作能力。\n2. 熟悉短剧叙事结构、情节节奏及用户偏好。\n3. 能够独立完成从选题到分集剧本的创作。\n4. 熟悉AI写作工具，能适应批量生产和多轮修改。\n5. 具备内容合规和版权意识。\n6. 面试须提供3—5个编剧作品，至少含1份完整剧本和1份故事大纲。", "cat": "内容与创作"}, {"id": "409", "title": "视频策划导演（AIGC短剧方向）", "salary": "20K-25K", "location": "", "jd": "岗位职责：\n1. 将剧本转化为视频策划、导演阐述及分镜方案。\n2. 设计镜头结构、景别、人物动作及画面节奏。\n3. 指导美术和视频生成岗位统一角色及视觉风格。\n4. 筛选生成素材，指导剪辑并验收成片。\n\n任职要求：\n1. 具备短剧导演、视频策划或分镜设计经验。\n2. 熟悉镜头语言、视听表达和剧情节奏。\n3. 具备视觉审美、成片判断和跨岗位协调能力。\n4. 了解AI图片、AI视频工具的能力边界。\n5. 面试须提供3—5个成片及对应分镜、导演方案和职责说明。", "cat": "内容与创作"}, {"id": "410", "title": "AIGC美术", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 根据剧本和导演要求设计角色、场景及视觉风格。\n2. 完成人物造型、服饰、场景和关键画面设计。\n3. 使用AI绘图工具生成并优化视觉素材。\n4. 保障角色和风格一致，建设视觉素材库。\n\n任职要求：\n1. 具备美术、插画、视觉或概念设计能力。\n2. 具备良好的构图、色彩、光影及人物设计能力。\n3. 熟悉主流AI绘图工具、Prompt及图片修正。\n4. 具备角色一致性、版权和素材风险意识。\n5. 面试须提供8—15张作品，含角色、场景、一致性及生成前后对比。", "cat": "内容与创作"}, {"id": "411", "title": "AI内容生成组组长", "salary": "20K-25K", "location": "", "jd": "岗位职责：\n1. 拆解AI视频日、周及阶段性产能目标。\n2. 分配任务并跟进生成进度和交付结果。\n3. 建立素材、Prompt、生成、检查、修改和交付流程。\n4. 优化工具、模型参数、Prompt模板和生产工作流。\n5. 跟踪人效、周期、合格率、返工率及工具成本。\n6. 负责组员培训、质量辅导和结果验收。\n\n任职要求：\n1. 熟悉主流AI图片和AI视频生成工具。\n2. 具备Prompt设计、模型选择和参数调整能力。\n3. 能解决角色漂移、动作异常等生成问题。\n4. 具备产能管理、质量验收和流程优化能力。\n5. 面试须提供3—5个AI视频、完整生产流程及效率优化案例。", "cat": "内容与创作"}, {"id": "412", "title": "AIGC视频生成师", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 根据剧本、分镜和视觉设定生成视频镜头。\n2. 编写并优化图片、视频生成Prompt及参数。\n3. 完成人物、场景、动作及运镜素材生成。\n4. 检查画面稳定性、角色一致性和镜头可用性。\n5. 根据审核意见完成补充生成和版本修改。\n\n任职要求：\n1. 熟悉至少一种AI图片或视频生成工具。\n2. 具备Prompt编写、参数测试和结果优化能力。\n3. 具备基础构图、镜头、光影和视觉审美能力。\n4. 能适应批量生产、多轮修改及规范文件管理。\n5. 面试须提供3—5个AI视频，并说明工具、模型、Prompt和优化过程。", "cat": "内容与创作"}, {"id": "413", "title": "AIGC视频剪辑师", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 根据剧本、分镜及导演要求完成视频剪辑。\n2. 处理镜头衔接、节奏、字幕、音效、配乐和包装。\n3. 修正AI素材中的跳帧、画面异常及连续性问题。\n4. 按平台要求完成版本修改、输出及文件管理。\n\n任职要求：\n1. 熟练使用主流视频剪辑工具。\n2. 具备良好的节奏感和视听表达能力。\n3. 了解AI视频常见问题及基础修复方法。\n4. 能适应高频修改和批量成片需求。\n5. 面试须提供3—5个完整视频，至少含1个剧情类或AI视频作品。", "cat": "内容与创作"}, {"id": "414", "title": "海外AIGC短剧编剧", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究目标国家热门题材、用户偏好及内容趋势。\n2. 完成海外向选题、人物设定、大纲及剧本。\n3. 根据语言、文化和用户习惯进行本土化改写。\n4. 使用AI工具辅助创意、扩写、翻译和优化。\n5. 配合制作团队调整剧本并根据数据持续迭代。\n\n任职要求：\n1. 具备短剧、网文、漫画或影视编剧能力。\n2. 具备英文或目标市场内容阅读分析能力。\n3. 具备海外用户、内容趋势及本土化调研能力。\n4. 熟悉AI写作工具，具备文化敏感性和合规意识。\n5. 面试须提供海外向剧本、双语脚本或本土化改写案例。", "cat": "内容与创作"}, {"id": "415", "title": "海外AIGC美术", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究目标市场的视觉审美和文化元素。\n2. 设计符合当地特征的人物、服饰、场景和画面风格。\n3. 使用AI工具生成并优化视觉素材。\n4. 控制角色、场景及系列内容一致性。\n5. 建立海外视觉及Prompt素材库。\n\n任职要求：\n1. 具备美术、插画、概念或视觉设计能力。\n2. 熟悉AI绘图工具和英文Prompt。\n3. 具备海外视觉趋势和文化差异分析能力。\n4. 能控制人物和场景的本土化准确性。\n5. 面试须提供8—15张海外向作品及角色一致性案例。", "cat": "内容与创作"}, {"id": "416", "title": "海外AIGC视频生成师", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 根据海外剧本、分镜及视觉要求生成视频。\n2. 编写并优化英文Prompt及模型参数。\n3. 控制人物、服饰、场景和文化元素准确性。\n4. 检查角色一致性、动作合理性和镜头质量。\n5. 根据审核意见补充生成并按平台要求交付。\n\n任职要求：\n1. 熟悉AI图片或AI视频生成工具。\n2. 具备英文Prompt阅读和编写能力。\n3. 具备镜头、构图和海外视觉偏好判断能力。\n4. 能识别并修复AI视频常见问题。\n5. 面试须提供3—5个海外向AI视频及完整优化过程。", "cat": "内容与创作"}, {"id": "417", "title": "海外社媒运营", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 调研目标市场的用户偏好和社媒趋势。\n2. 负责海外账号搭建、内容排期及发布。\n3. 优化标题、封面、标签、语言和发布时间。\n4. 维护用户互动并跟踪播放、粉丝及跳转数据。\n5. 分析竞品并提出内容优化建议。\n\n任职要求：\n1. 熟悉TikTok、YouTube、Instagram、Facebook、X、Telegram等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知。\n2. 具备内容策划、文案和账号运营能力。\n3. 具备基础英文编辑及用户、热点和竞品调研能力。\n4. 能根据数据快速调整策略。\n5. 面试须提供2—3个账号案例及增长数据。", "cat": "运营与市场"}, {"id": "418", "title": "海外站点运营", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究目标国家用户的网站使用习惯。\n2. 负责站点内容、分类、标签和页面维护。\n3. 优化内容结构、推荐逻辑及更新节奏。\n4. 跟踪流量、跳出率、停留时长和转化。\n5. 收集用户反馈并协同SEO、社媒和投流做好承接。\n\n任职要求：\n1. 具备网站或内容平台运营经验。\n2. 熟悉CMS后台和内容发布流程。\n3. 具备用户调研、站点数据分析及基础SEO能力。\n4. 能发现并推进解决页面和功能问题。\n5. 面试须提供站点运营、内容改版或流量提升案例。", "cat": "运营与市场"}, {"id": "419", "title": "中级运营（内容运营）", "salary": "15K-25K", "location": "", "jd": "岗位介绍\n我们正在打造面向海外市场的 AI 短剧产品，业务涵盖成人内容与非成人内容两条产品线。希望你理解海外用户的内容偏好，能够结合内容策划、用户运营与数据分析，持续提升用户观看体验、留存和付费转化。\n岗位职责\n**内容运营：**负责短剧上架、分类标签、首页推荐、专题策划及更新排期，优化剧名、简介、封面和推荐文案，提升内容点击率、观看深度与追剧率。\n**用户运营：**围绕新用户引导、追剧提醒、用户召回及会员活动开展运营，提升用户活跃度、留存率与复购率。\n**付费转化：**协同产品团队优化免费试看、付费解锁、订阅及促销策略，分析用户从观看到付费的关键流失环节，推动转化提升。\n**数据分析：**跟踪内容表现、用户行为及收入数据，开展运营实验与效果复盘，将分析结果转化为具体优化动作。\n**增长协同：**配合投放及社媒团队提炼剧集卖点、筛选推广片段，结合获客表现与站内消费数据，优化素材与内容承接。\n**内容反馈与竞品研究：**持续研究海外短剧及相关内容产品，将用户偏好、评论和消费表现反馈给编剧与制作团队，支持选题、剧情节奏和内容供给优化。\n**分线运营：**根据成人与非成人内容线的受众、渠道及内容边界制定差异化运营方案，落实内容分级、审核与用户反馈处理要求。\n任职要求\n具备 2 年及以上互联网产品运营经验，且至少具备海外 App、短剧、网文、流媒体或订阅制内容产品中任一领域的运营经验。\n理解内容消费产品的运营逻辑，能够围绕“内容点击—持续观看—留存—付费”制定并执行运营方案。\n具备数据分析能力，熟练使用 Excel 或其他分析工具，能够独立完成数据复盘；掌握 SQL 者加分。\n英语水平达到大学英语四级（CET-4）及以上，能够阅读海外用户反馈、研究竞品，并撰写或校对基础英文运营文案。\n对海外用户的文化背景和内容偏好有敏感度，对 AI 短剧及新内容形式有兴趣，能够判断内容吸引力与观看体验。\n执行力强，能够在产品早期主动发现问题、协调资源并推动落地。\n能够接受成人内容相关业务，具备清晰的职业边界与内容合规意识；具体负责产品线在面试中沟通确认。\n加分项\n有海外内容产品从 0 到 1 上线或冷启动经验。\n有提升用户留存、订阅收入或付费转化的实际案例。\n熟悉北美市场，具备海外短剧、网文或成人内容产品运营经验。\n熟悉海外社媒、社区运营或广告素材测试。\n能够使用 AI 工具提升内容分析、文案与运营执行效率。", "cat": "内容与创作"}, {"id": "420", "title": "漫画编剧", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 负责漫画选题、人物及世界观设计。\n2. 完成故事大纲、分话脚本、对白及画面描述。\n3. 设计剧情冲突、节奏及章节留钩。\n4. 配合设计和制作岗位优化脚本并持续修改。\n\n任职要求：\n1. 具备漫画、小说或短剧内容创作能力。\n2. 具备人物塑造、故事结构和对白设计能力。\n3. 熟悉漫画分话、分镜描述及连载节奏。\n4. 能使用AI工具辅助创作，具备稳定产能。\n5. 面试须提供3—5个漫画脚本、人物设定、故事大纲或上线作品。", "cat": "内容与创作"}, {"id": "421", "title": "AI漫画设计师", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 根据漫画脚本完成分镜和画面设计。\n2. 使用AI工具生成人物、场景及漫画画面。\n3. 控制角色、场景及作品风格一致性。\n4. 对生成画面进行筛选、修正和局部重绘。\n5. 建立角色模型、风格模板及Prompt素材库。\n\n任职要求：\n1. 具备漫画、插画或视觉设计能力。\n2. 熟悉AI绘图工具及相关工作流程。\n3. 具备角色一致性、构图和连续画面控制能力。\n4. 能理解脚本并转化为具体画面。\n5. 面试须提供8—15张作品或2—3个完整漫画片段。", "cat": "内容与创作"}, {"id": "422", "title": "漫画制作师（排版／成片）", "salary": "10K-15K", "location": "", "jd": "岗位职责：\n1. 根据脚本和分镜完成漫画页面或条漫排版。\n2. 处理画格、对白框、字体及视觉动线。\n3. 完成画面修整、裁切、拼接和色彩调整。\n4. 检查错漏、顺序及完整性并按平台规范输出。\n\n任职要求：\n1. 熟悉漫画排版、图片编辑及平面设计工具。\n2. 了解条漫、页漫等漫画阅读逻辑。\n3. 具备版式设计、质量检查和批量交付能力。\n4. 面试须提供3—5个排版或成片案例，建议附原始素材对比。", "cat": "内容与创作"}, {"id": "423", "title": "AI小说编剧／主笔", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 研究用户偏好和小说题材趋势。\n2. 完成世界观、人物、主线及章节大纲设计。\n3. 使用AI工具完成正文生成、扩写、改写和润色。\n4. 控制人物逻辑、情节推进及章节连续性。\n5. 根据审核和用户反馈调整内容并沉淀素材库。\n\n任职要求：\n1. 具备网文、小说或相关文字创作能力。\n2. 具备长篇故事规划和持续创作能力。\n3. 熟悉网络小说结构、节奏及用户偏好。\n4. 熟悉AI写作工具并能控制内容一致性。\n5. 面试须提供完整大纲、人物设定及不少于3个连续章节。", "cat": "内容与创作"}, {"id": "424", "title": "AI 内容镜头审核", "salary": "15K-20K", "location": "", "jd": "岗位职责\n1. **镜头质量审核与分级**  \n   对 AI 生成镜头进行逐镜审核，依据统一的 A / B / C 质量标准完成分级，重点评估画面质量、人物一致性、动作自然度、场景稳定性及镜头逻辑，确保素材符合对应等级要求。\n\n2. **剪辑前质量把控**  \n   负责 AI 生成与后期剪辑之间的素材质量把关，严格执行入库标准，确保 C 级镜头不进入剪辑环节，减少因素材缺陷导致的后期补救与返工。\n\n3. **问题识别与精准标注**  \n   识别人物变形、身份特征不一致、动作异常、场景漂移、画面穿帮、镜头逻辑不合理及画质异常等问题，准确记录问题类型、发生时间点及具体表现，提供清晰、可追溯的审核反馈。\n\n4. **审核质量与返工控制**  \n   持续关注漏检率、审核准确率及素材质量问题引发的下游返工率，结合复核结果与剪辑反馈校准判断，保障审核质量与标准执行的一致性。\n\n5. **推动生成质量改进**  \n   汇总高频问题与共性缺陷，定期向 AI 视频生成团队反馈，协助优化生成方法、提示词、模型选型及生产流程，从源头降低问题镜头产生率。\n\n6. **审核标准与案例沉淀**  \n   持续整理典型问题镜头及优质案例，参与完善 A / B / C 分级标准、审核 SOP 与案例库，提升团队审核效率及判断的一致性、稳定性。\n\n任职要求\n\n1. 具备 AI 视频生成、视频后期制作、视频质检或相关内容制作经验，熟悉镜头质量评估的基本方法与流程。\n2. 对人物一致性、动作自然度、场景稳定性、画面完整度及镜头逻辑具备较强的识别与判断能力。\n3. 能够准确理解并严格执行统一的质量分级标准，在批量、高频审核场景下保持稳定的判断能力。\n4. 工作细致、耐心，对画面质量敏感，具备较强的标准意识、责任心与质量把控能力。\n5. 能够客观、准确地描述问题，明确问题位置及具体表现，提供可执行的反馈。\n6. 具备良好的沟通与团队协作能力，能够与 AI 生成、剪辑等团队高效配合，推动问题闭环解决。\n\n加分项\n\n- 具备 AI 视频或 AI 图像生成实操经验，熟悉主流生成工具及常见缺陷。\n- 具备短剧、漫剧、短视频等批量化内容生产经验。\n- 具备视频后期质检、成片审核或影视制作质量管理经验。\n- 曾担任生成团队骨干，承担镜头审核、质量把控或团队标准校准工作。\n- 具备视频质量标准、质检 SOP 或镜头案例库的建设经验。", "cat": "内容与创作"}, {"id": "425", "title": "AI短剧剧本审核", "salary": "10K-18K", "location": "", "jd": "负责 AI 短剧故事大纲、分集梗概及完整剧本的审核，检查故事逻辑、人物设定、戏剧冲突、情节节奏及对白表达，确保符合内容定位与制作要求。\n重点审核开场钩子、分集推进、情绪转折及集尾悬念，识别铺垫冗长、冲突不足、信息重复、剧情拖沓等问题，判断剧本是否具备持续追看的吸引力。\n检查人物动机、行为逻辑及关系发展，识别人设前后矛盾、转折缺少铺垫、情感变化突兀、伏笔遗漏等问题，保证故事连贯、人物成立。\n结合 AI 制作条件，评估场景、角色、动作及特效需求的实现难度，识别难以视觉化、制作复杂度过高或缺乏叙事必要性的内容，提出调整建议。\n按统一的 A / B / C 质量标准对剧本进行分级，承担进入分镜及制作环节前的审核工作，C 级剧本修改并复核通过后方可进入后续流程。\n输出准确到集数、场次或具体台词的审核意见，说明问题、影响及修改方向，与编剧、导演和制作团队协同推进修改，跟进版本复核，减少下游返工。\n汇总高频问题与优秀案例，持续完善剧本审核标准、审核 SOP 及案例库，提高团队判断的一致性。\n任职要求\n有短剧编剧、剧本编辑、剧本审核、网文改编或相关内容策划经验，面试需提供剧本作品、修改前后对比或审核案例，并说明本人负责部分。\n理解短剧叙事特点，能够判断开场吸引力、冲突强度、信息密度、情绪节奏及集尾悬念，能区分文字描写丰富与有效剧情推进。\n具备较强的故事分析能力，能够识别情节漏洞、人物动机不足、关系发展不合理及设定不一致等问题。\n理解基础视听表达，能够判断文字是否可以转化为清晰的画面与行动，关注单集时长、场景数量及制作可行性。\n能结合目标受众、题材定位及制作要求作出判断，避免仅凭个人喜好评价剧本。\n能准确描述问题并提出可执行的修改方向，不仅停留在“节奏慢”“不吸引人”等笼统评价。\n细致、有耐心，具备较强的标准意识、责任心及沟通能力，能够适应批量审稿、多版本修改与复核工作。\n加分项\n有北美市场短剧、网文或影视内容的编剧、编辑、剧本审核及本地化经验，了解北美用户的题材偏好、文化语境、人物关系与情感表达方式，能够识别不符合当地语境的情节和台词，并提出调整建议者优先。\n有 AI 短剧、漫剧或短剧完整项目制作经验，了解剧本到分镜、生成及剪辑的流程。\n有爱情、悬疑、奇幻等类型内容的创作或编辑经验。\n能结合观看留存、分集流失及用户反馈复盘剧本问题。\n有建立剧本验收标准、审核 SOP 或培训案例库的经验。", "cat": "内容与创作"}, {"id": "426", "title": "出海短剧产品经理（网赚方向）", "salary": "20K-35K", "location": "", "jd": "【岗位介绍】\n\n负责面向海外市场的短剧与任务激励类产品建设，将内容观看、用户激励、广告变现及收益提现等环节形成完整产品体验，推动 Web／App 从需求规划到上线迭代，对用户体验与业务效果负责。\n\n【岗位职责】\n\n1、市场调研与产品规划：开展目标国家及地区的市场、用户和竞品调研，分析短剧、任务激励及网赚类产品的业务模式、核心功能和增长机会，制定产品规划及版本迭代计划。\n\n2、用户需求与本土化设计：梳理用户画像、使用场景及核心需求，结合当地语言、设备、网络、内容消费及收款习惯，制定产品本土化方案，明确需求优先级。\n\n3、短剧观看与激励体系设计：设计内容发现、播放、追剧及用户回访体验，结合业务需要搭建观看任务、积分奖励、签到和邀请等机制，平衡内容消费、激励参与与用户留存。\n\n4、商业化与收益体系建设：设计广告展示、激励视频、奖励结算、收益记录及提现流程，明确奖励规则、状态流转和异常处理，协同运营及技术团队优化变现效率与奖励成本。\n\n5、产品方案与项目交付：独立输出产品需求文档、业务流程、交互原型、数据埋点及验收标准，协调设计、研发、测试和运营团队，推动需求评审、开发上线及效果复盘。\n\n6、数据分析与持续优化：跟踪获客转化、开播、观看时长、任务完成、留存、广告收益及提现等数据，通过用户反馈和实验验证优化产品，关注用户长期价值及投入产出。\n\n7、风险控制与异常体验：协同相关团队完善重复领取、异常邀请、无效流量及提现异常等识别与处理机制，落实目标市场的隐私、广告及相关平台要求，保障规则透明和用户权益。\n\n【任职要求】\n\n1、具备产品经理工作经验，有出海网赚、任务激励或内容激励类产品的实际项目经验，能够说明本人负责的业务环节及项目成果。\n\n2、熟悉任务体系、积分或奖励账户、激励广告、收益结算及提现等核心流程，能够设计完整的正常流程、异常状态和用户提示。\n\n3、具备独立负责产品模块或推动产品从零到一的能力，能够完成需求分析、方案设计、开发协同、上线验收及效果复盘。\n\n4、具备市场调研、竞品分析和用户研究能力，能够结合目标国家的用户习惯、设备条件及商业环境识别产品机会，推动本土化落地。\n\n5、能独立输出逻辑清晰的产品需求文档、业务流程及交互原型，具备数据埋点设计与验收能力，关注边界条件和异常处理。\n\n6、具备较强的数据分析与商业意识，能够综合广告收益、奖励支出、渠道成本及用户留存判断产品效果，避免仅以任务量或活跃人数衡量增长。\n\n7、具备良好的跨团队沟通和项目推进能力，能够明确优先级、协调资源并跟进交付，具有责任心和结果意识。\n\n8、英语能够支持海外竞品研究、资料阅读及基本工作沟通；了解用户隐私、广告平台规则及反作弊基本要求。\n\n【加分项】\n\n1、有海外短剧、网文、视频或其他内容消费产品经验。\n\n2、有“观看内容＋任务奖励＋广告变现”业务经验。\n\n3、有 Web 与 App 产品建设、跨端账户及权益协同经验。\n\n4、有海外广告变现、支付或提现服务对接经验。\n\n5、有邀请增长、用户分层、留存提升或反作弊策略设计经验。\n\n6、有不同国家或地区的产品本土化与增长验证经验。\n\n【面试说明】\n\n请准备1—3个本人参与或主导的产品项目，其中至少1个为出海网赚或任务激励类产品。可展示脱敏后的需求文档、流程、原型或数据成果，重点说明个人职责、关键决策及实际效果。", "cat": "内容与创作"}, {"id": "427", "title": "审计助理", "salary": "远程：6K-8K", "location": "", "jd": "一、岗位概述\n\n负责公司各类业务开支及渠道投放费用的审核与风险把控，确保资金使用真实、合理、合规、高效。重点负责播放器 App 项目相关渠道投放、市场推广及业务合作费用审核，并结合业务数据对投放效果进行分析评估，为公司降本增效和风险控制提供支持。\n\n---\n\n二、岗位职责\n\n1、开支审核与合规控制\n\n* 审核各部门提交的费用申请、合同、发票及付款凭证等资料；\n* 重点审核渠道投放费用、市场推广费用、商务合作费用等业务支出；\n* 核查费用真实性、合理性、预算执行情况及合规性，防范虚假、重复或异常支出；\n* 对异常费用进行风险预警，并提出整改建议。\n\n2、渠道投放审核\n\n* 负责渠道合作方资质审核及合作风险评估；\n* 审核渠道投放 ROI、转化率、留存率等核心运营指标；\n* 对渠道合作进行事前、事中、事后审核，形成审核意见及复盘报告，为续费、调整或终止合作提供依据。\n\n3、业务开支监控与数据分析\n\n* 定期统计、分析各类业务费用结构、占比及变化趋势；\n* 协助建立费用监控指标体系及风险预警机制；\n* 挖掘费用使用问题，提出降本增效及优化建议，为管理层提供数据支持。\n\n4、制度建设与流程优化\n\n* 协助制定及完善公司《开支审核管理制度》及相关流程；\n* 建立标准化费用台账、审核档案及复盘机制；\n* 配合开展费用合规培训，提高各部门费用管理意识。\n\n---\n\n 三、任职要求\n\n1. 财务、审计、会计、经济管理等相关专业优先；\n2. 具备良好的逻辑思维能力、数据分析能力及风险识别能力，能够独立完成审核分析工作；\n3. 工作认真细致，责任心强，原则性强，具备良好的职业操守及保密意识；\n4. 执行力强，学习能力强，能够主动推动工作落地并持续优化工作流程；\n5. 具备良好的沟通协调能力及团队协作意识，能够与业务、财务等部门高效协同；\n6. 吃苦耐劳，具备较强的抗压能力，能够适应快节奏工作及多任务处理；\n7. 对数据敏感，善于发现问题并进行分析，能够结合业务数据识别风险并提出可执行的优化建议；\n8. 熟练使用 Excel 等办公软件，能够完成数据整理、统计分析及审核报告编写；\n9. 具备良好的文字表达能力，能够独立撰写审核意见、分析报告及复盘总结。\n\n---\n\n四、加分项\n\n1. 具有互联网、App、广告、流量投放等行业财务审核、费用控制、审计或风控相关工作经验；\n2. 熟悉渠道投放、市场推广费用管理流程，具备 ROI、转化率、留存率等运营数据分析经验；\n3. 有 App 推广、广告投放、流量渠道或广告结算相关经验；\n4. 熟悉 SEO、ASO 或互联网流量运营模式；\n5. 熟悉 Power BI、SQL、Python 等数据分析工具，具备数据可视化能力；\n6. 有内控、审计、反舞弊、风险管理等相关工作经验；\n7. 熟悉 AI 自动化办公、工作流搭建或 AI 提效实践经验；\n8. 熟悉 ChatGPT、Claude、Gemini 等主流大语言模型，能够利用 AI 工具辅助数据分析、文档整理、报告编写及提升工作效率者优先", "cat": "职能与行政"}, {"id": "428", "title": "审计员", "salary": "远程：8K-10K", "location": "", "jd": "一 const CATS = ["内容与创作", "运营与市场", "技术开发", "产品与管理", "职能与行政", "采集与逆向", "安全攻防", "其他"];

const catCounts = {};
JOBS.forEach(j => { catCounts[j.cat] = (catCounts[j.cat]||0) + 1; });

let activeCat = null;
try { activeCat = localStorage.getItem('omi_jobs_cat') || null; } catch(e) {}

const chipRow = document.getElementById('chipRow');
function renderChips(){
  const chips = [{cat:null,label:'全部',n:JOBS.length}].concat(
    CATS.filter(c => catCounts[c]).map(c => ({cat:c,label:c,n:catCounts[c]}))
  );
  chipRow.innerHTML = chips.map(c => `
    <div class="chip ${activeCat===c.cat ? 'active':''}" data-cat="${c.cat ?? ''}">
      ${c.label} <span class="n">${c.n}</span>
    </div>
  `).join('');
  chipRow.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-cat');
      activeCat = v === '' ? null : v;
      try { activeCat ? localStorage.setItem('omi_jobs_cat', activeCat) : localStorage.removeItem('omi_jobs_cat'); } catch(e) {}
      renderChips();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(escapedText, q){
  if (!q) return escapedText;
  const re = new RegExp('(' + escapeRegex(q) + ')', 'ig');
  return escapedText.replace(re, '<mark>$1</mark>');
}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const statsEl = document.getElementById('stats');

function render(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = JOBS.filter(j => {
    if (activeCat && j.cat !== activeCat) return false;
    if (!q) return true;
    return j.title.toLowerCase().includes(q) || j.jd.toLowerCase().includes(q);
  });

  // 有关键字时:标题命中的排在前面(最相关),仅描述里命中的排后面,
  // 且给后者打上"命中于描述"的提示,避免看起来像误匹配。
  if (q){
    filtered = filtered
      .map((j, idx) => ({ j, idx, titleHit: j.title.toLowerCase().includes(q) }))
      .sort((a, b) => {
        if (a.titleHit !== b.titleHit) return a.titleHit ? -1 : 1;
        return a.idx - b.idx; // 稳定排序,组内保持原顺序
      })
      .map(x => x.j);
  }

  statsEl.textContent = `显示 ${filtered.length} / ${JOBS.length} 个职位`;

  if (filtered.length === 0){
    list.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  list.innerHTML = filtered.map(j => {
    const titleHit = q ? j.title.toLowerCase().includes(q) : false;
    const jdOnlyHit = q && !titleHit;
    const titleHtml = highlight(escapeHtml(j.title), q);
    const jdHtml = highlight(escapeHtml(j.jd), q);
    return `
    <div class="card">
      <div class="card-top">
        <span class="card-tag">${escapeHtml(j.cat)}</span>
        <span class="card-id">#${escapeHtml(j.id)}</span>
      </div>
      <h3>${titleHtml}</h3>
      <div class="badge-row">
        ${j.salary ? `<span class="salary">${escapeHtml(j.salary)}</span>` : ''}
        ${j.location ? `<span class="location">📍 ${escapeHtml(j.location)}</span>` : ''}
        ${jdOnlyHit ? `<span class="card-tag jd-match">命中于描述</span>` : ''}
      </div>
      <div class="jd" id="jd-${j.id}">${jdHtml}</div>
      <div class="card-actions">
        <button class="toggle-btn" data-id="${j.id}">展开全文 ▾</button>
        <a class="apply-btn" href="https://t.me/y666899y" target="_blank" rel="noopener">投递 / 咨询 ↗</a>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const jd = document.getElementById('jd-' + btn.getAttribute('data-id'));
      const isExpanded = jd.classList.toggle('expanded');
      btn.textContent = isExpanded ? '收起 ▴' : '展开全文 ▾';
    });
  });
}

document.getElementById('searchInput').addEventListener('input', render);

renderChips();
render();
</script>
