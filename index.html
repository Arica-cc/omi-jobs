善内部流转、复盘与风控机制\n\n任职要求\n1. 本科及以上，3 年以上舆情、公关、内容风控或相关质量分析经验\n2. 有完整舆情/风控机制搭建落地经验，能独立判断风险并给出口径与动作建议\n3. 反应快、文字功底扎实，能在压力下跨部门推动整改与对齐\n4. 原则清晰，熟悉主流平台内容规则与监测工具使用\n\n加分项\n有窗口期监测或危机处置成功案例；有竞品舆论攻防经验；有服务商管理经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "102", "title": "AI 视频制作师", "salary": "20K–30K", "location": "工作形式：远程", "jd": "\"岗位职责\n1. 负责短视频、产品宣传视频、品牌创意视频等全类型视频的AI全流程制作，熟练运用各类AI视频工具，完成脚本落地、素材生成、剪辑合成、特效包装、调色输出等工作，产出高质量原创视频内容。\n2. 结合品牌视觉规范、产品特性及短视频平台调性，优化AI视频创作逻辑，定制视频画面风格、镜头语言、字幕包装，保障视频内容优质、风格统一、贴合品牌调性。\n3. 探索并落地各类新型AI视频生成工具、AI剪辑、AI特效、数字人、AI配音等技术，持续优化视频制作流程，提升出片效率与内容质感，实现批量、高效、精品化内容产出。\n4. 配合品牌升级、产品运营、市场推广需求，承接Web、App、短视频账号等多端视频物料制作，严格按照交付标准、档期要求完成物料输出，保障多端视频视觉统一、内容合规。\n5. 参与视频创意脚本研讨、方案评审，根据品牌规范、运营反馈、用户喜好优化视频内容，整改画面瑕疵、风格偏差等问题，持续提升视频传播力与观感体验。\n6. 沉淀AI视频制作素材库、模板库、操作规范及创作方法论，整理优质视频案例，固化品牌视频包装标准，为常态化内容产出和品牌视觉统一提供支撑。\n\n任职要求\n1. 本科及以上学历，2年以上AI视频制作、短视频剪辑、影视后期相关工作经验，熟练掌握AI视频创作全流程，有成熟的个人视频作品案例。\n2. 熟练使用主流AI视频工具，精通剪映、PR、AE等后期剪辑包装软件，掌握AI文生视频、图生视频、AI特效、AI修图、数字人视频制作等技能，能独立完成全流程视频产出。\n3. 具备优秀的视觉审美、镜头语感和色彩把控能力，熟悉短视频、互联网品牌视频的创作逻辑，能精准贴合品牌风格完成差异化视频创作。\n4. 具备高效的内容产出能力，能适配多场景物料制作需求，严格把控交付进度与成片质量，抗压能力强，可配合项目档期高效完成工作。\n5. 具备良好的沟通协作能力，能配合品牌、运营、市场团队对齐需求，精准落地创作要求，主动复盘优化制作流程，持续提升内容品质与出片效率。\n\n加分项\n1. 有互联网品牌、短视频、泛娱乐行业AI视频制作经验，参与过品牌视觉升级、多端视频物料统一落地项目者优先。\n2. 熟练掌握Runway、Pika、即梦等主流AI视频工具，具备AI视频创意优化、瑕疵修复、高质量成片打磨经验。\n3. 具备脚本撰写、创意策划能力，可独立完成视频创意+AI制作全链路工作。\n4. 有品牌全案视频、产品宣传片、矩阵短视频批量制作经验，熟悉多平台视频内容规则与传播逻辑。\n\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "内容与创作"}, {"id": "103", "title": "高级运营-社媒运营", "salary": "12K-20K", "location": "工作形式：远程", "jd": "\"岗位职责\n1. 负责公司产品、短视频及新媒体矩阵整体运营工作，制定阶段性运营策略、年度/季度运营目标与落地计划，统筹推进全渠道运营工作，对用户增长、活跃度、内容曝光、转化数据等核心指标负责。\n2. 统筹各平台账号日常运营，涵盖短视频平台、App、Web端及新媒体渠道，负责内容选题、节奏规划、活动策划、热度追踪等工作，搭建标准化运营体系，保障账号稳定更新与数据持续增长。\n3. 结合产品特性、用户画像及行业热点，策划线上运营活动、话题营销、内容专题等，联动内容、视频、市场团队落地执行，提升品牌曝光、用户粘性及产品影响力，助力用户拉新、留存、促活。\n4. 负责运营数据监控与分析，定期梳理播放量、互动率、涨粉量、转化率等核心数据，复盘运营动作效果，挖掘数据问题与增长机会，持续优化运营策略、内容结构与推广方式。\n5. 对接品牌升级、内容焕新项目，对齐全渠道运营视觉风格、内容调性与传播节奏，统筹各渠道物料上线、内容分发与宣传推广，保障多端运营内容统一、节奏同步。\n6. 跟踪行业动态、竞品运营模式与平台规则变化，快速迭代运营打法，搭建用户运营、内容运营、活动运营标准化流程，沉淀运营SOP、案例库与方法论，提升整体运营效能。\n7. 统筹跨部门协作，对接视频制作、设计、市场、产品等团队，对齐运营需求、排期与交付标准，推动运营项目、营销活动高效落地，及时解决推进过程中的各类问题并闭环优化。\n\n任职要求\n1. 本科及以上学历，3年以上互联网、短视频、新媒体、泛娱乐行业运营管理经验，具备成熟的全渠道运营体系搭建与落地经验。\n2. 精通短视频、新媒体、产品线上运营逻辑，熟悉各大主流平台规则、流量机制与传播玩法，具备独立策划、落地运营项目及营销活动的实战能力。\n3. 具备优秀的数据洞察与复盘能力，能够通过数据拆解目标、定位问题、优化策略，有成功的账号增长、活动转化、用户运营落地案例优先。\n4. 拥有良好的热点敏感度、内容审美与营销思维，擅长结合行业热点打造优质内容与爆款活动，具备较强的用户思维与市场判断力。\n5. 具备出色的跨部门沟通、统筹协调与项目推进能力，目标感强、执行力高，可高效统筹多任务并行，抗压能力强，能适配项目节奏与迭代需求。\n6. 具备系统化运营思维，擅长流程搭建、标准梳理与团队效能优化，能够沉淀可复用的运营方法论，推动团队运营工作标准化、精细化落地。\n\n加分项\n1. 有短视频矩阵、新媒体品牌账号、互联网产品运营操盘经验，拥有百万曝光、爆款内容打造或用户规模化增长案例。\n2. 熟悉AI内容、AI视频行业，具备AI产品、数字内容相关行业运营经验，了解AI内容创作与传播逻辑。\n3. 具备品牌营销、内容策划、用户增长、活动运营专项优势，有完整的项目全案操盘与复盘经验。\n4. 有远程团队协作、跨团队项目统筹经验，擅长精细化运营与数据化管理。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "104", "title": "品牌策略负责人", "salary": "12K-20K", "location": "工作形式：远程", "jd": "岗位职责\n1. 从 0 到 1 设计并落地对内复制 + 对外赋能体系：标准、SOP、课程路径与材料包\n2. 把策略、案例、复盘转化为可带走的课程与工具，支撑业务与合作方独立运转\n3. 建立训后反馈与迭代机制，用真实反馈持续升级内容质量与落地效果\n4. 推动赋能动作嵌入项目节点（开工包、关键节点赋能、结项回收与课例沉淀）\n5. 与市场心智、舆情协同，把最新口径与框架同步进课程，保持体系不过时\n6. 跟踪赋能采用率与效果，输出迭代清单，对体系是否跑得起来负责\n\n任职要求\n1. 本科及以上，3 年以上企业培训、组织发展、方法论沉淀或品牌/运营赋能经验\n2. 有从 0 到 1 搭培训/赋能体系的经历，能独立完成课程产品化与落地推动\n3. 善于把复杂内容拆成可复制路径（课、包、SOP），表达清楚、结构感强\n4. 结果导向，关注采用与效果，不满足于「讲完课」\n\n加分项\n有 ToB 赋能或多组织落地经验；有品牌/策略内容转化经验；有训后效果评估体系搭建经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议", "cat": "运营与市场"}, {"id": "105", "title": "Web3 运营专员（Meme 项目方向）", "salary": "12~18K", "location": "", "jd": "## 岗位职责\n1. 负责 Web3 / Meme 项目从筹备、预热、发币到后续增长的整体运营。\n2. 推进 Meme 发币、发射平台、流动性配置、交易平台对接等落地事项。\n3. 负责 X、Telegram、Discord 等渠道的内容、活动、社区及传播运营。\n4. 拓展并维护 Web3 KOL、社区、媒体及行业合作资源，推动合作落地。\n5. 围绕拉新、裂变、活动及社群运营提升曝光、粉丝、活跃和用户转化。\n6. 跟踪行业热点、链上数据及社区舆情，及时调整策略并完成项目复盘。\n7. 协调产品、技术、设计及外部资源，保障项目节点按期推进。\n8. 关注社区反馈及市场风险，做好舆情和项目风险管理。\n\n## 任职要求\n\n1. 3 年左右 Web3 / 区块链 / 加密行业运营经验，熟悉币圈生态及社区文化。\n2. 熟悉 Meme 项目从 0 到 1 的完整流程，有实际发币及项目运营经验。\n3. 有可验证的 Web3 / Meme 项目案例及量化运营结果。\n4. 熟悉 X、Telegram、Discord，具备内容策划、社区运营和用户增长能力。\n5. 拥有一定 Web3 KOL、社区、媒体等资源，能独立完成资源拓展及合作谈判。\n6. 市场敏感度强，能快速捕捉热点、叙事和社区情绪并转化为运营方案。\n7. 具备较强的项目推进、跨团队协作及数据分析能力。\n8. 具备英文沟通能力，熟悉 AI、社媒矩阵、机器人或自动化运营工具。\n9. 风险意识强，能够适应快节奏、高变化的 Web3 项目环境。\n\n## 加分项\n\n有成功 Meme 发币及持续运营经验；有市值、交易量、社区规模或品牌曝光增长案例；拥有成熟海外 KOL / Alpha 社区 / 媒体 / 交易平台资源；具备个人 Web3 行业影响力。", "cat": "产品与管理"}, {"id": "106", "title": "经营决策主管", "salary": "20K–30K", "location": "", "jd": "1.分析各业务线的经营情况、问题和机会，形成初步判断。\n2.跟踪市场、竞品和用户变化，提炼对业务有用的信息并落地成方案。\n3.参与新项目和重点事项评估，提出继续、调整、加码或暂停建议。\n4.输出分析结论和汇报材料，并跟踪后续结果。\n任职要求\n1.有业务运营、产品运营、增长、策略或分析相关经验，互联网行业。\n2.能快速理解业务，从复杂信息中抓住重点并形成观点。\n3.能结合基础数据和业务事实说明自己的判断。\n4.文字表达清楚，能够独立完成分析和汇报。\n加分项\n1.有互联网或线上业务相关经验5年以上。\n2.参与过新/老项目评估、业务调整或经营复盘的核心决策。", "cat": "产品与管理"}, {"id": "107", "title": "运营发展主管", "salary": "20K–30K", "location": "", "jd": "1.梳理重点事项、协同需求和资源需求，形成处理建议。\n2.将确认事项拆解为责任人、时间节点、交付结果和验收标准。\n3.跟踪跨部门事项进展，发现延期或卡点并推动解决。\n4.维护事项清单，定期输出进展、问题和复盘结论。\n任职要求\n1.有项目运营、业务运营、PMO、项目管理或交付管理相关经验。\n2.能把模糊问题整理成清晰的任务和推进计划。\n3.沟通和推动能力较强，能够协调不同团队持续跟进。\n4.有优先级和结果意识，做事有条理，能够推动事项闭环。\n加分项\n1.推动过多个部门共同参与的项目，自己是核心成员或负责人。", "cat": "运营与市场"}, {"id": "108", "title": "SEO运营专员 （AI工具赋能方向）", "salary": "18-35", "location": "", "jd": "SEO运营专员（AI工具赋能方向）\n\n【岗位职责】\n\n1. 负责 App、品牌自建站及自媒体矩阵的海外自然搜索流量增长，围绕 Google、Bing 等主流搜索引擎制定并执行 SEO 优化策略，提升核心关键词排名、页面收录量及自然流量转化效果。\n2. 负责站内 SEO 优化工作，包括 TDK 布局、页面结构优化、关键词部署、内容更新、内链建设、结构化数据优化、爬虫抓取异常排查、收录与排名监控等，保障网站具备良好的搜索引擎友好度。\n3. 借助 AI 工具提升 SEO 内容生产效率，完成多语种关键词挖掘、长尾词库搭建、内容选题规划、文案初稿生成、多语言内容改写、内容质检与基础纠错等工作，并结合人工二次精修，确保内容符合海外用户搜索意图、原创性要求和本地化表达习惯。\n4. 负责海外站外 SEO 建设，包括优质外链资源拓展、软文发布、友链合作、品牌相关内容铺设等，持续提升网站权重、品牌曝光度及海外搜索端正向声量。\n5. 每日监控网站流量、关键词排名、收录量、点击率、跳出率、停留时长等核心数据，熟练使用 SEO 工具进行数据分析、问题归因和效果复盘，定期输出 SEO 优化报告及可落地的迭代方案。\n6. 持续关注 Google 等搜索引擎算法更新及海外 SEO 趋势，结合数据变化及时调整优化策略，降低因算法波动导致的降权、收录下降、排名异常等风险。\n7. 与品牌运营、内容、技术/前端团队协作，推动页面内容、站点结构、加载性能、索引体验及品牌搜索口碑的持续优化。\n\n【任职要求】\n\n1. 大专及以上学历，3年以上 SEO 运营实战经验，有海外站点、英文站、多语言站、内容站、品牌站或 App 推广相关 SEO 经验优先。\n2. 熟悉 Google、Bing 等海外主流搜索引擎的排名机制，掌握白帽 SEO 方法论，能够独立完成关键词策略、站内优化、内容规划、外链建设、数据分析及效果复盘。\n3. 熟练使用 Google Search Console、Google Analytics、Ahrefs、SEMrush、SimilarWeb 等常用 SEO 工具，能够独立诊断网站收录、排名、流量及页面质量问题。\n4. 具备较强的 AI 工具应用能力，能使用 ChatGPT、Claude、Gemini 或其他 AI 工具辅助完成关键词拓展、内容生产、多语言改写、数据整理和文案优化；同时具备内容判断力，能够识别 AI 内容同质化、低质化、语义不自然等问题，并进行人工校准。\n5. 具备良好的文案能力和海外用户搜索意图分析能力，能够根据目标市场用户习惯优化标题、摘要、页面结构和内容表达，提升自然点击率和页面停留表现。\n6. 具备较强的数据敏感度和执行力，能从排名、流量、收录、点击、转化等数据中发现问题，并持续推动优化闭环。\n7. 工作细致，结果导向，具备良好的跨团队沟通能力，能够与内容、品牌、技术团队协同推进 SEO 项目落地。\n\n【加分项】\n1. 有海外多语种站点 SEO 操盘经验，熟悉英文、小语种内容优化优先。\n2. 有 App SEO、ASO、品牌词优化、舆情搜索优化经验优先。\n3. 了解 SSR、站点性能、结构化数据、sitemap、robots、canonical 等技术 SEO 基础优先。\n4. 有通过 AI 工具搭建 SEO 工作流、关键词库、内容生产流程或数据看板经验优先。\n\n筛选重点\n\n1. 是否有真实海外 SEO 项目经验，而不是只做过国内平台内容运营。\n2. 是否能独立说明关键词策略、内容策略、站内优化、外链建设和数据复盘方法。\n3. 是否熟悉 Google Search Console、GA、Ahrefs、SEMrush 等工具，并能结合数据定位问题。\n4. 是否真正会使用 AI 提升 SEO 效率，而不是只会用 AI 生成文章。\n5. 是否坚持白帽 SEO，避免黑帽外链、关键词堆砌、批量低质伪原创等高风险操作。", "cat": "运营与市场"}, {"id": "109", "title": "效能官", "salary": "25-35k", "location": "", "jd": "【岗位职责】\n深入各业务线，理解业务流程、岗位分工和关键痛点，识别高价值的 AI 替代、增强和自动化场景。\n独立负责 AI 提效项目从 0 到 1 落地，包括需求调研、流程拆解、方案设计、Agent 工作流搭建、测试验证、上线推广和持续优化。\n设计并落地 Agent 自动化工作流，覆盖信息收集、内容生成、数据整理、流程提醒、报表汇总、客服辅助、运营提效等业务场景。\n主导内部 AI 工具选型、搭建、培训与推广，提升业务团队对 AI 工具的使用效率和接受度。\n建立 AI 效能评估体系，围绕节省工时、降低人力成本、提升产出效率、减少错误率、提升响应速度等指标，量化每个项目的 ROI。\n持续跟踪 AI 模型、Agent 平台、自动化工具和行业最佳实践，将新工具、新能力快速转化为业务可用方案。\n定期输出项目进展、问题复盘、提效成果和下阶段计划，向 GM、业务负责人及效能中心进行汇报。\n作为 AI 能力在业务侧的落地窗口，支持业务团队需求沟通、方案解释、使用培训及跨部门协作推进。\n【任职要求】\n熟练掌握 Python、Node.js、PHP、Go 等开发语言中的至少一种，能够独立完成脚本编写、数据抓取、API 调用、简单服务搭建和工具集成。\n熟悉 Claude、GPT、Gemini 等主流大模型产品或 API，具备 Prompt 设计、上下文管理、工具调用、知识库配置和效果调优能力。\n具备 Coze、Dify、FastGPT、扣子、n8n、Make、Zapier 等 Agent 或自动化平台的实际使用经验，能够独立搭建并上线可用的业务工作流。\n有真实 Agent 工作流搭建经验，能够独立完成需求分析、流程设计、节点配置、知识库接入、工具调用、异常处理和上线测试。\n具备较强的业务理解能力，能够快速理解陌生业务的核心流程、关键角色、主要成本和效率瓶颈。\n能够根据业务场景判断适合使用 Agent、RPA、脚本、低代码平台，还是传统系统改造，而不是为了 AI 而 AI。\n具备一定的数据处理能力，能够对业务数据、表格数据、日志数据进行清洗、统计、汇总和自动化输出。\n具备项目推进能力，能够独立跟进 AI 提效项目的需求确认、排期、测试、上线、培训和复盘。\n具备良好的沟通和文档能力，能够输出需求文档、流程图、操作手册、项目复盘、周报和提效成果报告。\n具备结果导向意识，能够用数据证明 AI 项目的实际价值，而不是只停留在工具搭建或概念展示。\n面试需提供过往 AI 工具、Agent 工作流、自动化脚本或提效项目案例，有作品演示者优先。\n【加分项】\n熟悉 RPA 工具，如 UiPath、影刀、来也、Power Automate 等，有结合 LLM 实现网页操作、表单填写、数据抓取、系统录入等自动化经验。\n有出海、泛娱乐、游戏买量、内容运营、客服运营、社群运营、直播、电商等业务场景经验，能快速理解业务语言和运营链路。\n曾负责企业内部效能工具、B 端产品、运营工具、数据看板、自动化平台等项目，有产品经理或项目 Owner 经验优先。\n有企业内部 AI 工具推广经验，包括培训、使用手册、落地复盘、数据追踪和用户反馈收集者优先。", "cat": "其他"}, {"id": "110", "title": "代码审计工程师 （Go 后端 安全与 AI 方向）", "salary": "18-28k", "location": "", "jd": "Go 后端代码审计工程师（安全与 AI 方向）\n\n 🛠 岗位职责\n\n1. 负责 Go 后端项目的代码审计与质量评估，从代码规范、架构设计、并发安全、性能隐患、数据安全及可维护性等维度开展系统审查。\n2. 深入阅读业务代码，识别 SQL 注入、越权访问、敏感信息泄露、鉴权缺陷、接口滥用、并发竞态、资源泄漏等问题，输出审计报告及整改建议。\n3. 结合业务场景评估系统安全边界，重点审查 API、数据库、缓存、消息队列、文件上传及第三方服务调用等关键链路。\n4. 对审计发现的问题进行风险分级，提供可落地的修复方案，必要时参与核心模块重构、漏洞修复及复审验收。\n5. 参与制定 Go 编码规范、安全开发规范及 Code Review 流程，推动静态扫描、依赖检测和 CI 安全门禁落地。\n6. 结合 Claude Code、Codex、Cursor 等 AI 工具建设自动化代码审查流程，提升漏洞识别、问题分类及审计报告生成效率。\n\n🎯 任职要求\n\n1. 本科及以上学历，计算机相关专业优先，3 年以上 Go 后端开发经验。\n2. 扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、内存管理及并发模型，能够识别常见并发与性能问题。\n3. 熟悉 Gin、Go-Zero、Kratos、GORM 等常用框架或组件，具备中大型后端系统开发经验。\n4. 熟悉 MySQL、Redis、Kafka/RabbitMQ 等基础设施，能够审查数据库设计、缓存策略及消息处理链路。\n5. 具备较强的代码阅读和问题定位能力，有 Code Review、代码审计、安全评审或线上故障排查经验。\n6. 熟悉常见 Web 及 API 安全风险，包括 SQL 注入、XSS、CSRF、SSRF、文件上传、鉴权绕过、越权访问和敏感数据泄露等。\n7. 能够清晰输出审计结论、风险等级、影响范围、修复建议及复审结果。\n8. 熟练使用 Claude Code、Codex、Cursor 等 AI 编程工具，能够运用 AI 提升代码审查和漏洞分析效率。\n\n✨ 加分项\n\n* 具备网络安全、渗透测试、SDL 安全开发或企业代码安全审计经验。\n* 熟悉 OWASP Top 10、CWE、CVSS 等漏洞分类和风险评估标准。\n* 使用过 Semgrep、SonarQube、CodeQL、Gosec、Trivy、Snyk 等代码与依赖安全扫描工具。\n* 具备高并发、微服务、分布式系统或支付、账户、权限等高风险业务开发经验。\n* 熟悉 Docker、Kubernetes、Linux 及 CI/CD，能够排查配置、镜像、依赖和部署环节的安全风险。\n* 有漏洞挖掘、攻防演练、CTF、SRC 漏洞提交或安全认证经历。\n* 有基于 LLM 搭建自动化 Code Review、漏洞识别或审计报告生成工具的实际经验。\n\n 🤝 我们期待的你\n\n👉 **代码审查能力强**：能够快速读懂陌生项目，识别真正影响业务安全和稳定性的核心问题。\n\n👉 **安全意识敏锐**：不只关注代码能否运行，也关注权限边界、数据安全、攻击风险和异常场景。\n\n👉 **结果导向**：能够独立完成审计、报告、整改推动及复审闭环，而非只发现问题。\n\n👉 **拥抱 AI 提效**：善于使用 AI 工具提升审计效率，同时能够判断和验证 AI 输出的准确性。", "cat": "技术开发"}, {"id": "111", "title": "数据分析师/游戏数据运营", "salary": "15k-30k\n优秀可谈", "location": "", "jd": "学历要求严格\n最好是硕士，必须有游戏行业经验，简历优先看有游戏项目经验  + 懂游戏产品分析，能用数据推动产品和运营优化的人才\n岗位职责：\n1、负责游戏项目的数据分析与数据运营工作，围绕新增、活跃、留存、付费、LTV、玩法参与、活动效果等核心指标，持续监控项目经营情况，及时发现数据异常和业务问题。\n2、深入参与游戏产品调优，结合玩家行为数据，对新手流程、核心玩法、养成系统、关卡/副本体验等进行分析，定位流失点、转化断点和体验问题，并输出可落地的优化建议。\n3、负责版本、活动和商业化专项分析，包括版本前后效果对比、活动参与与转化分析、礼包/商品表现分析、付费用户分层、付费路径分析、渠道用户质量分析等，为产品迭代和运营决策提供数据支持。\n4、参与游戏数据分析体系建设，包括埋点方案设计、日志上报验收、指标口径定义、数据质量检查、看板搭建与维护，保障数据可用、口径清晰、分析结果可信。\n5、协同运营、研发团队推进问题闭环，将数据结论转化为产品优化方向、运营动作，并跟进上线后的效果验证。\n岗位要求：\n1、本科及以上学历，1–5年游戏数据分析经验（必须有游戏行业经验），RPG、卡牌、二游等品类经验优先。\n2、热爱游戏，平时有较多游戏体验，能够理解游戏系统、玩家成长、付费设计、活动节奏和版本迭代逻辑；能结合游戏内容判断数据变化背后的原因；\n3、具备良好的数据敏感度和业务判断力，能够从留存、漏斗、付费、活跃、玩法参与等数据中发现问题；\n4、熟练使用 SQL、Excel，能够独立完成数据提取、清洗、统计和分析工作；有建模/算法能力为加分项；\n5、具备数据可视化和看板搭建能力，熟悉数数 BI 平台者优先；\n6、具备较强的沟通表达能力，能够把复杂数据问题讲清楚，输出结构化分析结论，并推动运营、研发团队形成共识和行动。", "cat": "运营与市场"}, {"id": "112", "title": "高级Unity3D开发工程师", "salary": "高级，20-30k", "location": "", "jd": "高级 Unity3D 游戏开发工程师\nAPK 安全方向  招聘岗位说明\n岗位职责\n1. 负责 Unity3D 游戏客户端的架构设计、核心功能开发及性能优化，保障产品稳定性与可维护性。\n2. 负责 Android APK 安全体系建设，包括代码混淆、加固、签名校验、完整性校验及资源保护。\n3. 针对反编译、二次打包、动态调试、Hook、内存篡改等风险，设计并落地防护方案。\n4. 熟悉 Unity Mono / IL2CPP 的运行机制与安全特点，优化 C#、Java/Kotlin 和 Native 层之间的安全交互。\n5. 与服务端配合建设反作弊机制，完善关键数据校验、通信安全、异常行为检测及风险处置流程。\n6. 开展安全测试与漏洞排查，跟踪线上作弊和破解问题，完成定位、修复及防护策略迭代。\n7. 评估安全方案对性能、包体、兼容性及发布流程的影响，推动安全能力融入构建与发布流程。\n任职要求\n1. 5 年及以上游戏客户端开发经验，3 年及以上 Unity3D 实战经验，参与过至少一款正式上线的 Android 游戏。\n2. 精通 C#，熟悉 Unity 引擎架构、资源管理、热更新、内存管理及性能优化。\n3. 具备丰富的 Android APK 安全实战经验，主导或深度参与过已上线游戏的防破解、反篡改或反作弊建设。\n4. 熟悉 APK 结构、DEX、SO 动态库、Android 签名机制、JNI/NDK，具备 Java/Kotlin 与 C/C++ 代码分析能力。\n5. 熟悉 Mono / IL2CPP 构建流程，理解托管代码、元数据及 Native 代码面临的安全风险。\n6. 熟练使用 JADX、Apktool、Ghidra/IDA、Frida 等工具开展授权安全分析与防护验证。\n7. 具备反调试、反 Hook、完整性检测、资源加密和密钥保护等方案的落地经验，能够分析其防护边界与绕过风险。\n8. 理解客户端环境不可信原则，能够结合服务端权威校验设计安全方案，避免仅依赖客户端检测。\n9. 具备良好的问题定位、技术文档编写和跨团队协作能力，能够独立推进复杂安全问题闭环。\n加分项\n1. 有中大型联网游戏、竞技游戏或高对抗场景的反作弊经验。\n2. 有 IL2CPP 安全防护、Native 层安全分析或自研安全组件经验。\n3. 有 Play Integrity API、设备风险识别或第三方安全 SDK 接入经验。\n4. 有安全自动化测试、风险监控及灰度发布经验。\n5. 能提供脱敏项目案例，清晰说明威胁场景、防护措施、上线效果及性能代价。", "cat": "技术开发"}, {"id": "113", "title": "高级服务器开发工程师", "salary": "高级，20-30k", "location": "", "jd": "岗位职责\n1. 负责游戏服务端核心系统的设计、开发与维护，包括账号、角色、背包、任务、活动、排行榜及公会等业务模块。\n2. 根据游戏玩法需求，完成通信协议、业务逻辑及数据存储设计，与 Unity3D 客户端协作完成联调和上线。\n3. 负责服务端性能优化，定位并解决高并发场景下的延迟、资源占用、数据库瓶颈及服务稳定性问题。\n4. 保障游戏数据的正确性与一致性，处理并发操作、重复请求、断线重连及异常恢复等场景。\n5. 落实服务端权威校验，对登录、道具发放、交易、支付及结算等关键流程进行安全控制，防范数据篡改、请求重放和业务逻辑漏洞。\n6. 完善日志、监控、告警及自动化部署流程，参与线上故障排查、应急处理和问题复盘。\n7. 编写技术设计及接口文档，参与代码评审，持续改进服务端代码质量和开发效率。\n任职要求\n1. 3 年及以上服务端开发经验，具备游戏服务端开发经历；参与过至少一款正式上线游戏的开发或持续运营。\n2. 熟练掌握 Go、Java、C++、C# 等至少一种服务端开发语言，具备良好的编码习惯和独立模块设计能力。\n3. 熟悉 TCP、UDP、HTTP、WebSocket 等常见网络协议，理解连接管理、心跳、超时、重试及消息序列化机制。\n4. 熟练使用 MySQL 等关系型数据库及 Redis，具备表结构设计、索引优化、慢查询分析和缓存设计经验。\n5. 理解多线程、异步编程及并发控制，能够处理竞态条件、死锁、重复执行和数据一致性问题。\n6. 熟悉 Linux 开发与运行环境，能够通过日志、监控及性能分析工具定位线上问题。\n7. 熟悉常见分布式系统设计，理解幂等、限流、熔断、消息队列及故障恢复等机制，能够结合业务合理应用。\n8. 具备客户端不可信的安全意识，能够独立实现身份鉴权、权限校验、关键业务校验及接口防滥用措施。\n9. 具备良好的沟通协作能力，能够与策划、客户端及测试团队配合，独立推进功能从需求分析到上线交付。\n高级岗位补充要求\n1. 5 年及以上服务端开发经验，主导过游戏核心系统或服务端架构设计。\n2. 有高并发或大规模在线业务的实践经验，能够结合实际数据说明容量规划、性能瓶颈及优化效果。\n3. 具备复杂线上故障的独立排查与处置能力，能够推动系统性改进。\n4. 能够承担技术方案评审、关键模块把关及中初级工程师指导工作。\n加分项\n1. 有实时对战、帧同步、状态同步、匹配或跨服系统开发经验。\n2. 有游戏支付、经济系统、交易系统及反作弊相关经验。\n3. 熟悉 Docker、Kubernetes 或公有云服务，有自动化部署和弹性扩缩容实践。\n4. 有压测、容量评估、灰度发布、数据迁移或不停服更新经验。\n5. 熟悉 Unity3D 客户端协作流程，能够快速定位客户端与服务端交互问题。", "cat": "技术开发"}, {"id": "114", "title": "中高级运营", "salary": "15K\n经验丰富者视能力定岗定薪", "location": "远程", "jd": "岗位职责：\n1、玩家阵地精细化运营：统筹平台、媒体、论坛等核心玩家阵地的生态维护，制定巡查机制与垃圾广告治理方案，牵头基础用户答疑及高价值问题闭环处理，提升用户活跃度与阵地口碑；\n2、数据驱动运营优化：负责后台核心数据跟踪、多维度分析（含用户行为、内容效果、活动转化等），输出结构化数据报告并提炼可落地优化建议，支撑运营策略迭代；\n3、运营活动统筹执行：协助策划阶段性运营活动，主导活动后台用户管理、页面生命周期管控及发奖全流程统筹，联动跨部门推进活动落地，对活动参与度、留存率等关键指标负责；\n4、海外内容生态搭建：建立海内外热门单机游戏更新动态的常态化监测机制，深度挖掘优质内容素材，指导并协同内容团队完成素材筛选、本地化适配与排版优化，提升内容传播力。\n\n岗位要求\n1、经验与学历：2-3年游戏行业相关经验，接受211/985本科及以上应届生（需具备丰富的游戏运营相关实习经历）；\n2、游戏认知：深度PC单机游戏玩家，精通海内外单机游戏圈生态、热门IP动态及圈层黑话，具备玩家社群/论坛核心用户或运营经验，能精准洞察玩家需求；\n3、核心能力：具备较强的策略思维与统筹协调能力，执行力扎实且注重细节，熟练运用Excel（VLOOKUP、数据透视表等）及常用数据分析工具，能独立完成数据复盘与报告输出；\n4、语言与视野：英语CET-4及以上水平，可独立阅读海外游戏更新日志、社群讨论等内容，具备国际化内容视野，能快速捕捉海外游戏圈热点并转化为运营动作；\n加分项：有游戏社群从零到一搭建或活动策划落地经验者优先；具备基础图文排版设计能力（如熟悉PS、秀米等工具）者优先。", "cat": "运营与市场"}, {"id": "115", "title": "初级运营专员", "salary": "10K", "location": "远程", "jd": "岗位职责\n1.        负责平台、媒体、论坛等玩家阵地的日常巡查、垃圾广告清理与基础用户答疑；\n2.        协助数据分析，跟踪后台数据，整理数据日报；\n3.        协助运营活动开展，负责后台用户管理、活动页面上下架及发奖流程执行；\n4.        收集海内外热门单机游戏的更新动态，协助内容团队进行图文素材搬运与排版。\n岗位要求\n1.        1-2年海外互联网运营经验或211本科应届毕业生；\n2.        骨灰级PC游戏玩家，熟知单机游戏圈的黑话与热点，有重度海外游戏玩家社群论坛水友经验；\n3.        执行力极强，踏实细心，熟练使用Excel等基础办公软件；\n4.        英语CET-4以上，能借助翻译软件无障碍阅读海外游戏更新日志及社群内容。", "cat": "运营与市场"}, {"id": "116", "title": "双语技术支持专家/中英文客服", "salary": "10-15K", "location": "1、远程", "jd": "岗位职责\n 1. 熟练使用中英文，快速响应全球用户的技术求助，并提供有效解决方案；\n 2. 提炼高频常见问题，撰写剪辑并持续维护通俗易懂的双语FAQ文档；\n 3. 针对尝试订阅失败或申请退款的用户，进行积极的沟通干预与指导，降低付费环节的技术流失率；\n 4. 将用户报错转化为结构化的技术工单，协助研发团队快速定位代码层面的Bug并督促修复进度。\n 岗位要求\n 1. 极度了解PC软硬件运行原理与Windows系统架构（尤其是注册表、运行库、各主流杀软机制），有技术客服、IT运维或PC单机游戏发行技术支持经验；\n 2. 情绪稳定，极具耐心与服务意识，能承受大量重复性的基础咨询及偶尔的负面情绪宣泄；\n 3. 中英双语文字表达专业且富有温度，能熟练使用各类客诉管理软件系统。", "cat": "技术开发"}, {"id": "117", "title": "社媒运营", "salary": "12k-22k", "location": "", "jd": "必须有游戏行业经验\n必须提供过往曾运营的社媒账号链接、负责账号的具体时间\n\"学历：本科及以上  \n岗位职责\n活动策划与执行：独立负责平台活动（节日活动、版本活动、拉新促活等）及社媒、社群活动的全流程，包括方案设计、资源协调、落地执行与效果复盘；\n社媒运营：负责官方账号的内容策划与日常运营，维护账号人设，提升粉丝量与互动率；\n社群运营：策划社群专属活动与玩法，提升社群活跃度与用户归属感；\n用户增长与维系：围绕拉新、促活、留存设计运营策略，搭建用户激励与成长体系，提升核心用户粘性；\nUGC 生态与 KOC 合作：策划二创激励、同人征集等 UGC 活动，联 KOC 进行内容传播与用户拉新；\n数据复盘：跟踪活动效果与用户数据（活跃、留存、转化等），定期输出复盘报告，持续迭代运营打法；\n\"任职要求\n3 年以上二次元、游戏或泛娱乐平台的运营经验；\n有从 0 到 1 搭建社群或社媒账号的成功经历；\n独立运营过有一定粉丝规模的社媒账号；\n熟悉B站、抖音或小红书等主流平台的内容生态与运营玩法；\n有完整的运营活动策划与执行经验，能提供可量化的成功案例（活动参与量、拉新量、互动数据等）；\n具备数据意识，能独立完成活动数据分析与复盘；\n文案功底扎实，有创意、执行力强，具备良好的跨部门沟通协调能力；\n加分项：深度理解二次元文化，熟悉圈层用户的喜好、语言和梗。", "cat": "运营与市场"}, {"id": "118", "title": "发行侧运营负责人", "salary": "20-30K", "location": "远程", "jd": "岗位职责\n1. 平台运营规划与全球化布局\n--负责游戏生态与分发平台的全面运营战略规划、核心业务目标制定与全球化落地，对平台整体 DAU、MAU、生态健康度及商业化营收全面负责。\n--统筹平台在海外重点市场的本地化运营与破局，制定差异化的海外市场推广策略及用户获取（UA）方案。\n2. 海外市场推广与用户增长\n--主导全球化流量获客与品牌声量打造，擅长结合海外主流社媒生态（如 Discord、Reddit、X、TikTok、YouTube 等）开展裂变增长与矩阵式社群搭建。\n--建立并管理海外发行运营团队，深度拓展并维护与海外渠道、本地媒体及核心合作伙伴的战略合作关系。\n3. 具备全球化内容生态与创作者搭建能力\n--搭建面向全球的 UGC 创作者、开发者及工会/公会招募、孵化与全生命周期管理体系，驱动内容生态自循环。\n--把控平台内容安全、合规性及海外本地化标准（如 GDPR 隐私保护、版权规范与内容审查机制等）。\n4. 商业化闭环与精细化运营\n--统筹平台多元化商业化变现路径（如付费订阅、全球化支付生态、分成机制等），持续优化全球不同区域的 ARPU 值与 ROI 模型。\n--建立科学的全球化数据监控与漏斗分析体系，通过数据驱动产品迭代、跨国本地化适配及精细化用户分层运营。\n5. 跨部门统筹与项目全盘管理\n--站在平台全局视角，高效协同产品、技术、海外发行、设计与本地化团队，输出高质量的需求规划（PRD）、用户流程及全球化交互设计规范。\n--严控项目排期与技术架构风险（如全球服务器并发、大文件分发、海外网络延迟优化等），保障平台在全球范围内的平稳高效运转。\n任职要求\n1. 基本背景\n统招本科及以上学历，具备 6-10年及以上 互联网/游戏行业从业经验，其中至少 3-5年 大中型游戏平台、应用分发平台或出海工具/社区产品的核心运营负责人管理经验。\n具备成熟的海外游戏发行或海外平台运营实战操盘战绩，有完整大体量出海项目成功落地经验。\n2. 核心专业能力\n全球化视野与海外推广能力：深刻理解海外主流游戏文化及用户心智，精通海外社媒裂变及本地化获客底层逻辑。\n平台级统筹与架构破局能力：不局限于单点业务，具备大盘视角，能统筹“技术-产品-运营-商业化-海外发行”的全链路闭环。\n商业化与创作者经济操盘经验：对全球化平台的变现模式、分成机制及创作者生态有深刻认知，具备跨国商业合作谈判与 ROI 优化能力。\n3. 软性素质\n团队管理与跨部门协同能力：具备优秀的大局观与跨文化团队管理经验，能够在执行层面扎实落地的同时，具备主动思考、前瞻性全球规划及跨部门高压协同的领导力。", "cat": "运营与市场"}, {"id": "119", "title": "资深SEO运营/自动化增长", "salary": "20K", "location": "远程", "jd": "岗位职责\n1.        挖掘建立PC端游戏工具平台SEO矩阵；\n2.        协同技术研发团队完成程序化SEO需求。确保自动化生成高转化率的多语种落地页，并完成主要引擎的抓取收录；\n3.        主导全站点的技术SEO优化，监控并优化页面跳出率，提升在主要引擎的核心关键词占比和排名；\n4.        针对高热度关键词，策划并实施海量域名站群建设，运用泛解析、泛目录等技术快速截流，获取游戏媒体与相关论坛的引流。\n岗位要求\n1.        本科及以上学历，具有5年以上SEO优化经验，有大型软件分发站、游戏门户或电商平台优化经验者为必选项；\n2.        精通GSC、Ahrefs等工具。熟练掌握国内外各类蜘蛛池搭建与快速收录机制，有千万级页面收录与应对搜索引擎核心算法打击的实战规避经验；具备百度、Google等主流搜索引擎双端黑白帽SEO实操经验者优先。\n3.        具备极强的技术理解力，熟悉前沿的程序化SEO逻辑和利用AI工具批量生成高质量网页内容的流程；\n4.        数据导向，能清晰核算SEO带来的自然流量在转化漏斗中的最终价值，抗压能力强。", "cat": "运营与市场"}, {"id": "120", "title": "AI 视频设计师", "salary": "15000-20000", "location": "远程", "jd": "岗位职责：\n1、负责 AI 动漫短视频、AI 游戏介绍动画等内容全流程制作\n2、根据剧本完成分镜构思、AI 视频生成、配音配乐、剪辑及交付\n3、把控人物一致性、画面风格、剧情节奏和镜头衔接\n4、修复人物崩坏、穿模、画面抖动等问题\n任职要求：\n1、熟悉 AI 视频、AI 动漫制作流程\n2、必须熟练使用 ComfyUI / WebUI 工具和 Wan 2.2、LTX 2.3 等 AI 开源视频模型——不熟悉开源视频模型的请勿投递\n3、能够自行搭建工作流，或根据通用工作流添加节点，搭建特殊的动作迁移、视频转绘、视频去水印等视频编辑工作流\n4、能独立完成分镜设计、视频提示词搭建、生成视频及配音等制作\n5、必须提供AI视频作品集\n加分项：\n1、有 Wan 或 LTX 的视频 LoRA 制作经验\n2、有其他图片 LoRA 训练经验\n3、有 AI 语音合成经验（ElevenLabs、GPT-SoVITS 等）\n4、有二次元 / 卡牌 / RPG / 美女向 / 男性向内容视频经验\n5、有海外市场（中华圈、韩国、日本）视觉偏好理解\n6、曾独立主导某款漫剧或短剧作品的完整宣发流程", "cat": "内容与创作"}, {"id": "121", "title": "游戏广告素材设计师", "salary": "13000-18000", "location": "", "jd": "岗位职责：\n1、负责手游及内容平台的广告素材设计与制作:静态图、GIF、短视频、信息流素材、原生广告、开屏广告等\n2、根据投放需求与产品定位，拆解卖点并转化为高点击率的视觉表现\n3、熟练使用 AI 生图与 AI 视频工具（Midjourney / ComfyUI / Flux / 即梦 / Runway / Kling 等）大幅提升素材产出效率，同时保证质量稳定性与角色/风格一致性\n4、针对不同投放渠道产出差异化尺寸与调性的素材版本\n5、建立高效率素材工作流：多版本快速产出 → A/B 测试 → 数据回收 → 复用有效元素\n6、结合投放数据反馈，总结高转化元素并沉淀为可复用的模板 / LoRA / 提示词库\n7、针对不同投放渠道的审核规则，输出「尺度分级版」素材（严格版 / 合规版 / 高转化版），配合买量团队通过审核\n任职要求：\n1、2 年以上手游 / 信息流 / 买量广告素材经验（有真实投放数据案例者优先）\n2、必须熟练运用 AI 生图工具（Midjourney / Stable Diffusion / ComfyUI / Flux / 即梦 至少 3 款），具备扎实的提示词、LoRA、Checkpoint 使用能力\n3、会使用至少一款 AI 视频生成工具（Runway / Kling / MiniMax 海螺 / 即梦视频 / Sora / Pika 等），能输出 15 秒以内的短视频素材\n4、必须对二次元文化具备真实理解，手游玩家优先考虑\n5、具备扎实的视觉设计基础，对构图、色彩、信息层级、字体排版有清晰判断\n6、熟练使用 Photoshop、AE（或 CapCut / Premiere），具备基础动效与视频剪辑能力\n7、了解手游 & 内容平台广告素材的常见形式，对用户注意力机制、前 3 秒钩子有基本认知\n8、能理解产品卖点，并将其转化为有效的视觉表达\n9、必须提供 AI 生成作品集（AI 生图 + AI 视频，最好包含尺度作品）\n加分项：\n1、有二次元 / 卡牌 / RPG / SLG / 美女向 / 男性向手游素材经验\n2、有海外（中华圈、韩国、日本、东南亚）或成人向市场投放素材经验\n3、熟悉 ComfyUI 工作流搭建、LoRA 训练、图像扩展、局部重绘、图生视频等高级 AI 应用\n4、有真实投放数据支撑（CTR、CVR、eCPM 优化案例）\n5、能独立完成从卖点拆解 → 概念构思 → AI 生成 → 后期加工 → 多版本迭代的完整流程\n6、对数据反馈敏感，愿意根据 A/B 测试结果快速调整设计方向\n7、有 Meta / TikTok / Google 等主流投放平台素材审核规则的实战经验", "cat": "内容与创作"}, {"id": "122", "title": "技术项目经理（游戏运维中台方向）", "salary": "15K-20K", "location": "", "jd": "岗位职责\n一、负责游戏运维中台建设项目的推进，制定项目计划、跟进研发排期、保障按期交付。\n二、对接研发、发行、平台、运维等多方，梳理业务流程与需求，组织方案评审。\n三、推动合服开服、版本发布、生产变更管控、监控告警等运维场景的线上化与流程卡口建设。\n四、识别并推动解决项目中的技术卡点与资源瓶颈。\n五、推动中台在各游戏项目落地使用，收集反馈并持续迭代优化。\n六、探索 AI 工具在项目管理与运维流程中的应用，提升团队效率。\n七、建立并维护配套流程规范（SOP），推动系统与制度协同生效。\n\n【任职要求】\n一、本科及以上学历，计算机相关专业优先。\n二、1 年以上游戏行业技术类项目管理经验，有游戏内部系统或工具平台的交付经历。\n三、熟悉游戏运维场景（版本发布、合服开服、停服维护、热更新等），具备技术理解能力，能读懂技术方案、与研发有效沟通并评估工作量。\n四、熟悉并能实际运用 AI 工具解决工作问题，有用 AI 提效或搭建自动化流程的实践经验。\n五、具备多方协调推动能力，能对接研发、发行、平台、运维等团队达成目标；对流程敏感，善于发现重复性人工操作与易错环节并推动系统化解决。\n六、责任心强，能适应项目关键节点及线上紧急事件支持；后续有出国工作机会\n\n【加分项】\n一、熟悉 Jira、GitLab、CI/CD、监控告警等工具链。\n二、具备代码或脚本编写能力。\n三、有内部工具在团队成功推广落地的经验。\n四、有 AI Agent、工作流自动化相关实践。", "cat": "技术开发"}, {"id": "123", "title": "互动影游主创 / 导演 （影视体验 / 创作统筹）", "salary": "25–35K", "location": "", "jd": "岗位定位：以沉浸式影视体验为核心，把故事、表演、镜头和互动组织为完整作品，对整体创作体验负责。\n\n1、确定题材、故事方向、人物关系和视听风格，与叙事策划共同打磨故事大纲及关键抉择。\n2、将剧本转化为文字与图像分镜，设计角色调度、视角、构图、运镜和情绪节奏，明确AI制作依据。\n3、从导演视角确定互动切入、停顿与恢复方式，让选择发生在具有情绪或戏剧意义的时刻，保持观看流畅。\n4、审核角色表演、生成镜头、剪辑及声音，判断不同路径的情绪铺垫和人物反应，统筹补镜与修改。\n5、主持可玩版本评审，结合观看和操作体验调整演出，控制场景、镜头与分支规模，完成首作创作验收。\n6、参与成人向内容定位与商业化评审，判断不同受众为何关注、持续观看和付费，评估内容承诺与实际体验的一致性。\n\n交付与边界：创作方案、图像分镜、演出标准及成片审核；负责影视表达与整体取舍，分支细稿和条件表由叙事策划负责。\n\n任职要求：\n1、有完整叙事影像的主创、编导或导演经历，能展示从剧本理解、分镜到成片的本人贡献。\n2、具备扎实的镜头语言、人物表演、剪辑节奏和审美判断，能说明具体镜头为何成立。\n3、理解互动影像的玩家视角，能判断何时给予选择、哪些信息应当呈现、如何在等待和跳转中维持情绪。\n4、有AI影像制作实践，能评估生成可行性、跨镜头连续性和返工代价，提出可执行修改意见。\n5、能统筹小团队创作、组织试玩并落实反馈，在制作约束下保持关键场面的表现力。\n6、理解R18成人影像（包括AV／porn）的类型、受众偏好与付费动机，能分析感官吸引、欲望投射、亲密关系幻想和叙事期待的差异，并形成角色定位、内容分级与演出方向判断。\n\n作品要求：\n提交1–2部叙事作品，附一场戏的分镜与成片、本人贡献说明。可补充互动作品或交互改编方案。\n\n面试重点：\n把一场戏改编为互动片段，说明视角、选择时机、等待演出及结果镜头。\n\n加分项：\n互动电影导演、叙事游戏演出或完整AI短片经验。\n\n成人向评估：\n提交非露骨的类型分析，说明目标受众、吸引力、付费理由及证据，区分个人偏好与用户需求。", "cat": "内容与创作"}, {"id": "124", "title": "互动叙事策划 / 编剧 （人物 / 选择 / 多路径）", "salary": "根据实际能力面议", "location": "", "jd": "岗位定位：让观众以角色身份参与故事，对人物动机、选择意义及多路径叙事完整性负责。\n\n1、依据创作方向完成大纲、人物小传、分场剧本及对白，围绕角色目标组织冲突与情绪推进。\n2、设计关键选择，说明玩家已知信息、抉择动机、取舍、即时反应和后续影响；让选择改变关系、信息或局面。\n3、设计分支、汇合和结局，输出节点、触发条件、状态变化与素材需求，保证不同路径的人物动机及信息一致。\n4、按剧情需要设计轻量调查、限时回应或关系反馈，明确其叙事作用；与导演协商互动频次，避免打断关键表演。\n5、配置并走查互动脚本，检查漏选、重复体验、回看和多路径逻辑；根据试玩反馈修正选项误解、后果突兀及叙事断层。\n6、参与成人向角色路线及付费内容规划，明确每条路线的人物体验、关系发展和内容价值，保证分支差异与交付承诺一致。\n\n交付与边界：剧本、分支图、选择后果表、可配置节点及路径复核；负责写作和互动逻辑，导演负责镜头与成片表达。\n\n任职要求：\n1、有完整剧本、互动小说或叙事游戏创作经验，能展示本人作品；须能提供可体验的分支样例，个人原型亦可。\n2、具备角色塑造、戏剧冲突和对白能力，能写出符合人物身份与情境的表达。\n3、理解选择与后果的因果关系，能区别情绪表达、信息探索和路线改变等互动价值，并设计充分铺垫。\n4、能维护分支图、条件与变量表，通过Twine、Ink或项目配置工具交付互动内容并完成逻辑走查。\n5、具备影视化写作和制作成本意识，能在有限场景、角色和镜头量内形成有差异的路径体验。\n6、熟悉成人向影视、互动小说或视觉小说，能从人物吸引力、关系幻想、情感投入与内容期待分析成人用户的观看及付费意愿，并通过用户反馈验证判断。\n\n作品要求：\n提交一场完整戏及可体验分支样例，附节点图；说明选择前的信息、人物反应、延迟后果及汇合方式。\n\n面试重点：\n用有限镜头设计两种有意义的选择，解释如何兼顾人物、情绪与制作量。\n\n加分项：\n互动影游、视觉小说或叙事游戏实装经验；影视剧本创作经验。\n\n成人向评估：\n以非露骨梗概说明两条角色路线的体验差异、吸引人群和付费内容价值，不以尺度大小代替分析。", "cat": "内容与创作"}, {"id": "125", "title": "AIGC影像制作师 （连续影像 / 剪辑合成）", "salary": "根据实际能力面议", "location": "", "jd": "岗位定位：将导演分镜制作成可接入互动作品的视听片段，对影像执行质量及基础后期交付负责。\n\n1、建立角色定妆、场景和关键帧资产，依据分镜完成AI图像与视频生成，控制表演、构图和镜头运动。\n2、解决角色、服饰、道具、光影及动作连续性问题，完成候选筛选、局部修正、合成和补镜。\n3、根据选择结果制作必要的反应与分支变体，保证人物状态、叙事线索和情绪变化准确，维护共享素材与差异版本。\n4、完成短篇原型的剪辑、基础调色、字幕、对白清理与音效编排，处理选择等待、片段跳转及分支汇合的音画衔接。\n5、按节点和版本交付成片、字幕、分轨及工程，在可玩版本中复核效果；复杂合成或专业混音按需求拆包协作。\n\n交付与边界：参考资产、镜头与分支成片包、基础后期工程；执行导演创作标准，反馈制作风险并完成修改。\n\n任职要求：\n1、有连续叙事AI影像作品，能独立完成从参考资产、生成到基础剪辑的制作流程，并说明本人贡献。\n2、熟练使用AI图像与视频工具，能稳定管理跨镜头角色和场景一致性，并适配项目既定制作流程。\n3、理解镜头语言、光影、动作和表演，能识别生成瑕疵并提供可用修正方案。\n4、熟练使用一种主力剪辑工具，具备基础调色、对白处理、字幕及分轨输出能力。\n5、理解非线性片段的连续性要求，能按节点、状态与版本归档，在实际交互播放中检查成片并迭代。\n6、能够接受并专业处理R18成人向项目，理解不同内容分级的视觉表达和受众预期，能准确执行导演要求并管理分级素材版本。\n\n作品要求：\n提交60–120秒连续叙事片段及修正前后对照，附本人后期工程；补充同一场景的不同反应或分支衔接样例。\n\n面试重点：\n验证角色一致性、表演筛选与两个分支间的剪辑和声音衔接。\n\n加分项：\n互动影像制作、合成、声音设计或可复用AI工作流经验。", "cat": "内容与创作"}, {"id": "126", "title": "互动影游开发工程师 （交互播放 / 叙事系统）", "salary": "20–35K", "location": "", "jd": "岗位定位：将影像、选择与剧情状态接成流畅可玩的作品，对交互响应、播放连续性与版本稳定性负责。\n\n1、实现视频播放与选择界面协同，处理选项出现、等待、默认/超时选择及分支切换，保持字幕和音画同步。\n2、建立剧情节点、条件和状态系统，支持关系/信息变化、路径汇合与结局判断，确保选择后果可配置和可验证。\n3、实现存档、回看、已读跳过和重试，明确回溯时的状态恢复规则，保证重新选择后剧情正确推进。\n4、与叙事策划按需求实现轻量调查或限时交互，提供资源接入、变量查看和节点跳转等配置调试能力。\n5、优化预加载、缓存及加载失败恢复，测试连续操作、重复触发和跨路径状态，完成打包、源码和运行文档。\n\n交付与边界：可玩版本、交互播放与叙事配置系统、调试工具及测试记录；负责功能实现，选择设计与演出由创作岗位确定。\n\n任职要求：\n1、有至少1个可运行的游戏、互动影像或多媒体应用，能展示本人代码、实现取舍及完整交付过程。\n2、熟练掌握一种语言及框架/引擎，具备事件处理、状态管理、配置读取和异步加载能力。\n3、有音视频接入经验，能定位播放切换、加载延迟、操作响应及音画同步问题。\n4、理解分支触发、条件判断与存档恢复，能设计关键路径和异常测试，协助非技术人员调试内容。\n5、掌握Git、测试与日志排障，能使用Codex等辅助开发并独立审查和验证生成代码。\n6、能够参与成人向产品开发，按产品要求实现年龄访问限制、内容分级及付费权益校验，并保证不同版本的资源与权限对应。\n\n作品要求：\n提交可运行作品及本人贡献，附播放/状态流程、配置和测试样例。\n\n面试重点：\n修改一处分支，演示连续播放、重新选择、回看与读档后的状态正确性。\n\n加分项：\n互动电影、视觉小说、视频预加载、叙事编辑工具或多端交付经验。", "cat": "技术开发"}, {"id": "127", "title": "核心导演 / 总策划", "salary": "根据实际能力面议", "location": "", "jd": "岗位职责\n负责AI漫剧项目的整体风格定调、剧本视觉转化与分镜节奏把控。\n统筹项目全流程进度，协调编剧、生图、后期等各环节高效配合。\n把控AI生成素材质量，审核并指导画面连贯性、角色一致性及成片效果。\n跟进AI前沿技术与工具，优化团队工业化制作管线与工作流。\n\n任职要求\n大专及以上学历，影视动画、数字媒体、编导等相关专业优先，3-5年及以上动画、短剧或游戏行业导演/\n策划经验，具备成熟AI商业项目落地案例。\n具备扎实的视听语言基础与分镜构图能力，熟悉网文、短视频及漫剧爽点设计。\n深度了解主流AI生成工具（如Midjourney、Stable Diffusion、Sora/Kling等）的技术边界与应用场景。\n具备优秀的统筹管理、跨团队沟通能力及强烈的抗压能力。", "cat": "内容与创作"}, {"id": "128", "title": "AI 短剧编剧", "salary": "18-20k\n优秀可谈", "location": "远程", "jd": "岗位职责：\n1. 负责竖屏短剧的选题、大纲、分集结构与剧本细写，题材方向以情感向、强冲突题材为主，具体项目内容以沟通为准。\n2. 输出可直接用于 AI 生成的分镜脚本，明确每个镜头的景别、人物动作、表情、环境与情绪，确保制作端能够直接按照脚本进行生成。\n3. 建立并维护人物文字设定，对角色外观进行精确且固定的描述，用于生成角色资产，并保持角色跨镜头的一致性。\n4. 按照竖屏短剧的留人逻辑设计剧情结构，包括每集的钩子、反转及结尾悬念落点。\n任职要求：\n1. 有完整的短剧、网文、漫剧或影视剧本作品，能够提供完整成稿。\n2. 理解竖屏短剧的结构逻辑，包括强钩子、快节奏、高反转密度，理解其与长剧写法的区别。\n3. 熟练使用 LLM 工具进行剧本相关工作，能够判断 AI 产出质量，并对生成内容进行修改完善，而非直接提交 AI 稿。\n4. 能流畅使用 LLM 工具；有本地生成环境、能够自行验证镜头者优先。\n5. 理解 AI 生成端的能力边界，能够针对复杂动作、多人互动、精细道具操作、长镜头连续对话等生成难点，合理设计分镜与表现方式，规避生成过程中的问题，并将剧本转化为可直接生成的分镜脚本。\n6. 对项目题材方向持开放态度，具体以沟通为准。\n加分项：\n1. 有已上线短剧作品，并可提供相应的创作过程文件及交付记录。\n2. 有 ACGN、二次元或漫剧领域相关内容积累或创作经验。\n作品要求：\n需提交以下两项：\n1. 一集完整剧本，包含分镜脚本格式，能够体现镜头描述的可生成性。\n2. 一份剧本所涉及的人物设定，包含用于保持跨镜头一致性的外观描述。\n※投递时需说明：作品中本人的具体分工、使用了哪些 AI 工具，以及对 AI 生成结果进行了哪些修改。仅提交成稿而未说明创作过程，将无法判断实际贡献，并影响评估。", "cat": "内容与创作"}, {"id": "129", "title": "AI 短剧剪辑师", "salary": "18-20k\n优秀可谈", "location": "远程", "jd": "岗位职责：\n1. 从 AI 生成的大量素材中筛选可用镜头，完成竖屏短剧的粗剪与精剪。\n2. 针对 AI 素材碎片化、高废片率，以及跨镜头色调漂移、帧率不统一等问题，通过跳切、变速、局部放大、遮挡等剪辑方式进行补救，将存在缺陷的素材处理为可用成片。\n3. 完成全片调色统一，使不同批次生成的镜头在整体视觉上保持一致。\n4. 处理对白、音效与 BGM，包括 AI 配音的口型与语气对齐、情绪铺垫及节奏卡点。\n5. 向 AI 制作端反馈重跑需求，明确说明问题镜头的具体缺陷及修改方向，而非仅反馈“这条不行”。\n任职要求：\n1. 自备高性能设备，显卡需达到 RTX 4090 级别及以上，显存 24G 起。\n2. 熟练使用 PR 或达芬奇，能够独立完成从素材到成片的全流程。\n3. 有竖屏短剧、AI 短剧或漫剧的实际成片经验，有上线数据更好。\n4. 具备视听叙事能力，理解镜头衔接、节奏控制和情绪铺垫，而非仅按照脚本进行素材拼接。\n5. 熟悉 AI 后期工具，补帧、超分、去闪烁、抠像等能力中至少有几项能够实际应用。\n6. 具备从大量 AI 废片中筛选可用镜头的判断力，以及针对不完美素材进行补救并完成成片的能力，不仅限于软件操作熟练度。\n7. 对项目题材方向持开放态度，具体内容以沟通为准。\n加分项：\n1. 会使用 AI 处理声音，包括配音生成、音色统一、原生音轨精修。\n2. 有完播率、3 秒跳出率等数据意识，能够说明如何通过剪辑影响相关指标。\n3. 有日更或高频交付的产能经验，能够说明实际单日产出量。\n作品要求：\n提交一条不低于 60 秒的成片，并附素材到成片的对照说明：将原始 AI 素材与剪辑后的成片效果进行对照，并说明具体进行了哪些补救处理。\n※仅提交成片而未说明制作过程的，将无法判断实际贡献，并会影响评估。", "cat": "内容与创作"}, {"id": "130", "title": "游戏主美 / 美术负责人", "salary": "25K-35K", "location": "", "jd": "岗位职责\n1、负责游戏项目整体视觉方向，根据产品定位、目标用户及海外市场审美，确定角色、场景、UI、CG、特效等美术风格。\n2、从0到1搭建项目美术规范，包括风格指南、角色与场景设定、色彩规范、UI标准、资源规格、命名规则及验收标准。\n3、负责关键视觉内容的设计与把关，能够亲自完成核心概念稿、关键角色或场景设计，并通过改稿示范指导团队提升品质。\n4、统筹内部美术及外包团队，负责需求拆解、任务排期、成本预估、进度跟踪、质量审核和最终验收，确保资源按时交付。\n5、与策划、导演、Unity程序及制作人紧密协作，推动美术资源在引擎中的实际落地，兼顾视觉效果、包体、性能和开发周期。\n6、参与玩法原型、垂直切片、版本迭代及上线运营，根据产品数据和用户反馈持续优化角色表现、界面体验及整体包装。\n7、建立高效的美术生产管线，合理使用AI及其他工具提升概念探索和资源生产效率，并确保成品质量、原创性及版权合规。\n任职要求\n1、5年以上游戏美术经验，至少2年以上主美、美术组长或美术负责人经验。\n至少完整参与过1–2款正式上线的商业游戏项目，并在其中承担主美、核心美术或美术管理职责。\n2、具备扎实的美术功底和成熟审美，能够准确把控人体结构、造型、构图、色彩、光影和视觉叙事。\n3、擅长至少一种主流游戏美术风格，如欧美写实、二次元、卡通或风格化表现，并能结合成人向产品定位建立统一视觉语言。\n4、熟悉游戏美术完整生产流程，对角色原画、场景、UI、动画、特效、CG及宣传素材有较全面的判断和验收能力。\n5、了解Unity项目资源导入、UI适配、动画、特效、材质及性能限制，能够与程序讨论资源实现和优化方案。\n6、具备内部团队及美术外包管理经验，能够输出清晰的需求文档，并通过具体、可执行的反馈推动修改。\n7、具备较强的项目意识，能够在品质、成本、排期和商业目标之间作出合理取舍。\n8、沟通和推动能力较强，能够适应远程协作、多任务并行及快速迭代的项目节奏。\n9、投递时必须附上完整作品集及上线产品信息。\n加分项\n有互动叙事、视觉小说、海外休闲游戏或短周期小游戏项目经验；\n熟悉AI辅助美术工作流，并有稳定、可控的商业项目落地案例；\n有美宣、商店素材、广告素材及海外用户审美相关经验；\n能够同时覆盖2D视觉设计与基础3D资源审核。", "cat": "内容与创作"}, {"id": "131", "title": "渠道拓展专员（国内流量渠道方向）", "salary": "12-15k＋渠道业绩提成\n（具体金额另行商定）", "location": "远程\n5. 工作方式：适应远程线上协作，熟练使用 Telegram 等即时通讯工具开展工作，响应及时、执行力强、结果导向。", "jd": "岗位职责\n1. 渠道开发与建联：以国内渠道为主、兼顾海外，主动寻找并接洽各类流量渠道，包括但不限于广告联盟／网盟、站长及站群流量主、垂直媒体站点、QQ／微信／Telegram 等社群与频道、KOL 及导流账号等，持续扩充渠道储备池。\n2. 商务谈判与合作落地：与渠道方洽谈合作模式与价格（CPT 包断、CPS、CPM 等），索取并核验对方流量构成与后台数据佐证，推动合作条款确认与广告位上刊测试。\n3. 渠道数据跟进与质量评估：跟进合作渠道的曝光、点击、注册、付费等数据表现，甄别异常流量与假量，参与回本测算，输出渠道留用、优化或下架建议。\n4. 渠道关系与资源台账维护：维护合作渠道的长期关系并定期复盘合作效果；维护渠道资源台账（渠道信息、报价、数据表现、对接记录），保证资源可沉淀、可交接。\n5. 新人带教与方法沉淀：负责新入职拓展人员的培训与带教，输出建联话术、谈判要点、拓量 SOP 等标准化文档，指导新人在规定周期内独立完成渠道开发。\n6. 配合团队整体工作：协助上级完成渠道报价收集与对比、合作方案整理、结算对接及周期性汇报。\n任职要求\n（一）硬性要求\n1. 行业经验：1 年以上国内流量渠道开发、媒介商务或广告渠道 BD 经验，熟悉 CPT、CPS、CPM 等主流合作模式及市场行情。\n2. 自带流量资源：拥有可立即对接启用的渠道资源（站长、联盟、社群、媒体任一类别均可）；投递及面试须提供资源清单、过往合作案例与量级数据。\n3. 带教能力：有带新人或带小组的经验，能够将个人方法整理为话术、SOP 等文档并指导他人执行。\n4. 专业能力：商务谈判与沟通推进能力强，对数据敏感，能独立完成渠道从建联到上刊的全流程。\n5. 工作方式：适应远程线上协作，熟练使用 Telegram 等即时通讯工具开展工作，响应及时、执行力强、结果导向。\n（二）优先条件（加分项）\n1. 有男性向／成人向产品、H5 游戏或泛娱乐类产品的渠道投放经验；\n2. 有站群、广告联盟后台的实际操作经验；\n3. 有渠道团队管理经验；\n4. 有海外流量渠道经验或资源，可兼顾海外渠道对接（具备基础英文读写能力更佳）。", "cat": "运营与市场"}, {"id": "132", "title": "产运负责人", "salary": "3000-7500U", "location": "", "jd": "成人内容平台运营\n负责成人内容平台整体运营工作，对用户增长、活跃、留存及营收结果负责；\n制定并执行内容运营策略，提升平台内容丰富度及用户消费意愿；\n负责用户分层运营，建立会员体系及付费转化机制；\n持续优化用户体验，提升用户留存率和复购率；\n负责平台活动策划，包括会员活动、充值活动、节日活动等；\n跟踪海外成人内容行业动态及竞品数据，制定针对性运营策略；\n与产品、技术、市场团队协同，推动运营需求落地；\n通过数据分析发现问题并制定优化方案，实现平台收入持续增长。\nVPN产品运营\n负责 VPN 产品用户增长及商业化运营；\n建立用户转化漏斗，优化注册、试用、付费及续费流程；\n负责会员体系及订阅业务运营，提高续费率和用户生命周期价值；\n策划用户增长活动，提升自然增长及付费转化效果；\n分析产品数据，持续优化用户体验及核心指标；\n研究海外工具类产品运营模式及行业趋势，制定增长策略；\n与投放团队配合，优化流量获取及转化效率。\n\n任职要求\n3年以上互联网运营经验；\n有内容平台、流量平台、工具类产品或会员订阅产品运营经验；\n具备较强的数据分析能力，能够独立完成运营数据复盘；\n熟悉用户增长、用户留存及商业化运营逻辑；\n具备较强的项目管理和跨部门协作能力；\n对海外互联网产品有较深理解；\n结果导向，对数据和营收目标负责。", "cat": "其他"}, {"id": "133", "title": "运营经理", "salary": "30-50K", "location": "", "jd": "海外垂直内容平台平台运营\n负责海外垂直内容平台平台整体运营工作，对用户增长、活跃、留存及营收结果负责；\n制定并执行内容运营策略，提升平台内容丰富度及用户消费意愿；\n负责用户分层运营，建立会员体系及付费转化机制；\n持续优化用户体验，提升用户留存率和复购率；\n负责平台活动策划，包括会员活动、充值活动、节日活动等；\n跟踪海外垂直内容行业动态及竞品数据，制定针对性运营策略；\n与产品、技术、市场团队协同，推动运营需求落地；\n通过数据分析发现问题并制定优化方案，实现平台收入持续增长。\nVPN产品运营\n负责 VPN 产品用户增长及商业化运营；\n建立用户转化漏斗，优化注册、试用、付费及续费流程；\n负责会员体系及订阅业务运营，提高续费率和用户生命周期价值；\n策划用户增长活动，提升自然增长及付费转化效果；\n分析产品数据，持续优化用户体验及核心指标；\n研究海外工具类产品运营模式及行业趋势，制定增长策略；\n与投放团队配合，优化流量获取及转化效率。\n\n任职要求\n3年以上互联网运营经验；\n有内容平台、流量平台、工具类产品或会员订阅产品运营经验；\n具备较强的数据分析能力，能够独立完成运营数据复盘；\n熟悉用户增长、用户留存及商业化运营逻辑；\n具备较强的项目管理和跨部门协作能力；\n对海外互联网产品有较深理解；\n结果导向，对数据和营收目标负责。", "cat": "运营与市场"}, {"id": "134", "title": "产品经理", "salary": "15-25K，合适可以放宽", "location": "", "jd": "一、岗位职责\n\n1. 负责公司 VPN/海外垂直内容平台 / 泛娱乐内容平台/AI 产品等任意一条业务线的产品规划、需求拆解和版本推进。\n2. 基于业务目标，完成从 0 到 1 的产品方案设计，包括用户路径、核心功能、后台配置、支付/订阅、内容消费、增长转化等模块。\n3. 深入分析目标用户、竞品和业务数据，输出产品原型、需求文档、流程图、交互说明和验收标准。\n4. 协同研发、设计、测试、运营推进项目落地，跟进需求评审、开发排期、提测、验收、上线和版本复盘。\n5. 负责产品上线后的数据跟踪，包括注册转化、付费转化、留存、充值、内容消费、搜索/推荐效果、渠道 ROI 等关键指标。\n6. 能够结合海外市场、灰度业务、订阅产品、内容产品或工具类产品特点，持续优化用户体验和商业化路径。\n7. 对接运营、投放、客服和业务负责人，快速响应用户反馈、线上问题和业务调整需求。\n\n二、任职要求\n\n1. 3 年以上产品经理经验，有完整 0-1 产品经验，能独立负责从需求调研到上线复盘的全流程。\n2. 有以下任一方向经验优先：VPN / 加速器 / 海外垂直内容平台 / 泛娱乐内容平台 / AI 工具。\n3. 熟悉 C 端产品设计，理解用户转化路径、内容消费链路、支付订阅、会员权益、任务激励、邀请裂变等常见产品机制。\n4. 能独立输出高质量 PRD、原型、流程图、后台配置说明和验收标准，逻辑清晰，推进力强。\n5. 对数据敏感，能围绕访问、注册、付费、留存、复购、渠道效果等指标做产品判断。\n6. 能适应创业团队节奏，接受需求变化快、项目多线并行、交付周期短的工作环境。\n7. 沟通协作能力强，能在产品、研发、设计、测试、运营之间推动共识和结果。\n8. 对海外产品、Web3、AI、内容商业化、成人内容生态有理解或兴趣优先。\n\n三、加分项\n\n1. 有 VPN、代理、节点订阅、套餐支付、权益系统相关经验。\n2. 有海外垂直内容平台 / 泛娱乐内容平台、视频站、图片站、搜索站、社区或角色互动产品经验。\n3. 有 AI 生图、AI 视频、AI 聊天、AI 换脸、AI 内容工具产品经验。\n4. 有海外支付、订阅制、Stripe、虚拟币支付、渠道投放转化经验。\n5. 有小团队从 0-1 项目经验，能自己画原型、拆需求、盯研发、做验收。\n6. 英文阅读能力良好，能看海外竞品、产品文档和用户反馈。\n\n四、岗位特质要求\n\n我们希望你是一个能在创业环境里把事情推进落地的人：\n\n• 不只写需求，也能判断优先级；\n• 不只画原型，也能盯上线结果；\n• 不只听业务说什么，也能拆出真正要解决的问题；\n• 能接受业务变化快、信息不完全、节奏紧，但仍然把产品做成。\n\n五、薪资与发展\n\n薪资面议，根据经验、项目匹配度和过往成果综合评估。表现优秀者可负责完整业务线产品规划，并参与核心项目从 0 到 1 搭建", "cat": "产品与管理"}, {"id": "135", "title": "业务经理助理 / 项目经理", "salary": "面议", "location": "", "jd": "岗位介绍\n本岗位承担项目推进（PMO）与执行督导双重职责：将业务经理的想法与指令转化为可落地项目，全程跟进至结果交付，确保事事有回音、件件有着落。\n岗位职责\n1.指令落地：将想法与指令拆解为可执行任务，明确目标、节点与责任人，建立任务台账并持续跟踪。\n2.项目推进：统筹跨团队项目进度，建立汇报与复盘机制，识别风险、协调资源、推动问题闭环。\n3.执行督导：对进度滞后、执行敷衍、质量不达标及时纠偏问责，守住交付标准。\n4.事务协同：管理上级时间与信息流，过滤信息、排列优先级、预判风险，提供决策支持。\n5.AI 提效：熟练运用 AI 工具与工作流（写作、数据分析、自动化、Agent 等），提升团队产出效率。\n6.结果复盘：验收关键事项成果，沉淀方法与机制，持续优化执行效率。\n任职要求\n1.目标感强，有信念，愿意为结果负责到底。执行力强，说到做到，能在复杂环境下推动事情拿到结果，原则性强，敢于对事不对人地推动与问责，抗压，不回避冲突。\n2.有 PMO、项目推进、运营或团队管理经验，熟悉目标拆解、进度管理与风险管控。\n3.AI 工具重度使用者，能搭建提示词、自动化、数据分析等提效流程。\n4.熟悉成熟平台相关行业实际运作规则，善于在复杂局面中破局，具备底线与合规意识。\n5.沟通清晰、逻辑严密，适应高强度快节奏。\n加分项\n1.有高管助理、总裁办或业务线管理支持经验。\n2.有从 0 到 1 或创业项目经验。\n3.有 AI 工作流、Agent、自动化工具落地经验。\n4.数据敏感，习惯用数据驱动决策。", "cat": "产品与管理"}, {"id": "136", "title": "高级 SEO 专家", "salary": "20-40", "location": "", "jd": "岗位职责：\n1、负责成熟平台内容站点在 Google 及 Yandex 搜索引擎的整体 SEO 策略制定与流量突破，监控与分析竞争对手的 SEO 策略及流量结构，持续优化自身的差异化竞争优势\n2、负责 Technical SEO 优化，改进网站架构、页面加载速度、索引收录及移动端体验\n3、制定并执行外链建设策略，拓展和维护高质量的外链资源与渠道\n4、追踪 Search Console、Yandex Webmaster 等平台的关键数据，定期输出数据分析报告与优化方案\n任职要求：\n1、3 年以上 SEO 实战经验，精通 Google 与 Yandex 的排名机制与算法更新\n2、 具备成熟题材行业（Adult）或高风险流量站点的 SEO 实战案例与成功经验\n3、熟练使用主流 SEO 工具，如 Ahrefs、Semrush、Screaming Frog、Yandex.Metrica 等\n4、熟悉 Technical SEO，能够独立排查和解决网站收录异常、惩罚降权等技术问题\n5、具备强烈的数据驱动意识、独立解决复杂问题的能力及较强的抗压能力\n加分项：\n1、具备大型流量站点（日均 IP 10万+）的成功优化案例\n2、熟悉黑帽/灰帽 SEO 常用手法及防封禁、降权恢复策略\n3、具备基础的前端开发能力（HTML/CSS/JavaScript），能独立配合技术团队推进代码级优化\n4、熟悉 PBN（私人博客网络）搭建与运维管理", "cat": "运营与市场"}, {"id": "137", "title": "运营专员", "salary": "Open", "location": "", "jd": "岗位职责：\n1、渠道获客：开拓并维护海外及特定市场获客渠道（广告网络、网盟AFF、TG/DC生态、特种流量等），控制获客成本，提升ROI与LTV。\n2、用户转化： 针对AI短剧与特色娱乐用户，搭建AARRR增长漏斗，优化内容推荐策略与付费阶梯，提升留存率与ARPU值。\n3、数据复盘：监控拉新、活跃、留存及变现全流程数据，基于归因分析快速迭代运营与变现策略。\n任职资格：\n1、具备 2 年以上 Adult 站点 / 特色娱乐平台的实际运营经验（无色站经验者勿投）。\n2、 熟悉 AI 成人短剧赛道，了解其内容形态、受众心理及变现路径（或具备成熟的色站全流程运营与流量资源）。\n3、精通用户增长（Growth Hacking）、网盟推广（AFF）及社群裂变等高转化玩法。\n4、 具备特种流量渠道（广告网络、暗流等）的开拓、谈判与数据监控能力。\n5、熟练运用转化漏斗与生命周期模型，具备强数据敏感度，能精准优化 LTV / CAC。\n6、 深刻洞察目标用户付费心理，抗压与执行力强，适应极速迭代业务。\n加分项：\n1、 具备华语市场的本地化推广、特种流量投放或出海产品运营成功案例者优先。\n2、 熟悉海外黑灰产流量机制、隐蔽渠道买量、防封控手段及规避敏感审查的实操经验者优先。\n3、 能熟练运用 Midjourney、ComfyUI、Sora、Codex 等 AI 工具辅助快速生成宣传素材、短剧剧本或运营文案者优先。\n4、自带 Adult 领域优质网盟（AFF）、站长（Webmaster）、KOL 或特种广告主资源者优先。", "cat": "运营与市场"}, {"id": "138", "title": "AI全栈开发工程师（后端 Go 方向）", "salary": "20-30", "location": "", "jd": "AI全栈开发工程师（后端 Go 方向）\n\n职位概述\n负责视频资料检索平台后端架构与核心业务开发，以 Go 为核心技术栈，覆盖搜索聚合、播放服务、用户行为等业务线，并承担高并发稳定性、数据缓存、CDN 与播放链路等关键能力的建设与治理。本岗位要求具备全栈开发能力、精通 AI 工具并拥有产品思维，能够将业务需求转化为可上线、可观测、可扩容的技术方案。\n岗位画像：Go + 全栈开发能力 + 精通 AI 工具 + X 站经验优先 + 产品思维\n能力优先级：Go → AI 工具 → X 站经验 → 全栈开发能力\n\n一、岗位职责\n1、核心业务开发与架构设计：负责平台后端架构与核心业务开发，覆盖搜索聚合、影片与创作者资料、播放服务、用户行为、收藏历史、排行榜及内容运营等业务线；主导需求评审与技术方案设计，推动业务目标落地\n2、高并发服务与稳定性建设：以 Go 为核心构建高并发 API 服务，落地多级缓存、请求合并、异步队列、限流、熔断、降级与热点数据保护，保障突发流量下的服务可用性\n3、AI 工具应用与全栈交付：精通 AI 编程工具与 AI 工作流，持续提升个人及团队研发效率；具备全栈开发能力，可独立完成前后端端到端交付\n4、数据层与缓存体系：负责 MySQL 数据模型设计、索引优化、慢查询治理与读写链路优化；建设 Redis 缓存体系，系统解决缓存穿透、击穿、雪崩、大 Key、热 Key 与失效风暴等典型问题\n5、CDN 与视频播放链路：负责 Cloudflare / CDN 接入与治理（Cache Rules、缓存键、TTL、回源保护、WAF、Rate Limiting、防盗链、多线路切换）；保障 HLS 播放链路（m3u8、TS 分片、AES-128、鉴权 URL、回源与边缘缓存）稳定运行\n6、可观测性与工程效能：完善日志、指标、链路追踪与告警体系，快速定位线上性能问题，对容量、故障与发布风险负责；推动代码评审、自动化测试、灰度发布与技术文档建设，带领团队建立稳定的工程规范\n\n二、任职资格\n1、精通 Go（第一优先级）：深入理解 goroutine 并发模型、channel 与内存管理，具备 pprof、GC 调优等性能优化实战能力，有常驻进程 / 高并发服务线上经验\n2、精通 AI 工具：熟练运用 Cursor、Copilot 等 AI 编程工具与 AI 工作流，能显著提升个人及团队研发效率\n3、X 站经验优先：具有相关视频平台开发与运维经验者优先\n4、全栈开发能力：具备前端基础，能独立完成从后端服务到前端页面（Web/H5）的端到端交付\n5、产品思维：理解业务核心指标与用户场景，能够用数据驱动技术选型与需求优先级判断，主动推动方案落地，拒绝被动式纯编码\n6、5 年以上后端开发经验，其中至少 2 年承担核心系统或技术负责人角色；具备真实大流量线上项目经验，能够清晰阐述业务规模、峰值 QPS、容量瓶颈、优化过程与最终结果\n7、精通 MySQL 与 Redis：具备数据库性能分析、缓存架构设计与线上数据问题处置能力\n8、具备 Cloudflare 或主流 CDN 生产经验；熟悉 Linux、Nginx / HAProxy、Docker、Git 与 CI/CD，可独立完成服务部署、排障与性能调优；重视接口鉴权、权限控制与数据边界安全\n\n优先条件（加分项）\n1、具有大型视频、直播、内容社区、短视频或大规模媒体资源平台经验\n2、具有 PHP→Go 迁移经验，或熟悉 Hyperf、Swoole、RoadRunner 等常驻内存 / 异步框架\n3、具有 Elasticsearch / OpenSearch、ClickHouse、Kafka、RabbitMQ 等组件的生产实践\n4、具有 AWS、对象存储、CloudFront、Cloudflare Workers / R2 或多 CDN 调度经验\n5、具有反爬、防盗链、风控、攻击流量治理经验", "cat": "技术开发"}, {"id": "139", "title": "中级运营专员", "salary": "10K - 15k", "location": "", "jd": "一，岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\n\n二，任职要求\n1.大专及以上学历，3年以上网站或APP实际运营经验，能独立策划和执行活动，具备较强的数据分析能力，AI应用或自动化系统落地经验，有基于 OpenClaw 构建实际项目经验者优先。\n熟悉 OpenClaw 框架逻辑，能够独立设计 Agent 执行流程与任务拆解结构。\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求\"", "cat": "运营与市场"}, {"id": "140", "title": "初级运营专员", "salary": "8K - 13k", "location": "", "jd": "一，岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\n\n二，任职要求\n1.大专及以上学历，2年以上网站或APP实际运营经验，能独立策划和执行活动，具备较强的数据分析能力，AI应用或自动化系统落地经验，有基于 OpenClaw 构建实际项目经验者优先。\n熟悉 OpenClaw 框架逻辑，能够独立设计 Agent 执行流程与任务拆解结构。\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求", "cat": "运营与市场"}, {"id": "141", "title": "初级编辑", "salary": "8K - 13k", "location": "", "jd": "岗位职责\n1.大专及以上学历，有1年以上内容运营经验，或具备独立运营网站内容或社媒平台账号的能力（社交媒体方向优先）\n2.对成人类行业内容有一定了解和接触；\n3.具备剪辑经验，能够熟练使用 Pr / Ps 等工具；\n4.有良好的写作能力，文案输出，文字功底，思维逻辑良好，能独立完成标题、内容、关键词抓取、文案撰写\n任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解或接触，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者\"", "cat": "内容与创作"}, {"id": "142", "title": "资料员", "salary": "8K - 13k", "location": "", "jd": "1.有舆情监测、数据分析、内容运营素材搜集等相关经验者优先\n2.对成人类内容有一定了解，老司机优先；\n3.熟悉TG频道、推特、成人论坛，有资料资源收集渠道者优先\n4.能熟练编辑制造热点者优先\n5.熟练处理视频水印能力者优先\" \"任职要求：\n1.有舆情监测、数据分析、内容运营、素材搜集等相关经验者优先\n2.对成人类内容有一定了解，老司机优先；\n3.熟悉TG频道、X平台、成人论坛，有资料资源收集渠道者优先\n4.能熟练编辑制造热点者优先\n5.熟练处理视频水印能力者优先\n\n岗位职责：\n1.负责互联网平台信息的舆情监测与资料收集，包括但不限于：突发新闻、娱乐八卦、热点事件、反差泄密、精选成人热门视频等\n2.挖掘各类爆料/流出/未公开信息来源（如TG频道，推特、成人论坛、匿名社区、群聊、贴吧、小红书等）；\n3.快速发现与目标关键词或指定话题相关的负面或敏感信息\n4.寻找资料对内容进行分类、整理、标注，\n5.持续跟踪重点事件发展，必要时补充线索/背景资料", "cat": "职能与行政"}, {"id": "143", "title": "资料员", "salary": "8K - 15K", "location": "", "jd": "大专及以上学历，有1年以上工作经验，平时接触外网频率或各种资源渠道较多者优先\n岗位职责\n资源搜寻： 每日在各大社交平台（X, TG, Reddit, 论坛等）挖掘最新的成人视频、吃瓜爆料及相关资料。\n内容采集： 负责视频/图片的下载、筛选与分类，确保资源高清且无损坏。\n基础整理： 为采集的资源配上简短的标题、标签，确保资料库条理清晰。\n实时跟进： 追踪网络热点，第一时间采集爆火的“吃瓜”资源，保证时效性。\n\n任职要求\n心态开放： 对成人内容不排斥，能高效处理各类影像资料。\n资源丰富： 熟悉国内外主流成人网站、私密频道，有大量隐藏资源渠道者优先。\n工具熟练： 精通各种下载工具、翻墙软件及简单的自动化采集脚本（如Python、八爪鱼等为加分项）。\n执行力强： 能够耐心地进行重复性采集工作，且对时间节点敏感（追求快）。", "cat": "职能与行政"}, {"id": "144", "title": "初级运营专员", "salary": "10K - 15K", "location": "", "jd": "岗位职责：\n1.负责网站内容的收集、撰写、剪辑及日常发布；\n2.具备良好的沟通能力，思维灵活、逻辑清晰；\n3.密切关注社交媒体热榜，快速响应热门内容、话题\n\n1.大专及以上学历，2年以上网站或APP实际运营经验，能独立策划和执行活动，具备较强的数据分析能力\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求\n岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态", "cat": "运营与市场"}, {"id": "145", "title": "中级运营专员", "salary": "15-20K", "location": "", "jd": "一，岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\n\n二，任职要求\n\"1.大专及以上学历，2年以上网站或APP实际运营经验，能独立策划和执行活动，具备较强的数据分析能力，AI应用或自动化系统落地经验，有基于 OpenClaw 构建实际项目经验者优先。\n熟悉 OpenClaw 框架逻辑，能够独立设计 Agent 执行流程与任务拆解结构。\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求", "cat": "运营与市场"}, {"id": "146", "title": "中级运营专员", "salary": "10K - 15k", "location": "", "jd": "大专及以上学历，有3年以上内容运营经验，或具备独立运营网站内容或社媒平台账号的能力（社交媒体方向优先）\n岗位职责\n1. 内容管理与优化：\n内容筛选： 负责视频资源的采集、筛选与审核，确保视频画质高清、分类准确（标签化管理）。\n文案撰写： 为视频撰写吸引人的标题和描述（SEO优化），提升搜索权重和点击率。\n内容排期： 策划每日/每周的推荐内容，优化首页布局，提高用户点击率。\n2. 流量获取与增长：\n渠道推广： 负责在社交媒体（Twitter/X, Telegram, Reddit, Instagram等）进行内容分发，引导流量回流。\nSEO/ASO优化： 研究成人关键词趋势，通过关键词优化提升搜索引擎自然排名。\n活动策划： 策划节日或热点相关的专题活动，提升新用户注册率。\n3. 用户增长与留存：\n社群运营： 管理用户社群/评论区，引导用户互动，收集用户对内容的需求反馈。\n数据分析： 监控日活(DAU)、留存率、跳出率等核心指标，分析用户观看习惯，优化内容推送逻辑。\n4. 竞品分析：持续追踪国内外主流AV站点的功能更新、内容趋势和营销手段，并提出改进建议。\n\n任职要求\n1. 基本素质：\n心态开放： 对成人内容持开放、专业的态度，能够客观地面对并处理各类色情影像资料。\n审美能力： 对“好内容”有敏锐的感知力，知道什么样的封面和标题能吸引用户。\n2. 专业能力：\n运营经验： 3年以上互联网运营经验（有视频平台、社交平台或成人行业经验者优先）。\n工具使用： 熟练使用基础的图像/视频剪辑工具（如CapCut, Premiere, Photoshop），能简单制作吸引人的缩略图。\n语言能力： 具备良好的英文阅读能力（能处理外网资源及分析全球趋势），会日语者优先。\nSEO基础： 了解基础的SEO逻辑，懂得如何利用关键词获取流量。\n3. 加分项：\n是资深的成人内容消费者，对各类片商、演员、流派有深入了解。\n熟悉Telegram Bot或自动化营销工具。\n有过从0到1搭建流量池的成功经验。", "cat": "运营与市场"}, {"id": "147", "title": "初级编辑", "salary": "8K - 13k", "location": "", "jd": "1.大专及以上学历，有1年以上内容运营经验，或具备独立运营网站内容或社媒平台账号的能力（社交媒体方向优先）\n2.对成人类行业内容有一定了解和接触；\n3.具备剪辑经验，能够熟练使用 Pr / Ps 等工具；\n4.有良好的写作能力，文案输出，文字功底，思维逻辑良好，能独立完成标题、内容、关键词抓取、文案撰写\n任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解或接触，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者", "cat": "内容与创作"}, {"id": "148", "title": "高级AI内容工程师", "salary": "15-20K", "location": "", "jd": "岗位名称：AI视频生成师\n岗位别称：AI抽卡师  AIGC视频制作师  AI视觉生成师\n岗位定位：根据剧本和分镜生成、筛选及优化人物、场景、道具和动态镜头素材，重点保障素材可用性、角色一致性和跨镜头连续性。\n岗位职责\n1. 拆解分镜中的人物、场景、动作、表情、构图、光影、景别和运镜要求。\n2. 使用AI生图和生视频工具完成人物设定、场景、道具、首帧和动态视频素材。\n3. 编写并优化提示词，合理使用参考图、种子、模型和控制参数提升稳定性。\n4. 批量生成和筛选素材，剔除五官畸形、肢体错误、动作穿模、画面闪烁及构图失衡的结果。\n5. 保证人物五官、发型、服装、身形、道具及整体画风在不同镜头中的一致性。\n6. 完成图生视频、首尾帧控制、人物动作、表情变化和镜头运动。\n7. 使用修图或AI工具完成局部重绘、扩图、高清修复和基础画面清理。\n8. 按镜头编号整理并归档人物、场景、道具、提示词、参数和成品素材。\n9. 配合导演和后期完成补镜、改动作、换景别及素材重生成。\n10. 持续测试新工具和工作流，提高可用素材率并降低生成成本。\n任职要求\n1. 大专及以上学历，熟悉AI图像或AI视频生成流程，有短剧、漫剧、动画或视觉制作经验。\n2. 至少熟练使用两类主流AI生成工具，如即梦、可灵、Vidu、海螺、Stable Diffusion或ComfyUI。\n3. 能够独立编写和优化文生图、图生图、文生视频及图生视频提示词。\n4. 理解景别、机位、构图、焦点、运镜和镜头连续性。\n5. 具备良好审美，能判断人物形象、表情、动作、色彩和光影是否符合要求。\n6. 能够发现并解决人物变脸、服饰漂移、左右手错误、道具错位和背景不连续等问题。\n7. 能够理解剧本和角色情绪，保证镜头服务剧情。\n8. 工作细致、有耐心，能够适应反复生成、筛选和迭代。\n优先条件\n有完整AI短剧、AI漫剧或AI真人短剧作品。\n熟悉角色LoRA、ControlNet、IP Adapter或节点式工作流。\n具有人物口型、动作驱动、首尾帧或镜头延长经验。\n会使用Photoshop、Premiere、After Effects或剪映。\n有可复用的角色库、场景库和提示词模板建设经验。\n投递材料\nAI视频或AI短剧代表作品。\n同一角色在多个场景和景别中的一致性案例。\n参考图、提示词及最终结果对比。\n本人负责范围、使用工具和主要工作流程说明。\n工作结果关注项\n可用素材通过率\n单个有效镜头平均生成次数\n人物与风格一致性\n镜头返工率\n按时交付率\n素材归档规范率", "cat": "内容与创作"}, {"id": "149", "title": "初级AI内容制作师（成人向内容）", "salary": "10-15K", "location": "", "jd": "岗位名称：短剧编剧\n岗位别称：竖屏短剧编剧  AI短剧编剧  短剧内容编剧\n岗位定位：负责原创短剧或IP改编的全流程剧本创作，保证故事逻辑、人物动机、情绪密度和分集钩子满足短视频观看习惯。\n岗位职责\n1. 负责原创短剧及IP改编项目的选题、人物小传、故事大纲、分集梗概、分场剧本和对白创作。\n2. 根据目标用户和内容方向设计开场钩子、核心冲突、爽点、反转及集尾悬念。\n3. 将小说、故事梗概或已有IP转化为可拍摄、可生成、可剪辑的短剧剧本。\n4. 控制人物数量、场景数量和剧情复杂度，兼顾内容效果与实际制作条件。\n5. 参与选题会、剧本会和围读，根据导演、制片及内容审核意见完成修改。\n6. 跟进制作过程，对台词、场景和剧情执行中的问题提供调整方案。\n7. 根据前5秒留存、平均观看时长、完播率、掉点和互动数据优化开场、节奏与信息释放。\n8. 关注短剧市场题材和受众偏好，持续拆解优秀项目并沉淀创作方法。\n9. 保证剧本人物设定、时间线、伏笔、道具和前后情节连续。\n10. 遵守平台内容规范和版权要求，杜绝抄袭、洗稿及未经授权的改编。\n任职要求\n1. 大专及以上学历，有短剧、网剧、剧情短视频或网络文学创作经验，能够独立完成完整故事。\n2. 熟悉竖屏短剧的叙事特点，理解强钩子、强冲突、高情绪密度和集尾留扣。\n3. 能独立完成人物小传、故事大纲、分集大纲和分场剧本。\n4. 具备清晰的逻辑能力，能处理人物动机、因果关系、伏笔回收和长线连续性。\n5. 对白简洁、自然、有情绪张力，并具备明确的画面感和可表演性。\n6. 熟悉至少一个主流题材方向，如都市情感、甜宠、家庭、逆袭、悬疑或男频成长。\n7. 具备数据意识，能够结合观看留存和掉点分析内容问题。\n8. 能够接受多轮修改并按照项目节点稳定交稿。\n优先条件\n有已经过稿、拍摄或上线的短剧作品。\n独立主笔过至少一部完整短剧。\n有网文、小说、漫画或游戏剧情改编经验。\n熟悉红果、抖音、快手、小程序短剧等内容形态。\n有AI短剧、动态漫或AI辅助创作经验。\n投递材料\n个人代表作品或剧本节选。\n上线作品链接及本人负责范围。\n擅长题材和男频或女频方向说明。\n没有上线作品者可提供原创大纲和连续分集样稿。\n工作结果关注项\n按时交稿率\n剧本一审通过率\n修改轮次与问题闭环\n开场及分集钩子质量\n上线后的留存和完播表现", "cat": "内容与创作"}, {"id": "150", "title": "AI短剧中级剪辑师（成人向内容）", "salary": "13-18K", "location": "", "jd": "AI短剧剪辑师（成人向内容）\n岗位职责\n1. 根据剧本、分镜及AI生成素材，独立完成短剧粗剪、精剪、字幕、配音、配乐、音效及成片输出。\n2. 理解成年受众的观剧偏好，抓住人物关系、情绪张力与剧情冲突，做好开场钩子、情节推进和结尾悬念。\n3. 对AI素材进行筛选与重组，处理人物动作不连贯、口型不同步、镜头衔接生硬等问题，并提出补镜需求。\n4. 配合编剧、分镜及AI视频制作人员，优化镜头安排与素材质量，提升成片连贯性和观感。\n5. 根据发布平台要求，完成不同比例、时长及版本的剪辑交付，整理工程文件和素材。\n6. 结合完播率、留存率等反馈调整剪辑节奏，持续优化内容表现。\n任职要求\n1. 大专及以上学历，熟练使用剪映专业版、Premiere或DaVinci Resolve，能够独立完成短剧后期制作；掌握AE者优先。\n2. 有短剧、剧情短视频、动态漫或AI视频剪辑经验，具备完整作品或可展示片段。\n3. 具备叙事意识和审美判断，能通过镜头、声音与节奏表现人物情绪，避免单纯堆砌转场和特效。\n4. 了解AI视频素材特点，能判断素材可用性，并通过剪辑、声音设计或补镜方案解决问题。\n5. 能理解成人向题材的表达侧重尺度和内容\n6. 沟通清晰、交付稳定，能够根据反馈完成修改并做好版本管理。\n加分项\n- 有情感、都市、悬疑等成人受众题材的成熟作品。\n- 熟悉可灵、即梦、Runway等AI视频工具及AI配音流程。\n- 有基础调色、声音处理、或画面修复经验。\n- 参与过短剧账号运营，能结合数据说明剪辑优化思路。\n2—3部代表作品（短剧方向", "cat": "内容与创作"}, {"id": "151", "title": "AI 短剧中级编剧", "salary": "15-20K", "location": "", "jd": "岗位名称：AI短剧导演制片\n岗位别称：AI漫剧导演制片  AIGC内容导演  AI项目导演\n岗位定位：同时承担AI短剧的创作导演与制片管理责任，统筹剧本视听化、视觉定调、分镜执行、成片质量、预算排期、团队协作和最终交付。\n岗位职责\n1. 负责AI短剧从立项、剧本确认、视觉开发、分镜制作、AI素材生成到后期成片交付的全流程统筹。\n2. 解读和评估剧本，明确每集核心冲突、人物情绪、爽点、反转及集尾悬念。\n3. 将剧本转化为可执行分镜，明确景别、机位、构图、人物调度、动作、表情、运镜和镜头衔接。\n4. 制定人物、场景、服装、道具、色彩、光影和整体画风方案，并审核核心视觉资产。\n5. 指导AI视频生成师完成提示词、参考图和动态镜头，解决人物变脸、动作错误、空间混乱和风格漂移。\n6. 指导配音、音乐、音效和后期剪辑，统一声音、节奏、情绪和成片风格。\n7. 负责样片、单集及整剧审核，明确补镜、重生成、重剪和声音修改意见。\n8. 根据集数、镜头量和制作难度制定制作周期、人员配置、成本预算及交付计划。\n9. 统筹编剧、分镜、AI生成、配音和后期岗位，明确各环节负责人、质量标准和交付节点。\n10. 建立并维护项目排期、镜头任务、素材状态、修改记录和版本管理机制。\n11. 跟进制作进度和团队产能，及时处理剧本延误、资产缺失、生成失败和后期积压等风险。\n12. 管理AI工具点数、API、算力、存储、外包及其他项目成本，控制无目标重做和重复生成。\n13. 跟进平台规范和版权要求，排查素材、字体、音乐、声音和形象授权风险。\n14. 根据前5秒留存、平均观看时长、完播率和掉点数据组织复盘，优化后续内容与制作流程。\n15. 沉淀分镜、视觉、生成、审核、成本和交付标准，推动团队稳定量产。\n任职要求\n1. 大专及以上学历，有短剧、动画、动态漫、影视、广告、游戏CG或剧情短视频导演及项目统筹经验。\n2. 具备完整的视听叙事能力，熟悉构图、机位、运镜、剪辑、声音和表演调度。\n3. 能够独立完成剧本拆解、分镜设计、视觉定调、成片审核和项目排期。\n4. 熟悉AI生图、生视频的生产逻辑和限制，能够判断问题并组织解决。\n5. 熟悉两类以上AI图像或视频生成工具，了解相关点数、算力和成本结构。\n6. 能够控制角色、场景、动作和视觉风格的跨镜头一致性。\n7. 熟悉竖屏短剧叙事，理解前5秒留人、高情绪密度和集尾钩子。\n8. 能够估算镜头量、素材量、生成次数、后期工作量和制作周期。\n9. 具备预算、人员、外包、版本和交付管理能力。\n10. 具备较强的团队管理和跨岗位沟通能力，能给出明确、可执行的修改意见。\n11. 能够结合观看数据复盘内容和制作问题，不只依赖个人审美判断。\n12. 具备版权、内容合规和资料保密意识。\n优先条件\n独立导演并完整负责过上线的AI短剧或AI漫剧项目。\n有批量内容生产或连续剧集管理经验。\n具备成熟的分镜设计、后期审片和项目管理能力。\n熟悉角色模型、首尾帧、动作控制和镜头延长流程。\n有外包、供应商或远程团队管理经验。\n能搭建镜头级生产管理表及标准化工作流程。\n有短剧观看数据复盘和内容迭代经验。\n投递材料\n一至三部导演或统筹制作的代表作品。\n分镜稿、视觉设定和最终成片对比。\n本人职责、团队规模、制作周期和交付结果说明。\n项目排期、流程管理或AI生成问题解决案例，可隐去敏感信息。\n工作结果关注项\n成片叙事与视听质量\n分镜和视觉执行质量\n准时交付率\n预算与生成成本控制\n一审通过率\n返工率\n人物和视觉一致性\n留存与完播表现\n团队产能与流程建设\n", "cat": "内容与创作"}, {"id": "152", "title": "高级产品经理", "salary": "20K - 30k", "location": "", "jd": "一、岗位职责\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等工具，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4. 具备一定的团队管理经验，能够指导中初级产品成员开展工作，提升团队整体专业能力。\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n\n二、任职要求\n1. 本科及以上学历，产品、计算机、设计等相关专业优先。\n2. 5 年以上互联网/软件产品经理经验，至少具备 1 个从 0-1 独立负责并成功落地的项目经验。\n3. 熟练使用 Axure、墨刀、Figma 等原型工具，能独立完成 高保真交互原型设计，理解 UI/视觉基本规范及呈现逻辑。\n4. 具备 业务理解能力与数据分析能力，能够将业务需求转化为可实现的产品方案。\n5. 具备一定的 团队管理能力或带队经验，可以指导新人并进行工作拆解与质量把控。\n6. 具备良好的沟通能力、推动能力和跨部门协作能力，能够在多方需求中进行合理取舍与决策。\n7. 具备较强的文档能力，能够输出高质量的 PRD、交互文档、需求分析等。\n8. 抗压能力强，责任心强，具备较强的自驱力与主人翁意识。\n三、加分项\n1. 有大型互联网公司产品经验者优先。\n2. 有消费品、电商、社交、内容平台等行业经验者优先。\n3. 具备用户增长、商业化等方向项目经验更佳。\n4. 具备 UED/交互设计背景或视觉审美能力突出者优先", "cat": "产品与管理"}, {"id": "153", "title": "产品质检员", "salary": "15K - 20k", "location": "", "jd": "产品质量督导\n【岗位职责】\n1. 负责网站、H5、APP等产品版本上线前验收，根据需求文档、原型及业务规则开展功能验证，保障版本上线质量。\n2. 负责产品日常质量巡检，覆盖核心功能、页面展示、业务流程、运营配置、内容质量、用户体验及SEO基础配置等场景，及时发现问题并推动解决。\n3. 跟进产品项目及需求进度，关注任务目标、优先级、排期及上线节点，对延期、执行偏差及风险及时反馈并推动处理。\n4. 跟踪线上问题及用户反馈，完成问题复现、影响评估、问题分级、整改跟进及复验闭环。\n5. 负责运营内容质量检查，包括标题、标签、正文、图片、视频、内容关联、重复内容、失效资源及发布规范等问题。\n6. 负责业务SOP、上线标准及日常维护规范的执行检查，发现流程偏差并推动整改。\n7. 负责质量数据统计与分析，输出巡检报告、验收报告及质量分析报告，跟踪缺陷趋势、整改效率及重点风险。\n8. 参与验收标准、巡检规则、问题分级标准及质量管理机制建设，持续优化质量管理流程。\n9. 协同产品、研发、测试、运营等团队推动问题解决，对重大风险、任务延期及跨团队协作问题进行跟踪反馈。\n10. 参与AI及自动化巡检能力建设，提升巡检效率、覆盖率及问题发现准确率。\n\n【任职要求】\n1. 本科及以上学历，专业不限，1年以上互联网产品质量、测试、运营质检或相关工作经验。\n2. 熟悉互联网产品生命周期及需求、开发、测试、验收、上线、运营维护等基本流程。\n3. 熟悉功能测试、产品验收、缺陷管理、线上巡检及问题闭环流程，具备较强的问题发现和风险判断能力。\n4. 具备一定的产品思维和用户体验意识，能够发现功能、页面、交互、内容及业务流程中的问题。\n5. 具备线上问题分析、复现、定位及跟踪能力，能够独立推动问题闭环。\n6. 具备一定的数据分析能力，能够独立输出验收报告、巡检报告及质量分析报告。\n7. 具备较强的责任心、执行力、风险意识及跨团队沟通推动能力。\n8. 熟悉 Jira、TAPD、禅道、飞书、多维表格、Google Sheet 等工具者优先。\n9. 有AI工具、自动化测试、Playwright、Python或自动化巡检相关经验者优先。", "cat": "职能与行政"}, {"id": "154", "title": "产品经理 (AI 赋能/高能效方向)", "salary": "20K - 30k", "location": "", "jd": "职责描述 \n需求定义与方案设计： 负责产品的需求分析、功能定义及原型设计，确保产品方案能真正解决用户痛点，并具备极强的竞争力。\nAI 驱动的工作流革新： 深度实践“AI 赋能产品研发”，利用 LLMs (大语言模型) 进行竞品快速分析、用户反馈聚类、PRD 自动化生成及流程图优化，将工作能效提升至极致。\n方案合理性判断： 在方案设计阶段，能够客观评估“AI 解决”与“传统逻辑解决”的成本、效率及用户体验，避免盲目堆砌 AI 功能，确保方案的最优解。\n跨职能高效协作： 利用 AI 工具将需求转化为更精准的技术语言，降低与研发（尤其是 AI 赋能的研发）之间的沟通成本，加速交付闭环。\n数据洞察与迭代： 利用 AI 数据分析工具快速处理用户行为数据，从中提取关键洞察，驱动产品的快速迭代。\n\n【核心 PM 能力】\n\n专业功底：大专及以上学历， 3 年以上产品设计经验，精通原型设计（Axure/Figma 等）、PRD 编写，具备强大的逻辑分析能力和闭环思考能力。\n业务洞察： 能快速进入新业务领域，通过底层逻辑推演精准定义产品路径。\n用户共情： 能够深刻洞察用户潜在需求，将其转化为可落地的功能定义。\n【AI 赋能能力】（核心区分点）\n\nAI 工具链熟练度： 深度使用 ChatGPT, Claude, Perplexity, Notion AI 等工具进行信息搜集、文档撰写和逻辑梳理，已形成一套成熟的“AI 辅助工作流”。\nPrompt 操盘能力： 能够编写复杂的 Prompt 来模拟用户画像、进行压力测试或优化 PRD 的结构，使输出结果达到生产级标准。\nAI 认知力： 了解当前大模型的能力边界（如幻觉问题、Token 成本、响应延迟），能够基于此设计出鲁棒性强的产品方案。\n【综合素质】\n\n极强的学习进化力： 对 AI 领域的新工具、新模式有强烈的好奇心，并能迅速将新工具转化为生产力。\n结果导向： 不追求工具的华丽，而追求交付结果的精准度和速度。", "cat": "产品与管理"}, {"id": "155", "title": "中高级运营专员", "salary": "10k-30k", "location": "", "jd": "岗位职责：\n1. 负责公司核心业务的整体运营工作，根据业务目标制定阶段性运营策略，并推动落地执行。\n2. 围绕业务增长、用户活跃、转化提升、留存复购等核心指标，制定运营方案并持续优化。\n3. 负责运营体系建设，包括但不限于活动运营、用户运营、内容运营、数据复盘、流程机制和 SOP 搭建。\n4. 带领运营团队完成日常管理工作，包括目标拆解、任务分配、过程跟进、绩效辅导、能力培养与团队氛围建设。\n5. 基于业务数据分析，识别问题与增长机会，独立输出优化建议，并推动跨部门协同落地。\n6. 与产品、技术、渠道、商务、客服等相关部门紧密配合，推进重点项目执行，确保结果交付。\n7. 负责重点项目从策划、执行到复盘的全流程管理，提升团队整体效率与运营质量。\n8. 持续关注行业动态、竞品策略及用户需求变化，结合业务现状提出可落地的优化方向。\n\n任职要求：\n1. 本科及以上学历\n2. 5年以上运营工作经验，2年以上团队管理经验\n3. 有团队管理、目标分解、过程跟进和结果复盘经验\n4. 有从0-1搭建或1-10放大的实际案例\n5. 有明确业务结果产出，能用数据体现成绩\n6. 熟悉活动运营、用户运营、内容运营或业务运营其中一个或多个模块\n7. 具备较强的数据分析能力，能通过数据发现问题并推动优化\n8. 有跨部门沟通协作经验，能协调产品、技术、渠道、商务等团队推进项目\n9. 有运营体系、流程机制或SOP搭建经验优先\n10. 具备较强执行力、责任心和团队管理能力\n11. 职业经历相对稳定，有持续成长路径优先\n12. 有同行业或相关业务经验者优先", "cat": "运营与市场"}, {"id": "156", "title": "中级运营专员（短剧内容运营方向）", "salary": "10k-25k", "location": "", "jd": "1.负责短剧内容矩阵的整体运营策略制定，包括选题方向、内容排期、发布节奏的统筹规划；\n2.跟踪短剧内容数据表现（播放、完播、转化等），持续分析优化内容策略及运营打法，定期输出数据分析报告支撑业务决策；\n3.统筹站外推广工作，包括自媒体矩阵、TG频道、外链渠道等内容分发及曝光提升策略；\n4.带领并考核初级运营团队，把控内容更新、文案优化、专题活动等产出质量，对接网站/平台端内容规范落地；\n5.对齐业务目标，推动跨团队协作，完成短剧内容相关的临时性/专项工作。\n任职要求\n1.本科及以上学历，3年以上内容运营/短视频运营相关经验，有短剧行业经验者优先；\n2.具备较强的数据分析能力，能通过数据驱动内容策略迭代；\n3.有站外推广、自媒体矩阵运营或社群运营经验，熟悉TG频道运营者优先；\n4.具备一定的团队协作或带教经验，能统筹多任务并推进落地；\n5.责任心强，抗压能力好，能适应快节奏的业务需求。", "cat": "内容与创作"}, {"id": "157", "title": "中高级运营专员", "salary": "10k-20k", "location": "", "jd": "岗位职责：\n1.转化链路优化：负责全渠道流量监控，通过优化官网点击率、各端安装率（iOS/安卓）及渠道转化逻辑，提升整体获客效率。\n2.用户活跃与拉单：通过前端逻辑调整与策略干预，提升用户拉单触发频率，通过高频行为带动商业化转化。\n3.商业化策略设计：\n首充转化：设计低门槛首充产品（如周会员），降低付费门槛，提升新增付费率。\n客单价提升：规划高价值套餐（月/季包）及代金币体系，优化定价策略，提升 ARPPU 表现。\n续费召回：通过 Push、站内信等手段建立老用户触达机制，扭转续费下滑趋势，提高老用户充值占比。\n数据建模与实验：基于“拉单-付费率-ARPU”的影响机制进行实验验证，通过数据反馈不断迭代增长路径。\n4.核心考核指标 (KPI)\n获客质量：官网点击转化率、点击安装率、渠道转化率。\n增长规模：拉单触发频次、拉单率。\n变现效率：新增付费率、ARPPU、综合 ARPU。\n存量经营：老用户续费召回率、老用户充值占比。\n\n任职要求：\n1.获客与转化优化（前端漏斗）\n2.行为策略与增长实验（活跃增长）\n3.商业化与定价策略（收益提升）\n4.存量用户精细化运营（留存召回）\n\n专业技能词库（简历高频词）：\n模型思维：能够理清各数据指标间的联动关系，擅长通过拆解“提升路径”寻找业务增长点。\n实操经验：有视频、工具或订阅类产品运营背景，熟悉付费门槛设置、套餐定价及代金币体系设计。\n执行能力：具备优秀的产品逻辑梳理能力，能推动前端逻辑调整、支付开发及运营配置高效落地。\n数据驱动：具备严谨的数据分析能力，能从复杂的指标波动中定位核心问题并产出解决方案。\n核心指标： ARPU、ARPPU、付费渗透率、拉单率、安装转化率。\n业务逻辑： 商业化建模、定价策略、代金币体系、分层运营、用户召回、A/B Testing。\n加分项：\n具备自动化任务跟进或多 Agent 协同工作意识。\n有视频播放器、动漫或垂直内容领域成功增长案例者优先。", "cat": "运营与市场"}, {"id": "158", "title": "中高级运营", "salary": "10-30k", "location": "", "jd": "1. 2 年以上网站运营、内容运营、平台运营或增长运营经验。\n2. 熟悉网站运营流程，能独立完成内容规划、页面配置、数据分析和运营复盘。\n3. 熟悉网站后台 / CMS 操作，能完成内容发布、栏目维护、标签管理、专题配置等工作。\n4. 具备数据分析能力，能通过流量、点击、转化、留存、跳出率等数据发现问题。\n5. 理解基础 SEO，了解关键词、标题、描述、内链、收录、页面结构对网站流量的影响。\n6. 具备内容判断能力，能判断内容是否符合用户需求、网站定位和转化目标。\n7. 具备较强执行力，能把运营计划拆解成具体动作，并持续推进。\n8. 能与产品、技术、SEO、设计、数据等团队协作，清楚表达运营需求并推动落地。\n9. 熟练使用 Excel / Google Sheets / 飞书表格等办公工具，能整理数据和制作报表。\n\n---\n加分项\n1. 有内容聚合类、资讯类、社区类、垂直行业网站运营经验。\n2. 有海外中文站点、Google 流量站、SEO 流量站运营经验。\n3. 有多站点 / 矩阵站点运营经验。\n4. 熟悉 Google Analytics、Google Search Console、Ahrefs、SEMrush、Screaming Frog 等工具。\n5. 有 SEO 内容运营经验，能配合完成关键词布局、专题页规划、内链优化和内容优化。\n6. 有 Telegram、Twitter、Facebook、Reddit 等海外渠道运营经验。\n7. 有基础 Python / Shell / SQL 能力，可辅助数据整理、内容批量处理或运营自动化。\n8. 自己运营过个人网站、博客、频道、社群或副业项目。\n9. 有成功的网站增长案例，能说明自己负责的动作、数据变化和结果。\n我们希望你具备\n- 执行力强，能持续推进运营计划\n- 结果导向，关注流量、转化和用户行为变化\n- 细节意识强，能发现页面、内容、入口和数据异常\n- 主动性强，能主动发现问题并提出解决方案\n- 学习能力强，能关注行业变化、竞品动态和用户需求\n- 沟通能力好，能和技术、SEO、设计、数据团队高效协作\n- 有复盘意识，能从数据结果中总结经验并持续优化\n\"岗位职责\n\n1. 负责网站日常运营，包括内容更新、栏目维护、页面配置、专题策划等工作。\n2. 负责网站核心页面运营，包括首页、频道页、详情页、专题页、活动页等页面的内容管理和入口优化。\n3. 根据网站目标，制定内容运营、流量增长、用户转化和留存提升方案。\n4. 负责网站数据跟踪与分析，包括访问量、来源渠道、点击率、跳出率、转化率、留存率等数据。\n5. 根据数据表现发现问题，提出优化方案，并推动落地执行。\n6. 配合 SEO 团队，完成关键词布局、内容优化、内链建设、专题页规划和页面结构调整。\n7. 配合技术团队，推动网站功能优化、后台工具改进、数据看板建设和用户体验提升。\n8. 负责竞品调研，分析同类网站的内容结构、流量来源、页面布局和运营策略。\n9. 策划并执行网站运营活动，如专题活动、内容合集、榜单推荐、频道运营等。\n10. 建立并优化网站运营 SOP，包括内容发布规范、页面检查规范、数据复盘机制和问题反馈流程。\n11. 定期输出运营日报、周报、月报，汇报网站数据、运营问题、优化进展和后续计划。\n试用期内需完成：\n\n1. 网站运营现状诊断报告  \n2. 3 个月网站运营优化计划  \n3. 核心页面内容与入口优化方案  \n4. 至少 3 个运营问题或用户路径问题的优化落地  \n5. 每周网站数据复盘报告\"", "cat": "运营与市场"}, {"id": "159", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "\"\n2年以上运营经验，专科及专科以上学历\n熟练掌握办公自动化软件。\n熟练掌握数据分析和处理能力，能够对项目数据进行跟踪和分析。\n优秀的文笔写作能力，文案策划能力。\n良好的服务意识，优秀的分析、沟通、协调、谈判能力，团队合作精神佳。\n具备强烈的责任心及较好的职业素养，工作踏实、耐心细致。\n会图片处理、编辑能力（如：PR、PS、Canva、剪映）。\"\"负责公司新媒体平台（包括但不限于抖音、小红书、快手、youtube、tiktok、facebook等）的运营和推广，提升公司产品曝光和知名度，增强公司在新媒体领域的影响力。\n负责新媒体平台的内容策划、撰写、编辑和发布，确保内容质量和风格符合公司品牌形象和市场需求。\n根据公司业务和产品特点，制定并实施新媒体平台的数据分析、运营策略和内容计划，包括但不限于粉丝增长、阅读量提升等。\n与公司内部团队保持紧密沟通，跟踪、分析平台运营数据，提出优化建议，并提高新媒体、流量运营能力。\"", "cat": "运营与市场"}, {"id": "160", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "1.会制作AI视频、懂AI短剧内容形式者优先。\n2.负责网站日常运营管理，包括内容更新、资源发布、分类维护、页面巡检，保障网站稳定运营。\n3.根据运营规划完成视频、图文等内容的编辑、发布及优化，持续提升内容质量和用户体验。\n4.负责站外推广工作，包括网站运营、TG频道发布、外链建设、自媒体内容发布等，提升网站曝光及用户增长。\n5.根据运营数据分析用户行为及内容表现，持续优化标题、关键词、推荐位及运营策略，提高用户活跃度和转化效果。\n6.负责网站日常巡检，检查页面展示、视频播放、广告位、链接跳转等功能，发现异常及时反馈并跟进处理。\n7.配合团队完成运营活动策划、项目推进及其他临时性工作，确保各项运营目标顺利达成。", "cat": "运营与市场"}, {"id": "161", "title": "中级运营专员", "salary": "10K-30K", "location": "", "jd": "1、负责网站整体运营工作，包括内容运营、用户增长、SEO优化、频道规划及数据增长目标；\n 2、制定网站分类、标签、专题、搜索页等内容策略，提升网站流量、用户留存与转化效率；\n 3、负责热点内容方向制定与运营节奏把控，结合行业趋势快速推动内容上线与传播；\n 4、定期对网站数据进行复盘，包括流量来源、搜索关键词、用户行为、转化路径等，并输出优化方案；\n 5、负责网站内容生态优化，提升内容质量、用户互动、社区活跃度与用户粘性；\n 6、协助产品与技术团队推动功能迭代，包括推荐机制、搜索优化、内容分发、用户体验等方向；\n 7、跟踪行业及竞品动态，持续优化网站运营策略与增长模型；\n 8、参与重点项目推进，包括专题活动、频道改版、内容增长、流量承接及商业化优化等。", "cat": "运营与市场"}, {"id": "162", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "重点筛选有 App、盒子、视频、动漫、小说、社区、内容平台等基础运营经验的候选人；关注是否具备内容发布、素材整理、链接维护、后台配置、数据填报、用户反馈处理、活动配置等实际执行经验；优先考虑熟悉 Excel、飞书表格、运营后台、数据整理工具的候选人；关注候选人是否具备基础数据意识，能看懂点击、安装、活跃、充值、内容更新量等基础指标；重点评估执行力、细心程度、任务稳定交付能力、沟通反馈意识和多任务处理能力；有 AI 工具或自动化工具使用经验，能够提升基础工作效率者优先。\"岗位职责：负责 App、盒子等项目的日常基础运营工作，包括内容发布、素材整理、群组维护、页面检查、后台配置更新等，确保产品内容正常上线和展示；负责每日运营数据整理与填报，包括流量、点击、安装、活跃、充值、内容更新等基础数据，及时发现异常并反馈；负责官网、落地页、外部链接、推广链接等基础检查与维护，定期测试链接连通性，发现失效、跳转异常、无法访问等问题及时登记并跟进处理；协助收集用户反馈、群组问题、产品异常、播放异常、支付异常等信息，按照流程整理并同步相关负责人，推动问题闭环；根据运营需求，协助完成会员活动、充值活动、弹窗、Push、站内信、广告位等基础配置和上线检查；根据项目需求完成视频、漫画、小说、图片、专题等内容更新工作，并配合执行拉新、活跃、召回等基础运营动作；按要求完成日报、周报及任务进度汇报，对完成事项、异常问题、处理进度和次日计划进行清晰记录。\n\n核心考核指标：每日内容发布数量、链接检查数量、配置执行完成率、任务准时完成率；日报数据、内容数据、链接数据、异常记录的准确率和完整度；异常发现及时性、问题记录规范度、问题跟进闭环率；日常运营任务处理速度、重复性任务完成效率、跨项目协作配合度；内容更新稳定性、产品基础活跃数据、用户反馈处理质量、运营动作执行效果。\n\n任职要求：执行力强，能按照要求完成日常运营任务，具备责任心和时间意识，能够保证任务稳定交付；细心认真，对数据、链接、内容、配置等基础工作有耐心，能够及时发现问题并准确记录；学习能力强，愿意学习产品后台、数据表格、AI 工具、自动化工具等基础运营工具，能快速适应新的工作流程；沟通反馈及时，遇到问题能够主动反馈，能配合组长及相关部门推进问题处理；具备基础数据意识，能看懂点击、安装、活跃、充值、内容更新量等基础运营数据，并能根据数据变化发现简单问题；能适应多项目、多任务并行的工作节奏，具备较好的稳定性和团队配合意识。\"", "cat": "运营与市场"}, {"id": "163", "title": "初级运营专员", "salary": "8K-10K", "location": "", "jd": "\"\n1.大专及以上学历，3年以上实际运营经验，能独立策划和执行活动，具备较强的数据分析能力\n2.具备扎实的文案写作功底，能够快速整理信息并提炼观点，擅长多种内容形式的表达（图文、短视频、话题等）\n3.具备基本的视觉审美能力，能够在内容呈现、品牌调性与设计上做出优化，提升内容的可读性和传播力\n4.能够熟练使用 PR、PS 等工具进行基础的图片处理与编辑，满足内容制作需求\n\"\"岗位职责\n1.负责APP日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态\"", "cat": "运营与市场"}, {"id": "164", "title": "渠道专员", "salary": "15K-25K", "location": "要求人在海外", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "运营与市场"}, {"id": "165", "title": "远程中高级运营专员", "salary": "10-15k", "location": "远程中高级运营专员", "jd": "远程中级运营专员\n\n人数：1名\n\n\n【岗位职责】\n\n- 视频资源统筹与处理： 负责视频站每日内容的生命周期管理，包括视频上架、标签分类、标题与描述优化、封面质检等；熟练使用剪映等工具，对原始视频资源进行剪辑、去重或二次包装处理。\n    \n- 帖子板块运营： 负责网站资讯板块的日常高频更新。密切追踪全网热点与“吃瓜”情报，快速产出自带流量与讨论度的图文帖子；同时针对站内核心视频，撰写逻辑清晰、引人入胜的图文剧情解说帖。\n    \n- SEO优化与AI工具应用： 熟练运用AI文本大模型辅助撰写高点击率文案，利用AI生图工具制作精美吸睛的封面。负责站内SEO的深度优化，包括但不限于关键词矩阵布局、H2/H3标签规范、图片ALT属性完善及内链网络搭建；定期拓展高质量外部链接与友情链接，提升网站整体搜索引擎权重与自然搜索流量。\n    \n- 网站健康监测与数据复盘： 每日进行网站常规巡检（如404死链排查、页面加载状态、视频播放连通性等）；熟练使用各类站长统计工具，追踪UV/PV、跳出率及用户停留时长，输出数据报告并指导内容策略调整。\n    \n- 全域内容分发： 将站内优质图文与视频内容矩阵化分发至外部平台，构建外部流量池，实现多渠道引流。\n    \n- 工作流自动化： 具备强烈的效率意识，能够梳理日常的巡检、发帖、分发等重复性工作，借助AI工具、自动化脚本或现有系统能力，将其转化为自动化操作，持续提升人效。\n\n\n【任职要求】\n\n- 学历与经验： 大专及以上学历，1-2年以上内容运营、网站运营或新媒体相关经验。有视频网站或泛娱乐资讯平台运营经验者优先。\n    \n- 深入了解SEO机制： 熟悉主流搜索引擎的收录与排名规则，有实际的白帽SEO实操经验（不仅限于内容排版，需懂内链逻辑、外链建设及基础的代码级SEO优化）。\n    \n- 网感与内容把控： 冲浪在一线的“吃瓜”达人和重度社交媒体用户，对全网热梗、八卦资讯极度敏感，能第一时间响应并产出内容；具备优秀的视觉审美，对帖子排版、封面配色有较强的判断力。\n    \n- 加分项： 熟悉或能快速上手各类自动化工具（如批量分发、监控告警），懂得如何通过非人工模拟的方式（如API接口思维）解决机械性任务者优先。", "cat": "运营与市场"}, {"id": "166", "title": "远程初级运营专员", "salary": "8-12k", "location": "远程初级运营专员", "jd": "远程初级运营8-12k\n\n人数：3\n\n岗位职责\n\n1. 内容管理与优化：\n\n内容筛选： 负责视频资源的采集、筛选与审核，确保视频画质高清、分类准确（标签化管理）。\n\n文案撰写： 为视频撰写吸引人的标题和描述（SEO优化），提升搜索权重和点击率。\n\n内容排期： 策划每日/每周的推荐内容，优化首页布局，提高用户点击率。\n\n2. 流量获取与增长：\n\n渠道推广： 负责在社交媒体（Twitter/X, Telegram, Reddit, Instagram等）进行内容分发，引导流量回流。\n\nSEO/ASO优化： 研究成人关键词趋势，通过关键词优化提升搜索引擎自然排名。\n\n活动策划： 策划节日或热点相关的专题活动，提升新用户注册率。\n\n3. 用户增长与留存：\n\n社群运营： 管理用户社群/评论区，引导用户互动，收集用户对内容的需求反馈。\n\n数据分析： 监控日活(DAU)、留存率、跳出率等核心指标，分析用户观看习惯，优化内容推送逻辑。\n\n4. 竞品分析：持续追踪国内外主流AV站点的功能更新、内容趋势和营销手段，并提出改进建议。\n\n  \n\n任职要求\n\n\n1. 基本素质：\n\n心态开放： 对成人内容持开放、专业的态度，能够客观地面对并处理各类色情影像资料。\n\n审美能力： 对“好内容”有敏锐的感知力，知道什么样的封面和标题能吸引用户。\n\n2. 专业能力：\n\n运营经验： 1-3年互联网运营经验（有视频平台、社交平台或成人行业经验者优先）。\n\n工具使用： 熟练使用基础的图像/视频剪辑工具（如剪映、PR），熟练使用AI生图制作精美的封面。\n\n\nSEO基础： 了解基础的SEO逻辑，懂得如何利用关键词获取流量。\n\n3. 加分项：\n\n是资深的成人内容消费者，对各类片商、演员、流派有深入了解。\n\n熟悉Telegram Bot或自动化营销工具。\n\n有过从0到1搭建流量池的成功经验。", "cat": "运营与市场"}, {"id": "167", "title": "商务专员", "salary": "10k-30k", "location": "", "jd": "岗位职责\n1.  负责公司广告资源位（含APP、网站、盒子等各类流量渠道）的商务拓展与客户开发，通过多渠道（老客户转介绍、渠道资源、自主开发等）挖掘潜在广告主。\n2.  独立完成客户从初步接触、需求沟通、报价谈判到签约打款的全流程商务谈判，达成CPT/CPA/CPC/CPS等多种计费模式的合作。\n3.  负责存量客户的续费维护，跟进客户投放效果、及时处理客户异议，提升客户续费率与客单价。\n4.  根据公司月度/季度业绩目标，制定个人拉新、续费、冲刺及兜底方案，并按时保质完成收款指标。\n5.  根据客户投放需求，跟进广告位上下架、素材更换、位置分配等日常执行工作，与相关部门协同对接，跟进需求落地进度。\n6.  及时、准确填报客户台账、日清日报、缺口冲刺表等业务数据表格，配合团队进行业绩复盘与风险预警。\n7.  运营、产品、审计等部门协同配合，处理客户投放中的异常情况，防范合规与舆情风险。\n\n任职要求\n1.  大专及以上学历，市场营销、商务管理等相关专业优先，也接受有相关行业经验的其他专业背景。\n2.  1年以上互联网广告、流量变现、渠道销售或相关商务拓展经验，有CPT/CPA/CPC/CPS等广告计费模式从业经验者优先。\n3.  具备较强的商务谈判能力和抗压能力，能够独立完成从客户开发到签约回款的全流程闭环。\n4.  沟通表达能力强，逻辑清晰，能准确把握客户诉求并快速给出应对方案。\n5.  数据敏感度高，能够熟练使用Excel等办公软件进行业绩数据整理与分析。\n6.  责任心强、目标导向，能承受一定的业绩压力，认同\"结果导向\"的团队文化。\n7.  具备良好的职业操守，能够严格遵守公司合规要求，无违规操作记录。\n\n加分项\n•  有成熟的广告主/渠道资源，具备快速起量能力。\n•  熟悉App、网站等流量渠道的广告位商务合作，了解广告主的谈判逻辑与合作模式者优先。", "cat": "运营与市场"}, {"id": "168", "title": "SEO专员", "salary": "10k-15k", "location": "", "jd": "岗位职责\n负责网站 SEO 内容运营，围绕核心业务、用户搜索需求及关键词布局制定内容策略，持续提升网站自然搜索流量、关键词排名及用户转化。\n负责 SEO 内容生产与优化，包括文章、专题、分类页、聚合页等内容的策划、撰写、编辑及审核，优化 Title、Description、H 标签、正文结构、内链等页面 SEO 要素。\n负责关键词及搜索需求挖掘，结合 Google 及行业平台分析用户搜索意图，建立关键词库，并根据搜索量、竞争度、相关性及转化价值制定内容生产计划。\n负责网站内容结构优化，定期分析网站分类、标签、专题及内容页面表现，优化栏目架构、内容聚合及内链策略，提升页面收录效率与站内权重传递。\n负责网站外链建设与发布，能够自主寻找行业相关、质量较高的外链资源，通过内容投稿、资源合作、行业网站、社区等渠道持续获取有效外链，并对外链质量及效果进行跟踪。\n持续跟踪 SEO 数据表现，通过 GA4、Google Search Console 等工具监控自然流量、关键词排名、收录、曝光、CTR、用户行为及转化数据，定期进行数据复盘并制定优化方案。\n关注行业趋势及热点内容，快速挖掘具有搜索增长潜力的话题和关键词，结合热点生命周期及时产出内容，获取趋势搜索流量。\n协同产品及技术团队推进 SEO 优化，根据数据及用户搜索行为发现网站问题和增长机会，推动页面模板、站点结构、用户体验及相关功能持续优化。\n负责竞品 SEO 分析，持续跟踪竞品关键词布局、流量页面、内容策略、网站结构及外链情况，分析竞品优质外链来源，挖掘可复制的外链及内容增长机会。\n探索 AI + SEO 内容生产工作流，利用 AI、自动化工具提升关键词研究、内容策划、内容生产、优化及数据分析效率。", "cat": "运营与市场"}, {"id": "169", "title": "内容运营（动漫 / 二次元方向）", "salary": "8-12k", "location": "", "jd": "岗位职责\n\n1、**内容库管理与上架运营**\n负责平台里番、漫剧、H漫等内容的上架管理，包括内容排期、元数据维护（标题、简介、标签、分类）、封面与物料把控；建立并持续优化内容标签体系，保障片库结构清晰，对站内检索、内容推荐及用户浏览友好。\n\n2、**内容编排与运营位管理**\n负责首页、频道页、分类页、专题页等核心流量场的内容编排，策划片单、专题、榜单等运营栏目；结合播放数据、用户偏好及热点动态调整推荐位，提高优质内容曝光效率、点击率及播放转化。\n\n3、**内容排播与节奏运营**\n制定新内容上线节奏及更新排播计划，包括定档、预告、上线、连载更新、完结等内容运营节奏；配合重点内容进行站内宣发及资源位配置，放大头部内容的拉新、活跃及留存价值。\n\n4、**播放数据分析**\n持续跟踪播放量、点击率、完播率、人均观看时长、内容拉新及留存贡献等核心指标，定期进行内容消费数据复盘；通过数据识别高潜题材、热门标签及用户内容偏好，并转化为选片、编排及推荐调整策略。\n\n5、**内容引入支持**\n参与内容评估及引入建议，包括题材热度、目标用户匹配度、内容质量、同类型内容历史表现等；协助对接内容方、制作方或版权方，完成内容物料交付、信息整理及上线跟进。\n\n6、**会员与活动内容运营**\n参与付费内容、会员专享内容及重点内容的运营策略制定，结合新番季、节假日、热点事件及平台活动完成内容侧策划与落地，提升会员内容消费及付费转化。\n\n---\n\n## 任职要求\n\n1、本科及以上学历，3年以上视频平台内容运营经验；有二次元平台、动漫平台、漫剧平台内容运营经验者优先。\n\n2、**必须对成人向动漫、里番、同人本子等内容有长期兴趣和较深了解，里番爱好者或本子爱好者优先作为核心筛选条件。** 能够接受长期接触、筛选、整理及运营相关内容。\n\n3、熟悉里番、成人动漫、同人本子等内容的常见题材、标签体系、画风及用户偏好，能够快速判断一部内容的核心卖点、受众及运营价值。\n\n4、对漫剧、动漫内容具备较强判断力，熟悉主流内容品类及题材趋势，能够判断什么内容具备流量潜力，在选片、推荐及内容编排方面有自己的方法论。\n\n5、熟悉内容运营全链路，包括排期上架、元数据管理、标签分类、运营位编排、专题策划等，至少独立负责过其中两个核心环节。\n\n6、具备较强的数据敏感度，能够看懂内容播放漏斗，独立完成内容消费数据复盘，并根据数据提出具体的选片、推荐位及内容编排调整动作。\n\n7、具备基本的文案及审美能力，能够独立完成专题标题、内容简介、推荐语、标签及封面物料把控。\n\n8、对成人二次元内容具有较强的内容敏感度，了解不同题材、标签及用户搜索习惯，对近期热门作品、热门题材和用户口味变化保持持续关注。\n\n---\n\n## 加分项\n\n1、有成人动漫、里番、本子、二次元垂类网站或相关内容平台实际运营经验；\n\n2、有内容采买评估、版权方或内容制作方对接经验；\n\n3、有会员付费内容、单片付费、内容解锁或类似商业化运营经验；\n\n4、熟悉推荐系统基本逻辑，有根据用户行为数据优化内容推荐或与算法团队协作的经验；\n\n5、熟练使用 AI 工具提升内容运营效率，例如批量整理元数据、标签生成、简介生成、封面初筛及内容分类等。\n\n---\n\n## 投递要求\n\n投递时请附：\n\n* 1–2 个本人实际操盘过的专题、内容编排或排播案例，可附截图及数据说明；\n* 简单说明自己平时关注的里番 / 本子题材、偏好类型或常用内容平台，用于判断对成人二次元内容领域的实际熟悉程度。\n\n本岗位会长期接触成人向动漫及相关内容，无法接受相关内容或对该领域完全不了解者不建议投递。", "cat": "内容与创作"}, {"id": "170", "title": "AI短剧制作", "salary": "10-25k", "location": "", "jd": "1.负责AI短剧选题策划与剧本创作，把控故事节奏、人设和情感钩子，确保内容符合平台调性及用户偏好；\n2.运用AI视频生成工具完成分镜设计与画面生成，保证画面质量、角色一致性和叙事连贯性；\n3.独立完成短剧的剪辑、配音配乐、特效包装及成片输出，把控成片节奏和情绪表达；\n4.跟踪AI视频生成、语音合成、图像处理等相关工具及模型的更新迭代，持续优化制作流程，提升出片效率与质量；\n5.关注短剧行业内容趋势及爆款案例，结合数据反馈迭代选题方向和制作手法；\n6.配合项目排期，独立或协同完成从选题到成片的全流程产出，对内容质量和产出效率负责。\n任职要求\n1.大专及以上学历，影视、传媒、编导、新媒体等相关专业优先；\n2.1年以上短视频/短剧内容制作经验，有AI短剧视频制作经验者优先；\n3.熟练使用至少一种AI视频生成工具及Pr、剪映等剪辑软件；\n4.具备较强的故事策划与文案能力，能独立完成剧本创作或改编；\n5.对AI内容生成工具敏感度高，学习能力强，能快速掌握新工具新玩法；\n6.责任心强，能承受一定的产出节奏和排期压力，具备良好的时间管理能力。\n加分项\n1.有短剧平台过稿或爆款作品案例；\n2.有独立账号运营或内容数据分析经验。", "cat": "内容与创作"}, {"id": "171", "title": "初级运营专员（剪辑文案方向）", "salary": "8-10k", "location": "", "jd": "1.负责相关文案撰写，包括标题、简介、推广文案及社群、自媒体发布内容；\n2.完成视频剪辑及包装工作，对素材进行剪辑、配乐、字幕、成片输出，保障内容质量与产出效率；\n3.根据内容数据反馈，优化文案角度、标题及包装形式，提升内容点击及转化效果；\n4.配合团队完成临时性剪辑、文案支持工作。\n任职要求\n1.大专及以上学历，中文、新闻、传媒、影视等相关专业优先；\n2.具备基础剪辑软件操作能力（PR、剪映等），有剪辑作品或实习经验优先；\n3.文字表达能力强，能独立完成标题、简介、推广文案等内容创作；\n4.对短剧、短视频内容形式敏感，有一定内容审美和节奏把控能力；\n5.工作细致、执行力强，能适应一定的产出节奏。", "cat": "内容与创作"}, {"id": "172", "title": "初级运营专员（内容运营方向）", "salary": "8-10k", "location": "", "jd": "1.负责网站/平台日常内容运营管理，包括内容更新、资源发布、分类维护及页面巡检，保障平台稳定运营；\n2.跟踪热点及行业动态，结合用户兴趣完成内容选题策划与排期，完成图文、短视频脚本、推文等内容的撰写与编辑；\n3.对接设计、剪辑等协作方，推动内容按时上线，持续提升内容质量和用户体验；\n4.负责站外推广工作，包括TG频道发布、外链建设、自媒体内容发布等，提升平台曝光及用户增长；\n5.根据阅读量、完读率、互动率、转化率等数据，持续优化标题、关键词、推荐位及内容结构，提高用户活跃度和转化效果；\n6.负责日常巡检，检查页面展示、视频播放、广告位、链接跳转等功能，发现异常及时反馈跟进；\n7.配合团队完成运营活动策划、项目推进及其他临时性工作。\n任职要求\n1.大专及以上学历，专业不限，新媒体、传媒相关专业优先；\n2.具备基本的文字功底和选题敏感度，能独立完成图文/脚本类内容撰写；\n3.熟悉常见内容发布及自媒体平台操作，学习能力强；\n4.工作细致耐心，责任心强，能适应日常巡检类重复性工作；\n5.有内容运营、新媒体运营相关实习或工作经验者优先。", "cat": "内容与创作"}, {"id": "173", "title": "渠道专员", "salary": "15-25k", "location": "", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "运营与市场"}, {"id": "174", "title": "AI 应用 Golang 后端工程师", "salary": "20k-30k", "location": "沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。", "jd": "一、招聘要求\n\n【硬性要求】\n\n学历/经验：本科及以上学历，5 年以上后端开发经验，计算机相关专业优先。\n\n主力语言：Golang 为主（精通）；PHP 能读能改（能维护存量业务、参与迁移）。\n\nAI 开发（核心）：有大模型（LLM）应用落地经验，包括接入 OpenAI / Claude 等大模型 API、\nPrompt 工程、RAG（向量检索问答）、Function Calling / Agent 编排、流式输出（SSE）。\n能把模型能力工程化成稳定、可控成本的线上服务。\n\n框架能力：熟悉 Gin / Go-Zero / Kratos 等 Go 框架，理解框架设计原理；\nPHP 侧了解 Laravel / ThinkPHP。\n\n数据库：精通 MySQL（表设计、索引优化、SQL 调优）；熟练 Redis（缓存 / 分布式锁 / 限流）；\n熟悉 Elasticsearch（索引设计、检索调优，向量检索加分）。\n\n容器与编排：熟练 Docker；有生产级 Kubernetes（k8s）使用经验；了解 k3s（轻量 / 边缘集群）加分。\n\n架构能力：熟悉微服务架构、分布式系统设计，有高并发项目实战经验。\n\n工具链：熟练使用 Git、Linux 环境，熟悉 CI/CD 流程。\n\n质量意识：具备良好的代码规范意识，熟悉单元测试、接口测试。\n\n沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。\n\n【加分项】\n- 有向量数据库经验（Milvus / Qdrant / pgvector / ES kNN）\n- 熟悉 LLMOps / 模型推理服务部署（vLLM、Ollama、Triton）\n- 有消息队列 / 大数据管道经验（Kafka 等）\n- 有开源贡献或技术博客", "cat": "技术开发"}, {"id": "175", "title": "产品专员", "salary": "15-30k", "location": "", "jd": "产品专员：\n\n岗位职责：\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等传统原型工具，同时能够借助 AI 工具提升原型设计效率，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4、从需求洞察 → 产品设计 →AI工具辅助提效 →推动上线 → 数据迭代，负责完整闭环\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n7、具备产品拆解能力，能快速分析竞品并输出结构化结论（功能、路径、商业模式）\n\n任职要求：\n1、3年以上产品经理经验，至少完整做过1个0-1项目\n2、能独立完成高质量原型设计（熟练使用Axure），同时具备使用 AI 设计工具辅助原型产出的实际经验，例如通过 AI 生产可交互的原型设计，显著提升出图效率。\n3、具备较强的结构化思维与复杂问题拆解能力\n4、有跨团队推动能力，能把事情真正落地\n5、有较强执行力和抗压能力，能处理需求冲突与优先级判断，独自推进项目落地\n6、具备较强的owner意识，对结果负责\n7、在日常工作中已将 AI 工具深度融入产品工作流，包括但不限于：使用 AI 辅助需求分析、竞品调研、文档撰写、原型生成、数据洞察等环节，能主动探索并落地 AI 提效手段。\n8、有团队管理经验或带人经验更佳\n\n加分项：\n1、熟练使用一种或多种 AI 原型/设计工具（如：Figma AI、Codex、Claude AI、chatgtp、grok、cursor 等），能提供使用 AI 工具生成的原型案例作为参考。\n2、有播放器 / 内容 / 消费 / 社交 / 咨询等行业经验\n3、做过增长、商业化相关项目\n4、有技术背景或设计背景\n\n注意：\n1、需要看axure历史原型设计案例，准备自认为最好的1-2套即可，若没有直接pass\n2、使用 AI 设计工具辅助生成的原型案例，说明使用了哪些 AI 工具提升工作效率", "cat": "其他"}, {"id": "176", "title": "AI短剧制作", "salary": "10-25k", "location": "", "jd": "1.负责AI短剧选题策划与剧本创作，把控故事节奏、人设和情感钩子，确保内容符合平台调性及用户偏好；\n2.运用AI视频生成工具完成分镜设计与画面生成，保证画面质量、角色一致性和叙事连贯性；\n3.独立完成短剧的剪辑、配音配乐、特效包装及成片输出，把控成片节奏和情绪表达；\n4.跟踪AI视频生成、语音合成、图像处理等相关工具及模型的更新迭代，持续优化制作流程，提升出片效率与质量；\n5.关注短剧行业内容趋势及爆款案例，结合数据反馈迭代选题方向和制作手法；\n6.配合项目排期，独立或协同完成从选题到成片的全流程产出，对内容质量和产出效率负责。\n任职要求\n1.大专及以上学历，影视、传媒、编导、新媒体等相关专业优先；\n2.1年以上短视频/短剧内容制作经验，有AI短剧视频制作经验者优先；\n3.熟练使用至少一种AI视频生成工具及Pr、剪映等剪辑软件；\n4.具备较强的故事策划与文案能力，能独立完成剧本创作或改编；\n5.对AI内容生成工具敏感度高，学习能力强，能快速掌握新工具新玩法；\n6.责任心强，能承受一定的产出节奏和排期压力，具备良好的时间管理能力。\n加分项\n1.有短剧平台过稿或爆款作品案例；\n2.有独立账号运营或内容数据分析经验。", "cat": "内容与创作"}, {"id": "177", "title": "AI产品运营", "salary": "15k-20k", "location": "", "jd": "# AI产品运营\n\n招聘人数：1人\n方向：AI内容创作 / AI视频 / AI工作流平台\n\n## 岗位职责\n\n1. 负责AI创作平台的产品运营，包括用户需求收集、功能体验优化、运营策略制定及数据跟踪。\n2. 深度体验AI图片、AI视频、无限画布、工作流等核心功能，结合用户实际创作场景提出产品优化建议。\n3. 负责AI模型及功能的运营包装，包括模型测试、效果对比、使用场景设计、模板/案例搭建及教程输出。\n4. 跟踪用户从注册、体验、生成到付费的完整链路，通过数据分析持续优化激活率、留存率、付费转化率及用户使用频次。\n5. 关注AI创作行业及竞品动态，定期分析即梦、小云雀、LibTV等同类产品的功能、模型、工作流、会员体系及运营策略。\n6. 协同产品、研发、设计及AI内容团队推进功能上线，并负责上线后的用户反馈收集、数据复盘及持续迭代。\n7. 结合AI短剧、AI漫剧、短视频等创作场景，探索模板、工作流、素材库等内容生态建设。\n\n## 任职要求\n\n1. 有即梦、小云雀、LibTV等AI创作平台深度使用或相关从业经验优先。\n2. 熟悉主流AI图片、AI视频生成工具及模型，对文生图、图生视频、角色一致性、分镜、工作流等有实际使用经验。\n3. 对AI创作产品有较强理解，能够从“创作者真实使用场景”出发发现问题，而不仅是做活动、写文案。\n4. 具备基础产品思维和数据分析能力，能够根据用户行为、留存、付费等数据提出优化方案。\n5. 对AI行业保持高敏感度，愿意持续体验和研究新的模型、工具及创作方式。\n6. 有AI短剧、AI漫剧、AI视频制作或无限画布/节点工作流产品经验者优先。", "cat": "运营与市场"}, {"id": "178", "title": "远程用户增长运营｜二次元方向", "salary": "10-20k", "location": "远程用户增长运营｜二次元方向", "jd": "### 岗位介绍\n\n负责平台用户增长工作，围绕拉新、活跃、留存、召回、内容消费深度和用户口碑传播，搭建可持续的增长策略与运营机制，提升网站日活、访问频次、作品阅读/观看完成率和核心用户规模。\n### 岗位职责\n\n1. 制定并执行用户增长策略，围绕新用户获取、访问激活、日活提升、留存提升、用户召回和内容消费深度，持续提升平台用户规模与用户质量。\n    \n2. 结合二次元内容消费场景和目标用户画像，策划拉新活动、裂变机制、内容专题、追更机制、用户召回方案和站外传播玩法。\n    \n3. 深入理解二次元用户的内容偏好、追更习惯、互动方式、圈层语言、审美倾向和情绪需求，为内容策划、活动设计和产品优化提供方向。\n    \n4. 与内容、产品、数据、投放、设计等团队协作，优化新用户引导流程、作品推荐链路、追更提醒、首页内容分发、榜单机制和关键访问路径。\n    \n5. 建立用户分层运营体系，针对新用户、活跃用户、沉默用户、高频用户、核心粉丝用户和内容传播用户制定差异化运营策略。\n    \n6. 跟踪和分析核心增长数据，包括新增用户、DAU、WAU、访问频次、次日/7 日/30 日留存、作品点击率、阅读/观看完成率、追更率、分享率、召回率、CAC、ROI 等，输出数据洞察和优化建议。\n    \n7. 策划并落地线上增长活动，包括作品专题、角色活动、追更福利、邀请奖励、节日活动、社区互动活动、站外话题传播活动等。\n    \n8. 关注二次元、漫画、漫剧、短剧、轻小说、动画、虚拟偶像、内容社区和免费内容平台趋势，持续挖掘新的增长机会。\n    \n9. 沉淀增长方法论、活动复盘、渠道评估模型、用户分层策略和内容运营 SOP，提升团队整体增长效率。\n    \n\n### 任职要求\n\n1. 2 年以上用户增长、用户运营、内容运营、社群运营、广告投放或平台增长相关经验。\n    \n2. 熟悉内容平台、漫画平台、漫剧平台、视频产品、社区产品、免费内容站或泛娱乐产品的用户增长逻辑。\n    \n3. 深度理解二次元/ACG 圈层文化，熟悉该圈层用户类型、内容偏好、消费习惯、社交方式、传播习惯和内容审美。\n    \n4. 最好本身就是二次元内容深度用户，对漫画、漫剧、动画、轻小说、同人文化、角色人设、CP、爽点、剧情节奏和圈层梗有真实兴趣和判断力。\n    \n5. 对原创漫剧内容有较强敏感度，能够判断什么样的题材、人设、画风、剧情冲突、更新节奏、标题封面和运营包装更容易吸引用户持续访问。\n    \n6. 具备内容运营和内容策划能力，能够结合用户需求和平台定位，提出选题方向、作品专题、角色运营、追更机制和站外传播玩法。\n    \n7. 具备产品运营思维，能够从用户路径、内容推荐、首页分发、榜单设计、追更提醒、收藏机制、分享机制、页面呈现和访问体验等角度提出优化建议。\n    \n8. 数据意识强，能够通过数据发现问题、验证策略，并持续优化增长动作。\n    \n9. 自驱力强，适应远程协作，能独立推进项目并对结果负责。\n    \n\n### 加分项\n\n1. 有二次元社区、漫画平台、漫剧平台、小说平台、短剧平台、内容社区或免费内容站运营经验。\n    \n2. 有相关圈层长期观察、社群参与或内容策划经验，能够准确理解用户语言、审美和真实需求。\n    \n3. 有从 0 到 1 搭建增长渠道、活动体系、用户留存体系或内容分发策略的经验。\n    \n4. 熟悉 B 站、小红书、抖音、快手、微博、QQ 群、贴吧、Discord、Telegram 等平台的二次元内容传播玩法。\n    \n5. 熟悉免费内容平台的增长逻辑，包括 SEO 流量、社群传播、内容专题、榜单推荐、追更提醒、用户收藏、站外引流和自然裂变。", "cat": "运营与市场"}, {"id": "179", "title": "远程社群运营专员", "salary": "10-15k", "location": "远程社群运营专员", "jd": "### 岗位介绍\n\n围绕用户活跃、社群氛围、粉丝互动、活动参与和用户反馈，搭建稳定的社群运营机制，提升用户粘性、品牌好感度和项目活跃度。\n\n### 岗位职责\n\n1. 负责多个项目产品的社媒/社群日常运营，包括QQ 群、Telegram、Discord、、Reddit、Instagram、Threads等相关社群和内容阵地。\n    \n2. 根据不同项目定位和用户画像，制定对应的社群运营策略，维护社群秩序，营造活跃、友好、有归属感的社群氛围。\n    \n3. 定期发起社群话题、互动讨论、投票、问答、打卡、内容征集等活动，提升用户参与度和社群活跃度。\n    \n4. 策划并落地线上活动，包括粉丝福利、节日活动、新内容预热、作品讨论、角色互动、抽奖活动、邀请活动、用户共创活动等。\n    \n5. 与粉丝保持高频互动，及时回应用户问题、反馈、建议和情绪，提升用户满意度和信任感。\n    \n6. 关注核心用户、活跃用户和高价值用户，建立用户关系维护机制，挖掘 KOC、种子用户和社群意见领袖。\n    \n7. 收集并整理用户反馈，定期输出社群舆情、用户需求、内容偏好和产品优化建议，推动内容、产品和运营团队优化体验。\n    \n8. 配合内容、增长、产品、设计等团队，完成内容分发、活动传播、用户召回、项目推广和新品预热等运营动作。\n    \n9. 跟踪社群运营数据，包括群活跃度、话题参与度、活动参与率、用户留存、反馈响应效率、社群转化效果等，持续优化运营策略。\n    \n10. 沉淀社群运营 SOP、活动模板、用户分层规则、话术规范和反馈处理机制，提升多项目社群运营效率。\n    \n\n### 任职要求\n\n1. 1 年以上社群运营、用户运营、内容运营、粉丝运营或新媒体运营相关经验。\n    \n2. 熟悉社群运营方法，能够独立完成社群维护、话题策划、活动执行、用户互动和反馈处理。\n    \n3. 具备较强的网感和用户沟通能力，能够用自然、亲近、符合圈层语境的方式与用户互动。\n    \n4. 反应及时，服务意识强，能够快速回应用户问题、安抚用户情绪，并推动问题解决。\n    \n5. 具备活动策划和执行能力，能围绕不同项目目标设计可落地的互动玩法和活动机制。\n    \n6. 熟悉内容产品、社区产品、泛娱乐产品、二次元、AI短剧、视频、漫画、AI 工具或创作者生态者优先。\n    \n7. 具备基础数据意识，能够根据社群活跃、活动参与、用户反馈等数据复盘运营效果。\n    \n8. 自驱力强，责任心强，适应远程协作，能够同时推进多个项目的社群运营工作。\n    \n\n### 加分项\n\n1. 有多个社群、多平台账号或多项目并行运营经验。\n    \n2. 有从 0 到 1 搭建社群、种子用户池、核心粉丝群或 KOC 体系的经验。\n    \n3. 熟悉 QQ 群、Telegram、Discord、抖音等平台的社群玩法。\n    \n4. 有二次元、AI短剧、视频内容、AI 工具、成人内容、LGBTQ+社区或粉丝社群运营经验。\n    \n5. 能够输出社群内容日历、活动方案、用户反馈报告和运营复盘。", "cat": "运营与市场"}, {"id": "180", "title": "AI产品经理", "salary": "20-40k", "location": "", "jd": "AI 产品经理 / AI Product Builder \n\n一、任职要求\n1. 必须有 AI Builder 作品(硬门槛,见下)\n2. 1-3 年产品经理经验,有 AI 方向项目经历(实习 / 在校 / Hackathon / 个人作品均认可)\n3. 产品判断力——能讲清作品的目标用户、核心痛点、设计取舍、效果验证。\n4. 技术背景:理工科或等效自学能力;能读 Python / JS / TS;SQL 必备,Python 数据分析优先;能直接读英文 API 文档。\n5. 熟悉至少一个大模型 API,理解 Prompt、RAG、Tool Calling / Function Calling、Agent 等基础概念。\n6. 至少参与过一个完整产品周期,有真实数据可复盘。\n7. 能跟算法、工程建立技术信任,能在一周内把一个清晰问题推进到可演示 demo。\n\n二、加分项\n1. AI 重度付费用户(强信号)：ChatGPT Plus / Claude Pro 连续 6 个月以上,或月付 $100+ 的高阶订阅(Claude Max / ChatGPT Pro 等),或自费 API 月均 $50+。\n2.国际化背景：海外留学,或长期英文工作 / 学习环境(2 年以上),能直接读论文与一线英文讨论。\n3.更强的技术背景：工程师 / 算法 / 数据科学家转岗 PM;GitHub 有持续项目;独立跑过 RAG / Fine-tuning / Agent;熟悉 MCP、LangSmith 等工具链。\n4.其他加分:Agent 产品经验、AI 评测与监控经验、出海或垂直行业 AI 落地经验、技术 Blog 或行业分享。\n\n三、AI Builder 作品门槛\n1. 面试演示至少 1 个本人主导完成的作品,需同时满足:\n    a.真实可访问链接(Vercel / Cloudflare / 自建),不接受截图或 Figma\n    b.调过大模型 API,能解释代码结构、能现场改代码跑通\n    c.解决了一个具体问题(非 Hello World)\n    d.能讲清产品逻辑——为谁做、为什么这样做、怎么验证\n2. 工具不限:Cursor / Claude Code / Lovable /CodeX等。强加分:有真实用户(哪怕 10 个),或在 GitHub / X / 即刻 / 小红书 有过自然传播。", "cat": "产品与管理"}, {"id": "181", "title": "中级运营（流量增长）", "salary": "9K+提成", "location": "", "jd": "岗位职责\n1.负责网站产品的友链互换：寻找合适的友链资源，评估对方网站的质量、相关性和健康度。\n2.通过 Telegram、邮件等方式主动联系站长，洽谈并促成友链交换。\n3.使用公司后台添加和管理友链、广告位（操作简单，入职提供培训）。\n4.维护友链健康度：定期检查对方是否撤链、链接是否有效、是否存在掉权或风险站点。\n5.配合开展灰度引流，通过多渠道为网站产品稳定导入流量。\n6.记录友链与引流数据，定期整理来源、数量、转化情况并复盘优化。\n任职要求\n1.有网站运营、简单SEO了解 或外链建设基础，理解友链、反链对网站权重和收录的作用。\n2.有灰度引流经验（硬性要求）。\n3.熟悉 Telegram、邮件等沟通工具，沟通主动、执行力强、不怕被拒。\n4.做事细心，能记录问题、整理数据并持续优化。\n5.学习能力强，能快速上手后台操作。\n加分项\n1.手上有现成的友链资源或站长人脉。\n2.做过泛娱乐、成人或灰色类网站的引流与外链。\n3.懂基础 SEO（关键词、收录、外链质量判断）。\n4.有多平台引流、投放或社群导流经验", "cat": "运营与市场"}, {"id": "182", "title": "高级后端工程师（Java/Go双栈）", "salary": "20-30k", "location": "", "jd": "高级后端开发工程师（Java/Go双栈）\n岗位职责\n1、负责核心后端服务的设计、开发、优化与维护。\n2、参与系统架构及技术方案设计，保障系统稳定性和可扩展性。\n3、负责业务接口、服务模块及数据处理流程开发。\n4、参与数据库设计、服务治理、性能优化和异常排查。\n5、协同产品、前端、测试及运维团队推动需求落地。\n6、推进研发规范、代码质量及AI辅助研发流程建设。\n任职要求\n1、本科及以上学历，5年以上后端研发经验。\n2、精通Java，熟悉JVM、JUC、Spring Boot、Spring Cloud、MyBatis-Plus及Dubbo。\n3、熟练掌握Go，理解goroutine、channel、GC及并发机制，具备生产项目经验。\n4、熟悉Gin、gRPC、Protobuf、go-zero或Kratos等Go技术框架。\n5、熟悉MySQL、Redis、Kafka或RabbitMQ等常用中间件。\n6、熟悉微服务、数据库建模、接口设计、性能优化及系统治理。\n7、能够独立承担核心模块开发，具备良好的沟通协作能力。\n8必须熟练使用Claude Code、Cursor、Codex等AI编程工具进行日常研发。\n加分项\n*熟悉JavaScript、TypeScript、Vue 3或React，具备前端开发能力。\n*有Java与Go技术栈迁移经验。\n*有AI Agent、RAG或大模型应用经验。\n*有高并发、分布式系统项目经验。\n*熟悉Docker、Kubernetes及DevOps。", "cat": "技术开发"}, {"id": "183", "title": "AI设计师/ UI", "salary": "20-40k", "location": "", "jd": "AI设计师/ AI designer\n我们要找的是一位审美强、懂 AI 产品、理解全球 AI 模型变化、能快速做出可运行原型，并且有耐心把细节打磨到位的 AI 产品体验设计师。\n你需要参与 Web、App、Agent 工作流和 AI 原生产品的体验设计，和产品、工程一起探索：当 AI 不再只是一个聊天框，而是能生成、理解、执行和协作时，用户应该如何与它交互。\n\n⸻\n\n你需要负责\n\n1.负责 Web / App / 后台 / Agent 工作流等 AI 产品体验设计。\n2.从 PRD 中识别模糊需求，补全页面结构、交互路径和关键状态。\n3.设计 AI 产品特有体验：对话、流式输出、生成失败、重新生成、结果编辑、版本回退、用户确认、Agent 步骤可视化等。\n4.关注 Claude、GPT、Gemini、Kimi、豆包、DeepSeek 等全球主流模型能力变化，并把模型新能力转化为产品体验机会。\n5.用 Lovable、Figma Make、Cursor、Claude Code 等工具快速产出可点击、可演示、可迭代的 Web/App 原型。\n6.与 PM 和工程师协作，用原型、设计判断和产品逻辑推动方案落地。\n7.对设计细节有耐心，能持续打磨产品细节，直到达到可交付标准。\n\n⸻\n\n我们希望你具备\n\n1.1-3 年 UI / UX / 产品设计经验，作品强可放宽。\n2.有 Web、App、SaaS、AI 产品、工具产品或后台系统设计经验。\n3.审美扎实，能做出高级、克制、清晰、可信的产品界面。\n4.理解 AI 产品和普通 SaaS 产品的区别。\n5.关注全球 AI 产品和模型能力变化\n熟悉至少一种 AI 原型或 AI 编码工具\n不抗拒代码，能理解基础 HTML /CSS / React / Tailwind 更好。\n6.有强执行力，能把模糊需求快速推进到可演示、可评审、可迭代的结果\n有耐心和细节意识，不只做首屏效果图，也愿意反复打磨状态、流程、边界和交互体验。\n7.能讲清每一个设计决策背后的用户问题、产品逻辑和交互取舍。\n\n⸻\n\n作品要求\n\n面试请准备至少 1 个本人主导作品：\n\n有真实可访问链接，优先 Web/App 原型\na.不接受只有截图、纯 Figma 静态稿或纯视觉海报\nb.能讲清用户问题、设计目标、核心路径和关键设计决策\nc.最好包含 AI 原生交互，例如对话、Agent 步骤、流式输出、生成结果编辑、结果回退、模型失败处理等。\n\n⸻\n\n加分项\n\n1.熟悉 Claude / GPT / Gemini / Kimi / 豆包 / DeepSeek 等模型能力差异有 AI 产品、Agent、AI 工作流、生成式编辑器设计经验。\n2.会用 Cursor / Claude Code / v0 / Lovable / Figma Make 做真实原型懂 React / Tailwind / shadcn/ui / Framer Motion。\n3.有上线作品、真实用户、GitHub 项目、设计系统或个人产品。\n4.有海外产品、英文环境、全球 AI 产品研究经验。\n5.有长期打磨作品的经历，而不是只做过一次性概念稿。", "cat": "内容与创作"}, {"id": "184", "title": "AI 短剧制作 / AI 短剧运营", "salary": "15-20k", "location": "", "jd": "AI 短剧制作 / AI 短剧运营\n\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧生产执行、内容运营、数据复盘\n\n岗位定位：\n负责 AI 短剧的日常生产和运营执行，需要既懂内容，也能使用 AI 工具推进产出，是连接制作和运营的数据型岗位。\n\n岗位职责：\n\n1. 负责 AI 短剧日常选题、素材整理、提示词生成、视频产出和内容发布。\n2. 配合编剧、生成师、剪辑师推进项目进度。\n3. 负责标题、封面、标签、简介、合集、推荐位等运营配置。\n4. 跟进播放、点击、收藏、评论、转化等数据表现。\n5. 拆解爆款内容，沉淀选题方向、标题模板和内容结构。\n6. 协助维护创作者、外包团队和内容供应方。\n7. 推动内容批量生产流程，提高产出效率和上线稳定性。\n\n任职要求：\n\n1. 有短视频运营、内容运营、短剧运营、社区运营经验优先。\n2. 熟悉内容平台用户心理，懂标题、封面、标签和热点追踪。\n3. 会使用 AI 工具进行文案、图片、视频或素材处理。\n4. 能接受成人向 AIGC 内容方向。\n5. 数据意识强，能根据结果调整运营动作。\n6. 执行力强，能处理重复但重要的内容上线工作。\n\n作品要求：\n\n1. 面试需提供运营账号、内容案例、数据截图或项目经验说明。\n2. 有内容从选题到发布再到复盘的完整经验优先。\n3. 可接受现场拆解一个爆款内容的运营逻辑。", "cat": "内容与创作"}, {"id": "185", "title": "AI 短剧导演 / 制片", "salary": "15-20k", "location": "", "jd": "AI 短剧导演 / 制片\n\n招聘人数：1 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧项目统筹、内容质量把控\n\n岗位定位：\n负责 AI 短剧从选题到上线的整体推进，是内容质量和交付效率的负责人，需要懂剧本、分镜、AI 生成、剪辑和运营数据。\n\n岗位职责：\n\n1. 负责 AI 短剧项目选题、剧本、分镜、生成、剪辑、上线全流程统筹。\n2. 制定项目排期，协调编剧、AI 视频生成师、剪辑师和运营人员。\n3. 把控内容风格、剧情节奏、画面质量、人物一致性和成片标准。\n4. 根据平台内容方向，规划系列短剧、栏目和爆款题材。\n5. 建立 AI 短剧生产流程，包括选题会、脚本评审、素材审核、成片复盘。\n6. 根据数据反馈优化制作方式，提高内容产出效率和商业转化。\n7. 管理项目素材、版权信息、发布版本和内容档案。\n\n任职要求：\n\n1. 有短剧导演、制片、内容统筹、影视项目管理经验优先。\n2. 熟悉短剧生产流程，懂剧本、镜头、剪辑和上线节奏。\n3. 对 AIGC 内容生产有理解，愿意探索新工具和新流程。\n4. 能接受成人向 AIGC 内容方向，并具备风险判断能力。\n5. 沟通推进能力强，能带团队按时交付。\n6. 对数据敏感，能根据播放和转化结果调整内容策略。\n\n作品要求：\n\n1. 面试需提供过往项目案例或项目统筹经验说明。\n2. 有完整短剧、栏目、账号或内容项目从 0 到 1 经验优先。\n3. 可接受现场拆解一个 AI 短剧项目执行方案。", "cat": "内容与创作"}, {"id": "186", "title": "AI 短剧后期剪辑师", "salary": "15-20k", "location": "", "jd": "AI 短剧后期剪辑师\n\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧剪辑、包装、成片输出\n\n岗位定位：\n负责 AI 短剧素材的后期整合，把零散 AI 镜头剪成完整短剧成片，重点把控节奏、情绪、字幕、音效、转场和完播率。\n\n岗位职责：\n\n1. 负责 AI 短剧素材剪辑、镜头排序、节奏调整和成片输出。\n2. 完成字幕、音效、配乐、转场、调色、降噪、封面截取等后期工作。\n3. 根据剧情节奏优化开头吸引力、关键转折和结尾留钩。\n4. 制作正片版、预告版、短切版、引流版等不同发布版本。\n5. 配合导演和运营，根据数据反馈调整剪辑节奏。\n6. 建立短剧剪辑模板、字幕模板、音效模板和包装规范。\n7. 管理素材文件，保证项目文件清晰可复用。\n\n任职要求：\n\n1. 熟练使用剪映、Premiere、Final Cut Pro、DaVinci Resolve 等剪辑工具。\n2. 有短剧、剧情号、信息流广告、影视混剪、内容号剪辑经验优先。\n3. 对节奏、情绪、爽点、反转和完播率有判断力。\n4. 能接受成人向 AIGC 内容方向。\n5. 具备基础审美，能保证画面、字幕和声音统一。\n6. 工作细致，能适应批量内容生产。\n\n作品要求：\n\n1. 面试需提供 2-3 条剪辑作品。\n2. 有短剧、剧情视频、AI 视频剪辑案例优先。\n3. 可接受现场剪辑测试或提供改版思路。", "cat": "内容与创作"}, {"id": "187", "title": "AI短剧编剧", "salary": "12-20k", "location": "", "jd": "1. 短剧编剧\n招聘人数：2 人 \n薪资范围：12K-20K / 月\n岗位方向：成人向 AIGC 短剧剧本创作、系列内容策划\n\n岗位定位：\n负责成人向 AIGC 短剧的故事创作与剧本产出，需要把题材、人物、情绪、反转和用户爽点结合起来，写出适合 AI 视频生成和平台传播的短剧内容。\n\n岗位职责：\n\n1. 负责短剧选题、故事大纲、人物设定、分集剧情和完整剧本撰写。\n2. 根据成人向内容平台用户偏好，设计强冲突、强关系、强反转、强追更的剧情结构。\n3. 将剧情拆解为适合 AI 生产的镜头段落，配合 AI 视频生成师完成画面落地。\n4. 参与系列 IP 规划，包括角色关系、人物标签、剧情主线、分季节奏等。\n5. 根据播放、点击、收藏、评论等数据反馈，持续优化题材方向和剧本节奏。\n6. 配合运营完成标题、简介、封面文案、标签关键词和推广短文案。\n7. 建立可复用的题材库、人物库、剧情模板和爆款结构库。\n\n任职要求：\n\n1. 有短剧、网文、影视、漫画、情感故事、成人向内容创作经验优先。\n2. 熟悉短剧节奏，懂开头钩子、剧情反转、情绪推进和结尾悬念。\n3. 具备较强文字表达能力，能稳定输出成体系剧本。\n4. 能接受成人向 AIGC 内容方向，具备内容边界和平台审核意识。\n5. 了解 AI 工具能力边界，能把剧本文字转化为可执行画面描述。\n6. 执行力强，能适应高频产出和快速修改。\n\n作品要求：\n\n1. 面试需提供 1-3 篇过往剧本、故事大纲或短剧案例。\n2. 有已上线作品、爆款案例、网文连载经验者优先。\n3. 可接受现场试写短剧大纲或 1 集分镜脚本。", "cat": "内容与创作"}, {"id": "188", "title": "新媒体运营", "salary": "10-15K", "location": "", "jd": "一、岗位定位\n负责品牌在海外/外网平台的内容运营与传播执行，围绕品牌曝光、用户触达、内容引流及社群沉淀，推动外网传播体系搭建与持续优化。\n二、岗位职责\n1. 负责 Twitter、Instagram、Telegram 等外网平台的日常内容运营与账号维护。\n2. 围绕品牌传播、用户增长和产品引流目标，策划并执行外网内容发布及互动运营。\n3. 跟踪平台数据表现，持续优化内容方向、发布时间及互动策略。\n4. 结合社群、KOC/KOL、渠道合作等形式，提升品牌曝光和用户引流效率。\n5. 熟悉平台风险边界，在合规前提下推进内容传播与引流动作。\n\n三、任职要求\n1. 3年以上海外社媒、外网运营或出海内容平台相关经验。\n2. 熟悉 Twitter、Instagram、Telegram 等平台规则、调性及传播机制。\n3. 具备明确的引流意识，有账号引流、社群沉淀或转化承接经验。\n4. 执行力强，具备良好的数据分析能力、协作沟通能力和推动落地能力。\n\n四、加分项\n1. 有成人行业、情趣用品、两性健康品牌或二次元品牌相关经验。\n2. 有外网 KOL/KOC、社群、媒体或渠道合作资源。\n3. 有从0到1搭建外网账号矩阵或引流体系经验。\n4. 对用户参与机制、活动传播链路和品牌互动方式有较强洞察。", "cat": "运营与市场"}, {"id": "189", "title": "中级运营（成人网站/app）", "salary": "15K", "location": "", "jd": "一、岗位职责\n\n1.负责成人产品全链路运营，包括但不限于内容规划、上架、推广、用户留存、付费转化等；\n2.制定并执行内容分发策略、营销活动（含节日活动、限时福利、联动推广等），提升 DAU、留存率与 ARPU；\n3.监控数据表现（GMV、转化率、流失率、LTV 等），定期输出运营报告并提出优化建议；\n4.协调内容制作团队、美术资源、外部渠道，保障内容按计划高质量上线；\n5.挖掘用户需求，策划 UGC 激励机制、社区活动，提升用户粘性与口碑；\n6.探索 AI 工具在内容生成、翻译、本地化、营销素材制作、数据分析等方面的应用（此为重要加分方向）；\n7.跟进竞品动态，参与新功能、新产品线的运营规划。\n\n二、任职要求\n\n经验要求：本科及以上学历，2-4 年成人产品运营经验，有成人内容、动漫、二次元、游戏或付费订阅产品运营经验者优先；\n\n三、能力要求\n1.对成人产品，成人动漫有较深了解和真实热爱，熟悉用户喜好与敏感点；\n2.具备较强的数据分析能力和商业敏感度，能用数据指导运营决策；\n3.文案能力强，创意执行力好，懂用户心理；\n4.良好的跨团队沟通协调能力，能推动多方资源落地；\n\n四、加分项（重点）\n熟悉主流 AI 工具有实际应用经验；\n有 AI 工作流搭建、AI 辅助内容生产或 AI 营销经验；\n英语或日语能力较强（便于海外推广及资源对接）；\n有海外流量渠道运营经验。", "cat": "运营与市场"}, {"id": "190", "title": "中级运营（成人网站/app）", "salary": "10-18k", "location": "", "jd": "岗位名称： 运营专员（中高级）\n级别：中高级\n需求量： 2人\n薪酬范围： 10–18K/月\n是否紧急：是\n简历筛选要点： 必须有3-5年成人行业工作经验以及独立运营落地产品经验\n\n一、岗位定位\n负责成人内容产品的增长与运营工作，围绕用户新增、留存、内容消费及付费转化等核心指标，推动产品从内容供给、用户运营到商业化变现的全链路增长。\n二、岗位职责\n参与新产品/新方向的冷启动与测试，能够快速验证内容方向及用户反馈，推动产品迭代优化。\n1.内容增长与策略执行：承接整体运营策略，围绕拉新、留存、转化、变现等核心指标推进落地。\n2.持续优化内容结构，提升点击率、留存率及付费转化\n3.日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略\n4.内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，优化内容结构（封面、标题、前3秒、标签等关键环节）建立可复用的内容生产标准与方法论\n5.跨部门协作：与产品、技术、渠道等团队协同。推动内容相关功能优化与产品迭代\n6.竞品与行业趋势分析：持续关注成人内容行业、社区产品及AI方向动态，定期输出竞品分析及优化建议。\n\n任职要求\n1. 有3-5年成人行业工作经历。\n2.有完整参与或主导内容项目/产品从0到1或增长阶段的经验\n3.具备较强的数据分析能力（能独立拆解问题并提出策略）\n4.熟悉内容生产流程，具备内容判断与筛选能力\n5.执行力强，能推动事情落地，沟通能力强，能跨团队协作，抗压能力强，适应快节奏环境\n6.具备较强结果意识，对核心数据（新增、留存、转化、ROI等）负责\n7.具备独立推进项目能力，能够主动发现问题并推动解决\n\n加分项\n1.有内容变现/付费产品经验\n2.有小众主题/Ai/社区/UGC平台运营经验\n3.对用户心理和内容传播有敏锐洞察\n\n淘汰项\n1.执行被动、依赖安排\n2.数据敏感度弱\n3.无法适应快节奏及高迭代环境\n4.仅有传统内容搬运经验、缺少增长意识", "cat": "运营与市场"}, {"id": "191", "title": "新媒体运营", "salary": "10-20k", "location": "", "jd": "岗位职责\n1.负责国内及海外社媒平台账号运营（抖音、快手、小红书、视频号、微博、B站、TikTok、Instagram、Facebook、YouTube、X、Telegram等），完成账号起号、养号、内容发布及矩阵运营。\n2.围绕产品特点和平台调性，独立完成短视频、图文内容的选题、脚本、标题、封面及素材制作，内容方向包括吃瓜、话题、猎奇、擦边、短剧切片等。\n3.负责主页包装、评论区互动、私信承接、关键词布局、社群引导等引流工作，关注账号安全，降低限流和封号风险。\n4.跟踪账号数据（播放、互动、涨粉、私信、进群等），定期复盘并优化内容方向；关注竞品及平台规则变化，挖掘自然流量机会。\n5.配合产品、运营、商务团队完成活动宣传、素材测试及用户引导，沉淀可复用的内容打法和SOP。\n\n任职要求\n• 1年以上新媒体运营或账号孵化经验，熟悉至少1-2个主流社媒平台，有实际运营经验。\n• 有从0到1起号经验，有涨粉、引流或转化的实际案例。\n• 能独立产出内容——选题、脚本、标题、封面文案、图文、短视频。\n• 懂平台推荐机制和互动增长逻辑，清楚养号、内容测试、评论区维护、私信承接等基础玩法。\n• 了解平台违规边界，对内容尺度、擦边表达、导流方式有基本认知。\n• 执行力强，能适应多账号矩阵及快速测试的节奏。\n• 能接受成人行业方向。\n\n加分项\n• 有成人、擦边、吃瓜、情感、短剧号运营经验\n• 有海外平台（TikTok、IG、X、Telegram等）运营经验\n• 会使用AI工具（ChatGPT、AI图片、AI视频等）\n• 熟悉基础剪辑和图片处理", "cat": "运营与市场"}, {"id": "192", "title": "内容运营", "salary": "7-
