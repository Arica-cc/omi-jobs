    熟悉或愿意深度使用AI工具，具备用AI提效的主动意识\n\n工作形式：远程", "cat": "内容"}, {"id": "100", "title": "舆情与危机公关负责人", "salary": "12-20K", "location": "工作形式：远程", "jd": "\"岗位职责\n1. 从 0 到 1 搭建分品类情报监测与分级预警机制（渠道、频率、黄橙红分级、处置闭环）\n2. 打通客服及相关业务侧数据协同，把外部声量与内部信号合成统一风险判断\n3. 主导升级/上线等关键窗口的风险预研、表达抽检与口径输出，前置拦截高风险表述\n4. 独立推进重大负面与突发舆情的处置方案与复盘，沉淀口径库、案例库与制度\n5. 推动预警机制嵌入项目流程，确保风险可预警、可跟进、可关闭\n6. 管理外部监测资源（如有），完善内部流转、复盘与风控机制\n\n任职要求\n1. 本科及以上，3 年以上舆情、公关、内容风控或相关质量分析经验\n2. 有完整舆情/风控机制搭建落地经验，能独立判断风险并给出口径与动作建议\n3. 反应快、文字功底扎实，能在压力下跨部门推动整改与对齐\n4. 原则清晰，熟悉主流平台内容规则与监测工具使用\n\n加分项\n有窗口期监测或危机处置成功案例；有竞品舆论攻防经验；有服务商管理经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "其他"}, {"id": "101", "title": "品牌策略负责人", "salary": "12K-20K", "location": "工作形式：远程", "jd": "岗位职责\n1. 从 0 到 1 设计并落地对内复制 + 对外赋能体系：标准、SOP、课程路径与材料包\n2. 把策略、案例、复盘转化为可带走的课程与工具，支撑业务与合作方独立运转\n3. 建立训后反馈与迭代机制，用真实反馈持续升级内容质量与落地效果\n4. 推动赋能动作嵌入项目节点（开工包、关键节点赋能、结项回收与课例沉淀）\n5. 与市场心智、舆情协同，把最新口径与框架同步进课程，保持体系不过时\n6. 跟踪赋能采用率与效果，输出迭代清单，对体系是否跑得起来负责\n\n任职要求\n1. 本科及以上，3 年以上企业培训、组织发展、方法论沉淀或品牌/运营赋能经验\n2. 有从 0 到 1 搭培训/赋能体系的经历，能独立完成课程产品化与落地推动\n3. 善于把复杂内容拆成可复制路径（课、包、SOP），表达清楚、结构感强\n4. 结果导向，关注采用与效果，不满足于「讲完课」\n\n加分项\n有 ToB 赋能或多组织落地经验；有品牌/策略内容转化经验；有训后效果评估体系搭建经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议", "cat": "商务 / 市场"}, {"id": "102", "title": "经营决策主管", "salary": "20K–30K", "location": "未明确", "jd": "1.分析各业务线的经营情况、问题和机会，形成初步判断。\n2.跟踪市场、竞品和用户变化，提炼对业务有用的信息并落地成方案。\n3.参与新项目和重点事项评估，提出继续、调整、加码或暂停建议。\n4.输出分析结论和汇报材料，并跟踪后续结果。\n任职要求\n1.有业务运营、产品运营、增长、策略或分析相关经验，互联网行业。\n2.能快速理解业务，从复杂信息中抓住重点并形成观点。\n3.能结合基础数据和业务事实说明自己的判断。\n4.文字表达清楚，能够独立完成分析和汇报。\n加分项\n1.有互联网或线上业务相关经验5年以上。\n2.参与过新/老项目评估、业务调整或经营复盘的核心决策。", "cat": "商务 / 市场"}, {"id": "103", "title": "运营发展主管", "salary": "20K–30K", "location": "未明确", "jd": "1.梳理重点事项、协同需求和资源需求，形成处理建议。\n2.将确认事项拆解为责任人、时间节点、交付结果和验收标准。\n3.跟踪跨部门事项进展，发现延期或卡点并推动解决。\n4.维护事项清单，定期输出进展、问题和复盘结论。\n任职要求\n1.有项目运营、业务运营、PMO、项目管理或交付管理相关经验。\n2.能把模糊问题整理成清晰的任务和推进计划。\n3.沟通和推动能力较强，能够协调不同团队持续跟进。\n4.有优先级和结果意识，做事有条理，能够推动事项闭环。\n加分项\n1.推动过多个部门共同参与的项目，自己是核心成员或负责人。", "cat": "运营"}, {"id": "104", "title": "财务专员", "salary": "8k-10k", "location": "未明确", "jd": "一、岗位职责\n日常账务处理： 负责收入、成本、费用、应收应付及流水核对，确保账务准确、完整。\n财务报表编制： 负责月度结账及财务报表编制，定期输出经营数据分析，为业务决策提供支持。\n资金及费用管理： 负责付款审核、费用报销、资金登记及应收应付台账维护，及时跟进回款、付款及异常款项。\n税务与审计支持： 配合完成税务申报、年度审计及财务资料整理，确保财务工作合规。\n财务制度优化： 协助完善财务管理制度、费用标准、审批流程及内部控制机制。\n跨境财务支持： 协助处理跨境收付款、多币种结算、汇率差异及海外主体相关财务事项。\n跨部门协作： 对接业务、人力、行政等部门，及时核对业务数据，推动财务问题解决并闭环。\n\n二、任职要求\n本科及以上学历，财务、会计、审计、金融等相关专业。\n具备 3年及以上财务相关工作经验，能够独立完成日常账务处理、财务报表编制及月度结账。\n熟悉会计核算、财务管理及基础税务申报流程，具备良好的财务合规和风险意识。\n熟练使用 Excel、Google Sheets 等办公工具，能够运用常用函数及数据透视表进行数据整理与分析。\n具备 AI 工具应用能力，能够借助 AI 提升数据处理、报表分析及日常财务工作效率。\n工作严谨细致，责任心强，具备良好的数据敏感度、保密意识及独立解决问题的能力。\n具备良好的沟通协调能力和远程协作意识，能够主动同步进度，确保工作按时交付。\n能够接受公司所属行业及相关业务内容，适应结果导向、高效协作的工作模式。\nps：海外优先", "cat": "职能"}, {"id": "105", "title": "SEO运营专员\n（AI工具赋能方向）", "salary": "18-35", "location": "未明确", "jd": "SEO运营专员（AI工具赋能方向）\n\n【岗位职责】\n\n1. 负责 App、品牌自建站及自媒体矩阵的海外自然搜索流量增长，围绕 Google、Bing 等主流搜索引擎制定并执行 SEO 优化策略，提升核心关键词排名、页面收录量及自然流量转化效果。\n2. 负责站内 SEO 优化工作，包括 TDK 布局、页面结构优化、关键词部署、内容更新、内链建设、结构化数据优化、爬虫抓取异常排查、收录与排名监控等，保障网站具备良好的搜索引擎友好度。\n3. 借助 AI 工具提升 SEO 内容生产效率，完成多语种关键词挖掘、长尾词库搭建、内容选题规划、文案初稿生成、多语言内容改写、内容质检与基础纠错等工作，并结合人工二次精修，确保内容符合海外用户搜索意图、原创性要求和本地化表达习惯。\n4. 负责海外站外 SEO 建设，包括优质外链资源拓展、软文发布、友链合作、品牌相关内容铺设等，持续提升网站权重、品牌曝光度及海外搜索端正向声量。\n5. 每日监控网站流量、关键词排名、收录量、点击率、跳出率、停留时长等核心数据，熟练使用 SEO 工具进行数据分析、问题归因和效果复盘，定期输出 SEO 优化报告及可落地的迭代方案。\n6. 持续关注 Google 等搜索引擎算法更新及海外 SEO 趋势，结合数据变化及时调整优化策略，降低因算法波动导致的降权、收录下降、排名异常等风险。\n7. 与品牌运营、内容、技术/前端团队协作，推动页面内容、站点结构、加载性能、索引体验及品牌搜索口碑的持续优化。\n\n【任职要求】\n\n1. 大专及以上学历，3年以上 SEO 运营实战经验，有海外站点、英文站、多语言站、内容站、品牌站或 App 推广相关 SEO 经验优先。\n2. 熟悉 Google、Bing 等海外主流搜索引擎的排名机制，掌握白帽 SEO 方法论，能够独立完成关键词策略、站内优化、内容规划、外链建设、数据分析及效果复盘。\n3. 熟练使用 Google Search Console、Google Analytics、Ahrefs、SEMrush、SimilarWeb 等常用 SEO 工具，能够独立诊断网站收录、排名、流量及页面质量问题。\n4. 具备较强的 AI 工具应用能力，能使用 ChatGPT、Claude、Gemini 或其他 AI 工具辅助完成关键词拓展、内容生产、多语言改写、数据整理和文案优化；同时具备内容判断力，能够识别 AI 内容同质化、低质化、语义不自然等问题，并进行人工校准。\n5. 具备良好的文案能力和海外用户搜索意图分析能力，能够根据目标市场用户习惯优化标题、摘要、页面结构和内容表达，提升自然点击率和页面停留表现。\n6. 具备较强的数据敏感度和执行力，能从排名、流量、收录、点击、转化等数据中发现问题，并持续推动优化闭环。\n7. 工作细致，结果导向，具备良好的跨团队沟通能力，能够与内容、品牌、技术团队协同推进 SEO 项目落地。\n\n【加分项】\n1. 有海外多语种站点 SEO 操盘经验，熟悉英文、小语种内容优化优先。\n2. 有 App SEO、ASO、品牌词优化、舆情搜索优化经验优先。\n3. 了解 SSR、站点性能、结构化数据、sitemap、robots、canonical 等技术 SEO 基础优先。\n4. 有通过 AI 工具搭建 SEO 工作流、关键词库、内容生产流程或数据看板经验优先。\n\n筛选重点\n\n1. 是否有真实海外 SEO 项目经验，而不是只做过国内平台内容运营。\n2. 是否能独立说明关键词策略、内容策略、站内优化、外链建设和数据复盘方法。\n3. 是否熟悉 Google Search Console、GA、Ahrefs、SEMrush 等工具，并能结合数据定位问题。\n4. 是否真正会使用 AI 提升 SEO 效率，而不是只会用 AI 生成文章。\n5. 是否坚持白帽 SEO，避免黑帽外链、关键词堆砌、批量低质伪原创等高风险操作。", "cat": "AI / AIGC"}, {"id": "106", "title": "代码审计工程师\n（Go 后端 安全与 AI 方向）", "salary": "18-28k", "location": "未明确", "jd": "Go 后端代码审计工程师（安全与 AI 方向）\n\n 🛠 岗位职责\n\n1. 负责 Go 后端项目的代码审计与质量评估，从代码规范、架构设计、并发安全、性能隐患、数据安全及可维护性等维度开展系统审查。\n2. 深入阅读业务代码，识别 SQL 注入、越权访问、敏感信息泄露、鉴权缺陷、接口滥用、并发竞态、资源泄漏等问题，输出审计报告及整改建议。\n3. 结合业务场景评估系统安全边界，重点审查 API、数据库、缓存、消息队列、文件上传及第三方服务调用等关键链路。\n4. 对审计发现的问题进行风险分级，提供可落地的修复方案，必要时参与核心模块重构、漏洞修复及复审验收。\n5. 参与制定 Go 编码规范、安全开发规范及 Code Review 流程，推动静态扫描、依赖检测和 CI 安全门禁落地。\n6. 结合 Claude Code、Codex、Cursor 等 AI 工具建设自动化代码审查流程，提升漏洞识别、问题分类及审计报告生成效率。\n\n🎯 任职要求\n\n1. 本科及以上学历，计算机相关专业优先，3 年以上 Go 后端开发经验。\n2. 扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、内存管理及并发模型，能够识别常见并发与性能问题。\n3. 熟悉 Gin、Go-Zero、Kratos、GORM 等常用框架或组件，具备中大型后端系统开发经验。\n4. 熟悉 MySQL、Redis、Kafka/RabbitMQ 等基础设施，能够审查数据库设计、缓存策略及消息处理链路。\n5. 具备较强的代码阅读和问题定位能力，有 Code Review、代码审计、安全评审或线上故障排查经验。\n6. 熟悉常见 Web 及 API 安全风险，包括 SQL 注入、XSS、CSRF、SSRF、文件上传、鉴权绕过、越权访问和敏感数据泄露等。\n7. 能够清晰输出审计结论、风险等级、影响范围、修复建议及复审结果。\n8. 熟练使用 Claude Code、Codex、Cursor 等 AI 编程工具，能够运用 AI 提升代码审查和漏洞分析效率。\n\n✨ 加分项\n\n* 具备网络安全、渗透测试、SDL 安全开发或企业代码安全审计经验。\n* 熟悉 OWASP Top 10、CWE、CVSS 等漏洞分类和风险评估标准。\n* 使用过 Semgrep、SonarQube、CodeQL、Gosec、Trivy、Snyk 等代码与依赖安全扫描工具。\n* 具备高并发、微服务、分布式系统或支付、账户、权限等高风险业务开发经验。\n* 熟悉 Docker、Kubernetes、Linux 及 CI/CD，能够排查配置、镜像、依赖和部署环节的安全风险。\n* 有漏洞挖掘、攻防演练、CTF、SRC 漏洞提交或安全认证经历。\n* 有基于 LLM 搭建自动化 Code Review、漏洞识别或审计报告生成工具的实际经验。\n\n 🤝 我们期待的你\n\n👉 **代码审查能力强**：能够快速读懂陌生项目，识别真正影响业务安全和稳定性的核心问题。\n\n👉 **安全意识敏锐**：不只关注代码能否运行，也关注权限边界、数据安全、攻击风险和异常场景。\n\n👉 **结果导向**：能够独立完成审计、报告、整改推动及复审闭环，而非只发现问题。\n\n👉 **拥抱 AI 提效**：善于使用 AI 工具提升审计效率，同时能够判断和验证 AI 输出的准确性。", "cat": "AI / AIGC"}, {"id": "107", "title": "数据分析师/游戏数据运营", "salary": "15k-30k\n优秀可谈", "location": "未明确", "jd": "学历要求严格\n最好是硕士，必须有游戏行业经验，简历优先看有游戏项目经验  + 懂游戏产品分析，能用数据推动产品和运营优化的人才\n岗位职责：\n1、负责游戏项目的数据分析与数据运营工作，围绕新增、活跃、留存、付费、LTV、玩法参与、活动效果等核心指标，持续监控项目经营情况，及时发现数据异常和业务问题。\n2、深入参与游戏产品调优，结合玩家行为数据，对新手流程、核心玩法、养成系统、关卡/副本体验等进行分析，定位流失点、转化断点和体验问题，并输出可落地的优化建议。\n3、负责版本、活动和商业化专项分析，包括版本前后效果对比、活动参与与转化分析、礼包/商品表现分析、付费用户分层、付费路径分析、渠道用户质量分析等，为产品迭代和运营决策提供数据支持。\n4、参与游戏数据分析体系建设，包括埋点方案设计、日志上报验收、指标口径定义、数据质量检查、看板搭建与维护，保障数据可用、口径清晰、分析结果可信。\n5、协同运营、研发团队推进问题闭环，将数据结论转化为产品优化方向、运营动作，并跟进上线后的效果验证。\n岗位要求：\n1、本科及以上学历，1–5年游戏数据分析经验（必须有游戏行业经验），RPG、卡牌、二游等品类经验优先。\n2、热爱游戏，平时有较多游戏体验，能够理解游戏系统、玩家成长、付费设计、活动节奏和版本迭代逻辑；能结合游戏内容判断数据变化背后的原因；\n3、具备良好的数据敏感度和业务判断力，能够从留存、漏斗、付费、活跃、玩法参与等数据中发现问题；\n4、熟练使用 SQL、Excel，能够独立完成数据提取、清洗、统计和分析工作；有建模/算法能力为加分项；\n5、具备数据可视化和看板搭建能力，熟悉数数 BI 平台者优先；\n6、具备较强的沟通表达能力，能够把复杂数据问题讲清楚，输出结构化分析结论，并推动运营、研发团队形成共识和行动。", "cat": "技术 / 数据"}, {"id": "108", "title": "高级服务器开发工程师", "salary": "高级，20-30k", "location": "谈offer前请告知有7天试岗期", "jd": "岗位职责\n1. 负责游戏服务端核心系统的设计、开发与维护，包括账号、角色、背包、任务、活动、排行榜及公会等业务模块。\n2. 根据游戏玩法需求，完成通信协议、业务逻辑及数据存储设计，与 Unity3D 客户端协作完成联调和上线。\n3. 负责服务端性能优化，定位并解决高并发场景下的延迟、资源占用、数据库瓶颈及服务稳定性问题。\n4. 保障游戏数据的正确性与一致性，处理并发操作、重复请求、断线重连及异常恢复等场景。\n5. 落实服务端权威校验，对登录、道具发放、交易、支付及结算等关键流程进行安全控制，防范数据篡改、请求重放和业务逻辑漏洞。\n6. 完善日志、监控、告警及自动化部署流程，参与线上故障排查、应急处理和问题复盘。\n7. 编写技术设计及接口文档，参与代码评审，持续改进服务端代码质量和开发效率。\n任职要求\n1. 3 年及以上服务端开发经验，具备游戏服务端开发经历；参与过至少一款正式上线游戏的开发或持续运营。\n2. 熟练掌握 Go、Java、C++、C# 等至少一种服务端开发语言，具备良好的编码习惯和独立模块设计能力。\n3. 熟悉 TCP、UDP、HTTP、WebSocket 等常见网络协议，理解连接管理、心跳、超时、重试及消息序列化机制。\n4. 熟练使用 MySQL 等关系型数据库及 Redis，具备表结构设计、索引优化、慢查询分析和缓存设计经验。\n5. 理解多线程、异步编程及并发控制，能够处理竞态条件、死锁、重复执行和数据一致性问题。\n6. 熟悉 Linux 开发与运行环境，能够通过日志、监控及性能分析工具定位线上问题。\n7. 熟悉常见分布式系统设计，理解幂等、限流、熔断、消息队列及故障恢复等机制，能够结合业务合理应用。\n8. 具备客户端不可信的安全意识，能够独立实现身份鉴权、权限校验、关键业务校验及接口防滥用措施。\n9. 具备良好的沟通协作能力，能够与策划、客户端及测试团队配合，独立推进功能从需求分析到上线交付。\n高级岗位补充要求\n1. 5 年及以上服务端开发经验，主导过游戏核心系统或服务端架构设计。\n2. 有高并发或大规模在线业务的实践经验，能够结合实际数据说明容量规划、性能瓶颈及优化效果。\n3. 具备复杂线上故障的独立排查与处置能力，能够推动系统性改进。\n4. 能够承担技术方案评审、关键模块把关及中初级工程师指导工作。\n加分项\n1. 有实时对战、帧同步、状态同步、匹配或跨服系统开发经验。\n2. 有游戏支付、经济系统、交易系统及反作弊相关经验。\n3. 熟悉 Docker、Kubernetes 或公有云服务，有自动化部署和弹性扩缩容实践。\n4. 有压测、容量评估、灰度发布、数据迁移或不停服更新经验。\n5. 熟悉 Unity3D 客户端协作流程，能够快速定位客户端与服务端交互问题。", "cat": "技术 / 数据"}, {"id": "109", "title": "中高级运营", "salary": "15K\n经验丰富者视能力定岗定薪", "location": "远程", "jd": "岗位职责：\n1、玩家阵地精细化运营：统筹平台、媒体、论坛等核心玩家阵地的生态维护，制定巡查机制与垃圾广告治理方案，牵头基础用户答疑及高价值问题闭环处理，提升用户活跃度与阵地口碑；\n2、数据驱动运营优化：负责后台核心数据跟踪、多维度分析（含用户行为、内容效果、活动转化等），输出结构化数据报告并提炼可落地优化建议，支撑运营策略迭代；\n3、运营活动统筹执行：协助策划阶段性运营活动，主导活动后台用户管理、页面生命周期管控及发奖全流程统筹，联动跨部门推进活动落地，对活动参与度、留存率等关键指标负责；\n4、海外内容生态搭建：建立海内外热门单机游戏更新动态的常态化监测机制，深度挖掘优质内容素材，指导并协同内容团队完成素材筛选、本地化适配与排版优化，提升内容传播力。\n\n岗位要求\n1、经验与学历：2-3年游戏行业相关经验，接受211/985本科及以上应届生（需具备丰富的游戏运营相关实习经历）；\n2、游戏认知：深度PC单机游戏玩家，精通海内外单机游戏圈生态、热门IP动态及圈层黑话，具备玩家社群/论坛核心用户或运营经验，能精准洞察玩家需求；\n3、核心能力：具备较强的策略思维与统筹协调能力，执行力扎实且注重细节，熟练运用Excel（VLOOKUP、数据透视表等）及常用数据分析工具，能独立完成数据复盘与报告输出；\n4、语言与视野：英语CET-4及以上水平，可独立阅读海外游戏更新日志、社群讨论等内容，具备国际化内容视野，能快速捕捉海外游戏圈热点并转化为运营动作；\n加分项：有游戏社群从零到一搭建或活动策划落地经验者优先；具备基础图文排版设计能力（如熟悉PS、秀米等工具）者优先。", "cat": "运营"}, {"id": "110", "title": "初级运营专员", "salary": "10K", "location": "远程", "jd": "岗位职责\n1.        负责平台、媒体、论坛等玩家阵地的日常巡查、垃圾广告清理与基础用户答疑；\n2.        协助数据分析，跟踪后台数据，整理数据日报；\n3.        协助运营活动开展，负责后台用户管理、活动页面上下架及发奖流程执行；\n4.        收集海内外热门单机游戏的更新动态，协助内容团队进行图文素材搬运与排版。\n岗位要求\n1.        1-2年海外互联网运营经验或211本科应届毕业生；\n2.        骨灰级PC游戏玩家，熟知单机游戏圈的黑话与热点，有重度海外游戏玩家社群论坛水友经验；\n3.        执行力极强，踏实细心，熟练使用Excel等基础办公软件；\n4.        英语CET-4以上，能借助翻译软件无障碍阅读海外游戏更新日志及社群内容。", "cat": "运营"}, {"id": "111", "title": "双语技术支持专家/中英文客服", "salary": "10-15K", "location": "1、远程", "jd": "岗位职责\n 1. 熟练使用中英文，快速响应全球用户的技术求助，并提供有效解决方案；\n 2. 提炼高频常见问题，撰写剪辑并持续维护通俗易懂的双语FAQ文档；\n 3. 针对尝试订阅失败或申请退款的用户，进行积极的沟通干预与指导，降低付费环节的技术流失率；\n 4. 将用户报错转化为结构化的技术工单，协助研发团队快速定位代码层面的Bug并督促修复进度。\n 岗位要求\n 1. 极度了解PC软硬件运行原理与Windows系统架构（尤其是注册表、运行库、各主流杀软机制），有技术客服、IT运维或PC单机游戏发行技术支持经验；\n 2. 情绪稳定，极具耐心与服务意识，能承受大量重复性的基础咨询及偶尔的负面情绪宣泄；\n 3. 中英双语文字表达专业且富有温度，能熟练使用各类客诉管理软件系统。", "cat": "客服 / 支持"}, {"id": "112", "title": "游戏平台运营", "salary": "12-18k", "location": "未明确", "jd": "• SDK迭代的运营对接\n跟进SDK版本更新，负责运营侧需求收集、验收与问题反馈；参与接入文档的编辑与维护；推动接入问题排查修复，降低因此产生的转化流失与用户投诉。\n • 跨部门推进与落地\n主动对接产品、技术、客服团队，推动需求排期上线；清晰表达需求背景、目标与优先级；跟进关键节点，遇阻力主动协调。对最终结果负责，而不仅仅是提出建议。\n • 推荐与排序机制优化\n维护平台推荐位及榜单排序逻辑，优化资源位分配效率；依据数据表现动态调整曝光权重，让流量流向高转化产品，削减无效曝光。\n • 用户负反馈治理\n分析退款、差评与高频投诉根因；识别冲动消费、价格敏感等用户行为特征并反哺定价与活动策略；监控负反馈趋势，对改善结果负责。\n • 产品理解与选品评估\n持续跟踪市面游戏产品，熟悉主流品类、玩法与题材趋势；对拟引入产品完成质量与商业化潜力评估；结合平台用户画像输出选品与标签化建议；定期对标竞品平台的活动形式与资源位机制。\n我们希望你具备：\n • 3年以上游戏、内容或平台类运营经验\n • 有完整的活动策划、执行与收入复盘经验，能独立承接全流程\n • 对数据高度敏感，能独立分析并得出可执行结论\n • 熟练使用Excel或同类数据分析工具\n • 具备较强问题拆解能力，能从数据中定位核心矛盾，而非停留在表象\n • 熟悉市面主流游戏产品与品类趋势，有基本的产品鉴别与商业化判断力\n • 以结果为导向，不满足于”完成任务”\n加分项\n • 有单机游戏 / Steam类平台、发行或分发平台经验\n • 有推荐算法、曝光权重或资源位机制的优化实践\n • 有SDK接入、渠道包管理等技术对接经验\n • 熟练使用SQL、BI或AI工具提升分析与运营效率\n • 有跨团队项目推进或小团队管理经验", "cat": "运营"}, {"id": "113", "title": "发行侧运营负责人", "salary": "20-30K", "location": "远程", "jd": "岗位职责\n1. 平台运营规划与全球化布局\n--负责游戏生态与分发平台的全面运营战略规划、核心业务目标制定与全球化落地，对平台整体 DAU、MAU、生态健康度及商业化营收全面负责。\n--统筹平台在海外重点市场的本地化运营与破局，制定差异化的海外市场推广策略及用户获取（UA）方案。\n2. 海外市场推广与用户增长\n--主导全球化流量获客与品牌声量打造，擅长结合海外主流社媒生态（如 Discord、Reddit、X、TikTok、YouTube 等）开展裂变增长与矩阵式社群搭建。\n--建立并管理海外发行运营团队，深度拓展并维护与海外渠道、本地媒体及核心合作伙伴的战略合作关系。\n3. 具备全球化内容生态与创作者搭建能力\n--搭建面向全球的 UGC 创作者、开发者及工会/公会招募、孵化与全生命周期管理体系，驱动内容生态自循环。\n--把控平台内容安全、合规性及海外本地化标准（如 GDPR 隐私保护、版权规范与内容审查机制等）。\n4. 商业化闭环与精细化运营\n--统筹平台多元化商业化变现路径（如付费订阅、全球化支付生态、分成机制等），持续优化全球不同区域的 ARPU 值与 ROI 模型。\n--建立科学的全球化数据监控与漏斗分析体系，通过数据驱动产品迭代、跨国本地化适配及精细化用户分层运营。\n5. 跨部门统筹与项目全盘管理\n--站在平台全局视角，高效协同产品、技术、海外发行、设计与本地化团队，输出高质量的需求规划（PRD）、用户流程及全球化交互设计规范。\n--严控项目排期与技术架构风险（如全球服务器并发、大文件分发、海外网络延迟优化等），保障平台在全球范围内的平稳高效运转。\n任职要求\n1. 基本背景\n统招本科及以上学历，具备 6-10年及以上 互联网/游戏行业从业经验，其中至少 3-5年 大中型游戏平台、应用分发平台或出海工具/社区产品的核心运营负责人管理经验。\n具备成熟的海外游戏发行或海外平台运营实战操盘战绩，有完整大体量出海项目成功落地经验。\n2. 核心专业能力\n全球化视野与海外推广能力：深刻理解海外主流游戏文化及用户心智，精通海外社媒裂变及本地化获客底层逻辑。\n平台级统筹与架构破局能力：不局限于单点业务，具备大盘视角，能统筹“技术-产品-运营-商业化-海外发行”的全链路闭环。\n商业化与创作者经济操盘经验：对全球化平台的变现模式、分成机制及创作者生态有深刻认知，具备跨国商业合作谈判与 ROI 优化能力。\n3. 软性素质\n团队管理与跨部门协同能力：具备优秀的大局观与跨文化团队管理经验，能够在执行层面扎实落地的同时，具备主动思考、前瞻性全球规划及跨部门高压协同的领导力。", "cat": "运营"}, {"id": "114", "title": "资深SEO运营/自动化增长", "salary": "20K", "location": "远程", "jd": "岗位职责\n1.        挖掘建立PC端游戏工具平台SEO矩阵；\n2.        协同技术研发团队完成程序化SEO需求。确保自动化生成高转化率的多语种落地页，并完成主要引擎的抓取收录；\n3.        主导全站点的技术SEO优化，监控并优化页面跳出率，提升在主要引擎的核心关键词占比和排名；\n4.        针对高热度关键词，策划并实施海量域名站群建设，运用泛解析、泛目录等技术快速截流，获取游戏媒体与相关论坛的引流。\n岗位要求\n1.        本科及以上学历，具有5年以上SEO优化经验，有大型软件分发站、游戏门户或电商平台优化经验者为必选项；\n2.        精通GSC、Ahrefs等工具。熟练掌握国内外各类蜘蛛池搭建与快速收录机制，有千万级页面收录与应对搜索引擎核心算法打击的实战规避经验；具备百度、Google等主流搜索引擎双端黑白帽SEO实操经验者优先。\n3.        具备极强的技术理解力，熟悉前沿的程序化SEO逻辑和利用AI工具批量生成高质量网页内容的流程；\n4.        数据导向，能清晰核算SEO带来的自然流量在转化漏斗中的最终价值，抗压能力强。", "cat": "运营"}, {"id": "115", "title": "AI 视频设计师", "salary": "15000-20000", "location": "远程\n不招\"抽卡型\"设计师。\n\n所谓抽卡型：只会把提示词扔给商用模型（可灵、即梦、Sora 等）跑固定工作流，效果不好就把同样的提示词再喂一遍，祈祷这次结果好点。这样的人新招进来没有意义。\n\n当前需要的是真正懂开源视频模型工作流的设计师——能理解模型底层逻辑、能自行搭建或改造 ComfyUI 工作流、能针对特殊需求（动作迁移、视频转绘、去水印等）添加节点、能训练 LoRA 提升产出稳定性。", "jd": "岗位职责：\n1、负责 AI 动漫短视频、AI 游戏介绍动画等内容全流程制作\n2、根据剧本完成分镜构思、AI 视频生成、配音配乐、剪辑及交付\n3、把控人物一致性、画面风格、剧情节奏和镜头衔接\n4、修复人物崩坏、穿模、画面抖动等问题\n任职要求：\n1、熟悉 AI 视频、AI 动漫制作流程\n2、必须熟练使用 ComfyUI / WebUI 工具和 Wan 2.2、LTX 2.3 等 AI 开源视频模型——不熟悉开源视频模型的请勿投递\n3、能够自行搭建工作流，或根据通用工作流添加节点，搭建特殊的动作迁移、视频转绘、视频去水印等视频编辑工作流\n4、能独立完成分镜设计、视频提示词搭建、生成视频及配音等制作\n5、必须提供AI视频作品集\n加分项：\n1、有 Wan 或 LTX 的视频 LoRA 制作经验\n2、有其他图片 LoRA 训练经验\n3、有 AI 语音合成经验（ElevenLabs、GPT-SoVITS 等）\n4、有二次元 / 卡牌 / RPG / 美女向 / 男性向内容视频经验\n5、有海外市场（中华圈、韩国、日本）视觉偏好理解\n6、曾独立主导某款漫剧或短剧作品的完整宣发流程", "cat": "AI / AIGC"}, {"id": "116", "title": "游戏广告素材设计师", "salary": "13000-18000", "location": "未明确", "jd": "岗位职责：\n1、负责手游及内容平台的广告素材设计与制作:静态图、GIF、短视频、信息流素材、原生广告、开屏广告等\n2、根据投放需求与产品定位，拆解卖点并转化为高点击率的视觉表现\n3、熟练使用 AI 生图与 AI 视频工具（Midjourney / ComfyUI / Flux / 即梦 / Runway / Kling 等）大幅提升素材产出效率，同时保证质量稳定性与角色/风格一致性\n4、针对不同投放渠道产出差异化尺寸与调性的素材版本\n5、建立高效率素材工作流：多版本快速产出 → A/B 测试 → 数据回收 → 复用有效元素\n6、结合投放数据反馈，总结高转化元素并沉淀为可复用的模板 / LoRA / 提示词库\n7、针对不同投放渠道的审核规则，输出「尺度分级版」素材（严格版 / 合规版 / 高转化版），配合买量团队通过审核\n任职要求：\n1、2 年以上手游 / 信息流 / 买量广告素材经验（有真实投放数据案例者优先）\n2、必须熟练运用 AI 生图工具（Midjourney / Stable Diffusion / ComfyUI / Flux / 即梦 至少 3 款），具备扎实的提示词、LoRA、Checkpoint 使用能力\n3、会使用至少一款 AI 视频生成工具（Runway / Kling / MiniMax 海螺 / 即梦视频 / Sora / Pika 等），能输出 15 秒以内的短视频素材\n4、必须对二次元文化具备真实理解，手游玩家优先考虑\n5、具备扎实的视觉设计基础，对构图、色彩、信息层级、字体排版有清晰判断\n6、熟练使用 Photoshop、AE（或 CapCut / Premiere），具备基础动效与视频剪辑能力\n7、了解手游 & 内容平台广告素材的常见形式，对用户注意力机制、前 3 秒钩子有基本认知\n8、能理解产品卖点，并将其转化为有效的视觉表达\n9、必须提供 AI 生成作品集（AI 生图 + AI 视频，最好包含尺度作品）\n加分项：\n1、有二次元 / 卡牌 / RPG / SLG / 美女向 / 男性向手游素材经验\n2、有海外（中华圈、韩国、日本、东南亚）或成人向市场投放素材经验\n3、熟悉 ComfyUI 工作流搭建、LoRA 训练、图像扩展、局部重绘、图生视频等高级 AI 应用\n4、有真实投放数据支撑（CTR、CVR、eCPM 优化案例）\n5、能独立完成从卖点拆解 → 概念构思 → AI 生成 → 后期加工 → 多版本迭代的完整流程\n6、对数据反馈敏感，愿意根据 A/B 测试结果快速调整设计方向\n7、有 Meta / TikTok / Google 等主流投放平台素材审核规则的实战经验", "cat": "设计"}, {"id": "117", "title": "互动影游主创 / 导演\n（影视体验 / 创作统筹）", "salary": "25–35K", "location": "未明确", "jd": "岗位定位：以沉浸式影视体验为核心，把故事、表演、镜头和互动组织为完整作品，对整体创作体验负责。\n\n1、确定题材、故事方向、人物关系和视听风格，与叙事策划共同打磨故事大纲及关键抉择。\n2、将剧本转化为文字与图像分镜，设计角色调度、视角、构图、运镜和情绪节奏，明确AI制作依据。\n3、从导演视角确定互动切入、停顿与恢复方式，让选择发生在具有情绪或戏剧意义的时刻，保持观看流畅。\n4、审核角色表演、生成镜头、剪辑及声音，判断不同路径的情绪铺垫和人物反应，统筹补镜与修改。\n5、主持可玩版本评审，结合观看和操作体验调整演出，控制场景、镜头与分支规模，完成首作创作验收。\n6、参与成人向内容定位与商业化评审，判断不同受众为何关注、持续观看和付费，评估内容承诺与实际体验的一致性。\n\n交付与边界：创作方案、图像分镜、演出标准及成片审核；负责影视表达与整体取舍，分支细稿和条件表由叙事策划负责。\n\n任职要求：\n1、有完整叙事影像的主创、编导或导演经历，能展示从剧本理解、分镜到成片的本人贡献。\n2、具备扎实的镜头语言、人物表演、剪辑节奏和审美判断，能说明具体镜头为何成立。\n3、理解互动影像的玩家视角，能判断何时给予选择、哪些信息应当呈现、如何在等待和跳转中维持情绪。\n4、有AI影像制作实践，能评估生成可行性、跨镜头连续性和返工代价，提出可执行修改意见。\n5、能统筹小团队创作、组织试玩并落实反馈，在制作约束下保持关键场面的表现力。\n6、理解R18成人影像（包括AV／porn）的类型、受众偏好与付费动机，能分析感官吸引、欲望投射、亲密关系幻想和叙事期待的差异，并形成角色定位、内容分级与演出方向判断。\n\n作品要求：\n提交1–2部叙事作品，附一场戏的分镜与成片、本人贡献说明。可补充互动作品或交互改编方案。\n\n面试重点：\n把一场戏改编为互动片段，说明视角、选择时机、等待演出及结果镜头。\n\n加分项：\n互动电影导演、叙事游戏演出或完整AI短片经验。\n\n成人向评估：\n提交非露骨的类型分析，说明目标受众、吸引力、付费理由及证据，区分个人偏好与用户需求。", "cat": "内容"}, {"id": "118", "title": "AIGC影像制作师\n（连续影像 / 剪辑合成）", "salary": "根据实际能力面议", "location": "未明确", "jd": "岗位定位：将导演分镜制作成可接入互动作品的视听片段，对影像执行质量及基础后期交付负责。\n\n1、建立角色定妆、场景和关键帧资产，依据分镜完成AI图像与视频生成，控制表演、构图和镜头运动。\n2、解决角色、服饰、道具、光影及动作连续性问题，完成候选筛选、局部修正、合成和补镜。\n3、根据选择结果制作必要的反应与分支变体，保证人物状态、叙事线索和情绪变化准确，维护共享素材与差异版本。\n4、完成短篇原型的剪辑、基础调色、字幕、对白清理与音效编排，处理选择等待、片段跳转及分支汇合的音画衔接。\n5、按节点和版本交付成片、字幕、分轨及工程，在可玩版本中复核效果；复杂合成或专业混音按需求拆包协作。\n\n交付与边界：参考资产、镜头与分支成片包、基础后期工程；执行导演创作标准，反馈制作风险并完成修改。\n\n任职要求：\n1、有连续叙事AI影像作品，能独立完成从参考资产、生成到基础剪辑的制作流程，并说明本人贡献。\n2、熟练使用AI图像与视频工具，能稳定管理跨镜头角色和场景一致性，并适配项目既定制作流程。\n3、理解镜头语言、光影、动作和表演，能识别生成瑕疵并提供可用修正方案。\n4、熟练使用一种主力剪辑工具，具备基础调色、对白处理、字幕及分轨输出能力。\n5、理解非线性片段的连续性要求，能按节点、状态与版本归档，在实际交互播放中检查成片并迭代。\n6、能够接受并专业处理R18成人向项目，理解不同内容分级的视觉表达和受众预期，能准确执行导演要求并管理分级素材版本。\n\n作品要求：\n提交60–120秒连续叙事片段及修正前后对照，附本人后期工程；补充同一场景的不同反应或分支衔接样例。\n\n面试重点：\n验证角色一致性、表演筛选与两个分支间的剪辑和声音衔接。\n\n加分项：\n互动影像制作、合成、声音设计或可复用AI工作流经验。", "cat": "AI / AIGC"}, {"id": "119", "title": "AI 短剧编剧", "salary": "18-20k\n优秀可谈", "location": "远程\n作品要求：\n需提交以下两项：\n1. 一集完整剧本，包含分镜脚本格式，能够体现镜头描述的可生成性。\n2. 一份剧本所涉及的人物设定，包含用于保持跨镜头一致性的外观描述。\n※投递时需说明：作品中本人的具体分工、使用了哪些 AI 工具，以及对 AI 生成结果进行了哪些修改。仅提交成稿而未说明创作过程，将无法判断实际贡献，并影响评估。", "jd": "岗位职责：\n1. 负责竖屏短剧的选题、大纲、分集结构与剧本细写，题材方向以情感向、强冲突题材为主，具体项目内容以沟通为准。\n2. 输出可直接用于 AI 生成的分镜脚本，明确每个镜头的景别、人物动作、表情、环境与情绪，确保制作端能够直接按照脚本进行生成。\n3. 建立并维护人物文字设定，对角色外观进行精确且固定的描述，用于生成角色资产，并保持角色跨镜头的一致性。\n4. 按照竖屏短剧的留人逻辑设计剧情结构，包括每集的钩子、反转及结尾悬念落点。\n任职要求：\n1. 有完整的短剧、网文、漫剧或影视剧本作品，能够提供完整成稿。\n2. 理解竖屏短剧的结构逻辑，包括强钩子、快节奏、高反转密度，理解其与长剧写法的区别。\n3. 熟练使用 LLM 工具进行剧本相关工作，能够判断 AI 产出质量，并对生成内容进行修改完善，而非直接提交 AI 稿。\n4. 能流畅使用 LLM 工具；有本地生成环境、能够自行验证镜头者优先。\n5. 理解 AI 生成端的能力边界，能够针对复杂动作、多人互动、精细道具操作、长镜头连续对话等生成难点，合理设计分镜与表现方式，规避生成过程中的问题，并将剧本转化为可直接生成的分镜脚本。\n6. 对项目题材方向持开放态度，具体以沟通为准。\n加分项：\n1. 有已上线短剧作品，并可提供相应的创作过程文件及交付记录。\n2. 有 ACGN、二次元或漫剧领域相关内容积累或创作经验。\n作品要求：\n需提交以下两项：\n1. 一集完整剧本，包含分镜脚本格式，能够体现镜头描述的可生成性。\n2. 一份剧本所涉及的人物设定，包含用于保持跨镜头一致性的外观描述。\n※投递时需说明：作品中本人的具体分工、使用了哪些 AI 工具，以及对 AI 生成结果进行了哪些修改。仅提交成稿而未说明创作过程，将无法判断实际贡献，并影响评估。", "cat": "AI / AIGC"}, {"id": "120", "title": "AI 短剧剪辑师", "salary": "18-20k\n优秀可谈", "location": "远程\n作品要求：\n提交一条不低于 60 秒的成片，并附素材到成片的对照说明：将原始 AI 素材与剪辑后的成片效果进行对照，并说明具体进行了哪些补救处理。\n※仅提交成片而未说明制作过程的，将无法判断实际贡献，并会影响评估。", "jd": "岗位职责：\n1. 从 AI 生成的大量素材中筛选可用镜头，完成竖屏短剧的粗剪与精剪。\n2. 针对 AI 素材碎片化、高废片率，以及跨镜头色调漂移、帧率不统一等问题，通过跳切、变速、局部放大、遮挡等剪辑方式进行补救，将存在缺陷的素材处理为可用成片。\n3. 完成全片调色统一，使不同批次生成的镜头在整体视觉上保持一致。\n4. 处理对白、音效与 BGM，包括 AI 配音的口型与语气对齐、情绪铺垫及节奏卡点。\n5. 向 AI 制作端反馈重跑需求，明确说明问题镜头的具体缺陷及修改方向，而非仅反馈“这条不行”。\n任职要求：\n1. 自备高性能设备，显卡需达到 RTX 4090 级别及以上，显存 24G 起。\n2. 熟练使用 PR 或达芬奇，能够独立完成从素材到成片的全流程。\n3. 有竖屏短剧、AI 短剧或漫剧的实际成片经验，有上线数据更好。\n4. 具备视听叙事能力，理解镜头衔接、节奏控制和情绪铺垫，而非仅按照脚本进行素材拼接。\n5. 熟悉 AI 后期工具，补帧、超分、去闪烁、抠像等能力中至少有几项能够实际应用。\n6. 具备从大量 AI 废片中筛选可用镜头的判断力，以及针对不完美素材进行补救并完成成片的能力，不仅限于软件操作熟练度。\n7. 对项目题材方向持开放态度，具体内容以沟通为准。\n加分项：\n1. 会使用 AI 处理声音，包括配音生成、音色统一、原生音轨精修。\n2. 有完播率、3 秒跳出率等数据意识，能够说明如何通过剪辑影响相关指标。\n3. 有日更或高频交付的产能经验，能够说明实际单日产出量。\n作品要求：\n提交一条不低于 60 秒的成片，并附素材到成片的对照说明：将原始 AI 素材与剪辑后的成片效果进行对照，并说明具体进行了哪些补救处理。\n※仅提交成片而未说明制作过程的，将无法判断实际贡献，并会影响评估。", "cat": "AI / AIGC"}, {"id": "121", "title": "游戏主美 / 美术负责人", "salary": "25K-35K", "location": "未明确", "jd": "岗位职责\n1、负责游戏项目整体视觉方向，根据产品定位、目标用户及海外市场审美，确定角色、场景、UI、CG、特效等美术风格。\n2、从0到1搭建项目美术规范，包括风格指南、角色与场景设定、色彩规范、UI标准、资源规格、命名规则及验收标准。\n3、负责关键视觉内容的设计与把关，能够亲自完成核心概念稿、关键角色或场景设计，并通过改稿示范指导团队提升品质。\n4、统筹内部美术及外包团队，负责需求拆解、任务排期、成本预估、进度跟踪、质量审核和最终验收，确保资源按时交付。\n5、与策划、导演、Unity程序及制作人紧密协作，推动美术资源在引擎中的实际落地，兼顾视觉效果、包体、性能和开发周期。\n6、参与玩法原型、垂直切片、版本迭代及上线运营，根据产品数据和用户反馈持续优化角色表现、界面体验及整体包装。\n7、建立高效的美术生产管线，合理使用AI及其他工具提升概念探索和资源生产效率，并确保成品质量、原创性及版权合规。\n任职要求\n1、5年以上游戏美术经验，至少2年以上主美、美术组长或美术负责人经验。\n至少完整参与过1–2款正式上线的商业游戏项目，并在其中承担主美、核心美术或美术管理职责。\n2、具备扎实的美术功底和成熟审美，能够准确把控人体结构、造型、构图、色彩、光影和视觉叙事。\n3、擅长至少一种主流游戏美术风格，如欧美写实、二次元、卡通或风格化表现，并能结合成人向产品定位建立统一视觉语言。\n4、熟悉游戏美术完整生产流程，对角色原画、场景、UI、动画、特效、CG及宣传素材有较全面的判断和验收能力。\n5、了解Unity项目资源导入、UI适配、动画、特效、材质及性能限制，能够与程序讨论资源实现和优化方案。\n6、具备内部团队及美术外包管理经验，能够输出清晰的需求文档，并通过具体、可执行的反馈推动修改。\n7、具备较强的项目意识，能够在品质、成本、排期和商业目标之间作出合理取舍。\n8、沟通和推动能力较强，能够适应远程协作、多任务并行及快速迭代的项目节奏。\n9、投递时必须附上完整作品集及上线产品信息。\n加分项\n有互动叙事、视觉小说、海外休闲游戏或短周期小游戏项目经验；\n熟悉AI辅助美术工作流，并有稳定、可控的商业项目落地案例；\n有美宣、商店素材、广告素材及海外用户审美相关经验；\n能够同时覆盖2D视觉设计与基础3D资源审核。", "cat": "设计"}, {"id": "122", "title": "AI 创作者平台运营", "salary": "25–35K", "location": "未明确", "jd": "岗位职责\n1. 参与产品早期规划，制定创作者入驻、内容发布与审核、作者扶持、订阅和单购等运营规则。\n2. 负责平台冷启动，招募种子创作者，规划初期内容供给及创作者激励机制。\n3. 制定用户增长、海外推广和付费转化方案，持续优化注册、创作、发布、内容消费和复购。\n4. 与产品及研发协作，提出创作者管理、内容审核、活动和推广工具等需求，并参与上线验收。\n5. 跟踪创作者活跃、内容供给、用户留存、付费转化和收入表现，定期复盘并推动优化。\n6. 配合相关团队完善AI内容标识、内容审核、投诉和下架等运营流程。\n\n任职要求\n1. 有内容平台、创作者平台、UGC社区、订阅产品或商业化运营经验，主导过上线、冷启动或增长项目。\n2. 能独立制定运营方案，并推动产品、研发、内容等团队协作落地。\n3. 熟悉创作者招募与成长、用户增长、订阅或单购等付费模式。\n4. 了解AI图片、AI视频或短剧创作；有成人内容或AI内容平台经验者优先。", "cat": "AI / AIGC"}, {"id": "123", "title": "产品数据分析师", "salary": "22–30K", "location": "未明确", "jd": "岗位职责\n1. 与产品、运营和研发共同建立用户、创作者、内容、付费、收入及AI创作成本等核心指标口径。\n2. 规划产品埋点、事件追踪和数据看板，跟进需求落地，并完成埋点及数据质量验收。\n3. 分析访问、注册、创作、发布、关注、订阅、单购、续费和复购等关键路径，定位转化和留存问题。\n4. 分析AI生成任务量、成功率、失败退款、Token消耗及模型调用成本，评估业务成本和收入表现。\n5. 分析推广渠道、创作者激励和运营活动效果，定期输出经营报告及优化建议。\n6. 协助核对充值、钱包消费、平台收入、退款、作者收益和提现等经营数据。\n\n任职要求\n1. 有互联网产品、内容平台、游戏或商业化数据分析经验，独立负责过分析项目或指标体系建设。\n2. 熟练使用SQL，掌握Python及常见BI工具，能独立完成数据分析和可视化。\n3. 熟悉产品埋点、指标体系、漏斗、留存、同期群分析及A/B测试。\n4. 理解订阅、单购、钱包、虚拟货币、平台分成和退款等业务模式。\n5. 有AI产品、海外内容平台、UGC社区或创作者平台经验者优先。", "cat": "技术 / 数据"}, {"id": "124", "title": "AI买量小游戏策划", "salary": "18-28K（优秀候选人可谈）", "location": "未明确", "jd": "岗位职责\n \n1. 负责出海买量小游戏的AI原生策划与独立落地，借助AI完成从买量素材洞察、玩法原型、需求拆解、内容生产到原型验证的全链路工作，独立产出可验证Demo。\n​\n2. 使用AI Agent、AIGC工具搭建可复用策划工作流，自动化生成玩法原型、关卡、数值、脚本、买量概念稿，提升小游戏从idea到可测试版本的迭代效率。\n​\n3. 主导买量小游戏核心玩法、数值、关卡、系统设计，对齐买量素材逻辑，兼顾素材吸量能力、产品留存与商业化变现效果。\n​\n4. 持续跟踪前沿AI模型、AIGC生产方案与海外买量市场趋势，结合小游戏业务做落地验证，沉淀团队AI生产规范与素材-玩法联动方法论。\n​\n5. 协同美术、研发、投放团队，推进项目快速上线与版本迭代；能够独立用AI产出原型、素材初稿，支撑买量快速测品。\n \n任职要求\n \n1. 2–8年游戏策划经验，熟悉出海买量小游戏、合成/消除/模拟/超休闲品类优先，有买量测品项目经验加分。\n​\n2. 深度实操各类AIGC、AI Agent工具；具备独立用AI完成小游戏原型搭建、Demo快速产出、自动化内容生产落地经验，可以单人完成从创意到可玩原型的闭环。\n​\n3. 优秀的玩法设计、逻辑拆解能力，强数据敏感度，熟悉买量逻辑，能从投放素材反推玩法，具备商业化变现思维。\n​\n4. 学习能力强，对AI重构小游戏买量生产模式有强烈热情，自驱力强，适应快速测品、高频迭代的工作节奏。\n​\n5. 拥有出海小游戏完整项目、买量测品实战经验优先。", "cat": "AI / AIGC"}, {"id": "125", "title": "产品经理", "salary": "20-25k", "location": "远程\n加分项：\n1. 有创作者付费平台、头部二次元/游戏平台或大型互联网平台的会员/积分/商业化经验\n2. 有0到1搭建用户成长或商业化体系的完整案例\n3. UGC社区或AIGC产品经验", "jd": "岗位职责：\n1.平台基础体系：负责注册登录、创作者入驻、用户成长、积分/TOKEN体系、活动中心、社区互动等核心模块的产品规划与迭代\n2.商业化主导：主导平台商业化产品设计，包括订阅/付费体系、虚拟货币/充值、权益商城、创作者分成与变现路径优化等，对ARPU、付费率、LTV等核心商业指标负责\n3.数据驱动：基于用户分层和漏斗分析，识别增长与变现机会，输出可落地的产品方案，与数据分析师协同建立指标体系\n4.跨部门协同：联动游戏、  {"id": "128", "title": "AI短剧编导", "salary": "面议", "location": "未明确", "jd": "岗位介绍\n负责成熟题材、情感向 AI 短剧的选题策划、热点分析、剧本创作与内容开发。\n需要具备专业的编剧能力和敏锐的网络热点捕捉能力，能够从社会热点、情感事件、流行话题及用户讨论中提炼高传播潜力的故事素材，创作具有强冲突、强情绪、强反转和持续追更动力的成熟题材短剧剧本。\n本岗位涉及成熟题材内容创作。\n岗位职责\n1.        负责成熟题材 AI 短剧的选题策划、故事构思和剧本创作。\n2.        持续关注网络热点、社会话题、情感事件及短视频平台趋势，挖掘适合短剧开发的高热度素材。\n3.        对热点内容进行二次创作，完成原创化、戏剧化和系列化改编。\n4.        负责故事梗概、人物小传、人物关系、世界观设定及分集大纲的设计。\n5.        独立完成短剧剧本、分集剧本、场景描述、人物对白等内容。\n6.        设计剧情冲突、情感推进、人物反转、悬念节点和结尾钩子，提升内容的完播率和追更率。\n7.        与 AI 制作团队协作，参与剧本修改和成片优化。\n8.        根据数据反馈、用户评论及运营需求，持续调整剧情节奏、人物设定和内容方向。\n9.        参与建立成熟题材 AI 短剧的题材库、人物库、热点素材库及可复用剧本模板。\n10.        负责对剧本进行内容审核，确保剧情表达、人物关系及题材方向符合公司内容规范及平台发布要求。\n任职要求\n1.        大专及以上学历，戏剧影视文学、编剧、广播电视编导、中文、网络文学、广告及相关专业优先。\n2.        具有成熟题材影视编剧经验者优先。\n3.        具备专业的编剧能力，熟悉短剧、网文、影视剧或短视频内容创作流程。\n4.        有较强的网络热点捕捉、信息筛选和趋势判断能力，能够快速从热点中提炼故事创意。\n5.        脑洞丰富，想象力强，擅长构建人物关系、情感冲突、戏剧反转和高张力情节。\n6.        熟悉短剧剧本结构，能够掌握开篇吸引力、分集悬念、情绪递进和结尾钩子。\n7.        具备成熟的文字表达能力，能够独立完成故事大纲、人物设定、分集剧本及对白创作。\n8.        了解都市情感、悬疑、剧情、幻想、女性向及婚恋情感等题材的内容特点。\n9.        能够接受成熟题材、情感向的创作方向，并遵守公司内容规范。\n10.        具备较强的审美能力、用户意识和商业内容判断力，理解短视频平台的传播逻辑。\n11.        具备良好的沟通能力、执行力和抗压能力，能够适应快速创作、快速修改和持续迭代的工作节奏。\n12.        具备版权意识、合规意识和职业操守，能够对热点素材进行合法、规范的原创转化。\n13.        有短剧剧本、网络小说、短视频脚本、影视项目或个人作品集者优先。\n加分项\n1.        有成熟题材短剧、情感向影视、AI 漫剧等剧本创作经验。\n2.        有短剧爆款、网络小说、短视频脚本或高传播内容作品。\n3.        熟悉 Seedance 2、LibTV、无限画布等 AI 内容创作工具。\n4.        具备 AI 编剧、提示词撰写或 AI 视频生产流程经验。\n5.        熟悉短剧平台、短视频平台及网络热点传播规律。\n6.        有成熟的题材库、人物库或连续剧开发经验。\n7.        能够使用 AI 工具辅助完成资料整理、创意发散、剧本优化及内容迭代。\n8.        可提供个人作品集、已上线作品或完整剧本案例者优先。", "cat": "AI / AIGC"}, {"id": "129", "title": "业务经理助理 / 项目经理", "salary": "面议", "location": "未明确", "jd": "岗位介绍\n本岗位承担项目推进（PMO）与执行督导双重职责：将业务经理的想法与指令转化为可落地项目，全程跟进至结果交付，确保事事有回音、件件有着落。\n岗位职责\n1.指令落地：将想法与指令拆解为可执行任务，明确目标、节点与责任人，建立任务台账并持续跟踪。\n2.项目推进：统筹跨团队项目进度，建立汇报与复盘机制，识别风险、协调资源、推动问题闭环。\n3.执行督导：对进度滞后、执行敷衍、质量不达标及时纠偏问责，守住交付标准。\n4.事务协同：管理上级时间与信息流，过滤信息、排列优先级、预判风险，提供决策支持。\n5.AI 提效：熟练运用 AI 工具与工作流（写作、数据分析、自动化、Agent 等），提升团队产出效率。\n6.结果复盘：验收关键事项成果，沉淀方法与机制，持续优化执行效率。\n任职要求\n1.目标感强，有信念，愿意为结果负责到底。执行力强，说到做到，能在复杂环境下推动事情拿到结果，原则性强，敢于对事不对人地推动与问责，抗压，不回避冲突。\n2.有 PMO、项目推进、运营或团队管理经验，熟悉目标拆解、进度管理与风险管控。\n3.AI 工具重度使用者，能搭建提示词、自动化、数据分析等提效流程。\n4.熟悉成熟平台相关行业实际运作规则，善于在复杂局面中破局，具备底线与合规意识。\n5.沟通清晰、逻辑严密，适应高强度快节奏。\n加分项\n1.有高管助理、总裁办或业务线管理支持经验。\n2.有从 0 到 1 或创业项目经验。\n3.有 AI 工作流、Agent、自动化工具落地经验。\n4.数据敏感，习惯用数据驱动决策。", "cat": "职能"}, {"id": "130", "title": "高级 SEO 专家", "salary": "20-40", "location": "未明确", "jd": "岗位职责：\n1、负责成熟平台内容站点在 Google 及 Yandex 搜索引擎的整体 SEO 策略制定与流量突破，监控与分析竞争对手的 SEO 策略及流量结构，持续优化自身的差异化竞争优势\n2、负责 Technical SEO 优化，改进网站架构、页面加载速度、索引收录及移动端体验\n3、制定并执行外链建设策略，拓展和维护高质量的外链资源与渠道\n4、追踪 Search Console、Yandex Webmaster 等平台的关键数据，定期输出数据分析报告与优化方案\n任职要求：\n1、3 年以上 SEO 实战经验，精通 Google 与 Yandex 的排名机制与算法更新\n2、 具备成熟题材行业（Adult）或高风险流量站点的 SEO 实战案例与成功经验\n3、熟练使用主流 SEO 工具，如 Ahrefs、Semrush、Screaming Frog、Yandex.Metrica 等\n4、熟悉 Technical SEO，能够独立排查和解决网站收录异常、惩罚降权等技术问题\n5、具备强烈的数据驱动意识、独立解决复杂问题的能力及较强的抗压能力\n加分项：\n1、具备大型流量站点（日均 IP 10万+）的成功优化案例\n2、熟悉黑帽/灰帽 SEO 常用手法及防封禁、降权恢复策略\n3、具备基础的前端开发能力（HTML/CSS/JavaScript），能独立配合技术团队推进代码级优化\n4、熟悉 PBN（私人博客网络）搭建与运维管理", "cat": "运营"}, {"id": "131", "title": "运营专员", "salary": "Open", "location": "未明确", "jd": "岗位职责：\n1、渠道获客：开拓并维护海外及特定市场获客渠道（广告网络、网盟AFF、TG/DC生态、特种流量等），控制获客成本，提升ROI与LTV。\n2、用户转化： 针对AI短剧与特色娱乐用户，搭建AARRR增长漏斗，优化内容推荐策略与付费阶梯，提升留存率与ARPU值。\n3、数据复盘：监控拉新、活跃、留存及变现全流程数据，基于归因分析快速迭代运营与变现策略。\n任职资格：\n1、具备 2 年以上 Adult 站点 / 特色娱乐平台的实际运营经验（无色站经验者勿投）。\n2、 熟悉 AI 成人短剧赛道，了解其内容形态、受众心理及变现路径（或具备成熟的色站全流程运营与流量资源）。\n3、精通用户增长（Growth Hacking）、网盟推广（AFF）及社群裂变等高转化玩法。\n4、 具备特种流量渠道（广告网络、暗流等）的开拓、谈判与数据监控能力。\n5、熟练运用转化漏斗与生命周期模型，具备强数据敏感度，能精准优化 LTV / CAC。\n6、 深刻洞察目标用户付费心理，抗压与执行力强，适应极速迭代业务。\n加分项：\n1、 具备华语市场的本地化推广、特种流量投放或出海产品运营成功案例者优先。\n2、 熟悉海外黑灰产流量机制、隐蔽渠道买量、防封控手段及规避敏感审查的实操经验者优先。\n3、 能熟练运用 Midjourney、ComfyUI、Sora、Codex 等 AI 工具辅助快速生成宣传素材、短剧剧本或运营文案者优先。\n4、自带 Adult 领域优质网盟（AFF）、站长（Webmaster）、KOL 或特种广告主资源者优先。", "cat": "运营"}, {"id": "132", "title": "AI全栈开发工程师（后端 Go 方向）", "salary": "20-30", "location": "未明确", "jd": "AI全栈开发工程师（后端 Go 方向）\n\n职位概述\n负责视频资料检索平台后端架构与核心业务开发，以 Go 为核心技术栈，覆盖搜索聚合、播放服务、用户行为等业务线，并承担高并发稳定性、数据缓存、CDN 与播放链路等关键能力的建设与治理。本岗位要求具备全栈开发能力、精通 AI 工具并拥有产品思维，能够将业务需求转化为可上线、可观测、可扩容的技术方案。\n岗位画像：Go + 全栈开发能力 + 精通 AI 工具 + X 站经验优先 + 产品思维\n能力优先级：Go → AI 工具 → X 站经验 → 全栈开发能力\n\n一、岗位职责\n1、核心业务开发与架构设计：负责平台后端架构与核心业务开发，覆盖搜索聚合、影片与创作者资料、播放服务、用户行为、收藏历史、排行榜及内容运营等业务线；主导需求评审与技术方案设计，推动业务目标落地\n2、高并发服务与稳定性建设：以 Go 为核心构建高并发 API 服务，落地多级缓存、请求合并、异步队列、限流、熔断、降级与热点数据保护，保障突发流量下的服务可用性\n3、AI 工具应用与全栈交付：精通 AI 编程工具与 AI 工作流，持续提升个人及团队研发效率；具备全栈开发能力，可独立完成前后端端到端交付\n4、数据层与缓存体系：负责 MySQL 数据模型设计、索引优化、慢查询治理与读写链路优化；建设 Redis 缓存体系，系统解决缓存穿透、击穿、雪崩、大 Key、热 Key 与失效风暴等典型问题\n5、CDN 与视频播放链路：负责 Cloudflare / CDN 接入与治理（Cache Rules、缓存键、TTL、回源保护、WAF、Rate Limiting、防盗链、多线路切换）；保障 HLS 播放链路（m3u8、TS 分片、AES-128、鉴权 URL、回源与边缘缓存）稳定运行\n6、可观测性与工程效能：完善日志、指标、链路追踪与告警体系，快速定位线上性能问题，对容量、故障与发布风险负责；推动代码评审、自动化测试、灰度发布与技术文档建设，带领团队建立稳定的工程规范\n\n二、任职资格\n1、精通 Go（第一优先级）：深入理解 goroutine 并发模型、channel 与内存管理，具备 pprof、GC 调优等性能优化实战能力，有常驻进程 / 高并发服务线上经验\n2、精通 AI 工具：熟练运用 Cursor、Copilot 等 AI 编程工具与 AI 工作流，能显著提升个人及团队研发效率\n3、X 站经验优先：具有相关视频平台开发与运维经验者优先\n4、全栈开发能力：具备前端基础，能独立完成从后端服务到前端页面（Web/H5）的端到端交付\n5、产品思维：理解业务核心指标与用户场景，能够用数据驱动技术选型与需求优先级判断，主动推动方案落地，拒绝被动式纯编码\n6、5 年以上后端开发经验，其中至少 2 年承担核心系统或技术负责人角色；具备真实大流量线上项目经验，能够清晰阐述业务规模、峰值 QPS、容量瓶颈、优化过程与最终结果\n7、精通 MySQL 与 Redis：具备数据库性能分析、缓存架构设计与线上数据问题处置能力\n8、具备 Cloudflare 或主流 CDN 生产经验；熟悉 Linux、Nginx / HAProxy、Docker、Git 与 CI/CD，可独立完成服务部署、排障与性能调优；重视接口鉴权、权限控制与数据边界安全\n\n优先条件（加分项）\n1、具有大型视频、直播、内容社区、短视频或大规模媒体资源平台经验\n2、具有 PHP→Go 迁移经验，或熟悉 Hyperf、Swoole、RoadRunner 等常驻内存 / 异步框架\n3、具有 Elasticsearch / OpenSearch、ClickHouse、Kafka、RabbitMQ 等组件的生产实践\n4、具有 AWS、对象存储、CloudFront、Cloudflare Workers / R2 或多 CDN 调度经验\n5、具有反爬、防盗链、风控、攻击流量治理经验", "cat": "AI / AIGC"}, {"id": "133", "title": "资料员", "salary": "8K - 15K", "location": "岗位名称：资料员\n\n【岗位职责】\n1. 在 X、TG、Reddit、论坛等平台搜寻成人视频、热点爆料及相关资料。\n2. 下载、筛选并分类视频及图片，确保清晰、完整，添加标题和标签。\n3. 实时追踪网络热点，及时采集热门资源，保证内容时效。\n【任职要求】\n1. 大专及以上学历，1年以上工作经验，熟悉外网及资源渠道者优先。\n2. 能适应成人内容处理，熟悉国内外相关网站及频道，资源渠道丰富者优先。\n3. 熟练使用下载及外网访问工具，会 Python、八爪鱼等采集工具者 能独立完成标题、内容文案撰写者", "cat": "运营"}, {"id": "137", "title": "高级AI内容生成师", "salary": "15-20K", "location": "岗位名称：高级AI内容工程师\n\n【岗位职责】\n1. 根据剧本和分镜，使用AI工具生成人物、场景、道具及动态镜头。\n2. 优化提示词、参考图及参数，筛选并修复素材，保障角色一致性和镜头连续性。\n3. 配合导演、后期完成补镜与修改，规范归档素材，优化生成效率与成本。\n【任职要求】\n1. 大专及以上学历，有AI视觉制作经验，熟练使用至少两类主流AI生成工具。\n2. 能独立优化提示词，理解构图、运镜和角色表演，具备良好审美。\n3. 能处理变脸、动作错误、画面闪烁等问题，耐心细致、交付稳定。\n4. 有完整AI短剧作品，熟悉ComfyUI、LoRA或动作控制者优先。\n【外事号：@yanyan993】\n【联系邮箱：yanyan302108@gmail.com】", "jd": "岗位名称：AI视频生成师\n岗位别称：AI抽卡师  AIGC视频制作师  AI视觉生成师\n岗位定位：根据剧本和分镜生成、筛选及优化人物、场景、道具和动态镜头素材，重点保障素材可用性、角色一致性和跨镜头连续性。\n岗位职责\n1. 拆解分镜中的人物、场景、动作、表情、构图、光影、景别和运镜要求。\n2. 使用AI生图和生视频工具完成人物设定、场景、道具、首帧和动态视频素材。\n3. 编写并优化提示词，合理使用参考图、种子、模型和控制参数提升稳定性。\n4. 批量生成和筛选素材，剔除五官畸形、肢体错误、动作穿模、画面闪烁及构图失衡的结果。\n5. 保证人物五官、发型、服装、身形、道具及整体画风在不同镜头中的一致性。\n6. 完成图生视频、首尾帧控制、人物动作、表情变化和镜头运动。\n7. 使用修图或AI工具完成局部重绘、扩图、高清修复和基础画面清理。\n8. 按镜头编号整理并归档人物、场景、道具、提示词、参数和成品素材。\n9. 配合导演和后期完成补镜、改动作、换景别及素材重生成。\n10. 持续测试新工具和工作流，提高可用素材率并降低生成成本。\n任职要求\n1. 大专及以上学历，熟悉AI图像或AI视频生成流程，有短剧、漫剧、动画或视觉制作经验。\n2. 至少熟练使用两类主流AI生成工具，如即梦、可灵、Vidu、海螺、Stable Diffusion或ComfyUI。\n3. 能够独立编写和优化文生图、图生图、文生视频及图生视频提示词。\n4. 理解景别、机位、构图、焦点、运镜和镜头连续性。\n5. 具备良好审美，能判断人物形象、表情、动作、色彩和光影是否符合要求。\n6. 能够发现并解决人物变脸、服饰漂移、左右手错误、道具错位和背景不连续等问题。\n7. 能够理解剧本和角色情绪，保证镜头服务剧情。\n8. 工作细致、有耐心，能够适应反复生成、筛选和迭代。\n优先条件\n有完整AI短剧、AI漫剧或AI真人短剧作品。\n熟悉角色LoRA、ControlNet、IP Adapter或节点式工作流。\n具有人物口型、动作驱动、首尾帧或镜头延长经验。\n会使用Photoshop、Premiere、After Effects或剪映。\n有可复用的角色库、场景库和提示词模板建设经验。\n投递材料\nAI视频或AI短剧代表作品。\n同一角色在多个场景和景别中的一致性案例。\n参考图、提示词及最终结果对比。\n本人负责范围、使用工具和主要工作流程说明。\n工作结果关注项\n可用素材通过率\n单个有效镜头平均生成次数\n人物与风格一致性\n镜头返工率\n按时交付率\n素材归档规范率", "cat": "AI / AIGC"}, {"id": "138", "title": "中级seo专员", "salary": "12K - 16k", "location": "未明确", "jd": "岗位职责： \n1、SEO策略制定与执行：根据公司业务目标，制定并执行 纯白帽SEO优化方案。 进行关键词研究、网站结构优化、内容规划与落地。 \n2、站内优化：提升网站的页面速度、结构化数据、内链优化、URL规范化。优化页面标题、元描述、H标签、内容布局，提升用户体验与排名。 \n3、站外优化：制定高质量外链建设计划（客座博客、行业合作、媒体推广等）。 严格遵守搜索引擎规则，杜绝黑帽/灰帽手法。 \n4、效果监控与数据分析：定期监控网站SEO指标（收录量、排名、自然流量、转化率等）。 输出数据报告，并根据结果调整策略。 \n5、跨部门协作：与内容、产品、技术、市场团队合作，确保SEO优化顺利实施。 6、行业跟踪与优化迭代：跟进搜索引擎算法更新，保持优化手段的前沿性和合规性。 不断迭代SEO策略，提升长期自然流量和品牌影响力。 \n招聘要求 ;\n1、1-3年以上SEO工作经验，市场营销、电子商务、新闻传播、计算机相关专业优先，大专以上学历。 \n2、熟悉搜索引擎工作原理（Google、Bing、百度等）。精通 白帽SEO 优化策略（关键词研究、网站结构优化、内容优化、外链建设等）。 \n3、熟练使用常用SEO工具（如 Ahrefs、SEMrush、Google Analytics、Search Console、Screaming Frog 等）。了解HTML、CSS、基础JS，能与技术团队沟通实现优化需求。 \n4、有独立操作中大型网站SEO优化成功案例（尤其是自然流量提升）。数据分析能力强，能根据数据调整优化策略。", "cat": "运营"}, {"id": "139", "title": "高级产品经理", "salary": "20K - 30k", "location": "岗位名称：高级产品经理\n\n【岗位职责】\n1.主导核心产品 0‑1 全周期工作，完成竞品调研、需求挖掘、方案设计与效果验证，搭建完整业务闭环。\n2.输出高保真交互原型，结合数据、用户反馈持续迭代产品，对业务结果负责。\n3.统筹设计、研发、运营跨团队协作，把控项目排期，推进项目按期落地。\n4.梳理复杂业务，输出系统化产品方案，独立完成 PRD、需求分析等各类产品文档。\n\n【任职要求】\n1.本科及以上学历，5 年以上互联网产品经验，拥有完整 0‑1 独立落地项目，熟练 Axure、墨刀、Figma，了解基础 UI 规范。\n2.优秀业务理解与数据分析能力，可将业务诉求转化为可落地产品方案，具备团队带教与质量管控经验。\n3.跨部门沟通推动能力强，能够权衡多方需求做出合理决策，文档输出能力扎实。\n4.高度自驱，具备主人翁意识，责任心强，可承受业务压力。\n加分项：大厂产品经验；电商 / 社交 / 内容 / 消费品平台经验；用户增长、商业化、UED、产品质量督导相关经历\n【外事号：@sunyingsha69】\n【联系邮箱：haleejame77@gmail.com】", "jd": "一、岗位职责\n1. 负责核心产品从 0-1 的规划、设计与落地，包括竞品调研、需求洞察、方案设计、功能验证等，确保产品从概念到上线的完整闭环。\n2. 主导跨部门协作（设计、研发、运营等），推动项目按计划推进，并对最终结果负责。\n3. 负责产品原型设计，熟练使用 Axure 等工具，能够输出高质量、逻辑清晰的交互原型，并具备一定的视觉审美与界面呈现能力。\n4. 具备一定的团队管理经验，能够指导中初级产品成员开展工作，提升团队整体专业能力。\n5. 跟踪产品上线后的数据表现和用户反馈，进行分析与迭代优化。\n6. 具备较强的结构化思维能力，对复杂业务场景进行抽象和系统化设计。\n\n二、任职要求\n1. 本科及以上学历，产品、计算机、设计等相关专业优先。\n2. 5 年以上互联网/软件产品经理经验，至少具备 1 个从 0-1 独立负责并成功落地的项目经验。\n3. 熟练使用 Axure、墨刀、Figma 等原型工具，能独立完成 高保真交互原型设计，理解 UI/视觉基本规范及呈现逻辑。\n4. 具备 业务理解能力与数据分析能力，能够将业务需求转化为可实现的产品方案。\n5. 具备一定的 团队管理能力或带队经验，可以指导新人并进行工作拆解与质量把控。\n6. 具备良好的沟通能力、推动能力和跨部门协作能力，能够在多方需求中进行合理取舍与决策。\n7. 具备较强的文档能力，能够输出高质量的 PRD、交互文档、需求分析等。\n8. 抗压能力强，责任心强，具备较强的自驱力与主人翁意识。\n三、加分项\n1. 有大型互联网公司产品经验者优先。\n2. 有消费品、电商、社交、内容平台等行业经验者优先。\n3. 具备用户增长、商业化等方向项目经验更佳。\n4. 具备 UED/交互设计背景或视觉审美能力突出者优先", "cat": "产品"}, {"id": "140", "title": "后端工程师", "salary": "20K - 30K", "location": "未明确", "jd": "# 高级后端开发工程师（Go方向）\n\n工作经验：5年以上\n\n岗位级别：高级 / 资深\n\n## 岗位职责\n\n1. 负责公司核心业务系统的后端架构设计、开发及持续优化，保障系统的高性能、高可用和可扩展性。\n2. 负责高并发、高流量业务场景下的技术方案设计，解决系统性能瓶颈、稳定性及数据一致性问题。\n3. 参与微服务架构设计与治理，推动服务拆分、接口规范、服务降级、限流熔断等技术方案落地。\n4. 负责数据库架构设计与性能优化，包括 MySQL、Redis 等存储系统的合理使用及优化。\n5. 参与核心业务需求分析、技术方案评审、开发排期及代码 Review，确保项目交付质量。\n6. 负责线上复杂问题的排查与解决，持续优化系统监控、日志、链路追踪及故障应急机制。\n7. 熟练运用 AI 编程工具提升研发效率，并能够独立评估、验证及优化 AI 生成的代码。\n8. 持续关注新技术发展，推动团队工程规范、研发效率及系统架构优化。\n\n## 任职要求\n\n1. 大专及以上学历，计算机相关专业，5年以上后端开发经验，具备独立负责中大型项目的能力。\n2. **精通 Golang**，熟悉 Goroutine、Channel、Context、GC、内存管理及并发编程机制，具备扎实的工程实践能力。\n3. 熟悉 MySQL、Redis，具备数据库索引优化、SQL 性能调优、缓存设计及高并发数据处理经验。\n4. 熟悉微服务架构，掌握 gRPC、HTTP、消息队列等常用技术，理解分布式系统设计原则。\n5. 具备高并发系统设计经验，熟悉分布式锁、幂等控制、限流、熔断、降级、分布式事务等解决方案。\n6. 熟悉 Linux、Docker、Kubernetes 等技术，具备一定的容器化部署及线上故障排查能力。\n7. 具备良好的系统架构设计能力，能够独立完成技术选型、方案设计及复杂业务模块开发。\n8. 熟悉 Git、CI/CD 等研发工具及流程，具备良好的代码规范意识和质量意识。\n9. 熟练使用 Claude Code、Cursor、Codex 等 AI 编程工具，能够利用 AI 提升开发效率，同时具备独立判断代码正确性和质量的能力。\n10. 具备良好的沟通协作能力、责任心及主动解决问题的意识，能够推动复杂问题闭环。\n\n## 加分项\n\n1. 有高流量互联网产品、直播、音视频、即时通讯、支付交易等业务开发经验。\n2. 有大型分布式系统架构设计、性能优化或高可用建设经验。\n3. 熟悉 Kafka、RabbitMQ、Elasticsearch、ClickHouse 等中间件。\n4. 了解 LLM、AI Agent、RAG、LangChain、LangGraph 等 AI 应用技术，有相关项目落地经验。\n5. 具备从 0 到 1 的项目架构设计及落地经验。\n6. 有技术团队管理、技术方案评审或带领团队解决复杂问题的经验。\n\n## 我们希望你\n\n- 不只是完成需求开发，更能够主动思考系统设计和长期可维护性。\n- 遇到复杂问题能够独立分析、定位并推动解决，而不是依赖他人提供方案。\n- 善于使用 AI 工具，但不盲目依赖 AI，对代码质量、系统稳定性和交付结果负责。\n- 具备较强的业务理解能力，能够在保证质量的前提下高效交付。\n- 有责任心、执行力和团队协作意识，能够适应快速迭代的研发环境。", "cat": "技术 / 数据"}, {"id": "141", "title": "AI 应用算法工程师（多模态 / Agent 方向）", "salary": "面议", "location": "未明确", "jd": "岗位职责\n1. 负责大语言模型、图像及视频模型的选型、接入与应用开发，推动 AI 能力在实际业务中落地。\n2. 根据业务需求开展模型调优，包括数据准备、Prompt 优化、模型微调及效果评估，持续提升输出质量与稳定性。\n3. 设计和开发 Agent 智能体，实现工具调用、知识库检索、任务规划及工作流编排。\n4. 参与图像、视频处理相关功能开发，将视觉算法与多模态模型整合到业务流程中。\n5. 完成模型服务与业务系统的集成、部署和维护，优化响应速度、资源消耗及使用成本。\n6. 参与短剧业务的 AI 工作流设计与开发，覆盖剧本解析、分镜拆解、角色与场景设定、图像及视频生成、配音字幕、剪辑合成等环节。\n7. 将模型、Agent 与音视频处理工具整合为可批量运行的自动化流程，支持任务调度、进度跟踪、失败重试和人工审核。\n8. 针对短剧制作中的角色一致性、画面连贯性、音画同步等问题，开展效果评估与优化。\n任职要求\n1. 有实际软件开发经验，熟练使用 Python，具备良好的编码、接口开发、调试和问题排查能力。\n2. 具备一定的计算机视觉基础，了解图像与视频处理流程，对检测、分割、识别等常见任务有基本认识。\n3. 理解 LLM、图像及视频模型的基本原理、能力边界和应用场景，能够根据任务选择合适的模型与技术方案。\n4. 具备模型调优实践经验，了解 SFT、LoRA 等微调方法，能够通过数据和评测结果分析、改进模型效果。\n5. 熟悉 Agent 的基本架构，有工具调用、RAG、工作流或多智能体协作相关开发经验。\n6. 能够独立推进功能开发，具备业务理解能力、学习能力及团队协作意识。\n7. 有短剧制作、AI 短剧生成或短剧出海相关工作流经验，理解从素材输入到成片交付的主要环节，能够识别适合 AI 自动化的业务场景。\n加分项\n- 有图像生成、视频生成或编辑、视觉识别等项目落地经验。\n- 有模型私有化部署、GPU 推理优化或服务性能优化经验。\n- 有独立完成 AI 产品从原型到上线的经历，或可展示的项目、作品及开源贡献。\n- 有短剧翻译配音、字幕处理、视频剪辑、封面生成、素材质检等项目经验。\n- 有 ComfyUI 或其他模型工作流编排工具的使用、二次开发及服务化经验。\n• 有短剧批量生产或处理平台的实际落地经验，能够兼顾成片质量、处理效率与成本。\n我们更看重实际项目经验、动手能力和交付结果。投递时请附相关项目介绍，并说明个人负责的部分、技术方案及取得的效果。", "cat": "AI / AIGC"}, {"id": "142", "title": "中级运营专员", "salary": "10K - 20K", "location": "未明确", "jd": "一、任职要求\n1、具有3年以上互联网产品运营经验，有视频类、内容社区类、短剧类App或Web产品运营经验优先。\n2、熟悉互联网产品运营体系，具备用户增长、用户生命周期管理、内容运营、活动运营等相关经验。\n3、具备较强的数据分析能力，熟悉DAU、MAU、留存率、转化率、用户活跃、付费等核心指标，能够通过数据分析发现问题、制定策略并验证效果。\n4、具备较强的业务分析及运营策略能力，能够结合市场趋势、竞品分析、用户需求及经营数据，独立制定产品运营及增长方案。\n5、具备一定的产品思维，能够分析用户体验问题，判断产品需求价值，协同产品及技术团队推动产品迭代优化。\n6、具备较强的目标管理、执行推动及跨部门协作能力，能够独立负责运营项目并推动结果落地。\n7、高级运营候选人需具备团队管理或业务统筹经验，能够进行目标拆解、任务分配、团队培养及绩效管理。\n\n二、岗位职责\n\n1. 产品运营与业务增长\n·负责所辖App/Web产品的整体运营规划，制定阶段性运营目标及增长策略。\n·对产品DAU、MAU、用户留存、活跃度、付费转化及收入等核心经营指标负责。\n·定期分析产品经营数据，识别增长瓶颈及业务问题，制定改善方案并推动执行。\n·研究市场趋势、竞品动态及用户需求，探索产品增长机会及运营策略。\n\n2. 用户运营与商业化\n·建立用户生命周期运营策略，围绕拉新、促活、留存、召回及付费转化开展运营工作。\n·通过用户分层、行为分析、运营活动及激励机制，提升用户活跃度与留存表现。\n·分析用户付费行为及转化路径，协同优化会员、充值、付费内容等商业化体系。\n·持续跟踪运营策略实施效果，通过数据复盘推动业务指标改善。\n\n3. 内容运营与产品优化\n·负责内容运营策略制定，优化内容供给、内容质量、内容推荐及用户消费体验。\n·结合内容播放、点击、互动、完播率等数据，分析用户偏好并推动内容策略调整。\n·结合用户反馈、竞品研究及业务数据，发现产品体验问题，提出合理的产品优化建议。\n·协同产品、技术等部门推进功能迭代，并跟踪上线后的实际运营效果。\n\n4. 团队管理与跨部门协作\n·根据业务目标制定运营工作计划，推动重点运营项目按期落地。\n·协助部门负责人开展运营团队管理，包括任务分配、人员培养、工作监督及绩效评估。\n·建立运营工作复盘机制，持续优化运营流程及执行效率。\n·协同产品、技术、内容、新媒体及其他业务团队，推动重点项目及增长策略落地。\n\n三、加分项\n1、具有视频平台、内容社区、短剧平台等相关产品运营经验，独立负责过产品增长或从0到1的业务建设。\n2、具有成熟的用户增长案例，能够提供具体的增长策略、执行过程及实际数据成果。\n3、具有会员体系、内容付费、充值转化、用户激励等商业化运营经验。\n4、具有SEO、渠道增长、流量转化或多产品矩阵运营经验。\n5、熟悉AI工具应用，能够利用AI辅助数据分析、内容运营、竞品研究及运营效率提升。\n6、具有跨部门项目统筹、运营团队搭建或业务管理经验。", "cat": "运营"}, {"id": "143", "title": "中高级运营专员", "salary": "10k-30k", "location": "未明确", "jd": "岗位职责：\n1. 负责公司核心业务的整体运营工作，根据业务目标制定阶段性运营策略，并推动落地执行。\n2. 围绕业务增长、用户活跃、转化提升、留存复购等核心指标，制定运营方案并持续优化。\n3. 负责运营体系建设，包括但不限于活动运营、用户运营、内容运营、数据复盘、流程机制和 SOP 搭建。\n4. 带领运营团队完成日常管理工作，包括目标拆解、任务分配、过程跟进、绩效辅导、能力培养与团队氛围建设。\n5. 基于业务数据分析，识别问题与增长机会，独立输出优化建议，并推动跨部门协同落地。\n6. 与产品、技术、渠道、商务、客服等相关部门紧密配合，推进重点项目执行，确保结果交付。\n7. 负责重点项目从策划、执行到复盘的全流程管理，提升团队整体效率与运营质量。\n8. 持续关注行业动态、竞品策略及用户需求变化，结合业务现状提出可落地的优化方向。\n\n任职要求：\n1. 本科及以上学历\n2. 5年以上运营工作经验，2年以上团队管理经验\n3. 有团队管理、目标分解、过程跟进和结果复盘经验\n4. 有从0-1搭建或1-10放大的实际案例\n5. 有明确业务结果产出，能用数据体现成绩\n6. 熟悉活动运营、用户运营、内容运营或业务运营其中一个或多个模块\n7. 具备较强的数据分析能力，能通过数据发现问题并推动优化\n8. 有跨部门沟通协作经验，能协调产品、技术、渠道、商务等团队推进项目\n9. 有运营体系、流程机制或SOP搭建经验优先\n10. 具备较强执行力、责任心和团队管理能力\n11. 职业经历相对稳定，有持续成长路径优先\n12. 有同行业或相关业务经验者优先", "cat": "运营"}, {"id": "144", "title": "中高级运营专员", "salary": "10k-20k", "location": "未明确", "jd": "岗位职责：\n1.转化链路优化：负责全渠道流量监控，通过优化官网点击率、各端安装率（iOS/安卓）及渠道转化逻辑，提升整体获客效率。\n2.用户活跃与拉单：通过前端逻辑调整与策略干预，提升用户拉单触发频率，通过高频行为带动商业化转化。\n3.商业化策略设计：\n首充转化：设计低门槛首充产品（如周会员），降低付费门槛，提升新增付费率。\n客单价提升：规划高价值套餐（月/季包）及代金币体系，优化定价策略，提升 ARPPU 表现。\n续费召回：通过 Push、站内信等手段建立老用户触达机制，扭转续费下滑趋势，提高老用户充值占比。\n数据建模与实验：基于“拉单-付费率-ARPU”的影响机制进行实验验证，通过数据反馈不断迭代增长路径。\n4.核心考核指标 (KPI)\n获客质量：官网点击转化率、点击安装率、渠道转化率。\n增长规模：拉单触发频次、拉单率。\n变现效率：新增付费率、ARPPU、综合 ARPU。\n存量经营：老用户续费召回率、老用户充值占比。\n\n任职要求：\n1.获客与转化优化（前端漏斗）\n2.行为策略与增长实验（活跃增长）\n3.商业化与定价策略（收益提升）\n4.存量用户精细化运营（留存召回）\n\n专业技能词库（简历高频词）：\n模型思维：能够理清各数据指标间的联动关系，擅长通过拆解“提升路径”寻找业务增长点。\n实操经验：有视频、工具或订阅类产品运营背景，熟悉付费门槛设置、套餐定价及代金币体系设计。\n执行能力：具备优秀的产品逻辑梳理能力，能推动前端逻辑调整、支付开发及运营配置高效落地。\n数据驱动：具备严谨的数据分析能力，能从复杂的指标波动中定位核心问题并产出解决方案。\n核心指标： ARPU、ARPPU、付费渗透率、拉单率、安装转化率。\n业务逻辑： 商业化建模、定价策略、代金币体系、分层运营、用户召回、A/B Testing。\n加分项：\n具备自动化任务跟进或多 Agent 协同工作意识。\n有视频播放器、动漫或垂直内容领域成功增长案例者优先。", "cat": "运营"}, {"id": "145", "title": "产品经理", "salary": "15-30k", "location": "未明确", "jd": "\"1.     5 年以上互联网产品经理经验，至少主导完成过 1 个 0-1 产品项目，并成功上线运营。\n2.     具备 AI 产品相关经验，参与或主导过 AI 工具、AI Agent、智能助手、内容生成、AI 搜索、AI 对话等产品设计与落地。\n3.     熟悉大模型基本能力，理解 Prompt Engineering、RAG、Embedding、Function Calling、Agent Workflow 等核心概念，能够与算法及研发团队高效协作。\n4.     熟练使用 Axure，能够独立完成高质量交互原型设计，具备完整原型案例及产品设计文档。\n5.     熟练使用 ChatGPT、Claude、Codex、Grok、Cursor、Figma AI 等3种以上 AI 工具，并能够结合产品工作流提升需求分析、产品设计、文档编写及原型设计效率。\n6.     具备优秀的结构化思维能力，能够独立完成复杂业务分析、需求拆解、产品方案设计及项目规划。\n7.     具备较强的 Owner 意识、执行力及跨团队推动能力，能够独立协调资源，推动项目高质量落地。\n8.     具备优秀的数据分析能力，能够基于业务数据及用户反馈持续优化产品，形成产品增长闭环。\n9.     有团队管理经验、项目管理经验或产品团队带教经验者优先。\"", "cat": "产品"}, {"id": "146", "title": "中高级运营", "salary": "10-30k", "location": "未明确", "jd": "1. 2 年以上网站运营、内容运营、平台运营或增长运营经验。\n2. 熟悉网站运营流程，能独立完成内容规划、页面配置、数据分析和运营复盘。\n3. 熟悉网站后台 / CMS 操作，能完成内容发布、栏目维护、标签管理、专题配置等工作。\n4. 具备数据分析能力，能通过流量、点击、转化、留存、跳出率等数据发现问题。\n5. 理解基础 SEO，了解关键词、标题、描述、内链、收录、页面结构对网站流量的影响。\n6. 具备内容判断能力，能判断内容是否符合用户需求、网站定位和转化目标。\n7. 具备较强执行力，能把运营计划拆解成具体动作，并持续推进。\n8. 能与产品、技术、SEO、设计、数据等团队协作，清楚表达运营需求并推动落地。\n9. 熟练使用 Excel / Google Sheets / 飞书表格等办公工具，能整理数据和制作报表。\n\n---\n加分项\n1. 有内容聚合类、资讯类、社区类、垂直行业网站运营经验。\n2. 有海外中文站点、Google 流量站、SEO 流量站运营经验。\n3. 有多站点 / 矩阵站点运营经验。\n4. 熟悉 Google Analytics、Google Search Console、Ahrefs、SEMrush、Screaming Frog 等工具。\n5. 有 SEO 内容运营经验，能配合完成关键词布局、专题页规划、内链优化和内容优化。\n6. 有 Telegram、Twitter、Facebook、Reddit 等海外渠道运营经验。\n7. 有基础 Python / Shell / SQL 能力，可辅助数据整理、内容批量处理或运营自动化。\n8. 自己运营过个人网站、博客、频道、社群或副业项目。\n9. 有成功的网站增长案例，能说明自己负责的动作、数据变化和结果。\n我们希望你具备\n- 执行力强，能持续推进运营计划\n- 结果导向，关注流量、转化和用户行为变化\n- 细节意识强，能发现页面、内容、入口和数据异常\n- 主动性强，能主动发现问题并提出解决方案\n- 学习能力强，能关注行业变化、竞品动态和用户需求\n- 沟通能力好，能和技术、SEO、设计、数据团队高效协作\n- 有复盘意识，能从数据结果中总结经验并持续优化\n\"岗位职责\n\n1. 负责网站日常运营，包括内容更新、栏目维护、页面配置、专题策划等工作。\n2. 负责网站核心页面运营，包括首页、频道页、详情页、专题页、活动页等页面的内容管理和入口优化。\n3. 根据网站目标，制定内容运营、流量增长、用户转化和留存提升方案。\n4. 负责网站数据跟踪与分析，包括访问量、来源渠道、点击率、跳出率、转化率、留存率等数据。\n5. 根据数据表现发现问题，提出优化方案，并推动落地执行。\n6. 配合 SEO 团队，完成关键词布局、内容优化、内链建设、专题页规划和页面结构调整。\n7. 配合技术团队，推动网站功能优化、后台工具改进、数据看板建设和用户体验提升。\n8. 负责竞品调研，分析同类网站的内容结构、流量来源、页面布局和运营策略。\n9. 策划并执行网站运营活动，如专题活动、内容合集、榜单推荐、频道运营等。\n10. 建立并优化网站运营 SOP，包括内容发布规范、页面检查规范、数据复盘机制和问题反馈流程。\n11. 定期输出运营日报、周报、月报，汇报网站数据、运营问题、优化进展和后续计划。\n试用期内需完成：\n\n1. 网站运营现状诊断报告  \n2. 3 个月网站运营优化计划  \n3. 核心页面内容与入口优化方案  \n4. 至少 3 个运营问题或用户路径问题的优化落地  \n5. 每周网站数据复盘报告\"", "cat": "运营"}, {"id": "147", "title": "中高级运营专员", "salary": "10-30k", "location": "未明确", "jd": "1、大专及以上学历，3年以上网站运营或平台运营经验，具备成熟的网站运营体系思维；\n2、具备较强的数据分析能力，能够通过流量、留存、转化、用户行为等核心数据发现问题并制定优化策略；\n3、熟悉网站内容生态与SEO运营逻辑，对分类结构、标签体系、专题页、关键词布局、搜索流量增长等有实战经验；\n4、具备较强的热点敏感度与内容判断能力，能够结合行业趋势快速制定内容运营方向与传播策略；\n5、具备网站整体运营能力，包括内容规划、用户增长、频道优化、活动策划、社区氛围等模块；\n6、具备较强的产品协同意识，能够推动前端、后端、UI、产品等团队进行功能优化与运营迭代；\n7、熟悉 Google Analytics、Search Console 等数据工具，有搜索引擎流量增长经验优先；\n8、具备良好的内容审美与文案能力，对页面布局、标题、封面、专题呈现有较强把控能力；\n9、具备较强执行力、抗压能力与团队管理意识，能够独立推进项目落地。                                                                                                                                                                                                                                                                                                                     \"1、负责网站整体运营工作，包括内容运营、用户增长、SEO优化、频道规划及数据增长目标；\n2、制定网站分类、标签、专题、搜索页等内容策略，提升网站流量、用户留存与转化效率；\n3、负责热点内容方向制定与运营节奏把控，结合行业趋势快速推动内容上线与传播；\n4、定期对网站数据进行复盘，包括流量来源、搜索关键词、用户行为、转化路径等，并输出优化方案；\n5、负责网站内容生态优化，提升内容质量、用户互动、社区活跃度与用户粘性；\n6、协助产品与技术团队推动功能迭代，包括推荐机制、搜索优化、内容分发、用户体验等方向；\n7、跟踪行业及竞品动态，持续优化网站运营策略与增长模型；\n8、参与重点项目推进，包括专题活动、频道改版、内容增长、流量承接及商业化优化等。\"", "cat": "运营"}, {"id": "148", "title": "初级运营专员", "salary": "8K-10K", "location": "未明确", "jd": "\"\n2年以上运营经验，专科及专科以上学历\n熟练掌握办公自动化软件。\n熟练掌握数据分析和处理能力，能够对项目数据进行跟踪和分析。\n优秀的文笔写作能力，文案策划能力。\n良好的服务意识，优秀的分析、沟通、协调、谈判能力，团队合作精神佳。\n具备强烈的责任心及较好的职业素养，工作踏实、耐心细致。\n会图片处理、编辑能力（如：PR、PS、Canva、剪映）。\"\"负责公司新媒体平台（包括但不限于抖音、小红书、快手、youtube、tiktok、facebook等）的运营和推广，提升公司产品曝光和知名度，增强公司在新媒体领域的影响力。\n负责新媒体平台的内容策划、撰写、编辑和发布，确保内容质量和风格符合公司品牌形象和市场需求。\n根据公司业务和产品特点，制定并实施新媒体平台的数据分析、运营策略和内容计划，包括但不限于粉丝增长、阅读量提升等。\n与公司内部团队保持紧密沟通，跟踪、分析平台运营数据，提出优化建议，并提高新媒体、流量运营能力。\"", "cat": "运营"}, {"id": "149", "title": "初级运营专员", "salary": "8K-10K", "location": "1、大专及以上学历，3年以上网站运营或平台运营经验，具备成熟的网站运营体系思维；.会制作AI视频、懂AI短剧内容形式者优先。\n 2、具备较强的数据分析能力，能够通过流量、留存、转化、用户行为等核心数据发现问题并制定优化策略；\n 3、熟悉网站内容生态与SEO运营逻辑，对分类结构、标签体系、专题页、关键词布局、搜索流量增长等有实战经验；\n 4、具备较强的热点敏感度与内容判断能力，能够结合行业趋势快速制定内容运营方向与传播策略；\n 5、具备网站整体运营能力，包括内容规划、用户增长、频道优化、活动策划、社区氛围等模块；\n 6、具备较强的产品协同意识，能够推动前端、后端、UI、产品等团队进行功能优化与运营迭代；\n 7、熟悉 Google Analytics、Search Console 等数据工具，有搜索引擎流量增长经验优先；\n 8、具备良好的内容审美与文案能力，对页面布局、标题、封面、专题呈现有较强把控能力；\n 9、具备较强执行力、抗压能力与团队管理意识，能够独立推进项目落地。", "jd": "1.会制作AI视频、懂AI短剧内容形式者优先。\n2.负责网站日常运营管理，包括内容更新、资源发布、分类维护、页面巡检，保障网站稳定运营。\n3.根据运营规划完成视频、图文等内容的编辑、发布及优化，持续提升内容质量和用户体验。\n4.负责站外推广工作，包括网站运营、TG频道发布、外链建设、自媒体内容发布等，提升网站曝光及用户增长。\n5.根据运营数据分析用户行为及内容表现，持续优化标题、关键词、推荐位及运营策略，提高用户活跃度和转化效果。\n6.负责网站日常巡检，检查页面展示、视频播放、广告位、链接跳转等功能，发现异常及时反馈并跟进处理。\n7.配合团队完成运营活动策划、项目推进及其他临时性工作，确保各项运营目标顺利达成。", "cat": "运营"}, {"id": "150", "title": "初级运营专员", "salary": "8K-10K", "location": "未明确", "jd": "重点筛选有 App、盒子、视频、动漫、小说、社区、内容平台等基础运营经验的候选人；关注是否具备内容发布、素材整理、链接维护、后台配置、数据填报、用户反馈处理、活动配置等实际执行经验；优先考虑熟悉 Excel、飞书表格、运营后台、数据整理工具的候选人；关注候选人是否具备基础数据意识，能看懂点击、安装、活跃、充值、内容更新量等基础指标；重点评估执行力、细心程度、任务稳定交付能力、沟通反馈意识和多任务处理能力；有 AI 工具或自动化工具使用经验，能够提升基础工作效率者优先。\"岗位职责：负责 App、盒子等项目的日常基础运营工作，包括内容发布、素材整理、群组维护、页面检查、后台配置更新等，确保产品内容正常上线和展示；负责每日运营数据整理与填报，包括流量、点击、安装、活跃、充值、内容更新等基础数据，及时发现异常并反馈；负责官网、落地页、外部链接、推广链接等基础检查与维护，定期测试链接连通性，发现失效、跳转异常、无法访问等问题及时登记并跟进处理；协助收集用户反馈、群组问题、产品异常、播放异常、支付异常等信息，按照流程整理并同步相关负责人，推动问题闭环；根据运营需求，协助完成会员活动、充值活动、弹窗、Push、站内信、广告位等基础配置和上线检查；根据项目需求完成视频、漫画、小说、图片、专题等内容更新工作，并配合执行拉新、活跃、召回等基础运营动作；按要求完成日报、周报及任务进度汇报，对完成事项、异常问题、处理进度和次日计划进行清晰记录。\n\n核心考核指标：每日内容发布数量、链接检查数量、配置执行完成率、任务准时完成率；日报数据、内容数据、链接数据、异常记录的准确率和完整度；异常发现及时性、问题记录规范度、问题跟进闭环率；日常运营任务处理速度、重复性任务完成效率、跨项目协作配合度；内容更新稳定性、产品基础活跃数据、用户反馈处理质量、运营动作执行效果。\n\n任职要求：执行力强，能按照要求完成日常运营任务，具备责任心和时间意识，能够保证任务稳定交付；细心认真，对数据、链接、内容、配置等基础工作有耐心，能够及时发现问题并准确记录；学习能力强，愿意学习产品后台、数据表格、AI 工具、自动化工具等基础运营工具，能快速适应新的工作流程；沟通反馈及时，遇到问题能够主动反馈，能配合组长及相关部门推进问题处理；具备基础数据意识，能看懂点击、安装、活跃、充值、内容更新量等基础运营数据，并能根据数据变化发现简单问题；能适应多项目、多任务并行的工作节奏，具备较好的稳定性和团队配合意识。\"", "cat": "运营"}, {"id": "151", "title": "渠道拓展专员", "salary": "15K-25K", "location": "要求人在海外", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "商务 / 市场"}, {"id": "152", "title": "新媒体运营", "salary": "10K-25K", "location": "未明确", "jd": "【岗位职责】\n负责 X/Twitter 账号矩阵的搭建与运营，包括主号、内容号、引流号、垂类号、互动号等账号定位、内容发布、互动涨粉和流量承接。\n\n熟悉 X/Twitter 平台规则、内容分发机制、账号成长逻辑和风控边界，能制定适合中文用户的起号、涨粉、引流和转化策略。\n\n根据业务方向持续产出适合 X/Twitter 传播的内容，包括热点推文、话题内容、互动内容、引流内容、图片包装、短视频二创等。\n\n负责账号数据复盘，关注曝光量、互动率、涨粉数、点击率、进群率、留存和转化等指标，并根据数据优化内容和账号策略。\n\n持续拆解竞品账号和同类玩法，沉淀可复用的内容模型、起号方法、矩阵联动方式和运营 SOP。\n\n配合 Telegram 频道或社群完成用户沉淀、内容分发和转化承接。\n\n【任职要求】\n具备 3 年以上新媒体运营、账号运营、内容运营或流量增长经验。\n\n必须有 X/Twitter 矩阵账号成功运营经验，熟悉多账号定位、协同、互推、引流和承接方式。\n\n深谙 X/Twitter 平台规则，包括内容分发、账号权重、互动玩法、限流机制、风控边界和账号安全。\n\n有可验证的运营成绩，例如成功起号、矩阵增长、爆款推文、涨粉、曝光、互动、进群或转化数据。\n\n具备较强内容能力，能独立完成选题、文案、标题、配图、短视频包装、发布和复盘。\n\n对数据敏感，能通过数据判断内容效果，并持续优化发帖节奏、内容方向和账号定位。\n\n能接受成人 / 泛娱乐相关内容方向，了解该类内容在 X/Twitter、Telegram 等平台上的传播方式、尺度边界和账号风险。\n\n【投递要求】\n投递时请务必提供：\n过往运营的 X/Twitter 账号或矩阵案例；\n账号增长数据，如粉丝数、曝光量、互动率、转化数据等；\n至少 1 个从 0 到 1 起号或矩阵运营案例；\n说明你在项目中具体负责的部分。\n无真实账号案例、无作品、无数据证明者暂不考虑。\n\n【加分项】\n熟悉 Telegram 频道或社群承接；\n有 X Ads、Meta Ads 等投放经验；\n会使用 AI 工具提升内容生产效率；\n熟悉中文成人 / 泛娱乐流量生态、平台风控和跳转链路。", "cat": "运营"}, {"id": "153", "title": "AI 应用 Golang 后端工程师", "salary": "20k-30k", "location": "沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。", "jd": "一、招聘要求\n\n【硬性要求】\n\n学历/经验：本科及以上学历，5 年以上后端开发经验，计算机相关专业优先。\n\n主力语言：Golang 为主（精通）；PHP 能读能改（能维护存量业务、参与迁移）。\n\nAI 开发（核心）：有大模型（LLM）应用落地经验，包括接入 OpenAI / Claude 等大模型 API、\nPrompt 工程、RAG（向量检索问答）、Function Calling / Agent 编排、流式输出（SSE）。\n能把模型能力工程化成稳定、可控成本的线上服务。\n\n框架能力：熟悉 Gin / Go-Zero / Kratos 等 Go 框架，理解框架设计原理；\nPHP 侧了解 Laravel / ThinkPHP。\n\n数据库：精通 MySQL（表设计、索引优化、SQL 调优）；熟练 Redis（缓存 / 分布式锁 / 限流）；\n熟悉 Elasticsearch（索引设计、检索调优，向量检索加分）。\n\n容器与编排：熟练 Docker；有生产级 Kubernetes（k8s）使用经验；了解 k3s（轻量 / 边缘集群）加分。\n\n架构能力：熟悉微服务架构、分布式系统设计，有高并发项目实战经验。\n\n工具链：熟练使用 Git、Linux 环境，熟悉 CI/CD 流程。\n\n质量意识：具备良好的代码规范意识，熟悉单元测试、接口测试。\n\n沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。\n\n【加分项】\n- 有向量数据库经验（Milvus / Qdrant / pgvector / ES kNN）\n- 熟悉 LLMOps / 模型推理服务部署（vLLM、Ollama、Triton）\n- 有消息队列 / 大数据管道经验（Kafka 等）\n- 有开源贡献或技术博客", "cat": "AI / AIGC"}, {"id": "154", "title": "高级平面，高级UI", "salary": "14k-28k", "location": "未明确", "jd": "一、岗位职责 \n1.负责公司日常运营视觉设计输出，包括但不限于活动h5、海报、Banner、专题页、推广图、品牌宣传物料、节日活动图、社交媒体配图等； \n2.根据产品调性与品牌规范，完成产品logo、水印、启动页、落地页等产品上线所需物料，并按运营需求产出高质量视觉内容（活动弹窗、推广图、详情页等）； \n3.配合 Web / App 端界面视觉需求，参与设计规范（颜色、字体、间距、组件）的建立与维护； \n4.紧跟设计趋势与平台风格，持续优化视觉表现力，保障各渠道物料风格统一、调性一致。 \n二、任职要求 \n1.3 年以上平面 / 视觉设计经验，作品具备良好审美、创意与商业落地能力； \n2.熟练使用 Photoshop、Illustrator、Figma 等主流设计工具，具备良好的规范意识与执行力； \n3.熟练使用 AI 设计工具（Midjourney / ChatGPT / Stable Diffusion 等）辅助创意生成与设计提效； \n4.对色彩、版式、字体有较强把控力，能独立完成从创意到落地的完整设计； \n5.能高效配合运营、策划、产品等部门，在较快节奏下完成需求并根据反馈及时迭代优化。 \n作品集要求（投递必附）：请随简历附上近期作品集（PDF 或链接），需包含运营类视觉设计案例（活动页、Banner、弹窗等）及品牌logo / 产品物料案例。", "cat": "设计"}, {"id": "155", "title": "远程中高级运营专员", "salary": "10-15k", "location": "远程中高级运营专员", "jd": "远程中级运营专员\n\n人数：1名\n\n\n【岗位职责】\n\n- 视频资源统筹与处理： 负责视频站每日内容的生命周期管理，包括视频上架、标签分类、标题与描述优化、封面质检等；熟练使用剪映等工具，对原始视频资源进行剪辑、去重或二次包装处理。\n    \n- 帖子板块运营： 负责网站资讯板块的日常高频更新。密切追踪全网热点与“吃瓜”情报，快速产出自带流量与讨论度的图文帖子；同时针对站内核心视频，撰写逻辑清晰、引人入胜的图文剧情解说帖。\n    \n- SEO优化与AI工具应用： 熟练运用AI文本大模型辅助撰写高点击率文案，利用AI生图工具制作精美吸睛的封面。负责站内SEO的深度优化，包括但不限于关键词矩阵布局、H2/H3标签规范、图片ALT属性完善及内链网络搭建；定期拓展高质量外部链接与友情链接，提升网站整体搜索引擎权重与自然搜索流量。\n    \n- 网站健康监测与数据复盘： 每日进行网站常规巡检（如404死链排查、页面加载状态、视频播放连通性等）；熟练使用各类站长统计工具，追踪UV/PV、跳出率及用户停留时长，输出数据报告并指导内容策略调整。\n    \n- 全域内容分发： 将站内优质图文与视频内容矩阵化分发至外部平台，构建外部流量池，实现多渠道引流。\n    \n- 工作流自动化： 具备强烈的效率意识，能够梳理日常的巡检、发帖、分发等重复性工作，借助AI工具、自动化脚本或现有系统能力，将其转化为自动化操作，持续提升人效。\n\n\n【任职要求】\n\n- 学历与经验： 大专及以上学历，1-2年以上内容运营、网站运营或新媒体相关经验。有视频网站或泛娱乐资讯平台运营经验者优先。\n    \n- 深入了解SEO机制： 熟悉主流搜索引擎的收录与排名规则，有实际的白帽SEO实操经验（不仅限于内容排版，需懂内链逻辑、外链建设及基础的代码级SEO优化）。\n    \n- 网感与内容把控： 冲浪在一线的“吃瓜”达人和重度社交媒体用户，对全网热梗、八卦资讯极度敏感，能第一时间响应并产出内容；具备优秀的视觉审美，对帖子排版、封面配色有较强的判断力。\n    \n- 加分项： 熟悉或能快速上手各类自动化工具（如批量分发、监控告警），懂得如何通过非人工模拟的方式（如API接口思维）解决机械性任务者优先。", "cat": "运营"}, {"id": "156", "title": "远程初级运营专员", "salary": "8-12k", "location": "远程初级运营专员", "jd": "远程初级运营8-12k\n\n人数：3\n\n岗位职责\n\n1. 内容管理与优化：\n\n内容筛选： 负责视频资源的采集、筛选与审核，确保视频画质高清、分类准确（标签化管理）。\n\n文案撰写： 为视频撰写吸引人的标题和描述（SEO优化），提升搜索权重和点击率。\n\n内容排期： 策划每日/每周的推荐内容，优化首页布局，提高用户点击率。\n\n2. 流量获取与增长：\n\n渠道推广： 负责在社交媒体（Twitter/X, Telegram, Reddit, Instagram等）进行内容分发，引导流量回流。\n\nSEO/ASO优化： 研究成人关键词趋势，通过关键词优化提升搜索引擎自然排名。\n\n活动策划： 策划节日或热点相关的专题活动，提升新用户注册率。\n\n3. 用户增长与留存：\n\n社群运营： 管理用户社群/评论区，引导用户互动，收集用户对内容的需求反馈。\n\n数据分析： 监控日活(DAU)、留存率、跳出率等核心指标，分析用户观看习惯，优化内容推送逻辑。\n\n4. 竞品分析：持续追踪国内外主流AV站点的功能更新、内容趋势和营销手段，并提出改进建议。\n\n  \n\n任职要求\n\n\n1. 基本素质：\n\n心态开放： 对成人内容持开放、专业的态度，能够客观地面对并处理各类色情影像资料。\n\n审美能力： 对“好内容”有敏锐的感知力，知道什么样的封面和标题能吸引用户。\n\n2. 专业能力：\n\n运营经验： 1-3年互联网运营经验（有视频平台、社交平台或成人行业经验者优先）。\n\n工具使用： 熟练使用基础的图像/视频剪辑工具（如剪映、PR），熟练使用AI生图制作精美的封面。\n\n\nSEO基础： 了解基础的SEO逻辑，懂得如何利用关键词获取流量。\n\n3. 加分项：\n\n是资深的成人内容消费者，对各类片商、演员、流派有深入了解。\n\n熟悉Telegram Bot或自动化营销工具。\n\n有过从0到1搭建流量池的成功经验。", "cat": "运营"}, {"id": "157", "title": "商务专员", "salary": "10k-30k", "location": "未明确", "jd": "岗位职责\n1.  负责公司广告资源位（含APP、网站、盒子等各类流量渠道）的商务拓展与客户开发，通过多渠道（老客户转介绍、渠道资源、自主开发等）挖掘潜在广告主。\n2.  独立完成客户从初步接触、需求沟通、报价谈判到签约打款的全流程商务谈判，达成CPT/CPA/CPC/CPS等多种计费模式的合作。\n3.  负责存量客户的续费维护，跟进客户投放效果、及时处理客户异议，提升客户续费率与客单价。\n4.  根据公司月度/季度业绩目标，制定个人拉新、续费、冲刺及兜底方案，并按时保质完成收款指标。\n5.  根据客户投放需求，跟进广告位上下架、素材更换、位置分配等日常执行工作，与相关部门协同对接，跟进需求落地进度。\n6.  及时、准确填报客户台账、日清日报、缺口冲刺表等业务数据表格，配合团队进行业绩复盘与风险预警。\n7.  运营、产品、审计等部门协同配合，处理客户投放中的异常情况，防范合规与舆情风险。\n\n任职要求\n1.  大专及以上学历，市场营销、商务管理等相关专业优先，也接受有相关行业经验的其他专业背景。\n2.  1年以上互联网广告、流量变现、渠道销售或相关商务拓展经验，有CPT/CPA/CPC/CPS等广告计费模式从业经验者优先。\n3.  具备较强的商务谈判能力和抗压能力，能够独立完成从客户开发到签约回款的全流程闭环。\n4.  沟通表达能力强，逻辑清晰，能准确把握客户诉求并快速给出应对方案。\n5.  数据敏感度高，能够熟练使用Excel等办公软件进行业绩数据整理与分析。\n6.  责任心强、目标导向，能承受一定的业绩压力，认同\"结果导向\"的团队文化。\n7.  具备良好的职业操守，能够严格遵守公司合规要求，无违规操作记录。\n\n加分项\n•  有成熟的广告主/渠道资源，具备快速起量能力。\n•  熟悉App、网站等流量渠道的广告位商务合作，了解广告主的谈判逻辑与合作模式者优先。", "cat": "商务 / 市场"}, {"id": "158", "title": "SEO专员", "salary": "10k-15k", "location": "未明确", "jd": "岗位职责\n负责网站 SEO 内容运营，围绕核心业务、用户搜索需求及关键词布局制定内容策略，持续提升网站自然搜索流量、关键词排名及用户转化。\n负责 SEO 内容生产与优化，包括文章、专题、分类页、聚合页等内容的策划、撰写、编辑及审核，优化 Title、Description、H 标签、正文结构、内链等页面 SEO 要素。\n负责关键词及搜索需求挖掘，结合 Google 及行业平台分析用户搜索意图，建立关键词库，并根据搜索量、竞争度、相关性及转化价值制定内容生产计划。\n负责网站内容结构优化，定期分析网站分类、标签、专题及内容页面表现，优化栏目架构、内容聚合及内链策略，提升页面收录效率与站内权重传递。\n负责网站外链建设与发布，能够自主寻找行业相关、质量较高的外链资源，通过内容投稿、资源合作、行业网站、社区等渠道持续获取有效外链，并对外链质量及效果进行跟踪。\n持续跟踪 SEO 数据表现，通过 GA4、Google Search Console 等工具监控自然流量、关键词排名、收录、曝光、CTR、用户行为及转化数据，定期进行数据复盘并制定优化方案。\n关注行业趋势及热点内容，快速挖掘具有搜索增长潜力的话题和关键词，结合热点生命周期及时产出内容，获取趋势搜索流量。\n协同产品及技术团队推进 SEO 优化，根据数据及用户搜索行为发现网站问题和增长机会，推动页面模板、站点结构、用户体验及相关功能持续优化。\n负责竞品 SEO 分析，持续跟踪竞品关键词布局、流量页面、内容策略、网站结构及外链情况，分析竞品优质外链来源，挖掘可复制的外链及内容增长机会。\n探索 AI + SEO 内容生产工作流，利用 AI、自动化工具提升关键词研究、内容策划、内容生产、优化及数据分析效率。", "cat": "运营"}, {"id": "159", "title": "AI短剧制作", "salary": "10-25k", "location": "未明确", "jd": "1.负责AI短剧选题策划与剧本创作，把控故事节奏、人设和情感钩子，确保内容符合平台调性及用户偏好；\n2.运用AI视频生成工具完成分镜设计与画面生成，保证画面质量、角色一致性和叙事连贯性；\n3.独立完成短剧的剪辑、配音配乐、特效包装及成片输出，把控成片节奏和情绪表达；\n4.跟踪AI视频生成、语音合成、图像处理等相关工具及模型的更新迭代，持续优化制作流程，提升出片效率与质量；\n5.关注短剧行业内容趋势及爆款案例，结合数据反馈迭代选题方向和制作手法；\n6.配合项目排期，独立或协同完成从选题到成片的全流程产出，对内容质量和产出效率负责。\n任职要求\n1.大专及以上学历，影视、传媒、编导、新媒体等相关专业优先；\n2.1年以上短视频/短剧内容制作经验，有AI短剧视频制作经验者优先；\n3.熟练使用至少一种AI视频生成工具及Pr、剪映等剪辑软件；\n4.具备较强的故事策划与文案能力，能独立完成剧本创作或改编；\n5.对AI内容生成工具敏感度高，学习能力强，能快速掌握新工具新玩法；\n6.责任心强，能承受一定的产出节奏和排期压力，具备良好的时间管理能力。\n加分项\n1.有短剧平台过稿或爆款作品案例；\n2.有独立账号运营或内容数据分析经验。", "cat": "AI / AIGC"}, {"id": "160", "title": "渠道运营专员", "salary": "15-25k", "location": "未明确", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "商务 / 市场"}, {"id": "161", "title": "AI 应用 Golang 后端工程师", "salary": "20k-30k", "location": "沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。", "jd": "一、招聘要求\n\n【硬性要求】\n\n学历/经验：本科及以上学历，5 年以上后端开发经验，计算机相关专业优先。\n\n主力语言：Golang 为主（精通）；PHP 能读能改（能维护存量业务、参与迁移）。\n\nAI 开发（核心）：有大模型（LLM）应用落地经验，包括接入 OpenAI / Claude 等大模型 API、\nPrompt 工程、RAG（向量检索问答）、Function Calling / Agent 编排、流式输出（SSE）。\n能把模型能力工程化成稳定、可控成本的线上服务。\n\n框架能力：熟悉 Gin / Go-Zero / Kratos 等 Go 框架，理解框架设计原理；\nPHP 侧了解 Laravel / ThinkPHP。\n\n数据库：精通 MySQL（表设计、索引优化、SQL 调优）；熟练 Redis（缓存 / 分布式锁 / 限流）；\n熟悉 Elasticsearch（索引设计、检索调优，向量检索加分）。\n\n容器与编排：熟练 Docker；有生产级 Kubernetes（k8s）使用经验；了解 k3s（轻量 / 边缘集群）加分。\n\n架构能力：熟悉微服务架构、分布式系统设计，有高并发项目实战经验。\n\n工具链：熟练使用 Git、Linux 环境，熟悉 CI/CD 流程。\n\n质量意识：具备良好的代码规范意识，熟悉单元测试、接口测试。\n\n沟通能力：远程办公环境下具备良好的文档协作与异步沟通能力。\n\n【加分项】\n- 有向量数据库经验（Milvus / Qdrant / pgvector / ES kNN）\n- 熟悉 LLMOps / 模型推理服务部署（vLLM、Ollama、Triton）\n- 有消息队列 / 大数据管道经验（Kafka 等）\n- 有开源贡献或技术博客", "cat": "AI / AIGC"}, {"id": "162", "title": "AI短剧制作", "salary": "10-25k", "location": "未明确", "jd": "1.负责AI短剧选题策划与剧本创作，把控故事节奏、人设和情感钩子，确保内容符合平台调性及用户偏好；\n2.运用AI视频生成工具完成分镜设计与画面生成，保证画面质量、角色一致性和叙事连贯性；\n3.独立完成短剧的剪辑、配音配乐、特效包装及成片输出，把控成片节奏和情绪表达；\n4.跟踪AI视频生成、语音合成、图像处理等相关工具及模型的更新迭代，持续优化制作流程，提升出片效率与质量；\n5.关注短剧行业内容趋势及爆款案例，结合数据反馈迭代选题方向和制作手法；\n6.配合项目排期，独立或协同完成从选题到成片的全流程产出，对内容质量和产出效率负责。\n任职要求\n1.大专及以上学历，影视、传媒、编导、新媒体等相关专业优先；\n2.1年以上短视频/短剧内容制作经验，有AI短剧视频制作经验者优先；\n3.熟练使用至少一种AI视频生成工具及Pr、剪映等剪辑软件；\n4.具备较强的故事策划与文案能力，能独立完成剧本创作或改编；\n5.对AI内容生成工具敏感度高，学习能力强，能快速掌握新工具新玩法；\n6.责任心强，能承受一定的产出节奏和排期压力，具备良好的时间管理能力。\n加分项\n1.有短剧平台过稿或爆款作品案例；\n2.有独立账号运营或内容数据分析经验。", "cat": "AI / AIGC"}, {"id": "163", "title": "远程用户增长运营｜二次元方向", "salary": "10-20k", "location": "远程用户增长运营｜二次元方向", "jd": "### 岗位介绍\n\n负责平台用户增长工作，围绕拉新、活跃、留存、召回、内容消费深度和用户口碑传播，搭建可持续的增长策略与运营机制，提升网站日活、访问频次、作品阅读/观看完成率和核心用户规模。\n### 岗位职责\n\n1. 制定并执行用户增长策略，围绕新用户获取、访问激活、日活提升、留存提升、用户召回和内容消费深度，持续提升平台用户规模与用户质量。\n    \n2. 结合二次元内容消费场景和目标用户画像，策划拉新活动、裂变机制、内容专题、追更机制、用户召回方案和站外传播玩法。\n    \n3. 深入理解二次元用户的内容偏好、追更习惯、互动方式、圈层语言、审美倾向和情绪需求，为内容策划、活动设计和产品优化提供方向。\n    \n4. 与内容、产品、数据、投放、设计等团队协作，优化新用户引导流程、作品推荐链路、追更提醒、首页内容分发、榜单机制和关键访问路径。\n    \n5. 建立用户分层运营体系，针对新用户、活跃用户、沉默用户、高频用户、核心粉丝用户和内容传播用户制定差异化运营策略。\n    \n6. 跟踪和分析核心增长数据，包括新增用户、DAU、WAU、访问频次、次日/7 日/30 日留存、作品点击率、阅读/观看完成率、追更率、分享率、召回率、CAC、ROI 等，输出数据洞察和优化建议。\n    \n7. 策划并落地线上增长活动，包括作品专题、角色活动、追更福利、邀请奖励、节日活动、社区互动活动、站外话题传播活动等。\n    \n8. 关注二次元、漫画、漫剧、短剧、轻小说、动画、虚拟偶像、内容社区和免费内容平台趋势，持续挖掘新的增长机会。\n    \n9. 沉淀增长方法论、活动复盘、渠道评估模型、用户分层策略和内容运营 SOP，提升团队整体增长效率。\n    \n\n### 任职要求\n\n1. 2 年以上用户增长、用户运营、内容运营、社群运营、广告投放或平台增长相关经验。\n    \n2. 熟悉内容平台、漫画平台、漫剧平台、视频产品、社区产品、免费内容站或泛娱乐产品的用户增长逻辑。\n    \n3. 深度理解二次元/ACG 圈层文化，熟悉该圈层用户类型、内容偏好、消费习惯、社交方式、传播习惯和内容审美。\n    \n4. 最好本身就是二次元内容深度用户，对漫画、漫剧、动画、轻小说、同人文化、角色人设、CP、爽点、剧情节奏和圈层梗有真实兴趣和判断力。\n    \n5. 对原创漫剧内容有较强敏感度，能够判断什么样的题材、人设、画风、剧情冲突、更新节奏、标题封面和运营包装更容易吸引用户持续访问。\n    \n6. 具备内容运营和内容策划能力，能够结合用户需求和平台定位，提出选题方向、作品专题、角色运营、追更机制和站外传播玩法。\n    \n7. 具备产品运营思维，能够从用户路径、内容推荐、首页分发、榜单设计、追更提醒、收藏机制、分享机制、页面呈现和访问体验等角度提出优化建议。\n    \n8. 数据意识强，能够通过数据发现问题、验证策略，并持续优化增长动作。\n    \n9. 自驱力强，适应远程协作，能独立推进项目并对结果负责。\n    \n\n### 加分项\n\n1. 有二次元社区、漫画平台、漫剧平台、小说平台、短剧平台、内容社区或免费内容站运营经验。\n    \n2. 有相关圈层长期观察、社群参与或内容策划经验，能够准确理解用户语言、审美和真实需求。\n    \n3. 有从 0 到 1 搭建增长渠道、活动体系、用户留存体系或内容分发策略的经验。\n    \n4. 熟悉 B 站、小红书、抖音、快手、微博、QQ 群、贴吧、Discord、Telegram 等平台的二次元内容传播玩法。\n    \n5. 熟悉免费内容平台的增长逻辑，包括 SEO 流量、社群传播、内容专题、榜单推荐、追更提醒、用户收藏、站外引流和自然裂变。", "cat": "商务 / 市场"}, {"id": "164", "title": "视频编辑", "salary": "8-12k", "location": "未明确", "jd": "一、视频编辑\n岗位职责：\n1、负责网站、自媒体平台日常内容编辑、帖子发布、视频文案剪辑输出，完成内容更新与日常维护，保障内容更新频次与基础质量。\n2、具备基础 SEO 认知，了解关键词优化、内容收录、基础外链布局等工作，协助团队提升平台自然流量与搜索排名。\n3、跟踪行业热点、平台热门话题，配合产出符合平台调性、具备传播性的图文及短视频内容。\n4、协助内容审核、内容修改优化，保证所有上线内容合规、准确、可读性强。\n5、跟进竞品内容动态与运营方式，整理基础竞品信息，配合团队完成优化迭代。\n任职要求：\n1、大专及以上学历，2年以上内容运营、自媒体编辑、网站运营相关经验。\n2、了解 SEO 基础原理、自媒体运营规则、外链基础玩法，有相关平台实操经验优先。\n3、具备良好文案能力，可独立撰写图文、帖子、短视频文案，适配多种内容形式。\n4、具备基础审美，能完成简单图片、视频剪辑处理，熟练使用 PS、PR 等基础工具优先。\n5、具备基础数据分析意识，执行力强，学习能力强，能快速跟进热点并落地内容产出。\n6、做事细致负责，具备良好的内容合规意识与团队协作能力。\n7、熟悉 AI 内容工具、自动化运营、Agent 任务拆解者优先，有 OpenClaw 框架项目经验优先。", "cat": "内容"}, {"id": "165", "title": "用户增长运营（男同向）", "salary": "10-20k", "location": "未明确", "jd": "## 远程用户增长运营｜男同向\n\n### 岗位介绍\n\n负责男同视频平台用户增长工作，围绕拉新、激活、留存、召回、付费转化和复购，搭建可持续的增长策略与运营机制，提升核心用户规模、用户活跃度和商业转化效率。\n\n### 岗位职责\n\n1. 制定并执行用户增长策略，围绕注册、激活、留存、付费、复购等关键环节，持续提升用户规模与用户质量。\n    \n2. 结合男同内容消费场景和目标用户画像，策划拉新活动、裂变机制、会员转化活动、内容分发策略和用户召回方案。\n    \n3. 深入理解男同用户的内容偏好、消费习惯、情绪需求和社区互动方式，为内容策划、活动设计和产品优化提供方向。\n    \n4. 与内容、产品、数据、投放、设计等团队协作，优化新用户引导流程、会员购买路径、内容推荐链路和关键转化页面。\n    \n5. 建立用户分层运营体系，针对新用户、活跃用户、沉默用户、付费用户和高价值用户制定差异化运营策略。\n    \n6. 跟踪和分析核心增长数据，包括新增、活跃、留存、转化、ARPU、LTV、CAC、ROI 等，输出数据洞察和优化建议。\n    \n7. 策划并落地线上增长活动，包括会员促销、限时权益、邀请奖励、内容专题、节日活动、社区互动活动等。\n    \n8. 关注男同视频、成人内容、LGBTQ+社区、短视频、订阅制产品和内容平台趋势，持续挖掘新的增长机会。\n    \n9. 沉淀增长方法论、活动复盘、渠道评估模型和用户运营 SOP，提升团队整体增长效率。\n    \n\n### 任职要求\n\n1. 2 年以上用户增长、用户运营、内容运营、社群运营、广告投放或平台增长相关经验。\n    \n2. 熟悉内容平台、视频产品、社区产品、会员订阅产品或泛娱乐产品的用户增长逻辑。\n    \n3. 深度理解男同/LGBTQ+社群文化，熟悉该圈层用户类型、内容偏好、消费习惯、社交方式和付费心理。\n    \n4. 对男同向原创视频内容有较强兴趣和敏感度，能够判断什么样的内容、题材、人物设定和运营包装更容易吸引用户。\n    \n5. 具备内容策划能力，能够结合用户需求和平台定位，提出选题方向、内容专题、会员权益和活动玩法。\n    \n6. 具备产品运营思维，能够从用户路径、会员转化、内容推荐、页面呈现、付费节点等角度提出优化建议。\n    \n7. 数据意识强，能够通过数据发现问题、验证策略，并持续优化增长动作。\n    \n8. 自驱力强，适应远程协作，能独立推进项目并对结果负责。\n    \n\n### 加分项\n\n1. 有男同/LGBTQ+社区、成人内容平台、视频站、订阅制产品或私域社群运营经验。\n    \n2. 有相关圈层长期观察、社群参与或内容策划经验，能够准确理解用户语言、审美和真实需求。\n    \n3. 有从 0 到 1 搭建增长渠道、会员体系、活动体系或用户分层运营体系的经验。\n    \n4. 熟悉海外或国内男同内容平台、成人内容平台、短视频平台和社群流量玩法。", "cat": "商务 / 市场"}, {"id": "166", "title": "新媒体运营", "salary": "10-15K", "location": "未明确", "jd": "一、岗位定位\n负责品牌在海外/外网平台的内容运营与传播执行，围绕品牌曝光、用户触达、内容引流及社群沉淀，推动外网传播体系搭建与持续优化。\n二、岗位职责\n1. 负责 Twitter、Instagram、Telegram 等外网平台的日常内容运营与账号维护。\n2. 围绕品牌传播、用户增长和产品引流目标，策划并执行外网内容发布及互动运营。\n3. 跟踪平台数据表现，持续优化内容方向、发布时间及互动策略。\n4. 结合社群、KOC/KOL、渠道合作等形式，提升品牌曝光和用户引流效率。\n5. 熟悉平台风险边界，在合规前提下推进内容传播与引流动作。\n\n三、任职要求\n1. 3年以上海外社媒、外网运营或出海内容平台相关经验。\n2. 熟悉 Twitter、Instagram、Telegram 等平台规则、调性及传播机制。\n3. 具备明确的引流意识，有账号引流、社群沉淀或转化承接经验。\n4. 执行力强，具备良好的数据分析能力、协作沟通能力和推动落地能力。\n\n四、加分项\n1. 有成人行业、情趣用品、两性健康品牌或二次元品牌相关经验。\n2. 有外网 KOL/KOC、社群、媒体或渠道合作资源。\n3. 有从0到1搭建外网账号矩阵或引流体系经验。\n4. 对用户参与机制、活动传播链路和品牌互动方式有较强洞察。", "cat": "运营"}, {"id": "167", "title": "中级运营（成人网站/app）", "salary": "15K", "location": "未明确", "jd": "一、岗位职责\n\n1.负责成人产品全链路运营，包括但不限于内容规划、上架、推广、用户留存、付费转化等；\n2.制定并执行内容分发策略、营销活动（含节日活动、限时福利、联动推广等），提升 DAU、留存率与 ARPU；\n3.监控数据表现（GMV、转化率、流失率、LTV 等），定期输出运营报告并提出优化建议；\n4.协调内容制作团队、美术资源、外部渠道，保障内容按计划高质量上线；\n5.挖掘用户需求，策划 UGC 激励机制、社区活动，提升用户粘性与口碑；\n6.探索 AI 工具在内容生成、翻译、本地化、营销素材制作、数据分析等方面的应用（此为重要加分方向）；\n7.跟进竞品动态，参与新功能、新产品线的运营规划。\n\n二、任职要求\n\n经验要求：本科及以上学历，2-4 年成人产品运营经验，有成人内容、动漫、二次元、游戏或付费订阅产品运营经验者优先；\n\n三、能力要求\n1.对成人产品，成人动漫有较深了解和真实热爱，熟悉用户喜好与敏感点；\n2.具备较强的数据分析能力和商业敏感度，能用数据指导运营决策；\n3.文案能力强，创意执行力好，懂用户心理；\n4.良好的跨团队沟通协调能力，能推动多方资源落地；\n\n四、加分项（重点）\n熟悉主流 AI 工具有实际应用经验；\n有 AI 工作流搭建、AI 辅助内容生产或 AI 营销经验；\n英语或日语能力较强（便于海外推广及资源对接）；\n有海外流量渠道运营经验。", "cat": "运营"}, {"id": "168", "title": "中级运营（成人网站/app）", "salary": "10-18k", "location": "未明确", "jd": "岗位名称： 运营专员（中高级）\n级别：中高级\n需求量： 2人\n薪酬范围： 10–18K/月\n是否紧急：是\n简历筛选要点： 必须有3-5年成人行业工作经验以及独立运营落地产品经验\n\n一、岗位定位\n负责成人内容产品的增长与运营工作，围绕用户新增、留存、内容消费及付费转化等核心指标，推动产品从内容供给、用户运营到商业化变现的全链路增长。\n二、岗位职责\n参与新产品/新方向的冷启动与测试，能够快速验证内容方向及用户反馈，推动产品迭代优化。\n1.内容增长与策略执行：承接整体运营策略，围绕拉新、留存、转化、变现等核心指标推进落地。\n2.持续优化内容结构，提升点击率、留存率及付费转化\n3.日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略\n4.内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，优化内容结构（封面、标题、前3秒、标签等关键环节）建立可复用的内容生产标准与方法论\n5.跨部门协作：与产品、技术、渠道等团队协同。推动内容相关功能优化与产品迭代\n6.竞品与行业趋势分析：持续关注成人内容行业、社区产品及AI方向动态，定期输出竞品分析及优化建议。\n\n任职要求\n1. 有3-5年成人行业工作经历。\n2.有完整参与或主导内容项目/产品从0到1或增长阶段的经验\n3.具备较强的数据分析能力（能独立拆解问题并提出策略）\n4.熟悉内容生产流程，具备内容判断与筛选能力\n5.执行力强，能推动事情落地，沟通能力强，能跨团队协作，抗压能力强，适应快节奏环境\n6.具备较强结果意识，对核心数据（新增、留存、转化、ROI等）负责\n7.具备独立推进项目能力，能够主动发现问题并推动解决\n\n加分项\n1.有内容变现/付费产品经验\n2.有小众主题/Ai/社区/UGC平台运营经验\n3.对用户心理和内容传播有敏锐洞察\n\n淘汰项\n1.执行被动、依赖安排\n2.数据敏感度弱\n3.无法适应快节奏及高迭代环境\n4.仅有传统内容搬运经验、缺少增长意识", "cat": "运营"}, {"id": "169", "title": "高级产品经理 （视频 & 社区方向)", "salary": "20-30k", "location": "未明确", "jd": "【岗位职责】\n1、产品规划。独立负责视频 / 社交产品从 0 到 1，完成市场与竞品分析、产品定位与内容形态选型、功能规划与版本节奏，对上线结果负责。\n2、方案输出。独立完成信息架构、页面流程、高保真可点原型、字段口径与状态分支设计，交付标准为 UI 与研发可直接开工。\n3、C 端设计。负责首页分发与频道、播放 / 阅读等核心二级页、搜索与榜单、UGC 发布与互动、消息与关系链，以及签到任务等留存机制的体验设计。\n4、后台设计。负责内容管理与审核、分类标签与推荐位配置、会员与付费配置、活动与任务、权限与风控，以运营效率为核心，具备批量处理能力。\n5、商业化。负责会员、虚拟币、单点解锁、广告位等付费模型与付费路径设计，对付费率、ARPU 与续费负责。\n6、数据体系。定义核心指标与字段口径（唯一指向真实界面元素或用户行为，并明确触发上报时机），输出埋点方案与统计看板，驱动版本迭代。\n7、项目推进。统筹 UI、研发、测试、运营、投放全流程协作，对需求还原度、上线质量与迭代节奏负责。\n【任职要求】（前三条为硬性门槛，不满足勿投）\n1、5 年以上产品经验，其中 3 年以上视频类或社交类 C 端产品；完整主导过至少 1 款从 0 到 1 上线的 App 或站点，可完整阐述定位决策、关键取舍与上线后数据表现。\n2、具备前后台独立交付能力，可由一人完成 C 端原型、运营后台原型与需求文档的全套输出，而非仅输出功能清单或承接需求转述。\n3、具备使用 AI 工具产出产品原型的实际经验，能够借助 AI 完成可交付级别的可点原型与需求文档。\n4、熟悉视频产品核心链路：片源 / 剧集 / 章节的内容模型与后台管理、播放体验、试看与付费墙机制；短剧、长视频、短视频中至少主导过两种形态。\n5、熟悉社交产品核心链路：信息流分发与推荐位、UGC 发布与互动、IM 与关系链、内容审核与敏感词治理闭环。\n6、熟悉会员、虚拟币、单点解锁等付费体系设计，以及签到、任务、积分、活动等留存机制。\n7、具备数据驱动能力：可独立定义指标口径与埋点方案，依据漏斗与留存数据确定迭代优先级。\n8、熟练使用 Axure / Figma，需求文档结构清晰、逻辑闭环；具备 App、H5、Web 多端产品设计经验。\n9、具备独立决策能力与完整交付意识，对次留、付费率、ARPU 等核心指标直接负责。\n\n【加分项】\n· 有多产品矩阵 / 基座复用经验，具备通用模板化设计能力。\n· 有漫画、小说、动漫等多内容形态经验，参与过多品类聚合平台建设。\n· 有增长相关经验：渠道投放与归因、落地页转化、SEO、矩阵互导。\n\n面试需提供一个由本人主导的 0-1 项目作品，包含 C 端原型与运营后台方案各一份，并说明其中由 AI 产出的部分及具体使用方式。", "cat": "产品"}, {"id": "170", "title": "新媒体运营", "salary": "10-20k", "location": "1部5个、2部5个", "jd": "岗位职责\n1.负责国内及海外社媒平台账号运营（抖音、快手、小红书、视频号、微博、B站、TikTok、Instagram、Facebook、YouTube、X、Telegram等），完成账号起号、养号、内容发布及矩阵运营。\n2.围绕产品特点和平台调性，独立完成短视频、图文内容的选题、脚本、标题、封面及素材制作，内容方向包括吃瓜、话题、猎奇、擦边、短剧切片等。\n3.负责主页包装、评论区互动、私信承接、关键词布局、社群引导等引流工作，关注账号安全，降低限流和封号风险。\n4.跟踪账号数据（播放、互动、涨粉、私信、进群等），定期复盘并优化内容方向；关注竞品及平台规则变化，挖掘自然流量机会。\n5.配合产品、运营、商务团队完成活动宣传、素材测试及用户引导，沉淀可复用的内容打法和SOP。\n\n任职要求\n• 1年以上新媒体运营或账号孵化经验，熟悉至少1-2个主流社媒平台，有实际运营经验。\n• 有从0到1起号经验，有涨粉、引流或转化的实际案例。\n• 能独立产出内容——选题、脚本、标题、封面文案、图文、短视频。\n• 懂平台推荐机制和互动增长逻辑，清楚养号、内容测试、评论区维护、私信承接等基础玩法。\n• 了解平台违规边界，对内容尺度、擦边表达、导流方式有基本认知。\n• 执行力强，能适应多账号矩阵及快速测试的节奏。\n• 能接受成人行业方向。\n\n加分项\n• 有成人、擦边、吃瓜、情感、短剧号运营经验\n• 有海外平台（TikTok、IG、X、Telegram等）运营经验\n• 会使用AI工具（ChatGPT、AI图片、AI视频等）\n• 熟悉基础剪辑和图片处理", "cat": "运营"}, {"id": "171", "title": "内容运营", "salary": "7-15k / 月", "location": "8.22新增1名\n 多种工具；\n熟练使用剪映、Premiere、After Effects、达芬奇等剪辑软件；\n具备较强的剧情理解、分镜设计、镜头语言及画面审美能力；\n能够处理人物一致性、动作异常、镜头衔接及画面质量问题；\n能适应快速迭代、远程协作和稳定量产。\n\n优先条件\n有完整AI短剧成片及连续剧集制作经验；\n熟悉ComfyUI、LoRA、角色一致性和动作控制；\n有批量内容生产、平台发布或短剧项目经验；\n有成人向AI短剧项目经验优先，但不强制要求提供成人作品；\n能接受实际参与成人向剧情内容制作。\n\n作品要求\n必须提供视频作品，可提供本人自媒体账号、平台主页、作品链接或视频文件；\n作品类型包括AI短剧、AI动漫、动态漫、剧情视频、广告视频、短视频等；\n至少提供能够体现本人实际制作能力的完整作品或连续片段；\n如为团队项目，需明确说明本人负责的具体环节；\n面试及测试环节需能够讲清作品的制作流程、使用工具、提示词及后期处理方式；\n无视频作品、无法提供账号/链接或无法说明本人实际贡献的候选人，原则上不进入后续面试。", "cat": "AI / AIGC"}, {"id": "177", "title": "AI短剧制作", "salary": "12K-22K", "location": "原二创9.15暂停\n换成初级3部8个", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "AI / AIGC"}, {"id": "178", "title": "AI短剧制作", "salary": "12K-22K", "location": "未明确", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "AI / AIGC"}, {"id": "179", "title": "AI短剧制作", "salary": "12k-22k", "location": "未明确", "jd": "岗位职责\n负责 AI短剧基础内容制作，包括分镜理解、参考素材整理、场景生成、图生视频及画面优化，在制作规范和指导下完成镜头或片段交付，保证人物一致性、画面质量和剧情连贯。\n\n岗位要求\n1：对AI短剧制作有明确兴趣，有AI生图、生视频练习或相关项目经历，面试需提供个人作品；\n2：使用过seedance、可灵、ComfyUI、等一种或多种AI工具，了解基础生成流程；\n3：具备基础审美和画面判断能力，能够识别人物变形、画面穿帮、动作异常等常见问题；\n4：能理解剧本和分镜要求，学习运用参考图、提示词及参数调整，提高人物和场景的一致性；\n5：学习能力强，能根据反馈完成修改，按要求整理素材、记录版本并按时交付；\n6：具备良好的沟通能力、责任心及团队配合意识，愿意持续学习并逐步承担独立制作任务。\n\n加分项：\n有设计、摄影、动画、剪辑相关基础，或独立完成过AI剧情短片者优先；优秀应届生及转行人员可考虑。", "cat": "AI / AIGC"}, {"id": "180", "title": "AI短剧导演", "salary": "18K-28K", "location": "未明确", "jd": "岗位职责\n\n1. 负责 AI 短剧项目整体导演工作，包括剧本理解、剧情拆解、分镜设计、镜头调度及成片质量把控。\n2. 根据剧情设计景别、构图、运镜、人物表演及镜头衔接，强化人物情绪、剧情冲突及关键爆点。\n3. 将剧本转化为可执行的 AI 视频制作方案，明确镜头画面、人物动作、情绪及生成要求。\n4. 指导 AI 生成师使用 Seedance、可灵、ComfyUI 等工具完成镜头制作，并针对生成结果提出明确修改意见。\n5. 把控短剧整体节奏、人物一致性、画面连续性及剧情表达，与编剧、生成师、剪辑协作完成最终成片。\n6. 持续关注 AI 视频新技术及短剧市场趋势，不断优化制作流程和成片效果。\n\n任职要求\n\n1. 具备较强的导演思维、剧情理解能力及镜头语言能力，有短剧、影视、广告、动画、漫剧等相关导演经验。\n2. 熟悉短剧的剧情节奏、人物关系、情绪递进、冲突爆点及反转设计。\n3. 具备 AI 视频制作经验，熟悉 Seedance、可灵等主流 AI 视频工具，对 ComfyUI 工作流及 AI 视频生成逻辑有一定了解。\n4. 有半年以上 AI 短剧导演或相关项目经验，能够独立完成从剧本到成片的导演工作。\n5. 需提供个人作品或参与项目案例。\n\n加分项\n\n有擦边、成人向或强剧情短剧导演经验，有成熟爆款作品或完整 AI 短剧项目经验者优先。", "cat": "AI / AIGC"}, {"id": "181", "title": "广告平台专家（技术方向 / 产品运营方向）", "salary": "20K-35k", "location": "未明确", "jd": "本岗位面向广告平台对接、投放支持与系统建设全链路工作，不局限于开发背景，以下两类候选人均可申请：\n\n    技术方向：具备 Go 后端开发经验，负责广告相关系统的架构设计与开发；\n产品/运营方向：具备广告投放实操经验，精通主流广告平台的规则、配置与运营策略，负责账户配置、投放策略制定、效果分析与平台规则适配。\n\n    两类候选人在\"广告平台对接与投放运营\"部分职责与要求基本一致，技术方向额外承担系统架构与后端建设工作，产品/运营方向额外承担投放策略与业务运营工作。请在任职要求中选择匹配自身背景的方向阅读。\n\n岗位职责\n    一、广告平台对接与投放运营（通用，两个方向均涉及）\n熟悉并对接主流广告平台（巨量引擎 / 腾讯广告 / 快手广告 / 百度营销 / 广点通 / Google / Meta (Facebook) / TikTok / Apple Search Ads / Amazon / Microsoft 等）的开放 API、SDK、数据协议及后台操作规则；\n    负责投放账户、计划、单元、创意、人群定向、出价策略的配置、调试与上线支持；\n    负责投放数据回收、实时监控、效果分析（曝光、点击、CTR、CVR、CPA、CPC、ROAS、ROI 等）；\n    负责投放异常排查、平台规则适配、数据对账与归因核对；\n    处理跨区域数据合规（GDPR / CCPA / PIPL）、iOS 端 SKAdNetwork 归因、IDFA 弱化后的隐私优先归因、Conversion API / S2S 回传、多币种结算等海外特有场景的业务落地。\n\n    二、广告系统架构与技术建设（技术方向）\n    主导广告投放管理系统、账户与权限体系、预算与出价控制系统的架构设计与开发；\n    负责广告对账与计费系统、归因与转化追踪系统、人群与创意分析系统的建设；\n    负责实时投放监控大盘、ROI 归因、转化漏斗、异常告警等核心模块建设；\n建设广告数据\"采集 → 传输 → 存储 → 实时计算 → 效果分析\"全链路，与大数据    平台（Kafka / Flink / Doris / ClickHouse）深度集成；\n    支持 oCPM / oCPC / OCPA、RTB 实时竞价、归因窗口、人群定向等业务核心场景落地。\n\n    三、核心后端架构工作（技术方向）\n     负责核心后端系统的架构设计、技术方案设计及落地，参与高并发、高可用、分布式系统的建设与持续优化。\n    负责大型业务系统的服务架构设计，包括服务拆分、流量治理、负载均衡、容灾、高可用、数据一致性及性能优化等。\n    负责设计和建设 CDN + 应用层 + Redis 等多级缓存体系，解决热点数据、高并发访问、缓存穿透、缓存击穿、缓存雪崩、缓存一致性及大规模流量场景下的性能问题。\n\n    参与大型企业级统一入口 / 统一接入体系建设，包括 API Gateway、统一域名入口、流量调度、服务发现、健康检查、限流、熔断、故障切换等，并建设相应的监控及管理面板。\n    负责生产环境完整的监控、可观测性及故障定位体系建设，能够从基础设施、网络、网关、应用、数据库、缓存到业务指标建立完整的监控体系。\n基于 OpenTelemetry 建立统一的 Metrics、Logs、Traces 可观测性体系，实现跨服务的全链路追踪，并通过 TraceID、日志、指标、调用链等信息快速定位生产环境问题。\n    建立生产环境故障快速定位和分析机制，能够针对 CPU、内存、网络、连接池、GC、线程/Goroutine、QPS、错误率、P99 延迟、缓存命中率、数据库慢查询、消息堆积等问题进行快速分析和定位。\n    参与大数据及实时数据处理相关系统建设，负责海量日志、用户行为、订单、风控事件等数据的采集、处理、分析及查询架构设计。\n    参与或负责基于 Flink 的实时计算、实时风控、实时指标及事件处理系统建设，理解 State、Checkpoint、Watermark、Window、Exactly-Once 等核心机制。\n    参与 Doris / Elasticsearch / ClickHouse 等大数据及分析系统的建设、性能优化和生产环境运维，解决海量数据写入、查询、索引、分片、数据生命周期及集群扩展等问题。\n    参与大型日志平台、风控系统、数据分析平台或实时监控平台建设，能够针对海量数据场景进行系统容量规划、性能优化及故障排查。\n    积极使用 AI 提升研发效率，包括 AI Coding、代码分析、问题排查、技术方案设计、测试生成、日志分析等场景。\n\n    四、投放策略与业务运营（产品/运营方向）\n    制定并持续优化各广告平台的投放策略、账户结构搭建方案与预算分配方案；\n跟踪各广告平台的规则、政策与产品功能更新，输出平台规则差异对比与风险预警；\n    建立投放 SOP 与配置规范，支撑跨平台、跨账户的标准化操作与批量管理；\n    对接广告平台方（销售、技术支持、代理商）跟进账户问题、政策申诉与资源支持；\n    定期输出投放效果复盘报告，基于数据提出优化建议，支撑业务决策；\n    与技术团队协作，梳理并输出清晰的业务需求文档（PRD/需求说明），推动投放相关系统功能迭代；\n    积极使用 AI 提升工作效率，包括 AI 辅助数据分析、报表生成、规则研究、文档撰写等场景。\n\n任职要求\n    请根据自身背景选择匹配的方向，满足其中一个方向的要求即可：\n\n技术方向\n    5 年以上后端开发经验，3 年以上 Go 开发经验，具备扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、网络编程及 Go 服务性能优化。\n具备较强的系统架构设计能力，有实际负责大型分布式系统、高并发系统或核心业务系统架构设计和落地经验。\n    有丰富的 CDN + 应用缓存 + Redis 多级缓存架构经验，理解缓存一致性、热点数据、缓存穿透/击穿/雪崩等问题。\n    有大型企业统一入口 / 统一接入平台建设经验，熟悉 API Gateway、流量治理、限流、熔断、服务发现、健康检查、故障切换等。\n    有完整的生产环境监控和可观测性体系建设经验，能够从 0 到 1 设计和建设一套覆盖基础设施、网络、网关、应用、数据库、中间件及业务指标的监控体系。\n    具备较强的线上问题快速定位能力，能够通过 Metrics、Logs、Traces、调用链、系统指标及业务指标，快速判断问题所在层级，并建立从「发现问题 → 告警 → 定位 → 分析 → 处理 → 复盘」的完整闭环。\n    有 OpenTelemetry 或同类可观测性体系的实际使用经验，理解 Metrics、Logs、Traces、TraceID、Span、Context Propagation 等概念。\n    具备较好的大数据系统经验，有海量日志、实时数据、用户行为分析、风控、监控或数据分析平台的实际项目经验。\n    对以下技术有实际生产环境使用经验：Flink / Doris / Elasticsearch / ClickHouse（不要求每项都达到专家级，但至少有 1～2 项较深入的生产实践）。\n有大规模日志系统 / 实时风控系统 / 实时监控系统 / 数据分析平台中的一种或多种实际建设经验。\n    具备一定的 AI 工具使用经验，能够使用 AI 辅助编码、代码阅读、问题排查、技术方案设计、测试及日常研发工作。\n\n产品/运营方向\n    3  年以上广告投放、广告平台产品或广告运营相关经验，有实际操盘账户的经验（甲方、乙方或代理商背景均可）。\n    精通至少 2-3 个主流广告平台（巨量引擎 / 腾讯广告 / 快手广告 / 百度营销 / 广点通 / Google / Meta (Facebook) / TikTok / Apple Search Ads / Amazon / Microsoft 等）的后台操作、账户结构、计费规则、审核规则与归因规则。\n    具备账户搭建、预算与出价策略制定、人群定向、创意优化的实操经验，能独立完成投放配置与调优。\n    数据敏感，具备较强的数据分析能力，能独立完成效果分析（CTR、CVR、CPA、CPC、ROAS、ROI 等核心指标）、异常排查与复盘总结。\n熟悉 oCPM / oCPC / OCPA、RTB 实时竞价、归因窗口等核心投放机制及其对配置策略的影响。\n    了解跨区域合规要求（GDPR / CCPA / PIPL）、iOS 端 SKAdNetwork 归因、IDFA 隐私政策变化对投放策略的影响者优先。\n    具备良好的跨部门沟通与文档能力，能与技术团队高效协作，输出清晰的业务需求文档。\n    具备一定的 AI 工具使用经验，能够使用 AI 辅助数据分析、报表处理、规则研究及日常工作。\n\n加分项\n有国内外主流广告平台综合投放或系统对接经验，同时熟悉多个平台的规则差异与最新政策变化。\n有大型互联网、金融、电商、支付、广告、内容平台等高并发业务或大规模投放业务经验。\n技术方向加分：熟悉 Kafka、Pulsar 等消息队列的大规模生产实践；熟悉 Kubernetes、Docker、云原生及微服务体系；熟悉 Prometheus、Grafana、Loki、Tempo、Jaeger 等监控及可观测性组件；熟悉 MySQL / PostgreSQL，并具备数据库性能优化经验；有 Iceberg、数据湖、实时数仓等相关经验；有大型风控规则引擎、实时决策引擎或事件驱动系统建设经验；有大型企业基础设施平台、统一接入平台、监控平台或内部 PaaS 平台建设经验。\n产品/运营方向加分：有投放自动化工具、批量账户管理工具、规则引擎类产品的使用或产品设计经验；有广告投放团队管理或跨平台投放策略统筹经验；持有主流广告平台官方认证（如巨量引擎、Google Ads、Meta Blueprint 等）者优先。\n有 AI Agent、RAG、MCP、AI Coding 或其他 AI 工程实践经验。", "cat": "商务 / 市场"}, {"id": "182", "title": "新媒体推广专员", "salary": "10K-18k", "location": "未明确", "jd": "一、岗位背景\n\n为承接后续规模化拉粉、内容运营和引流转化,现招聘 1-2 名专职新媒体推广专员,负责多产品线的海外社交平台矩阵运营,直接对接产品 GMV 增长。\n\n二、岗位职责\n\n1、账号矩阵运营(核心)\n\n独立运营 X(推特)/ Instagram / Telegram等海外社交平台的官方账号、官方频道、官方群\n每人负责 2-3 个产品线的账号矩阵搭建、养号、日常发布\n完成账号从冷启动到粉丝规模化的全流程\n\n2、内容策划与生产\n\n根据不同平台特性差异化策划内容\n生产擦边封面、短视频剪辑、图文文案、话题标签\n内容水印规范化,引流回产品的路径设计\n每日发布量 ≥ 3 条/账号\n\n3、引流转化\n\n建立\"官方号 → 自建号 → 落地页\"引流闭环\n跟踪各平台新增用户数据 + 引流转化率 + LTV\n与产品运营配合,优化转化路径\n\n4、粉丝运营\n\n官方群/官方频道日常维护、答疑、活跃互动\n拉粉策略执行(SEO 优化 + 话题 hijack + 跨平台导流)\n粉丝规模 KPI 达成(月度净增 ≥ 3,000/账号)\n\n5、数据复盘\n\n每周输出各账号数据日报 / 周报(粉丝增长、发文量、互动率、引流数)\n每月输出账号矩阵 ROI 分析,与副主管对齐下月优化方向\n三、任职要求\n\n硬性条件\n\n1 年以上海外社交平台运营经验(推特 / IG / TG/TK等 至少 2 个平台有实操经验)\n熟悉海外社交平台的算法规则、内容边界、防封号技巧\n熟练使用外事邮箱、VPN、多账号管理工具\n能独立完成简单视频剪辑、图文封面设计(会 PS / 剪映 / CapCut 至少一款)\n有引流 / 拉粉的实战成功案例(能提供数据佐证)\n\n优先条件\n\n有成人向 / 擦边内容 / 影视资源 / 短剧类账号运营经验\n有海外社交平台\"矩阵账号 + 引流转化\"完整经验(粉丝规模 10 万+)\n有 TG 频道/群 拉粉、SEO、话题运营经验\n熟悉推特算法(推荐机制、话题榜、互动加权)\n\n软技能\n\n内容嗅觉敏锐,能快速捕捉热点\n抗压能力强,能接受较高的日发文量\n数据敏感,以 KPI 为导向\n团队协作能力(需与渠道组员、产品运营频繁沟通)\n四、加分项\n自有大号资源(可带号入职)\n熟悉 AI 素材生产工具(Midjourney / SD / Runway 等)\n有 BOT 自动化发文经验\n有海外营销号灰产/黑产对抗经验(防封号、防限流)\n有小红书 / 抖音 / 快手 主流平台运营经验(用于跨平台复用素材)\n五、我们提供\n\n薪酬\n\n底薪 [面议,10-18k] + 绩效奖金 + 项目分成\n绩效奖金按月度 KPI 完成率发放:\n粉丝规模达标 → 基础奖金\n引流转化超预期 → 阶梯奖金(单账号月度引流新增 ≥ 5,000 用户即触发)\n年终奖 + 项目激励\n试用期考核标准(3 个月)", "cat": "商务 / 市场"}, {"id": "183", "title": "AI短剧编剧", "salary": "12k-20k", "location": "未明确", "jd": "岗位职责\n负责 AI成人向剧情短剧的选题策划、人物设定、故事大纲及分集剧本创作，结合AI制作特点设计可落地的剧情，与制作团队配合，保证故事吸引力、叙事节奏和交付效率。\n岗位要求\n1：有短剧、影视、网文或漫画等相关创作履历，面试需提供剧本或已上线作品；\n2：了解成人向题材的受众偏好，擅长人物关系、情绪张力、剧情冲突及悬念设计；\n3：熟悉短剧叙事结构，能把控开篇吸引力、分集节奏、剧情转折和集尾钩子；\n4：具备画面化写作能力，能清晰描述场景、动作与情绪，合理控制人物数量和制作复杂度；\n5：能独立完成选题、大纲及分集剧本，并根据制作反馈和上线表现调整内容；\n6：具备良好的沟通能力、责任心及团队配合意识，能够按排期稳定交稿。\n加分项：\n有已上线短剧、成熟连载作品、爆款内容或AI短剧编剧经验者优先。", "cat": "AI / AIGC"}, {"id": "184", "title": "短剧审核（剧本）", "salary": "10k-18k", "location": "未明确", "jd": "岗位职责\n负责 AI成人短剧剧本的内容审核，包括选题方向、人物设定、冲突埋点、剧情逻辑、分集节奏及制作可行性评估，输出明确的修改意见并跟进复核，保证剧本质量符合平台定位与制作要求。\n岗位要求\n1：有短剧编剧、剧本评审、文学编辑或影视策划等相关项目履历，面试需提供创作作品或评审案例；\n2：了解成人向剧情题材及用户偏好，能判断选题吸引力、人物关系、剧情冲突和持续追剧价值；\n3：熟悉短剧叙事结构，能识别开篇乏力、节奏拖沓、情节重复、转折生硬及集尾悬念不足等问题；\n4：具备严谨的逻辑判断能力，能检查人物动机、行为逻辑、时间线及前后情节的一致性；\n5：了解AI短剧制作特点，能评估人物、场景、动作等制作难度，提出兼顾剧情表现与落地效率的修改建议；\n6：具备良好的文字表达、沟通能力及责任心，能依据统一标准审核，清晰标注问题并跟进修改闭环。\n加分项：\n有已上线短剧、成熟连载作品、AI短剧编剧或剧本统筹经验，参与建立剧本评审标准者优先。\n具体薪资根据能力、经验及评审水平确定。", "cat": "客服 / 支持"}, {"id": "185", "title": "运营组长", "salary": "25k-35k", "location": "未明确", "jd": "岗位定位：负责 AI 短剧产品的内容运营与用户增长，带领运营团队建立高效的内容供给和运营机制，对用户活跃、留存及付费转化结果负责。\n\n岗位职责\n1. 业务目标与团队管理：**制定阶段性运营策略，拆解 DAU、新增、留存、充值、会员转化等目标，组织团队执行、复盘并持续优化。\n2. 内容运营：统筹 AI 短剧的内容供给、上架、分类、推荐及封面标题优化，结合播放、完播、追剧和付费数据提升内容表现。\n3. 增长与转化：策划活动、会员运营和用户召回方案，优化从内容触达到观看、追剧、付费的关键路径。\n4. 数据驱动：建立日常数据监测与复盘机制，定位业务问题，推动运营方案及产品迭代落地，并验证效果。\n5. 机制建设：完善内容审核、上架、巡检、活动执行和数据复盘等 SOP，提升团队交付质量与效率。\n6. 协同与提效：与产品、技术、设计及内容团队协作，推动关键项目落地；运用 AI 工具优化内容生产、素材测试、数据分析等工作。\n\n岗位要求\n1. 3 年以上互联网内容或产品运营经验，有独立负责业务指标、带领小团队或牵头跨职能项目的经验。\n2. 熟悉短剧、短视频或内容产品的用户消费路径，能够判断题材、剧情节奏、封面标题及推荐策略对用户行为的影响。\n3. 具备完整的数据分析与运营闭环能力，能从指标变化中定位问题、制定方案并推动结果改善。\n4. 有运营体系搭建或流程规范化经验，既能制定策略，也能带团队深入执行。\n5. 熟练使用 AI 工具，能够将其应用于内容运营和团队提效，并对 AI 生成内容保持质量判断。\n6. 结果导向，具备较强的沟通协调和推进能力，能在业务变化中合理安排优先级。\n\n加分项\n有短剧平台、视频平台、付费内容产品或 AI 内容产品运营经验；有内容商业化、会员体系或从 0 到 1 搭建运营团队的实践经验。", "cat": "运营"}, {"id": "186", "title": "短剧内容策划", "salary": "10-25k", "location": "未明确", "jd": "岗位职责\n1.持续关注热点事件、社交平台热门话题及热门短剧，挖掘具有传播潜力的故事素材。\n2.负责将素材改编为短剧剧本，设计开场钩子、剧情反转与结尾悬念，确保每集内容具备持续吸引力。\n3.借助 AI 工具完成分镜脚本与人物设定；制定选图标准，从 AI 批量生成结果中确定最符合剧情的版本。负责成人向情节的节奏、细节与画面呈现的把控与优化。\n4.负责成片验收，对未达标内容提出修改要求，确保内容质量符合上线标准。\n5.结合播放量、完播率、付费转化等数据进行复盘，总结受众偏好，持续优化选题方向。\n\n任职要求\n硬性要求：\n1.具备较强的故事创作能力，有热点事件、情感故事、娱乐资讯、小说推文等内容创作经验，可提供过往作品。\n2.熟悉短内容的开篇设计，能够在内容开头迅速吸引用户注意力。\n3.具备良好的网络敏感度，持续关注短视频及社交平台，了解当前热门内容趋势。\n4.具备 AI 写作及出图工具的使用能力，或有较强的学习意愿。\n5.具备成人向内容的审美判断能力，能够把握情节铺垫、情绪张力与画面呈现，提升内容吸引力。\n6.严格遵守内容规范：所有角色均为成年人设定，不涉及任何违法违规内容。\n加分项：\n1.有短视频账号或自媒体运营经验，有单条高播放量作品数据。\n2.有网络小说、剧本或漫画脚本的创作经验。\n3.有 AI 辅助写作或出图的实际创作经验。\n4.具备数据分析意识，能够根据用户反馈调整内容方向。", "cat": "内容"}, {"id": "187", "title": "产品经理", "salary": "20-25K", "location": "未明确", "jd": "职位描述\n1.负责播放器类产品核心体验设计，包括播放页、推荐流、弹幕/评论等关键交互功能的规划与持续优化。\n2.基于用户行为数据，拆解推荐系统需求，参与评估召回、排序等模块效果，推动推荐体验提升。\n3.负责产品版本规划与需求管理，输出 PRD、流程图、原型图等产品文档，协调研发、设计、测试等团队，保障按期高质量交付。\n4.结合数据分析（如留存率、DAU、完播率、播放时长等），识别产品体验问题，提出并推动优化方案落地。\n5.持续关注并分析长视频、短视频、直播等行业竞品，为产品规划与决策提供依据。\n6.与运营、内容、商务等团队紧密协作，推动内容策略、活动玩法、会员体系等产品方案落地。\n\n任职要求\n1.本科及以上学历，3 年及以上 C 端产品经理经验，有播放器类、视频类或内容消费类产品经验者，熟练使用AI工作输出经验优先。\n2.具备扎实的产品方法论，能够独立完成需求拆解、方案设计与产品落地。\n3.熟悉内容推荐或信息流产品逻辑，对推荐系统的基本原理与产品形态有清晰认知者优先。\n4.数据敏感度高，能够基于数据发现问题、验证假设并形成优化方案。\n5.对用户增长有体系化理解，熟悉并能应用核心指标体系：CTR、完播率、留存率、活跃度、播放时长等。\n6.具备较强的跨团队沟通与协调能力，能够在多角色协作环境中推进项目落地，具备良好的执行力与结果导向意识，能快速推动需求闭环。", "cat": "产品"}, {"id": "188", "title": "剪辑师", "salary": "10k-18k", "location": "未明确", "jd": "岗位职责\n1. 根据剧本、分镜及导演要求，完成AI短剧的粗剪、精剪和成片交付。\n2. 负责镜头筛选、节奏把控、剧情衔接、情绪推进及结尾悬念设计。\n3. 完成配音、音效、BGM、字幕、调色、转场及片头片尾包装。\n4. 处理AI生成素材中的人物变形、画面闪烁、动作不连贯、穿帮及镜头跳变等问题。\n5. 保持人物、服装、场景、画风及镜头前后的一致性。\n6. 根据业务、导演及运营反馈快速修改，保证内容按时交付。\n7. 沉淀剪辑模板、素材规范及批量化制作SOP，稳定完成日常产能。\n8. 配合团队完成成人向剧情短剧项目制作，并遵守内容合规要求。\n任职要求\n1. 有短剧、影视、动态漫、广告、剧情视频或短视频剪辑经验。\n2. 能独立完成从素材整理到完整成片的剪辑流程。\n3. 熟练使用剪映专业版、Premiere、After Effects、达芬奇等剪辑软件。\n4. 熟悉竖屏短剧节奏，能够把控前几秒吸引力、冲突推进及情绪爆点。\n5. 具备较好的音乐、音效、字幕、画面节奏及视觉审美能力。\n6. 熟悉AI生成视频素材的剪辑和问题修复，有AI短剧、AI漫剧作品者优先。\n7. 执行力强、沟通及时，能够适应远程协作、快速迭代和稳定量产。\n8. 能够接受成人向剧情内容制作方向。\n作品要求\n1. 必须提供本人视频作品，可提供自媒体账号、作品链接或视频文件。\n2. 作品类型包括短剧、影视、动态漫、AI视频、广告或剧情类短视频等。\n3. 需说明本人在项目中具体负责的剪辑及后期环节。\n4. 通过初筛后需完成剪辑测试，重点考察节奏、镜头衔接、音效字幕及成片完整度。", "cat": "内容"}, {"id": "189", "title": "前端开发工程师（seo方向）", "salary": "面议", "location": "未明确", "jd": "岗位职责\n    负责站群多主题模板体系：服务端渲染模板的组件化与皮肤化，让同一套结构长出多张不同的脸。\n    对 Core Web Vitals（LCP / CLS / INP）负责：首屏 CSS 拆包、资源哈希与长缓存、图片自适应与懒加载。\n    HTML 语义化与页面结构：标题层级（单一 H1、H2–H6 不跳级）、article / section / nav / main 等语义标签用对、图片 alt、链接可抓取，让爬虫能读懂页面在讲什么。\n    落地结构化数据（JSON-LD）、canonical / hreflang / og、分页与内链结构，直接影响收录与排名。\n    支撑多语言站扩张（繁体及多国语言）：多语言 URL 结构与 hreflang、语言切换、界面文案全量外置、不同语种文案长度差异的布局适配。\n    运营后台迭代（Vue3 + Vite + TypeScript + Element Plus）：内容管理、批量操作、权限菜单、大列表性能。\n    短剧 App 客户端迭代（Flutter 安卓 + Web）：播放器、追剧、会员支付、性能与包体优化。\n任职要求\n    2 年以上前端开发经验，至少一个完整项目从 0 到上线的主力经历。\n    不限框架（Vue / React / Svelte / Flutter / 原生 SSR 模板均可），但需具备「SEO 友好渲染」或「App 端开发」其中一项硬能力。\n    熟练使用 AI 编码工具（硬性要求），能用 Agent 批量生产模板与组件并保证质量一致。\n    能 1:1 像素级还原 Figma 设计稿，这是我们的硬性交付标准。\n    严格遵守多语言（i18n）架构：界面文案一律走词条不写死，布局能容纳不同语种的长度差异——这是我们的团队红线。\n    懂 SEO 站的前端优化点：HTML 语义化与标题层级、图片 alt 与懒加载对收录的影响、内链与锚文本、rel 属性（nofollow / sponsored / ugc）、noindex 的正确用法。我们靠搜索引擎流量吃饭，模板写法直接决定收录。\n    理解浏览器渲染、缓存与性能指标，能自己定位性能问题。\n加分项\n    有 SEO 站、内容站、站群前端经验，做过收录与排名相关优化并有数据结果。\n    有服务端渲染（任意技术栈）的深度实践。\n    有 Flutter 或音视频播放（HLS、加密流、自定义播放器）经验。\n    有多主题、多品牌换肤体系的设计与实现经验。\n    做过多语言站或国际化项目，处理过 hreflang、繁简差异、RTL 等问题。\n    熟悉 Node 工程化，能自己写构建脚本与自动化工具。", "cat": "技术 / 数据"}, {"id": "190", "title": "新媒体运营（越南市场）", "salary": "18-20k", "location": "未明确", "jd": "岗位职责：\n1. 负责面向越南市场的新媒体账号运营，包括内容策划、文案撰写、发布及日常维护。\n2. 围绕短剧内容制作推广素材，结合越南用户偏好优化选题、标题及内容呈现。\n3. 跟进越南当地热点、热门内容及同类账号，持续调整运营策略。\n4. 负责评论、私信及用户互动，收集用户反馈，提升账号活跃度。\n5. 跟踪曝光、互动、涨粉及引流转化数据，复盘内容效果，推动有效用户增长。\n\n岗位要求：\n1. 熟练使用越南语，能够独立撰写自然、符合当地表达习惯的运营文案，并能用中文与团队沟通。\n2. 熟悉越南市场及用户偏好，了解TikTok、Facebook、YouTube等平台的内容形式与运营规则。\n3. 具备新媒体运营经验，能够独立完成内容策划、发布及效果复盘。\n4. 具备基础视频剪辑能力，能够制作适合社交平台传播的短视频素材。\n5. 对热点和内容有敏感度，执行力强，具备用户增长及转化意识。\n\n加分项：\n1. 有越南市场账号运营经验，能提供账号或代表案例。\n2. 有短剧、影视娱乐类内容运营经验。\n3. 有从零起号、爆款内容、社群运营或达人合作经验。\n\n紧急程度：紧急", "cat": "商务 / 市场"}, {"id": "191", "title": "新媒体运营（海外）", "salary": "18-20k", "location": "未明确", "jd": "岗位定位：不限定具体国家，根据候选人的实际经验匹配其擅长的海外市场，优先考虑有成熟运营结果的人选，可根据候选人实际工作和区域情况动态调整。\n岗位职责\n1. 负责某一海外区域的新媒体账号运营及用户增长，包括TikTok、Facebook、Instagram、YouTube、X、Telegram等平台。\n2. 根据当地用户偏好，对短剧及产品内容进行本地化选题、文案和分发。\n3. 负责账号矩阵、社群及私域承接，推动用户完成访问、注册和付费转化。\n4. 跟踪曝光、互动、涨粉、注册、充值等数据，持续优化运营策略。\n5. 关注当地平台规则、用户习惯及竞品动态，降低账号风险。\n6. 根据业务需要，参与搭建对应区域的运营流程和内容SOP。\n任职要求\n1. 有至少一个海外市场的新媒体运营/长期生活经验，区域不限，越南、东南亚、欧美、拉美等均可。\n2. 当地语言和中文熟练，熟悉当地用户偏好及主流平台运营规则，能够独立完成内容发布和账号维护。\n3. 有可验证的账号、粉丝增长、用户注册或付费转化案例。\n4. 能根据自身优势负责对应区域，不要求所有市场都做过。\n5. 具备良好的中文沟通能力，能与业务团队协作推进。\n6. 接受短剧、视频平台及成人向内容方向。\n优先条件\n- 有成熟账号矩阵、社群或海外推广资源；\n- 有短剧、视频平台、成人内容或AI产品运营经验；\n- 有从0到1起号、爆款内容或用户付费转化案例；\n- 能直接承接某一区域的完整运营工作。", "cat": "运营"}, {"id": "192", "title": "新媒体负责人（海外）", "salary": "40k+绩效", "location": "未明确", "jd": "岗位定位：搭建并带领海外新媒体矩阵，以推特、TG为主阵地，为产品稳定导入有效用户。\n\n岗位职责：\n1．负责海外新媒体账号矩阵的整体运营和增长，制定账号定位、内容规划和发布节奏\n2．以X（推特）、TG为主阵地分发短剧及产品内容，做好推文助推、社群与私域承接\n3．负责账号分类、登记、养号与备份，处理官方账号仿冒，控制封号与账号流失风险\n4．负责海外外部推广团队的引入、对接与效果管理\n5．按「曝光→访问→注册→付费」链路做归因与复盘，持续优化内容方向和转化路径\n6．组建并管理新媒体团队，搭建运营流程和SOP，负责新人带教\n\n任职要求：\n1．具备海外新媒体矩阵运营经验，有账号从0到1或增长案例，能提供可验证的账号与转化数据\n2．熟悉X（推特）、TG的内容分发、养号、限流与封号规避逻辑\n3．有短剧、成人内容、视频平台或AI产品相关经验\n4．具备团队管理能力，能独立搭建团队和SOP\n5．接受成人向业务，保密与合规意识良好\n\n加分项：\n1．有成熟团队或新媒体资源，能直接承接业务\n2．有TikTok、Reddit等海外平台引流经验\n3．会用AI工具批量产出图文、短视频素材", "cat": "其他"}, {"id": "193", "title": "新媒体负责人（国内）", "salary": "40k+绩效", "location": "未明确", "jd": "岗位定位：负责国内新媒体与社交平台引流，平台和打法不设限，以有效用户和付费结果为导向。\n\n岗位职责：\n1．负责国内新媒体与社交平台的引流增长，自主选择平台与打法\n2．搭建国内账号矩阵或私域社群，持续导入有效用户并完成注册付费转化\n3．负责国内外部推广团队的引入、对接与效果管理\n4．按「曝光→访问→注册→付费」链路做归因与复盘，及时调整打法\n5．组建并管理团队，搭建运营流程和SOP\n\n任职要求：\n1．具备国内新媒体或社交平台引流经验，有可验证的账号、用户量或转化数据\n2．熟悉国内主流社交、社群与短视频平台的引流逻辑和风控规则\n3．有短剧、成人内容、视频平台或AI产品相关经验\n4．具备团队管理能力，能独立带队完成目标\n5．接受成人向业务，保密与合规意识良好\n\n加分项：\n1．有成熟团队或国内渠道资源，能直接承接业务\n2．有私域社群运营、裂变拉新的实操结果\n3．会用AI工具批量产出图文、短视频素材", "cat": "其他"}, {"id": "194", "title": "新媒体推广团队", "salary": "", "location": "未明确", "jd": "岗位定位：（外包/入职）接受引入有成熟账号、社群或推广资源的团队，为黄豆等短剧产品带来有效用户和充值，合作形式灵活。\n\n岗位职责：\n1．负责黄豆等短剧产品在海内外新媒体平台的推广\n2．通过账号矩阵、短视频、社群等合规方式进行内容分发和用户引导\n3．根据产品特点制定推广方案，完成注册及付费转化\n4．配合提供推广数据、用户反馈和效果复盘，按约定完成对账\n\n任职要求：\n1．拥有成熟的新媒体账号、社群、短视频或海外推广资源\n2．有短剧、视频平台、成人内容或互联网产品推广经验\n3．能提供过往账号数据、用户量、转化数据或合作案例，说明团队规模、负责平台及可投入资源\n4．接受按效果考核和数据验收结算\n\n合作形式：\n1．外部合作、不入职：按下列合作模式结算\n2．整团队入职：按岗位定薪，可签对赌协议约定团队规模、目标与薪资\n3．负责人入职、团队外部合作：负责人定薪，团队按合作模式结算\n4．先外部合作，跑出数据后再转入职，转入时重新核定薪资与目标\n合作模式：\n【合作模式】\n1．CPS充值分成：按带来用户的会员充值分成，专属推广链接统计（主推）\n2．阶梯总包：按月有效充值分档，达档给对应比例，未达门槛进整改档或停止合作\n3．CPA按有效注册：按剔除无效与作弊后的注册计价，设观察期，小范围测试用\n4．付费代发：按发布条数或曝光计价，覆盖TG群、QQ群等社群\n5．包月代运营：按月固定费用代运营账号矩阵，约定发布量与引流考核，未达标扣减\n6．广告位／挂站：在对方站点、频道、导航页购买推荐位或横幅，按位置和周期计价\n7．保底＋分成：小额保底加CPS分成，保底按月封顶\n8．资源置换：以内容授权、站内推荐位等资源置换对方曝光，不涉及现金", "cat": "商务 / 市场"}, {"id": "195", "title": "Golang后端工程师", "salary": "面议", "location": "具备远程工作的自驱力。", "jd": "岗位职责\n    负责黄豆App（短剧App）核心后端的迭代与维护：这是一套跑在生产环境的 Go 服务，服务近 600 万注册用户的会员、支付、内容分发全链路，不是练手项目。\n    会员与支付相关功能开发：充值、VIP 套餐、权益补偿、优惠券等碰钱的逻辑，容不得重复扣款或超发，每个改动都要经得起资损审计。\n    渠道分销（CPS 代理）体系的后端开发与维护：佣金结算、提现、代付、对账、代理层级管理。\n    社区功能的后端支撑与迭代：UP 主创作体系、动态、评论、剧照与角色档案等。\n    内容链路对接：与资源池、转码服务、CDN 协同，保证内容同步与加密分发的正确性。\n    消息队列（RabbitMQ）与 MongoDB 的日常使用：消费上游消息、保证幂等、处理对账与补偿场景。\n    配合技术负责人做安全加固：接口限流、权限收紧、支付回调校验等生产安全工作。\n    线上问题排查与根因定位：真实在跑的生产系统，出问题要能当天定位、当天修复。\n任职要求\n    3 年以上 Go 语言后端开发经验，有扎实的生产项目经历，不是仅接触过。\n    必须有支付 / 会员 / 资金相关系统的开发经验：理解幂等、防重放、防超发这些资金安全的基本设计原则，这是硬性门槛。\n    熟悉 MongoDB，关系型数据库至少掌握一种，能独立设计数据模型。\n    熟悉消息队列（RabbitMQ / Kafka 均可）的使用与常见坑：消息丢失、重复消费、顺序性。\n    熟练使用 AI 编码工具进行工程开发（硬性要求）：Claude Code、Codex、Cursor 等 Agent 类工具日常主力使
