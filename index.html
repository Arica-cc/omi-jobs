<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>OMI职位库</title>
<style>
:root{
  --bg:#F3F2EE;
  --surface:#FFFFFF;
  --surface-2:#ECEAE4;
  --ink:#1C2126;
  --ink-soft:#5B6470;
  --ink-faint:#8B93A0;
  --accent:#0E7C74;
  --accent-ink:#04302D;
  --accent-soft:#DCEFEC;
  --amber:#C97A1F;
  --amber-soft:#F6E6D2;
  --line:#DFDDD5;
  --shadow: 0 1px 2px rgba(28,33,38,.06), 0 8px 24px -12px rgba(28,33,38,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181B;
    --surface:#1D2125;
    --surface-2:#24282C;
    --ink:#EDEBE6;
    --ink-soft:#A8AFB6;
    --ink-faint:#767D84;
    --accent:#38B3A6;
    --accent-ink:#DFF6F1;
    --accent-soft:#1D3733;
    --amber:#E0A251;
    --amber-soft:#3A2E1B;
    --line:#31363A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#15181B;
  --surface:#1D2125;
  --surface-2:#24282C;
  --ink:#EDEBE6;
  --ink-soft:#A8AFB6;
  --ink-faint:#767D84;
  --accent:#38B3A6;
  --accent-ink:#DFF6F1;
  --accent-soft:#1D3733;
  --amber:#E0A251;
  --amber-soft:#3A2E1B;
  --line:#31363A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  margin:0;
  font-family:"IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  padding-inline:16px;
}
::selection{ background:var(--accent-soft); color:var(--accent-ink); }

.wrap{ max-width:720px; margin:0 auto; }

.hero{
  padding-block:28px 18px;
  display:flex; flex-direction:column; gap:6px;
}
.hero .eyebrow{
  font-family:"IBM Plex Mono", monospace;
  font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent); font-weight:600;
}
.hero h1{
  font-family:"Sora", "PingFang SC", sans-serif;
  font-size:clamp(26px,6vw,34px);
  line-height:1.15;
  margin:0;
  text-wrap:balance;
  letter-spacing:-0.01em;
}
.hero p{
  margin:2px 0 0;
  color:var(--ink-soft);
  font-size:14.5px;
  line-height:1.5;
}
.stats{
  font-family:"IBM Plex Mono", monospace;
  font-size:12.5px;
  color:var(--ink-faint);
  margin-top:8px;
  font-variant-numeric: tabular-nums;
}

.search-bar{
  position:sticky;
  top: env(safe-area-inset-top, 0px);
  z-index:5;
  background:var(--bg);
  padding-block:10px 12px;
  display:flex; flex-direction:column; gap:10px;
}
.search-input-row{
  display:flex; align-items:center; gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  box-shadow:var(--shadow);
}
.search-input-row svg{ flex:none; color:var(--ink-faint); }
.search-input-row input{
  border:none; outline:none; background:transparent;
  font-size:15px; color:var(--ink); width:100%;
  font-family:"IBM Plex Sans", sans-serif;
}
.search-input-row input::placeholder{ color:var(--ink-faint); }

.chip-row{
  display:flex; gap:8px; overflow-x:auto;
  padding-bottom:2px;
  scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:none;
  font-family:"IBM Plex Mono", monospace;
  font-size:12.5px;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
  display:flex; align-items:center; gap:6px;
  transition:background .12s ease, color .12s ease, border-color .12s ease;
}
.chip:hover{ border-color:var(--accent); }
.chip .n{ color:var(--ink-faint); }
.chip.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.chip.active .n{ color:rgba(255,255,255,.75); }

.list{ display:flex; flex-direction:column; gap:12px; padding-block:14px 40px; }

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.card-top{
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  margin-bottom:8px;
}
.card-tag{
  font-family:"IBM Plex Mono", monospace;
  font-size:11px;
  color:var(--amber);
  background:var(--amber-soft);
  padding:3px 8px;
  border-radius:6px;
  letter-spacing:.02em;
}
.card-id{
  font-family:"IBM Plex Mono", monospace;
  font-size:11px;
  color:var(--ink-faint);
}
.card h3{
  font-family:"Sora", "PingFang SC", sans-serif;
  font-size:18px;
  margin:2px 0 6px;
  line-height:1.35;
  text-wrap:balance;
}
.card .salary{
  font-family:"IBM Plex Mono", monospace;
  font-size:13.5px;
  color:var(--accent-ink);
  background:var(--accent-soft);
  display:inline-block;
  padding:3px 9px;
  border-radius:6px;
  margin-bottom:10px;
  font-variant-numeric: tabular-nums;
}
.jd{
  font-size:13.5px;
  line-height:1.65;
  color:var(--ink-soft);
  white-space:pre-line;
  max-height:5.6em;
  overflow:hidden;
  position:relative;
}
.jd.expanded{ max-height:none; }
.jd:not(.expanded)::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:2.6em;
  background:linear-gradient(to bottom, transparent, var(--surface));
}
.card-actions{
  display:flex; justify-content:space-between; align-items:center;
  margin-top:12px; padding-top:12px;
  border-top:1px dashed var(--line);
  gap:10px;
}
.toggle-btn{
  font-family:"IBM Plex Mono", monospace;
  font-size:12.5px;
  color:var(--ink-soft);
  background:none; border:none; cursor:pointer;
  padding:6px 0;
  display:flex; align-items:center; gap:4px;
}
.toggle-btn:hover{ color:var(--ink); }
.apply-btn{
  font-family:"IBM Plex Sans", sans-serif;
  font-weight:600;
  font-size:13.5px;
  color:#fff;
  background:var(--accent);
  border:none; border-radius:10px;
  padding:9px 16px;
  text-decoration:none;
  display:inline-flex; align-items:center; gap:6px;
  white-space:nowrap;
}
.apply-btn:hover{ filter:brightness(1.06); }

.empty{
  text-align:center;
  color:var(--ink-faint);
  padding:60px 20px;
  font-size:14px;
}

.footer-note{
  text-align:center;
  color:var(--ink-faint);
  font-size:12px;
  padding-block:8px 36px;
  line-height:1.6;
}
.footer-note a{ color:var(--accent); }
</style>
</head>

"jd": "岗位职责\n1. 网页采集，从任意站点建设完整链路（列表 → 详情 → 媒体资源），处理动态渲染、验证码、滑块、Cloudflare 等防护\n2. APP 协议逆向，逆向 Android / iOS 网络协议，还原加密请求、签名算法、Token 生成逻辑，复现为纯 HTTP 采集\n3. Telegram 社群采集，基于 MTProto 接入社群，实时监听并采集群组消息、媒体、用户信息\n4. 反爬对抗，针对 IP 限流、TLS 指纹、行为分析、WAF 等设计 bypass 方案\n5. 加解密复现，移植 RC4 / AES / RSA 等算法，从混淆源码或抓包数据逆推密钥、IV、加密模式\n6. 工程交付，采集稳定性、断点续采、并发与带宽控制、媒体下载加速、日志与告警\n\n任职要求\n1. 3 年以上采集工程经验，独立完成过 3 个以上复杂站点从零到一的采集建设，且面对的是真实线上反爬\n2. HTTP / Web 协议底层理解，能手写请求、讲清各请求头含义与常见 Content-Type 格式；理解 Cookie 持久化、CORS、重定向、缓存策略\n3. JavaScript 逆向能力，能读懂混淆 / 压缩 JS；用过 AST 反混淆或字节码 VM 反编译；能用 DevTools 断点做动态调试\n4. Go 或 Python 生产级经验，其一 3 年以上深度使用；理解并发模型、HTTP 客户端、日志与错误处理等工程细节\n5. APP 协议逆向（Android 优先），逆向过 2 个以上安卓应用的网络协议；熟练使用 Frida / Burp / Charles 做动态分析\n6. AI 协作能力，掌握「问题分解 → AI 生成 → 自主验证 → 迭代」工作流；能识别 AI 代码中的参数猜测、逻辑缺陷与安全问题并当场纠正\n\n加分项\n1. 强反爬对抗：处理过 Cloudflare Turnstile / Bot Management；理解 TLS 指纹识别原理，用过 curl_cffi、TLSClient 或商业 bypass 服务\n2. 浏览器自动化：Selenium / Puppeteer / Playwright / nodriver；能设计登录自动化与动态渲染采集方案\n3. Telegram 客户端开发：MTProto 协议或 gotd / TDLib / Pyrogram，理解账号与会话管理\n4. 分布式采集架构：任务队列、去重、断点续采、负载均衡的设计经验；理解消息队列（Kafka / RabbitMQ）与 MySQL / MongoDB / Redis 在采集链路中的分工\n5. 异构数据建模：能针对站点结构差异大、字段不稳定的场景设计 MongoDB 文档模型，并规划与关系库的分工边界\n6. 媒体处理：ffmpeg / imagemagick；理解 M3U8、DASH 流媒体协议，能下载与转封装\n7. 安全意识：熟悉常见注入类漏洞；理解凭证管理规范，不在代码中硬编码 Token", "cat": "采集与逆向"}, {"id": "5", "title": "内容生产总监", "salary": "30-50K", "jd": "【岗位职责】\n1. 盘活存量：统筹管理现有内容采集团队，优化内容筛选机制，提升现有业务流水线效率；\n2. 拓展增量：从0到1组建并管理内容生产团队，主导“视频剪辑、视频深度二创、短剧生成”等新业务的落地与量产；\n3. 产能统筹：协助一号位进行整体团队管理，拉通采集组与自产组资源，协调并大幅拉升各组产能；\n4. 体系搭建：建立从内容策划、制作到审核分发的工业化SOP标准。\n\n【任职要求】\n1. 懂内容：具备扎实的内容生产与策划能力（资深编辑、新媒体主编、短视频操盘手出身），网感极佳；\n2. 懂视频与新玩法：精通短视频剪辑与深度二创玩法，对“短剧生成”、AIGC辅助内容生产有实操经验或深入研究；\n3. 懂管理：具备成建制内容团队（几十人规模）的实战管理经验，懂“工业化流水线”作业，能带兵打仗拿结果；\n4. 懂战略：不只是执行者，必须具备业务视角的战略眼光，能为业务从“单纯采集”向“自产内容生态”转型提供破局思路。", "cat": "内容与创作"}, {"id": "6", "title": "AI短剧编剧", "salary": "10K-20K", "jd": "【岗位定位】\n负责 AI 内容项目的整体创意策划与质量把控，从剧本构思到最终成片，对作品的内容质量与传播效果负责。\n【岗位职责】\n根据运营需求完成 AI 短剧、剧情视频、宣传片等内容策划；\n独立完成剧本、人物设定、故事结构、分镜设计及创意方案；\n制定整体内容风格、节奏、镜头语言及画面表现形式；\n指导 AI 创作者完成角色、场景及视频素材生成；\n与剪辑、设计等岗位协同，推进项目按计划落地；\n对最终成片进行内容质量审核，把控整体表现（涉及合规/风险的内容，需按公司要求同步相关审核）；\n持续研究行业爆款，总结创作方法，优化团队创作流程。\n【任职要求】\n有短剧、影视、自媒体、广告等内容策划经验，具备优秀的故事创作与剧本能力；\n熟悉短视频传播逻辑及用户喜好，具备较强的审美与画面感；\n沟通协调能力好，能推动团队协作完成项目；\n有 AI 内容创作经验者优先；真人影视/短剧背景者，需具备转型 AI 内容创作的意愿与能力（我们的内容方向以 AI 生成为主，纯真人制作背景、且无转型意愿者不匹配）。\n【加分项】\n熟悉 ChatGPT、Claude 等 AI 创作工具；\n有导演、影视、广告行业经验，或有爆款内容案例；\n熟悉海外内容平台。", "cat": "内容与创作"}, {"id": "7", "title": "高级剪辑", "salary": "10K-20K", "jd": "【岗位定位】\n负责 AI 内容制作全流程，从 AI 素材生成到视频包装，独立完成高质量内容输出，对最终成片效果负责。\n【岗位职责】\n根据剧本完成 AI 图片、视频等素材生成，使用 AI 工具制作角色、场景、镜头及动画；\n独立完成视频剪辑、字幕、配音、转场及节奏优化；\n完成封面、海报、宣传图等平面设计工作；\n持续优化 AI 生成效果，提升内容质量与制作效率；\n与编剧保持沟通，确保作品风格统一；\n建立 AI 创作素材库及项目模板，提高团队复用效率。\n【任职要求 · 必备】\n熟练掌握 Premiere、剪映、Final Cut、DaVinci 等至少一款剪辑软件；\n对镜头节奏、画面构图及视觉表达有较强理解，审美与内容包装能力强；\n能独立完成从素材制作到最终成片的全部流程。\n\n【任职要求 · 熟悉即可（可入职后补齐）】\n熟悉 Midjourney、Flux、Runway、Veo、Kling、即梦等 AI 生成工具；\n熟悉 Photoshop、Figma、Canva 等设计工具。\n\n【加分项】\n\n有 AI 短剧制作经验或影视后期经验；\n熟悉 AIGC 工作流；\n熟悉短视频平台内容传播规律。", "cat": "内容与创作"}, {"id": "8", "title": "新媒体运营（国外媒体方向）", "salary": "10K-20K", "jd": "一、岗位职责\n1.负责X（Twitter）为核心的账号矩阵运营\n\n搭建并管理多账号矩阵（内容号 + 流量池号）\n\n制定内容策略，提升曝光、互动与粉丝增长\n\n通过推荐流机制放大内容，持续产出稳定流量\n\n多平台分发与放大\n\n将内容同步分发至 TikTok / Telegram / Instagram /  等平台\n\n\n2.建立跨平台流量回流链路\n\n搭建完整转化链路\n实现从「内容 → 点击 → TG/网站 → 转化」的闭环\n\n负责产品的导流策略\n\n优化主页、跳转路径、话术，提高转化率\n\n内容生产与爆款复制\n\n持续跟踪海外成人/AI/擦边内容趋势\n\n拆解爆款结构（标题/封面/视频节奏）并复用\n\n与运营/编剧/剪辑/协作，提升内容质量与产量\n\n3.数据分析与优化\n\n每日监控账号数据（曝光、点击、互动、转化）\n\n输出数据复盘，优化选题与内容结构\n\n通过数据驱动增长（而不是拍脑袋做内容）\n\n4.AI工具与自动化应用\n\n使用 AI 工具进行文案、图片、视频处理（如 ChatGPT / MJ / ComfyUI 等）\n\n配合 agent 实现内容生产、发布、数据监测自动化\n\n提升整体运营效率\n\n 二、任职要求\n1.经验要求\n\n2年以上海外自媒体运营经验\n熟悉 X（Twitter）平台机制（推荐流 / 标签 / 账号权重）\n\n有账号从0-1或矩阵运营经验优先\n\n2.能力要求\n\n具备完整的「内容 → 流量 → 转化」运营思维\n\n能独立完成选题、文案、发布及优化\n\n对数据敏感，能通过数据分析调整策略\n\n3.行业认知\n能接受成人内容方向\n对海外中文用户，其他用户偏好有一定理解\n\n熟悉擦边/成人内容边界与平台规则\n\n4.执行与协作能力\n\n结果导向，执行力强\n\n能与编剧、剪辑、产品团队高效配合\n\n 三、加分项\n1.有 成人站 / 色站  相关经验\n\n2.熟悉 Telegram 运营（频道 + 群 + 机器人玩法）\n\n3.有 矩阵号放量经验（10+账号以上）\n\n4.熟悉  TikTok / Porn类站点引流\n\n5.会使用 AI工具：\n\n有自动化/agent使用经验", "cat": "运营与市场"}, {"id": "9", "title": "高级安全攻防工程师（管理经验优先）", "salary": "30k-70k", "jd": "岗位职责\n负责公司网络安全攻防体系规划和团队日常管理。\n制定安全测试及红蓝对抗计划。\n组织对公司网站、APP、API、服务器和云环境进行授权渗透测试。\n负责重大安全事件的研判、指挥、止损、溯源和复盘。\n建立攻防测试授权、操作审计、漏洞分级和修复验收机制。\n协调运维、研发、测试、CDN及各公司技术负责人完成安全整改。\n评估新的攻击方式，并转化为内部防护方案。\n向CTO输出集团安全风险报告和重点整改建议。\n\n任职要求\n5年以上网络安全、渗透测试或应急响应经验。\n熟悉Web、API、APP、主机、容器、云环境的常见攻击面。\n能独立处理入侵、黑链、盗流、域名劫持、DNS污染、DDoS、数据泄露等事件。\n熟悉Linux、Nginx、CDN、WAF、MongoDB、Redis、Kafka等常见环境的安全风险。\n熟悉Go、Java、PHP中至少两种技术栈的代码安全问题。\n具备较强的跨团队推动和风险判断能力。\n有大型互联网业务、红蓝对抗或重大应急事件经验优先。", "cat": "安全攻防"}, {"id": "10", "title": "效能督查官", "salary": "18K-25K", "jd": "岗位名称：效能督查官\n\n汇报对象：CTO\n\n岗位职责\n\n1. 跟进各部门及项目组的进度执行情况，定期核查任务排期与里程碑达成情况是否符合既定节点。\n2. 核实各部门实际产出与汇报内容是否一致，发现进度失真、责任归属不清等问题时，及时与相关负责人核实并推动整改。\n3. 收集整理各部门的项目进度与产出数据，形成统一格式的督查报告，按周期汇总提交给上级。\n4. 对反复出现问题且未有效整改的部门或责任人，如实上报，保持客观公正，不做选择性汇报。\n5. 建立并维护可量化的进度跟踪机制，如项目清单、进度看板等，使督查工作有据可查。\n6. 视情况参与跨部门协调，推动阻塞事项落地，确保督查结果转化为实际改进。\n\n任职要求\n\n1. 具备较强的原则性与抗压能力，能够客观、坚定地指出问题，沟通专业、不情绪化。\n2. 逻辑清晰、表达直接，能够准确、简洁地传达复杂的进度信息。\n3. 具备项目管理、运营督导、审计或同类对结果负责岗位的相关经验者优先。\n4. 熟练使用表格及看板工具（如Excel、飞书多维表格、Notion等）进行数据整理与呈现。\n5. 对业务有基本理解，能够判断进度延误的真实原因。\n6. 具备良好的向上沟通能力，能够客观、完整地向管理层汇报情况。\n\n核心素质要求\n\n1. 标准统一、对事不对人，不因人情关系而调整判断尺度。\n2. 抗压能力强，能够承受督查过程中的抵触情绪。\n3. 结果导向，跟进问题直至闭环，而非止步于提醒。", "cat": "职能与行政"}, {"id": "11", "title": "高级品牌策划", "salary": "20-35K", "jd": "岗位名称：高级品牌策划\n\n岗位职责\n1. 负责集团品牌整体策略规划、品牌定位迭代、品牌理念及价值体系搭建，输出标准化品牌策略方案。\n2. 统筹年度品牌传播主题、节点营销、品牌IP内容、全域传播策略的策划与落地，主导品牌升级、品牌焕新等重点专项项目。\n3. 深度拆解行业竞品品牌打法、市场趋势及用户偏好，输出品牌市场分析、策略优化报告，持续迭代品牌运营思路。\n4. 联动新媒体、社群、用户运营、设计等团队，统筹各类品牌内容、活动、传播物料的策略方向，保障品牌调性统一。\n5. 负责品牌项目全流程管控，包含方案输出、落地跟进、数据复盘、策略优化，沉淀可复用的品牌打法与案例体系。\n6. 能够对整体品牌团队进行协调管理，并保证方案的实际执行。\n7. 熟练运用AI工具辅助市场调研、策略 brainstorm、方案优化、内容选题，大幅提升品牌策划与迭代效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，3年以上品牌全案策划、品牌策略相关工作经验，有集团化品牌统筹经验优先。\n2. 具备完整的品牌策略搭建、品牌活动全案操盘、品牌内容体系搭建经验，能够独立输出高质量全案策略。\n3. 对新媒体热点、行业趋势、用户审美高度敏感，可结合品牌调性创新策划传播内容与营销玩法。\n4. 具备优秀的文案功底、逻辑思维和创意能力，策略落地性强，可高效联动多团队协同推进项目。\n5. 具备较强的数据复盘能力，能够依据传播数据、用户反馈持续优化品牌策略与内容方向。\n6. 有泛娱乐、互联网媒体、内容平台品牌策划经验者优先。\n7. 熟练或愿意深度使用各类AI工具，具备主动用AI提效、创新策划的工作意识。\n\n工作形式：英国本地 / 远程均可", "cat": "运营与市场"}, {"id": "12", "title": "项目经理", "salary": "依能力与经验面议", "jd": "岗位职责\n1. 负责 Web、App 及短视频/视频产品的品牌升级项目，统筹从品牌策略落地、视觉规范输出到全端换新上线的全过程，对进度、品质、成本与上线效果负责。\n2. 制定品牌升级整体计划与里程碑，拆解 Web 端、App 端、短视频账号及视频物料等各触点任务，确保多端同步推进、节点对齐。\n3. 把控品牌视觉在各端的落地品质，覆盖界面视觉、播放器与内容包装、运营物料等，保障风格统一、品牌识别一致。\n4. 组织品牌方案评审、设计验收与上线复核，明确各触点交付标准与验收口径，减少返工与品牌表达偏差。\n5. 协调品牌、设计、视频制作及市场传播等相关方，对齐升级节奏与发布档期，推动物料齐套、按时上线。\n6. 识别档期冲突、物料延期、多端不一致及成本风险并推动闭环；项目结束后完成复盘，沉淀品牌升级规范与资产。\n\n任职要求\n1. 本科及以上学历5年以上项目管理经验，其中 2年以上大型交付型项目管理经验。\n2. 具备 50 人以上项目团队的实际管理经验，能统筹跨职能协作、资源调配与效能提升。\n3. 有独立操盘并成功交付单体合同/预算 1000 万以上项目的真实案例，具备范围管理、成本核算与收益把控能力。\n4. 熟练掌握项目管理方法，能独立进行计划制定、WBS 拆解、里程碑监控、风险预警与变更管理。\n5. 持有 PMP 认证，熟悉 PMBOK 体系；具备极强的交付结果导向、风险预判、跨部门协调及向上汇报能力。\n\n加分项\n1. 有品牌升级、视觉焕新或 Web/App/短视频多端品牌落地经验。\n2. 有泛娱乐、短视频、新媒体、数字内容等相关行业背景。\n3. 兼具 ACP、Scrum Master 等认证，或具备 IPD 流程落地经验。\n4. 有大型软件开发、系统集成或复杂项目群交付经验。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "产品与管理"}, {"id": "13", "title": "品牌策划专员", "salary": "12-20K", "jd": "岗位名称：品牌策划专员\n\n简历筛选要点：具备品牌策划、内容策划、活动执行实操经验；热点敏感度高，擅长落地执行与文案输出；会基础图文内容处理；熟练使用AI工具辅助工作；有成人行业泛娱乐、新媒体行业经验者优先。\n岗位职责\n1. 协助高级策划完成品牌策略落地、品牌活动、节点营销、话题传播的方案细化与执行落地。\n2. 负责品牌日常宣传文案、推文、新闻素材、活动话术、品牌故事等内容的撰写与优化。\n3. 跟踪行业热点、网络趋势、竞品动态，收集优质案例，输出素材汇总与基础分析内容，支撑品牌创新策划。\n4. 配合设计、新媒体、运营团队，完成各类品牌物料、传播内容的需求对接、内容审核、上线跟进。\n5. 负责品牌基础资产归档、宣传素材整理、活动复盘总结，沉淀标准化品牌执行资料。\n6. 运用AI工具辅助文案撰写、选题搜集、素材整理、基础数据分析，提升日常工作效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上品牌策划、内容策划、文案运营相关工作经验。\n2. 熟悉新媒体品牌传播逻辑，了解主流平台内容玩法，能够贴合品牌调性输出内容。\n3. 对网络热点、流行文化敏感，可快速结合热点适配品牌宣传场景。\n4. 文案功底扎实，写作风格灵活，可适配不同平台、不同场景的内容创作需求。\n5. 执行力强，具备良好的协同沟通能力，可高效配合多团队完成品牌落地工作。\n6. 有泛娱乐、内容媒体、互联网平台品牌相关经验者优先。\n7. 熟悉或愿意学习AI工具，具备借助工具提升内容产出与工作效率的意识。\n\n工作形式：远程", "cat": "运营与市场"}, {"id": "14", "title": "品牌平面设计", "salary": "12-20K", "jd": "具备品牌平面设计、视觉物料制作、品牌视觉落地实操经验；审美能力出众，擅长视觉适配、版式设计与画面优化；熟练掌握主流设计软件，会基础短视频封面、图文排版处理；熟练使用AI设计工具辅助创作；有成人行业泛娱乐、新媒体、互联网品牌设计经验者优先。\n岗位职责\n1. 协助资深设计完成品牌视觉体系落地，配合品牌营销、节点活动、话题传播、日常宣传等场景，完成各类平面视觉方案的细化设计与落地输出。\n2. 负责品牌日常宣传物料设计，包含公众号推文配图、海报、长图、banner、活动物料、宣传画册、品牌素材图、社交传播图等全品类平面视觉内容制作与优化。\n3. 跟踪行业视觉趋势、新媒体设计风格、竞品品牌视觉动态，收集优质视觉案例，完成素材汇总与视觉风格分析，为品牌视觉创新、风格迭代提供支撑。\n4. 配合品牌策划、新媒体、运营团队，对接各类视觉设计需求，精准理解策划方案与营销场景，完成物料设计、修改、审核、上线跟进，保障视觉内容贴合品牌调性与活动需求。\n5. 负责品牌视觉资产归档整理，统一品牌视觉规范，梳理各类设计模板、素材库，完成活动视觉复盘，沉淀标准化品牌视觉设计资料，提升团队出图效率。\n6. 熟练运用AI设计工具辅助画面创作、素材生成、版式优化、图片精修等工作，高效完成设计任务，持续提升视觉产出质量与工作效率。\n任职要求\n1. 本科及以上学历，35岁以下，1年以上品牌平面设计、新媒体视觉设计、商业设计相关工作经验。\n2. 熟悉新媒体品牌视觉传播逻辑，了解抖音、公众号、小红书等主流平台视觉玩法与审美偏好，能够精准贴合品牌调性输出适配不同场景的视觉作品。\n3. 对网络流行风格、视觉热点、潮流元素敏感，可快速结合热点适配品牌营销、日常宣传的视觉创作场景。\n4. 扎实的平面设计功底，版式审美优秀，色彩搭配能力出众，风格适配性强，可独立完成多场景、多品类视觉物料设计，具备良好的画面优化与细节把控能力。\n5. 执行力强，具备良好的沟通协同能力，可精准对接多团队需求，高效完成批量设计任务与视觉落地工作，抗压能力良好。\n6. 有泛娱乐、内容媒体、互联网平台、成人行业品牌视觉设计经验者优先。\n7. 熟练使用PS、AI等主流设计软件，熟悉或愿意深耕AI设计工具，具备借助工具优化创作流程、提升设计效率与作品质感的意识。\n工作形式：远程", "cat": "运营与市场"}, {"id": "15", "title": "高级UI设计师", "salary": "18-25K", "jd": "岗位名称：高级UI设计师\n\n岗位职责\n1. 负责集团相关产品、平台、社媒载体的UI界面设计、视觉规范搭建与落地，保障整体视觉统一。\n2. 主导用户体验（UX）优化，梳理用户操作路径、交互逻辑，输出原型、交互方案、体验优化迭代建议。\n3. 结合品牌调性与平台风格，完成页面视觉、活动专题、弹窗、功能界面、社群素材等设计工作。\n4. 联动运营、策划、产品团队，理解业务需求，输出适配传播与用户使用场景的设计方案。\n5. 跟踪用户体验反馈、页面数据表现，持续迭代视觉与交互设计，提升用户使用体验与视觉质感。\n6. 运用AI设计工具辅助素材生成、视觉迭代、版式优化，提升设计产出效率与创意丰富度。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上UI/UX设计、互联网视觉设计相关工作经验。\n2. 熟练掌握UI设计、交互设计方法，精通各类设计软件，具备独立完成界面设计、原型设计、体验优化的能力。\n3. 审美优秀，熟悉年轻化、泛娱乐、新媒体视觉风格，贴合网络流行审美趋势。\n4. 具备良好的需求理解能力与逻辑思维，有独立主导过完整产品视觉体系搭建经验，可结合用户行为与业务目标优化设计方案。\n5. 具备数据意识，可根据用户反馈、页面数据持续优化视觉与交互体验。\n6. 有泛娱乐产品、内容平台、社群产品设计经验者优先。\n7. 熟练或愿意学习AI设计工具，具备借助AI提升设计效率与创意输出的能力。\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "16", "title": "中级运营-社群运营方向", "salary": "12-20K", "jd": "岗位名称：中级运营\n\n岗位职责\n1. 负责品牌官方社群、用户社群的日常搭建、维护与管理，搭建标准化社群运营SOP。\n2. 策划社群日常话题、互动活动、福利玩法，活跃社群氛围，提升用户活跃度、留存率与归属感。\n3. 实时维护社群日常互动，解答用户疑问，收集用户建议、反馈与核心需求，定期汇总上报。\n4. 结合热点节点、品牌活动、内容更新，策划社群专属传播与互动玩法，联动品牌传播落地。\n5. 做好社群用户分层管理，精准维护核心用户、忠实用户，沉淀品牌私域用户资产。\n6. 运用AI工具辅助社群话题策划、互动文案、用户问答模板、内容素材生成，提升社群运营效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上社群运营、私域运营、用户互动相关工作经验。\n2. 熟悉主流社群平台运营规则，擅长社群氛围打造、话题运营与用户关系维护。\n3. 性格开朗、网感极佳，熟悉网络流行文化与年轻用户喜好，能快速拉近用户距离。\n4. 文案表达活泼自然，擅长输出轻量化、高互动性的社群内容与话术。\n5. 具备良好的用户洞察力和数据意识，可根据社群数据、用户反馈优化运营玩法。\n6. 有泛娱乐、粉丝社群、内容平台私域运营经验者优先。\n7. 熟悉或愿意深度使用AI工具，主动借助工具优化社群内容与运营效率。\n工作形式：远程", "cat": "运营与市场"}, {"id": "17", "title": "AI影视制片运营", "salary": "依能力与经验面议", "jd": "岗位职责\n负责AI影视项目制片统筹与全平台内容运营，制定项目排期、内容发布及账号运营计划，协调制作、运营和市场资源，持续跟踪内容数据、流量表现及商业化效果，并通过复盘优化内容生产、分发及变现策略。\n任职要求\n本科及以上学历，1年以上影视短剧制片、新媒体或短视频运营经验，具备项目统筹、资源协调及进度管理能力；熟悉抖音、快手、小红书、视频号等平台内容规则，具备内容包装、数据分析、流量运营及商业化意识。\n加分项\n有AI短剧、短视频账号矩阵运营经验，有爆款内容或账号增长案例，熟悉短剧付费、广告合作、内容带货等商业化模式优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "18", "title": "AI影视项目总监", "salary": "依能力与经验面议", "jd": "岗位职责\n负责AI电影、AI短剧项目整体统筹，制定项目计划及里程碑，协调编剧、AI生成、后期、运营等岗位协作，对项目进度、制作质量、成本、量产效率及最终交付负责，同时建立项目制作、验收及复盘机制。\n任职要求\n本科及以上学历，2年以上AI影视、AI短剧或相关内容项目管理经验，有完整项目操盘及交付案例；具备团队统筹、进度管理、成本与质量控制能力，熟悉主流AI影视制作工具及工作流程，能够识别风险并推动问题解决。\n加分项\n有爆款AI短剧、AI影视内容项目经验，具备泛娱乐、新媒体、影视行业背景，或有PMP等项目管理认证及标准化工作流搭建经验优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "19", "title": "AI影视生成师（视频 / 镜头方向）", "salary": "依能力与经验面议", "jd": "负责AI影视镜头及视频素材生成，根据剧本和分镜完成画面生产、参数调试、素材优化及风格统一，持续处理人物、场景、镜头及画面质量问题，提高素材良品率和量产效率，并沉淀Prompt、参数及视觉风格模板。\n任职要求\n本科及以上学历，1年以上AI视频或AI影视生成实操经验，能够独立完成多场景、多镜头素材生产；熟练使用Runway、Pika、Stable Diffusion、Sora等AI工具，熟悉Prompt及参数调试，具备较好的影视构图、光影、色彩及画面审美能力。\n加分项\n有AI短剧批量生产经验，会LoRA微调或风格模型训练，拥有成熟Prompt库、参数模板、镜头素材库或个人AI影视作品集优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "20", "title": "品牌与市场策略负责人", "salary": "依能力与经验面议", "jd": "负责多产品线品牌与市场策略建设，从0到1搭建品类认知、品牌定位及核心传播框架；持续开展行业趋势、竞品及市场研究，为品牌升级提供策略判断，并推动品牌策略、传播口径及方法论在具体项目中落地。\n任职要求\n本科及以上学历，3年以上品牌策略、市场洞察、品类研究等相关经验，有从0到1搭建品牌或策略体系的经历；具备较强的市场分析、结构化思考、策略输出及跨团队推动能力，自驱力和结果意识强。\n加分项\n有互联网、内容、泛娱乐行业经验，多产品线品牌策略经验，或品牌定位、品牌升级、传播策略等完整项目案例优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "运营与市场"}, {"id": "21", "title": "AI影视编剧 / 分镜策划", "salary": "依能力与经验面议", "jd": "岗位职责\n负责AI电影、AI短剧的剧本创作、人物设定、场景设计及分镜策划，根据AI生成特点优化剧情结构、镜头设计及生成关键词，把控内容节奏和整体调性，并与AI生成、后期岗位协作，保障内容可制作、可量产、可落地。\n任职要求\n本科及以上学历，1年以上短剧、影视编剧或内容策划经验，具备独立完成剧本、人设及分镜设计能力；熟悉短剧剧情节奏、钩子、冲突及反转逻辑，了解AI影视生成特点，具备良好的文字表达、镜头审美及跨岗位协作能力。\n加分项\n有AI短剧、AI影视实际创作案例，擅长甜宠、悬疑、科幻、古风等多题材创作，拥有成熟剧本模板、分镜体系或Prompt素材库优先。\n建议薪资范围：依能力与经验面议\nPS：该岗位需要准备案例。", "cat": "内容与创作"}, {"id": "22", "title": "AI影视后期制作师", "salary": "依能力与经验面议", "jd": "岗位职责\n负责AI电影、AI短剧成片后期制作，包括剪辑、调色、画面修复、音频、字幕及特效处理，把控整体剪辑节奏、视觉风格和成片质量，解决AI素材常见瑕疵，并沉淀剪辑、调色及音频模板，提高后期量产效率。\n任职要求\n本科及以上学历，1年以上影视、短剧后期制作经验，可独立完成完整短剧后期；熟练使用PR、AE、达芬奇、剪映等工具，熟悉AI视频素材特点，具备良好的剪辑节奏、视觉审美、画面修复及成片质量把控能力。\n加分项\n有AI影视或AI短剧后期制作经验，熟悉AI配音工具，有成熟剪辑模板、调色预设、音效素材库或完整成片案例优先。", "cat": "内容与创作"}, {"id": "23", "title": "中级运营-用户运营方向", "salary": "12-20K", "jd": "岗位名称：中级运营专员\n\n岗位职责\n1. 负责品牌全域用户的整体运营，搭建用户生命周期管理体系，涵盖拉新、激活、留存、活跃、转化全链路。\n2. 完成用户分层、标签体系搭建，针对不同层级用户制定差异化运营策略，精细化运营用户资产。\n3. 深度挖掘用户需求、用户偏好、核心痛点，输出用户分析报告，反向赋能品牌内容、产品、活动优化。\n4. 跟踪用户数据指标，包含活跃度、留存率、互动率、流失率等，定期输出数据复盘与优化方案。\n5. 策划用户专属活动、会员体系、用户激励玩法，提升用户粘性、品牌好感度与用户忠诚度。\n6. 运用AI工具辅助用户画像分析、用户分层、运营内容匹配、数据复盘，提升精细化运营能力。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上用户运营、用户增长、精细化运营相关工作经验。\n2. 熟悉互联网用户运营逻辑，掌握用户生命周期管理、用户分层精细化运营方法。\n3. 具备极强的用户洞察力，能够精准捕捉用户需求与偏好，落地针对性运营动作。\n4. 数据思维清晰，可通过数据变化发现问题、总结规律，独立优化运营策略。\n5. 具备良好的沟通能力、策略落地能力，可联动各团队完成用户运营专项工作。\n6. 有泛娱乐、内容媒体、订阅制平台用户运营经验者优先。\n7. 熟练或愿意学习AI工具，能够利用AI赋能用户分析与精细化运营。\n\n工作形式：英国本地 / 远程均可", "cat": "运营与市场"}, {"id": "24", "title": "中级运营-内容运营方向", "salary": "12-20K", "jd": "岗位职责】\n1.        负责品牌社媒平台（国内及国外）的日常内容策划与发布执行\n2.        结合平台热点与品牌调性，策划品牌相关互动话题、内容系列与传播节点\n3.        跟踪各平台内容数据表现，定期输出分析报告，持续优化内容方向与发布策略\n4.        配合设计组完成社媒物料的需求沟通与上线跟进，确保内容与视觉高度协同\n5.        维护社媒账号日常互动，提升用户粘性与品牌好感度，独立负责内容方向策划与选题体系搭建，有可量化的内容产出目标（如涨粉/互动率）\n6.        熟练运用AI工具辅助选题策划、文案撰写与数据分析，提升内容产出效率\n\n【任职要求】\n1.        本科及以上学历，35岁以下，至少1年社媒运营或内容运营相关工作经验\n2.        熟悉国内外等主流平台的内容逻辑与算法规则\n3.        对娱乐热点、网络梗文化高度敏感，具备将热点转化为品牌内容的能力\n4.        文案表达能力强，风格活泼自然，能快速产出符合平台调性的内容\n5.        数据意识强，能通过数据反馈独立判断内容方向并推动调整\n6.        有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n7.        熟悉或愿意深度使用AI工具，具备用AI提效的主动意识", "cat": "内容与创作"}, {"id": "25", "title": "AI游戏制作师", "salary": "20-30K", "jd": "岗位名称：女性向AI游戏设计师\n\n岗位职责\n1. 专注女性向AI游戏、情感互动内容、轻量化乙系互动产品的视觉设计、角色设计、场景氛围设计，贴合女性用户审美与情感需求。\n2. 依托AI工具完成游戏人设、立绘、CG插图、场景道具、剧情视觉素材的批量生成与精细化二次优化，统一整体美术风格与故事氛围。\n3. 结合女性向内容调性、情感叙事逻辑、热点流行元素，设计差异化角色形象、互动场景与视觉体系，打造高质感、高共情的游戏视觉体验。\n4. 配合策划团队完成剧情脚本、互动玩法、故事分镜的视觉落地，根据剧情情绪、人物人设调整画面质感、光影与氛围细节。\n5. 收集用户反馈与行业女性向游戏流行趋势，持续迭代视觉风格、角色体系、画面表现，优化内容吸引力与用户沉浸感。\n6. 沉淀女性向AI游戏设计标准、提示词模板、素材资源库与风格规范，利用AI工具持续提升内容产出效率与创意上限。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上游戏美术、游戏设计、AI内容创作相关工作经验，有女性向/乙女游戏设计经验优先。\n2. 具备扎实的美术审美与色彩、光影、造型功底，精准拿捏女性向唯美、治愈、氛围感、精致化视觉风格。\n3. 熟练掌握Midjourney、Stable Diffusion等主流AI设计工具，精通提示词工程、模型调用、细节可控出图，可独立完成高质量AI美术内容创作与优化。\n4. 深度了解女性向游戏用户喜好、情感需求、审美趋势，熟悉乙游、情感陪伴、沉浸式叙事类内容玩法与视觉逻辑。\n5. 具备良好的剧情理解能力与创意思维，可结合故事内容输出适配的视觉画面与场景氛围。\n6. 有女性向游戏、AI互动视觉、情感类内容、虚拟角色设计落地经验者优先。\n7. 主动钻研AI新工具、新玩法，具备持续用AI迭代设计质量、提升产出效率的工作意识。\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "26", "title": "内容策略经理", "salary": "12K-20K", "jd": "岗位名称：高级内容策略\n\n\n【岗位职责】\n1.        负责品牌社媒平台（国内及国外）的日常内容策划与发布执行\n2.        结合平台热点与品牌调性，策划品牌相关互动话题、内容系列与传播节点\n3.        跟踪各平台内容数据表现，定期输出分析报告，持续优化内容方向与发布策略\n4.        配合设计组完成社媒物料的需求沟通与上线跟进，确保内容与视觉高度协同\n5.        维护社媒账号日常互动，提升用户粘性与品牌好感度，独立负责内容方向策划与选题体系搭建，有可量化的内容产出目标（如涨粉/互动率）\n6.        熟练运用AI工具辅助选题策划、文案撰写与数据分析，提升内容产出效率\n\n【任职要求】\n1.        本科及以上学历，35岁以下，至少1年社媒运营或内容运营相关工作经验\n2.        熟悉国内外等主流平台的内容逻辑与算法规则\n3.        对娱乐热点、网络梗文化高度敏感，具备将热点转化为品牌内容的能力\n4.        文案表达能力强，风格活泼自然，能快速产出符合平台调性的内容\n5.        数据意识强，能通过数据反馈独立判断内容方向并推动调整\n6.        有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n7.        熟悉或愿意深度使用AI工具，具备用AI提效的主动意识\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "27", "title": "舆情与危机公关负责人", "salary": "12-20K", "jd": "\"岗位职责\n1. 从 0 到 1 搭建分品类情报监测与分级预警机制（渠道、频率、黄橙红分级、处置闭环）\n2. 打通客服及相关业务侧数据协同，把外部声量与内部信号合成统一风险判断\n3. 主导升级/上线等关键窗口的风险预研、表达抽检与口径输出，前置拦截高风险表述\n4. 独立推进重大负面与突发舆情的处置方案与复盘，沉淀口径库、案例库与制度\n5. 推动预警机制嵌入项目流程，确保风险可预警、可跟进、可关闭\n6. 管理外部监测资源（如有），完善内部流转、复盘与风控机制\n\n任职要求\n1. 本科及以上，3 年以上舆情、公关、内容风控或相关质量分析经验\n2. 有完整舆情/风控机制搭建落地经验，能独立判断风险并给出口径与动作建议\n3. 反应快、文字功底扎实，能在压力下跨部门推动整改与对齐\n4. 原则清晰，熟悉主流平台内容规则与监测工具使用\n\n加分项\n有窗口期监测或危机处置成功案例；有竞品舆论攻防经验；有服务商管理经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "28", "title": "AI 视频制作师", "salary": "20K–30K", "jd": "\"岗位职责\n1. 负责短视频、产品宣传视频、品牌创意视频等全类型视频的AI全流程制作，熟练运用各类AI视频工具，完成脚本落地、素材生成、剪辑合成、特效包装、调色输出等工作，产出高质量原创视频内容。\n2. 结合品牌视觉规范、产品特性及短视频平台调性，优化AI视频创作逻辑，定制视频画面风格、镜头语言、字幕包装，保障视频内容优质、风格统一、贴合品牌调性。\n3. 探索并落地各类新型AI视频生成工具、AI剪辑、AI特效、数字人、AI配音等技术，持续优化视频制作流程，提升出片效率与内容质感，实现批量、高效、精品化内容产出。\n4. 配合品牌升级、产品运营、市场推广需求，承接Web、App、短视频账号等多端视频物料制作，严格按照交付标准、档期要求完成物料输出，保障多端视频视觉统一、内容合规。\n5. 参与视频创意脚本研讨、方案评审，根据品牌规范、运营反馈、用户喜好优化视频内容，整改画面瑕疵、风格偏差等问题，持续提升视频传播力与观感体验。\n6. 沉淀AI视频制作素材库、模板库、操作规范及创作方法论，整理优质视频案例，固化品牌视频包装标准，为常态化内容产出和品牌视觉统一提供支撑。\n\n任职要求\n1. 本科及以上学历，2年以上AI视频制作、短视频剪辑、影视后期相关工作经验，熟练掌握AI视频创作全流程，有成熟的个人视频作品案例。\n2. 熟练使用主流AI视频工具，精通剪映、PR、AE等后期剪辑包装软件，掌握AI文生视频、图生视频、AI特效、AI修图、数字人视频制作等技能，能独立完成全流程视频产出。\n3. 具备优秀的视觉审美、镜头语感和色彩把控能力，熟悉短视频、互联网品牌视频的创作逻辑，能精准贴合品牌风格完成差异化视频创作。\n4. 具备高效的内容产出能力，能适配多场景物料制作需求，严格把控交付进度与成片质量，抗压能力强，可配合项目档期高效完成工作。\n5. 具备良好的沟通协作能力，能配合品牌、运营、市场团队对齐需求，精准落地创作要求，主动复盘优化制作流程，持续提升内容品质与出片效率。\n\n加分项\n1. 有互联网品牌、短视频、泛娱乐行业AI视频制作经验，参与过品牌视觉升级、多端视频物料统一落地项目者优先。\n2. 熟练掌握Runway、Pika、即梦等主流AI视频工具，具备AI视频创意优化、瑕疵修复、高质量成片打磨经验。\n3. 具备脚本撰写、创意策划能力，可独立完成视频创意+AI制作全链路工作。\n4. 有品牌全案视频、产品宣传片、矩阵短视频批量制作经验，熟悉多平台视频内容规则与传播逻辑。\n\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "内容与创作"}, {"id": "29", "title": "高级运营-社媒运营", "salary": "12K-20K", "jd": "\"岗位职责\n1. 负责公司产品、短视频及新媒体矩阵整体运营工作，制定阶段性运营策略、年度/季度运营目标与落地计划，统筹推进全渠道运营工作，对用户增长、活跃度、内容曝光、转化数据等核心指标负责。\n2. 统筹各平台账号日常运营，涵盖短视频平台、App、Web端及新媒体渠道，负责内容选题、节奏规划、活动策划、热度追踪等工作，搭建标准化运营体系，保障账号稳定更新与数据持续增长。\n3. 结合产品特性、用户画像及行业热点，策划线上运营活动、话题营销、内容专题等，联动内容、视频、市场团队落地执行，提升品牌曝光、用户粘性及产品影响力，助力用户拉新、留存、促活。\n4. 负责运营数据监控与分析，定期梳理播放量、互动率、涨粉量、转化率等核心数据，复盘运营动作效果，挖掘数据问题与增长机会，持续优化运营策略、内容结构与推广方式。\n5. 对接品牌升级、内容焕新项目，对齐全渠道运营视觉风格、内容调性与传播节奏，统筹各渠道物料上线、内容分发与宣传推广，保障多端运营内容统一、节奏同步。\n6. 跟踪行业动态、竞品运营模式与平台规则变化，快速迭代运营打法，搭建用户运营、内容运营、活动运营标准化流程，沉淀运营SOP、案例库与方法论，提升整体运营效能。\n7. 统筹跨部门协作，对接视频制作、设计、市场、产品等团队，对齐运营需求、排期与交付标准，推动运营项目、营销活动高效落地，及时解决推进过程中的各类问题并闭环优化。\n\n任职要求\n1. 本科及以上学历，3年以上互联网、短视频、新媒体、泛娱乐行业运营管理经验，具备成熟的全渠道运营体系搭建与落地经验。\n2. 精通短视频、新媒体、产品线上运营逻辑，熟悉各大主流平台规则、流量机制与传播玩法，具备独立策划、落地运营项目及营销活动的实战能力。\n3. 具备优秀的数据洞察与复盘能力，能够通过数据拆解目标、定位问题、优化策略，有成功的账号增长、活动转化、用户运营落地案例优先。\n4. 拥有良好的热点敏感度、内容审美与营销思维，擅长结合行业热点打造优质内容与爆款活动，具备较强的用户思维与市场判断力。\n5. 具备出色的跨部门沟通、统筹协调与项目推进能力，目标感强、执行力高，可高效统筹多任务并行，抗压能力强，能适配项目节奏与迭代需求。\n6. 具备系统化运营思维，擅长流程搭建、标准梳理与团队效能优化，能够沉淀可复用的运营方法论，推动团队运营工作标准化、精细化落地。\n\n加分项\n1. 有短视频矩阵、新媒体品牌账号、互联网产品运营操盘经验，拥有百万曝光、爆款内容打造或用户规模化增长案例。\n2. 熟悉AI内容、AI视频行业，具备AI产品、数字内容相关行业运营经验，了解AI内容创作与传播逻辑。\n3. 具备品牌营销、内容策划、用户增长、活动运营专项优势，有完整的项目全案操盘与复盘经验。\n4. 有远程团队协作、跨团队项目统筹经验，擅长精细化运营与数据化管理。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "30", "title": "品牌策略负责人", "salary": "12K-20K", "jd": "岗位职责\n1. 从 0 到 1 设计并落地对内复制 + 对外赋能体系：标准、SOP、课程路径与材料包\n2. 把策略、案例、复盘转化为可带走的课程与工具，支撑业务与合作方独立运转\n3. 建立训后反馈与迭代机制，用真实反馈持续升级内容质量与落地效果\n4. 推动赋能动作嵌入项目节点（开工包、关键节点赋能、结项回收与课例沉淀）\n5. 与市场心智、舆情协同，把最新口径与框架同步进课程，保持体系不过时\n6. 跟踪赋能采用率与效果，输出迭代清单，对体系是否跑得起来负责\n\n任职要求\n1. 本科及以上，3 年以上企业培训、组织发展、方法论沉淀或品牌/运营赋能经验\n2. 有从 0 到 1 搭培训/赋能体系的经历，能独立完成课程产品化与落地推动\n3. 善于把复杂内容拆成可复制路径（课、包、SOP），表达清楚、结构感强\n4. 结果导向，关注采用与效果，不满足于「讲完课」\n\n加分项\n有 ToB 赋能或多组织落地经验；有品牌/策略内容转化经验；有训后效果评估体系搭建经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议", "cat": "运营与市场"}, {"id": "31", "title": "社区运营客服", "salary": "12-15k", "jd": "岗位职责\n社区内容审核\n负责社区用户发帖审核。平台采用“先审后发”机制，及时处理待审核内容，确保符合要求的帖子能够正常展示，避免因审核延迟影响社区用户体验。\n社区内容运营\n在日常工作空档期，根据安排完成基础发帖、内容补充等工作，维持社区内容更新频率和活跃度。\n用户精聊及转化\n承接用户在线咨询及聊天需求，了解用户具体偏好和需求，并根据用户情况匹配对应的女孩进行在线裸聊服务，做好前期沟通和转化。\n岗位要求\n沟通表达能力较好，能够主动与用户聊天、判断需求并推动转化。\n打字速度及在线回复效率较好，能够同时处理内容审核和用户沟通。\n有一定内容判断能力，能够按照审核标准快速判断帖子是否符合发布要求。\n工作主动性和责任心较强，能够兼顾审核、发帖及用户转化等不同任务。\n能够接受成人内容及相关业务场景，对此类业务无明显心理排斥。\n有社区运营、内容审核、在线客服、私域转化、聊天客服等相关经验优先。\n岗位核心定位\n\n这个岗位不是单纯客服，主要是三块工作：\n内容审核 + 社区活跃 + 用户聊天转化。", "cat": "运营与市场"}, {"id": "32", "title": "经营决策主管", "salary": "20K–30K", "jd": "1.分析各业务线的经营情况、问题和机会，形成初步判断。\n2.跟踪市场、竞品和用户变化，提炼对业务有用的信息并落地成方案。\n3.参与新项目和重点事项评估，提出继续、调整、加码或暂停建议。\n4.输出分析结论和汇报材料，并跟踪后续结果。\n任职要求\n1.有业务运营、产品运营、增长、策略或分析相关经验，互联网行业。\n2.能快速理解业务，从复杂信息中抓住重点并形成观点。\n3.能结合基础数据和业务事实说明自己的判断。\n4.文字表达清楚，能够独立完成分析和汇报。\n加分项\n1.有互联网或线上业务相关经验5年以上。\n2.参与过新/老项目评估、业务调整或经营复盘的核心决策。", "cat": "产品与管理"}, {"id": "33", "title": "商业分析主管", "salary": "20K–30K", "jd": "1.汇总经营数据，维护和建立关键指标、统一统计口径和基础看板。\n2.发现数据异常和趋势变化，核对数据并分析可能原因。\n3.围绕业务问题、项目效果和资源投入提供分析结论。\n4.用清楚的业务语言向负责人说明数据发现和建议。\n任职要求\n1.有数据分析、业务分析、经营分析或数据运营相关经验。\n2.熟练使用AI、在线表格等工具，能独立处理和分析数据。\n3.能理解常见经营指标，并把数据变化与业务实际联系起来。\n4.做事细致严谨，能够独立输出结构清楚的分析结论。\n加分项\n1.熟练使用SQL、AI、BI工具。\n2.做过互联网、用户增长或项目效果分析，并有案例证明。", "cat": "产品与管理"}, {"id": "34", "title": "运营发展主管", "salary": "20K–30K", "jd": "1.梳理重点事项、协同需求和资源需求，形成处理建议。\n2.将确认事项拆解为责任人、时间节点、交付结果和验收标准。\n3.跟踪跨部门事项进展，发现延期或卡点并推动解决。\n4.维护事项清单，定期输出进展、问题和复盘结论。\n任职要求\n1.有项目运营、业务运营、PMO、项目管理或交付管理相关经验。\n2.能把模糊问题整理成清晰的任务和推进计划。\n3.沟通和推动能力较强，能够协调不同团队持续跟进。\n4.有优先级和结果意识，做事有条理，能够推动事项闭环。\n加分项\n1.推动过多个部门共同参与的项目，自己是核心成员或负责人。", "cat": "运营与市场"}, {"id": "35", "title": "comfyui内容工程师", "salary": "13–18K", "jd": "任职要求\n1.熟练使用 ComfyUI（不是只用过）\n2.对Stable Diffusion 有较深理解\n3.模型经验（硬性要求懂LTX.WAN）\n4.自动化能力（会用 Python / Node.js 做简单自动化能调用 ComfyUI API/有批量生成经验）\n5.熟练使用ai工具，定期输出原创定制内容\n 岗位职责\n1.基于 ComfyUI 搭建稳定的生成工作流\n2.实现以下内容的批量生产：\nAI图片（人物 / 场景 / 反差 / fetish等风格）\nAI短视频（图生视频 / 连贯帧生成）\nAI换脸 / 风格迁移 / 去衣等模型应用（合规范围内）\n3.搭建 ComfyUI 节点流：\n文生图 / 图生图 / ControlNet / LoRA加载\n设计可复用模板\n4.内容质量与一致性控制\n解决人物脸崩、结构异常、风格漂移问题\n建立内容质量评分机制（可规则 / AI辅助）\n提高生成成功率 & 可用率（不是只出图，是可用图）\n前沿能力探索（加分项）\n1.视频生成（AnimateDiff / SVD 等），AI换脸 / 人物一致性（IP角色）\n多模态内容（图 → 视频 → 剧情）\n2.有成人内容生成经验\n3.会训练：LoRA / DreamBooth有GPU部署经验：本地 / 云GPU（如RunPod、Lambda等）\n4.部署过agent，玩过openclew", "cat": "内容与创作"}, {"id": "36", "title": "AI产品经理", "salary": "20-40k", "jd": "AI 产品经理 / AI Product Builder \n\n一、任职要求\n1. 必须有 AI Builder 作品(硬门槛,见下)\n2. 1-3 年产品经理经验,有 AI 方向项目经历(实习 / 在校 / Hackathon / 个人作品均认可)\n3. 产品判断力——能讲清作品的目标用户、核心痛点、设计取舍、效果验证。\n4. 技术背景:理工科或等效自学能力;能读 Python / JS / TS;SQL 必备,Python 数据分析优先;能直接读英文 API 文档。\n5. 熟悉至少一个大模型 API,理解 Prompt、RAG、Tool Calling / Function Calling、Agent 等基础概念。\n6. 至少参与过一个完整产品周期,有真实数据可复盘。\n7. 能跟算法、工程建立技术信任,能在一周内把一个清晰问题推进到可演示 demo。\n\n二、加分项\n1. AI 重度付费用户(强信号)：ChatGPT Plus / Claude Pro 连续 6 个月以上,或月付 $100+ 的高阶订阅(Claude Max / ChatGPT Pro 等),或自费 API 月均 $50+。\n2.国际化背景：海外留学,或长期英文工作 / 学习环境(2 年以上),能直接读论文与一线英文讨论。\n3.更强的技术背景：工程师 / 算法 / 数据科学家转岗 PM;GitHub 有持续项目;独立跑过 RAG / Fine-tuning / Agent;熟悉 MCP、LangSmith 等工具链。\n4.其他加分:Agent 产品经验、AI 评测与监控经验、出海或垂直行业 AI 落地经验、技术 Blog 或行业分享。\n\n三、AI Builder 作品门槛\n1. 面试演示至少 1 个本人主导完成的作品,需同时满足:\n    a.真实可访问链接(Vercel / Cloudflare / 自建),不接受截图或 Figma\n    b.调过大模型 API,能解释代码结构、能现场改代码跑通\n    c.解决了一个具体问题(非 Hello World)\n    d.能讲清产品逻辑——为谁做、为什么这样做、怎么验证\n2. 工具不限:Cursor / Claude Code / Lovable /CodeX等。强加分:有真实用户(哪怕 10 个),或在 GitHub / X / 即刻 / 小红书 有过自然传播。", "cat": "产品与管理"}, {"id": "37", "title": "AI测试工程师", "salary": "15-25k", "jd": "一、岗位职责\n\n1.负责 Web、App、管理后台、API 的功能、回归、兼容性测试\n2.参与需求评审,基于 PRD 与接口文档输出测试计划与用例\n3.提交高质量 Bug 并推动闭环;负责上线前回归与线上问题复盘\n4.编写并维护接口自动化脚本,提升核心链路回归效率\n5.根据项目需要参与 UI 自动化或性能测试\n6.从 0 到 1 搭建 AI 测试工作流——覆盖 Prompt 管理、评测流程、Bad Case 闭环、版本回归机制,形成可复用 SOP 与文档\n7.负责 AI 产品的质量测试,覆盖对话、Agent、AIGC、数字人等场景\n8.建立并维护 Bad Case 库(幻觉、答非所问、风格漂移、安全边界等)\n9.参与 Prompt 版本回归 与 A/B 测试,输出测试报告与改进建议\n\n二、任职要求\n\n1.本科及以上,3 年以上软件测试经验,熟悉 Web / App / API 测试全流程\n2.熟悉接口测试工具(Postman / Apifox)与抓包工具(Charles / Fiddler)\n3.熟悉至少一种自动化框架:Pytest / Selenium / Playwright / Appium / JMeter\n4.熟悉 Git 与 Jira / 禅道 / Tapd 等协作工具\n5.具备从 0 到 1 搭建测试流程 / 规范的意识和能力,能独立梳理 SOP,而不是只执行别人定的流程\n6.对 AI 产品有真实兴趣并有动手经验——用过 ChatGPT / Claude / 豆包 / Coze 等,自己写过 Prompt 或做过小项目\n沟通清晰、执行力强,能跨产品 / 研发 / 算法推动问题闭环\n\n三、加分项\n\n1.有 AI 产品(对话、AIGC、Agent、数字人)测试经验\n2.有 Prompt 回归、Bad Case 分析、模型输出评测经验\n3.有从 0 到 1 搭建过测试体系 / 测试平台 / 质量流程的经历\n4.用过 Promptfoo / LangSmith / Langfuse 等 AI 测试工具\n5.了解 RAG、Function Calling、Agent Workflow 等概念\n6.大厂或成熟互联网公司 QA 经历\n7.英文阅读流畅,可直接看 OpenAI / Anthropic 文档", "cat": "技术开发"}, {"id": "38", "title": "高级ai剪辑", "salary": "13-18k", "jd": "岗位职责：\n1.精通市场上各类剪辑软件，独立输出项目\n2.至少熟悉并使用市场上3款成人ai软件\n3.有搭建AI远程AI服务器的能力优先\n4.有作品（硬性要求）：最少3部原创ai成人作品5分钟以上，或者懂ai漫剧有成功制作成人漫剧经验）\"\n\n任职要求\n1.熟练使用 ComfyUI（不是只用过）\n2.对Stable Diffusion 有较深理解\n3.模型经验（硬性要求懂LTX.WAN）\n4.自动化能力（会用 Python / Node.js 做简单自动化能调用 ComfyUI API/有批量生成经验）\n5.熟练使用ai工具，定期输出原创定制内容\n 岗位职责\n\n1.基于 ComfyUI 搭建稳定的生成工作流\n\n2.实现以下内容的批量生产：\nAI图片（人物 / 场景 / 反差 / fetish等风格）\nAI短视频（图生视频 / 连贯帧生成）\nAI换脸 / 风格迁移 / 去衣等模型应用（合规范围内）\n\n3.搭建 ComfyUI 节点流：\n文生图 / 图生图 / ControlNet / LoRA加载\n设计可复用模板\n\n4.内容质量与一致性控制\n解决人物脸崩、结构异常、风格漂移问题\n建立内容质量评分机制（可规则 / AI辅助）\n提高生成成功率 & 可用率（不是只出图，是可用图）\n\n\n前沿能力探索（加分项）\n\n1.视频生成（AnimateDiff / SVD 等），AI换脸 / 人物一致性（IP角色）\n多模态内容（图 → 视频 → 剧情）\n\n2.有成人内容生成经验\n\n3.会训练：LoRA / DreamBooth有GPU部署经验：本地 / 云GPU（如RunPod、Lambda等）\n\n4.部署过agent，玩过openclew", "cat": "内容与创作"}, {"id": "39", "title": "中级运营（流量增长）", "salary": "9K+提成", "jd": "岗位职责\n1.负责网站产品的友链互换：寻找合适的友链资源，评估对方网站的质量、相关性和健康度。\n2.通过 Telegram、邮件等方式主动联系站长，洽谈并促成友链交换。\n3.使用公司后台添加和管理友链、广告位（操作简单，入职提供培训）。\n4.维护友链健康度：定期检查对方是否撤链、链接是否有效、是否存在掉权或风险站点。\n5.配合开展灰度引流，通过多渠道为网站产品稳定导入流量。\n6.记录友链与引流数据，定期整理来源、数量、转化情况并复盘优化。\n任职要求\n1.有网站运营、简单SEO了解 或外链建设基础，理解友链、反链对网站权重和收录的作用。\n2.有灰度引流经验（硬性要求）。\n3.熟悉 Telegram、邮件等沟通工具，沟通主动、执行力强、不怕被拒。\n4.做事细心，能记录问题、整理数据并持续优化。\n5.学习能力强，能快速上手后台操作。\n加分项\n1.手上有现成的友链资源或站长人脉。\n2.做过泛娱乐、成人或灰色类网站的引流与外链。\n3.懂基础 SEO（关键词、收录、外链质量判断）。\n4.有多平台引流、投放或社群导流经验", "cat": "运营与市场"}, {"id": "40", "title": "中级运营（TG机器人运营）", "salary": "15-20k", "jd": "1.负责 Telegram 搜索机器人的日常运营、配置维护和使用效果优化。\n2.维护机器人关键词、分类、搜索规则、回复文案、入口链接和引流路径。\n3.根据业务需求调整机器人逻辑，能看懂基础代码，并配合修改简单脚本。\n4.跟进 TG 群、频道、机器人之间的流量联动，提升机器人触发量、使用量和转化效果。\n5.监控机器人运行状态，协助排查 Webhook、Bot Token、接口、服务器、消息推送等异常。\n6.收集用户搜索反馈，优化搜索命中率、结果展示和用户使用体验。\n7.定期整理运营数据，包括关键词热度、触发次数、入口来源、转化情况和异常记录。\n\n任职要求\n\n1.熟悉 Telegram 生态，了解 TG 群、频道、机器人、邀请链接、关键词引流等玩法。\n2.有 Telegram 机器人运营经验，做过搜索机器人、资源机器人、群管机器人者优先。\n3.具备基础代码阅读能力，能看懂并调整简单脚本或配置。\n4.熟悉 Python、Node.js、Shell 任一语言者优先。\n5.了解 Bot API、Webhook、VPS、PM2、Nginx、Docker 等基础概念者优先。\n6.有流量运营意识，理解关键词、入口、频道联动、用户留存和转化路径。\n7.做事细心，能记录问题、复盘数据，并持续优化机器人运营效果。\n\n加分项\n\n1.独立搭建或维护过 TG Bot。\n2.做过搜索类、资源聚合类、内容分发类机器人。\n3.有 TG 群/频道运营、引流、投放或社群增长经验。\n4.能独立排查机器人掉线、接口异常、消息不触发等问题。\n5.熟悉爬虫、接口对接、定时任务、数据统计脚本。\n\n投递信息(请发送以下内容)\n1. Telegram 运营经验（硬性要求）\n2. 是否做过订阅人数1w+的TG 机器人（硬性要求）\n3. 会哪些脚本/编程语言\n4. 是否能操作 VPS / 服务器", "cat": "运营与市场"}, {"id": "41", "title": "中级运营（成人网站/app）", "salary": "15K+提成", "jd": "岗位名称： 运营专员（中高级）\n级别：中高级\n需求量： 2人\n薪酬范围： 10–18K/月\n是否紧急：是\n简历筛选要点： 必须有3-5年成人行业工作经验以及独立运营落地产品经验\n\n一、岗位定位\n负责成人内容产品的增长与运营工作，围绕用户新增、留存、内容消费及付费转化等核心指标，推动产品从内容供给、用户运营到商业化变现的全链路增长。\n二、岗位职责\n参与新产品/新方向的冷启动与测试，能够快速验证内容方向及用户反馈，推动产品迭代优化。\n1.内容增长与策略执行：承接整体运营策略，围绕拉新、留存、转化、变现等核心指标推进落地。\n2.持续优化内容结构，提升点击率、留存率及付费转化\n3.日常跟踪核心数据（新增、活跃、留存、转化）分析用户行为路径，识别问题并提出优化方案.基于数据调整内容方向与分发策略\n4.内容生产与结构优化:参与内容选题与方向制定，提升内容质量与产出效率，优化内容结构（封面、标题、前3秒、标签等关键环节）建立可复用的内容生产标准与方法论\n5.跨部门协作：与产品、技术、渠道等团队协同。推动内容相关功能优化与产品迭代\n6.竞品与行业趋势分析：持续关注成人内容行业、社区产品及AI方向动态，定期输出竞品分析及优化建议。\n\n任职要求\n1. 有3-5年成人行业工作经历。\n2.有完整参与或主导内容项目/产品从0到1或增长阶段的经验\n3.具备较强的数据分析能力（能独立拆解问题并提出策略）\n4.熟悉内容生产流程，具备内容判断与筛选能力\n5.执行力强，能推动事情落地，沟通能力强，能跨团队协作，抗压能力强，适应快节奏环境\n6.具备较强结果意识，对核心数据（新增、留存、转化、ROI等）负责\n7.具备独立推进项目能力，能够主动发现问题并推动解决\n\n加分项\n1.有内容变现/付费产品经验\n2.有小众主题/Ai/社区/UGC平台运营经验\n3.对用户心理和内容传播有敏锐洞察\n\n淘汰项\n1.执行被动、依赖安排\n2.数据敏感度弱\n3.无法适应快节奏及高迭代环境\n4.仅有传统内容搬运经验、缺少增长意识", "cat": "运营与市场"}, {"id": "42", "title": "中级运营（成人网站/app）", "salary": "15K+提成", "jd": "岗位名称：流量运营（中高级）\n招聘人数：1人\n是否紧急：是\n薪资范围：15转18+（流量增长奖金，上不封顶）\n\n简历筛选要点\n\n1,必须要有从0-1的网站起量经验（只有优化经验的不要）\n2.必须要有明确运营数据（SEO / 投放 / 联盟 / 社区 / 站群）对应结果\n3.着重勘查是否有低成本获客经验（免费流量/自然流量/低成本投放）\n4.行业匹配优先级（成人 / 灰产 / 边缘行业/海外流量项目工具站 / 内容站优先）\n5.“野路子”能力：简历内有组合流量增长或非常规渠道合并能力者优先\n\n任职要求：\n\n1.2年以上流量运营/增长经验，必须具备网站从0到1冷启动经验（核心要求）\n2.熟悉主流流量获取渠道，至少精通2种以上，并有实际结果(SEO/信息流投放/联盟/CPS/渠道分发/社区/论坛/内容分发/站群/外链体系）\n3.具备独立获客能力：有低成本引流经验，能在预算有限情况下完成起量\n4.熟悉完整流量转化链路（曝光→点击→注册→转化），具备转化优化经验\n5.具备数据分析能力：可独立拆解流量来源、用户路径、转化漏斗，并持续优化ROI\n6.有成人行业或灰度行业经验优先，了解相关流量生态与玩法\n必须具备实际流量增长案例（需提供数据：UV、转化、渠道占比等）\n\n岗位职责：\n\n1.负责网站从0起步的流量搭建，制定并执行冷启动引流方案\n2.从0获取首批种子用户，完成基础流量池搭建\n3.拓展并维护多渠道流量来源（SEO / 联盟 / 社区 / 渠道分发等）\n4.制定阶段性增长策略，对流量结果负责（UV、注册量、转化率）\n5.搭建并优化流量转化路径，提升整体转化效率\n6.持续降低获客成本（CAC），提升投入产出比\n7.建立流量数据监控体系，每周输出分析报告并进行策略迭代\n8.持续测试新渠道、新玩法，推动流量规模化增长\n\n前沿能力探索（加分项）：\n\n1. 有AI辅助流量运营经验（ChatGPT辅助文案、SEO优化等）\n2. 熟悉海外流量渠道（TikTok、Pinterest、Googleads等）\n3. 有灰度流量获取经验\n4. 具备Private蟹道流量优化案例\n5. 有工具化/自动化流量运营经验", "cat": "运营与市场"}, {"id": "43", "title": "高级后端工程师（Java/Go双栈）", "salary": "20-30k", "jd": "高级后端开发工程师（Java/Go双栈）\n岗位职责\n1、负责核心后端服务的设计、开发、优化与维护。\n2、参与系统架构及技术方案设计，保障系统稳定性和可扩展性。\n3、负责业务接口、服务模块及数据处理流程开发。\n4、参与数据库设计、服务治理、性能优化和异常排查。\n5、协同产品、前端、测试及运维团队推动需求落地。\n6、推进研发规范、代码质量及AI辅助研发流程建设。\n任职要求\n1、本科及以上学历，5年以上后端研发经验。\n2、精通Java，熟悉JVM、JUC、Spring Boot、Spring Cloud、MyBatis-Plus及Dubbo。\n3、熟练掌握Go，理解goroutine、channel、GC及并发机制，具备生产项目经验。\n4、熟悉Gin、gRPC、Protobuf、go-zero或Kratos等Go技术框架。\n5、熟悉MySQL、Redis、Kafka或RabbitMQ等常用中间件。\n6、熟悉微服务、数据库建模、接口设计、性能优化及系统治理。\n7、能够独立承担核心模块开发，具备良好的沟通协作能力。\n8必须熟练使用Claude Code、Cursor、Codex等AI编程工具进行日常研发。\n加分项\n*熟悉JavaScript、TypeScript、Vue 3或React，具备前端开发能力。\n*有Java与Go技术栈迁移经验。\n*有AI Agent、RAG或大模型应用经验。\n*有高并发、分布式系统项目经验。\n*熟悉Docker、Kubernetes及DevOps。", "cat": "技术开发"}, {"id": "44", "title": "流量运营（增长方向）", "salary": "15-18K", "jd": "1,必须要有从0-1的起量经验（只有优化经验的不要）\n2.必须要有明确运营数据（SEO / 投放 / 联盟 / 社区 / 站群）对应结果\n3.着重勘查是否有低成本获客经验（免费流量/自然流量/低成本投放）\n4.行业匹配优先级（成人 / 灰产 / 边缘行业/海外流量项目工具站 / 内容站优先）\n5.“野路子”能力：简历内有组合流量增长或非常规渠道合并能力者优先\n\n任职要求：\n\n1.2年以上流量运营/增长经验，必须具备从0到1冷启动经验（核心要求）\n2.熟悉主流流量获取渠道，至少精通2种以上，并有实际结果(SEO/信息流投放/联盟/CPS/渠道分发/社区/论坛/内容分发/站群/外链体系）\n3.具备独立获客能力：有低成本引流经验，能在预算有限情况下完成起量\n4.熟悉完整流量转化链路（曝光→点击→注册→转化），具备转化优化经验\n5.具备数据分析能力：可独立拆解流量来源、用户路径、转化漏斗，并持续优化ROI\n6.有成人行业或灰度行业经验优先，了解相关流量生态与玩法\n必须具备实际流量增长案例（需提供数据：UV、转化、渠道占比等）\n\n岗位职责：\n\n1.负责网站从0起步的流量搭建，制定并执行冷启动引流方案\n2.从0获取首批种子用户，完成基础流量池搭建\n3.拓展并维护多渠道流量来源（SEO / 联盟 / 社区 / 渠道分发等）\n4.制定阶段性增长策略，对流量结果负责（UV、注册量、转化率）\n5.搭建并优化流量转化路径，提升整体转化效率\n6.持续降低获客成本（CAC），提升投入产出比\n7.建立流量数据监控体系，每周输出分析报告并进行策略迭代\n8.持续测试新渠道、新玩法，推动流量规模化增长\n\n前沿能力探索（加分项）：\n\n1. 有AI辅助流量运营经验（ChatGPT辅助文案、SEO优化等）\n2. 熟悉海外流量渠道（TikTok、Pinterest、Googleads等）\n3. 有灰度流量获取经验\n4. 具备Private蟹道流量优化案例\n5. 有工具化/自动化流量运营经验", "cat": "运营与市场"}, {"id": "45", "title": "剪辑师", "salary": "6k-12k", "jd": "岗位名称： 剪辑师（视频剪辑 / 封面设计）\n岗位薪资： 6K-12K\n招聘人数： 3人\n岗位等级： 初级 / 中级\n\n一、岗位职责\n\n1. 负责平台内容相关视频的二次创作剪辑及封面设计工作；\n2. 能够独立完成优质内容的识别、筛选、采集及二创制作；\n3. 根据运营需求完成日常视频剪辑、包装及视觉优化工作；\n4. 持续提升内容呈现效果，把控视频节奏、画面质感及封面点击吸引力；\n5. 按时完成每日基础工作任务，具备良好的执行力与配合意识。\n\n二、任职要求\n\n1. 具备视频剪辑与封面设计能力，拥有一定美术基础、审美能力及画面表达能力；\n2. 具备2-3年相关工作经验，能够独立完成精彩片段剪辑及封面设计；\n3. 熟练使用PR、PS、AI、AE、剪映等设计及剪辑软件，熟悉常用视频后期制作流程；\n4. 具备较强的内容敏感度，能够独立完成素材筛选、整理与内容优化；\n5. 对相关内容赛道有一定了解，能够判断内容质量并挖掘优质素材；\n6. 工作积极主动，责任心强，具备良好的沟通能力与执行能力。\n\n三、加分项\n\n1. 有海报设计、封面包装或宣传视觉制作经验；\n2. 熟悉多种专业剪辑、修图及后期软件；\n3. 具备较强网感，对热门内容、用户偏好及视觉呈现有较好理解；\n4. 有内容平台、泛娱乐或相关行业从业经验者优先。\n\n内容组剪辑岗位，主要负责二创视频制作，麻烦大哥审批下", "cat": "内容与创作"}, {"id": "46", "title": "运营专员（视频剪辑 / 封面设计）", "salary": "6K-15K", "jd": "一、岗位职责\n\n1. 负责平台内容相关视频的二次创作剪辑及封面设计工作；\n2. 能够独立完成优质内容的识别、筛选、采集及二创制作；\n3. 根据运营需求完成日常视频剪辑、包装及视觉优化工作；\n4. 持续提升内容呈现效果，把控视频节奏、画面质感及封面点击吸引力；\n5. 按时完成每日基础工作任务，具备良好的执行力与配合意识。\n\n二、任职要求\n\n1. 具备视频剪辑与封面设计能力，拥有一定美术基础、审美能力及画面表达能力；\n2. 具备2-3年相关工作经验，能够独立完成精彩片段剪辑及封面设计；\n3. 熟练使用PR、PS、AI、AE、剪映等设计及剪辑软件，熟悉常用视频后期制作流程；\n4. 具备较强的内容敏感度，能够独立完成素材筛选、整理与内容优化；\n5. 对相关内容赛道有一定了解，能够判断内容质量并挖掘优质素材；\n6. 工作积极主动，责任心强，具备良好的沟通能力与执行能力。\n\n三、加分项\n\n1. 有海报设计、封面包装或宣传视觉制作经验；\n2. 熟悉多种专业剪辑、修图及后期软件；\n3. 具备较强网感，对热门内容、用户偏好及视觉呈现有较好理解；\n4. 有内容平台、泛娱乐或相关行业从业经验者优先。\n\n备注：此岗位接受小白入职，侧重观察候选人喜不喜欢看黄片，重度成人爱好者可无经验培训", "cat": "内容与创作"}, {"id": "47", "title": "AI设计师/ UI", "salary": "20-40k", "jd": "AI设计师/ AI designer\n我们要找的是一位审美强、懂 AI 产品、理解全球 AI 模型变化、能快速做出可运行原型，并且有耐心把细节打磨到位的 AI 产品体验设计师。\n你需要参与 Web、App、Agent 工作流和 AI 原生产品的体验设计，和产品、工程一起探索：当 AI 不再只是一个聊天框，而是能生成、理解、执行和协作时，用户应该如何与它交互。\n\n⸻\n\n你需要负责\n\n1.负责 Web / App / 后台 / Agent 工作流等 AI 产品体验设计。\n2.从 PRD 中识别模糊需求，补全页面结构、交互路径和关键状态。\n3.设计 AI 产品特有体验：对话、流式输出、生成失败、重新生成、结果编辑、版本回退、用户确认、Agent 步骤可视化等。\n4.关注 Claude、GPT、Gemini、Kimi、豆包、DeepSeek 等全球主流模型能力变化，并把模型新能力转化为产品体验机会。\n5.用 Lovable、Figma Make、Cursor、Claude Code 等工具快速产出可点击、可演示、可迭代的 Web/App 原型。\n6.与 PM 和工程师协作，用原型、设计判断和产品逻辑推动方案落地。\n7.对设计细节有耐心，能持续打磨产品细节，直到达到可交付标准。\n\n⸻\n\n我们希望你具备\n\n1.1-3 年 UI / UX / 产品设计经验，作品强可放宽。\n2.有 Web、App、SaaS、AI 产品、工具产品或后台系统设计经验。\n3.审美扎实，能做出高级、克制、清晰、可信的产品界面。\n4.理解 AI 产品和普通 SaaS 产品的区别。\n5.关注全球 AI 产品和模型能力变化\n熟悉至少一种 AI 原型或 AI 编码工具\n不抗拒代码，能理解基础 HTML /CSS / React / Tailwind 更好。\n6.有强执行力，能把模糊需求快速推进到可演示、可评审、可迭代的结果\n有耐心和细节意识，不只做首屏效果图，也愿意反复打磨状态、流程、边界和交互体验。\n7.能讲清每一个设计决策背后的用户问题、产品逻辑和交互取舍。\n\n⸻\n\n作品要求\n\n面试请准备至少 1 个本人主导作品：\n\n有真实可访问链接，优先 Web/App 原型\na.不接受只有截图、纯 Figma 静态稿或纯视觉海报\nb.能讲清用户问题、设计目标、核心路径和关键设计决策\nc.最好包含 AI 原生交互，例如对话、Agent 步骤、流式输出、生成结果编辑、结果回退、模型失败处理等。\n\n⸻\n\n加分项\n\n1.熟悉 Claude / GPT / Gemini / Kimi / 豆包 / DeepSeek 等模型能力差异有 AI 产品、Agent、AI 工作流、生成式编辑器设计经验。\n2.会用 Cursor / Claude Code / v0 / Lovable / Figma Make 做真实原型懂 React / Tailwind / shadcn/ui / Framer Motion。\n3.有上线作品、真实用户、GitHub 项目、设计系统或个人产品。\n4.有海外产品、英文环境、全球 AI 产品研究经验。\n5.有长期打磨作品的经历，而不是只做过一次性概念稿。", "cat": "内容与创作"}, {"id": "48", "title": "中级运营（成人网站/app）", "salary": "15K", "jd": "岗位名称：流量运营（中高级）\n招聘人数：1人\n是否紧急：是\n薪资范围：15转18+（流量增长奖金，上不封顶）\n\n简历筛选要点\n\n1,必须要有从0-1的网站起量经验（只有优化经验的不要）\n2.必须要有明确运营数据（SEO / 投放 / 联盟 / 社区 / 站群）对应结果\n3.着重勘查是否有低成本获客经验（免费流量/自然流量/低成本投放）\n4.行业匹配优先级（成人 / 灰产 / 边缘行业/海外流量项目工具站 / 内容站优先）\n5.“野路子”能力：简历内有组合流量增长或非常规渠道合并能力者优先\n\n任职要求：\n\n1.2年以上流量运营/增长经验，必须具备网站从0到1冷启动经验（核心要求）\n2.熟悉主流流量获取渠道，至少精通2种以上，并有实际结果(SEO/信息流投放/联盟/CPS/渠道分发/社区/论坛/内容分发/站群/外链体系）\n3.具备独立获客能力：有低成本引流经验，能在预算有限情况下完成起量\n4.熟悉完整流量转化链路（曝光→点击→注册→转化），具备转化优化经验\n5.具备数据分析能力：可独立拆解流量来源、用户路径、转化漏斗，并持续优化ROI\n6.有成人行业或灰度行业经验优先，了解相关流量生态与玩法\n必须具备实际流量增长案例（需提供数据：UV、转化、渠道占比等）\n\n岗位职责：\n\n1.负责网站从0起步的流量搭建，制定并执行冷启动引流方案\n2.从0获取首批种子用户，完成基础流量池搭建\n3.拓展并维护多渠道流量来源（SEO / 联盟 / 社区 / 渠道分发等）\n4.制定阶段性增长策略，对流量结果负责（UV、注册量、转化率）\n5.搭建并优化流量转化路径，提升整体转化效率\n6.持续降低获客成本（CAC），提升投入产出比\n7.建立流量数据监控体系，每周输出分析报告并进行策略迭代\n8.持续测试新渠道、新玩法，推动流量规模化增长\n\n前沿能力探索（加分项）：\n\n1. 有AI辅助流量运营经验（ChatGPT辅助文案、SEO优化等）\n2. 熟悉海外流量渠道（TikTok、Pinterest、Googleads等）\n3. 有灰度流量获取经验\n4. 具备Private蟹道流量优化案例\n5. 有工具化/自动化流量运营经验", "cat": "运营与市场"}, {"id": "49", "title": "AI 短剧制作 / AI 短剧运营", "salary": "15-20k", "jd": "AI 短剧制作 / AI 短剧运营\n\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧生产执行、内容运营、数据复盘\n\n岗位定位：\n负责 AI 短剧的日常生产和运营执行，需要既懂内容，也能使用 AI 工具推进产出，是连接制作和运营的数据型岗位。\n\n岗位职责：\n\n1. 负责 AI 短剧日常选题、素材整理、提示词生成、视频产出和内容发布。\n2. 配合编剧、生成师、剪辑师推进项目进度。\n3. 负责标题、封面、标签、简介、合集、推荐位等运营配置。\n4. 跟进播放、点击、收藏、评论、转化等数据表现。\n5. 拆解爆款内容，沉淀选题方向、标题模板和内容结构。\n6. 协助维护创作者、外包团队和内容供应方。\n7. 推动内容批量生产流程，提高产出效率和上线稳定性。\n\n任职要求：\n\n1. 有短视频运营、内容运营、短剧运营、社区运营经验优先。\n2. 熟悉内容平台用户心理，懂标题、封面、标签和热点追踪。\n3. 会使用 AI 工具进行文案、图片、视频或素材处理。\n4. 能接受成人向 AIGC 内容方向。\n5. 数据意识强，能根据结果调整运营动作。\n6. 执行力强，能处理重复但重要的内容上线工作。\n\n作品要求：\n\n1. 面试需提供运营账号、内容案例、数据截图或项目经验说明。\n2. 有内容从选题到发布再到复盘的完整经验优先。\n3. 可接受现场拆解一个爆款内容的运营逻辑。", "cat": "内容与创作"}, {"id": "50", "title": "AI 短剧导演 / 制片", "salary": "15-20k", "jd": "AI 短剧导演 / 制片", "cat": "内容与创作"}, {"id": "51", "title": "AI 短剧后期剪辑师", "salary": "15-20k", "jd": "AI 短剧后期剪辑师\n\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 短剧剪辑、包装、成片输出\n\n岗位定位：\n负责 AI 短剧素材的后期整合，把零散 AI 镜头剪成完整短剧成片，重点把控节奏、情绪、字幕、音效、转场和完播率。\n\n岗位职责：\n\n1. 负责 AI 短剧素材剪辑、镜头排序、节奏调整和成片输出。\n2. 完成字幕、音效、配乐、转场、调色、降噪、封面截取等后期工作。\n3. 根据剧情节奏优化开头吸引力、关键转折和结尾留钩。\n4. 制作正片版、预告版、短切版、引流版等不同发布版本。\n5. 配合导演和运营，根据数据反馈调整剪辑节奏。\n6. 建立短剧剪辑模板、字幕模板、音效模板和包装规范。\n7. 管理素材文件，保证项目文件清晰可复用。\n\n任职要求：\n\n1. 熟练使用剪映、Premiere、Final Cut Pro、DaVinci Resolve 等剪辑工具。\n2. 有短剧、剧情号、信息流广告、影视混剪、内容号剪辑经验优先。\n3. 对节奏、情绪、爽点、反转和完播率有判断力。\n4. 能接受成人向 AIGC 内容方向。\n5. 具备基础审美，能保证画面、字幕和声音统一。\n6. 工作细致，能适应批量内容生产。\n\n作品要求：\n\n1. 面试需提供 2-3 条剪辑作品。\n2. 有短剧、剧情视频、AI 视频剪辑案例优先。\n3. 可接受现场剪辑测试或提供改版思路。", "cat": "内容与创作"}, {"id": "52", "title": "AI 视频生成师", "salary": "15-20k", "jd": "AI 视频生成师\n招聘人数：2 人\n薪资范围：15K-20K / 月\n岗位方向：AI 视频生成、角色一致性、镜头画面制作**\n\n岗位定位：\n负责把剧本和分镜转化为 AI 视频画面，核心能力是会用 AI 工具稳定出片，并解决人物一致性、动作连贯、场景稳定和画面质感问题。\n\n岗位职责：\n\n1. 根据剧本、分镜和导演要求，使用 AI 视频工具生成短剧镜头。\n2. 负责人物形象一致性、服装一致性、场景一致性和镜头连续性。\n3. 使用 AI 工具完成图生视频、文生视频、视频延展、局部重绘、动作优化等工作。\n4. 配合编剧优化提示词，让剧本更适合 AI 工具生成。\n5. 配合剪辑师整理可用素材，提高成片效率。\n6. 持续测试新工具、新模型和新工作流，沉淀高成功率提示词模板。\n7. 建立角色库、场景库、镜头库、动作库和参数模板。\n\n任职要求：\n\n1. 熟悉至少一种 AI 视频工具，如可灵、即梦、Runway、Pika、Luma、ComfyUI 等。\n2. 有图生视频、角色一致性、AI 短片、AI 广告片或 AI 剧情视频经验优先。\n3. 具备基础镜头语言、构图、光影、人物动作和画面审美能力。\n4. 能接受成人向 AIGC 内容方向，理解内容尺度和画面边界。\n5. 能快速试错，愿意持续研究工具更新。\n6. 有稳定作品集或完整项目经验者优先。\n\n作品要求：\n\n1. 面试需提供 AI 视频作品或生成案例。\n2. 最好能说明使用工具、制作流程、提示词思路和成片周期。\n3. 可接受现场测试一个短镜头生成方案。", "cat": "内容与创作"}, {"id": "53", "title": "AI短剧编剧", "salary": "12-20k", "jd": "1. 短剧编剧\n招聘人数：2 人 \n薪资范围：12K-20K / 月\n岗位方向：成人向 AIGC 短剧剧本创作、系列内容策划\n\n岗位定位：\n负责成人向 AIGC 短剧的故事创作与剧本产出，需要把题材、人物、情绪、反转和用户爽点结合起来，写出适合 AI 视频生成和平台传播的短剧内容。\n\n岗位职责：\n\n1. 负责短剧选题、故事大纲、人物设定、分集剧情和完整剧本撰写。\n2. 根据成人向内容平台用户偏好，设计强冲突、强关系、强反转、强追更的剧情结构。\n3. 将剧情拆解为适合 AI 生产的镜头段落，配合 AI 视频生成师完成画面落地。\n4. 参与系列 IP 规划，包括角色关系、人物标签、剧情主线、分季节奏等。\n5. 根据播放、点击、收藏、评论等数据反馈，持续优化题材方向和剧本节奏。\n6. 配合运营完成标题、简介、封面文案、标签关键词和推广短文案。\n7. 建立可复用的题材库、人物库、剧情模板和爆款结构库。\n\n任职要求：\n\n1. 有短剧、网文、影视、漫画、情感故事、成人向内容创作经验优先。\n2. 熟悉短剧节奏，懂开头钩子、剧情反转、情绪推进和结尾悬念。\n3. 具备较强文字表达能力，能稳定输出成体系剧本。\n4. 能接受成人向 AIGC 内容方向，具备内容边界和平台审核意识。\n5. 了解 AI 工具能力边界，能把剧本文字转化为可执行画面描述。\n6. 执行力强，能适应高频产出和快速修改。\n\n作品要求：\n\n1. 面试需提供 1-3 篇过往剧本、故事大纲或短剧案例。\n2. 有已上线作品、爆款案例、网文连载经验者优先。\n3. 可接受现场试写短剧大纲或 1 集分镜脚本。", "cat": "内容与创作"}, {"id": "54", "title": "新媒体运营", "salary": "10-15K", "jd": "一、岗位定位\n负责品牌在海外/外网平台的内容运营与传播执行，围绕品牌曝光、用户触达、内容引流及社群沉淀，推动外网传播体系搭建与持续优化。\n二、岗位职责\n1. 负责 Twitter、Instagram、Telegram 等外网平台的日常内容运营与账号维护。\n2. 围绕品牌传播、用户增长和产品引流目标，策划并执行外网内容发布及互动运营。\n3. 跟踪平台数据表现，持续优化内容方向、发布时间及互动策略。\n4. 结合社群、KOC/KOL、渠道合作等形式，提升品牌曝光和用户引流效率。\n5. 熟悉平台风险边界，在合规前提下推进内容传播与引流动作。\n\n三、任职要求\n1. 3年以上海外社媒、外网运营或出海内容平台相关经验。\n2. 熟悉 Twitter、Instagram、Telegram 等平台规则、调性及传播机制。\n3. 具备明确的引流意识，有账号引流、社群沉淀或转化承接经验。\n4. 执行力强，具备良好的数据分析能力、协作沟通能力和推动落地能力。\n\n四、加分项\n1. 有成人行业、情趣用品、两性健康品牌或二次元品牌相关经验。\n2. 有外网 KOL/KOC、社群、媒体或渠道合作资源。\n3. 有从0到1搭建外网账号矩阵或引流体系经验。\n4. 对用户参与机制、活动传播链路和品牌互动方式有较强洞察。", "cat": "运营与市场"}, {"id": "55", "title": "高级产品经理（管理方向）", "salary": "20k-28k", "jd": "高级产品经理｜视频内容方向\n岗位职责\n负责视频内容产品规划与迭代\n负责公司视频内容类产品的整体规划、功能设计和持续优化，覆盖短视频、长视频、直播、内容社区、创作者体系、内容运营后台等相关方向。能够结合业务目标、用户需求、竞品情况和数据表现，制定清晰的产品路线图和阶段性目标。\n优化视频内容消费体验\n围绕视频播放、推荐流、详情页、搜索、评论、点赞、收藏、分享、关注、举报反馈等核心链路，持续提升用户体验和产品效率。重点关注播放量、完播率、人均观看时长、互动率、留存率等核心指标。\n推动内容生态建设\n参与内容生产、审核、分发、消费、沉淀的完整链路设计，推动内容标签、内容分层、优质内容识别、低质内容治理、创作者激励等机制建设，提升平台内容供给质量和内容分发效率。\n数据驱动产品增长\n建立和完善视频内容产品的数据指标体系，通过数据分析发现问题、验证假设、制定优化方案。能够独立完成需求效果复盘、漏斗分析、用户分层分析、AB 实验方案设计，并推动产品持续增长。\n跨团队项目推进\n负责重点项目从需求调研、方案设计、PRD 编写、评审推进、研发跟进、测试验收、上线发布到数据复盘的完整闭环。协调研发、设计、算法、运营、审核、数据、市场等团队资源，保障项目高质量交付。\n负责产品团队管理\n负责产品团队的目标拆解、任务分配、过程跟进和质量把控，能够指导团队成员提升需求分析、产品设计、数据分析、项目推进和业务理解能力，推动团队形成规范化、高效率的产品工作机制。\n任职要求\n经验要求\n本科及以上学历，5 年以上互联网产品经验，其中至少 2 年视频内容、短视频、直播、内容社区、信息流推荐或内容平台相关经验。\n视频内容产品能力\n熟悉视频内容产品核心链路，理解内容生产、内容审核、推荐分发、播放互动、内容运营、创作者体系等模块的产品设计逻辑。对短视频、直播、社区内容、UGC/PGC 内容生态有较深入理解。\n数据分析能力\n具备较强的数据意识和指标拆解能力，熟悉播放量、曝光点击率、完播率、互动率、关注转化率、留存率、内容供给量、优质内容占比等常见指标，能够通过数据定位问题并推动优化。\n项目推进能力\n具备复杂项目管理经验，能够在多部门协作场景下明确目标、拆解任务、推动执行、识别风险，并保证项目按计划落地。具备较强的沟通协调能力和问题解决能力。\n团队管理能力\n具备 2 年以上产品团队管理经验，有管理 3 人及以上产品团队经验优先。能够进行团队目标管理、过程管理、人才培养和结果复盘，带领团队持续交付高质量产品成果。\n加分项\n\n有短视频平台、直播平台、内容社区、影视内容平台、在线教育视频、新闻资讯视频化产品经验者优先。\n\n有推荐系统、内容标签、内容审核、创作者平台、内容商业化、会员付费、广告变现等相关经验者优先。\n\n有 AI 视频生成、智能剪辑、视频理解、智能审核、AIGC 内容生产工具相关经验者优先。\n\n熟悉 SQL、埋点体系、AB 实验、BI 数据看板、用户增长模型者优先。", "cat": "产品与管理"}, {"id": "56", "title": "AI内容编辑师", "salary": "15-25K（按市场情况可上浮至35K）", "jd": "岗位职责：\n1. 根据编剧提供的剧本、分镜脚本，完成AI短剧、AI漫剧相关素材制作；\n2. 负责角色设计、场景设计、道具设计及画面风格统一；\n3. 完成角色一致性控制、多镜头角色复现及连续镜头衔接；\n4. 使用AI工具完成图片生成、图片优化、视频生成及镜头补充；\n5. 负责图生图、文生图、图生视频、视频重绘、局部重绘等制作工作；\n6. 根据项目要求完成镜头拆分、批量生成及素材管理；\n7. 配合后期完成短剧成片制作，保证画面质量及交付效率；\n8. 持续优化AI工作流，沉淀提示词库、角色库、场景库及标准化制作流程。\n岗位要求：\n1. 熟练使用ComfyUI，能够独立搭建及调整工作流；\n2. 熟悉角色一致性方案，包括LoRA、IPAdapter、ControlNet、FaceSwap等技术；\n3. 熟悉Flux、SDXL等主流模型及相关生态；\n4. 熟悉即梦、可灵、Runway、Pika、Luma、PixVerse、海螺等AI视频平台；\n5. 具备较强审美能力，对人物比例、镜头构图、光影氛围、色彩风格有较好理解；\n6. 具备影视镜头意识，能够根据分镜需求完成对应画面制作；\n7. 具备较强问题排查能力，能够解决角色崩坏、风格漂移、动作异常等问题；\n8. 有较强执行力，能够在规定时间内完成批量内容生产。\n加分项：\n1. 有AI短剧、AI漫剧、广告素材制作经验；\n2. 有角色一致性项目经验；\n3. 熟悉真人转动漫、韩漫风、影视风等风格制作；\n4. 有ComfyUI工作流开发及优化经验；\n5. 熟悉PR、PS、剪映等后期工具；\n6. 有成人向剧情内容制作经验者优先。\n面试重点考察：\n1. ComfyUI实操能力；\n2. 角色一致性控制能力；\n3. 图生视频质量与稳定性；\n4. 镜头理解能力；\n5. 问题解决能力；\n6. 批量化生产能力。\n面试需提供：\n1. AI短剧作品案例；\n2. AI漫剧作品案例；\n3. 角色一致性案例；\n4. ComfyUI工作流截图或工程文件；\n5. 图生视频案例；\n6. 本人独立完成项目说明", "cat": "内容与创作"}, {"id": "57", "title": "中高级运营", "salary": "15-20k", "jd": "岗位职责：\n1. 5年以上To C产品运营、产品运营或内容产品相关经验，有内容站、社区产品、泛娱乐产品（包括但不限于视频、交友、直播等）产品经验优先；\n2. 必须具备产品0-1搭建或核心项目从规划到落地的完整经验，能够独立推动需求设计、项目落地及后续迭代优化经验；\n3. 熟悉产品迭代流程，能够结合业务目标、用户反馈及数据表现，持续推进产品功能优化与版本迭代；\n4. 具备基础原型输出能力，能够独立完成基础原型图、流程图、页面逻辑梳理，并与产品、设计、技术高效协同；\n5. 熟悉内容类产品运营逻辑，对内容板块搭建、内容分发、内容消费链路及内容生态优化有一定经验；\n6. 具备用户增长思维，对拉新、留存、活跃、转化等核心增长指标有实践经验，能够围绕目标制定增长策略；\n7. 具备较强的数据分析能力，能够通过数据发现问题、定位原因，并推动产品与运营方案优化；\n8. 对AI产品或AI工具有一定理解和应用经验，能够结合AI能力推动业务提效、内容优化或产品创新者优先；\n9. 具备良好的跨团队沟通协作能力，能够与产品、技术、设计、运营等多角色高效配合，推动事项落地；\n10. 具备较强的执行力、责任心和项目推进能力，能够适应业务快速变化与多任务并行节奏。\n\n岗位要求：\n1. 负责内容类产品的中后台及用户侧运营工作，围绕产品迭代、内容优化、用户增长及转化提升等方向，持续推进业务发展；\n2. 参与产品需求规划与版本迭代，能够结合业务目标、用户需求及数据反馈，提出优化方案并推动落地；\n3. 独立输出基础原型图、页面逻辑及流程方案，协助完成产品方案梳理、需求评审及开发对接；\n4. 负责内容板块的规划、调整与优化，持续提升内容曝光效率、用户消费效率及整体内容体验；\n5. 围绕用户增长目标，制定并推进拉新、促活、留存、转化等相关运营策略，提升产品核心指标表现；\n6. 分析用户行为及内容数据，重点关注DAU、留存率、转化率、内容点击率、消费时长等指标，并输出优化建议；\n7. 协同产品、技术、设计等团队推进产品功能落地，跟进项目排期、开发进度、测试上线及效果复盘；\n8. 结合内容生态和用户需求，持续优化内容结构、页面体验及功能策略，提升用户活跃度与产品使用体验；\n9. 探索AI在产品和运营场景中的应用，推动AI能力在内容生产、内容分发、用户运营或效率提升方面的落地；\n10. 沉淀产品运营方法论与项目流程规范，为后续业务复制和团队协同提供支持。\n\n必备条件：\n视频平台、AI互动产品、社区平台、社交平台等泛娱乐行业经验；\n具备产品0-1搭建或核心项目从规划到落地的完整经验；\n具备用户增长思维，对拉新、留存、活跃、转化等核心增长指标有实践经验，能够围绕目标制定增长策略；\n具备较强的数据分析能力，能够通过数据发现问题、定位原因，并推动产品与运营方案优化；\n跨职能岗位协调经验丰富，能够进行快速协调技术岗位推动整体项目开发进度；\n思维活跃实事求是，能够洞察工作环节的缺失点进行汇总，并进行有效整改。", "cat": "运营与市场"}, {"id": "58", "title": "AI短剧编导", "salary": "15-25k", "jd": "岗位职责：\n负责公司 AI短剧、AI漫剧、成人向剧情短剧等内容制作，完成角色设定、分镜生成、画面生成、视频生成及成片交付；同时配合公司搭建 AI短剧内容生产工作流，沉淀提示词模板、平台使用流程、素材管理规范和批量化制作 SOP\n岗位要求：\n熟练使用 ComfyUI，具备角色一致性控制、图生图、图生视频、局部重绘等能力；熟悉可灵、即梦、Runway、Pika、Luma、PixVerse、海螺、Midjourney 等主流 AI视频/短剧平台；具备一定审美和镜头意识，能根据剧本和分镜完成可交付内容。\n其他要求：\n需提供 AI短剧、AI视频、AI漫剧、角色一致性案例或 ComfyUI 工作流作品；有 AI短剧、成人向内容、广告素材、批量化内容生产经验者优先；能接受成人向内容制作方向，并遵守公司内容合规要求。", "cat": "内容与创作"}, {"id": "59", "title": "中高级运营", "salary": "10-18k", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。", "cat": "运营与市场"}, {"id": "60", "title": "编辑专员", "salary": "7K-10K", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；黑料吃瓜等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "61", "title": "编辑专员", "salary": "7K-10K", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；黑料吃瓜等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "62", "title": "舆情收集员", "salary": "10K-15K（优秀面议）", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "63", "title": "AI视频创作（AI成人短剧方向）", "salary": "10K-20K（优秀者可面议）", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\n优先考虑：\n1.有成熟AI视频作品集。\n2.有完整AI工作流搭建经验。\n3.有自动化（ComfyUI Workflow、API、脚本）经验。\n4.熟悉PR、AE、CapCut等后期工具。\n5.有团队协作及项目经验。\n\n面试要求：\n近三个月代表作品（图片或视频均可）\n工作流截图（ComfyUI等）\n常用模型及LoRA介绍\n常用Prompt示例\n独立完成的项目案例", "cat": "内容与创作"}, {"id": "64", "title": "中高级运营", "salary": "10k-18k", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，熟练使用 Google GSC 站长平台|yandex站长平台，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。                                                                                                                                         9.懂社群运营，懂这些平台运营优先Telegram，Discord， X，WhatsApp。\n9、能接受远程办公，保证工作时间在线响应\n加分项：\n1、有成人向/泛娱乐/吃瓜类内容运营经验\n2、有矩阵账号批量运营经验\n3、熟悉Agent自动化发布流程以及各个平台多节API路径\"", "cat": "运营与市场"}, {"id": "65", "title": "主编", "salary": "10K-15K", "jd": "岗位职责\n1. 负责平台热点内容的标题策划、正文撰写及内容包装；\n2. 根据热点事件快速输出具有点击力、传播力和讨论度的文案；\n3. 负责神评论、热评、互动评论及评论区趣味内容创作；\n4. 负责段子、网络梗、趣味表达及年轻化内容创作；\n5. 持续关注全网热点，挖掘适合平台用户的内容选题；\n6. 参与吃瓜原创关键词、网络热词、特色表达及内容标签的创作；\n7. 使用AI工具完成资料整理、信息提炼和初稿辅助，并进行人工深度创作；\n8. 根据内容点击率、阅读率及互动数据不断优化文案表达。\n\n任职要求\n1. 具备互联网内容、媒体、自媒体、新媒体或文案相关工作经验；\n2. 中文表达能力较强，能够独立完成标题、正文、评论及段子创作；\n3. 对娱乐热点、社会热点及网络流行文化敏感；\n4. 有较强的网感，熟悉年轻用户的语言习惯和内容偏好；\n5. 能够快速理解热点事件，并找到有吸引力的文案切入角度；\n6. 具备较强的原创意识，不依赖简单搬运和机械改写；\n7. 能熟练使用AI工具辅助创作，但具备独立思考和人工创意能力；\n8. 有爆款标题、爆款文章、热门评论或自媒体运营经验者优先。", "cat": "内容与创作"}, {"id": "66", "title": "编辑专员", "salary": "7K-10K", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；针对、911爆料、91爆料、黑料吃瓜网等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "内容与创作"}, {"id": "67", "title": "舆情收集员", "salary": "7k-15k", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "68", "title": "AI视频创作（AI成人短剧方向）", "salary": "15K-20K（优秀面议）", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\n优先考虑：\n1.有成熟AI视频作品集。\n2.有完整AI工作流搭建经验。\n3.有自动化（ComfyUI Workflow、API、脚本）经验。\n4.熟悉PR、AE、CapCut等后期工具。\n5.有团队协作及项目经验。\n\n面试要求：\n近三个月代表作品（图片或视频均可）\n工作流截图（ComfyUI等）\n常用模型及LoRA介绍\n常用Prompt示例\n独立完成的项目案例", "cat": "内容与创作"}, {"id": "69", "title": "舆情收集员", "salary": "10K-15K（优秀面议）", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "运营与市场"}, {"id": "70", "title": "AI视频创作（AI成人短剧方向）编剧", "salary": "10K-20K（优秀者可面议）", "jd": "# AI短剧编剧\n\n## 岗位职责\n\n1. 负责AI短剧的选题、人物设定、剧情大纲、分集剧本及对白创作。\n2. 根据AI视频生成特点设计剧情、场景和人物动作，保证内容具备较强可执行性。\n3. 负责短剧开场钩子、冲突、反转、情绪递进及结尾悬念设计。\n4. 配合AI生成、剪辑及运营团队完成剧本落地，并根据数据反馈持续优化内容。\n5. 持续关注热门短剧、短视频及AI内容趋势，提升内容产出效率和点击表现。\n\n## 任职要求\n\n1. 2年以上短剧、网文、短视频或相关内容创作经验。\n2. 能独立完成故事大纲、人物设定及完整短剧剧本。\n3. 熟悉短剧节奏，具备较强的冲突、反转及对白设计能力。\n4. 有较强画面感，能够将剧情拆解成人物、场景、动作及镜头。\n5. 了解AI图片、AI视频生成逻辑，能够根据AI制作特点优化剧本。\n6. 网感强，熟悉热门内容及用户观看习惯。\n\n## 优先考虑\n\n1. 有成熟短剧或网文作品。\n2. 有AI短剧、真人短剧相关经验。\n3. 能完成分镜脚本或AI视频Prompt拆解。\n4. 有爆款内容或系列化项目经验。\n\n## 面试要求\n\n* 近期代表剧本或作品\n* 1个完整项目案例\n* 现场完成简单选题或剧情大纲测试", "cat": "内容与创作"}, {"id": "71", "title": "AI视频创作（AI成人短剧方向）", "salary": "10K-20K（优秀者可面议）", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\n优先考虑：\n1.有成熟AI视频作品集。\n2.有完整AI工作流搭建经验。\n3.有自动化（ComfyUI Workflow、API、脚本）经验。\n4.熟悉PR、AE、CapCut等后期工具。\n5.有团队协作及项目经验。\n\n面试要求：\n近三个月代表作品（图片或视频均可）\n工作流截图（ComfyUI等）\n常用模型及LoRA介绍\n常用Prompt示例\n独立完成的项目案例", "cat": "内容与创作"}, {"id": "72", "title": "AI短视频编剧", "salary": "15k-25k", "jd": "岗位职责：\n\n一、故事策划。根据项目定位及目标用户，完成题材研究、故事构思、世界观设定和整体内容规划。\n\n二、剧本创作。独立完成故事大纲、人物小传、分集梗概及完整剧本，确保剧情结构完整、逻辑合理。\n\n三、人物塑造。设计主要人物的背景、性格、动机及成长线，保证人物行为符合设定并具备辨识度。\n\n四、情节设计。负责冲突、悬念、反转、高潮及结局设计，强化故事吸引力和连续观看动力。\n\n五、对白创作。根据人物身份和情境设计自然、准确且具有记忆点的对白，避免人物语言同质化。\n\n六、剧本修改。根据审核意见、制作条件和数据反馈调整剧情、节奏、人物关系及台词，跟进至最终定稿。\n\n七、制作协同。与导演、运营、剪辑、美术及AI制作人员对接，将剧本转化为可执行的分镜和制作方案。\n\n八、内容研究。持续研究热门题材、用户偏好、平台趋势及优秀作品，沉淀故事结构、人物设定和剧情案例库。\n\n九、原创内容孵化。围绕平台方向开发原创故事、系列短剧、人物IP及可持续扩展的内容项目。\n\n十、数据复盘。结合播放量、完播率、留存率、互动率等数据，分析剧情表现并优化后续创作。\n\n十一、AI工具应用。使用AI辅助资料整理、创意发散、设定验证和初稿梳理，坚持“AI提升效率，编剧负责原创、判断和最终质量”。\n\n任职要求：\n\n一、3年以上编剧、影视策划、短剧创作、小说创作或相关内容工作经验。\n\n二、具备独立完成故事大纲、人物小传、分集梗概和完整剧本的能力。\n\n三、熟悉故事结构、人物弧光、戏剧冲突、悬念设置、节奏控制及情绪推进。\n\n四、文字功底扎实，具备较强的场景描写、人物塑造和对白创作能力。\n\n五、对短剧、网络影视、短视频及主流内容平台具有较强敏感度，了解用户观看习惯。\n\n六、具备较强的原创能力，能够围绕明确题材持续产出故事，不拼接、不抄袭、不依赖模板化生成。\n\n七、能够根据制作预算、拍摄条件、平台规则及审核意见调整剧本，兼顾创意与落地性。\n\n八、具备良好的沟通协作能力，能够与导演、运营、剪辑、美术及制作团队高效配合。\n\n九、有上线作品、热门短剧、成熟剧本或系列内容项目经验者优先。\n\n十、有悬疑、情感、都市、喜剧、成人向或强情节短剧创作经验者优先。\n\n十一、能够熟练使用AI工具辅助创作，但必须具备独立判断、深度修改和原创把控能力。\n\n作品要求：\n\n一、应聘时需提供至少1—2部本人主创的完整作品或剧本片段。\n\n二、作品需能够体现故事结构、人物塑造、情节设计和对白能力。\n\n三、如作品已上线，请补充本人承担的具体职责及可验证的作品信息。", "cat": "内容与创作"}, {"id": "73", "title": "AI视频创作（AI成人短剧方向）", "salary": "15K-20K（优秀面议）", "jd": "岗位职责：\n1.负责AI成人短剧、AI成人视觉内容的创作及生产，包括人物、场景、镜头、动作等完整内容制作。\n2.熟练使用主流AI视频、AI图片及AI工作流工具，高质量完成内容生成。\n3.独立完成从创意、提示词、图片生成、视频生成到后期优化的完整制作流程。\n4.持续优化人物一致性、动作流畅度、画面质量及细节表现，减少AI生成缺陷。\n5.根据运营需求快速完成热点内容制作，提高内容产出效率及点击表现。\n6.持续研究国内外最新AI工具及模型，优化工作流，提升团队整体生产效率。\n7.与运营、产品及内容团队协同，持续优化内容表现及用户体验。\n\n任职要求：\n必须具备\n1.2年以上AI图片或AI视频创作经验。\n2.熟练掌握至少2种以上AI生成工具，例如：\nComfyUI\nStable Diffusion\nFlux\nMidjourney\nRunway\nKling（可灵）\nHailuo（海螺）\nPixVerse\nDreamina（即梦）\nWan等同类工具。\n3.熟悉LoRA、ControlNet、IPAdapter、人物一致性等常见AI工作流。\n4.能独立完成高质量AI作品，并能主动修复人物、手部、动作、光影等常见缺陷。\n5.熟悉Prompt设计及模型调优，具备较强审美能力。\n\ const CATS = ["内容与创作", "运营与市场", "技术开发", "产品与管理", "采集与逆向", "安全攻防", "职能与行政"];

const catCounts = {};
JOBS.forEach(j => { catCounts[j.cat] = (catCounts[j.cat]||0) + 1; });

let activeCat = null;
try { activeCat = localStorage.getItem('omi_jobs_cat') || null; } catch(e) {}

const chipRow = document.getElementById('chipRow');
function renderChips(){
  const chips = [{cat:null,label:'全部',n:JOBS.length}].concat(
    CATS.filter(c => catCounts[c]).map(c => ({cat:c,label:c,n:catCounts[c]}))
  );
  chipRow.innerHTML = chips.map(c => `
    <div class="chip ${activeCat===c.cat ? 'active':''}" data-cat="${c.cat ?? ''}">
      ${c.label} <span class="n">${c.n}</span>
    </div>
  `).join('');
  chipRow.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-cat');
      activeCat = v === '' ? null : v;
      try { activeCat ? localStorage.setItem('omi_jobs_cat', activeCat) : localStorage.removeItem('omi_jobs_cat'); } catch(e) {}
      renderChips();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const statsEl = document.getElementById('stats');

function render(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const filtered = JOBS.filter(j => {
    if (activeCat && j.cat !== activeCat) return false;
    if (!q) return true;
    return j.title.toLowerCase().includes(q) || j.jd.toLowerCase().includes(q);
  });

  statsEl.textContent = `显示 ${filtered.length} / ${JOBS.length} 个职位`;

  if (filtered.length === 0){
    list.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  list.innerHTML = filtered.map(j => `
    <div class="card">
      <div class="card-top">
        <span class="card-tag">${escapeHtml(j.cat)}</span>
        <span class="card-id">#${escapeHtml(j.id)}</span>
      </div>
      <h3>${escapeHtml(j.title)}</h3>
      ${j.salary ? `<div class="salary">${escapeHtml(j.salary)}</div>` : ''}
      <div class="jd" id="jd-${j.id}">${escapeHtml(j.jd)}</div>
      <div class="card-actions">
        <button class="toggle-btn" data-id="${j.id}">展开全文 ▾</button>
        <a class="apply-btn" href="https://t.me/y666899y" target="_blank" rel="noopener">投递 / 咨询 ↗</a>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const jd = document.getElementById('jd-' + btn.getAttribute('data-id'));
      const isExpanded = jd.classList.toggle('expanded');
      btn.textContent = isExpanded ? '收起 ▴' : '展开全文 ▾';
    });
  });
}

document.getElementById('searchInput').addEventListener('input', render);

renderChips();
render();
</script>
