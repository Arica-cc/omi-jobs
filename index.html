案编辑能力和热点敏感度。\n4. 确认是否会剪辑、封面制作、批量压缩。\n5. 有黑料写手经验优先。", "cat": "内容与创作"}, {"id": "382", "title": "运营经理（流量（WEB）部副主管）", "salary": "20-35k", "location": "远程，可国内办公", "jd": "岗位职责\n1、负责网站整体运营管理，制定并落实网站运营策略，推动业务目标达成。\n2、负责网站内容运营、协助SEO优化、首页及频道页运营、专题策划等工作，持续提升网站流量及用户活跃度。\n3、负责网站核心数据监控与分析，包括新增用户、DAU、PV、UV、留存率、跳出率、收录量、关键词排名等，并制定优化方案。\n4、负责网站内容规划与运营规范建设，持续优化栏目结构、页面布局及用户体验。\n5、制定并执行Google SEO及站内SEO优化策略，推动网站收录、关键词排名及自然流量持续增长。\n6、协同产品、研发、设计等部门推进网站功能优化、需求迭代及项目落地，确保按计划交付。\n7、建立网站运营SOP、数据分析体系及工作流程，提高团队执行效率和运营质量。\n8、负责运营团队日常管理，包括工作安排、任务跟进、绩效考核、培训指导及人才培养。\n9、定期开展行业研究及竞品分析，结合业务目标提出运营优化方案。\n\n\n岗位要求\n\n熟悉网站运营全流程，具备独立负责网站运营项目经验。\n熟悉Google SEO、站内SEO及基础技术SEO知识。\n具备较强的数据分析能力，能够根据数据制定优化策略。\n熟悉内容运营、流量运营、用户运营及增长运营。\n能独立制定运营计划、项目推进方案及阶段性复盘。\n具备优秀的跨部门沟通协调及项目管理能力。\n\n加分项\n1、有Google、yandex SEO成功增长案例。\n2、有百万级以上流量网站运营经验优先。\n3、有资讯、视频、小说、漫画、社区等内容平台运营经验。\n4、有网站从0到1搭建或改版经验。\n5、有运营团队（5人以上）管理经验。\n6、有数据分析、A/B测试及增长运营经验。\n7、熟悉AI内容生产、自动化运营工具及工作流。\n\n我们希望你具备\n\n1、强烈的目标意识和结果导向，对业务增长负责。\n2、良好的逻辑思维能力，能够通过数据发现问题并提出解决方案。\n3、优秀的执行力和推动力，能够高效推进项目落地。\n4、较强的责任心，能够主动承担工作并持续优化流程。\n5、良好的团队管理能力，能够培养团队成员成长。\n6、优秀的沟通协调能力，能够高效协同产品、研发、设计等部门。\n7、持续学习能力，关注行业动态、新工具及运营方法论。\n\n试用期交付要求\n\n试用期内需完成：\n\n1、熟悉公司产品、网站业务及运营流程，了解各网站定位、运营模式及核心业务指标。\n2、对负责网站进行全面诊断，输出《网站运营分析报告》，至少提出20项可落地的优化建议（包含内容运营、SEO、页面体验、产品功能、数据分析等方向）。\n3、梳理当前网站运营流程，识别存在的问题，并提出优化方案及优先级。\n4、完成网站核心数据分析，建立基础运营数据看板，并形成日报、周报模板。\n5、制定未来1个月网站运营计划，包括内容运营、内容SEO优化、专题运营、用户增长等重点工作安排。\n6、推动至少1项运营优化需求或项目落地，并完成效果验证及复盘。\n7、与产品、研发、设计等相关团队建立协作机制，能够独立推进需求评审及项目跟进。", "cat": "运营与市场"}, {"id": "383", "title": "中级运营（资源供给运营（代理/聊手）", "salary": "12-22k", "location": "远程，可国内办公", "jd": "岗位类型：全职，合作（区域代理/夜店营销等）\n\n岗位职责\n1. 挖掘与签约：通过内容平台、达人社群、MCN 等多渠道主动挖掘触达优质内容创作者 / 达人 / KOL/酒吧/商k/夜场/伴游/地陪等资源，完成评估、洽谈与线上签约，持续扩充合规供给规模；\n2. 维护与激活：维护已签约创作者关系，用流量扶持、分成收益、成长路径等留住优质供给，保持其活跃与内容产出；\n3. 渠道运营与数据复盘：拓展并运营达人代理、MCN、商k/夜场/伴游/地陪，创作者社群等供给侧获取渠道，监控签约数量与质量、获取成本、留存产出等核心指标，做归因与 ROI 优化，并确保创作者与内容合规。\n\n任职要求\n1. 有创作者 / 达人 / 主播/商k/夜场/伴游/地陪招募签约或供给侧 BD 实战经验，并拿过可量化结果；\n2. 熟悉内容平台达人生态与签约玩法，数据敏感，会做漏斗、归因与 ROI 分析、把控渠道质量；\n3. 沟通谈判强、嗅觉敏锐、执行力强、抗压，简历能体现可量化成果（签约数、供给规模、获取成本、留存产出等）。\n\n加分条件\n1. 自带可直接动用的创作者资源或达人渠道，进来即能产出；\n2. 有 MCN、直播公会、达人经纪、内容平台创作者增长经验；\n3. 熟悉多平台线上挖掘签约、达人代理合作、商k/夜场/伴游/地陪/社群 / 私域裂变等供给侧玩法。", "cat": "运营与市场"}, {"id": "384", "title": "中级运营（网站内容运营）", "salary": "15-22k", "location": "远程，可国内办公", "jd": "岗位职责\n1、负责网站整体内容运营规划，制定内容增长策略，持续提升网站流量、用户活跃及内容质量。\n2、根据用户需求、热点趋势及平台定位，策划专题、栏目及内容矩阵，提升内容传播效果及用户留存。\n3、建立并优化内容生产、审核、发布及运营 SOP，提高团队协作效率及内容交付质量。\n4、负责网站内容生态建设，包括栏目规划、内容分类、标签体系、推荐机制及内容结构优化。\n5、深度结合 SEO 策略，规划关键词布局、专题页、聚合页及内容矩阵，提升 Google 自然搜索流量及关键词排名。\n6、建立内容数据分析体系，持续监控 PV、UV、CTR、停留时长、留存率、跳出率等核心指标，输出分析报告并推动优化。\n7、挖掘行业热点及用户需求，制定长期内容规划及阶段性运营方案，提升内容竞争力。\n8、协同产品、SEO、设计、研发及运营团队，推动内容相关功能优化及项目落地。\n9、持续关注行业动态、竞争对手及市场变化，输出内容运营策略及增长建议。\n\n\n岗位要求\n1、3 年以上网站内容运营经验，有大型内容平台（资讯、社区、视频、漫画、小说等）运营经验优先。\n2、熟悉网站内容运营全流程，具备独立负责内容板块及项目运营的能力。\n3、具备优秀的内容策划能力，对热点事件、用户需求及行业趋势具有较高敏感度。\n4、熟悉 SEO 内容优化，了解关键词布局、专题策划、聚合页、内链优化等运营策略。\n5、熟悉 Google Analytics（GA）、Google Search Console（GSC）、Ahrefs、Semrush 等工具，能够基于数据分析持续优化内容效果。\n6、熟悉 AI 内容生产工具（如 ChatGPT、Claude、Gemini 等），能够合理提升内容生产效率，同时保证内容质量。\n7、具备较强的数据分析能力、项目推进能力及跨部门沟通协调能力。\n8、具有较强的责任心、执行力及结果导向意识，能够适应快节奏工作环境。\n\n\n加分项\n1、有百万级 DAU 网站或大型内容平台运营经验。\n2、有 Google SEO、Google Discover、Google News 等内容运营经验。\n3、有 UGC、社区、论坛、视频、漫画、小说等产品运营经验。\n4、有海外网站、多语言网站或国际化产品运营经验。\n5、有内容团队管理、SOP 搭建及培训经验。\n6、有成功提升网站流量、用户活跃度或打造爆款专题、栏目案例。\n7、熟悉内容风控、版权管理及内容审核机制。\n\n\n我们希望你具备\n\n1、能够独立制定网站内容运营策略，而不仅是执行内容发布。\n2、能够通过数据分析发现问题，并持续优化内容质量及运营效果。\n3、能够结合 SEO、热点及用户需求，提升网站自然流量和用户留存。\n4、具备较强的内容策划能力，能够打造长期栏目、专题及内容矩阵。\n5、具备项目管理能力，能够推动产品、研发、设计、SEO 等团队协同完成运营目标。\n6、保持学习意识，持续关注行业趋势，不断探索新的内容增长方式。", "cat": "内容与创作"}, {"id": "385", "title": "中级运营（网站产品运营）", "salary": "16k–25k", "location": "远程，可国内办公", "jd": "网站产品运营 | HC：1 | 全远程\n\n品牌：（面向英国、欧洲高端跨文化社交平台）\n\n岗位简介\n\n我们是聚焦欧洲市场的出海初创增长团队，核心成员拥有英国本地互联网运营经验，现阶段冷启动深耕英国、欧洲高端跨文化社交赛道。本岗位是自然流量增长核心岗：把搜索流量转化为注册用户与付费会员。\n核心硬性要求：具备英文PC/M网站站独立实操能力，熟悉欧洲用户搜索习惯，拒绝模板化套用；优先英国/欧洲/北美/澳洲留学经历或海外出海项目经验，英语可借助AI工具辅助产出，熟悉欧美澳年轻人网络黑话、社交语境，对海外文化高度感兴趣、学习意愿强；深度玩过各类海内外交友软件，自带产品洞察，是互联网重度冲浪选手，具备极强热点敏感度与网感。\n\n你的核心工作内容\n\n1. 英国&欧洲市场PC/M网站策略落地：结合海外交友用户真实行为习惯调研本地搜索意图，制定全域关键词布局方案；负责站内页面技术优化、监控Google收录、排名、流量数据，定期复盘搜索流量→注册→付费的全转化链路。\n\n2. 全站核心页面日常运营：维护首页、欧洲各城市落地页、Creator主页、视频页、品牌介绍页，结合社交产品用户浏览偏好优化页面结构，保障页面信息合规完整、适配Google收录规则；批量优化标题、Meta Description、内链结构。\n\n3. 三条英文内容线运营（本地化优先）\n\n◦ 博客线：紧跟海外情感、婚恋、社交热点，借助AI工具完成英文内容撰写后人工校对润色，贴合英式表达习惯，面向英国高净值本土用户，沉淀长期Google搜索权重；\n\n◦ 故事线：快速捕捉留学、跨文化交友全网热门话题，灵活运用欧美澳网络流行话术、年轻人常用黑话，产出匿名故事撬动社交分享长尾流量；\n\n◦ 问答线：结构化整理欧美交友用户高频搜索问题，全覆盖长尾关键词流量入口，文案风格贴合本地年轻人说话习惯。\n\n4. Creator档案全流程上架管理：基于平台用户喜好维护头像、封面、素材、简介、城市标签、活跃状态；严格遵循英国GDPR、欧盟内容版权与隐私法规，上架前全维度合规审核，全年无重大合规事故。\n\n必备任职要求\n\n1. 有相关SEO经验，懂欧美搜索引擎底层逻辑，可独立完成关键词调研、页面优化、收录问题排查，只会套用固定模板勿投；\n\n2. 具备基础英文读写能力，可熟练借助AI翻译、润色工具产出地道文案，能自主校对修正AI生硬表达；愿意主动学习欧美澳年轻人俚语、网络黑话，理解海外社交语境；\n\n3. 熟练使用Google Search Console、GA4等海外官方数据分析工具，能通过数据定位流量问题、迭代优化方案；\n\n4. 重度互联网冲浪，长期玩各类海内外交友、约会类软件，懂用户痛点、社交玩法与传播逻辑，能快速捕捉全网最新热点、流行玩法，具备天然网感；思想开放包容，对欧美、澳洲生活与社交文化抱有浓厚兴趣；\n\n5. 会基础图片裁剪、压缩、素材上传；具备极强合规意识，熟悉海外版权、用户隐私规范，工作严谨细致。\n\n优先加分项\n\n1. 拥有英国/欧洲/北美/澳洲留学经历，或海外市场本土网站完整实战案例；\n\n2. 有社交平台、创作者经济、海外留学社区、会员订阅制平台运营经验；\n\n3. 熟练运用AI工具批量产出内容，同时具备人工精细化校对能力，把控本地化内容质量。\n\n\n工作模式\n\n全远程灵活办公\n全国均可居家办公；日常国内作息即可，只需工作时段可与英国总部办公时间重合，同步海外流量节点迭代。\n \n无名海象已参与此文档。", "cat": "运营与市场"}, {"id": "386", "title": "中级运营（内容运营）", "salary": "12k–18k", "location": "", "jd": "内容运营\nCONTENT OPERATION\n工作地点 · 不限\n\n岗位介绍   ABOUT THE ROLE\n有局是一款以 AI 驱动运营创新的本地社交平台。\n作为内容运营，你将负责有局内容生态的建设与运营，结合热点与本地生活策划优质内容，不断提升社区的内容质量和活跃度。\n你不是一个人埋头写稿，而是负责用 AI 放大内容生产力、用话题带动用户创作，成为平台内容生态的搭建者。\n岗位职责   RESPONSIBILITIES\n负责有局 App 内容生态建设，制定并执行内容运营策略。\n结合热点、校园资讯、本地生活、吃喝玩乐等方向，策划并发布优质内容。\n运用 AI 工具（ChatGPT、Claude 等）完成内容生产、整理、优化，提高内容生产效率。\n维护平台故事、攻略、活动推荐等栏目，持续丰富平台内容。\n挖掘用户感兴趣的话题，引导用户创作内容，提升社区活跃度。\n分析内容数据，不断优化内容质量及运营策略。\n配合产品及运营团队完成专题活动策划。\n任职要求   REQUIREMENTS\n本科及以上学历，专业不限，有海外留学生活经历。\n熟悉小红书、TikTok、Instagram、Reddit 等内容平台。\n具备良好的文案能力及内容策划能力。\n熟练使用 AI 工具，有 AI 内容生产经验者优先。\n对英国本地生活、留学生群体或华人社区有一定了解。\n有新媒体、自媒体或内容运营经验者优先。\n我们希望你   WHO YOU ARE\n对互联网和创业充满热情。\n学习能力强，善于发现热点。\n有责任心，执行力强，能够独立完成内容运营工作。", "cat": "内容与创作"}, {"id": "387", "title": "中级运营（商务运营）", "salary": "15k–22k", "location": "", "jd": "商务运营\nBUSINESS DEVELOPMENT\n工作地点 · 英国（必须）\n\n\n岗位介绍   ABOUT THE ROLE\n有局是一款以 AI 驱动运营创新的本地社交平台。\n作为商务运营，你将负责有局本地商家生态的拓展与合作，让餐厅、酒吧、KTV、桌游馆等本地场景与平台活动深度结合，不断提升平台的商业价值和用户的活动体验。\n你不是在做单纯的销售，而是负责为商家带来真实客流、为用户带来更好的活动场景，成为平台与本地生活之间的桥梁。\n岗位职责   RESPONSIBILITIES\n负责有局 App 商家拓展及商务合作。\n开发餐厅、酒吧、KTV、桌游馆、运动场馆、剧本杀等本地合作商家。\n洽谈商家入驻、活动合作及品牌合作，建立长期合作关系。\n制定商家合作方案，提升商家运营效果。\n协助策划平台联合活动，提高平台影响力及商业价值。\n收集行业动态及市场信息，为平台商业化提供建议。\n完成阶段性商务拓展目标。\n任职要求   REQUIREMENTS\n本科及以上学历，有英国生活和留学经验。\n具备优秀的沟通能力及商务谈判能力。\n有 BD、渠道合作、商务拓展或销售经验优先。\n熟悉英国本地商家资源或留学生市场者优先。\n目标导向，执行力强，具备一定抗压能力。\n熟练使用 AI 工具辅助商务工作者优先。\n我们希望你   WHO YOU ARE\n对创业和互联网行业充满热情。\n善于建立合作关系，具备资源整合能力。\n具有主人翁意识，愿意与团队共同成长。", "cat": "运营与市场"}, {"id": "388", "title": "中级运营（海外平台创作者运营）", "salary": "15k–22k", "location": "远程，可国内办公", "jd": "女性用户增长运营（交友平台｜小红书/私域｜全远程）\n\nHC：1｜国内全远程\n\n岗位简介\n\n我们正在打造一款面向英国及欧洲市场的高端 Dating & Lifestyle 平台。\n\n现阶段处于用户冷启动期，本岗位核心负责平台女性用户供给侧增长：通过小红书、社群、KOC/KOL、校园及私域等渠道持续获取目标女性用户，并完成从发现、触达、沟通、入驻到激活、留存和裂变的完整增长闭环。\n\n这不是单纯发内容的岗位，核心目标是：持续为平台带来真实、优质且活跃的女性用户。\n\n核心工作\n1，从0到1搭建女性用户招募渠道及增长漏斗，对有效入驻数量和质量负责；\n2，通过小红书、微信/留学群、女性社群、校园渠道、KOC/KOL及私域等方式寻找目标用户；\n3，策划招募内容、私信话术及合作方案，持续测试不同渠道的获客效果；\n4，主动进行一对一沟通，引导意向用户完成注册、资料提交及 Profile 完善；\n5，维护已入驻女性用户，提高活跃、留存及推荐裂变；建立渠道及用户数据看板，持续优化获客成本和转化效率；收集女性用户真实反馈，同步产品团队优化体验。\n\n我们希望你\n1，有用户增长、私域运营、女性社群、KOC/KOL招募、达人商务、校园推广或平台入驻运营相关经验；\n2，熟悉小红书，真正做过搜索获客、内容发布、私信触达或站外转化；\n沟通能力强，愿意主动找人、私信和长期跟进，不排斥高频一对一沟通；\n3，对年轻女性、留学生、Dating/Lifestyle 等用户圈层有较好的理解；\n数据和结果意识强，能自己找渠道、测试方法、复盘并拿到结果；\n国内全远程，不要求英语能力。\n\n加分项：有美妆、医美、模特、摄影、留学、女性社区、Dating/社交平台等相关用户资源或招募经验。", "cat": "内容与创作"}, {"id": "389", "title": "中级运营（海外私域流量运营）", "salary": "15k-22k", "location": "远程，可国内办公", "jd": "# 海外私域流量运营 | HC：1| 全远程\n\n品牌：（面向英国、欧洲高端跨文化社交平台）\n\n## 岗位简介\n\n我们正在寻找一位海外私域运营，负责平台用户的承接、转化、留存与复购。岗位核心不是单纯做曝光，而是围绕官网注册用户、咨询用户、付费用户和创作者线索，搭建一套稳定的私域运营体系，把站外流量和站内用户沉淀到可持续触达、可持续转化、可持续复购的私域池中。\n\n本岗位面向英国、欧洲市场，重点通过 WhatsApp、Telegram、Email、站内消息、社群群组、CRM 自动化触达 等方式，完成用户注册后的激活、会员转化、内容互动、创作者入驻跟进与流失召回。\n\n### 核心硬性要求\n\n* 有海外私域运营、用户运营、CRM 运营、社群运营或转化运营经验；\n* 熟悉欧美用户对私域触达、消息频率、隐私边界和沟通节奏的接受方式；\n* 能独立使用英文进行沟通，可借助 AI 工具提升写作与翻译效率，但需要自己判断语气和边界；\n* 熟悉 WhatsApp、Telegram、Email、Instagram DM、Facebook Group 等私域触达方式；\n* 理解英国、欧洲、北美或澳洲的留学生社群、跨文化社交和会员型产品的基本运营逻辑；\n* 具备较强的用户分层、标签管理、转化跟进和复盘能力；\n* 能接受 18+ 成人关系社交平台的业务属性，理解授权、隐私、合规与内容边界。\n\n## 你的核心工作内容\n\n### 1. 用户私域承接与转化\n\n* 承接来自官网、站外社媒、合作渠道和活动页的注册用户、咨询用户和高意向用户；\n* 按用户状态进行分层管理：新注册用户、浏览未注册用户、已咨询未付费用户、已付费会员、流失会员、创作者线索；\n* 通过站内消息、Email、WhatsApp、Telegram 等方式推动用户完成注册激活、首次互动、会员付费和持续留存；\n* 建立不同用户类型对应的话术、触达频率和转化节奏，避免过度打扰或低质量轰炸；\n* 跟进高意向用户的咨询、异议处理和付费推进，提升注册到付费的转化效率。\n\n### 2. CRM 标签体系与自动化运营\n\n* 搭建基础 CRM 标签体系，记录用户来源、城市、语言、兴趣、会员状态、互动偏好、内容偏好和活跃状态；\n* 设计欢迎语、激活提醒、未读消息提醒、会员到期提醒、内容更新提醒、创作者上新提醒等自动化触达；\n* 根据用户行为数据做分层触达，例如：注册后 24 小时未激活、浏览多次未注册、会员到期前提醒、沉默用户召回等；\n* 配合产品和技术团队优化触达链路，提升消息打开率、回复率和转化率；\n* 定期检查自动化流程，避免触达过密、重复触达或误发。\n\n### 3. 社群与私域池运营\n\n* 维护海外用户社群、留学生社群、会员群组和兴趣群组；\n* 通过群内话题、活动预告、内容分发、问答互动、会员福利和创作者动态，提高社群活跃度；\n* 负责社群规则、入群审核、群内秩序和基础风控；\n* 结合平台活动、创作者更新和内容节点，策划私域专属互动玩法；\n* 将社群中高意向用户导回站内会员体系、内容消费和创作者互动页面。\n\n\n## 必备任职要求\n\n1. 有私域运营、用户运营、CRM 运营、社群运营或转化运营经验；\n2. 具备较强英文沟通能力，能独立完成私信、邮件、社群消息和转化跟进；\n3. 对欧美用户、留学生社群、会员产品和跨文化沟通有基本理解；\n4. 熟悉 WhatsApp、Telegram、Email、站内消息或 CRM 工具中的至少一种；\n5. 能长期、细致地跟进用户状态，不怕重复沟通和多轮推进；\n6. 具备数据意识，能清楚记录来源、转化结果和留存情况；\n7. 能接受 18+ 成人关系社交平台的业务属性，理解授权、隐私与合规边界。\n\n## 优先加分项\n\n1. 有英国 / 欧洲 / 北美 / 澳洲留学经历，或熟悉当地社群生态；\n2. 有 Dating、会员制产品、社群产品、创作者平台或海外增长经验；\n3. 熟悉 WhatsApp、Telegram、Reddit、小红书、Instagram 等平台的社群管理和私域转化玩法；\n4. 能独立搭建基础私域分层、标签和跟进机制；\n5. 对英国本地高端人群、留学生群体和城市生活方式内容有敏感度；\n6. 有小规模社群、会员池、KOC 或博主合作经验。\n\n## 核心考核指标\n\n* 私域有效触达量与有效回复率；\n* 注册用户激活率与会员转化率；\n* 社群活跃度与复购率；\n* 创作者入驻线索转化率；\n* 用户召回率与流失挽回率。\n\n## 工作模式\n\n* 全远程灵活办公；\n* 全国均可居家办公；\n* 日常国内作息即可，但需要在关键时间段覆盖英国及欧洲活跃时段；\n* 与产品、站内运营、内容、增长和技术团队保持高频同步。", "cat": "运营与市场"}, {"id": "390", "title": "运营专员（视频剪辑专员）", "salary": "6k-10k", "location": "远程，可国内办公", "jd": "视频剪辑专员\n岗位职责\n\n1、根据平台内容定位、更新策略及用户需求，自主收集、筛选并整理相应的成人类视频资源。\n2、负责视频素材的剪辑、裁切、转码、画面调整、水印添加及基础包装，确保成片符合平台发布标准。\n3、使用 Photoshop 独立完成视频封面制作，包括素材处理、人物排版、标题设计及整体视觉优化。\n4、根据视频内容编写标题、简介等相关文案，准确匹配分类及标签。\n5、熟悉成人视频内容体系，能够准确判断不同题材、演员、剧情、场景及内容特征，避免分类和标签错误。\n6、结合平台数据、用户偏好及行业热点，持续优化选片、剪辑、封面和内容发布方向。\n7、按照平台要求完成视频质量检查，重点检查清晰度、音画同步、画面比例、水印、黑帧及内容完整性。\n8、负责素材归档、文件命名及资源管理，建立清晰、可追溯的视频素材库。\n9、配合内容运营团队完成视频批量处理、上传发布、内容调整及其他相关工作。\n10、遵守平台内容规范、版权要求及审核机制，及时处理不符合标准的素材。\n\n岗位要求\n1、具备视频剪辑相关经验，有成人内容平台、影视平台或短视频平台工作经验者优先。\n2、熟练使用 Premiere Pro、剪映等剪辑软件，能够独立完成完整的视频处理流程。\n3、熟悉 Photoshop，能够独立制作视频封面，并具备一定的排版、配色和视觉审美能力。\n4、能够接受成人内容工作环境，对成人类视频具备一定的理解和判断能力。\n5、熟悉常见成人视频题材、分类及标签，能够准确完成内容归类和标签匹配。\n6、具备较强的资源收集、筛选及整理能力，能够根据平台更新策略主动寻找合适内容。\n7、了解常见视频格式、分辨率、码率及画面比例，具备基础的视频质量判断能力。\n8、工作认真细致，具备较强的执行力、责任心及时间管理能力，能够按要求完成每日任务。\n9、具备良好的团队协作意识，能够及时沟通素材、剪辑及内容发布过程中出现的问题。\n\n加分项\n1、有成人视频、影视、短视频或内容平台剪辑经验。\n2、熟悉主流成人内容网站、资源渠道及行业热门内容趋势。\n3、了解 FFmpeg 或其他批量视频处理工具。\n4、具备批量剪辑、批量转码、批量加水印或自动化处理经验。\n5、有独立搭建素材库、分类体系或视频处理 SOP 的经验。\n6、具备较强的热点判断能力，能够根据用户偏好快速调整选片方向。\n7、有 AI 工作流使用经验，能够运用 ChatGPT、Claude、Gemini 等工具辅助资源整理、标题文案、分类标签、封面设计及批量视频处理；有相关自动化流程搭建经验者优先。\n8、有 Telegram（TG）频道运营经验，熟悉频道内容发布、资源整理、用户维护及基础数据统计者优先。\n\n我们希望你具备\n1、能够根据平台更新策略主动收集和筛选资源，而不仅是等待分配素材。\n2、能够独立完成从资源筛选、视频剪辑、封面制作到分类标签填写的完整流程。\n3、对成人内容分类和用户偏好有一定敏感度，能够准确判断视频的核心特点。\n4、具备基础审美和质量意识，能够持续优化画面、封面及内容呈现效果。\n5、能够在保证质量的前提下提高工作效率，按时完成批量内容生产任务。\n6、保持学习意识，持续关注行业趋势、剪辑方法、AI 工具及平台内容变化。", "cat": "内容与创作"}, {"id": "391", "title": "产品经理（中高级/高级 · 流量方向）", "salary": "20k-35k", "location": "远程，可国内办公", "jd": "岗位：产品经理（中高级/高级 · 流量方向）｜HC 1\n\n岗位职责\n1、负责内容流量类 Web 产品矩阵（漫画、视频、资讯等多站点）核心模块的规划与迭代，对自然流量增长、搜索收录与排名、用户留存及广告变现等核心指标负责。\n2、主导 SEO 类需求的产品化落地：站内结构与页面模板优化、聚合页与内链体系、收录与状态码治理等，与 SEO 团队协作制定并推进增长方案。\n3、参与广告变现体系设计与迭代：广告版位规划与配置、变现效率优化，兼顾用户体验与收益平衡。\n4、基于数据分析、用户行为与竞品洞察，挖掘流量增长与商业化机会，推动产品创新。\n5、搭建产品关键指标体系，通过漏斗分析、A/B 测试及分层运营持续优化转化与留存。\n6、独立负责需求全流程：需求梳理、原型设计、评审排期、测试验收、上线复盘，多产品线并行推进。\n7、跨团队（研发、设计、SEO、运营、商业化）协同推动项目高质量落地，对产品经营结果负责，定期复盘并制定增长策略。\n\n任职要求\n1、本科及以上学历，3 年以上互联网 C 端产品经验；5 年以上且有独立带线经验者按高级评估。\n2、具备完整产品生命周期管理经验，独立负责或主导过日活 10 万以上量级的 Web/内容类 C 端产品，并取得可量化的流量增长、留存或商业化成果；主导过日活 30 万以上产品且有完整增长案例者优先。\n3、产品背景不限于内容站，资讯、漫画、视频、工具导航、社区等以自然流量为主的 to C 产品经验均可。\n4、熟悉 SEO 与自然流量增长机制（收录、排名、站内结构、内容聚合、多站点矩阵），有可验证的实操成功案例者优先。\n5、理解广告变现模式（展示广告、联盟、直客版位）及会员订阅、增值服务等付费场景设计。\n6、数据驱动，熟练运用数据分析、A/B 测试与漏斗模型发现问题、验证假设并指导决策；逻辑清晰，结构化思维能力强。\n7、具备出色的 0-1 落地与实操能力，原型与需求文档功底扎实，入职一周内可独立接手需求，即到即战。\n8、能适应多产品线并行的工作节奏，兼具单线深耕与多项目统筹、优先级管理能力；工作时间可配合覆盖平日晚间及周六时段。\n9、工作效率高，具备较强的创业精神与业务推动力，能在快速变化、资源有限的环境下持续创造价值。\n10、熟悉简中互联网内容生态与用户心智；对站群运营、程序化 SEO、AI 辅助内容生产等方向有理解者优先。", "cat": "产品与管理"}, {"id": "392", "title": "ai内容编辑（AI短剧内容）", "salary": "15k-25k", "location": "远程，可国内办公", "jd": "AI短剧内容岗位 JD\n一、岗位职责\n1、负责 AI 短剧内容的选题策划、剧情创作及内容生产。\n2、根据用户需求及市场热点，挖掘高潜力短剧题材，持续产出新选题。\n3、使用 AI 工具完成剧本大纲、人物设定、分集剧情、对白及分镜脚本等内容。\n4、负责 AI 短剧从选题、剧本、素材生成到成片包装的内容流程。\n5、持续研究热门短剧、短视频及 AI 内容趋势，拆解爆款内容的剧情结构和用户吸引点。\n6、根据播放量、点击率、完播率、互动率等数据，对短剧内容进行复盘和优化。\n7、沉淀 AI 短剧提示词、人物设定、剧情模板、素材模板等内容资产，提高团队生产效率。\n8、配合团队完成短剧内容批量生产及账号内容运营。\n\n二、岗位要求\n1、具备短剧、短视频、影视编剧、内容运营、等相关经验。\n2、对短剧内容有较强敏感度，能够快速判断题材是否具有吸引力。\n3、具备较好的剧情创作能力，能够设计人物关系、剧情冲突、悬念及反转。\n4、熟练使用 ChatGPT、Claude、Gemini 等 AI 工具，有较强的 AI 内容生产能力。\n5、了解 AI 图片、AI 视频、AI 配音等内容生成工具。\n6、具备较强的执行力和内容产出能力，能够适应批量化、高频率内容生产。\n7、有较强的学习能力，能够快速掌握新的 AI 工具及内容生产方式。\n\n三、加分项\n1、有 AI 短剧、AI 漫剧、AI 视频相关项目经验。\n2、有短剧编剧、短视频编剧或爆款短视频内容创作经验。\n3、熟悉即梦、可灵、Runway、Veo、海螺等 AI 视频工具。\n4、熟悉 Midjourney、Flux、Stable Diffusion 等 AI 图片工具。\n5、熟悉剪映、Premiere 等视频剪辑工具。\n6、有成熟的 AI Prompt、剧本模板或批量内容生产方法。\n7、有成功爆款案例，能够提供作品或数据证明。\n8、有从 0 到 1 搭建短剧内容项目经验。\n\n四、我们希望你具备\n\n1、内容能力：能够发现题材、设计剧情、制造冲突，知道什么内容能够吸引用户继续看。\n2、AI能力：不只是会使用 AI 聊天工具，而是能够真正将 AI 应用到选题、剧本、画面、配音、剪辑等内容生产环节。\n3、执行能力：能够快速将一个想法落地成完整内容，不拖延、不依赖他人推动。\n4、数据能力：能够通过播放、点击、完播、互动等数据判断内容好坏，并根据数据快速迭代。\n5、创新能力：能够持续尝试新的题材、人物设定、剧情结构和 AI 表现形式。\n6、结果导向：以内容产出效率和实际数据结果为核心，而不是单纯完成任务。", "cat": "内容与创作"}, {"id": "393", "title": "AI内容编辑（AI短剧编剧）", "salary": "12K–15K", "location": "远程，可国内办公", "jd": "AI短剧编剧（AI Screenwriter）\n\n岗位职责\n根据小说开发稿完成影视剧本开发，将小说内容转化为符合短剧及 AI 短剧制作规范的剧本。\n完成剧本结构调整、场次拆分、剧情压缩、节奏优化及对白改编，保证故事适配短剧叙事节奏。\n根据影视表达需求调整人物行为、剧情逻辑及场景设置，提高镜头表现力及拍摄可执行性。\n与导演共同完成故事板开发，参与剧本可视化设计，完成镜头拆解前的剧本优化工作。\n控制单集节奏、信息密度及剧情推进，合理安排高潮、反转、情绪节点及集尾悬念。\n根据导演及制作团队反馈持续优化剧本内容，确保剧本质量满足制作要求。\n\n任职要求\n熟悉影视剧本创作规范，能够独立完成小说向剧本的影视化改编，理解剧本与小说在叙事方式、节奏控制及镜头表达上的差异。\n熟悉场次拆分、戏剧冲突、人物动机、剧情节拍、对白设计及连续剧结构，能够根据镜头语言优化剧情推进及人物行为。\n具备较强的剧本可执行性意识，能够充分考虑场景转换、人物调度、制作成本及 AI 制作特点，提高剧本落地效率。\n能够与导演共同完成故事板开发，根据镜头设计持续调整剧本结构及对白节奏，提高剧本的视觉表达能力。\n有影视剧、动画、短剧、漫画编剧经验，熟悉 AI 内容创作流程者优先。\n\n优先考虑\n有影视编剧经验；\n有短剧剧本创作经验；\n有动画、漫画改编经验；\n熟悉 AI 剧本开发流程；\n熟悉导演工作流程及镜头语言。", "cat": "内容与创作"}, {"id": "394", "title": "AI内容编辑（AI短剧导演）", "salary": "15K–18K", "location": "远程，可国内办公", "jd": "AI短剧导演\n\n岗位职责\n根据剧本完成故事板设计及镜头语言设计；\n与编剧共同进行故事板开发，完成剧本可视化；\n输出故事板、镜头表、机位设计、景别设计及镜头调度方案；\n制定人物调度、演员调度、场面调度及镜头运动方案；\n控制画面节奏、叙事节奏、情绪节奏及视觉重心；\n指导 AI 视频制作完成镜头落地，并进行镜头审核；\n完成精剪，优化节奏、转场、蒙太奇关系及镜头衔接；\n对整集内容的视觉表达及最终成片质量负责。\n\n任职要求\n能够独立完成剧本可视化，根据剧本输出专业故事板、镜头表及导演阐述，并具备完整的镜头设计能力。\n熟悉镜头语言、场面调度、人物调度、景别设计及镜头运动设计，能够合理运用构图法则、轴线原则、连续性剪辑及蒙太奇等影视语言完成视觉叙事。\n具备较强的画面节奏控制能力，能够根据剧情调整镜头节奏、情绪节奏及视觉重心，并完成成片精剪及最终质量把控。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro，具有动画、短剧、影视或 AI 内容导演经验者优先。", "cat": "内容与创作"}, {"id": "395", "title": "AI内容编辑（AI视频制作）", "salary": "15K–18K", "location": "远程，可国内办公", "jd": "AI视频制作（AI Production Artist）\n\n岗位职责\n\n根据导演输出的故事板及镜头表完成 AI 内容生产；\n建立角色一致性（Character Consistency）、场景一致性（Environment Consistency）及数字资产库（Asset Library）；\n完成角色生成、场景生成、图生视频、镜头动画及素材制作；\n搭建并优化 AI 制作工作流，包括提示词工程、参考图控制、节点式工作流及模型调用；\n完成视频粗剪（Rough Cut）、字幕、配音、音效及初版包装；\n配合导演完成修改意见，输出最终交付版本。\n\n任职要求\n熟悉 AI 内容生产流程，能够根据故事板独立完成角色生成、场景生成、图生视频及整集内容制作，并保证角色一致性、场景一致性及整体视觉风格统一。\n熟悉提示词工程、参考图控制、节点式工作流及 AI 工作流搭建，能够根据项目需求优化生成效率及画面质量。\n能够独立完成素材整理、粗剪、字幕、音效、基础包装等后期制作，并具备一定的问题排查及工作流优化能力。\n熟悉 ComfyUI、Flux、Midjourney、Runway、Veo、Kling、Seedance 等 AI 工具中的一种或多种，有完整 AI 短剧、AI 动画或 AI 漫剧制作经验者优先。\n\n熟悉以下 AI 工具（至少部分）\nComfyUI，Flux，Midjourney，Stable Diffusion，Veo，Kling，Seedance，Runway，Pika，Luma\n\n熟练使用Premiere Pro，DaVinci Resolve或其他非线软件", "cat": "内容与创作"}, {"id": "396", "title": "AI内容编辑（AI短剧后期剪辑师）", "salary": "12K–18K", "location": "远程，可国内办公", "jd": "AI短剧后期剪辑师\n\n岗位职责\n负责 AI 漫剧项目的后期制作，根据导演完成的精剪版本进行成片精修，在不改变导演叙事意图的前提下，进一步优化剪辑点、动作衔接、视听连续性及整体完成度；\n负责对白、配音、环境声、拟音、音效及音乐的声音编辑与混音处理，根据剧情节拍建立完整的声音层次、情绪推进及视听节奏；\n负责 AI 生成素材的后期修整，处理生成镜头中常见的跳帧、闪烁、动作断裂、时序不连续、画面抖动及镜头衔接问题，并通过变速、补帧、遮罩、跟踪、合成等方式提高镜头可用性；\n根据项目视觉规范完成基础调色、镜头匹配、曝光及色彩统一，保证不同模型、不同批次生成素材之间的视觉连续性；\n负责字幕、片头片尾、基础动效、转场及项目包装，并按照平台技术规范完成母版输出、版本管理及最终交付；\n与导演共同完成终剪审核，根据修改意见完成后期调整，对成片的技术质量、声音质量及最终包装完成度负责。\n\n任职要求\n具备完整的影视后期制作能力，能够理解导演的剪辑意图和叙事节奏，熟悉连续性剪辑、动作匹配、视线匹配、节奏剪辑、平行蒙太奇、交叉剪辑等剪辑逻辑，能够判断一个剪辑点成立的叙事原因，而不是单纯按照音乐节拍拼接素材。\n具备较强的声音设计意识，能够完成对白编辑、降噪、响度控制、环境声铺设、拟音、音效设计及音乐编辑，并能够利用声音桥、声画对位、声画同步等方式强化场景空间感、情绪及戏剧节奏。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro 中至少一种专业非线性剪辑软件；能够完成基础调色、遮罩、跟踪、变速、关键帧及简单合成。熟悉 After Effects、Fusion、Audition 等后期工具者优先。\n需要理解 AI 生成视频的素材特性，能够识别并处理人物动作连续性、口型同步、画面闪烁、时序一致性、角色漂移、背景形变等常见问题。有 AI 漫剧、动画、短剧、影视后期或商业内容制作经验者优先。\n不接受仅会使用剪映套模板、自动字幕、卡点及预设转场，但缺乏影视剪辑逻辑和声音设计能力的候选人。\n作品要求\n面试需提供至少一部能够体现完整后期能力的作品，并说明本人具体负责的工作范围。\n作品审核重点关注：叙事节奏、剪辑点选择、动作连续性、声音设计、音乐使用、镜头匹配及整体完成度，不以单纯的特效数量或包装复杂程度作为评价标准。", "cat": "内容与创作"}, {"id": "397", "title": "AI内容编辑（网络小说作家）", "salary": "8K–14K", "location": "远程，可国内办公", "jd": "网络小说作家\n\n岗位职责\n负责 AI 短剧项目的前期 IP 内容开发，根据项目方向完成题材调研、内容策划及小说改编工作；\n深度研究网络文学市场，持续分析热门题材、爆款作品及用户阅读偏好，总结不同题材的核心爽点、人物关系、剧情节奏及商业化规律；\n根据项目需求，对指定题材或已有内容进行二次创作、剧情扩写、结构重组及人物深化，形成适合影视开发的小说版本；\n建立完整的世界观设定、人物关系网、人物成长线及剧情主线，保证长线剧情逻辑统一；\n完成剧情节拍设计、情绪推进、反转、悬念、高潮、集尾钩子等商业化内容设计，提高内容吸引力及持续阅读体验；\n输出完整的小说开发稿，包括人物设定、世界观设定、故事简介、章节内容及完整小说版本，并交付编剧进行剧本开发；\n持续建立公司 IP 储备库，沉淀原创故事、人物设定及可持续开发的内容资产。\n\n任职要求\n深度阅读网络文学，熟悉男频、女频、都市、悬疑、玄幻、仙侠、系统、重生、无限流、恋爱、校园等主流题材，能够准确分析作品爆点及商业价值。\n具备成熟的长篇小说创作能力，能够围绕人物成长、剧情推进及情绪节奏完成剧情扩写、人物深化及系列化内容开发，保证故事具有持续吸引力。\n熟悉网络文学创作规律，能够设计爽点、打脸、升级、反转、修罗场、悬念、人物成长及章节留钩，并理解不同平台读者的阅读偏好。\n具有优秀的文字驾驭能力，能够独立完成中长篇小说创作，有签约网络小说作者、责编、内容编辑或成熟创作经验者优先。\n能够熟练使用 AI 辅助创作工具进行资料整理、世界观整理及内容辅助创作，但具备独立完成原创及改编内容开发的能力。\n\n优先考虑\n有签约网络小说作者经历；\n有百万字以上完结作品；\n有短剧、漫画、动漫、游戏剧情创作经验；\n有 IP 改编或影视化开发经验。", "cat": "内容与创作"}, {"id": "398", "title": "AI内容编辑（AI影视资产生成）", "salary": "12K–18K", "location": "远程，可国内办公", "jd": "AI影视资产生成\n\n岗位职责\n负责公司 AI 影视数字资产体系建设，根据项目需求持续开发可重复使用的角色资产、场景资产、道具资产、服装资产、载具资产及环境资产；\n建立统一的数字资产规范，包括角色设定、风格规范、命名规则、版本管理、资产分类及数字资产库维护，保证不同项目之间的资产可复用性及一致性；\n根据导演及制作团队需求完成影视场景搭建、角色开发、服装设计、道具开发及风格设定，为内容制作提供标准化资产支持；\n搭建 AI 资产生产工作流，建立角色一致性、场景一致性、风格一致性及参考图控制方案，提高内容生产效率；\n建立 AI 工作流模板、模型预设、提示词模板及节点式工作流，持续优化数字资产生产效率；\n配合 AI 视频制作团队完成资产调试、问题修复及资产迭代，保证资产在不同模型及不同项目中的稳定调用；\n持续沉淀公司数字资产库，建立可持续迭代的影视资产体系，为后续项目及资产商业化提供基础支持。\n\n任职要求\n\n熟悉影视美术设计流程，具备较强的角色设计、场景设计、服装设计及道具设计能力，能够建立统一的视觉风格及数字资产规范。\n熟悉 AI 数字资产开发流程，能够完成角色一致性、场景一致性、风格统一、参考图控制及数字资产标准化管理，并理解资产复用及模块化开发理念。\n熟悉提示词工程、节点式工作流、模型管理及参考图工作流，能够独立搭建高复用性的 AI 资产生产流程，并持续优化生成效率及资产质量。\n熟悉数字资产管理、版本管理及命名规范，能够建立完整的资产分类体系及数字资产库，具备良好的工程化思维及团队协作能力。\n熟悉 ComfyUI、Stable Diffusion、FLUX、Midjourney 等 AI 图像工具，理解 LoRA、ControlNet、IP Adapter 等一致性控制技术，有 AI 影视、AI 动画、游戏美术或数字资产开发经验者优先。\n\n优先考虑\n有 Technical Artist（TA）、Environment Artist、Character Artist、Concept Artist、Asset Artist 等相关工作经验；\n有游戏、影视、动画、数字孪生或虚拟制作项目经验；\n熟悉 Blender、Maya、Cinema 4D、Unreal Engine、Houdini 等数字内容创作工具；\n有大型数字资产库建设或团队资产管理经验；\n有 AI 工作流开发、模型训练或 LoRA 制作经验。", "cat": "内容与创作"}, {"id": "399", "title": "AI Algorithm Engineer", "salary": "年薪20万美金内", "location": "远程，可国内办公", "jd": "Responsibilities\n\n• Lead research, pre-training, optimization, and iteration of Vision Foundation Models, including Stable Diffusion, DiT, Vision Transformer (ViT), Segment Anything Model (SAM), CLIP, and other cutting-edge computer vision models.\n\n• Design and fine-tune vision models for business scenarios such as AI image generation, image editing, multimodal understanding, and intelligent visual applications.\n\n• Lead Supervised Fine-Tuning (SFT), Parameter-Efficient Fine-Tuning (PEFT), LoRA, ControlNet, Adapter tuning, and related optimization techniques.\n\n• Explore and improve generative model architectures and visual feature extraction networks to enhance image quality, stability, resolution, inference efficiency, and multimodal alignment.\n\n• Collaborate with engineering teams to deploy large-scale AI models into production and optimize inference performance through quantization, pruning, inference acceleration, memory optimization, and deployment tuning.\n\n• Continuously track the latest academic research, open-source projects, and industry trends in Computer Vision (CV), Multimodal AI, and Generative AI, rapidly transforming new technologies into business value.\n\nRequirements\n\nEducation\n• Bachelor's degree or above in Computer Science, Artificial Intelligence, Applied Mathematics, or related fields.\n\nTechnical Skills\n\n• Strong expertise in Vision Foundation Models and a deep understanding of Diffusion Models, Vision Transformers (ViT), MAE, and related architectures.\n\n• Experience participating in or leading the complete pre-training lifecycle of large-scale vision or multimodal models with hundreds of millions (or billions) of parameters.\n\n• Strong understanding of dataset construction, data cleaning, training stability, and large-scale model optimization.\n\n• Hands-on experience with AIGC technologies, including Text-to-Image, Image-to-Image, and multimodal generation.\n\n• Proficient in Python and C++, with strong experience using PyTorch and excellent source code reading and secondary development capabilities.\n\n• Familiar with distributed training frameworks such as DeepSpeed, Megatron-LM, and FSDP, with hands-on experience in multi-node, multi-GPU training and compute resource management.\n\nPreferred Qualifications\n\n• Publications in top-tier AI conferences such as CVPR, ICCV, ECCV, NeurIPS, or ICLR.\n\n• Active contributor to GitHub, Hugging Face, or other open-source AI communities.\n\n• High-ranking achievements in AI competitions such as Kaggle.\n\n• Experience with TensorRT, CUDA programming, and low-level operator optimization.\n\n• Experience with High Performance Computing (HPC) environments.", "cat": "技术开发"}, {"id": "400", "title": "COE 专家（规则与框架方向）", "salary": "面议", "location": "远程，可国内办公", "jd": "▸\t职级与晋升标准　设计和维护公司的职级体系（P、M 两条序列）；制定晋升标准（能力、业绩、行为）；做不同序列之间的对标；设计晋升评估模板和校准流程；定绩效的强制分布规则。\n▸\t绩效框架　设计岗位的绩效框架，让用人部门在框架里出具体方案；绩效和校准有争议时，从规则角度做一次复核。\n▸\t组织诊断　搭组织诊断的方法和标准\n▸\t岗位说明书（JD 库）　统一管理全公司的岗位说明书，按季度更新，新增岗位的说明书审核入库\n▸\t干部任免标准对照　核心岗位任免时，拿职级手册、岗位说明书、能力模型来对照，出一份\"是否合规\"的意见——不负责提名，也不负责任命本身。\n▸\t建立制度标准库：整理优化公司制度文档，进行分类归档，并定期维护更新\n\n任职要求\n一、基本条件\n▸\t本科及以上，5 年以上COE专业方向经验，最好有从零搭体系的经历，而不只是照着流程执行。\n▸\t独立或主导搭过职级体系、绩效框架、岗位说明书库中的至少一项；明白这几块是连在一起的，不能单独拎一块出来做。\n▸\t加分项：游戏 / 互联网 / 数字内容行业背景；做过职级盘点、发现并纠正过定级错误。\n二、最看重的能力（比履历更重要）\n▸\t逻辑清楚　能把规则的口径、边界、例外讲明白；东西交出去之前先自己审一遍，不留自相矛盾的地方。\n▸\t尽量客观、少凭主观　定规则时把人为判断降到最低；能看穿那种\"表面是公式、其实是主观打分\"的设计。\n▸\t独立、拿证据说话　结论都有依据，不靠记忆编数字；不被现成材料或 AI 给的答案带着走，能自己复核、指出错误。\n三、AI 协作与远程\n▸\t熟练使用AI工具\n▸\t远程能自驱　习惯把事情结构化、按时间点交付；书面表达清楚，能异步协作，适应跨时区", "cat": "产品与管理"}];
const CATS = ["内容与创作", "运营与市场", "技术开发", "产品与管理", "职能与行政", "采集与逆向", "安全攻防", "其他"];

const catCounts = {};
JOBS.forEach(j => { catCounts[j.cat] = (catCounts[j.cat]||0) + 1; });

let activeCat = null;
try { activeCat = localStorage.getItem('omi_jobs_cat') || null; } catch(e) {}

const chipRow = document.getElementById('chipRow');
function renderChips(){
  const chips = [{cat:null,label:'全部',n:JOBS.length}].concat(
    CATS.filter(c => catCounts[c]).map(c => ({cat:c,label:c,n:catCounts[c]}))
  );
  chipRow.innerHTML = chips.map(c => `
    <div class="chip ${activeCat===c.cat ? 'active':''}" data-cat="${c.cat ?? ''}">
      ${c.label} <span class="n">${c.n}</span>
    </div>
  `).join('');
  chipRow.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-cat');
      activeCat = v === '' ? null : v;
      try { activeCat ? localStorage.setItem('omi_jobs_cat', activeCat) : localStorage.removeItem('omi_jobs_cat'); } catch(e) {}
      renderChips();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const statsEl = document.getElementById('stats');

function render(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const filtered = JOBS.filter(j => {
    if (activeCat && j.cat !== activeCat) return false;
    if (!q) return true;
    return j.title.toLowerCase().includes(q) || j.jd.toLowerCase().includes(q);
  });

  statsEl.textContent = `显示 ${filtered.length} / ${JOBS.length} 个职位`;

  if (filtered.length === 0){
    list.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  list.innerHTML = filtered.map(j => `
    <div class="card">
      <div class="card-top">
        <span class="card-tag">${escapeHtml(j.cat)}</span>
        <span class="card-id">#${escapeHtml(j.id)}</span>
      </div>
      <h3>${escapeHtml(j.title)}</h3>
      <div class="badge-row">
        ${j.salary ? `<span class="salary">${escapeHtml(j.salary)}</span>` : ''}
        ${j.location ? `<span class="location">📍 ${escapeHtml(j.location)}</span>` : ''}
      </div>
      <div class="jd" id="jd-${j.id}">${escapeHtml(j.jd)}</div>
      <div class="card-actions">
        <button class="toggle-btn" data-id="${j.id}">展开全文 ▾</button>
        <a class="apply-btn" href="https://t.me/y666899y" target="_blank" rel="noopener">投递 / 咨询 ↗</a>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const jd = document.getElementById('jd-' + btn.getAttribute('data-id'));
      const isExpanded = jd.classList.toggle('expanded');
      btn.textContent = isExpanded ? '收起 ▴' : '展开全文 ▾';
    });
  });
}

document.getElementById('searchInput').addEventListener('input', render);

renderChips();
render();
</script>
