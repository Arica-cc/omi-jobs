用，能写规格驱动产出、能有效审查与验证 AI 代码。\n    能独立排查线上问题：看日志、定位根因、评估影响面，不是只会在本地跑通。\n    具备远程工作的自驱力。\n加分项\n    有高并发、百万级以上用户规模的生产系统实战经验。\n    做过第三方支付中台对接（微信 / 支付宝 / USDT / 海外支付渠道等）。\n    懂安全：限流设计、幂等键设计、针对资损场景的对抗性测试思维。\n    做过内容 / 社区类产品（UGC、评论、创作者体系）。\n    有短剧、视频、直播等内容型 App 的后端经验。\n    懂运维：Linux、Docker、AWS，能独立排查生产环境问题。", "cat": "技术 / 数据"}, {"id": "196", "title": "Flutter客户端工程师", "salary": "面议", "location": "具备远程工作的自驱力。", "jd": "岗位职责\n    负责短剧AppFlutter客户端的持续迭代与维护：新功能开发、存量模块改造，自己排查线上崩溃与卡顿问题，不是只写页面。\n    短剧内容体验：剧集播放、断点续播与本地观看历史、下载缓存与离线播放，这是内容流产品区别于电商/社交类App的核心难点。\n    多CDN线路容灾与择优：素材多条线路的测速选线、失败自动回退默认线路、上次最优结果持久化复用，保证弱网环境下的加载体验。\n    统一跳转与深链接：公告、任务、Banner、推送等十几种跳转场景收敛到单一分发入口，保证底部Tab状态与页面状态一致，不出现\"页面已跳转、Tab还停在原处\"这类割裂体验。\n    会员与支付相关前端对接：充值、VIP套餐、权益补偿等碰钱逻辑的客户端联调，容不得重复扣款或状态不同步。\n    社区功能前端：UP主动态、评论、IM私信（自研IM插件）等模块的开发与维护。\n    多环境与发布：flavors多环境配置（黄豆App正式版与免费版两套租户并行）、打包签名、灰度发布、崩溃监控。\n任职要求\n    2 年以上Flutter开发经验，至少一个正式上线App的主力开发经历，不是仅接触过demo或练手项目。\n    熟练掌握GoRouter路由与深链接、Dio网络层（鉴权拦截、自动刷新、错误收口）、本地数据持久化（SQLite/Drift、Hive均可）。\n    有响应式状态管理实战经验（Riverpod / Bloc / GetX / Signals 均可），能快速上手不同技术选型，不绑定单一状态管理框架。\n    理解客户端工程化：flavors多环境配置、打包签名、多渠道上架、灰度发布、崩溃监控（Crashlytics等）。\n    熟练使用 AI 编码工具进行工程开发（硬性要求）：Claude Code、Codex、Cursor 等 Agent 类工具日常主力使用，能写规格驱动产出、能有效审查与验证 AI 代码。\n    能独立排查线上问题：看崩溃日志、定位根因、评估影响面，不是只会在本地跑通。\n    具备远程工作的自驱力。\n加分项\n    做过短剧、长视频、直播等内容流产品，理解长列表性能优化、视频流内存释放、下载缓存等重内容场景的特殊考量。\n    做过IM/即时通讯功能（心跳检测、断线重连、离线消息补拉）。\n    做过微信/支付宝等第三方支付对接，理解支付回调幂等与金额校验。\n    懂一点后端（Go / Java 均可），能读懂接口文档、必要时读一段后端代码辅助联调，不需要会写。\n    做过多CDN/多线路容灾选型的客户端实现。\n    有百万级注册用户规模的生产App实战经验", "cat": "技术 / 数据"}, {"id": "197", "title": "web前端工程师", "salary": "面议", "location": "未明确", "jd": "岗位职责\n    负责站群多主题模板体系：服务端渲染模板的组件化与皮肤化，让同一套结构长出多张不同的脸。\n    对 Core Web Vitals（LCP / CLS / INP）负责：首屏 CSS 拆包、资源哈希与长缓存、图片自适应与懒加载。\n    HTML 语义化与页面结构：标题层级（单一 H1、H2–H6 不跳级）、article / section / nav / main 等语义标签用对、图片 alt、链接可抓取，让爬虫能读懂页面在讲什么。\n    落地结构化数据（JSON-LD）、canonical / hreflang / og、分页与内链结构，直接影响收录与排名。\n    支撑多语言站扩张（繁体及多国语言）：多语言 URL 结构与 hreflang、语言切换、界面文案全量外置、不同语种文案长度差异的布局适配。\n    运营后台迭代（Vue3 + Vite + TypeScript + Element Plus）：内容管理、批量操作、权限菜单、大列表性能。\n    黄豆短剧App Web/PC版的框架重写：用同一套服务端渲染模板体系对标原生App的精品体验，对接新CDN路线、打磨首屏加载与播放体验，这条线和站群模板体系是同一套技术栈的两个落点，不是两摊互不相干的活。\n任职要求\n    2 年以上前端开发经验，至少一个完整项目从 0 到上线的主力经历。\n    不限框架（Vue / React / Svelte / 原生 SSR 模板均可），需具备「SEO 友好渲染」的硬能力——服务端渲染、首屏性能、搜索引擎可抓取的页面结构，这是站群与App Web版共同的底层要求。\n    熟练使用 AI 编码工具（硬性要求），能用 Agent 批量生产模板与组件并保证质量一致。\n    能 1:1 像素级还原 Figma 设计稿，这是我们的硬性交付标准。\n    严格遵守多语言（i18n）架构：界面文案一律走词条不写死，布局能容纳不同语种的长度差异——这是我们的团队红线。\n    懂 SEO 站的前端优化点：HTML 语义化与标题层级、图片 alt 与懒加载对收录的影响、内链与锚文本、rel 属性（nofollow / sponsored / ugc）、noindex 的正确用法。我们靠搜索引擎流量吃饭，模板写法直接决定收录。\n    理解浏览器渲染、缓存与性能指标，能自己定位性能问题。\n加分项\n    有 SEO 站、内容站、站群前端经验，做过收录与排名相关优化并有数据结果。\n    有服务端渲染（任意技术栈）的深度实践。\n    有 Web 端音视频播放（HLS、加密流、自定义播放器）经验。\n    有多主题、多品牌换肤体系的设计与实现经验。\n    做过多语言站或国际化项目，处理过 hreflang、繁简差异、RTL 等问题。\n    熟悉 Node 工程化，能自己写构建脚本与自动化工具。", "cat": "技术 / 数据"}, {"id": "198", "title": "AI短剧编剧", "salary": "12k-25", "location": "未明确", "jd": "岗位职责\n负责 AI成人向剧情短剧的选题策划、人物设定、故事大纲及分集剧本创作，结合AI制作特点设计可落地的剧情，与制作团队配合，保证故事吸引力、叙事节奏和交付效率。\n岗位要求\n1：有短剧、影视、网文或漫画等相关创作履历，面试需提供剧本或已上线作品；\n2：了解成人向题材的受众偏好，擅长人物关系、情绪张力、剧情冲突及悬念设计；\n3：熟悉短剧叙事结构，能把控开篇吸引力、分集节奏、剧情转折和集尾钩子；\n4：具备画面化写作能力，能清晰描述场景、动作与情绪，合理控制人物数量和制作复杂度；\n5：能独立完成选题、大纲及分集剧本，并根据制作反馈和上线表现调整内容；\n6：具备良好的沟通能力、责任心及团队配合意识，能够按排期稳定交稿。\n加分项：\n有已上线短剧、成熟连载作品、爆款内容或AI短剧编剧经验者优先。", "cat": "AI / AIGC"}, {"id": "199", "title": "短视频运营", "salary": "10k-25k", "location": "未明确", "jd": "岗位职责\n 1. 账号运营与内容策划\n • 负责公司短视频账号（抖音/视频号/小红书/快手等）的整体运营，制定内容方向与发布策略。\n • 结合产品定位与热点趋势，策划选题、撰写脚本，产出有传播力的短视频内容。\n • 把控账号人设、内容调性及更新节奏，持续提升账号粉丝量与活跃度。\n 2. 内容制作与统筹\n • 统筹短视频从选题、脚本、拍摄到剪辑、发布的全流程，协调内外部资源。\n • 对接拍摄、剪辑、出镜等相关人员，确保内容按时保质产出。\n • 参与或指导视频剪辑，保证成片质量符合平台调性与传播要求。\n 3. 数据复盘与优化\n • 跟踪播放量、完播率、互动率、涨粉数、转化率等核心数据，定期输出复盘报告。\n • 根据数据反馈调整内容策略，持续优化选题方向与运营动作。\n • 关注平台算法与规则变化，及时调整运营打法。\n 4. 流量增长与转化\n • 研究平台推荐机制与流量玩法，通过内容优化、话题运营、投放配合等方式实现账号增长。\n • 配合直播、私域等业务，完成从内容曝光到用户转化的链路打通。\n • 探索矩阵账号运营，扩大品牌内容覆盖面。\n\n任职要求\n 5. 大专及以上学历，1-3年短视频运营相关经验，有成功账号案例者优先。\n 6. 熟悉抖音、视频号、小红书、快手等主流平台的运营规则与流量逻辑。\n 7. 具备较强的内容策划与脚本撰写能力，网感好，对热点敏感。\n 8. 了解短视频拍摄与剪辑流程，能使用剪映/Pr等工具者优先。\n 9. 具备数据分析能力，能通过数据驱动内容优化。\n 10. 责任心强，执行力好，具备良好的沟通协调能力与团队协作意识。\n 11. 有较强的抗压能力，能适应短视频行业快节奏的工作状态。\n加分项\n • 有从0到1起号经验，或单条爆款视频操盘经验。\n • 有直播运营、电商、私域转化相关经验。\n • 熟悉信息流投放（千川/巨量引擎等），具备内容+投放联动经验。\n • 有特定垂直领域（如成人行业等）运营经验。", "cat": "内容"}, {"id": "201", "title": "AIGC编剧制作师", "salary": "12–25K", "location": "未明确", "jd": "岗位职责\n1. 根据项目定位完成 AI 短剧、AI 漫剧和短视频内容的选题策划、故事构思及剧本创作。\n2. 独立完成故事梗概、主题设定、人物小传、人物关系、分集大纲和分集剧本。\n3. 负责剧本正文、对白、旁白、动作描写、场景描写和情绪表达的撰写与修改。\n4. 根据短视频和短剧传播特点设计开篇钩子、核心冲突、剧情反转、情绪节点和集尾卡点。\n5. 将完整故事拆分为适合 AIGC 制作的场景、镜头、人物动作、表情、对白和画面要求。\n6. 根据项目需要完成分镜脚本，明确镜号、场景、景别、画面内容、人物动作、台词、时长及转场要求。\n7. 使用 ChatGPT、Claude、DeepSeek、豆包等 AI 工具辅助进行选题分析、资料整理、剧情设计和文本修改。\n8. 根据 AI 生成效果与美术、导演、后期团队沟通，及时调整剧本、对白、镜头和制作方案。\n9. 负责已有剧本的结构优化、节奏调整、对白润色、逻辑修正和内容完善。\n10. 负责纯绿色、健康合规内容的策划与剧本制作，确保内容符合平台规范。\n11. 跟进作品播放、点赞、收藏、完播和涨粉等数据，根据用户反馈优化选题和剧情方向。\n12. 持续沉淀题材库、人物库、剧情模板、剧本模板、分镜模板和标准化编剧流程。\n岗位要求\n1. 具备扎实的剧本创作能力，能够独立完成从选题、大纲到分集剧本的完整创作。\n2. 熟悉短剧、漫剧、短视频、网文或影视内容的叙事结构和创作方法。\n3. 具备较强的故事构建、人物塑造、人物关系设计、对白设计和情节推进能力。\n4. 熟悉短视频内容节奏，能够设计开篇吸引力、冲突升级、情绪递进和结尾悬念。\n5. 能够将文字剧本拆分为清晰、具体、可执行的分镜脚本。\n6. 具备较好的画面感，能够准确描述场景、人物动作、表情、镜头和视觉重点。\n7. 能够使用 AI 工具辅助完成资料整理、情节推演、文本改写和剧本润色，但具备独立判断和修改能力。\n8. 具备较强的内容敏感度、原创意识和合规意识，能够独立完成纯绿色内容创作。\n9. 具备良好的沟通能力、执行能力和团队协作意识，能够适应批量化内容生产。\n10. 能够按时交付大纲、分集梗概、剧本初稿、修改稿和分镜脚本。\n加分项\n- 有短剧、漫剧、网文、动画、影视编剧或短视频编剧经验。\n- 有成熟剧本案例、上线作品或完整项目作品集。\n- 有 AI 短剧、AI 漫剧或 AIGC 内容生产经验。\n- 熟悉竖屏短剧、系列化 IP、角色 IP 或绿色内容渠道的创作特点。\n- 具备一定的分镜、导演或影视后期基础。\n内容方向：纯绿色、健康合规内容板块", "cat": "AI / AIGC"}, {"id": "202", "title": "中级运营（UGC社区方向）", "salary": "12k-15k", "location": "未明确", "jd": "岗位职责： 负责UGC社区产品的日常运营工作，独立完成内容生态建设、用户互动引导、话题策划与活动执行。\n制定并落地社区内容策略，包括内容分类、标签体系、优质内容挖掘与推荐机制优化，提升用户发帖质量和活跃度。\n监控社区核心数据（发帖量、互动率、留存、内容消费等），分析用户行为与内容表现，持续优化运营策略。\n搭建并维护创作者/用户运营体系，包括新手引导、成长激励、优质用户维护及违规内容治理。\n协同产品、技术团队，推动UGC相关功能迭代与体验优化，确保运营需求落地。", "cat": "运营"}, {"id": "203", "title": "产品经理", "salary": "20k-30k", "location": "未明确", "jd": "岗位职责：\n负责视频内容产品规划与迭代\n负责公司视频内容类产品的整体规划、功能设计和持续优化，覆盖短视频、长视频、直播、内容社区、创作者体系、内容运营后台等相关方向。能够结合业务目标、用户需求、竞品情况和数据表现，制定清晰的产品路线图和阶段性目标。\n优化视频内容消费体验\n围绕视频播放、推荐流、详情页、搜索、评论、点赞、收藏、分享、关注、举报反馈等核心链路，持续提升用户体验和产品效率。重点关注播放量、完播率、人均观看时长、互动率、留存率等核心指标。\n推动内容生态建设\n参与内容生产、审核、分发、消费、沉淀的完整链路设计，推动内容标签、内容分层、优质内容识别、低质内容治理、创作者激励等机制建设，提升平台内容供给质量和内容分发效率。\n数据驱动产品增长\n建立和完善视频内容产品的数据指标体系，通过数据分析发现问题、验证假设、制定优化方案。能够独立完成需求效果复盘、漏斗分析、用户分层分析、AB 实验方案设计，并推动产品持续增长。\n跨团队项目推进\n负责重点项目从需求调研、方案设计、PRD 编写、评审推进、研发跟进、测试验收、上线发布到数据复盘的完整闭环。协调研发、设计、算法、运营、审核、数据、市场等团队资源，保障项目高质量交付。\n负责产品团队管理\n负责产品团队的目标拆解、任务分配、过程跟进和质量把控，能够指导团队成员提升需求分析、产品设计、数据分析、项目推进和业务理解能力，推动团队形成规范化、高效率的产品工作机制。\n\n岗位要求：\n本科及以上学历，5 年以上互联网产品经验，其中至少 2 年视频内容、短视频、直播、内容社区、信息流推荐或内容平台相关经验。\n视频内容产品能力\n熟悉视频内容产品核心链路，理解内容生产、内容审核、推荐分发、播放互动、内容运营、创作者体系等模块的产品设计逻辑。对短视频、直播、社区内容、UGC/PGC 内容生态有较深入理解。\n数据分析能力\n具备较强的数据意识和指标拆解能力，熟悉播放量、曝光点击率、完播率、互动率、关注转化率、留存率、内容供给量、优质内容占比等常见指标，能够通过数据定位问题并推动优化。\n项目推进能力\n具备复杂项目管理经验，能够在多部门协作场景下明确目标、拆解任务、推动执行、识别风险，并保证项目按计划落地。具备较强的沟通协调能力和问题解决能力。\n团队管理能力\n具备 2 年以上产品团队管理经验，有管理 3 人及以上产品团队经验优先。能够进行团队目标管理、过程管理、人才培养和结果复盘，带领团队持续交付高质量产品成果。\n加分项\n\n有短视频平台、直播平台、内容社区、影视内容平台、在线教育视频、新闻资讯视频化产品经验者优先。\n\n有推荐系统、内容标签、内容审核、创作者平台、内容商业化、会员付费、广告变现等相关经验者优先。\n\n有 AI 视频生成、智能剪辑、视频理解、智能审核、AIGC 内容生产工具相关经验者优先。\n\n熟悉 SQL、埋点体系、AB 实验、BI 数据看板、用户增长模型者优先。\"\n\n其他要求：数据分析", "cat": "产品"}, {"id": "204", "title": "前端工程师（资深+Flutter / Web · 视频播放方向）", "salary": "40k-50k", "location": "未明确", "jd": "岗位职责：\n主导 Flutter 与 Web 端视频播放体系的架构设计与演进，负责播放器选型、封装及跨端统一方案（iOS / Android / H5 / PWA）。\n负责短视频及短剧播放体验的整体优化：首帧耗时、起播成功率、卡顿率、切集与滑动切换流畅度、预加载与缓存策略。\n深入 HLS 播放全链路，包括 m3u8 解析、AES-128 加密播放、多码率自适应、多线路切换与容灾，解决黑屏、白屏、音画不同步、内存泄漏等疑难问题。\n建立播放质量监控与数据指标体系（首帧、卡顿、失败率、缓存命中率），通过数据驱动优化，并验证效果。\n推动前端架构升级、模块化与组件复用，制定技术规范，指导团队成员，把控核心代码质量。\n\n任职要求：\n10 年及以上前端经验，其中 3 年以上视频播放相关开发经验，有 Flutter 与 Web 双端大型项目落地经验。\n精通 Dart / Flutter，深入理解渲染机制、Platform View / Texture、状态管理及 isolate 等异步机制；熟悉 video_player、media_kit、ExoPlayer、AVPlayer 等至少一种播放方案的原理与定制。\n精通 JavaScript / TypeScript 及 Vue 或 React；深入掌握 hls.js、MSE / ManagedMediaSource、Video.js 等 Web 播放技术，熟悉 iOS Safari 原生 HLS 的兼容差异。\n深入理解 HLS 协议、TS / fMP4 分片、H.264 / H.265 编码、DRM 或 AES 加密播放机制，以及 CDN 分发与缓存原理。\n熟练使用 Flutter DevTools、Chrome DevTools、Charles 等工具，能够独立定位播放与性能瓶颈，制定并落地优化方案。\n有架构设计或大型重构经验，能结合业务规模、交付周期和团队成本做技术取舍，具备技术带教能力。\n\n加分项：\n有短视频、短剧、长视频平台播放器从 0 到 1 或深度优化的经验。\n做过播放器池化、预加载、分片缓存、弱网优化、多线路择优等方案，并有可量化的优化成果。\n有 Flutter Web、PWA 或 WebView 播放场景的性能治理经验。\n\n面试要求：需分享一个亲自主导的播放器优化或架构改造案例，说明问题背景、方案、关键取舍及优化前后的数据对比。", "cat": "技术 / 数据"}, {"id": "205", "title": "中级运营（运营专员）", "salary": "15-25k", "location": "未明确", "jd": "岗位职责：\n1、负责短剧产品日常运营，包括内容上架排期、推荐位配置、会员及金币等付费配置核对，保障线上状态正常，杜绝价格错配、整部免费类事故；\n2、负责核心数据日常跟踪与分析（新增、日活、付费转化、充值、次日留存），输出日报周报，对异常波动及时定位原因并推动解决；\n3、策划执行拉新、促活、付费类活动，负责定价与玩法的A/B测试，从方案、上线到复盘全流程跟进，对转化效果负责；\n4、负责渠道新增质量核对，按渠道拆分留存与付费数据，识别低质流量；\n5、收集整理用户反馈与评论区问题，形成需求提交产品研发，跟进排期、上线与验收；\n6、与内容、投放、设计、技术多团队协作，推动项目按节点落地。\n\n任职要求：\n1、本科及以上学历，1至3年产品运营或内容运营经验，有短剧、网文、长视频、直播等内容付费行业经验者优先；\n2、熟练使用AI工具（必须项），能独立用AI完成数据整理、方案撰写、复盘输出，面试会实际考察；\n3、数据能力扎实，熟练使用Excel，理解转化率、留存、ARPU等常用指标口径，分析有逻辑、结论清晰；\n4、沟通执行力强，响应及时，交付前有自查习惯，适应快节奏迭代；\n5、有责任心和结果意识，能独立承担一条业务线的运营指标。\n\n加分项：\n懂SEO，有网站收录、关键词优化或站群运营经验；会基础SQL；有出海产品经验；做过渠道归因或投放协同；有从0到1搭建运营体系的经验", "cat": "运营"}, {"id": "206", "title": "国内新媒体运营", "salary": "15k-20k", "location": "未明确", "jd": "岗位职责：\n1. 负责国内主流媒体平台整体运营规划，包括但不限于小红书、抖音、视频号、微博、公众号等平台；\n2. 根据业务发展方向制定平台运营策略、账号矩阵规划及阶段性增长目标；\n3. 深度研究各平台流量机制、推荐逻辑及内容生态，结合平台规则持续优化运营策略；\n4. 负责内容运营体系搭建，包括选题策划、内容方向、用户增长、互动运营及传播转化；\n5. 独立推进账号从0-1孵化及成熟账号增长，对账号数据结果负责；\n6. 定期分析平台数据及竞品动态，输出运营复盘及优化方案；\n7. 协调内容、设计、商务及技术等团队资源，推进项目执行及活动落地；\n8. 建立账号运营标准及管理机制，降低平台风险，保障账号稳定运营。\n\n任职要求：\n1. 大专及以上学历，3年以上国内主流媒体平台运营经验；\n2. 熟悉小红书、抖音、视频号等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知；\n3. 具备成熟账号操盘经验，有成功案例或账号增长成果优先；\n4. 具备较强的数据分析及运营复盘能力，能够通过数据驱动内容及运营优化；\n5. 具备较强的项目推进及统筹能力，能够独立负责平台整体运营工作；\n6. 对热点趋势、内容传播及用户心理有较高敏感度；\n7. 具备团队协作及基础管理能力，有运营团队管理经验优先；\n8. 有AI内容、互联网科技类项目运营经验者优先。\n\n加分项：\n1. 有百万级曝光或成熟账号矩阵运营经验；\n2. 熟悉短视频内容运营及投流逻辑；\n3. 有品牌营销、活动运营或商业化增长经验；\n4. 具备基础视频剪辑、内容策划或达人合作经验。", "cat": "运营"}, {"id": "207", "title": "中高级运营专员（创作者社区运营）", "salary": "15–25k", "location": "未明确", "jd": "一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕创作者运营、用户运营、内容运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责创作者运营管理，推动创作者引入、分层、激励、活跃维护及产出提升，保障内容持续供给；\n5. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n6. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n7. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进；\n8. 根据业务发展需要，参与活动运营、专题策划、转化路径优化及其他与产品增长相关的专项工作。\n\n二、任职要求\n1. 3年以上互联网运营经验，社区运营、用户运营、内容运营方向优先；\n2. 具备完整项目运营经验，能够独立负责从目标制定、策略拆解、执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有0-1项目搭建经验、复杂业务增长经验、多平台运营经验者优先；\n8. 有团队管理或带教经验者优先；\n9. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "运营"}, {"id": "208", "title": "海外新媒体运营", "salary": "15k-20k", "location": "未明确", "jd": "简历筛选要点：优先考虑具备 Twitter（X）、Telegram、Facebook 等海外社媒运营经验，有内容矩阵搭建、用户增长、爆款内容打造经验者；电商背景暂不考虑，同时重点关注候选人对 ChatGPT、Claude、Gemini、AI Agent 等AI工具的使用经验、学习兴趣及实际应用能力。\n\n岗位职责\n1. 结合业务与用户需求，制定整体内容策略（定位、调性、矩阵），规划各阶段选题方向，并搭建可持续生产的内容体系；\n2. 能独立撰写内容，完成相关平台账号（海外平台为主）的运营，确保内容质量与账号安全；\n3. 建立全渠道分发矩阵，制定差异化运营策略，并联动内外部资源（如换量、付费推广）放大内容影响力；\n4. 通过数据分析（打开率、转化率等）反推内容优化，利用内容手段提升拉新、激活、留存等核心指标，并建立用户画像与标签体系；\n5. 关注行业热点及AI发展趋势，探索并运用AI工具提升内容生产及运营效率。\n\n任职要求\n1. 本科及以上学历，3-5年以上内容运营经验，有成功案例优先；\n2. 熟悉国内外社媒及平台规则，尤其是 Twitter（X）、Telegram、Facebook 等平台运营经验丰富者优先；\n3. 具有良好的网感，对内容传播及热点趋势具备较强敏感度，并有独立的内容见解；\n4. 具备成熟的用户洞察能力，能够以业务增长为导向，产出高传播性内容；\n5. 对AI工具有浓厚兴趣，熟悉 ChatGPT、Claude、Gemini 等主流大模型产品，有实际使用经验优先；\n6. 关注 AI Agent、自动化工作流等发展趋势，具备持续学习和应用新工具解决运营问题的能力。\n\n加分项\n* 有从0到1搭建内容体系、账号矩阵或爆款内容打造经验；\n* 有成人娱乐、泛娱乐、海外流量等相关行业经验；\n* 有AI辅助内容创作、数据分析、账号运营或自动化工作流搭建经验；\n* 熟悉AI Agent产品或有相关实践案例。", "cat": "运营"}, {"id": "209", "title": "高级产品经理", "salary": "20k-25k", "location": "未明确", "jd": "岗位JD：\n一、岗位职责\n负责视频、漫画、小说、短剧等业务的产品规划与交付，连接用户体验、内容生态与商业增长；在复杂协作环境中将业务目标转化为可落地的产品成果，并通过 AI 提升产品全链路效率与质量。\n\n1.制定产品战略、产品路线图及需求优先级，覆盖用户端、创作者端及运营后台，推动从用户研究、方案设计、研发上线到数据复盘的完整闭环。\n2.持续优化视频播放、漫画/小说阅读、短剧观看及社区互动体验，关注内容发现、推荐分发、性能稳定性、跨端一致性及用户留存。\n3.设计粉丝经济与商业化体系，包括会员订阅、内容付费、虚拟商品、打赏、广告、及创作者激励等，兼顾收入增长、用户体验、创作者收益与平台生态。\n4.建立核心指标及实验机制，对活跃、留存、内容消费、付费转化、和内容供给等指标负责，通过数据发现问题并持续迭代。\n5.统筹产品、研发、设计、测试、数据、内容、运营、等资源，明确项目范围、里程碑、依赖、风险及验收标准；能在资源受限、目标变化时快速决策并保障交付。\n6.主导 AI 在用户研究、数据分析、PRD/原型、测试及运营工作流中的应用；建立效果评测、人机协作、成本、安全等机制，沉淀可复用能力。\n7. 拥有成人行业经验，若其他方面特别优秀，无成人行业经验可放宽限制 \n备注：\n1.请候选人投递简历时准备不少于1个经脱敏的代表案例，形式不限，可为PRD、HTML、原型、数据看板或编排好的工作流；至少包含1个内容/商业化项目或1个AI赋能项目。\n2.面试作业考察。候选人需在面试结束后，根据面试官提供的任务要求，在指定时间内完成并提交一个作业。\n\n二、任职要求\n1.6年以上互联网产品经验，具备复杂产品主导经验及可量化业绩，拥有从0→1及规模化迭代案例。\n2.具备视频、漫画、小说、短剧等内容产品经验，至少两个方向有实际项目经历，其中一个方向达到核心负责人深度。\n3.熟悉内容平台、创作者生态、社区运营、内容分发及粉丝商业化，能够平衡用户价值、内容供给与商业目标。\n4.具备项目管理视角、强执行力和主人翁意识，能够拆解模糊目标、协调多团队、处理冲突并对最终结果负责。\n5.具备良好的商业判断、数据分析、用户洞察和技术理解；有推荐系统、付费转化、广告体系等经验者优先。\n6.有 AI 协作经验 或 AI 工作流的真实落地成果，能够说明场景选择、方案边界、上线指标、投入成本及业务价值。", "cat": "产品"}, {"id": "210", "title": "中高级产品运营", "salary": "15K-25K", "location": "未明确", "jd": "一、岗位职责：\n1.负责产品的整体运营策略制定与落地，对日活、用户时长、留存率等核心指标负责。\n2.负责制定并执行用户增长策略，搭建完善增长体系及精细化运营体系，维护健康的产品生态。\n3.主导内容生态搭建，提升内容消费效率与用户互动率；负责社区氛围营造，提升用户粘性与归属感。\n4.建立完善的运营数据监控体系，通过数据优化运营策略。\n5.关注行业动态与竞品策略，推动运营模式与活动形式的创新。\n\n二、任职要求：\n1.本科及以上，3-5 年 +视频 / 短剧/社交APP 运营经验。\n2.精通运营全流程（增长 / 内容 / 社区 / 活动/数据 / 商业化），能够独立制定并落地完整的运营策略。\n3.能够熟练使用数据分析工具，从数据中发现问题、解决问题。\n4.社交 / 视频赛道深度理解，结果导向，抗压能力强。", "cat": "运营"}, {"id": "211", "title": "AI视频剪辑师（短剧/影视二创）", "salary": "10k-15k", "location": "随着短剧及视频平台业务持续增长，影视二创、AI魔改内容需求不断增加，现有团队产能不足，为提升内容生产效率、质量及规模化交付能力，申请增补该岗位", "jd": "负责短剧、电影、网剧等影视素材的AI辅助二创、剧情重组及内容魔改，结合剪辑能力与AI工具产出具备传播力的长、短视频内容。\n\n一、岗位职责\n\n1. 完成影视素材筛选、剧情拆解、混剪、魔改及剧情重组；\n2. 提炼高潮、冲突、反转等关键内容，优化短视频节奏和叙事效果；\n3. 使用AI工具完成风格化、换脸、换装、场景替换、画质增强、补帧、字幕等处理；\n4. 根据运营需求及热点方向快速制作影视二创及不同平台适配版本；\n5. 独立完成选题、素材处理、AI制作、剪辑包装到最终成片；\n6. 沉淀素材库、模板、AI工作流及二创SOP，提高批量生产效率；\n7. 根据播放、完播、互动等数据持续优化内容。\n\n二、任职要求\n\n1. 有视频剪辑经验，有短剧二创、影视混剪、电影解说、剧情魔改经验优先；\n2. 熟练使用PR、AE、剪映等工具，具备良好的剪辑节奏、调色、字幕及特效能力；\n3. 有AI视频实操经验，熟悉AI图像、AI视频、FaceSwap、AI配音等相关工具；\n4. 理解影视叙事、镜头语言及短视频传播逻辑，具备内容审美和爆款意识；\n5. 执行力强、出片速度快，能够适应多任务并行；\n6. 有AI工作流、批量生产、模板或SOP搭建经验优先。\n\n三、作品要求\n面试需提供2—3个影视二创、短剧剪辑或AI视频代表作品，并能够说明个人负责内容、AI工具使用方式及制作思路。有播放、完播、互动等实际数据案例优先。\n\n四、岗位核心交付\n能够独立完成影视二创项目，并逐步建立稳定的内容产能及标准化AI二创生产流程。", "cat": "AI / AIGC"}, {"id": "212", "title": "中高级平面设计", "salary": "10k-18k", "location": "未明确", "jd": "一、岗位职责：\n\n1.主要负责各类成人向产品的视频封面设计，包括批量封面制作、视觉优化及不同题材风格适配；\n2.根据产品定位、内容特点及运营需求，持续优化封面的构图、人物处理、字体、色彩及视觉吸引力；\n3.负责其他日常及临时性平面设计需求，包括静态/动态宣传图、落地页、活动海报、引流图等；\n4.配合运营及相关业务部门完成设计调整、版本迭代及多尺寸适配，保障需求按时交付；\n5.结合AI设计工具及相关工作流提升素材处理、批量制作及设计效率。\n\n二、任职要求\n\n1. 有成人、影视、短视频或内容平台相关行业经验，具备视频封面、影视海报、人物类宣传视觉等相关项目经验者优先；\n2. 具备较强的视觉审美、构图、排版、色彩、字体及人物处理能力，能够独立完成不同风格的平面视觉设计；\n3. 熟悉主流AI图像生成及辅助设计工具，能够结合AI完成人物、场景、素材生成、高清修复、背景替换、风格调整及批量处理；\n4. 具备AI素材二次设计与精修能力，不依赖单纯生成结果，能够完成合成、细节修正及商业化视觉落地；\n5. 能够适应批量封面、多项目并行及临时加急需求，在保证设计质量的同时兼顾交付效率；\n6. 具备较强的学习能力和设计敏感度，能够主动关注并尝试新的AI工具、模型及设计工作流；\n7. 具备良好的沟通与需求理解能力，能够根据产品定位、内容题材及运营反馈快速完成设计调整与优化。\n\n三、作品要求\n\n1. 展示个人以往较优秀且具有代表性的平面设计作品，至少包含2类及以上，如：视频封面、影视海报、人物类宣传图、活动视觉、字体设计等；\n2. 作品集中需包含一定数量的人物类及封面类设计作品，能够体现构图、人物处理、排版、字体、色彩及视觉氛围塑造能力；\n3. 如有使用AI工具完成的设计项目，需展示AI生成素材 + 后期设计/精修后的最终成品；\n4. 有批量封面、系列化视觉或多风格设计案例者优先展示；\n5. 可提供 PDF、图片整理文件或在线作品集链接，作品需清晰标注个人实际参与及负责内容。", "cat": "设计"}, {"id": "213", "title": "AI视频内容工程师（AI短剧/AIGC）", "salary": "15k-20k", "location": "当前AI内容团队是现阶段主要生产单元。随着剧本组同步补齐、项目数量增加以及后续多项目并行，需要提前扩大一线视频生成产能，避免上游剧本和美术资产形成后出现生成端拥堵。现申请立即招聘10名AI视频生成制作人员，通过统一培训、真实项目带教和生产账号数据考核快速形成新增产能，并根据一次通过率、合格镜头率、人均合格分钟及算力效率持续优化人员结构。\n岗位JD描述\n负责AI短剧镜头生成，根据锁定剧本、角色资产、场景设定及分镜要求完成AI视频画面制作，保证人物与场景一致性、动作和镜头逻辑基本自然，按审核反馈完成返工，并对合格产出、一次通过率及算力使用效率负责。", "jd": "\"一、岗位职责\n1、根据剧本、角色资产、场景设定及分镜要求完成AI视频镜头生成。\n2、控制人物脸型、服饰、发型、场景、道具及整体视觉风格的一致性。\n3、处理人物漂移、肢体异常、动作不自然、场景跳变、构图失衡等常见AI生成问题。\n4、根据镜头审核结果完成修改和重新生成，确保不合格镜头不流入后续剪辑。\n5、合理控制生成次数、废片率及算力消耗，提高单位算力的有效产出。\n6、按项目规范整理、命名、提交和归档合格镜头素材。\n7、持续学习团队指定的AI图片、AI视频、提示词及工作流工具，并参与新模型和新流程测试。\n8、使用个人生产账号记录产量、合格镜头、一次通过率、返工和算力使用等生产数据。\n二、任职要求\n1、具备基本电脑操作能力和基础视觉审美，学习能力强，能够快速掌握AI视频工具和工作流。\n2、不强制要求AI视频从业经验；有AI视频、AI绘图、ComfyUI、剪辑或后期经验者优先。\n3、能够长时间处理镜头细节、重复调试及质量优化，具备耐心和执行力。\n4、愿意接受标准化生产流程、统一质量标准及数据化绩效考核。\n5、能够根据审核反馈快速定位问题并完成返工，不以“生成出来”为交付标准。\n6、具备基础的镜头、构图、色彩、人物一致性判断能力者优先。\n7、接受新人培训及带教安排，目标为30天内进入正式生产账号，并逐步达到岗位产能和一次通过率标准。\n加分项\n有AI剧集批量生产、LoRA训练、ComfyUI工作流搭建、Python/API、模型部署或自动化生产经验优先。\n三、作品要求\n面试需提供2—3个AI短剧、动态漫剧或其他AIGC视频代表作品，并能够说明剧本、分镜、角色、模型、工作流及最终成片过程。有角色一致性、多镜头连续剧情或批量生产案例优先。\n四、岗位核心交付\n能够独立完成AI视频内容从剧本到成片的生产，并逐步沉淀角色体系、提示词体系、ComfyUI工作流及生产SOP，支撑AI内容规模化生产。\n五、额外备注\n本岗位接受（学徒）候选人。入职后提供统一培训和项目带教，重点考察学习能力、执行力、耐心和基础审美；愿意从基础镜头生成、质量优化及返工流程学起即可。", "cat": "AI / AIGC"}, {"id": "214", "title": "AI成人短剧编剧", "salary": "15k-20k", "location": "目前AI内容团队暂无专职成人向编剧。成人短剧的选题策划、欲望线设计、剧情创作及分集开发主要由制作人员兼顾，已无法满足后续多项目并行和规模化生产需求。\n成人短剧对开场刺激、人物关系张力、尺度节奏、合规边界和可生产性的要求显著高于一般剧情短剧；兼职创作容易出现：开场无力、欲望线断裂、尺度忽高忽低、人物脸谱化、场景/动作不可制作、以及触及平台禁区后整集作废。\n现申请招聘2名AI成人短剧编剧，建立稳定的内部成人剧本供给能力和可持续更新的可生产剧本储备；同时保留版权采购作为补充来源，保证项目不断档。", "jd": "岗位JD描述\n负责AI成人短剧选题策划、欲望线与人物关系设计、剧本创作及分集内容开发。结合AI视频制作特点，创作具备强开场、强欲望、强冲突、强情绪、持续钩子和可生产性的18+短剧剧本，并在平台合规边界内控制尺度；根据审核意见及上线数据持续迭代内容。\n一、岗位职责\n1、负责AI成人短剧选题策划、故事构思、人物设定（须全员明确18岁以上）、欲望线设计、剧情结构及分集剧本创作。\n2、设计开场钩子、核心欲望冲突、情绪/情欲爆点、关系反转及集尾悬念，提高内容吸引力、完播率和续看动力。\n3、根据AI视频生产特点合理控制人物数量、场景数量、服装造型、复杂动作、多人同框及制作难度，提升剧本可生产性；情欲场面需可分镜、可生成、可过审。\n4、在公司内容红线与各分发平台规则内规划尺度档位，避免未成年及人兽相关的违禁题材及其他不可上线内容。\n5、根据剧本审核意见完成修改、版本迭代及剧本锁定；对审核打回的尺度、人设、节奏问题快速返修。\n6、配合主管、美术、分镜及视频生成团队处理制作过程中出现的剧情、尺度执行和镜头可生成问题。\n7、持续储备新题材、新故事及可系列化内容（都市外围、重逢交易、权力关系、职场禁忌、古风权谋情欲、恶搞成人向等），维护团队成人剧本库和可生产剧本储备。\n8、使用AI辅助写作工具提升资料整理、创意拓展、分集扩写和剧本迭代效率；对模型拒写、安全过滤导致的改写需求能独立给出可生产替代方案。\n9、结合首轮上线数据复盘开场、尺度节奏、完播、续看、付费转化等表现，为后续剧本优化提供依据。\n二、任职要求\n1、具备较强的故事创作、剧情结构设计、人物塑造和文字表达能力；能写清楚人物动机、关系张力与情欲推进，而不是堆砌露骨描写。\n2、熟悉或长期关注成人短剧、言情/都市情色网文、影视限制级内容、漫画、剧本杀或剧情类短视频；对「先欲后情 / 先情后欲」两类结构有基本判断。\n3、能够理解并运用强开场、强欲望、强冲突、强情绪、连续钩子等短剧创作逻辑；懂得把情欲场面当作戏剧节拍，而不是独立黄段。\n4、接受AI辅助创作及标准化剧本生产流程，愿意根据审核意见快速修改；能接受公司对尺度、人设、台词的统一规范。\n5、网文作者（言情/都市/情色向）、短剧编剧、剧本杀作者、内容编辑、影视策划及优秀写作爱好者优先；有成人向连载或付费内容经验者优先。\n6、不要求必须具备AI视频制作经验，但需要理解「可制作性」并主动学习AI生产限制（人物一致性、场景复用、动作复杂度、服装遮挡、敏感词与模型拒图等）。\n7、具备基本合规意识：所有角色必须成年；不写、不美化涉及未成年人的任何性内容；能区分违法、违禁题材。\n8、接受以剧本采纳率、可生产率、返修情况、审核通过率及后续上线表现（完播、续看、付费）作为重要评价依据。\n9、对成人题材无道德洁癖，能稳定产出，不因个人尺度不适中途拒写已立项方案。\n三、加分项（非必须）\n1、能独立完成人物小传、关系图、分集大纲、分集剧本、分镜提示词（静帧描述+运动）中的两项以上。\n2、有系列化开发经验，能把单集冲突做成可续更的人物关系和欲望闭环。\n3、了解国内/海外成人短剧或短视频平台的常见审核口径，能提前规避高风险桥段。\n4、有与美术、分镜、生成同事协作的经验，能用「可执行语言」改剧本，而不是只强调文学性。", "cat": "AI / AIGC"}, {"id": "215", "title": "后端工程师", "salary": "21k-37k", "location": "需要开摄像头", "jd": "负责视频类后端核心模块的系统设计、技术方案评审与落地，包括内容发布、内容分发、播放服务、互动系统、账号体系、运营后台与监控体系。  \n基于微服务/模块化架构主导服务拆分与演进，优化接口链路、数据库访问与异步任务机制。  \n设计并保障视频全链路稳定运行：上传 → 转码 → 存储 → 分发 → 播放统计的可用性与可观测性。  \n建设高并发能力：限流、熔断、降级、幂等、重试、异步化、队列化等高可用与韧性能力。  \n推动监控体系建设，建立关键指标体系（播放成功率、首帧耗时、转码成功率、接口 P99、错误率、任务积压、核心链路超时率）并持续迭代。  \n负责数据库与缓存治理：索引优化、冷热数据策略、分片/分库分表评估、SQL 调优与存储成本控制。  \n组织并推动接口文档、联调、Code Review、发布评审与回归，保障交付质量和线上稳定。  \n与客户端、算法、前端、测试、运维协作，制定版本计划、排期和风险清单，推动问题闭环。  \n指导初中级工程师，沉淀架构方案、开发规范与故障处置文档，提升团队交付效率。\n任职要求\n本科及以上学历，计算机相关专业优先。  \n5 年以上后端开发经验，3 年以上大流量互联网服务经验，具备从零到一或一到多迭代落地能力。  \n精通至少一种后端语言（Node.js、PHP、Go 中至少一种），并有线上高并发服务开发与问题排障经历。  \n熟悉服务架构与接口设计（RESTful / RPC）、鉴权与权限体系、消息队列、缓存、数据库建模与优化。  \n有能力独立定位并优化性能瓶颈（数据库、缓存、I/O、事件循环/协程、连接池、慢查询、死锁等）。  \n熟悉日志、监控、告警、链路追踪工具，具备线上故障应急处理和复盘能力。  \n对业务有产品化思维，能够把业务目标拆解为可执行的技术方案和里程碑。  \n良好的沟通与协作能力，能在跨部门环境中推动复杂需求落地。\n技术栈要求（必须）\n编程语言：Node.js、PHP、Go（至少熟练掌握 1 门，熟悉其中 2 门更佳）  \n框架/运行时：  Node.js：NestJS / Koa / Express（至少一项）  \nPHP：Laravel / ThinkPHP / Symfony（至少一项）  \nGo：Gin / Kratos / Go-zero（至少一项）\n\n数据存储：  MySQL（主库/从库）  \nRedis（缓存、限流、队列）  \n可选：MongoDB / ClickHouse / Elasticsearch（按业务场景）\n\n消息与异步：Kafka / RocketMQ / RabbitMQ / SQS（至少一种）  \n对象存储与分发：OSS / COS / S3 + CDN  \n视频链路能力：FFmpeg、HLS/DASH、转码任务编排、文件状态流转、播放埋点  \n容器与部署：Docker + Kubernetes（或云原生托管）+ CI/CD（GitLab CI / Jenkins）  \n监控与可观测：Prometheus + Grafana + ELK（或等效）+ 分布式追踪（Jaeger / SkyWalking）  \n版本管理与协作：Git、CI/CD、项目管理工具（Jira/TAPD/禅道等）\n加分项\n有短视频、UGC/PGC 或直播/点播平台后端经验。  \n有上传转码、播放链路、内容推荐或弹性扩容实战。  \n有反作弊、内容安全、版权风控或风控模型接入经验。  \n有大规模数据治理与性能容量规划经验（QPS、并发连接、秒级故障恢复）。  \n有团队技术规划、架构评审、技术债治理经验。", "cat": "技术 / 数据"}, {"id": "216", "title": "高级内容运营", "salary": "20k-35k", "location": "未明确", "jd": "【任职要求】（优先考虑境外办公人才，但需要是中国籍）\n\n本科及以上学历，专业不限。\n2年以上付费内容平台/泛娱乐类APP内容运营经验，有大流量内容产品经验者优先。\n需有完整的内容运营项目经历，主导过至少1个产品内容体系从搭建到稳定运营全流程。\n\n专业技能：深度理解内容生态与用户消费心理，具备独立制定内容策略、内容选品标准及审核机制的能力。\n熟悉内容生命周期管理，能主导内容分区规划、标签体系建设与内容质量持续优化。\n具备数据驱动内容决策的能力，能通过点击率、完播率、转化率等内容指标洞察用户偏好并调整策略。\n有二创内容、封面素材、推广物料的策划与审核经验，具备基本的内容审美与平台调性把控力。\n熟悉产品迭代流程，能从内容视角提出功能需求，跟进上线验收。\n熟练使用Excel/Google Sheets等数据工具；有BI看板或内容管理系统使用经验者优先。\n\n软性技能：对内容有热情，能快速理解不同产品的用户圈层与内容偏好。\n逻辑清晰，结果导向，能独立推动内容项目从策划到落地完整闭环。\n强责任心与自驱力，在多产品并行环境下能有效管理内容优先级。\n\n优先条件：有内容冷启动或内容体系从0到1搭建经验者优先；有AI工具辅助内容生产/审核经验者优先；有用户UGC/PGC内容运营成功案例者优先。\n\n───\n\n【岗位职责】\n\n主导所辖产品内容体系建设，负责内容分区规划、标签体系设计与内容选品标准制定，持续提升内容与用户需求的匹配度。\n深度把控内容质量，制定内容审核标准与上架规则，定期进行内容走查，校准产品调性，保障内容生态健康稳定。\n推动二创内容、封面素材、推广物料的持续产出与迭代，联动设计、技术资源，提升内容吸引力与点击转化。\n通过内容数据（点击率、完播率、付费转化等）深度洞察用户行为，定期输出内容分析报告，驱动内容选品与运营策略持续优化。\n策划并执行大促节点内容活动（节日专题、预购联动等），从内容角度放大活动声量，完成活动物料审核与数据复盘。\n构建并维护各产品内容需求池，推动内容相关产品功能的迭代优化，参与需求评审并完成上线前内容走查验收。\n跟踪用户付费行为与内容消费路径，参与用户分层运营，针对高价值用户设计差异化内容触达策略。\n持续关注行业内容趋势，引入优质内容资源与创新玩法，为产品内容竞争力提供持续输入。", "cat": "内容"}, {"id": "217", "title": "高级产品经理", "salary": "20k-30k", "location": "软性技能：优秀的线上沟通与协作能力，完全适应全远程工作模式。", "jd": "【任职要求】（优先考虑境外办公人才，但需要是中国籍） \n本科及以上学历，985/211优先，专业不限。\n5年以上互联网C端产品经验，至少3年大流量to C产品经验（日活百万级以上优先）\n需要有一线产品正规行业完整的项目经历（在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等大厂有完整项目经历者优先），不要近几年有bc行业经验的\n专业技能：完整主导过至少1-2个现象级功能或从0到1项目，有显著数据提升案例。\n深刻理解内容生态、推荐算法、社区玩法、会员/付费体系、商业化变现等C端核心逻辑。\n熟练使用Axure、Figma等原型工具，精通Tableau、PowerBI、Excel等数据分析工具，能独立完成PRD撰写与数据埋点方案。\n熟练主导A/B测试、用户调研、增长实验，具备从数据洞察到策略落地的闭环能力。\n优秀的项目管理、需求优先级判断与跨部门推动能力。\n软性技能：优秀的线上沟通与协作能力，完全适应全远程工作模式。\n极强的逻辑思维、用户同理心与结果导向，能在不确定性中快速决策。\n抗压能力强，拥有强烈的责任心与自驱力。\n远程工作要求：稳定高速网络与独立安静的办公环境，能适应跨时区会议。\n熟练使用Lark（飞书）、Zoom等主流远程协作工具。\n优先条件:拥有日活百万级以上优先；在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等大厂有完整项目经历者优先；具备团队管理或指导经验。\n\n岗位职责:\n负责公司产品规划、需求挖掘、功能设计与全生命周期管理。\n深度洞察用户需求与行业趋势，结合数据分析与用户调研，主导从0到1或从1到100的核心功能迭代，覆盖内容推荐、会员体系、互动社区、商业化等模块。\n制定清晰的产品目标与核心指标（DAU、留存、时长、付费率、ARPU、GMV等），通过策略设计与快速试验持续推动指标增长。\n协调产品、设计、研发、运营、商务等团队资源，推动产品高效上线并实现预期目标。\n参与公司级产品战略制定，具备跨业务线资源整合与推动能力。", "cat": "产品"}, {"id": "218", "title": "中高级UI设计师", "salary": "10k-30k", "location": "未明确", "jd": "【岗位职责】 （优先考虑境外办公人才，但需要是中国籍）不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n\n负责公司相关产品（Web/H5/App等）的整体UI界面设计，熟练使用Figma等设计工具，主导产品视觉风格和规范的制定。\n根据产品调性，完成icon、logo、水印、启动页、落地页等产品上线前所需物料，包括但不限于静态图、动态图、MG动画；根据运营需求设计活动banner、弹窗等，覆盖节日活动、补间活动、社区日常推荐活动等场景。\n具备二次元视觉风格设计能力，能够产出符合二次元审美的界面、角色、插画及运营物料，理解二次元用户圈层喜好与视觉偏好。\n利用Make、Stitch等AIGC工具完成从构想到Figma成品交付，了解各类大模型用途及ComfyUI工作流搭建与节点使用。\n\n【任职要求】\n\n本科及以上学历，美术、视觉传达、计算机学等相关专业优先；\n5年以上UI设计及平面设计经验（两者均需具备）；\n专业技能：Figma、Photoshop、Illustrator、Adobe Effects、ComfyUI、Claude；\n有二次元风格设计作品集，优先考虑有动漫、游戏、虚拟IP等相关项目经验；\n优先考虑境外办公人才（中国籍）；\n近期有博彩、棋牌、区块链相关背景者不予考虑。\n\n【加分项】\n\n会使用Claude与Figma进行交互，可反推Frame文件生成；会用Make进行低保真生成，会用Stitch进行概念设计；\n会使用Blender、C4D等三维软件；\n有前端经验，会Python；\n深度理解ComfyUI各节点含义，能自写节点并搭建复杂工作流；\n有二次元IP设计、虚拟形象设计或Live2D相关经验者优先。", "cat": "设计"}, {"id": "219", "title": "中高级运营专员", "salary": "10K-35K", "location": "未明确", "jd": "岗位JD描述：岗位职责  不要近期是bc博弈和棋牌相关的经验和区块链相关的经验\n岗位定位：中级运营专员是业务增长的核心执行者与推动者，能够独立负责产品或业务模块运营工作，通过数据分析、活动运营、用户运营及产品优化，推动新增、留存、活跃、转化等核心指标持续提升，主动发现业务问题、提出解决方案并推动落地，对产品经营结果负责，以及跨部门沟通保障项目高效推进。\n岗位职责\n\n用户运营与社区运营\n负责用户分层及生命周期运营；\n推动社区内容建设与用户互动氛围打造；\n收集用户反馈并推动问题解决；\n提升用户留存、活跃及复购能力。\n\n独立策划并执行活动方案\n推动会员体系、充值活动、节日活动等运营项目；\n优化用户转化路径，提高付费转化率；\n对活动效果进行分析与复盘。\n\n数据分析与业务诊断\n监控新增、留存、充值、活跃等核心数据；\n输出专项分析报告；\n分析业务异常并提出解决方案；\n跟踪优化结果并持续复盘\n\n产品运营管理\n负责产品日常运营及数据监控；\n跟进产品版本迭代、功能测试及上线验收；\n定期开展产品走查，发现问题并提出优化建议；\n推动产品需求、活动需求及优化方案落地。\n\n任职要求\n2-3年以上互联网运营经验；\n具备产品运营、用户运营、活动运营相关经验；\n熟悉互联网产品运营逻辑及增长模型；\n能适应快节奏业务环境，具备较强执行力与责任心。\n熟悉产品运营全流程；\n能独立完成新增、留存、活跃、转化等数据分析，能根据数据发现问题并制定优化方案；\n能独立策划、执行及复盘运营活动； 熟悉会员体系、充值活动、节日活动等运营模式；\n了解用户生命周期管理；能进行用户分层运营；具备社区运营、内容运营经验优先；能通过运营手段提升留存与活跃。", "cat": "运营"}, {"id": "220", "title": "中高级运营专员（综合类方向）", "salary": "10K-35K", "location": "未明确", "jd": "岗位职责  （优先考虑境外办公人才，但需要是中国籍）如果简历中没有提到过留存，次留，用户增长，日活这样的关键词，不考虑\n1、负责免费视频 App 整体运营策略制定与落地\n（1）围绕用户增长、活跃、留存、转化及商业化目标，制定阶段性运营规划并推动执行。\n（2）负责平台级内容运营、用户运营、活动运营、渠道运营等综合运营工作，提升产品整体用户规模和活跃度。\n（3）对 DAU、MAU、次日留存、7日留存、30日留存、人均观看时长、播放转化率等核心指标负责。\n2、负责全平台获客链路与获客矩阵建设\n（1）搭建免费视频 App 的用户获客链路及获客矩阵，拓展站内外获客渠道。\n（2）制定渠道投放、自然增长、裂变增长、用户召回等多维度获客策略，持续优化用户获取成本与转化效率。\n（3）基于 AARRR 用户增长模型，系统推进拉新、激活、留存、转化、复购 / 召回等运营策略落地。\n3、负责数据分析与增长模型优化\n（1）精通流量运营全链路，能够围绕用户增长模型、漏斗分析、留存分析、转化分析，发现业务问题并提出优化方案。\n（2）具备项目管理能力，能制定阶段性运营目标、拆解 KPI，并推动执行落地。\n（3）对 DAU / MAU、留存率、ROI、LTV、ARPU、播放完成率、点击率、转化率等关键指标有较强敏感度和责任心。\n（4）通过数据看板、埋点分析、A/B 测试等方式，持续监控拉新、留存、活跃、转化等关键指标，及时发现问题并推动产品、内容、渠道策略优化。\n4、负责产品优化与迭代规划\n（1）深入分析用户使用路径和内容消费行为，识别产品在首页推荐、频道页、播放页、搜索、收藏、追更、推送、互动等环节的优化机会。\n（2）基于用户反馈、数据表现和业务目标，输出产品优化建议，推动产品需求立项、设计、研发、上线和复盘。\n（3）参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设，提升运营效率。\n（4）负责阶段性产品迭代规划，推动产品体验、内容分发效率和用户留存能力持续提升。\n5、负责用户矩阵与社群矩阵运营\n（1）负责社媒矩阵及社群矩阵的整体布局与运营，包括账号体系规划、内容策略制定、渠道联动、用户分层及转化路径设计。\n（2）制定用户召回、活跃提升、会员 / 重点用户维护等策略，提升用户粘性和回访频次。\n（3）建立用户分层运营体系，针对新用户、活跃用户、沉默用户、流失用户制定差异化运营策略。\n6、负责活动运营与内容运营\n（1）策划并推动节日活动、专题活动、召回活动、用户激励活动等重点项目落地。\n（2）结合热点、内容资源、用户兴趣和平台目标，提升活动参与率、内容曝光效率、用户活跃和留存表现。\n（3）负责活动方案设计、资源协调、上线执行、数据跟踪和复盘优化。\n7、负责跨部门协作与项目推进\n（1）协同产品、研发、设计、算法、内容、渠道等团队推进重点项目及运营需求落地。\n（2）建立高效协同机制，保障项目按照运营目标和业务节奏推进。\n（3）关注行业趋势、竞品动态及新型增长方式，持续沉淀运营方法论，支持业务长期增长。\n任职要求\n1、本科及以上学历，3 年以上互联网产品运营、用户运营、增长运营、内容运营或平台运营经验。\n2、有视频、短视频、内容平台、社区、工具类 App、泛娱乐平台运营经验者优先。\n3、熟悉 AARRR 用户增长模型，理解拉新、激活、留存、转化、召回的完整运营逻辑。\n4、具备较强数据分析能力，能够通过数据发现问题、拆解问题并推动解决。\n5、熟悉 DAU、MAU、留存率、LTV、ARPU、ROI、转化率、播放完成率等核心指标，并能围绕指标制定运营策略。\n6、熟练使用 Excel、数据看板、BI 工具，有 SQL、埋点分析、A/B 测试经验者优先。\n7、具备产品思维，能够基于用户路径和数据结果提出产品优化及迭代建议。\n8、具备较强项目管理能力，能独立完成策略制定、项目推进、跨部门协作和结果复盘。\n9、目标感强，结果导向，对 DAU、留存、活跃、转化等核心指标有责任心。", "cat": "运营"}, {"id": "221", "title": "初/中级远程社媒运营（KOL & 内容方向）", "salary": "12-15K", "location": "中级远程社媒运营（KOL & 内容方向）", "jd": "岗位JD描述：岗位职责（不要过往行业经历只有web3的）\n负责 TG、Twitter/X、TikTok、Reddit 等海外社交媒体账号矩阵搭建与日常运营（养号、发布、引流）；\n负责短视频、图文等内容策划与制作，为矩阵和投放持续供给素材；\n负责 KOL/网红资源洽谈、投放与 ROI 优化；\n通过数据分析迭代内容与投放策略，推动海外流量到产品下载、转化闭环。\n\n任职要求：\n熟悉海外社媒平台运营、内容制作、KOL 对接及基础数据分析；具备执行力、学习能力、沟通协作能力，能适应远程协作。", "cat": "内容"}, {"id": "222", "title": "中高级运营专员（web产品）", "salary": "10K-35K", "location": "未明确", "jd": "岗位JD描述\n\n岗位职责：\n\n负责网站整体框架的日常巡检，确保页面正常访问；配合产品和技术团队持续优化网站UI/UX，提升用户浏览体验。\n负责网站各版块的内容策划、撰写与更新；结合SEO策略进行关键词布局，提升网站自然搜索排名。\n根据节假日、行业热点或公司营销节点策划线上活动；负责活动页面原型输出、跟进开发上线，并对活动效果进行追踪和复盘。\n关注网站注册用户的活跃度与留存，建立用户触达与激活机制；收集用户反馈，为产品迭代提供运营视角的建议。\n熟练使用Google Analytics等数据工具，按日/周/月输出网站数据报表（PV、UV、跳出率、转化率等）；通过数据分析定位问题，提出并落地CRO优化方案。\n\n任职要求：\n\n本科及以上学历，3年以上网站运营或综合运营相关工作经验。\n具备扎实的文字功底，能独立完成软文、活动文案及产品包装文案的撰写。\n了解基础SEO知识，熟悉搜索引擎收录与排名规则。\n执行力强，具备良好的跨部门沟通协调能力，需频繁对接设计和技术团队。\n责任心强，抗压能力好，有团队合作精神。\n\n加分项：\n\n有账号矩阵从0到1起量并达成涨粉及曝光KPI实战经验者优先。\n熟练使用AI工具（文本生成、图像处理、音视频辅助等）并能建立内容生产SOP者优先。\n掌握基础HTML/CSS，能进行简单页面代码调整者优先。\n熟悉PS、Figma等设计工具，能独立完成简单配图处理者优先。\n了解Python脚本、自动化抓取工具或Telegram Bot搭建者优先。", "cat": "运营"}, {"id": "223", "title": "SEO专员", "salary": "10K-35K", "location": "未明确", "jd": "岗位JD描述\n\n岗位职责：\n\n全盘负责站点底层SEO架构优化；精细化管理动态Sitemap生成机制、robots.txt规则配置与爬虫抓取频次管理，确保千万级视频页面被高效抓取与收录。\n制定视频内容搜索排名核心策略；深度应用视频结构化数据（Schema Markup/VideoObject），优化视频聚合页与播放页的内部链接结构，提升核心页面权重。\n结合AI工具建立规模化的网页TDK生产SOP；搭建自动化长尾词挖掘与内容分发工作流，通过程序化SEO批量获取长尾流量。\n规划高质量外链建设方案，结合Facebook、X、Telegram等渠道的社交流量信号，综合提升网站DA/DR和搜索引擎信任度。\n建立SEO数据监控看板（基于Google Search Console、日志分析等）；定期进行全站爬虫日志分析，快速定位并解决死链、蜘蛛陷阱、降权等流量异常问题。\n\n任职要求：\n\n本科及以上学历，3年以上大型ToC网站SEO实操经验，有从0到1搭建SEO架构或流量翻倍的成功案例。\n深度了解Google、Bing、Yandex等主流搜索引擎排名机制与反作弊算法，精通白帽SEO，持续关注算法更新趋势。\n熟悉HTML/CSS/JavaScript对SEO的影响，了解AMP/SSR等移动端技术，能与技术团队无障碍沟通并推动SEO需求落地。\n数据敏感度强，具备日志分析能力，能从大规模服务器日志中发现爬虫抓取规律与瓶颈。\n执行力强，能独立推进SEO需求从分析到落地的全流程。\n\n加分项：\n\n熟练掌握Python，能独立编写脚本或自动化抓取工具进行竞品分析与数据处理者优先。\n有将业务数据或流量预警通过API接入Telegram Bot进行程序化管理经验者优先。\n有站群运营或大规模社媒账号矩阵流量协同经验者优先。", "cat": "运营"}, {"id": "224", "title": "初级运营专员", "salary": "7-15K", "location": "未明确", "jd": "岗位职责\n1、负责APP内视频内容日常运营，根据运营规范完成内容发布、审核、上下架及维护，确保内容及时上线及正常展示；\n2、负责内容包装优化，包括标题、封面、标签、简介等，不断提升内容点击率、曝光率及基础转化率；\n3、每日监控核心运营数据，输出运营日报，对播放、点击、会员转化、付费转化等指标进行分析，发现异常并及时反馈；\n4、参与平台活动运营，包括专题策划、活动配置、数据跟踪及活动复盘，持续优化活动效果；\n5、维护内容资源池，结合用户偏好及平台需求，不断丰富内容标签及素材，提高平台内容供给质量；\n6、对接产品、审核、视频等相关部门，跟进运营需求落地，推动问题解决及项目执行；\n7、完成领导安排的其他运营工作。\n任职要求\n基本要求\n大专及以上学历，专业不限；\n1年以内运营经验，应届优秀毕业生亦可；\n熟悉短视频、影视、内容平台产品，对视频行业有浓厚兴趣；\n熟练使用Excel，具备基础数据分析能力（如透视表、VLOOKUP等优先）；\n工作细心，责任心强，执行力高，能够适应重复性工作。\n优先考虑\n有视频平台、短剧平台、小说平台、直播平台、内容社区运营经验；\n有内容审核、内容运营、活动运营经验；\n有一定数据敏感度，能够发现异常数据并提出优化建议；\n熟悉用户增长、会员转化、内容推荐逻辑者优先。", "cat": "运营"}, {"id": "225", "title": "高级/专家 AI 应用工程师（Agent Ops）", "salary": "20-40k", "location": "未明确", "jd": "【岗位定位】（优先中国籍）\n\n负责公司内部 AI Agent 工作流提效，以及 AI 应用从产品原型、技术开发到部署上线的全流程建设。\n\n该岗位不是单一的 Agent 运维、后端开发或 AI 工具使用岗位，而是需要具备全栈开发、AI 应用落地、产品理解及线上运维能力，能够独立推动产品从 0 到 1 上线并持续迭代。\n\n【岗位职责】\n\n1. 负责公司内部 Agent、Skill 及自动化工作流的搭建与优化，推动重复性工作自动化，提升业务效率和交付质量。\n2. 根据产品原型、业务需求及用户场景，独立完成技术方案设计、前后端开发、数据库设计、接口联调、AI 能力接入及部署上线，推动产品从 0 到 1 落地。\n3. 根据不同项目需求选择合适的技术架构，完成内部管理工具、外部 Web 应用、C 端产品、B 端系统、工具型产品及其他业务应用的建设，不局限于单一项目类型或固定技术方向。\n4. 将大模型 API、Agent、RAG、工作流编排等 AI 能力应用到真实产品中，并结合业务效果持续优化模型、Prompt、流程及系统架构。\n5. 从产品和消费者角度参与需求评估，主动发现原型、功能逻辑、操作流程及用户体验中的问题，并与产品经理共同推动优化。\n6. 负责产品上线后的全生命周期管理，包括系统监控、日志分析、异常处理、性能优化、版本迭代、服务部署、扩缩容及基础设施维护。\n7. 沉淀可复用的技术组件、Agent 工作流、开发模板、部署方案及技术规范，提升后续 AI 应用的开发和交付效率。\n\n【任职要求】\n\n1. 具备扎实的全栈开发能力，能够独立处理前端、后端、数据库、接口、部署及线上故障，不局限于单一前端、后端或运维方向。\n2. 至少熟练掌握两种主流编程语言， Golang 、 Python、Java等\n3. 熟练 React、Vue、Next.js 等至少一种前端技术栈，以及 Gin、FastAPI、Spring Boot 等至少一种后端框架。\n4. 熟练 MySQL、PostgreSQL、mongodb、Redis 等常用数据存储方案，具备数据库设计、性能优化及问题排查能力。\n5. 熟练 Linux、Docker、Nginx、CI/CD、日志分析及基础监控，能够独立完成服务部署、配置管理和线上问题处理。\n6. 有大模型 API、Agent、RAG、Prompt、Skill 或 AI 工作流的实际项目经验，能够使用 Claude Code、Cursor、GitHub Copilot 等工具提升开发效率。\n7. 具备多类型项目经验，做过内部管理系统、外部应用、C 端产品、B 端平台或工具型产品中的多种项目形态，能够适应不同业务和用户场景。\n8. 具备较强的产品意识和用户视角，不仅关注功能是否开发完成，也能够判断产品逻辑、用户体验及业务价值是否符合预期。\n9. 具备较强的独立解决问题和项目落地能力，能够在需求不完全明确或技术链路复杂的情况下，主动拆解问题并推动项目上线。\n\n【核心技术方向】\n\n编程语言：Golang、Python、Java，至少熟练掌握两种\n前端开发：React、Vue、Next.js 等\n后端开发：Gin、FastAPI、Spring Boot 等\n数据存储：MySQL、PostgreSQL、mongodb、Redis\nAI 应用：Agent、Skill、RAG、大模型 API、Prompt、工作流编排\n部署运维：Linux、Docker、Nginx、CI/CD、日志分析、监控告警\nAI 开发工具：Claude Code、Cursor、GitHub Copilot 等\n\n【加分项】\n\n1. 有 AI 应用从需求分析、技术设计、开发到正式上线的完整项目经验。\n2. 有企业内部 Agent、自动化工作流或业务提效工具的落地经验，并能说明实际提效成果。\n3. 有 Kubernetes、Prometheus、Grafana、ELK、LangSmith 等生产环境使用经验。\n4. 有多项目并行交付、技术负责人或项目负责人经验。\n5. 有面向真实消费者的产品开发经验，能够关注用户体验、使用效果和业务结果。\n\n【暂不匹配】\n\n1. 仅有单一前端、后端或运维经验，缺少完整全栈交付能力。\n2. 只会调用模型 API、配置 Agent 或调整 Prompt，缺少实际应用开发经验。\n3. 缺少产品从开发、部署上线到后续维护的完整项目经历。\n4. 项目经验长期局限于交易所、区块链或重复型流水线系统，缺少多类型产品和真实用户场景经验。\n5. 习惯机械执行产品原型，缺少产品判断、用户视角和主动优化意识。", "cat": "AI / AIGC"}, {"id": "226", "title": "运营副主管（网站运营）40K-65K/月", "salary": "40k-65k", "location": "未明确", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n\n岗位职责：\n\n协助主管制定并执行网站运营策略，确保网站运营方向与公司业务目标保持一致，围绕流量增长、内容质量、用户体验、转化提升及运营效率优化推进整体工作。\n负责网站日常运营统筹管理，覆盖内容、页面、功能、更新维护等核心环节，保障网站稳定、高效运行。\n建立并持续优化网站运营流程、管理制度及SOP，提升团队整体执行效率和业务协同能力。\n持续监控网站流量、用户行为、转化率及其他关键运营指标，及时识别问题并提出数据驱动的优化方案。\n推动网站用户体验（UX）及转化率优化（CRO），持续改善用户旅程、内容承接效率和业务转化效果。\n推动SEO策略落地及相关技术优化，协同提升网站自然搜索表现、内容可见度及流量增长。\n协调产品、设计、开发等部门资源，推进网站功能优化、运营需求及数字化项目按计划落地。\n监督网站系统运行、安全性及性能表现，及时协调处理异常问题，降低运营风险。\n协助主管进行团队管理，包括工作规划、任务分配、绩效跟进、培训辅导及人才培养，保障团队稳定输出。\n\n任职要求：\n\n本科及以上学历，具备网站运营、内容运营、流量运营或相关岗位工作经验，有网站业务管理经验者优先。\n熟悉网站日常运营逻辑，对流量增长、内容质量、搜索表现、用户体验和转化优化有较强理解。\n具备较强的数据分析能力，能够围绕流量、行为、转化等核心指标进行问题判断与优化推进。\n熟悉SEO基础逻辑，能够协同推进自然流量增长及网站结构、内容、页面等优化工作。\n具备较强的组织协调能力、跨部门推动能力和问题闭环意识，能够推进事项按节点落地。\n有一定团队管理、项目推进或带教经验，能够协助主管完成团队管理和业务统筹。\n责任意识强，抗压能力较好，能够在多项目并行情况下保持稳定推进。\n\n加分项：\n\n有多网站或内容平台运营管理经验者优先。\n有SEO、CRO、UX优化相关经验者优先。\n有网站改版、功能优化或数字化项目推进经验者优先。\n有团队管理、绩效跟进及人才培养经验者优先。\n熟悉AI工具在网站运营、内容生产及效率优化场景中的应用者优先。", "cat": "运营"}, {"id": "227", "title": "运营副主管（免费产品）40K-65K/月", "salary": "40k-65k", "location": "未明确", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n\n岗位职责：\n\n1.向部门负责人汇报，协助统筹小组的工作；拆解阶段目标，明确各组分工、工作优先级、完成节点及验收标准，跟进执行进度与结果。\n2.统筹部门多款APP的运营，围绕日活、新增、次日及七日留存、商务广告点击、充值转化制定优化方案；结合产品体量、问题影响和资源情况，确定重点投入方向。\n3.亲自负责重点产品或关键项目，深入分析用户需求、内容表现及产品体验，提出具体改进方案，推动上线并复盘效果，形成可复制的运营方法。\n4.推进视频、漫画、小说、AI短剧等内容业务的运营优化，持续改善内容质量、首页展示、推荐内容及免费与付费权益配置，通过活动、用户引导和召回提升内容消费、留存及付费转化。\n5.建立产品及渠道数据跟踪机制，分析用户从新增、激活到留存和付费的表现；发现指标异常时，核对数据口径，协调技术排查，明确问题原因、改进动作及负责人。\n6.协同渠道团队评估新增质量、用户留存及获客成本，提出渠道调整建议；推进APP落地页矩阵及自然流量增长项目，跟踪访问、下载、激活和留存效果。\n7.协调产品、技术、视觉、渠道及商务等团队，将运营问题转化为明确需求，推进评审、排期、上线和验收；统筹视觉需求与资源，提升页面、封面和活动素材的业务效果。\n8.参与组长及运营成员的招聘、带教和绩效评估，完善运营SOP、工作检查及复盘机制，培养能够独立分析问题、制定方案并负责产品结果的成员。\n\n任职要求：\n\n1.具备内容型APP运营经验，熟悉视频、漫画、小说、短剧等业务中的一种或多种，能够提供本人实际负责的产品案例、运营动作及指标改善结果。\n2.具备团队管理经验，能够管理组长及运营成员，合理分配任务、协调资源、跟进进度，并通过带教提升团队独立负责产品的能力。\n3.具备多产品运营和优先级判断能力，能够结合产品规模、用户表现及业务目标制定计划，同时具备亲自操盘重点产品的能力。\n4.数据分析能力扎实，理解活跃、新增、留存、广告点击及付费转化等指标，能够从产品、内容、渠道和用户行为中定位问题，并提出可验证的优化方案。\n5.熟悉内容运营、用户运营及商业化转化方法，能够将内容调整、活动设计、权益配置和产品体验优化结合起来，持续改善业务结果。\n6.具备跨部门沟通和项目推进能力，能清晰表达需求、明确验收标准，主动处理执行中的阻碍，并及时向负责人反馈进度、风险及资源需求。\n\n加分项：\n\n1.有同时管理多款内容型APP，以及统筹运营与视觉团队的经验者优先。\n2.有提升用户留存、广告点击或用户规划增长的实际案例者优先。\n3.有APP落地页、SEO自然流量、社媒导流或渠道质量优化经验者优先。\n4.能熟练使用AI工具提升内容策划、竞品研究、数据整理及团队工作效率，并建立人工审核标准者优先。", "cat": "运营"}, {"id": "228", "title": "中高级平面设计师", "salary": "10-30K", "location": "未明确", "jd": "岗位定位：\n负责产品视频封面的制作以及日常活动的视觉设计，良好的沟通能力和自主设计能力，积极配合产品活动项目落地以及推广，设计产出符合大众审美并带来强烈的点击欲望，实现产品的点击量的持续增长和增加用户粘。\n\n岗位职责：\n要求候选人具有一定的审美能力，在日常运营工作中的设计产品封面/推广等工作，能够根据视频精彩内容输出美观吸睛的作品，并且按照相关需求输出动效活动banner以及会员卡/弹窗/海报等物料。\n\n团队与创意协同：\n与设计/内容团队协作优化视觉并进行审核，最终落地推广。\n\nAI 应用：\n运用 AI 工具完成整个设计流程，提高设计效率和质量。\n\n任职要求\n大专及以上学历，有3年以上平面/视觉相关经验者优先；\n熟悉主流设计方向，有良好审美和原创能力，有一定的figma基础，注重设计细节以及良好的沟通协作能力，精通（PS/Ai/AE/Pr/C4d）等软件，输出动效类的推广banner/海拔/弹窗等活动图。\n\n结果导向：具备良好的审美能力、沟通协调、抗压能力与团队协作意识，能适应快节奏工作；熟练运用 AI 工具辅助设计，候选人在国内和海外都可以。\n\n加分项：\n有成人行业经验首选，其次为传媒/视频/直播公司相关经验，会使用AE/C4d/figma等相关3d动效类的候选者优先考虑。", "cat": "设计"}, {"id": "229", "title": "PMO/项目管理", "salary": "8-10K", "location": "未明确", "jd": "岗位定位：作为GM经营管理辅助角色，协助推进重点业务及项目，强化过程管控、跨部门协调及结果闭环，推动经营目标有效落地。\n\n岗位职责：\n1、项目统筹与进度管理：负责各部门重点项目全生命周期跟踪，定期收集、汇总及评估项目进展，围绕关键节点、交付结果及目标偏差进行过程管控，及时识别风险并推动解决。\n2、重点事项推进与业务协同：参与重点业务事项及跨部门项目的过程管理，对GM及管理层明确的重点任务进行拆解、跟进和协调，推动责任人按计划完成关键节点；针对进度偏差、协同卡点及重大风险及时介入，并做好阶段性进展及节点结果汇报。\n3、经营会议及决议闭环：负责重点跨部门会议、GM例会等管理会议的组织与信息梳理，提炼关键决议、责任人及完成节点，并持续跟进决议事项落地，对延期、未闭环事项及时预警及推动解决。\n4、管理信息及项目看板建设：建立并持续优化重点项目及任务管理看板，定期输出周报/月报，清晰呈现项目进度、关键成果、风险问题及待决策事项，为GM及管理层掌握业务进展、资源协调和管理决策提供支持。                                                        \n\n\n任职要求\n1. 具备较强的项目管理、任务拆解和进度推进能力，能够独立跟踪多部门、多项目事项。\n2. 具备良好的跨部门沟通协调能力，能够有效推动责任人完成任务并解决协同问题。\n3. 具备较强的逻辑分析、信息整合和书面表达能力，能够高效输出会议纪要、项目报告、周报及月报。\n4. 具备风险意识和结果导向，能够及时发现进度偏差、潜在风险及未闭环事项，并推动解决。\n5. 熟练使用Excel、PowerPoint等办公工具，具备数据整理、项目看板及经营信息呈现能力。\n6. 工作认真细致、责任心强，具备较强的执行力、抗压能力和保密意识。\n7. 有经营管理、项目管理、PMO、总经理助理、业务运营或跨部门协同相关经验者优先。", "cat": "职能"}, {"id": "230", "title": "剧本组长（35K-55K/月）", "salary": "20-35K", "location": "未明确", "jd": "岗位职责；负责剧本组整体产出与储备；（1）对剧本采纳率、剧本储备月数（稳定 2–3 个月，含外包与采购）负责。；（2）统筹内部原创、外包撰写、剧本采购三条来源，合理分配产能。；（3）组员任务分配，跟踪各集剧本进度与质量。；负责剧本评审与方法沉淀；（1）组织本子评审，把控剧情成立、时长可控、钩子/爽点/断点有效。；（2）沉淀跑出成绩的结构、开场钩子、爽点、断点为方法，指导本组创作。；（3）参与立项前制作可行性会审，判断内容值不值得做。；负责不可外包内容的最终把关；（1）守住核心主线设定、男女主角核心人设、成片整体节奏，不外包、不放松。；（2）确保外包与采购剧本进入审核序列，不绕过卡点 1。；负责编剧梯队建设；（1）搭建编剧梯队并组织互评，培养储备组长。；（2）新入职编剧的带教与适应期缩短。；任职要求；本科及以上学历，5 年以上编剧/内容创作经验，其中 2 年以上团队带教或统筹经验。；具备带编剧团队的能力（核心要求）——各线最缺的不是编剧，是能带编剧的人。；有网文/短剧/动漫/影视等成规模内容的主创或统筹经验，有代表作品。；深刻理解爽点、钩子、断点、节奏等短剧/网文创作规律。；具备内容判断力与评本能力，能快速判断本子优劣与改进方向。；熟悉外包协作与剧本采购流程者优先。；自带成熟编剧团队者优先。；关键考核指标：剧本储备月数、采纳率、上线后相对表现、续作能力、是否带出储备组长。；", "cat": "其他"}, {"id": "231", "title": "编剧", "salary": "15-25K", "location": "未明确", "jd": "岗位职责；负责核心剧本与爆款项目创作；（1）撰写项目核心主线、分集剧本、锁定版剧本，确保剧情成立、时长可控。；（2）设计开场钩子、爽点节奏、集末断点，提升留存与完播。；（3）参与男女主核心人设与标志性场景的设定。；负责剧本迭代与数据响应；（1）参与立项前制作可行性会审，与生成组确认镜头可制作性。；（2）根据上线数据（前 3 秒留存、完播率、付费转化、转发）与观众口碑，调整后续剧集与选题。；配合审核与制作；（1）配合剧本审核在卡点 1 完成锁定，及时响应修改意见。；（2）配合导演与生成组，保障剧本到分镜的顺畅转化。；任职要求；大专/本科及以上学历，2 年以上编剧经验（短剧、网文、动漫、影视方向）。；有真实代表作品，审美与内容判断力优先于 AI 工具操作能力。；精通爽文/短剧叙事套路，熟悉钩子、反转、爽点、断点设计。；有单部完整作品的创作经验，能独立产出成熟分集剧本（成熟编剧月产约 2 部）。；对上线数据敏感，愿意以市场反馈迭代创作。；有女频/男频、悬疑、都市、玄幻等热门题材经验者优先。；关键考核指标：剧本采纳率、上线后相对表现、续作能力（不按写了多少集评价）。；", "cat": "内容"}, {"id": "232", "title": "视频生成组长（50K-70K/月）", "salary": "30-50K", "location": "未明确", "jd": "岗位职责；负责生成产能组织与调度；（1）按剧本场次数分配生成人力（投入人数 > 场次数则边际效益迅速下降；最小作业单元 1 导演 + 3 生成）。；（2）保障目标产能 2–3 分钟/人/天（通过卡点 4 的合格成片分钟数）。；（3）管理动态额度申请，优先保障高质量有效产出。；负责生成质量把控；（1）对合格镜头率、一次通过率、单位算力产出负责。；（2）与导演对齐分镜归属与画面风格。；负责工具回流与资产沉淀；（1）回流生产数据与优质参数至技术团队与共享资产库。；任职要求；大专/本科及以上，3 年以上视频制作/AIGC 视频生成经验，1 年以上带组经验。；精通主流 AI 视频生成工具链与工作流，理解人物稳定、动作自然、场景不漂移的控制方法。；具备产能组织能力，能按场次数与难度合理排产。；对算力成本与产出效率敏感。；自带成熟编剧团队者优先。；关键考核指标：合格镜头率、单位算力产出、单人日产能、一次通过率、是否带出储备组长。；", "cat": "内容"}, {"id": "233", "title": "AI 视频生成（20-50K/月）", "salary": "20-50K", "location": "未明确", "jd": "岗位职责；负责镜头视频生成；（1）依据分镜脚本生成镜头素材，保证人物稳定、动作自然、场景不漂移。；（2）达成目标产能 2–3 分钟/人/天（指通过卡点 4 的合格成片分钟数）。；（3）常规对话、静态场景可批量生成；高难度打斗、多人复杂互动为重点攻坚。；负责生成质量与自检；（1）对一次通过率、合格镜头率负责，减少返工。；（2）瑕疵镜头初筛，配合镜头审核执行卡点 4。；配合资产与参数沉淀；（1）回流优质随机种子、构图参数、微调资产至共享库。；任职要求；大专及以上学历，1 年以上视频制作、后期或 AIGC 相关经验（应届优秀者可放宽）。；熟练使用 AI 视频生成工具，理解提示词、参数、种子对稳定性的影响。；有画面审美与镜头感，能判断生成结果是否达标。；细致、有耐心，能承担产量与一次通过率压力。；现有剪辑/后期人员经培训可内部转岗。；关键考核指标：产量、一次通过率、合格镜头率、单位算力产出。；", "cat": "AI / AIGC"}, {"id": "234", "title": "产品专员（重点项目推进与业务协同）", "salary": "10-15k", "location": "未明确", "jd": "岗位定位\n作为GM及管理层的\"业务推进抓手\"，负责跨部门重点项目的全生命周期跟踪与过程管控，确保关键任务按节点落地、管理决议有效闭环。需要脑子活、反应快、眼里有活，能主动发现卡点并推动解决，而非被动等指令；同时善用AI工具提升信息处理与推进效率，把重复性工作交给工具，把判断和协调留给自己。\n岗位职责\n1. 重点项目全生命周期跟踪与过程管控负责各部门重点项目从立项到交付的全生命周期跟踪，定期收集、汇总及评估项目进展；围绕关键节点、交付结果及目标偏差进行过程管控，及时识别风险并推动解决，确保项目不\"漂移\"、不\"烂尾\"。\n2. 重点事项推进与业务协同参与重点业务事项及跨部门项目的过程管理，对GM及管理层明确的重点任务进行拆解、跟进和协调，推动责任人按计划完成关键节点；针对进度偏差、协同卡点及重大风险及时介入，做好阶段性进展及节点结果汇报，做到问题不过夜、卡点有回音。\n3. 经营会议组织及决议闭环负责重点跨部门会议、GM例会等管理会议的组织与信息梳理，高质量完成会议纪要，精准提炼关键决议、责任人及完成节点；持续跟进决议事项落地，对延期、未闭环事项及时预警并推动解决，形成\"开会—记录—跟进—闭环\"的完整链路。善用AI工具进行会议录音转写、纪要初稿生成与决议事项结构化提取，提升会议信息处理效率与准确度。\n4. 管理信息及项目看板建设建立并持续优化重点项目及任务管理看板，定期输出周报/月报，清晰呈现项目进度、关键成果、风险问题及待决策事项，为GM及管理层掌握业务进展、资源协调和管理决策提供支持。能借助AI工具完成多源信息的汇总整理、周报/月报初稿生成及进度数据初步分析，把精力聚焦在风险判断与协调推动上。\n任职要求\n必备条件\n • 本科及以上学历，1—3年项目管理、产品运营、业务协同或总助/PMO相关经验；\n • 机灵、反应快、主动性强：能快速理解业务意图，对进度偏差和协同卡点有敏感度，不等不靠、主动补位；\n • 进度管控能力强：熟悉项目拆解与节点管理，能盯住关键路径、识别风险并推动责任人按时交付；\n • 会议纪要功底扎实：能在一场信息密集的会议后，快速产出结构清晰、决议明确、责任到人的纪要，不漏关键信息、不写流水账；\n • 沟通协调能力突出：能在多部门、多层级之间顺畅对接，既能把管理层意图准确传导下去，也能把一线卡点有效带上来；\n • 熟练使用AI工具：能熟练运用AI助手/大模型工具（如ChatGPT、Claude、豆包、Kimi、通义等）辅助完成会议纪要整理、信息提炼、周报月报撰写、任务拆解与结构化输出；具备基本的提示词（Prompt）设计能力，能针对不同任务场景设计有效指令，并对AI输出进行审核与修正，不照单全收；\n • 熟练使用项目管理/协作工具（如飞书、钉钉、Teambition、Notion等），具备看板和报表搭建能力。\n加分项\n • 有GM例会、经营分析会等管理层会议支持经验；\n • 有跨部门重点项目从0到1推进并落地的完整案例；\n • 具备一定的数据分析能力，能用数据说话、用看板呈现进展；能用AI工具辅助数据整理、趋势分析与可视化呈现；\n • 有将AI工具融入日常工作流、沉淀出可复用模板或SOP的经验；\n • 抗压性好，能在多项目并行、节奏快的环境中保持条理。\n我们看重的人\n • 眼里有活：不是等着被安排，而是主动发现哪里会掉链子、哪里需要协调；\n • 盯得住事：答应跟进的节点一定有着落，延期事项会提前预警而不是事后解释；\n • 说得清话：会议纪要不失真、汇报进展不注水、跨部门沟通不添乱；\n • 用得好工具：把AI当\"副驾驶\"而不是\"甩手掌柜\"，工具产出经得起核对，判断和协调仍靠自己；\n • 扛得住压：多线并行时不慌，关键时刻能顶上去推动业务往前走。\n汇报对象\nGM / 管理层（或指定的业务负责人）", "cat": "职能"}, {"id": "235", "title": "中级运营", "salary": "10-15k", "location": "未明确", "jd": "岗位职责\n1，平台增长与商业化运营\n深度参与用户增长、留存及商业变现相关工作，协助优化平台盈利模式，逐步独立承担运营策略制定与落地工作。\n2，内容运营与流量优化\n负责内容选题策划、制作发布与数据复盘优化，依托优质内容助推用户增长与转化；具备短视频剪辑、SEO 优化任一专项能力即可，可独立完成视频剪辑成片，或熟练掌握关键词布局、站内优化、流量引流等 SEO 实操技巧，全方位提升内容曝光与自然流量。\n3，用户精细化运营\n结合用户行为数据与真实反馈，深挖用户需求、梳理使用路径，参与用户分层运营，搭建精细化运营体系。\n4，活动策划与转化提升\n主导并配合完成平台各类运营活动策划与落地，持续优化活动玩法，有效拉升用户活跃度与商业转化效果。\n5，AI 工具赋能提效\n灵活运用各类 AI 工具赋能内容生产、日常运营工作，积极探索全新使用场景，大幅提升整体工作效率。\n6，项目执行与复盘迭代\n独立负责对应运营模块及重点项目推进，完成全流程落地执行，定期开展工作复盘，总结经验并输出优化方案，持续迭代运营打法。\n简历筛选核心要点\n1，从业经验要求\n有海外社交产品、同志社群平台（LGBTQ+）、兴趣社区、情感陪伴类产品运营经验者优先，熟悉相关用户群体特征、内容生态及用户增长逻辑。\n必备专项技能（二选一）\n① 短视频剪辑：熟练使用主流剪辑软件，可独立完成短视频剪辑、包装产出，具备内容审美与网感优先；\n② SEO 优化：熟悉搜索引擎规则，精通关键词挖掘、页面优化、流量提升等实操方法，有自然流量增长实操经验优先。\n2，具备商业化运营思维\n无需全盘操盘变现业务，熟知运营动作与营收收益的关联逻辑；有会员运营、付费内容推广、付费转化活动相关经验优先，洞悉用户付费需求者加分。\n3，拥有用户思维与数据分析能力\n善于站在用户视角思考问题，能整理分析用户反馈、研判用户行为，具备基础数据复盘与需求拆解能力，有用户分层、用户运营相关经验更佳。\n4，具备独立策略思考能力（重点）\n拥有主动思考与自主优化意识，可独立参与内容规划、活动设计、运营策略调整等工作，只要具备主动优化、积极复盘的思维，均可邀约面试。", "cat": "运营"}, {"id": "236", "title": "产品经理", "salary": "15-30k", "location": "未明确", "jd": "岗位职责\n1.负责内容社区类产品的产品设计、迭代与体验优化，对核心链路指标（拉新、留存等）负责。\n2.参与产品规划与版本节奏管理，完成需求调研、需求分析、方案设计、原型输出与 PRD/交互说明撰写。\n3.主导或参与核心模块建设与持续迭代，包括但不限于：内容发布与管理、内容分发、社区互动、播放/阅读体验、会员与广告体系等。\n4.建立并完善埋点与指标体系，结合数据表现与用户反馈，持续推进功能优化与体验提升，形成“上线-验证-复盘-迭代”的闭环。\n5.协调设计、研发、测试、运营等团队资源，推动需求评审、排期、联调、验收与上线，确保项目高质量按期交付。\n6.参与用户增长与商业化相关功能设计、支持广告与会员体系在产品侧的体验优化与链路打通。\n7.持续跟踪行业趋势与竞品动态，沉淀方法论与产品规范，提升产品竞争力。\n\n任职要求\n1.重点强调细心、主动性强、沟通理解能力强；\n2.本科及以上学历，3-5 年互联网产品经理经验；有内容社区产品经验优先。\n3.熟悉移动端产品设计流程，能够独立完成需求分析、原型设计（Figma/Axure/墨刀等）及 PRD/交互文档撰写。\n4.对内容社区产品核心链路有理解：内容供给、分发机制、互动体系与社区治理基础能力（至少熟悉其中 1-2 个模块）。\n5.具备基础数据分析能力与数据意识：能定义关键指标与埋点需求，能基于数据与反馈提出可落地的改进方案。\n6.具备良好的沟通协调与推进能力，能跨团队推动项目落地并处理风险与问题。\n7.学习能力强、逻辑清晰、责任心强，具备较强的问题拆解与解决能力，抗压与自驱力佳。\n8.熟练使用AI Agent提升工作效率，可AI搭建产品；\n\n\n加分项\n1.男同优先；\n2.做过内容推荐/Feed 流策略相关产品。\n3.做过会员/广告产品链路相关体验优化。\n\n应聘材料\n简历 + 代表作品（可附原型/PRD节选/作品集链接，脱敏即可）。", "cat": "产品"}, {"id": "237", "title": "运营专员（偏剪辑，简历需带作品）", "salary": "8-12k", "location": "未明确", "jd": "岗位职责\n1、根据脚本、运营需求完成短视频剪辑，包含素材筛选、粗剪精剪、调色、字幕花字、配乐音效、简单包装，独立输出竖屏成片。\n2、负责视频封面素材截取、封面剪辑排版、文字配色与出图，输出高吸引力封面图，配合提升点击率。\n3、把握视频节奏，打磨开头钩子，提升完播率；按照不同平台规范输出多版本物料，按时交付。\n4、接收反馈快速修改迭代，做好素材、工程文件、封面源文件归档，沉淀剪辑、封面模板。\n5、关注平台热点、爆款剪辑手法与封面风格，结合视频数据反馈优化剪辑与封面设计思路，参与内容头脑风暴。\n6、根据工作情况或团队安排，参与其他运营相关事项。\n7、完成其他视频相关的后期辅助工作。\n\n## 任职要求\n\n1、熟练 PR / 剪映，会达芬奇调色、AE 简单包装优先，能独立完成完整成片以及封面剪辑出图。\n2、1 年及以上短视频剪辑实战经验，网感好，懂短视频流量逻辑，有剪辑 + 封面作品作品集。\n3、镜头节奏感强，审美在线，理解脚本意图，对画面、字幕、音效、封面图文细节把控到位。\n4、执行力强，能接受修改迭代，抗压，守交付排期，沟通协作顺畅。\n5、加分：懂构图配色、有爆款视频 & 封面案例、会使用 AI 剪辑 / 作图工具。", "cat": "内容"}, {"id": "238", "title": "视频生成专员", "salary": "12-20k", "location": "未明确", "jd": "### 岗位职责\n\n- 根据分镜头脚本、参考图和提示词完成 AI 视频镜头生成。\n- 负责人物、场景、动作、表情、运镜等画面效果的生成与优化。\n- 根据审核意见修改镜头，提升有效镜头率。\n- 保证角色形象、服装、场景和画面风格在不同镜头中的一致性。\n- 配合剪辑组完成镜头交付，确保素材可剪辑、可上线。\n- 整理生成参数、提示词、参考图和成片素材，做好版本归档。\n\n### 招聘要求\n\n- 0.5 年及以上 AIGC 图像 / 视频生成实操经验。\n- 熟悉至少一种 AI 视频或图像生成工具，具备实际生成经验。\n- 能理解分镜头脚本，具备基础镜头语言和画面审美。\n- 能根据剧本和分镜要求编写、优化提示词。\n- 具备人物一致性、场景连续性和动作合理性的判断能力。\n- 能接受反复修改，按项目节点稳定交付镜头素材。\n- 有 AI 短剧相关工作经验者优先择用。", "cat": "内容"}, {"id": "239", "title": "线上推广专员", "salary": "8-10k", "location": "考核方式：底薪制，按试用期任务完成情况和带来的新用户数、付费金额考核。试用期内三件没完成的，不通过试用期。工作方式：全职、远程。", "jd": "1. 大专及以上学历，2 年以上海外线上推广或渠道推广经验，能接受男同性向内容相关产品的推广工作。\n2. 熟悉 Telegram（频道、群）、Twitter 等海外平台的引流玩法，有实际拉新成果，能说明自己负责的渠道每天带来多少新用户、多少付费。\n3. 了解网站 SEO 基本逻辑，有搜索引擎流量增长经验者优先。\n4. 自己有在运营的 Telegram 频道/群、社交账号或网站，或者有合作过的站长、代理资源者优先。\n5. 会看数据、会写文案，能独立把一个推广渠道从 0 做到每天有稳定新用户。\n6. 能远程全职工作，自驱力强，回消息及时，接受按新用户和付费数据考核。\n---\n筛选注意\n只做过抖音、小红书、微信等国内平台的不匹配；只做过广告投放、没做过引流的不匹配；简历里没有具体数据的不匹配。\n\n岗位职责\n\n1. 负责产品在 Telegram（频道、群）和 Twitter 等海外社交平台的推广与引流，持续带来新用户。\n2. 负责官网的搜索引擎优化（SEO），提升自然搜索带来的用户。\n3. 开拓和维护外部合作的网站、代理，洽谈合作、安排推广位、跟进效果。\n4. 每周对各推广渠道做数据复盘，效果好的加大投入，效果差的及时停掉。\n5. 整理推广所需的图片、文案、链接等素材需求，和设计、技术对接落地。\n6. 按要求输出日报、周报，汇报各渠道的新用户、付费和下一步计划。\n\n试用期内需完成：\n1. 至少 2 个线上推广渠道从 0 搭建并开始带来新用户\n2. 开拓至少 5 家外部合作网站或代理并上线\n3. 每周渠道数据复盘报告\n\n考核方式：底薪制，按试用期任务完成情况和带来的新用户数、付费金额考核。试用期内三件没完成的，不通过试用期。工作方式：全职、远程。\n\n\n---\n加分项\n1. 自带成人类或男同类站长、代理资源，入职就能开展合作。\n2. 自己做过成人类网站或引流账号从 0 到有量的案例。\n3. 会做简单的推广图片和文案。", "cat": "商务 / 市场"}, {"id": "240", "title": "渠道运营专员（数据与工具方向）", "salary": "8-10k", "location": "考核方式：上面三件是否按期跑起来并稳定；报表准确率、对账差错率、省下的人工。试用期内三件没按期做出来的，不通过试用期。工作方式：全职、远程。", "jd": "1. 大专及以上学历，1 年以上运营、推广或渠道相关的数据统计、对账经验，能接受男同性向内容相关产品。\n2. 会用 AI 工具（如 ChatGPT、Claude）写小脚本、做小工具，或者会 Google 表格/Excel 的脚本和公式，能把重复的统计、填表工作做成自动的；自己做过 Telegram 机器人或自动报表的优先。\n3. 看得懂新增用户、付费、投入产出这些基础指标，能从数据变化里发现异常。\n4. 熟练使用 Google Sheets / Excel，能整理数据、做报表。\n5. 执行力和配合度高：工作时间内消息 30 分钟内必回，交办的事当天有回复；做出来的工具要持续维护，不是做完就放着。\n6. 细心、按流程办事，能接受多项杂事并行；能远程全职工作。\n\n---\n加分项\n1. 做过自动化脚本、机器人或自动报表，能说明省了哪些人工。\n2. 有成人类产品推广或渠道对接经验。\n3. 会简单的 Python。\n\n---\n筛选注意\n只会 Excel 手工整理、没用过 AI 工具和脚本的不匹配；纯开发、没做过运营数据的不匹配；只想做工具不愿意接日常杂事的不匹配。面试时要问清每天在线时段和回消息习惯。\n岗位职责\n\n1. 协助渠道负责人对接合作的网站和代理：生成推广链接、发给合作方、跟进上线。\n2. 日常维护：帮合作方更换链接和宣传图，登记点击数据，按表格跟进每条合作的状态。\n3. 整理结算：每期给合作方的结算单、付款资料、对账，按时交给财务。\n4. 数据报表：每天从后台导出数据做成日报周报；按合作渠道算投入产出；发现数据异常、合作到期及时提醒。\n5. 工具建设：用 AI 工具、脚本或机器人把生成链接、填表、出报表、到期提醒这些重复工作自动化；维护团队的共享表格和小工具。\n6. 完成渠道负责人交办的其他事务。\n\n试用期内需完成：\n\n1. 把每天的渠道日报、周报做成自动出：从后台导出的数据，用脚本或 AI 工具自动算出每条渠道的新增、付费、投入产出，填进共享表格，人只做检查\n2. 做一个 Telegram 提醒机器人：合作到期、渠道掉量这类提醒每天自动发给负责人\n3. 结算单半自动：按模板由脚本生成对账单，人工复核，一期无差错\n\n考核方式：上面三件是否按期跑起来并稳定；报表准确率、对账差错率、省下的人工。试用期内三件没按期做出来的，不通过试用期。工作方式：全职、远程。", "cat": "商务 / 市场"}, {"id": "241", "title": "中高级人事专员 (台湾办公室岗位)", "salary": "45-55kTWD", "location": "台湾办公室岗位", "jd": "🌟招聘需求\n1.人資相關制度規章辦法、流程與表單等維護、修訂或新增建立\n2.新人教育訓練/離職人員勸退訪談/人事資料管理與維護處理人員加、退勞健保與團保\n3.人員出勤管理，輸入匯入每日出勤表，了解人員實際出勤狀況\n4.員工相關福利建置/員工關係維護\n5.活動規範籌備(例:尾牙、部門聚餐、跨部門團康活動)\n6.薪資計算及審核\n7.對外接洽勞保局、健保局等政府單位窗口業務\n8.協助主管製作各類表單，及提供人事行政作業流程\n\n🌟專業知識與技能\n熟悉勞動基準法、勞工保險條例、全民健康保險法等相關勞動法規\n具備勞健保加退保實務操作經驗\n具備薪資計算與審核實務經驗\n熟悉勞資會議召開流程及會議紀錄撰寫\n具備政府機關公文寫作能力（正式行政文書往來經驗）\n有勞動檢查應對或勞資爭議調解處理經驗者優先\n\n🌟學經歷\n大學以上學歷，人力資源、勞工關係、法律、企業管理相關科系尤佳\n至少2年以上人資相關工作經驗\n\n🌟工具能力\n熟悉 Excel（含公式應用，如薪資計算、出勤統計等）\n熟悉 Word、PowerPoint 等辦公軟體\n具備 AI 工具應用能力（如運用 ChatGPT、Claude 等 AI 工具協助公文撰寫、資料整理、流程優化等）者優先\n\n🌟其他條件\n1、積極態度、主動負責。\n2、邏輯清晰，善於溝通協調。\n3、細心、耐心、配合度高、穩定性高。\n4、抗壓性佳，能應對政府單位稽查等突發狀況。", "cat": "职能"}, {"id": "242", "title": "SSC专员", "salary": "10 - 15K", "location": "2. 具备3年以上人事行政相关工作经验，有互联网行业或远程办公场景经验者优先；", "jd": "1. 本科以上学历，行政管理、人力资源管理等相关专业优先；\n2. 具备3年以上人事行政相关工作经验，有互联网行业或远程办公场景经验者优先；\n3. 熟悉人事行政基础流程，能够熟练使用 Excel、Word、PPT 等办公软件，具备较好的数据整理、统计及报表处理能力；\n4. 具备基础 AI 使用能力，能够理解并配合 AI 工具辅助工作；有 OpenClaw、Claude 等工具使用经验者优先，此项为重要加分项；\n5. 具备良好的沟通协调能力和执行力，工作细致认真，责任心强，能够妥善处理敏感信息并适应多任务工作节奏。\n6. 具备较强的抗压能力，能够在多任务并行、节奏较快及事务繁杂的工作场景下保持稳定执行，确保工作质量和时效性。\n\n岗位职责：\n\n1. 负责员工入职、离职、调岗、转正等异动流程办理与跟进，确保流程执行及时、规范；\n2. 负责员工信息、花名册、档案等基础资料的维护与更新，保障数据准确、完整；\n3. 负责考勤、费用及基础人事行政数据的统计、复核与相关报表输出；\n4. 执行日常人事行政基础流程，包括考勤管理、档案管理、制度落实及基础事务办理；\n5. 配合业务、财务及相关协同部门完成对接工作，跟进异常问题及临时事项处理；\n6. 能结合 AI 工具辅助完成数据整理、流程跟进及重复性事务处理，持续提升工作效率。", "cat": "职能"}, {"id": "243", "title": "中高级运营", "salary": "10-18k", "location": "未明确", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。", "cat": "运营"}, {"id": "244", "title": "中高级运营", "salary": "10k-18k", "location": "9、能接受远程办公，保证工作时间在线响应", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，熟练使用 Google GSC 站长平台|yandex站长平台，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。                                                                                                                                         9.懂社群运营，懂这些平台运营优先Telegram，Discord， X，WhatsApp。\n9、能接受远程办公，保证工作时间在线响应\n加分项：\n1、有成人向/泛娱乐/吃瓜类内容运营经验\n2、有矩阵账号批量运营经验\n3、熟悉Agent自动化发布流程以及各个平台多节API路径\"", "cat": "运营"}, {"id": "245", "title": "主编", "salary": "10K-15K", "location": "未明确", "jd": "岗位职责\n1. 负责平台热点内容的标题策划、正文撰写及内容包装；\n2. 根据热点事件快速输出具有点击力、传播力和讨论度的文案；\n3. 负责神评论、热评、互动评论及评论区趣味内容创作；\n4. 负责段子、网络梗、趣味表达及年轻化内容创作；\n5. 持续关注全网热点，挖掘适合平台用户的内容选题；\n6. 参与吃瓜原创关键词、网络热词、特色表达及内容标签的创作；\n7. 使用AI工具完成资料整理、信息提炼和初稿辅助，并进行人工深度创作；\n8. 根据内容点击率、阅读率及互动数据不断优化文案表达。\n\n任职要求\n1. 具备互联网内容、媒体、自媒体、新媒体或文案相关工作经验；\n2. 中文表达能力较强，能够独立完成标题、正文、评论及段子创作；\n3. 对娱乐热点、社会热点及网络流行文化敏感；\n4. 有较强的网感，熟悉年轻用户的语言习惯和内容偏好；\n5. 能够快速理解热点事件，并找到有吸引力的文案切入角度；\n6. 具备较强的原创意识，不依赖简单搬运和机械改写；\n7. 能熟练使用AI工具辅助创作，但具备独立思考和人工创意能力；\n8. 有爆款标题、爆款文章、热门评论或自媒体运营经验者优先。", "cat": "其他"}, {"id": "246", "title": "舆情收集员", "salary": "8K-15K（优秀面议）", "location": "未明确", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "其他"}, {"id": "247", "title": "SEO专员", "salary": "10-18k", "location": "未明确", "jd": "一、岗位职责\n1、负责公司多个网站的 Google、Yandex SEO优化及日常维护，持续提升网站收录、关键词排名及自然搜索流量。\n2、负责网站日常SEO巡检及数据监控，通过 Google Search Console、GA4、Yandex Webmaster 等工具监控收录、排名、流量、Spider抓取及异常波动。\n3、负责网站基础及技术SEO优化，包括 TDK、H标签、Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL路由、分页、Tag、内链、结构化数据、HTML源码输出等。\n4、负责自然搜索流量下降、关键词排名下降、收录异常、404、异常URL、Spider抓取异常等问题的排查，并能够根据数据定位原因及提出解决方案。\n5、负责网站域名迁移、CDN域名、直连域名及多域名SEO相关工作，配合处理301重定向、域名规范、搜索引擎抓取、索引及流量承接等问题。\n6、根据SEO问题独立整理优化需求，与运营、产品、前端、后端及技术人员进行沟通，并负责测试服验收、正式服复查及上线后的数据验证。\n7、参与新站及网站重构项目SEO建设，制定和检查 URL、TDK、H标签、Sitemap、Robots、Tag体系、结构化数据及页面模板等基础SEO规范。\n8、负责关键词挖掘、竞争站分析、页面关键词优化及外链资源建设，持续扩大关键词覆盖及自然搜索流量。\n9、使用 ChatGPT、Claude、AI/SEO工具辅助数据分析、站点巡检、Spider模拟、异常URL筛选及需求整理，提高SEO工作效率。\n二、任职要求\n1、1年以上SEO实操经验优先，有独立负责网站SEO项目经验，有实际收录、关键词排名或自然搜索流量提升案例。\n2、熟悉 Google SEO基本机制，有 Yandex SEO实操经验优先。\n3、熟悉 GSC、GA4、Yandex Webmaster 等SEO及数据分析工具，能够独立完成基础数据分析。\n4、熟悉 Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL、Tag、结构化数据等技术SEO基础。\n5、能够看懂基础HTML源码及HTTP状态码，具备Spider抓取、页面状态及技术SEO问题的基本排查能力。\n6、具备一定前后端开发基础者优先，能够看懂基础 HTML、JavaScript 及常见前后端页面逻辑；理解服务端渲染、接口请求、URL路由、HTTP状态码及缓存等基础概念，能够初步判断SEO问题属于前端渲染、后端逻辑还是服务器/CDN配置问题。\n7、具备较好的数据分析及问题定位能力，面对流量、收录、排名异常时，能够从数据、页面、域名、抓取及技术实现多个维度进行排查。\n8、能够独立编写SEO需求文档，并与运营、产品及技术团队沟通推进开发、测试及上线验收。\n9、有多站点SEO、CDN、多域名管理、网站迁移、技术SEO经验者优先。\n10、有关键词挖掘、外链建设、Tag/聚合页及页面结构优化经验。", "cat": "运营"}, {"id": "248", "title": "AI 短剧编剧组组长", "salary": "20–30K", "location": "未明确", "jd": "岗位职责\n1. 负责选题池、开发池和可生产剧本库的建设，统筹内部创作、外包撰写及版权采购，保障与制作计划匹配的剧本供给。\n2. 指导编剧完成故事主线、人物设定、分集结构、对白、钩子与断点设计，使剧本达到制作人员无需重新策划即可执行的程度。\n3. 组织剧本质量及合规审核，与视频生成团队开展制作可行性会审；剧本未锁定、审核未通过，不进入资产生产。\n4. 管理外包与采购剧本的需求、交付和审核，核心主线、核心人设及合规风险判断由内部掌握。\n5. 跟踪剧本采纳率、可生产储备、上线表现及续作潜力，根据观众反馈和播放数据持续优化内容。\n6. 带领编剧及审核人员开展评本、互评和复盘，沉淀创作模板、审核标准与《AI 制作约束清单》。\n7. 培养储备组长，推动团队形成稳定的内容判断和交付能力。\n任职要求\n1. 有短剧编剧、影视策划、网文编辑或相关内容经验，具备可展示的作品、编辑案例或项目成果。\n2. 能判断题材价值、剧情逻辑、人物动机、冲突与情绪节奏，能够给出具体、可执行的修改意见。\n3. 理解短剧的开场吸引力、爽点、钩子及分集断点，能够兼顾内容效果与制作可行性。\n4. 具备带领编剧和审核人员协同工作的能力，能够指导他人产出、建立标准并培养人才。\n5. 接受 AI 辅助创作，能结合 AI 制作特点调整剧本表达，减少下游理解偏差和返工。\n6. 具备版权与内容合规意识，能够按公司标准组织审核；接受以采纳率、上线表现和储备质量衡量工作成果。\n**优先背景：**短剧编剧总监、网文平台主编、影视策划负责人或具备带队能力的资深编辑。", "cat": "AI / AIGC"}, {"id": "249", "title": "AI 内容美术组组长", "salary": "18–25K", "location": "未明确", "jd": "岗位职责\n1. 根据导演确定的内容调性，统筹角色、场景、道具及视觉风格设计，保障跨镜头、跨剧集的视觉一致性。\n2. 组织核心角色和主要场景的设计、评审与锁定；关键资产未确认，不进入大规模生产。\n3. 制定并落实角色设定、三视图、参考图及资产规格，明确资产编号、版本和复用关系。\n4. 对接视频生成团队，将美术资产转化为可稳定使用的制作素材，及时解决角色漂移、场景不一致及素材不适配等问题。\n5. 配合导演和生成团队完成分镜所需的视觉支持；分镜具体归属由导演按项目确定。\n6. 建设部门共享资产库，沉淀优质角色、场景、风格及相关参数，提升复用率并按要求回流。\n7. 安排组员任务、审核美术交付、组织带教与复盘，培养储备组长。\n任职要求\n1. 有动画、游戏、影视或相关视觉设计经验，具备角色、场景或视觉设定作品及团队协作经验。\n2. 具备扎实的审美和设计判断力，能够把握角色特征、构图、色彩、风格及画面一致性。\n3. 熟悉或能够熟练适应 AI 图像制作流程，能将传统设计能力转化为可供 AI 视频生产使用的资产。\n4. 理解角色一致性、素材规格、版本管理及资产复用要求，具备建立资产规范的能力。\n5. 能与导演、编剧和生成团队有效沟通，将内容需求转化为明确、可执行的美术任务。\n6. 具备任务分配、质量把关和带教能力，接受标准化工作流及数据考核。\n**优先背景：**动画或游戏美术组长、角色设计负责人，以及具备 AI 工作流和带队经验的视觉设计骨干。", "cat": "AI / AIGC"}, {"id": "250", "title": "AI 短剧剪辑组组长", "salary": "18–25K", "location": "未明确", "jd": "岗位职责\n1. 负责短剧剪辑、声音设计及后期交付，与导演对齐剪辑调性，保障剧情清楚、节奏顺畅、情绪表达准确。\n2. 统筹剪辑、配音配乐、音效、字幕及成片输出，推动音频工作纳入统一后期流程。\n3. 承担成片质检职责，按故事线、画面、语言、转场、配音、一致性六个维度组织验收，确保综合评分达到公司标准。\n4. 检查并推动清除成片硬性错误，对其他质量问题形成明确处理结论；核对封面、命名、分辨率、码率等交付要求。\n5. 严格执行素材准入要求，发现不合格镜头及时退回生成环节，避免依靠后期反复补救前端质量问题。\n6. 建立剪辑样板、成片检查清单及交叉复核机制，跟踪一次通过率、返工次数和交付周期。\n7. 负责组员任务安排、音频与剪辑带教，培养储备组长，并将上线反馈用于节奏和后期表现优化。\n任职要求\n1. 有短视频、短剧或影视后期经验，具备可展示的剪辑作品、审片案例或项目交付成果。\n2. 具备较强的叙事和节奏判断力，能够识别剧情衔接、信息重复、情绪断裂及声音表现等问题。\n3. 熟悉剪辑、配音配乐、字幕及视频输出流程，能够独立完成成片交付并指导组员。\n4. 具备成片质量判断能力，能够依据统一标准评分，并给出具体问题、退回理由和修改建议。\n5. 理解 AI 视频常见质量问题，能够区分应由前端重新生成的问题与可在后期合理修正的问题。\n6. 具备流程建设、任务统筹和带教能力，接受 AI 工具、标准化制作及数据考核。\n**优先背景：**短剧后期负责人、剪辑主管，或具备审片、质检及带教能力的资深剪辑师。", "cat": "AI / AIGC"}, {"id": "251", "title": "产品质验员", "salary": "10-18k", "location": "未明确", "jd": "一、工作职责\n1、产品质量巡检\n负责公司APP、站点日常全场景巡检，排查功能异常、交互缺陷、适配问题、用户使用障碍等各类产品质量问题，精准记录、复现问题，明确问题影响范围。\n2、运营质量督查\n核查线上内容发布、素材质量、标签分类、线上活动等各类运营动作，对标公司运营标准，杜绝不规范、低质量线上产出，保障运营工作合规落地。\n3、业务SOP落地核查\n对照公司各业务SOP，抽查各团队流程执行情况，及时发现执行遗漏、偏差、不规范等问题，推动业务流程标准化落地。\n4、问题闭环全流程管理\n巡检问题及时同步对应业务群、对接负责人整改；常态化维护问题跟进台账，完成问题登记、跟进、复核、验收全闭环，保障问题清零不积压。\n5、跨部门协同优化\n联动产品、技术、运营、UI等团队对接问题整改，跟进修复进度，参与问题复盘，推动共性质量问题专项优化。\n6、质量数据与经验沉淀\n汇总日常巡检高频问题、典型案例，整理基础质量数据，协助组长迭代优化巡检标准与核查规范，支撑部门月度、季度质量工作输出。\n二、任职要求\n1、基本条件\n• 本科及以上学历，有互联网质检、督导、运营审核相关工作经验，熟悉APP、网站线上业务流程，有视频产品者优先。\n2、专业能力要求\n- 观察力敏锐，能精准识别产品、运营各类质量问题与执行偏差；\n- 具备基础业务逻辑能力，可快速理解产品规则与业务SOP；\n- 熟练使用Excel，可独立完成问题台账登记、数据整理统计；\n- 具备基础总结复盘能力，可沉淀巡检问题与工作经验。\n3、综合素质要求\n- 细心严谨、责任心强，对质量问题敏感，工作无疏漏；\n- 执行力高效，能保质保量完成巡检及问题闭环工作；\n- 沟通协调能力良好，可高效完成跨部门对接工作；\n- 结果导向，服从团队管理，主动学习提升专业能力。\n4、加分项\n- 有互联网质检、运营督导、流程稽查及问题台账管理经验优先；\n- 具备用户体验思维，能够主动预判、发现业务潜在质量风险优先。", "cat": "其他"}, {"id": "252", "title": "AI 应用算法工程师（多模态 / Agent 方向）", "salary": "面议", "location": "未明确", "jd": "岗位职责\n1. 负责大语言模型、图像及视频模型的选型、接入与应用开发，推动 AI 能力在实际业务中落地。\n2. 根据业务需求开展模型调优，包括数据准备、Prompt 优化、模型微调及效果评估，持续提升输出质量与稳定性。\n3. 设计和开发 Agent 智能体，实现工具调用、知识库检索、任务规划及工作流编排。\n4. 参与图像、视频处理相关功能开发，将视觉算法与多模态模型整合到业务流程中。\n5. 完成模型服务与业务系统的集成、部署和维护，优化响应速度、资源消耗及使用成本。\n6. 参与短剧业务的 AI 工作流设计与开发，覆盖剧本解析、分镜拆解、角色与场景设定、图像及视频生成、配音字幕、剪辑合成等环节。\n7. 将模型、Agent 与音视频处理工具整合为可批量运行的自动化流程，支持任务调度、进度跟踪、失败重试和人工审核。\n8. 针对短剧制作中的角色一致性、画面连贯性、音画同步等问题，开展效果评估与优化。\n任职要求\n1. 有实际软件开发经验，熟练使用 Python，具备良好的编码、接口开发、调试和问题排查能力。\n2. 具备一定的计算机视觉基础，了解图像与视频处理流程，对检测、分割、识别等常见任务有基本认识。\n3. 理解 LLM、图像及视频模型的基本原理、能力边界和应用场景，能够根据任务选择合适的模型与技术方案。\n4. 具备模型调优实践经验，了解 SFT、LoRA 等微调方法，能够通过数据和评测结果分析、改进模型效果。\n5. 熟悉 Agent 的基本架构，有工具调用、RAG、工作流或多智能体协作相关开发经验。\n6. 能够独立推进功能开发，具备业务理解能力、学习能力及团队协作意识。\n7. 有短剧制作、AI 短剧生成或短剧出海相关工作流经验，理解从素材输入到成片交付的主要环节，能够识别适合 AI 自动化的业务场景。\n加分项\n- 有图像生成、视频生成或编辑、视觉识别等项目落地经验。\n- 有模型私有化部署、GPU 推理优化或服务性能优化经验。\n- 有独立完成 AI 产品从原型到上线的经历，或可展示的项目、作品及开源贡献。\n- 有短剧翻译配音、字幕处理、视频剪辑、封面生成、素材质检等项目经验。\n- 有 ComfyUI 或其他模型工作流编排工具的使用、二次开发及服务化经验。\n• 有短剧批量生产或处理平台的实际落地经验，能够兼顾成片质量、处理效率与成本。\n我们更看重实际项目经验、动手能力和交付结果。投递时请附相关项目介绍，并说明个人负责的部分、技术方案及取得的效果。", "cat": "AI / AIGC"}, {"id": "253", "title": "AI内容编辑（加急）", "salary": "10K – 20K", "location": "未明确", "jd": "AI内容编辑（创作 / 漫改 / 魔改方向）\n\n岗位方向\n\n我们正在组建AI驱动的动漫、漫画内容团队。\n\n\n\n剧本内容由专门的剧本团队负责，本岗位主要负责将已有的剧本、分镜及内容创意，通过AI工具转化为动漫、漫画、短视频等视觉内容。\n\n\n\n我们不要求候选人一开始就具备非常完整的AI技术栈，更关注实际内容制作能力、基础视觉审美，以及对新工具、新工作流的学习和落地能力。\n\n\n\n有动漫、漫画、短视频、设计、AI创作等相关经验者优先考虑，其他类型经验如具备相关作品或较强学习能力，也可以投递。\n\n简历及作品要求\n\n投递时请提供简历及相关作品。\n\n\n\n作品形式不限，可以是：\n\n\n\nAI漫画、AI图片、AI短片；\n\n角色设计、场景设计；\n\n个人练习作品；\n\n商业项目或团队项目作品。\n\n\n\n不强制要求作品必须为独立完成，只要能够体现个人实际制作能力即可。\n\n\n\n如有以下内容，也欢迎一并提供：\n\n\n\nAI内容制作过程或工作流截图；\n\nComfyUI、Stable Diffusion等工具使用案例；\n\n个人运营的新媒体账号及相关作品数据。\n\n岗位职责\n\n根据剧本团队提供的脚本、分镜或内容需求，完成AI动漫、AI漫画、AI短视频等内容制作。\n\n\n\n使用AI绘图、AI视频等工具完成人物、场景及画面的生成、调整和优化，保证整体视觉效果符合项目要求。\n\n\n\n配合团队优化角色一致性、画面风格及内容呈现效果，提高内容制作效率。\n\n\n\n根据项目需要，对已有AI工作流进行使用、调整和优化。\n\n\n\n参与内容选题、IP方向及视觉风格讨论，从画面呈现及用户审美角度提供建议。\n\n\n\n持续关注AI绘图、AI视频领域的新模型、新工具及新玩法，并尝试应用到实际内容生产中。\n\n\n\n与剧本、运营及相关团队协作，根据反馈持续调整和优化内容。\n\n任职要求\n\n有AI绘图、AI视频、设计、动漫制作或其他相关内容创作实践经验，能够提供相关作品。\n\n\n\n使用过一种或多种主流AI创作工具，例如ComfyUI、Stable Diffusion、Midjourney、即梦、Kling、Vidu、Runway等。\n\n\n\n具备基本的图片或视频生成、调整能力，能够根据需求修改提示词、参数或现有工作流。\n\n\n\n对画面效果有基本判断能力，能够关注人物、构图、风格统一及内容呈现。\n\n\n\n学习能力较强，愿意主动学习新的AI模型、插件及内容制作方法。\n\n\n\n具备良好的沟通和协作能力，能够根据项目反馈及时调整作品。\n\n加分项\n\n有ComfyUI工作流搭建或优化经验。\n\n\n\n了解或使用过LoRA、ControlNet、IPAdapter等工具。\n\n\n\n有AI动漫短剧、AI漫画、条漫、漫改或小说改编项目经验。\n\n\n\n有角色一致性、批量出图、AI视频动态化等实际制作经验。\n\n\n\n会使用AE、Live2D、Blender、Nomad等设计或动画工具。\n\n\n\n有Python、自动化或批量内容处理经验。\n\n\n\n对动漫、漫画、二次元内容感兴趣，具备一定的视觉审美和内容判断能力。\n\n\n\n有二次元、新媒体、动漫账号运营经验，或对动漫、漫画、轻小说等内容趋势较为熟悉。", "cat": "AI / AIGC"}, {"id": "254", "title": "新媒体运营组长（加急）", "salary": "20k - 25k", "location": "英国", "jd": "\"必看项\n1. 负责公司二次元 / 动漫相关新媒体账号整体运营，统筹国内外主流社媒平台内容运营与账号增长，包括但不限于：B 站、微博、小红书、抖音、微信公众号、LOFTER（国内），以及 X（Twitter）、TikTok、Instagram、YouTube、Discord、Reddit（海外）。\n2. 负责策划并输出符合年轻用户审美的 ACG 内容，包括但不限于：动漫热点追踪、二创内容、meme 梗图、角色向内容、圈层热点话题；根据不同平台特性制定差异化内容策略，提升账号曝光、互动率与粉丝增长；可独立完成热点策划与内容传播全流程。\n3. 深度理解二次元用户生态与圈层文化，维护社区氛围，提升用户活跃度与粘性；快速追踪 ACG 热点与用户情绪变化；与 UP 主、Coser、绘师、KOL 等建立并维护合作关系，扩大内容影响力。\n4. 带领运营团队推进内容项目，制定内容节奏与运营目标，根据数据反馈持续优化内容方向与传播策略，确保各平台账号持续健康增长\n\"\n\"3年以上新媒体运营经验，有团队管理经验优先；\n重度二次元用户，熟悉动漫、游戏、VTuber、Cosplay、同人文化等；\n网感强，懂年轻人表达方式和互联网语境；\n熟悉国内外主流社媒平台运营逻辑；\n有成功账号运营案例或爆款内容经验；\n具备优秀的内容策划与文案能力。\"", "cat": "运营"}, {"id": "255", "title": "高级产品经理", "salary": "18k-35k", "location": "未明确", "jd": "一、岗位职责：\n\n1. 负责付费内容APP（漫画/视频/动漫/小说等）整体产品规划、功能设计及版本迭代，业务覆盖多元内容形态，主导产品路线图制定与执行；\n2. 深入分析用户需求、市场趋势与竞品动态，制定产品发展策略，明确核心功能定位与迭代优先级；\n3. 持续优化现有变现体系（会员订阅、付费内容、广告等），平衡用户体验与商业变现，推动项目收益最大化；\n4. 对DAU、留存率、付费转化率等核心业务指标全面负责，建立数据监控与归因体系，持续推动指标提升；\n5. 熟悉内容产品「生产—分发—消费」全链路闭环，主导内容标签体系与推荐策略的建设与持续优化；\n6. 结合AI能力为业务赋能提效，将AI工具合理融入内容推荐、数据分析及产品设计日常工作；\n7. 与设计、研发、运营、市场等团队紧密协作，高效推动跨部门项目按期高质量落地；\n8. 持续跟踪行业动态与新技术趋势，探索差异化产品创新方向，保持产品竞争力；\n\n二、任职要求：\n\n1. 5年以上产品经理经验，其中2年以上内容平台产品经理经验，具备完整App产品0到1核心角色经历，独立主导过单一产品线或核心模块的长期迭代；\n2. 具备会员订阅、付费内容等流量变现成功实操经验，熟悉广告、会员、虚拟付费等多元变现模式；\n3. 数据能力扎实，理解数据「产生—收集—使用」完整闭环，有埋点设计、数据指标体系搭建经验，熟练运用A/B测试驱动产品优化，能独立出具数据分析报告，对数据波动具备敏锐感知与正确归因能力；\n4. 对AI能力边界有清晰认知，熟练使用Claude Code / Cursor / Codex等AI生产力工具，并能将AI合理应用于产品设计与日常工作提效；\n5. 具备优秀的跨部门沟通协作能力，能独立承接业务与运营诉求，主导复杂项目高效推进落地；\n6. 对二次元、ACGN内容生态有浓厚兴趣，具备二次元用户消费心理与社区文化认知者优先；", "cat": "产品"}, {"id": "256", "title": "AI动漫短剧编剧", "salary": "10k-25k", "location": "未明确", "jd": "AI动漫短剧编剧（小说改编方向）\n\n岗位介绍\n\n本岗位主要负责公司AI动漫短剧项目的剧本创作与小说改编工作。\n\n\n\n公司会提供已有小说、网文内容及基础项目方向，无需自行寻找内容来源。你需要结合AI动漫短剧的内容形式，对原有小说进行故事拆解、人物关系梳理、剧情取舍、节奏调整、结构重组及分集改编，最终输出具备实际制作可行性的短剧剧本。\n\n\n\n岗位核心工作以小说/网文改编为主，需要将篇幅较长、信息量较大的原著内容，转化为节奏更快、冲突更集中、画面表达更明确的AI动漫短剧内容。\n\n\n\n我们不要求候选人必须拥有成熟的AI动漫项目经验，更关注你的故事理解能力、剧情改编能力、短剧节奏感及持续学习能力。\n\n\n\n有短剧、网文、小说、漫画脚本、动漫剧情、影视、剧情短视频、游戏剧情等相关创作经验均可。\n\n岗位职责\n\n阅读并理解公司提供的小说、网文内容，快速梳理主要人物、人物关系、故事主线、核心冲突及内容卖点。\n\n\n\n根据AI动漫短剧的内容形式，对原小说进行剧情取舍、结构调整、节奏优化及适当重构。\n\n\n\n结合项目篇幅，对原著中的支线剧情、人物及事件进行合理删减、合并、前置或调整，使核心剧情更加集中。\n\n\n\n完成故事梗概、人物小传、分集大纲及完整分集剧本创作。\n\n\n\n将小说中的叙述、心理活动、背景介绍等文字内容，转化为具体的场景、人物动作、对白及可视化剧情表达。\n\n\n\n结合不同题材及目标受众，设计具有吸引力的开篇、冲突、爽点、情绪节点、反转、悬念及结尾钩子。\n\n\n\n在保证原故事核心设定和人物逻辑的基础上，对不适合短剧表达的内容进行合理改编。\n\n\n\n配合项目负责人，根据审核及制作反馈，对剧本内容进行修改和优化。\n\n\n\n逐步了解AI动漫制作的基本特点，在创作过程中兼顾人物数量、场景复杂度、动作设计及画面实现难度。\n\n\n\n与项目、制作等团队保持沟通，按计划同步创作进度及可能影响交付的问题。\n\n任职要求\n\n有编剧、网文创作、小说创作、漫画脚本、动漫剧情、短剧、剧情短视频、影视策划、游戏剧情等相关创作经验。\n\n\n\n具备较好的小说阅读和故事理解能力，能够快速提炼人物关系、核心矛盾及剧情重点。\n\n\n\n具备一定的内容改编能力，能够根据短剧篇幅对原小说进行删减、调整、压缩及结构重组。\n\n\n\n对短剧、网文、动漫、漫画等内容形式有一定了解，能够理解快节奏、强冲突、高情绪密度的内容表达方式。\n\n\n\n能够将文字剧情转化为具体场景、人物行为及对白，使剧本具备较好的画面感和制作可执行性。\n\n\n\n具备基本的剧情连续性和人物逻辑判断能力，能够保证改编后故事完整、人物行为合理。\n\n\n\n能够按照项目要求完成创作，并根据审核意见进行合理修改。\n\n\n\n具备良好的沟通、协作及时间管理能力。\n\n\n\n对AI动漫、AI短剧等新内容形式感兴趣，并愿意学习相关制作逻辑。\n\n加分项\n\n有短剧、动态漫、AI动漫或漫画项目经验。\n\n\n\n有小说、网文或成熟IP改编经验。\n\n\n\n有已上线、已制作或能够展示的完整编剧作品。\n\n\n\n擅长长篇小说的剧情压缩、短篇化改编及结构重组。\n\n\n\n熟悉男频逆袭、玄幻、都市、悬疑、复仇、冒险、热血等强情节题材。\n\n\n\n熟悉女频情感、甜宠、家庭、豪门、成长、虐恋等强情绪题材。\n\n\n\n有系列化剧情开发或连续人物塑造经验。\n\n\n\n具备较强的网感，对当前短剧、网文及动漫内容趋势有一定敏感度。\n\n\n\n了解AI图片、AI视频或AI动漫制作流程及基本能力边界。\n\n项目形式\n\n项目以小说、网文改编为主要内容方向，根据原著内容及项目需求进行AI动漫短剧化改编。\n\n\n\n单部短剧原则上约 8集，单集约 3–5分钟。\n\n\n\n具体集数、篇幅及内容结构可根据原著体量、剧情复杂度及实际制作要求进行调整。\n\n\n\n前期以熟悉项目标准及创作流程为主，稳定期月度完成约2部完整短剧，具体根据项目难度及团队排期安排。\n\n\n\n最终剧本需具备较完整的剧情结构、人物逻辑及画面表达，能够支持后续AI动漫制作环节推进。", "cat": "AI / AIGC"}, {"id": "257", "title": "网站运营", "salary": "8k - 20k", "location": "未明确", "jd": "网站运营\n\n岗位职责\n\n网站整体运营与增长\n\n负责网站日常运营及整体运营策略落地，围绕新增、活跃、留存、转化、付费及营收等核心指标制定并执行运营方案。\n\n参与网站从 0 到 1 的运营搭建，包括用户体系、内容体系、活动体系及运营流程建设，推动网站持续增长。\n\n根据业务发展阶段制定冷启动、用户增长及规模化运营策略，持续提升网站整体流量及用户规模。\n\n内容运营与用户留存\n\n负责网站内容体系的规划、运营及优化，根据用户需求和数据表现持续调整内容方向。\n\n优化网站首页、频道页、详情页、推荐位等核心页面的内容结构与展示逻辑，提升点击率、浏览深度、停留时长及用户留存。\n\n参与内容选题、专题策划、活动策划及内容分发，提升内容产出效率和内容对用户增长、留存及转化的贡献。\n\n建立内容运营标准及内容质量评估机制，持续提升网站内容质量和用户体验。\n\nSEO及流量增长\n\n负责网站 SEO 运营，包括关键词布局、页面结构、站内链接、专题页、内容优化及搜索流量增长等。\n\n分析自然搜索、社媒、外部渠道等不同流量来源，持续优化流量获取及分发策略。\n\n关注行业及竞品网站运营情况，挖掘新的流量增长机会，提升网站整体曝光及自然流量。\n\n数据分析与运营优化\n\n日常跟踪网站核心数据，包括 UV、PV、注册、DAU、留存、访问深度、跳出率、转化率、付费率及营收等。\n\n基于数据分析用户访问及转化路径，定位流量、内容、产品及转化环节中的问题，并提出可执行的优化方案。\n\n建立并持续完善网站运营数据指标体系，通过数据驱动内容、活动、页面及用户运营策略迭代。\n\n根据数据反馈持续进行 A/B Test 及运营策略调整，提升网站整体运营效率。\n\n用户增长与转化\n\n围绕“流量获取—用户注册—内容消费—用户留存—付费转化”完整链路进行运营优化。\n\n负责会员、付费内容、订阅、活动及其他商业化场景的运营，持续提升用户转化率及用户价值。\n\n针对不同用户生命周期制定差异化运营策略，提升用户活跃度、留存率及复购/续费率。\n\n活动及专题运营\n\n根据业务目标策划线上活动、专题活动、节日活动及用户增长活动，负责活动从策划、执行到复盘的完整流程。\n\n通过活动、专题及内容运营提升网站流量、用户活跃度、用户留存及付费转化。\n\n跨部门协作\n\n与产品、技术、设计、内容、渠道及商务等团队协同，推动网站功能、页面、内容及运营工具持续优化。\n\n能够独立梳理运营需求并推动产品、技术落地，持续改善网站用户体验及运营效率。\n\n定期复盘运营结果，沉淀可复制的网站运营方法论。\n\n任职要求\n\n2-5 年网站运营、互联网产品运营或内容运营相关工作经验，有网站/平台型产品运营经验优先。\n\n有完整参与或主导网站/互联网产品从 0 到 1 搭建、冷启动或增长阶段的经验，能够独立制定并执行运营策略。\n\n熟悉网站运营完整链路，对用户增长、内容运营、用户留存、转化及商业化有较深入理解。\n\n具备较强的数据分析能力，熟悉 Google Analytics、Search Console、数据报表等常用分析工具，能够通过数据独立拆解问题并提出优化方案。\n\n熟悉 SEO、网站流量增长、内容运营及用户运营，有成功的网站流量增长或用户增长案例优先。\n\n具备较强的内容判断能力，能够根据用户需求、行业趋势及数据表现制定内容方向和运营策略。\n\n具备较强的项目推进能力，能够协调产品、技术、设计、内容等多个团队推动项目落地。\n\n执行力强，责任心强，具备较好的沟通及协作能力，能够适应快节奏、高强度的互联网运营环境。\n\n有成人行业、泛娱乐、内容社区、视频/图片平台或海外互联网产品运营经验优先。\n\n有网站从 0 到 1 搭建、SEO 流量增长、会员/付费产品运营或海外网站运营经验者优先。", "cat": "运营"}, {"id": "258", "title": "AI内容负责人（加急）", "salary": "15-25k", "location": "未明确", "jd": "岗位职责\n\n统筹内容生产全流程\n负责从剧本策划、分镜设计、美术与素材、AI生成、剪辑制作到成片交付及首轮数据验证的完整生产闭环，对内容最终质量负责。\n\n建立统一的内容标准\n制定并持续优化团队的内容调性与制作标准，包括画面风格、镜头语言、声音设计、剪辑节奏等，推动剧本、美术、生成、剪辑等团队形成统一的内容判断标准。\n\n负责项目统筹与资源调配\n根据剧本体量、场次、镜头难度及项目节点，合理进行人员配置、任务拆分与资源调度，确保项目按计划、高质量完成。\n\n建立“测试—验证—放量”机制\n在整部内容批量生产前，推动核心片段或切片进行小规模测试，根据点击、完播、留存、付费转化等数据判断项目方向，及时做出继续、调整或终止的决策，控制无效产能与制作成本。\n\n对内容及商业结果负责\n结合项目数据持续优化内容方向，对单剧的内容表现、商业结果及投入产出负责；同时关注团队整体产能、单分钟制作成本、项目交付周期及剧本储备等核心经营指标。\n\n提升团队生产效率\n优化内容生产流程与协作机制，持续降低沟通成本和返工率，提升团队整体产能与交付质量。\n\n搭建人才梯队与方法论\n培养组长及核心骨干，建立人才梯队；将成熟的生产流程、制作标准和优秀案例沉淀为可复制的方法论，提升团队规模化生产能力。\n\n任职要求\n\n具备 20人以上内容、影视或短视频制作团队管理经验，有完整项目统筹及团队管理经验；\n\n对内容质量、市场趋势及用户反馈具备较强判断力，能够基于数据和项目实际情况做出明确的内容决策；\n\n熟悉内容生产流程，能够理解并平衡内容质量、制作周期、团队产能与成本；\n\n具备较强的项目管理和资源协调能力，能够推动多团队、多环节协同完成项目；\n\n有较强的经营意识，能够关注内容产出背后的成本、效率及商业结果，而不仅局限于内容制作本身；\n\n具备较强的团队管理和人才培养能力，能够搭建并持续优化内容生产团队；\n\n背景不限，可来自影视制作、短剧、短视频、内容平台或成熟内容团队，如执行导演、制片负责人、制作负责人、内容负责人等；\n\n对 AI短剧 / AI视频规模化生产模式有兴趣，并愿意探索AI对内容生产效率的提升。\n\n加分项\n\n有 AI短剧、AI漫剧、AI视频等相关项目经验；\n\n有从 0到1搭建内容团队或生产体系的经验；\n\n有完整负责过短剧、短视频或影视项目，并对项目最终商业结果负责；\n\n有通过数据测试进行内容筛选、项目调整或资源止损的实际经验；", "cat": "AI / AIGC"}, {"id": "259", "title": "AI 内容镜头审核", "salary": "15-20k", "location": "未明确", "jd": "岗位职责\n负责⽣成镜头质量审核\n对 AI ⽣成镜头进⾏逐镜审核，按照统⼀的 A / B / C 质量标准进⾏分级，确保镜头在画⾯、\n⼈物、动作、场景及镜头表现等⽅⾯达到对应要求。\n负责剪辑前质量卡点\n作为 AI ⽣成与后期剪辑之间的质量闸⻔，严格控制进⼊剪辑素材库的镜头质量。C 级镜头\n不得进⼊剪辑环节，避免依赖后期剪辑强⾏修复低质量素材。\n识别并记录镜头问题\n及时发现⼈物变形、⼈物不⼀致、动作异常、场景漂移、画⾯穿帮、镜头逻辑不合理、画质\n异常等问题，并准确标记问题类型及具体位置。\n控制漏检与下游返⼯\n关注镜头漏检率、审核准确率及因素材质量问题导致的下游返⼯率，确保进⼊剪辑环节的素\n材符合制作标准。\n推动前端⽣成质量提升\n汇总审核过程中发现的⾼频及共性问题，定期向 AI 视频⽣成组反馈，协助组⻓优化⽣成⽅\n法、提示词、模型及⽣产流程，从源头降低问题镜头产⽣率。\n沉淀审核标准与案例\n持续整理典型问题镜头及优秀案例，完善 A / B / C 分级标准、审核 SOP 及案例库，提升团\n队审核标准的⼀致性和稳定性。\n任职要求\n具备 AI 视频⽣成、后期制作、视频质检或相关内容制作经验，熟悉视频镜头质量判断；\n对⼈物⼀致性、动作⾃然度、场景稳定性、画⾯完整度、镜头逻辑等具备较强的识别能⼒；\n能够严格按照统⼀标准进⾏ A / B / C 分级，具备较⾼的审核准确率和标准⼀致性；\n细致、有耐⼼，对画⾯质量敏感，具备较强的标准意识和责任⼼；\n能够适应批量化、⾼频次的镜头审核⼯作，在较⼤审核量下保持稳定判断；\n能够准确描述问题并给出明确反馈，⽽不仅是判断“好 / 不好”；\n有较强的团队协作意识，能够与 AI ⽣成、剪辑等团队⾼效配合。\n加分项\n有 AI 视频⽣成或 AI 图像⽣成相关经验；\n有短剧、漫剧、短视频等批量内容⽣产经验；\n有视频后期质检、成⽚审核或影视制作质量管理经验；\n有从⽣成⼈员成⻓为⻣⼲、负责审核或质量把控的经验；\n熟悉主流 AI 视频⽣成⼯具及常⻅⽣成问题；\n有建⽴视频质量标准、质检 SOP 或镜头案例库的经验。", "cat": "AI / AIGC"}, {"id": "260", "title": "AI 内容剧本审核", "salary": "15-20k", "location": "未明确", "jd": "岗位职责\n负责剧本终审与⽣产准⼊\n负责剧本进⼊制作前的最终审核，从题材价值、故事逻辑、⼈物设定、剧情节奏、商业潜⼒、\n制作可⾏性及内容合规等维度进⾏综合判断。未达到⽣产标准的剧本，不进⼊后续制作环节。\n把控剧本执⾏完整度\n判断剧本是否已经细化到可以直接进⼊分镜及⽣产阶段，确保⼈物、场景、剧情、镜头需求\n等关键内容清晰明确，避免进⼊制作后频繁返⼯或重新策划。\n提出明确的修改意⻅\n对不符合要求的剧本进⾏退回，并明确指出具体问题、修改⽅向及判断依据，推动编剧持续\n提升剧本质量，⽽不是只做简单的“通过 / 不通过”\n。\n参与制作可⾏性评估\n与 AI 视频⽣成、美术等团队共同参与剧本及分镜制作可⾏性会审，提前识别⼈物、场景、\n动作、特效等 AI ⽣成难度较⾼的内容，并将制作端反馈沉淀，反向优化剧本创作。\n负责内容合规审核\n建⽴并执⾏内容合规审核标准，负责题材、剧情、⼈物、台词、画⾯等⽅⾯的⻛险识别，熟\n悉不同平台的审核规则及内容红线，确保项⽬符合上线要求。合规审核环节不外包。\n提升剧本审核效率与标准化程度\n持续沉淀审核标准、典型案例及常⻅问题，完善剧本审核 SOP，在保证审核质量的同时提升\n审核效率和整体吞吐量。\n覆盖多来源剧本审核\n负责内部创作、外包制作及采购剧本的统⼀审核，确保不同来源的剧本按照同⼀套标准进⼊\n⽣产。\n任职要求\n具备 3 年以上剧本、编辑、影视内容或短剧相关经验，能够独⽴完成剧本判断和审核；\n具备较强的内容判断能⼒， 能够判断题材是否具备开发价值、故事逻辑是否成⽴、⼈物是否\n⽴得住、内容是否具备持续观看的基础，⽽⾮仅依据审核清单逐项核对；\n熟悉剧本结构、⼈物塑造、剧情节奏及短剧内容特点， 能够从执⾏层⾯判断剧本是否具备实\n际制作条件；\n熟悉主流内容平台的审核规则及常⻅内容⻛险，对题材、剧情、台词、⼈物及画⾯等合规问\n题具备较强的⻛险识别能⼒；\n审核效率⾼、判断准确，能够在较⼤审核量下保持稳定的审核标准；\n具备较强的沟通和反馈能⼒，能够给出具体、可执⾏的修改意⻅，推动编剧解决问题；\n能够适应快节奏、批量化的内容⽣产环境，并接受明确的审核效率与质量要求。\n加分项\n有 短剧、AI 短剧、AI 漫剧或短视频内容审核经验；\n有⽹⽂、短剧、影视项⽬的编辑或策划经验；\n熟悉多个内容平台的审核规则及合规差异；\n有外包、采购及内部多来源剧本审核经验；\n有建⽴剧本审核标准、审核 SOP 或内容合规体系的经验；\n对 AI 内容⽣产流程及 AI ⽣成限制有⼀定了解。", "cat": "AI / AIGC"}, {"id": "261", "title": "中级运营（加急）", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n\n1. 负责二次元内容类 APP / Web 产品的数值体系搭建、梳理及持续优化，包括金币、会员、积分、任务奖励、签到、活动奖励、充值优惠等核心数值模块；\n2. 梳理现有产品数值规则，建立统一、清晰的数值测算逻辑及标准，解决不同产品之间数值体系混乱、规则不统一、缺乏测算依据等问题；\n3. 结合用户行为及经营目标，对金币产出与消耗、会员价格梯度、付费权益、优惠力度、活动奖励等进行测算，保证数值体系的合理性及长期稳定性；\n4. 负责用户新增、活跃、留存、付费、首充、复购/续费、ARPU、ARPPU、LTV 等核心指标分析，定位数据异常及业务问题；\n5. 针对产品改版、会员调整、活动上线等业务需求进行前置测算，评估不同方案对用户转化、收入及成本的影响，为运营及产品决策提供依据；\n6. 建立数值调整后的数据验证及复盘机制，通过 A/B 测试、用户分层、数据对比等方式持续验证并优化方案；\n7. 与产品、运营、技术等团队协作，推动数值方案从设计、配置、上线到数据验证完整落地。\n\n任职要求\n\n1. 具备较强的数据敏感度、逻辑分析及数值建模能力，能够独立完成业务问题拆解和数值方案设计；\n2. 对内容类产品商业化有较好的理解，熟悉会员、虚拟币/金币、付费内容、活动促销等常见商业化模式；\n3. 能够独立进行金币产消、价格梯度、活动成本、用户价值、付费转化等相关测算，而非仅进行基础数据统计；\n4. 熟练使用 Excel 等数据分析工具，具备 SQL 数据查询能力；掌握 Python 或其他数据分析工具优先；\n5. 具备较强的业务理解能力，能够将数据分析结果转化为实际的产品或运营优化方案；\n6. 有 APP、Web、内容社区、漫画/动漫、短剧、游戏等相关行业数值运营、商业化运营或数值策划经验优先；\n7. 熟悉二次元用户群体，对动漫、漫画、二次元内容及相关用户消费习惯有一定理解者优先；\n8. 能熟练使用 AI 工具辅助数据处理、分析及方案测算，同时具备独立判断分析结果合理性的能力。\n\n我们更看重\n\n我们希望你不仅能够“看数据”，更能够理解数字背后的业务逻辑。\n\n面对一个现有的金币、会员或活动体系，你需要能够判断：\n\n现在的数值是否合理 → 问题在哪里 → 应该如何重新设计 → 调整后可能产生什么影响 → 如何通过数据验证。\n\n最终逐步建立一套稳定、可测算、可验证、可持续迭代的产品数值体系。", "cat": "运营"}, {"id": "262", "title": "网站运营组长", "salary": "8k - 20k", "location": "未明确", "jd": "网站运营\n\n岗位职责\n\n网站整体运营与增长\n\n负责网站日常运营及整体运营策略落地，围绕新增、活跃、留存、转化、付费及营收等核心指标制定并执行运营方案。\n\n参与网站从 0 到 1 的运营搭建，包括用户体系、内容体系、活动体系及运营流程建设，推动网站持续增长。\n\n根据业务发展阶段制定冷启动、用户增长及规模化运营策略，持续提升网站整体流量及用户规模。\n\n内容运营与用户留存\n\n负责网站内容体系的规划、运营及优化，根据用户需求和数据表现持续调整内容方向。\n\n优化网站首页、频道页、详情页、推荐位等核心页面的内容结构与展示逻辑，提升点击率、浏览深度、停留时长及用户留存。\n\n参与内容选题、专题策划、活动策划及内容分发，提升内容产出效率和内容对用户增长、留存及转化的贡献。\n\n建立内容运营标准及内容质量评估机制，持续提升网站内容质量和用户体验。\n\nSEO及流量增长\n\n负责网站 SEO 运营，包括关键词布局、页面结构、站内链接、专题页、内容优化及搜索流量增长等。\n\n分析自然搜索、社媒、外部渠道等不同流量来源，持续优化流量获取及分发策略。\n\n关注行业及竞品网站运营情况，挖掘新的流量增长机会，提升网站整体曝光及自然流量。\n\n数据分析与运营优化\n\n日常跟踪网站核心数据，包括 UV、PV、注册、DAU、留存、访问深度、跳出率、转化率、付费率及营收等。\n\n基于数据分析用户访问及转化路径，定位流量、内容、产品及转化环节中的问题，并提出可执行的优化方案。\n\n建立并持续完善网站运营数据指标体系，通过数据驱动内容、活动、页面及用户运营策略迭代。\n\n根据数据反馈持续进行 A/B Test 及运营策略调整，提升网站整体运营效率。\n\n用户增长与转化\n\n围绕“流量获取—用户注册—内容消费—用户留存—付费转化”完整链路进行运营优化。\n\n负责会员、付费内容、订阅、活动及其他商业化场景的运营，持续提升用户转化率及用户价值。\n\n针对不同用户生命周期制定差异化运营策略，提升用户活跃度、留存率及复购/续费率。\n\n活动及专题运营\n\n根据业务目标策划线上活动、专题活动、节日活动及用户增长活动，负责活动从策划、执行到复盘的完整流程。\n\n通过活动、专题及内容运营提升网站流量、用户活跃度、用户留存及付费转化。\n\n跨部门协作\n\n与产品、技术、设计、内容、渠道及商务等团队协同，推动网站功能、页面、内容及运营工具持续优化。\n\n能够独立梳理运营需求并推动产品、技术落地，持续改善网站用户体验及运营效率。\n\n定期复盘运营结果，沉淀可复制的网站运营方法论。\n\n任职要求\n\n2-5 年网站运营、互联网产品运营或内容运营相关工作经验，有网站/平台型产品运营经验优先。\n\n有完整参与或主导网站/互联网产品从 0 到 1 搭建、冷启动或增长阶段的经验，能够独立制定并执行运营策略。\n\n熟悉网站运营完整链路，对用户增长、内容运营、用户留存、转化及商业化有较深入理解。\n\n具备较强的数据分析能力，熟悉 Google Analytics、Search Console、数据报表等常用分析工具，能够通过数据独立拆解问题并提出优化方案。\n\n熟悉 SEO、网站流量增长、内容运营及用户运营，有成功的网站流量增长或用户增长案例优先。\n\n具备较强的内容判断能力，能够根据用户需求、行业趋势及数据表现制定内容方向和运营策略。\n\n具备较强的项目推进能力，能够协调产品、技术、设计、内容等多个团队推动项目落地。\n\n执行力强，责任心强，具备较好的沟通及协作能力，能够适应快节奏、高强度的互联网运营环境。\n\n有成人行业、泛娱乐、内容社区、视频/图片平台或海外互联网产品运营经验优先。\n\n有网站从 0 到 1 搭建、SEO 流量增长、会员/付费产品运营或海外网站运营经验者优先。", "cat": "运营"}, {"id": "263", "title": "AI内容视频剪辑", "salary": "8k - 20k", "location": "未明确", "jd": "# AI内容视频剪辑专员 JD\n\n## 一、岗位职责\n\n1、**AI视频剪辑：** 负责公司原创AI短剧、AI漫剧及动漫视频的后期制作，包括素材整理、粗剪精剪、字幕、配音、调色及成片包装，保障剧情连贯性与画面质量。\n\n2、**内容二次创作：** 根据剧本、分镜及产品需求，完成剧情高光剪辑、短视频切片、视频混剪及宣传素材制作，提升内容表现力与吸引力。\n\n3、**AI工具应用：** 运用AI视频生成及辅助剪辑工具，完成素材补充、画面修复、智能配音及字幕生成，优化制作流程，提升剪辑效率。\n\n4、**成片质量把控：** 负责视频自检与修改，重点处理人物形象不一致、动作不连贯、镜头衔接异常及音画不同步等问题，确保成片符合交付标准。\n\n5、**团队协作与交付：** 配合AI内容生成、审核及运营团队完成视频制作任务，按时交付成片，规范管理素材、工程文件及剪辑模板，持续优化制作流程。\n\n## 二、任职要求\n\n1、大专及以上学历，2年以上视频剪辑或影视后期制作经验，有AI短剧、AI漫剧或动漫视频制作经验者优先。\n\n2、熟练使用剪映专业版（CapCut）、Premiere Pro、After Effects等剪辑软件，能够独立完成视频剪辑、字幕、音效、调色及后期包装。\n\n3、熟悉镜头语言、剧情节奏及视频叙事逻辑，具备良好的审美能力，能够独立完成从素材整理到最终成片的制作流程。\n\n4、熟悉即梦、可灵、Runway、Sora等至少一种AI视频制作工具，能够运用AI辅助完成素材优化、画面修复及视频制作。\n\n5、具备良好的沟通协作、时间管理及问题解决能力，能够适应多项目并行及批量视频制作需求。\n\n## 三、优先考虑\n\n1、具有完整AI短剧、AI漫剧或原创动漫视频成片制作经验。\n\n2、熟悉AI视频生成工作流，具备角色一致性、镜头衔接及AI素材修复经验。\n\n3、具备批量视频剪辑、内容二创及标准化视频生产经验。\n\n## 四、岗位交付要求\n\n1、按项目排期完成视频剪辑、后期包装及成片交付，保障制作进度与质量。\n\n2、定期汇总视频产出、成片合格率及返工情况，持续提升制作效率。\n\n3、沉淀可复用的剪辑模板、素材资源及标准化制作流程。\n\n## 五、面试作品要求\n\n需提供**2–3份本人参与制作的视频作品**，优先AI短剧、AI漫剧或动漫视频，并说明个人负责环节、使用工具及制作周期。\n\n**岗位定位：** 以原创AI视频剪辑、后期制作及成片交付为核心，重点考察剪辑技术、AI工具应用、剧情理解及内容质量把控能力。", "cat": "AI / AIGC"}, {"id": "264", "title": "新媒体运营（新媒体数字人达人账号方向）", "salary": "12-15K", "location": "⾯试前需准备的材料\n1. 账号案例:⾄少⼀个本⼈实际负责的 To C 账号,说明平台、运营周期、账号定位、搭建过程及本⼈职责。\n2. 视频作品:⾄少⼀条本⼈参与策划或运营的视频,提供公开链接或可展⽰⽂件,并说明⾃⼰负责的部分。\n3. 对应脚本:提供该视频的原脚本,允许脱敏或⾯试现场展⽰;若原稿⽆法提供,可提供复盘重写稿,但须明确标注,不\n作为原稿提交。\n材料可脱敏,不要求提供账号密码或登录信息。⽆法提供原始材料时,应说明原因,并通过可展⽰案例及现场讲解验证能\n⼒。", "jd": "岗位定位\n负责数字⼈达⼈账号的定位、搭建、选题、脚本策划、发布运营与数据复盘。以抖⾳、哔哩哔哩(B站)、YouTube 为\n主要平台,重点理解抖⾳与 B站的内容逻辑;X、Telegram 等为辅助平台。\n岗位职责\n1. 账号搭建与⼈设规划:明确⽬标⽤⼾、账号定位、⼈设表达、内容栏⽬及更新节奏,推动账号从搭建到持续运\n营。\n2. 选题与脚本策划:围绕⽣活场景、⽤⼾兴趣和数字⼈⼈设设计选题,独⽴完成视频脚本,清楚表达开头吸引点、内\n容结构、节奏及互动设计。\n3. 热点捕捉与话题策划:理解实时热点、⽹络梗和社区⽂化,判断热点与账号的匹配度,既能结合热点创作,也能主\n动策划有讨论度和参与感的话题。\n4. 平台运营与内容落地:结合抖⾳、B站、YouTube 的⽤⼾习惯调整内容表达、标题封⾯和发布节奏,与制作⼈员\n协作完成内容落地及质量检查。\n5. 数据复盘与迭代:根据播放、观看留存、完播、互动、涨粉等可获得的数据识别问题,提出调整措施,跟踪调整后\n的结果,持续优化选题、脚本和运营策略。\n硬性要求\n1. 必须有 To C(⾯向普通⽤⼾)的账号运营实操经历,亲⾃承担过账号搭建及运营⼯作,能够清楚说明负责的平台、\n⼯作范围和执⾏过程。\n2. 具备重点平台相关账号实操案例,重点掌握抖⾳与 B站的内容分发、⽤⼾偏好和社区表达逻辑;能够说明在\nYouTube 上的相关运营经验及平台差异。\n3. 具备独⽴选题与脚本策划能⼒,能够提供本⼈参与的视频及对应脚本,并解释内容设计依据。\n4. 熟悉⽣活类内容、实时热点和梗⽂化,具备热点判断、内容转化及话题策划能⼒,并有实际案例⽀撑。\n5. 必须具备数据复盘能⼒,能完整说明\"数据表现—问题判断—调整动作—结果验证\",⽽⾮仅罗列播放量或发布数\n量。\n加分项\n能独⽴制作内容,包括拍摄、剪辑、字幕、配⾳及基础视觉包装。\n能使⽤ AI ⼯具制作内容,并展⽰具体作品、制作流程与本⼈贡献。\n有数字⼈、虚拟⻆⾊或达⼈ IP 账号的运营经验,能够持续保持⼈设与内容⻛格。\n有 X、Telegram 等辅助平台的运营经验。", "cat": "运营"}, {"id": "265", "title": "中级产品运营", "salary": "12-20k", "location": "未明确", "jd": "1. 负责所属成人向长视频/短视频内容产品的日常运营，对日活、新增、留存、充值等核心数据指标负责。\n2. 执行组长制定的内容运营策略：日常内容更新、分类/专区/模块优化、依照筛选逻辑优化展示效果。\n3. 监控各项产品数据表现，理解各项数据指标的逻辑，并能够依照数据变化情况，及时进行反应以及调整。\n4. 每日进行产品巡检并分析使用体验，确保产品各项功能正常，包含展示与跳转、播放链路、支付流程等，发现异常及时反馈并跟进至解决。\n5. 收集并处理客服反馈、用户问卷等多渠道用户声音，转化为可执行的产品优化建议。\n6. 参与日度/周度/月度数据复盘会议，独立汇报所负责产品的数据表现及问题归因，并提出优化方针。\n7. 能够进行跨部门沟通协同，推进产品迭代与问题排查，对结果闭环负责。\n8. 为产品定制活动方案，能够利用活动达成指定数据指标的提升，并进行复盘与汇总\n\n任职要求\n\n1. 2年以上成人产品运营经验，有付费产品运营经验者优先；\n2. 有产品迭代经验，新品需求文档攥写能力；\n3. 具备较强的内容敏感度，能够保证更新内容具备吸引力，展示方式符合用户审美，具备视频剪辑 / 封面制作能力者优先；\n4. 数据敏感度强，能够做到问题归因以及提出针对性解决措施；", "cat": "运营"}, {"id": "266", "title": "编剧（AI短剧/漫剧方向）", "salary": "15-30k", "location": "麻烦让候选人回答这4个问题：\n1.看https://lzzsfswfs.cc/ 这个网站上已有的内容，你觉得你自己做原创内容的编剧，往哪个方向生成内容可以和成为精品内容。\n\n2.给我一个200字的成人AI短剧故事大纲。\n\n3.第一集的剧本：“必须涵盖成人内容剧情。”\n\n4.根据第一集的剧本里的成人内容，给我一段30秒的成人内容提示词。", "jd": "岗位职责\n1. 负责都市情感、婚姻家庭、女性成长、悬疑反转、银发情感等题材的选题策划与剧本创作。\n2. 完成故事大纲、人物小传、分集梗概、单集剧本及对白。\n3. 设计前三集钩子、单集冲突、集尾悬念和中后段付费卡点。\n4. 根据平台数据和用户反馈，快速调整剧情节奏、人物关系及情绪密度。\n5. 使用大语言模型等AI工具辅助选题、资料整理、剧情推演和版本迭代。\n6. 与AI分镜、视觉、配音、剪辑团队协作，保证剧本具备良好的生成和制作可行性。\n7. 关注主流短剧平台的热门题材及用户趋势。\n任职要求\n1. 具备网文、短剧、漫画、动画、游戏剧情或互动内容创作经验。\n2. 熟悉短剧叙事规律，能够快速建立冲突，并持续制造反转和情绪价值。\n3. 人物关系设计能力强，擅长成年人情感、利益博弈及现实议题。\n4. 能独立完成60—100集短剧的整体架构，单集时长适配3-5分钟。\n5. 具备较强的修改能力，能够接受快节奏、高频迭代的工作方式。\n6. 有版权意识和内容安全意识，能够主动规避低俗、侵权及平台审核风险。\n7. 对AI内容生产有兴趣，愿意持续学习新的生成工具和工作流。\n加分项\n• 有上线短剧、爆款网文或高流水项目经验；\n• 熟悉红果、抖音、快手等平台的内容偏好；\n• 有海外短剧、本地化改编或多语言内容经验；\n• 能使用AI完成角色设定、分镜提示词或视频预演；\n• 拥有可改编IP、成熟题材库或稳定创作搭档。", "cat": "AI / AIGC"}, {"id": "267", "title": "中高级运营", "salary": "12K–20K", "location": "未明确", "jd": "岗位介绍\n负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的成人产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营"}, {"id": "268", "title": "短剧内容增长运营（国内社媒）", "salary": "12k-15k", "location": "工作地点：远程 / 英国本地 ，英国本地：£2,000–£2,500 / 月，转正后可根据导流与账号数据设置绩效奖金（细则面议），提供账号链接或作品数据，并增加一个 24 小时内提交的剪辑小作业", "jd": "岗位目标\n负责公司原创 AI 短剧在国内社媒（小红书、抖音为主）的内容化推广：从原创短剧中剪辑、二创出适合公开平台传播的内容，建立账号矩阵并持续产出爆款，把平台流量引到产品。\n岗位职责\n内容策划：深度理解年轻女性用户在短视频 / 短剧上的偏好（题材、人设、节奏、情绪点、评论区话题），为每部原创短剧制定社媒传播方案，确定切片角度与钩子。\n剪辑二创：独立完成短剧的切片、混剪、卡点、字幕与封面，产出符合小红书、抖音调性的传播版本（合规、可公开），保证每周稳定产量。\n标签与分类：熟悉短剧 / 短视频的题材标签体系（如霸总、替身、追妻、重生、先婚后爱、强制爱等），能对素材做标签分类，并据此规划账号内容方向与话题运营。\n账号运营：搭建并运营小红书、抖音账号矩阵，负责发布节奏、话题选择、评论互动、私信引导与账号安全；跟踪各平台规则变化。\n数据复盘：每周复盘播放、互动、涨粉与导流数据，找到有效内容形式并放大；输出可复用的选题与剪辑 SOP。\n协同：与 AI 短剧制作组对接选题与素材需求，反哺剧本创作（哪类桥段在社媒更容易引起共鸣）；与产品运营对接落地页与转化链路。\n任职要求\n3 年以上短视频 / 短剧内容运营经验，有小红书或抖音账号从 0 做起的成功案例（请附账号或作品链接及数据）。\n资深短剧用户，对当下热门短剧、爆款切片和年轻女性受众的喜好有明确判断，能说清“为什么这条会火”。\n熟练使用剪映 / Premiere 等剪辑工具，独立完成剪辑、字幕、封面全流程；有网感，标题与文案能引发共鸣。\n熟悉短剧 / 短视频标签体系，有素材分类或选题库搭建经验。\n熟悉小红书、抖音的内容规范与流量机制，有内容合规意识。\n结果导向，能接受以播放量、涨粉、导流数据为核心的考核。\n加分项\n有 AI 短剧制作经验（即梦、可灵、Runway 等工具，或 AI 分镜 / 生图 / 生视频流程），了解 AI 短剧的制作逻辑与可剪辑点。\n有女性向内容（言情、耽美、乙女向）平台或账号的运营经验。\n有海外社媒（YouTube Shorts、TikTok、X）运营经验，可兼顾海外推广。\n有引流转化经验，做过从社媒到 App / 站点的导流链路。\n考核指标（试用期）\n账号矩阵搭建完成，每周稳定产出 N 条二创内容（入职后按平台定量）。\n首月内跑出至少 1 条播放量破 10 万的内容，明确可复制的内容形式。\n月度社媒导流新增用户量与产品注册转化，作为转正核心指标。", "cat": "内容"}, {"id": "269", "title": "UI设计师", "salary": "12K—20K", "location": "未明确", "jd": "岗位职责：\n1.负责日常渠道运营相关的设计需求，包括但不限于活动海报、banner、落地页、推文配图、运营物料等视觉产出，保障渠道视觉风格统一且高效落地。\n2.根据产品需求，输出完整的UI设计方案，涵盖页面结构、交互逻辑、视觉规范及适配方案，确保设计与产品目标高度匹配。\n3.负责项目内部视觉设计方案的制定与执行，包括品牌视觉延展、项目视觉体系搭建、内部宣发物料及演示方案设计。\n4.与产品、运营、开发等团队紧密协作，跟进设计落地效果，及时优化迭代。\n5.持续关注行业设计趋势与用户体验，提升整体视觉品质与转化效果。\n\n任职要求：\n1.扎实的视觉设计功底，精通构图、色彩、字体层级与质感表现，能精准平衡界面整体氛围和信息传达效率。\n2.3-5年（或以上）UI/视觉设计经验，有渠道运营设计、活动视觉或互联网产品设计经验者优先。\n3.熟练掌握 Figma、Sketch、Photoshop、Illustrator 等主流设计工具，具备良好的视觉审美与排版能力。\n4.能独立完成从需求理解到方案输出的完整设计流程，具备较强的需求拆解与方案表达能力。\n5.对用户体验有基本认知，能根据业务目标平衡美观与转化效果。\n6.沟通协作能力强，抗压能力好，能适应多需求并行的工作节奏。\n\n加分项：\n1.对AI工具有实际应用经验，熟练使用以下一种或多种工具并能融入真实工作流，持续关注AI设计领域最新工具与方法进展，具备主动学习和迭代工作流的意识：\n· 图像生成：GPT image 2、MJ、SD、Comfyui、即梦等；\n· 设计提效：Figma  Ai（FigmaMake）等；\n· 内容辅助：GPT、Claude等LLM在方案分析，文案撰写，设计推导中 的实际应用。\n2.建立过一套Ai可消费的设计系统，将设计语言沉淀为design tokens、组件库和书面设计规则，使产品经理和运营能直接用Ai工具生成符合规范的新页面和日常功能迭代界面，无需设计师逐一参与。", "cat": "设计"}, {"id": "270", "title": "SEO专员", "salary": "15–25k", "location": "未明确", "jd": "岗位职责\n\n1. 渠道拓展与管理\n- 挖掘、筛选、对接 SEO / 自然流量渠道(导航站、内容站、外链站、聚合平台等)及信息流 / 联盟等付费渠道\n- 建立并维护渠道合作关系,完成自然流量渠道从 0–1 的搭建与放量\n\n2. 流量执行与优化\n- 制定 SEO 策略(关键词研究、站群 / 外链 / 内容矩阵、站内与落地页优化)\n- 监控数据表现(收录、排名、点击率、转化率、ROI、获客成本),持续提升自然流量与转化\n- 压降单位获客成本,打通自然 + 付费双链路\n\n3. 数据分析与复盘\n- 定期输出 SEO / 流量分析报告,建立效果评估机制\n- 从数据中发现问题(排名 / 流量异常、低质 / 刷量流量)并提出优化方案\n\n4. 素材与内容协同\n- 与内容 / 设计团队协作,运用 AI 批量生产 SEO 内容与文案(关键词布局、标题、落地页)\n- 测试不同创意 / 内容方向(A/B 测试)\n\n5. 竞品与市场分析\n- 跟踪竞品 SEO 与投放策略,分析行业趋势,提出策略调整建议\n\n任职要求\n\n1. 学历与经验\n- 大专及以上学历\n- 有 1–3 年 SEO / 渠道经验者优先,会 SEO 者优先\n- 须有实际 SEO 操盘案例(能说清关键词 / 排名 / 收录 / 自然流量增长的具体数据与打法),面试需提供可验证案例\n\n2. 核心能力\n- 熟悉 SEO 全流程(关键词、站内 / 站外优化、外链建设、内容矩阵、收录与排名提升)\n- 具备数据分析能力(Excel / SQL / BI 工具),理解流量 / ROI 口径\n- 有流量优化、成本管控经验,能识别低质 / 刷量流量\n- 结果导向、对数字敏感\n- 沟通协调能力、抗压能力\n- 会熟练运用 AI(批量内容、文案生成、数据提效)\n- 具备良好的沟通能力和团队协作意识,能适应快节奏工作\n\n3. 加分项\n- 有成功案例(如自然流量增长 xx%、获客成本降低 xx%)\n- 熟悉海外投放(如 Facebook Ads、TikTok Ads)及海外 SEO / 流量生态", "cat": "运营"}, {"id": "271", "title": "业务培训专家", "salary": "20K-35K", "location": "未明确", "jd": "业务培训专家 JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n负责讲师资格库建设，优先挖掘业务一线 TOP 20% 高手担任兼职讲师，按季度核验讲师业务表现及授课质量，建立动态淘汰机制。\n对接 AI 工具厂商及外部讲师资源，评估其行业案例、ROI 数据及课程适配度，把控外部讲师引入标准。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n按季度组织业务复盘会，与业务一线、HRBP 对齐培训落地效果及业绩归因，持续优化课程内容和演武机制。\n任职要求\n5-8 年业务培训、业务赋能、培训运营或实战教练相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点，不只是做课程交付，而是能围绕业务结果设计培训方案。\n主导过 50 场以上实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n善于调动业务内部高绩效人员担任兼职讲师，能把一线优秀打法转化为可复制、可训练、可考核的课程和 SOP。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "其他"}, {"id": "272", "title": "业务萃取专家", "salary": "20K-35K", "location": "未明确", "jd": "参与集团内各分公司、重点项目组及业务骨干的访谈、调研和复盘，了解业务背景、执行过程、关键动作及结果数据。\n根据访谈和业务资料，整理高质量访谈纪要，提炼核心业务动作、成功经验、失败教训及可复用方法。\n挖掘各产品、项目组、一线业务团队中具有复制价值的优秀打法、亮点案例和关键经验。\n将零散的业务经验和项目资料整理为结构化内容，包括业务背景、问题场景、关键动作、执行步骤、结果数据、适用场景和注意事项等。\n协助搭建并维护经验案例库、战法地图、知识库及待萃取素材清单，持续沉淀集团内部可复用的业务经验。\n与 SOP 工程化组、学习发展部及相关业务团队协作，推动经验素材转化为 SOP、工具包、培训课件、实战训练内容等可落地成果。\n结合业务需求，使用 AI 工具辅助访谈纪要整理、内容提炼、框架搭建和结构化输出，提升经验沉淀效率。\n跟进经验素材的应用反馈，持续优化案例内容、SOP 表达和工具包结构，提升内容的实用性和可复制性。", "cat": "其他"}, {"id": "273", "title": "资深短剧编剧", "salary": "20-35k", "location": "未明确", "jd": "【岗位定位】\n负责精品叙事类短剧的创作、评审与方法沉淀；不是简单使用AI生成文本，而是把控人物、逻辑、节奏和可制作性。\n\n【岗位职责】\n• 负责精品短剧、连续剧情及叙事类视频的原创、改编和剧本精修。\n• 完善世界观、人物关系、角色动机、成长线、核心冲突及分集结构。\n• 对AI生成或各业务线提交的剧本进行专业Review，解决人物扁平、逻辑断裂、节奏拖沓和情节雷同等问题。\n• 把控开场钩子、爽点密度、冲突升级、剧情反转和结尾断点。\n• 与AI视频制作人员联合评审，确保执行人员拿到剧本后不需要重新策划。\n• 结合采纳率、成片表现和用户数据，沉淀剧本模板、评审标准和创作方法。\n\n【重点技能】\n剧本结构；人物塑造；短剧节奏；AI剧本精修；剧本质检；制作可行性判断\n\n【任职要求】\n• 具备短剧、影视剧、动画或游戏剧情策划经验，有可核验的上线作品。\n• 具备扎实的剧本基本功，能够独立完成人物塑造、故事结构及分集节奏设计。\n• 有较强的剧本质检能力，能够快速判断剧本的问题、潜力和修改方向。\n• 理解短视频用户习惯，熟悉钩子、爽点、反转、断点和连续追剧动力。\n• 具备良好的审美、逻辑和内容判断力，不依赖AI完成核心创意与专业判断。\n• 能与导演、分镜、AI生成、美术和剪辑人员有效协作。\n\n【优先背景 / 作品要求】\n优先考虑短剧编剧、影视编剧、动画编剧、游戏剧情/文案策划，以及具备影视化改编能力的小说作者。需提供上线作品、脱敏剧本或修改前后版本。", "cat": "内容"}, {"id": "274", "title": "AI视频工作流专家", "salary": "20-35k", "location": "未明确", "jd": "【岗位定位】\n熟练操作万桢、FRW及相关AI内容平台，把剧本和角色稳定转化为高质量视频，并沉淀可复制的标准工作流。\n\n【岗位职责】\n• 操作万桢、FRW、无限画布及相关工具，完成剧本到成片的端到端制作。\n• 完成角色、场景、分镜、参考图、图像生成、视频生成、配音、音效和剪辑拼接。\n• 根据项目选择模型、提示词、参考素材、参数和生成方案。\n• 解决角色一致性、动作自然度、镜头衔接、画面稳定性和剧情连贯性问题。\n• 沉淀示例画布、工作流节点、模型选择方法、质检标准和操作SOP。\n• 复盘效率、返工和成片表现，持续优化工作流并培训业务线人员。\n\n【重点技能】\n万桢/FRW；无限画布；多模型组合；角色一致性；分镜与剪辑；流程诊断；SOP与培训\n\n【任职要求】\n• 具备AI视频、AI动画、影视制作、视觉设计或内容后期的实际项目经验。\n• 有完整AI视频或AI动画作品，能够说明从剧本到成片的生产过程。\n• 熟悉文生图、图生视频、文生视频、多模型组合和参考图控制。\n• 理解镜头语言、构图、光影、动作、节奏、声音设计及基本剪辑逻辑。\n• 能够定位工作流问题，并通过调整模型、节点、提示词或素材解决。\n• 具备审美、质量意识、文档沉淀和培训能力。\n\n【优先背景 / 作品要求】\n优先考虑AI视频/动画、影视导演、分镜、动画制作、美术设计、剪辑及后期背景；有无限画布、ComfyUI或多模型节点式工作流经验者优先。", "cat": "AI / AIGC"}, {"id": "275", "title": "培训运营专员", "salary": "15-25k", "location": "未明确", "jd": "培训运营 专员JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前3- 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n\n任职要求\n5年或以上人才发展、业务赋能、培训运营或相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点。\n独立实施过多次实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "运营"}, {"id": "276", "title": "HRBP (远程)", "salary": "¥18K–25K/月,具体依能力面议", "location": "远程 (原则10-10-6，以实际需求和结果交付为准)\n初筛问题（共2题）适用本地/远程HRBP岗\n1. 请分享一个你在过往工作中，通过人力资源手段解决的实际问题。请尽量选择你主导或核心参与的案例，并简要说明问题背景、你的处理方式以及最终结果。\n2. 请简单分享一个你使用AI提升工作效率的实际例子，或你搭建过的相关工具（如有可附链接）。\n3. 请介绍你的3个竞争优势。", "jd": "岗位职责\n编制管理:对口若干中后台部门,深入了解部门业务,持续评估编制合理性,参与入职审批环节并出具专业意见\n组织诊断与人效分析:定期与所辖部门负责人及团队访谈,诊断组织问题、协助管理改善;基于数据开展人效分析,输出可落地的结论与建议\n例常人事工作:月度组织架构与花名册核对、编制统计、各部门绩效与薪酬激励数据的收集、汇总与初审\n专项支持:组织调整期间的落地支持(员工沟通、去向协调、人员安置)及临时性专项任务\n制度建设:参与团队制度与流程的搭建与优化\n\n任职要求\n3 年以上 HRBP 相关经验,有组织诊断或人效改善的实际落地案例者优先\n执行力强,例常工作细致零差错,时间承诺可靠\n沟通能力出色:能坦率指出问题,也能维护好跨部门关系,推动问题落地解决\n对数据敏感,书面表达清晰,能独立产出结构完整的分析报告\n适应远程协作,自驱力强\n熟练使用 AI 工具提升工作效率者加分", "cat": "职能"}, {"id": "277", "title": "HRBP（英国）", "salary": "£45,000 – £65,000 / 年", "location": "工作地点：伦敦\n混合办公（根据业务需求灵活）\n初筛问题（共2题）适用本地/远程HRBP岗\n1. 请分享一个你在过往工作中，通过人力资源手段解决的实际问题。请尽量选择你主导或核心参与的案例，并简要说明问题背景、你的处理方式以及最终结果。\n2. 请简单分享一个你使用AI提升工作效率的实际例子，或你搭建过的相关工具（如有可附链接）。\n3. 请介绍你的3个竞争优势。", "jd": "岗位职责\n业务伙伴支持：深入对接业务负责人，理解组织结构、业务需求及团队问题。\n组织诊断与问题解决：识别组织及人员问题的根本原因，并提出切实可行的解决方案。\n人力规划与人才决策：从业务角度主导人力规划、招聘决策及人才评估。\n执行与效果达成：推动相关工作的落地，并确保对组织效率与业务结果产生实际影响。\nHR体系支持（按需）：在需要时参与HRBP相关机制与方法的优化，与COE等团队协同推进。\n\n任职要求\n工作经验\n具备HRBP经验，支持过一定规模团队（建议50人以上）\n有通过人力资源手段解决组织或人员问题的实际经验\n资质要求\nCIPD Level 5及以上（或同等专业资质）\n核心能力\n具备较强的业务理解与影响力\n具备系统性分析与问题解决能力\n能够影响业务决策并提出建议\n结果导向，务实落地\n语言要求\n中文流利（可作为工作语言）", "cat": "职能"}, {"id": "278", "title": "稽核专员", "salary": "试用期£25,000–28,000/年，转正后加 £5,000；\n满一年总包目标 £36,000–38,000", "location": "工作地点：英国\n岗位测试（共两道）\n进入复试的候选人完成以下两道题：第 1 题必选，第 2、3 题任选一道。题目均为虚构案例材料；每道题收到后 48 小时内提交（在职候选人收题时说明，可放宽至 3 天）；可以使用 AI 工具，但须说明用在了哪些地方。\n1. 奖金与津贴稽核（必选）：给你一个 48 人服务中心某月的奖金与津贴提报（8 张表），写一份呈送总裁的稽核意见——哪些照发、哪些退回、哪些需补充说明，每条落到具体的人和数并注明依据。\n2. 系统需求方案（二选一）：给你奖金与津贴月度稽核流程的说明，写一份不超过 3 页的需求方案，说明如何把这套流程搬进内部 OA 系统，末尾附待确认问题与假设。提交后安排 30–40 分钟讲解追问。\n3. 稽核执行方案（二选一）：给你一项刚发布的汇报制度和人手情况，写一份正文不超过 2 页的稽核执行方案，说明一名稽核人员如何从次月起按月抽查该制度的执行——范围、抽样、判定、通报与人力。提交后安排 30–40 分钟讲解追问。\n\n项目助理岗位吸引到的候选人可转推本岗位", "jd": "工作内容\n按公司制度审核月度奖金与津贴提报、季度职级晋升与调薪申请，对错误、漏项、依据不足的事项说明理由退回。\n撰写稽核报告：写清问题、依据与整改建议，跟进至整改完成。\n承接新增稽核事项（如对各单位执行某项汇报制度情况的月度抽查）：明确稽核内容与依据，跑通前几个周期后形成书面流程。\n代表稽核团队对接 OA 系统开发团队：将审核与审批流程整理为书面需求，测试每个版本，记录问题并跟进至解决。\n\n任职要求\n能准确读懂制度文件并严格对照执行，能发现提报内容与所依据规则不一致之处。\n不只看合不合规，还能结合人员、岗位与绩效情况判断一个数字合不合理；写意见时分清事实、推断与建议。\n对数字敏感，处理大量薪酬、奖金、人员数据时保持准确；熟练使用 Excel / Google Sheets。\n能把一项制度转化为可执行的稽核：抽什么、怎么判、要哪些基础数据、每月大约多少人时，并守住稽核岗位的边界不越权。\n书面表达结论前置、简洁，几句话能写清问题、依据和改法；能当面讲清自己
