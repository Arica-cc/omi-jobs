Git 及常见部署流程，能够独立定位线上故障与性能问题。\n11. 具备良好的业务理解、沟通协作及主动推进能力，能够独立负责关键模块，并推动需求交付。\n\n## 优先条件\n\n1. 同时具备 Flutter 和 Vue 实际项目经验，能够完成后端、客户端及管理后台的协同开发。\n2. 具备 Go 实际项目经验，熟悉并发编程、接口服务开发或异步任务处理，能够参与 PHP 与 Go 服务的协同开发。\n3. 有 Agent、Skill、MCP 工具集成或大模型应用开发经验，能够展示实际项目及落地成果。\n4. 熟悉 Docker、Kubernetes、CI/CD，有微服务拆分、自动化部署或运维经验。\n5. 具备 MongoDB、Redis 或 Elasticsearch 集群维护、容量规划及故障处理经验。\n\n## 投递说明\n\n投递时请重点说明：\n\n- 本人主导的架构设计或核心模块开发案例，包括业务背景、技术方案、个人职责及实际效果。\n- AI 工具在实际研发中的使用方式、验证方法及取得的成果。\n- Flutter 或 Vue 项目经验，包括负责的功能、交付平台及个人承担的工作。", "cat": "技术 / 数据"}, {"id": "199", "title": "高级产品经理", "salary": "20k-30k", "location": "1. 优秀的线上沟通与协作能力，**完全适应全远程工作模式**。", "jd": "视频App 商业化产品经理（高级）\n\n 岗位职责\n\n1. 商业变现体系规划与产品落地\n- 负责视频 App 整体**商业化产品规划**，统筹**会员付费、广告变现、增值服务**等多元变现模式，制定并落地商业化产品路线图。\n- 深度参与公司级商业化战略制定，明确 ARPU、LTV、付费率、广告收入（eCPM/广告填充）、GMV 等核心商业化指标，并通过策略设计与快速试验持续推动增长。\n\n 2. 会员与付费体系产品设计\n- 主导**会员体系（VIP）从 0 到 1 及迭代**，设计会员权益、开通/续费链路、订阅定价、支付转化与复购/召回机制。\n- 优化**付费转化漏斗**（试看→开通→续费），结合 A/B 测试与用户调研，持续提升付费转化率与用户生命周期价值（LTV）。\n- 探索**单点付费、超前点播、打赏/增值道具**等多样化变现玩法。\n\n 3. 广告商业化产品设计\n- 负责**广告变现产品**（开屏、贴片、信息流、激励视频、互动广告等广告样式）的产品设计与迭代，在**提升变现效率与保障用户体验**之间取得平衡。\n- 与广告平台、算法、商务团队协作，优化广告填充、点击率、eCPM 与广告转化路径，最大化广告收入。\n\n4. 商业化数据体系与增长试验\n- 搭建商业化数据看板与埋点体系，通过**付费转化漏斗、留存-变现联动、LTV/ARPU 分层分析**敏锐定位变现问题。\n- 熟练主导 **A/B 测试、用户调研、增长实验**，形成\"数据洞察 → 策略设计 → 产品上线 → 效果复盘\"的完整闭环。\n\n5. 商业化资源协调与项目管理\n- 协调产品、设计、研发、运营、商务、算法等团队资源，推动商业化功能高效上线并达成目标。\n- 具备跨业务线（内容、会员、广告、电商等）资源整合与推动能力，支持公司级商业化目标达成。\n\n 任职要求\n\n硬性要求\n1. 本科及以上学历，**985/211 优先**，专业不限。\n2. **5 年以上互联网 C 端产品经验**，**至少 3 年大流量 to C 产品经验**（日活百万级以上优先），**且有视频/泛娱乐平台商业化（会员或广告变现）完整项目经历者优先**。\n3. 在**爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易**等大厂有完整商业化/会员/广告产品项目经历者优先；\n4. 专业技能：完整主导过至少 **1-2 个现象级商业化功能**或从 0 到 1 变现项目，有显著的付费率/ARPU/广告收入提升案例。\n5. 深刻理解**内容生态、会员/付费体系、广告变现、推荐算法、社区玩法、商业化变现**等 C 端与商业化核心逻辑。\n6. 熟练使用 Axure、Figma 等原型工具，精通 Tableau、PowerBI、Excel 等数据分析工具，能独立完成 PRD 撰写与数据埋点方案。\n7. 熟练主导 A/B 测试、用户调研、增长实验，具备从数据洞察到策略落地的闭环能力。\n8. 优秀的项目管理、需求优先级判断与跨部门推动能力。\n\n### 软性要求\n1. 优秀的线上沟通与协作能力，**完全适应全远程工作模式**。\n2. 极强的逻辑思维、用户同理心与结果导向，能在不确定性中快速决策。\n3. 抗压能力强，拥有强烈的责任心与自驱力。\n4. 稳定高速网络与独立安静的办公环境。\n5. 熟练使用 Lark（飞书）、Zoom 等主流远程协作工具。\n\n优先条件\n- 拥有日活百万级以上产品经验优先。\n- 在爱奇艺、优酷、腾讯视频、哔哩哔哩、抖音、小红书、网易等大厂有**会员/广告商业化完整项目经历**者优先。\n- 具备团队管理或指导经验者优先。", "cat": "产品"}, {"id": "200", "title": "高级产品经理（增长方向）", "salary": "20k-30k", "location": "未明确", "jd": "一、岗位核心定位\n\n负责免费视频 App **从内容站点搭建 → 用户留存沉淀 → 向生态内其他 App 引流转化**的全链路运营。该 App 是集团/公司的重要**流量入口与用户蓄水池**，通过高质量免费视频内容吸引并留住用户，再将站内流量通过产品机制精准分发给其他 App，实现用户价值最大化与商业转化。\n\n二、岗位职责\n\n 1. 免费视频 App 站点建设与内容运营\n- 负责免费视频 App 的内容站点从 0 到 1 搭建与长期运营，包括**内容库规划、频道/栏目架构、首页推荐策略、播放页体验、搜索与追更体系**等产品化落地。\n- 围绕用户观看偏好持续优化内容供给与分发效率，提升**人均观看时长、播放完成率、播放转化率**等核心指标。\n- 结合热点与资源，设计专题活动、内容策划与推荐策略，保障站点内容的活跃度与新鲜感。\n\n2. 用户留存运营（核心职责）\n- 建立并持续优化**留存运营体系**，对**次日留存、7日留存、30日留存、DAU/MAU**等指标负责。\n- 设计并产品化落地**沉睡用户唤醒机制**与**流失预警模型**，通过 Push、短信、邮件等触达通道的配置化管理，提升用户回访频次与粘性。\n- 建设**用户标签系统（CDP）**与**分层运营中台**，针对新用户、活跃用户、沉默用户、流失用户制定差异化留存策略。\n- 搭建通用活动组件（签到、抽奖、集卡、限时任务等），通过低门槛活动配置后台持续刺激用户活跃与留存。\n\n3. 站内流量向其他 App 引流（核心职责）\n- 主导**免费视频 App → 其他 App 的引流转化链路**设计与运营，将站点留存流量通过产品机制高效分发给目标 App。\n- 负责 Deeplink（深度链接）、智能邀请码、分享回流 等引流产品机制的设计与落地，打通站内外导流通道。\n- 制定**内容种草、场景植入、活动导流、推荐位分发**等多维度引流策略，监控并优化**引流转化率、导流 ROI、新用户激活率**等关键指标。\n- 打通**公域引流与私域沉淀闭环**，实现免费视频 App 与其他 App 之间的用户流转与价值复用。\n\n4. 数据分析与增长模型\n- 搭建增长数据看板与预警体系，通过**漏斗分析、留存分析、转化分析**敏锐定位业务问题并提出优化方案。\n- 主导 A/B 测试，从文案、交互路径到算法策略分层，以数据驱动产品与策略迭代。\n- 对 **DAU/MAU、留存率、ROI、LTV、ARPU、播放完成率、点击率、转化率**等指标保持高度敏感与责任感。\n\n 5. 产品优化与运营基础能力建设\n- 深入分析用户使用路径与内容消费行为，识别首页推荐、频道页、播放页、搜索、收藏、追更、推送等环节的优化机会，输出产品迭代建议并推动立项、上线与复盘。\n- 参与运营后台、数据看板、活动工具、用户分层工具等**运营中台能力建设**，抽象通用组件，将增长方法论固化为**后台可配置的自动化工具**。\n\n6. 跨部门协作与行业洞察\n- 协同产品、研发、设计、算法、内容、渠道等团队推进重点项目落地。\n- 关注行业趋势与竞品动态（含海外竞品），持续沉淀运营方法论，支持业务长期增长。\n\n三、任职要求\n\n1. 本科及以上学历，5 年以上**互联网运营经验（用户运营、增长运营、内容运营或平台运营）。\n2. **有免费视频/短视频/内容平台/泛娱乐类 App 站点搭建与运营经验**，具备从 0 到 1 搭建内容站点或运营后台者优先。\n3. **有\"内容站点留存 + 向其他 App 导流/变现\"的实操经验**，熟悉站内流量分发、跨 App 引流链路者优先。\n4. 熟悉 **AARRR 增长模型**，深刻理解拉新、激活、留存、转化、召回的完整运营逻辑，并能转化为产品解决方案。\n5. 具备极强数据分析能力，熟悉 **DAU、MAU、留存率、LTV、ARPU、ROI、转化率、播放完成率**等核心指标，精通 Excel、数据看板、BI 工具，有 SQL、埋点分析、A/B 测试经验者优先。\n6. 具备产品思维，能基于用户路径和数据提出产品优化迭代建议，有运营后台、活动工具、用户分层工具建设经验者优先。\n7. 目标感强、结果导向，对 **DAU、留存、活跃、引流转化**等核心指标有高度责任感与担当。\n\n四、加分项\n\n1. 有海外 Google Play / App Store 应用商店运营优化（ASO）经验。\n2. 熟悉海外社交平台（如 TikTok、Instagram、YouTube）的引流产品机制。\n3. 有自动化营销工具（MA）或用户分群工具（如 GrowingIO / 神策）的实际使用经验。", "cat": "产品"}, {"id": "201", "title": "中高级运营专员（综合类方向）", "salary": "10K-35K", "location": "未明确", "jd": "岗位职责  （优先考虑境外办公人才，但需要是中国籍）如果简历中没有提到过留存，次留，用户增长，日活这样的关键词，不考虑\n1、负责免费视频 App 整体运营策略制定与落地\n（1）围绕用户增长、活跃、留存、转化及商业化目标，制定阶段性运营规划并推动执行。\n（2）负责平台级内容运营、用户运营、活动运营、渠道运营等综合运营工作，提升产品整体用户规模和活跃度。\n（3）对 DAU、MAU、次日留存、7日留存、30日留存、人均观看时长、播放转化率等核心指标负责。\n2、负责全平台获客链路与获客矩阵建设\n（1）搭建免费视频 App 的用户获客链路及获客矩阵，拓展站内外获客渠道。\n（2）制定渠道投放、自然增长、裂变增长、用户召回等多维度获客策略，持续优化用户获取成本与转化效率。\n（3）基于 AARRR 用户增长模型，系统推进拉新、激活、留存、转化、复购 / 召回等运营策略落地。\n3、负责数据分析与增长模型优化\n（1）精通流量运营全链路，能够围绕用户增长模型、漏斗分析、留存分析、转化分析，发现业务问题并提出优化方案。\n（2）具备项目管理能力，能制定阶段性运营目标、拆解 KPI，并推动执行落地。\n（3）对 DAU / MAU、留存率、ROI、LTV、ARPU、播放完成率、点击率、转化率等关键指标有较强敏感度和责任心。\n（4）通过数据看板、埋点分析、A/B 测试等方式，持续监控拉新、留存、活跃、转化等关键指标，及时发现问题并推动产品、内容、渠道策略优化。\n4、负责产品优化与迭代规划\n（1）深入分析用户使用路径和内容消费行为，识别产品在首页推荐、频道页、播放页、搜索、收藏、追更、推送、互动等环节的优化机会。\n（2）基于用户反馈、数据表现和业务目标，输出产品优化建议，推动产品需求立项、设计、研发、上线和复盘。\n（3）参与运营后台、数据看板、活动工具、用户分层工具等运营基础能力建设，提升运营效率。\n（4）负责阶段性产品迭代规划，推动产品体验、内容分发效率和用户留存能力持续提升。\n5、负责用户矩阵与社群矩阵运营\n（1）负责社媒矩阵及社群矩阵的整体布局与运营，包括账号体系规划、内容策略制定、渠道联动、用户分层及转化路径设计。\n（2）制定用户召回、活跃提升、会员 / 重点用户维护等策略，提升用户粘性和回访频次。\n（3）建立用户分层运营体系，针对新用户、活跃用户、沉默用户、流失用户制定差异化运营策略。\n6、负责活动运营与内容运营\n（1）策划并推动节日活动、专题活动、召回活动、用户激励活动等重点项目落地。\n（2）结合热点、内容资源、用户兴趣和平台目标，提升活动参与率、内容曝光效率、用户活跃和留存表现。\n（3）负责活动方案设计、资源协调、上线执行、数据跟踪和复盘优化。\n7、负责跨部门协作与项目推进\n（1）协同产品、研发、设计、算法、内容、渠道等团队推进重点项目及运营需求落地。\n（2）建立高效协同机制，保障项目按照运营目标和业务节奏推进。\n（3）关注行业趋势、竞品动态及新型增长方式，持续沉淀运营方法论，支持业务长期增长。\n任职要求\n1、本科及以上学历，3 年以上互联网产品运营、用户运营、增长运营、内容运营或平台运营经验。\n2、有视频、短视频、内容平台、社区、工具类 App、泛娱乐平台运营经验者优先。\n3、熟悉 AARRR 用户增长模型，理解拉新、激活、留存、转化、召回的完整运营逻辑。\n4、具备较强数据分析能力，能够通过数据发现问题、拆解问题并推动解决。\n5、熟悉 DAU、MAU、留存率、LTV、ARPU、ROI、转化率、播放完成率等核心指标，并能围绕指标制定运营策略。\n6、熟练使用 Excel、数据看板、BI 工具，有 SQL、埋点分析、A/B 测试经验者优先。\n7、具备产品思维，能够基于用户路径和数据结果提出产品优化及迭代建议。\n8、具备较强项目管理能力，能独立完成策略制定、项目推进、跨部门协作和结果复盘。\n9、目标感强，结果导向，对 DAU、留存、活跃、转化等核心指标有责任心。", "cat": "运营"}, {"id": "202", "title": "初/中级远程社媒运营（KOL & 内容方向）", "salary": "12-15K", "location": "初/中级远程社媒运营（KOL & 内容方向）", "jd": "岗位JD描述：岗位职责（不要过往行业经历只有web3的）\n负责 TG、Twitter/X、TikTok、Reddit 等海外社交媒体账号矩阵搭建与日常运营（养号、发布、引流）；\n负责短视频、图文等内容策划与制作，为矩阵和投放持续供给素材；\n负责 KOL/网红资源洽谈、投放与 ROI 优化；\n通过数据分析迭代内容与投放策略，推动海外流量到产品下载、转化闭环。\n\n任职要求：\n熟悉海外社媒平台运营、内容制作、KOL 对接及基础数据分析；具备执行力、学习能力、沟通协作能力，能适应远程协作。", "cat": "内容"}, {"id": "203", "title": "社媒组长", "salary": "15k-30k", "location": "未明确", "jd": "岗位职责：\n\n整体策略与运营规划：负责品牌在跨国社交媒体平台（Twitter/X、YouTube、TikTok、Instagram）的整体账号矩阵规划、定位及日常运营策略，对整体粉丝增长、互动率与转化目标负责。\n\n爆款内容策划与产出：深入洞察海外主流社交平台的流行趋势、梗文化及算法机制，带领团队策划并输出高质量图文、短视频及长视频内容，打造高传播度与爆款案例。\n\n团队管理与协同：管理并指导社媒运营团队（文案、视频剪辑、视觉设计等），制定月度/季度KPI，优化内容生产流程，提升团队整体产出效率与内容质感。\n\n数据分析与复盘优化：建立完善的社媒数据监测体系，定期跟踪并深度复盘各平台核心指标（曝光、粉丝增量、完播率、互动率等），基于数据反馈持续迭代运营策略。\n\n红人营销与跨界联动：配合品牌营销节点，拓展并对接海外优质KOL/KOC，策划联合推广与社媒互动活动，扩大品牌海外影响力。\n\n任职要求：\n\n硬性指标：具备 3年及以上 海外社媒运营经验，必须有从0到1或接手操盘过单账号粉丝量30万+（或多平台累计百万+）的成功经验（面试请附带作品集及真实数据证明）。\n\n平台实战能力：精通 Twitter/X、YouTube、TikTok、Instagram 的算法逻辑、用户人群画像及内容风向，了解各平台间的内容二次改编与分发策略。\n\n内容敏锐度：网感极佳，具备出色的审美品味和内容策划能力，能够快速捕捉热门趋势并结合品牌进行深度内容转化。\n\n数据驱动思维：具备强数据敏感度，能够熟练使用第三方社媒分析工具，善于从数据中发现问题并提出切实的优化方案。\n\n团队领导力：具备良好的团队管理能力、抗压能力与跨部门协同推进力，目标导向，执行力强。", "cat": "其他"}, {"id": "204", "title": "SEO专员", "salary": "10K-35K", "location": "未明确", "jd": "岗位JD描述\n\n岗位职责：\n\n全盘负责站点底层SEO架构优化；精细化管理动态Sitemap生成机制、robots.txt规则配置与爬虫抓取频次管理，确保千万级视频页面被高效抓取与收录。\n制定视频内容搜索排名核心策略；深度应用视频结构化数据（Schema Markup/VideoObject），优化视频聚合页与播放页的内部链接结构，提升核心页面权重。\n结合AI工具建立规模化的网页TDK生产SOP；搭建自动化长尾词挖掘与内容分发工作流，通过程序化SEO批量获取长尾流量。\n规划高质量外链建设方案，结合Facebook、X、Telegram等渠道的社交流量信号，综合提升网站DA/DR和搜索引擎信任度。\n建立SEO数据监控看板（基于Google Search Console、日志分析等）；定期进行全站爬虫日志分析，快速定位并解决死链、蜘蛛陷阱、降权等流量异常问题。\n\n任职要求：\n\n本科及以上学历，3年以上大型ToC网站SEO实操经验，有从0到1搭建SEO架构或流量翻倍的成功案例。\n深度了解Google、Bing、Yandex等主流搜索引擎排名机制与反作弊算法，精通白帽SEO，持续关注算法更新趋势。\n熟悉HTML/CSS/JavaScript对SEO的影响，了解AMP/SSR等移动端技术，能与技术团队无障碍沟通并推动SEO需求落地。\n数据敏感度强，具备日志分析能力，能从大规模服务器日志中发现爬虫抓取规律与瓶颈。\n执行力强，能独立推进SEO需求从分析到落地的全流程。\n\n加分项：\n\n熟练掌握Python，能独立编写脚本或自动化抓取工具进行竞品分析与数据处理者优先。\n有将业务数据或流量预警通过API接入Telegram Bot进行程序化管理经验者优先。\n有站群运营或大规模社媒账号矩阵流量协同经验者优先。", "cat": "运营"}, {"id": "205", "title": "SEO增长负责人（内容/媒体/视频资讯方向  年薪60–70万元 ）", "salary": "20k-30k", "location": "未明确", "jd": "岗位定位\n我们正在建设面向大众用户的内容、媒体及视频资讯平台，覆盖热点事件、娱乐资讯、人物、影视及视频内容。 \n现招聘一名SEO增长负责人，从0到1规划并搭建自然搜索增长体系。你将从业务目标出发，统筹SEO策略、站点架构、技术优化、内容增长、视频搜索和数据分析，推动产品、研发及编辑团队协同执行，对自然搜索流量、用户增长及商业结果负责。 \n这不是单纯的关键词优化或内容发布岗位。我们希望你既能制定增长策略，也能深入页面、数据和执行细节，建立可规模化、可持续、合规的SEO增长体系。 \n\n岗位职责 \n一、SEO增长策略 \n1.根据公司业务目标，制定年度及季度SEO增长策略，拆解流量、收录、关键词覆盖、用户增长及商业转化目标。 \n2.分析内容、媒体、热点资讯及视频领域的用户搜索需求、竞争格局和增长机会。 \n3.建立核心词、长尾词、热点词、人物词、事件词、影视词及视频词的关键词体系。 \n4.规划频道页、专题页、人物页、事件页、影视页、视频页、标签页及内容详情页等页面模型。 \n5.负责新站冷启动、网站权重建设及自然搜索流量规模化增长。 \n6.持续跟踪搜索引擎算法、搜索结果形态及用户搜索行为变化，及时调整增长策略。 \n二、技术SEO及产品协作 \n1.负责网站抓取、渲染、收录、索引、Canonical、robots.txt、站点地图及结构化数据等技术SEO工作。 \n2.优化网站信息架构、URL结构、内部链接、分页机制及页面模板。 \n3.针对大规模内容及视频页面制定抓取预算、索引管理和低质量页面治理方案。 \n4.推动视频结构化数据、视频站点地图、缩略图、字幕、标题及描述等视频搜索优化。 \n5.与产品及研发团队协作，推进页面性能、移动端体验、Core Web Vitals及服务端渲染等优化项目。 \n6.建立网站改版、URL迁移、页面上下线及重大版本发布的SEO评审和风险控制机制。 \n7.对网站日志、抓取数据、状态码及页面渲染结果进行分析，定位并推动解决技术问题。 \n三、内容及热点增长 \n1.制定符合用户搜索意图的选题方法、内容标准和编辑工作流程。 \n2.搭建热点发现、关键词判断、内容生产、页面聚合、更新维护及效果复盘机制。 \n3.平衡热点内容的时效增长与人物、事件、影视资料等常青内容的长期流量价值。 \n4.指导编辑团队优化标题、摘要、正文结构、图片、视频、标签及内部链接。 \n5.识别重复、薄弱、过期及低价值内容，制定更新、合并、重定向或下线策略。 \n6.推动优质内容获得媒体引用、自然外链及行业传播。 \n7.在版权、个人隐私、信息真实性和平台内容安全要求内开展SEO增长。 \n四、数据分析及增长实验 \n1.建立SEO数据看板、日常监控及周/月度复盘体系。 \n2.持续监控抓取、收录、排名、曝光、点击率、自然流量、用户留存及商业转化表现。 \n3.按页面类型、内容主题、关键词意图、用户价值和商业价值拆解SEO数据。 \n4.设计并推动页面标题、内容结构、页面模板、内链策略及视频信息等增长实验。 \n5.及时识别算法更新、流量异常、索引下降及人工处罚风险，并制定恢复方案。 \n6.评估自然搜索流量对新增用户、活跃用户、广告收入、会员收入或其他业务指标的实际贡献。 \n五、团队及项目管理 \n1.根据业务发展需要，规划SEO、内容、外链及数据相关岗位和协作资源。 \n2.建立SEO项目管理机制、执行规范、质量标准和绩效考核体系。 \n3.推动产品、研发、编辑、数据和商业化团队围绕SEO增长目标协同执行。 \n4.评估外部内容、媒体合作、数字公关及SEO服务资源的质量和投入产出。 \n5.定期向管理层汇报SEO目标进展、增长结果、业务贡献及潜在风险。 \n任职要求 \n1.5年以上SEO实战经验，有内容站、媒体站、视频站或大型资讯网站SEO经验。 \n2.有独立负责网站自然搜索增长的完整经历，能够提供真实、可验证的项目案例和增长数据。 \n3.熟悉百度和/或Google搜索机制；如负责海外业务，需要具备Google SEO实战经验。 \n4.熟悉大型内容网站的信息架构、页面模板、抓取预算、索引治理和内部链接策略。 \n5.熟悉视频页面搜索优化，理解视频结构化数据、视频站点地图、字幕和缩略图等优化方法。 \n6.熟练使用Google Search Console、GA4、百度搜索资源平台、Ahrefs、Semrush、Screaming Frog等工具。 \n7.能够阅读基础HTML、状态码、日志及前端渲染结果，并能与产品和研发团队有效沟通。 \n8.具备较强的数据分析、业务判断、项目管理和跨部门推动能力。 \n9.对搜索引擎算法变化敏感，能够快速判断流量波动原因并提出解决方案。 \n10.理解内容版权、个人隐私、信息真实性及平台内容安全要求，具备明确的合规意识。 \n\n加分项 \n1.有百万级以上月自然搜索流量项目经验。 \n2.有新站从0到1、网站规模化增长或算法影响后恢复经验。 \n3.有视频搜索、Google Discover、Google News或百度资讯生态增长经验。 \n4.有人物库、事件库、影视库、视频库或大规模专题页面建设经验。 \n5.有程序化SEO、日志分析、SQL、数据产品或自动化内容工作流经验。 \n6.有SEO团队招聘、培训、项目管理及绩效管理经验。 \n7.能够证明自然搜索增长最终带来了新增用户、活跃用户、广告收入、会员收入或其他商业结果。", "cat": "内容"}, {"id": "206", "title": "初级运营专员", "salary": "7-15K", "location": "未明确", "jd": "岗位职责\n1、负责APP内视频内容日常运营，根据运营规范完成内容发布、审核、上下架及维护，确保内容及时上线及正常展示；\n2、负责内容包装优化，包括标题、封面、标签、简介等，不断提升内容点击率、曝光率及基础转化率；\n3、每日监控核心运营数据，输出运营日报，对播放、点击、会员转化、付费转化等指标进行分析，发现异常并及时反馈；\n4、参与平台活动运营，包括专题策划、活动配置、数据跟踪及活动复盘，持续优化活动效果；\n5、维护内容资源池，结合用户偏好及平台需求，不断丰富内容标签及素材，提高平台内容供给质量；\n6、对接产品、审核、视频等相关部门，跟进运营需求落地，推动问题解决及项目执行；\n7、完成领导安排的其他运营工作。\n任职要求\n基本要求\n大专及以上学历，专业不限；\n1年以内运营经验，应届优秀毕业生亦可；\n熟悉短视频、影视、内容平台产品，对视频行业有浓厚兴趣；\n熟练使用Excel，具备基础数据分析能力（如透视表、VLOOKUP等优先）；\n工作细心，责任心强，执行力高，能够适应重复性工作。\n优先考虑\n有视频平台、短剧平台、小说平台、直播平台、内容社区运营经验；\n有内容审核、内容运营、活动运营经验；\n有一定数据敏感度，能够发现异常数据并提出优化建议；\n熟悉用户增长、会员转化、内容推荐逻辑者优先。", "cat": "运营"}, {"id": "207", "title": "运营副主管（网站运营）40K-65K/月", "salary": "40k-65k", "location": "未明确", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关，web3行业的经验)\n\n岗位职责：\n\n协助主管制定并执行网站运营策略，确保网站运营方向与公司业务目标保持一致，围绕流量增长、内容质量、用户体验、转化提升及运营效率优化推进整体工作。\n负责网站日常运营统筹管理，覆盖内容、页面、功能、更新维护等核心环节，保障网站稳定、高效运行。\n建立并持续优化网站运营流程、管理制度及SOP，提升团队整体执行效率和业务协同能力。\n持续监控网站流量、用户行为、转化率及其他关键运营指标，及时识别问题并提出数据驱动的优化方案。\n推动网站用户体验（UX）及转化率优化（CRO），持续改善用户旅程、内容承接效率和业务转化效果。\n推动SEO策略落地及相关技术优化，协同提升网站自然搜索表现、内容可见度及流量增长。\n协调产品、设计、开发等部门资源，推进网站功能优化、运营需求及数字化项目按计划落地。\n监督网站系统运行、安全性及性能表现，及时协调处理异常问题，降低运营风险。\n协助主管进行团队管理，包括工作规划、任务分配、绩效跟进、培训辅导及人才培养，保障团队稳定输出。\n\n任职要求：\n\n本科及以上学历，具备网站运营、内容运营、流量运营或相关岗位工作经验，有网站业务管理经验者优先。\n熟悉网站日常运营逻辑，对流量增长、内容质量、搜索表现、用户体验和转化优化有较强理解。\n具备较强的数据分析能力，能够围绕流量、行为、转化等核心指标进行问题判断与优化推进。\n熟悉SEO基础逻辑，能够协同推进自然流量增长及网站结构、内容、页面等优化工作。\n具备较强的组织协调能力、跨部门推动能力和问题闭环意识，能够推进事项按节点落地。\n有一定团队管理、项目推进或带教经验，能够协助主管完成团队管理和业务统筹。\n责任意识强，抗压能力较好，能够在多项目并行情况下保持稳定推进。\n\n加分项：\n\n有多网站或内容平台运营管理经验者优先。\n有SEO、CRO、UX优化相关经验者优先。\n有网站改版、功能优化或数字化项目推进经验者优先。\n有团队管理、绩效跟进及人才培养经验者优先。\n熟悉AI工具在网站运营、内容生产及效率优化场景中的应用者优先。", "cat": "运营"}, {"id": "208", "title": "运营副主管（40K-65K/月）", "salary": "40k-65k", "location": "未明确", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n岗位定位：\n协助开展团队管理与业务推进，承接部门经营目标及运营策略拆解，负责重点项目推进、团队执行管理、日常运营保障及跨部门协同，对分管业务模块的经营结果、项目交付质量和团队执行效率负责。\n核心职责：\n1. 承接制定的年度、季度及月度经营目标，拆解阶段性任务，推动各项运营工作按计划执行，并对分管业务结果负责。\n2. 负责重点运营项目推进，包括产品运营、内容运营、用户增长、流量增长、活动运营、转化优化等专项，统筹资源推动项目从方案、执行到数据复盘完整闭环。\n3. 持续跟踪新增、活跃、留存、充值、转化等核心指标，分析用户行为和业务问题，输出数据驱动的优化方案，并推动产品、运营动作持续迭代。\n4. 协助进行团队日常管理，包括任务分配、过程跟进、结果验收、绩效辅导、新人培养及团队梯队建设，提升团队执行力和交付质量。\n5. 负责运营流程、管理制度及SOP的落地和持续优化，推动日常运营标准化、流程化，降低执行偏差与运营风险。\n6. 统筹产品日常运营、内容质量、用户体验及异常问题处理，及时发现业务风险并推动闭环，保障产品稳定运营。\n7. 协调产品、研发、设计、数据、渠道等相关部门资源，推动重点功能、活动及运营需求按节点交付，提升跨部门协同效率。\n8.结果导向：对分管业务模块的经营指标达成、重点项目交付、转化与留存改善、运营执行质量、团队执行效率及问题闭环结果负责，保障制定的经营策略高质量落地。\n\n任职要求：\n1. 具备基础管理思维和较强的业务执行、项目推进及结果交付能力。\n2. 具备业务拆解、问题研判、数据分析及资源统筹能力，能够基于经营指标发现问题并推动解决。\n3. 具备较强的跨部门沟通协同能力，能够推动产品、研发、设计、数据等多方资源完成项目落地。\n4. 具备团队带教和过程管理能力，能够协助提升团队整体执行效率。\n5. 熟练使用数字化工具赋能运营工作，有实际提效成果者优先。\n6.一线业务参与\n直接负责或深度参与1—2个核心产品/重点项目，持续跟进内容、活动、用户、转化、付费、留存及渠道数据，不脱离一线业务。针对重点问题能够独立完成数据分析、问题定位、方案制定及执行跟进。\n\n7.方案落地与结果闭环\n针对业务问题提出可执行方案，并拆解为具体动作、Owner、Deadline、资源需求及验收标准。不能只停留在文档和想法层面，需要持续跟进研发、视觉、数据、渠道等相关部门，推动方案实际上线，并根据T0、3天、7天数据验证结果。\n\n\n\n加分项：\n有独立负责核心产品或重点运营项目的成功经验，能够通过数据分析定位业务问题，并推动产品、活动、用户增长或转化优化方案落地；\n具备 AI/Agent自动化应用、跨部门复杂项目推进、从0到1搭建运营机制或带队完成明确业绩增长 的实际案例者优先。\n有异常与风险处理能力，在系统故障、数据异常、转化下滑等情况下，能够快速判断优先级、协调资源并完成止损闭环。\n有从0到1搭建运营机制经验，如SOP、数据看板、用户分层、活动机制、内容体系或运营流程，并能够复制推广。", "cat": "运营"}, {"id": "209", "title": "运营副主管（免费产品）40K-65K/月", "salary": "40k-65k", "location": "未明确", "jd": "岗位JD描述(不要近期是bc博弈和棋牌相关的经验)\n\n岗位职责：\n\n1.向部门负责人汇报，协助统筹小组的工作；拆解阶段目标，明确各组分工、工作优先级、完成节点及验收标准，跟进执行进度与结果。\n2.统筹部门多款APP的运营，围绕日活、新增、次日及七日留存、商务广告点击、充值转化制定优化方案；结合产品体量、问题影响和资源情况，确定重点投入方向。\n3.亲自负责重点产品或关键项目，深入分析用户需求、内容表现及产品体验，提出具体改进方案，推动上线并复盘效果，形成可复制的运营方法。\n4.推进视频、漫画、小说、AI短剧等内容业务的运营优化，持续改善内容质量、首页展示、推荐内容及免费与付费权益配置，通过活动、用户引导和召回提升内容消费、留存及付费转化。\n5.建立产品及渠道数据跟踪机制，分析用户从新增、激活到留存和付费的表现；发现指标异常时，核对数据口径，协调技术排查，明确问题原因、改进动作及负责人。\n6.协同渠道团队评估新增质量、用户留存及获客成本，提出渠道调整建议；推进APP落地页矩阵及自然流量增长项目，跟踪访问、下载、激活和留存效果。\n7.协调产品、技术、视觉、渠道及商务等团队，将运营问题转化为明确需求，推进评审、排期、上线和验收；统筹视觉需求与资源，提升页面、封面和活动素材的业务效果。\n8.参与组长及运营成员的招聘、带教和绩效评估，完善运营SOP、工作检查及复盘机制，培养能够独立分析问题、制定方案并负责产品结果的成员。\n\n任职要求：\n\n1.具备内容型APP运营经验，熟悉视频、漫画、小说、短剧等业务中的一种或多种，能够提供本人实际负责的产品案例、运营动作及指标改善结果。\n2.具备团队管理经验，能够管理组长及运营成员，合理分配任务、协调资源、跟进进度，并通过带教提升团队独立负责产品的能力。\n3.具备多产品运营和优先级判断能力，能够结合产品规模、用户表现及业务目标制定计划，同时具备亲自操盘重点产品的能力。\n4.数据分析能力扎实，理解活跃、新增、留存、广告点击及付费转化等指标，能够从产品、内容、渠道和用户行为中定位问题，并提出可验证的优化方案。\n5.熟悉内容运营、用户运营及商业化转化方法，能够将内容调整、活动设计、权益配置和产品体验优化结合起来，持续改善业务结果。\n6.具备跨部门沟通和项目推进能力，能清晰表达需求、明确验收标准，主动处理执行中的阻碍，并及时向负责人反馈进度、风险及资源需求。\n\n加分项：\n\n1.有同时管理多款内容型APP，以及统筹运营与视觉团队的经验者优先。\n2.有提升用户留存、广告点击或用户规划增长的实际案例者优先。\n3.有APP落地页、SEO自然流量、社媒导流或渠道质量优化经验者优先。\n4.能熟练使用AI工具提升内容策划、竞品研究、数据整理及团队工作效率，并建立人工审核标准者优先。", "cat": "运营"}, {"id": "210", "title": "中高级平面设计师", "salary": "10-30K", "location": "未明确", "jd": "岗位定位：\n负责产品视频封面的制作以及日常活动的视觉设计，良好的沟通能力和自主设计能力，积极配合产品活动项目落地以及推广，设计产出符合大众审美并带来强烈的点击欲望，实现产品的点击量的持续增长和增加用户粘。\n\n岗位职责：\n要求候选人具有一定的审美能力，在日常运营工作中的设计产品封面/推广等工作，能够根据视频精彩内容输出美观吸睛的作品，并且按照相关需求输出动效活动banner以及会员卡/弹窗/海报等物料。\n\n团队与创意协同：\n与设计/内容团队协作优化视觉并进行审核，最终落地推广。\n\nAI 应用：\n运用 AI 工具完成整个设计流程，提高设计效率和质量。\n\n任职要求\n大专及以上学历，有3年以上平面/视觉相关经验者优先；\n熟悉主流设计方向，有良好审美和原创能力，有一定的figma基础，注重设计细节以及良好的沟通协作能力，精通（PS/Ai/AE/Pr/C4d）等软件，输出动效类的推广banner/海拔/弹窗等活动图。\n\n结果导向：具备良好的审美能力、沟通协调、抗压能力与团队协作意识，能适应快节奏工作；熟练运用 AI 工具辅助设计，候选人在国内和海外都可以。\n\n加分项：\n有成人行业经验首选，其次为传媒/视频/直播公司相关经验，会使用AE/C4d/figma等相关3d动效类的候选者优先考虑。", "cat": "设计"}, {"id": "211", "title": "PMO/项目管理", "salary": "8-10K", "location": "未明确", "jd": "岗位定位：作为GM经营管理辅助角色，协助推进重点业务及项目，强化过程管控、跨部门协调及结果闭环，推动经营目标有效落地。\n\n岗位职责：\n1、项目统筹与进度管理：负责各部门重点项目全生命周期跟踪，定期收集、汇总及评估项目进展，围绕关键节点、交付结果及目标偏差进行过程管控，及时识别风险并推动解决。\n2、重点事项推进与业务协同：参与重点业务事项及跨部门项目的过程管理，对GM及管理层明确的重点任务进行拆解、跟进和协调，推动责任人按计划完成关键节点；针对进度偏差、协同卡点及重大风险及时介入，并做好阶段性进展及节点结果汇报。\n3、经营会议及决议闭环：负责重点跨部门会议、GM例会等管理会议的组织与信息梳理，提炼关键决议、责任人及完成节点，并持续跟进决议事项落地，对延期、未闭环事项及时预警及推动解决。\n4、管理信息及项目看板建设：建立并持续优化重点项目及任务管理看板，定期输出周报/月报，清晰呈现项目进度、关键成果、风险问题及待决策事项，为GM及管理层掌握业务进展、资源协调和管理决策提供支持。                                                        \n\n\n任职要求\n1. 具备较强的项目管理、任务拆解和进度推进能力，能够独立跟踪多部门、多项目事项。\n2. 具备良好的跨部门沟通协调能力，能够有效推动责任人完成任务并解决协同问题。\n3. 具备较强的逻辑分析、信息整合和书面表达能力，能够高效输出会议纪要、项目报告、周报及月报。\n4. 具备风险意识和结果导向，能够及时发现进度偏差、潜在风险及未闭环事项，并推动解决。\n5. 熟练使用Excel、PowerPoint等办公工具，具备数据整理、项目看板及经营信息呈现能力。\n6. 工作认真细致、责任心强，具备较强的执行力、抗压能力和保密意识。\n7. 有经营管理、项目管理、PMO、总经理助理、业务运营或跨部门协同相关经验者优先。", "cat": "职能"}, {"id": "212", "title": "剧本组长（35K-55K/月）", "salary": "20-35K", "location": "未明确", "jd": "岗位职责；负责剧本组整体产出与储备；（1）对剧本采纳率、剧本储备月数（稳定 2–3 个月，含外包与采购）负责。；（2）统筹内部原创、外包撰写、剧本采购三条来源，合理分配产能。；（3）组员任务分配，跟踪各集剧本进度与质量。；负责剧本评审与方法沉淀；（1）组织本子评审，把控剧情成立、时长可控、钩子/爽点/断点有效。；（2）沉淀跑出成绩的结构、开场钩子、爽点、断点为方法，指导本组创作。；（3）参与立项前制作可行性会审，判断内容值不值得做。；负责不可外包内容的最终把关；（1）守住核心主线设定、男女主角核心人设、成片整体节奏，不外包、不放松。；（2）确保外包与采购剧本进入审核序列，不绕过卡点 1。；负责编剧梯队建设；（1）搭建编剧梯队并组织互评，培养储备组长。；（2）新入职编剧的带教与适应期缩短。；任职要求；本科及以上学历，5 年以上编剧/内容创作经验，其中 2 年以上团队带教或统筹经验。；具备带编剧团队的能力（核心要求）——各线最缺的不是编剧，是能带编剧的人。；有网文/短剧/动漫/影视等成规模内容的主创或统筹经验，有代表作品。；深刻理解爽点、钩子、断点、节奏等短剧/网文创作规律。；具备内容判断力与评本能力，能快速判断本子优劣与改进方向。；熟悉外包协作与剧本采购流程者优先。；自带成熟编剧团队者优先。；关键考核指标：剧本储备月数、采纳率、上线后相对表现、续作能力、是否带出储备组长。；", "cat": "其他"}, {"id": "213", "title": "编剧", "salary": "15-25K", "location": "未明确", "jd": "岗位职责；负责核心剧本与爆款项目创作；（1）撰写项目核心主线、分集剧本、锁定版剧本，确保剧情成立、时长可控。；（2）设计开场钩子、爽点节奏、集末断点，提升留存与完播。；（3）参与男女主核心人设与标志性场景的设定。；负责剧本迭代与数据响应；（1）参与立项前制作可行性会审，与生成组确认镜头可制作性。；（2）根据上线数据（前 3 秒留存、完播率、付费转化、转发）与观众口碑，调整后续剧集与选题。；配合审核与制作；（1）配合剧本审核在卡点 1 完成锁定，及时响应修改意见。；（2）配合导演与生成组，保障剧本到分镜的顺畅转化。；任职要求；大专/本科及以上学历，2 年以上编剧经验（短剧、网文、动漫、影视方向）。；有真实代表作品，审美与内容判断力优先于 AI 工具操作能力。；精通爽文/短剧叙事套路，熟悉钩子、反转、爽点、断点设计。；有单部完整作品的创作经验，能独立产出成熟分集剧本（成熟编剧月产约 2 部）。；对上线数据敏感，愿意以市场反馈迭代创作。；有女频/男频、悬疑、都市、玄幻等热门题材经验者优先。；关键考核指标：剧本采纳率、上线后相对表现、续作能力（不按写了多少集评价）。；", "cat": "内容"}, {"id": "214", "title": "视频生成组长（25K-50K/月）", "salary": "25-50K", "location": "未明确", "jd": "岗位职责；负责生成产能组织与调度；（1）按剧本场次数分配生成人力（投入人数 > 场次数则边际效益迅速下降；最小作业单元 1 导演 + 3 生成）。；（2）保障目标产能 2–3 分钟/人/天（通过卡点 4 的合格成片分钟数）。；（3）管理动态额度申请，优先保障高质量有效产出。；负责生成质量把控；（1）对合格镜头率、一次通过率、单位算力产出负责。；（2）与导演对齐分镜归属与画面风格。；负责工具回流与资产沉淀；（1）回流生产数据与优质参数至技术团队与共享资产库。；任职要求；大专/本科及以上，3 年以上视频制作/AIGC 视频生成经验，1 年以上带组经验。；精通主流 AI 视频生成工具链与工作流，理解人物稳定、动作自然、场景不漂移的控制方法。；具备产能组织能力，能按场次数与难度合理排产。；对算力成本与产出效率敏感。；自带成熟编剧团队者优先。；关键考核指标：合格镜头率、单位算力产出、单人日产能、一次通过率、是否带出储备组长。；", "cat": "内容"}, {"id": "215", "title": "AI 视频生成（20-40K/月）", "salary": "20-40K", "location": "未明确", "jd": "岗位职责；负责镜头视频生成；（1）依据分镜脚本生成镜头素材，保证人物稳定、动作自然、场景不漂移。；（2）达成目标产能 2–3 分钟/人/天（指通过卡点 4 的合格成片分钟数）。；（3）常规对话、静态场景可批量生成；高难度打斗、多人复杂互动为重点攻坚。；负责生成质量与自检；（1）对一次通过率、合格镜头率负责，减少返工。；（2）瑕疵镜头初筛，配合镜头审核执行卡点 4。；配合资产与参数沉淀；（1）回流优质随机种子、构图参数、微调资产至共享库。；任职要求；大专及以上学历，1 年以上视频制作、后期或 AIGC 相关经验（应届优秀者可放宽）。；熟练使用 AI 视频生成工具，理解提示词、参数、种子对稳定性的影响。；有画面审美与镜头感，能判断生成结果是否达标。；细致、有耐心，能承担产量与一次通过率压力。；现有剪辑/后期人员经培训可内部转岗。；关键考核指标：产量、一次通过率、合格镜头率、单位算力产出。；", "cat": "AI / AIGC"}, {"id": "216", "title": "产品专员（重点项目推进与业务协同）", "salary": "10-15k", "location": "未明确", "jd": "岗位定位\n作为GM及管理层的\"业务推进抓手\"，负责跨部门重点项目的全生命周期跟踪与过程管控，确保关键任务按节点落地、管理决议有效闭环。需要脑子活、反应快、眼里有活，能主动发现卡点并推动解决，而非被动等指令；同时善用AI工具提升信息处理与推进效率，把重复性工作交给工具，把判断和协调留给自己。\n岗位职责\n1. 重点项目全生命周期跟踪与过程管控负责各部门重点项目从立项到交付的全生命周期跟踪，定期收集、汇总及评估项目进展；围绕关键节点、交付结果及目标偏差进行过程管控，及时识别风险并推动解决，确保项目不\"漂移\"、不\"烂尾\"。\n2. 重点事项推进与业务协同参与重点业务事项及跨部门项目的过程管理，对GM及管理层明确的重点任务进行拆解、跟进和协调，推动责任人按计划完成关键节点；针对进度偏差、协同卡点及重大风险及时介入，做好阶段性进展及节点结果汇报，做到问题不过夜、卡点有回音。\n3. 经营会议组织及决议闭环负责重点跨部门会议、GM例会等管理会议的组织与信息梳理，高质量完成会议纪要，精准提炼关键决议、责任人及完成节点；持续跟进决议事项落地，对延期、未闭环事项及时预警并推动解决，形成\"开会—记录—跟进—闭环\"的完整链路。善用AI工具进行会议录音转写、纪要初稿生成与决议事项结构化提取，提升会议信息处理效率与准确度。\n4. 管理信息及项目看板建设建立并持续优化重点项目及任务管理看板，定期输出周报/月报，清晰呈现项目进度、关键成果、风险问题及待决策事项，为GM及管理层掌握业务进展、资源协调和管理决策提供支持。能借助AI工具完成多源信息的汇总整理、周报/月报初稿生成及进度数据初步分析，把精力聚焦在风险判断与协调推动上。\n任职要求\n必备条件\n • 本科及以上学历，1—3年项目管理、产品运营、业务协同或总助/PMO相关经验；\n • 机灵、反应快、主动性强：能快速理解业务意图，对进度偏差和协同卡点有敏感度，不等不靠、主动补位；\n • 进度管控能力强：熟悉项目拆解与节点管理，能盯住关键路径、识别风险并推动责任人按时交付；\n • 会议纪要功底扎实：能在一场信息密集的会议后，快速产出结构清晰、决议明确、责任到人的纪要，不漏关键信息、不写流水账；\n • 沟通协调能力突出：能在多部门、多层级之间顺畅对接，既能把管理层意图准确传导下去，也能把一线卡点有效带上来；\n • 熟练使用AI工具：能熟练运用AI助手/大模型工具（如ChatGPT、Claude、豆包、Kimi、通义等）辅助完成会议纪要整理、信息提炼、周报月报撰写、任务拆解与结构化输出；具备基本的提示词（Prompt）设计能力，能针对不同任务场景设计有效指令，并对AI输出进行审核与修正，不照单全收；\n • 熟练使用项目管理/协作工具（如飞书、钉钉、Teambition、Notion等），具备看板和报表搭建能力。\n加分项\n • 有GM例会、经营分析会等管理层会议支持经验；\n • 有跨部门重点项目从0到1推进并落地的完整案例；\n • 具备一定的数据分析能力，能用数据说话、用看板呈现进展；能用AI工具辅助数据整理、趋势分析与可视化呈现；\n • 有将AI工具融入日常工作流、沉淀出可复用模板或SOP的经验；\n • 抗压性好，能在多项目并行、节奏快的环境中保持条理。\n我们看重的人\n • 眼里有活：不是等着被安排，而是主动发现哪里会掉链子、哪里需要协调；\n • 盯得住事：答应跟进的节点一定有着落，延期事项会提前预警而不是事后解释；\n • 说得清话：会议纪要不失真、汇报进展不注水、跨部门沟通不添乱；\n • 用得好工具：把AI当\"副驾驶\"而不是\"甩手掌柜\"，工具产出经得起核对，判断和协调仍靠自己；\n • 扛得住压：多线并行时不慌，关键时刻能顶上去推动业务往前走。\n汇报对象\nGM / 管理层（或指定的业务负责人）", "cat": "职能"}, {"id": "217", "title": "运营专员", "salary": "9k-14k", "location": "未明确", "jd": "岗位职责\n1，平台增长与商业化运营\n深度参与用户增长、留存及商业变现相关工作，协助优化平台盈利模式，逐步独立承担运营策略制定与落地工作。\n2，内容运营与流量优化\n负责内容选题策划、制作发布与数据复盘优化，依托优质内容助推用户增长与转化；具备短视频剪辑、SEO 优化任一专项能力即可，可独立完成视频剪辑成片，或熟练掌握关键词布局、站内优化、流量引流等 SEO 实操技巧，全方位提升内容曝光与自然流量。\n3，用户精细化运营\n结合用户行为数据与真实反馈，深挖用户需求、梳理使用路径，参与用户分层运营，搭建精细化运营体系。\n4，活动策划与转化提升\n主导并配合完成平台各类运营活动策划与落地，持续优化活动玩法，有效拉升用户活跃度与商业转化效果。\n5，AI 工具赋能提效\n灵活运用各类 AI 工具赋能内容生产、日常运营工作，积极探索全新使用场景，大幅提升整体工作效率。\n6，项目执行与复盘迭代\n独立负责对应运营模块及重点项目推进，完成全流程落地执行，定期开展工作复盘，总结经验并输出优化方案，持续迭代运营打法。\n简历筛选核心要点\n1，从业经验要求\n有海外社交产品、同志社群平台（LGBTQ+）、兴趣社区、情感陪伴类产品运营经验者优先，熟悉相关用户群体特征、内容生态及用户增长逻辑。\n必备专项技能（二选一）\n① 短视频剪辑：熟练使用主流剪辑软件，可独立完成短视频剪辑、包装产出，具备内容审美与网感优先；\n② SEO 优化：熟悉搜索引擎规则，精通关键词挖掘、页面优化、流量提升等实操方法，有自然流量增长实操经验优先。\n2，具备商业化运营思维\n无需全盘操盘变现业务，熟知运营动作与营收收益的关联逻辑；有会员运营、付费内容推广、付费转化活动相关经验优先，洞悉用户付费需求者加分。\n3，拥有用户思维与数据分析能力\n善于站在用户视角思考问题，能整理分析用户反馈、研判用户行为，具备基础数据复盘与需求拆解能力，有用户分层、用户运营相关经验更佳。\n4，具备独立策略思考能力（重点）\n拥有主动思考与自主优化意识，可独立参与内容规划、活动设计、运营策略调整等工作，只要具备主动优化、积极复盘的思维，均可邀约面试。", "cat": "运营"}, {"id": "218", "title": "新媒体运营专员（远程）", "salary": "9k-14k", "location": "新媒体运营专员（远程）", "jd": "核心任务：从 0 到 1 快速起号与矩阵构建\n 我们需要一位深谙海外社交媒体底层逻辑的“操盘手”。你不仅要懂内容，更要懂流量分发机制，能够带领账号在短时间内突破新手期并实现粉丝指数级增长。\n \n 具体职责：\n 1. 全平台起号： 负责 Twitter (X)、Facebook、Instagram 等海外主流平台的账号矩阵搭建与起号工作，能在 1-3 个月内实现粉丝数从 0 到万级的突破。\n 2. 内容策略： 制定并执行各平台差异化内容方案，包括短视频、图文及热点推文，确保内容具备病毒式传播潜力。\n 3. 矩阵化运营： 熟练运用账号矩阵策略，通过号群联动、交叉引流，低成本获取高精准流量。\n 4. 数据复盘： 实时监控运营数据（播放量、点击率、留存率、转化率等），并根据数据反馈快速迭代内容方向。\n 5. 粉丝转化： 提升账号活跃度与互动率，通过社群运营或私域转化，实现品牌曝光与业务增长双赢。\n 6.内容剪辑：有剪辑视频，二创能力，具备基础的内容整合视频剪辑技能。\n简历筛选要点：\n• 硬核实操： 3 年及以上海外媒体运营经验，拥有可验证的从 0-1 起号成功案例（面试需展示过往账号数据及增长曲线）。\n • 平台精通： 深度理解 Twitter、Facebook、Instagram 的算法推荐逻辑、风控规则及广告投放工具。\n • 矩阵思维： 有账号矩阵运营实操经验，了解防关联技术、号群分配及自动化管理工具者优先。\n • 敏锐嗅觉： 能够捕捉海外流行趋势及梗文化，迅速产出符合当地受众审美的爆款内容。\n • 语言能力： 优秀的英文/中文读写能力，能够独立进行文案创作及粉丝互动。\n • 目标导向： 对数据敏感，极强的抗压能力和自驱力，以结果为导向。\n 加分项 (Plus)\n • 有 TikTok 或 推特 成功起号经验者优先。\n • 具备 AI 工具辅助生产高效内容的技能。\n • 有海外广告投放（FB Ads/X Ads）推广号投流经验，能实现“内容+付费”协同增长。", "cat": "运营"}, {"id": "219", "title": "产品经理", "salary": "15-30k", "location": "未明确", "jd": "岗位职责\n1.负责内容社区类产品的产品设计、迭代与体验优化，对核心链路指标（拉新、留存等）负责。\n2.参与产品规划与版本节奏管理，完成需求调研、需求分析、方案设计、原型输出与 PRD/交互说明撰写。\n3.主导或参与核心模块建设与持续迭代，包括但不限于：内容发布与管理、内容分发、社区互动、播放/阅读体验、会员与广告体系等。\n4.建立并完善埋点与指标体系，结合数据表现与用户反馈，持续推进功能优化与体验提升，形成“上线-验证-复盘-迭代”的闭环。\n5.协调设计、研发、测试、运营等团队资源，推动需求评审、排期、联调、验收与上线，确保项目高质量按期交付。\n6.参与用户增长与商业化相关功能设计、支持广告与会员体系在产品侧的体验优化与链路打通。\n7.持续跟踪行业趋势与竞品动态，沉淀方法论与产品规范，提升产品竞争力。\n\n任职要求\n1.重点强调细心、主动性强、沟通理解能力强；\n2.本科及以上学历，3-5 年互联网产品经理经验；有内容社区产品经验优先。\n3.熟悉移动端产品设计流程，能够独立完成需求分析、原型设计（Figma/Axure/墨刀等）及 PRD/交互文档撰写。\n4.对内容社区产品核心链路有理解：内容供给、分发机制、互动体系与社区治理基础能力（至少熟悉其中 1-2 个模块）。\n5.具备基础数据分析能力与数据意识：能定义关键指标与埋点需求，能基于数据与反馈提出可落地的改进方案。\n6.具备良好的沟通协调与推进能力，能跨团队推动项目落地并处理风险与问题。\n7.学习能力强、逻辑清晰、责任心强，具备较强的问题拆解与解决能力，抗压与自驱力佳。\n8.熟练使用AI Agent提升工作效率，可AI搭建产品；\n\n\n加分项\n1.男同优先；\n2.做过内容推荐/Feed 流策略相关产品。\n3.做过会员/广告产品链路相关体验优化。\n\n应聘材料\n简历 + 代表作品（可附原型/PRD节选/作品集链接，脱敏即可）。", "cat": "产品"}, {"id": "220", "title": "中级运营（seo方向）", "salary": "10-20k", "location": "未明确", "jd": "简历筛选要点\n1.3年及以上 SEO 或内容运营经验，做过英文站/海外流量站点，有独立负责站点或频道从 0 到有稳定自然流量的完整经验。\n2.理解搜索引擎抓取、索引、排名机制，清楚什么样的内容会被收录、什么样的不会，能讲清判断依据而非只背概念。\n3.熟练使用 Google Search Console 与 GA4，能从数据中定位问题（收录下降、点击率异常、流量突变），而不只是导出报表。\n4.会用至少一款关键词工具（Ahrefs / Semrush 或同类）做关键词研究、竞品分析和内容缺口判断。\n5.熟悉技术 SEO 基本概念（sitemap、canonical、hreflang、结构化数据、Core Web Vitals），能识别问题、准确描述现象并向开发提出可执行的修复需求。\n6.熟悉使用 AI 工具（Claude、ChatGPT 等）提升选题、内容生产、数据整理和文档效率。不是只会让 AI 批量出稿，必须能人工判断内容质量、事实准确性、重复度和被搜索引擎判定低质的风险。\n岗位职责\n1. 负责公司 内容站点矩阵的 SEO 落地与自然流量增长，包括关键词布局、栏目与页面结构、内链体系和内容模板的执行与优化，能按站点价值分配精力而非平均用力。\n2.基于关键词工具与搜索需求数据完成关键词研究、竞品分析和内容缺口判断，输出选题方向并转化为可执行的内容排期。\n3. 制定并维护内容生产的 SEO 规范（标题、描述、正文结构、内部链接、实体覆盖），保障批量产出的内容符合收录与排名要求。\n4. 负责 AI 批量生成内容的质量与合规审核，包括可读性、事实准确性、重复度和低质风险判断，避免低质内容进入线上。\n5. 通过 GSC / Bing Webmaster / IndexNow 等渠道跟踪收录率与索引状态，定位未收录、软 404、重复内容、抓取浪费等问题并推动解决。\n6. 建立日常 SEO 巡检机制，定义关键指标与告警阈值（收录率、抓取异常、结构化数据错误、流量突变），对异常分级响应并跟进修复闭环。\n识别技术 SEO 问题并向前端/后端提出明确修复需求，推动开发排期，修复后负责效果验证；与产品、开发、内容保持高效协作。\n7.  跟踪 Google 核心算法更新与政策变化（如 spam policy、site reputation abuse 等），评估对站群的影响并及时同步风险信号。\n8. 沉淀 SEO 操作规范、检查清单、内容模板和 AI 协作方法，提升多站点批量运营的整体交付效率。", "cat": "运营"}, {"id": "221", "title": "短剧编剧（男同）", "salary": "8-15k", "location": "工作方式： 全职 / 远程", "jd": "岗位名称： 男男短剧编剧\n内容方向： 成人向 / 非成人向\n工作方式： 全职 / 远程\n\n01 · RESPONSIBILITIES\n你将负责\n研究男男题材受众、内容平台和流行趋势，参与成人向与非成人向项目的选题策划、内容调研和创意提案。\n独立或协同完成故事梗概、人物小传、关系线、分集大纲、剧本正文及相关创作说明。\n塑造具有主体性和可信动机的男性角色，设计清晰的关系推进、情感拉扯、核心冲突与成长变化。\n根据内容分级处理亲密关系与情欲表达，使成人向桥段服务于人物和剧情，非成人向项目保持适配受众与平台的表达尺度。\n确保成人向项目中的角色均为成年人，关系与情节建立在明确自愿和清晰边界之上，并符合适用法律、发布地区及平台规则。\n强化开篇钩子、单集卡点、情绪递进和关键反转，同时控制场景、角色与制作成本，保证拍摄可执行性。\n参与剧本评审与围读，根据制片、导演及运营反馈高效迭代，并结合成片和数据表现持续复盘。\n02 · REQUIREMENTS\n我们期待你\n年满18周岁，能够接受工作中接触成人向文字、视听素材及相关创作沟通。\n理解男男情感关系和相关受众需求，尊重多元性别与性倾向；本岗位不限定应聘者性别或性倾向。\n具备扎实的故事结构、人物塑造和对白写作能力，能避免人物工具化、标签化与关系逻辑失真。\n熟悉短剧叙事规律，理解前段抓人、强冲突推进、单集留钩和情绪兑现。\n能准确区分成人向与非成人向表达，具备清晰的同意意识、内容边界和平台合规意识。\n具备良好的沟通、协作和节点意识，能够理解反馈并在明确期限内完成高质量迭代。\n03 · NICE TO HAVE\n加分项\n有上线男男短剧、网剧、小说、漫画或互动叙事作品。\n擅长都市情感、甜虐、悬疑、成长等一种或多种类型。\n有成人向内容、IP改编或跨文化发行经验。\n了解现场拍摄、亲密场景沟通、制片成本或平台审核规则。\n04 · APPLICATION\n简历提交\n**代表作品：**1至3部男男题材作品或节选，注明成人向或非成人向及本人贡献。\n**创作样稿：**短剧大纲、人物小传或前3集剧本，重点展示人物关系与开篇钩子。", "cat": "内容"}, {"id": "222", "title": "视频生成专员", "salary": "8-15k", "location": "未明确", "jd": "### 岗位职责\n\n- 根据分镜头脚本、参考图和提示词完成 AI 视频镜头生成。\n- 负责人物、场景、动作、表情、运镜等画面效果的生成与优化。\n- 根据审核意见修改镜头，提升有效镜头率。\n- 保证角色形象、服装、场景和画面风格在不同镜头中的一致性。\n- 配合剪辑组完成镜头交付，确保素材可剪辑、可上线。\n- 整理生成参数、提示词、参考图和成片素材，做好版本归档。\n\n### 招聘要求\n\n- 0.5 年及以上 AIGC 图像 / 视频生成实操经验。\n- 熟悉至少一种 AI 视频或图像生成工具，具备实际生成经验。\n- 能理解分镜头脚本，具备基础镜头语言和画面审美。\n- 能根据剧本和分镜要求编写、优化提示词。\n- 具备人物一致性、场景连续性和动作合理性的判断能力。\n- 能接受反复修改，按项目节点稳定交付镜头素材。\n- 有 AI 短剧相关工作经验者优先择用。", "cat": "内容"}, {"id": "223", "title": "线上推广专员", "salary": "8-10k", "location": "考核方式：底薪制，按试用期任务完成情况和带来的新用户数、付费金额考核。试用期内三件没完成的，不通过试用期。工作方式：全职、远程。", "jd": "1. 大专及以上学历，2 年以上海外线上推广或渠道推广经验，能接受男同性向内容相关产品的推广工作。\n2. 熟悉 Telegram（频道、群）、Twitter 等海外平台的引流玩法，有实际拉新成果，能说明自己负责的渠道每天带来多少新用户、多少付费。\n3. 了解网站 SEO 基本逻辑，有搜索引擎流量增长经验者优先。\n4. 自己有在运营的 Telegram 频道/群、社交账号或网站，或者有合作过的站长、代理资源者优先。\n5. 会看数据、会写文案，能独立把一个推广渠道从 0 做到每天有稳定新用户。\n6. 能远程全职工作，自驱力强，回消息及时，接受按新用户和付费数据考核。\n---\n筛选注意\n只做过抖音、小红书、微信等国内平台的不匹配；只做过广告投放、没做过引流的不匹配；简历里没有具体数据的不匹配。\n\n岗位职责\n\n1. 负责产品在 Telegram（频道、群）和 Twitter 等海外社交平台的推广与引流，持续带来新用户。\n2. 负责官网的搜索引擎优化（SEO），提升自然搜索带来的用户。\n3. 开拓和维护外部合作的网站、代理，洽谈合作、安排推广位、跟进效果。\n4. 每周对各推广渠道做数据复盘，效果好的加大投入，效果差的及时停掉。\n5. 整理推广所需的图片、文案、链接等素材需求，和设计、技术对接落地。\n6. 按要求输出日报、周报，汇报各渠道的新用户、付费和下一步计划。\n\n试用期内需完成：\n1. 至少 2 个线上推广渠道从 0 搭建并开始带来新用户\n2. 开拓至少 5 家外部合作网站或代理并上线\n3. 每周渠道数据复盘报告\n\n考核方式：底薪制，按试用期任务完成情况和带来的新用户数、付费金额考核。试用期内三件没完成的，不通过试用期。工作方式：全职、远程。\n\n\n---\n加分项\n1. 自带成人类或男同类站长、代理资源，入职就能开展合作。\n2. 自己做过成人类网站或引流账号从 0 到有量的案例。\n3. 会做简单的推广图片和文案。", "cat": "商务 / 市场"}, {"id": "224", "title": "渠道运营专员（数据与工具方向）", "salary": "8-10k", "location": "考核方式：上面三件是否按期跑起来并稳定；报表准确率、对账差错率、省下的人工。试用期内三件没按期做出来的，不通过试用期。工作方式：全职、远程。", "jd": "1. 大专及以上学历，1 年以上运营、推广或渠道相关的数据统计、对账经验，能接受男同性向内容相关产品。\n2. 会用 AI 工具（如 ChatGPT、Claude）写小脚本、做小工具，或者会 Google 表格/Excel 的脚本和公式，能把重复的统计、填表工作做成自动的；自己做过 Telegram 机器人或自动报表的优先。\n3. 看得懂新增用户、付费、投入产出这些基础指标，能从数据变化里发现异常。\n4. 熟练使用 Google Sheets / Excel，能整理数据、做报表。\n5. 执行力和配合度高：工作时间内消息 30 分钟内必回，交办的事当天有回复；做出来的工具要持续维护，不是做完就放着。\n6. 细心、按流程办事，能接受多项杂事并行；能远程全职工作。\n\n---\n加分项\n1. 做过自动化脚本、机器人或自动报表，能说明省了哪些人工。\n2. 有成人类产品推广或渠道对接经验。\n3. 会简单的 Python。\n\n---\n筛选注意\n只会 Excel 手工整理、没用过 AI 工具和脚本的不匹配；纯开发、没做过运营数据的不匹配；只想做工具不愿意接日常杂事的不匹配。面试时要问清每天在线时段和回消息习惯。\n岗位职责\n\n1. 协助渠道负责人对接合作的网站和代理：生成推广链接、发给合作方、跟进上线。\n2. 日常维护：帮合作方更换链接和宣传图，登记点击数据，按表格跟进每条合作的状态。\n3. 整理结算：每期给合作方的结算单、付款资料、对账，按时交给财务。\n4. 数据报表：每天从后台导出数据做成日报周报；按合作渠道算投入产出；发现数据异常、合作到期及时提醒。\n5. 工具建设：用 AI 工具、脚本或机器人把生成链接、填表、出报表、到期提醒这些重复工作自动化；维护团队的共享表格和小工具。\n6. 完成渠道负责人交办的其他事务。\n\n试用期内需完成：\n\n1. 把每天的渠道日报、周报做成自动出：从后台导出的数据，用脚本或 AI 工具自动算出每条渠道的新增、付费、投入产出，填进共享表格，人只做检查\n2. 做一个 Telegram 提醒机器人：合作到期、渠道掉量这类提醒每天自动发给负责人\n3. 结算单半自动：按模板由脚本生成对账单，人工复核，一期无差错\n\n考核方式：上面三件是否按期跑起来并稳定；报表准确率、对账差错率、省下的人工。试用期内三件没按期做出来的，不通过试用期。工作方式：全职、远程。", "cat": "商务 / 市场"}, {"id": "225", "title": "编辑专员", "salary": "7K-10K（优秀可面议）", "location": "未明确", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；黑料吃瓜等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "其他"}, {"id": "226", "title": "编辑专员", "salary": "7K-10K", "location": "未明确", "jd": "一、岗位职责\n1. 文案撰写： 负责泛娱乐/吃瓜类内容的日常文案撰写（推文、短视频脚本、社交媒体动态、标题等），根据运营策略产出高点击、高传播的内容；针对、911爆料、91爆料、黑料吃瓜网等平台调性灵活调整文风；配合热点事件快速产出时效性文案。\n2. 图文编辑与排版： 负责图文内容的编辑、排版与发布，确保排版美观、阅读流畅；配合专题策划与活动页面搭建；对已有内容进行二次优化更新，把控文字校对与信息准确性。\n3. 图片处理： 使用 PS、美图秀秀、Canva 等工具完成配图处理（裁剪、调色、加字、封面制作等）；海报等信息图素材；把控图片质量并符合各平台规范；维护图片素材库。\n4. 选题与热点跟进： 持续关注泛娱乐动态（明星八卦、综艺影视、热搜话题等），每日监测热搜并输出选题建议；参与选题会讨论与内容排期；定期分析竞品内容。\n\n二、任职要求\n1.大专及以上学历，新闻、中文、传媒、广告等相关专业优先；1年以上文案/编辑相关工作经验，优秀应届生亦可考虑。\n2.具备扎实的文字功底，能驾驭搞笑吐槽、情感走心、硬核科普等多种文风。熟练使用 Photoshop 进行配图处理与封面制作，会使用美图秀秀、Canva 等工具加分；熟悉秀米、135编辑器等图文排版工具。重度社交媒体用户，网感强、对网络热梗敏感，对泛娱乐领域有浓厚兴趣且能第一时间感知热点。\n3.具备一定视觉审美，对配色、构图、字体有基本判断力。执行力强，能在热点爆发后快速响应产出；沟通顺畅、能高效配合团队，适应快节奏的内容生产环境。\n\n三、加分项\n1.有泛娱乐/自媒体内容运营经验者优先；\n2.有爆款内容案例者优先；会使用剪映、PR 进行基础视频剪辑者优先；\n3.会使用 AI 工具辅助创作者优先", "cat": "其他"}, {"id": "227", "title": "舆情收集员", "salary": "8K-15K（优秀面议）", "location": "未明确", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "其他"}, {"id": "228", "title": "SEO专员", "salary": "10-18k", "location": "未明确", "jd": "一、岗位职责\n1、负责公司多个网站的 Google、Yandex SEO优化及日常维护，持续提升网站收录、关键词排名及自然搜索流量。\n2、负责网站日常SEO巡检及数据监控，通过 Google Search Console、GA4、Yandex Webmaster 等工具监控收录、排名、流量、Spider抓取及异常波动。\n3、负责网站基础及技术SEO优化，包括 TDK、H标签、Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL路由、分页、Tag、内链、结构化数据、HTML源码输出等。\n4、负责自然搜索流量下降、关键词排名下降、收录异常、404、异常URL、Spider抓取异常等问题的排查，并能够根据数据定位原因及提出解决方案。\n5、负责网站域名迁移、CDN域名、直连域名及多域名SEO相关工作，配合处理301重定向、域名规范、搜索引擎抓取、索引及流量承接等问题。\n6、根据SEO问题独立整理优化需求，与运营、产品、前端、后端及技术人员进行沟通，并负责测试服验收、正式服复查及上线后的数据验证。\n7、参与新站及网站重构项目SEO建设，制定和检查 URL、TDK、H标签、Sitemap、Robots、Tag体系、结构化数据及页面模板等基础SEO规范。\n8、负责关键词挖掘、竞争站分析、页面关键词优化及外链资源建设，持续扩大关键词覆盖及自然搜索流量。\n9、使用 ChatGPT、Claude、AI/SEO工具辅助数据分析、站点巡检、Spider模拟、异常URL筛选及需求整理，提高SEO工作效率。\n二、任职要求\n1、1年以上SEO实操经验优先，有独立负责网站SEO项目经验，有实际收录、关键词排名或自然搜索流量提升案例。\n2、熟悉 Google SEO基本机制，有 Yandex SEO实操经验优先。\n3、熟悉 GSC、GA4、Yandex Webmaster 等SEO及数据分析工具，能够独立完成基础数据分析。\n4、熟悉 Robots、Sitemap、Canonical、Noindex、301/302/307、404、URL、Tag、结构化数据等技术SEO基础。\n5、能够看懂基础HTML源码及HTTP状态码，具备Spider抓取、页面状态及技术SEO问题的基本排查能力。\n6、具备一定前后端开发基础者优先，能够看懂基础 HTML、JavaScript 及常见前后端页面逻辑；理解服务端渲染、接口请求、URL路由、HTTP状态码及缓存等基础概念，能够初步判断SEO问题属于前端渲染、后端逻辑还是服务器/CDN配置问题。\n7、具备较好的数据分析及问题定位能力，面对流量、收录、排名异常时，能够从数据、页面、域名、抓取及技术实现多个维度进行排查。\n8、能够独立编写SEO需求文档，并与运营、产品及技术团队沟通推进开发、测试及上线验收。\n9、有多站点SEO、CDN、多域名管理、网站迁移、技术SEO经验者优先。\n10、有关键词挖掘、外链建设、Tag/聚合页及页面结构优化经验。", "cat": "运营"}, {"id": "229", "title": "AI短剧编剧", "salary": "12-20K", "location": "未明确", "jd": "岗位职责\n1. 根据目标平台的用户特点、内容定位及项目方向，完成选题策划、故事大纲、人物设定、分集剧情和对白创作。\n2. 把控短剧的冲突、爽点、反转、情绪推进及分集钩子，保证故事逻辑清晰、人物行为合理、剧情具有持续吸引力。\n3. 结合AI短剧的制作条件，将人物、场景、动作及情节描述细化到可执行程度，为美术、分镜及镜头生成提供明确依据。\n4. 根据剧本审核、制作可行性及上线反馈，独立完成剧本修改与内容优化，对剧本质量及交付进度负责。\n任职要求\n1. 具备目标平台同类型短剧或AI短剧的独立编剧经验，能够提供本人主导完成的剧本及对应上线作品。\n2. 能独立完成从选题、大纲到分集剧本的完整创作，熟悉同类型产品的叙事结构、节奏、钩子与断点设计。\n3. 理解AI短剧的制作特点与限制，能够兼顾内容表现和制作可行性，交付可直接进入后续制作的剧本。\n4. 熟练使用AI辅助创作工具，能够根据明确的项目需求独立推进工作，并结合审核及数据反馈持续优化内容。", "cat": "AI / AIGC"}, {"id": "230", "title": "剪辑师", "salary": "12-20K", "location": "未明确", "jd": "岗位职责\n1. 根据剧本、分镜及项目风格，完成素材筛选、镜头组接、剧情剪辑及成片输出。\n2. 把控开场吸引力、剧情节奏、情绪递进和片段衔接，保证叙事清晰、视听流畅、重点突出。\n3. 完成配音、配乐、音效、字幕等后期制作，使声音、画面与剧情表达保持一致。\n4. 按交付标准完成成片自检，根据独立成片质检及导演反馈进行修改，对成片质量、返工情况及交付进度负责。\n任职要求\n1. 具备目标平台同类型短剧或AI短剧的独立剪辑经验，能够提供本人独立完成的完整单集或连续多集成片。\n2. 熟练使用剪辑及音频处理工具，能够独立完成从素材整理到成片输出的完整后期工作。\n3. 熟悉目标平台同类型产品的视听风格与节奏，具备较好的剧情理解、镜头选择、声音设计及情绪表达能力。\n4. 能独立识别并处理AI素材中的衔接、动作、声音及画面一致性问题，根据审核意见完成返修，并适应项目交付节奏。", "cat": "内容"}, {"id": "231", "title": "产品质验员", "salary": "10-18k", "location": "未明确", "jd": "一、工作职责\n1、产品质量巡检\n负责公司APP、站点日常全场景巡检，排查功能异常、交互缺陷、适配问题、用户使用障碍等各类产品质量问题，精准记录、复现问题，明确问题影响范围。\n2、运营质量督查\n核查线上内容发布、素材质量、标签分类、线上活动等各类运营动作，对标公司运营标准，杜绝不规范、低质量线上产出，保障运营工作合规落地。\n3、业务SOP落地核查\n对照公司各业务SOP，抽查各团队流程执行情况，及时发现执行遗漏、偏差、不规范等问题，推动业务流程标准化落地。\n4、问题闭环全流程管理\n巡检问题及时同步对应业务群、对接负责人整改；常态化维护问题跟进台账，完成问题登记、跟进、复核、验收全闭环，保障问题清零不积压。\n5、跨部门协同优化\n联动产品、技术、运营、UI等团队对接问题整改，跟进修复进度，参与问题复盘，推动共性质量问题专项优化。\n6、质量数据与经验沉淀\n汇总日常巡检高频问题、典型案例，整理基础质量数据，协助组长迭代优化巡检标准与核查规范，支撑部门月度、季度质量工作输出。\n二、任职要求\n1、基本条件\n• 本科及以上学历，有互联网质检、督导、运营审核相关工作经验，熟悉APP、网站线上业务流程，有视频产品者优先。\n2、专业能力要求\n- 观察力敏锐，能精准识别产品、运营各类质量问题与执行偏差；\n- 具备基础业务逻辑能力，可快速理解产品规则与业务SOP；\n- 熟练使用Excel，可独立完成问题台账登记、数据整理统计；\n- 具备基础总结复盘能力，可沉淀巡检问题与工作经验。\n3、综合素质要求\n- 细心严谨、责任心强，对质量问题敏感，工作无疏漏；\n- 执行力高效，能保质保量完成巡检及问题闭环工作；\n- 沟通协调能力良好，可高效完成跨部门对接工作；\n- 结果导向，服从团队管理，主动学习提升专业能力。\n4、加分项\n- 有互联网质检、运营督导、流程稽查及问题台账管理经验优先；\n- 具备用户体验思维，能够主动预判、发现业务潜在质量风险优先。", "cat": "其他"}, {"id": "232", "title": "Ai短剧工程师", "salary": "15-25k", "location": "未明确", "jd": "岗位职责\n1. 根据剧本、分镜及已确认的角色、场景资产，完成AI镜头制作与视频生成任务。\n2. 独立完成素材准备、提示词编写、生成参数调整、结果筛选及镜头修改，将分镜要求转化为可用视频素材。\n3. 把控人物稳定性、动作自然度、场景一致性及镜头连贯性，解决常见生成问题，提升合格镜头率。\n4. 按制作规范向镜头审核及剪辑环节交付素材，根据审核意见完成返修，并整理项目素材与生成记录。\n5. 在保证质量的基础上优化制作流程，提升生成效率与单位算力产出，对个人任务的质量及进度负责。\n任职要求\n1. 具备目标平台同类型AI短剧的独立镜头制作经验，能够提供本人完成的连续剧情片段或完整单集，并明确实际负责的生成内容。\n2. 熟练使用项目所需的AI视频制作平台及相关工具，能够独立完成从分镜理解、素材准备到镜头生成与交付的工作。\n3. 具备基础镜头语言、构图和动态画面判断能力，能够独立处理人物、动作、场景及镜头连续性问题。\n4. 熟悉生成素材的审核和交付要求，能够根据反馈准确定位问题、完成修改，并兼顾质量、效率及算力成本。", "cat": "AI / AIGC"}, {"id": "233", "title": "AI短剧导演", "salary": "15-25k", "location": "未明确", "jd": "岗位职责\n1. 负责项目整体创作方向与视听表达，确定内容调性、画面风格、声音设计及剪辑节奏。\n2. 组织剧本及制作可行性讨论，明确分镜表达、制作分工与关键质量要求，推动各环节形成一致的执行方案。\n3. 协调编剧、美术、视频生成及剪辑团队，解决制作过程中的内容、质量和协作问题，把控项目整体交付。\n4. 结合上线数据、制作成本及内容表现，提出优化方案，作出项目调整、继续或终止的判断，对单剧商业结果负责。\n5. 组织项目复盘，沉淀有效制作方法，培养团队骨干与储备负责人。\n任职要求\n1. 具备目标平台同类型短剧或AI短剧的独立项目主导经验，能够提供从剧本开发、制作推进到成片交付的完整案例。\n2. 具备成熟的内容判断力与审美能力，能够独立判断剧本可制作性，确定视听方案并把控最终成片质量。\n3. 熟悉AI短剧制作全流程，能够协调不同专业岗位，独立解决制作中的质量、效率及协作问题。\n4. 具备数据意识和成本意识，能够结合平台表现、制作投入及交付质量作出项目决策。\n5. 如按文件中的总导演／制作负责人定位招聘，需具备30人以上制作团队管理经验，能够承担团队管理与项目整体结果责任。", "cat": "AI / AIGC"}, {"id": "234", "title": "中级运营", "salary": "10k-20k", "location": "9、能接受远程办公，保证工作时间在线响应", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，2年以上网站或 App 运营经验，有内容平台、社区平台、资讯站、流量型产品运营经验优先。\n2. 具备独立运营和活动落地能力，能独立完成内容运营、活动策划、项目推进或用户增长相关工作。\n3. 具备数据分析能力，熟练使用 Google GSC 站长平台|yandex站长平台，能根据日活、新增、留存、点击、转化等数据发现问题并提出优化方案。\n4. 必须具备 AI 工具使用经验，了解自动化工具或工作流搭建，有实际落地案例优先。\n5. 对热点内容敏感，具备较强的信息整理、文案表达和内容包装能力。\n6. 具备基础视觉审美能力，能优化标题、封面、图文结构和内容呈现效果。\n7. 熟练使用 PR、PS 或同类图片/视频处理工具优先。\n8. 有 OpenClaw、AI 自动化工作流、内容提效工具搭建经验优先。                                                                                                                                         9.懂社群运营，懂这些平台运营优先Telegram，Discord， X，WhatsApp。\n9、能接受远程办公，保证工作时间在线响应\n加分项：\n1、有成人向/泛娱乐/吃瓜类内容运营经验\n2、有矩阵账号批量运营经验\n3、熟悉Agent自动化发布流程以及各个平台多节API路径\"", "cat": "运营"}, {"id": "235", "title": "舆情收集员", "salary": "7K-15K（优秀可面议）", "location": "未明确", "jd": "任职要求：\n1.具备较强的网络敏感度与信息捕捉能力；\n2.熟悉舆情监测系统或相关平台操作；\n3.具备良好的数据整理与报告编写能力；\n4.有一定的成人资源来源\n5.对于热门吃瓜内容有较强的敏感度\n\n岗位职责：\n1.每日监控并收集互联网及社交媒体上的热点事件与舆论话题；\n2.对收集的信息进行分析、筛选与分类；\n3.整理并输出热点吃瓜内容，包含关键信息，图文等\n4.深度挖掘热门吃瓜内容，最好是成人方向的", "cat": "其他"}, {"id": "236", "title": "高级运营（储备管理）", "salary": "20k-35k", "location": "7. 沟通协作和执行能力强，能推动跨团队问题解决，接受远程办公并保证工作时间在线响应。", "jd": "岗位职责：\n1. 负责网站/App内容运营，围绕日活、新增、留存、内容消费和转化结果制定运营动作。\n2. 负责热点内容挖掘、选题策划、内容包装、推荐位调整和专题运营。\n3. 关注公开平台热点信息，快速整理热门事件、人物关系、时间线和传播角度，产出具备讨论度的内容。\n4. 根据数据表现分析内容板块问题，识别低效板块、潜力板块和可放大方向，并推动策略调整。\n5. 独立策划并执行运营活动，跟进活动上线、用户参与、数据表现和复盘优化。\n6. 使用 AI 工具和自动化工具提升内容生产、数据分析、评论/文案辅助、流程处理等运营效率。\n7. 协同产品、技术、内容、资料等团队处理运营问题，推动页面、入口、跳转、加载、内容异常等问题闭环。\n8. 使用 PR、PS 或同类工具完成基础图片、视频、封面、水印、素材处理工作。\n\n任职要求：\n1. 大专及以上学历，3年以上网站或 App 运营经验，能独立负责业务板块。\n2. 有团队管理经验，能做好目标拆解、任务分工、人员带教和结果跟进。\n3. 熟悉 SEO，能使用 Google Search Console、Yandex 等站长工具，推动关键词排名和自然流量增长。\n4. 有推广实操经验，熟悉渠道引流、社交媒体或社群推广，能独立执行方案并评估效果。\n5. 具备热点敏感度、内容策划和活动运营能力，能结合新增、留存、转化等数据持续优化。\n6. 熟练使用 AI 工具，有自动化工作流或内容提效工具的实际应用经验。\n7. 沟通协作和执行能力强，能推动跨团队问题解决，接受远程办公并保证工作时间在线响应。\n加分项：有成人向、泛娱乐或吃瓜类内容经验；熟悉 Telegram、Discord、X、WhatsApp 运营；有矩阵账号运营、自动化发布经验，或熟练使用 PR、PS 等工具。", "cat": "运营"}, {"id": "237", "title": "中高级产品运营", "salary": "10-25k", "location": "未明确", "jd": "任职要求：\n1. 具备产品运营、用户运营、增长运营等相关经验。\n2. 具备较强的数据分析能力、策略判断能力和结果导向意识。\n3. 熟悉活动运营、转化优化、留存提升等核心运营模块。\n4. 具备较强的资源统筹和项目推进能力，能够协同多方推动复杂事项落地。\n5. 有互联网内容平台、社区平台或增长型产品相关经验者优先。\n6. 对二次元行业有较高兴趣和理解，熟悉二次元用户文化，对圈层热点和内容趋势敏感。\n7. 有二次元产品、内容平台、社区平台，或漫画 / 动漫 / 小说相关行业经验者优先。\n8. 对 Agent 工作流有一定认知，认可智能化协作方式，并具备主动学习和应用意识。\n\n岗位职责\n1. 搭建并优化内容供给结构、用户分层及增长模型，围绕新增、转化、留存等核心指标推动产品持续增长。\n2. 建立并完善产品运营数据指标体系，独立开展经营分析，输出问题判断、优化建议及阶段性策略支持。\n3. 结合产品定位和用户特征，制定周期活动、大促机制及长期激励体系，提升用户参与度、转化效率和留存表现。\n4. 围绕内容运营、用户运营、活动运营和转化优化等方向，推动产品运营策略落地执行，并持续跟踪效果、迭代优化。\n5. 协同多部门团队，推进重点项目、功能优化和增长策略落地，提升整体推进效率。\n6. 具备二次元用户和内容理解能力，熟悉漫画、动漫、小说、同人及IP话题等内容生态与用户表达方式。", "cat": "运营"}, {"id": "238", "title": "渠道运营", "salary": "13-15", "location": "未明确", "jd": "职位名称：海外渠道运营专员\n\n岗位职责：\n1. 渠道承接与日常维护\n·负责已接入渠道的日常对接与维护，保障合作稳定推进\n·管理渠道相关资源（链接、群组、账号等），确保使用规范与高效\n·处理渠道侧日常问题，提升渠道合作体验与响应效率\n2. 新后台迁移与流程搭建\n·参与渠道相关系统/后台的迁移与适配工作\n·梳理并优化渠道操作流程，确保迁移后执行顺畅\n·跟进迁移过程中的问题并推动解决\n3. 执行与落地\n·负责渠道侧具体执行工作，包括链接投放、群运营、结算流程等\n·配合投放/增长需求进行加量执行，确保策略有效落地\n·对执行进度进行跟踪与反馈\n4. 数据跟进与结果负责\n·持续跟踪渠道数据表现（转化、成本、留存等）\n·分析执行效果，发现问题并提出优化建议\n·对渠道整体执行效果与结果负责，推动数据提升\n\n任职要求：\n1. 学历与经验：\n   · 大专及以上学历；  \n   ·1-3年互联网运营经验，有渠道运营/投放执行经验优先\n·熟悉渠道合作基本流程，有实际执行经验（链接、群、结算等）\n·具备较强的执行力和推进能力，能把事情“做完且做好”\n\n2. 核心能力：\n·会熟练运用AI\n·强执行力：能高效推进多渠道、多任务并行\n·结果导向：对数据敏感，以结果为目标驱动工作\n·沟通协调能力：能顺畅对接渠道、内部团队（投放/产品等）\n·问题解决能力：遇到问题能主动推进解决，而不是等待\n·具备良好的沟通能力和团队协作意识，能适应快节奏工作。  \n\n3. 加分项：\n·有渠道投放、增长、广告相关经验\n·有后台迁移或系统切换经验\n·熟悉数据分析工具（Excel/BI等）", "cat": "商务 / 市场"}, {"id": "239", "title": "AI内容编辑（加急）", "salary": "10K – 20K", "location": "未明确", "jd": "AI内容编辑（创作 / 漫改 / 魔改方向）\n\n岗位方向\n\n我们正在组建AI驱动的动漫、漫画内容团队。\n\n\n\n剧本内容由专门的剧本团队负责，本岗位主要负责将已有的剧本、分镜及内容创意，通过AI工具转化为动漫、漫画、短视频等视觉内容。\n\n\n\n我们不要求候选人一开始就具备非常完整的AI技术栈，更关注实际内容制作能力、基础视觉审美，以及对新工具、新工作流的学习和落地能力。\n\n\n\n有动漫、漫画、短视频、设计、AI创作等相关经验者优先考虑，其他类型经验如具备相关作品或较强学习能力，也可以投递。\n\n简历及作品要求\n\n投递时请提供简历及相关作品。\n\n\n\n作品形式不限，可以是：\n\n\n\nAI漫画、AI图片、AI短片；\n\n角色设计、场景设计；\n\n个人练习作品；\n\n商业项目或团队项目作品。\n\n\n\n不强制要求作品必须为独立完成，只要能够体现个人实际制作能力即可。\n\n\n\n如有以下内容，也欢迎一并提供：\n\n\n\nAI内容制作过程或工作流截图；\n\nComfyUI、Stable Diffusion等工具使用案例；\n\n个人运营的新媒体账号及相关作品数据。\n\n岗位职责\n\n根据剧本团队提供的脚本、分镜或内容需求，完成AI动漫、AI漫画、AI短视频等内容制作。\n\n\n\n使用AI绘图、AI视频等工具完成人物、场景及画面的生成、调整和优化，保证整体视觉效果符合项目要求。\n\n\n\n配合团队优化角色一致性、画面风格及内容呈现效果，提高内容制作效率。\n\n\n\n根据项目需要，对已有AI工作流进行使用、调整和优化。\n\n\n\n参与内容选题、IP方向及视觉风格讨论，从画面呈现及用户审美角度提供建议。\n\n\n\n持续关注AI绘图、AI视频领域的新模型、新工具及新玩法，并尝试应用到实际内容生产中。\n\n\n\n与剧本、运营及相关团队协作，根据反馈持续调整和优化内容。\n\n任职要求\n\n有AI绘图、AI视频、设计、动漫制作或其他相关内容创作实践经验，能够提供相关作品。\n\n\n\n使用过一种或多种主流AI创作工具，例如ComfyUI、Stable Diffusion、Midjourney、即梦、Kling、Vidu、Runway等。\n\n\n\n具备基本的图片或视频生成、调整能力，能够根据需求修改提示词、参数或现有工作流。\n\n\n\n对画面效果有基本判断能力，能够关注人物、构图、风格统一及内容呈现。\n\n\n\n学习能力较强，愿意主动学习新的AI模型、插件及内容制作方法。\n\n\n\n具备良好的沟通和协作能力，能够根据项目反馈及时调整作品。\n\n加分项\n\n有ComfyUI工作流搭建或优化经验。\n\n\n\n了解或使用过LoRA、ControlNet、IPAdapter等工具。\n\n\n\n有AI动漫短剧、AI漫画、条漫、漫改或小说改编项目经验。\n\n\n\n有角色一致性、批量出图、AI视频动态化等实际制作经验。\n\n\n\n会使用AE、Live2D、Blender、Nomad等设计或动画工具。\n\n\n\n有Python、自动化或批量内容处理经验。\n\n\n\n对动漫、漫画、二次元内容感兴趣，具备一定的视觉审美和内容判断能力。\n\n\n\n有二次元、新媒体、动漫账号运营经验，或对动漫、漫画、轻小说等内容趋势较为熟悉。", "cat": "AI / AIGC"}, {"id": "240", "title": "新媒体运营组长（加急）", "salary": "20k - 25k", "location": "未明确", "jd": "\"必看项\n1. 负责公司二次元 / 动漫相关新媒体账号整体运营，统筹国内外主流社媒平台内容运营与账号增长，包括但不限于：B 站、微博、小红书、抖音、微信公众号、LOFTER（国内），以及 X（Twitter）、TikTok、Instagram、YouTube、Discord、Reddit（海外）。\n2. 负责策划并输出符合年轻用户审美的 ACG 内容，包括但不限于：动漫热点追踪、二创内容、meme 梗图、角色向内容、圈层热点话题；根据不同平台特性制定差异化内容策略，提升账号曝光、互动率与粉丝增长；可独立完成热点策划与内容传播全流程。\n3. 深度理解二次元用户生态与圈层文化，维护社区氛围，提升用户活跃度与粘性；快速追踪 ACG 热点与用户情绪变化；与 UP 主、Coser、绘师、KOL 等建立并维护合作关系，扩大内容影响力。\n4. 带领运营团队推进内容项目，制定内容节奏与运营目标，根据数据反馈持续优化内容方向与传播策略，确保各平台账号持续健康增长\n\"\n\"3年以上新媒体运营经验，有团队管理经验优先；\n重度二次元用户，熟悉动漫、游戏、VTuber、Cosplay、同人文化等；\n网感强，懂年轻人表达方式和互联网语境；\n熟悉国内外主流社媒平台运营逻辑；\n有成功账号运营案例或爆款内容经验；\n具备优秀的内容策划与文案能力。\"", "cat": "运营"}, {"id": "241", "title": "新媒体运营", "salary": "6k-10k", "location": "未明确", "jd": "\"必须项\n简历➕运营数据或者案例\n运营过的账号案例\n 爆款内容链接\n 常用社媒平台ID（可选）\n 最喜欢的动漫/作品（加分项）\n 2年以上新媒体运营经验，有团队管理经验优先；\n 重度二次元用户，熟悉动漫、游戏、VTuber、Cosplay、同人文化等；\n 网感强，懂年轻人表达方式和互联网语境；\n 熟悉国内外主流社媒平台运营逻辑；\n 有成功账号运营案例或爆款内容经验；\n 具备优秀的内容策划与文案能力。\n加分项\n\n 有ACG、自媒体、动漫行业经验；\n 熟悉海外二次元社区文化；\n 有AIGC内容工具使用经验；\n 自己运营过账号；\n 懂梗、会玩梗、熟悉互联网亚文化。\"\n\"岗位职责\n\n 内容运营\n\n 负责公司二次元/动漫相关新媒体账号运营；\n 策划并输出符合年轻用户审美的内容，包括但不限于：\n\n   动漫热点\n   二创内容\n   meme梗图\n   角色向内容\n   圈层热点话题\n 根据不同平台特性制定内容策略，提升曝光、互动与粉丝增长；\n 独立完成热点策划与内容传播。\n\n\n\n 平台运营\n\n负责国内外社媒平台的内容运营与账号增长，包括但不限于：\n\n 国内平台\n\n B站\n 微博\n 小红书\n 抖音\n 微信公众号\n LOFTER\n\n 海外平台\n\n X（Twitter）\n TikTok\n Instagram\n YouTube\n Discord\n Reddit\n\n\n\n 用户与社区运营\n\n 深度理解二次元用户生态与圈层文化；\n 维护社区氛围，提高用户活跃度与粘性；\n 快速追踪ACG热点与用户情绪变化；\n 与UP主、Coser、绘师、KOL等建立合作关系。\"", "cat": "运营"}, {"id": "242", "title": "UI设计师", "salary": "15k - 30k", "location": "未明确", "jd": "一、岗位职责\n 1. 负责 Web/App 端界面 UI 视觉设计，产出高质量、可落地的 Figma 原型，并参与或主导 设计系统（Design System） 的搭建与维护（颜色、字体、间距、组件规范等）。\n 2. 负责公司日常运营视觉设计输出，包括但不限于：活动海报、Banner、专题页、推广图、品牌宣传物料、节日活动图等（日常工作中运营类设计约占60%，界面UI约占40%）。\n 3. 根据产品调性，完成 icon、logo、水印、启动页、落地页 等产品上线前所需物料，并按运营需求产出高质量视觉内容（活动弹窗、推广图等）。\n\n二、任职要求\n 1. 5年以上设计经验，精通 Figma，有实际从0到1建设或维护 设计系统（Design System） 的经验。\n 2. 熟练使用 AI 设计工具（Midjourney / ChatGPT / Agent 等），能够辅助创意生成与设计提效。\n 3. 熟练使用 Photoshop、Illustrator、Figma 等主流设计工具，具备良好的设计执行能力与规范意识。\n 4. 能高效配合运营、策划、产品等相关部门，在较快节奏下完成设计需求落地，并根据反馈及时优化迭代。\n\n三、作品集要求（投递必附）\n请随简历附上近期作品集（PDF或链接），需包含：\n • Web / App 界面设计案例\n • 运营类视觉设计案例（活动页、Banner、弹窗等）\n • （可选）设计系统 / 组件库相关产出", "cat": "设计"}, {"id": "243", "title": "高级产品经理", "salary": "18k-35k", "location": "未明确", "jd": "一、岗位职责：\n\n1. 负责付费内容APP（漫画/视频/动漫/小说等）整体产品规划、功能设计及版本迭代，业务覆盖多元内容形态，主导产品路线图制定与执行；\n2. 深入分析用户需求、市场趋势与竞品动态，制定产品发展策略，明确核心功能定位与迭代优先级；\n3. 持续优化现有变现体系（会员订阅、付费内容、广告等），平衡用户体验与商业变现，推动项目收益最大化；\n4. 对DAU、留存率、付费转化率等核心业务指标全面负责，建立数据监控与归因体系，持续推动指标提升；\n5. 熟悉内容产品「生产—分发—消费」全链路闭环，主导内容标签体系与推荐策略的建设与持续优化；\n6. 结合AI能力为业务赋能提效，将AI工具合理融入内容推荐、数据分析及产品设计日常工作；\n7. 与设计、研发、运营、市场等团队紧密协作，高效推动跨部门项目按期高质量落地；\n8. 持续跟踪行业动态与新技术趋势，探索差异化产品创新方向，保持产品竞争力；\n\n二、任职要求：\n\n1. 5年以上产品经理经验，其中2年以上内容平台产品经理经验，具备完整App产品0到1核心角色经历，独立主导过单一产品线或核心模块的长期迭代；\n2. 具备会员订阅、付费内容等流量变现成功实操经验，熟悉广告、会员、虚拟付费等多元变现模式；\n3. 数据能力扎实，理解数据「产生—收集—使用」完整闭环，有埋点设计、数据指标体系搭建经验，熟练运用A/B测试驱动产品优化，能独立出具数据分析报告，对数据波动具备敏锐感知与正确归因能力；\n4. 对AI能力边界有清晰认知，熟练使用Claude Code / Cursor / Codex等AI生产力工具，并能将AI合理应用于产品设计与日常工作提效；\n5. 具备优秀的跨部门沟通协作能力，能独立承接业务与运营诉求，主导复杂项目高效推进落地；\n6. 对二次元、ACGN内容生态有浓厚兴趣，具备二次元用户消费心理与社区文化认知者优先；", "cat": "产品"}, {"id": "244", "title": "AI动漫短剧编剧", "salary": "10k-25k", "location": "未明确", "jd": "AI动漫短剧编剧（小说改编方向）\n\n岗位介绍\n\n本岗位主要负责公司AI动漫短剧项目的剧本创作与小说改编工作。\n\n\n\n公司会提供已有小说、网文内容及基础项目方向，无需自行寻找内容来源。你需要结合AI动漫短剧的内容形式，对原有小说进行故事拆解、人物关系梳理、剧情取舍、节奏调整、结构重组及分集改编，最终输出具备实际制作可行性的短剧剧本。\n\n\n\n岗位核心工作以小说/网文改编为主，需要将篇幅较长、信息量较大的原著内容，转化为节奏更快、冲突更集中、画面表达更明确的AI动漫短剧内容。\n\n\n\n我们不要求候选人必须拥有成熟的AI动漫项目经验，更关注你的故事理解能力、剧情改编能力、短剧节奏感及持续学习能力。\n\n\n\n有短剧、网文、小说、漫画脚本、动漫剧情、影视、剧情短视频、游戏剧情等相关创作经验均可。\n\n岗位职责\n\n阅读并理解公司提供的小说、网文内容，快速梳理主要人物、人物关系、故事主线、核心冲突及内容卖点。\n\n\n\n根据AI动漫短剧的内容形式，对原小说进行剧情取舍、结构调整、节奏优化及适当重构。\n\n\n\n结合项目篇幅，对原著中的支线剧情、人物及事件进行合理删减、合并、前置或调整，使核心剧情更加集中。\n\n\n\n完成故事梗概、人物小传、分集大纲及完整分集剧本创作。\n\n\n\n将小说中的叙述、心理活动、背景介绍等文字内容，转化为具体的场景、人物动作、对白及可视化剧情表达。\n\n\n\n结合不同题材及目标受众，设计具有吸引力的开篇、冲突、爽点、情绪节点、反转、悬念及结尾钩子。\n\n\n\n在保证原故事核心设定和人物逻辑的基础上，对不适合短剧表达的内容进行合理改编。\n\n\n\n配合项目负责人，根据审核及制作反馈，对剧本内容进行修改和优化。\n\n\n\n逐步了解AI动漫制作的基本特点，在创作过程中兼顾人物数量、场景复杂度、动作设计及画面实现难度。\n\n\n\n与项目、制作等团队保持沟通，按计划同步创作进度及可能影响交付的问题。\n\n任职要求\n\n有编剧、网文创作、小说创作、漫画脚本、动漫剧情、短剧、剧情短视频、影视策划、游戏剧情等相关创作经验。\n\n\n\n具备较好的小说阅读和故事理解能力，能够快速提炼人物关系、核心矛盾及剧情重点。\n\n\n\n具备一定的内容改编能力，能够根据短剧篇幅对原小说进行删减、调整、压缩及结构重组。\n\n\n\n对短剧、网文、动漫、漫画等内容形式有一定了解，能够理解快节奏、强冲突、高情绪密度的内容表达方式。\n\n\n\n能够将文字剧情转化为具体场景、人物行为及对白，使剧本具备较好的画面感和制作可执行性。\n\n\n\n具备基本的剧情连续性和人物逻辑判断能力，能够保证改编后故事完整、人物行为合理。\n\n\n\n能够按照项目要求完成创作，并根据审核意见进行合理修改。\n\n\n\n具备良好的沟通、协作及时间管理能力。\n\n\n\n对AI动漫、AI短剧等新内容形式感兴趣，并愿意学习相关制作逻辑。\n\n加分项\n\n有短剧、动态漫、AI动漫或漫画项目经验。\n\n\n\n有小说、网文或成熟IP改编经验。\n\n\n\n有已上线、已制作或能够展示的完整编剧作品。\n\n\n\n擅长长篇小说的剧情压缩、短篇化改编及结构重组。\n\n\n\n熟悉男频逆袭、玄幻、都市、悬疑、复仇、冒险、热血等强情节题材。\n\n\n\n熟悉女频情感、甜宠、家庭、豪门、成长、虐恋等强情绪题材。\n\n\n\n有系列化剧情开发或连续人物塑造经验。\n\n\n\n具备较强的网感，对当前短剧、网文及动漫内容趋势有一定敏感度。\n\n\n\n了解AI图片、AI视频或AI动漫制作流程及基本能力边界。\n\n项目形式\n\n项目以小说、网文改编为主要内容方向，根据原著内容及项目需求进行AI动漫短剧化改编。\n\n\n\n单部短剧原则上约 8集，单集约 3–5分钟。\n\n\n\n具体集数、篇幅及内容结构可根据原著体量、剧情复杂度及实际制作要求进行调整。\n\n\n\n前期以熟悉项目标准及创作流程为主，稳定期月度完成约2部完整短剧，具体根据项目难度及团队排期安排。\n\n\n\n最终剧本需具备较完整的剧情结构、人物逻辑及画面表达，能够支持后续AI动漫制作环节推进。", "cat": "AI / AIGC"}, {"id": "245", "title": "网站运营", "salary": "8k - 20k", "location": "未明确", "jd": "网站运营\n\n岗位职责\n\n网站整体运营与增长\n\n负责网站日常运营及整体运营策略落地，围绕新增、活跃、留存、转化、付费及营收等核心指标制定并执行运营方案。\n\n参与网站从 0 到 1 的运营搭建，包括用户体系、内容体系、活动体系及运营流程建设，推动网站持续增长。\n\n根据业务发展阶段制定冷启动、用户增长及规模化运营策略，持续提升网站整体流量及用户规模。\n\n内容运营与用户留存\n\n负责网站内容体系的规划、运营及优化，根据用户需求和数据表现持续调整内容方向。\n\n优化网站首页、频道页、详情页、推荐位等核心页面的内容结构与展示逻辑，提升点击率、浏览深度、停留时长及用户留存。\n\n参与内容选题、专题策划、活动策划及内容分发，提升内容产出效率和内容对用户增长、留存及转化的贡献。\n\n建立内容运营标准及内容质量评估机制，持续提升网站内容质量和用户体验。\n\nSEO及流量增长\n\n负责网站 SEO 运营，包括关键词布局、页面结构、站内链接、专题页、内容优化及搜索流量增长等。\n\n分析自然搜索、社媒、外部渠道等不同流量来源，持续优化流量获取及分发策略。\n\n关注行业及竞品网站运营情况，挖掘新的流量增长机会，提升网站整体曝光及自然流量。\n\n数据分析与运营优化\n\n日常跟踪网站核心数据，包括 UV、PV、注册、DAU、留存、访问深度、跳出率、转化率、付费率及营收等。\n\n基于数据分析用户访问及转化路径，定位流量、内容、产品及转化环节中的问题，并提出可执行的优化方案。\n\n建立并持续完善网站运营数据指标体系，通过数据驱动内容、活动、页面及用户运营策略迭代。\n\n根据数据反馈持续进行 A/B Test 及运营策略调整，提升网站整体运营效率。\n\n用户增长与转化\n\n围绕“流量获取—用户注册—内容消费—用户留存—付费转化”完整链路进行运营优化。\n\n负责会员、付费内容、订阅、活动及其他商业化场景的运营，持续提升用户转化率及用户价值。\n\n针对不同用户生命周期制定差异化运营策略，提升用户活跃度、留存率及复购/续费率。\n\n活动及专题运营\n\n根据业务目标策划线上活动、专题活动、节日活动及用户增长活动，负责活动从策划、执行到复盘的完整流程。\n\n通过活动、专题及内容运营提升网站流量、用户活跃度、用户留存及付费转化。\n\n跨部门协作\n\n与产品、技术、设计、内容、渠道及商务等团队协同，推动网站功能、页面、内容及运营工具持续优化。\n\n能够独立梳理运营需求并推动产品、技术落地，持续改善网站用户体验及运营效率。\n\n定期复盘运营结果，沉淀可复制的网站运营方法论。\n\n任职要求\n\n2-5 年网站运营、互联网产品运营或内容运营相关工作经验，有网站/平台型产品运营经验优先。\n\n有完整参与或主导网站/互联网产品从 0 到 1 搭建、冷启动或增长阶段的经验，能够独立制定并执行运营策略。\n\n熟悉网站运营完整链路，对用户增长、内容运营、用户留存、转化及商业化有较深入理解。\n\n具备较强的数据分析能力，熟悉 Google Analytics、Search Console、数据报表等常用分析工具，能够通过数据独立拆解问题并提出优化方案。\n\n熟悉 SEO、网站流量增长、内容运营及用户运营，有成功的网站流量增长或用户增长案例优先。\n\n具备较强的内容判断能力，能够根据用户需求、行业趋势及数据表现制定内容方向和运营策略。\n\n具备较强的项目推进能力，能够协调产品、技术、设计、内容等多个团队推动项目落地。\n\n执行力强，责任心强，具备较好的沟通及协作能力，能够适应快节奏、高强度的互联网运营环境。\n\n有成人行业、泛娱乐、内容社区、视频/图片平台或海外互联网产品运营经验优先。\n\n有网站从 0 到 1 搭建、SEO 流量增长、会员/付费产品运营或海外网站运营经验者优先。", "cat": "运营"}, {"id": "246", "title": "AI内容负责人（加急）", "salary": "15-25k", "location": "未明确", "jd": "岗位职责\n\n统筹内容生产全流程\n负责从剧本策划、分镜设计、美术与素材、AI生成、剪辑制作到成片交付及首轮数据验证的完整生产闭环，对内容最终质量负责。\n\n建立统一的内容标准\n制定并持续优化团队的内容调性与制作标准，包括画面风格、镜头语言、声音设计、剪辑节奏等，推动剧本、美术、生成、剪辑等团队形成统一的内容判断标准。\n\n负责项目统筹与资源调配\n根据剧本体量、场次、镜头难度及项目节点，合理进行人员配置、任务拆分与资源调度，确保项目按计划、高质量完成。\n\n建立“测试—验证—放量”机制\n在整部内容批量生产前，推动核心片段或切片进行小规模测试，根据点击、完播、留存、付费转化等数据判断项目方向，及时做出继续、调整或终止的决策，控制无效产能与制作成本。\n\n对内容及商业结果负责\n结合项目数据持续优化内容方向，对单剧的内容表现、商业结果及投入产出负责；同时关注团队整体产能、单分钟制作成本、项目交付周期及剧本储备等核心经营指标。\n\n提升团队生产效率\n优化内容生产流程与协作机制，持续降低沟通成本和返工率，提升团队整体产能与交付质量。\n\n搭建人才梯队与方法论\n培养组长及核心骨干，建立人才梯队；将成熟的生产流程、制作标准和优秀案例沉淀为可复制的方法论，提升团队规模化生产能力。\n\n任职要求\n\n具备 20人以上内容、影视或短视频制作团队管理经验，有完整项目统筹及团队管理经验；\n\n对内容质量、市场趋势及用户反馈具备较强判断力，能够基于数据和项目实际情况做出明确的内容决策；\n\n熟悉内容生产流程，能够理解并平衡内容质量、制作周期、团队产能与成本；\n\n具备较强的项目管理和资源协调能力，能够推动多团队、多环节协同完成项目；\n\n有较强的经营意识，能够关注内容产出背后的成本、效率及商业结果，而不仅局限于内容制作本身；\n\n具备较强的团队管理和人才培养能力，能够搭建并持续优化内容生产团队；\n\n背景不限，可来自影视制作、短剧、短视频、内容平台或成熟内容团队，如执行导演、制片负责人、制作负责人、内容负责人等；\n\n对 AI短剧 / AI视频规模化生产模式有兴趣，并愿意探索AI对内容生产效率的提升。\n\n加分项\n\n有 AI短剧、AI漫剧、AI视频等相关项目经验；\n\n有从 0到1搭建内容团队或生产体系的经验；\n\n有完整负责过短剧、短视频或影视项目，并对项目最终商业结果负责；\n\n有通过数据测试进行内容筛选、项目调整或资源止损的实际经验；", "cat": "AI / AIGC"}, {"id": "247", "title": "AI 内容镜头审核", "salary": "15-20k", "location": "未明确", "jd": "岗位职责\n负责⽣成镜头质量审核\n对 AI ⽣成镜头进⾏逐镜审核，按照统⼀的 A / B / C 质量标准进⾏分级，确保镜头在画⾯、\n⼈物、动作、场景及镜头表现等⽅⾯达到对应要求。\n负责剪辑前质量卡点\n作为 AI ⽣成与后期剪辑之间的质量闸⻔，严格控制进⼊剪辑素材库的镜头质量。C 级镜头\n不得进⼊剪辑环节，避免依赖后期剪辑强⾏修复低质量素材。\n识别并记录镜头问题\n及时发现⼈物变形、⼈物不⼀致、动作异常、场景漂移、画⾯穿帮、镜头逻辑不合理、画质\n异常等问题，并准确标记问题类型及具体位置。\n控制漏检与下游返⼯\n关注镜头漏检率、审核准确率及因素材质量问题导致的下游返⼯率，确保进⼊剪辑环节的素\n材符合制作标准。\n推动前端⽣成质量提升\n汇总审核过程中发现的⾼频及共性问题，定期向 AI 视频⽣成组反馈，协助组⻓优化⽣成⽅\n法、提示词、模型及⽣产流程，从源头降低问题镜头产⽣率。\n沉淀审核标准与案例\n持续整理典型问题镜头及优秀案例，完善 A / B / C 分级标准、审核 SOP 及案例库，提升团\n队审核标准的⼀致性和稳定性。\n任职要求\n具备 AI 视频⽣成、后期制作、视频质检或相关内容制作经验，熟悉视频镜头质量判断；\n对⼈物⼀致性、动作⾃然度、场景稳定性、画⾯完整度、镜头逻辑等具备较强的识别能⼒；\n能够严格按照统⼀标准进⾏ A / B / C 分级，具备较⾼的审核准确率和标准⼀致性；\n细致、有耐⼼，对画⾯质量敏感，具备较强的标准意识和责任⼼；\n能够适应批量化、⾼频次的镜头审核⼯作，在较⼤审核量下保持稳定判断；\n能够准确描述问题并给出明确反馈，⽽不仅是判断“好 / 不好”；\n有较强的团队协作意识，能够与 AI ⽣成、剪辑等团队⾼效配合。\n加分项\n有 AI 视频⽣成或 AI 图像⽣成相关经验；\n有短剧、漫剧、短视频等批量内容⽣产经验；\n有视频后期质检、成⽚审核或影视制作质量管理经验；\n有从⽣成⼈员成⻓为⻣⼲、负责审核或质量把控的经验；\n熟悉主流 AI 视频⽣成⼯具及常⻅⽣成问题；\n有建⽴视频质量标准、质检 SOP 或镜头案例库的经验。", "cat": "AI / AIGC"}, {"id": "248", "title": "AI 内容剧本审核", "salary": "15-20k", "location": "未明确", "jd": "岗位职责\n负责剧本终审与⽣产准⼊\n负责剧本进⼊制作前的最终审核，从题材价值、故事逻辑、⼈物设定、剧情节奏、商业潜⼒、\n制作可⾏性及内容合规等维度进⾏综合判断。未达到⽣产标准的剧本，不进⼊后续制作环节。\n把控剧本执⾏完整度\n判断剧本是否已经细化到可以直接进⼊分镜及⽣产阶段，确保⼈物、场景、剧情、镜头需求\n等关键内容清晰明确，避免进⼊制作后频繁返⼯或重新策划。\n提出明确的修改意⻅\n对不符合要求的剧本进⾏退回，并明确指出具体问题、修改⽅向及判断依据，推动编剧持续\n提升剧本质量，⽽不是只做简单的“通过 / 不通过”\n。\n参与制作可⾏性评估\n与 AI 视频⽣成、美术等团队共同参与剧本及分镜制作可⾏性会审，提前识别⼈物、场景、\n动作、特效等 AI ⽣成难度较⾼的内容，并将制作端反馈沉淀，反向优化剧本创作。\n负责内容合规审核\n建⽴并执⾏内容合规审核标准，负责题材、剧情、⼈物、台词、画⾯等⽅⾯的⻛险识别，熟\n悉不同平台的审核规则及内容红线，确保项⽬符合上线要求。合规审核环节不外包。\n提升剧本审核效率与标准化程度\n持续沉淀审核标准、典型案例及常⻅问题，完善剧本审核 SOP，在保证审核质量的同时提升\n审核效率和整体吞吐量。\n覆盖多来源剧本审核\n负责内部创作、外包制作及采购剧本的统⼀审核，确保不同来源的剧本按照同⼀套标准进⼊\n⽣产。\n任职要求\n具备 3 年以上剧本、编辑、影视内容或短剧相关经验，能够独⽴完成剧本判断和审核；\n具备较强的内容判断能⼒， 能够判断题材是否具备开发价值、故事逻辑是否成⽴、⼈物是否\n⽴得住、内容是否具备持续观看的基础，⽽⾮仅依据审核清单逐项核对；\n熟悉剧本结构、⼈物塑造、剧情节奏及短剧内容特点， 能够从执⾏层⾯判断剧本是否具备实\n际制作条件；\n熟悉主流内容平台的审核规则及常⻅内容⻛险，对题材、剧情、台词、⼈物及画⾯等合规问\n题具备较强的⻛险识别能⼒；\n审核效率⾼、判断准确，能够在较⼤审核量下保持稳定的审核标准；\n具备较强的沟通和反馈能⼒，能够给出具体、可执⾏的修改意⻅，推动编剧解决问题；\n能够适应快节奏、批量化的内容⽣产环境，并接受明确的审核效率与质量要求。\n加分项\n有 短剧、AI 短剧、AI 漫剧或短视频内容审核经验；\n有⽹⽂、短剧、影视项⽬的编辑或策划经验；\n熟悉多个内容平台的审核规则及合规差异；\n有外包、采购及内部多来源剧本审核经验；\n有建⽴剧本审核标准、审核 SOP 或内容合规体系的经验；\n对 AI 内容⽣产流程及 AI ⽣成限制有⼀定了解。", "cat": "AI / AIGC"}, {"id": "249", "title": "中级运营（加急）", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n\n1. 负责二次元内容类 APP / Web 产品的数值体系搭建、梳理及持续优化，包括金币、会员、积分、任务奖励、签到、活动奖励、充值优惠等核心数值模块；\n2. 梳理现有产品数值规则，建立统一、清晰的数值测算逻辑及标准，解决不同产品之间数值体系混乱、规则不统一、缺乏测算依据等问题；\n3. 结合用户行为及经营目标，对金币产出与消耗、会员价格梯度、付费权益、优惠力度、活动奖励等进行测算，保证数值体系的合理性及长期稳定性；\n4. 负责用户新增、活跃、留存、付费、首充、复购/续费、ARPU、ARPPU、LTV 等核心指标分析，定位数据异常及业务问题；\n5. 针对产品改版、会员调整、活动上线等业务需求进行前置测算，评估不同方案对用户转化、收入及成本的影响，为运营及产品决策提供依据；\n6. 建立数值调整后的数据验证及复盘机制，通过 A/B 测试、用户分层、数据对比等方式持续验证并优化方案；\n7. 与产品、运营、技术等团队协作，推动数值方案从设计、配置、上线到数据验证完整落地。\n\n任职要求\n\n1. 具备较强的数据敏感度、逻辑分析及数值建模能力，能够独立完成业务问题拆解和数值方案设计；\n2. 对内容类产品商业化有较好的理解，熟悉会员、虚拟币/金币、付费内容、活动促销等常见商业化模式；\n3. 能够独立进行金币产消、价格梯度、活动成本、用户价值、付费转化等相关测算，而非仅进行基础数据统计；\n4. 熟练使用 Excel 等数据分析工具，具备 SQL 数据查询能力；掌握 Python 或其他数据分析工具优先；\n5. 具备较强的业务理解能力，能够将数据分析结果转化为实际的产品或运营优化方案；\n6. 有 APP、Web、内容社区、漫画/动漫、短剧、游戏等相关行业数值运营、商业化运营或数值策划经验优先；\n7. 熟悉二次元用户群体，对动漫、漫画、二次元内容及相关用户消费习惯有一定理解者优先；\n8. 能熟练使用 AI 工具辅助数据处理、分析及方案测算，同时具备独立判断分析结果合理性的能力。\n\n我们更看重\n\n我们希望你不仅能够“看数据”，更能够理解数字背后的业务逻辑。\n\n面对一个现有的金币、会员或活动体系，你需要能够判断：\n\n现在的数值是否合理 → 问题在哪里 → 应该如何重新设计 → 调整后可能产生什么影响 → 如何通过数据验证。\n\n最终逐步建立一套稳定、可测算、可验证、可持续迭代的产品数值体系。", "cat": "运营"}, {"id": "250", "title": "网站运营组长", "salary": "8k - 20k", "location": "未明确", "jd": "网站运营\n\n岗位职责\n\n网站整体运营与增长\n\n负责网站日常运营及整体运营策略落地，围绕新增、活跃、留存、转化、付费及营收等核心指标制定并执行运营方案。\n\n参与网站从 0 到 1 的运营搭建，包括用户体系、内容体系、活动体系及运营流程建设，推动网站持续增长。\n\n根据业务发展阶段制定冷启动、用户增长及规模化运营策略，持续提升网站整体流量及用户规模。\n\n内容运营与用户留存\n\n负责网站内容体系的规划、运营及优化，根据用户需求和数据表现持续调整内容方向。\n\n优化网站首页、频道页、详情页、推荐位等核心页面的内容结构与展示逻辑，提升点击率、浏览深度、停留时长及用户留存。\n\n参与内容选题、专题策划、活动策划及内容分发，提升内容产出效率和内容对用户增长、留存及转化的贡献。\n\n建立内容运营标准及内容质量评估机制，持续提升网站内容质量和用户体验。\n\nSEO及流量增长\n\n负责网站 SEO 运营，包括关键词布局、页面结构、站内链接、专题页、内容优化及搜索流量增长等。\n\n分析自然搜索、社媒、外部渠道等不同流量来源，持续优化流量获取及分发策略。\n\n关注行业及竞品网站运营情况，挖掘新的流量增长机会，提升网站整体曝光及自然流量。\n\n数据分析与运营优化\n\n日常跟踪网站核心数据，包括 UV、PV、注册、DAU、留存、访问深度、跳出率、转化率、付费率及营收等。\n\n基于数据分析用户访问及转化路径，定位流量、内容、产品及转化环节中的问题，并提出可执行的优化方案。\n\n建立并持续完善网站运营数据指标体系，通过数据驱动内容、活动、页面及用户运营策略迭代。\n\n根据数据反馈持续进行 A/B Test 及运营策略调整，提升网站整体运营效率。\n\n用户增长与转化\n\n围绕“流量获取—用户注册—内容消费—用户留存—付费转化”完整链路进行运营优化。\n\n负责会员、付费内容、订阅、活动及其他商业化场景的运营，持续提升用户转化率及用户价值。\n\n针对不同用户生命周期制定差异化运营策略，提升用户活跃度、留存率及复购/续费率。\n\n活动及专题运营\n\n根据业务目标策划线上活动、专题活动、节日活动及用户增长活动，负责活动从策划、执行到复盘的完整流程。\n\n通过活动、专题及内容运营提升网站流量、用户活跃度、用户留存及付费转化。\n\n跨部门协作\n\n与产品、技术、设计、内容、渠道及商务等团队协同，推动网站功能、页面、内容及运营工具持续优化。\n\n能够独立梳理运营需求并推动产品、技术落地，持续改善网站用户体验及运营效率。\n\n定期复盘运营结果，沉淀可复制的网站运营方法论。\n\n任职要求\n\n2-5 年网站运营、互联网产品运营或内容运营相关工作经验，有网站/平台型产品运营经验优先。\n\n有完整参与或主导网站/互联网产品从 0 到 1 搭建、冷启动或增长阶段的经验，能够独立制定并执行运营策略。\n\n熟悉网站运营完整链路，对用户增长、内容运营、用户留存、转化及商业化有较深入理解。\n\n具备较强的数据分析能力，熟悉 Google Analytics、Search Console、数据报表等常用分析工具，能够通过数据独立拆解问题并提出优化方案。\n\n熟悉 SEO、网站流量增长、内容运营及用户运营，有成功的网站流量增长或用户增长案例优先。\n\n具备较强的内容判断能力，能够根据用户需求、行业趋势及数据表现制定内容方向和运营策略。\n\n具备较强的项目推进能力，能够协调产品、技术、设计、内容等多个团队推动项目落地。\n\n执行力强，责任心强，具备较好的沟通及协作能力，能够适应快节奏、高强度的互联网运营环境。\n\n有成人行业、泛娱乐、内容社区、视频/图片平台或海外互联网产品运营经验优先。\n\n有网站从 0 到 1 搭建、SEO 流量增长、会员/付费产品运营或海外网站运营经验者优先。", "cat": "运营"}, {"id": "251", "title": "AI内容视频剪辑", "salary": "8k - 20k", "location": "未明确", "jd": "# AI内容视频剪辑专员 JD\n\n## 一、岗位职责\n\n1、**AI视频剪辑：** 负责公司原创AI短剧、AI漫剧及动漫视频的后期制作，包括素材整理、粗剪精剪、字幕、配音、调色及成片包装，保障剧情连贯性与画面质量。\n\n2、**内容二次创作：** 根据剧本、分镜及产品需求，完成剧情高光剪辑、短视频切片、视频混剪及宣传素材制作，提升内容表现力与吸引力。\n\n3、**AI工具应用：** 运用AI视频生成及辅助剪辑工具，完成素材补充、画面修复、智能配音及字幕生成，优化制作流程，提升剪辑效率。\n\n4、**成片质量把控：** 负责视频自检与修改，重点处理人物形象不一致、动作不连贯、镜头衔接异常及音画不同步等问题，确保成片符合交付标准。\n\n5、**团队协作与交付：** 配合AI内容生成、审核及运营团队完成视频制作任务，按时交付成片，规范管理素材、工程文件及剪辑模板，持续优化制作流程。\n\n## 二、任职要求\n\n1、大专及以上学历，2年以上视频剪辑或影视后期制作经验，有AI短剧、AI漫剧或动漫视频制作经验者优先。\n\n2、熟练使用剪映专业版（CapCut）、Premiere Pro、After Effects等剪辑软件，能够独立完成视频剪辑、字幕、音效、调色及后期包装。\n\n3、熟悉镜头语言、剧情节奏及视频叙事逻辑，具备良好的审美能力，能够独立完成从素材整理到最终成片的制作流程。\n\n4、熟悉即梦、可灵、Runway、Sora等至少一种AI视频制作工具，能够运用AI辅助完成素材优化、画面修复及视频制作。\n\n5、具备良好的沟通协作、时间管理及问题解决能力，能够适应多项目并行及批量视频制作需求。\n\n## 三、优先考虑\n\n1、具有完整AI短剧、AI漫剧或原创动漫视频成片制作经验。\n\n2、熟悉AI视频生成工作流，具备角色一致性、镜头衔接及AI素材修复经验。\n\n3、具备批量视频剪辑、内容二创及标准化视频生产经验。\n\n## 四、岗位交付要求\n\n1、按项目排期完成视频剪辑、后期包装及成片交付，保障制作进度与质量。\n\n2、定期汇总视频产出、成片合格率及返工情况，持续提升制作效率。\n\n3、沉淀可复用的剪辑模板、素材资源及标准化制作流程。\n\n## 五、面试作品要求\n\n需提供**2–3份本人参与制作的视频作品**，优先AI短剧、AI漫剧或动漫视频，并说明个人负责环节、使用工具及制作周期。\n\n**岗位定位：** 以原创AI视频剪辑、后期制作及成片交付为核心，重点考察剪辑技术、AI工具应用、剧情理解及内容质量把控能力。", "cat": "AI / AIGC"}, {"id": "252", "title": "新媒体运营（新媒体数字人达人账号方向）", "salary": "12-15K", "location": "未明确", "jd": "岗位定位\n负责数字⼈达⼈账号的定位、搭建、选题、脚本策划、发布运营与数据复盘。以抖⾳、哔哩哔哩(B站)、YouTube 为\n主要平台,重点理解抖⾳与 B站的内容逻辑;X、Telegram 等为辅助平台。\n岗位职责\n1. 账号搭建与⼈设规划:明确⽬标⽤⼾、账号定位、⼈设表达、内容栏⽬及更新节奏,推动账号从搭建到持续运\n营。\n2. 选题与脚本策划:围绕⽣活场景、⽤⼾兴趣和数字⼈⼈设设计选题,独⽴完成视频脚本,清楚表达开头吸引点、内\n容结构、节奏及互动设计。\n3. 热点捕捉与话题策划:理解实时热点、⽹络梗和社区⽂化,判断热点与账号的匹配度,既能结合热点创作,也能主\n动策划有讨论度和参与感的话题。\n4. 平台运营与内容落地:结合抖⾳、B站、YouTube 的⽤⼾习惯调整内容表达、标题封⾯和发布节奏,与制作⼈员\n协作完成内容落地及质量检查。\n5. 数据复盘与迭代:根据播放、观看留存、完播、互动、涨粉等可获得的数据识别问题,提出调整措施,跟踪调整后\n的结果,持续优化选题、脚本和运营策略。\n硬性要求\n1. 必须有 To C(⾯向普通⽤⼾)的账号运营实操经历,亲⾃承担过账号搭建及运营⼯作,能够清楚说明负责的平台、\n⼯作范围和执⾏过程。\n2. 具备重点平台相关账号实操案例,重点掌握抖⾳与 B站的内容分发、⽤⼾偏好和社区表达逻辑;能够说明在\nYouTube 上的相关运营经验及平台差异。\n3. 具备独⽴选题与脚本策划能⼒,能够提供本⼈参与的视频及对应脚本,并解释内容设计依据。\n4. 熟悉⽣活类内容、实时热点和梗⽂化,具备热点判断、内容转化及话题策划能⼒,并有实际案例⽀撑。\n5. 必须具备数据复盘能⼒,能完整说明\"数据表现—问题判断—调整动作—结果验证\",⽽⾮仅罗列播放量或发布数\n量。\n加分项\n能独⽴制作内容,包括拍摄、剪辑、字幕、配⾳及基础视觉包装。\n能使⽤ AI ⼯具制作内容,并展⽰具体作品、制作流程与本⼈贡献。\n有数字⼈、虚拟⻆⾊或达⼈ IP 账号的运营经验,能够持续保持⼈设与内容⻛格。\n有 X、Telegram 等辅助平台的运营经验。", "cat": "运营"}, {"id": "253", "title": "编剧（AI短剧/漫剧方向）", "salary": "15-30k", "location": "未明确", "jd": "岗位职责\n1. 负责都市情感、婚姻家庭、女性成长、悬疑反转、银发情感等题材的选题策划与剧本创作。\n2. 完成故事大纲、人物小传、分集梗概、单集剧本及对白。\n3. 设计前三集钩子、单集冲突、集尾悬念和中后段付费卡点。\n4. 根据平台数据和用户反馈，快速调整剧情节奏、人物关系及情绪密度。\n5. 使用大语言模型等AI工具辅助选题、资料整理、剧情推演和版本迭代。\n6. 与AI分镜、视觉、配音、剪辑团队协作，保证剧本具备良好的生成和制作可行性。\n7. 关注主流短剧平台的热门题材及用户趋势。\n任职要求\n1. 具备网文、短剧、漫画、动画、游戏剧情或互动内容创作经验。\n2. 熟悉短剧叙事规律，能够快速建立冲突，并持续制造反转和情绪价值。\n3. 人物关系设计能力强，擅长成年人情感、利益博弈及现实议题。\n4. 能独立完成60—100集短剧的整体架构，单集时长适配3-5分钟。\n5. 具备较强的修改能力，能够接受快节奏、高频迭代的工作方式。\n6. 有版权意识和内容安全意识，能够主动规避低俗、侵权及平台审核风险。\n7. 对AI内容生产有兴趣，愿意持续学习新的生成工具和工作流。\n加分项\n• 有上线短剧、爆款网文或高流水项目经验；\n• 熟悉红果、抖音、快手等平台的内容偏好；\n• 有海外短剧、本地化改编或多语言内容经验；\n• 能使用AI完成角色设定、分镜提示词或视频预演；\n• 拥有可改编IP、成熟题材库或稳定创作搭档。", "cat": "AI / AIGC"}, {"id": "254", "title": "短剧内容增长运营（国内社媒）", "salary": "12k-15k", "location": "工作地点：远程 / 英国本地 ，英国本地：£2,000–£2,500 / 月，转正后可根据导流与账号数据设置绩效奖金（细则面议），提供账号链接或作品数据，并增加一个 24 小时内提交的剪辑小作业", "jd": "岗位目标\n负责公司原创 AI 短剧在国内社媒（小红书、抖音为主）的内容化推广：从原创短剧中剪辑、二创出适合公开平台传播的内容，建立账号矩阵并持续产出爆款，把平台流量引到产品。\n岗位职责\n内容策划：深度理解年轻女性用户在短视频 / 短剧上的偏好（题材、人设、节奏、情绪点、评论区话题），为每部原创短剧制定社媒传播方案，确定切片角度与钩子。\n剪辑二创：独立完成短剧的切片、混剪、卡点、字幕与封面，产出符合小红书、抖音调性的传播版本（合规、可公开），保证每周稳定产量。\n标签与分类：熟悉短剧 / 短视频的题材标签体系（如霸总、替身、追妻、重生、先婚后爱、强制爱等），能对素材做标签分类，并据此规划账号内容方向与话题运营。\n账号运营：搭建并运营小红书、抖音账号矩阵，负责发布节奏、话题选择、评论互动、私信引导与账号安全；跟踪各平台规则变化。\n数据复盘：每周复盘播放、互动、涨粉与导流数据，找到有效内容形式并放大；输出可复用的选题与剪辑 SOP。\n协同：与 AI 短剧制作组对接选题与素材需求，反哺剧本创作（哪类桥段在社媒更容易引起共鸣）；与产品运营对接落地页与转化链路。\n任职要求\n3 年以上短视频 / 短剧内容运营经验，有小红书或抖音账号从 0 做起的成功案例（请附账号或作品链接及数据）。\n资深短剧用户，对当下热门短剧、爆款切片和年轻女性受众的喜好有明确判断，能说清“为什么这条会火”。\n熟练使用剪映 / Premiere 等剪辑工具，独立完成剪辑、字幕、封面全流程；有网感，标题与文案能引发共鸣。\n熟悉短剧 / 短视频标签体系，有素材分类或选题库搭建经验。\n熟悉小红书、抖音的内容规范与流量机制，有内容合规意识。\n结果导向，能接受以播放量、涨粉、导流数据为核心的考核。\n加分项\n有 AI 短剧制作经验（即梦、可灵、Runway 等工具，或 AI 分镜 / 生图 / 生视频流程），了解 AI 短剧的制作逻辑与可剪辑点。\n有女性向内容（言情、耽美、乙女向）平台或账号的运营经验。\n有海外社媒（YouTube Shorts、TikTok、X）运营经验，可兼顾海外推广。\n有引流转化经验，做过从社媒到 App / 站点的导流链路。\n考核指标（试用期）\n账号矩阵搭建完成，每周稳定产出 N 条二创内容（入职后按平台定量）。\n首月内跑出至少 1 条播放量破 10 万的内容，明确可复制的内容形式。\n月度社媒导流新增用户量与产品注册转化，作为转正核心指标。", "cat": "内容"}, {"id": "255", "title": "初级短剧运营", "salary": "9K–12K/月", "location": "未明确", "jd": "岗位职责\n学习 AI 短剧制作：参加公司的系统培训，掌握 AI 短剧从剧本、分镜、生成到剪辑的完整流程，逐步能独立做出成片\n短剧上下架：负责平台短剧的上架和下架，维护剧集信息（标题、封面、简介、集数等），保证线上内容准确、及时更新\n打标签与分类：给短剧打题材、风格、人设等标签，持续整理标签体系，方便推荐和用户检索\n前端展示调整：根据运营策略和数据表现，调整首页、专题页、榜单等模块的排序和推荐位，提高内容曝光和点击\n数据跟进：关注剧集的播放、完播、付费等数据，发现爆款苗头和低效内容，提出优化建议\n完成上级安排的其他内容运营工作\n任职要求  ：学历要求： 大专及以上，专业不限\n喜欢看短剧，熟悉主流短剧题材和平台，对“什么剧会火”有自己的判断\n学习能力强，愿意接触 AI 工具，乐于尝试新的内容制作方式\n做事细致有耐心，能稳定完成上架、打标这类需要细心的工作\n会用 Excel 等办公软件，有基本的数据意识\n沟通顺畅，有责任心，能配合团队节奏\n加分项（满足其一即可优先）\n有编导经验，懂剧情结构、节奏和钩子设计\n有剪辑经验，会用剪映、PR 等剪辑软件\n有短剧制作经验，参与过短剧拍摄或 AI 短剧生成\n有短剧运营经验，做过短剧平台或 App 的内容运营\n我们提供\n包培训：从零教 AI 短剧制作，没有经验也可以上手\n有竞争力的薪资：9K–12K，按能力定级\n处在 AI 短剧这个新赛道，成长空间大", "cat": "运营"}, {"id": "256", "title": "中高级产品运营", "salary": "12-18k", "location": "未明确", "jd": "岗位职责\n\n1. 负责所属成人向长视频/短视频内容产品的日常运营，对日活、新增、留存、充值等核心数据指标负责。\n2. 执行组长制定的内容运营策略：日常内容更新、分类/专区/模块优化、依照筛选逻辑优化展示效果。\n3. 监控各项产品数据表现，理解各项数据指标的逻辑，并能够依照数据变化情况，及时进行反应以及调整。\n4. 每日进行产品巡检并分析使用体验，确保产品各项功能正常，包含展示与跳转、播放链路、支付流程等，发现异常及时反馈并跟进至解决。\n5. 收集并处理客服反馈、用户问卷等多渠道用户声音，转化为可执行的产品优化建议。\n6. 参与日度/周度/月度数据复盘会议，独立汇报所负责产品的数据表现及问题归因，并提出优化方针。\n7. 能够进行跨部门沟通协同，推进产品迭代与问题排查，对结果闭环负责。\n8. 为产品定制活动方案，能够利用活动达成指定数据指标的提升，并进行复盘与汇总\n\n任职要求\n\n1. 1年以上成人产品运营经验，有付费产品运营经验者优先；\n2. 有产品迭代经验，新品需求文档攥写能力；\n3. 具备较强的内容敏感度，能够保证更新内容具备吸引力，展示方式符合用户审美，具备视频剪辑 / 封面制作能力者优先；\n4. 数据敏感度强，能够做到问题归因以及提出针对性解决措施；\n5.责任心强，具备较强的结果导向意识。", "cat": "运营"}, {"id": "257", "title": "业务培训专家", "salary": "20K-35K", "location": "未明确", "jd": "业务培训专家 JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n负责讲师资格库建设，优先挖掘业务一线 TOP 20% 高手担任兼职讲师，按季度核验讲师业务表现及授课质量，建立动态淘汰机制。\n对接 AI 工具厂商及外部讲师资源，评估其行业案例、ROI 数据及课程适配度，把控外部讲师引入标准。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n按季度组织业务复盘会，与业务一线、HRBP 对齐培训落地效果及业绩归因，持续优化课程内容和演武机制。\n任职要求\n5-8 年业务培训、业务赋能、培训运营或实战教练相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点，不只是做课程交付，而是能围绕业务结果设计培训方案。\n主导过 50 场以上实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n善于调动业务内部高绩效人员担任兼职讲师，能把一线优秀打法转化为可复制、可训练、可考核的课程和 SOP。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "其他"}, {"id": "258", "title": "培训运营专员", "salary": "15-25k", "location": "未明确", "jd": "培训运营 专员JD\n岗位职责\n面向集团核心业务线，按月组织实战演武班，围绕业务真实场景设计培训内容，推动业务方法、优秀案例和 SOP 的复制落地。\n提前3- 5 个工作日完成开班通知、学员组织及 HRBP 对齐，保障培训节奏和参训质量。\n追踪每场培训后 30 天内学员实际产能变化，沉淀复用率、人效差、传导率等核心指标，验证培训是否真正带来业务提升。\n每月定期向组织发展中心推送认证数据，包括工号、岗位、SOP 名称、认证等级、实测提效比例等。\n\n任职要求\n5年或以上人才发展、业务赋能、培训运营或相关经验，有互联网业务线、运营、销售、客服、内容、电商等一线业务经验优先。\n具备一定业务实战经验，能理解业务目标、关键流程和一线执行痛点。\n独立实施过多次实战型培训或业务赋能项目，熟悉从业务需求调研、课程设计、讲师组织、培训交付到效果追踪的完整链路。\n具备培训 ROI 评估和产能数据追踪经验，能完成基线设定、课前课后对比、提效测算和业绩归因。\n具备较强的数据分析和报告输出能力，熟练使用 Excel，掌握 SQL、BI 工具或数据看板搭建经验者优先。\n结果导向、执行力强，能以业务提升为目标推进培训落地，而不是停留在培训完成率。", "cat": "运营"}, {"id": "259", "title": "HRBP (远程)", "salary": "¥18K–25K/月,具体依能力面议", "location": "HRBP (远程)", "jd": "岗位职责\n编制管理:对口若干中后台部门,深入了解部门业务,持续评估编制合理性,参与入职审批环节并出具专业意见\n组织诊断与人效分析:定期与所辖部门负责人及团队访谈,诊断组织问题、协助管理改善;基于数据开展人效分析,输出可落地的结论与建议\n例常人事工作:月度组织架构与花名册核对、编制统计、各部门绩效与薪酬激励数据的收集、汇总与初审\n专项支持:组织调整期间的落地支持(员工沟通、去向协调、人员安置)及临时性专项任务\n制度建设:参与团队制度与流程的搭建与优化\n\n任职要求\n3 年以上 HRBP 相关经验,有组织诊断或人效改善的实际落地案例者优先\n执行力强,例常工作细致零差错,时间承诺可靠\n沟通能力出色:能坦率指出问题,也能维护好跨部门关系,推动问题落地解决\n对数据敏感,书面表达清晰,能独立产出结构完整的分析报告\n适应远程协作,自驱力强\n熟练使用 AI 工具提升工作效率者加分", "cat": "职能"}, {"id": "260", "title": "HRBP（英国）", "salary": "£45,000 – £65,000 / 年", "location": "工作地点：伦敦", "jd": "岗位职责\n业务伙伴支持：深入对接业务负责人，理解组织结构、业务需求及团队问题。\n组织诊断与问题解决：识别组织及人员问题的根本原因，并提出切实可行的解决方案。\n人力规划与人才决策：从业务角度主导人力规划、招聘决策及人才评估。\n执行与效果达成：推动相关工作的落地，并确保对组织效率与业务结果产生实际影响。\nHR体系支持（按需）：在需要时参与HRBP相关机制与方法的优化，与COE等团队协同推进。\n\n任职要求\n工作经验\n具备HRBP经验，支持过一定规模团队（建议50人以上）\n有通过人力资源手段解决组织或人员问题的实际经验\n资质要求\nCIPD Level 5及以上（或同等专业资质）\n核心能力\n具备较强的业务理解与影响力\n具备系统性分析与问题解决能力\n能够影响业务决策并提出建议\n结果导向，务实落地\n语言要求\n中文流利（可作为工作语言）", "cat": "职能"}, {"id": "261", "title": "稽核专员", "salary": "试用期£25,000–28,000/年，转正后加 £5,000；\n满一年总包目标 £36,000–38,000", "location": "工作地点：英国", "jd": "工作内容\n按公司制度审核月度奖金与津贴提报、季度职级晋升与调薪申请，对错误、漏项、依据不足的事项说明理由退回。\n撰写稽核报告：写清问题、依据与整改建议，跟进至整改完成。\n承接新增稽核事项（如对各单位执行某项汇报制度情况的月度抽查）：明确稽核内容与依据，跑通前几个周期后形成书面流程。\n代表稽核团队对接 OA 系统开发团队：将审核与审批流程整理为书面需求，测试每个版本，记录问题并跟进至解决。\n\n任职要求\n能准确读懂制度文件并严格对照执行，能发现提报内容与所依据规则不一致之处。\n不只看合不合规，还能结合人员、岗位与绩效情况判断一个数字合不合理；写意见时分清事实、推断与建议。\n对数字敏感，处理大量薪酬、奖金、人员数据时保持准确；熟练使用 Excel / Google Sheets。\n能把一项制度转化为可执行的稽核：抽什么、怎么判、要哪些基础数据、每月大约多少人时，并守住稽核岗位的边界不越权。\n书面表达结论前置、简洁，几句话能写清问题、依据和改法；能当面讲清自己的方案和取舍。\n能把人工审核流程描述到开发人员可据以开发的程度并验收交付结果；与开发团队和其他部门对接时能守住立场、推动响应，不事事上报。\n信息不全时能自行假设并写明、先往前推进，知道缺的依据去哪里拿。\n日常熟练使用 AI 工具提升核对、撰写与分析效率，能说清哪些内容是工具产出、哪些经本人核对。\n有审计、内控、薪酬核算、人力资源运营或财务相关经验者优先；能力重于年限。", "cat": "其他"}, {"id": "262", "title": "HR助理（HRBP方向）", "salary": "£25,000 – £30,000 / 年", "location": "工作地点：伦敦", "jd": "岗位职责\n业务理解与HRBP支持：协助总监理解业务运作，识别组织问题并推进相关优化。\n人力规划与招聘支持：参与人力需求评估及招聘支持，从业务角度判断人员匹配度。\n组织效率提升：协助推动团队效率及整体组织绩效的提升。\n执行与制度落地：协助相关工作的落地与跟进，并推动公司制度在各部门执行。\n\n任职要求\n基础要求\n本科及以上学历\n熟练使用办公工具（如Excel、Google Drive、WPS等）\n对使用AI工具提升工作效率具备积极态度\n中文流利\n核心能力\n执行力强，能够推动事情落地\n逻辑能力强，具备清晰的分析与判断能力\n学习能力强，能够快速成长\n候选人背景（需满足以下三类之一）\n人力资源专业背景（优先）\n人力资源管理或相关专业（如人力资源管理、组织管理等以人员与组织为核心的专业），具备扎实理论基础，并希望应用于实际工作\nCIPD发展路径人选\n已完成CIPD Level 3，并正在学习Level 5，对HRBP发展路径有明确规划\n具备管理经验并计划转型HR的人选\n过往工作中有实际带人或团队管理经验，对组织与人员问题有一定理解，有明确意愿转型HR，并计划未来考取CIPD", "cat": "职能"}, {"id": "263", "title": "生活助理", "salary": "综合年包\n年综合收入不低于£52,000（税前）\n\n薪资结构\n基础月薪：£2,800\n加班及周六工作补贴：£1,200/月\n综合实际月收入：约 £4,000\n享有13薪\n表现优异可15薪\n\n试用期期间是时薪，第一个月£15/h，后£20/h", "location": "工作地点：伦敦，需要接受未来住家", "jd": "工作内容\n负责家庭成员日常伦敦市区内接送及相关出行安排；\n协助处理日常生活及临时事务；\n偶尔陪同老板进行PC游戏娱乐；\n配合完成其他交办事项；\n能接受日常超时及周六加班安排。\n\n任职要求\n年龄35岁以下优先。\n必须会开车，驾驶技术熟练，熟悉市区道路者优先（要求英国驾照）\n熟悉PC游戏，平时有PC游戏经验者优先；\n做事靠谱，执行力强，反应快；\n性格稳定，守时，有责任心；\n能接受每周休息1天的工作节奏；\n目前需具备合法工作身份，不提供工作签证。\n\n工作时间与休息\n实际工作节奏为：每周休息1天\n日常可能存在超时工作\n周六通常需要配合工作安排（不需要固定时间，可灵活调休）\n具体工作时间根据实际事务灵活安排\n\n\n假期安排\n年假/休息假期合计：52天/年\n假期可调休、可累计、可分段休\n未休假期可折算工资\n折算标准：£160/天\n\n\n其他福利\n提供住宿\n提供餐食\n工作稳定，待遇明确\n不提供工作签证，需已有合法工作身份。", "cat": "职能"}, {"id": "264", "title": "英国法务助理", "salary": "", "location": "未明确", "jd": "（源表未填写JD）", "cat": "职能"}, {"id": "265", "title": "法务专员", "salary": "", "location": "未明确", "jd": "岗位职责\n参与公司海外主体搭建与治理，包括跨国基金、境外公司的设立、架构设计及日常合规维护\n支持投融资项目全流程法律工作：尽职调查、交易文件起草与谈判、交割及投后管理，覆盖公司融资与对外投资两端\n负责短剧等内容业务的版权与 AI 相关法律事务：版权权属与授权、AI 生成内容合规、平台合作协议审核\n起草、审核各类商业合同，识别法律风险并提出解决方案\n跟进相关领域法律法规及监管动态，输出合规建议\n\n任职要求与优先条件\n具备以下三个方向中至少两个方向的实践经验：\n海外公司治理：跨国基金或境外公司设立、架构搭建及治理\n投融资项目：融资与投资项目均有参与经验\nAI 与版权：短剧或内容行业的版权及 AI 合规经验\n具备良好的英文读写及法律文件起草能力\n学习能力强、主动性高，能在业务快速变化中独立推进工作\n有跨境交易或海外合规项目经验\n对短剧、AI 内容行业有持续关注和理解", "cat": "职能"}, {"id": "266", "title": "增长部动漫产品经理", "salary": "20-25K", "location": "未明确", "jd": "产品经理（内容社区 / 泛娱乐方向）\n薪资范围：20–25K\n岗位职责：\n1. 负责公司内容产品的整体规划与持续迭代，覆盖 App 端及 Web 端，结合业务目标制定产品路线、版本计划和需求优先级，并推动方案落地。\n2. 深入理解用户在内容发现、搜索筛选、播放阅读、收藏追更、互动社区及个人中心等场景中的需求，持续优化核心使用路径和产品体验。\n3. 独立完成用户调研、竞品分析、需求梳理、功能架构、业务流程、产品原型及 PRD 撰写，确保需求逻辑清晰、规则完整并具备可执行性。\n4. 协同 UI/UX、研发、测试、内容运营及市场团队推进产品开发，跟进排期、评审、验收和上线过程，及时识别并解决项目中的风险与问题。\n5. 结合业务发展探索会员订阅、广告、虚拟权益、任务奖励、邀请推广等商业化及增长机制，在兼顾用户体验的基础上提升留存、活跃和付费转化。\n6. 建立并持续关注核心产品指标，通过用户反馈、行为数据和转化漏斗评估功能效果，定位问题并提出后续优化方案。\n7. 关注动漫、漫画、视频及内容社区行业趋势，持续研究同类产品的内容组织、推荐分发、社区互动和商业化模式，为产品创新提供可落地的建议。\n\n任职要求：\n1. 本科及以上学历，具有2年以上互联网产品相关经验，能够独立负责较完整的产品模块或版本迭代。\n2. 熟悉产品工作的完整流程，具备较强的需求分析、逻辑梳理、原型设计和文档表达能力，能够熟练使用 Figma、Axure、墨刀等产品工具。\n3. 具备良好的项目推动能力，能够协调设计、研发、测试和运营等不同团队，推动需求按计划落地。\n4. 具有数据意识，能够围绕用户活跃、留存、转化和付费等指标发现问题，并据此制定产品优化方案。\n5. 对内容社区、动漫漫画、视频娱乐或会员订阅类产品有一定理解，能够站在用户和业务两个角度思考产品方案。\n6. 沟通清晰、执行力强，对产品细节敏感，能够适应快速迭代及多任务并行的工作节奏，具备基本的平台内容安全与合规意识。\n\n加分项：\n1. 有内容社区、视频、漫画、二次元或海外互联网产品经验。\n2. 有从0到1参与产品搭建或新业务上线的实际经验。\n3. 熟悉会员订阅、广告变现、邀请裂变或用户激励体系。\n4. 具备基础的数据分析能力，熟练使用 Excel、SQL或相关数据分析工具。\n5. 对动漫、漫画及二次元内容有长期兴趣，熟悉国内外主流内容平台和用户生态。", "cat": "产品"}, {"id": "267", "title": "内容运营（动漫）", "salary": "10–20K", "location": "未明确", "jd": "中级运营（内容 / 社区 / 社媒方向）\n\n薪资范围：10–20K\n\n岗位职责\n\n1. 负责动漫、漫画相关内容资源的挖掘与筛选，主动寻找符合平台需求的内容来源和资源渠道，持续整理、维护和拓展资源库。\n2. 负责平台内容日常运营，包括内容筛选、编辑、推荐及专题策划，提升内容质量与用户体验。\n3. 负责社区及社群运营，通过日常互动、话题策划和活动组织，提升用户活跃度与留存。\n4. 参与 X（Twitter）、Telegram 等渠道的内容策划、发布与维护，提升平台曝光和用户参与度。\n5. 跟踪内容、社区及社媒运营数据，定期复盘，并与产品、设计、技术等团队协作推进优化。\n\n任职要求\n\n1. 具备 2 年及以上互联网运营经验，有内容、社区或社媒运营相关经历。\n2. 熟悉动漫、漫画内容平台及相关社区，具备较强的信息检索和资源挖掘能力，能够独立找到、筛选并持续拓展符合业务需求的内容资源。\n3. 具备良好的内容判断力、文字表达和选题策划能力，能够结合用户兴趣开展运营工作。\n4. 具备用户沟通和活动组织能力，执行力强，能够主动推进工作并做好跨团队协作。\n5. 具备基础数据分析能力，能够使用 Excel 等工具整理数据，并据此调整运营策略。\n\n加分项\n\n• 有使用 AI 工具制作短剧、漫剧或相关视频内容的经验，有作品案例者优先。\n• 有动漫、漫画相关内容资源积累，或相关平台、社区运营经验。\n• 熟悉 SEO，或有 X（Twitter）、Telegram 等渠道的运营经验。", "cat": "内容"}, {"id": "268", "title": "中高级运营（游戏运营）", "salary": "15-20K", "location": "未明确", "jd": "中高级运营（游戏运营）\n薪资范围：15-20k\n\n岗位介绍\n负责海外互动游戏及剧情类产品的日常运营，重点开展游戏内容更新、剧情策划、运营活动设计及内容配置工作，提升用户参与度、留存及产品活跃度。\n\n岗位职责\n1. 负责游戏产品的日常内容运营，包括剧情内容更新、游戏素材整理、内容配置及上线检查。\n2. 参与互动剧情、角色设定、故事分支及玩法内容策划，协助完善游戏内容体验。\n3. 负责游戏运营活动策划与执行，包括节日活动、主题活动、用户活跃及留存活动等。\n4. 通过运营后台完成游戏内容配置、更新与维护，确保游戏内容正常展示及运行。\n5. 跟踪游戏内容表现及用户反馈，分析用户参与、留存及内容消费情况，提出优化建议。\n6. 配合产品、设计及研发团队完成游戏版本测试、内容验收及运营需求落地。\n\n任职要求\n1. 具备2年以上游戏运营、内容策划或相关工作经验。\n2. 对游戏内容、互动剧情及用户体验有一定理解，具备基础的内容策划与活动设计能力。\n3. 具备较好的文字表达及创意能力，能够独立完成基础游戏内容或运营活动方案。\n4. 熟悉游戏运营基本流程，能够进行内容配置、活动执行及效果复盘。\n5. 具备良好的沟通协调能力和执行力，能够与产品、研发及设计团队协同工作。\n\n加分项\n1. 有海外游戏运营或游戏出海项目经验。\n2. 有互动剧情、文字游戏、互动短剧或休闲游戏运营经验。\n3. 有游戏剧情创作、角色设定、分支剧情设计或活动策划经验。\n4. 熟悉AI内容生成工具，能够利用AI辅助剧情创作、素材生产及内容更新。", "cat": "运营"}, {"id": "269", "title": "动漫用户增长中高级运营", "salary": "18-25k", "location": "未明确", "jd": "岗位名称：中高级运营（内容策略、用户增长、内容分发、商业化及整体运营）\n岗位职责：\n1. 负责新项目上线后的整体运营工作，制定运营策略和阶段目标，并推动落地；\n2. 负责线上活动的策划与执行，包括节日活动、拉新促活、会员促转等，并进行效果复盘；\n3. 负责内容运营，包括内容选题、专题策划、首页推荐位排期及热门内容包装；\n4. 搭建运营数据指标体系，监控核心数据（DAU、留存、播放时长、付费转化等），定期输出分析报告并提出优化方案；\n5. 维护用户社群与反馈渠道，提升用户活跃度与粘性；\n6. 与产品、设计、市场团队紧密协作，推动产品迭代和运营目标达成。\n\n任职要求：\n1. 本科及以上学历，5年以上互联网运营经验，其中2年以上视频、短剧、动漫、直播等娱乐类产品运营经验；\n2. 具备独立操盘项目的能力，有成功的活动或用户增长案例者优先；\n3. 熟悉内容平台运营逻辑，对热点内容和年轻用户偏好有敏锐洞察；\n4. 数据敏感，熟练使用Excel及数据分析工具，能通过数据发现问题并优化策略；\n5. 具备优秀的策划能力、文案能力和跨部门沟通协调能力；\n6. 结果导向，执行力强，能适应快节奏工作环境。", "cat": "商务 / 市场"}, {"id": "270", "title": "高级 Flutter 工程师（Android / iOS / Web）", "salary": "20-25K", "location": "未明确", "jd": "高级 Flutter 工程师（Android / iOS / Web）\n\n岗位职责：\n\n负责公司核心产品 Flutter 架构设计与开发；\n负责 Android、iOS、Web 三端应用开发与维护；\n负责 Flutter Plugin 开发及原生能力集成；\n负责系统性能优化、技术攻关及代码质量建设；\n利用 AI 工具提升研发效率，推动 AI 辅助开发落地。\n\n任职要求：\n\n8年以上开发经验，5年以上 Flutter 项目经验；\n精通 Dart、Flutter 框架及工程化开发；\n具备 Android、iOS、Web 三端实际开发经验；\n熟悉状态管理、网络通信、本地存储及性能优化；\n熟悉 Git 及团队协作开发流程；\n具备良好的架构设计能力和问题解决能力。\n\n核心要求（重点）：\n\n能独立开发 Flutter Plugin；\n熟悉 MethodChannel、EventChannel、FFI 等技术；\n熟悉 Kotlin、Java、Swift，能够处理原生层开发与问题排查；\n具备大型项目架构设计及性能优化经验；\n能独立负责项目从设计到上线全过程。\n\nAI 能力要求：\n\n熟练使用 Cursor、ChatGPT、Claude、Copilot、Windsurf 等 AI 开发工具；\n能利用 AI 完成代码生成、重构、测试、文档编写及 Bug 排查；\n有 AI Agent、MCP、RAG 或大模型接入经验优先；\n熟悉 OpenAI、Claude、Gemini 等模型 API 接入优先。\n\n加分项：\n\n发布过 App Store 或 Google Play 上线项目；\n有 Flutter Plugin 发布经验；\n有 AI 产品开发经验；\n有 IM、音视频等大型项目经验；\n有开源项目或技术社区贡献经验。\n\n我们希望你：\n\n工作专注，有责任心；\n热爱技术，持续学习；\n具备优秀工程化思维；\n对代码质量有追求；\n能独立承担核心模块设计与开发工作。\n\n薪资范围：面议(欢迎优秀人才)\n\n特别说明：\n本岗位要求候选人具备独立完成 Flutter 三端开发、原生插件开发及 AI 辅助研发能力，不符合上述核心要求者请勿投递。", "cat": "技术 / 数据"}, {"id": "271", "title": "高级golang开发工程师", "salary": "20-25K", "location": "未明确", "jd": "【招聘】高级 Golang 开发工程师（PHP 服务 Go 化方向）\n\n核心定位：主力产出语言为 Go 的高级工程师。PHP 仅要求\"能读懂存量代码、准确还原业务\"，不要求继续用 PHP 产出。\n\n一、岗位职责\n· 负责将现有 PHP（Laravel / ThinkPHP 等）服务迁移、重构为 Go 实现，保证迁移前后功能与接口契约一致\n· 读懂并梳理存量 PHP 业务逻辑，映射为 Go 分层结构（PHP MVC → Gin / Go-Zero 分层）\n· 将 PHP 并发模型（FPM 多进程 / Swoole 协程）改写为 Goroutine / Channel 模型，规避并发陷阱\n· 完成数据访问层迁移（PHP PDO / Eloquent → GORM / sqlx 等），做索引与慢查询优化\n· 设计灰度切流、新老接口对比验证方案，保障线上平滑过渡\n\n二、基本要求\n· 5 年以上后端开发经验，本科及以上学历；积极主动，能独立推进迁移落地\n· 必须具备 Go 实战产出能力，并能读懂 PHP 存量代码（做过 PHP、现主攻 Go 的双栈背景最契合）\n· 有 PHP→Go 的实际迁移 / 重构经验者优先\n\n三、语言 & 框架（产出以 Golang 为主）\n· Go（主力产出语言）：有 Go 生产项目经验，深入理解 Goroutine / Channel 并发模型、context 控制；熟练使用 Gin、Go-Zero\n· PHP（需能读懂存量）：熟悉 Laravel / ThinkPHP 等主流框架的路由、控制器、ORM 与配置体系，了解 FPM / Swoole 运行模型，能把 PHP 业务逻辑无损还原到 Go\n· 熟悉微服务注册中心，掌握 Nacos 与 Consul，了解服务注册、健康检查、配置管理在迁移到 Go 生态时的差异与适配方案\n\n四、数据库\n· MongoDB：合理设计文档结构，掌握索引优化与聚合管道，了解副本集原理\n· MySQL：熟练编写复杂 SQL，掌握索引优化、慢查询分析，了解读写分离、分表方案\n· Redis：熟练使用常用数据结构，理解缓存穿透 / 击穿 / 雪崩及应对方案\n\n五、消息中间件\n· Kafka：掌握 Producer / Consumer 开发，理解分区、消费者组、Offset 管理，有埋点、异步流落地经验\n· ActiveMQ：了解 Queue / Topic 模型，能独立完成业务事件、通知消息的收发开发\n· 理解消息幂等消费、重试机制、死信队列；迁移中能保证消息语义不丢不重\n\n六、加分项\n· 有 PHP→Go 的实际迁移 / 重构经验（强加分）\n· 有内容平台（短视频 / 图文）相关业务开发经验\n· 了解 Feed 流推拉模型、CDN 分发、流媒体协议（HLS / FLV）\n· 有 Elasticsearch 使用经验（内容检索 / 标签体系）\n· 熟悉 Docker / Kubernetes 基础操作", "cat": "技术 / 数据"}, {"id": "272", "title": "中高级运营", "salary": "12-20K", "location": "未明确", "jd": "岗位名称：中高级运营（12-20k）\n岗位硬性要求：\n\n有海外社交产品经验，具备独立负责一个产品的能力。\n\n核心要求：\n至少具备以下一个方向的实战经验：\n用户运营（用户增长、留存、活跃、分层运营）\n产品运营（需求分析、版本迭代、数据分析）\n策略运营（增长策略、活动运营、商业化策略）\n内容运营（社区生态、UGC/PGC、内容策略）\n有较强的数据分析能力和产品思维，能够根据数据发现问题并推动产品优化。\n具备跨部门协作能力，能够独立负责项目推进。\n\n\n\n加分项：\n海外产品运营经验（Google Play、App Store）\n工具产品或社交产品经验\n从0到1冷启动经验\nAI产品相关经验\n\n不考虑方向：\n纯内容审核\n纯合规/风控\n纯BPO交付\n纯质量管理\n无互联网产品运营经验", "cat": "运营"}, {"id": "273", "title": "新媒体运营", "salary": "10k-16k", "location": "未明确", "jd": "一、岗位职责\n1. 根据业务需求，开展国内KOL合作推广或海外社交媒体运营，提升品牌曝光、用户增长及引流转化；\n2. 拓展和维护国内KOL、达人及垂类创作者资源，完成达人筛选、主动触达、合作洽谈、内容沟通与上线跟进，持续优化合作效果；\n3. 负责海外社交媒体渠道（TikTok、Discord、Reddit、Twitter / X、Telegram、Instagram等）的账号或社群搭建、日常运营与推广，结合不同平台特点制定内容与互动策略；\n4. 策划图文、短视频、话题及社群活动，制定内容日历与推广计划，把控内容质量和发布节奏，提升粉丝增长、互动率与用户活跃度；\n5. 跟踪达人合作及各渠道推广数据，围绕曝光、互动、引流、注册和转化等指标复盘，持续优化达人选择、内容方向与推广方式；\n6. 关注平台规则、行业热点及竞品动态，挖掘新渠道与合作机会，配合站内运营做好流量承接，沉淀可复用的推广方法。\n二、任职要求\n1. 具备2年以上新媒体运营、达人合作或社交媒体推广相关经验，有视频、娱乐、泛文化类项目经验者优先；\n2. 具备以下任一方向的能力或经验：\n   - **国内KOL方向：**熟悉抖音、小红书、B站、微博等平台的达人生态，能够独立完成KOL筛选、主动触达、合作推进及关系维护；有成熟达人资源或成功合作案例者优先；\n   - **海外推广方向：**具备海外多平台新媒体推广实操经验，熟悉TikTok、Discord、Reddit等平台中的至少两个，能够结合平台规则、内容形式及社区文化开展内容推广、社群互动与用户增长；\n3. 具备良好的内容策划、文案表达与沟通协调能力，对热点和用户兴趣敏感，能够推进合作内容或推广活动落地；\n4. 具备数据分析与复盘能力，能根据推广效果调整策略；有可展示的达人合作、账号增长或引流转化案例者优先；\n5. 海外推广方向需具备良好的英语读写能力，能够独立完成英文内容发布及社区沟通；具备短视频制作、剪辑或其他语言能力者加分。", "cat": "运营"}, {"id": "274", "title": "中高级产品运营", "salary": "10k-15k", "location": "未明确", "jd": "岗位职责\n1. 产品运营与迭代推进：负责某AI全系产品的日常运营工作，深度对接产品、技术团队，收集用户反馈、使用痛点及功能需求，整理数据复盘报告，输出产品优化建议，推动产品功能迭代、体验升级，提升产品核心竞争力。\n2. 用户全链路运营：搭建并完善用户运营体系，负责新用户拉新、留存、激活、转化全流程工作；维护核心用户社群，日常答疑、互动活跃，挖掘高价值用户，搭建用户成长体系，提升用户粘性、复购率及口碑传播力。\n3. 内容与渠道运营：独立策划、产出适配AI产品的推广内容（干货教程、使用案例、功能拆解、行业方案等），覆盖公众号、小红书、抖音、知乎、社群等全渠道；负责各运营渠道的日常维护、流量撬动、内容分发，持续拓宽产品曝光渠道，获取精准用户流量。\n4. 活动策划与落地：结合产品节点、市场热点、用户需求，独立策划拉新、促活、转化、裂变类运营活动，完成活动方案撰写、落地执行、数据追踪、复盘优化全流程，达成月度/季度用户增长、营收转化目标。\n5. 数据复盘与策略优化：建立日常运营数据监测体系，重点监控用户新增、活跃度、留存率、转化率、渠道ROI等核心数据，定期输出运营复盘报告，基于数据问题迭代运营策略，持续提升运营效率与成果。\n6. 品牌与市场辅助：协助完成产品品牌基础曝光、行业资源对接、合作渠道维护，整理产品案例、行业解决方案，助力某AI产品品牌影响力持续提升，配合完成团队其他运营相关工作。\n\n任职要求\n1. 学历经验：本科及以上学历，3-5年及以上互联网产品运营、用户运营、内容运营相关全职经验，有AI工具、SaaS产品、互联网初创团队运营经验者优先\n2. 能力要求：熟悉互联网产品运营全流程，具备独立策划运营活动、产出推广内容、运营用户社群的能力；具备基础数据分析能力，能够通过数据发现问题、优化策略。\n3. 行业认知：对AI行业、智能工具产品有浓厚兴趣，愿意深耕AI产品运营领域，了解主流AI产品玩法及用户需求痛点者优先。\n4. 核心素养：逻辑清晰、执行力强，具备良好的自主驱动力和问题解决能力；擅长沟通协作，能够高效对接跨部门团队；抗压能力强，目标感明确，适配初创团队快节奏工作模式。\n5. 技能加分：擅长文案撰写、短视频内容制作、新媒体渠道运营；有私域裂变、用户增长、ToB产品运营实战经验者优先。", "cat": "运营"}, {"id": "275", "title": "中高级用户运营", "salary": "15k-20k", "location": "未明确", "jd": "渠道用户增长运营\n我们拥有多线产品矩阵，覆盖短视频、社区交友、视频直播、智能搜索等产品，含国内 + 海外双市场，多条业务均处于0-1 孵化阶段。现阶段核心目标是挖掘种子用户，完成产品冷启动，搭建基础用户增长链路，探索可持续的获客与留存模式。\n\n岗位职责\n1、负责多条孵化期产品（短视频、社区交友、直播、智能搜索类）的种子用户挖掘与冷启动，国内 + 海外渠道并行，搭建种子用户池，完成初期用户增长目标。\n2、调研国内、海外各流量渠道，筛选低成本获客渠道，落地种子用户引流方案；包含社群运营、内容种草、达人 / 主播招募、社区发帖、渠道投放测试等，持续测试获客模型。\n3、负责种子用户全链路运营：用户招募、进群引导、用户分层、需求收集、用户反馈回收，把一线用户诉求整理输出给产品团队，辅助产品迭代优化。\n4、设计冷启动活动、新手任务、激励体系，提升种子用户激活、留存、互动，监测转化漏斗（曝光 - 进入 - 注册 - 活跃），输出数据复盘，优化增长策略。\n5、区分成人 / 非成人产品线运营策略，所有运营动作严格合规；规避内容、用户、风控风险，定期排查用户侧违规行为。\n6、竞品调研：跟踪国内外同类产品冷启动玩法、渠道策略、商业化模式，输出竞品分析，寻找差异化增长机会。\n7、定期输出增长周报 / 月报，跟进核心指标：新增种子用户、DAU、留存率、获客成本，同步业务进展、问题与优化方案。\n\n任职要求\n1、有0-1 产品冷启动、种子用户运营实战经验，社交 / 社区 / 短视频 / 直播类产品经验优先；有海外增长经验加分。\n2、熟悉国内、海外主流流量渠道玩法，能独立完成渠道测试、用户引流，懂社群运营、用户挖掘，能低成本获取种子用户。\n3、具备良好的数据思维，会看增长漏斗、留存、获客成本等数据，能基于数据复盘，快速调整运营策略，试错迭代。\n4、理解多产品线并行运营，能区分不同产品（成人 / 非成人）运营边界，有强合规意识，清楚红线，拒绝违规运营手段。\n5、优秀的用户洞察力，擅长和种子用户沟通，能收集真实用户痛点，把用户反馈结构化输出给产品。\n6、自驱力强，孵化期业务不确定性高，能接受快速试错，一人多任务，独立落地完整运营项目；具备基础英文读写能力（海外业务使用）优先。\n7、【加分项】有海外社媒、公会 / 主播招募、用户激励体系搭建经验；熟悉 AI 工具辅助内容生产、用户运营。", "cat": "运营"}, {"id": "276", "title": "产品经理", "salary": "15k–25K", "location": "未明确", "jd": "岗位JD描述\n\n1.任职要求：\n岗位职责：\n1. 负责付费内容APP（漫画/视频/动漫/小说等）整体产品规划、功能设计及版本迭代，业务覆盖多元内容形态，主导产品路线图制定与执行；\n2. 深入分析用户需求、市场趋势与竞品动态，制定产品发展策略，明确核心功能定位与迭代优先级；\n3. 持续优化现有变现体系（会员订阅、付费内容、广告等），平衡用户体验与商业变现，推动项目收益最大化；\n4. 对DAU、留存率、付费转化率等核心业务指标全面负责，建立数据监控与归因体系，持续推动指标提升；\n5. 熟悉内容产品「生产—分发—消费」全链路闭环，主导内容标签体系与推荐策略的建设与持续优化；\n6. 结合AI能力为业务赋能提效，将AI工具合理融入内容推荐、数据分析及产品设计日常工作；\n7. 与设计、研发、运营、市场等团队紧密协作，高效推动跨部门项目按期高质量落地；\n8. 持续跟踪行业动态与新技术趋势，探索差异化产品创新方向，保持产品竞争力；\n\n2.任职要求：\n1. 5年以上产品经理经验，其中2年以上内容平台产品经理经验，具备完整App产品0到1核心角色经历，独立主导过单一产品线或核心模块的长期迭代；\n2. 具备会员订阅、付费内容等流量变现成功实操经验，熟悉广告、会员、虚拟付费等多元变现模式；\n3. 数据能力扎实，理解数据「产生—收集—使用」完整闭环，有埋点设计、数据指标体系搭建经验，熟练运用A/B测试驱动产品优化，能独立出具数据分析报告，对数据波动具备敏锐感知与正确归因能力；\n4. 对AI能力边界有清晰认知，熟练使用Claude Code / Cursor / Codex等AI生产力工具，并能将AI合理应用于产品设计与日常工作提效；\n5. 具备优秀的跨部门沟通协作能力，能独立承接业务与运营诉求，主导复杂项目高效推进落地；", "cat": "产品"}, {"id": "277", "title": "资深产品运营", "salary": "18-30k", "location": "未明确", "jd": "岗位职责：\n1.负责产品接手与冷启动\n承接效能已交付产品，完成交运营验收，制定冷启动方案\n2.负责日常运营与增长\n负责产品日常运营：内容/物料配置、活动、用户路径、转化节点、留存动作；\n日常监管已上线产品（语音社交、短剧、AI 工具、应用分发/商城等），与渠道、投放、客服等协作，把流量接进产品，并优化落地后的转化和留存\n3负责数据、诊断与迭代\n建立每款产品的核心指标：日活、新增、留存、转化、付费/充值、关键漏斗；\n能独立分析数据、定位问题（来了不用、用了不留、留了不转），并给出可执行动作；把运营结论回流给研发提供调优依据。\n4.负责运营后台配置\n完成活动、积分/权益、内容上下架、落地页/中间页、消息与引导；\n开展策划并落地活动、任务、签到、邀请、会员等常见运营手段，并评估效果；\n对内容质量和合规负责，异常内容能及时下架、隐藏和复盘\n5.负责运营工作流程标准化\n\n任职资格：\n1.本科及以上学历，5 年以上互联网运营经验，其中至少 3 年产品运营或用户运营；有独立负责一款 C 端产品从接手到出数的经验；\n2.做过社交、内容、短剧、工具或应用分发中至少一类，能讲清用户是怎么来、怎么留、怎么转的；\n3.能独立制定运营方案并落地，不依赖「等投放、等研发、等领导拍板」才能开工；\n4.具备数据能力：会看日活、留存、漏斗、活动效果，能用数据解释动作，而不是只报感觉；\n5.能读懂产品结构和后台配置，能和研发、测试把问题讲清楚（不要求写代码）；\n6.有多产品或高并发节奏经验，能同时盯几款已上线产品，抓得住重点；\n7.沟通强、Owner 意识强，能在研发团队里把运营结果扛起来；\n8.能接受内容类、社交类产品的快节奏和合规要求。\n\n满足一项或多项优先：\n有语音社交、直播、短剧、小说、工具 App 或应用商店的实际运营经验；\n有从 0 到 1，或从「已上线但没量」做到稳定出数的案例；\n有充值、会员、道具、积分商城等变现运营经验；\n熟悉 SEO、中转页、应用商店物料、渠道落地页；\n有内容审核、合规治理、多站点（多品牌/多端）运营经验；\n会 SQL / 看数仓报表，或能独立搭运营数据看板；\n有和产研团队周更、版本迭代共事的经验，而不是只对接投放；\n有海外或多语言产品运营经验", "cat": "运营"}, {"id": "278", "title": "AI视频剪辑师", "salary": "10k-15k", "location": "未明确", "jd": "岗位职责\n1. 根据剧本和分镜筛选镜头并完成粗剪、精剪和成片输出。\n2. 调整剧情节奏、人物情绪、镜头停留时间、转场和集尾卡点。\n3. 整合配音、背景音乐、环境音和关键音效，保证音画节奏统一。\n4. 完成字幕制作，检查错字、漏字、称谓、时间轴和字幕可读性。\n5. 处理画面比例、基础调色、转场、包装和平台规格适配。\n6. 识别缺失镜头、剧情断点、动作不连续及情绪不连贯问题，并提出补镜需求。\n7. 检查黑帧、跳帧、闪烁、人物变形、画面穿帮、音画不同步及音量异常。\n8. 根据审核和质检意见完成修改，并输出不同平台需要的尺寸、码率和格式。\n9. 管理剪辑工程、素材引用、成片版本和交付文件，保证可追溯。\n10. 结合完播率和用户流失节点复盘剪辑节奏，持续优化成片模板。\n\n任职要求\n1. 2年以上短剧、短视频、动画、影视或信息流视频剪辑经验。\n2. 熟练使用Premiere、DaVinci、Final Cut、剪映等至少一种剪辑工具。\n3. 对剧情节奏、人物情绪、声音表达和集尾悬念有较强判断。\n4. 具备字幕、配乐、音效、基础调色和画面包装能力。\n5. 能够识别AI视频常见的变形、跳变、闪烁和连续性问题。\n6. 工作细致，具备较强的质量意识和版本管理意识。\n7. 了解不同平台的视频规格及音乐、字体、声音等素材版权风险。\n8. 应聘时需提供完整短剧、动画或剧情类成片作品。", "cat": "AI / AIGC"}, {"id": "279", "title": "AI视频生成师", "salary": "18k-25k", "location": "未明确", "jd": "岗位职责\n1. 根据角色设定、场景设定和分镜要求生成角色图、场景图及镜头关键帧。\n2. 运用提示词、参考图、模型、LoRA和节点工作流控制人物、服装、场景及画风一致性。\n3. 完成人物换装、表情调整、局部重绘、扩图、换背景和细节修复。\n4. 根据分镜完成图生视频或文生视频，实现人物动作、表情变化、镜头运动和环境变化。\n5. 处理人物变形、五官漂移、肢体异常、多指、背景抖动、画面闪烁及道具错误。\n6. 根据生成结果调整首尾帧、提示词、模型和参数，提高镜头成功率及稳定性。\n7. 与分镜师确认镜头实现方案，根据剪辑及质检反馈完成补镜、延展和返修。\n8. 对图片和视频素材进行筛选、命名、归档及版本管理。\n9. 记录模型、提示词、参数、生成次数、成本和失败原因，持续优化标准工作流。\n10. 持续测试不同生图及视频模型，形成适合不同题材、动作和运镜的工具方案。\n\n任职要求\n1. 1年以上AI生图、AI视频、动画、视觉设计或影视后期经验。\n2. 熟练使用至少一种主流AI生图工具及一种AI视频生成工具。\n3. 熟悉ComfyUI或其他节点式工作流。\n4. 熟悉LoRA、ControlNet、IP-Adapter、局部重绘、首尾帧控制等方法。\n5. 具备基础美术、构图、色彩、光影、镜头和人物动作判断能力。\n6. 能够解决角色一致性、场景一致性、画风漂移和视频稳定性问题。\n7. 具备较强的测试、复盘和成本意识，能适应批量生产及多轮返修。\n8. 应聘时需提供AI图片、AI视频作品及对应工具和工作流说明。", "cat": "AI / AIGC"}, {"id": "280", "title": "AI视频编剧（兼选题、角色设定）", "salary": "12-20k", "location": "未明确", "jd": "岗位职责\n1. 跟踪短剧、网文、漫画及社交平台热点，建立题材库和选题储备库。\n2. 结合目标用户、平台特点和商业化方向，完成竞品拆解及选题判断。\n3. 输出选题方案，明确受众、核心卖点、题材类型、主要冲突和差异化亮点。\n4. 完成世界观、人物关系、角色小传及主要角色的性格、外形、身份、动机和成长线设定。\n5. 完成故事大纲、分集梗概和分集剧本，设计前三集钩子、情绪爆点、反转及集尾悬念。\n6. 负责人物对白、动作、表情和场景描述，保证人物行为逻辑及剧情前后统一。\n7. 结合AI生成能力控制人物数量、场景数量、复杂动作和特效难度，提升剧本落地效率。\n8. 根据剧本审核、分镜及成片反馈及时修改，并沉淀人物档案和剧情时间线。\n\n任职要求\n1. 2年以上短剧、网文、漫画、影视编剧或内容策划经验。\n2. 至少熟悉男频、女频、甜宠、逆袭、悬疑、都市等一种主流题材。\n3. 具备选题判断、故事结构、人物塑造、冲突设计和对白创作能力。\n4. 熟悉短剧前三集留人、强情绪推进、连续反转及集尾卡点逻辑。\n5. 能够独立完成角色设定、故事大纲及分集剧本。\n6. 了解AI生图、视频生成的能力边界，能够编写适合AI制作的剧本。\n7. 熟练使用ChatGPT、Claude等AI工具辅助调研、创作和一致性检查。\n8. 应聘时需提供选题方案、人物小传、剧本或已上线作品。", "cat": "AI / AIGC"}, {"id": "281", "title": "中高级产品运营", "salary": "10K-30K", "location": "未明确", "jd": "负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的视频产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营"}, {"id": "282", "title": "中高级产品运营", "salary": "10K-30K", "location": "未明确", "jd": "负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的视频产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营"}, {"id": "283", "title": "高级 UI/UX 设计师（交友 / 社交方向）", "salary": "22-35k", "location": "未明确", "jd": "【岗位职责】\n1. 主导 App 与网站的介面与体验设计，定义整体设计方向\n2. 从零建立并管理设计系统，确保可扩充性与跨端一致性\n3. 主导用户研究、资讯架构与流程设计，透过数据与可用性验证（含 A/B 测试）推动决策\n4. 独立产出高品质视觉与平面素材（H5 banner、封面、行销物料），把关团队整体设计品质\n5. 与 PM、工程师、运营等跨部门协作，推动设计落地\n\n【任职要求】\n1. 5 年以上 UI/UX 设计经验，能独立主导项目并定义设计方向\n2. 须提供作品集（Portfolio），需含主导的完整产品专桉，及设计系统建置桉例\n3. 设计相关科系毕业，或具同等实务经验\n4. 具备强系统感与设计判断力，能决策设计方向与优先顺序\n5. 精通 Figma，能建立可扩充、语意化的设计系统并落地，含 Library 管理与版本控管\n6. 完整 UX 功底：用户研究、资讯架构、流程设计、可用性验证与 A/B 测试\n7. 能撰写设计规范与设计决策文件，建立并优化团队设计流程\n8. 熟悉全栈 iOS / Android / RWD 介面设计与进阶互动原型\n9. 具备扎实平面设计能力，精通 Photoshop / Illustrator\n10. 能运用 AI 工具（AI 生成图、Figma AI、Claude 串接 MCP 等）提升设计与交付效率\n11. 具设计提桉与向上沟通能力，能向利害关係人说明并说服设计决策\n12. 具商业思维，能将商业目标转化为设计策略；能指导并提升团队设计水准\n13. 抗压性佳，能在快节奏迭代下维持设计品质\n\n【加分条件】\n\n・HTML/CSS\n\n・付费内容 / 社群平台设计经验\n\n・成人产业隐私与金流体验设计经验\n\n・暗色模式与多语系介面经验\n\n・国际化合规", "cat": "设计"}, {"id": "284", "title": "供给增长运营专员", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n资源挖掘与触达：通过社交 App（陌陌、Soul 等）、社群、内容平台、招募/兼职群等多平台多渠道，主动挖掘并触达陪玩、伴游、向导、网红、模特等供给资源。\n评估、洽谈与签约：对意向资源做初步评估与筛选，沟通讲解合作模式，完成洽谈与线上签约，持续扩充供给规模。\n资源维护与激活：维护已签约资源关系，用资源、分成、成长路径等卖点吸引并留住优质供给，保持其活跃与履约。\n线上获客渠道运营：拓展并运营短视频
