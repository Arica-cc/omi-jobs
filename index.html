投流（抖音/快手等）、CPA/CPS 联盟、站长换量、达人/代理、社群等线上渠道，获取有陪玩/伴游需求及喜欢线上擦边社交的精准用户。\n私域承接与复购：将公域流量沉淀进私域，做社群运营、客户分层、促活与促复购，提升用户价值与生命周期贡献。\n渠道开发与测试：持续开发新的线上资源与获客渠道，做渠道测试与效果评估，保留优质渠道、淘汰低质渠道。\n资源库与台账管理：建立资源库、渠道台账与标签体系，沉淀可复用的资源与渠道资产。\n数据复盘与反作弊：监控资源数量与质量、获客成本（CPA）、付费转化、复购等核心指标，做归因分析、识别假量水量、优化预算。\n风控与协作：把控线上渠道与账号安全（防封号、防渠道失效），与产品、运营、资源 BD 团队协同推进。\n\n任职要求\n线上资源获取实战（硬性要求）：做过通过线上渠道挖掘、招募、签约供给资源（主播/达人/网红/模特/陪玩/伴游等），或线上获客的工作，并拿过结果。\n自带线上资源/渠道者优先：手握可直接动用的线上供给资源或获客渠道，进来即能产出。\n熟悉渠道玩法：多平台线上挖掘签约、短视频投流、CPA/CPS 联盟、站长换量、社群/私域裂变等。\n数据驱动 + 反作弊：对数据敏感，会做漏斗、归因与 ROI 分析，能识别联盟假量水量、把控渠道质量。\n过往业绩：简历需体现可量化的成果（签约资源数量、新增规模、获客成本、付费转化、复购等具体数字与优化幅度），并能讲清自身贡献。\n软性素质：沟通谈判强、嗅觉敏锐、执行力强、抗压。\n强烈优先：有娱乐经纪、直播公会、主播/达人招募、MCN，或陪玩、伴游、同城社交、交友、擦边社交类产品的线上渠道、招募或获客经验者。\n对擦边/灰色业务无顾虑。\n\n注：学历、年限不作硬性限制，以线上资源获取与转化成绩为准。", "cat": "商务 / 市场"}, {"id": "285", "title": "运营经理 （高级运营（成人、交友、AI）", "salary": "22-35k", "location": "未明确", "jd": "负责社交/社区/成人向产品的运营与商业化，对核心经营指标负责。\n核心要求：数据导向 + 强实操——能自己取数、自己下场、用数据拿结果。\n\n岗位职责：\n\n主导产品整体运营策略与体系建设，对 DAU、留存、付费率、ARPU、营收/流水负责；每个指标有目标、有拆解、有周期复盘，涨跌能归因到具体动作。\n亲自操盘用户全生命周期（拉新→激活→留存→付费→召回），搭建分层、成长、激励、付费、召回机制，并落地执行、盯盘数据、快速迭代。\n设计并迭代会员、礼物、虚拟消费、私密内容付费解锁、订阅等变现玩法；针对大 R（高价值/重氪用户）做专属运营与维系，用数据定价格、定权益、定节奏。\n建设用户标签体系，跑 A/B 测试，做漏斗诊断与转化归因，基于数据制定并动态调整策略——结论用数据说话，不拍脑袋。\n亲手策划并落地运营活动，结合擦边/成人流量特点做私域承接与渠道运营（不依赖主流投放平台）；统筹成人向 IP、擦边网红 / 达人合作与跨团队资源，对重点项目与活动 ROI 负责。\n紧跟擦边/成人/AI C端/社交社区行业的玩法与趋势，把被验证有效的打法快速搬进来试、用数据验证后保留或淘汰。\n沉淀运营方法论与 SOP，指导初级运营，提升团队执行效率。\n\n任职要求：\n\n强实操：独立操盘过完整运营线或核心业务（用户线 / 付费线 / 某社交场景），从策略制定到落地执行真正拿过结果。\n数据导向（硬性）：能自己取数（SQL / BI 看板）、搭建指标与标签体系、设计 A/B 测试、做漏斗诊断与转化归因。\n突出业绩：做出过可量化的规模化成果（DAU、留存、付费率、营收/流水达行业可观量级），并能讲清自身关键作用。\n行业背景（以下之一即可）：擦边社交（如陌陌 / 探探 / Soul 类）、成人向、AI C 端产品、社交社区 / 语聊 / 直播；或伴游、楼凤、网聊、陪玩等成人/擦边服务赛道，有实际 C 端运营经验即可。\n熟悉社交/社区的用户增长与商业化：虚拟消费、会员、大 R、礼物打赏、私域。\n对擦边/成人向内容与业务无顾虑。\n工作效率高，推动力强，抗压能力好。\n\n注：学历、年限不作硬性限制，以操盘能力、实操与数据结果为准。\n\n加分项：\n有擦边社交、成人向、直播打赏、语聊、网聊、陪玩、伴游、楼凤、AI 陪伴等赛道的操盘经验。\n有 AI C 端 / AIGC 类产品的运营经验。\n有出海或海外华人市场运营经验。\n带过小团队或主导过跨团队项目。", "cat": "AI / AIGC"}, {"id": "286", "title": "运营经理（高级网站运营）", "salary": "18K-28K", "location": "未明确", "jd": "岗位职责\n1.负责网站整体运营工作，制定并落地网站运营策略，对新增用户、活跃用户、留存率、自然流量、转化率等核心业务指标负责。\n2.负责网站内容生态建设，包括栏目规划、内容规划、专题策划及运营策略制定，持续提升内容质量、用户体验及网站竞争力。\n3.负责网站核心页面（首页、频道页、详情页、专题页、搜索页、活动页等）的运营规划及持续优化，提升页面点击率、访问深度、停留时长及转化效果。\n4.建立网站数据分析体系，持续监控流量、用户行为、内容表现、SEO表现及业务指标，定期输出数据分析报告及优化建议。\n5.基于数据分析持续优化用户增长、用户留存、内容消费及转化路径，推动网站核心指标持续增长。\n6.制定网站内容运营策略，建立内容生产、审核、发布、更新及生命周期管理机制，持续提升内容价值及运营效率。\n7.配合 SEO 团队制定搜索流量增长策略，负责关键词规划、专题布局、内容优化、内链建设、页面结构优化及搜索体验提升，推动自然流量增长。\n8.与产品、研发、设计团队协同推进网站功能优化、后台工具建设、运营自动化及用户体验优化，提高整体运营效率。\n9.建立网站运营规范及 SOP，包括内容发布规范、页面检查机制、数据监控机制、质量管理机制及运营复盘体系。\n10.持续开展竞品分析及行业研究，跟踪行业动态、搜索趋势及用户需求变化，输出运营策略及产品优化建议。\n11.策划并推动专题活动、频道运营、榜单推荐、热点运营、内容合集等增长项目，提升网站流量、用户活跃度及内容传播效果。\n12.建立网站运营预警机制，及时发现流量异常、内容异常、SEO异常及用户行为变化，并推动相关团队快速完成问题闭环。\n13.统筹跨部门项目，协调产品、技术、SEO、设计、内容等团队资源，保障重点运营项目按计划交付并达成业务目标。\n14.定期输出网站运营日报、周报、月报及专项分析报告，为业务决策提供数据支持，并持续沉淀运营方法论。\n15.持续探索 AI 工具、自动化运营及数据化管理能力，不断提升网站运营效率和团队交付能力。\n\n岗位要求\n\n1.3 年以上网站运营、平台运营、内容运营、增长运营等相关经验，具备独立负责网站运营项目经验。\n2.熟悉网站整体运营体系，能够独立制定运营策略、拆解业务目标并推动项目落地。\n3.熟悉 CMS、网站后台及页面配置，具备栏目规划、专题运营、内容管理及页面优化经验。\n4.具备优秀的数据分析能力，熟悉新增、DAU、PV、UV、CTR、CVR、留存率、跳出率、用户路径等核心运营指标，并能够通过数据驱动业务优化。\n5.熟悉 Google SEO 运营体系，理解关键词规划、页面结构、内容优化、内链建设、Schema、收录机制及自然流量增长逻辑。\n6.具备网站增长思维，熟悉用户增长、内容增长及搜索增长策略，能够独立制定增长方案并推动落地。\n7.具备较强的项目管理能力，能够统筹多个运营项目，合理协调资源并确保项目按计划完成。\n8.具备优秀的问题分析及解决能力，能够快速定位业务问题并提出可执行的优化方案。\n9.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Looker Studio 等数据分析工具，能够独立完成数据分析及业务复盘。\n10.熟练使用 Excel、Google Sheets、飞书表格等办公工具，能够建立数据模型及运营报表。\n11.具备优秀的沟通协调能力，能够高效协同产品、研发、SEO、设计及内容团队推进项目落地。\n12.具备较强的学习能力和业务敏感度，持续关注行业趋势、搜索算法及用户需求变化。\n13.具备2年以上团队管理经验，有网站运营团队、内容运营团队或项目团队管理经验，能够进行目标拆解、任务分配、绩效管理及团队培养，推动团队高效达成业务目标。\n\n加分项\n\n1.有大型内容平台、社区平台、资讯平台、聚合平台或流量站运营经验。\n2.有海外中文网站、Google SEO 流量站或海外互联网产品运营经验。\n3.有多站点、矩阵站点或国际化网站运营经验。\n4.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Ahrefs、SEMrush、Screaming Frog、Looker Studio 等工具。\n5.有网站增长、SEO增长、内容增长或用户增长成功案例，能够量化展示业务成果。\n6.熟悉 AI 工具在网站运营中的应用，具备内容生成、数据分析或运营自动化实践经验。\n7.熟悉 SQL、Python、Shell 等工具，可进行数据分析、运营自动化及批量处理。\n8.有 Telegram、Twitter（X）、Facebook、Reddit、Discord 等海外渠道运营经验。\n9.有产品运营、商业化运营、团队管理或跨部门项目管理经验。\n\n我们希望你具备\n\n1.具备网站整体运营思维，能够从业务目标出发制定运营策略。\n2.结果导向，对流量增长、用户增长、留存及转化等核心指标负责。\n3.数据敏感，能够通过数据分析发现问题并持续优化业务表现。\n4.具备较强的项目管理能力，能够统筹资源推动重点项目落地。\n5.关注用户体验，持续优化内容质量、页面结构及用户访问路径。\n6.主动发现问题，能够独立提出解决方案并推动闭环执行。\n7.具备优秀的跨团队沟通能力，与产品、研发、SEO、设计及内容团队高效协作。\n8.保持学习和创新意识，持续关注行业趋势、AI 工具及运营新模式。\n9.善于复盘总结，沉淀运营方法论，持续提升团队运营效率。", "cat": "运营"}, {"id": "287", "title": "运营经理（流量（WEB）部副主管）", "salary": "20-35k", "location": "未明确", "jd": "岗位职责\n1、负责网站整体运营管理，制定并落实网站运营策略，推动业务目标达成。\n2、负责网站内容运营、协助SEO优化、首页及频道页运营、专题策划等工作，持续提升网站流量及用户活跃度。\n3、负责网站核心数据监控与分析，包括新增用户、DAU、PV、UV、留存率、跳出率、收录量、关键词排名等，并制定优化方案。\n4、负责网站内容规划与运营规范建设，持续优化栏目结构、页面布局及用户体验。\n5、制定并执行Google SEO及站内SEO优化策略，推动网站收录、关键词排名及自然流量持续增长。\n6、协同产品、研发、设计等部门推进网站功能优化、需求迭代及项目落地，确保按计划交付。\n7、建立网站运营SOP、数据分析体系及工作流程，提高团队执行效率和运营质量。\n8、负责运营团队日常管理，包括工作安排、任务跟进、绩效考核、培训指导及人才培养。\n9、定期开展行业研究及竞品分析，结合业务目标提出运营优化方案。\n\n\n岗位要求\n\n熟悉网站运营全流程，具备独立负责网站运营项目经验。\n熟悉Google SEO、站内SEO及基础技术SEO知识。\n具备较强的数据分析能力，能够根据数据制定优化策略。\n熟悉内容运营、流量运营、用户运营及增长运营。\n能独立制定运营计划、项目推进方案及阶段性复盘。\n具备优秀的跨部门沟通协调及项目管理能力。\n\n加分项\n1、有Google、yandex SEO成功增长案例。\n2、有百万级以上流量网站运营经验优先。\n3、有资讯、视频、小说、漫画、社区等内容平台运营经验。\n4、有网站从0到1搭建或改版经验。\n5、有运营团队（5人以上）管理经验。\n6、有数据分析、A/B测试及增长运营经验。\n7、熟悉AI内容生产、自动化运营工具及工作流。\n\n我们希望你具备\n\n1、强烈的目标意识和结果导向，对业务增长负责。\n2、良好的逻辑思维能力，能够通过数据发现问题并提出解决方案。\n3、优秀的执行力和推动力，能够高效推进项目落地。\n4、较强的责任心，能够主动承担工作并持续优化流程。\n5、良好的团队管理能力，能够培养团队成员成长。\n6、优秀的沟通协调能力，能够高效协同产品、研发、设计等部门。\n7、持续学习能力，关注行业动态、新工具及运营方法论。\n\n试用期交付要求\n\n试用期内需完成：\n\n1、熟悉公司产品、网站业务及运营流程，了解各网站定位、运营模式及核心业务指标。\n2、对负责网站进行全面诊断，输出《网站运营分析报告》，至少提出20项可落地的优化建议（包含内容运营、SEO、页面体验、产品功能、数据分析等方向）。\n3、梳理当前网站运营流程，识别存在的问题，并提出优化方案及优先级。\n4、完成网站核心数据分析，建立基础运营数据看板，并形成日报、周报模板。\n5、制定未来1个月网站运营计划，包括内容运营、内容SEO优化、专题运营、用户增长等重点工作安排。\n6、推动至少1项运营优化需求或项目落地，并完成效果验证及复盘。\n7、与产品、研发、设计等相关团队建立协作机制，能够独立推进需求评审及项目跟进。", "cat": "运营"}, {"id": "288", "title": "中级运营（SEO流量运营）", "salary": "15k-22k", "location": "远程办公", "jd": "网站流量运营（SEO 方向）\n▍ 岗位概述\n负责星河无界旗下网站的 SEO 与自然流量增长。通过搜索需求研究、网站结构优化、中文，英文及多语言内容建设和技术 SEO 协作，提升网站的搜索曝光与优质流量，并推动访问用户转化为注册、下载、咨询或付费用户。\n▍ 岗位职责\n1. SEO 策略与增长规划\n结合所负责网站的业务定位、目标市场和发展阶段，制定 SEO 增长计划，明确关键词、内容、站内优化和技术改进的优先级，持续提升自然搜索带来的有效流量与业务转化。\n2. 关键词研究与竞品分析\n研究目标用户的搜索需求、使用场景及搜索意图，分析竞品的关键词布局、内容结构和流量入口，建立按国家、语言、主题及转化阶段划分的关键词库，挖掘可切入的长尾需求。\n3. 网站结构与站内优化\n优化网站栏目、页面层级、URL、标题、描述、标题标签及内部链接，推动关键词与页面合理匹配，改善内容之间的关联和访问路径，提升重要页面的可发现性与使用体验。\n4. 英文及本地化内容运营\n制定内容选题、页面规划、写作提纲及更新计划，围绕用户需求建设产品介绍、使用指南、主题专题、常见问题和本地信息等内容；结合目标国家的表达习惯开展本地化，持续优化已有页面。\n5. 技术 SEO 排查与落地\n定期检查网站抓取、收录及索引状态，识别重复页面、失效链接、重定向、站点地图、robots、canonical 和 hreflang 等问题；关注移动端体验与页面加载性能，向研发提出清晰的优化需求并跟进验证。\n6. 优质外链与品牌曝光\n拓展相关行业网站、本地媒体、垂直社区及合作伙伴的内容合作机会，开展资源收录、专题合作和优质外链建设，增加品牌在相关搜索场景中的曝光，并持续评估来源质量和引流效果。\n7. 数据监测与流量转化优化\n使用 Google Search Console、GA4 等工具，跟踪搜索曝光、点击率、关键词表现、自然访问及注册等转化数据，定位高潜力页面和流失环节，与产品及内容团队协作优化落地页、行动入口和转化路径。\n8. 持续迭代与工作流程建设\n建立关键词跟踪、内容更新、技术巡检和效果复盘机制，关注搜索规则与搜索结果形式的变化，及时调整优化策略；合理使用 AI 工具辅助调研、内容提纲和信息整理，并对内容准确性、原创价值及本地化质量负责。\n▍ 任职要求\n• 有 SEO 或网站自然流量运营经验，能够独立推进关键词研究、站内优化、内容建设和效果复盘，并说明本人在项目中的具体贡献。\n• 熟悉 Google 搜索的基本工作逻辑，理解搜索意图、抓取、收录、索引及排名优化之间的关系。\n• 熟练使用 Google Search Console、GA4，掌握 Ahrefs、Semrush 或同类工具中的至少一种，能够开展关键词、竞品和流量分析。\n• 具备良好的英文读写能力，能够独立进行英文关键词研究、内容提纲撰写和基础内容审核，理解面向英国、欧洲用户的本地化表达。\n• 了解 HTML、网站结构及常见 CMS 的基本原理，能够识别常见 SEO 问题，并与研发团队沟通技术优化需求。\n• 具备数据分析和业务转化意识，能够将搜索表现与注册、下载、咨询或付费等业务结果结合，判断工作的实际价值。\n• 自驱力和执行力强，能够在初创阶段自主安排优先级，持续推进内容与网站优化，并使用 AI 工具提高效率。\n▍ 加分项\n• 有英国、欧洲市场或英文、多语言网站的 SEO 项目经验。\n• 有社交、本地生活、论坛社区、短剧或其他内容型网站的自然流量增长经验。\n• 熟悉结构化数据、页面性能分析、多语言 SEO，或大量内容页面的模板与索引管理。\n• 有海外内容合作资源，或具备基础脚本、自动化报表及 SEO 工作流程搭建能力。", "cat": "运营"}, {"id": "289", "title": "运营专员（视频剪辑专员）", "salary": "6k-10k", "location": "未明确", "jd": "视频剪辑专员\n岗位职责\n\n1、根据平台内容定位、更新策略及用户需求，自主收集、筛选并整理相应的成人类视频资源。\n2、负责视频素材的剪辑、裁切、转码、画面调整、水印添加及基础包装，确保成片符合平台发布标准。\n3、使用 Photoshop 独立完成视频封面制作，包括素材处理、人物排版、标题设计及整体视觉优化。\n4、根据视频内容编写标题、简介等相关文案，准确匹配分类及标签。\n5、熟悉成人视频内容体系，能够准确判断不同题材、演员、剧情、场景及内容特征，避免分类和标签错误。\n6、结合平台数据、用户偏好及行业热点，持续优化选片、剪辑、封面和内容发布方向。\n7、按照平台要求完成视频质量检查，重点检查清晰度、音画同步、画面比例、水印、黑帧及内容完整性。\n8、负责素材归档、文件命名及资源管理，建立清晰、可追溯的视频素材库。\n9、配合内容运营团队完成视频批量处理、上传发布、内容调整及其他相关工作。\n10、遵守平台内容规范、版权要求及审核机制，及时处理不符合标准的素材。\n\n岗位要求\n1、具备视频剪辑相关经验，有成人内容平台、影视平台或短视频平台工作经验者优先。\n2、熟练使用 Premiere Pro、剪映等剪辑软件，能够独立完成完整的视频处理流程。\n3、熟悉 Photoshop，能够独立制作视频封面，并具备一定的排版、配色和视觉审美能力。\n4、能够接受成人内容工作环境，对成人类视频具备一定的理解和判断能力。\n5、熟悉常见成人视频题材、分类及标签，能够准确完成内容归类和标签匹配。\n6、具备较强的资源收集、筛选及整理能力，能够根据平台更新策略主动寻找合适内容。\n7、了解常见视频格式、分辨率、码率及画面比例，具备基础的视频质量判断能力。\n8、工作认真细致，具备较强的执行力、责任心及时间管理能力，能够按要求完成每日任务。\n9、具备良好的团队协作意识，能够及时沟通素材、剪辑及内容发布过程中出现的问题。\n\n加分项\n1、有成人视频、影视、短视频或内容平台剪辑经验。\n2、熟悉主流成人内容网站、资源渠道及行业热门内容趋势。\n3、了解 FFmpeg 或其他批量视频处理工具。\n4、具备批量剪辑、批量转码、批量加水印或自动化处理经验。\n5、有独立搭建素材库、分类体系或视频处理 SOP 的经验。\n6、具备较强的热点判断能力，能够根据用户偏好快速调整选片方向。\n7、有 AI 工作流使用经验，能够运用 ChatGPT、Claude、Gemini 等工具辅助资源整理、标题文案、分类标签、封面设计及批量视频处理；有相关自动化流程搭建经验者优先。\n8、有 Telegram（TG）频道运营经验，熟悉频道内容发布、资源整理、用户维护及基础数据统计者优先。\n\n我们希望你具备\n1、能够根据平台更新策略主动收集和筛选资源，而不仅是等待分配素材。\n2、能够独立完成从资源筛选、视频剪辑、封面制作到分类标签填写的完整流程。\n3、对成人内容分类和用户偏好有一定敏感度，能够准确判断视频的核心特点。\n4、具备基础审美和质量意识，能够持续优化画面、封面及内容呈现效果。\n5、能够在保证质量的前提下提高工作效率，按时完成批量内容生产任务。\n6、保持学习意识，持续关注行业趋势、剪辑方法、AI 工具及平台内容变化。", "cat": "内容"}, {"id": "290", "title": "产品经理（中高级/高级 · 数据增长方向）", "salary": "20k-35k", "location": "未明确", "jd": "岗位：产品经理（中高级/高级 · 流量方向）｜HC 1\n\n岗位职责\n1、负责内容流量类 Web 产品矩阵（漫画、视频、资讯等多站点）核心模块的规划与迭代，对自然流量增长、搜索收录与排名、用户留存及广告变现等核心指标负责。\n2、主导 SEO 类需求的产品化落地：站内结构与页面模板优化、聚合页与内链体系、收录与状态码治理等，与 SEO 团队协作制定并推进增长方案。\n3、参与广告变现体系设计与迭代：广告版位规划与配置、变现效率优化，兼顾用户体验与收益平衡。\n4、基于数据分析、用户行为与竞品洞察，挖掘流量增长与商业化机会，推动产品创新。\n5、搭建产品关键指标体系，通过漏斗分析、A/B 测试及分层运营持续优化转化与留存。\n6、独立负责需求全流程：需求梳理、原型设计、评审排期、测试验收、上线复盘，多产品线并行推进。\n7、跨团队（研发、设计、SEO、运营、商业化）协同推动项目高质量落地，对产品经营结果负责，定期复盘并制定增长策略。\n\n任职要求\n1、本科及以上学历，3 年以上互联网 C 端产品经验；5 年以上且有独立带线经验者按高级评估。\n2、具备完整产品生命周期管理经验，独立负责或主导过日活 10 万以上量级的 Web/内容类 C 端产品，并取得可量化的流量增长、留存或商业化成果；主导过日活 30 万以上产品且有完整增长案例者优先。\n3、产品背景不限于内容站，资讯、漫画、视频、工具导航、社区等以自然流量为主的 to C 产品经验均可。\n4、熟悉 SEO 与自然流量增长机制（收录、排名、站内结构、内容聚合、多站点矩阵），有可验证的实操成功案例者优先。\n5、理解广告变现模式（展示广告、联盟、直客版位）及会员订阅、增值服务等付费场景设计。\n6、数据驱动，熟练运用数据分析、A/B 测试与漏斗模型发现问题、验证假设并指导决策；逻辑清晰，结构化思维能力强。\n7、具备出色的 0-1 落地与实操能力，原型与需求文档功底扎实，入职一周内可独立接手需求，即到即战。\n8、能适应多产品线并行的工作节奏，兼具单线深耕与多项目统筹、优先级管理能力；工作时间可配合覆盖平日晚间及周六时段。\n9、工作效率高，具备较强的创业精神与业务推动力，能在快速变化、资源有限的环境下持续创造价值。\n10、熟悉简中互联网内容生态与用户心智；对站群运营、程序化 SEO、AI 辅助内容生产等方向有理解者优先。", "cat": "产品"}, {"id": "291", "title": "AI内容编辑（AI短剧编剧）", "salary": "12K–15K", "location": "未明确", "jd": "AI短剧编剧（AI Screenwriter）\n\n岗位职责\n负责 AI 漫剧项目的世界观设定、人物设定、剧情开发及系列化内容策划；\n独立完成故事梗概（Logline）、故事简介（Synopsis）、分集大纲（Episode Outline）、场次设计（Scene Breakdown）及完整剧本创作；\n建立人物弧光（Character Arc）、剧情弧线（Story Arc）及人物关系网，保证长线剧情逻辑统一；\n完成剧情节拍（Beat）、戏剧冲突、情绪节点、反转、悬念、集尾钩子及付费点设计；\n控制信息释放节奏、剧情密度及人物动机，提高用户留存率及完播率；\n与导演共同开展故事板开发（Storyboard Workshop），参与剧本可视化设计及场次拆分；\n根据项目数据持续优化剧情结构、对白节奏及角色塑造。\n\n任职要求\n具备完整的商业剧本开发能力，能够独立完成故事梗概、剧情架构、分集大纲、场次拆分及系列剧本创作，并建立完整的人物弧光、剧情弧线及人物关系体系。\n熟悉三幕式、五幕式等经典叙事结构，能够合理设计剧情节拍、戏剧冲突、人物动机、剧情反转及集尾悬念，在保证故事逻辑的同时兼顾商业化节奏。\n具备较强的角色塑造能力，能够通过对白、行为及剧情推进体现人物成长，并根据导演及制作需求持续优化剧本内容。\n熟悉短剧、动画、漫画或影视剧创作流程，对系列化 IP 开发及长线剧情设计有一定理解，有实际作品者优先。\n\n加分项\n有动画、漫画、短剧、影视剧本创作经验；\n熟悉 AI 辅助编剧工作流；\n有商业化内容创作经验或爆款作品。", "cat": "AI / AIGC"}, {"id": "292", "title": "AI内容编辑（AI短剧导演）", "salary": "15K–18K", "location": "未明确", "jd": "AI短剧导演\n\n岗位职责\n根据剧本完成故事板设计及镜头语言设计；\n与编剧共同进行故事板开发，完成剧本可视化；\n输出故事板、镜头表、机位设计、景别设计及镜头调度方案；\n制定人物调度、演员调度、场面调度及镜头运动方案；\n控制画面节奏、叙事节奏、情绪节奏及视觉重心；\n指导 AI 视频制作完成镜头落地，并进行镜头审核；\n完成精剪，优化节奏、转场、蒙太奇关系及镜头衔接；\n对整集内容的视觉表达及最终成片质量负责。\n\n任职要求\n能够独立完成剧本可视化，根据剧本输出专业故事板、镜头表及导演阐述，并具备完整的镜头设计能力。\n熟悉镜头语言、场面调度、人物调度、景别设计及镜头运动设计，能够合理运用构图法则、轴线原则、连续性剪辑及蒙太奇等影视语言完成视觉叙事。\n具备较强的画面节奏控制能力，能够根据剧情调整镜头节奏、情绪节奏及视觉重心，并完成成片精剪及最终质量把控。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro，具有动画、短剧、影视或 AI 内容导演经验者优先。", "cat": "AI / AIGC"}, {"id": "293", "title": "AI内容编辑（AI视频制作）", "salary": "15K–18K", "location": "未明确", "jd": "AI视频制作（AI Production Artist）\n\n岗位职责\n\n根据导演输出的故事板及镜头表完成 AI 内容生产；\n建立角色一致性（Character Consistency）、场景一致性（Environment Consistency）及数字资产库（Asset Library）；\n完成角色生成、场景生成、图生视频、镜头动画及素材制作；\n搭建并优化 AI 制作工作流，包括提示词工程、参考图控制、节点式工作流及模型调用；\n完成视频粗剪（Rough Cut）、字幕、配音、音效及初版包装；\n配合导演完成修改意见，输出最终交付版本。\n\n任职要求\n熟悉 AI 内容生产流程，能够根据故事板独立完成角色生成、场景生成、图生视频及整集内容制作，并保证角色一致性、场景一致性及整体视觉风格统一。\n熟悉提示词工程、参考图控制、节点式工作流及 AI 工作流搭建，能够根据项目需求优化生成效率及画面质量。\n能够独立完成素材整理、粗剪、字幕、音效、基础包装等后期制作，并具备一定的问题排查及工作流优化能力。\n熟悉 ComfyUI、Flux、Midjourney、Runway、Veo、Kling、Seedance 等 AI 工具中的一种或多种，有完整 AI 短剧、AI 动画或 AI 漫剧制作经验者优先。\n\n熟悉以下 AI 工具（至少部分）\nComfyUI，Flux，Midjourney，Stable Diffusion，Veo，Kling，Seedance，Runway，Pika，Luma\n\n熟练使用Premiere Pro，DaVinci Resolve或其他非线软件", "cat": "AI / AIGC"}, {"id": "294", "title": "AI内容编辑（AI短剧后期剪辑师）", "salary": "12K–18K", "location": "未明确", "jd": "AI短剧后期剪辑师\n\n岗位职责\n负责 AI 漫剧项目的后期制作，根据导演完成的精剪版本进行成片精修，在不改变导演叙事意图的前提下，进一步优化剪辑点、动作衔接、视听连续性及整体完成度；\n负责对白、配音、环境声、拟音、音效及音乐的声音编辑与混音处理，根据剧情节拍建立完整的声音层次、情绪推进及视听节奏；\n负责 AI 生成素材的后期修整，处理生成镜头中常见的跳帧、闪烁、动作断裂、时序不连续、画面抖动及镜头衔接问题，并通过变速、补帧、遮罩、跟踪、合成等方式提高镜头可用性；\n根据项目视觉规范完成基础调色、镜头匹配、曝光及色彩统一，保证不同模型、不同批次生成素材之间的视觉连续性；\n负责字幕、片头片尾、基础动效、转场及项目包装，并按照平台技术规范完成母版输出、版本管理及最终交付；\n与导演共同完成终剪审核，根据修改意见完成后期调整，对成片的技术质量、声音质量及最终包装完成度负责。\n\n任职要求\n具备完整的影视后期制作能力，能够理解导演的剪辑意图和叙事节奏，熟悉连续性剪辑、动作匹配、视线匹配、节奏剪辑、平行蒙太奇、交叉剪辑等剪辑逻辑，能够判断一个剪辑点成立的叙事原因，而不是单纯按照音乐节拍拼接素材。\n具备较强的声音设计意识，能够完成对白编辑、降噪、响度控制、环境声铺设、拟音、音效设计及音乐编辑，并能够利用声音桥、声画对位、声画同步等方式强化场景空间感、情绪及戏剧节奏。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro 中至少一种专业非线性剪辑软件；能够完成基础调色、遮罩、跟踪、变速、关键帧及简单合成。熟悉 After Effects、Fusion、Audition 等后期工具者优先。\n需要理解 AI 生成视频的素材特性，能够识别并处理人物动作连续性、口型同步、画面闪烁、时序一致性、角色漂移、背景形变等常见问题。有 AI 漫剧、动画、短剧、影视后期或商业内容制作经验者优先。\n不接受仅会使用剪映套模板、自动字幕、卡点及预设转场，但缺乏影视剪辑逻辑和声音设计能力的候选人。\n作品要求\n面试需提供至少一部能够体现完整后期能力的作品，并说明本人具体负责的工作范围。\n作品审核重点关注：叙事节奏、剪辑点选择、动作连续性、声音设计、音乐使用、镜头匹配及整体完成度，不以单纯的特效数量或包装复杂程度作为评价标准。", "cat": "AI / AIGC"}, {"id": "295", "title": "AI内容编辑（网络小说作家）", "salary": "8K–14K", "location": "未明确", "jd": "网络小说作家\n\n岗位职责\n负责 AI 短剧项目的前期 IP 内容开发，根据项目方向完成题材调研、内容策划及小说改编工作；\n深度研究网络文学市场，持续分析热门题材、爆款作品及用户阅读偏好，总结不同题材的核心爽点、人物关系、剧情节奏及商业化规律；\n根据项目需求，对指定题材或已有内容进行二次创作、剧情扩写、结构重组及人物深化，形成适合影视开发的小说版本；\n建立完整的世界观设定、人物关系网、人物成长线及剧情主线，保证长线剧情逻辑统一；\n完成剧情节拍设计、情绪推进、反转、悬念、高潮、集尾钩子等商业化内容设计，提高内容吸引力及持续阅读体验；\n输出完整的小说开发稿，包括人物设定、世界观设定、故事简介、章节内容及完整小说版本，并交付编剧进行剧本开发；\n持续建立公司 IP 储备库，沉淀原创故事、人物设定及可持续开发的内容资产。\n\n任职要求\n深度阅读网络文学，熟悉男频、女频、都市、悬疑、玄幻、仙侠、系统、重生、无限流、恋爱、校园等主流题材，能够准确分析作品爆点及商业价值。\n具备成熟的长篇小说创作能力，能够围绕人物成长、剧情推进及情绪节奏完成剧情扩写、人物深化及系列化内容开发，保证故事具有持续吸引力。\n熟悉网络文学创作规律，能够设计爽点、打脸、升级、反转、修罗场、悬念、人物成长及章节留钩，并理解不同平台读者的阅读偏好。\n具有优秀的文字驾驭能力，能够独立完成中长篇小说创作，有签约网络小说作者、责编、内容编辑或成熟创作经验者优先。\n能够熟练使用 AI 辅助创作工具进行资料整理、世界观整理及内容辅助创作，但具备独立完成原创及改编内容开发的能力。\n\n优先考虑\n有签约网络小说作者经历；\n有百万字以上完结作品；\n有短剧、漫画、动漫、游戏剧情创作经验；\n有 IP 改编或影视化开发经验。", "cat": "AI / AIGC"}, {"id": "296", "title": "AI内容编辑（AI影视资产生成）", "salary": "12K–18K", "location": "未明确", "jd": "AI影视资产生成\n\n岗位职责\n负责公司 AI 影视数字资产体系建设，根据项目需求持续开发可重复使用的角色资产、场景资产、道具资产、服装资产、载具资产及环境资产；\n建立统一的数字资产规范，包括角色设定、风格规范、命名规则、版本管理、资产分类及数字资产库维护，保证不同项目之间的资产可复用性及一致性；\n根据导演及制作团队需求完成影视场景搭建、角色开发、服装设计、道具开发及风格设定，为内容制作提供标准化资产支持；\n搭建 AI 资产生产工作流，建立角色一致性、场景一致性、风格一致性及参考图控制方案，提高内容生产效率；\n建立 AI 工作流模板、模型预设、提示词模板及节点式工作流，持续优化数字资产生产效率；\n配合 AI 视频制作团队完成资产调试、问题修复及资产迭代，保证资产在不同模型及不同项目中的稳定调用；\n持续沉淀公司数字资产库，建立可持续迭代的影视资产体系，为后续项目及资产商业化提供基础支持。\n\n任职要求\n\n熟悉影视美术设计流程，具备较强的角色设计、场景设计、服装设计及道具设计能力，能够建立统一的视觉风格及数字资产规范。\n熟悉 AI 数字资产开发流程，能够完成角色一致性、场景一致性、风格统一、参考图控制及数字资产标准化管理，并理解资产复用及模块化开发理念。\n熟悉提示词工程、节点式工作流、模型管理及参考图工作流，能够独立搭建高复用性的 AI 资产生产流程，并持续优化生成效率及资产质量。\n熟悉数字资产管理、版本管理及命名规范，能够建立完整的资产分类体系及数字资产库，具备良好的工程化思维及团队协作能力。\n熟悉 ComfyUI、Stable Diffusion、FLUX、Midjourney 等 AI 图像工具，理解 LoRA、ControlNet、IP Adapter 等一致性控制技术，有 AI 影视、AI 动画、游戏美术或数字资产开发经验者优先。\n\n优先考虑\n有 Technical Artist（TA）、Environment Artist、Character Artist、Concept Artist、Asset Artist 等相关工作经验；\n有游戏、影视、动画、数字孪生或虚拟制作项目经验；\n熟悉 Blender、Maya、Cinema 4D、Unreal Engine、Houdini 等数字内容创作工具；\n有大型数字资产库建设或团队资产管理经验；\n有 AI 工作流开发、模型训练或 LoRA 制作经验。", "cat": "AI / AIGC"}, {"id": "297", "title": "运营专员（数据分析师）", "salary": "15K-20k", "location": "未明确", "jd": "岗位职责:\n1、负责公司旗下各App、网站产品的运营数据支持，包括日/周/月报的撰写与输出。\n2、及时发现并排查数据异常波动，并输出异常分析与处理建议。\n3、响应业务方提出的临时数据需求，帮助解决指标口径、数据提取、数据解读等问题。\n4、针对业务痛点开展专题分析，输出有洞察力的分析报告，辅助决策落地。\n5、参与数据治理相关工作，包括埋点需求评审与验收、数据质量监控及后台数据产品需求的提出与跟进。\n6、与产品、运营、开发等团队保持紧密沟通，识别业务中的增长机会、留存风险与异动原因，为业务迭代提供数据建议。\n\n任职要求：\n基本要求\n1、本科及以上学历，统计学、数学、计算机、信息管理或相关专业优先。\n2、三年以上数据分析相关工作经验，有移动端App或互联网运营分析经验者优先。\n3、熟练使用SQL，能够独立完成数据提取与多表关联查询；熟悉Python、R中的至少一种分析工具。\n4、熟悉常用数据分析方法，掌握留存分析、漏斗分析、同期群分析、转化归因等常用分析框架。\n5、具备良好的数据可视化能力，熟练使用Excel、BI工具（如Tableau、Power BI、DataEase等）或Python可视化库。\n6、具备较强的逻辑思维和业务理解能力，能够从数据中发现真实业务问题并给出可落地建议。\n7、具备良好的口头与书面表达能力，能清晰地向业务负责人和跨团队伙伴解释数据结论与分析逻辑。\n\n加分项\n有内容类、社交类、网站类的数据分析经验。\n有指标体系搭建或数据看板建设经验。\n能适应快节奏业务，有较强的自驱力和多任务并行处理能力。", "cat": "技术 / 数据"}, {"id": "298", "title": "运营专员（内容运营专员（AI动漫 / AI漫剧方向）", "salary": "12k-18k", "location": "未明确", "jd": "招聘岗位：内容运营专员（AI动漫 / AI漫剧方向）\n\n岗位类型： 全职\n\n一、岗位职责\n\n1. 网站内容运营与日常维护\n\n负责 AI动漫、AI漫剧、漫画等相关内容的搜集、整理、分类、编辑和发布。\n根据网站定位规划内容分类、题材标签及内容展示。\n跟进内容更新，检查页面展示、链接及内容信息，保证网站内容正常维护。\n根据用户需求和内容热度，持续优化内容结构和浏览体验。\n\n2. 社交媒体运营与内容发布\n\n负责 Telegram（TG）、Twitter（X）等社交平台的日常运营。\n定期发布作品推荐、内容介绍、宣传文案及活动信息。\n根据不同平台的特点调整内容形式，提高曝光、互动和用户访问。\n跟进评论、反馈及社群情况，整理用户需求。\n\n3. 内容策划与宣传素材制作\n\n围绕 AI动漫、AI漫剧及热门题材策划宣传内容。\n制作作品推荐、专题介绍、热点话题及推广素材。\n配合项目推广需求，完成基础图片处理、视频剪辑、封面制作等工作。\n根据推广效果持续调整内容形式和宣传方向。\n\n4. 文案撰写与内容优化\n\n独立撰写网站简介、作品介绍、推广文案、社交媒体帖子及软植入内容。\n优化标题、简介、关键词及内容表达，提高点击率和阅读体验。\n根据不同推广渠道调整文案风格，确保内容清晰、有吸引力。\n\n5. 数据跟踪与运营复盘\n\n定期整理网站访问、内容浏览、社交媒体互动及渠道引流等数据。\n分析不同内容和推广渠道的表现，找出有效的运营方式。\n根据数据反馈优化内容选题、发布频率及推广策略。\n\n6 竞品调研与选题规划\n\n关注 AI动漫、AI漫剧、漫画及相关内容平台的动态。\n收集竞品的内容分类、热门题材、页面布局和推广方式。\n整理可参考的运营思路，并结合项目实际情况提出优化建议。\n二、任职要求\n有 1 年以上内容运营、新媒体运营或网站运营经验，能够独立运营网站或社交媒体账号者优先。\n对成人向漫画、动漫及相关内容有一定了解，有相关行业经验者优先。\n具备良好的文字表达能力，能够独立完成内容编辑、作品介绍、推广文案及软植入。\n具备基础图片处理和视频剪辑能力，熟悉 Photoshop（PS）、Premiere（PR）等工具。\n了解 Telegram（TG）、Twitter（X）等平台的内容发布及运营方式。\n具备较强的执行力、责任心和沟通能力，能够按照项目计划推进工作。\n具备信息搜集、竞品分析和内容整理能力，能够根据实际效果持续优化运营工作。\n能适应内容更新和推广节奏，按时完成日常运营任务。\n三、加分条件\n有 TG、Twitter（X）账号或社群的实际运营经验。\n有成人向漫画、AI动漫、AI漫剧或漫画网站的运营经验。\n了解 SEO、关键词布局、外链建设及网站流量增长。\n有内容营销、软植入、社群推广或外部渠道引流经验。\n能独立策划宣传主题，并完成文案、图片、视频等推广素材。\n有网站用户增长、留存、转化或数据分析经验。\n使用过 AI 图片生成、AI 视频制作或其他 AI 内容创作工具。\n四、我们希望你具备的能力\n内容判断力： 能识别值得推广的作品和热门题材。\n执行能力： 能独立完成内容搜集、编辑、发布及推广工作。\n运营思维： 不只完成发布任务，也会思考如何提升曝光和引流效果。\n优化意识： 能根据数据和用户反馈持续调整内容与推广方式。\n主动性： 遇到问题能主动沟通，并提出可执行的解决方案。\n五、投递要求\n\n请在简历中尽量提供以下材料：\n\n过往运营过的网站、TG 频道、Twitter（X）账号或其他社交媒体账号。\n个人撰写的推广文案、作品介绍或软植入案例。\n图片设计、视频剪辑或宣传素材作品。\nSEO 优化、外部引流、流量增长等相关案例（如有）。\n简单说明你在过往项目中负责的工作，以及取得的实际效果。\n\n有实际运营案例者优先。", "cat": "AI / AIGC"}, {"id": "299", "title": "运营专员（中级运营／交友类）", "salary": "12k-18k", "location": "未明确", "jd": "# 运营专员（中级运营/交友类）\n\n## 岗位职责\n\n1. 平台日常运营： 负责平台日常运营工作，包括内容更新、商品上架、推荐置顶、活动执行、用户反馈处理及运营异常跟进，确保日常运营工作有序开展，提升平台运营效率与用户体验；\n\n2. 内容运营与推广： 负责平台内容的筛选、整理、发布及优化，结合产品定位制定内容运营方案，通过 TG、X 等线上渠道开展内容分发与推广，提升内容曝光、用户触达及平台影响力；\n\n3. 用户增长与留存： 围绕用户新增、活跃、留存及付费转化等目标，执行拉新、促活、用户召回及社群活动，持续优化运营策略，提升用户参与度与用户价值；\n\n4. 数据监控与复盘： 跟进新增、日活、充值、留存及复费率等核心运营指标，完成数据统计、日报周报及业务复盘，及时发现运营问题，提出可执行的优化建议；\n\n5. 产品协同与项目推进： 收集整理用户反馈及业务需求，对接产品、研发推进功能优化、问题修复及版本迭代，跟进 AI 短剧等新产品的开发进度、内容配置、上线准备及运营推广，确保相关事项按计划推进；\n\n6. 渠道拓展与合作维护： 拓展并维护线上推广渠道、内容合作方及社群资源，探索有效的流量获取和用户转化方式，跟踪渠道效果，持续优化推广质量与运营投入产出。\n\n## 任职要求\n\n1. 具备平台运营、内容运营、用户运营、社群运营或新媒体运营相关经验，有实际运营成果者优先；\n\n2. 熟悉 TG、X 或其他线上内容推广渠道，能够独立完成内容发布、活动执行、用户维护及日常运营任务；\n\n3. 具备一定的数据分析能力，能够根据新增、活跃、充值、留存等指标判断运营效果，并制定相应的优化措施；\n\n4. 具备良好的沟通协调能力、执行力及问题解决能力，能够主动跟进业务事项，推动问题处理与结果闭环；\n\n5. 工作认真负责，具备较强的学习能力、抗压能力和目标意识，能够适应多任务并行的工作节奏；\n\n6. 具备良好的团队协作意识，能够配合产品、研发及其他业务岗位推进项目落地。\n\n## 加分条件\n\n1. 有社交平台、视频平台、短剧平台或互联网内容产品运营经验；\n\n2. 有 TG 社群运营、私域流量运营、线上推广、用户增长或活动策划经验；\n\n3. 有 AI 短剧、AI 视频内容运营、新产品上线或产品迭代跟进经验；\n\n4. 熟悉运营数据报表、数据看板及自动化工具，能够通过工具提升工作效率；\n\n5. 拥有稳定的内容资源、推广渠道或社群资源，能够快速开展业务并取得实际成果；\n\n6. 有运营流程优化、跨部门项目推进或团队协作管理经验。\n\n岗位目标： 通过日常运营、内容建设、用户增长、数据复盘及产品协同，持续提升平台活跃度、用户留存、付费转化与整体运营效率。", "cat": "运营"}, {"id": "300", "title": "SEO 专员", "salary": "20k-30k", "location": "未明确", "jd": "岗位职责：\n1、负责公司网站及内容矩阵的 SEO 增长策略制定与落地，围绕业务目标持续提升自然搜索流量、收录、关键词排名及转化效果。\n2、独立负责多个网站（品牌站、内容站、专题站、多语言站）的整体 SEO 运营，包括站点规划、架构优化、内容策略及增长方案制定。\n3、制定关键词策略，完成核心词、长尾词、热点词、商业词等关键词布局，并持续优化内容质量与页面排名。\n4、主导站内 SEO 优化，包括网站结构、URL、TDK、内链、聚合页、标签页、Schema、Core Web Vitals、页面体验等持续优化。\n5、建立完整的技术 SEO 规范，协同研发团队解决索引、抓取、重定向、Canonical、Sitemap、Robots、Hreflang 等技术问题。\n6、建立内容运营规范，制定内容更新机制、专题策划、AI 内容生产规范及内容质量评估体系，提高整体内容竞争力。\n7、建立外链增长体系，拓展行业媒体、Guest Post、资源合作等渠道，持续提升网站权重及品牌曝光。\n8、持续关注 Google、Bing 等搜索引擎算法变化，及时调整 SEO 策略，降低算法风险，保障网站稳定增长。\n9、 熟练使用 Google Search Console、Google Analytics 4、Ahrefs、SEMrush、Screaming Frog 等工具，对流量、收录、关键词、转化及用户行为进行数据分析。\n10、推动 SEO 自动化建设，参与 SEO 工具、数据平台及 AI 内容工具需求设计，提高运营效率。\n11、建立 SEO 数据监控体系，定期输出 SEO 分析报告、增长复盘及优化方案，为业务决策提供数据支持。\n12、负责 SEO 相关知识沉淀，制定 SOP、培训团队成员，并推动 SEO 最佳实践在团队内部落地。\n\n岗位要求\n必须项\n3 年以上 Google SEO 实战经验，至少独立负责过 1 个以上完整网站项目。\n熟悉 Google、Bing 等搜索引擎工作原理及最新排名机制。\n熟练掌握 On-page SEO、Technical SEO、Off-page SEO 及内容 SEO 等优化方法。\n熟练使用 Google Search Console、Google Analytics 4、Screaming Frog、Ahrefs 或 SEMrush 等 SEO 工具。\n熟悉网站索引、抓取、收录、关键词布局、页面优化及外链建设全流程。\n熟悉 HTML、CSS 基础知识，了解 JavaScript 对 SEO 的影响，能够与研发团队高效沟通。\n具备优秀的数据分析能力，能够根据排名、收录、流量及转化数据持续优化策略。\n熟悉 AI 工具在 SEO 场景中的应用，如内容生成、关键词分析、数据整理及自动化运营。\n加分项\n有海外网站运营经验，熟悉英语或多语言 SEO。\n有矩阵站、站群、多域名项目运营经验。\n有资讯站、内容聚合站、社区类网站运营经验。\n熟悉 Cloudflare、CDN、服务器基础配置及网站性能优化。\n熟悉 Python、SQL、Shell 等任一脚本语言，可实现 SEO 数据自动化分析。\n有独立运营个人网站、博客或副业站经验，并取得一定自然流量成果。\n熟悉 AI SEO、Programmatic SEO（程序化 SEO）、自动化内容生成等先进 SEO 技术。\n有成功将网站自然流量提升至百万级以上 PV 或显著增长案例。\n\n其他要求\n1、入职后负责制定年度及季度 SEO 增长规划，并建立完整的 KPI 指标体系（收录、关键词、流量、转化、ROI 等）。\n2、试用期（3 个月）需完成以下交付成果：\n3、网站 SEO 全面诊断报告（技术、内容、外链）\n4、6 个月 SEO 增长规划及执行方案\n5、完成至少 5 项关键技术 SEO 优化\n6、推动至少 1 个 SEO 自动化工具或流程优化上线\n7、每周输出 SEO 数据分析报告，每月完成增长复盘及下一阶段优化计划。\n8、面试需结合实际案例进行分享，重点考察网站诊断能力、技术 SEO 能力、数据分析能力及增长思维。", "cat": "运营"}, {"id": "302", "title": "AI Algorithm Engineer", "salary": "年薪20万美金内", "location": "可远程", "jd": "Responsibilities\n\n• Lead research, pre-training, optimization, and iteration of Vision Foundation Models, including Stable Diffusion, DiT, Vision Transformer (ViT), Segment Anything Model (SAM), CLIP, and other cutting-edge computer vision models.\n\n• Design and fine-tune vision models for business scenarios such as AI image generation, image editing, multimodal understanding, and intelligent visual applications.\n\n• Lead Supervised Fine-Tuning (SFT), Parameter-Efficient Fine-Tuning (PEFT), LoRA, ControlNet, Adapter tuning, and related optimization techniques.\n\n• Explore and improve generative model architectures and visual feature extraction networks to enhance image quality, stability, resolution, inference efficiency, and multimodal alignment.\n\n• Collaborate with engineering teams to deploy large-scale AI models into production and optimize inference performance through quantization, pruning, inference acceleration, memory optimization, and deployment tuning.\n\n• Continuously track the latest academic research, open-source projects, and industry trends in Computer Vision (CV), Multimodal AI, and Generative AI, rapidly transforming new technologies into business value.\n\nRequirements\n\nEducation\n• Bachelor's degree or above in Computer Science, Artificial Intelligence, Applied Mathematics, or related fields.\n\nTechnical Skills\n\n• Strong expertise in Vision Foundation Models and a deep understanding of Diffusion Models, Vision Transformers (ViT), MAE, and related architectures.\n\n• Experience participating in or leading the complete pre-training lifecycle of large-scale vision or multimodal models with hundreds of millions (or billions) of parameters.\n\n• Strong understanding of dataset construction, data cleaning, training stability, and large-scale model optimization.\n\n• Hands-on experience with AIGC technologies, including Text-to-Image, Image-to-Image, and multimodal generation.\n\n• Proficient in Python and C++, with strong experience using PyTorch and excellent source code reading and secondary development capabilities.\n\n• Familiar with distributed training frameworks such as DeepSpeed, Megatron-LM, and FSDP, with hands-on experience in multi-node, multi-GPU training and compute resource management.\n\nPreferred Qualifications\n\n• Publications in top-tier AI conferences such as CVPR, ICCV, ECCV, NeurIPS, or ICLR.\n\n• Active contributor to GitHub, Hugging Face, or other open-source AI communities.\n\n• High-ranking achievements in AI competitions such as Kaggle.\n\n• Experience with TensorRT, CUDA programming, and low-level operator optimization.\n\n• Experience with High Performance Computing (HPC) environments.", "cat": "AI / AIGC"}, {"id": "303", "title": "AI内容编辑（AI短剧编剧/ 欧美出海方向）", "salary": "面谈", "location": "未明确", "jd": "岗位职责\n1. 负责欧美出海短剧的选题策划、故事构思、人物设定及完整剧本创作；\n2. 结合欧美观众的文化背景和内容偏好，设计开篇钩子、剧情冲突、情绪爽点及付费卡点；\n3. 把控故事结构、人物关系、剧情节奏和单集信息密度，确保剧本适合短剧形式；\n4. 持续研究海外短剧平台的热门题材、爆款作品及市场趋势，输出可落地的内容方向；\n5. 根据项目数据、用户反馈及制作要求，持续优化剧本节奏和情节设置；\n6. 使用AI工具辅助完成资料调研、创意拓展、剧本分析及内容优化；\n7. 与制片、分镜、生成、剪辑及运营人员协作，推动剧本顺利进入制作环节。\n8. 交付分场清晰的单集剧本，写明场景、人物、动作、对白及情绪；配合导演调整难以生成的场景，并标明修改内容与版本。\n\n任职要求\n1. 具备短剧编剧、网络文学、影视剧本或相关内容创作经验；\n2. 具备完整的故事创作能力，能够独立完成人物设定、故事大纲、分集梗概及剧本；\n3. 熟悉强冲突、快节奏、高情绪密度的短剧创作方式；\n4. 了解欧美文化、审美偏好及内容消费习惯，对海外短剧市场有一定研究；\n5. 具备良好的英语读写能力，能够阅读英文资料、理解英文剧本；\n6. 能够熟练使用能够熟练使用ChatGPT、Claude、Grok等AI工具辅助创作\n7. 具备良好的沟通协作能力，能够根据制作要求及时调整剧本。\n\n优先考虑（加分项）\n1. 有欧美出海短剧、海外网文或ReelShort类项目经验；\n2. 有已上线短剧作品或完整项目经验；\n3. 熟悉海外短剧付费模式及卡点设计；\n4. 能够提供完整剧本、上线作品或过往项目案例。\n\n应聘资料\n请提供个人简历、完整单集剧本及人物设定，并注明个人在项目中负责的具体内容；如有制作前后修改案例，请一并提供", "cat": "AI / AIGC"}, {"id": "304", "title": "AI内容编辑（AI短剧生成师/ 画面生成方向）", "salary": "15K–18K", "location": "未明确", "jd": "岗位定位：根据确认的分镜和视觉资产交付可供剪辑使用的镜头，重点考察剧情还原、一致性、动态质量与返修能力\n\n岗位职责\n1. 根据剧本和分镜要求，使用MiniMax、Seedance等AI工具生成短剧视频镜头；\n2. 根据确认的人物、场景和风格设定，制作镜头参考图；缺失资产及时反馈视觉设计师或导演确认；\n3. 负责图片和视频提示词设计、参数调试、任务生成及失败任务重做；\n4. 控制角色形象、服装、场景及画面风格的一致性，并保证人物动作、道具和空间关系在相邻镜头中衔接；\n5. 发现并处理角色漂移、动作异常、画面失真、镜头穿帮等问题；\n6. 根据剪辑和质检反馈完成镜头返修、补帧、重生成及素材替换；\n7. 按照项目要求完成素材命名、分类、整理及交付；镜头应完成分镜指定动作，保留剪辑所需的动作起止，关联参考图及关键参数；\n8. 记录生成数量、成功率、返修率、耗时及制作成本，配合优化生产效率；\n9. 与编剧、分镜、工作流工程师、剪辑及质检人员协作，确保项目按时交付。\n\n任职要求\n1. 熟悉MiniMax、Seedance等AI视频生成工具，具备实际生成经验；\n2. 熟悉主流AI生图工具，能够依据既定人物和场景资产制作镜头参考图；\n3. 具备较强的提示词设计和参数调试能力；\n4. 能够理解剧本和分镜，并将文字要求准确转化为可用画面；\n5. 具备基础的镜头语言、构图、光影、色彩及视觉审美能力；\n6. 具备角色一致性和画面连续性控制意识；\n7. 执行力强，能够按照标准流程完成批量化生产任务；\n8. 具备良好的沟通能力，能够快速理解修改意见并完成返修。\n\n 优先考虑\n1. 有AI短剧、AI漫剧或批量视频生成经验；\n2. 熟悉ComfyUI基础操作及常用生图工作流；\n3. 熟悉Flux、SDXL、LoRA、ControlNet等模型或技术；\n4. 具备分镜设计、剪辑或影视制作经验；\n5. 能够提供AI生成短剧、人物定妆图、分镜或视频作品。\n\n应聘资料\n请提供个人简历及同一人物的一组连续剧情镜头、参考图及一次返修前后对比，并简要说明：\n常用的AI生图和视频生成工具；\n在什么时长、难度和工具条件下，日常可交付多少个通过验收的镜头，以及生成次数、返修次数和耗时；\n角色一致性及异常画面处理经验；\n个人在相关项目中负责的具体工作。", "cat": "AI / AIGC"}, {"id": "305", "title": "AI 短剧导演（海外内容）", "salary": "15K–18K", "location": "未明确", "jd": "岗位：AI 短剧导演（海外内容） \n\n岗位定位\n负责面向海外市场的 AI 短剧从剧本到成片的全流程制作，兼具导演思维、视听审美与后期执行能力。能够根据目标市场的文化偏好与平台规则完成内容本地化，运用 AI 工具实现视觉叙事，独立把控分镜、剪辑、声音及最终交付质量。\n岗位职责\n1. 根据剧本确定影片风格、角色形象、场景设计和视听表达，完成分镜脚本及制作规划；\n2. 输出故事板、镜头表、机位设计、景别设计及镜头调度方案，与编剧协作完成剧本可视化；\n3. 设计钩子、情绪爆点与集尾悬念，控制单集画面节奏、叙事节奏、情绪节奏及视觉重心；\n4. 把控角色神态、肢体动作、对白节奏及人物互动，使表演呈现符合剧情与情绪逻辑；\n5. 熟练运用 AI 图像、视频及声音工具完成素材生成与迭代，解决人物一致性、镜头衔接、动作自然度等实际问题；\n6. 独立完成精剪、调色、配音整合、音效、配乐、字幕及必要的合成修复，交付完整成片；\n7. 了解目标市场（欧美 / 东南亚 / 中东等）的文化偏好与内容审核规则，熟悉 TikTok、YouTube Shorts、Instagram Reels 等平台的分发逻辑，确保内容符合当地受众审美与平台要求；\n8. 理解情感、悬疑等题材的叙事特点，通过构图、光影、声音与剪辑把握亲密关系、暧昧氛围与戏剧冲突的表达尺度；\n9. 与编剧协作评估制作可行性，优化难以生成或成本过高的场景，平衡质量、周期与成本；\n10. 建立角色、场景、镜头及声音资产库，沉淀可复用的制作流程与提示词体系。\n任职要求\n1. 有短剧、影视、广告、动画或 AI 视频制作经验，具备可展示的完整作品；\n2. 能够独立完成剧本可视化，输出专业故事板、镜头表及导演阐述，具备完整镜头设计能力；\n3. 熟悉镜头语言、场面调度、表演逻辑与叙事节奏，能合理运用构图法则、轴线原则、连续性剪辑及蒙太奇完成视觉叙事；\n4. 熟练使用至少一款专业剪辑软件（Premiere Pro / DaVinci Resolve / Final Cut Pro），具备调色、声音处理及基础合成能力；\n5. 熟悉主流 AI 图像与视频生成工具（如 Runway、Kling、Pika、MidJourney 等），具备将多工具整合进完整制作工作流的实际经验；\n6. 具备海外市场意识，了解目标受众的内容偏好与观看心理，英语具备基础读写能力，能独立理解目标市场用户反馈；\n7. 对成年受众的内容偏好与观看心理有基本理解；\n8. 具备良好的交付意识、项目保密意识与跨部门沟通能力。\n加分项\n- 有海外平台内容发行、运营或本地化经验；\n- 有独立导演并完成后期的完整作品；\n- 熟悉角色一致性控制、批量制作工作流；\n- 有根据完播率、互动数据调整内容结构的经验；\n- 有小型团队管理或跨部门协作经验；\n- 有情感、悬疑、西幻或强人物关系题材创作经验。\n应聘材料\n- 提供 2–3 部代表作品，注明本人负责的环节；\n- 至少一个从剧本或分镜到最终成片的完整案例；\n- 说明常用工具组合、单集制作周期及可独立承担的工作范围。", "cat": "AI / AIGC"}, {"id": "306", "title": "Prompt优化工程师", "salary": "18-30k", "location": "6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。", "jd": "岗位职责\n1.具备从选题、内容形态到最终呈现效果的全链路理解能力，覆盖文案、图片、视频等多种内容形态，不局限于写Prompt本身。\n2.梳理编辑、运营、AI生成、剪辑等岗位的实际生产场景，分别定义可复用的文本类Prompt规范（标题、文案、SEO内容）和视觉类Prompt规范（封面、画面生成），建立结构化模板及负面提示词库。\n3.对主流文本大模型、图像和视频生成模型进行系统性对比测试，记录不同内容场景下的模型能力边界、参数效果、失败模式和成本差异，在自己主攻的方向上能独立判断、能兜底。\n4.设计A/B测试与量化评测指标，衡量可用率、一致性、点击率/审美质量、生成耗时和单条素材成本，用数据而非主观感受驱动优化。\n5.与运营、AI生成师和开发团队协作，把验证有效的Prompt和评测方法沉淀到平台、工作流或自动化评测工具中，让好经验能够复用推广。\n6.具备强自驱和强复盘意识，持续跟踪模型更新和行业实践，把踩坑记录、失败模式和最佳实践系统性整理为团队资产，并组织内部培训，推动团队形成统一的提示词工程标准。\n任职要求\n1.本科及以上学历，中文、新闻、设计、计算机、人工智能等相关专业优先。\n2.2年以上AIGC、Prompt工程、内容生产或模型评测经验，具备可验证的项目案例。\n3.熟悉主流文本大模型及文生图、视频生成模型，理解文案生成、参考图、首尾帧、镜头控制、风格迁移和一致性控制等不同方法。\n4.具备较强的文字表达、结构化思考和实验设计能力，能把个人经验转化为可复用的模板、流程和评测标准。\n5.能阅读模型文档、英文资料和社区案例，独立快速验证新技术并形成结论。\n6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。\n7.对内容质量和数据结果敏感，具备跨团队沟通和培训输出能力。\n加分项\n1.具备Python脚本、数据处理或自动化评测能力。\n熟悉ComfyUI、LoRA、模型微调或本地推理。", "cat": "技术 / 数据"}, {"id": "307", "title": "中高级内容运营", "salary": "15-30k", "location": "未明确", "jd": "岗位职责\n重点看具有Tg社群频道 X社群 用户运营经验的\n要求有成人行业经验\n1.负责平台整体内容运营，制定内容分类、标签、专题、搜索页等内容策略，提升内容流量、用户留存与转化效率。\n2.负责内容矩阵的选题方向制定与更新排期统筹，跟踪内容数据表现（播放、完播、转化等），持续分析优化内容策略及运营打法，定期输出数据分析报告支撑业务决策。\n3.统筹站外推广工作，包括自媒体矩阵、TG频道、外链渠道等内容分发及曝光提升策略，跟踪竞品及行业动态持续优化增长模型。\n4.带领并考核内容/运营团队成员，把控内容更新、文案优化、专题活动等产出质量，对接平台端内容规范落地。\n5.定期对内容数据进行复盘，包括流量来源、搜索关键词、用户行为、转化路径等，形成优化方案并推动落地执行。\n6.建设选题库、素材库、标签体系和内容SOP，提升团队协作效率与内容复用率。\n7.对齐业务目标，推动跨团队协作，完成内容相关的临时性/专项工作。\n任职要求\n1.本科及以上学历，3年以上内容运营、短视频运营或网站运营相关经验，有细分内容领域行业经验者优先。\n2.具备较强的数据分析能力，能通过流量、留存、转化、用户行为等核心数据发现问题并制定优化策略。\n3.熟悉内容生态与SEO运营逻辑，对分类结构、标签体系、专题页、关键词布局、搜索流量增长等有实战经验。\n4.有站外推广、自媒体矩阵运营或社群运营经验，熟悉TG频道运营者优先。\n5.具备一定的团队协作或带教经验，能统筹多任务并推进落地。\n6.责任心强，抗压能力好，能适应快节奏的业务需求。\n加分项\n1.熟悉Google Analytics、Search Console等数据工具，有搜索引擎流量增长经验优先。\n2.有多站点/矩阵站点运营经验。\n3.有海外渠道（Telegram、Twitter、Facebook、Reddit等）运营经验。", "cat": "内容"}, {"id": "308", "title": "运营专员", "salary": "8-15k", "location": "未明确", "jd": "重点看具有Tg社群频道 X社群 用户运营经验的\n岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态", "cat": "运营"}, {"id": "309", "title": "新媒体运营", "salary": "12–18K", "location": "未明确", "jd": "只要女性\n一、岗位职责：\n1. 负责国外主流媒体平台整体运营规划，包括但不限于TikTok、YouTube、Instagram、Facebook、X 等平台；\n2. 根据业务发展方向制定平台运营策略、账号矩阵规划及阶段性增长目标；\n3. 深度研究各平台流量机制、推荐逻辑及内容生态，结合平台规则持续优化运营策略；\n4. 负责内容运营体系搭建，包括选题策划、内容方向、用户增长、互动运营及传播转化；\n5. 独立推进账号从0-1孵化及成熟账号增长，对账号数据结果负责；\n6. 定期分析平台数据及竞品动态，输出运营复盘及优化方案；\n7. 立账号运营标准及管理机制，降低平台风险，保障账号稳定运营。\n\n二、任职要求：\n\n1. 大专及以上学历，3年以上国外主流媒体平台运营经验；\n2. 熟悉TikTok、YouTube、Instagram、Facebook、X等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知；\n3. 具备成熟账号操盘经验，有成功案例或账号增长成果优先；\n4. 具备较强的数据分析及运营复盘能力，能够通过数据驱动内容及运营优化；\n5. 对热点趋势、内容传播及用户心理有较高敏感度；\n\n加分项：\n1. 有百万级曝光或成熟账号矩阵运营经验；\n2. 熟悉各个平台的成人内容账号起量手法/运营逻辑和安全风险规避，有可验证的成功的账号最佳\n3. 熟悉短视频内容运营及投流逻辑；\n4. 具备基础视频剪辑、内容策划或达人合作经验。\n最好是有短剧或者影视新媒体账号运营经验的女生会使用剪辑软件网感也要好的", "cat": "运营"}, {"id": "311", "title": "资料员", "salary": "8-13k", "location": "未明确", "jd": "【岗位职责】\n1. 负责在X（Twitter）、TG、OnlyFans、论坛等平台搜集成人内容、热点资讯及相关素材，持续拓展资源渠道。\n2. 完成视频、图片的下载、筛选、去重及分类归档，检查素材清晰度与完整性，准确添加标题、标签及来源信息。\n3. 持续跟踪网络热点，及时整理和提交热门素材，保障内容更新的时效性。\n4. 维护资源库及渠道清单，配合编辑、运营完成素材分发与补充，提高资源利用效率。\n【任职要求】\n1. 大专及以上学历，具有1年以上相关工作经验，有内容采集、资源整理或内容运营经验者优先。\n2. 能够适应成人内容审核与整理工作，熟悉X、TG、OnlyFans、MyFans、Fansly等平台，具备丰富、稳定的资源渠道者优先。\n3. 熟练使用素材下载、检索及整理工具；掌握Python、八爪鱼等采集工具者优先。\n4. 对热点和内容时效敏感，具备基本的素材质量判断及分类整理能力。\n5. 执行力强，工作细致、有耐心，能够稳定完成重复性任务，具备良好的沟通与协作意识。", "cat": "其他"}, {"id": "312", "title": "AI生成师（必须会剪辑）", "salary": "12-25k", "location": "未明确", "jd": "岗位职责\n1. 理解剧本、分镜和视觉参考，拆分角色、场景、道具、动作和镜头，形成结构化的生成任务。\n2. 根据不同内容需求选择文生图、图生视频、首尾帧、参考图等生成方式，配置模型、参数和生成工作流。\n3. 进行批量生成与“抽卡”筛选，从构图、角色一致性、动作自然度、光影、风格和瑕疵等维度判断素材可用性。\n4. 维护角色、场景、服装、道具和风格资产库，记录Prompt、参数、版本、成本及最终选用结果。\n5. 针对生成失败、连贯性不足、画面崩坏等问题持续迭代提示词和工作流，提升一次通过率与批量生产效率。\n6. 与编剧、导演、剪辑和开发团队协作，反馈工具问题，沉淀提示词模板、案例库和标准操作流程。\n任职要求\n1. 大专及以上学历，数字媒体、动画、视觉设计、影视制作、美术等相关专业优先。\n2. 1年以上AIGC内容生产经验，或具备能够证明生成能力的作品集与项目案例。\n3. 熟悉主流文生图、图生视频及视频生成工具，理解常用参数、参考图、首尾帧和风格控制方法。\n4. 具备较强的视觉审美和画面判断能力，能够识别角色漂移、结构错误、运动异常等常见问题。\n5. 具备提示词编写、结构化实验和持续迭代能力，能够承担一定强度的批量生产任务。\n6. 工作细致、耐心、责任心强，能够适应快速变化的模型和工具生态。\n加分项\n• 熟悉ComfyUI、工作流编排、LoRA训练或模型部署。\n• 有AI短剧、AI漫剧、广告或内容平台的稳定量产经验。\n• 能够编写脚本或小工具提高素材整理、批量生成和评测效率。", "cat": "AI / AIGC"}, {"id": "313", "title": "高级后端开发", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n1. 负责短剧及 AI 内容平台的后端架构设计、核心功能开发与维护，保障系统稳定性、可扩展性及交付质量。\n2. 负责短剧业务系统建设，涵盖内容管理、剧集管理、视频处理、播放鉴权、会员订阅、付费解锁等核心流程。\n3. 负责 AI 文本生成、图片生成、视频生成模型的接入与服务封装，支持多模型调度、流式输出、异步任务及结果回调。\n4. 建设 AI 内容生产流程，串联剧本生成、角色设定、分镜生成、生图、生视频及成片处理等环节。\n5. 设计模型任务调度与计费体系，完善并发控制、超时重试、幂等处理、失败补偿及成本统计。\n6. 负责数据库、缓存、消息队列及接口性能优化，完善日志、监控与告警，参与生产故障排查和复盘。\n7. 推进代码评审、自动化测试及 CI/CD，与产品、算法、前端和运维团队协作完成项目交付。\n任职要求\n1. 10年及以上后端开发经验，具备独立负责核心业务模块或中大型项目的能力。\n2. 精通 Go、PHP、Python 中至少一门，熟练掌握另一门，熟悉对应主流框架，具备良好的业务建模、接口设计及工程实践能力。\n3. 具备短剧或长短视频平台实际项目经验，熟悉内容与剧集管理、视频转码、对象存储、CDN 分发、播放鉴权及付费解锁等业务。\n4. 具备 AI 文本、图片生成、视频生成三类模型的实际接入或部署经验，能够独立完成接口集成、任务编排、异常处理及上线运维。\n5. 熟悉文本模型的上下文管理、提示词模板、结构化输出及流式响应；熟悉文生图、图生图、文生视频、图生视频等常见生成流程。\n6. 理解生成式 AI 服务的生产特点，具备长耗时任务调度、限流排队、取消与超时处理、回调去重、失败重试及生成结果存储经验。\n7. 熟悉 MySQL 或 PostgreSQL、Redis 及至少一种消息队列，能够解决慢查询、缓存一致性、重复消费及事务一致性问题。\n8. 熟悉 Linux、Docker、Git 和 CI/CD，具备监控告警、性能分析及生产环境故障排查能力。\n9. 具备模型调用成本和服务质量意识，能够跟踪调用量、成功率、生成耗时及单次任务成本，并持续优化。\n10. 具备良好的沟通协作和技术文档能力，能够将业务需求转化为可落地的技术方案。\n加分项\n- 有 AI 短剧、AI 漫剧或自动化视频生产平台的完整项目经验。\n- 有角色一致性、分镜连续性、参考图控制及音画合成等工程落地经验。\n- 有 ComfyUI 工作流集成、自托管模型推理服务或 GPU 资源调度经验。\n- 熟悉 FFmpeg，有字幕、配音、音视频合成及批量媒体处理经验。\n- 有多模型供应商接入、故障切换、模型效果评测及成本优化经验。\n- 有高并发付费业务、订阅计费、支付对账或海外产品开发经验。", "cat": "技术 / 数据"}, {"id": "314", "title": "中高级运营", "salary": "10-20k", "location": "未明确", "jd": "**岗位职责**\n\n1. 负责指定网站或 App 的日常运营，跟踪 DAU、MAU、新增、留存、流量来源和内容表现，输出经营简报。\n2. 组织内容更新、专题活动、首页推荐和站点巡检，发现访问、播放、链接、评论及页面展示异常并推动处理。\n3. 分析数据波动，区分搜索、直连、推荐等来源变化，提出调整方案并跟踪结果。\n4. 与产品、技术、SEO等团队协作，明确需求、验收标准和完成时间，推动问题闭环。\n5. 指导编辑执行内容标准，开展抽检、反馈和复查。\n\n**任职要求**\n\n1. 具备网站或 App 运营经验，能够独立负责一个项目的日常运营。\n2. 熟悉 GA4、BI 或同类数据工具，能完成基础的数据对比、异常定位和复盘。\n3. 理解内容质量、访问链路、搜索流量和产品体验对业务指标的影响。\n4. 具备较强的执行、沟通和问题跟进能力，能清楚区分“已提出、推进中、已上线、已验收”。\n\n**考核关注**\n\n负责项目的数据稳定性、问题闭环率、内容质量、需求落地情况及复盘质量。", "cat": "运营"}, {"id": "316", "title": "高级php开发工程师", "salary": "18-25k", "location": "未明确", "jd": "任职要求\n1.5年以上PHP后端经验,能独立负责完整项目或核心模块。\n2.熟悉PHP框架及自定义生命周期管理,熟悉Eloquent ORM独立使用模式。\n3.有CMS二次开发经验,理解插件机制、静态化缓存等站群优化手段。\n4.熟悉MySQL主从读写分离,理解大表在线DDL的安全操作。\n5.深入理解Redis应用,包括Cluster hash tag、计数器缓冲批量落库模式。\n6.有搜索引擎(OpenSearch/ES)接入经验,能设计索引同步与降级方案。\n7.熟悉RESTful API设计、接口鉴权、参数校验、错误码与版本规范。\n8.掌握事务、幂等、并发控制、缓存一致性、慢SQL治理、限流补偿。\n9.有用户、权限、内容、订单支付、运营配置等业务模块经验者优先。\n10.有全栈联调经验,能读写前端代码并独立完成接口联调。\n11.熟悉Docker本地开发环境搭建与调试。\n12.熟练使用AI Coding工具辅助开发,但能独立判断业务逻辑与安全风险。\n\n详细岗位JD\n1.负责PHP后端项目(API服务+内容站群)的设计、开发与迭代。\n2.参与需求评审,梳理业务对象、角色、权限与验收标准。\n3.完成技术方案、接口设计、数据库设计与开发计划。\n4.独立完成用户、权限、内容、支付、运营配置等核心功能。\n5.负责Redis缓冲计数、缓存一致性等高并发场景保障。\n6.负责事务幂等、定时任务、异常补偿和数据对账。\n7.参与全栈联调,完成接口联调与问题定位。\n8.负责代码评审、性能优化、日志监控与线上排查。\n9.使用AI工具提升效率,并人工审核生成内容。\n10.沉淀开发规范、接口文档,提高团队交付质量。", "cat": "技术 / 数据"}, {"id": "317", "title": "编剧", "salary": "15-30k", "location": "未明确", "jd": "岗位职责\n1. 结合内容方向、用户偏好、平台热点和商业目标，制定选题计划并完成故事概念、人物设定及剧情大纲。\n2. 将小说、故事梗概、网文素材或原创创意改编为符合短剧节奏的剧本，完成删减、合并、重组和二次创作。\n3. 设计人物关系、故事线、冲突、情绪节点、反转、爽点及集尾钩子，确保内容具有持续观看吸引力。\n4. 输出分集大纲、正文剧本和分镜卡，明确场景、角色、动作、镜头意图及关键画面需求，为导演和AI生成提供清晰输入。\n5. 与导演、AI生成师、剪辑师协作，根据生成效果、制作限制和用户反馈持续调整剧本与分镜。\n6. 沉淀选题库、题材模板、故事结构和创作规范，参与项目复盘并持续提升内容生产效率。\n任职要求\n1. 大专及以上学历，影视、中文、新闻、编导、新媒体等相关专业优先。\n2. 2年以上短剧、网文、影视、动漫或短视频编剧经验，具备完整项目作品或可验证的作品集。\n3. 熟悉短剧或短视频叙事节奏，能够设计强冲突、强反转、强钩子并控制单集信息密度。\n4. 具备较强的故事拆解、剧情重构、人物塑造和台词表达能力，能独立完成从大纲到成稿的创作。\n5. 对AI图片、AI视频生成流程有基本了解，愿意根据模型能力调整剧本与分镜表达。\n6. 沟通和执行能力强，能够适应较快的内容生产节奏，并对交付质量负责。\n加分项\n• 有爆款短剧、爆款网文、漫剧或高传播内容项目经验。\n• 完整参与过AI短剧从选题、剧本、生成到成片的全流程。\n• 具备基础数据分析意识，能够根据完播率、互动率等指标优化剧情结构。", "cat": "内容"}, {"id": "318", "title": "中高级运营", "salary": "15-25k", "location": "未明确", "jd": "岗位职责\n1. 运营规划：制定日常、版本及节日运营计划，跟进活动配置、上线验证和效果复盘。\n2. 养成与活动运营：围绕角色成长、好感度、互动任务及剧情解锁，设计新手引导、限时活动和回流机制。\n3. 成人内容运营：结合用户偏好规划角色、服装、CG、剧情与互动内容的更新节奏，协同策划、美术及研发推进落地。\n4. 商业化运营：参与会员、月卡、礼包、限定角色及付费内容的方案设计，平衡付费收益、内容价值和长期体验。\n5. 用户与社群运营：维护玩家社群，收集角色及内容偏好，跟进反馈、投诉和异常补偿。\n6. 数据分析：跟踪留存、活跃、养成进度、剧情完成率、付费转化及复购，提出优化方案并验证效果。\n7. 上线与渠道协作：配合版本发布、内容预热和推广承接，落实目标市场、渠道的年龄限制与成人内容规范。\n任职要求\n- 有 5 年及以上游戏运营经验，有养成、恋爱互动、角色收集或剧情类产品经验。\n- 已满18周岁，明确了解并接受工作中接触、审核和运营成人向内容。\n- 理解角色吸引力、情感陪伴、收集养成和内容解锁对用户留存及付费的影响。\n- 能独立完成活动方案、运营配置需求、宣传文案及数据复盘。\n- 熟练使用 Excel，能结合数据和用户反馈定位问题、推动改进。\n- 沟通清晰、执行可靠，能主动同步风险并推进跨团队协作。\n加分项\n- 有18+成人向游戏、海外养成游戏或恋爱互动产品运营经验。\n- 熟悉 Discord、Telegram 等社群及海外用户沟通。\n- 英语可用于工作，掌握日语或其他目标市场语言更佳。\n- 有从零上线、付费内容运营、用户分层或召回经验。", "cat": "运营"}, {"id": "319", "title": "高级Flutter开发工程师", "salary": "18-30k", "location": "未明确", "jd": "岗位职责\n1. 负责 Flutter 跨平台应用开发与架构设计，覆盖 Android、iOS、macOS、Windows、Web，处理平台适配及差异化能力。\n2. 负责成人向养成游戏客户端开发，包括角色展示、好感度培养、任务、背包、剧情对话、互动演出、活动及付费解锁等模块。\n3. 根据项目需求，使用 Flutter / Flame、Unity 或 Cocos Creator 实现游戏交互、动画和轻度玩法，并参与技术选型与集成。\n4. 负责视频播放及互动内容模块开发，支持剧情视频、角色动画、音效及媒体资源的加载、缓存和播放控制。\n5. 对接游戏服务端，完成登录鉴权、协议交互、状态同步、断线恢复及资源更新，保障玩家数据展示与操作的一致性。\n6. 参与客户端模块化、状态管理和配置驱动设计，提升角色、剧情、活动及玩法内容的复用与迭代效率。\n7. 持续优化启动速度、渲染帧率、内存、包体积及稳定性，解决跨端兼容和复杂线上问题。\n8. 与产品、游戏策划、美术、动画及后端团队协作，完成需求拆解、开发、自测、发布及上线验证。\n任职要求\n1. 大专及以上学历，8 年以上移动端开发经验、3 年以上 Flutter 开发经验，精通 Flutter / Dart，基础扎实。\n2. 具备 Android 或 iOS 原生开发经验，理解平台生命周期、权限、线程及资源管理。\n3. 具备实际游戏客户端开发经验，参与过养成、卡牌、恋爱互动、剧情或轻度休闲游戏，能说明个人负责的模块及上线成果。\n4. 熟悉至少一种游戏开发技术栈：Flutter / Flame、Unity / C#、Cocos Creator / TypeScript，理解其开发流程与适用边界。\n5. 理解游戏循环、状态机、场景与 UI 管理、事件机制、动画及资源生命周期；能够实现角色互动、剧情推进及基础玩法。\n6. 熟悉 Flutter Widget 体系、布局及渲染机制，掌握 Provider、BLoC、GetX、Riverpod 等至少一种状态管理方案。\n7. 熟悉 Flutter 插件开发及原生通信，能够通过 Platform Channels 等方式集成平台能力或游戏模块。\n8. 具备视频播放器开发经验，熟悉 HLS（m3u8 播放列表）、MP4 媒体封装格式及 video_player、ExoPlayer / Media3、AVPlayer 等相关技术。\n9. 熟悉 HTTP / WebSocket、数据解析及本地存储，能够处理请求竞态、重复提交、断线重连和账号数据隔离。\n10. 具备性能分析与调试经验，能够定位卡顿、内存泄漏、资源未释放、播放异常及跨端兼容问题。\n11. 具备良好的代码规范、模块划分、架构设计及测试意识，熟悉 Git 协作和 Code Review。\n12. 已满 18 周岁，明确了解并接受参与成人向养成游戏及相关内容的研发工作。\n加分项\n- 有成人向、角色养成、恋爱互动、卡牌或互动剧情游戏的完整项目经验。\n- 有 Flame 游戏开发、Flutter 与 Unity/Cocos 集成经验。\n- 熟悉 Spine、Live2D、Rive、Lottie 中一种或多种动画方案，具备角色互动和演出落地经验。\n- 有剧情编辑器、对话系统、分支选择、好感度系统或配置表工具链开发经验。\n- 有资源分包、按需下载、增量更新、版本兼容及失败恢复经验。\n- 有直播、短视频、视频平台或互动视频项目经验。\n- 有 AI 角色对话、流式输出、生成图片/视频展示及异步任务交互经验。\n- 熟悉桌面端、Flutter Web 或鸿蒙开发及发布。\n- 能合理使用 AI 编码工具与 Agent，明确操作边界，对生成代码进行审查、测试和验证。", "cat": "技术 / 数据"}, {"id": "320", "title": "高级前端开发", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n1. 负责成人向养成游戏及配套 Web 产品的前端架构设计、核心功能开发与维护。\n2. 使用 Vue、React、TypeScript 开发用户端页面及运营后台，支持角色与内容管理、活动配置、商品礼包、订单及数据展示。\n3. 使用 Cocos Creator／TypeScript 或 Unity3D／C# 开发游戏，实现角色养成、好感度、任务、背包、剧情对话及互动演出等功能。\n4. 负责游戏 UI、动画、音效及图片、视频资源集成，优化加载速度、渲染性能、内存占用和包体积。\n5. 负责前端及游戏客户端与后端服务交互，完成登录鉴权、状态同步、断线恢复、支付及付费内容解锁。\n6. 参与资源管理、配置表、模块化与通用活动框架建设，提升内容更新和版本迭代效率。\n7. 参与后端接口与数据结构设计，能够独立完成基础后端功能，协同解决端到端问题。\n8. 与产品、游戏策划、美术及后端团队协作，完成需求拆解、开发、自测、发布和线上排障。\n任职要求\n1. 大专及以上学历，5 年及以上前端或游戏开发经验，有完整项目交付经历。\n2. 熟练掌握 Vue 和 React，均有实际项目经验，能够独立完成页面开发、组件设计、状态管理、路由及接口集成。\n3. 熟练掌握 JavaScript／TypeScript、HTML、CSS，理解浏览器运行机制，具备响应式布局、兼容性处理及性能优化能力。\n4. 熟悉 Vue 3、Composition API、Pinia，以及 React Hooks 和常用状态管理方案，能解释技术选型与使用边界。\n5. 具备实际游戏开发及成人向游戏项目经验，熟悉养成、恋爱互动、卡牌或剧情类游戏，能说明个人贡献和上线成果。\n6. 熟练掌握 Cocos Creator／TypeScript、Unity3D／C# 中至少一种，了解另一种；理解游戏循环、场景管理、状态机、事件机制及资源生命周期。\n7. 熟悉游戏 UI 适配、动画交互、异步加载、对象池和资源释放，能够定位卡顿、内存泄漏及跨平台问题。\n8. 熟悉 HTTP、WebSocket，能够处理鉴权刷新、请求乱序、重复提交、断线重连及状态一致性。\n9. 熟悉后端开发，掌握 Go、PHP、Python、Node.js 中至少一种，具备实际接口开发经验。\n10. 熟悉 MySQL 或 PostgreSQL、Redis，理解权限校验、缓存、事务和幂等，能够参与前后端整体方案设计。\n11. 熟悉 Git、前端工程化、构建发布和多环境配置，具备代码评审、自动化测试及线上排障能力。\n12. 能合理使用 AI 编码工具与 Agent，控制任务和权限边界，对生成代码进行审查、测试与验证。\n13. 已满 18 周岁，明确了解并接受工作中接触成人向美术、剧情及互动内容。\n加分项\n- 同时具备 Vue、React多技术栈交付经验。\n- 有成人向养成游戏从零开发至上线运营的完整经历。\n- 有剧情编辑器、分支对话、好感度系统或游戏配置工具链开发经验。\n- 有 H5／WebGL、移动端及桌面端发布与适配经验。\n- 有资源分包、热更新、按需下载及更新失败恢复经验。\n- 有 AI 角色对话、动态剧情或生图、生视频能力接入经验。", "cat": "技术 / 数据"}, {"id": "321", "title": "高级测试工程师", "salary": "20-30k", "location": "未明确", "jd": "高级测试工程师\n岗位职责\n1. 负责公司各类产品的质量保障，覆盖 Web、移动端、管理后台、服务端接口及其他业务系统。\n2. 参与需求与技术方案评审，识别业务风险，制定测试策略、测试计划、测试用例及版本准出标准。\n3. 开展功能、接口、回归、兼容性、性能及稳定性测试，覆盖正常流程、边界条件和异常场景。\n4. 建设和维护自动化测试体系，接入 CI/CD，提升关键业务链路的回归效率与测试可靠性。\n5. 验证跨系统交互及数据一致性，重点覆盖登录鉴权、权限、订单、支付、订阅、任务调度及异常补偿等业务。\n6. 参与测试环境建设与维护，管理测试账号、数据及版本配置，保障环境可用、测试可重复、问题可复现。\n7. 跟进缺陷定位、修复与回归，参与灰度发布、上线验证及线上故障分析，推动问题闭环和复盘改进。\n8. 建立质量指标、测试规范和知识库，与产品、研发及运维团队协作，持续提升交付质量。\n任职要求\n1. 大专及以上学历，7 年及以上软件测试经验，具备独立负责中大型项目或多产品质量保障的能力。\n2. 熟练掌握测试设计方法，能够运用等价类、边界值、决策表、状态转换及组合测试，形成系统性覆盖方案。\n3. 熟悉 Web、Android、iOS 等平台的测试特点，能够开展跨浏览器、跨设备及多版本兼容性测试。\n4. 熟悉 HTTP、WebSocket 及常见接口协议，能够使用 Postman、Apifox、Charles 等工具开展接口测试、抓包分析与故障排查。\n5. 熟练使用 SQL，熟悉 MySQL 或 PostgreSQL，了解 Redis，能够结合接口、日志、数据库及业务流水定位问题。\n6. 掌握 Python、Java、JavaScript／TypeScript 中至少一种语言，具备独立编写、维护测试脚本及工具的能力。\n7. 熟悉 Playwright、Selenium、Appium、pytest 等一种或多种工具，能够建设可维护的自动化测试体系，处理测试数据隔离及用例不稳定问题。\n8. 熟悉 JMeter、Locust、k6 等至少一种性能测试工具，能够设计业务负载，分析吞吐、响应时间、错误率及资源瓶颈。\n9. 熟悉 Linux、Docker、Git 和 CI/CD，具备环境部署、日志分析及基础服务排障能力。\n10. 理解并发、幂等、缓存一致性、消息重复消费及事务一致性，能够设计超时、重试、断网和故障恢复测试。\n11. 能合理使用 AI 工具与 Agent 辅助测试分析、脚本编写及日志排查，独立核验结果，保护凭据和用户数据。\n12. 具备良好的风险判断、沟通及文档能力，能够主动推进缺陷闭环，清楚说明已验证、未覆盖及待确认事项。\n加分项\n- 有多个产品并行测试、从零建设测试体系或测试负责人经历。\n- 有支付、订阅、电商、内容平台、音视频或游戏等业务测试经验。\n- 有微服务、消息队列、分布式任务及跨系统数据一致性测试经验。\n- 有故障注入、容量评估、长时间稳定性或安全测试经验。\n- 有 AI 对话、流式响应、生图、生视频及长耗时异步任务测试经验。\n- 有测试平台、数据构造工具、质量看板或自动化发布门禁建设经验。\n- 能开展代码级问题分析，协助研发缩小根因范围并验证修复效果。", "cat": "测试 / 运维"}, {"id": "322", "title": "编辑专员", "salary": "8-12k", "location": "未明确", "jd": "**岗位职责**\n\n1. 根据选题和资料分工，完成素材整理、标题撰写、封面选择、正文排版、关键词及标签填写，并按规范发布内容。\n2. 检查图片、视频、链接和页面展示效果，发现无法播放、跳转错误或内容缺失等问题及时反馈。\n3. 配合热点内容更新、专题整理、合集维护及基础宣发工作。\n4. 遵守内容审核标准与发布流程，完成修改意见的落实和复查。\n\n**任职要求**\n\n1. 具备基本的文字表达、信息检索和图片处理能力，能熟练使用PS/PR等常见办公工具。\n2. 做事细致，能够按标准检查标题、封面、排版、标签和素材质量。\n3. 对热点内容有一定敏感度，愿意学习内容运营和数据基础知识。\n4. 有内容编辑、社区运营或短视频相关经验者优先；优秀应届生亦可。\n\n**岗位成长方向**\n\n熟练掌握内容制作与审核标准后，逐步承担独立选题、合集策划、质量复审和新人带教工作。", "cat": "其他"}, {"id": "323", "title": "AI陪伴产品运营（AI女友方向）", "salary": "12K-18K", "location": "未明确", "jd": "岗位JD描述\n一、岗位职责\n1.负责成人向AI女友陪伴产品的整体运营，参与产品定位、目标用户分析、运营策略制定及上线冷启动，推动产品从0到1落地；\n2.围绕用户情感陪伴和成人互动需求，规划AI女友角色矩阵，包括人设、关系定位、对话风格、故事背景、互动场景及内容更新节奏；\n3.设计用户从注册、首次对话、关系升级到付费转化的完整运营路径，优化新用户激活、互动频次、次日及长期留存；\n4.策划会员订阅、虚拟礼物、剧情解锁、角色权益、限时活动等商业化玩法，持续提升付费率、客单价及用户生命周期价值；\n5.结合用户对话反馈和行为数据，协同产品及AI团队优化角色Prompt、回复质量、长期记忆、情绪反馈和内容丰富度，改善陪伴真实感与沉浸体验；\n6.搭建产品核心数据指标及复盘机制，持续跟踪注册转化、首聊率、互动轮次、留存率、付费率、ARPPU等指标，通过用户分层和A/B测试推动运营迭代；\n7.建立用户反馈、核心用户维护、流失召回及投诉处理机制，识别高价值用户需求，沉淀可复用的用户运营策略；\n8.负责竞品研究及行业趋势跟踪，持续分析AI陪伴、虚拟恋人、成人社交等产品的内容形态、商业模式及运营玩法；\n\n二、任职要求\n1.3年以上互联网产品运营、用户运营或内容运营经验，有AI陪伴、虚拟社交、聊天交友、互动娱乐、游戏或付费内容产品经验者优先；\n2.了解AI大模型及对话类产品的基本逻辑，能够参与角色Prompt、人设规则、对话效果及互动流程的配置、测试和优化；\n3.具备较强的用户洞察和内容策划能力，能够理解男性用户在情感陪伴、虚拟关系及成人互动场景中的核心需求；\n4.具备完整的用户增长和商业化思维，熟悉“拉新—激活—留存—付费—召回”运营链路，能够独立设计付费转化方案；\n5.数据敏感度较高，能够独立搭建指标体系、分析转化漏斗，并根据数据和用户反馈提出明确的优化方案；\n6.具备较强的文案及角色内容策划能力，能够独立完成人设、对话场景、关系成长线和活动方案设计；\n7.具备从0到1推进新产品或新项目的经验，目标意识强，能够主动拆解任务并推动跨部门协作落地；\n8.关注AI应用及成人内容行业发展，对新产品、新玩法和用户趋势保持敏感，能够接受成人向业务形态；", "cat": "AI / AIGC"}, {"id": "324", "title": "创作者运营", "salary": "12k-18k", "location": "未明确", "jd": "简历筛选要点：\n1. 有影视类从业经验优先\n2. 具备有实际拍摄/导演/剧本策划经验和能力\n3. 有过往案例可查阅\n\n岗位JD描述\n一、岗位职责：\n1. 对已入驻的创作者，完成“冷启动”引导；\n2. 建立A/B/C多级创作者画像，制定差异化的扶持政策和激励方案；\n3. 引导创作者生产符合自身定位和平台调性的高质内容，有实际拍摄和剧本策划经验和能力；\n4. 解答创作者日常疑问，协助调查创作者违规情况，建立平台忠诚度；\n5. 收集创作者对创作工具、运营措施的需求，推动创作者生态搭建。\n\n二、任职要求：\n1. 3年以上影视类创作者运营&孵化经验，有MCN机构经历者优先；\n2. 极强的沟通协调能力，对创作者进行日常维护；\n3. 适应高强度节奏，能接受“管家式”服务属性。", "cat": "运营"}, {"id": "325", "title": "运营专员（动漫方向）", "salary": "12k-15k", "location": "未明确", "jd": "简历筛选要点：\n1. 有二次元平台从业经验\n\n岗位JD描述\n一、岗位职责\n1. 负责成人二次元产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n5. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n6. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进。\n\n二、任职要求\n1. 3年以上二次元平台运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有成人二次元产品或运营经验者优先。", "cat": "运营"}, {"id": "326", "title": "中高级运营专员（短剧方向）", "salary": "12k-20k", "location": "未明确", "jd": "简历筛选要点：\n有成人内容或短剧实操经验优先，需要能推动运营需求、完善内容供给、进行数据复盘，并熟练使用AI工具提升内容生产与分析效率。\n\n岗位JD描述\n一、岗位职责\n负责成人AI短剧产品整体运营，围绕内容供给、用户消费、创作者生态及商业化转化制定并推动中长期运营策略。\n从用户审美与消费意图出发，规划短剧内容搭建、专题页、更新节奏与转化路径，推动播放、付费转化、留存等核心指标提升。\n与技术、内容、设计团队协作，将运营需求落地，推动重点功能与内容落地。\n使用AI工具搭建动漫运营工作流，包括选题聚类、批量内容优化、标题/封面生成、质检与数据监控等。\n熟练使用ChatGPT、Claude、Gemini、Grok等工具中的一种或多种，提升内容生产与分析效率。\n跟踪核心数据表现（新增、播放、留存、付费转化、营收等），定期输出复盘与优化建议。\n关注短剧/成人行业趋势、AI内容生成与推荐算法变化，探索新的内容增长与变现机会。\n\n二、任职要求\n至少3年以上互联网内容/用户运营经验，有独立负责短剧或剧情内容增长项目的完整经验。理解内容运营工作方式，能写需求、拆任务、排优先级并推动跨团队落地\n熟悉短剧内容策划、用户消费路径、转化漏斗、数据指标拆解等基础方法。\n对AI工具有实际使用经验，能把AI融入稳定的日常工作流。\n具备较强的数据分析能力，能从播放、完播、转化等数据中发现问题并提出解决方案。\n具备良好的内容判断力，能识别低质量内容并建立内容质量标准。\n自驱力强，能从模糊目标中拆出可执行方案，适应高节奏业务环境。\n\n加分项\n有成人内容、短剧平台、AI短剧或相关泛娱乐内容产品从0到1运营经验；有成功提升完播率或付费转化的实际案例。", "cat": "运营"}, {"id": "327", "title": "数据专员（媒体账号与数据运营）", "salary": "10K-15K", "location": "未明确", "jd": "工作内容简述：媒体账号养护、投流执行与维护、表格管理\n\n岗位职责\n1. X（推特）账号养护与运营\n   负责账号日常养护，包括资料完善、内容更新、日常互动、账号状态检查及异常反馈，保持账号稳定运营，逐步提升账号活跃度、内容曝光和粉丝积累。\n2. 多账号管理\n   使用比特浏览器等工具管理账号及独立环境，维护账号台账，记录账号状态、操作情况和异常问题，做好账号安全与权限管理。\n3. 投流执行与跟进\n   按既定投放计划，完成 X KOL、蜂鸟云推及 Facebook 等渠道的联络、素材对接、排期确认和投放执行；检查发布情况，跟进执行进度，记录投放费用及效果数据。\n4. 日常表格填写与维护\n   负责账号管理表、投放记录表、渠道资源表、费用表及效果统计表等 Google 表格的日常填写、更新和核对，确保数据准确、完整、及时。\n5. 表格整理与数据汇总\n   整理各类表格的分类、命名、字段和归档，及时跟进缺失或异常数据，按要求完成日报、周报及阶段性数据汇总，方便团队查询和复盘。\n任职要求\n1. 有 X（推特）养号及实际运营经验，熟悉账号从基础养护到持续运营的工作流程，能独立安排并完成日常维护，有多账号运营经验者优先。\n2. 熟悉比特浏览器等多账号管理工具，具备账号安全意识，操作细致，能及时发现并反馈异常。\n3. 熟练使用 Google 表格，能长期、稳定地维护多份业务表格，掌握筛选、排序、常用函数等操作，善于整理信息、核对数据。\n4. 执行力强，能按照既定流程完成投放任务，主动跟进进度，及时反馈结果。\n5. 具备基本的对外沟通能力，熟悉 Telegram 的日常使用，能够识别常见诈骗及合作风险。\n6. 做事耐心、细致、有条理，具备责任心和保密意识。\n加分项\n- 有 X 起号、账号增长或稳定运营案例；\n- 有 KOL 对接、蜂鸟云推或 Facebook 渠道投放执行经验；\n- 会使用数据透视表、图表，能优化表格结构和填写流程；\n- 具备基础英语读写能力，会简单的图片或视频处理。", "cat": "运营"}, {"id": "328", "title": "承天海外线主管（短剧／AI内容）", "salary": "面议", "location": "未明确", "jd": "海外业务主管（短剧／AI内容）\n\n岗位介绍\n负责海外短剧业务从市场选择、产品启动到增长与商业化的整体推进，统筹内容、运营及产品团队，对阶段性经营结果负责。\n业务涵盖普通向及成人向短剧，产品形态包括 Web 与 App。目标国家及上线顺序将结合市场研究与业务验证确定。\n\n岗位职责\n1.市场研究与业务规划\n研究不同国家的用户需求、竞争格局、内容消费及付费习惯，评估市场机会与进入条件，制定目标市场、产品定位和阶段性业务计划。\n2.产品从零到一建设\n联动产品与研发团队，明确 Web、App 的功能范围、需求优先级及上线节奏，推动内容发现、观看、付费和回访等核心体验建设，并根据用户反馈持续优化。\n3.内容策略与供给管理\n结合目标市场确定题材、内容形态及本地化方向，统筹 AIGC 内容团队的生产排期、质量与成本，推动内容表现复盘及供给优化。\n4.用户增长与运营\n组织社媒自然流量、SEO、合作渠道或付费推广等获客工作，优化站外传播到站内观看、付费与留存的转化路径，提升用户质量和投入效率。\n5.商业化与数据分析\n联动团队制定并验证收费方式、会员权益及用户运营策略，跟踪获客成本、观看转化、付费、留存、收入和内容成本，依据数据调整业务方向及资源投入。\n6.团队管理与跨部门协作\n统筹内容、运营及产品团队，明确目标、分工和验收标准，推进关键岗位建设、人才培养及跨团队问题解决。\n7.预算与业务风险管理\n管理业务预算及阶段性投入，协同法务、支付、技术等相关团队落实目标市场的内容、版权、隐私、年龄访问及平台要求，保障业务持续运营。\n\n任职要求\n1.具备海外互联网业务经验，有内容平台、数字内容付费、用户增长、产品运营或相关业务管理经历，能够说明本人承担的职责与实际成果。\n2.有从零到一启动产品、新市场或新业务的完整项目经验，能够在信息和资源有限的情况下确定优先级、组织验证并推动落地。\n3.具备产品判断能力，能够将用户需求及业务问题转化为产品方案，与产品、研发团队共同完成需求取舍、上线验收和效果验证。\n4.具备内容判断与商业意识，理解内容吸引力、持续消费及用户付费之间的关系，能够结合目标受众制定内容与本地化策略。\n5.熟悉至少一种海外获客方式，如社媒自然增长、SEO、达人合作、联盟渠道或付费投放，具备从获客到站内转化的实践经验。\n6.具备较强的数据分析和经营意识，能够结合用户行为、收入与成本判断业务效果，制定可执行的优化方案。\n7.有团队管理或跨职能项目统筹经验，能够协调不同专业团队，明确责任、解决分歧，并对结果负责。\n8.英语能够支持日常业务研究、资料阅读与工作沟通；对文化差异及海外业务规则具备敏感度，能够识别需要专项核实的问题。\n能够接受并负责普通向及成人向内容业务的产品与运营管理工作。\n\n加分项\n有海外网赚、联盟营销、CPS／CPA 分销或流量变现经验，熟悉渠道合作、效果归因及收益核算，具备可说明的项目成果者优先。\n有海外短剧、网文、流媒体、互动娱乐或订阅制内容产品经验。\n有 Web 与 App 协同运营、支付转化或会员商业化经验。\n有成人向内容平台相关业务经验。\n有多个国家的市场进入、本地化或增长经验。\n有 AIGC 内容生产协同、内容成本管理或制作流程建设经验。", "cat": "AI / AIGC"}, {"id": "329", "title": "AIGC视频剪辑师", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 根据剧本、分镜及导演要求完成视频剪辑。\n2. 处理镜头衔接、节奏、字幕、音效、配乐和包装。\n3. 修正AI素材中的跳帧、画面异常及连续性问题。\n4. 按平台要求完成版本修改、输出及文件管理。\n\n任职要求：\n1. 熟练使用主流视频剪辑工具。\n2. 具备良好的节奏感和视听表达能力。\n3. 了解AI视频常见问题及基础修复方法。\n4. 能适应高频修改和批量成片需求。\n5. 面试须提供3—5个完整视频，至少含1个剧情类或AI视频作品。", "cat": "AI / AIGC"}, {"id": "330", "title": "海外AIGC短剧编剧", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究目标国家热门题材、用户偏好及内容趋势。\n2. 完成海外向选题、人物设定、大纲及剧本。\n3. 根据语言、文化和用户习惯进行本土化改写。\n4. 使用AI工具辅助创意、扩写、翻译和优化。\n5. 配合制作团队调整剧本并根据数据持续迭代。\n\n任职要求：\n1. 具备短剧、网文、漫画或影视编剧能力。\n2. 具备英文或目标市场内容阅读分析能力。\n3. 具备海外用户、内容趋势及本土化调研能力。\n4. 熟悉AI写作工具，具备文化敏感性和合规意识。\n5. 面试须提供海外向剧本、双语脚本或本土化改写案例。", "cat": "AI / AIGC"}, {"id": "331", "title": "海外AIGC美术", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究目标市场的视觉审美和文化元素。\n2. 设计符合当地特征的人物、服饰、场景和画面风格。\n3. 使用AI工具生成并优化视觉素材。\n4. 控制角色、场景及系列内容一致性。\n5. 建立海外视觉及Prompt素材库。\n\n任职要求：\n1. 具备美术、插画、概念或视觉设计能力。\n2. 熟悉AI绘图工具和英文Prompt。\n3. 具备海外视觉趋势和文化差异分析能力。\n4. 能控制人物和场景的本土化准确性。\n5. 面试须提供8—15张海外向作品及角色一致性案例。", "cat": "AI / AIGC"}, {"id": "332", "title": "海外AIGC视频生成师", "salary": "10K-20K", "location": "未明确", "jd": "SEO优化师（短剧／内容网站方向）\n【岗位职责】\n1、负责海内外短剧及内容网站的SEO工作，根据业务阶段制定并执行自然搜索增长计划，推动网站从0到1建立搜索流量。\n2、调研目标国家的搜索市场、用户需求及竞品网站，挖掘剧名、题材、剧情及观看需求等关键词机会，明确关键词优先级与页面布局。\n3、制定内容优化方案，协同内容团队完善首页、剧集详情页、题材分类页及相关内容页面，提高内容质量、搜索匹配度和用户体验。\n4、优化网站结构、标题、描述、内部链接及多语言页面配置，排查抓取、索引、重复页面、加载速度等问题，并推动产品及开发团队落实优化。\n5、通过优质内容、相关网站合作及自然引用等正规方式开展外链建设，持续提升网站的搜索可见度，坚持白帽SEO方法。\n6、使用数据工具跟踪收录、关键词排名、自然搜索曝光、点击及流量表现，结合用户观看、注册和付费等行为评估流量质量与业务贡献。\n7、定期复盘SEO效果，识别内容及技术问题，调整优化优先级，沉淀适合不同国家、语言和业务阶段的执行方法。\n【任职要求】\n1、具备海外网站SEO实操经验，有独立负责网站自然流量增长的项目经历；个人站长、海外电商独立站、内容站或工具站背景均可。\n2、具备从网站诊断、关键词研究、内容规划到优化落地和效果复盘的完整能力，能够独立制定计划并推动执行。\n3、熟悉Google等主流搜索引擎的基础工作机制，掌握白帽SEO方法，重视内容价值、用户体验及长期稳定增长。\n4、掌握站内优化和基础技术SEO，能够识别抓取与索引、网站结构、重复内容、多语言配置及页面性能等问题，并与开发人员沟通解决。\n5、具备英文关键词研究、搜索意图分析及内容判断能力，能够结合目标国家的语言和用户习惯制定差异化方案。\n6、熟练使用Google Search Console、GA4及至少一种常用SEO研究工具，能够区分品牌词与非品牌词、不同国家及页面的流量表现，并据此提出优化建议。\n7、具备结果意识，能够将自然搜索流量与用户观看、注册、付费等业务目标结合，关注有效流量及转化质量。\n8、坚持正规SEO打法，不采用黑帽手段、作弊外链或其他操纵搜索排名的方式。\n【加分项】\n1、有个人独立建站、运营及变现经验，能够展示持续获得自然搜索流量的网站。\n2、有海外短剧、小说、影视、流媒体或其他内容网站的SEO经验。\n3、有新站冷启动、多语言网站或多个国家市场的SEO项目经验。\n4、具备基础HTML、CMS配置或网站搭建能力，能够独立完成部分优化工作。\n5、有通过内容建设、网站结构优化及优质外链合作取得稳定增长的案例。", "cat": "AI / AIGC"}, {"id": "333", "title": "海外社媒运营", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责：\n1. 调研目标市场的用户偏好和社媒趋势。\n2. 负责海外账号搭建、内容排期及发布。\n3. 优化标题、封面、标签、语言和发布时间。\n4. 维护用户互动并跟踪播放、粉丝及跳转数据。\n5. 分析竞品并提出内容优化建议。\n\n任职要求：\n1. 熟悉TikTok、YouTube、Instagram、Facebook、X、Telegram等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知。\n2. 具备内容策划、文案和账号运营能力。\n3. 具备基础英文编辑及用户、热点和竞品调研能力。\n4. 能根据数据快速调整策略。\n5. 面试须提供2—3个账号案例及增长数据。", "cat": "运营"}, {"id": "334", "title": "海外站点运营", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究目标国家用户的网站使用习惯。\n2. 负责站点内容、分类、标签和页面维护。\n3. 优化内容结构、推荐逻辑及更新节奏。\n4. 跟踪流量、跳出率、停留时长和转化。\n5. 收集用户反馈并协同SEO、社媒和投流做好承接。\n\n任职要求：\n1. 具备网站或内容平台运营经验。\n2. 熟悉CMS后台和内容发布流程。\n3. 具备用户调研、站点数据分析及基础SEO能力。\n4. 能发现并推进解决页面和功能问题。\n5. 面试须提供站点运营、内容改版或流量提升案例。", "cat": "运营"}, {"id": "335", "title": "海外SEO专员", "salary": "12K-16K", "location": "未明确", "jd": "岗位职责：\n1. 调研目标国家搜索市场、用户意图和关键词机会。\n2. 制定关键词布局和内容优化策略。\n3. 优化站点结构、页面元素及内部链接。\n4. 推进内容收录、排名和外链建设。\n5. 跟踪自然流量、点击率及转化数据。\n\n任职要求：\n1. 熟悉主流搜索引擎排名逻辑。\n2. 掌握关键词研究、站内优化和基础技术SEO。\n3. 具备英文关键词和搜索意图分析能力。\n4. 能使用SEO工具并制定国家差异化策略。\n5. 面试须提供关键词排名、收录或自然流量增长案例。", "cat": "运营"}, {"id": "336", "title": "漫画编剧", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 负责漫画选题、人物及世界观设计。\n2. 完成故事大纲、分话脚本、对白及画面描述。\n3. 设计剧情冲突、节奏及章节留钩。\n4. 配合设计和制作岗位优化脚本并持续修改。\n\n任职要求：\n1. 具备漫画、小说或短剧内容创作能力。\n2. 具备人物塑造、故事结构和对白设计能力。\n3. 熟悉漫画分话、分镜描述及连载节奏。\n4. 能使用AI工具辅助创作，具备稳定产能。\n5. 面试须提供3—5个漫画脚本、人物设定、故事大纲或上线作品。", "cat": "内容"}, {"id": "337", "title": "AI漫画设计师", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 根据漫画脚本完成分镜和画面设计。\n2. 使用AI工具生成人物、场景及漫画画面。\n3. 控制角色、场景及作品风格一致性。\n4. 对生成画面进行筛选、修正和局部重绘。\n5. 建立角色模型、风格模板及Prompt素材库。\n\n任职要求：\n1. 具备漫画、插画或视觉设计能力。\n2. 熟悉AI绘图工具及相关工作流程。\n3. 具备角色一致性、构图和连续画面控制能力。\n4. 能理解脚本并转化为具体画面。\n5. 面试须提供8—15张作品或2—3个完整漫画片段。", "cat": "AI / AIGC"}, {"id": "338", "title": "AI小说编剧／主笔", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究用户偏好和小说题材趋势。\n2. 完成世界观、人物、主线及章节大纲设计。\n3. 使用AI工具完成正文生成、扩写、改写和润色。\n4. 控制人物逻辑、情节推进及章节连续性。\n5. 根据审核和用户反馈调整内容并沉淀素材库。\n\n任职要求：\n1. 具备网文、小说或相关文字创作能力。\n2. 具备长篇故事规划和持续创作能力。\n3. 熟悉网络小说结构、节奏及用户偏好。\n4. 熟悉AI写作工具并能控制内容一致性。\n5. 面试须提供完整大纲、人物设定及不少于3个连续章节。", "cat": "AI / AIGC"}, {"id": "339", "title": "出海短剧产品经理（网赚方向）", "salary": "20K-35K", "location": "未明确", "jd": "【岗位介绍】\n\n负责面向海外市场的短剧与任务激励类产品建设，将内容观看、用户激励、广告变现及收益提现等环节形成完整产品体验，推动 Web／App 从需求规划到上线迭代，对用户体验与业务效果负责。\n\n【岗位职责】\n\n1、市场调研与产品规划：开展目标国家及地区的市场、用户和竞品调研，分析短剧、任务激励及网赚类产品的业务模式、核心功能和增长机会，制定产品规划及版本迭代计划。\n\n2、用户需求与本土化设计：梳理用户画像、使用场景及核心需求，结合当地语言、设备、网络、内容消费及收款习惯，制定产品本土化方案，明确需求优先级。\n\n3、短剧观看与激励体系设计：设计内容发现、播放、追剧及用户回访体验，结合业务需要搭建观看任务、积分奖励、签到和邀请等机制，平衡内容消费、激励参与与用户留存。\n\n4、商业化与收益体系建设：设计广告展示、激励视频、奖励结算、收益记录及提现流程，明确奖励规则、状态流转和异常处理，协同运营及技术团队优化变现效率与奖励成本。\n\n5、产品方案与项目交付：独立输出产品需求文档、业务流程、交互原型、数据埋点及验收标准，协调设计、研发、测试和运营团队，推动需求评审、开发上线及效果复盘。\n\n6、数据分析与持续优化：跟踪获客转化、开播、观看时长、任务完成、留存、广告收益及提现等数据，通过用户反馈和实验验证优化产品，关注用户长期价值及投入产出。\n\n7、风险控制与异常体验：协同相关团队完善重复领取、异常邀请、无效流量及提现异常等识别与处理机制，落实目标市场的隐私、广告及相关平台要求，保障规则透明和用户权益。\n\n【任职要求】\n\n1、具备产品经理工作经验，有出海网赚、任务激励或内容激励类产品的实际项目经验，能够说明本人负责的业务环节及项目成果。\n\n2、熟悉任务体系、积分或奖励账户、激励广告、收益结算及提现等核心流程，能够设计完整的正常流程、异常状态和用户提示。\n\n3、具备独立负责产品模块或推动产品从零到一的能力，能够完成需求分析、方案设计、开发协同、上线验收及效果复盘。\n\n4、具备市场调研、竞品分析和用户研究能力，能够结合目标国家的用户习惯、设备条件及商业环境识别产品机会，推动本土化落地。\n\n5、能独立输出逻辑清晰的产品需求文档、业务流程及交互原型，具备数据埋点设计与验收能力，关注边界条件和异常处理。\n\n6、具备较强的数据分析与商业意识，能够综合广告收益、奖励支出、渠道成本及用户留存判断产品效果，避免仅以任务量或活跃人数衡量增长。\n\n7、具备良好的跨团队沟通和项目推进能力，能够明确优先级、协调资源并跟进交付，具有责任心和结果意识。\n\n8、英语能够支持海外竞品研究、资料阅读及基本工作沟通；了解用户隐私、广告平台规则及反作弊基本要求。\n\n【加分项】\n\n1、有海外短剧、网文、视频或其他内容消费产品经验。\n\n2、有“观看内容＋任务奖励＋广告变现”业务经验。\n\n3、有 Web 与 App 产品建设、跨端账户及权益协同经验。\n\n4、有海外广告变现、支付或提现服务对接经验。\n\n5、有邀请增长、用户分层、留存提升或反作弊策略设计经验。\n\n6、有不同国家或地区的产品本土化与增长验证经验。\n\n【面试说明】\n\n请准备1—3个本人参与或主导的产品项目，其中至少1个为出海网赚或任务激励类产品。可展示脱敏后的需求文档、流程、原型或数据成果，重点说明个人职责、关键决策及实际效果。", "cat": "产品"}, {"id": "340", "title": "短剧运营组长", "salary": "25k-35k", "location": "未明确", "jd": "【岗位介绍】\n\n负责国内及海外短剧业务的运营与增长，当前重点推进海外AI短剧网站的内容运营、社媒获客及用户转化。带领运营团队，与内容、产品、设计、技术及SEO人员协作，推动业务从上线准备走向持续运营。\n\n【岗位职责】\n\n1、根据业务阶段制定运营目标、执行计划及资源需求，明确国内外业务、不同渠道和项目的优先级，拆解团队任务并跟进结果。\n\n2、开展目标市场、用户及竞品调研，分析内容偏好、搜索需求、观看习惯和付费行为，提出市场切入、内容定位及本土化运营建议。\n\n3、负责短剧网站及App的内容运营，统筹剧目上架、分类标签、片名简介、封面包装、推荐位和更新排期，提升内容吸引力、观看深度及用户留存。\n\n4、负责海外社媒增长，重点推进X等平台的账号定位、矩阵分工、选题测试、内容发布及互动运营，持续获取有效流量并引导用户进入产品。\n\n5、结合业务需要拓展达人、社群、联盟及内容合作渠道，制定合作方案与预算，跟踪实际访问、注册及转化效果，持续优化渠道投入。\n\n6、协同SEO人员推进关键词研究、内容布局及页面优化，组织优质内容供给，跟踪搜索曝光、收录、自然流量及转化表现，坚持正规、可持续的运营方式。\n\n7、负责网站上线及日常运营的业务侧准备，明确内容、物料、用户流程和后台需求，协同产品及技术完成验收，跟进播放、注册、付费及用户反馈等问题。\n\n8、建立渠道到站内的运营数据体系，跟踪曝光、点击、有效访问、观看、注册、付费及留存，区分自然流量与付费合作效果，通过数据复盘调整运营策略。\n\n9、与编剧、导演及AI制作团队建立协作机制，提供热点、用户反馈和内容表现分析，明确切片、封面、文案及语言版本需求，推动内容生产与市场验证衔接。\n\n10、负责运营团队的任务分工、进度管理、培训及绩效反馈，使用项目看板、Bot和自动化工具完善账号、内容、素材及数据管理，提高执行效率。\n\n11、做好账号与站点资产管理，关注平台规则、内容版权及用户投诉，及时识别运营风险，并协调相关专业人员处理。\n\n【任职要求】\n\n1、具备3年以上互联网运营经验，有项目带队或团队管理经历，能够独立制定计划、协调资源并推动落地。\n\n2、有海外内容产品、网站或社媒的实际运营经验，能够展示从内容发布、用户获取到站内承接的完整案例；有短剧、小说、视频或订阅类产品经验优先。\n\n3、至少深入掌握一种自然流量增长方式，如X等海外社媒运营、SEO、达人合作或社群运营，能够说明具体方法、个人贡献和实际成果。\n\n4、具备网站或App运营基础，理解内容分发、用户路径、付费转化及留存，能够提出清晰的产品需求并参与业务验收。\n\n5、具备内容判断力，能够识别有传播潜力的题材、剧情片段及人物设定，对封面、标题、文案和本地化表达提出具体优化意见。\n\n6、理解SEO基本逻辑，能够与SEO及技术人员协作开展关键词、内容和页面优化，不依赖黑帽手段或侵权内容获取流量。\n\n7、具备数据分析和成本意识，能够明确指标口径、识别转化问题，评估渠道及活动效果，不以账号数量、发帖量或粉丝量替代业务结果。\n\n8、具备较强的执行和团队协调能力，能够结合人力、内容供给及技术排期确定优先级，及时处理阻碍，推动问题解决。\n\n9、具备基础英文阅读能力，能够借助翻译及AI工具理解海外平台信息、用户反馈，并完成日常运营工作，不要求英语口语流利。\n\n10、能够接受成人向短剧相关业务，理解国内外不同内容类型、平台及渠道需要采用差异化运营方式。\n\n【加分项】\n\n1、有北美市场短剧、小说、视频或成人向内容产品运营经验。\n\n2、有海外网站从0到1上线、冷启动及持续增长经验，个人站长或独立站运营背景亦可。\n\n3、有X账号矩阵实操经验，能够展示真实的自然流量及站外导流成果。\n\n4、有国内短剧平台、短视频账号或内容分销运营经验。\n\n5、有网赚类产品经验，熟悉任务激励、广告变现、奖励成本及用户留存。\n\n6、有达人合作、CPS分销、联盟营销或付费订阅运营经验。\n\n7、有使用AI、Bot及自动化工具提升内容生产、发布管理或数据复盘效率的案例。", "cat": "运营"}, {"id": "341", "title": "海外产品经理（短剧Web／App方向）", "salary": "25k-35k", "location": "未明确", "jd": "岗位介绍】\n\n负责海外短剧Web及App的产品规划、上线与持续迭代。现阶段以做大产品日活为核心目标，重点提升流量承接、用户首次观看、持续追剧及回访体验，协同流量和运营团队推动有效用户增长，并逐步完善商业化能力。\n\n【岗位职责】\n\n1、负责海外短剧Web及App的产品规划，结合业务阶段、目标市场及用户需求，确定核心功能、版本优先级和交付计划，推动产品从0到1上线及持续优化。\n\n2、围绕日活增长建立产品指标体系，拆解新增用户激活、存量用户留存及流失用户回流，识别影响活跃规模的关键问题，制定产品优化方案并验证效果。\n\n3、承接社媒、SEO、达人及其他渠道的用户流量，优化落地页、剧集详情页和播放路径，降低用户从点击进入到首次有效观看的流失。\n\n4、负责首页、分类、搜索、推荐、播放、续看、收藏及追剧等功能设计，结合内容更新、订阅提醒和回访机制，提升观看深度、访问频次及用户留存。\n\n5、规划主站、专题页、导航入口及多站点业务的产品结构，明确各入口的用户价值与承接路径，推动模板、内容管理及配置能力复用，提高上线和迭代效率。\n\n6、协同SEO及技术人员完善网站信息架构、页面配置、内部链接、移动端体验及加载性能，为自然搜索获客和用户浏览提供产品支持。\n\n7、统筹Web与App的跨端体验，设计账号、观看记录、收藏及用户权益的同步规则，优化跨端访问、应用承接和回流路径。\n\n8、建立渠道到站内的埋点与转化漏斗，明确日活、新增、有效观看及留存等指标口径，合理区分跨站、跨端用户，结合数据分析和对比测试持续优化产品。\n\n9、规划内容及运营后台，支持剧目上架、多语言管理、分类标签、推荐位、页面配置、消息触达及数据查询，提升运营效率。\n\n10、独立输出产品需求文档、业务流程、交互原型和验收标准，协调设计、开发、测试及运营团队，推进需求评审、开发上线和效果复盘。\n\n11、结合业务发展逐步完善试看、订阅、单集解锁及支付等商业化功能，设计订单、权益、取消和退款流程，兼顾用户体验与收入增长。\n\n12、协同相关团队落实应用上架、内容访问、隐私设置及第三方服务接入要求，识别影响上线和持续运营的产品问题并推动解决。\n\n【任职要求】\n\n1、具备3年以上互联网产品经验，有海外Web及App实际项目经历，能够独立负责完整产品或核心业务模块。\n\n2、有产品从0到1上线及上线后持续迭代经验，能够说明本人承担的职责、关键决策和实际业务成果。\n\n3、具备增长产品思维，理解日活由新增、留存及回流共同构成，有提升用户激活、观看深度、访问频次或留存的实际案例。\n\n4、熟悉内容产品的核心体验，能够围绕用户发现内容、开始观看、持续追剧及再次访问设计产品功能；有短剧、小说、视频或其他内容产品经验优先。\n\n5、具备网站产品设计能力，理解社媒及搜索流量的承接需求，能够设计适合不同来源用户的落地页及站内路径。\n\n6、理解Web与App的体验差异，具备移动端适配、跨端账号与数据同步、应用发布或相关协作经验。\n\n7、具备数据分析能力，能够制定埋点方案、明确指标口径、分析转化漏斗，区分流量变化与产品改动的影响，避免仅凭功能上线判断效果。\n\n8、能独立完成PRD、流程图和交互原型，综合用户价值、增长收益、开发成本及依赖条件确定需求优先级。\n\n9、具备较强的执行和跨团队沟通能力，能与流量、运营、内容、设计及技术团队协作，推动问题解决和产品按期交付。\n\n10、具备基础英文阅读能力，能够借助翻译及AI工具理解海外产品、平台资料和用户反馈，不要求英语口语流利。\n\n11、能够接受成人向短剧相关业务，理解不同内容类型、目标市场和分发渠道需要采用差异化产品方案。\n\n【加分项】\n\n1、有北美或其他海外市场短剧、视频、小说及成人向内容产品经验。\n\n2、有通过产品优化提升日活、用户激活率、留存或回访率的可量化案例。\n\n3、有SEO友好型网站、社媒落地页、Web-to-App及渠道归因相关产品经验。\n\n4、有多站点、页面模板、CMS及可配置运营后台的规划经验，能够平衡快速上线与后续维护成本。\n\n5、有推荐、搜索、追剧提醒、用户召回或多语言本土化经验。\n\n6、有海外支付、App内购、订阅及跨端权益设计经验。\n\n7、能够使用AI工具辅助需求分析、原型制作、数据分析及产品验证，并有实际应用成果。", "cat": "产品"}, {"id": "342", "title": "AI互动剧策划（剧情／叙事方向）", "salary": "15k-25k", "location": "未明确", "jd": "【岗位介绍】\n\n负责AI互动剧的选题、角色、剧情及互动体验策划，将故事创作与用户选择结合，打造有吸引力、参与感和持续体验价值的互动内容。重点欢迎游戏行业剧情策划、叙事策划、文案策划及游戏编剧背景的候选人。\n\n【岗位职责】\n\n1、根据产品定位与目标用户偏好，开展题材研究和选题策划，设计故事核心设定、世界观、角色关系及剧情发展方向。\n\n2、负责人物小传、故事大纲、章节剧情及对白创作，塑造有辨识度的角色，明确人物动机、关系变化与情绪推进。\n\n3、设计剧情分支、关键选择、触发条件和多结局，使用户行为能够影响后续情节、人物关系或信息获取，提升参与感与重复体验价值。\n\n4、将剧情与互动机制结合，规划探索、线索、任务、关系变化等叙事要素，平衡故事节奏、选择空间及制作成本。\n\n5、输出可执行的剧情脚本、分支流程图、条件配置及内容需求，明确不同路径的衔接和反馈，避免逻辑冲突、角色失真及剧情断点。\n\n6、与产品、AI制作、美术、配音及技术团队协作，将剧本转化为可落地的互动内容，参与样片评审、流程测试及上线验收。\n\n7、结合用户反馈和体验数据，分析关键节点流失、选择分布、剧情完成及重复体验情况，持续优化开场、节奏、分支与结局设计。\n\n8、使用AI工具辅助资料研究、创意发散、对白迭代及逻辑检查，沉淀角色设定、创作规范和内容资产，保障作品风格与人物表现一致。\n\n【任职要求】\n\n1、具备2年以上游戏剧情策划、叙事策划、文案策划或游戏编剧经验，有实际参与开发、上线或交付的项目。\n\n2、具备扎实的故事创作能力，能够独立完成人物设定、剧情大纲、章节脚本及对白，对冲突、悬念、节奏和情绪变化有清晰判断。\n\n3、理解互动叙事与线性故事的区别，能够设计有意义的选择及结果反馈，避免分支仅停留在台词变化或形式上的选项。\n\n4、具备基础游戏策划思维，能够将剧情转化为流程、状态、触发条件和配置规则，并清晰传达给制作与技术团队。\n\n5、具备用户视角，理解用户对角色、关系、探索和故事走向的期待，能够结合反馈调整内容，不仅依赖个人创作偏好。\n\n6、具备较好的视听表达能力，能够将心理活动和背景信息转化为动作、对白及画面，理解视频互动内容的呈现方式。\n\n7、具备良好的执行和协作能力，能够根据排期、资源及制作反馈调整方案，跟进内容修改与最终交付。\n\n8、愿意学习AI内容制作工具，能够判断生成内容的质量并进行修正；有AI工具实际应用经验者优先。\n\n【加分项】\n\n1、有互动影游、视觉小说、文字冒险、恋爱养成、悬疑解谜或其他强叙事游戏项目经验。\n\n2、有完整剧情线、多结局、角色关系系统或任务叙事设计经验。\n\n3、有游戏公司编剧经历，擅长人物塑造、对白及长线剧情，同时具备分支剧情设计能力。\n\n4、有AI角色、动态对话或生成式叙事项目经验，能够明确角色行为边界及剧情约束。\n\n5、有短剧、影视编剧、分镜或视频内容制作经验，能够兼顾故事吸引力与制作可行性。\n\n6、熟悉剧情编辑器、分支叙事工具或游戏引擎中的剧情配置流程。\n\n【面试说明】\n\n请提供1—3份可披露的代表作品，可包括游戏剧情、人物设定、章节脚本、分支流程图或互动作品，并注明个人职责及实际贡献。\n\n有分支作品的，请展示至少一处“用户选择—条件变化—后续结果”的完整设计；游戏编剧背景可重点提供角色及剧情作品，面试中进一步考察互动设计能力。", "cat": "AI / AIGC"}, {"id": "343", "title": "审计员", "salary": "远程：8K-10K", "location": "未明确", "jd": "一、岗位概述\n\n负责公司各类业务开支及渠道投放费用的审核与风险把控，确保资金使用真实、合理、合规、高效。重点负责播放器 App 项目相关渠道投放、市场推广及业务合作费用审核，并结合业务数据对投放效果进行分析评估，为公司降本增效和风险控制提供支持。\n\n---\n\n二、岗位职责\n\n1、开支审核与合规控制\n\n* 审核各部门提交的费用申请、合同、发票及付款凭证等资料；\n* 重点审核渠道投放费用、市场推广费用、商务合作费用等业务支出；\n* 核查费用真实性、合理性、预算执行情况及合规性，防范虚假、重复或异常支出；\n* 对异常费用进行风险预警，并提出整改建议。\n\n2、渠道投放审核\n\n* 负责渠道合作方资质审核及合作风险评估；\n* 审核渠道投放 ROI、转化率、留存率等核心运营指标；\n* 对渠道合作进行事前、事中、事后审核，形成审核意见及复盘报告，为续费、调整或终止合作提供依据。\n\n3、业务开支监控与数据分析\n\n* 定期统计、分析各类业务费用结构、占比及变化趋势；\n* 协助建立费用监控指标体系及风险预警机制；\n* 挖掘费用使用问题，提出降本增效及优化建议，为管理层提供数据支持。\n\n4、制度建设与流程优化\n\n* 协助制定及完善公司《开支审核管理制度》及相关流程；\n* 建立标准化费用台账、审核档案及复盘机制；\n* 配合开展费用合规培训，提高各部门费用管理意识。\n\n---\n\n 三、任职要求\n\n1. 本科及以上学历，财务、审计、会计、经济管理等相关专业优先；\n2. 具备良好的逻辑思维能力、数据分析能力及风险识别能力，能够独立完成审核分析工作；\n3. 工作认真细致，责任心强，原则性强，具备良好的职业操守及保密意识；\n4. 执行力强，学习能力强，能够主动推动工作落地并持续优化工作流程；\n5. 具备良好的沟通协调能力及团队协作意识，能够与业务、财务等部门高效协同；\n6. 吃苦耐劳，具备较强的抗压能力，能够适应快节奏工作及多任务处理；\n7. 对数据敏感，善于发现问题并进行分析，能够结合业务数据识别风险并提出可执行的优化建议；\n8. 熟练使用 Excel 等办公软件，能够完成数据整理、统计分析及审核报告编写；\n9. 具备良好的文字表达能力，能够独立撰写审核意见、分析报告及复盘总结；\n10. 综合素质和解决问题能力要强，要求能加强内部质检和技能提升。\n\n---\n\n四、加分项\n\n1. 具有互联网、App、广告、流量投放等行业财务审核、费用控制、审计或风控相关工作经验；\n2. 熟悉渠道投放、市场推广费用管理流程，具备 ROI、转化率、留存率等运营数据分析经验；\n3. 有 App 推广、广告投放、流量渠道或广告结算相关经验；\n4. 熟悉 SEO、ASO 或互联网流量运营模式；\n5. 熟悉 Power BI、SQL、Python 等数据分析工具，具备数据可视化能力；\n6. 有内控、审计、反舞弊、风险管理等相关工作经验；\n7. 熟悉 AI 自动化办公、工作流搭建或 AI 提效实践经验；\n8. 熟悉 ChatGPT、Claude、Gemini 等主流大语言模型，能够利用 AI 工具辅助数据分析、文档整理、报告编写及提升工作效率者优先", "cat": "职能"}, {"id": "344", "title": "初级会计", "salary": "", "location": "未明确", "jd": "Client Operations Officer \nApply\n\nRole Summary \nThe successful candidate will play a key role in ensuring that a portfolio of client companies operates smoothly on a day-to-day basis. You will be responsible for coordinating and delivering finance-related obligations, statutory filings and corporate governance requirements accurately and on time, in accordance with each client’s service agreement.\n\nKEY RESPONSIBILITIES\n- Deliver agreed service lines (bookkeeping, RTI, VAT and related filings) for a portfolio of client companies, to the service levels set out in their service agreements.\n- Support client governance: coordinating director/trustee sign-off, maintaining board minutes and statutory records, and keeping Companies House filings accurate and up to date.\n- Act as day-to-day liaison between the client company, our internal compliance and finance teams, and external auditors or lawyers.\n- Support periodic KYC/AML review updates for client companies and escalate anomalies promptly through internal procedures.\n- Monitor key contractual milestones (payment terms, notice periods, dispute timelines) and flag deviations early.\nRequirements\n- A degree or equivalent in accounting, finance or business administration; 1–3 years' relevant experience, ideally in an accountancy practice or corporate/trust services environment.\n- A relevant accounting qualification — fully or part-qualified AAT, ACCA or CIMA (or equivalent). Strong QBE candidates with solid bookkeeping/VAT/RTI experience are also considered.\n- Familiarity with UK company compliance basics (Companies House, VAT/RTI) is a strong plus.\n- Highly organised and detail-oriented, comfortable managing several clients and competing deadlines.\n- Fluent written and spoken English and Mandarin, confident reading English contracts and regulatory documents.", "cat": "职能"}, {"id": "345", "title": "高级会计", "salary": "", "location": "未明确", "jd": "Client Operations Officer \nApply\n\nRole Summary \nThe successful candidate will play a key role in ensuring that a portfolio of client companies operates smoothly on a day-to-day basis. You will be responsible for coordinating and delivering finance-related obligations, statutory filings and corporate governance requirements accurately and on time, in accordance with each client’s service agreement.\n\nKEY RESPONSIBILITIES\n- Deliver agreed service lines (bookkeeping, RTI, VAT and related filings) for a portfolio of client companies, to the service levels set out in their service agreements.\n- Support client governance: coordinating director/trustee sign-off, maintaining board minutes and statutory records, and keeping Companies House filings accurate and up to date.\n- Act as day-to-day liaison between the client company, our internal compliance and finance teams, and external auditors or lawyers.\n- Support periodic KYC/AML review updates for client companies and escalate anomalies promptly through internal procedures.\n- Monitor key contractual milestones (payment terms, notice periods, dispute timelines) and flag deviations early.\nRequirements\n- A degree or equivalent in accounting, finance or business administration; 1–3 years' relevant experience, ideally in an accountancy practice or corporate/trust services environment.\n- A relevant accounting qualification — fully or part-qualified AAT, ACCA or CIMA (or equivalent). Strong QBE candidates with solid bookkeeping/VAT/RTI experience are also considered.\n- Familiarity with UK company compliance basics (Companies House, VAT/RTI) is a strong plus.\n- Highly organised and detail-oriented, comfortable managing several clients and competing deadlines.\n- Fluent written and spoken English and Mandarin, confident reading English contracts and regulatory documents.", "cat": "职能"}, {"id": "346", "title": "产品运营专员", "salary": "", "location": "工作地点        远程 / 伦敦（可协商）", "jd": "岗位说明书（JD）— 合规运营专员\n岗位名称        合规运营专员\n所属部门        合规部\n工作地点        远程 / 伦敦（可协商）\n汇报对象        合规部经理\n岗位概述\n负责产品在海外市场的合规落地与发行运营，覆盖海外主体资质管理、应用商店上架与海外社交媒体运营，保障产品合法上线并实现用户增长。\n主要职责\n1. 海外主体资质管理\n•管理海外运营主体的公司资料、开发者账户及商户资质，维护其持续有效\n•跟进各平台及目标市场对内容发行的资质要求（年龄分级、内容审查、数据保护、广告合规），落实整改\n•对接外部律所、会计师及服务商，处理注册、续期、变更及审核问询\n2. App 上架与商店运营\n•负责 App Store、Google Play 及其他海外渠道的账户开设、应用提交、版本更新与审核沟通\n•编写并优化商店页面（ASO）：标题、描述、关键词、截图与视频素材的本地化\n•处理内购/订阅配置、税务与支付设置，跟踪下架与政策变更风险\n3. 海外社媒运营\n•搭建并运营 TikTok、YouTube、Instagram、X 等海外账号，制定内容日历与发布节奏\n•结合内容策划切片、预告、话题与互动活动，提升曝光与转化\n•监测数据（曝光、互动、下载归因），产出周报/月报并提出优化方案\n•对接海外 KOL、社群及投放团队，协同推进增长\n任职要求\n•本科及以上学历，3年以上海外发行、出海产品运营或海外社媒运营经验；有短剧/网文/游戏出海经验优先\n•熟悉 App Store 与 Google Play 上架流程、审核规则及 ASO 方法\n•了解海外内容合规要点（GDPR、年龄分级、平台社区准则），有海外主体或开发者账户管理经验\n•英语可作为工作语言（书面与口头），具备第二外语者优先\n•熟练使用 AI 工具辅助内容生产与运营，能清晰描述与 AI 协作的方法\n•结果导向，跨时区协作与多任务处理能力强", "cat": "运营"}, {"id": "347", "title": "财务管理（股权）", "salary": "", "location": "未明确", "jd": "JOB DESCRIPTION\nCorporate Finance & Structuring Manager\nVersion 1.1 (global recruitment) ·\nPurpose of the role\nThe company operates a network of independent businesses across enterprise technology, SaaS products, professional services and digital content, with entities in several jurisdictions and further entities planned across Europe, Asia and the Middle East. The role owns the financial modelling and structuring workstream behind that network: multi-entity financial planning, cap table and shareholding design, and the financial and administrative set-up of new entities in any of the network’s jurisdictions. It sits between the finance function and external legal and tax advisers in each country, converting strategic decisions into modelled options, documents and filings.\nKey responsibilities\n1. Multi-entity financial planning (approx. 40%)\n–Maintain the network-wide financial ledger by business unit and entity across jurisdictions and currencies: revenue, cost, tax, working capital and free cash flow.\n–Model profit retention and distribution paths for each entity, including local corporate tax, withholding tax, dividend rules and distributable reserves in the relevant jurisdiction.\n–Prepare cash and capital allocation proposals for board and shareholder review.\n–Support annual budgets, quarterly reforecasts and management reporting across entities.\n\n2. Shareholding and equity design (approx. 30%)\n–Build and maintain cap tables for each entity and project vehicle, including contributions, valuation, dilution, employee equity and exit scenarios.\n–Model shareholding options for new entities, joint projects and external investment rounds; prepare comparison papers for decision-makers.\n–Translate agreed shareholding terms into instructions for local lawyers (shareholders’ agreements, constitutional documents, share allotments) and review the financial terms of draft documents.\n–Maintain the shareholding and governance register — shareholders, directors, beneficial-ownership filings, share classes, reserved matters — in the format each jurisdiction requires.\n\n3. New entity set-up and structuring support (approx. 20%)\n–Prepare location and structure assessments for new entities: substance and running costs, banking feasibility, licensing requirements, full-chain tax effect (source-country tax, cross-border payments, recipient-country rules).\n–Coordinate incorporation, bank account opening, tax registrations and statutory filings with company secretaries, registered agents and advisers in each jurisdiction.\n–Support transfer pricing documentation for intra-network service agreements (pricing method, cost base, local file inputs) under OECD-based rules.\n\n4. Adviser coordination and documentation (approx. 10%)\n–Brief and manage external legal, tax and corporate services providers in multiple countries; track advice, fees and deadlines.\n–Keep structure charts, entity registers and the master structuring workbook current.\n–Contribute to internal policies on shareholding governance, related-party transactions and distributions.\n\nBoundaries of the role\nLegal opinions, tax opinions and final legal documents are provided by external professional firms in each jurisdiction. The role prepares the analysis, options and instructions, and coordinates execution; it does not give legal or tax advice.\nEssential requirements\n–Professional accounting qualification or finalist status (ACCA, ACA/CA, CIMA, CPA, HKICPA, ISCA, or equivalent).\n–3–6 years in corporate finance, transaction services, corporate tax structuring, or a finance lead role in a multi-entity or start-up environment.\n–Strong Excel financial modelling: three-statement models, cap tables, scenario analysis; tidy, auditable workbooks; comfortable working in multiple currencies.\n–Working knowledge of corporate tax, dividend and distribution rules and company registry filings in at least one of the network’s jurisdictions, and demonstrated ability to learn the rules of others.\n–Ability to read shareholders’ agreements and constitutional documents and extract the financial and control terms.\n–Clear written English; able to produce concise decision papers.\nDesirable\n–Hands-on experience with entities in two or more of: United Kingdom, Ireland, Cyprus, Czech Republic, Singapore, Hong Kong, UAE, mainland China.\n–Exposure to transfer pricing, withholding tax, participation exemption and foreign-sourced income rules.\n–Familiarity with company secretarial practice (share allotments, beneficial-ownership registers, board minutes) or an equivalent governance qualification.\n–Experience supporting an external investment round or joint venture from the company side.\n–Working-level Mandarin Chinese, given the network’s counterparties; not essential.\nCompetencies\nStructured thinking; accuracy under document-heavy workloads; comfort with ambiguity and multi-jurisdiction rules; discretion with shareholder-level information; independent coordination of external advisers across time zones.", "cat": "职能"}, {"id": "348", "title": "财务报表会计（中文流利）", "salary": "£60,000–£75,000 ＋ 奖金", "location": "未明确", "jd": "财务报表会计（中文流利）\nFinancial Reporting Accountant (Mandarin Speaking)｜同步投放：Management Accountant (Mandarin Speaking)\n伦敦（混合办公）· 全职 · £60,000–£75,000 ＋ 奖金\n招聘一名持证会计，负责多主体、多币种业务的数据归集、口径制定、月结与核对，并裁定口径分歧。本岗位不涉及付款、审批及交易拦截，职责为确定并留痕正确数字，考核以数据一致性为准。\n工作内容\n•        向各主体对接人及业务、财务、人力部门收集业绩与财务数据：约定格式与时限，跟进催收，解答疑问。\n•        制定并维护填报规则（分类、汇率、截止日、主体间划转），使各主体按同一基准填报。\n•        按固定截止日完成多主体月结。\n•        将各主体收支报表与后台、支付通道、结算数据逐笔核对，差异登记并关闭。\n•        每月组织多方核对，向管理层出具差异报告。\n•        为薪资、提成、激励核对及风控、人力报表提供经核实的数字；裁定上报的分歧。\n我们看重的素质\n•        沟通协作：能按时从各部门取得数据，坚持准确性的同时维持良好关系。\n•        责任心：对经手的每个数字负责，经得起追问。\n•        细致：能在大量数据中发现异常并追查原因。\n•        可靠：守节点；错误早报、一次改对。\n•        判断与独立：依证据决断，顶得住压力。\n•        操守：数据保密，恪守职责边界。\n•        文档习惯：把方法写成他人可执行的规范。\n任职要求\n•        ACCA / ACA / CIMA 持证，或处于最后阶段。\n•        在多主体或多币种业务中主持过月结和对账。\n•        能制定填报口径并写成他人可执行的文档。\n•        沟通清晰，能组织跨部门的数据收集。\n•        Excel 和 Google Sheets 熟练；日常使用 AI 工具并能判断其对错。\n•        中文读写及口语流利；具有英国工作许可。\n加分项\n•        会 SQL；四大审计出身；支付、金融科技、iGaming 或电商背景；接触过加密货币结算。\n待遇\n•        底薪 £60,000–£75,000（按经验定），酌情奖金，养老金，25 天年假另加公众假期。\n•        伦敦，混合办公。月初月结为忙季，需一定弹性，偶有晚间与其他时区同事衔接。\n申请方式\n提交简历，并简述一项由你亲自完成的报表、对账或流程改进：原有问题、所做改动、验证方式。", "cat": "职能"}, {"id": "349", "title": "管理会计专员（中文流利）", "salary": "£32,000–£40,000 ＋ 奖金", "location": "未明确", "jd": "管理会计专员（中文流利）\nAssistant Management Accountant (Mandarin Speaking)｜同步投放：Finance Analyst (Mandarin Speaking)\n伦敦（混合办公）· 全职 · £32,000–£40,000 ＋ 奖金\n我们招聘一名专业基础扎实、细心负责、执行力强的管理会计专员，加入覆盖多主体、多币种业务的报表与对账团队。工作核心是数据收集、核对和统计，需要与各部门频繁沟通协作。欢迎优秀应届毕业生。表现优秀者，公司报销专业资格考试费用，并有机会成长为该职能负责人。\n工作内容\n•向各主体对接人和相关部门收集数据：约定内容与时限，跟进催收，解答疑问。\n•将各主体收支报表与后台、支付、结算数据核对，差异逐笔登记并关闭。\n•按既定口径和固定截止日编制报表、完成月结，含主体间划转和汇率折算。\n•向财务、人力提供一致数据，含工资表涉及的业绩、提成、激励数据复核。\n•保留数据来源与更正依据；口径争议提交负责人确认。\n本岗位侧重统计、报表与核对；付款、审批及风险判定由相应部门负责。\n任职要求\n•会计、金融或数理类专业本科及以上（2:1 及以上），会计基础扎实，理解复式记账和对账逻辑。\n•沟通协作：能与各部门顺畅对接，跟进催收直到数据到位。\n•细心、逻辑清晰：有自查习惯，能说明每个数字的依据。\n•执行力强：按时完成、及早反馈、错误一次改对。\n•Excel 或 Google Sheets 熟练；会用 AI 工具并能判断其对错。\n•中文读写及口语流利；具有英国工作许可。\n加分项\n•在考 ACCA / CIMA / ACA 或持有 AAT；财务、审计或对账经历；接触过支付、金融科技、iGaming 或电商业务。\n•管理潜质：实习或项目中承担过责任、协调过他人工作。\n待遇与成长\n•底薪 £32,000–£40,000（按经验和考试进度定），奖金，养老金，25 天年假另加公众假期。\n•表现优秀者享考证支持：报销 ACCA / CIMA 课程与考试费，带薪备考假。\n•薪资按表现及考试进度评审；具备能力者有机会成长为该职能负责人。\n申请方式\n提交简历、考试记录，并简述一项体现细心或执行力的工作（学校项目、实习均可）：问题、做法、如何验证。", "cat": "职能"}];
const CATS = ["AI / AIGC", "运营", "商务 / 市场", "内容", "产品", "设计", "技术 / 数据", "职能", "测试 / 运维", "客服 / 支持", "其他"];

const catCounts = {};
JOBS.forEach(j => { catCounts[j.cat] = (catCounts[j.cat]||0) + 1; });

let activeCat = null;
try { activeCat = localStorage.getItem('omi_jobs_cat') || null; } catch(e) {}

const chipRow = document.getElementById('chipRow');
function renderChips(){
  const chips = [{cat:null,label:'全部',n:JOBS.length}].concat(
    CATS.filter(c => catCounts[c]).map(c => ({cat:c,label:c,n:catCounts[c]}))
  );
  chipRow.innerHTML = chips.map(c => `
    <div class="chip ${activeCat===c.cat ? 'active':''}" data-cat="${c.cat ?? ''}">
      ${c.label} <span class="n">${c.n}</span>
    </div>
  `).join('');
  chipRow.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-cat');
      activeCat = v === '' ? null : v;
      try { activeCat ? localStorage.setItem('omi_jobs_cat', activeCat) : localStorage.removeItem('omi_jobs_cat'); } catch(e) {}
      renderChips();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(escapedText, q){
  if (!q) return escapedText;
  const re = new RegExp('(' + escapeRegex(q) + ')', 'ig');
  return escapedText.replace(re, '<mark>$1</mark>');
}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const statsEl = document.getElementById('stats');

function render(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = JOBS.filter(j => {
    if (activeCat && j.cat !== activeCat) return false;
    if (!q) return true;
    return j.title.toLowerCase().includes(q) || j.jd.toLowerCase().includes(q);
  });

  // 有关键字时:标题命中的排在前面(最相关),仅描述里命中的排后面,
  // 且给后者打上"命中于描述"的提示,避免看起来像误匹配。
  if (q){
    filtered = filtered
      .map((j, idx) => ({ j, idx, titleHit: j.title.toLowerCase().includes(q) }))
      .sort((a, b) => {
        if (a.titleHit !== b.titleHit) return a.titleHit ? -1 : 1;
        return a.idx - b.idx; // 稳定排序,组内保持原顺序
      })
      .map(x => x.j);
  }

  statsEl.textContent = `显示 ${filtered.length} / ${JOBS.length} 个职位`;

  if (filtered.length === 0){
    list.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  list.innerHTML = filtered.map(j => {
    const titleHit = q ? j.title.toLowerCase().includes(q) : false;
    const jdOnlyHit = q && !titleHit;
    const titleHtml = highlight(escapeHtml(j.title), q);
    const jdHtml = highlight(escapeHtml(j.jd), q);
    return `
    <div class="card">
      <div class="card-top">
        <span class="card-tag">${escapeHtml(j.cat)}</span>
        <span class="card-id">#${escapeHtml(j.id)}</span>
      </div>
      <h3>${titleHtml}</h3>
      <div class="badge-row">
        ${j.salary ? `<span class="salary">${escapeHtml(j.salary)}</span>` : ''}
        ${j.location ? `<span class="location">📍 ${escapeHtml(j.location)}</span>` : ''}
        ${jdOnlyHit ? `<span class="card-tag jd-match">命中于描述</span>` : ''}
      </div>
      <div class="jd" id="jd-${j.id}">${jdHtml}</div>
      <div class="card-actions">
        <button class="toggle-btn" data-id="${j.id}">展开全文 ▾</button>
        <div class="right-actions">
          <button class="copy-btn" data-id="${j.id}">📋 JD复制</button>
          <a class="apply-btn" href="https://t.me/y666899y" target="_blank" rel="noopener">投递 / 咨询 ↗</a>
        </div>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const jd = document.getElementById('jd-' + btn.getAttribute('data-id'));
      const isExpanded = jd.classList.toggle('expanded');
      btn.textContent = isExpanded ? '收起 ▴' : '展开全文 ▾';
    });
  });

  list.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const job = JOBS.find(j => String(j.id) === String(id));
      if (!job) return;
      const parts = [job.title];
      if (job.salary) parts.push(job.salary);
      if (job.location) parts.push('📍 ' + job.location);
      parts.push('');
      parts.push(job.jd);
      const text = parts.join('\n');
      copyText(text, btn);
    });
  });
}

function copyText(text, btn){
  const showCopied = () => {
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onDone){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); onDone(); } catch(e) {}
  document.body.removeChild(ta);
}

document.getElementById('searchInput').addEventListener('input', render);

renderChips();
render();
</script>
