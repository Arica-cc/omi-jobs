 AI 视频生成工具，精通其一并了解各家差异：Seedance 2.0、即梦、可灵（Kling）、Runway、Vidu 等。\n- 熟练使用 AI 图像工具完成角色设定与关键帧：Midjourney、Nano Banana、Seedream、Stable Diffusion / ComfyUI 等。\n- 成体系的提示词工程能力：角色锁定、跨镜头一致性控制、风格统一与参数化复用，而非靠运气抽卡。\n- 掌握后期剪辑与合成：剪映 / Premiere / DaVinci Resolve / After Effects 熟练其一，能完成 take 筛选到成片的闭环。\n\n【加分项】\n- 有完整 AI 短剧 / AI 电影从 0 到交付的主导经验。\n- 有声音设计、配乐或 AI 配音（如 ElevenLabs）的实操能力。\n- 熟悉 ComfyUI 工作流搭建、LoRA 训练或自定义节点。\n- 带过人或牵头过小团队产出，有把流程标准化、可复制的经验。\n- 在 AI 影视 / 短片领域有公开作品、获奖或一定影响力。\n\n【我们提供】\n- 薪资：18K–24K，具体以面试评定及实操结果为准。具备独立带组交付能力，或有获奖代表作者，薪资可一事一议。\n- 年终奖：按公司经营情况与个人绩效发放。\n- 明确的成长通道：本岗按组长 / 创意负责人储备培养，路径清晰、不画饼。\n- 公司提供全套 AI 生产工具账号与算力资源，不让你自费会员。\n- 工作地点：[城市占位]　｜　公司：[公司名占位]\n\n【成长路径】\n高级 AIGC 创作岗 → 创意组长 / 创意负责人 → 创意总监\n\n投递请附：个人作品集 / showreel + 硬门槛证明材料。任职期间使用公司资源、为公司项目产出的 AI 作品及提示词资产，知识产权归公司所有。", "cat": "内容与创作"}, {"id": "3", "title": "AIGC 视频生成师", "salary": "12K-22K", "location": "", "jd": "基础 AIGC 影像创作岗（执行）｜带成长通道，定向通往高级创作岗\n\n【团队定位】\n我们是一支工业化运作的 AI 影视内容生产团队，主做 AI 短剧，用 AIGC 工具批量出片。这不是「试试 AI 能不能拍片」的实验室，而是有完整流水线的出片体系，每个环节专人专责，跨镜头、跨集的视觉一致性和出片效率是生命线。\n\n这个岗位是流水线上的执行主力。你的任务是把别人定好的镜头、风格、角色，又快又稳地变成可用的画面与片段——以高质量执行打基础，配套清晰的成长路径通向高级创作岗。\n\n【岗位职责】\n- 按分镜批量出图 / 出片：根据导演与分镜师给定的镜头表与提示词，用 Midjourney / 即梦 / Nano Banana / Seedream 等批量产出画面素材，按短剧拍摄节奏完成每个镜头需要的备选量。\n- 跑视频生成与续跑：用 Seedance 2.0 / 即梦 / 可灵等执行视频生成、首尾帧续跑、镜头延长，盯住生成队列，处理失败重跑。\n- 提示词微调与返工：在既定风格与角色设定框架内迭代提示词——景别、动作、光线、镜头不对就改了重跑，单条镜头出可用 take 直至导演验收通过，不出一版就交差。\n- take 初筛：对大量 take 做第一轮筛选，剔除崩坏、漂移、穿帮、不合分镜的废片，把可用候选整理给上一级复筛。\n- 整理角色 / 场景资产：维护角色设定图、场景参考、风格参考（sref / 锁脸图 / 色卡）资产库，保证跨集调用拿到的是对的那一版。\n- 命名与归档规范：严格按团队约定命名、分版本、归档，记录每条镜头的提示词参数与 seed，保证任何人都能快速找到对应镜头的对应版本。\n- 基础剪辑合成：用剪映 / Premiere / CapCut / DaVinci 做拼接、套底、对轨、初剪，配合后期完成合成。\n- 配合声音与后期：按声音设计和后期要求对齐、补、改素材，把链路上下游接顺。\n\n【任职要求】\n\n硬门槛（必须满足）\n- 1–2 年相关出片经验；或应届 / 转行但有拿得出手的个人作品（短片、剪辑、AI 出图出片、设计、摄影作品集均可），能提交本人 AI 作品证明。\n- 审美与镜头常识在线：看得懂景别、构图、光线，分辨得出崩坏、漂移、穿帮、廉价感，知道什么叫「这条废了」。（与「只会抽卡」的真正分界线，不满足直接 pass。）\n- 至少熟练使用一类 AI 图像工具 或 一类 AI 视频工具，上手即用，不是只看过教程。\n- 会基础剪辑：剪映 / Premiere / CapCut / DaVinci 任一能独立完成拼接、对轨、初剪。\n- 扛得住量：能接受批量、重复、需要耐心的生产工作，出片高峰期顶得住节奏。\n- 肯打磨、守规范：愿意为一个镜头反复返工，严格执行命名、版本、归档约定。\n\n软要求\n- 学习速度快：AI 工具半年一换代，你得能自己看文档、追新模型。\n- 沟通顺畅：能准确理解导演和分镜师意图，做不到的地方主动反馈。\n- 有责任心：交出去的素材自己先过一遍，不把废片当成品往上递。\n\n【加分项（有则更好，非必须）】\n- 有短视频 / 网络短剧 / 广告片的实际出片或参与经验。\n- 懂一点分镜、摄影或镜头语言。\n- 投过 AI 影展 / AI 影像比赛，或有公开发布的 AI 影像作品。\n- 熟悉提示词工程，能自己拆解和复现一种风格。\n- 有美术、设计、摄影、动画相关背景（科班加分，但非门槛）。\n\n【我们提供】\n- 薪资：10K–15K，具体以面试评定及实操结果为准。能力梯度参考：10–13K 对应能独立完成单条分镜落镜与抽卡迭代；13–15K 对应能独立交付完整短剧的画面层（落镜 + 出片 + 粗剪）。晋升高级岗即进入 18K+ 区间。\n- 年终奖：按公司经营情况与个人绩效发放。\n- 真实项目、真实出片量——你做的东西会被剪进真正交付的片子，不是练手 demo。\n- 工业化工作流和现成的提示词规范、资产体系，有方法可依。\n- 公司提供全套付费 AI 图像 / 视频工具账号与算力，不用自费会员。\n- 老带新：高级创作岗和导演带着你过片、讲为什么这个镜头不行。\n- 工作地点：[城市占位]　｜　公司：[公司名占位]\n\n【成长路径】\n基础 AIGC 影像创作岗 → 高级 AIGC 创作岗（组长 / 创意负责人储备）\n1. 稳定执行期（0–6 个月）：出图出片、take 初筛、资产归档做到又快又稳又规范。\n2. 质量进阶期（6–18 个月）：从「执行别人的镜头」到「对单条镜头质量负责」，提示词工程从微调走向独立设计单镜头解法。\n3. 创意起步期（18 个月以上）：参与分镜落镜、风格设定、跨镜头一致性把控，能带新人过片，向高级岗分水岭靠拢。\n\n走到那一步，对应的就是 18K–24K 的高级 AIGC 创作岗。\n\n投递请附简历 + 个人作品集 / 代表作（务必附作品）。任职期间使用公司资源、为公司项目产出的 AI 作品及提示词资产，知识产权归公司所有。", "cat": "内容与创作"}, {"id": "4", "title": "编剧 / 剧本策划 (Screenwriter)", "salary": "12~18k", "location": "远程，可国内办公", "jd": "你是整条内容流水线的叙事源头——所有导演的分\n镜拆解、视频团队的画面生成，都建立在你输出\n的剧本之上。我们需要的不是\"会写字的人\"，而\n是一个深刻理解戏剧结构、角色弧光与情绪节奏\n的叙事工程师。你将为 AI 生产管线提供高质量、\n高密度、结构化的剧本原料，直接决定最终内容\n的叙事品质上限。\n剧本创作与改编（核心职责）\n独立完成原创短剧/长篇剧本的策划与写\n作，或基于现有网文 IP / 小说素材进行影视\n化改编。\n输出的剧本需遵循标准化格式（含场景描\n述、角色行动、台词、情绪标注等结构化\n信息），确保导演和视频生成团队可直接进\n行视觉化转制。\n1.\n叙事结构与节奏把控\n精准控制\"钩子-冲突-反转-高潮\"的戏剧节\n拍，尤其对短剧/竖屏剧的前3秒钩子设计\n和每集尾部悬念有极强的把控力。\n设计并维护角色弧光、人物关系网络、世界\n观设定等叙事资产，确保长线剧集的逻辑自\n洽与情感连贯。\n2.\n跨职能协作\n与导演紧密配合，在分镜转化阶段提供叙事\n意图说明与情绪指导。\n参与成片审阅，从叙事角度判断画面节奏、\n台词落点、情绪传递是否到位。\n3.\n硬性要求：\n✅ 专业影视剧集制作经验——有网剧、短剧、\n电影、动画剧集等项目的编剧/编审从业经历，\n深刻理解\"剧本是拍给镜头看的\"这一底层逻辑。\n✅ 叙事类文学创作或编辑经验——有网络小说\n写作（签约作者优先）、出版文学编辑、或叙事\n类内容策划的实际产出与发表记录。\n✅ 极强的戏剧结构感与对白功底——能写\n出\"角色说人话\"的台词，而非 AI 味浓重的书面\n腔。\n加分项：\n⭐ 熟练使用 AI Agent 工具辅助创作——如 \nAntigravity、Claude Code、Grok Build 等 AI \n编程/写作代理，能通过 AI 工具高效完成大纲\n生成、角色设计、多版本剧本迭代等工作。\n⭐ SillyTavern / NovelAI 深度玩家——熟悉角\n色卡（Character Card）、世界书（Lorebook）、\nSystem Prompt 等配置，理解如何通过精细化\n提示词控制 AI 的叙事输出风格与角色一致性。\n⭐ 有内容的写作经验，了解不同\n平台和地区的尺度红线与合规表达技巧。\n⭐ 熟悉当前热门网文品类（系统流、反派流、\n穿书流、修仙后宫等）的叙事套路与读者爽点。\n⭐ 有海外短剧（H5 矩阵、ReelShort 等）的剧\n本写作或改编经验。\n面议（根据经验与作品，提供行业有竞争力的待\n遇）\n投递说明：请附上已发表/已制作的剧本样\n本、小说作品链接或叙事类作品集。", "cat": "内容与创作"}, {"id": "5", "title": "研发工程师（AI 陪伴产品方向）", "salary": "20-26k", "location": "远程，可国内办公", "jd": "把已经跑通的中文实时语音原型，做成能长期使用、主动但不越界、可持续演进的 AI 陪伴产品。我们不缺会接 API 的人，缺能对角色体验、完整链路和工程结果负责的人。\n\n一、我们在做什么\n我们在做一款面向成年用户的中文 AI 陪伴产品。项目不是 PPT 阶段：ASR → 角色模型 → 动态语音合成的实时链路已经跑通，支持流式对话与打断，并已有自动测试、逐轮指标和固定评测集。当前优先完成 P0 可靠性验收，随后推进 P1 长期记忆与关系连续性，以及 P2 实时多模态 / Avatar 旁路 POC。\n当前产品聚焦一对一语音陪伴；未来底层能力需要能够演进到文本、语音 / 视频通话、剧情模式、主动消息、群聊与用户自建角色，但不会为了功能数量牺牲长期陪伴质量。\n现有模型与供应商是可复现的技术基线，不是永久绑定。我们真正关心的是：听完整、听得懂、像同一个人、说得自然、记得准确且可控，并且在需要时能合理拒绝。\n二、什么叫“好的 AI 陪伴”\n        •        角色一致：根据角色设定稳定表达，长对话中不随意改身份、价值观、关系和语言风格。\n        •        主动而不打扰：不只被动回答，能结合上下文、关系状态和时间信息自然带节奏；主动消息有触发条件、频控和失效时间。\n        •        有情绪与共情：能感知用户情绪变化，并让内容、语气、节奏和声音表演一致，而不是只输出安慰套话。\n        •        有边界：不会无脑赞同、顺从或诱导依赖，能按照角色、关系阶段与安全规则做自然且一致的拒绝。\n        •        丰富但不失控：降低重复和固定 Pattern，能支持密聊、剧情等不同交互模式，同时保持事实、逻辑和人设约束。\n        •        记忆可控：区分短期上下文、用户画像、事件记忆与关系事件；记忆有来源、可纠正、可删除、可隔离。\n三、你将负责\n        •        实时交互链路：优化音频采集与降噪、VAD / ASR、流式生成、TTS、WebSocket / RTC、打断、回声、编解码、延迟和失败恢复。\n        •        角色与对话系统：建设角色模版 / Profile、上下文编排、结构化输出和对话状态；持续提升人设稳定、主动性、情绪共鸣、合理拒绝与内容丰富度。\n        •        记忆与关系系统：建设短期 / 长期记忆、用户画像、RAG / 向量检索和关系状态机，完成来源追踪、冲突处理、纠正、删除与多身份隔离。\n        •        多模型 / Agent 编排：按需要拆分密聊、剧情、创作辅助、关系判断、记忆召回和群聊中控等能力；不把所有问题都塞进一个 Prompt 或一次模型调用。\n        •        多端与多模态演进：支撑 Web、PC、移动端的 IM / 实时音视频接入；以旁路方式验证端到端语音、视频理解、Avatar 与音画同步，不让视觉层拖垮主对话链路。\n        •        评测与数据闭环：把人设、主动性、共情、拒绝、重复率、记忆准确性等主观体验转成固定样本、人工量表和版本化指标，并维护 P50 / P95、失败样本和真实会话验收。\n        •        技术与供应商演进：抽象 ASR、LLM、TTS、记忆、审核和实时会话接口；完成小规模旁路 POC、变量隔离 A/B、灰度、降级和回退。\n        •        产品化工程：处理配置、密钥、权限、日志、监控、会话隔离、异常重试、成本和可复现部署，让系统不依赖某个人手工救火。\n        •        安全与隐私：把 AI 标识、成人边界、内容审核、反依赖、极端情绪处理、数据最小化与删除闭环写进产品能力。\n四、硬性要求\n        •        成熟项目经验：至少 1 个你深度参与、能够现场演示的成熟项目。公司项目、创业项目、开源项目或个人项目都可以；是否名企、是否科班不是第一筛选项。\n        •        后端与实时工程：以 Python 为主要开发语言，并熟悉异步服务、HTTP / WebSocket、流式处理、状态管理、并发、异常恢复和第三方 API 集成。\n        •        LLM / Agent 实战：理解系统提示、角色模版、上下文、工具调用、结构化输出、RAG / 记忆、会话状态、多模型编排及其失败模式，不把“能聊起来”当作产品完成。\n        •        低延迟系统经验：做过语音、音视频、IM、机器人或其他至少一类实时交互系统；能拆清端到端延迟、测量口径、网络与设备问题。\n        •        数据与工程基础：能使用关系型 / 文档型数据库、缓存、对象存储或向量数据库中的若干项，并能建立日志、指标、测试、回归、灰度与回退。\n        •        产品与安全判断：能从用户体验反推技术优先级，理解陪伴产品的人设、关系、主动性、隐私与情感安全边界。\n        •        持续技术演进：对新模型、新框架、新协议和新交互有长期热情；能够读官方资料、亲手验证、形成结论，并在证据不足时克制上线。\n五、什么叫“成熟、可展示的项目”\n个人项目完全认可，但必须满足以下大部分标准：\n        •        有明确用户或使用场景，完成了从输入到结果的闭环，并被重复使用或持续迭代。\n        •        能现场运行 Demo，或提供可核验的录屏、仓库、版本记录、部署记录等替代证据。\n        •        能打开关键实现，讲清架构、本人贡献、核心取舍，以及为什么没有选另外一种方案。\n        •        有真实指标、测试、日志或用户反馈；能说出至少一次严重失败、定位过程和修复结果。\n        •        项目当前仍可运行；若受账号或环境限制，也能用完整证据说明当时确实跑通过。\n课程作业、教程复刻、只有 UI 的套壳、一次性 Happy Path Demo、只放截图、或无法说清本人贡献的团队成绩，不算成熟项目。\n\n六、紧跟新技术：这是岗位机制，不是口号\n投递时请附最近 6 个月你主动研究并验证的一项新技术：它解决什么问题、你做了什么最小实验、与什么基线比较、质量 / 延迟 / 稳定性 / 成本 / 安全结果如何，以及最终为什么被采用或被否决。我们看的是技术判断，不是资讯转发量。\n        •        持续扫描：长期跟踪实时语音、端到端音视频模型、LLM / Agent、记忆、RAG、Avatar、Eval 与安全技术的官方发布、论文和工程实践。\n        •        固定沉淀：入职后按月更新技术雷达，记录能力变化、成熟度、适用场景、迁移成本与风险；每季度至少完成 1 个可复现的小型 POC。\n        •        基线决策：任何新技术进入主链路前，都必须和当前基线做变量隔离对照；至少同时看用户体验、P95 延迟、稳定性、成本、隐私与回退难度。\n        •        可逆上线：通过适配层、开关、灰度与版本记录接入新方案；达不到门禁就保留旧方案并记录否决原因。\n        •        主动分享：把实验脚本、数据口径、失败样本和结论沉淀为团队可复用资产，而不是只在个人电脑上“跑通过一次”。\n追新技术不等于永远用最新版本。真正的要求是：对变化保持兴奋，愿意亲手试；对生产保持克制，敢用证据否决。\n\n七、加分项\n        •        做过 VAD、流式 ASR / TTS、全双工语音、RTC、端到端语音 / 音视频模型、音频设备、回声与打断。\n        •        做过长期记忆、RAG、用户画像、关系状态机、群聊中控、主动消息或剧情对话系统。\n        •        做过角色一致性、拒绝边界、共情、重复率等体验评测，能把主观质量转成可复核的 Eval。\n        •        有主流云端语音 / 大模型平台集成经验，做过供应商抽象、成本、容量和稳定性治理。\n        •        做过 Live2D / 3D Avatar、口型表情驱动、实时视频理解或音画同步，但知道视觉层不等于对话智能。\n        •        交付过真实消费级 AI 产品，或有内容安全、隐私、数据治理与未成年人保护经验。\n八、投递材料与面试方式\n        •        请附 1-3 个代表项目：可访问链接或 5-10 分钟演示、架构说明、本人负责部分、关键指标、失败与迭代记录。\n        •        另附最近 6 个月的新技术验证记录；被严谨否决的实验同样有效。\n        •        第一轮以项目现场演示和追问为主；我们会要求你打开真实实现，不以背概念代替证据。\n        •        技术轮包含系统设计或现场排障，重点看拆解、验证、取舍和回退。\n        •        如安排限时小题，会控制范围，不要求候选人免费交付可直接用于商业生产的完整功能。\n九、这类人不适合\n        •        只会调用模型 API，遇到延迟、串轮、打断、脏数据、记忆污染和供应商故障就无从下手。\n        •        只追热点，不做基线、不记录失败、不看官方资料，也不愿承认新技术可能不如旧方案。\n        •        只想做架构或战略，不愿亲手写代码、跑测试、看日志和陪用户完成真实验收。\n        •        把陪伴产品理解成无限迎合用户，忽视人格边界、隐私、依赖、现实关系和安全。\n        •        只会做一次性 Demo，无法把实验沉淀为可维护、可观测、可回退的生产系统。\n薪资与职级建议按成熟项目证据、独立交付能力、技术演进能力和现场验证结果定级，不按简历年限机械换算。", "cat": "技术开发"}, {"id": "6", "title": "AIGC 生产 Agent / Skill 工程师", "salary": "18-24k", "location": "远程，可国内办公", "jd": "这是一个给 AIGC 生产人员造工具的岗位，不是替他们多写一段 Prompt。你要把隐性经验变成可复用、可测试、可追踪、可维护的 Agent / Skill 和生产节点。\n\n一、我们为什么招这个岗位\n我们的 AIGC 影视生产涉及编剧、导演 / 分镜、图像与视频生成、资产管理、质量审核、剪辑和声音等角色。真正的问题不是工具太少，而是工具更新快、经验散落在人脑里、交接不稳定、返工难归因。\n这个岗位要把优秀生产人员已经验证过的方法，沉淀成 Agent / Skill、结构化输入输出、可执行节点、人工审批门禁和回归评测，让个人能力变成团队可复用的生产力。\n二、岗位使命\n深入真实生产现场，找到高频、高成本、可标准化的环节，设计并交付能被生产人员长期使用的 Agent / Skill。你的结果不以“能跑”为准，而以节省时间、减少返工、提升一致性、可追责和可维护为准。\n三、你将负责\n        •        生产调研：跟编剧、导演、生成师、剪辑和审核人员一起工作，拆清输入、判断、交付物、异常、人工审批点和上下游依赖。\n        •        Skill / Agent 设计：定义触发条件、输入输出契约、结构化 schema、内部步骤、上下文边界、工具调用、失败兜底、人工确认和禁止事项。\n        •        功能节点开发：使用 Python / TypeScript 等实现 CLI、API、工具封装和工作流节点，处理并发、重试、限流、降级、幂等、队列、状态和权限。\n        •        生产链路集成：围绕剧本 → 分镜 → 资产 → 图像 / 视频生成 → QC → 后期的真实流程，打通可验证节点，不为“全自动”牺牲质量和控制权。\n        •        评测与回归：建设触发路由测试、固定夹具、结构校验、质量评分、失败样本库和回归门禁；记录版本、成本、时延、成功率和人工返工。\n        •        技术评估：持续跟进新模型、新 Agent 框架、新协议和新生产工具，用小规模真实任务做对照，形成采用、观察或淘汰结论。\n        •        推广与维护：写清使用说明、边界和排障路径，陪生产人员完成试点，把反馈变成版本计划，而不是交付后失联。\n四、硬性要求\n        •        成熟项目经验：至少 1 个你深度参与、能够现场演示的成熟项目。可以是公司、创业、开源或个人项目；学历、公司名和项目规模都不能替代真实证据。\n        •        Agent / Skill 工艺：能明确区分聊天 Prompt、Agent 产品和可复用 Skill；理解触发条件、输入输出契约、结构化输出、上下文、工具调用、编排、Hook / 门禁和 Human-in-the-loop。\n        •        亲手工程能力：能够使用 Python 或 TypeScript 独立交付可运行代码，熟悉 API / CLI、数据 schema、测试、Git、依赖管理和基本部署，不是只画架构图。\n        •        AIGC 生产实操：至少真正做过一种图像、视频、音频、分镜或内容生产链路；知道生成结果不稳定、资产一致性、人工筛选和返工意味着什么。\n        •        审美与内容判断：具备稳定的视觉与叙事审美，能判断构图、镜头、光色、材质、节奏、角色一致性和成片完成度；能说明取舍，并把审美判断转化为参考样本、生成约束与可执行的 QC 标准。\n        •        系统可靠性：能处理第三方模型不稳定、并发、超时、重试、降级、成本失控、脏输出和中断恢复，并让问题可观察。\n        •        需求翻译能力：能听懂生产人员的话，把“想要更有电影感”“角色老漂”“太慢”转成可测的约束、样本和验收标准。\n        •        持续学习：对新技术有长期热情，主动试、主动比较、主动记录；能说清一个新方案为什么没进生产，而不是只会追热词。\n五、成熟项目必须展示什么\n个人项目同样有效，前提是它已经跨过“Demo”阶段：\n        •        有真实用户或明确生产对象，完成了输入 → 处理 → 输出 → 反馈 / 复用的闭环。\n        •        能现场展示运行结果、关键仓库或等价证据，并讲清本人亲手负责的文件、模块和决策。\n        •        能展示输入输出契约、工具链、失败处理、版本记录、测试 / Eval、日志或实际使用数据。\n        •        能说清至少一次失控或返工：为什么发生、怎样定位、怎样修、修完如何防止复发。\n        •        如果项目使用了多个 Agent 或模型，能解释为什么要拆、怎样防上下文污染、怎样决定人工接管。\n        •        审美案例：至少展示 1 个能证明审美判断的真实案例，说明目标与参考、候选结果、筛选理由、修改前后对比，以及最终成片或生产结果。\n聊天机器人套壳、Prompt 合集、只跑通一次的自动化、无法打开实现的概念视频，以及把团队整体成绩当个人成果，不算成熟 Agent / Skill 项目。\n\n六、我们怎样判断你是否真的追新技术\n投递时请附最近 6 个月至少一项主动技术验证：可以是新模型、新 Agent 框架、MCP / 工具协议、图像视频工作流或 Eval 方案。请说明问题、基线、实验、失败、结论和是否落地。我们更喜欢一个被你严谨否决的方案，也不喜欢十个没有验证的“看起来很强”。\n七、加分项\n        •        写过可维护的 SKILL.md / Agent 指令体系，做过多 Agent 编排、Hook、MCP、工具权限或确定性门禁。\n        •        做过图像 / 视频生成 pipeline、ComfyUI、主流生成 API、媒体处理、资产版本和批量任务编排。\n        •        懂 Prompt 的可控性、参考图 / 角色一致性、跨镜头连续性、结构化分镜和自动 QC。\n        •        做过 Eval harness、Golden cases、回归测试、可观测性、成本台账、重放和故障恢复。\n        •        有全栈界面或内部工具经验，能把工程能力包装成非技术生产人员真正会用的产品。\n        •        有影视、动画、广告、短剧或内容生产经历，熟悉镜头语言、成片标准和真实审核链路。\n        •        维护过有真实用户的开源项目、插件、CLI 或自动化工具。\n八、投递材料与面试方式\n        •        请附 1–3 个代表项目：演示 / 链接、架构或流程图、本人贡献、真实用户或生产结果、指标、失败案例和迭代记录。\n        •        请尽量附一个你写过的 Skill、Agent、插件、工作流定义、Eval 或自动化节点；涉及保密内容可脱敏。\n        •        第一轮以项目现场演示和逐层追问为主，重点验证“是不是你做的”和“是否真的被使用”。\n        •        审美判断会单独验证：面试将提供一组 AIGC 图像、视频或分镜结果，请完成筛选、排序和修改建议；重点看判断是否稳定、具体、可解释，并能转化为生成策略或 QC 规则。\n        •        技术轮会让你把一句话剧情设计成结构化分镜 Skill，讲清触发、输入输出、边界、失败和下游消费。\n        •        限时作业如采用，建议上限 3 小时：SKILL.md + 能跑的最小实现（含并发 / 重试 / 降级）+ 设计取舍与 Eval；题目不直接进入商业生产。\n九、这类人不适合\n        •        把 Agent 理解成一个聊天页面，把 Skill 理解成一段更长的 Prompt。\n        •        只想做产品规划或技术管理，不愿亲手写代码、查日志、跑真实任务和处理脏输出。\n        •        不了解生产人员的真实流程，却执着于一上来全自动、无人化。\n        •        只会列工具名，不能拿出项目、实验、失败记录和可复现结果。\n        •        不尊重人工审批、版权、隐私、密钥与付费调用边界。", "cat": "技术开发"}, {"id": "7", "title": "AI内容编辑", "salary": "12~18k", "location": "远程，可国内办公", "jd": "岗位定位：内容量产导向，负责原创短剧的剪辑与成片包装，把握短剧节奏与情绪，稳定产出高完播成片。\n一、工作内容1.基于原创短剧素材进行剪辑、番外重组与精编改版，负责单集从粗剪到成片的完整闭环。\n2.把握短剧的情节钩子、情绪推进与情感／情欲节拍，剪出能\"留人\"的开场与卡点，提升完播与转化。\n3.按周产能目标稳定出片，配合内容库填充计划（原片直上／二剪／番外多线并行）。\n4.完成字幕、音效、配乐、调色、片头片尾等标准化包装，产出符合平台上架规范的成片。\n5.关注完播率、点击、留存等数据，依反馈迭代剪辑手法与开场策略。\n6.规范素材命名与归档，维护素材库与成片库的可追溯性。\n二、必要条件\n1.熟练使用 Premiere／剪映专业版／Final Cut／DaVinci 等至少一款主力剪辑工具。\n2.具短剧、竖屏短视频或影视剧集类成片剪辑经验 1 年以上，能独立完成整集。\n3.对情感／情欲向短剧题材不排斥，能接受相对大胆的内容尺度（面试具体说明）。\n4.节奏感强，理解\"钩子—反转—卡点\"的短剧叙事逻辑，懂平台算法与完播逻辑。\n5.能扛量、抗压，适应量产节奏与周产能目标。\n6.需附上相关作品（短剧／竖屏成片优先，注明负责环节）。\n三、加分项目\n1.有预告片剪辑经验，能剪出情绪与代入感。\n2.会调色、混音、简单特效，或会用 AI 工具（AI 换脸、AI 配音、AI 补帧等）辅助提效。\n3.有二剪／番外／混剪的\"素材增值\"经验，能一片多用。\n4.有稳定高完播／爆款作品案例。\n5.熟悉多平台上架规范与各平台内容偏好。\n四、应聘方式\n请附上：\n1.代表作品 2–3 支（短剧／竖屏成片优先，附上你负责的环节）；\n2.简历与期望薪资；\n3.（加分）一句话说明你剪短剧时最在意的一个点。", "cat": "内容与创作"}, {"id": "8", "title": "广告优化师", "salary": "面议", "location": "远程，可国内办公", "jd": "资深广告策略优化师\n\n\n岗位定位\n\n负责公司自有广告联盟平台的广告策略优化工作，通过广告数据分析、素材策略制定、广告位价值评估、A/B测试及跨产品优化，持续提升CTR、广告收入及整体流量变现效率。\n\n岗位职责\n\n负责公司自有广告联盟平台的广告策略制定与持续优化，结合产品类型、用户画像、广告位特点及历史数据，制定具体的广告优化方案。\n\n持续监控曝光量、点击量、CTR、CVR、CPC、CPA、ROI、广告收入等核心指标，识别数据异常、素材疲劳、低效广告位及低效产品，并及时制定优化策略。\n\n负责广告素材策略制定，包括用户需求分析、核心卖点提炼、创意方向、文案策略、视觉表现及素材结构，并推动设计团队完成素材制作与上线。\n\n建立并执行A/B测试机制，对不同素材、文案、广告形式、广告位及用户群体进行测试，根据实际数据持续迭代优化。\n\n负责高CTR、高转化素材的分析与复盘，提炼不同产品、用户群体及广告位的有效素材规律，建立高效素材库及跨产品复用机制。\n\n负责广告位价值分析，识别高效与低效广告位，并针对低效位置提出素材替换、策略调整、资源重新分配或其他优化建议。\n\n结合历史数据分析素材生命周期及CTR变化趋势，建立素材疲劳预警、B方案储备及快速替换机制。\n\n参与公司广告BI看板、数据分析体系、广告收入归因体系及用户标签体系建设，提升广告优化工作的数据化与标准化水平。\n\n对不同产品和业务部门的广告表现进行横向分析，识别可复制的成功经验，并推动优秀素材和策略跨产品、跨部门应用。\n\n与商务、运营、产品、设计、技术及数据团队协作，推动广告优化从数据分析、策略制定、素材生产、上线测试到效果复盘的完整闭环。\n\n任职要求\n\n3年以上广告投放、广告策略、效果营销或广告优化相关工作经验，有资深广告优化师、广告策略师、Media Buyer或Performance Marketing相关经验优先。\n\n有主流媒体平台实际投放或优化经验，包括但不限于Google Ads、Meta Ads、TikTok Ads等；\n无需在本岗位中负责上述平台的日常投放，但需要理解成熟媒体平台的投放逻辑、测试方法及优化体系。\n\n具备较强的数据分析能力，能够独立分析曝光、点击、CTR、CVR、CPC、CPA、ROAS、ROI等指标，并能够从数据变化中判断素材、流量、广告位或用户匹配方面的问题。\n\n有博彩、社交、Dating、直播、游戏等产品投放或广告优化经验者优先，尤其欢迎具备博彩或社交类产品实际项目经验的候选人。\n\n具备较强的广告素材策略能力，能够从用户心理、产品卖点、文案钩子、视觉表现、广告场景及目标用户等维度判断素材效果。\n\n熟悉A/B测试方法，能够独立制定测试变量、测试周期、评价指标及后续优化动作。\n\n熟悉素材生命周期管理，能够判断素材疲劳、CTR衰退及异常数据，并及时制定替换或迭代方案。\n\n熟练使用Excel或Google Sheets进行数据分析；掌握Python、Power BI、Tableau等工具者优先。\n\n具备较强的逻辑分析和问题解决能力，能够将数据结论转化为明确、可执行的广告优化动作。\n\n具备良好的跨部门沟通能力，能够协调商务、设计、运营、产品及技术团队共同推进项目落地。\n\n加分项\n\n有Google、Meta、TikTok等大型媒体平台较大规模预算管理经验。\n有博彩、社交、Dating、直播或游戏行业成功优化案例。\n\n有自有广告平台、广告联盟、SSP、DSP、ADX或程序化广告相关经验。\n\n有从0到1搭建广告优化体系、A/B测试机制、高CTR素材库或数据分析体系的经验。\n\n熟悉AI工具在广告创意分析、素材生成、数据分析和批量生产中的应用。", "cat": "运营与市场"}, {"id": "9", "title": "AI视觉设计师", "salary": "面议", "location": "远程，可国内办公", "jd": "AI视觉设计师 JD\n\n岗位名称\n\nAI视觉设计师\n\n所属部门\n\n商务中心｜广告优化部\n\n岗位定位\n\n负责公司自有广告联盟平台的广告素材设计与生产，主要以平面广告设计、GIF动态素材及AI生成式素材为核心，与广告策略优化师紧密配合，根据产品特点、用户画像、广告位场景及历史数据，高效完成广告素材的设计、迭代与批量交付。\n\n本岗位不是单纯的传统平面设计岗位，需要具备较强的广告效果意识，能够理解CTR、A/B测试、素材疲劳等基本广告优化逻辑，并根据优化师提供的数据反馈快速调整设计方向。\n\n岗位职责\n\n负责公司各业务线广告素材的视觉设计与制作，主要包括开屏、弹窗、Banner、图标、播放器、信息流及其他不同类型广告位的平面及动态素材。\n\n与广告策略优化师紧密配合，根据产品特点、目标用户、广告位场景、历史CTR数据及优化需求，将广告策略转化为具体的视觉素材。\n\n独立完成GIF动态广告素材设计，包括动态效果设计、帧动画制作、节奏控制、文字动效及文件大小优化。\n\n熟练运用AI生图工具辅助广告素材生产，包括人物、场景、产品视觉及创意画面的生成、修改与二次加工。\n\n根据不同广告位的尺寸和展示特点，完成主视觉设计及多尺寸批量适配，保证不同广告位下的视觉效果和信息传达效率。\n\n配合广告策略优化师执行A/B测试，根据CTR、点击量及其他广告数据反馈，对人物、文案、构图、视觉风格、动态效果等变量进行快速迭代。\n\n持续分析和复盘高CTR广告素材的视觉共性，沉淀高效素材模板、设计方法及可复用素材库。\n\n关注素材生命周期及疲劳问题，为表现下滑的广告及时制作B方案或新的创意变体，支持快速替换和持续测试。\n\n探索AI与自动化工具在广告素材生产中的应用，包括AI生图、批量尺寸适配、GIF批量导出及其他能够提升素材生产效率的工作流。\n\n根据业务优先级同时支持多个产品和项目，能够处理批量素材、多尺寸适配及紧急广告需求，保证交付质量和时效。\n\n任职要求\n\n2年以上平面设计、广告设计、视觉设计或效果广告素材制作相关工作经验，有广告素材设计经验者优先。\n\n熟练使用Photoshop等平面设计工具，能够独立完成广告主视觉设计、图片处理、合成、排版及多尺寸适配。\n\n必须具备GIF动态广告制作能力，能够独立完成GIF动画设计、动态效果制作及文件优化。\n\n熟悉至少一种或多种AI生图工具，能够独立通过提示词、参考图及局部修改等方式完成广告视觉生成，并进行后期加工。\n\n具备良好的广告视觉判断能力，能够理解广告素材与普通品牌设计之间的区别，重视点击效率、信息传达、视觉吸引力和用户行为。\n\n能够理解优化师提供的广告策略及数据反馈，并根据CTR变化快速调整人物、文案、构图、动态效果及整体视觉方向。\n\n具备较强的执行能力和交付效率，能够适应多项目并行、批量尺寸制作及快速迭代的工作模式。\n\n具备较好的沟通和协作能力，能够与广告策略优化师共同完成“策略分析—素材设计—上线测试—数据复盘—素材迭代”的完整闭环。\n\n优先考虑\n\n有成人、Dating、社交、直播、博彩或游戏等行业广告素材设计经验者优先。\n\n有成人行业相关素材制作经验，能够准确理解不同用户群体的视觉偏好、素材尺度及广告点击逻辑者优先。\n\n有效果广告素材经验，熟悉CTR、A/B测试、素材疲劳及高点击素材迭代逻辑者优先。\n\n有Google、Meta、TikTok或其他主流媒体广告素材制作经验者优先。\n\n有大批量、多尺寸广告素材生产经验，能够熟练进行素材复用和批量适配者优先。\n\n加分项\n\n会制作视频广告，包括短视频剪辑、动态广告、AI视频生成或视频后期处理。\n\n熟悉Premiere Pro、After Effects、CapCut等视频制作工具。\n\n熟悉AI视频生成工具，能够将AI生图与AI视频结合进行广告素材生产。\n\n会使用Photoshop脚本、Python或其他自动化工具进行素材批量处理、尺寸适配或GIF批量导出。\n\n有高CTR广告素材成功案例，能够结合实际数据说明个人设计对广告效果的提升。\n\n有建立广告素材库、设计模板库或自动化素材生产工作流的经验。", "cat": "内容与创作"}, {"id": "10", "title": "商服专员", "salary": "7K-10K", "location": "", "jd": "岗位职责\n\n1. 负责商务及日常行政支持相关工作的对接、协调与跟进，确保事项及时落实。\n2. 协助处理广告上下架、链接更换、资料整理、表格维护等日常支持性工作。\n3. 负责商务合作过程中相关资料的收集、整理、归档及信息核对。\n4. 跟进合作进度，及时做好信息同步与反馈，协助推进项目顺利开展。\n5. 协助整理日报、工作汇总、台账等相关文档，确保数据准确、更新及时。\n6. 协助跨部门沟通协调，推动各项工作有序开展并按时完成。\n7. 对日常工作中发现的问题进行记录、反馈，并协助跟进处理。\n\n岗位要求\n\n1. 大专及以上学历，专业不限，有商务助理、行政助理、运营支持或相关工作经验者优先。\n2. 具备良好的沟通协调能力和服务意识，能够高效配合各项工作开展。\n3. 工作认真细致，责任心强，具备较强的执行力和条理性。\n4. 熟练使用 Excel、Google Sheets 等办公工具，具备基础数据整理与文档处理能力。\n5. 能够适应多事项并行的工作节奏，具备较好的时间管理和任务跟进能力。\n6. 能接受表格整理、信息核对、资料归档、沟通跟进等日常支持类工作。\n7.工作地点须在国内，不用海外人员。包括在东南亚生活或有东南亚工作经验人员。\n8.有同行业经验、BC、资金盘等敏感业务经历的候选人，不予录用。\n9.年龄要求20-28岁\n\n优先条件\n\n1. 有商务支持、行政助理、运营支持、客户服务等相关经验者优先。\n2. 具备较强的表格整理、数据核对及文档处理能力。\n3. 工作积极主动，能够及时发现问题并做好反馈与跟进。\n4. 具备良好的团队协作意识，沟通顺畅，执行稳定。\n5. 应届毕业生，本科以上，执行力强有相关电脑操作，AI应用基础优先", "cat": "运营与市场"}, {"id": "11", "title": "客户运营专家", "salary": "20K-30k", "location": "远程，可国内办公", "jd": "岗位职责：\n1. 客户档案与健康度管理\n  • 集团统一管理老客户档案、续费节点、健康度评分体系\n  • 建立客户流失复盘机制，把每个流失案例转化为改进点\n2. 续费与增购\n  • 主导大客户回访、流失预警、续费谈判支持\n  • 协助分公司商务做客户分级、续费方案设计、增购挖掘\n3. 口碑与转介绍\n  • 推动老客户口碑转介绍体系\n  • 定期输出客户运营分析报告\n\n任职要求：\n1. 学历与经验：\n  • 本科及以上学历\n  • 3年以上客户运营、客户成功或大客户管理经验，有续费/增购指标管理经验优先\n2. 核心能力：\n  • 数据分析能力强，善于从客户行为数据中发现机会和风险\n  • 能独立设计运营方案\n  • 服务意识强、细致\n  • 善于跨部门协调\n  • 以结果为导向，能推动分公司执行落地\n3. 加分项：\n  • 有客户成功体系从0到1搭建经验\n  • 有续费率/复购率显著提升案例", "cat": "运营与市场"}, {"id": "12", "title": "产品定价专家", "salary": "20K-30k", "location": "远程，可国内办公", "jd": "岗位职责：\n1. 定价体系搭建\n  • 统筹各分公司广告位定价、产品定价、流量评估\n  • 建立标准化定价模型（成本 + 市场 + 竞品 + 流量价值）\n2. 定价审核与管控\n  • 月度复核分公司报价合理性，避免低价竞争或定价过高失单\n  • 输出《集团产品定价手册》，分公司报价需在框架内执行\n3. 产品标准化\n  • 推动产品标准化、套餐化设计，减少分公司各自为政\n  • 定期输出定价分析及优化建议报告\n\n任职要求：\n1. 学历与经验：\n  • 本科及以上学历，财务、经济、市场营销等相关专业优先\n  • 3年以上定价策略、商业分析或产品运营经验，有广告/媒体行业定价经验优先\n2. 核心能力：\n  • 精通数据建模与财务分析\n  • 能从成本、市场、竞品多维度构建定价体系\n  • 逻辑严谨、数字敏感度高\n  • 敢于对不合理报价说\"不\"，原则性强\n3. 加分项：\n  • 有定价模型搭建或定价手册编写经验\n  • 有广告/媒体行业从业背景", "cat": "产品与管理"}, {"id": "13", "title": "业务督导专员", "salary": "面议", "location": "远程，可国内办公", "jd": "核心职责\n\n一、业务巡检与质检\n1. 对各业务岗位开展常态化巡检与专项抽查，核查工作质量与任务完成情况\n2. 核查新人带教与业务培训的落地情况，评估带教效果与培训覆盖率\n3. 核验业务部门日报、周报、会议纪要、巡检报告中的关键事项，识别异常、遗漏、拖延与执行偏差\n\n二、问题闭环与台账管理\n4. 跟进广告数字化、平台运营、商务服务、广告优化等销售转化业务链路中的问题闭环\n5. 建立并维护业务质检台账（问题来源/责任部门/责任人/整改时限/整改结果/复盘结论）\n6. 定期输出业务质检报告、风险提示、巡检结论及整改追踪材料\n\n三、会议协同与制度跟进\n7. 协助完成会议安排、纪要整理、行动项拆解及DDL追踪\n8. 协助发布制度通知、流程要求与规范文件，跟踪各部门反馈、执行情况与完成状态\n\n四、跨部门追踪与风险升级\n9. 跟踪跨部门事项进度，推动问题从\"提出\"走向\"解决\"，确保责任人、时间节点、交付物清晰可查\n10. 对高风险事项及时升级（流程倒挂、数据异常、执行延期、人员履职异常、信息安全及权限风险等）\n\n任职要求\n1. 本科及以上学历，英国G5顶尖院校背景优先；其他候选人若业务履历优秀亦可考虑\n2. 远程工作，需具备英国合法工作身份常驻英国，其他发达国家亦可，东南亚地区不做考虑\n3. 3年以上互联网/广告科技/流量变现/广告联盟/SaaS/平台运营/项目管理/商业分析/运营质检/业务风控相关经验优先\n4. 能理解广告投放、流量承接、线索转化、客户运营等基本业务流程\n5. 具备较强的信息核验、逻辑判断、问题拆解、事项统筹与闭环跟踪能力\n6. 口头与文字表达能力强，能独立整理清晰、准确、适合管理层阅读的材料\n7. 擅长使用AI工具，熟练操作Excel/Google Sheets、协作文档、项目管理工具\n8. 职场成熟度高，严谨细致，能同时处理多线程任务，接受高频沟通与临时专项任务\n9. 入职之前需提供学历证明\n\n加分项\n具备质检/督导/培训管理、总裁办/PMO/战略运营，或MarTech/AdTech/流量商业化增长相关经验者优先", "cat": "运营与市场"}, {"id": "14", "title": "业务运营总监", "salary": "30k-40k", "location": "远程，可国内办公", "jd": "业务运营总监 （渠道资源方向）\n需求：1人\n\n一、岗位名称\n\n广告数字化部｜广告联盟运营总监招募（渠道资源方向）\n\n二、岗位职责\n\n1. 负责广告联盟业务整体运营与渠道拓展\n\n• 统筹广告联盟业务运营管理，制定业务增长策略并推动落地；\n• 围绕联盟业务目标，拓展、整合并运营优质渠道资源，提升业务规模与合作质量。\n\n2. 引入并管理渠道资源\n\n• 基于现有行业经验和资源积累，快速引入可合作的渠道、流量方或相关合作资源；\n• 建立渠道合作机制，推动合作方的接入、转化、放量和长期维护。\n\n3. 推动业务增长与结果达成\n\n• 对联盟业务核心结果负责，包括渠道增长、资源引入、合作转化、业务规模提升等；\n• 能结合市场变化和业务阶段，及时调整合作策略与运营动作。\n\n4. 协调内部资源推动项目落地\n\n• 联动产品、技术、数据、商务等团队，推动渠道接入、合作上线和问题处理；\n• 对重点合作项目进行全流程推进，保障执行效率和结果交付。\n\n5. 搭建和优化运营机制\n\n• 完善联盟业务的渠道运营流程、合作标准、管理机制及风险控制体系；\n• 提升业务在高流量、高复杂度场景下的稳定性和运营效率。\n\n6. 团队管理与能力建设\n\n• 负责团队管理、目标拆解、过程跟进及人才培养；\n• 建立结果导向、协同高效的业务运营团队。\n\n───\n\n三、任职要求\n\n1. 本科及以上学历，具备 广告联盟、渠道拓展、流量合作、商业化运营 等相关经验；\n2. 有可转化的渠道资源积累，具备独立拓展和导入资源的能力；\n3. 熟悉广告联盟、流量平台、效果广告或相关业务逻辑，能够快速判断资源质量与合作价值；\n4. 具备较强的商务拓展能力、合作谈判能力和资源整合能力；\n5. 具备团队管理经验，能够带团队完成业务目标；\n6. 数据敏感度高，能结合数据判断业务问题、渠道质量与增长机会；\n7. 具备较强的跨部门协同和项目推进能力，能够推动复杂合作快速落地；\n8. 抗压能力强，有较强的结果意识和业务 ownership。\n\n───\n\n四、优先条件\n\n1. 自带广告渠道、流量渠道、联盟合作方资源者优先；\n2. 有成熟渠道网络，能够在短时间内推动资源落地者优先；\n3. 有广告联盟、商业化平台、效果投放、流量变现相关行业背景者优先；\n4. 有从 0 到 1 开拓渠道，或从 1 到 N 放大合作规模经验者优先。\n\n───\n\n五、我们重点看重\n\n• 是否 自带资源\n• 是否 能直接开合作\n• 是否 能把资源转成结果\n• 是否 能兼顾拓展 + 运营 + 管理", "cat": "运营与市场"}, {"id": "15", "title": "渠道专员", "salary": "15k-25k", "location": "远程，可国内办公", "jd": "岗位职责\n渠道拓展与管理：挖掘、筛选、洽谈、对接各类投放渠道（信息流、KOL、联盟、广告平台等），建立并维护渠道合作关系，持续扩大渠道规模与覆盖；\n新渠道测试与放量：推动新渠道从对接、小额测试到放量的全流程落地，评估渠道质量、筛选优质渠道；\n投放执行与优化：制定投放策略（预算、素材、节奏），监控点击率、转化率、ROI 等数据，持续优化投放效果；\n数据分析与复盘：定期输出渠道/投放分析报告，从数据中发现问题并提出优化方案，对转化、成本、留存等结果负责；\n素材与创意协同：与设计/内容团队协作优化广告素材，开展 A/B 测试验证创意方向；\n竞品与市场分析：跟踪竞品投放策略与行业趋势，提出策略调整建议；\nAI 应用：运用 AI 工具搭建落地页/投放工具、提效渠道测试与投放流程。\n\n任职要求\n大专及以上学历，有 1-3 年渠道投放 / 拓展相关经验者优先；\n熟悉主流投放平台，具备数据分析能力（Excel / SQL / BI 工具），有 ROI 优化经验；\n结果导向，具备良好的沟通协调、抗压能力与团队协作意识，能适应快节奏工作；\n熟练运用 AI 工具辅助投放与页面 / 功能搭建；\n本岗位为海外投放方向，要求人在海外。\n\n加分项\n自带投放渠道资源或渠道对接人脉（信息流、KOL、联盟、广告平台等），能快速引入新渠道；\n有投放实操经验；\n有成功的新渠道开拓案例（如拓展 X 个优质渠道、ROI 提升 X%、获客成本降低 X%）；\n有渠道矩阵搭建、多渠道并行拓展与管理经验；\n有用 AI 搭建落地页 / 投放工具、提效渠道测试与投放流程的经验。", "cat": "运营与市场"}, {"id": "16", "title": "中高级网站运营（SEO / Growth）", "salary": "20-30k", "location": "远程，可国内办公", "jd": "中高级网站运营（SEO / Growth）\n\n岗位职责\n1.负责网站从 0 到 1 的整体运营工作，对网站流量增长及用户增长负责。\n2.制定并落地网站 SEO 策略，包括关键词规划、栏目建设、内容优化、内链布局及技术 SEO 优化。\n3.负责 Google Search Console、Google Analytics 等数据分析，持续优化网站收录、索引及自然搜索表现。\n4.规划网站内容体系、标签体系及专题页面，提高网站整体内容质量及搜索覆盖率。\n5.负责 X（Twitter）、Telegram、Reddit 等海外社交平台运营，提升品牌曝光及用户增长。\n6.持续跟踪行业动态及竞争对手，制定运营优化方案。\n7.与产品、开发团队协同推进运营需求，不断完善网站功能及用户体验。\n8.建立网站运营规范及数据分析体系，定期输出运营分析报告。\n\n任职要求\n1.3 年以上网站运营或 SEO 运营经验，有独立负责网站项目经验。\n2.熟悉 Google SEO 原理，具备完整的网站优化经验，能够独立制定并执行 SEO 策略。\n3.熟练使用 Google Search Console、Google Analytics（GA4）、Ahrefs、Semrush 等工具。\n4.熟悉网站收录、索引、关键词排名、内容规划及网站结构优化。\n5.熟悉海外社交媒体平台（X、Telegram、Reddit 等）运营规则，有实际增长经验者优先。\n6.具备较强的数据分析能力，能够根据数据发现问题并推动优化。\n7.具有良好的项目管理及跨部门沟通能力，具备较强的执行力和责任心。\n\n加分项\n1.有海外内容网站、资源站、媒体站、社区平台运营经验。\n2.有 AI 内容生产及 AI 工作流搭建经验。\n3.熟悉 Cloudflare、WordPress、HTML/CSS、Schema、Sitemap 等网站技术。\n4.有 Google Discover、Email Marketing、Affiliate、站群运营等经验。", "cat": "运营与市场"}, {"id": "17", "title": "业务审查员", "salary": "8-10k", "location": "远程，可国内办公", "jd": "岗位名称： 业务审查员\n\nJD：\n\n岗位职责：\n1、监控各业务群日常运营数据，核查打款金额、到期时间、收款地址、商品上下架状态等关键信息，及时发现并标记异常情况；\n2、核实风险事项（包括地址变更、异常打款、漏登、错登等），跟进问题处理进度并推动闭环解决；\n3、结合聊天记录、业务数据及相关台账，识别私下交易、违规操作、异常资金往来等风险事项，开展核实与跟进工作；\n4、负责台账登记、业务数据核对及信息复查，确保数据录入准确、完整、可追溯；\n5、按周/月输出审查报告及专项审查分析报告，汇总风险案例并提炼共性问题。\n\n任职要求：\n1、大专及以上学历，审计、财务、风控、数据分析等相关专业优先；\n2、细心认真、责任心强，能够长期从事核查、复核类重复性工作，保持稳定的工作质量；\n3、具备较强的风险意识和逻辑分析能力，能够从数据和信息中发现异常线索；\n4、熟练使用Google Sheets、Excel等在线表格工具，能够进行数据筛选、比对与基础统计分析；\n5、具备AI工具使用能力，能够熟练使用ChatGPT、Claude等AI工具辅助开展信息整理、数据分析、风险排查及报告编写工作；\n6、保密意识强，原则性强，具备良好的沟通协作能力，能够与多部门协同推进问题处理。\n\n加分项：\n\n有风控、审计、反舞弊、资金核查相关工作经验；\n熟悉互联网广告投放、渠道合作及结算业务流程；\n有数据分析、稽查或合规相关工作经验。", "cat": "其他"}, {"id": "18", "title": "初级素材设计师", "salary": "7-10k", "location": "远程，可国内办公", "jd": "工作内容\n    1. 使用 Photoshop /剪映进行广告图素材制作，包括但不限于：图片排版、尺寸调整、视频简单剪辑/添加字幕等；\n    2. 配合团队修改图片、视频及不同尺寸的广告素材；\n    3. 按照工作要求，及时完成日常素材制作任务。\n任职要求\n    1. 会使用 Photoshop，能够完成基础的抠图、修图、排版和图片合成；\n    2. 会使用剪映，能够完成基础短视频剪辑；\n    3. 有一定的审美，对颜色、字体和画面排版有基本感觉；\n    4. 能够接受成人行业相关的工作内容；\n    5. 工作认真，有责任心，执行力较强；\n    6. 能够根据要求及时修改和完成素材；\n    7. 有平面设计、广告设计、电商设计或视频剪辑经验者优先。\n    8. \n经验要求\n    1. 不限行业经验，应届生或初级设计人员均可；\n    2. 有基础的软件操作能力即可；\n    3. 有相关作品者可提供作品集，没有正式商业作品的，也可以提供平时练习的海报、修图、排版或短视频作品。", "cat": "内容与创作"}, {"id": "19", "title": "商务专员", "salary": "10-15k", "location": "远程，可国内办公", "jd": "岗位职责\n\n1、独立客户开发：能够独立开展客户开发、商务洽谈及合作推进工作，持续提升新增客户数量与合作转化率\n2、重点合作推进：能够独立跟进重点客户、续费客户及复杂合作事项，处理合作中的常见问题，保障合作顺利落地与持续推进\n3、业务结果达成：对个人业绩目标、新增合作、续费推进及回款结果负责，结合业务情况及时调整跟进节奏并完成目标任务\n4、数据与经验沉淀：负责整理个人客户台账、业务数据及跟进经验，沉淀有效话术、方法和合作案例，提升个人业务复用效率\n5.特殊业务需求：熟悉男性向/同志向内容生态及私域社群场景，了解相关用户沟通方式、社群规则和客户需求；具备同性内容、成人传媒、私域流量、社群商务或相关广告推广资源经验优先。（第5条要求，岗位缺口一人）\n\n必备：执行力、学习能力、目标意识与独立推进能力、抗压能力、客户开发、关系维护、复杂问题处理能力", "cat": "运营与市场"}, {"id": "20", "title": "网站内容资料员", "salary": "10k-12k", "location": "远程，可国内办公", "jd": "岗位职责：\n1、负责每日网络热点、热门事件、娱乐资讯、社会事件等内容的搜集和整理。\n2、根据要求整理图片、视频、文字、来源链接等相关资料。\n3、对采集到的资料进行分类、去重、筛选和基础核实。\n4、按照网站后台规范录入文章资料，包括标题、分类、标签、图片等。\n5、维护已有内容，及时补充失效图片、视频、链接及相关信息。\n6、关注各大社交平台、新闻平台及社区热点，及时发现有价值的内容和选题。\n7、配合内容编辑完成其他资料整理工作。\n\n任职要求：\n\n1、熟悉互联网，平时经常使用抖音、微博、小红书、微信、qq、Telegram、X、贴吧、论坛等平台。\n2、信息搜索能力强，能够快速找到事件来源及相关资料。\n3、做事细心、有耐心，对文件整理、分类和资料归档比较敏感。\n4、能够熟练进行内容复制、整理、上传和录入。\n5、对互联网热点敏感，能够判断哪些内容具有关注度。\n6、有网站编辑、内容采集、自媒体运营或资料整理经验者优先。", "cat": "内容与创作"}, {"id": "21", "title": "SEO 运营", "salary": "10-20K", "location": "远程，可国内办公", "jd": "岗位职责\n\n1、负责视频站在 Google、Bing、Yandex 三大搜索引擎的自然流量增长，独立承担收录量、关键词覆盖、自然流量等核心指标。\n\n2、基于三大引擎排名逻辑的差异（Google 侧重内容权威性与用户体验信号、Bing 更依赖结构化数据与页面规范、Yandex 以用户行为因子为主导），分别制定并落地差异化的优化方案，不套用单一打法。\n\n3、统筹视频内容从生产到分发全链路的 SEO 落地，包括页面结构、标题与描述规范、视频结构化数据（VideoObject）、视频站地图、转录文本与字幕、缩略图与内链体系，确保内容结构、技术架构与传播路径共同服务于多引擎搜索表现。\n\n4、搭建跨引擎的效果评估体系，拆解各平台流量增长的关键杠杆，输出定期数据复盘，为策略迭代与资源投入优先级提供依据。\n\n5、跟踪三大引擎的算法更新与生态变化，评估对现有策略的影响，及时推动方向调整。\n\n6、推动 SEO 要求前置到内容生产环节，与内容、产品、技术团队建立协同机制，将优化动作从事后补救转为事前内置。\n\n任职要求\n\n1、本科及以上学历，3 年以上 SEO 运营经验，有视频站、内容站或大型站点（十万级以上页面）实操经验者优先。\n\n2、具备至少两个搜索引擎的实战经验，熟悉 Google 之外 Bing 或 Yandex 的收录与排名机制，能说清各引擎的差异而非只做过 Google。\n\n3、熟练使用 Google Search Console、Bing Webmaster Tools、Yandex Webmaster 及主流第三方工具（Ahrefs／Semrush／GA4 等），具备独立的数据分析与归因能力。\n\n4、掌握技术 SEO 基础：抓取与索引机制、站点架构与内链、结构化数据、页面性能与 Core Web Vitals、站点地图与 robots 规则，能与研发有效对齐需求。\n\n5、具备良好的跨团队沟通与推动能力，能将 SEO 需求转化为内容与产品可执行的规范。", "cat": "运营与市场"}, {"id": "22", "title": "后端技术经理", "salary": "35-60k", "location": "远程，可国内办公", "jd": "岗位职责：\n1、负责平台的整体架构设计、技术演进与团队管理；\n2、带领Go团队完成核心功能开发与维护，解决系统性能瓶颈；\n3、主导平台容器化改造、CI/CD流程建设；\n4、负责RESTful API接口设计及技术方案评审；\n5、负责团队成员的技术培养、绩效管理及梯队建设。\n岗位要求：\n1、本科及以上学历，计算机相关专业，7年以上Golang一线开发经验，3年以上团队管理经验；\n2、熟悉mongodb,redis,elasticsearch，具备扎实的高并发、高流量系统实战经验，能独立讲清楚高并发场景的全链路解决方案；\n3、熟悉分布式系统架构设计，深入理解高可用、高并发、负载均衡核心技术；\n4、精通GoZero、Gin等主流框架，具备框架选型能力；\n5、必须有内容分发、社交、电商等高流量C端产品的Go开发经验；\n5、熟悉MySQL、Redis、Kafka、gRPC、RabbitMQ等中间件；\n6、熟悉分布式缓存及CDN内容分发方案；\n7、熟悉Docker、Kubernetes及主流云平台；\n\n加分项：\n有内容分发平台经验；\n了解机器学习和智能推荐算法，有AI编程经验；\n熟悉PHP、JAVA相关技术。\n初筛硬性卡点：\nGo工龄少于5年（含Java/PHP转Go不足5年）", "cat": "技术开发"}, {"id": "23", "title": "高级算法工程师", "salary": "25-40K", "location": "远程，可国内办公", "jd": "岗位职责\n1、负责抖音业务推荐算法工作，与来自国内外名校、有丰富业界经验的同学合作，共同搭建行业顶级的推荐系统，为用户提供一流的产品体验；\n2、将最前沿的机器学习技术应用到抖音的核心场景业务，优化用户体验促进业务发展；\n3、研究方向包含且不局限于：深度学习、图神经网络、多任务学习、Learning To Rank、模型压缩和加速、多模态技术等，结合业务的实际问题来做好技术的探索和研究；\n4、和产品、运营团队紧密合作，通过对产品和用户的深入理解和分析，制定算法策略促进抖音生态的长期繁荣发\n\n任职要求\n1、具备优秀的编码能力，扎实的数据结构和算法功底；\n2、对机器学习有热情、乐于学习、思考和创新，有自然语言处理、数据挖掘、计算机视觉相关的工作经验；\n3、熟悉常见算法，如LR，GBDT，DNN等，具备推导， 实现， 应用能力；\n4、熟悉C++和Python语言，熟悉Linux开发环境；\n5、优秀的分析问题和解决问题的能力，有良好的沟通表达能力和团队精神。", "cat": "技术开发"}, {"id": "24", "title": "高级AI视频创作", "salary": "15-30", "location": "远程，可国内办公", "jd": "岗位职责：\n主导AI视觉内容生成流程的设计与优化，包括但不限于图像、视频、动画等多模态创作。\n\n构建并维护高质量的工作流体系（ComfyUI / Stable Diffusion / 视频生成模型等），实现风格统一、角色一致性与批量产出。\n\n探索前沿AI工具（视频生成、动作迁移、音频驱动、修复增强等），并快速落地为生产级方案。\n\n负责模型选型、LoRA/finetune微调、提示词工程与参数调优，提升画面质量与生成效率。\n\n协同创意、剪辑、后期团队，将AI素材无缝整合至完整作品，指导初级/中级创作者。\n\n沉淀技术文档、工作流规范与资产库，持续优化内容生产管线。\n\n任职要求：\n经验：3年以上视觉内容创作经验，至少1年专注AI生成方向，有成熟作品或项目案例。\n\n工具：深度掌握ComfyUI节点级开发与调优，熟练使用FFmpeg、PR/AE等后期软件；熟悉Python/Shell脚本者优先。\n\n能力：具备极强的审美能力与风格控制力，能独立完成从创意构思到成品输出的全流程。\n\n模型：熟悉主流视频/图像生成模型（如Wan2.2、HunyuanVideo、Flux、Sora等），有LoRA训练或模型微调经验。\n\n沟通：逻辑清晰，能跨团队协作，适应高频迭代与快速实验的创作节奏。\n\n加分项：有开源项目贡献、技术博客/作品集、团队管理或培训经验", "cat": "内容与创作"}, {"id": "25", "title": "产品经理", "salary": "20-40K", "location": "远程，可国内办公", "jd": "1.负责投放系统 / 渠道系统的产品规划与迭代\n2.建设投放配置、渠道管理、规则引擎等核心能力\n3.推动投放流程自动化，提升投放效率与规模能力\n4.支撑投放团队日常放量、调价与效果分析\n5.协同广告系统、数据中心，保障投放数据一致性\n\n1.3–7 年产品经理经验，有买量 / 渠道 / 投放系统经验\n2.熟悉主流广告投放流程及相关平台\n3.具备数据分析能力，能基于数据优化产品设计\n4.执行力强，能推动复杂需求落地\n5.必须有toB相关经验\n6.运营系统和数据中心（DMP）相关经验加分", "cat": "产品与管理"}, {"id": "26", "title": "高级运营", "salary": "20-35K", "location": "远程，可国内办公", "jd": "岗位职责：\n\n1. 负责视频内容运营体系搭建，制定长期运营策略与发展规划\n2. 主导视频内容选题策划与分发管理，监控热点动态，把握市场最新优质视频内容趋势\n3. 分析视频运营数据，从数据中提炼优化方向，持续迭代运营方法论\n4. 独立孵化运营产品，提供从 0 到 1 的成功案例支撑\n5. 整合并落地项目资源，推动跨部门协作，达成业务增长目标\n\n任职要求：\n\n1. 5年以上中大型网站或平台运营经验\n2. 有视频运营相关经验，熟悉主流视频平台（优酷、爱奇艺、B站、抖音等）运营规则\n3. 对视频市场保持高度敏感度，能快速识别并跟进最新热门内容动态\n4. 具备独立孵化运营产品能力，有从 0 到 1 的成功案例\n5. 具备可落地的项目资源，有明确资源整合方向与执行能力\n6. 具备项目管理经验，能够推动多项目并行\n7. 善于沟通协作，有跨团队协同经验优先", "cat": "运营与市场"}, {"id": "27", "title": "中级运营", "salary": "10-20K", "location": "远程，可国内办公", "jd": "岗位职责：\n\n1. 负责视频内容运营，包括但不限于视频选题策划、内容分发及数据追踪\n2. 监控视频平台热点动态，及时掌握市场最新优质视频内容趋势\n3. 分析视频运营数据，优化内容策略，提升用户活跃与留存\n4. 协助产品增长目标，制定并执行日常运营方案\n\n任职要求：\n\n1. 3 年以上中大型网站或平台运营经验\n2. 有视频运营相关经验，熟悉主流视频平台（优酷、爱奇艺、B站、抖音等）运营规则\n3. 对视频市场保持敏感度，能快速识别并跟进最新热门内容动态\n4. 具备数据分析能力，能从数据中提炼优化方向\n5. 善于沟通协作，具备跨部门协同经验优先", "cat": "运营与市场"}, {"id": "28", "title": "项目经理", "salary": "30K-32K", "location": "远程，可国内办公", "jd": "项目管理工作\n1、负责公司各类落地项目的整体统筹、进度管控、团队协调及落地执行，涵盖项目立项、计划制定、过程跟进、风险把控、验收复盘全流程工作，确保项目按时、按质、按预算完成。\n\n2、对接内部团队，高效沟通项目需求、进度及问题，及时处理项目突发状况，协调各方资源，解决项目推进中的卡点难题，维护良好的合作关系。\n\n3、负责项目文档管理，包括项目方案、进度报表、复盘报告、验收资料等整理归档，定期向领导汇报项目进展、成果及潜在风险。\n\n4、统筹项目团队日常工作，合理分配工作任务，跟进工作落地情况，把控项目质量与效率，优化项目执行流程，提升整体工作效率。\n\n5、熟悉伦敦本地市场情况，完成领导交办的其他项目相关工作。\n\n任职要求\n1、学历：本科以上学历，一年及以上项目管理相关工作经验，有海外项目运营管理经验者优先，英国留学背景优先。\n\n2、硬性技能：持有有效英国驾照/国际驾照，熟练掌握伦敦路况，无重大驾驶事故记录，可独立完成各类本地外勤驾驶工作。\n\n3、能力要求：具备优秀的统筹协调、沟通谈判、问题解决能力，逻辑清晰、执行力强，做事严谨负责，抗压能力强，能灵活适配弹性工作安排。\n\n4、素养要求：人品端正、踏实靠谱、忠诚度高、隐私意识极强，有良好的服务意识和职业操守。\n\n5、适配条件：长期定居伦敦或可全职驻伦敦工作。\n\n6、语言要求：熟练使用中英文沟通交流。", "cat": "产品与管理"}, {"id": "29", "title": "高级产品经理", "salary": "20-37", "location": "远程，可国内办公", "jd": "一、岗位职责\n负责公司核心产品（Web端 & 移动端）的需求规划与迭代设计；\n独立完成需求分析、原型设计（Axure/Figma等）、PRD撰写；\n与UI设计师、开发、测试紧密协作，推动需求高效落地\n参与产品整体规划，包括功能设计、用户体验优化、数据驱动迭代\n对核心模块进行持续优化\n\n关注行业趋势及竞品动态，提出产品创新方案\n二、岗位要求\n本科及以上学历，3-5年互联网产品经理经验\n至少负责过1个完整产品模块（从0到1或核心迭代）\n熟悉Web产品设计，同时具备移动端（iOS/Android）产品经验\n熟练使用Axure、墨刀等原型工具\n具备良好的逻辑思维能力，能独立拆解复杂需求\n具备良好的沟通能力，能推动跨团队协作\n有内容类产品/视频产品经验优先\n\n三、加分项（优先考虑）\n有视频、漫画、小说内容类产品经验\n熟悉AI工具（如Figma AI、Prompt设计、AIGC产品）\n有海外产品或多端产品经验（Web + H5 + App）\n\n四、岗位能力要求（重点）\n需求拆解能力（复杂需求结构化）\n原型设计能力（结构清晰 + 可落地）\n数据驱动能力（会看数据 + 能优化）\n跨团队推动能力（设计 / 开发 / 测试）\n用户体验意识（细节控）\n\n五、工作内容产出（入职后）\nPRD文档（可直接开发使用）\n高保真/中保真原型图\n功能流程图", "cat": "产品与管理"}, {"id": "30", "title": "运维助理", "salary": "10-15k", "location": "远程，可国内办公", "jd": "岗位职责\n（一）K8s服务器运维\n- 熟练操作K8s集群，负责部署、配置、监控及故障排查，管理Pod、Service等核心资源，保障集群稳定运行。\n- 优化K8s组件运维，推进IaC实践，使用Terraform、Helm等工具实现集群自动化部署；搭建监控告警体系，快速处置异常并输出优化方案。\n- 配合研发完成容器化改造，优化Docker镜像流程，衔接CI/CD流水线，实现研发交付自动化。\n（二）海外服务器统筹管理\n- 协助负责人管理海外多区域200台服务器，完成初始化、安全加固及资产台账管理，确保资产可追溯。\n- 负责海外服务器日常监控与故障处置，制定应急预案，保障海外业务连续性，处理网络、合规及安全相关问题。\n- 优化服务器资源分配，配合海外业务团队提供技术支持；建立运维规范，推动运维自动化。\n（三）DevOps体系与协同支持\n- 优化CI/CD流水线，推动研发运维一体化，提升交付效率；选型并开发运维自动化工具，解决重复性工作。\n- 对接各团队提供DevOps技术支持，协助负责人开展团队培训，参与重大故障排查与优化。\nPS:需具备较强的问题解决、跨区域协同及应急处置能力，能独立承担核心运维任务，助力全球业务稳定发展", "cat": "技术开发"}, {"id": "31", "title": "高级VPN运营", "salary": "15-30k", "location": "远程，可国内办公", "jd": "岗位职责\n\n1. 负责VPN产品整体运营策略制定与落地，构建从用户获取、激活、留存到付费转化的完整运营体系\n2. 深度分析产品核心数据指标（DAU、付费率、ARPU、留存率、流失率等），独立完成数据拆解与归因分析，驱动运营决策\n3. 主导用户增长专项，制定并执行拉新、促活、召回等运营方案，持续提升用户规模与付费转化\n4. 跟踪竞品动态及行业趋势，结合用户行为数据持续迭代运营方法论\n5. 协同产品、技术、市场团队推动运营方案落地，确保各项目按节点交付\n6. 建立运营数据看板，定期输出运营报告，为产品迭代和商业决策提供数据支撑\n\n**任职要求**\n\n1. 5年以上互联网产品运营经验，有VPN、工具类或海外产品运营经验者优先\n2. 有完整的运营体系搭建经验，能从战略层面规划运营方向并拆解落地\n3. 极强的数据敏感度，能独立完成数据分析、问题定位及策略优化闭环\n4. 具备清晰的运营逻辑思维，能将业务目标拆解为可执行的运营动作\n5. 有带领运营团队或主导跨部门协作的经验，执行力强\n6. 适应快节奏迭代环境，结果导向\n\n**加分项**\n\n- 有付费订阅类产品运营经验\n- 熟悉海外市场用户行为及增长策略\n- 有用户分层运营及精细化运营实战经验\n- 有工具类产品从0到1孵化成功案例", "cat": "运营与市场"}, {"id": "32", "title": "中高级漫画运营", "salary": "15-30K", "location": "远程，可国内办公", "jd": "**高级动漫运营岗位 JD**\n\n岗位职责\n\n1. 负责动漫内容全链路运营，涵盖内容筛选引入、更新排期、分发策略制定，从0到1搭建及维护动漫内容生态。\n2. 主导动漫用户增长策略，结合二次元用户偏好设计拉新、促活、召回方案，实现用户规模与使用时长持续增长。\n3. 搭建内容质量分级体系，基于点击率、完读/完播率、追更率等数据动态调整资源位与流量分配，提升优质番剧/漫画曝光效率。\n4. 建立用户反馈反哺机制，跟踪评论区、弹幕等社区数据，反哺选品与内容排期优化，提升用户粘性与追更率。\n5. 制定内容标签与题材分类体系，联动算法/技术团队优化个性化推荐链路，提升内容分发效率与人均观看时长。\n6. 统筹动漫业务日活/GMV目标，输出可复用的选品与运营方法论，支撑团队指标达成。\n\n任职要求\n\n1. 5年以上互联网内容行业运营经验，其中3年以上动漫/二次元/ACG内容平台运营经验，须有内容行业背景。\n2. 深度熟悉二次元圈层文化、热门IP及题材趋势，对动漫/漫画市场保持高度敏感度。\n3. 有从0到1搭建内容生态或冷启动成功案例，独立操盘过日活规模化增长项目。\n4. 具备扎实的数据分析能力，能独立完成内容标签体系、流量分配模型的搭建与迭代。\n5. 熟悉内容分发算法协同逻辑，有与算法团队联合优化推荐策略的实际经验。\n6. 具备较强的团队管理与跨部门协作能力，有带教/培养团队经验者优先。\n\n加分项\n\n- 有漫画/番剧/轻小说等多品类内容生态搭建经验\n- 有独立主导追更率/留存提升专项且有清晰数据结论与方法论沉淀", "cat": "运营与市场"}, {"id": "33", "title": "高级采集工程师（网页 / APP / 社群方向）", "salary": "15-30k", "location": "远程，可国内办公", "jd": "岗位职责\n1. 网页采集，从任意站点建设完整链路（列表 → 详情 → 媒体资源），处理动态渲染、验证码、滑块、Cloudflare 等防护\n2. APP 协议逆向，逆向 Android / iOS 网络协议，还原加密请求、签名算法、Token 生成逻辑，复现为纯 HTTP 采集\n3. Telegram 社群采集，基于 MTProto 接入社群，实时监听并采集群组消息、媒体、用户信息\n4. 反爬对抗，针对 IP 限流、TLS 指纹、行为分析、WAF 等设计 bypass 方案\n5. 加解密复现，移植 RC4 / AES / RSA 等算法，从混淆源码或抓包数据逆推密钥、IV、加密模式\n6. 工程交付，采集稳定性、断点续采、并发与带宽控制、媒体下载加速、日志与告警\n\n任职要求\n1. 3 年以上采集工程经验，独立完成过 3 个以上复杂站点从零到一的采集建设，且面对的是真实线上反爬\n2. HTTP / Web 协议底层理解，能手写请求、讲清各请求头含义与常见 Content-Type 格式；理解 Cookie 持久化、CORS、重定向、缓存策略\n3. JavaScript 逆向能力，能读懂混淆 / 压缩 JS；用过 AST 反混淆或字节码 VM 反编译；能用 DevTools 断点做动态调试\n4. Go 或 Python 生产级经验，其一 3 年以上深度使用；理解并发模型、HTTP 客户端、日志与错误处理等工程细节\n5. APP 协议逆向（Android 优先），逆向过 2 个以上安卓应用的网络协议；熟练使用 Frida / Burp / Charles 做动态分析\n6. AI 协作能力，掌握「问题分解 → AI 生成 → 自主验证 → 迭代」工作流；能识别 AI 代码中的参数猜测、逻辑缺陷与安全问题并当场纠正\n\n加分项\n1. 强反爬对抗：处理过 Cloudflare Turnstile / Bot Management；理解 TLS 指纹识别原理，用过 curl_cffi、TLSClient 或商业 bypass 服务\n2. 浏览器自动化：Selenium / Puppeteer / Playwright / nodriver；能设计登录自动化与动态渲染采集方案\n3. Telegram 客户端开发：MTProto 协议或 gotd / TDLib / Pyrogram，理解账号与会话管理\n4. 分布式采集架构：任务队列、去重、断点续采、负载均衡的设计经验；理解消息队列（Kafka / RabbitMQ）与 MySQL / MongoDB / Redis 在采集链路中的分工\n5. 异构数据建模：能针对站点结构差异大、字段不稳定的场景设计 MongoDB 文档模型，并规划与关系库的分工边界\n6. 媒体处理：ffmpeg / imagemagick；理解 M3U8、DASH 流媒体协议，能下载与转封装\n7. 安全意识：熟悉常见注入类漏洞；理解凭证管理规范，不在代码中硬编码 Token", "cat": "采集与逆向"}, {"id": "34", "title": "CTO 技术助理（技术与数据方向）", "salary": "15K-18K优秀另谈", "location": "远程，可国内办公", "jd": "岗位职责\n\n一、技术与项目支持\n\n协助 CTO 跟进技术项目进度，负责任务梳理、里程碑追踪及问题反馈闭环；\n参与技术会议，输出高质量会议纪要、行动项清单及后续跟进报告；\n协助审阅和准备技术文档、项目方案、汇报材料及对外沟通文件；\n对接内部各技术团队及外部技术合作方，确保信息高效、准确流通；\n协助建立和优化项目数据追踪、指标看板及系统日志等技术管理机制。\n\n二、数据分析与决策支持\n\n收集、整理并分析技术及业务相关数据（系统性能、项目进度、成本投入、团队产出等）；\n编制周期性数据报告，为 CTO 提供数据洞察与决策参考；\n熟练运用 Excel / Power BI / SQL / Python 等工具进行数据清洗与可视化分析；\n协助搭建数据监控指标体系，提升技术管理透明度与精细化管理水平。\n\n三、文案与对外沟通\n\n独立撰写或润色中英文技术文档、项目简报、对外合作材料及管理层汇报材料；\n负责 CTO 对外英文沟通的起草、审校与跟进，确保表达准确、专业、无障碍；\n协助整理和输出技术团队对外的品牌内容、方案介绍及合规文件。\n\n四、行政与协调管理\n\n负责 CTO 日程安排、会议协调、提醒及差旅支持；\n协助组织技术部门会议、培训与跨部门沟通；\n跟进 CTO 指派任务的执行情况，定期汇总并反馈；\n协助优化 CTO 办公及信息管理流程，提高整体运作效率。\n\n任职资格\n\n本科及以上学历，计算机、信息管理、统计学、数据科学等相关专业优先；\n两年以上相关工作经验，熟悉技术项目管理或技术运营流程；\n具备扎实的技术背景，理解互联网、软件开发或系统架构的基本逻辑，能与技术团队顺畅沟通；\n熟练掌握数据分析工具（Excel、Power BI、SQL 等），具备数据建模与可视化能力；\n文案功底扎实，能独立产出高质量中英文文档，语言表达清晰、逻辑严谨；\n英语沟通无障碍，具备良好的英文读写及口头表达能力，可直接处理英文技术及商务沟通；\n逻辑思维强，具备较强的沟通协调及多任务处理能力；\n工作细致、执行力强，具备良好的保密意识与责任心；\n女生优先。", "cat": "技术开发"}, {"id": "35", "title": "推荐与广告算法产品经理", "salary": "20-40K", "location": "远程，可国内办公", "jd": "推荐与广告算法产品经理\n\n岗位职责\n\n负责公司视频、小说、漫画等内容场景的推荐系统产品建设，以及基于用户画像、兴趣标签和行为特征的广告推荐能力建设，推动用户行为数据、内容特征、广告数据与算法能力形成完整闭环。\n\n1. 内容推荐系统\n\n • 负责视频、小说、漫画等内容推荐系统的产品规划、需求设计及持续迭代。\n • 负责推荐场景梳理与产品设计，包括首页推荐流、猜你喜欢、相关推荐、内容详情页推荐、完播/完读后推荐等场景。\n • 参与推荐系统召回、粗排、精排、重排等核心链路的产品设计，与算法团队共同定义各阶段目标及策略。\n • 根据不同内容形态设计推荐目标，综合考虑 CTR、播放/阅读深度、完播/完读率、互动、留存、付费及长期用户价值。\n • 负责冷启动、探索与利用、热门内容、新内容扶持、兴趣衰减、多样性、去重、频控等推荐策略的产品设计。\n • 推动推荐策略配置化、实验化，建设策略管理、实验管理、效果监控及异常预警能力。\n • 建立推荐效果评估体系，通过 A/B Test、用户分层、漏斗分析等方式持续评估算法策略对业务指标的实际贡献。\n\n2. 用户画像与标签应用\n\n • 与 DMP / 数据团队共同建设推荐所需的用户特征体系，包括用户兴趣、内容偏好、活跃度、生命周期、消费能力、广告行为等特征。\n • 明确用户标签、实时行为特征、统计特征及算法 Embedding 等不同数据能力的使用边界。\n • 设计用户兴趣随行为变化的更新与衰减机制，支持短期兴趣与长期兴趣结合。\n • 推动用户、内容、场景等特征在推荐系统中的标准化接入与复用。\n • 参与用户冷启动、匿名用户、跨端用户识别等场景的推荐方案设计。\n\n3. 广告推荐与商业化\n\n • 负责基于用户画像、兴趣标签、行为特征及广告属性的广告匹配与推荐能力建设。\n • 建设广告候选集、定向条件、用户与广告匹配、频次控制、广告过滤等基础能力。\n • 与广告平台、DMP及算法团队协作，推动用户特征在广告推荐和商业化场景中的合理使用。\n • 参与广告 CTR、CVR、eCPM 等预估与排序策略的产品设计，并持续评估广告收益与用户体验之间的平衡。\n • 支持广告推荐效果分析，包括曝光、点击、CTR、转化、收入、eCPM、用户负反馈等指标。\n • 设计广告实验与流量分层机制，评估不同广告策略对广告收入、内容消费、留存及用户长期价值的影响。\n • 支持广告系统后续从规则匹配逐步向个性化推荐、智能排序及收益优化演进。\n\n4. 数据与实验体系\n\n • 建立推荐系统完整的数据指标体系，定义曝光、点击、播放、阅读、完播/完读、互动、留存、付费、广告转化等核心指标口径。\n • 与数据团队共同完善推荐与广告相关埋点、日志、特征及数据回流链路。\n • 建设推荐策略效果看板、模型版本看板、实验看板及异常监控体系。\n • 推动形成“用户行为 → 数据采集 → 用户/内容特征 → 模型训练 → 推荐结果 → 用户反馈 → 模型迭代”的完整闭环。\n • 能够识别 CTR 等短期指标与留存、LTV 等长期指标之间的冲突，合理设计推荐系统的评估指标与护栏指标。\n\n任职要求\n\n • 5 年以上互联网产品经验，3 年以上推荐、搜索、广告算法、增长算法或相关数据产品经验。\n • 有视频、小说、漫画、资讯、短剧、游戏、电商等大规模内容或推荐场景经验优先。\n • 真正参与过推荐系统建设，理解召回、粗排、精排、重排的基本工作机制及各阶段解决的问题。\n • 理解协同过滤、Embedding、向量召回、CTR/CVR 预估、Learning to Rank 等常见推荐算法的基本原理，不要求承担算法研发，但能够与算法工程师进行深入需求和方案沟通。\n • 熟悉推荐系统常见指标，包括 CTR、播放率、完播率、阅读深度、互动率、留存、付费率等，能够根据不同业务场景设计合理的目标指标。\n • 熟悉 A/B Test、实验分流、实验组/对照组、统计显著性及实验效果评估。\n • 具备较强的数据分析能力，能够通过数据发现推荐策略、内容供给或用户分层中的问题。\n • 理解用户画像、标签、实时特征、行为序列及内容特征在推荐系统中的作用。\n • 有广告推荐、广告排序、DMP、DSP、SSP、广告定向或程序化广告相关经验者优先。\n • 有大 DAU、高并发推荐系统经验者优先。\n\n核心能力要求\n\n我们重点关注候选人是否具备以下能力：\n\n 1 算法产品理解能力\n    能够理解推荐系统内部链路，知道召回、排序、策略和模型分别解决什么问题，而非只负责推荐页面和运营规则。\n 2 数据与指标能力\n    能够独立定义推荐效果指标，理解 CTR、完播/完读、留存、收入、LTV 等指标之间的关系，并能够设计实验验证方案。\n 3 用户理解能力\n    能够把用户行为转化为兴趣、偏好、生命周期等可供推荐系统使用的特征，并理解实时兴趣与长期兴趣的差异。\n 4 系统产品能力\n    能够设计推荐策略管理、实验平台、效果监控、模型版本管理等后台能力，将算法能力产品化、平台化。\n 5 商业化理解能力\n    能够理解内容推荐与广告推荐目标的差异，兼顾用户体验、内容消费和广告收入，避免单纯追求 CTR 或短期 eCPM。\n 6 跨团队推进能力\n    能够独立完成需求分析、PRD、原型、指标定义、技术与算法评审、研发推进、上线验收及效果复盘，与算法、数据、客户端、服务端、运营及广告团队协同推进项目。\n\n加分项\n\n • 有千万级 DAU 产品推荐系统经验。\n • 有短视频、长视频、小说、漫画、短剧等内容推荐经验。\n • 有广告推荐、广告排序或商业化算法产品经验。\n • 有 DMP / CDP / 用户画像平台建设经验。\n • 有搜索排序、向量检索、RAG 或 Embedding 相关产品经验。\n • 有推荐实验平台、特征平台、策略平台或模型管理平台建设经验。\n • 具备 SQL、Python 或数据分析能力，能够独立完成基础数据验证与问题定位。\n\n该岗位需要解决的核心问题\n\n • 如何判断一个用户当前最可能消费什么内容？\n • 如何同时利用长期兴趣和最近几分钟、几小时产生的短期兴趣？\n • 视频、小说、漫画三种内容是否应该共用一套用户兴趣体系，哪些能力可以复用，哪些需要独立建模？\n • 如何解决新用户、新内容和低曝光内容的冷启动问题？\n • 如何避免推荐系统为了提高 CTR 持续推荐标题党或低质量内容？\n • 如何衡量一次推荐策略升级究竟提高了短期点击，还是提高了长期留存与用户价值？\n • 如何在内容推荐流中合理插入广告，同时控制用户疲劳和负反馈？\n • 如何利用用户兴趣、消费能力、广告行为等特征提高广告匹配效率？\n • 如何判断哪些用户应该减少广告，哪些用户可以提高商业化强度？\n • 如何建立内容推荐、广告推荐、DMP、数据中心之间清晰且可长期演进的系统边界？", "cat": "产品与管理"}, {"id": "36", "title": "内容生产总监", "salary": "30-50K", "location": "远程，可国内办公", "jd": "【岗位职责】\n1. 盘活存量：统筹管理现有内容采集团队，优化内容筛选机制，提升现有业务流水线效率；\n2. 拓展增量：从0到1组建并管理内容生产团队，主导“视频剪辑、视频深度二创、短剧生成”等新业务的落地与量产；\n3. 产能统筹：协助一号位进行整体团队管理，拉通采集组与自产组资源，协调并大幅拉升各组产能；\n4. 体系搭建：建立从内容策划、制作到审核分发的工业化SOP标准。\n\n【任职要求】\n1. 懂内容：具备扎实的内容生产与策划能力（资深编辑、新媒体主编、短视频操盘手出身），网感极佳；\n2. 懂视频与新玩法：精通短视频剪辑与深度二创玩法，对“短剧生成”、AIGC辅助内容生产有实操经验或深入研究；\n3. 懂管理：具备成建制内容团队（几十人规模）的实战管理经验，懂“工业化流水线”作业，能带兵打仗拿结果；\n4. 懂战略：不只是执行者，必须具备业务视角的战略眼光，能为业务从“单纯采集”向“自产内容生态”转型提供破局思路。", "cat": "内容与创作"}, {"id": "37", "title": "AI短剧编剧", "salary": "10K-20K", "location": "远程，可国内办公", "jd": "【岗位定位】\n负责 AI 内容项目的整体创意策划与质量把控，从剧本构思到最终成片，对作品的内容质量与传播效果负责。\n【岗位职责】\n根据运营需求完成 AI 短剧、剧情视频、宣传片等内容策划；\n独立完成剧本、人物设定、故事结构、分镜设计及创意方案；\n制定整体内容风格、节奏、镜头语言及画面表现形式；\n指导 AI 创作者完成角色、场景及视频素材生成；\n与剪辑、设计等岗位协同，推进项目按计划落地；\n对最终成片进行内容质量审核，把控整体表现（涉及合规/风险的内容，需按公司要求同步相关审核）；\n持续研究行业爆款，总结创作方法，优化团队创作流程。\n【任职要求】\n有短剧、影视、自媒体、广告等内容策划经验，具备优秀的故事创作与剧本能力；\n熟悉短视频传播逻辑及用户喜好，具备较强的审美与画面感；\n沟通协调能力好，能推动团队协作完成项目；\n有 AI 内容创作经验者优先；真人影视/短剧背景者，需具备转型 AI 内容创作的意愿与能力（我们的内容方向以 AI 生成为主，纯真人制作背景、且无转型意愿者不匹配）。\n【加分项】\n熟悉 ChatGPT、Claude 等 AI 创作工具；\n有导演、影视、广告行业经验，或有爆款内容案例；\n熟悉海外内容平台。", "cat": "内容与创作"}, {"id": "38", "title": "高级剪辑", "salary": "10K-20K", "location": "远程，可国内办公", "jd": "【岗位定位】\n负责 AI 内容制作全流程，从 AI 素材生成到视频包装，独立完成高质量内容输出，对最终成片效果负责。\n【岗位职责】\n根据剧本完成 AI 图片、视频等素材生成，使用 AI 工具制作角色、场景、镜头及动画；\n独立完成视频剪辑、字幕、配音、转场及节奏优化；\n完成封面、海报、宣传图等平面设计工作；\n持续优化 AI 生成效果，提升内容质量与制作效率；\n与编剧保持沟通，确保作品风格统一；\n建立 AI 创作素材库及项目模板，提高团队复用效率。\n【任职要求 · 必备】\n熟练掌握 Premiere、剪映、Final Cut、DaVinci 等至少一款剪辑软件；\n对镜头节奏、画面构图及视觉表达有较强理解，审美与内容包装能力强；\n能独立完成从素材制作到最终成片的全部流程。\n\n【任职要求 · 熟悉即可（可入职后补齐）】\n熟悉 Midjourney、Flux、Runway、Veo、Kling、即梦等 AI 生成工具；\n熟悉 Photoshop、Figma、Canva 等设计工具。\n\n【加分项】\n\n有 AI 短剧制作经验或影视后期经验；\n熟悉 AIGC 工作流；\n熟悉短视频平台内容传播规律。", "cat": "内容与创作"}, {"id": "39", "title": "新媒体运营（国外媒体方向）", "salary": "10K-20K", "location": "远程，可国内办公", "jd": "一、岗位职责\n1.负责X（Twitter）为核心的账号矩阵运营\n\n搭建并管理多账号矩阵（内容号 + 流量池号）\n\n制定内容策略，提升曝光、互动与粉丝增长\n\n通过推荐流机制放大内容，持续产出稳定流量\n\n多平台分发与放大\n\n将内容同步分发至 TikTok / Telegram / Instagram /  等平台\n\n\n2.建立跨平台流量回流链路\n\n搭建完整转化链路\n实现从「内容 → 点击 → TG/网站 → 转化」的闭环\n\n负责产品的导流策略\n\n优化主页、跳转路径、话术，提高转化率\n\n内容生产与爆款复制\n\n持续跟踪海外成人/AI/擦边内容趋势\n\n拆解爆款结构（标题/封面/视频节奏）并复用\n\n与运营/编剧/剪辑/协作，提升内容质量与产量\n\n3.数据分析与优化\n\n每日监控账号数据（曝光、点击、互动、转化）\n\n输出数据复盘，优化选题与内容结构\n\n通过数据驱动增长（而不是拍脑袋做内容）\n\n4.AI工具与自动化应用\n\n使用 AI 工具进行文案、图片、视频处理（如 ChatGPT / MJ / ComfyUI 等）\n\n配合 agent 实现内容生产、发布、数据监测自动化\n\n提升整体运营效率\n\n 二、任职要求\n1.经验要求\n\n3年以上海外自媒体运营经验(最好5年工作经验)\n熟悉 X（Twitter）平台机制（推荐流 / 标签 / 账号权重）\n\n有账号从0-1或矩阵运营经验优先\n\n2.能力要求\n\n具备完整的「内容 → 流量 → 转化」运营思维\n\n能独立完成选题、文案、发布及优化\n\n对数据敏感，能通过数据分析调整策略\n\n3.行业认知\n能接受成人内容方向\n对海外中文用户，其他用户偏好有一定理解\n\n熟悉擦边/成人内容边界与平台规则\n\n4.执行与协作能力\n\n结果导向，执行力强\n\n能与编剧、剪辑、产品团队高效配合\n\n 三、加分项\n1.有 成人站 / 色站  相关经验\n\n2.熟悉 Telegram 运营（频道 + 群 + 机器人玩法）\n\n3.有 矩阵号放量经验（10+账号以上）\n\n4.熟悉  TikTok / Porn类站点引流\n\n5.会使用 AI工具：\n\n有自动化/agent使用经验", "cat": "运营与市场"}, {"id": "40", "title": "高级安全攻防工程师（管理经验优先）", "salary": "35k-70k", "location": "远程，可国内办公", "jd": "岗位职责\n负责公司网络安全攻防体系规划和团队日常管理。\n制定安全测试及红蓝对抗计划。\n组织对公司网站、APP、API、服务器和云环境进行授权渗透测试。\n负责重大安全事件的研判、指挥、止损、溯源和复盘。\n建立攻防测试授权、操作审计、漏洞分级和修复验收机制。\n协调运维、研发、测试、CDN及各公司技术负责人完成安全整改。\n评估新的攻击方式，并转化为内部防护方案。\n向CTO输出集团安全风险报告和重点整改建议。\n\n任职要求\n5年以上网络安全、渗透测试或应急响应经验。\n熟悉Web、API、APP、主机、容器、云环境的常见攻击面。\n能独立处理入侵、黑链、盗流、域名劫持、DNS污染、DDoS、数据泄露等事件。\n熟悉Linux、Nginx、CDN、WAF、MongoDB、Redis、Kafka等常见环境的安全风险。\n熟悉Go、Java、PHP中至少两种技术栈的代码安全问题。\n具备较强的跨团队推动和风险判断能力。\n有大型互联网业务、红蓝对抗或重大应急事件经验优先。", "cat": "安全攻防"}, {"id": "41", "title": "高级Java工程师（推荐系统方向）", "salary": "25-40K", "location": "远程，可国内办公", "jd": "岗位职责\n1.  参与项目组产品评审，根据需求进行功能梳理、开发计划及相关技术文档编写\n2.  参与项目组的任务开发，包括后台模块、接口开发\n3.  协作团队顺利推进项目进度，解决疑难问题\n4.  在计划内协作完成项目的交互，对项目实施提供支持和优化建议。\n\n任职要求\n1.  全日制本科及以上学历，计算机、软件工程等相关专业；\n2.  五年以上Java开发经验，有移动端互联网短视频相关行业经验者优先；\n3.  熟练掌握 Spring Boot/Spring Cloud、Dubbo、ZooKeeper、MyBatis、MySQL、MongoDB、Redis、RabbitMQ 等技术；\n4.  熟悉常见的中间件、分布式解决方案及其原理：分布式缓存、微服务、云原生、消息中间件、负载均衡、连接池等；\n5.  具备较强的分析设计能力，能够根据业务需求设计合理的技术解决方案。\n6.行业筛选做web3/区块链/包网/BC暂不考虑\n7.必须要有推荐系统相关经验，内容推荐或广告推荐", "cat": "技术开发"}, {"id": "42", "title": "高级 Web 前端工程师", "salary": "20-30K", "location": "远程，可国内办公", "jd": "高级 Web 前端工程师\n\n【任职要求】\n\n一、基础能力\n\n1. 7 年及以上 Web 前端开发经验，具备扎实的 HTML、CSS、JavaScript、TypeScript 基础。\n\n2. 对前端技术体系有较深入的理解，具备良好的编码习惯、代码设计及抽象能力。\n\n3. 具备复杂问题分析与排查能力，能够独立完成技术方案设计并解决疑难问题。\n\n二、Vue3 / React\n\n1. 精通 Vue3 及相关生态，深入理解组件化、响应式、状态管理等核心机制，具备复杂项目实战经验。\n\n2. 具备 React 实际项目开发经验，熟悉 React 常用开发模式及相关生态。\n\n三、UI 组件库（硬性要求）\n\n1. 必须具备 UI 组件库实际开发经验，有通用 UI 组件设计、开发或维护经历。\n\n2. 具备较强的组件抽象能力，能够合理设计组件 API，并充分考虑通用性、扩展性和可维护性。\n\n3. 对组件封装、公共能力沉淀及复杂组件设计有实际经验。\n\n四、工程化能力\n\n1. 熟悉 Vite、Webpack 等前端工程化工具，对模块化、构建、依赖管理及性能优化有实际经验。\n\n2. 具备良好的前端架构及工程化意识，关注代码质量、可维护性、可扩展性及项目长期演进。\n\n3. 能够参与技术方案设计、Code Review 及团队技术规范建设。\n\n五、AI 辅助研发能力\n\n1. 具备将 AI 工具融入日常研发流程的能力，熟练使用 Claude Code、Cursor、GitHub Copilot、ChatGPT 等 AI 工具中的一种或多种。\n\n2. 能够使用 AI 辅助需求分析、技术方案设计、编码、重构、测试、Code Review 及问题排查。\n\n3. 具备良好的 Prompt / Context 组织能力，能够结合项目上下文、业务需求和技术规范，通过 AI 完成复杂研发任务。\n\n4. 具备 AI 代码审查能力，能够判断 AI 生成代码的正确性、安全性及可维护性，并对最终代码质量负责。\n\n【加分项】\n\n1. 了解或实践过 Web Components，熟悉 Custom Elements、Shadow DOM 等相关技术。\n\n2. 有从 0 到 1 建设或深度参与企业级 UI 组件库的经验。\n\n3. 有 npm Package、Web SDK 或前端基础设施开发经验。\n\n4. 有 Nuxt.js、Next.js 等 SSR / SSG 项目开发经验。\n\n5. 有大型中后台或复杂 Web 系统开发经验。\n\n6. 对 Vue3 或主流 UI 组件库底层实现、源码有一定研究。\n\n7. 有较深入的 AI Coding / AI Agent 实践经验，能够利用 AI 完成跨文件分析、功能开发、重构及测试等完整研发任务。\n\n8. 有项目级 AI Rules、Skills、Prompt 规范或团队 AI 研发工作流建设经验。\n9.人选尽量不要有东南亚海外工作经验\n\n【核心筛选条件】\n\n工作经验：7 年及以上 Web 前端开发经验\n\nVue3：精通，有复杂项目实战经验\n\nReact：有实际项目开发经验\n\nUI 组件库：硬性要求，必须有真实开发经验\n\nAI：能够熟练使用 AI 辅助实际研发，并具备 AI 代码审查能力\n\nWeb Components：加分项", "cat": "技术开发"}, {"id": "43", "title": "AI 内容训练师", "salary": "10k-14K", "location": "远程，可国内办公", "jd": "我们在做什么\n我们自研了一套多模态内容理解系统,每天处理数万次内容判定。模型能力的上限,取决于喂给它的数据质量 —— 这就是这个岗位的价值:你标什么,模型就学成什么样。\n岗位职责\n一、模型训练数据生产\n1.按标签体系对图片、视频、文本做合规性标注,输出违规类型、风险等级与判定依据。\n2.标注视频精彩片段、图片组优选结果 —— 这部分靠内容判断力:哪一帧适合做封面、哪一段值得推荐,标准不是死的。\n3.对「检索词 — 召回内容」做相关性打分,标注错召、漏召样本。\n二、内容生产与校对\n4.为模型撰写标准范例:针对视频/图片撰写标题、摘要、素材描述,作为模型学习的黄金样本。\n5.校对模型生成的标题与描述,判断是否准确、是否过度弱化或过度暗示,给出修改后的正确版本。\n6.复核线上模型误判样本,给出正确结论并归因,回流训练集。\n7.维护标注进度与质量看板,输出日/周数据;跟进业务方反馈的问题样本;记录规范执行中的歧义点并提报。\n三、质量与标准（高级）\n8.质量把关:抽检团队产出(抽检率 ≥10%),计算准确率与多人一致性,输出质检报告。\n9.标准制定:维护标注规范与标签体系,把「什么算精彩」「什么算好标题」这类主观判断,收敛成可执行的文档。\n10.黄金样本集建设:主导优质范例的撰写与评审,这套样本直接决定模型的输出上限。\n11.训练集管理:管理已标注数据的版本、分布与去重,避免类别塌陷。\n12.效果闭环:跟踪模型上线后准确率变化,定位是数据问题还是模型问题,反向指导下一轮标注重点。\n13.组织团队培训与对齐会,仲裁歧义样本。\n任职要求\n●大专及以上\n●有内容感知力 —— 能说清楚「这个封面为什么比那个好」「这个标题差在哪」。这是本岗位最看重的一点,比学历和过往经验都重要\n●文字表达通顺,能独立写出准确、不夸张的内容描述与标题\n●性格稳定、耐心细致,能长期执行标准化流程\n●熟练使用电脑与基础办公软件\n●保密意识强,严格遵守数据安全规定\n加分项\n●有内容编辑、新媒体、短视频、内容平台、数据标注或内容审核相关经验\n●1 年以上相关经验,做过质检或带过小团队\n●能把主观判断写成客观规范 —— 本岗位最核心也最稀缺的能力,面试重点考察\n熟练使用 Excel(透视表、基础函数);了解准确率/召回率等基本概念,或愿意快速学习", "cat": "内容与创作"}, {"id": "44", "title": "商务数据分析专员", "salary": "7-10k", "location": "远程，可国内办公", "jd": "147", "cat": "运营与市场"}, {"id": "45", "title": "效能督查官", "salary": "18K-25K", "location": "远程，可国内办公", "jd": "岗位名称：效能督查官\n\n汇报对象：CTO\n\n岗位职责\n\n1. 跟进各部门及项目组的进度执行情况，定期核查任务排期与里程碑达成情况是否符合既定节点。\n2. 核实各部门实际产出与汇报内容是否一致，发现进度失真、责任归属不清等问题时，及时与相关负责人核实并推动整改。\n3. 收集整理各部门的项目进度与产出数据，形成统一格式的督查报告，按周期汇总提交给上级。\n4. 对反复出现问题且未有效整改的部门或责任人，如实上报，保持客观公正，不做选择性汇报。\n5. 建立并维护可量化的进度跟踪机制，如项目清单、进度看板等，使督查工作有据可查。\n6. 视情况参与跨部门协调，推动阻塞事项落地，确保督查结果转化为实际改进。\n\n任职要求\n\n1. 具备较强的原则性与抗压能力，能够客观、坚定地指出问题，沟通专业、不情绪化。\n2. 逻辑清晰、表达直接，能够准确、简洁地传达复杂的进度信息。\n3. 具备项目管理、运营督导、审计或同类对结果负责岗位的相关经验者优先。\n4. 熟练使用表格及看板工具（如Excel、飞书多维表格、Notion等）进行数据整理与呈现。\n5. 对业务有基本理解，能够判断进度延误的真实原因。\n6. 具备良好的向上沟通能力，能够客观、完整地向管理层汇报情况。\n\n核心素质要求\n\n1. 标准统一、对事不对人，不因人情关系而调整判断尺度。\n2. 抗压能力强，能够承受督查过程中的抵触情绪。\n3. 结果导向，跟进问题直至闭环，而非止步于提醒。", "cat": "职能与行政"}, {"id": "46", "title": "AI美术师", "salary": "10K-20K", "location": "远程，可国内办公", "jd": "职位描述： 用生成式影像为故事提供视觉支撑，为角色注入灵魂，。\n核心职责：\n1.\t视觉开发： 结合剧本和导演意图，利用AI图像工具创作具备“电影级质感”的关键帧。\n2.\t核心资产生成与管理： 负责场景概念设定、角色设计及核心视觉资产的生成与优化，确保整体视觉风格的高度统一。\n3.\t服务于故事的美学表达： 以叙事为驱动力，通过美术设定（服装、道具、场景细节）来暗示人物背景、强化矛盾冲突、烘托本土化的情绪氛围。\n任职要求：\n1.\t叙事本位的美术思维： 深刻理解“美术是为了讲故事”，能准确捕捉并视觉化剧本中的情感内核。\n2.\t极高的审美标准： 对光影、构图、色彩搭配有严苛的要求，能驾驭高品质的电影感视觉风格。\n3.\t精通AI绘画工具： 熟练使用MJ、SD等工具，具备极强的生图控制力（如角色一致性控制、局部重绘、精准的光源及材质表达）。\n4.\t扎实的美术基本功： 熟练掌握PS等后期修图软件，具备优秀的手绘基础或传统CG（Blender/Maya）经验，能对AI生成结果进行精细的后期处理与拼贴修正。\n5.\t加分项： 对于comfyui等AI工作流有过深入研究。", "cat": "内容与创作"}, {"id": "47", "title": "运营主管", "salary": "30k-50K", "location": "远程，可国内办公", "jd": "岗位职责\n负责所辖产品线(APP/WEB 内容产品)的整体运营,对 DAU、留存、付费/变现及 ROI 等核心指标负责;\n制定并落地用户增长与运营策略,统筹内容运营、渠道投流配合、活动配置、用户召回与留存提升;\n搭建并带领运营团队,拆分目标、排期与分工,带团队达成业务指标;\n数据驱动:建立新增—活跃—留存—付费漏斗的监控体系,定位问题、快速迭代;\n跨部门协同:与产品、技术、投放、SEO、商务紧密配合,打通\"流量获取—产品—变现\"闭环;\n复盘渠道效果与获客成本(CAC),优化投放与变现结构,持续提升人效与产出。\n任职要求\n本科及以上(重点院校或头部互联网公司背景优先);5 年以上互联网 C 端产品/内容运营经验、3 年以上团队管理经验,带过 10 人以上团队或独立操盘过完整产品线;\n有高流量 C 端产品/内容分发平台背景,主导过百万级 DAU 或规模化用户增长/变现项目,并有可量化的硬结果(DAU、留存、ROI、GMV 等);\n极强的数据驱动能力,能独立搭建指标体系,用数据(DAU/留存/LTV/ROI/漏斗)做决策与复盘;\n精通买量投放、内容运营、活动运营中至少两项,深刻理解从流量获取到变现的完整链路与经济模型(CAC/LTV/回收比);\n目标感与结果导向极强、能扛指标、抗压,能在快节奏下带团队持续拿结果;\n优秀的跨团队沟通、资源协调与团队搭建/人才培养能力。\n加分项\n有短剧 / 工具类 / 矩阵型产品运营经验;\n有完整 SEO 或渠道投流落地经验;\n有从 0 到 1 搭建运营体系或团队的经验。", "cat": "运营与市场"}, {"id": "48", "title": "高级视频策划导演", "salary": "15 - 25k", "location": "远程，可国内办公", "jd": "岗位职责：\n在 AI 工具已能高效生成素材的当下，\"\"镜头语言\"\"与\"\"艺术决策审美\"\" 才是真正的竞争护城河。你不仅是整个影像叙事的最终决策者，也是剧本文字与 AI 画面生成之间的关键翻译层。你需要将剧本转化为可执行的视觉蓝图，并把控从文字到画面的完整影视化转化。\n1. **剧本视觉化转化（核心职责）\n   - 负责将文字剧本逐场拆解、转制成**可用于 AI 生产的分镜头脚本**，包含景别、构图、角色站位、视线方向、运镜轨迹等完整指令信息。\n   - 为后续 AIGC 视频生成环节提供精准的视觉锚点，确保每一帧生成结果都能直接达到视频制作标准。\n2. 图像分镜产出（核心职责）\n   - 不仅输出文字化的分镜脚本，还需要产出**可视化的图像分镜**——通过 3D 布图工具进行空间预演，或使用**主流 AI 图像生成模型**快速生成分镜参考图。\n   - 图像分镜需准确传达构图、景别、光源方向与角色空间关系，作为 AIGC 视频生成专员的直接生产依据，最大限度减少生成损耗与返工。\n3. 镜头语言把控与美学筛选\n   - 设计并把控每一场戏的镜头组接逻辑（特写/中景/全景的切换节奏），严格遵守轴线规则，杜绝跳轴与视点混乱。\n   - 把控角色间的空间关系与调度；从 AI 视频生成专员产出的素材中进行专业级的**美学筛选**。\n4. 影片产出与成片把控（核心职责）\n   - 不只是出分镜就交付——需**全流程跟进影片从素材生成到成片输出**，对剪辑节奏、配音配乐、调色、字幕等关键节点进行导控。\n   - 作为成片质量的**最终责任人**，与 AI 视频生成专员、后期剪辑形成闭环协作，确保最终影片严格符合分镜阶段确立的艺术意图。\n5. \"\"1+1\"\" 双轨内容导控\n   - 按照 Sinema 的模块化生产策略，把控\"\"合规引流版（SFW）\"\"与\"\"深度版（NSFW）\"\"两套成片在叙事节奏、情绪曲线和镜头编排上的各自完整性。\n6. SOP 与模板沉淀\n   - 参与/主导分镜 SOP、Prompt 模板、风格标签库的沉淀；与技术组（Tim）协同迭代内容创作智能体 v4.5 集、真机日志体系的建设与口径维护,与数据侧对齐指标定义;\n硬性要求\n8 年以上前端经验,其中 5 年以上流媒体播放方向,带过人或实际承担过技术负责角色;\n深入过多个播放内核,深入的标准是:能解释 hls.js 的 startLevel/ABR 决策链,和ExoPlayer 的轨道选择、带宽估计与缓冲语义,而不只是会调 API;\n懂 HTTP 缓存与 CDN 分层:能读多级 CDN 的缓存头、区分边缘/中间层/回源各自的命中语义,定位\"慢在哪一层\";理解清单/分片的缓存策略对起播的影响;\n工程正确性素养:乐观更新与竞态、请求去重与幂等、会话与环境隔离、灰度与强更链路;\n熟练 React 与 TypeScript;Flutter 或原生端(Android/iOS);\n以实测为准的工作习惯:结论必须有数据或可复现的验证路径,给服务端提问题时能附上判据与验收方式。\n加分项\n做过直播:低延迟 HLS/WebRTC/FLV 选型、IM 与弹幕系统、礼物与互动玩法前端;\n在跨境/弱网环境下优化过播放(大陆访问境外源站的场景尤佳);\n自建过前端可观测性(埋点 SDK、崩溃采集、性能 trace),而非只接过第三方;\n改过开源播放器内核或 Flutter 插件原生层并能拿出 diff;\n对指标口径敏感:能识别\"完播率里混着拖到片尾的水分\"这类数据陷阱。", "cat": "内容与创作"}, {"id": "61", "title": "直播前端开发工程师", "salary": "20K～30K", "location": "远程，可国内办公", "jd": "岗位职责\n\n负责短剧、女性向产品的 H5 / Web / App 前端开发及版本迭代。\n负责视频播放、内容推荐、会员/付费、互动等核心页面和功能开发。\n配合产品、UI、后端完成需求评审、联调、上线及问题修复。\n优化页面性能、加载速度及不同机型、浏览器的兼容性。\n\n任职要求\n\n3年以上前端开发经验，熟悉 Vue / React 等主流前端框架。\n有短剧、泛娱乐、内容社区、女性向产品相关项目经验优先。\n有 H5、移动端适配及视频类产品开发经验。\n能独立承接模块开发，沟通和问题处理能力较好。\n有 Flutter / React Native 或混合开发经验优先。\n\n如果是放招聘表里的简单版JD，可以直接写：\n\n负责短剧、女性向产品前端开发及迭代，要求5年以上前端经验，熟悉 Vue/React，有H5、视频播放、内容社区或泛娱乐项目经验；有短剧、女性向产品经验优先。", "cat": "技术开发"}, {"id": "62", "title": "直播产品经理", "salary": "20K～30K", "location": "远程，可国内办公", "jd": "负责直播产品从需求规划到上线迭代的全流程，包括主播开播、用户观看、互动、内容审核、直播管理及运营后台等核心功能；结合用户、主播及运营反馈持续优化产品体验，协调研发、测试、运营等角色推进需求落地，并通过数据及线上问题复盘持续优化产品。\n任职要求\n本科及以上学历，3年以上互联网产品经验，有直播、短视频、内容社区或泛娱乐平台产品经验优先；熟悉直播核心业务流程，具备较强的需求分析、产品设计、项目推进及跨团队协调能力，能够独立负责完整产品模块。\n加分项\n有直播平台从0到1建设经验，熟悉主播、公会、内容审核、直播互动或商业化业务，有海外直播产品经验优先。", "cat": "产品与管理"}, {"id": "63", "title": "直播中台内容专员", "salary": "10-15k", "location": "远程，可国内办公", "jd": "直播中台内容专员\n岗位简介：\n直播中台支撑岗位，服务公司数百个直播间矩阵。主打标准化内容体系搭建 + 主播点对点内容优化，通过 IP 人设、剧情钩子、话术体系、竞品调研，整体提升全矩阵直播间停留与内容质量。\n\n岗位职责\n1.IP 人设体系搭建\n搭建矩阵通用主播人设模板、风格框架，统一内容标准；针对不同主播特质，输出个性化人设优化方案，打造差异化标签。\n2.直播内容 & 钩子 & 话术中台建设\n沉淀全矩阵通用直播流程、留人剧情、开场 / 中场 / 收尾钩子、互动控场话术库。输出可批量复用的内容模板，同时针对主播表达、节奏、留人短板，做点对点优化指导。\n3.行业 & 竞品调研分析\n持续拆解行业头部及对标直播间，分析竞品人设打法、内容结构、留人逻辑、节奏玩法，输出调研总结与可落地迭代方案；同步梳理内容合规红线，规避矩阵批量违规风险。\n4.数据复盘与内容迭代\n基于矩阵直播数据，复盘整体内容问题，输出批量优化方案及单个主播提升建议，持续更新中台内容素材与方法论。\n5.内容赋能落地\n输出培训素材、话术模拟、内容纠错，帮团队主播统一提升内容能力。\n\n任职要求\n1.熟悉直播内容逻辑，懂人设打造、剧情设计、留人钩子、直播节奏与话术优化。\n2.具备优秀的竞品拆解、行业分析、总结归纳能力，能产出标准化、可复用的中台内容方案。\n3.视野偏向矩阵批量赋能，不局限单直播间单点运营思维。\n4.文案清晰、逻辑强，可独立输出方案、整改建议与内容素材库。\n\n优先经验\n1.有娱乐直播、剧情直播赛道内容中台从业经验优先。\n2.有服务200 + 以上直播间矩阵、规模化主播内容赋能经验优先。\n3.有话术库、人设库、直播内容体系搭建、批量竞品拆解项目经验优先。\n4.熟悉直播风控合规，有内容风险梳理经验优先。", "cat": "内容与创作"}, {"id": "64", "title": "中高级产品经理（女性向播放器方向）", "salary": "15-30K", "location": "远程，可国内办公", "jd": "负责女性向播放器产品的规划、设计与迭代；\n 围绕用户增长、留存、会员转化、内容消费等核心指标开展产品设计；\n 负责播放、推荐、搜索、收藏、互动等核心功能设计；\n 深入研究女性用户内容消费习惯及情感需求，持续优化产品体验；\n 协同研发、设计、运营团队推动产品从0到1落地及持续迭代；\n 关注行业趋势及竞品动态，持续探索新的产品机会。\n\n任职要求\n\n 本科及以上学历，5年以上互联网产品经验；\n 具备完整0-1产品经验；\n 有视频平台、内容平台、社区产品、内容消费产品经验优先；\n 熟悉DAU、留存、转化率、会员付费等核心指标；\n具备优秀的用户洞察能力、数据分析能力和项目推动能力；\n能适应快速迭代和高不确定性的创新业务环境。\n\n加分项\n乙女游戏从业 ｜ 晋江、Lofter、长佩、B站国创 ｜ 同人二创 ｜ 成人向行业经历（加分，不减分）\n 有女性向内容产品、社区产品、短剧产品经验；\n 有会员体系、推荐系统、内容分发产品经验；\n 有成功增长案例或爆款产品经验；\n 对女性用户内容消费和内容偏好有深入理解。", "cat": "产品与管理"}, {"id": "65", "title": "小说产品经理", "salary": "15-30K", "location": "远程，可国内办公", "jd": "岗位职责\n\n1、负责小说/网文阅读器核心体验产品设计与迭代，主导阅读页交互、排版渲染、翻页逻辑、阅读工具、沉浸式体验等核心模块优化，持续提升用户阅读时长、完读率与留存。\n\n2、负责阅读器全链路体验优化，包括字号字体、行间距、排版适配、异形屏适配、护眼模式、夜间模式、断章纠错、预加载、离线缓存、多设备进度同步等核心场景。\n\n3、负责阅读工具体系建设，涵盖书签、笔记、划线、听书、自动翻页、防误触、文本操作等功能迭代，持续优化用户沉浸式阅读体验。\n\n4、平衡用户体验与商业化需求，负责阅读场景广告、付费权益、VIP阅读体系、章节解锁等产品策略设计，合理控制商业化阈值，实现收益与用户体验双赢。\n\n5、对接内容风控、自动化质检体系，梳理内容错章、漏章、乱码、敏感内容脱敏等场景，优化内容校验规则，降低用户投诉与阅读故障率。\n\n6、基于用户行为数据、版本数据、用户反馈，定位体验短板，输出迭代方案，持续优化核心数据指标。\n\n7、独立完成需求调研、需求梳理、优先级判断、PRD输出、原型设计、版本评审、迭代跟进、灰度上线与版本复盘，推动研发、测试、运营高效落地。\n\n任职要求\n\n1、本科及以上学历，2年及以上网文/小说阅读器产品经验，熟悉阅读器底层体验与行业玩法。\n\n2、深刻理解长文本阅读场景，对排版、渲染、翻页手感、卡顿、加载速度等细节有极强敏感度。\n\n3、具备成熟的需求优先级判断能力，能够区分核心需求、迭代需求与伪需求，具备独立负责版本迭代的能力。\n\n4、有网文免费/付费商业化产品经验，熟悉广告激励、会员体系、阅读权益设计者优先。\n\n5、具备基础数据分析能力，能够通过数据发现问题、拆解问题、驱动产品优化。\n\n6、逻辑清晰、执行力强、抗压能力强，沟通推进能力优秀，能高效跨部门协同。", "cat": "产品与管理"}, {"id": "66", "title": "直播运营专员", "salary": "12-15k", "location": "远程，可国内办公", "jd": "负责直播间内容审核,确保内容符合平台规范及监管要求\n处理主播在直播过程中遇到的问题及突发情况,及时响应协调\n跟进主播开播时长、房间状态等日常运营数据\n配合主播招募、公会对接等相关运营支持工作\n参与平台活动执行、主播激励政策落地\n任职要求:\n本科及以上学历\n1年以上直播平台运营/审核相关经验,有成人内容审核经验优先\n工作细致、责任心强,能承受一定内容审核压力\n沟通协调能力强,能妥善处理主播突发问题\n能适应晚班/轮班工作制(直播行业黄金时段为晚8点-12点)\n认同平台内容尺度定位,心理素质稳定", "cat": "运营与市场"}, {"id": "67", "title": "效能支撑部-项目助理", "salary": "12-20K", "location": "远程，可国内办公", "jd": "岗位职责\n1.负责项目全生命周期跟踪，建立项目进度台账，及时掌握项目状态及关键节点完成情况；对延期风险、资源冲突及异常事项进行预警与升级处理。\n2.协调产品、研发、测试、运营等相关团队资源，推动跨部门协作问题解决；针对项目推进过程中的阻塞事项进行跟踪闭环，确保问题及时解决并形成明确结论。\n3.识别项目推进过程中的潜在风险与异常情况，建立项目风险清单；推动责任部门制定解决方案并跟踪落地，降低项目延期及交付风险。\n4.收集项目交付相关数据，分析延期、返工、协同效率等关键指标；定期输出项目效能分析报告，发现影响项目交付效率的关键问题并提出改善建议。\n5.参与项目管理机制建设与持续优化；推动跨部门协同机制、项目管理规范及问题升级机制落地，持续提升组织协作效率。\n6.整理项目典型案例、最佳实践及常见问题解决方案；建立项目经验库，推动优秀经验复制与推广。\n\n\n任职要求\n1.3年以上互联网、软件研发、项目管理、运营管理等相关工作经验；\n2.熟悉互联网产品研发流程，对产品、研发、测试、运营协作模式有较好理解；\n3.具备较强的项目推进意识和结果导向意识；\n4.具备优秀的沟通协调能力，能够推动跨部门问题解决；\n5.具备较强的问题分析能力，能够快速识别项目阻塞点及风险；\n6.具备较好的数据分析能力，能够通过数据发现问题并形成改善建议；\n7.具备较强的执行力与责任心，能够同时推进多个项目并保证跟踪质量；\n8.具备良好的文档编写及汇报能力，能够以结构化方式向管理层反馈项目情况；\n9.加分-有PMO、项目管理、项目运营相关经验者优先；\n10.加分-具备PMP、ACP等项目管理认证者优先；\n11.加分-有中大型互联网项目管理经验者优先", "cat": "产品与管理"}, {"id": "68", "title": "产品专员", "salary": "20k-28k", "location": "远程，可国内办公", "jd": "\"\n1.3年以上产品经理经验或3年以上UX\\UI经验； 低于3年 直接不考虑\n2.核心能力要求：洞察力、推动力、框架思考能力；\n3.全日制本科毕业；\n4.有跨欧洲时区工作条件优先，不可跨时区工作者无需熬夜；\n5.有统筹过百万DAU以上产品或产品矩阵经验优先；\n\"        \"【岗位职责】 \n1.对上百个产品有序做体验报告，生成优势说明、缺点清单、改进逻辑、改进方案，参考交互；\n2.从需求阶段介入每个产品的需求文档，对其中交互部分进行交互优化建议，降低后期成本；\n3.依据产品现状与行业领军产品制定交互规范，并监督规范落实到位，对于落实延期的产品要进行日、周总结和月度复盘；\n4.深度研究字节、腾讯等大流量产品的交互优势、适应人群等，形成通用需求文档交付给各个研发团队；\n5.监督测试团队的测试结果和落实结果；\n6.部门内其他交付的产品、交互、测试、运营相关的调研任务等；\"", "cat": "其他"}, {"id": "69", "title": "督导专员", "salary": "15-35k", "location": "远程，可国内办公", "jd": "1.流程体系搭建与优化：\n建立并持续完善 项目管理标准流程（含立项、评审、变更等环节），输出标准化模板（如风险清单、交付文档等），推动跨部门协同流程落地，提升项目运作效率。​\n2.进度与风险管控：\n实时跟踪项目进度，识别项目中的关键风险点（如资源冲突、技术瓶颈、合规要求等），建立风险台账并制定应对预案，协调内外部资源解决项目阻塞问题，降低项目延期、返工风险。​\n3.数据复盘与赋能：\n收集项目核心数据，形成项目复盘报告，提炼经验教训并输出优化建议；搭建项目管理知识沉淀体系，赋能项目团队提升管理能力。​\n4.人才与事件追踪\n在所负责系统内主动观察一线人才，建立人才挖掘报告与持续跟踪机制；同时对部门内值得关注的事件进行追踪记录，形成事件库。\n\n任职要求\n1.6年以上IT系统管理、项目交付或产品管理相关经验。\n2、PMP等相关资质认证者优先；\n3、有良好的沟通能力，抗压能力强，能够适应较复杂的合作环境;\n4. 具备结构化复盘与表达能力，可以结论先行的方式向管理层汇报。", "cat": "运营与市场"}, {"id": "70", "title": "高级品牌策划", "salary": "20-35K", "location": "远程，可国内办公", "jd": "岗位名称：高级品牌策划\n\n岗位职责\n1. 负责集团品牌整体策略规划、品牌定位迭代、品牌理念及价值体系搭建，输出标准化品牌策略方案。\n2. 统筹年度品牌传播主题、节点营销、品牌IP内容、全域传播策略的策划与落地，主导品牌升级、品牌焕新等重点专项项目。\n3. 深度拆解行业竞品品牌打法、市场趋势及用户偏好，输出品牌市场分析、策略优化报告，持续迭代品牌运营思路。\n4. 联动新媒体、社群、用户运营、设计等团队，统筹各类品牌内容、活动、传播物料的策略方向，保障品牌调性统一。\n5. 负责品牌项目全流程管控，包含方案输出、落地跟进、数据复盘、策略优化，沉淀可复用的品牌打法与案例体系。\n6. 能够对整体品牌团队进行协调管理，并保证方案的实际执行。\n7. 熟练运用AI工具辅助市场调研、策略 brainstorm、方案优化、内容选题，大幅提升品牌策划与迭代效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，3年以上品牌全案策划、品牌策略相关工作经验，有集团化品牌统筹经验优先。\n2. 具备完整的品牌策略搭建、品牌活动全案操盘、品牌内容体系搭建经验，能够独立输出高质量全案策略。\n3. 对新媒体热点、行业趋势、用户审美高度敏感，可结合品牌调性创新策划传播内容与营销玩法。\n4. 具备优秀的文案功底、逻辑思维和创意能力，策略落地性强，可高效联动多团队协同推进项目。\n5. 具备较强的数据复盘能力，能够依据传播数据、用户反馈持续优化品牌策略与内容方向。\n6. 有泛娱乐、互联网媒体、内容平台品牌策划经验者优先。\n7. 熟练或愿意深度使用各类AI工具，具备主动用AI提效、创新策划的工作意识。\n\n工作形式：英国本地 / 远程均可", "cat": "运营与市场"}, {"id": "71", "title": "项目经理", "salary": "依能力与经验面议", "location": "远程，可国内办公", "jd": "岗位职责\n1. 负责 Web、App 及短视频/视频产品的品牌升级项目，统筹从品牌策略落地、视觉规范输出到全端换新上线的全过程，对进度、品质、成本与上线效果负责。\n2. 制定品牌升级整体计划与里程碑，拆解 Web 端、App 端、短视频账号及视频物料等各触点任务，确保多端同步推进、节点对齐。\n3. 把控品牌视觉在各端的落地品质，覆盖界面视觉、播放器与内容包装、运营物料等，保障风格统一、品牌识别一致。\n4. 组织品牌方案评审、设计验收与上线复核，明确各触点交付标准与验收口径，减少返工与品牌表达偏差。\n5. 协调品牌、设计、视频制作及市场传播等相关方，对齐升级节奏与发布档期，推动物料齐套、按时上线。\n6. 识别档期冲突、物料延期、多端不一致及成本风险并推动闭环；项目结束后完成复盘，沉淀品牌升级规范与资产。\n\n任职要求\n1. 本科及以上学历5年以上项目管理经验，其中 2年以上大型交付型项目管理经验。\n2. 具备 50 人以上项目团队的实际管理经验，能统筹跨职能协作、资源调配与效能提升。\n3. 有独立操盘并成功交付单体合同/预算 1000 万以上项目的真实案例，具备范围管理、成本核算与收益把控能力。\n4. 熟练掌握项目管理方法，能独立进行计划制定、WBS 拆解、里程碑监控、风险预警与变更管理。\n5. 持有 PMP 认证，熟悉 PMBOK 体系；具备极强的交付结果导向、风险预判、跨部门协调及向上汇报能力。\n\n加分项\n1. 有品牌升级、视觉焕新或 Web/App/短视频多端品牌落地经验。\n2. 有泛娱乐、短视频、新媒体、数字内容等相关行业背景。\n3. 兼具 ACP、Scrum Master 等认证，或具备 IPD 流程落地经验。\n4. 有大型软件开发、系统集成或复杂项目群交付经验。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "产品与管理"}, {"id": "72", "title": "品牌策划专员", "salary": "12-20K", "location": "远程，可国内办公", "jd": "岗位名称：品牌策划专员\n\n简历筛选要点：具备品牌策划、内容策划、活动执行实操经验；热点敏感度高，擅长落地执行与文案输出；会基础图文内容处理；熟练使用AI工具辅助工作；有成人行业泛娱乐、新媒体行业经验者优先。\n岗位职责\n1. 协助高级策划完成品牌策略落地、品牌活动、节点营销、话题传播的方案细化与执行落地。\n2. 负责品牌日常宣传文案、推文、新闻素材、活动话术、品牌故事等内容的撰写与优化。\n3. 跟踪行业热点、网络趋势、竞品动态，收集优质案例，输出素材汇总与基础分析内容，支撑品牌创新策划。\n4. 配合设计、新媒体、运营团队，完成各类品牌物料、传播内容的需求对接、内容审核、上线跟进。\n5. 负责品牌基础资产归档、宣传素材整理、活动复盘总结，沉淀标准化品牌执行资料。\n6. 运用AI工具辅助文案撰写、选题搜集、素材整理、基础数据分析，提升日常工作效率。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上品牌策划、内容策划、文案运营相关工作经验。\n2. 熟悉新媒体品牌传播逻辑，了解主流平台内容玩法，能够贴合品牌调性输出内容。\n3. 对网络热点、流行文化敏感，可快速结合热点适配品牌宣传场景。\n4. 文案功底扎实，写作风格灵活，可适配不同平台、不同场景的内容创作需求。\n5. 执行力强，具备良好的协同沟通能力，可高效配合多团队完成品牌落地工作。\n6. 有泛娱乐、内容媒体、互联网平台品牌相关经验者优先。\n7. 熟悉或愿意学习AI工具，具备借助工具提升内容产出与工作效率的意识。\n\n工作形式：远程", "cat": "运营与市场"}, {"id": "73", "title": "品牌平面设计", "salary": "12-20K", "location": "远程，可国内办公", "jd": "具备品牌平面设计、视觉物料制作、品牌视觉落地实操经验；审美能力出众，擅长视觉适配、版式设计与画面优化；熟练掌握主流设计软件，会基础短视频封面、图文排版处理；熟练使用AI设计工具辅助创作；有成人行业泛娱乐、新媒体、互联网品牌设计经验者优先。\n岗位职责\n1. 协助资深设计完成品牌视觉体系落地，配合品牌营销、节点活动、话题传播、日常宣传等场景，完成各类平面视觉方案的细化设计与落地输出。\n2. 负责品牌日常宣传物料设计，包含公众号推文配图、海报、长图、banner、活动物料、宣传画册、品牌素材图、社交传播图等全品类平面视觉内容制作与优化。\n3. 跟踪行业视觉趋势、新媒体设计风格、竞品品牌视觉动态，收集优质视觉案例，完成素材汇总与视觉风格分析，为品牌视觉创新、风格迭代提供支撑。\n4. 配合品牌策划、新媒体、运营团队，对接各类视觉设计需求，精准理解策划方案与营销场景，完成物料设计、修改、审核、上线跟进，保障视觉内容贴合品牌调性与活动需求。\n5. 负责品牌视觉资产归档整理，统一品牌视觉规范，梳理各类设计模板、素材库，完成活动视觉复盘，沉淀标准化品牌视觉设计资料，提升团队出图效率。\n6. 熟练运用AI设计工具辅助画面创作、素材生成、版式优化、图片精修等工作，高效完成设计任务，持续提升视觉产出质量与工作效率。\n任职要求\n1. 本科及以上学历，35岁以下，1年以上品牌平面设计、新媒体视觉设计、商业设计相关工作经验。\n2. 熟悉新媒体品牌视觉传播逻辑，了解抖音、公众号、小红书等主流平台视觉玩法与审美偏好，能够精准贴合品牌调性输出适配不同场景的视觉作品。\n3. 对网络流行风格、视觉热点、潮流元素敏感，可快速结合热点适配品牌营销、日常宣传的视觉创作场景。\n4. 扎实的平面设计功底，版式审美优秀，色彩搭配能力出众，风格适配性强，可独立完成多场景、多品类视觉物料设计，具备良好的画面优化与细节把控能力。\n5. 执行力强，具备良好的沟通协同能力，可精准对接多团队需求，高效完成批量设计任务与视觉落地工作，抗压能力良好。\n6. 有泛娱乐、内容媒体、互联网平台、成人行业品牌视觉设计经验者优先。\n7. 熟练使用PS、AI等主流设计软件，熟悉或愿意深耕AI设计工具，具备借助工具优化创作流程、提升设计效率与作品质感的意识。\n工作形式：远程", "cat": "运营与市场"}, {"id": "74", "title": "高级UI设计师", "salary": "18-25K", "location": "远程，可国内办公", "jd": "岗位名称：高级UI设计师\n\n岗位职责\n1. 负责集团相关产品、平台、社媒载体的UI界面设计、视觉规范搭建与落地，保障整体视觉统一。\n2. 主导用户体验（UX）优化，梳理用户操作路径、交互逻辑，输出原型、交互方案、体验优化迭代建议。\n3. 结合品牌调性与平台风格，完成页面视觉、活动专题、弹窗、功能界面、社群素材等设计工作。\n4. 联动运营、策划、产品团队，理解业务需求，输出适配传播与用户使用场景的设计方案。\n5. 跟踪用户体验反馈、页面数据表现，持续迭代视觉与交互 用户运营逻辑，掌握用户生命周期管理、用户分层精细化运营方法。\n3. 具备极强的用户洞察力，能够精准捕捉用户需求与偏好，落地针对性运营动作。\n4. 数据思维清晰，可通过数据变化发现问题、总结规律，独立优化运营策略。\n5. 具备良好的沟通能力、策略落地能力，可联动各团队完成用户运营专项工作。\n6. 有泛娱乐、内容媒体、订阅制平台用户运营经验者优先。\n7. 熟练或愿意学习AI工具，能够利用AI赋能用户分析与精细化运营。\n\n工作形式：英国本地 / 远程均可", "cat": "运营与市场"}, {"id": "83", "title": "中级运营-内容运营方向", "salary": "12-20K", "location": "远程，可国内办公", "jd": "岗位职责】\n1.        负责品牌社媒平台（国内及国外）的日常内容策划与发布执行\n2.        结合平台热点与品牌调性，策划品牌相关互动话题、内容系列与传播节点\n3.        跟踪各平台内容数据表现，定期输出分析报告，持续优化内容方向与发布策略\n4.        配合设计组完成社媒物料的需求沟通与上线跟进，确保内容与视觉高度协同\n5.        维护社媒账号日常互动，提升用户粘性与品牌好感度，独立负责内容方向策划与选题体系搭建，有可量化的内容产出目标（如涨粉/互动率）\n6.        熟练运用AI工具辅助选题策划、文案撰写与数据分析，提升内容产出效率\n\n【任职要求】\n1.        本科及以上学历，35岁以下，至少1年社媒运营或内容运营相关工作经验\n2.        熟悉国内外等主流平台的内容逻辑与算法规则\n3.        对娱乐热点、网络梗文化高度敏感，具备将热点转化为品牌内容的能力\n4.        文案表达能力强，风格活泼自然，能快速产出符合平台调性的内容\n5.        数据意识强，能通过数据反馈独立判断内容方向并推动调整\n6.        有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n7.        熟悉或愿意深度使用AI工具，具备用AI提效的主动意识", "cat": "内容与创作"}, {"id": "84", "title": "AI游戏制作师", "salary": "20-30K", "location": "远程，可国内办公", "jd": "岗位名称：女性向AI游戏设计师\n\n岗位职责\n1. 专注女性向AI游戏、情感互动内容、轻量化乙系互动产品的视觉设计、角色设计、场景氛围设计，贴合女性用户审美与情感需求。\n2. 依托AI工具完成游戏人设、立绘、CG插图、场景道具、剧情视觉素材的批量生成与精细化二次优化，统一整体美术风格与故事氛围。\n3. 结合女性向内容调性、情感叙事逻辑、热点流行元素，设计差异化角色形象、互动场景与视觉体系，打造高质感、高共情的游戏视觉体验。\n4. 配合策划团队完成剧情脚本、互动玩法、故事分镜的视觉落地，根据剧情情绪、人物人设调整画面质感、光影与氛围细节。\n5. 收集用户反馈与行业女性向游戏流行趋势，持续迭代视觉风格、角色体系、画面表现，优化内容吸引力与用户沉浸感。\n6. 沉淀女性向AI游戏设计标准、提示词模板、素材资源库与风格规范，利用AI工具持续提升内容产出效率与创意上限。\n\n任职要求\n1. 本科及以上学历，35岁以下，1年以上游戏美术、游戏设计、AI内容创作相关工作经验，有女性向/乙女游戏设计经验优先。\n2. 具备扎实的美术审美与色彩、光影、造型功底，精准拿捏女性向唯美、治愈、氛围感、精致化视觉风格。\n3. 熟练掌握Midjourney、Stable Diffusion等主流AI设计工具，精通提示词工程、模型调用、细节可控出图，可独立完成高质量AI美术内容创作与优化。\n4. 深度了解女性向游戏用户喜好、情感需求、审美趋势，熟悉乙游、情感陪伴、沉浸式叙事类内容玩法与视觉逻辑。\n5. 具备良好的剧情理解能力与创意思维，可结合故事内容输出适配的视觉画面与场景氛围。\n6. 有女性向游戏、AI互动视觉、情感类内容、虚拟角色设计落地经验者优先。\n7. 主动钻研AI新工具、新玩法，具备持续用AI迭代设计质量、提升产出效率的工作意识。\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "85", "title": "内容策略经理", "salary": "12K-20K", "location": "远程，可国内办公", "jd": "岗位名称：高级内容策略\n\n\n【岗位职责】\n1.        负责品牌社媒平台（国内及国外）的日常内容策划与发布执行\n2.        结合平台热点与品牌调性，策划品牌相关互动话题、内容系列与传播节点\n3.        跟踪各平台内容数据表现，定期输出分析报告，持续优化内容方向与发布策略\n4.        配合设计组完成社媒物料的需求沟通与上线跟进，确保内容与视觉高度协同\n5.        维护社媒账号日常互动，提升用户粘性与品牌好感度，独立负责内容方向策划与选题体系搭建，有可量化的内容产出目标（如涨粉/互动率）\n6.        熟练运用AI工具辅助选题策划、文案撰写与数据分析，提升内容产出效率\n\n【任职要求】\n1.        本科及以上学历，35岁以下，至少1年社媒运营或内容运营相关工作经验\n2.        熟悉国内外等主流平台的内容逻辑与算法规则\n3.        对娱乐热点、网络梗文化高度敏感，具备将热点转化为品牌内容的能力\n4.        文案表达能力强，风格活泼自然，能快速产出符合平台调性的内容\n5.        数据意识强，能通过数据反馈独立判断内容方向并推动调整\n6.        有成人内容、泛娱乐或订阅制媒体平台相关从业经验者优先\n7.        熟悉或愿意深度使用AI工具，具备用AI提效的主动意识\n\n工作形式：远程", "cat": "内容与创作"}, {"id": "86", "title": "舆情与危机公关负责人", "salary": "12-20K", "location": "远程，可国内办公", "jd": "\"岗位职责\n1. 从 0 到 1 搭建分品类情报监测与分级预警机制（渠道、频率、黄橙红分级、处置闭环）\n2. 打通客服及相关业务侧数据协同，把外部声量与内部信号合成统一风险判断\n3. 主导升级/上线等关键窗口的风险预研、表达抽检与口径输出，前置拦截高风险表述\n4. 独立推进重大负面与突发舆情的处置方案与复盘，沉淀口径库、案例库与制度\n5. 推动预警机制嵌入项目流程，确保风险可预警、可跟进、可关闭\n6. 管理外部监测资源（如有），完善内部流转、复盘与风控机制\n\n任职要求\n1. 本科及以上，3 年以上舆情、公关、内容风控或相关质量分析经验\n2. 有完整舆情/风控机制搭建落地经验，能独立判断风险并给出口径与动作建议\n3. 反应快、文字功底扎实，能在压力下跨部门推动整改与对齐\n4. 原则清晰，熟悉主流平台内容规则与监测工具使用\n\n加分项\n有窗口期监测或危机处置成功案例；有竞品舆论攻防经验；有服务商管理经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "87", "title": "AI 视频制作师", "salary": "20K–30K", "location": "远程，可国内办公", "jd": "\"岗位职责\n1. 负责短视频、产品宣传视频、品牌创意视频等全类型视频的AI全流程制作，熟练运用各类AI视频工具，完成脚本落地、素材生成、剪辑合成、特效包装、调色输出等工作，产出高质量原创视频内容。\n2. 结合品牌视觉规范、产品特性及短视频平台调性，优化AI视频创作逻辑，定制视频画面风格、镜头语言、字幕包装，保障视频内容优质、风格统一、贴合品牌调性。\n3. 探索并落地各类新型AI视频生成工具、AI剪辑、AI特效、数字人、AI配音等技术，持续优化视频制作流程，提升出片效率与内容质感，实现批量、高效、精品化内容产出。\n4. 配合品牌升级、产品运营、市场推广需求，承接Web、App、短视频账号等多端视频物料制作，严格按照交付标准、档期要求完成物料输出，保障多端视频视觉统一、内容合规。\n5. 参与视频创意脚本研讨、方案评审，根据品牌规范、运营反馈、用户喜好优化视频内容，整改画面瑕疵、风格偏差等问题，持续提升视频传播力与观感体验。\n6. 沉淀AI视频制作素材库、模板库、操作规范及创作方法论，整理优质视频案例，固化品牌视频包装标准，为常态化内容产出和品牌视觉统一提供支撑。\n\n任职要求\n1. 本科及以上学历，2年以上AI视频制作、短视频剪辑、影视后期相关工作经验，熟练掌握AI视频创作全流程，有成熟的个人视频作品案例。\n2. 熟练使用主流AI视频工具，精通剪映、PR、AE等后期剪辑包装软件，掌握AI文生视频、图生视频、AI特效、AI修图、数字人视频制作等技能，能独立完成全流程视频产出。\n3. 具备优秀的视觉审美、镜头语感和色彩把控能力，熟悉短视频、互联网品牌视频的创作逻辑，能精准贴合品牌风格完成差异化视频创作。\n4. 具备高效的内容产出能力，能适配多场景物料制作需求，严格把控交付进度与成片质量，抗压能力强，可配合项目档期高效完成工作。\n5. 具备良好的沟通协作能力，能配合品牌、运营、市场团队对齐需求，精准落地创作要求，主动复盘优化制作流程，持续提升内容品质与出片效率。\n\n加分项\n1. 有互联网品牌、短视频、泛娱乐行业AI视频制作经验，参与过品牌视觉升级、多端视频物料统一落地项目者优先。\n2. 熟练掌握Runway、Pika、即梦等主流AI视频工具，具备AI视频创意优化、瑕疵修复、高质量成片打磨经验。\n3. 具备脚本撰写、创意策划能力，可独立完成视频创意+AI制作全链路工作。\n4. 有品牌全案视频、产品宣传片、矩阵短视频批量制作经验，熟悉多平台视频内容规则与传播逻辑。\n\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "内容与创作"}, {"id": "88", "title": "高级运营-社媒运营", "salary": "12K-20K", "location": "远程，可国内办公", "jd": "\"岗位职责\n1. 负责公司产品、短视频及新媒体矩阵整体运营工作，制定阶段性运营策略、年度/季度运营目标与落地计划，统筹推进全渠道运营工作，对用户增长、活跃度、内容曝光、转化数据等核心指标负责。\n2. 统筹各平台账号日常运营，涵盖短视频平台、App、Web端及新媒体渠道，负责内容选题、节奏规划、活动策划、热度追踪等工作，搭建标准化运营体系，保障账号稳定更新与数据持续增长。\n3. 结合产品特性、用户画像及行业热点，策划线上运营活动、话题营销、内容专题等，联动内容、视频、市场团队落地执行，提升品牌曝光、用户粘性及产品影响力，助力用户拉新、留存、促活。\n4. 负责运营数据监控与分析，定期梳理播放量、互动率、涨粉量、转化率等核心数据，复盘运营动作效果，挖掘数据问题与增长机会，持续优化运营策略、内容结构与推广方式。\n5. 对接品牌升级、内容焕新项目，对齐全渠道运营视觉风格、内容调性与传播节奏，统筹各渠道物料上线、内容分发与宣传推广，保障多端运营内容统一、节奏同步。\n6. 跟踪行业动态、竞品运营模式与平台规则变化，快速迭代运营打法，搭建用户运营、内容运营、活动运营标准化流程，沉淀运营SOP、案例库与方法论，提升整体运营效能。\n7. 统筹跨部门协作，对接视频制作、设计、市场、产品等团队，对齐运营需求、排期与交付标准，推动运营项目、营销活动高效落地，及时解决推进过程中的各类问题并闭环优化。\n\n任职要求\n1. 本科及以上学历，3年以上互联网、短视频、新媒体、泛娱乐行业运营管理经验，具备成熟的全渠道运营体系搭建与落地经验。\n2. 精通短视频、新媒体、产品线上运营逻辑，熟悉各大主流平台规则、流量机制与传播玩法，具备独立策划、落地运营项目及营销活动的实战能力。\n3. 具备优秀的数据洞察与复盘能力，能够通过数据拆解目标、定位问题、优化策略，有成功的账号增长、活动转化、用户运营落地案例优先。\n4. 拥有良好的热点敏感度、内容审美与营销思维，擅长结合行业热点打造优质内容与爆款活动，具备较强的用户思维与市场判断力。\n5. 具备出色的跨部门沟通、统筹协调与项目推进能力，目标感强、执行力高，可高效统筹多任务并行，抗压能力强，能适配项目节奏与迭代需求。\n6. 具备系统化运营思维，擅长流程搭建、标准梳理与团队效能优化，能够沉淀可复用的运营方法论，推动团队运营工作标准化、精细化落地。\n\n加分项\n1. 有短视频矩阵、新媒体品牌账号、互联网产品运营操盘经验，拥有百万曝光、爆款内容打造或用户规模化增长案例。\n2. 熟悉AI内容、AI视频行业，具备AI产品、数字内容相关行业运营经验，了解AI内容创作与传播逻辑。\n3. 具备品牌营销、内容策划、用户增长、活动运营专项优势，有完整的项目全案操盘与复盘经验。\n4. 有远程团队协作、跨团队项目统筹经验，擅长精细化运营与数据化管理。\n\n工作形式：远程\n建议薪资范围：依能力与经验面议\"", "cat": "运营与市场"}, {"id": "89", "title": "品牌策略负责人", "salary": "12K-20K", "location": "远程，可国内办公", "jd": "岗位职责\n1. 从 0 到 1 设计并落地对内复制 + 对外赋能体系：标准、SOP、课程路径与材料包\n2. 把策略、案例、复盘转化为可带走的课程与工具，支撑业务与合作方独立运转\n3. 建立训后反馈与迭代机制，用真实反馈持续升级内容质量与落地效果\n4. 推动赋能动作嵌入项目节点（开工包、关键节点赋能、结项回收与课例沉淀）\n5. 与市场心智、舆情协同，把最新口径与框架同步进课程，保持体系不过时\n6. 跟踪赋能采用率与效果，输出迭代清单，对体系是否跑得起来负责\n\n任职要求\n1. 本科及以上，3 年以上企业培训、组织发展、方法论沉淀或品牌/运营赋能经验\n2. 有从 0 到 1 搭培训/赋能体系的经历，能独立完成课程产品化与落地推动\n3. 善于把复杂内容拆成可复制路径（课、包、SOP），表达清楚、结构感强\n4. 结果导向，关注采用与效果，不满足于「讲完课」\n\n加分项\n有 ToB 赋能或多组织落地经验；有品牌/策略内容转化经验；有训后效果评估体系搭建经验\n\n工作形式：远程\n建议薪资范围：依能力与经验面议", "cat": "运营与市场"}, {"id": "90", "title": "经营决策主管", "salary": "20K–30K", "location": "远程，可国内办公", "jd": "1.分析各业务线的经营情况、问题和机会，形成初步判断。\n2.跟踪市场、竞品和用户变化，提炼对业务有用的信息并落地成方案。\n3.参与新项目和重点事项评估，提出继续、调整、加码或暂停建议。\n4.输出分析结论和汇报材料，并跟踪后续结果。\n任职要求\n1.有业务运营、产品运营、增长、策略或分析相关经验，互联网行业。\n2.能快速理解业务，从复杂信息中抓住重点并形成观点。\n3.能结合基础数据和业务事实说明自己的判断。\n4.文字表达清楚，能够独立完成分析和汇报。\n加分项\n1.有互联网或线上业务相关经验5年以上。\n2.参与过新/老项目评估、业务调整或经营复盘的核心决策。", "cat": "产品与管理"}, {"id": "91", "title": "商业分析主管", "salary": "20K–30K", "location": "远程，可国内办公", "jd": "1.汇总经营数据，维护和建立关键指标、统一统计口径和基础看板。\n2.发现数据异常和趋势变化，核对数据并分析可能原因。\n3.围绕业务问题、项目效果和资源投入提供分析结论。\n4.用清楚的业务语言向负责人说明数据发现和建议。\n任职要求\n1.有数据分析、业务分析、经营分析或数据运营相关经验。\n2.熟练使用AI、在线表格等工具，能独立处理和分析数据。\n3.能理解常见经营指标，并把数据变化与业务实际联系起来。\n4.做事细致严谨，能够独立输出结构清楚的分析结论。\n加分项\n1.熟练使用SQL、AI、BI工具。\n2.做过互联网、用户增长或项目效果分析，并有案例证明。", "cat": "产品与管理"}, {"id": "92", "title": "运营发展主管", "salary": "20K–30K", "location": "远程，可国内办公", "jd": "1.梳理重点事项、协同需求和资源需求，形成处理建议。\n2.将确认事项拆解为责任人、时间节点、交付结果和验收标准。\n3.跟踪跨部门事项进展，发现延期或卡点并推动解决。\n4.维护事项清单，定期输出进展、问题和复盘结论。\n任职要求\n1.有项目运营、业务运营、PMO、项目管理或交付管理相关经验。\n2.能把模糊问题整理成清晰的任务和推进计划。\n3.沟通和推动能力较强，能够协调不同团队持续跟进。\n4.有优先级和结果意识，做事有条理，能够推动事项闭环。\n加分项\n1.推动过多个部门共同参与的项目，自己是核心成员或负责人。", "cat": "运营与市场"}, {"id": "93", "title": "SEO运营专员\n（AI工具赋能方向）", "salary": "18-35", "location": "远程，可国内办公", "jd": "SEO运营专员（AI工具赋能方向）\n\n【岗位职责】\n\n1. 负责 App、品牌自建站及自媒体矩阵的海外自然搜索流量增长，围绕 Google、Bing 等主流搜索引擎制定并执行 SEO 优化策略，提升核心关键词排名、页面收录量及自然流量转化效果。\n2. 负责站内 SEO 优化工作，包括 TDK 布局、页面结构优化、关键词部署、内容更新、内链建设、结构化数据优化、爬虫抓取异常排查、收录与排名监控等，保障网站具备良好的搜索引擎友好度。\n3. 借助 AI 工具提升 SEO 内容生产效率，完成多语种关键词挖掘、长尾词库搭建、内容选题规划、文案初稿生成、多语言内容改写、内容质检与基础纠错等工作，并结合人工二次精修，确保内容符合海外用户搜索意图、原创性要求和本地化表达习惯。\n4. 负责海外站外 SEO 建设，包括优质外链资源拓展、软文发布、友链合作、品牌相关内容铺设等，持续提升网站权重、品牌曝光度及海外搜索端正向声量。\n5. 每日监控网站流量、关键词排名、收录量、点击率、跳出率、停留时长等核心数据，熟练使用 SEO 工具进行数据分析、问题归因和效果复盘，定期输出 SEO 优化报告及可落地的迭代方案。\n6. 持续关注 Google 等搜索引擎算法更新及海外 SEO 趋势，结合数据变化及时调整优化策略，降低因算法波动导致的降权、收录下降、排名异常等风险。\n7. 与品牌运营、内容、技术/前端团队协作，推动页面内容、站点结构、加载性能、索引体验及品牌搜索口碑的持续优化。\n\n【任职要求】\n\n1. 大专及以上学历，3年以上 SEO 运营实战经验，有海外站点、英文站、多语言站、内容站、品牌站或 App 推广相关 SEO 经验优先。\n2. 熟悉 Google、Bing 等海外主流搜索引擎的排名机制，掌握白帽 SEO 方法论，能够独立完成关键词策略、站内优化、内容规划、外链建设、数据分析及效果复盘。\n3. 熟练使用 Google Search Console、Google Analytics、Ahrefs、SEMrush、SimilarWeb 等常用 SEO 工具，能够独立诊断网站收录、排名、流量及页面质量问题。\n4. 具备较强的 AI 工具应用能力，能使用 ChatGPT、Claude、Gemini 或其他 AI 工具辅助完成关键词拓展、内容生产、多语言改写、数据整理和文案优化；同时具备内容判断力，能够识别 AI 内容同质化、低质化、语义不自然等问题，并进行人工校准。\n5. 具备良好的文案能力和海外用户搜索意图分析能力，能够根据目标市场用户习惯优化标题、摘要、页面结构和内容表达，提升自然点击率和页面停留表现。\n6. 具备较强的数据敏感度和执行力，能从排名、流量、收录、点击、转化等数据中发现问题，并持续推动优化闭环。\n7. 工作细致，结果导向，具备良好的跨团队沟通能力，能够与内容、品牌、技术团队协同推进 SEO 项目落地。\n\n【加分项】\n1. 有海外多语种站点 SEO 操盘经验，熟悉英文、小语种内容优化优先。\n2. 有 App SEO、ASO、品牌词优化、舆情搜索优化经验优先。\n3. 了解 SSR、站点性能、结构化数据、sitemap、robots、canonical 等技术 SEO 基础优先。\n4. 有通过 AI 工具搭建 SEO 工作流、关键词库、内容生产流程或数据看板经验优先。\n\n筛选重点\n\n1. 是否有真实海外 SEO 项目经验，而不是只做过国内平台内容运营。\n2. 是否能独立说明关键词策略、内容策略、站内优化、外链建设和数据复盘方法。\n3. 是否熟悉 Google Search Console、GA、Ahrefs、SEMrush 等工具，并能结合数据定位问题。\n4. 是否真正会使用 AI 提升 SEO 效率，而不是只会用 AI 生成文章。\n5. 是否坚持白帽 SEO，避免黑帽外链、关键词堆砌、批量低质伪原创等高风险操作。", "cat": "运营与市场"}, {"id": "94", "title": "代码审计工程师\n（Go 后端 安全与 AI 方向）", "salary": "18-28k", "location": "远程，可国内办公", "jd": "Go 后端代码审计工程师（安全与 AI 方向）\n\n 🛠 岗位职责\n\n1. 负责 Go 后端项目的代码审计与质量评估，从代码规范、架构设计、并发安全、性能隐患、数据安全及可维护性等维度开展系统审查。\n2. 深入阅读业务代码，识别 SQL 注入、越权访问、敏感信息泄露、鉴权缺陷、接口滥用、并发竞态、资源泄漏等问题，输出审计报告及整改建议。\n3. 结合业务场景评估系统安全边界，重点审查 API、数据库、缓存、消息队列、文件上传及第三方服务调用等关键链路。\n4. 对审计发现的问题进行风险分级，提供可落地的修复方案，必要时参与核心模块重构、漏洞修复及复审验收。\n5. 参与制定 Go 编码规范、安全开发规范及 Code Review 流程，推动静态扫描、依赖检测和 CI 安全门禁落地。\n6. 结合 Claude Code、Codex、Cursor 等 AI 工具建设自动化代码审查流程，提升漏洞识别、问题分类及审计报告生成效率。\n\n🎯 任职要求\n\n1. 本科及以上学历，计算机相关专业优先，3 年以上 Go 后端开发经验。\n2. 扎实的 Go 语言基础，熟悉 Goroutine、Channel、Context、内存管理及并发模型，能够识别常见并发与性能问题。\n3. 熟悉 Gin、Go-Zero、Kratos、GORM 等常用框架或组件，具备中大型后端系统开发经验。\n4. 熟悉 MySQL、Redis、Kafka/RabbitMQ 等基础设施，能够审查数据库设计、缓存策略及消息处理链路。\n5. 具备较强的代码阅读和问题定位能力，有 Code Review、代码审计、安全评审或线上故障排查经验。\n6. 熟悉常见 Web 及 API 安全风险，包括 SQL 注入、XSS、CSRF、SSRF、文件上传、鉴权绕过、越权访问和敏感数据泄露等。\n7. 能够清晰输出审计结论、风险等级、影响范围、修复建议及复审结果。\n8. 熟练使用 Claude Code、Codex、Cursor 等 AI 编程工具，能够运用 AI 提升代码审查和漏洞分析效率。\n\n✨ 加分项\n\n* 具备网络安全、渗透测试、SDL 安全开发或企业代码安全审计经验。\n* 熟悉 OWASP Top 10、CWE、CVSS 等漏洞分类和风险评估标准。\n* 使用过 Semgrep、SonarQube、CodeQL、Gosec、Trivy、Snyk 等代码与依赖安全扫描工具。\n* 具备高并发、微服务、分布式系统或支付、账户、权限等高风险业务开发经验。\n* 熟悉 Docker、Kubernetes、Linux 及 CI/CD，能够排查配置、镜像、依赖和部署环节的安全风险。\n* 有漏洞挖掘、攻防演练、CTF、SRC 漏洞提交或安全认证经历。\n* 有基于 LLM 搭建自动化 Code Review、漏洞识别或审计报告生成工具的实际经验。\n\n 🤝 我们期待的你\n\n👉 **代码审查能力强**：能够快速读懂陌生项目，识别真正影响业务安全和稳定性的核心问题。\n\n👉 **安全意识敏锐**：不只关注代码能否运行，也关注权限边界、数据安全、攻击风险和异常场景。\n\n👉 **结果导向**：能够独立完成审计、报告、整改推动及复审闭环，而非只发现问题。\n\n👉 **拥抱 AI 提效**：善于使用 AI 工具提升审计效率，同时能够判断和验证 AI 输出的准确性。", "cat": "技术开发"}, {"id": "95", "title": "HRBP-行政BP", "salary": "10-14k+岗位津贴", "location": "远程，可国内办公", "jd": "行政HRBP\n岗位定位：作为人力流程与数据运营中枢，确保招聘、人事、绩效、系统及资料全流程准确、及时、可追溯。\n\n岗位职责：\n负责招聘需求登记、审批、简历流转、面试排期、Offer衔接、入职跟进及招聘台账闭环。\n负责员工入转调离、花名册、组织架构、系统信息、权限及人事资料的维护与归档。\n承接绩效、奖金、津贴、月报等人力运营事项：名单核验、系统操作、催办、数据导出及留痕。\n对接SSC、集团HR及业务部门，推动审批、资料、通知、数据及流程节点按时完成。\n维护招聘、人员、组织、绩效等单一数据台账，定期输出准确的周/月度运营数据。\n发现数据不一致、流程超时、材料缺失等问题后先行闭环；需要判断的事项及时转业务BP。\n\n任职要求：\n3年以上人事运营、招聘运营或行政HRBP经验，有200人以上团队支持经验优先。\n熟悉招聘、入转调离、绩效、Offer及SSC协同流程。\nExcel和数据台账能力扎实，做事细致，能管理多项流程和时间节点。\n沟通、催办和协调能力强，原则性与服务意识兼具。\n\n加分项：\n电脑投屏 演示Excel能力，Ai能力。", "cat": "职能与行政"}, {"id": "96", "title": "业务 HRBP", "salary": "13-18K", "location": "远程，可国内办公", "jd": "业务HRBP\n岗位定位：作为业务近端的人才与组织支持者，深入理解业务目标，负责人才判断、组织诊断、管理支持及人员风险闭环。\n岗位职责：\n负责成人内容平台相关业务线的HRBP支持，理解内容供给、流量分发、用户增长、留存转化及付费变现等业务链路。\n结合业务规划判断招聘需求、岗位优先级、人才画像、职级薪酬及资源投入，参与重点、紧急和疑难岗位的人才评估。\n跟进招聘进度及转化数据，诊断岗位画像、薪酬竞争力、人才供给或面试标准等问题，推动关键岗位及时补位。\n开展人才盘点、绩效面谈、低绩效判断、核心骨干保留及人才梯队建设，为管理者提供人员与组织建议。\n支持编制规划、组织调整、岗位整合、人员调动及优化事项，评估业务影响、人员风险和交接要求。\n通过周报、问题看板及项目管理机制明确责任人、完成节点和交付结果，推动招聘、人才及组织问题持续闭环。\n任职要求：\n具备产品经理、项目经理、PMO、产品运营或复杂项目管理经验者优先。（运营、商务经验优先）\n3年以上互联网、内容平台、短视频、成人娱乐或出海业务HRBP经验。\n具备业务招聘、人才评估、组织诊断、绩效管理及管理者支持经验，能看懂基础业务和人效指标。\n业务判断、沟通影响及问题推动能力强，能够适应快速变化、高压和多事项并行的工作环境。", "cat": "职能与行政"}, {"id": "97", "title": "业务  懂游戏产品分析，能用数据推动产品和运营优化的人才\n岗位职责：\n1、负责游戏项目的数据分析与数据运营工作，围绕新增、活跃、留存、付费、LTV、玩法参与、活动效果等核心指标，持续监控项目经营情况，及时发现数据异常和业务问题。\n2、深入参与游戏产品调优，结合玩家行为数据，对新手流程、核心玩法、养成系统、关卡/副本体验等进行分析，定位流失点、转化断点和体验问题，并输出可落地的优化建议。\n3、负责版本、活动和商业化专项分析，包括版本前后效果对比、活动参与与转化分析、礼包/商品表现分析、付费用户分层、付费路径分析、渠道用户质量分析等，为产品迭代和运营决策提供数据支持。\n4、参与游戏数据分析体系建设，包括埋点方案设计、日志上报验收、指标口径定义、数据质量检查、看板搭建与维护，保障数据可用、口径清晰、分析结果可信。\n5、协同运营、研发团队推进问题闭环，将数据结论转化为产品优化方向、运营动作，并跟进上线后的效果验证。\n岗位要求：\n1、本科及以上学历，1–5年游戏数据分析经验（必须有游戏行业经验），RPG、卡牌、二游等品类经验优先。\n2、热爱游戏，平时有较多游戏体验，能够理解游戏系统、玩家成长、付费设计、活动节奏和版本迭代逻辑；能结合游戏内容判断数据变化背后的原因；\n3、具备良好的数据敏感度和业务判断力，能够从留存、漏斗、付费、活跃、玩法参与等数据中发现问题；\n4、熟练使用 SQL、Excel，能够独立完成数据提取、清洗、统计和分析工作；有建模/算法能力为加分项；\n5、具备数据可视化和看板搭建能力，熟悉数数 BI 平台者优先；\n6、具备较强的沟通表达能力，能够把复杂数据问题讲清楚，输出结构化分析结论，并推动运营、研发团队形成共识和行动。", "cat": "运营与市场"}, {"id": "101", "title": "中高级运营", "salary": "15K\n经验丰富者视能力定岗定薪", "location": "远程，可国内办公", "jd": "岗位职责：\n1、玩家阵地精细化运营：统筹平台、媒体、论坛等核心玩家阵地的生态维护，制定巡查机制与垃圾广告治理方案，牵头基础用户答疑及高价值问题闭环处理，提升用户活跃度与阵地口碑；\n2、数据驱动运营优化：负责后台核心数据跟踪、多维度分析（含用户行为、内容效果、活动转化等），输出结构化数据报告并提炼可落地优化建议，支撑运营策略迭代；\n3、运营活动统筹执行：协助策划阶段性运营活动，主导活动后台用户管理、页面生命周期管控及发奖全流程统筹，联动跨部门推进活动落地，对活动参与度、留存率等关键指标负责；\n4、海外内容生态搭建：建立海内外热门单机游戏更新动态的常态化监测机制，深度挖掘优质内容素材，指导并协同内容团队完成素材筛选、本地化适配与排版优化，提升内容传播力。\n\n岗位要求\n1、经验与学历：2-3年游戏行业相关经验，接受211/985本科及以上应届生（需具备丰富的游戏运营相关实习经历）；\n2、游戏认知：深度PC单机游戏玩家，精通海内外单机游戏圈生态、热门IP动态及圈层黑话，具备玩家社群/论坛核心用户或运营经验，能精准洞察玩家需求；\n3、核心能力：具备较强的策略思维与统筹协调能力，执行力扎实且注重细节，熟练运用Excel（VLOOKUP、数据透视表等）及常用数据分析工具，能独立完成数据复盘与报告输出；\n4、语言与视野：英语CET-4及以上水平，可独立阅读海外游戏更新日志、社群讨论等内容，具备国际化内容视野，能快速捕捉海外游戏圈热点并转化为运营动作；\n加分项：有游戏社群从零到一搭建或活动策划落地经验者优先；具备基础图文排版设计能力（如熟悉PS、秀米等工具）者优先。", "cat": "运营与市场"}, {"id": "102", "title": "初级运营专员", "salary": "10K", "location": "远程，可国内办公", "jd": "岗位职责\n1.        负责平台、媒体、论坛等玩家阵地的日常巡查、垃圾广告清理与基础用户答疑；\n2.        协助数据分析，跟踪后台数据，整理数据日报；\n3.        协助运营活动开展，负责后台用户管理、活动页面上下架及发奖流程执行；\n4.        收集海内外热门单机游戏的更新动态，协助内容团队进行图文素材搬运与排版。\n岗位要求\n1.        1-2年互联网运营经验或211本科应届毕业生；\n2.        骨灰级PC游戏玩家，熟知单机游戏圈的黑话与热点，有重度玩家社群论坛水友经验；\n3.        执行力极强，踏实细心，熟练使用Excel等基础办公软件；\n4.        英语CET-4以上，能借助翻译软件无障碍阅读海外游戏更新日志及社群内容。", "cat": "运营与市场"}, {"id": "103", "title": "Mod适配工程师", "salary": "10-15K", "location": "远程，可国内办公", "jd": "147", "cat": "技术开发"}, {"id": "104", "title": "双语技术支持专家/中英文客服", "salary": "10-15K", "location": "远程，可国内办公", "jd": "岗位职责\n 1. 熟练使用中英文，快速响应全球用户的技术求助，并提供有效解决方案；\n 2. 提炼高频常见问题，撰写剪辑并持续维护通俗易懂的双语FAQ文档；\n 3. 针对尝试订阅失败或申请退款的用户，进行积极的沟通干预与指导，降低付费环节的技术流失率；\n 4. 将用户报错转化为结构化的技术工单，协助研发团队快速定位代码层面的Bug并督促修复进度。\n 岗位要求\n 1. 极度了解PC软硬件运行原理与Windows系统架构（尤其是注册表、运行库、各主流杀软机制），有技术客服、IT运维或PC单机游戏发行技术支持经验；\n 2. 情绪稳定，极具耐心与服务意识，能承受大量重复性的基础咨询及偶尔的负面情绪宣泄；\n 3. 中英双语文字表达专业且富有温度，能熟练使用各类客诉管理软件系统。", "cat": "技术开发"}, {"id": "105", "title": "资深活动运营（游戏方向）", "salary": "12k-22k", "location": "远程，可国内办公", "jd": "必须有游戏行业经验\n必须提供过往活动落地页、曾运营的社媒账号链接、负责账号的具体时间\n\"学历：本科及以上  \n岗位职责\n活动策划与执行：独立负责平台活动（节日活动、版本活动、拉新促活等）及社媒、社群活动的全流程，包括方案设计、资源协调、落地执行与效果复盘；\n社媒运营：负责官方账号的内容策划与日常运营，维护账号人设，提升粉丝量与互动率；\n社群运营：策划社群专属活动与玩法，提升社群活跃度与用户归属感；\n用户增长与维系：围绕拉新、促活、留存设计运营策略，搭建用户激励与成长体系，提升核心用户粘性；\nUGC 生态与 KOC 合作：策划二创激励、同人征集等 UGC 活动，联 KOC 进行内容传播与用户拉新；\n数据复盘：跟踪活动效果与用户数据（活跃、留存、转化等），定期输出复盘报告，持续迭代运营打法；\n\"任职要求\n3 年以上二次元、游戏或泛娱乐平台的用户 / 活动 / 社区运营经验；\n有完整的活动策划与执行经验，能提供可量化的成功案例（活动参与量、拉新量、互动数据等）；\n熟悉微博、B站、抖音、小红书等主流平台的内容生态与运营玩法；\n具备数据意识，能独立完成活动数据分析与复盘；\n有从 0 到 1 搭建社群或社媒账号的成功经历；\n个人运营过有一定粉丝规模的社媒账号；\n文案功底扎实，有创意、执行力强，具备良好的跨部门沟通协调能力；\n加分项：深度理解二次元文化，熟悉圈层用户的喜好、语言和梗。", "cat": "运营与市场"}, {"id": "106", "title": "游戏系统策划（前期体验与商业化方向）（PO 主管 ）", "salary": "20k-30k", "location": "远程，可国内办公", "jd": "岗位定位\n负责在研/在营游戏的前期体验、留存链路与商业化承接设计。重点不是发行、渠道或活动运营，而是在研发侧把新手引导、核心循环、功能开放、资源经济、付费点和版本配置做成可上线、可验收、可调优的系统方案。\n\n核心职责\n1. 负责新手引导、首日体验、前 30 分钟流程、前 3 天目标和功能开放节奏设计，提升玩家对核心玩法的理解和前期留存；\n2. 围绕游戏核心循环设计商业化模块，包括礼包、商城、月卡、通行证、抽卡/养成消耗、活动奖励、资源投放等；\n3. 建立资源产出与消耗、成长节奏、价格梯度、奖励价值、限购节奏等数值方案，输出清晰的表格和配置规则；\n4. 编写系统文档、配置表、埋点需求和验收标准，推动程序、美术、QA、运营按版本落地；\n5. 根据新手漏斗、节点流失、次留/三留、付费率、ARPPU、礼包转化、资源消耗等数据，定位问题并提出具体调优方案；\n6. 跟进功能上线前后的体验、配置、数据和反馈，持续迭代前期体验与商业化内容。\n\n任职要求\n· 有游戏系统策划、数值策划或商业化策划经验，做过实际上线模块；\n· 理解 F2P 游戏的新手体验、留存、资源循环和付费承接关系；\n· 熟悉常见商业化结构，如礼包、商城、月卡、通行证、抽卡、活动投放、资源消耗等；\n· 能独立完成从目标拆解、规则设计、数值测算、配置表、研发沟通到验收上线的完整闭环；\n· 表格能力强，逻辑清楚，对资源价值、价格锚点、玩家分层、付费节奏和前期目标设计有判断；\n· 能结合数据复盘问题，并把结论转化成系统、数值、配置或体验调整；\n· 沟通稳定，能和程序、美术、QA、运营协作推进版本落地。\n\n加分项\n· 做过卡牌、RPG、Roguelike、放置、二游、SLG 等带养成/资源循环的项目；\n· 有新手引导、前期留存、首日体验或功能开放节奏调优经验；\n· 有从测试期到上线运营的商业化调优经验；\n· 熟悉 ThinkingData、SQL、BI 或埋点设计；\n· 有 IAA+IAP 混合变现经验；\n· 能使用 AI 工具提升方案、表格、分析和文档效率。", "cat": "产品与管理"}, {"id": "107", "title": "系统策划", "salary": "12-15k", "location": "远程，可国内办公", "jd": "【系统策划】\n\n岗位职责：\n1. 负责游戏系统、玩法模块的设计与落地，包括规则设计、流程设计、功能拆解、配置方案和验收标准。\n2. 根据版本目标撰写策划文档，推动程序、美术、测试等团队成员理解需求并完成实现。\n3. 跟进系统开发过程，处理实现细节、配置问题、体验问题和测试反馈，保证功能按版本计划上线。\n4. 参与新手流程、系统开放节奏、任务链、活动系统、养成系统等模块的设计与优化。\n5. 维护相关配置表和策划文档，保证线上表现、配置内容和设计目标一致。\n6. 持续体验版本内容，发现系统体验、操作反馈、引导流程、节奏和易用性问题，并推动优化。\n\n任职要求：\n1. 有游戏系统策划经验，熟悉系统从设计、开发跟进到上线验收的完整流程。\n2. 能独立撰写清晰的系统策划文档，具备良好的逻辑拆解和规则表达能力。\n3. 熟悉常见游戏系统设计，如养成、任务、活动、关卡、奖励、引导、战斗外循环等。\n4. 对配置表、条件规则、系统流程和玩家体验有较强的细节把控能力。\n5. 沟通推进能力较好，能和程序、美术、测试高效协作，及时跟进问题闭环。\n6. 责任心强，执行稳定，能适应版本开发中的反复调整和细节打磨。\n\n加分项：\n1. 有中重度手游、RPG、卡牌、放置、模拟经营等项目经验。\n2. 有完整系统模块上线经验。\n3. 对新手体验、系统串联、养成节奏有实际优化经验。", "cat": "产品与管理"}, {"id": "108", "title": "发行侧运营负责人", "salary": "20-30K", "location": "远程，可国内办公", "jd": "岗位职责\n1. 平台运营规划与全球化布局\n--负责游戏生态与分发平台的全面运营战略规划、核心业务目标制定与全球化落地，对平台整体 DAU、MAU、生态健康度及商业化营收全面负责。\n--统筹平台在海外重点市场的本地化运营与破局，制定差异化的海外市场推广策略及用户获取（UA）方案。\n2. 海外市场推广与用户增长\n--主导全球化流量获客与品牌声量打造，擅长结合海外主流社媒生态（如 Discord、Reddit、X、TikTok、YouTube 等）开展裂变增长与矩阵式社群搭建。\n--建立并管理海外发行运营团队，深度拓展并维护与海外渠道、本地媒体及核心合作伙伴的战略合作关系。\n3. 具备全球化内容生态与创作者搭建能力\n--搭建面向全球的 UGC 创作者、开发者及工会/公会招募、孵化与全生命周期管理体系，驱动内容生态自循环。\n--把控平台内容安全、合规性及海外本地化标准（如 GDPR 隐私保护、版权规范与内容审查机制等）。\n4. 商业化闭环与精细化运营\n--统筹平台多元化商业化变现路径（如付费订阅、全球化支付生态、分成机制等），持续优化全球不同区域的 ARPU 值与 ROI 模型。\n--建立科学的全球化数据监控与漏斗分析体系，通过数据驱动产品迭代、跨国本地化适配及精细化用户分层运营。\n5. 跨部门统筹与项目全盘管理\n--站在平台全局视角，高效协同产品、技术、海外发行、设计与本地化团队，输出高质量的需求规划（PRD）、用户流程及全球化交互设计规范。\n--严控项目排期与技术架构风险（如全球服务器并发、大文件分发、海外网络延迟优化等），保障平台在全球范围内的平稳高效运转。\n任职要求\n1. 基本背景\n统招本科及以上学历，具备 6-10年及以上 互联网/游戏行业从业经验，其中至少 3-5年 大中型游戏平台、应用分发平台或出海工具/社区产品的核心运营负责人管理经验。\n具备成熟的海外游戏发行或海外平台运营实战操盘战绩，有完整大体量出海项目成功落地经验。\n2. 核心专业能力\n全球化视野与海外推广能力：深刻理解海外主流游戏文化及用户心智，精通海外社媒裂变及本地化获客底层逻辑。\n平台级统筹与架构破局能力：不局限于单点业务，具备大盘视角，能统筹“技术-产品-运营-商业化-海外发行”的全链路闭环。\n商业化与创作者经济操盘经验：对全球化平台的变现模式、分成机制及创作者生态有深刻认知，具备跨国商业合作谈判与 ROI 优化能力。\n3. 软性素质\n团队管理与跨部门协同能力：具备优秀的大局观与跨文化团队管理经验，能够在执行层面扎实落地的同时，具备主动思考、前瞻性全球规划及跨部门高压协同的领导力。", "cat": "运营与市场"}, {"id": "109", "title": "资深SEO运营/自动化增长", "salary": "20K", "location": "远程，可国内办公", "jd": "岗位职责\n1.        挖掘建立PC端游戏工具平台SEO矩阵；\n2.        协同技术研发团队完成程序化SEO需求。确保自动化生成高转化率的多语种落地页，并完成主要引擎的抓取收录；\n3.        主导全站点的技术SEO优化，监控并优化页面跳出率，提升在主要引擎的核心关键词占比和排名；\n4.        针对高热度关键词，策划并实施海量域名站群建设，运用泛解析、泛目录等技术快速截流，获取游戏媒体与相关论坛的引流。\n岗位要求\n1.        本科及以上学历，具有5年以上SEO优化经验，有大型软件分发站、游戏门户或电商平台优化经验者为必选项；\n2.        精通GSC、Ahrefs等工具。熟练掌握国内外各类蜘蛛池搭建与快速收录机制，有千万级页面收录与应对搜索引擎核心算法打击的实战规避经验；具备百度、Google等主流搜索引擎双端黑白帽SEO实操经验者优先。\n3.        具备极强的技术理解力，熟悉前沿的程序化SEO逻辑和利用AI工具批量生成高质量网页内容的流程；\n4.        数据导向，能清晰核算SEO带来的自然流量在转化漏斗中的最终价值，抗压能力强。", "cat": "运营与市场"}, {"id": "110", "title": "AI 视频设计师", "salary": "15000-20000", "location": "远程，可国内办公", "jd": "岗位职责：\n1、负责 AI 动漫短视频、AI 游戏介绍动画等内容全流程制作\n2、根据剧本完成分镜构思、AI 视频生成、配音配乐、剪辑及交付\n3、把控人物一致性、画面风格、剧情节奏和镜头衔接\n4、修复人物崩坏、穿模、画面抖动等问题\n任职要求：\n1、熟悉 AI 视频、AI 动漫制作流程\n2、必须熟练使用 ComfyUI / WebUI 工具和 Wan 2.2、LTX 2.3 等 AI 开源视频模型——不熟悉开源视频模型的请勿投递\n3、能够自行搭建工作流，或根据通用工作流添加节点，搭建特殊的动作迁移、视频转绘、视频去水印等视频编辑工作流\n4、能独立完成分镜设计、视频提示词搭建、生成视频及配音等制作\n5、必须提供AI视频作品集\n加分项：\n1、有 Wan 或 LTX 的视频 LoRA 制作经验\n2、有其他图片 LoRA 训练经验\n3、有 AI 语音合成经验（ElevenLabs、GPT-SoVITS 等）\n4、有二次元 / 卡牌 / RPG / 美女向 / 男性向内容视频经验\n5、有海外市场（中华圈、韩国、日本）视觉偏好理解\n6、曾独立主导某款漫剧或短剧作品的完整宣发流程", "cat": "内容与创作"}, {"id": "111", "title": "游戏广告素材设计师", "salary": "13000-18000", "location": "远程，可国内办公", "jd": "岗位职责：\n1、负责手游及内容平台的广告素材设计与制作:静态图、GIF、短视频、信息流素材、原生广告、开屏广告等\n2、根据投放需求与产品定位，拆解卖点并转化为高点击率的视觉表现\n3、熟练使用 AI 生图与 AI 视频工具（Midjourney / ComfyUI / Flux / 即梦 / Runway / Kling 等）大幅提升素材产出效率，同时保证质量稳定性与角色/风格一致性\n4、针对不同投放渠道产出差异化尺寸与调性的素材版本\n5、建立高效率素材工作流：多版本快速产出 → A/B 测试 → 数据回收 → 复用有效元素\n6、结合投放数据反馈，总结高转化元素并沉淀为可复用的模板 / LoRA / 提示词库\n7、针对不同投放渠道的审核规则，输出「尺度分级版」素材（严格版 / 合规版 / 高转化版），配合买量团队通过审核\n任职要求：\n1、2 年以上手游 / 信息流 / 买量广告素材经验（有真实投放数据案例者优先）\n2、必须熟练运用 AI 生图工具（Midjourney / Stable Diffusion / ComfyUI / Flux / 即梦 至少 3 款），具备扎实的提示词、LoRA、Checkpoint 使用能力\n3、会使用至少一款 AI 视频生成工具（Runway / Kling / MiniMax 海螺 / 即梦视频 / Sora / Pika 等），能输出 15 秒以内的短视频素材\n4、必须对二次元文化具备真实理解，手游玩家优先考虑\n5、具备扎实的视觉设计基础，对构图、色彩、信息层级、字体排版有清晰判断\n6、熟练使用 Photoshop、AE（或 CapCut / Premiere），具备基础动效与视频剪辑能力\n7、了解手游 & 内容平台广告素材的常见形式，对用户注意力机制、前 3 秒钩子有基本认知\n8、能理解产品卖点，并将其转化为有效的视觉表达\n9、必须提供 AI 生成作品集（AI 生图 + AI 视频，最好包含尺度作品）\n加分项：\n1、有二次元 / 卡牌 / RPG / SLG / 美女向 / 男性向手游素材经验\n2、有海外（中华圈、韩国、日本、东南亚）或成人向市场投放素材经验\n3、熟悉 ComfyUI 工作流搭建、LoRA 训练、图像扩展、局部重绘、图生视频等高级 AI 应用\n4、有真实投放数据支撑（CTR、CVR、eCPM 优化案例）\n5、能独立完成从卖点拆解 → 概念构思 → AI 生成 → 后期加工 → 多版本迭代的完整流程\n6、对数据反馈敏感，愿意根据 A/B 测试结果快速调整设计方向\n7、有 Meta / TikTok / Google 等主流投放平台素材审核规则的实战经验", "cat": "内容与创作"}, {"id": "112", "title": "游戏发行项目经理", "salary": "13k-16k", "location": "远程，可国内办公", "jd": "岗位职责\n1、负责游戏发行项目全生命周期管理，制定项目计划并推动研发、QA、运营、商务、运维等团队按节点完成交付。\n2、负责版本管理，包括需求排期、提测、验收、发版、热更新及线上版本维护，持续优化版本交付流程。\n3、负责发行流程推进，协调版本上传、平台配置、SDK、支付、登录、更新及上线后的异常处理。\n4、跟踪项目进度及风险，推动跨部门问题闭环，保障重点版本及上线节点按计划完成。\n5、跟进版本数据、用户反馈及商业化表现，推动产品体验、活动及商业化内容持续优化。\n6、对接第三方SDK、支付、签名、服务器及其他外部供应商，推进相关资源及服务稳定交付。\n任职要求\n1、熟练使用 Claude、ChatGPT 等 AI 工具，能够独立搭建项目管理相关 AI 工作流，并应用于版本推进、需求分析、文档及团队协作。\n2、本科及以上学历，3年以上游戏项目管理、发行或运营相关经验，有完整游戏上线及长线运营经验优先。\n3、熟悉游戏研发及发行流程，具备较强的项目推进、版本管理及风险控制能力。\n4、熟悉自有平台、SDK、支付、登录、热更新、版本发布等相关流程。\n5、具备较强的跨部门沟通协调能力，能够推动研发、QA、运营、商务及运维高效协作。\n6、具备良好的数据分析能力，能够根据用户反馈、版本数据及商业化表现推动项目优化。\n加分项\n1、有 AI Agent、Bot、自动化工作流或项目管理工具独立搭建经验。\n2、熟悉第三方签名、SDK、支付、广告、客服等发行相关服务。\n3、有二次元、卡牌、成人向或海外自有平台项目经验优先。", "cat": "产品与管理"}, {"id": "113", "title": "AI应用后端工程师（AI Agent方向）", "salary": "20000-25000", "location": "远程，可国内办公", "jd": "职位描述\n负责公司AI游戏资产管理助手一期系统的设计与研发。通过大模型、Agent和智能搜索技术，实现游戏美术资源自动分析、自动分类、智能检索和资产管理，提升研发、美术团队资源查找和复用效率。\n工作职责\n•负责AI游戏资产管理平台后端系统设计与开发，包括资源管理、数据服务、搜索服务等核心模块。\n•负责接入大模型能力，实现游戏资源自动分析、描述生成、标签分类、智能搜索等功能。\n•负责AI Agent能力开发，基于OpenClaw、MCP等技术实现自然语言查询、工具调用和智能任务处理。\n•负责向量搜索、RAG等AI应用技术落地，持续优化资源搜索效果。\n•负责系统部署、性能优化和稳定性维护，保障平台稳定运行。\n任职要求\n•熟悉Python开发，具备FastAPI等后端框架开发经验。\n•熟悉数据库设计，掌握Postgre
