的方案和取舍。\n能把人工审核流程描述到开发人员可据以开发的程度并验收交付结果；与开发团队和其他部门对接时能守住立场、推动响应，不事事上报。\n信息不全时能自行假设并写明、先往前推进，知道缺的依据去哪里拿。\n日常熟练使用 AI 工具提升核对、撰写与分析效率，能说清哪些内容是工具产出、哪些经本人核对。\n有审计、内控、薪酬核算、人力资源运营或财务相关经验者优先；能力重于年限。", "cat": "其他"}, {"id": "279", "title": "HR助理（HRBP方向）", "salary": "£25,000 – £30,000 / 年", "location": "工作地点：伦敦\n混合办公（根据业务需要灵活安排）\n初筛问题（共3题）\n1. 请结合JD中提到的三类候选人背景，说明你更符合哪一类，并简要说明你为什么适合该岗位。\n2. 某业务团队负责人反馈，团队近期整体工作强度较高，但产出未见明显提升。如果你在支持该团队，你会如何理解这一情况，并打算如何开展后续工作？\n3. 请简单分享一个你使用AI提升工作效率的实际例子，或你搭建过的相关工具（如有可附链接）。", "jd": "岗位职责\n业务理解与HRBP支持：协助总监理解业务运作，识别组织问题并推进相关优化。\n人力规划与招聘支持：参与人力需求评估及招聘支持，从业务角度判断人员匹配度。\n组织效率提升：协助推动团队效率及整体组织绩效的提升。\n执行与制度落地：协助相关工作的落地与跟进，并推动公司制度在各部门执行。\n\n任职要求\n基础要求\n本科及以上学历\n熟练使用办公工具（如Excel、Google Drive、WPS等）\n对使用AI工具提升工作效率具备积极态度\n中文流利\n核心能力\n执行力强，能够推动事情落地\n逻辑能力强，具备清晰的分析与判断能力\n学习能力强，能够快速成长\n候选人背景（需满足以下三类之一）\n人力资源专业背景（优先）\n人力资源管理或相关专业（如人力资源管理、组织管理等以人员与组织为核心的专业），具备扎实理论基础，并希望应用于实际工作\nCIPD发展路径人选\n已完成CIPD Level 3，并正在学习Level 5，对HRBP发展路径有明确规划\n具备管理经验并计划转型HR的人选\n过往工作中有实际带人或团队管理经验，对组织与人员问题有一定理解，有明确意愿转型HR，并计划未来考取CIPD", "cat": "职能"}, {"id": "280", "title": "英国法务助理", "salary": "", "location": "重要不紧急、长期招聘。要求英文能力、沟通能力和灵活度好。保持长期稳定推进节奏即可，多做简历推荐和面试。", "jd": "", "cat": "职能"}, {"id": "281", "title": "法务专员", "salary": "", "location": "未明确", "jd": "岗位职责\n参与公司海外主体搭建与治理，包括跨国基金、境外公司的设立、架构设计及日常合规维护\n支持投融资项目全流程法律工作：尽职调查、交易文件起草与谈判、交割及投后管理，覆盖公司融资与对外投资两端\n负责短剧等内容业务的版权与 AI 相关法律事务：版权权属与授权、AI 生成内容合规、平台合作协议审核\n起草、审核各类商业合同，识别法律风险并提出解决方案\n跟进相关领域法律法规及监管动态，输出合规建议\n\n任职要求与优先条件\n具备以下三个方向中至少两个方向的实践经验：\n海外公司治理：跨国基金或境外公司设立、架构搭建及治理\n投融资项目：融资与投资项目均有参与经验\nAI 与版权：短剧或内容行业的版权及 AI 合规经验\n具备良好的英文读写及法律文件起草能力\n学习能力强、主动性高，能在业务快速变化中独立推进工作\n有跨境交易或海外合规项目经验\n对短剧、AI 内容行业有持续关注和理解", "cat": "职能"}, {"id": "282", "title": "中高级产品经理", "salary": "20K-25K", "location": "只看绿色合规工作经验，灰线经验不考虑", "jd": "海外产品经理（AI/工具方向）\n\n岗位职责\n\n1. 负责海外产品0-1建设\n负责海外 APP 产品从需求分析、产品规划、设计开发到上线迭代的完整流程；\n根据目标市场用户需求，完成产品定位、功能规划及版本规划；\n\n独立输出：产品需求文档（PRD）；产品流程图；原型设计；功能验收标准；\n\n推动研发、设计、运营等团队协作，保障产品按计划上线。\n\n2. 负责产品策略及用户体验优化\n\n深入分析海外竞品及用户需求，制定产品优化方案；\n关注用户核心链路并基于数据分析持续优化产品体验。\n\n3. 负责增长及商业化设计结合产品目标设计策略\n\n4. 负责海外市场产品研究，关注欧美、东南亚等海外市场用户需求及行业趋势；研究海外竞品，输出竞品分析、产品策略及增长方案。\n\n5. 跨团队推进项目落地\n协调研发、UI、运营、投放团队推进项目；负责需求优先级管理及版本规划；跟进开发进度、测试验收及上线复盘；对产品最终效果负责。\n\n任职要求\n\n基础要求\n\n3年以上互联网产品经理经验；\n有完整负责产品上线经验；\n熟悉APP产品从0到1流程；\n具备较强的产品规划、需求拆解和项目推进能力。\n\n核心能力要求\n\n1. 产品能力\n熟悉：用户需求分析；产品架构设计；PRD输出；原型设计；数据分析；AB测试。\n\n能够独立完成：一个产品从想法到上线；一个版本从需求到交付。\n\n2. 增长能力\n了解：AARRR增长模型；用户生命周期运营；留存提升策略；付费转化优化。\n\n3. 海外经验优先\n\n优先考虑：海外APP产品经验；欧美市场产品经验；出海工具/AI产品经验；App Store、Google Play上线经验。\n\n加分项\n\n独立负责百万级用户产品经验；\n熟悉海外支付、会员体系、广告变现。", "cat": "产品"}, {"id": "283", "title": "信息流广告设计师", "salary": "18-25K", "location": "未明确", "jd": "一、岗位职责\n负责公司海外产品的信息流广告素材设计，包括 Meta、Google、TikTok 等海外广告平台的图片、视频、动图、落地页素材等；\n根据产品定位、目标用户及投放市场，独立完成广告素材的创意策划、视觉设计及迭代优化；\n深入理解海外用户审美及不同国家、地区的内容偏好，能够针对欧美、东南亚、中东等市场进行差异化素材设计；\n与广告投放、产品、运营团队协作，根据 CTR、CVR、CPI、CPA、ROAS/ROI 等投放数据分析素材表现，并持续进行素材优化；\n负责广告素材的批量生产及A/B测试，根据数据快速迭代高潜素材，提升素材点击率、转化率及投放效率；\n关注海外广告市场及竞品素材趋势，持续研究 Meta、TikTok、Google等平台热门广告素材、创意形式及用户内容趋势；\n能够从用户痛点、产品卖点及商业化目标出发，主动提出广告创意，而不仅仅是根据需求执行设计；\n建立并持续完善广告素材库、素材标签及优秀案例库，提高团队素材生产效率。\n二、任职要求\n3年以上信息流广告设计、广告创意设计或买量素材设计经验，有成熟的海外广告素材作品；\n熟悉 Meta、Google、TikTok 等海外广告平台的素材规范及常见广告形式；\n有较强的视觉表现力和广告创意能力，能够独立完成从创意 → 设计 → 测试 → 数据复盘 → 迭代的完整流程；\n对广告素材有较强的数据意识，能够理解CTR、CVR、CPA、CPI、ROAS等核心投放指标，并根据数据判断素材问题；\n熟悉 Photoshop、Figma、Illustrator、After Effects、Premiere 等设计/视频工具中的一种或多种；\n有较强的海外用户审美判断能力，对欧美年轻用户的视觉风格、广告表达及内容趋势有一定理解；\n有 社交、AI、游戏、工具、内容类产品海外买量素材经验者优先；\n有短视频广告、UGC广告、AI生成素材经验者优先；\n具备较强的执行力和抗压能力，能够适应快速测试、快速迭代的工作节奏；\n能够接受以投放数据和实际转化效果作为素材评估的重要标准。\n三、我们希望你具备的能力\n创意能力 > 视觉能力 > 数据意识 > 执行效率\n我们不希望招聘一个单纯“把图做得好看”的设计师，而是希望找到能够理解买量逻辑的广告设计师。\n你需要能够回答：\n这个素材为什么用户会点击？\n用户看到的第一眼卖点是什么？\n为什么这个素材CTR高？\n为什么点击高但注册/付费低？\n同一个产品，欧美和东南亚应该怎么做素材差异化？\n如何通过10～20个素材快速找到有效方向？\n一个素材跑出来以后，如何继续拆解、变体和放量？\n四、加分项\n有海外信息流广告素材爆款案例；\n有实际素材数据案例，可提供投放前后CTR、CVR、CPA、ROAS等数据变化；\n有AI伴侣、Dating、社交、游戏、内容类产品经验；\n有UGC、真人口播、剧情类短视频广告经验；\n熟悉 Midjourney、即梦、Runway、可灵、ChatGPT 等AI创作工具；\n有从0到1搭建广告素材体系或素材团队经验。\n五、薪资福利\n薪资：18K–25K/月\n具体薪资根据候选人的作品质量、海外买量经验、数据能力及实际项目案例综合评估。\n优秀候选人可进一步面议。", "cat": "设计"}, {"id": "284", "title": "动漫产品经理", "salary": "20-25K", "location": "未明确", "jd": "产品经理（内容社区 / 泛娱乐方向）\n薪资范围：20–25K\n岗位职责：\n1. 负责公司内容产品的整体规划与持续迭代，覆盖 App 端及 Web 端，结合业务目标制定产品路线、版本计划和需求优先级，并推动方案落地。\n2. 深入理解用户在内容发现、搜索筛选、播放阅读、收藏追更、互动社区及个人中心等场景中的需求，持续优化核心使用路径和产品体验。\n3. 独立完成用户调研、竞品分析、需求梳理、功能架构、业务流程、产品原型及 PRD 撰写，确保需求逻辑清晰、规则完整并具备可执行性。\n4. 协同 UI/UX、研发、测试、内容运营及市场团队推进产品开发，跟进排期、评审、验收和上线过程，及时识别并解决项目中的风险与问题。\n5. 结合业务发展探索会员订阅、广告、虚拟权益、任务奖励、邀请推广等商业化及增长机制，在兼顾用户体验的基础上提升留存、活跃和付费转化。\n6. 建立并持续关注核心产品指标，通过用户反馈、行为数据和转化漏斗评估功能效果，定位问题并提出后续优化方案。\n7. 关注动漫、漫画、视频及内容社区行业趋势，持续研究同类产品的内容组织、推荐分发、社区互动和商业化模式，为产品创新提供可落地的建议。\n\n任职要求：\n1. 本科及以上学历，具有2年以上互联网产品相关经验，能够独立负责较完整的产品模块或版本迭代。\n2. 熟悉产品工作的完整流程，具备较强的需求分析、逻辑梳理、原型设计和文档表达能力，能够熟练使用 Figma、Axure、墨刀等产品工具。\n3. 具备良好的项目推动能力，能够协调设计、研发、测试和运营等不同团队，推动需求按计划落地。\n4. 具有数据意识，能够围绕用户活跃、留存、转化和付费等指标发现问题，并据此制定产品优化方案。\n5. 对内容社区、动漫漫画、视频娱乐或会员订阅类产品有一定理解，能够站在用户和业务两个角度思考产品方案。\n6. 沟通清晰、执行力强，对产品细节敏感，能够适应快速迭代及多任务并行的工作节奏，具备基本的平台内容安全与合规意识。\n\n加分项：\n1. 有内容社区、视频、漫画、二次元或海外互联网产品经验。\n2. 有从0到1参与产品搭建或新业务上线的实际经验。\n3. 熟悉会员订阅、广告变现、邀请裂变或用户激励体系。\n4. 具备基础的数据分析能力，熟练使用 Excel、SQL或相关数据分析工具。\n5. 对动漫、漫画及二次元内容有长期兴趣，熟悉国内外主流内容平台和用户生态。", "cat": "产品"}, {"id": "285", "title": "动漫中级运营", "salary": "10–20K", "location": "未明确", "jd": "中级运营（内容 / 社区方向）\n\n薪资范围：10–20K\n\n一、岗位职责\n1. 负责动漫、漫画及短剧内容平台的日常运营，围绕用户兴趣和业务目标制定内容计划，提升内容消费、用户活跃与留存。\n2. 负责内容选题、推荐、专题及活动策划，结合平台特色、热点趋势及用户偏好，提升优质内容曝光和用户参与度。\n3. 负责社区及社群运营，包括圈子分类、内容填充、话题互动、活动策划和核心用户维护，营造良好的社区氛围，提升用户活跃与持续参与度。\n4. 了解 X（Twitter）、Telegram 等渠道的内容发布、账号运营及用户互动，根据不同渠道特点调整内容形式，促进平台引流与用户转化。\n5. 负责动漫、漫画等内容资源的搜集、筛选、整理与分类，熟悉相关内容平台及资源渠道，能够快速定位优质动漫、漫画资源，建立可持续更新的内容资源池。\n6. 结合用户反馈、内容表现及运营数据，持续优化内容选题、更新排期、推荐策略及推广方式，推动运营效果提升。\n7. 协同产品、设计及技术团队推进运营需求落地，跟进执行进度并复盘运营效果。\n\n二、任职要求\n1. 具备 2 年及以上内容、社区或社媒运营经验，能够独立制定运营计划、推进执行并复盘效果。\n2. 热爱动漫、漫画及泛娱乐内容，了解相关用户的内容偏好、社区文化和热点趋势，具备良好的网感与选题判断力。\n3. 熟悉动漫、漫画内容资源的搜集渠道及获取方式，具备较强的信息检索、资源筛选、内容整理和分类能力，能够持续发现并补充优质内容。\n4. 了解 X（Twitter）、Telegram 等海外社媒及社群的运营方式，具备内容发布、用户互动、活动执行或引流经验。\n5. 具备基础的数据分析能力，能够结合内容表现、用户活跃及转化情况发现问题，并提出具体的优化方案。\n6. 执行力强，沟通清晰，具备良好的跨团队协作能力，能够独立推进日常运营工作并跟进结果。\n\n三、加分项\n1. 有动漫、漫画、短剧或二次元内容平台运营经验。\n2. 有从零搭建账号、社区或社群，并持续运营的经验。\n3. 熟悉海外动漫、漫画内容平台及相关资源渠道，具备英文内容检索和筛选能力。\n4. 有内容资源库搭建、内容分类体系建设或批量内容整理经验。\n5. 具备 AI 短剧、漫剧或动漫视频制作经验，熟悉 AI 内容生成工具，能够参与剧本创作、角色与场景生成、分镜设计、视频生成及剪辑等环节。\n6. 有海外社媒运营经验，能够根据不同平台特点制定内容发布及引流策略。\n\n应聘时请附上运营案例（有AI 内容作品优先），并简要说明本人负责的部分。", "cat": "运营"}, {"id": "286", "title": "短剧编导", "salary": "20-25K", "location": "未明确", "jd": "岗位职责：\n1. 负责 AI 短剧、漫剧项目的选题策划、剧本评估与改编，把控故事结构、人物设定与节奏；\n2. 将剧本拆解为可执行的分镜脚本，明确镜头语言、场景、角色状态与生成要求，对接 AIGC 制作环节；\n3. 统筹单个项目从剧本到成片的制作进度与质量，组织样片评审，提出修改意见；\n4. 跟踪平台数据与用户反馈，沉淀题材、节奏、钩子等方面的创作经验，反哺剧本库与制作标准；\n5. 参与制作 SOP 与剧本评级标准的建设与迭代。\n\n任职要求：\n1. 责任心强，对项目结果负责，能够同时推进多个项目并按时交付，具备良好的跨部门沟通与团队协作能力；\n2. 影视、戏剧、编导、中文等相关专业，3 年以上短剧、网剧或短视频内容策划/编导经验，有独立完成短剧项目的作品；\n3. 具备扎实的剧本判断能力和分镜拆解能力，熟悉竖屏短剧的叙事节奏与付费点设计；\n4. 了解 AI 生成内容的制作逻辑与局限，能够按 AI 生产方式改写剧本与分镜，有 AI 短剧/漫剧项目经验者优先。", "cat": "内容"}, {"id": "287", "title": "中高级运营（游戏运营）", "salary": "15-20K", "location": "只看绿色合规工作经验，灰线经验不考虑", "jd": "中高级运营（游戏运营）\n薪资范围：15-20k\n\n岗位介绍\n负责海外互动游戏及剧情类产品的日常运营，重点开展游戏内容更新、剧情策划、运营活动设计及内容配置工作，提升用户参与度、留存及产品活跃度。\n\n岗位职责\n1. 负责游戏产品的日常内容运营，包括剧情内容更新、游戏素材整理、内容配置及上线检查。\n2. 参与互动剧情、角色设定、故事分支及玩法内容策划，协助完善游戏内容体验。\n3. 负责游戏运营活动策划与执行，包括节日活动、主题活动、用户活跃及留存活动等。\n4. 通过运营后台完成游戏内容配置、更新与维护，确保游戏内容正常展示及运行。\n5. 跟踪游戏内容表现及用户反馈，分析用户参与、留存及内容消费情况，提出优化建议。\n6. 配合产品、设计及研发团队完成游戏版本测试、内容验收及运营需求落地。\n\n任职要求\n1. 具备2年以上游戏运营、内容策划或相关工作经验。\n2. 对游戏内容、互动剧情及用户体验有一定理解，具备基础的内容策划与活动设计能力。\n3. 具备较好的文字表达及创意能力，能够独立完成基础游戏内容或运营活动方案。\n4. 熟悉游戏运营基本流程，能够进行内容配置、活动执行及效果复盘。\n5. 具备良好的沟通协调能力和执行力，能够与产品、研发及设计团队协同工作。\n\n加分项\n1. 有海外游戏运营或游戏出海项目经验。\n2. 有互动剧情、文字游戏、互动短剧或休闲游戏运营经验。\n3. 有游戏剧情创作、角色设定、分支剧情设计或活动策划经验。\n4. 熟悉AI内容生成工具，能够利用AI辅助剧情创作、素材生产及内容更新。", "cat": "运营"}, {"id": "288", "title": "运营专员", "salary": "6-10k", "location": "只看绿色合规工作经验，灰线经验不考虑", "jd": "岗位名称：运营专员\n\n岗位介绍\n负责海外产品的日常内容运营、内容生产及基础测试工作，协助项目负责人完成产品内容更新、后台配置、版本验收等任务，保障产品日常运营及版本迭代顺利开展。\n\n岗位职责\n1. 协助完成AI伴侣、内容类产品的日常内容生成、编辑、审核及更新，保障内容质量与更新效率。\n2. 负责运营后台的内容上传、配置及维护，确保内容准确、完整并正常展示。\n3. 参与产品版本测试及BUG验收，记录、反馈并跟进问题修复情况。\n4. 协助执行日常运营策略，包括Push文案配置、用户互动内容维护及基础活动执行。\n5. 整理日常运营数据、内容素材及相关工作文档，协助完成其他基础运营工作。\n\n任职要求\n1. 具备2年以上互联网产品运营、内容运营或相关工作经验。学历大专及以上，本科优先\n2. 具备较好的内容理解与编辑能力，能够熟练使用AI工具辅助内容生产。\n3. 工作细致认真，具备良好的执行力和责任心，能够按要求完成内容配置与测试任务。\n4. 具备基础的数据整理能力，熟悉Excel等常用办公工具。\n5. 具备良好的沟通能力，能够配合产品、研发及其他运营人员开展工作。\n\n加分项\n1. 有海外产品运营或出海项目经验。\n2. 有AI产品、社交产品、内容平台运营经验。\n3. 有内容生产、AI工具使用或产品测试经验。", "cat": "运营"}, {"id": "289", "title": "渠道拓展专员", "salary": "12-20K", "location": "未明确", "jd": "岗位名称：渠道拓展专员\n\n经验要求：1年以上\n学历要求：大专及以上，本科优先，经验丰富可降低。\n\n岗位介绍\n负责动漫产品渠道拓展，渠道运营维护承接，反馈渠道市场信息，收集市场竞品信息、市场热点信息、及爆款产品信息。\n\n岗位职责\n1. 渠道开拓与触达：负责各主流平台（如抖音、快手、小红书、微信生态、B站、知乎等）及垂直社群、外部站长、CPS/CPA联盟等流量渠道的挖掘、建联与商务谈判。\n2. 合作方案策划：根据公司产品特点，独立撰写渠道合作方案，推进异业合作、联合活动、资源互换等多元化合作模式，获取低成本精准流量。\n3. KOL/KOC矩阵搭建：负责红人、大V或达人资源的开发与维护，建立长期稳定的合作关系，跟进内容投放、素材审核及效果回收。\n4. 数据追踪与优化：对各渠道引入的流量进行实时监控，分析ROI（投入产出比）、转化率、留存率等核心数据，定期输出数据分析报告，并根据数据调整渠道策略。\n5. 预算与合同管理：负责合作渠道的商务合同流程跟进、款项结算，并在合规及预算范围内最大化提高资金使用效率。\n\n任职要求\n• 工作经验：具备 1-3年 互联网流量开拓、媒介投放经验，有丰富成功案例者优先。\n• 资源储备：熟悉各大主流内容及广告平台的规则与玩法，手中拥有现成MCN机构、达人、站长或大流量主资源者严重加分。\n• 核心能力：\n• 具备出色的商务谈判能力和人际交往能力，能快速与陌生渠道建立信任。\n• 对数据敏感，能通过数据发现渠道问题并解决。\n• 具备较强的抗压能力、自驱力及结果导向意识。\n\n加分项\n- 自己有流量主、站长或供应商资源\n- 会使用AI辅助渠道工作", "cat": "商务 / 市场"}, {"id": "290", "title": "渠道数据运营助理", "salary": "8-12K", "location": "未明确", "jd": "岗位名称：渠道数据运营助理\n经验要求：1年以上，有相关项目经验者优先\n学历要求：大专及以上，本科优先\n\n岗位介绍\n负责动漫产品的日常渠道投放数据统计，整理数据，识别异常，协助上级执行渠道策略Abtest。\n\n岗位职责：\n1.数据日常监控：负责各获客渠道 日/周/月度核心数据的提取、整理与报表更新。\n2.建立数据分析模型，常态化开展全链路数据监测（如曝光、点击、转化率、CPC、CPA、ROI、LTV等），协助识别优质渠道与异常数据。\n3.归因与链路追踪：协助配合技术/产品团队，监测链路测试数据，确保各渠道流量归因的准确性。\n4.投放素材效果数据收集反馈，协助上级优化广告素材和落地页（Landing Page）。\n\n任职要求：\n1.数据技能：\n• 熟练使用 Excel/Excel高级函数（如 VLOOKUP、数据透视表、常用统计公式）。\n• 了解主流数据分析或可视化工具\n• 行业理解：对流量渠道有基本认知，对“流量、留存、转化”的增长模型有概念。\n\n2. 核心能力：\n·会熟练运用AI\n·强执行力：能高效推进多渠道、多任务并行\n·结果导向：对数据敏感，以结果为目标驱动工作\n·沟通协调能力：能顺畅对接渠道、内部团队（投放/产品等）\n·问题解决能力：遇到问题能主动推进解决，而不是等待\n·具备良好的沟通能力和团队协作意识，能适应快节奏工作。", "cat": "商务 / 市场"}, {"id": "291", "title": "中高级产品运营", "salary": "10K-30K", "location": "业务属性;敏感、成人/绿色：8/2\n岗位业务接触:直接\n工作内容沟通程度:推送前沟通", "jd": "负责产品整体运营及增长工作，通过数据分析、用户研究、竞品分析和产品迭代，持续提升产品活跃、留存及转化表现。参与产品从0到1搭建及成熟产品优化，对产品核心数据结果负责。\n\n岗位职责\n1.负责产品日常运营管理，制定并执行运营策略，提升产品活跃、留存及用户体验。\n2.通过数据分析发现问题，输出优化方案并推动产品迭代落地。\n3.负责产品功能测试、上线验收、BUG跟进及日常巡检工作。\n4.收集用户反馈，完成竞品调研与行业分析，持续优化产品方向。\n5.协助产品经理进行需求梳理、功能设计及运营方案制定。\n6.建立产品数据监控体系，定期输出运营分析报告。\n7.协调研发、设计、运营等团队资源，推动项目按计划完成。\n8.对新增、留存、活跃、转化等核心指标负责。\n\n任职要求\n1.有丰富的视频产品运营经验，有社区、内容平台、短视频类产品经验优先。\n2.熟悉产品运营全流程，能够独立负责产品模块运营工作。\n3.具备较强的数据分析能力，对用户增长、留存和转化有实际经验。\n4.熟悉产品迭代流程，能够推动需求从提出到落地上线。\n5.逻辑清晰，执行力强，具备优秀的问题分析及解决能力。\n6.责任心强，具备较强的结果导向意识。", "cat": "运营"}, {"id": "292", "title": "AI视频编剧（兼选题、角色设定）", "salary": "12-20k", "location": "主要交付物\n选题报告、人物关系图、角色小传、故事大纲、分集梗概、分集剧本、剧情时间线。\n\n核心考核指标\n选题通过率、剧本按期交付率、剧本一次审核通过率、平均返修次数、角色一致性、剧本制作可执行率、前三集完播表现。\n\"业务属性;敏感、成人/绿色：8/2\n岗位业务接触:直接\n工作内容沟通程度:推送前沟通\"", "jd": "岗位职责\n1. 跟踪短剧、网文、漫画及社交平台热点，建立题材库和选题储备库。\n2. 结合目标用户、平台特点和商业化方向，完成竞品拆解及选题判断。\n3. 输出选题方案，明确受众、核心卖点、题材类型、主要冲突和差异化亮点。\n4. 完成世界观、人物关系、角色小传及主要角色的性格、外形、身份、动机和成长线设定。\n5. 完成故事大纲、分集梗概和分集剧本，设计前三集钩子、情绪爆点、反转及集尾悬念。\n6. 负责人物对白、动作、表情和场景描述，保证人物行为逻辑及剧情前后统一。\n7. 结合AI生成能力控制人物数量、场景数量、复杂动作和特效难度，提升剧本落地效率。\n8. 根据剧本审核、分镜及成片反馈及时修改，并沉淀人物档案和剧情时间线。\n\n任职要求\n1. 2年以上短剧、网文、漫画、影视编剧或内容策划经验。\n2. 至少熟悉男频、女频、甜宠、逆袭、悬疑、都市等一种主流题材。\n3. 具备选题判断、故事结构、人物塑造、冲突设计和对白创作能力。\n4. 熟悉短剧前三集留人、强情绪推进、连续反转及集尾卡点逻辑。\n5. 能够独立完成角色设定、故事大纲及分集剧本。\n6. 了解AI生图、视频生成的能力边界，能够编写适合AI制作的剧本。\n7. 熟练使用ChatGPT、Claude等AI工具辅助调研、创作和一致性检查。\n8. 应聘时需提供选题方案、人物小传、剧本或已上线作品。", "cat": "AI / AIGC"}, {"id": "293", "title": "AI视频分镜师", "salary": "15k-23k", "location": "主要交付物\n分镜脚本、镜头清单、镜头参考图、提示词方向、镜头补充及返修清单。\n\n核心考核指标\n分镜按期交付率、一次审核通过率、镜头生成成功率、单集镜头控制、因分镜导致的返工率、剧情表达完整度。\n\"业务属性;敏感、成人/绿色：8/2\n岗位业务接触:直接\n工作内容沟通程度:推送前沟通\"", "jd": "岗位定位\n负责将审核通过的剧本转化为可直接执行的镜头方案，是文字内容与AI视觉制作之间的核心衔接岗位。\n\n岗位职责\n1. 将分集剧本拆解为标准分镜脚本和镜头清单。\n2. 明确每个镜头的景别、机位、构图、角色、动作、表情、台词、时长和运镜方式。\n3. 设计镜头衔接、人物调度、节奏变化和情绪呈现。\n4. 根据角色设定及场景设定输出镜头画面描述、参考图需求和提示词方向。\n5. 结合AI生图及视频工具的能力边界判断镜头可实现性，减少复杂群像、动作和运镜返工。\n6. 控制单集镜头数量和制作难度，平衡成片效果、制作周期和生成成本。\n7. 与编剧确认剧情表达，与视频生成岗位确认技术实现，与剪辑岗位确认成片节奏。\n8. 审核生成的关键帧和视频镜头，根据样片效果补充、替换或调整分镜。\n9. 沉淀常用景别、动作、运镜和提示词模板，提高后续制作效率。\n\n任职要求\n1. 2年以上影视、动画、漫画、广告、短视频或动态漫分镜经验。\n2. 熟悉景别、构图、轴线、机位、人物调度和镜头叙事。\n3. 能够独立将文字剧本转化为结构清晰、可制作的镜头表。\n4. 理解主流AI生图及视频生成工具的能力边界。\n5. 具备较强的画面想象力、节奏感和成本意识。\n6. 具备绘画能力，或能够使用AI工具快速制作分镜参考图。\n7. 有AI短剧、动态漫画、漫剧或批量内容生产经验者优先。\n8. 应聘时需提供分镜作品或现场完成指定剧本的镜头拆解。", "cat": "AI / AIGC"}, {"id": "294", "title": "AI视频配音师/音频制作", "salary": "18k-25k", "location": "主要交付物\n角色声线表、人物配音文件、环境音及音效素材、音频工程、授权记录、返修版本。\n\n核心考核指标\n配音按期交付率、角色声线一致性、情绪匹配度、错读漏读率、音画同步问题数、返修率、版权风险事件数。\n\"业务属性;敏感、成人/绿色：8/2\n岗位业务接触:直接\n工作内容沟通程度:推送前沟通\"", "jd": "岗位职责\n1. 根据人物年龄、性格、身份和情绪设计声音方案，建立角色声线档案。\n2. 使用真人或AI配音工具完成台词配音，保证角色声音前后一致。\n3. 根据剧情调整语速、停顿、重音、语气和情绪强度。\n4. 处理错读、吞字、机械感、情绪不符、音量不一及口型不同步问题。\n5. 完成音频降噪、剪切、音量统一和基础混音。\n6. 根据剧情需要配置环境音、动作音效及基础背景音乐建议。\n7. 与编剧确认台词含义，与剪辑确认节奏、口型和音画同步。\n8. 管理声音模型、音频素材、授权记录和版本文件，避免声音及音乐侵权。\n9. 根据质检反馈及时完成补录、替换及音频返修。\n\n任职要求\n1. 1年以上配音、音频制作、短剧后期或AI语音生成经验。\n2. 具备良好的语言表达、人物理解和情绪判断能力。\n3. 熟悉至少一种AI配音工具及基础音频编辑软件。\n4. 能够调整语速、停顿、重音、音色和情绪参数。\n5. 具备基础降噪、剪辑、混音和音量标准化能力。\n6. 对声音一致性、口型同步和音频版权风险具有较强敏感度。\n7. 有短剧、动画、有声书、游戏角色或多角色配音经验者优先。\n8. 应聘时需提供配音或音频制作作品。", "cat": "AI / AIGC"}, {"id": "295", "title": "新媒体运营", "salary": "10k-16k", "location": "未明确", "jd": "一、岗位职责\n1. 根据业务需求，开展国内KOL合作推广或海外社交媒体运营，提升品牌曝光、用户增长及引流转化；\n2. 拓展和维护国内KOL、达人及垂类创作者资源，完成达人筛选、主动触达、合作洽谈、内容沟通与上线跟进，持续优化合作效果；\n3. 负责海外社交媒体渠道（TikTok、Discord、Reddit、Twitter / X、Telegram、Instagram等）的账号或社群搭建、日常运营与推广，结合不同平台特点制定内容与互动策略；\n4. 策划图文、短视频、话题及社群活动，制定内容日历与推广计划，把控内容质量和发布节奏，提升粉丝增长、互动率与用户活跃度；\n5. 跟踪达人合作及各渠道推广数据，围绕曝光、互动、引流、注册和转化等指标复盘，持续优化达人选择、内容方向与推广方式；\n6. 关注平台规则、行业热点及竞品动态，挖掘新渠道与合作机会，配合站内运营做好流量承接，沉淀可复用的推广方法。\n二、任职要求\n1. 具备2年以上新媒体运营、达人合作或社交媒体推广相关经验，有视频、娱乐、泛文化类项目经验者优先；\n2. 具备以下任一方向的能力或经验：\n   - **国内KOL方向：**熟悉抖音、小红书、B站、微博等平台的达人生态，能够独立完成KOL筛选、主动触达、合作推进及关系维护；有成熟达人资源或成功合作案例者优先；\n   - **海外推广方向：**具备海外多平台新媒体推广实操经验，熟悉TikTok、Discord、Reddit等平台中的至少两个，能够结合平台规则、内容形式及社区文化开展内容推广、社群互动与用户增长；\n3. 具备良好的内容策划、文案表达与沟通协调能力，对热点和用户兴趣敏感，能够推进合作内容或推广活动落地；\n4. 具备数据分析与复盘能力，能根据推广效果调整策略；有可展示的达人合作、账号增长或引流转化案例者优先；\n5. 海外推广方向需具备良好的英语读写能力，能够独立完成英文内容发布及社区沟通；具备短视频制作、剪辑或其他语言能力者加分。", "cat": "运营"}, {"id": "296", "title": "中高级产品运营", "salary": "10k-15k", "location": "未明确", "jd": "岗位职责\n1. 产品运营与迭代推进：负责某AI全系产品的日常运营工作，深度对接产品、技术团队，收集用户反馈、使用痛点及功能需求，整理数据复盘报告，输出产品优化建议，推动产品功能迭代、体验升级，提升产品核心竞争力。\n2. 用户全链路运营：搭建并完善用户运营体系，负责新用户拉新、留存、激活、转化全流程工作；维护核心用户社群，日常答疑、互动活跃，挖掘高价值用户，搭建用户成长体系，提升用户粘性、复购率及口碑传播力。\n3. 内容与渠道运营：独立策划、产出适配AI产品的推广内容（干货教程、使用案例、功能拆解、行业方案等），覆盖公众号、小红书、抖音、知乎、社群等全渠道；负责各运营渠道的日常维护、流量撬动、内容分发，持续拓宽产品曝光渠道，获取精准用户流量。\n4. 活动策划与落地：结合产品节点、市场热点、用户需求，独立策划拉新、促活、转化、裂变类运营活动，完成活动方案撰写、落地执行、数据追踪、复盘优化全流程，达成月度/季度用户增长、营收转化目标。\n5. 数据复盘与策略优化：建立日常运营数据监测体系，重点监控用户新增、活跃度、留存率、转化率、渠道ROI等核心数据，定期输出运营复盘报告，基于数据问题迭代运营策略，持续提升运营效率与成果。\n6. 品牌与市场辅助：协助完成产品品牌基础曝光、行业资源对接、合作渠道维护，整理产品案例、行业解决方案，助力某AI产品品牌影响力持续提升，配合完成团队其他运营相关工作。\n\n任职要求\n1. 学历经验：本科及以上学历，3-5年及以上互联网产品运营、用户运营、内容运营相关全职经验，有AI工具、SaaS产品、互联网初创团队运营经验者优先\n2. 能力要求：熟悉互联网产品运营全流程，具备独立策划运营活动、产出推广内容、运营用户社群的能力；具备基础数据分析能力，能够通过数据发现问题、优化策略。\n3. 行业认知：对AI行业、智能工具产品有浓厚兴趣，愿意深耕AI产品运营领域，了解主流AI产品玩法及用户需求痛点者优先。\n4. 核心素养：逻辑清晰、执行力强，具备良好的自主驱动力和问题解决能力；擅长沟通协作，能够高效对接跨部门团队；抗压能力强，目标感明确，适配初创团队快节奏工作模式。\n5. 技能加分：擅长文案撰写、短视频内容制作、新媒体渠道运营；有私域裂变、用户增长、ToB产品运营实战经验者优先。", "cat": "运营"}, {"id": "297", "title": "中高级用户运营", "salary": "15k-20k", "location": "未明确", "jd": "渠道用户增长运营\n我们拥有多线产品矩阵，覆盖短视频、社区交友、视频直播、智能搜索等产品，含国内 + 海外双市场，多条业务均处于0-1 孵化阶段。现阶段核心目标是挖掘种子用户，完成产品冷启动，搭建基础用户增长链路，探索可持续的获客与留存模式。\n\n岗位职责\n1、负责多条孵化期产品（短视频、社区交友、直播、智能搜索类）的种子用户挖掘与冷启动，国内 + 海外渠道并行，搭建种子用户池，完成初期用户增长目标。\n2、调研国内、海外各流量渠道，筛选低成本获客渠道，落地种子用户引流方案；包含社群运营、内容种草、达人 / 主播招募、社区发帖、渠道投放测试等，持续测试获客模型。\n3、负责种子用户全链路运营：用户招募、进群引导、用户分层、需求收集、用户反馈回收，把一线用户诉求整理输出给产品团队，辅助产品迭代优化。\n4、设计冷启动活动、新手任务、激励体系，提升种子用户激活、留存、互动，监测转化漏斗（曝光 - 进入 - 注册 - 活跃），输出数据复盘，优化增长策略。\n5、区分成人 / 非成人产品线运营策略，所有运营动作严格合规；规避内容、用户、风控风险，定期排查用户侧违规行为。\n6、竞品调研：跟踪国内外同类产品冷启动玩法、渠道策略、商业化模式，输出竞品分析，寻找差异化增长机会。\n7、定期输出增长周报 / 月报，跟进核心指标：新增种子用户、DAU、留存率、获客成本，同步业务进展、问题与优化方案。\n\n任职要求\n1、有0-1 产品冷启动、种子用户运营实战经验，社交 / 社区 / 短视频 / 直播类产品经验优先；有海外增长经验加分。\n2、熟悉国内、海外主流流量渠道玩法，能独立完成渠道测试、用户引流，懂社群运营、用户挖掘，能低成本获取种子用户。\n3、具备良好的数据思维，会看增长漏斗、留存、获客成本等数据，能基于数据复盘，快速调整运营策略，试错迭代。\n4、理解多产品线并行运营，能区分不同产品（成人 / 非成人）运营边界，有强合规意识，清楚红线，拒绝违规运营手段。\n5、优秀的用户洞察力，擅长和种子用户沟通，能收集真实用户痛点，把用户反馈结构化输出给产品。\n6、自驱力强，孵化期业务不确定性高，能接受快速试错，一人多任务，独立落地完整运营项目；具备基础英文读写能力（海外业务使用）优先。\n7、【加分项】有海外社媒、公会 / 主播招募、用户激励体系搭建经验；熟悉 AI 工具辅助内容生产、用户运营。", "cat": "运营"}, {"id": "298", "title": "高级UI设计师", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责\n\n1、负责公司核心产品（Web / App / 小程序等）的整体 UI 视觉设计与优化升级\n2、参与设计规范与设计系统（Design System）的搭建与维护\n3、深度参与产品需求讨论，提供专业的交互与视觉解决方案\n4、运用 AI 工具提升设计效率，包括但不限于：\n    ·使用 AI 进行界面草图生成、创意发散，视觉表达及设计提案输出\n    ·推动设计流程升级，探索 AI + 设计的新工作模式\n\n任职要求\n1、本科及以上学历，设计类相关专业优先\n2、5 年以上 UI / 视觉设计经验，有成熟线上产品案例（硬性要求）\n3、精通 Figma / Sketch / Adobe/ Photoshop / Illustrator 等设计工具（figma必须熟练）\n4、具备良好的用户体验意识和交互理解能力，与开发/产品能够高效协同\n5、具备完整的设计系统构建经验优先\n6、优先国内大厂经验\n\nAI 能力要求（重点）\n1、熟练使用主流 AI 工具提升设计效率，例如：\nChatGPT / Claude（用于设计思考与文案优化）\nMidjourney / Stable Diffusion（视觉创意生成）\nRunway / AI 视频工具（动态视觉探索）\n2、有 AI + 设计落地项目经验者优先", "cat": "设计"}, {"id": "299", "title": "产品经理", "salary": "15k–25K", "location": "1. 产品经理工作年限≥5年，其中内容平台（漫画/视频/小说/动漫）经验≥2年\n2. 有App产品付费变现实操经验（会员订阅/虚拟付费/付费内容），非纯工具类或B端产品背景\n3. 有独立负责过单一产品线或核心模块长期迭代的经历，非仅执行层参与\n4. 简历中有明确的量化业绩数据（DAU/留存率/充值/转化率等具体数字）", "jd": "岗位JD描述\n\n1.任职要求：\n岗位职责：\n1. 负责付费内容APP（漫画/视频/动漫/小说等）整体产品规划、功能设计及版本迭代，业务覆盖多元内容形态，主导产品路线图制定与执行；\n2. 深入分析用户需求、市场趋势与竞品动态，制定产品发展策略，明确核心功能定位与迭代优先级；\n3. 持续优化现有变现体系（会员订阅、付费内容、广告等），平衡用户体验与商业变现，推动项目收益最大化；\n4. 对DAU、留存率、付费转化率等核心业务指标全面负责，建立数据监控与归因体系，持续推动指标提升；\n5. 熟悉内容产品「生产—分发—消费」全链路闭环，主导内容标签体系与推荐策略的建设与持续优化；\n6. 结合AI能力为业务赋能提效，将AI工具合理融入内容推荐、数据分析及产品设计日常工作；\n7. 与设计、研发、运营、市场等团队紧密协作，高效推动跨部门项目按期高质量落地；\n8. 持续跟踪行业动态与新技术趋势，探索差异化产品创新方向，保持产品竞争力；\n\n2.任职要求：\n1. 5年以上产品经理经验，其中2年以上内容平台产品经理经验，具备完整App产品0到1核心角色经历，独立主导过单一产品线或核心模块的长期迭代；\n2. 具备会员订阅、付费内容等流量变现成功实操经验，熟悉广告、会员、虚拟付费等多元变现模式；\n3. 数据能力扎实，理解数据「产生—收集—使用」完整闭环，有埋点设计、数据指标体系搭建经验，熟练运用A/B测试驱动产品优化，能独立出具数据分析报告，对数据波动具备敏锐感知与正确归因能力；\n4. 对AI能力边界有清晰认知，熟练使用Claude Code / Cursor / Codex等AI生产力工具，并能将AI合理应用于产品设计与日常工作提效；\n5. 具备优秀的跨部门沟通协作能力，能独立承接业务与运营诉求，主导复杂项目高效推进落地；", "cat": "产品"}, {"id": "300", "title": "高级 UI/UX 设计师（交友 / 社交方向）", "salary": "22-35k", "location": "未明确", "jd": "【岗位职责】\n1. 主导 App 与网站的介面与体验设计，定义整体设计方向\n2. 从零建立并管理设计系统，确保可扩充性与跨端一致性\n3. 主导用户研究、资讯架构与流程设计，透过数据与可用性验证（含 A/B 测试）推动决策\n4. 独立产出高品质视觉与平面素材（H5 banner、封面、行销物料），把关团队整体设计品质\n5. 与 PM、工程师、运营等跨部门协作，推动设计落地\n\n【任职要求】\n1. 5 年以上 UI/UX 设计经验，能独立主导项目并定义设计方向\n2. 须提供作品集（Portfolio），需含主导的完整产品专桉，及设计系统建置桉例\n3. 设计相关科系毕业，或具同等实务经验\n4. 具备强系统感与设计判断力，能决策设计方向与优先顺序\n5. 精通 Figma，能建立可扩充、语意化的设计系统并落地，含 Library 管理与版本控管\n6. 完整 UX 功底：用户研究、资讯架构、流程设计、可用性验证与 A/B 测试\n7. 能撰写设计规范与设计决策文件，建立并优化团队设计流程\n8. 熟悉全栈 iOS / Android / RWD 介面设计与进阶互动原型\n9. 具备扎实平面设计能力，精通 Photoshop / Illustrator\n10. 能运用 AI 工具（AI 生成图、Figma AI、Claude 串接 MCP 等）提升设计与交付效率\n11. 具设计提桉与向上沟通能力，能向利害关係人说明并说服设计决策\n12. 具商业思维，能将商业目标转化为设计策略；能指导并提升团队设计水准\n13. 抗压性佳，能在快节奏迭代下维持设计品质\n\n【加分条件】\n\n・HTML/CSS\n\n・付费内容 / 社群平台设计经验\n\n・成人产业隐私与金流体验设计经验\n\n・暗色模式与多语系介面经验\n\n・国际化合规", "cat": "设计"}, {"id": "301", "title": "供给增长运营专员", "salary": "20-30k", "location": "未明确", "jd": "岗位职责\n资源挖掘与触达：通过社交 App（陌陌、Soul 等）、社群、内容平台、招募/兼职群等多平台多渠道，主动挖掘并触达陪玩、伴游、向导、网红、模特等供给资源。\n评估、洽谈与签约：对意向资源做初步评估与筛选，沟通讲解合作模式，完成洽谈与线上签约，持续扩充供给规模。\n资源维护与激活：维护已签约资源关系，用资源、分成、成长路径等卖点吸引并留住优质供给，保持其活跃与履约。\n线上获客渠道运营：拓展并运营短视频投流（抖音/快手等）、CPA/CPS 联盟、站长换量、达人/代理、社群等线上渠道，获取有陪玩/伴游需求及喜欢线上擦边社交的精准用户。\n私域承接与复购：将公域流量沉淀进私域，做社群运营、客户分层、促活与促复购，提升用户价值与生命周期贡献。\n渠道开发与测试：持续开发新的线上资源与获客渠道，做渠道测试与效果评估，保留优质渠道、淘汰低质渠道。\n资源库与台账管理：建立资源库、渠道台账与标签体系，沉淀可复用的资源与渠道资产。\n数据复盘与反作弊：监控资源数量与质量、获客成本（CPA）、付费转化、复购等核心指标，做归因分析、识别假量水量、优化预算。\n风控与协作：把控线上渠道与账号安全（防封号、防渠道失效），与产品、运营、资源 BD 团队协同推进。\n\n任职要求\n线上资源获取实战（硬性要求）：做过通过线上渠道挖掘、招募、签约供给资源（主播/达人/网红/模特/陪玩/伴游等），或线上获客的工作，并拿过结果。\n自带线上资源/渠道者优先：手握可直接动用的线上供给资源或获客渠道，进来即能产出。\n熟悉渠道玩法：多平台线上挖掘签约、短视频投流、CPA/CPS 联盟、站长换量、社群/私域裂变等。\n数据驱动 + 反作弊：对数据敏感，会做漏斗、归因与 ROI 分析，能识别联盟假量水量、把控渠道质量。\n过往业绩：简历需体现可量化的成果（签约资源数量、新增规模、获客成本、付费转化、复购等具体数字与优化幅度），并能讲清自身贡献。\n软性素质：沟通谈判强、嗅觉敏锐、执行力强、抗压。\n强烈优先：有娱乐经纪、直播公会、主播/达人招募、MCN，或陪玩、伴游、同城社交、交友、擦边社交类产品的线上渠道、招募或获客经验者。\n对擦边/灰色业务无顾虑。\n\n注：学历、年限不作硬性限制，以线上资源获取与转化成绩为准。", "cat": "运营"}, {"id": "302", "title": "运营经理 （高级运营（成人、交友、AI）", "salary": "22-35k", "location": "未明确", "jd": "负责社交/社区/成人向产品的运营与商业化，对核心经营指标负责。\n核心要求：数据导向 + 强实操——能自己取数、自己下场、用数据拿结果。\n\n岗位职责：\n\n主导产品整体运营策略与体系建设，对 DAU、留存、付费率、ARPU、营收/流水负责；每个指标有目标、有拆解、有周期复盘，涨跌能归因到具体动作。\n亲自操盘用户全生命周期（拉新→激活→留存→付费→召回），搭建分层、成长、激励、付费、召回机制，并落地执行、盯盘数据、快速迭代。\n设计并迭代会员、礼物、虚拟消费、私密内容付费解锁、订阅等变现玩法；针对大 R（高价值/重氪用户）做专属运营与维系，用数据定价格、定权益、定节奏。\n建设用户标签体系，跑 A/B 测试，做漏斗诊断与转化归因，基于数据制定并动态调整策略——结论用数据说话，不拍脑袋。\n亲手策划并落地运营活动，结合擦边/成人流量特点做私域承接与渠道运营（不依赖主流投放平台）；统筹成人向 IP、擦边网红 / 达人合作与跨团队资源，对重点项目与活动 ROI 负责。\n紧跟擦边/成人/AI C端/社交社区行业的玩法与趋势，把被验证有效的打法快速搬进来试、用数据验证后保留或淘汰。\n沉淀运营方法论与 SOP，指导初级运营，提升团队执行效率。\n\n任职要求：\n\n强实操：独立操盘过完整运营线或核心业务（用户线 / 付费线 / 某社交场景），从策略制定到落地执行真正拿过结果。\n数据导向（硬性）：能自己取数（SQL / BI 看板）、搭建指标与标签体系、设计 A/B 测试、做漏斗诊断与转化归因。\n突出业绩：做出过可量化的规模化成果（DAU、留存、付费率、营收/流水达行业可观量级），并能讲清自身关键作用。\n行业背景（以下之一即可）：擦边社交（如陌陌 / 探探 / Soul 类）、成人向、AI C 端产品、社交社区 / 语聊 / 直播；或伴游、楼凤、网聊、陪玩等成人/擦边服务赛道，有实际 C 端运营经验即可。\n熟悉社交/社区的用户增长与商业化：虚拟消费、会员、大 R、礼物打赏、私域。\n对擦边/成人向内容与业务无顾虑。\n工作效率高，推动力强，抗压能力好。\n\n注：学历、年限不作硬性限制，以操盘能力、实操与数据结果为准。\n\n加分项：\n有擦边社交、成人向、直播打赏、语聊、网聊、陪玩、伴游、楼凤、AI 陪伴等赛道的操盘经验。\n有 AI C 端 / AIGC 类产品的运营经验。\n有出海或海外华人市场运营经验。\n带过小团队或主导过跨团队项目。", "cat": "AI / AIGC"}, {"id": "303", "title": "运营经理（高级网站运营）", "salary": "18K-28K", "location": "未明确", "jd": "岗位职责\n1.负责网站整体运营工作，制定并落地网站运营策略，对新增用户、活跃用户、留存率、自然流量、转化率等核心业务指标负责。\n2.负责网站内容生态建设，包括栏目规划、内容规划、专题策划及运营策略制定，持续提升内容质量、用户体验及网站竞争力。\n3.负责网站核心页面（首页、频道页、详情页、专题页、搜索页、活动页等）的运营规划及持续优化，提升页面点击率、访问深度、停留时长及转化效果。\n4.建立网站数据分析体系，持续监控流量、用户行为、内容表现、SEO表现及业务指标，定期输出数据分析报告及优化建议。\n5.基于数据分析持续优化用户增长、用户留存、内容消费及转化路径，推动网站核心指标持续增长。\n6.制定网站内容运营策略，建立内容生产、审核、发布、更新及生命周期管理机制，持续提升内容价值及运营效率。\n7.配合 SEO 团队制定搜索流量增长策略，负责关键词规划、专题布局、内容优化、内链建设、页面结构优化及搜索体验提升，推动自然流量增长。\n8.与产品、研发、设计团队协同推进网站功能优化、后台工具建设、运营自动化及用户体验优化，提高整体运营效率。\n9.建立网站运营规范及 SOP，包括内容发布规范、页面检查机制、数据监控机制、质量管理机制及运营复盘体系。\n10.持续开展竞品分析及行业研究，跟踪行业动态、搜索趋势及用户需求变化，输出运营策略及产品优化建议。\n11.策划并推动专题活动、频道运营、榜单推荐、热点运营、内容合集等增长项目，提升网站流量、用户活跃度及内容传播效果。\n12.建立网站运营预警机制，及时发现流量异常、内容异常、SEO异常及用户行为变化，并推动相关团队快速完成问题闭环。\n13.统筹跨部门项目，协调产品、技术、SEO、设计、内容等团队资源，保障重点运营项目按计划交付并达成业务目标。\n14.定期输出网站运营日报、周报、月报及专项分析报告，为业务决策提供数据支持，并持续沉淀运营方法论。\n15.持续探索 AI 工具、自动化运营及数据化管理能力，不断提升网站运营效率和团队交付能力。\n\n岗位要求\n\n1.3 年以上网站运营、平台运营、内容运营、增长运营等相关经验，具备独立负责网站运营项目经验。\n2.熟悉网站整体运营体系，能够独立制定运营策略、拆解业务目标并推动项目落地。\n3.熟悉 CMS、网站后台及页面配置，具备栏目规划、专题运营、内容管理及页面优化经验。\n4.具备优秀的数据分析能力，熟悉新增、DAU、PV、UV、CTR、CVR、留存率、跳出率、用户路径等核心运营指标，并能够通过数据驱动业务优化。\n5.熟悉 Google SEO 运营体系，理解关键词规划、页面结构、内容优化、内链建设、Schema、收录机制及自然流量增长逻辑。\n6.具备网站增长思维，熟悉用户增长、内容增长及搜索增长策略，能够独立制定增长方案并推动落地。\n7.具备较强的项目管理能力，能够统筹多个运营项目，合理协调资源并确保项目按计划完成。\n8.具备优秀的问题分析及解决能力，能够快速定位业务问题并提出可执行的优化方案。\n9.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Looker Studio 等数据分析工具，能够独立完成数据分析及业务复盘。\n10.熟练使用 Excel、Google Sheets、飞书表格等办公工具，能够建立数据模型及运营报表。\n11.具备优秀的沟通协调能力，能够高效协同产品、研发、SEO、设计及内容团队推进项目落地。\n12.具备较强的学习能力和业务敏感度，持续关注行业趋势、搜索算法及用户需求变化。\n13.具备2年以上团队管理经验，有网站运营团队、内容运营团队或项目团队管理经验，能够进行目标拆解、任务分配、绩效管理及团队培养，推动团队高效达成业务目标。\n\n加分项\n\n1.有大型内容平台、社区平台、资讯平台、聚合平台或流量站运营经验。\n2.有海外中文网站、Google SEO 流量站或海外互联网产品运营经验。\n3.有多站点、矩阵站点或国际化网站运营经验。\n4.熟悉 Google Analytics（GA4）、Google Search Console（GSC）、Ahrefs、SEMrush、Screaming Frog、Looker Studio 等工具。\n5.有网站增长、SEO增长、内容增长或用户增长成功案例，能够量化展示业务成果。\n6.熟悉 AI 工具在网站运营中的应用，具备内容生成、数据分析或运营自动化实践经验。\n7.熟悉 SQL、Python、Shell 等工具，可进行数据分析、运营自动化及批量处理。\n8.有 Telegram、Twitter（X）、Facebook、Reddit、Discord 等海外渠道运营经验。\n9.有产品运营、商业化运营、团队管理或跨部门项目管理经验。\n\n我们希望你具备\n\n1.具备网站整体运营思维，能够从业务目标出发制定运营策略。\n2.结果导向，对流量增长、用户增长、留存及转化等核心指标负责。\n3.数据敏感，能够通过数据分析发现问题并持续优化业务表现。\n4.具备较强的项目管理能力，能够统筹资源推动重点项目落地。\n5.关注用户体验，持续优化内容质量、页面结构及用户访问路径。\n6.主动发现问题，能够独立提出解决方案并推动闭环执行。\n7.具备优秀的跨团队沟通能力，与产品、研发、SEO、设计及内容团队高效协作。\n8.保持学习和创新意识，持续关注行业趋势、AI 工具及运营新模式。\n9.善于复盘总结，沉淀运营方法论，持续提升团队运营效率。", "cat": "运营"}, {"id": "304", "title": "运营经理（流量（WEB）部副主管）", "salary": "20-35k", "location": "未明确", "jd": "岗位职责\n1、负责网站整体运营管理，制定并落实网站运营策略，推动业务目标达成。\n2、负责网站内容运营、协助SEO优化、首页及频道页运营、专题策划等工作，持续提升网站流量及用户活跃度。\n3、负责网站核心数据监控与分析，包括新增用户、DAU、PV、UV、留存率、跳出率、收录量、关键词排名等，并制定优化方案。\n4、负责网站内容规划与运营规范建设，持续优化栏目结构、页面布局及用户体验。\n5、制定并执行Google SEO及站内SEO优化策略，推动网站收录、关键词排名及自然流量持续增长。\n6、协同产品、研发、设计等部门推进网站功能优化、需求迭代及项目落地，确保按计划交付。\n7、建立网站运营SOP、数据分析体系及工作流程，提高团队执行效率和运营质量。\n8、负责运营团队日常管理，包括工作安排、任务跟进、绩效考核、培训指导及人才培养。\n9、定期开展行业研究及竞品分析，结合业务目标提出运营优化方案。\n\n\n岗位要求\n\n熟悉网站运营全流程，具备独立负责网站运营项目经验。\n熟悉Google SEO、站内SEO及基础技术SEO知识。\n具备较强的数据分析能力，能够根据数据制定优化策略。\n熟悉内容运营、流量运营、用户运营及增长运营。\n能独立制定运营计划、项目推进方案及阶段性复盘。\n具备优秀的跨部门沟通协调及项目管理能力。\n\n加分项\n1、有Google、yandex SEO成功增长案例。\n2、有百万级以上流量网站运营经验优先。\n3、有资讯、视频、小说、漫画、社区等内容平台运营经验。\n4、有网站从0到1搭建或改版经验。\n5、有运营团队（5人以上）管理经验。\n6、有数据分析、A/B测试及增长运营经验。\n7、熟悉AI内容生产、自动化运营工具及工作流。\n\n我们希望你具备\n\n1、强烈的目标意识和结果导向，对业务增长负责。\n2、良好的逻辑思维能力，能够通过数据发现问题并提出解决方案。\n3、优秀的执行力和推动力，能够高效推进项目落地。\n4、较强的责任心，能够主动承担工作并持续优化流程。\n5、良好的团队管理能力，能够培养团队成员成长。\n6、优秀的沟通协调能力，能够高效协同产品、研发、设计等部门。\n7、持续学习能力，关注行业动态、新工具及运营方法论。\n\n试用期交付要求\n\n试用期内需完成：\n\n1、熟悉公司产品、网站业务及运营流程，了解各网站定位、运营模式及核心业务指标。\n2、对负责网站进行全面诊断，输出《网站运营分析报告》，至少提出20项可落地的优化建议（包含内容运营、SEO、页面体验、产品功能、数据分析等方向）。\n3、梳理当前网站运营流程，识别存在的问题，并提出优化方案及优先级。\n4、完成网站核心数据分析，建立基础运营数据看板，并形成日报、周报模板。\n5、制定未来1个月网站运营计划，包括内容运营、内容SEO优化、专题运营、用户增长等重点工作安排。\n6、推动至少1项运营优化需求或项目落地，并完成效果验证及复盘。\n7、与产品、研发、设计等相关团队建立协作机制，能够独立推进需求评审及项目跟进。", "cat": "运营"}, {"id": "305", "title": "中级运营（APP增长运营）", "salary": "16k–25k", "location": "远程办公", "jd": "APP 增长运营（产品和用户方向）\n▍ 岗位概述\n负责星河无界旗下 App 的产品增长与用户运营，面欧洲市场和中国市场人群，围绕跨文化社交、本地活动及泛娱乐产品，推动用户从注册、首次体验到持续活跃和付费转化。通过用户洞察、产品优化和精细化运营，完成产品冷启动，建立可持续的用户增长与留存机制。\n▍ 岗位职责\n1. 增长目标与数据分析\n围绕所负责产品，建立注册、激活、活跃、留存及付费转化等核心指标，协同完善数据埋点与增长看板，通过漏斗分析和用户分群识别问题，制定并推进优化方案。\n2. 用户研究与需求挖掘\n通过用户访谈、问卷、社群反馈及行为数据，了解英国、欧洲目标用户的使用习惯、社交需求与付费动机，结合竞品研究，提出产品体验和本地化运营建议。\n3. 产品体验与新用户激活\n梳理下载、注册、资料完善及首次关键行为的用户路径，结合具体业务优化首次互动、活动报名或内容观看等体验；与产品、设计和研发团队协作，降低流失，提高新用户激活率。\n4. 冷启动与核心用户运营\n招募并维护种子用户，建立核心用户群和反馈机制，推动首批有效互动、活动参与或内容贡献；识别高价值用户，培养能够持续参与、反馈和传播的核心用户群体。\n5. 用户分层与生命周期运营\n根据用户来源、行为、活跃程度及付费状态开展分层运营，制定新手引导、活跃维护、核心用户培养及流失召回策略，通过站内消息、Push、邮件和社群等方式提升留存与回访。\n6. 增长活动与运营实验\n策划邀请推荐、主题活动、任务激励等增长方案，结合产品阶段开展小范围测试或 A/B 测试，评估新增用户质量、参与效果和留存表现，持续优化有效的增长机制。\n7. 付费转化与用户价值提升\n结合所负责产品的会员、订阅、活动或内容付费模式，优化权益表达、体验引导、付费触点及续费运营，提升付费转化、复购与用户长期价值。\n8. 跨团队协作与运营体系建设\n根据增长目标和业务优先级制定运营计划，推动需求上线并复盘效果，沉淀用户运营 SOP、活动模板和实验记录；合理使用 AI 工具，提高用户反馈整理、内容制作和数据分析效率。\n▍ 任职要求\n• 有 App 产品运营、用户运营或增长运营经验，能够独立负责一个产品模块或用户群体的运营目标，并提供可复盘的项目案例。\n• 理解用户增长漏斗与生命周期运营，熟悉新用户激活、用户分层、留存提升、流失召回和付费转化的常用方法。\n• 具备产品意识，能够将用户反馈和数据问题转化为清晰的优化需求，并与产品、设计、研发团队协作落地。\n• 具备数据分析能力，熟练使用 Excel 或其他表格工具，能够开展基础漏斗、分群和留存分析，并根据结果调整运营策略。\n• 具备良好的英文读写能力，能够开展英文竞品研究、用户沟通及基础本地化运营工作。\n• 执行力和目标意识强，适应初创团队的工作节奏，能够在资源有限的情况下明确优先级、独立推进项目。\n• 对社交、本地生活、AI 交友与陪伴、短剧或社区产品有兴趣，关注真实用户需求，能够合理使用 AI 工具提高工作效率。\n▍ 加分项\n• 有社交、本地活动、内容社区、短剧或订阅类产品的运营经验。\n• 有产品从 0 到 1 冷启动、用户留存提升、会员转化或邀请增长的实际成果。\n• 熟悉 SQL，以及 Firebase、Mixpanel、Amplitude 等任一用户行为分析工具。", "cat": "商务 / 市场"}, {"id": "306", "title": "中级运营（SEO流量运营）", "salary": "15k-22k", "location": "远程办公", "jd": "网站流量运营（SEO 方向）\n▍ 岗位概述\n负责星河无界旗下网站的 SEO 与自然流量增长。通过搜索需求研究、网站结构优化、中文，英文及多语言内容建设和技术 SEO 协作，提升网站的搜索曝光与优质流量，并推动访问用户转化为注册、下载、咨询或付费用户。\n▍ 岗位职责\n1. SEO 策略与增长规划\n结合所负责网站的业务定位、目标市场和发展阶段，制定 SEO 增长计划，明确关键词、内容、站内优化和技术改进的优先级，持续提升自然搜索带来的有效流量与业务转化。\n2. 关键词研究与竞品分析\n研究目标用户的搜索需求、使用场景及搜索意图，分析竞品的关键词布局、内容结构和流量入口，建立按国家、语言、主题及转化阶段划分的关键词库，挖掘可切入的长尾需求。\n3. 网站结构与站内优化\n优化网站栏目、页面层级、URL、标题、描述、标题标签及内部链接，推动关键词与页面合理匹配，改善内容之间的关联和访问路径，提升重要页面的可发现性与使用体验。\n4. 英文及本地化内容运营\n制定内容选题、页面规划、写作提纲及更新计划，围绕用户需求建设产品介绍、使用指南、主题专题、常见问题和本地信息等内容；结合目标国家的表达习惯开展本地化，持续优化已有页面。\n5. 技术 SEO 排查与落地\n定期检查网站抓取、收录及索引状态，识别重复页面、失效链接、重定向、站点地图、robots、canonical 和 hreflang 等问题；关注移动端体验与页面加载性能，向研发提出清晰的优化需求并跟进验证。\n6. 优质外链与品牌曝光\n拓展相关行业网站、本地媒体、垂直社区及合作伙伴的内容合作机会，开展资源收录、专题合作和优质外链建设，增加品牌在相关搜索场景中的曝光，并持续评估来源质量和引流效果。\n7. 数据监测与流量转化优化\n使用 Google Search Console、GA4 等工具，跟踪搜索曝光、点击率、关键词表现、自然访问及注册等转化数据，定位高潜力页面和流失环节，与产品及内容团队协作优化落地页、行动入口和转化路径。\n8. 持续迭代与工作流程建设\n建立关键词跟踪、内容更新、技术巡检和效果复盘机制，关注搜索规则与搜索结果形式的变化，及时调整优化策略；合理使用 AI 工具辅助调研、内容提纲和信息整理，并对内容准确性、原创价值及本地化质量负责。\n▍ 任职要求\n• 有 SEO 或网站自然流量运营经验，能够独立推进关键词研究、站内优化、内容建设和效果复盘，并说明本人在项目中的具体贡献。\n• 熟悉 Google 搜索的基本工作逻辑，理解搜索意图、抓取、收录、索引及排名优化之间的关系。\n• 熟练使用 Google Search Console、GA4，掌握 Ahrefs、Semrush 或同类工具中的至少一种，能够开展关键词、竞品和流量分析。\n• 具备良好的英文读写能力，能够独立进行英文关键词研究、内容提纲撰写和基础内容审核，理解面向英国、欧洲用户的本地化表达。\n• 了解 HTML、网站结构及常见 CMS 的基本原理，能够识别常见 SEO 问题，并与研发团队沟通技术优化需求。\n• 具备数据分析和业务转化意识，能够将搜索表现与注册、下载、咨询或付费等业务结果结合，判断工作的实际价值。\n• 自驱力和执行力强，能够在初创阶段自主安排优先级，持续推进内容与网站优化，并使用 AI 工具提高效率。\n▍ 加分项\n• 有英国、欧洲市场或英文、多语言网站的 SEO 项目经验。\n• 有社交、本地生活、论坛社区、短剧或其他内容型网站的自然流量增长经验。\n• 熟悉结构化数据、页面性能分析、多语言 SEO，或大量内容页面的模板与索引管理。\n• 有海外内容合作资源，或具备基础脚本、自动化报表及 SEO 工作流程搭建能力。", "cat": "运营"}, {"id": "307", "title": "运营专员（视频剪辑专员）", "salary": "6k-10k", "location": "未明确", "jd": "视频剪辑专员\n岗位职责\n\n1、根据平台内容定位、更新策略及用户需求，自主收集、筛选并整理相应的成人类视频资源。\n2、负责视频素材的剪辑、裁切、转码、画面调整、水印添加及基础包装，确保成片符合平台发布标准。\n3、使用 Photoshop 独立完成视频封面制作，包括素材处理、人物排版、标题设计及整体视觉优化。\n4、根据视频内容编写标题、简介等相关文案，准确匹配分类及标签。\n5、熟悉成人视频内容体系，能够准确判断不同题材、演员、剧情、场景及内容特征，避免分类和标签错误。\n6、结合平台数据、用户偏好及行业热点，持续优化选片、剪辑、封面和内容发布方向。\n7、按照平台要求完成视频质量检查，重点检查清晰度、音画同步、画面比例、水印、黑帧及内容完整性。\n8、负责素材归档、文件命名及资源管理，建立清晰、可追溯的视频素材库。\n9、配合内容运营团队完成视频批量处理、上传发布、内容调整及其他相关工作。\n10、遵守平台内容规范、版权要求及审核机制，及时处理不符合标准的素材。\n\n岗位要求\n1、具备视频剪辑相关经验，有成人内容平台、影视平台或短视频平台工作经验者优先。\n2、熟练使用 Premiere Pro、剪映等剪辑软件，能够独立完成完整的视频处理流程。\n3、熟悉 Photoshop，能够独立制作视频封面，并具备一定的排版、配色和视觉审美能力。\n4、能够接受成人内容工作环境，对成人类视频具备一定的理解和判断能力。\n5、熟悉常见成人视频题材、分类及标签，能够准确完成内容归类和标签匹配。\n6、具备较强的资源收集、筛选及整理能力，能够根据平台更新策略主动寻找合适内容。\n7、了解常见视频格式、分辨率、码率及画面比例，具备基础的视频质量判断能力。\n8、工作认真细致，具备较强的执行力、责任心及时间管理能力，能够按要求完成每日任务。\n9、具备良好的团队协作意识，能够及时沟通素材、剪辑及内容发布过程中出现的问题。\n\n加分项\n1、有成人视频、影视、短视频或内容平台剪辑经验。\n2、熟悉主流成人内容网站、资源渠道及行业热门内容趋势。\n3、了解 FFmpeg 或其他批量视频处理工具。\n4、具备批量剪辑、批量转码、批量加水印或自动化处理经验。\n5、有独立搭建素材库、分类体系或视频处理 SOP 的经验。\n6、具备较强的热点判断能力，能够根据用户偏好快速调整选片方向。\n7、有 AI 工作流使用经验，能够运用 ChatGPT、Claude、Gemini 等工具辅助资源整理、标题文案、分类标签、封面设计及批量视频处理；有相关自动化流程搭建经验者优先。\n8、有 Telegram（TG）频道运营经验，熟悉频道内容发布、资源整理、用户维护及基础数据统计者优先。\n\n我们希望你具备\n1、能够根据平台更新策略主动收集和筛选资源，而不仅是等待分配素材。\n2、能够独立完成从资源筛选、视频剪辑、封面制作到分类标签填写的完整流程。\n3、对成人内容分类和用户偏好有一定敏感度，能够准确判断视频的核心特点。\n4、具备基础审美和质量意识，能够持续优化画面、封面及内容呈现效果。\n5、能够在保证质量的前提下提高工作效率，按时完成批量内容生产任务。\n6、保持学习意识，持续关注行业趋势、剪辑方法、AI 工具及平台内容变化。", "cat": "内容"}, {"id": "308", "title": "产品经理（中高级/高级 · 数据增长方向）", "salary": "20k-35k", "location": "未明确", "jd": "岗位：产品经理（中高级/高级 · 流量方向）｜HC 1\n\n岗位职责\n1、负责内容流量类 Web 产品矩阵（漫画、视频、资讯等多站点）核心模块的规划与迭代，对自然流量增长、搜索收录与排名、用户留存及广告变现等核心指标负责。\n2、主导 SEO 类需求的产品化落地：站内结构与页面模板优化、聚合页与内链体系、收录与状态码治理等，与 SEO 团队协作制定并推进增长方案。\n3、参与广告变现体系设计与迭代：广告版位规划与配置、变现效率优化，兼顾用户体验与收益平衡。\n4、基于数据分析、用户行为与竞品洞察，挖掘流量增长与商业化机会，推动产品创新。\n5、搭建产品关键指标体系，通过漏斗分析、A/B 测试及分层运营持续优化转化与留存。\n6、独立负责需求全流程：需求梳理、原型设计、评审排期、测试验收、上线复盘，多产品线并行推进。\n7、跨团队（研发、设计、SEO、运营、商业化）协同推动项目高质量落地，对产品经营结果负责，定期复盘并制定增长策略。\n\n任职要求\n1、本科及以上学历，3 年以上互联网 C 端产品经验；5 年以上且有独立带线经验者按高级评估。\n2、具备完整产品生命周期管理经验，独立负责或主导过日活 10 万以上量级的 Web/内容类 C 端产品，并取得可量化的流量增长、留存或商业化成果；主导过日活 30 万以上产品且有完整增长案例者优先。\n3、产品背景不限于内容站，资讯、漫画、视频、工具导航、社区等以自然流量为主的 to C 产品经验均可。\n4、熟悉 SEO 与自然流量增长机制（收录、排名、站内结构、内容聚合、多站点矩阵），有可验证的实操成功案例者优先。\n5、理解广告变现模式（展示广告、联盟、直客版位）及会员订阅、增值服务等付费场景设计。\n6、数据驱动，熟练运用数据分析、A/B 测试与漏斗模型发现问题、验证假设并指导决策；逻辑清晰，结构化思维能力强。\n7、具备出色的 0-1 落地与实操能力，原型与需求文档功底扎实，入职一周内可独立接手需求，即到即战。\n8、能适应多产品线并行的工作节奏，兼具单线深耕与多项目统筹、优先级管理能力；工作时间可配合覆盖平日晚间及周六时段。\n9、工作效率高，具备较强的创业精神与业务推动力，能在快速变化、资源有限的环境下持续创造价值。\n10、熟悉简中互联网内容生态与用户心智；对站群运营、程序化 SEO、AI 辅助内容生产等方向有理解者优先。", "cat": "产品"}, {"id": "309", "title": "AI内容编辑（AI短剧编剧）", "salary": "12K–15K", "location": "未明确", "jd": "AI短剧编剧（AI Screenwriter）\n\n岗位职责\n负责 AI 漫剧项目的世界观设定、人物设定、剧情开发及系列化内容策划；\n独立完成故事梗概（Logline）、故事简介（Synopsis）、分集大纲（Episode Outline）、场次设计（Scene Breakdown）及完整剧本创作；\n建立人物弧光（Character Arc）、剧情弧线（Story Arc）及人物关系网，保证长线剧情逻辑统一；\n完成剧情节拍（Beat）、戏剧冲突、情绪节点、反转、悬念、集尾钩子及付费点设计；\n控制信息释放节奏、剧情密度及人物动机，提高用户留存率及完播率；\n与导演共同开展故事板开发（Storyboard Workshop），参与剧本可视化设计及场次拆分；\n根据项目数据持续优化剧情结构、对白节奏及角色塑造。\n\n任职要求\n具备完整的商业剧本开发能力，能够独立完成故事梗概、剧情架构、分集大纲、场次拆分及系列剧本创作，并建立完整的人物弧光、剧情弧线及人物关系体系。\n熟悉三幕式、五幕式等经典叙事结构，能够合理设计剧情节拍、戏剧冲突、人物动机、剧情反转及集尾悬念，在保证故事逻辑的同时兼顾商业化节奏。\n具备较强的角色塑造能力，能够通过对白、行为及剧情推进体现人物成长，并根据导演及制作需求持续优化剧本内容。\n熟悉短剧、动画、漫画或影视剧创作流程，对系列化 IP 开发及长线剧情设计有一定理解，有实际作品者优先。\n\n加分项\n有动画、漫画、短剧、影视剧本创作经验；\n熟悉 AI 辅助编剧工作流；\n有商业化内容创作经验或爆款作品。", "cat": "AI / AIGC"}, {"id": "310", "title": "AI内容编辑（AI短剧导演）", "salary": "15K–18K", "location": "未明确", "jd": "AI短剧导演\n\n岗位职责\n根据剧本完成故事板设计及镜头语言设计；\n与编剧共同进行故事板开发，完成剧本可视化；\n输出故事板、镜头表、机位设计、景别设计及镜头调度方案；\n制定人物调度、演员调度、场面调度及镜头运动方案；\n控制画面节奏、叙事节奏、情绪节奏及视觉重心；\n指导 AI 视频制作完成镜头落地，并进行镜头审核；\n完成精剪，优化节奏、转场、蒙太奇关系及镜头衔接；\n对整集内容的视觉表达及最终成片质量负责。\n\n任职要求\n能够独立完成剧本可视化，根据剧本输出专业故事板、镜头表及导演阐述，并具备完整的镜头设计能力。\n熟悉镜头语言、场面调度、人物调度、景别设计及镜头运动设计，能够合理运用构图法则、轴线原则、连续性剪辑及蒙太奇等影视语言完成视觉叙事。\n具备较强的画面节奏控制能力，能够根据剧情调整镜头节奏、情绪节奏及视觉重心，并完成成片精剪及最终质量把控。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro，具有动画、短剧、影视或 AI 内容导演经验者优先。", "cat": "AI / AIGC"}, {"id": "311", "title": "AI内容编辑（AI视频制作）", "salary": "15K–18K", "location": "未明确", "jd": "AI视频制作（AI Production Artist）\n\n岗位职责\n\n根据导演输出的故事板及镜头表完成 AI 内容生产；\n建立角色一致性（Character Consistency）、场景一致性（Environment Consistency）及数字资产库（Asset Library）；\n完成角色生成、场景生成、图生视频、镜头动画及素材制作；\n搭建并优化 AI 制作工作流，包括提示词工程、参考图控制、节点式工作流及模型调用；\n完成视频粗剪（Rough Cut）、字幕、配音、音效及初版包装；\n配合导演完成修改意见，输出最终交付版本。\n\n任职要求\n熟悉 AI 内容生产流程，能够根据故事板独立完成角色生成、场景生成、图生视频及整集内容制作，并保证角色一致性、场景一致性及整体视觉风格统一。\n熟悉提示词工程、参考图控制、节点式工作流及 AI 工作流搭建，能够根据项目需求优化生成效率及画面质量。\n能够独立完成素材整理、粗剪、字幕、音效、基础包装等后期制作，并具备一定的问题排查及工作流优化能力。\n熟悉 ComfyUI、Flux、Midjourney、Runway、Veo、Kling、Seedance 等 AI 工具中的一种或多种，有完整 AI 短剧、AI 动画或 AI 漫剧制作经验者优先。\n\n熟悉以下 AI 工具（至少部分）\nComfyUI，Flux，Midjourney，Stable Diffusion，Veo，Kling，Seedance，Runway，Pika，Luma\n\n熟练使用Premiere Pro，DaVinci Resolve或其他非线软件", "cat": "AI / AIGC"}, {"id": "312", "title": "AI内容编辑（AI短剧后期剪辑师）", "salary": "12K–18K", "location": "未明确", "jd": "AI短剧后期剪辑师\n\n岗位职责\n负责 AI 漫剧项目的后期制作，根据导演完成的精剪版本进行成片精修，在不改变导演叙事意图的前提下，进一步优化剪辑点、动作衔接、视听连续性及整体完成度；\n负责对白、配音、环境声、拟音、音效及音乐的声音编辑与混音处理，根据剧情节拍建立完整的声音层次、情绪推进及视听节奏；\n负责 AI 生成素材的后期修整，处理生成镜头中常见的跳帧、闪烁、动作断裂、时序不连续、画面抖动及镜头衔接问题，并通过变速、补帧、遮罩、跟踪、合成等方式提高镜头可用性；\n根据项目视觉规范完成基础调色、镜头匹配、曝光及色彩统一，保证不同模型、不同批次生成素材之间的视觉连续性；\n负责字幕、片头片尾、基础动效、转场及项目包装，并按照平台技术规范完成母版输出、版本管理及最终交付；\n与导演共同完成终剪审核，根据修改意见完成后期调整，对成片的技术质量、声音质量及最终包装完成度负责。\n\n任职要求\n具备完整的影视后期制作能力，能够理解导演的剪辑意图和叙事节奏，熟悉连续性剪辑、动作匹配、视线匹配、节奏剪辑、平行蒙太奇、交叉剪辑等剪辑逻辑，能够判断一个剪辑点成立的叙事原因，而不是单纯按照音乐节拍拼接素材。\n具备较强的声音设计意识，能够完成对白编辑、降噪、响度控制、环境声铺设、拟音、音效设计及音乐编辑，并能够利用声音桥、声画对位、声画同步等方式强化场景空间感、情绪及戏剧节奏。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro 中至少一种专业非线性剪辑软件；能够完成基础调色、遮罩、跟踪、变速、关键帧及简单合成。熟悉 After Effects、Fusion、Audition 等后期工具者优先。\n需要理解 AI 生成视频的素材特性，能够识别并处理人物动作连续性、口型同步、画面闪烁、时序一致性、角色漂移、背景形变等常见问题。有 AI 漫剧、动画、短剧、影视后期或商业内容制作经验者优先。\n不接受仅会使用剪映套模板、自动字幕、卡点及预设转场，但缺乏影视剪辑逻辑和声音设计能力的候选人。\n作品要求\n面试需提供至少一部能够体现完整后期能力的作品，并说明本人具体负责的工作范围。\n作品审核重点关注：叙事节奏、剪辑点选择、动作连续性、声音设计、音乐使用、镜头匹配及整体完成度，不以单纯的特效数量或包装复杂程度作为评价标准。", "cat": "AI / AIGC"}, {"id": "313", "title": "AI内容编辑（网络小说作家）", "salary": "8K–14K", "location": "未明确", "jd": "网络小说作家\n\n岗位职责\n负责 AI 短剧项目的前期 IP 内容开发，根据项目方向完成题材调研、内容策划及小说改编工作；\n深度研究网络文学市场，持续分析热门题材、爆款作品及用户阅读偏好，总结不同题材的核心爽点、人物关系、剧情节奏及商业化规律；\n根据项目需求，对指定题材或已有内容进行二次创作、剧情扩写、结构重组及人物深化，形成适合影视开发的小说版本；\n建立完整的世界观设定、人物关系网、人物成长线及剧情主线，保证长线剧情逻辑统一；\n完成剧情节拍设计、情绪推进、反转、悬念、高潮、集尾钩子等商业化内容设计，提高内容吸引力及持续阅读体验；\n输出完整的小说开发稿，包括人物设定、世界观设定、故事简介、章节内容及完整小说版本，并交付编剧进行剧本开发；\n持续建立公司 IP 储备库，沉淀原创故事、人物设定及可持续开发的内容资产。\n\n任职要求\n深度阅读网络文学，熟悉男频、女频、都市、悬疑、玄幻、仙侠、系统、重生、无限流、恋爱、校园等主流题材，能够准确分析作品爆点及商业价值。\n具备成熟的长篇小说创作能力，能够围绕人物成长、剧情推进及情绪节奏完成剧情扩写、人物深化及系列化内容开发，保证故事具有持续吸引力。\n熟悉网络文学创作规律，能够设计爽点、打脸、升级、反转、修罗场、悬念、人物成长及章节留钩，并理解不同平台读者的阅读偏好。\n具有优秀的文字驾驭能力，能够独立完成中长篇小说创作，有签约网络小说作者、责编、内容编辑或成熟创作经验者优先。\n能够熟练使用 AI 辅助创作工具进行资料整理、世界观整理及内容辅助创作，但具备独立完成原创及改编内容开发的能力。\n\n优先考虑\n有签约网络小说作者经历；\n有百万字以上完结作品；\n有短剧、漫画、动漫、游戏剧情创作经验；\n有 IP 改编或影视化开发经验。", "cat": "AI / AIGC"}, {"id": "314", "title": "数据工程师（数据采集方向）", "salary": "20K-35K", "location": "未明确", "jd": "岗位职责\n1. 负责小说、漫画、视频网站等内容平台的数据采集系统设计、开发与维护。\n2. 负责多源站点的数据抓取、解析、清洗、去重、入库与质量校验，保障数据稳定、完整、及时。\n3. 设计高可用、高并发、可扩展的爬虫架构，支持任务调度、代理池、失败重试、限速控制、监控告警等能力。\n4. 针对复杂页面、动态渲染、登录态、风控策略等场景，制定稳定、合规、可持续的采集方案。\n5. 结合 AI 编程工具提升研发效率，包括代码生成、脚本开发、数据解析规则生成、异常定位、测试用例生成等。\n6. 负责采集链路性能优化，包括抓取效率、资源消耗、存储结构、任务吞吐与异常恢复能力。\n7. 与产品、内容、后端团队协作，支撑小说、漫画、视频等业务数据的搜索、推荐、聚合、更新与运营需求。\n8. 建立爬虫工程规范，包括代码规范、数据校验规范、异常处理规范、监控与日志规范。\n\n岗位要求\n1. 5 年以上后端或爬虫系统开发经验，至少 2 年以上复杂爬虫架构设计经验。\n2. 熟练掌握 PHP、Go、Python，具备线上高并发服务或大规模任务系统开发经验。\n3. 熟悉 Python 爬虫生态，如 Requests、httpx、aiohttp、Scrapy、BeautifulSoup、lxml、Playwright、Selenium 等。\n4. 熟悉 HTTP/HTTPS、Cookie、Session、Token、Headers、Referer、CORS、WebSocket 等网络协议与机制。\n5. 熟悉 HTML、CSS、XPath、正则、JSON、DOM 解析，能够处理多种网页结构与接口数据。\n6. 熟悉小说、漫画、视频类站点的数据结构特点，如章节、图片资源、播放源、剧集、清晰度、字幕、封面、标签、作者、更新状态等。\n7. 熟悉 MySQL、Redis、MongoDB、Elasticsearch 等常见存储或检索组件，有大数据量处理经验。\n8. 熟悉任务队列、定时任务、分布式调度、消息队列等机制，如 Redis Queue、RabbitMQ、Kafka、NSQ 等。\n9. 熟悉反爬与风控常见机制，具备代理池、UA 池、请求签名分析、动态参数解析、JS 渲染处理等实践经验。\n10. 熟练使用 AI 编程工具，如 ChatGPT、Claude、Cursor、GitHub Copilot、Codex 等，能结合业务场景提升开发、调试和文档产出效率。\n11. 熟悉 Linux 环境，具备 Shell 脚本、日志分析、服务部署、性能排查能力。\n12. 具备良好的工程质量意识，能够编写可维护、可监控、可回滚的生产级代码。\n\n加分项\n1. 有小说、漫画、短视频、长视频、影视聚合、内容搜索、资源站采集相关项目经验优先。\n2. 有 Go 高并发爬虫框架、PHP 业务后台、Python 分布式采集系统建设经验优先。\n3. 熟悉 Playwright、Puppeteer、Selenium、Chrome DevTools Protocol 等浏览器自动化工具优先。\n4. 熟悉 FFmpeg、M3U8、HLS、MP4、图片切片、视频播放源解析等音视频相关技术优先。\n5. 有大规模代理池、账号池、验证码识别、分布式采集节点管理经验优先。\n6. 有数据质量监控、内容去重、相似度识别、增量更新策略设计经验优先。\n7. 有 AI Agent、自动化代码生成、Prompt Engineering、RAG、LLM API 调用或 MCP 工具链使用经验优先。\n8. 有利用 AI 辅助爬虫规则生成、网页结构分析、异常日志归因、数据清洗策略生成经验优先。\n\n任职素质\n1. 对技术细节敏感，具备较强的问题定位和逆向分析能力。\n2. 有较强的系统性思维，能从稳定性、扩展性、成本和风险角度设计方案。\n3. 对新技术保持关注，能主动使用 AI 工具提升个人和团队研发效率。\n4. 责任心强，能保障核心数据链路稳定运行。\n5. 具备良好的沟通能力，能和产品、后端、运维、内容团队高效协作。", "cat": "技术 / 数据"}, {"id": "315", "title": "运营专员（数据分析师）", "salary": "15K-20k", "location": "未明确", "jd": "岗位职责:\n1、负责公司旗下各App、网站产品的运营数据支持，包括日/周/月报的撰写与输出。\n2、及时发现并排查数据异常波动，并输出异常分析与处理建议。\n3、响应业务方提出的临时数据需求，帮助解决指标口径、数据提取、数据解读等问题。\n4、针对业务痛点开展专题分析，输出有洞察力的分析报告，辅助决策落地。\n5、参与数据治理相关工作，包括埋点需求评审与验收、数据质量监控及后台数据产品需求的提出与跟进。\n6、与产品、运营、开发等团队保持紧密沟通，识别业务中的增长机会、留存风险与异动原因，为业务迭代提供数据建议。\n\n任职要求：\n基本要求\n1、本科及以上学历，统计学、数学、计算机、信息管理或相关专业优先。\n2、三年以上数据分析相关工作经验，有移动端App或互联网运营分析经验者优先。\n3、熟练使用SQL，能够独立完成数据提取与多表关联查询；熟悉Python、R中的至少一种分析工具。\n4、熟悉常用数据分析方法，掌握留存分析、漏斗分析、同期群分析、转化归因等常用分析框架。\n5、具备良好的数据可视化能力，熟练使用Excel、BI工具（如Tableau、Power BI、DataEase等）或Python可视化库。\n6、具备较强的逻辑思维和业务理解能力，能够从数据中发现真实业务问题并给出可落地建议。\n7、具备良好的口头与书面表达能力，能清晰地向业务负责人和跨团队伙伴解释数据结论与分析逻辑。\n\n加分项\n有内容类、社交类、网站类的数据分析经验。\n有指标体系搭建或数据看板建设经验。\n能适应快节奏业务，有较强的自驱力和多任务并行处理能力。", "cat": "技术 / 数据"}, {"id": "316", "title": "运营专员 (新媒体运营)", "salary": "10k-15k", "location": "未明确", "jd": "新媒体运营招聘JD\n1. 岗位目标\n独立负责国内及海外新媒体矩阵账号，从账号定位、素材判断、内容发布、达人合作到数据复盘形\n成完整闭环，并围绕产品UV、转化效率和获客成本持续优化结果\n2. 岗位职责\n1. 矩阵账号运营：独立负责多个账号的定位、搭建、内容规划、发布节奏、日常维护和阶段复\n盘，不是只参与单个账号的局部执行。\n2. 素材判断与优化：从内容池中判断具有爆款潜力的素材，结合平台机制、用户偏好和产品\n目标完成选题、改编、测试和复用。\n3. 国内外平台运营：根据不同平台的分发机制和公域流量特点调整内容，覆盖国内平台及至\n少两个海外平台。\n4. 达人合作：独立完成达人筛选、沟通、合作Brief撰写、脚本审核、视频内容验收、修改反馈\n和合作落地。\n5. 数据跟踪与复盘：持续跟踪浏览、点击或PV、产品UV、转化率和用户成本，能根据数据判\n断继续放大、调整或停止。\n6. 跨部门协作：与产品及相关团队确认推广链接可访问、数据可归因，并按推广结果推动素\n材、账号和合作方式调整。\n\n\n3. 任职要求\n\n总工作经验不少于3年；其中新媒体相关经验不少于1年，2C业务经验不少于2年。\n必须独立负责过矩阵账号运营，能够清楚说明账号数量、本人责任、运营周期、执行动作及\n最终数据结果。\n国内平台做过抖音、B站、小红书或视频号中的一种或多种。\n海外平台至少做过TikTok、YouTube、X、Instagram中的两个；有X和TikTok实操经验优先。\n网感好，能够判断什么内容具备爆款潜力，并能解释判断依据、测试方式和结果，而不是\n只凭个人感觉。\n理解不同平台的基础机制、公域流量分发方式和目标用户偏好，能够针对平台调整内容。\n有独立达人合作经验，能完成合作Brief、脚本及视频审核、沟通修改、验收和效果跟踪。\n具备数据意识，能从曝光、点击或PV、产品UV、转化率和获客成本判断问题所在。4. 加分项\n\n加分项\n自带可直接对接的KOL或达人资源。\n有X、TikTok矩阵从0到1搭建及规模化运营案例。\n有通过素材测试、账号匹配或达人合作降低获客成本的明确案例。\n能独立完成脚本、Brief、数据复盘或基础可视化报告。\n\n5. 面试前需提供的证明材料\n本人实际参与并负责的相关作品，不要求提供账号登录信息。\n至少一个矩阵账号案例，说明平台、账号数量、运营周期、本人职责和结果。\n可核验的数据结果，例如浏览、涨粉、点击、转化、产品UV、获客成本或达人合作效果。\n达人合作案例中的Brief、脚本、审核反馈或结果复盘，可对敏感信息做脱敏处理。\n\n6. 筛选标准\n简历初筛必须同时满足\n总工作经验≥3年，新媒体经验≥1年。\n明确写出独立负责矩阵账号，而不是只写“参与运营”或“协助发布”\n。\n具备国内平台经验，并具备至少两个海外平台经验。\n能够提供作品和数据结果，且能说明本人在结果中的实际责任。\n达人合作经历必须包含Brief、内容审核、沟通修改和验收，不只做资源转交或商务联系。", "cat": "运营"}, {"id": "317", "title": "运营专员（内容运营专员（AI动漫 / AI漫剧方向）", "salary": "12k-18k", "location": "未明确", "jd": "招聘岗位：内容运营专员（AI动漫 / AI漫剧方向）\n\n岗位类型： 全职\n\n一、岗位职责\n\n1. 网站内容运营与日常维护\n\n负责 AI动漫、AI漫剧、漫画等相关内容的搜集、整理、分类、编辑和发布。\n根据网站定位规划内容分类、题材标签及内容展示。\n跟进内容更新，检查页面展示、链接及内容信息，保证网站内容正常维护。\n根据用户需求和内容热度，持续优化内容结构和浏览体验。\n\n2. 社交媒体运营与内容发布\n\n负责 Telegram（TG）、Twitter（X）等社交平台的日常运营。\n定期发布作品推荐、内容介绍、宣传文案及活动信息。\n根据不同平台的特点调整内容形式，提高曝光、互动和用户访问。\n跟进评论、反馈及社群情况，整理用户需求。\n\n3. 内容策划与宣传素材制作\n\n围绕 AI动漫、AI漫剧及热门题材策划宣传内容。\n制作作品推荐、专题介绍、热点话题及推广素材。\n配合项目推广需求，完成基础图片处理、视频剪辑、封面制作等工作。\n根据推广效果持续调整内容形式和宣传方向。\n\n4. 文案撰写与内容优化\n\n独立撰写网站简介、作品介绍、推广文案、社交媒体帖子及软植入内容。\n优化标题、简介、关键词及内容表达，提高点击率和阅读体验。\n根据不同推广渠道调整文案风格，确保内容清晰、有吸引力。\n\n5. 数据跟踪与运营复盘\n\n定期整理网站访问、内容浏览、社交媒体互动及渠道引流等数据。\n分析不同内容和推广渠道的表现，找出有效的运营方式。\n根据数据反馈优化内容选题、发布频率及推广策略。\n\n6 竞品调研与选题规划\n\n关注 AI动漫、AI漫剧、漫画及相关内容平台的动态。\n收集竞品的内容分类、热门题材、页面布局和推广方式。\n整理可参考的运营思路，并结合项目实际情况提出优化建议。\n二、任职要求\n有 1 年以上内容运营、新媒体运营或网站运营经验，能够独立运营网站或社交媒体账号者优先。\n对成人向漫画、动漫及相关内容有一定了解，有相关行业经验者优先。\n具备良好的文字表达能力，能够独立完成内容编辑、作品介绍、推广文案及软植入。\n具备基础图片处理和视频剪辑能力，熟悉 Photoshop（PS）、Premiere（PR）等工具。\n了解 Telegram（TG）、Twitter（X）等平台的内容发布及运营方式。\n具备较强的执行力、责任心和沟通能力，能够按照项目计划推进工作。\n具备信息搜集、竞品分析和内容整理能力，能够根据实际效果持续优化运营工作。\n能适应内容更新和推广节奏，按时完成日常运营任务。\n三、加分条件\n有 TG、Twitter（X）账号或社群的实际运营经验。\n有成人向漫画、AI动漫、AI漫剧或漫画网站的运营经验。\n了解 SEO、关键词布局、外链建设及网站流量增长。\n有内容营销、软植入、社群推广或外部渠道引流经验。\n能独立策划宣传主题，并完成文案、图片、视频等推广素材。\n有网站用户增长、留存、转化或数据分析经验。\n使用过 AI 图片生成、AI 视频制作或其他 AI 内容创作工具。\n四、我们希望你具备的能力\n内容判断力： 能识别值得推广的作品和热门题材。\n执行能力： 能独立完成内容搜集、编辑、发布及推广工作。\n运营思维： 不只完成发布任务，也会思考如何提升曝光和引流效果。\n优化意识： 能根据数据和用户反馈持续调整内容与推广方式。\n主动性： 遇到问题能主动沟通，并提出可执行的解决方案。\n五、投递要求\n\n请在简历中尽量提供以下材料：\n\n过往运营过的网站、TG 频道、Twitter（X）账号或其他社交媒体账号。\n个人撰写的推广文案、作品介绍或软植入案例。\n图片设计、视频剪辑或宣传素材作品。\nSEO 优化、外部引流、流量增长等相关案例（如有）。\n简单说明你在过往项目中负责的工作，以及取得的实际效果。\n\n有实际运营案例者优先。", "cat": "AI / AIGC"}, {"id": "318", "title": "运营专员（中级运营／交友类）", "salary": "12k-18k", "location": "未明确", "jd": "# 运营专员（中级运营/交友类）\n\n## 岗位职责\n\n1. 平台日常运营： 负责平台日常运营工作，包括内容更新、商品上架、推荐置顶、活动执行、用户反馈处理及运营异常跟进，确保日常运营工作有序开展，提升平台运营效率与用户体验；\n\n2. 内容运营与推广： 负责平台内容的筛选、整理、发布及优化，结合产品定位制定内容运营方案，通过 TG、X 等线上渠道开展内容分发与推广，提升内容曝光、用户触达及平台影响力；\n\n3. 用户增长与留存： 围绕用户新增、活跃、留存及付费转化等目标，执行拉新、促活、用户召回及社群活动，持续优化运营策略，提升用户参与度与用户价值；\n\n4. 数据监控与复盘： 跟进新增、日活、充值、留存及复费率等核心运营指标，完成数据统计、日报周报及业务复盘，及时发现运营问题，提出可执行的优化建议；\n\n5. 产品协同与项目推进： 收集整理用户反馈及业务需求，对接产品、研发推进功能优化、问题修复及版本迭代，跟进 AI 短剧等新产品的开发进度、内容配置、上线准备及运营推广，确保相关事项按计划推进；\n\n6. 渠道拓展与合作维护： 拓展并维护线上推广渠道、内容合作方及社群资源，探索有效的流量获取和用户转化方式，跟踪渠道效果，持续优化推广质量与运营投入产出。\n\n## 任职要求\n\n1. 具备平台运营、内容运营、用户运营、社群运营或新媒体运营相关经验，有实际运营成果者优先；\n\n2. 熟悉 TG、X 或其他线上内容推广渠道，能够独立完成内容发布、活动执行、用户维护及日常运营任务；\n\n3. 具备一定的数据分析能力，能够根据新增、活跃、充值、留存等指标判断运营效果，并制定相应的优化措施；\n\n4. 具备良好的沟通协调能力、执行力及问题解决能力，能够主动跟进业务事项，推动问题处理与结果闭环；\n\n5. 工作认真负责，具备较强的学习能力、抗压能力和目标意识，能够适应多任务并行的工作节奏；\n\n6. 具备良好的团队协作意识，能够配合产品、研发及其他业务岗位推进项目落地。\n\n## 加分条件\n\n1. 有社交平台、视频平台、短剧平台或互联网内容产品运营经验；\n\n2. 有 TG 社群运营、私域流量运营、线上推广、用户增长或活动策划经验；\n\n3. 有 AI 短剧、AI 视频内容运营、新产品上线或产品迭代跟进经验；\n\n4. 熟悉运营数据报表、数据看板及自动化工具，能够通过工具提升工作效率；\n\n5. 拥有稳定的内容资源、推广渠道或社群资源，能够快速开展业务并取得实际成果；\n\n6. 有运营流程优化、跨部门项目推进或团队协作管理经验。\n\n岗位目标： 通过日常运营、内容建设、用户增长、数据复盘及产品协同，持续提升平台活跃度、用户留存、付费转化与整体运营效率。", "cat": "运营"}, {"id": "319", "title": "编辑专员（资讯编辑（热点事件方向）", "salary": "8k-10k", "location": "未明确", "jd": "岗位：资讯编辑（热点事件）全职\n\n岗位职责\n\n1. 热点事件跟踪还原撰写\n实时紧盯全网社会热点、突发事件，跟进事件完整发展脉络；能够细致描写事件现场环境、地点场景、人物状态，梳理事件起因、经过、后续衍生进展，产出完整资讯稿件，把事件全貌清晰完整呈现出来。\n\n2. 信息搜集、事实整理与稿件产出\n多渠道搜集事件线索、各方信息，甄别信息真伪，整合多方消息源；独立完成快讯、事件长文、热点专题撰写编辑，打磨叙事逻辑、细节描写、标题，保障稿件时效性。\n\n3. 内容编辑、校对与发布\n完成稿件校对、内容排版，把控内容细节；跟进热点后续发酵，更新事件动态，迭代稿件内容，维护热点专题。\n\n4. 热点复盘与选题沉淀\n跟踪稿件阅读、互动数据，复盘热点传播逻辑，沉淀选题经验；日常挖掘潜在热点线索，策划后续资讯选题。\n\n任职要求\n\n1. 有资讯、新媒体、文娱社会热点编辑/采编相关实操经验，做过热点事件跟进、事件稿件撰写的从业者优先，简历务必附带过往热点稿件作品链接；\n\n2. 网感强，热点嗅觉敏锐，擅长场景、地点、事件细节描写，叙事能力强，可以把复杂事件梳理成条理清晰的可读文稿；\n\n3. 信息甄别能力强，会多方核对消息源，逻辑清晰，文字功底扎实，熟悉新媒体稿件表达；\n\n4. 抗压能力强，突发事件来了可以快速响应，能接受热点突发加班，执行力高；\n\n5. 关注互联网各类社会、文娱热点，长期刷各类资讯平台，熟悉网络热点传播逻辑。\n\n加分条件\n\n✅有瓜站、八卦资讯号、社会新闻媒体、自媒体编辑从业经历优先\n✅独立跟进过大型全网热点事件，产出过传播量较高事件稿件\n✅具备基础素材检索、信息溯源能力，擅长整理时间线、事件梳理\n\n我们提供\n\n• 有竞争力底薪+绩效奖金，稿件流量绩效激励\n\n• 团队扁平化，响应热点节奏快，给到充分内容创作空间\n\n• 完整内容素材支持，团队协同处理突发热点\n投递请附上：过往热点事件稿件作品，无作品勿投！", "cat": "其他"}, {"id": "320", "title": "SEO 专员", "salary": "20k-30k", "location": "未明确", "jd": "岗位职责：\n1、负责公司网站及内容矩阵的 SEO 增长策略制定与落地，围绕业务目标持续提升自然搜索流量、收录、关键词排名及转化效果。\n2、独立负责多个网站（品牌站、内容站、专题站、多语言站）的整体 SEO 运营，包括站点规划、架构优化、内容策略及增长方案制定。\n3、制定关键词策略，完成核心词、长尾词、热点词、商业词等关键词布局，并持续优化内容质量与页面排名。\n4、主导站内 SEO 优化，包括网站结构、URL、TDK、内链、聚合页、标签页、Schema、Core Web Vitals、页面体验等持续优化。\n5、建立完整的技术 SEO 规范，协同研发团队解决索引、抓取、重定向、Canonical、Sitemap、Robots、Hreflang 等技术问题。\n6、建立内容运营规范，制定内容更新机制、专题策划、AI 内容生产规范及内容质量评估体系，提高整体内容竞争力。\n7、建立外链增长体系，拓展行业媒体、Guest Post、资源合作等渠道，持续提升网站权重及品牌曝光。\n8、持续关注 Google、Bing 等搜索引擎算法变化，及时调整 SEO 策略，降低算法风险，保障网站稳定增长。\n9、 熟练使用 Google Search Console、Google Analytics 4、Ahrefs、SEMrush、Screaming Frog 等工具，对流量、收录、关键词、转化及用户行为进行数据分析。\n10、推动 SEO 自动化建设，参与 SEO 工具、数据平台及 AI 内容工具需求设计，提高运营效率。\n11、建立 SEO 数据监控体系，定期输出 SEO 分析报告、增长复盘及优化方案，为业务决策提供数据支持。\n12、负责 SEO 相关知识沉淀，制定 SOP、培训团队成员，并推动 SEO 最佳实践在团队内部落地。\n\n岗位要求\n必须项\n3 年以上 Google SEO 实战经验，至少独立负责过 1 个以上完整网站项目。\n熟悉 Google、Bing 等搜索引擎工作原理及最新排名机制。\n熟练掌握 On-page SEO、Technical SEO、Off-page SEO 及内容 SEO 等优化方法。\n熟练使用 Google Search Console、Google Analytics 4、Screaming Frog、Ahrefs 或 SEMrush 等 SEO 工具。\n熟悉网站索引、抓取、收录、关键词布局、页面优化及外链建设全流程。\n熟悉 HTML、CSS 基础知识，了解 JavaScript 对 SEO 的影响，能够与研发团队高效沟通。\n具备优秀的数据分析能力，能够根据排名、收录、流量及转化数据持续优化策略。\n熟悉 AI 工具在 SEO 场景中的应用，如内容生成、关键词分析、数据整理及自动化运营。\n加分项\n有海外网站运营经验，熟悉英语或多语言 SEO。\n有矩阵站、站群、多域名项目运营经验。\n有资讯站、内容聚合站、社区类网站运营经验。\n熟悉 Cloudflare、CDN、服务器基础配置及网站性能优化。\n熟悉 Python、SQL、Shell 等任一脚本语言，可实现 SEO 数据自动化分析。\n有独立运营个人网站、博客或副业站经验，并取得一定自然流量成果。\n熟悉 AI SEO、Programmatic SEO（程序化 SEO）、自动化内容生成等先进 SEO 技术。\n有成功将网站自然流量提升至百万级以上 PV 或显著增长案例。\n\n其他要求\n1、入职后负责制定年度及季度 SEO 增长规划，并建立完整的 KPI 指标体系（收录、关键词、流量、转化、ROI 等）。\n2、试用期（3 个月）需完成以下交付成果：\n3、网站 SEO 全面诊断报告（技术、内容、外链）\n4、6 个月 SEO 增长规划及执行方案\n5、完成至少 5 项关键技术 SEO 优化\n6、推动至少 1 个 SEO 自动化工具或流程优化上线\n7、每周输出 SEO 数据分析报告，每月完成增长复盘及下一阶段优化计划。\n8、面试需结合实际案例进行分享，重点考察网站诊断能力、技术 SEO 能力、数据分析能力及增长思维。", "cat": "运营"}, {"id": "321", "title": "AI Algorithm Engineer", "salary": "年薪20万美金内", "location": "可远程", "jd": "Responsibilities\n\n• Lead research, pre-training, optimization, and iteration of Vision Foundation Models, including Stable Diffusion, DiT, Vision Transformer (ViT), Segment Anything Model (SAM), CLIP, and other cutting-edge computer vision models.\n\n• Design and fine-tune vision models for business scenarios such as AI image generation, image editing, multimodal understanding, and intelligent visual applications.\n\n• Lead Supervised Fine-Tuning (SFT), Parameter-Efficient Fine-Tuning (PEFT), LoRA, ControlNet, Adapter tuning, and related optimization techniques.\n\n• Explore and improve generative model architectures and visual feature extraction networks to enhance image quality, stability, resolution, inference efficiency, and multimodal alignment.\n\n• Collaborate with engineering teams to deploy large-scale AI models into production and optimize inference performance through quantization, pruning, inference acceleration, memory optimization, and deployment tuning.\n\n• Continuously track the latest academic research, open-source projects, and industry trends in Computer Vision (CV), Multimodal AI, and Generative AI, rapidly transforming new technologies into business value.\n\nRequirements\n\nEducation\n• Bachelor's degree or above in Computer Science, Artificial Intelligence, Applied Mathematics, or related fields.\n\nTechnical Skills\n\n• Strong expertise in Vision Foundation Models and a deep understanding of Diffusion Models, Vision Transformers (ViT), MAE, and related architectures.\n\n• Experience participating in or leading the complete pre-training lifecycle of large-scale vision or multimodal models with hundreds of millions (or billions) of parameters.\n\n• Strong understanding of dataset construction, data cleaning, training stability, and large-scale model optimization.\n\n• Hands-on experience with AIGC technologies, including Text-to-Image, Image-to-Image, and multimodal generation.\n\n• Proficient in Python and C++, with strong experience using PyTorch and excellent source code reading and secondary development capabilities.\n\n• Familiar with distributed training frameworks such as DeepSpeed, Megatron-LM, and FSDP, with hands-on experience in multi-node, multi-GPU training and compute resource management.\n\nPreferred Qualifications\n\n• Publications in top-tier AI conferences such as CVPR, ICCV, ECCV, NeurIPS, or ICLR.\n\n• Active contributor to GitHub, Hugging Face, or other open-source AI communities.\n\n• High-ranking achievements in AI competitions such as Kaggle.\n\n• Experience with TensorRT, CUDA programming, and low-level operator optimization.\n\n• Experience with High Performance Computing (HPC) environments.", "cat": "AI / AIGC"}, {"id": "322", "title": "AI内容编辑（AI短剧编剧/ 欧美出海方向）", "salary": "面谈", "location": "未明确", "jd": "岗位职责\n1. 负责欧美出海短剧的选题策划、故事构思、人物设定及完整剧本创作；\n2. 结合欧美观众的文化背景和内容偏好，设计开篇钩子、剧情冲突、情绪爽点及付费卡点；\n3. 把控故事结构、人物关系、剧情节奏和单集信息密度，确保剧本适合短剧形式；\n4. 持续研究海外短剧平台的热门题材、爆款作品及市场趋势，输出可落地的内容方向；\n5. 根据项目数据、用户反馈及制作要求，持续优化剧本节奏和情节设置；\n6. 使用AI工具辅助完成资料调研、创意拓展、剧本分析及内容优化；\n7. 与制片、分镜、生成、剪辑及运营人员协作，推动剧本顺利进入制作环节。\n8. 交付分场清晰的单集剧本，写明场景、人物、动作、对白及情绪；配合导演调整难以生成的场景，并标明修改内容与版本。\n\n任职要求\n1. 具备短剧编剧、网络文学、影视剧本或相关内容创作经验；\n2. 具备完整的故事创作能力，能够独立完成人物设定、故事大纲、分集梗概及剧本；\n3. 熟悉强冲突、快节奏、高情绪密度的短剧创作方式；\n4. 了解欧美文化、审美偏好及内容消费习惯，对海外短剧市场有一定研究；\n5. 具备良好的英语读写能力，能够阅读英文资料、理解英文剧本；\n6. 能够熟练使用能够熟练使用ChatGPT、Claude、Grok等AI工具辅助创作\n7. 具备良好的沟通协作能力，能够根据制作要求及时调整剧本。\n\n优先考虑（加分项）\n1. 有欧美出海短剧、海外网文或ReelShort类项目经验；\n2. 有已上线短剧作品或完整项目经验；\n3. 熟悉海外短剧付费模式及卡点设计；\n4. 能够提供完整剧本、上线作品或过往项目案例。\n\n应聘资料\n请提供个人简历、完整单集剧本及人物设定，并注明个人在项目中负责的具体内容；如有制作前后修改案例，请一并提供", "cat": "AI / AIGC"}, {"id": "323", "title": "中级运营专员", "salary": "10K–20K", "location": "未明确", "jd": "岗位职责\n1. 独立负责短剧产品的内容运营与用户转化，围绕剧集上架、内容推荐、活动和付费路径制定运营动作；\n2. 根据产品目标制定阶段性运营方案，拆解关键指标并推动执行落地；\n3. 持续跟踪新增、活跃、留存、内容消费及付费等核心数据，发现问题并提出优化方案；\n4. 分析用户路径、内容结构、会员权益及付费场景，形成运营方案；涉及产品机制调整时，与产品经理共同推进；\n5. 结合市场趋势、竞品动态和用户需求，提出产品迭代及新方向建议；\n6. 协调产品、技术、设计、内容及渠道等岗位，推动需求按计划上线；\n7. 建立运营SOP、数据看板及复盘机制，提升团队执行效率；\n8. 能够独立承接项目，对项目进度、运营数据和最终结果负责。\n\n任职要求\n1. 具备3年以上互联网产品运营、内容运营或用户运营经验，有完整项目经验；\n2. 熟悉产品运营全流程，能够独立完成方案制定、执行推进及数据复盘\n3. 具备较强的数据分析能力，能够通过数据定位问题并推动业务优化；\n4. 在内容消费、留存提升或商业化转化中，至少有一项可说明本人策略、执行和结果的实际经验；\n5. 具备良好的项目管理和跨部门协作能力，能够推动复杂事项落地；\n6. 具备较强的业务判断能力，能够主动发现问题并提出解决方案；\n7. 结果导向，执行力强，能够适应项目快速调整和多任务推进；\n8. 具备团队管理、项目负责人或小组管理经验者优先。\n\n优先考虑\n1. 有视频、短剧、内容平台、社区或泛娱乐产品运营经验；\n2. 有海外产品、出海内容或海外用户运营经验；\n3. 有产品从0到1搭建、老产品优化或商业化提升经验；\n4. 熟悉AI工具，并能够应用于内容生产、数据分析及日常运营；\n5. 能够提供过往项目数据、运营案例或完整复盘材料。\n\n应聘资料\n请提供一项本人主导的运营案例，写明问题、具体动作、统计周期、前后结果及其他影响因素。", "cat": "运营"}, {"id": "324", "title": "AI内容编辑（AI短剧生成师/ 画面生成方向）", "salary": "15K–18K", "location": "未明确", "jd": "岗位定位：根据确认的分镜和视觉资产交付可供剪辑使用的镜头，重点考察剧情还原、一致性、动态质量与返修能力\n\n岗位职责\n1. 根据剧本和分镜要求，使用MiniMax、Seedance等AI工具生成短剧视频镜头；\n2. 根据确认的人物、场景和风格设定，制作镜头参考图；缺失资产及时反馈视觉设计师或导演确认；\n3. 负责图片和视频提示词设计、参数调试、任务生成及失败任务重做；\n4. 控制角色形象、服装、场景及画面风格的一致性，并保证人物动作、道具和空间关系在相邻镜头中衔接；\n5. 发现并处理角色漂移、动作异常、画面失真、镜头穿帮等问题；\n6. 根据剪辑和质检反馈完成镜头返修、补帧、重生成及素材替换；\n7. 按照项目要求完成素材命名、分类、整理及交付；镜头应完成分镜指定动作，保留剪辑所需的动作起止，关联参考图及关键参数；\n8. 记录生成数量、成功率、返修率、耗时及制作成本，配合优化生产效率；\n9. 与编剧、分镜、工作流工程师、剪辑及质检人员协作，确保项目按时交付。\n\n任职要求\n1. 熟悉MiniMax、Seedance等AI视频生成工具，具备实际生成经验；\n2. 熟悉主流AI生图工具，能够依据既定人物和场景资产制作镜头参考图；\n3. 具备较强的提示词设计和参数调试能力；\n4. 能够理解剧本和分镜，并将文字要求准确转化为可用画面；\n5. 具备基础的镜头语言、构图、光影、色彩及视觉审美能力；\n6. 具备角色一致性和画面连续性控制意识；\n7. 执行力强，能够按照标准流程完成批量化生产任务；\n8. 具备良好的沟通能力，能够快速理解修改意见并完成返修。\n\n 优先考虑\n1. 有AI短剧、AI漫剧或批量视频生成经验；\n2. 熟悉ComfyUI基础操作及常用生图工作流；\n3. 熟悉Flux、SDXL、LoRA、ControlNet等模型或技术；\n4. 具备分镜设计、剪辑或影视制作经验；\n5. 能够提供AI生成短剧、人物定妆图、分镜或视频作品。\n\n应聘资料\n请提供个人简历及同一人物的一组连续剧情镜头、参考图及一次返修前后对比，并简要说明：\n常用的AI生图和视频生成工具；\n在什么时长、难度和工具条件下，日常可交付多少个通过验收的镜头，以及生成次数、返修次数和耗时；\n角色一致性及异常画面处理经验；\n个人在相关项目中负责的具体工作。", "cat": "AI / AIGC"}, {"id": "325", "title": "AI 短剧导演（海外内容）", "salary": "15K–18K", "location": "未明确", "jd": "岗位：AI 短剧导演（海外内容） \n\n岗位定位\n负责面向海外市场的 AI 短剧从剧本到成片的全流程制作，兼具导演思维、视听审美与后期执行能力。能够根据目标市场的文化偏好与平台规则完成内容本地化，运用 AI 工具实现视觉叙事，独立把控分镜、剪辑、声音及最终交付质量。\n岗位职责\n1. 根据剧本确定影片风格、角色形象、场景设计和视听表达，完成分镜脚本及制作规划；\n2. 输出故事板、镜头表、机位设计、景别设计及镜头调度方案，与编剧协作完成剧本可视化；\n3. 设计钩子、情绪爆点与集尾悬念，控制单集画面节奏、叙事节奏、情绪节奏及视觉重心；\n4. 把控角色神态、肢体动作、对白节奏及人物互动，使表演呈现符合剧情与情绪逻辑；\n5. 熟练运用 AI 图像、视频及声音工具完成素材生成与迭代，解决人物一致性、镜头衔接、动作自然度等实际问题；\n6. 独立完成精剪、调色、配音整合、音效、配乐、字幕及必要的合成修复，交付完整成片；\n7. 了解目标市场（欧美 / 东南亚 / 中东等）的文化偏好与内容审核规则，熟悉 TikTok、YouTube Shorts、Instagram Reels 等平台的分发逻辑，确保内容符合当地受众审美与平台要求；\n8. 理解情感、悬疑等题材的叙事特点，通过构图、光影、声音与剪辑把握亲密关系、暧昧氛围与戏剧冲突的表达尺度；\n9. 与编剧协作评估制作可行性，优化难以生成或成本过高的场景，平衡质量、周期与成本；\n10. 建立角色、场景、镜头及声音资产库，沉淀可复用的制作流程与提示词体系。\n任职要求\n1. 有短剧、影视、广告、动画或 AI 视频制作经验，具备可展示的完整作品；\n2. 能够独立完成剧本可视化，输出专业故事板、镜头表及导演阐述，具备完整镜头设计能力；\n3. 熟悉镜头语言、场面调度、表演逻辑与叙事节奏，能合理运用构图法则、轴线原则、连续性剪辑及蒙太奇完成视觉叙事；\n4. 熟练使用至少一款专业剪辑软件（Premiere Pro / DaVinci Resolve / Final Cut Pro），具备调色、声音处理及基础合成能力；\n5. 熟悉主流 AI 图像与视频生成工具（如 Runway、Kling、Pika、MidJourney 等），具备将多工具整合进完整制作工作流的实际经验；\n6. 具备海外市场意识，了解目标受众的内容偏好与观看心理，英语具备基础读写能力，能独立理解目标市场用户反馈；\n7. 对成年受众的内容偏好与观看心理有基本理解；\n8. 具备良好的交付意识、项目保密意识与跨部门沟通能力。\n加分项\n- 有海外平台内容发行、运营或本地化经验；\n- 有独立导演并完成后期的完整作品；\n- 熟悉角色一致性控制、批量制作工作流；\n- 有根据完播率、互动数据调整内容结构的经验；\n- 有小型团队管理或跨部门协作经验；\n- 有情感、悬疑、西幻或强人物关系题材创作经验。\n应聘材料\n- 提供 2–3 部代表作品，注明本人负责的环节；\n- 至少一个从剧本或分镜到最终成片的完整案例；\n- 说明常用工具组合、单集制作周期及可独立承担的工作范围。", "cat": "AI / AIGC"}, {"id": "326", "title": "agent架构师", "salary": "20k-35k", "location": "未明确", "jd": "AI平台架构师 / AI 基础设施架构师\n岗位方向：AI Platform / Agent Infrastructure / Cloud Native / GPU Infrastructure\n经验要求：8 年以上开发/架构经验，3 年以上 AI 相关项目经验优先\n岗位职责\n负责公司 AI 平台及 AI 应用基础设施的整体架构设计与技术落地，支撑 AI Agent、AIGC 图像/视频、大模型 API、模型推理等业务稳定运行。\n不仅要求具备传统后端及云原生架构能力，还需要理解当前 AI 应用的技术体系，能够完成从：\nAI 应用 → Agent → 模型服务 → GPU 算力 → Kubernetes → DevOps → 可观测性\n的完整技术架构设计。\n1. AI 平台架构\n负责公司 AI 平台整体技术架构设计、技术选型及核心模块建设。\n负责 AI Agent、LLM、AIGC 图像/视频等业务的基础架构设计。\n建设统一 AI Gateway，对接 OpenAI、Claude、Gemini、DeepSeek、Qwen、MiniMax 及私有部署模型。\n设计统一模型调用层，实现模型路由、Fallback、负载均衡、限流、熔断、重试及成本控制。\n设计 Agent Runtime / Tool Runtime，支撑 Tool Calling、MCP、Workflow、异步任务等能力。\n建设模型、Prompt、Agent、Workflow 的版本管理和发布体系。\n负责 AI 服务高可用、高并发、可扩展架构设计。\n2. Python / Go 后端架构\n熟练使用 Python + Go 进行后端及基础设施开发。\nPython 方向熟悉 FastAPI、Pydantic、AsyncIO、Celery 等常见技术。\nGo 方向熟悉 Gin、Fiber、gRPC 等技术体系。\n熟悉 REST API、WebSocket、SSE、gRPC 等通信方式。\n熟悉微服务、分布式系统、任务队列、缓存、数据库及对象存储等基础架构。\n能够针对 AI 长任务、GPU 任务设计异步任务系统。\n具备高并发、限流、熔断、降级、幂等、重试、分布式锁等实际工程经验。\n3. Kubernetes / 云原生\n精通 Kubernetes 生产环境部署及运维。\n熟悉 Deployment、StatefulSet、DaemonSet、Job、CronJob、Service、Ingress、HPA、PVC 等核心资源。\n熟悉 Helm / Kustomize。\n能够设计多 Namespace、多环境、多集群部署架构。\n熟悉 Pod 调度、资源限制、健康检查、滚动更新、自动扩缩容。\n能够快速定位 Pod Pending、OOMKilled、CrashLoopBackOff、MinimumReplicasUnavailable 等常见问题。\n熟悉 GPU Kubernetes 调度，包括 NVIDIA Device Plugin、GPU Resource、Node Selector、Affinity/Taint/Toleration 等。\n有 EKS / ACK / GKE / Azure AKS 等公有云 Kubernetes 生产经验优先。\n4. GPU / AI Infra\n理解 GPU 推理服务的部署和资源管理。\n熟悉 NVIDIA GPU、CUDA、显存、GPU Utilization 等基本概念。\n能够设计 GPU 资源池及任务调度机制。\n熟悉多 GPU / 多节点推理场景。\n熟悉模型加载、模型缓存、冷启动、显存回收及 OOM 处理。\n理解 FP16 / BF16 / FP8 / INT8 / INT4 等推理优化方式。\n有 vLLM、SGLang、TensorRT-LLM、Triton Inference Server 等经验优先。\n有 ComfyUI / Diffusers / 图像视频生成任务的 GPU 调度经验优先。\n5. CI/CD & DevOps\n负责公司 AI 系统完整 DevOps 体系建设，包括：\nGit → Build → Test → Image → Registry → Deploy → Monitor → Rollback\n熟悉 Git / Gitea。\n能够基于 Gitea Actions / Drone / Jenkins / Argo CD 等建设自动化流水线。\n熟悉 Docker 镜像构建及镜像优化。\n熟悉 Harbor 或其他 Docker Registry。\n熟悉 Helm 自动化部署。\n熟悉 GitOps。\n能够设计 Dev / Test / Staging / Production 多环境发布体系。\n支持灰度发布、滚动发布、蓝绿发布及快速回滚。\n建设代码、镜像、配置、模型、Workflow 的版本追踪体系。\n6. 云计算架构\n熟悉 AWS / 阿里云 / 腾讯云 / GCP 等至少一种主流云平台。\n熟悉 VPC、Subnet、NAT Gateway、Load Balancer、安全组、DNS 等基础网络。\n熟悉对象存储 S3 / OSS。\n熟悉 CDN。\n熟悉云数据库、Redis、消息队列等云服务。\n能够设计跨区域 / 多云架构。\n能够针对 AI GPU 业务进行云资源成本优化。\n有混合云 / 本地 GPU + 云 GPU 架构经验优先。\n7. 可观测性与稳定性\n建设完整的：\nMetrics + Logs + Traces + Alerts\n可观测体系。\n熟悉：\nPrometheus\nGrafana\nLoki / ELK / OpenSearch\nOpenTelemetry\nJaeger / Tempo\n能够针对 AI 系统建立：\nAPI 请求耗时\nToken 消耗\n模型成功率\nAgent Task 成功率\nWorkflow 执行时间\nGPU 利用率\nGPU 显存\nQueue Length\n模型推理耗时\n单任务成本\n等关键指标。\n负责线上故障定位、容量规划、性能优化及稳定性治理。\n任职要求\n必备能力\n计算机相关专业本科及以上学历优先。\n8 年以上软件开发 / 架构相关经验。\n有大型互联网系统、AI 平台或云原生平台架构经验。\n熟练掌握 Python 和 Go，至少一门达到高级水平。\n熟悉 Linux / Docker / Kubernetes。\n有 Kubernetes 生产环境实际管理经验，而不仅仅是部署过 Demo。\n熟悉微服务及分布式系统设计。\n熟悉 MySQL / PostgreSQL / Redis / MQ / Object Storage 等基础组件。\n熟悉 Gitea / GitLab / GitHub 等代码管理体系。\n有完整 CI/CD Pipeline 建设经验。\n熟悉至少一种主流公有云。\n有良好的系统设计能力。", "cat": "AI / AIGC"}, {"id": "327", "title": "AI应用工程师", "salary": "20k-30k", "location": "未明确", "jd": "AI Agent / AIGC 开发工程师\n岗位方向：AI Agent + ComfyUI + 图像/视频生成\n经验要求：3-8 年开发经验，有 AI Agent / AIGC 项目落地经验优先\n岗位职责\nAI Agent 系统开发\n负责 AI Agent 应用的架构设计、开发与落地，包括任务规划、Tool Calling、Workflow、Memory、RAG、多 Agent 协作等能力。\n基于 LangGraph、AutoGen、LlamaIndex、Spring AI 等框架构建 Agent 工作流。\n负责大模型 API 接入与统一封装，包括 OpenAI、Claude、Gemini、DeepSeek、Qwen、MiniMax 等模型。\n设计 Agent 与业务系统、第三方 API、MCP、浏览器自动化工具之间的调用机制。\n优化 Agent 的稳定性、任务成功率、上下文管理、Token 成本及执行效率。\nAIGC 图像生成能力建设\n负责 Stable Diffusion / SDXL / FLUX 等图像生成模型的工程化应用。\n熟悉 ComfyUI 工作流设计、节点开发、API 化及生产环境部署。\n能够搭建文生图、图生图、局部重绘、参考图生成、角色一致性、多图参考等工作流。\n熟悉 ControlNet、IP-Adapter、LoRA、Inpainting、FaceSwap、超分等常见技术。\n能够针对业务场景进行 Prompt、Sampler、Scheduler、CFG、Steps、LoRA 权重等参数调优。\nAI 视频生成能力建设\n负责图生视频、文生视频、参考视频生成等 AIGC 视频能力的接入和工作流建设。\n有 Wan、HunyuanVideo、CogVideoX、LTX-Video、AnimateDiff 或其他主流视频模型使用经验。\n熟悉首尾帧、角色一致性、镜头控制、动作控制、多镜头连续生成等视频生成场景。\n能够结合 FFmpeg 完成视频拼接、转码、字幕、音频、抽帧、补帧、超分等后处理流程。\n对视频生成速度、显存占用、推理成本及生成质量进行持续优化。\nComfyUI 工程化\n负责复杂 ComfyUI Workflow 的设计、调试和服务化。\n能够将 ComfyUI Workflow 封装为 REST API / WebSocket 服务并接入业务系统。\n开发或改造 ComfyUI Custom Nodes。\n处理模型、LoRA、VAE、ControlNet 等资源的动态加载和管理。\n优化 GPU 调度、任务队列、并发控制、OOM 恢复及任务失败重试机制。\n模型部署与推理优化\n负责 GPU 推理环境搭建及模型部署。\n熟悉 PyTorch、CUDA、Docker 等基础技术。\n熟悉 FP16 / BF16 / FP8 / INT8 / INT4 等常见量化及推理优化方式。\n能够分析 GPU 显存、利用率、推理耗时等性能指标。\n有多 GPU、模型并行、任务调度、Kubernetes GPU 部署经验优先。\n任职要求\n必备能力\n计算机、人工智能、软件工程等相关专业，本科及以上学历优先。\n3 年以上 Python / Java / Go 等至少一种语言的实际开发经验，Python 熟练者优先。\n有真实 LLM / AI Agent 项目开发经验，而非仅调用 Chat API。\n熟悉 Prompt Engineering、Function Calling / Tool Calling、RAG、Memory、Workflow 等 Agent 核心技术。\n熟悉至少一种 Agent 框架：LangGraph / AutoGen / LlamaIndex / Spring AI 等。\n熟练使用 ComfyUI，能够独立设计和调试复杂 Workflow。\n熟悉 Stable Diffusion / SDXL / FLUX 等 Diffusion / Flow Matching 图像生成技术。\n有 LoRA、ControlNet、IP-Adapter、Inpainting 等实际使用经验。\n有至少一种主流 AI 视频模型的实际使用经验。\n熟悉 Linux、Docker、Git，具备基本 GPU / CUDA 环境排查能力。\n能够独立完成从技术调研、Demo 验证到生产系统落地的完整过程。\n加分项\n有 ComfyUI Custom Node 开发经验。\n有 LoRA 训练、DreamBooth、模型微调经验。\n熟悉 Diffusers、Transformers、Accelerate 等 Hugging Face 技术栈。\n熟悉 DiT、Diffusion、Flow Matching、VAE、CLIP、Transformer 等生成模型基本原理。\n有角色一致性、多人物一致性、参考图重绘、视频一致性相关项目经验。\n有 AI 短剧、AI 漫剧、数字人、AI 广告、AI 视频生产平台等项目经验。\n有图像/视频模型推理加速经验。\n有多 GPU 推理、GPU 资源池、K8s GPU 调度经验。\n有 MCP / Browser Automation / Playwright 等 Agent 工具开发经验。\n有 Agent Observability、Tracing、Prompt/模型效果评测体系建设经验。\n有高并发 AI SaaS 平台或模型 API Gateway 建设经验。\n我们希望你解决的问题\n这个岗位不是单纯做“大模型 API 调用”，也不是单纯配置 ComfyUI。\n我们希望候选人能够把：\nLLM → Agent → Workflow → ComfyUI → 图像模型 → 视频模型 → GPU 推理 → 业务系统\n真正串成完整的生产链路。\n例如：\n用户输入需求\n→ Agent 理解需求\n→ 自动拆解任务\n→ 生成角色 / 场景 / 分镜\n→ 自动选择模型、LoRA 和 Workflow\n→ ComfyUI 生成角色与场景\n→ 图生视频\n→ FFmpeg 后处理\n→ Agent 检查结果并自动重试 / 调参\n→ 输出最终视频。\n最终目标是建设一套能够自动完成 “创意 → 图片 → 视频 → 成片” 的 Agentic AIGC 生产系统。\n核心技术关键词\nAI Agent\nLLM / Agent / LangGraph / AutoGen / LlamaIndex / Spring AI / ReAct / Tool Calling / MCP / RAG / Memory / Workflow / Multi-Agent\nAIGC\nComfyUI / Stable Diffusion / SDXL / FLUX / LoRA / ControlNet / IP-Adapter / Inpainting / Diffusers\nAI Video\nWan / HunyuanVideo / CogVideoX / LTX-Video / AnimateDiff / Image-to-Video / Text-to-Video\n工程化\nPython / PyTorch / CUDA / Docker / Kubernetes / FFmpeg / REST API / WebSocket / GPU Scheduling", "cat": "AI / AIGC"}, {"id": "328", "title": "AI内容编辑（AI短剧视觉设计师）", "salary": "10K–18K", "location": "未明确", "jd": "岗位职责\n- 负责短剧封面、人物及场景资产制作，以短剧人物、场景及道具资产制作为主，按项目排期兼顾封面。\n- 根据剧本提炼视觉卖点，制作高点击率封面。\n- 保证人物、场景、风格及色调的一致性；按分镜需要交付角色多角度、表情、服装和场景参考，供生成师连续使用。\n• 注重人物场景的材质，纹理细节。\n- 使用 AI 工具批量生产素材，并完成修图和优化。\n- 负责人物、场景及封面资产的整理归档，标明版本和使用范围，并配合生成师验证资产在实际镜头中的一致性。\n\n任职要求\n- 审美能力强，具备良好的构图、色彩及画面把控能力。\n- 能够快速、稳定地生成高质量视觉资产。\n- 熟练使用 ChatGPT、Nano Banana、Seedream、Midjourney、Photoshop 和 Figma，至少一种主流AI生图工具，以及Photoshop等修图工具，能够完成局部修复、细节调整与风格统一。\n- 能解决人物不一致、画面模糊及风格不统一等问题\n- 能快速理解剧本，具备良好的沟通及执行能力。\n\n加分项\n- 有短剧封面、影视海报或人物场景设计经验。\n- 有游戏原画 ，概念设计经验\n- 有完整的 AI 视觉作品集。\n\n应聘资料\n请提供角色与场景资产案例、修图前后对比，注明本人设计、生成和修图的范围；有封面案例可另附", "cat": "AI / AIGC"}, {"id": "329", "title": "AI内容编辑（资深短剧剪辑师）", "salary": "13K–18K", "location": "未明确", "jd": "岗位职责\n\n- 负责短剧正片的粗剪、精剪及成片交付；预告片与传播切片按项目排期配合宣发剪辑。\n- 能提炼剧情冲突和情绪爆点，做好开场、情节推进与集尾悬念，保证叙事连贯、情绪递进。\n- 把控剪辑节奏、镜头衔接、音乐、音效、字幕及画面氛围。\n- 根据 TikTok、绿色平台等渠道特点，识别AI素材中的动作断裂、口型不同步、人物或空间不连续等问题；能通过剪辑处理，或向导演、生成师提出明确补镜需求。\n- 配合运营团队，根据播放数据持续调整钩子、节奏和内容结构；按项目要求交付成片、工程文件及版本记录。\n\n任职要求\n- 有短剧、剧情类短视频或信息流广告剪辑经验。\n- 节奏感强，能够独立完成强钩子、强冲突和强情绪内容的剪辑。\n- 熟练使用剪映、Premiere、DaVinci Resolve等至少一种剪辑工具，能独立完成字幕、音乐、音效和基础调色；掌握After Effects者加分\n- 能快速理解剧本，运用镜头选择、顺序和声音表达人物关系与情绪；了解AI视频素材特点，能判断素材是否可用。\n\n加分项\n- 有AI短剧剪辑经验，或了解AI生成、配音及画面修复工具。\n- 有成人向、情感向或强冲突题材剪辑经验。\n- 能根据点击率、完播率及转化数据优化剪辑内容。\n应聘时请提供连贯剧情片段或完整单集，注明本人剪辑与后期范围；附时间线截图或剪辑思路说明，宣发作品可另附。", "cat": "AI / AIGC"}, {"id": "330", "title": "海外短剧宣发视频剪辑师", "salary": "13K–18K", "location": "未明确", "jd": "岗位职责\n1.负责公司原创及合作短剧的宣发视频剪辑与创意包装，包括剧情高光、悬念预告、人物混剪、情绪冲突及推广短视频\n2.能够独立拆解短剧剧情，提炼人物关系、核心冲突、反转情节及情绪爆点，制作具有吸引力的宣发素材\n3.针对不同短剧题材及海外用户偏好，设计差异化宣发内容，避免简单切片、重复拼接及同质化剪辑\n4.根据X（Twitter）、TikTok、Instagram Reels、YouTube Shorts等平台特点，调整视频时长、画幅、剪辑节奏及内容包装\n5.负责视频配乐、音效、英文字幕、基础调色、转场及封面等后期制作，确保成片质量\n6.围绕同一部短剧制作不同开场、剧情切入点及多个创意版本，配合新媒体团队开展宣发素材测试；交付时标明版本、目标平台及测试的创意差异\n7.根据新媒体或投放团队反馈的播放量、完播率、互动率、点击及引流效果，分析素材表现并持续优化剪辑方向\n8.主动筛选具有传播潜力的剧情片段，提出宣发创意及必要的补充素材需求\n9.按项目要求完成视频制作、修改、分类归档及交付，保证素材质量与制作效率\n10.与短剧制作组及新媒体运营组协作，持续优化宣发素材制作流程\n\n任职要求\n1.具有短视频剪辑、短剧宣发、影视混剪、预告片制作或海外短视频内容制作经验\n2.熟练使用Premiere、剪映专业版、CapCut等剪辑软件，掌握字幕、配乐、音效、基础调色及视频包装\n3.具备良好的影视审美、剧情理解及剪辑节奏把控能力，能够独立制作具有传播吸引力的短视频\n4.擅长提炼剧情冲突、人物情绪、反转悬念及高光片段，能够通过二次剪辑强化内容吸引力\n5.了解X、TikTok、Instagram、YouTube Shorts等海外平台的内容风格及用户观看习惯\n6.具备基础英文理解及字幕处理能力，能够完成面向欧美市场的短视频本地化包装\n7.能够围绕同一剧集独立策划不同宣发方向，制作多个差异化剪辑版本\n8.具备数据分析意识，能够根据播放、完播、互动及引流表现调整素材内容\n9.能够接受成人向短剧业务，理解不同平台的内容规范及素材表达要求\n10.工作主动、执行力强，具备良好的沟通协作能力，能够适应多项目并行及快节奏内容制作\n\n优先录用条件\n1.有海外短剧宣发、影视预告片、剧情混剪或高播放量短视频制作经验\n2.有X、TikTok、Instagram、YouTube Shorts等海外平台实际内容制作经验\n3.能够独立完成从剧情拆解、创意策划到最终视频交付的完整流程\n4.熟悉AI辅助剪辑、AI配音、字幕生成及音视频处理工具\n5.有真实爆款案例，能够提供个人作品及相关播放、互动或引流效果数据\n\n应聘资料\n请提供同一内容的两个不同创意版本，注明平台、创意差异和本人负责部分；如有数据，请说明统计周期、发布或投放条件。", "cat": "内容"}, {"id": "331", "title": "Prompt优化工程师", "salary": "15-25k", "location": "6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。", "jd": "岗位职责\n1.具备从选题、内容形态到最终呈现效果的全链路理解能力，覆盖文案、图片、视频等多种内容形态，不局限于写Prompt本身。\n2.梳理编辑、运营、AI生成、剪辑等岗位的实际生产场景，分别定义可复用的文本类Prompt规范（标题、文案、SEO内容）和视觉类Prompt规范（封面、画面生成），建立结构化模板及负面提示词库。\n3.对主流文本大模型、图像和视频生成模型进行系统性对比测试，记录不同内容场景下的模型能力边界、参数效果、失败模式和成本差异，在自己主攻的方向上能独立判断、能兜底。\n4.设计A/B测试与量化评测指标，衡量可用率、一致性、点击率/审美质量、生成耗时和单条素材成本，用数据而非主观感受驱动优化。\n5.与运营、AI生成师和开发团队协作，把验证有效的Prompt和评测方法沉淀到平台、工作流或自动化评测工具中，让好经验能够复用推广。\n6.具备强自驱和强复盘意识，持续跟踪模型更新和行业实践，把踩坑记录、失败模式和最佳实践系统性整理为团队资产，并组织内部培训，推动团队形成统一的提示词工程标准。\n任职要求\n1.本科及以上学历，中文、新闻、设计、计算机、人工智能等相关专业优先。\n2.2年以上AIGC、Prompt工程、内容生产或模型评测经验，具备可验证的项目案例。\n3.熟悉主流文本大模型及文生图、视频生成模型，理解文案生成、参考图、首尾帧、镜头控制、风格迁移和一致性控制等不同方法。\n4.具备较强的文字表达、结构化思考和实验设计能力，能把个人经验转化为可复用的模板、流程和评测标准。\n5.能阅读模型文档、英文资料和社区案例，独立快速验证新技术并形成结论。\n6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。\n7.对内容质量和数据结果敏感，具备跨团队沟通和培训输出能力。\n加分项\n1.具备Python脚本、数据处理或自动化评测能力。\n熟悉ComfyUI、LoRA、模型微调或本地推理。", "cat": "技术 / 数据"}, {"id": "332", "title": "中高级产品经理", "salary": "15-30k", "location": "jd有更新", "jd": "岗位职责\n一、产品规划与需求分析\n负责 C 端产品及核心功能的规划与迭代；\n结合业务目标、用户需求、市场趋势及竞品情况制定产品方案；\n深入分析需求背景及目标，能够识别真实用户需求，而非简单承接业务需求；\n完成产品原型、PRD、业务流程及功能逻辑设计；\n持续优化产品架构、核心功能及用户体验。\n二、用户体验与产品迭代\n关注用户使用路径及核心业务场景；\n通过用户反馈、行为数据及业务数据发现产品问题；\n持续优化注册、使用、内容消费、互动、留存、付费等核心链路；\n关注产品细节及交互体验，推动体验问题持续改善；\n结合产品不同生命周期制定对应的迭代策略。\n三、数据分析与增长\n建立数据驱动的产品工作方式；\n关注新增、活跃、留存、转化、付费等核心产品指标；\n通过数据分析定位产品问题及增长机会；\n针对重点功能制定上线目标及效果验证指标；\n持续跟踪版本上线后的数据表现，形成“需求—上线—数据—复盘—迭代”闭环。\n四、项目推动与落地\n负责需求从规划、评审、设计、研发、测试、验收到上线的完整推进；\n制定合理的版本计划及项目排期；\n协调 UI、研发、测试、运营等相关团队推进项目落地；\n及时识别项目风险、资源冲突及进度问题，并推动解决；\n对负责产品的交付质量、上线结果及后续表现持续跟进。\n五、市场与竞品研究\n持续关注行业趋势、用户变化及竞争产品动态；\n定期开展竞品分析及市场调研；\n能够从竞品中分析产品定位、业务模式、用户场景及核心策略，而非简单进行功能对比；\n结合业务实际提出具有可落地性的产品优化及创新方案。\n⸻\n任职要求\n基本要求\n3年以上互联网 C 端产品经理相关经验；\n具备完整的产品需求分析、产品设计及项目落地经验；\n能够独立负责产品或核心业务模块；\n熟悉互联网产品研发流程及产品生命周期管理；\n熟练使用 Axure、Figma、墨刀等产品设计工具及常用项目管理工具；\n具备基本的数据分析能力，能够通过数据辅助产品判断。\n能力要求\n具备较强的 C 端产品思维和用户意识，能够站在用户、业务及产品多个角度分析问题；\n具备良好的需求分析能力，能够从表层需求进一步拆解业务目标和真实用户需求；\n具备较强的逻辑思维及产品架构能力，能够独立完成复杂业务及功能设计；\n具备数据驱动意识，能够通过数据发现问题、验证需求及评估版本效果；\n具备较强的项目推动能力，能够主动协调资源并推动问题解决；\n具备良好的沟通表达、跨部门协作及执行能力。\n加分项\n有内容社区、短视频、社交、泛娱乐、工具类等 C 端产品经验；\n有从 0-1 产品建设或核心产品重大版本迭代经验；\n有用户增长、会员体系、付费转化、社区互动等产品经验；\n有成熟产品的数据分析、用户研究及增长实验经验；\n具备一定商业化产品思维，能够兼顾用户体验与业务经营目标；\n熟悉 AI 产品或能够将 AI 工具应用于需求分析、竞品研究、产品设计及日常工作。\n4.有跨团队推动能力，能把事情真正落地。\n5.有较强执行力和抗压能力，能处理需求冲突与优先级判断，独立推进项目落地。\n6.具备较强的Owner意识，对结果负责。\n7.在日常工作中已将AI工具深度融入产品工作流，包括但不限于：使用AI辅助需求分析、竞品调研、文档撰写、原型生成、数据洞察等环节，能主动探索并落地AI提效手段。\n8.有团队管理经验或带教经验者优先。\n三、加分项\n1.熟练使用一种或多种AI原型/设计工具（如Figma AI、Codex、Claude AI、ChatGPT、Grok、Cursor等），能提供使用AI工具生成的原型案例作为参考。\n2.有播放器、内容、消费、社交、资讯等行业经验。\n3.做过增长、商业化相关项目。\n4.有技术背景或设计背景。", "cat": "产品"}, {"id": "333", "title": "高级增长运营", "salary": "15-30k", "location": "未明确", "jd": "岗位职责\n1.负责全渠道流量转化链路优化，通过优化官网点击率、各端安装率（iOS/安卓）及渠道转化逻辑，提升整体获客效率。\n2.通过前端逻辑调整与策略干预，提升用户拉单触发频率，以高频行为带动商业化转化。\n3.设计商业化策略：包括低门槛首充产品（如周会员）设计以降低付费门槛、提升新增付费率；规划高价值套餐（月/季包）及代金币体系，优化定价策略提升ARPPU表现；通过Push、站内信等手段建立老用户触达机制，提升续费召回率与老用户充值占比。\n4.基于\"拉单-付费率-ARPU\"等核心影响链路开展数据建模与实验验证，通过数据反馈持续迭代增长路径。\n5.建立数据看板与归因分析机制，围绕获客质量（点击转化率、安装转化率、渠道转化率）、增长规模（拉单率、拉单触发频次）、变现效率（新增付费率、ARPPU、综合ARPU）、存量经营（续费召回率、充值占比）等核心指标持续复盘优化。\n6.沉淀增长打法、实验结论和SOP，推动团队及其他产品线复用有效经验。\n任职要求\n1.5年以上用户增长、运营增长或商业化运营经验，有从0到1、1到10或规模化增长项目经验，能用数据说明个人贡献和业务结果。\n2.具备成熟的模型思维，能理清获客、拉单、付费、留存各环节指标间的联动关系，擅长拆解\"提升路径\"寻找业务增长点。\n3.有视频、工具或订阅类产品运营背景，熟悉付费门槛设置、套餐定价及代金币体系设计。\n4.具备扎实的数据分析能力，能从ARPU、ARPPU、付费渗透率、拉单率、安装转化率等指标波动中定位核心问题并产出解决方案。\n5.具备优秀的产品逻辑梳理能力，能推动前端逻辑调整、支付配置及运营策略高效落地。\n6.有跨部门沟通协作经验，能协调产品、技术、渠道、商务等团队推进项目落地。\n加分项\n1.具备自动化任务跟进或多Agent协同工作意识。\n2.有视频、内容或垂直领域成功增长案例。\n熟练使用SQL、BI工具或增长实验平台。", "cat": "商务 / 市场"}, {"id": "334", "title": "高级产品运营", "salary": "15-30k", "location": "未明确", "jd": "岗位职责\n1.负责平台内容的上架管理，包括内容排期、元数据维护（标题、简介、标签、分类）、封面与物料把控；建立并持续优化内容标签体系，保障内容库结构清晰，对站内检索、推荐及用户浏览友好。\n2.负责首页、频道页、分类页、专题页等核心流量场的内容编排，策划片单、专题、榜单等运营栏目；结合播放数据、用户偏好及热点动态调整推荐位，提高优质内容曝光效率、点击率及播放转化。\n3.制定内容上线节奏及更新排播计划，包括定档、预告、上线、连载更新、完结等运营节奏；配合重点内容进行站内宣发及资源位配置，放大头部内容的拉新、活跃及留存价值。\n4.持续跟踪播放量、点击率、完播率、人均观看时长、内容拉新及留存贡献等核心指标，定期进行内容消费数据复盘，将结论转化为选片、编排及推荐调整策略。\n5.参与内容评估及引入建议，协助对接内容方、制作方或版权方，完成内容物料交付、信息整理及上线跟进。\n6.参与付费内容、会员专享内容及重点内容的运营策略制定，结合节假日、热点事件及平台活动完成内容侧策划与落地，提升会员内容消费及付费转化。\n任职要求\n1.本科及以上学历，3年以上视频/内容平台产品运营经验。\n2.熟悉内容运营全链路，包括排期上架、元数据管理、标签分类、运营位编排、专题策划等，至少独立负责过其中两个核心环节。\n3.具备较强的数据敏感度，能看懂内容播放漏斗，独立完成内容消费数据复盘，并根据数据提出具体的选片、推荐位及内容编排调整动作。\n4.对内容具备较强判断力，熟悉主流内容品类及题材趋势，能判断内容是否具备流量潜力，在选片、推荐及内容编排方面有自己的方法论。\n5.具备基本的文案及审美能力，能独立完成专题标题、内容简介、推荐语、标签及封面物料把控。\n6.有会员付费内容、单片付费、内容解锁或类似商业化运营经验者优先。\n加分项\n1.有内容采买评估、版权方或内容制作方对接经验。\n2.熟悉推荐系统基本逻辑，有根据用户行为数据优化内容推荐或与算法团队协作的经验。\n3.熟练使用AI工具提升内容运营效率，例如批量整理元数据、标签生成、简介生成、封面初筛及内容分类等。", "cat": "运营"}, {"id": "335", "title": "中高级内容运营", "salary": "15-30k", "location": "jd有更新", "jd": "岗位职责\n要求有成人行业经验\n1.负责平台整体内容运营，制定内容分类、标签、专题、搜索页等内容策略，提升内容流量、用户留存与转化效率。\n2.负责内容矩阵的选题方向制定与更新排期统筹，跟踪内容数据表现（播放、完播、转化等），持续分析优化内容策略及运营打法，定期输出数据分析报告支撑业务决策。\n3.统筹站外推广工作，包括自媒体矩阵、TG频道、外链渠道等内容分发及曝光提升策略，跟踪竞品及行业动态持续优化增长模型。\n4.带领并考核内容/运营团队成员，把控内容更新、文案优化、专题活动等产出质量，对接平台端内容规范落地。\n5.定期对内容数据进行复盘，包括流量来源、搜索关键词、用户行为、转化路径等，形成优化方案并推动落地执行。\n6.建设选题库、素材库、标签体系和内容SOP，提升团队协作效率与内容复用率。\n7.对齐业务目标，推动跨团队协作，完成内容相关的临时性/专项工作。\n任职要求\n1.本科及以上学历，3年以上内容运营、短视频运营或网站运营相关经验，有细分内容领域行业经验者优先。\n2.具备较强的数据分析能力，能通过流量、留存、转化、用户行为等核心数据发现问题并制定优化策略。\n3.熟悉内容生态与SEO运营逻辑，对分类结构、标签体系、专题页、关键词布局、搜索流量增长等有实战经验。\n4.有站外推广、自媒体矩阵运营或社群运营经验，熟悉TG频道运营者优先。\n5.具备一定的团队协作或带教经验，能统筹多任务并推进落地。\n6.责任心强，抗压能力好，能适应快节奏的业务需求。\n加分项\n1.熟悉Google Analytics、Search Console等数据工具，有搜索引擎流量增长经验优先。\n2.有多站点/矩阵站点运营经验。\n3.有海外渠道（Telegram、Twitter、Facebook、Reddit等）运营经验。", "cat": "内容"}, {"id": "336", "title": "AI生成师（必须会剪辑）", "salary": "10-20k", "location": "未明确", "jd": "岗位职责\n1. 理解剧本、分镜和视觉参考，拆分角色、场景、道具、动作和镜头，形成结构化的生成任务。\n2. 根据不同内容需求选择文生图、图生视频、首尾帧、参考图等生成方式，配置模型、参数和生成工作流。\n3. 进行批量生成与“抽卡”筛选，从构图、角色一致性、动作自然度、光影、风格和瑕疵等维度判断素材可用性。\n4. 维护角色、场景、服装、道具和风格资产库，记录Prompt、参数、版本、成本及最终选用结果。\n5. 针对生成失败、连贯性不足、画面崩坏等问题持续迭代提示词和工作流，提升一次通过率与批量生产效率。\n6. 与编剧、导演、剪辑和开发团队协作，反馈工具问题，沉淀提示词模板、案例库和标准操作流程。\n任职要求\n1. 大专及以上学历，数字媒体、动画、视觉设计、影视制作、美术等相关专业优先。\n2. 1年以上AIGC内容生产经验，或具备能够证明生成能力的作品集与项目案例。\n3. 熟悉主流文生图、图生视频及视频生成工具，理解常用参数、参考图、首尾帧和风格控制方法。\n4. 具备较强的视觉审美和画面判断能力，能够识别角色漂移、结构错误、运动异常等常见问题。\n5. 具备提示词编写、结构化实验和持续迭代能力，能够承担一定强度的批量生产任务。\n6. 工作细致、耐心、责任心强，能够适应快速变化的模型和工具生态。\n加分项\n• 熟悉ComfyUI、工作流编排、LoRA训练或模型部署。\n• 有AI短剧、AI漫剧、广告或内容平台的稳定量产经验。\n• 能够编写脚本或小工具提高素材整理、批量生成和评测效率。", "cat": "AI / AIGC"}, {"id": "337", "title": "中高级运营", "salary": "8-15k", "location": "JD有更新", "jd": "简历必须附带作品\n岗位职责\n1. 负责指定网站或 App 的日常运营，跟踪 DAU、MAU、新增、留存、流量来源和内容表现，输出经营简报。\n2. 组织内容更新、专题活动、首页推荐和站点巡检，发现访问、播放、链接、评论及页面展示异常并推动处理。\n3. 分析数据波动，区分搜索、直连、推荐等来源变化，提出调整方案并跟踪结果。\n4. 与产品、技术、SEO等团队协作，明确需求、验收标准和完成时间，推动问题闭环。\n5. 指导编辑执行内容标准，开展抽检、反馈和复查。\n\n任职要求\n\n1. 具备网站或 App 运营经验，能够独立负责一个项目的日常运营。\n2. 熟悉 GA4、BI 或同类数据工具，能完成基础的数据对比、异常定位和复盘。\n3. 理解内容质量、访问链路、搜索流量和产品体验对业务指标的影响。\n4. 具备较强的执行、沟通和问题跟进能力，能清楚区分“已提出、推进中、已上线、已验收”。\n\n考核关注\n\n负责项目的数据稳定性、问题闭环率、内容质量、需求落地情况及复盘质量。", "cat": "运营"}, {"id": "338", "title": "运营专员", "salary": "8-15k", "location": "未明确", "jd": "岗位职责\n1.负责网站日常运营、用户增长、活动策划与数据分析，提升用户留存与转化\n2.撰写图文、文案等内容，或对外部内容进行审核、修改与优化，确保内容合规\n3.关注行业趋势、热点事件，根据热点快速产出符合讨论度与传播性的内容\n4.负责评论区、社群、私信等用户互动，收集用户反馈，维护用户关系，提升用户参与度与粘性\n5.协助产品团队挖掘用户需求，推动产品优化迭代\n6.跟踪竞品运营策略，输出竞品分析报告和市场动态", "cat": "运营"}, {"id": "339", "title": "新媒体运营", "salary": "10–16K", "location": "JD有更新", "jd": "只要女性\n一、岗位职责：\n1. 负责国外主流媒体平台整体运营规划，包括但不限于TikTok、YouTube、Instagram、Facebook、X 等平台；\n2. 根据业务发展方向制定平台运营策略、账号矩阵规划及阶段性增长目标；\n3. 深度研究各平台流量机制、推荐逻辑及内容生态，结合平台规则持续优化运营策略；\n4. 负责内容运营体系搭建，包括选题策划、内容方向、用户增长、互动运营及传播转化；\n5. 独立推进账号从0-1孵化及成熟账号增长，对账号数据结果负责；\n6. 定期分析平台数据及竞品动态，输出运营复盘及优化方案；\n7. 立账号运营标准及管理机制，降低平台风险，保障账号稳定运营。\n\n二、任职要求：\n\n1. 大专及以上学历，3年以上国外主流媒体平台运营经验；\n2. 熟悉TikTok、YouTube、Instagram、Facebook、X等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知；\n3. 具备成熟账号操盘经验，有成功案例或账号增长成果优先；\n4. 具备较强的数据分析及运营复盘能力，能够通过数据驱动内容及运营优化；\n5. 对热点趋势、内容传播及用户心理有较高敏感度；\n\n加分项：\n1. 有百万级曝光或成熟账号矩阵运营经验；\n2. 熟悉各个平台的成人内容账号起量手法/运营逻辑和安全风险规避，有可验证的成功的账号最佳\n3. 熟悉短视频内容运营及投流逻辑；\n4. 具备基础视频剪辑、内容策划或达人合作经验。\n最好是有短剧或者影视新媒体账号运营经验的女生会使用剪辑软件网感也要好的", "cat": "运营"}, {"id": "340", "title": "美术（专门作图）", "salary": "10-20k", "location": "未明确", "jd": "岗位职责\n1.根据剧本、角色设定、分镜及视觉参考，使用AI生图工具完成角色、场景、服装、道具等资产图与宣发物料周边的生成与制作。\n2.根据不同项目风格和内容需求，选择合适的模型、参考图、Prompt及生成方式，输出符合项目要求的高质量视觉资产。\n3.负责AI生成图片的筛选和质量把控，从人物美感、构图、比例、光影、色彩、服装、材质及风格一致性等维度判断素材可用性。\n4.持续维护角色、场景、服装、道具及风格资产库，保证同一角色和同一项目下视觉风格、人物特征及整体质感统一。\n5.针对人物崩脸、手部异常、结构错误、服装穿帮、背景异常、风格漂移等问题持续调整Prompt、参考图及生成参数，提高资产一次通过率。\n6.与AI生图师、导演、编剧、剪辑等团队协作，根据项目需求快速调整视觉方案，并沉淀高质量资产模板和生成规范。\n任职要求\n大专及以上学历，美术、视觉设计、动画、数字媒体、影视制作等相关专业优先。\n1年以上AI生图、视觉设计、插画、原画或相关内容制作经验，有能够体现审美能力和AI生成能力的作品集。\n熟悉主流AI生图工具，能够熟练使用参考图、Prompt、局部重绘、图生图等方式完成资产生成。\n具备较高的视觉审美和画面判断能力，对人物五官、身材比例、服装搭配、构图、光影、色彩及整体质感有较强把控能力。\n能够快速识别AI图片中的人物漂移、结构错误、比例异常、风格不统一等问题，并通过调整生成方案进行优化。\n具备较强的风格理解和复刻能力，能够根据参考图快速还原指定美术风格，并保持批量素材的一致性。\n工作细致、耐心、责任心强，能够适应较快的内容生产节奏及一定规模的批量资产生成任务。\n加分项\n• 熟悉ComfyUI、Stable Diffusion、Flux、Midjourney等AI生图工具及相关工作流。\n• 熟悉LoRA、ControlNet、IP-Adapter、局部重绘、姿态控制、角色一致性等生成方法。\n• 有AI短剧、AI漫画、广告、游戏或内容平台资产批量生产经验。\n• 有较强的人像审美，尤其擅长人物脸型、五官、发型、服装、妆造及角色整体视觉包装。\n• 能够沉淀Prompt、工作流、模型、参数和参考图模板，提高团队批量生产效率。", "cat": "设计"}, {"id": "341", "title": "项目管理助理", "salary": "10-15K", "location": "JD有更新", "jd": "只要女\n最好有互联网行业项目经验，如果在国外最好，不要菲律宾、柬埔寨这些地方，不要BC、币圈行业的\n岗位定位：协助推进重点项目监督、公司内部管理建设反馈。该岗位不是单纯文职助理，需要具备项目跟进、问题识别和管理反馈能力，能够在复杂事项、多部门协作和高压节奏下，持续推动问题闭环并向管理层输出有效建议。\n\n一、岗位职责\n\n1. 重点项目跟进与监督\n\n负责公司重点项目的进度跟踪，建立项目台账，明确项目节点、责任人、完成状态及异常事项；\n跟进项目推进过程中的延期、阻塞、责任不清、资源冲突等问题，及时预警并推动升级处理；\n对项目过程中的问题进行持续追踪，确保每个问题有负责人、有反馈、有结果、有闭环。\n\n2. 内部管理建设与问题反馈\n\n协助GM关注公司内部管理流程、人员协作、部门配合及组织运转中的问题；\n收集并分析项目推进、人员协作、流程执行中的异常情况，识别管理漏洞和协同低效问题；\n对内部管理问题进行归纳整理，形成结构化反馈，并提出可执行的优化建议以及反馈风险和问题。\n\n3. 其他\n\n定期输出项目进展汇报、管理问题反馈、专项复盘报告、数据简报等材料；\n协助领导处理临时性、突发性、跨部门专项任务，保证事项推进效率；\n沉淀项目案例、管理问题案例及优秀处理经验，形成可复用的管理资料。\n\n二、任职要求\n\n1.本科及以上学历，项目管理、人力资源管理、行政管理、工商管理、企业管理等相关专业优先，女性优先。\n2.3年以上项目管理、总助、管理助理、运营管理或组织管理相关经验。\n3.有全盘项目跟进、管理机制建设、跨部门协调经验者优先。\n4.具备较强的项目推进能力，能够盯节点、追进度、抓问题、要结果。\n5.具备一定管理视角，能够发现公司内部流程、人员协作、责任分工中的问题，并提出改善建议。\n6.具备较强的沟通协调能力，能够面对多部门、多角色沟通场景，推动复杂事项落地。\n7.具备较强抗压能力和责任心，能适应节奏快、变化多、临时事项较多的工作环境。\n8.具备较强的信息整理和结构化表达能力，能够独立完成汇报材料、项目台账、会议纪要和管理反馈报告。\n9.熟练使用 Google Workspace 办公工具，如 Google Docs、Google Sheets、Google Slides 等。\n10.熟悉AI工具使用，能够借助 AI 提升资料整理、数据分析、汇报输出和流程梳理效率。\n\n三、加分项\n\n1.有总经理助理、PMO、项目运营、组织发展经验者优先。\n2.有互联网公司、中大型团队、跨部门项目管理经验者优先。\n3.能独立输出高质量管理汇报、项目复盘、问题分析报告者优先。\n\n四、候选人画像\n\n1.希望候选人不是普通执行型助理，而是具备一定管理判断力和项目推进能力的人。\n2.最好做过总助、全盘管理支持、或项目管理岗位，能理解公司内部运转逻辑，能看出问题，也敢于反馈问题。\n3.需要人聪明、成熟、抗压、嘴严、细致，有责任心，不能只会传话和记录，而是要能主动跟进、判断轻重缓急、推动问题解决，并能向管理层提供有价值的管理反馈。", "cat": "职能"}, {"id": "342", "title": "高级白帽SEO优化专员", "salary": "18–20K", "location": "远程招聘｜高级白帽SEO优化专员\n工作方式：远程办公", "jd": "远程招聘｜高级白帽SEO优化专员\n薪资待遇：18,000–20,000元人民币/月\n工作方式：远程办公\n一、岗位职责\n负责多个网站的 Google、Yandex SEO优化，制定优化计划，提升有效收录、关键词排名及自然搜索流量。\n使用 GSC、GA4、Yandex Webmaster 等工具开展巡检，结合抓取数据、访问日志及网站改动记录，排查流量下降、收录异常和爬虫访问问题。\n负责技术SEO优化，包括 Robots、Sitemap、Canonical、Noindex、状态码、重定向、URL、分页、结构化数据及HTML输出，定位问题并推动修复。\n开展关键词研究、竞品分析及内链优化，治理低价值Tag、分类页和重复页面，协同运营提升内容质量，开展白帽外链建设。\n参与域名迁移、多域名管理、新站及网站改版，制定SEO规范，跟进重定向、索引及流量变化。\n独立编写SEO需求，明确问题证据、修改建议及验收标准，协调技术团队完成开发、测试服验收、正式服复查和效果验证。\n二、任职要求\n3年及以上Google SEO实操经验，独立负责过完整项目，能够提供可核验的优化案例及成果。\n熟练使用GSC、GA4及常用抓取工具，理解抓取、渲染、索引和页面规范化，具备独立的数据分析及复杂问题排查能力。\n能阅读基础 HTML、CSS、JavaScript，理解HTTP、页面渲染、URL路由、缓存及CDN，能够与开发准确沟通并验证修改结果。\n具备内容站、关键词布局、Tag及聚合页优化经验，能够根据页面质量和数据表现制定方案。\n坚持白帽方法，具备需求编写、项目推进和远程协作能力，能够独立安排任务并跟进落地。\n加分项： 有Yandex、大体量内容站、域名迁移、日志分析或Python自动化经验。\n三、应聘资料\n请提供简历及 1–2个代表性SEO案例，说明项目问题、本人贡献、优化措施及结果，可附脱敏数据、需求文档或验收记录。", "cat": "运营"}, {"id": "343", "title": "运营专员", "salary": "8-15k", "location": "未明确", "jd": "岗位职责\n1. 负责指定网站或 App 的日常运营，跟踪 DAU、MAU、新增、留存、流量来源和内容表现，输出经营简报。\n2. 组织内容更新、专题活动、首页推荐和站点巡检，发现访问、播放、链接、评论及页面展示异常并推动处理。\n3. 分析数据波动，区分搜索、直连、推荐等来源变化，提出调整方案并跟踪结果。\n4. 与产品、技术、SEO等团队协作，明确需求、验收标准和完成时间，推动问题闭环。\n5. 指导编辑执行内容标准，开展抽检、反馈和复查。\n\n**任职要求**\n\n1. 具备网站或 App 运营经验，能够独立负责一个项目的日常运营。\n2. 熟悉 GA4、BI 或同类数据工具，能完成基础的数据对比、异常定位和复盘。\n3. 理解内容质量、访问链路、搜索流量和产品体验对业务指标的影响。\n4. 具备较强的执行、沟通和问题跟进能力，能清楚区分“已提出、推进中、已上线、已验收”。\n\n**考核关注**\n\n负责项目的数据稳定性、问题闭环率、内容质量、需求落地情况及复盘质量。", "cat": "运营"}, {"id": "344", "title": "编辑专员", "salary": "8-12k", "location": "JD有更新", "jd": "带作品，包含  标题、文案、关键词、标签以及图片视频处理前和处理后的\n岗位职责\n1. 根据选题和资料分工，完成素材整理、标题撰写、封面选择、正文排版、关键词及标签填写，并按规范发布内容。\n2. 检查图片、视频、链接和页面展示效果，发现无法播放、跳转错误或内容缺失等问题及时反馈。\n3. 配合热点内容更新、专题整理、合集维护及基础宣发工作。\n4. 遵守内容审核标准与发布流程，完成修改意见的落实和复查。\n\n**任职要求**\n\n1. 具备基本的文字表达、信息检索和图片处理能力，能熟练使用PS/PR等常见办公工具。\n2. 做事细致，能够按标准检查标题、封面、排版、标签和素材质量。\n3. 对热点内容有一定敏感度，愿意学习内容运营和数据基础知识。\n4. 有内容编辑、社区运营或短视频相关经验者优先；优秀应届生亦可。\n\n**岗位成长方向**\n\n熟练掌握内容制作与审核标准后，逐步承担独立选题、合集策划、质量复审和新人带教工作。\n\n岗位要求：带作品，包含  标题、文案、关键词、标签以及图片视频处理前和处理后的", "cat": "其他"}, {"id": "345", "title": "编辑专员", "salary": "8-12k", "location": "未明确", "jd": "任职要求：\n1.有1年以上内容运营经验，或具备独立运营网站/社媒账号的能力（社交媒体方向优先）；\n2.对成人类内容有一定了解，老司机优先；\n3.有剪辑经验，熟练使用 Pr / Ps 等工具；\n4.有文案经验，文字功底，能独立完成标题、内容文案撰写者\n\n岗位职责：\n1.负责网站内容的收集、撰写、剪辑及日常发布；\n2.具备良好的沟通能力，思维灵活、逻辑清晰；\n3.密切关注社交媒体热榜，快速响应热门内容、话题；", "cat": "其他"}, {"id": "346", "title": "资料员", "salary": "8-12k", "location": "未明确", "jd": "【岗位职责】\n1. 负责在X（Twitter）、TG、OnlyFans、论坛等平台搜集成人内容、热点资讯及相关素材，持续拓展资源渠道。\n2. 完成视频、图片的下载、筛选、去重及分类归档，检查素材清晰度与完整性，准确添加标题、标签及来源信息。\n3. 持续跟踪网络热点，及时整理和提交热门素材，保障内容更新的时效性。\n4. 维护资源库及渠道清单，配合编辑、运营完成素材分发与补充，提高资源利用效率。\n【任职要求】\n1. 大专及以上学历，具有1年以上相关工作经验，有内容采集、资源整理或内容运营经验者优先。\n2. 能够适应成人内容审核与整理工作，熟悉X、TG、OnlyFans、MyFans、Fansly等平台，具备丰富、稳定的资源渠道者优先。\n3. 熟练使用素材下载、检索及整理工具；掌握Python、八爪鱼等采集工具者优先。\n4. 对热点和内容时效敏感，具备基本的素材质量判断及分类整理能力。\n5. 执行力强，工作细致、有耐心，能够稳定完成重复性任务，具备良好的沟通与协作意识。", "cat": "其他"}, {"id": "347", "title": "AI内容创作", "salary": "12-25K", "location": "未明确", "jd": "岗位职责\n\n1. 负责品牌日常短视频、活动节点、专题宣传物料的 AI辅助剪辑、包装、调色、字幕及多版本导出；\n2. 独立承接 漫改二创、动漫混剪、剧情重组、氛围感卡点类视频 的全流程制作，并结合 AI 工具提升效率与表现力；\n3. 配合运营理解脚本意图，自主优化镜头节奏、转场、字幕、配乐及视觉包装，提升成片质感和完播体验；\n4. 结合 AI 工具完成 素材扩展、局部补帧、动态处理、封面优化、文案/字幕辅助生成 等工作；\n5. 统一品牌矩阵视频的视觉风格、配色、包装与模板规范，保持系列内容高级质感和一致性；\n6. 搭建并维护素材库、模板库、封面规范及 AI 剪辑工作流，沉淀可复用 SOP，提升团队整体交付效率；\n7. 跟踪播放、点击、互动等数据，持续优化剪辑节奏、封面风格和二创叙事逻辑；\n8. 适配业务紧急需求，快速产出热点专题、限时活动、深夜专区等高质感 AI 视频内容。\n\n二、任职要求\n\n1. 3年以上视频剪辑/后期相关经验，有短视频、二创、漫改、娱乐内容方向经验优先；\n2. 熟练使用 PR、AE、剪映 等剪辑工具，具备较强的节奏把控、调色、动态字幕、视觉包装和特效合成能力；\n3. 具备 AI 视频相关实操经验，能够使用 AI 工具辅助完成 视频生成、素材处理、字幕配音、封面优化、剪辑提效；\n4. 熟悉漫改二创、动漫素材拆解、情绪卡点、剧情重组、同人改编等内容表达方式；\n5. 具备较强审美和镜头语言认知，能独立把控画面质感、内容氛围和平台适配效果；\n6. 可独立完成从素材整理、粗剪、精剪、包装、字幕、封面到多规格导出的完整流程；\n7. 执行力强、抗压性高，适应快节奏和多任务并行交付；\n8. 有 AI 剪辑工作流搭建、模板沉淀、批量内容生产经验者优先；\n9. 有品牌矩阵统一风格管理、二创赛道经验或沉淀过视频 SOP 规范者优先。", "cat": "AI / AIGC"}, {"id": "348", "title": "中高级AI短剧编剧", "salary": "12K–25K", "location": "未明确", "jd": "岗位JD：\n一、岗位职责\n1、原创博主IP短剧开发\n基于公司现有博主形象、人设及内容资产，完成世界观、人物关系、核心冲突和故事主线设计，开发具有鲜明辨识度、可持续连载和商业化潜力的原创短剧。\n2、热点IP改编与二次创作\n持续研究热门小说、影视剧、短剧及社会热点，提炼其中具有传播潜力的题材、人物和情节，在版权及平台合规范围内进行本土化、短剧化和差异化改编。\n3、完整剧本创作\n独立完成故事提案、人物小传、分集大纲及逐集剧本，强化开场钩子、矛盾升级、情绪刺激、反转节点和结尾悬念，确保内容符合短剧观看节奏及AI制作条件。\n4、建立剧本选题与评审机制\n从用户需求、内容差异化、制作难度、传播潜力和商业价值等维度评估选题，建立立项、评审、修改和定稿标准，提高优质剧本的筛选效率和落地成功率。\n5、筹建剧本库及资产管理体系\n建立原创、改编、储备剧本的分类体系，实现剧本资产的统一管理和复用。\n6、梳理剧本生产SOP\n搭建“选题研究—创意提案—大纲评审—剧本创作—定稿交付—成片复盘—数据反馈”的工作流程，沉淀创作模板、审核标准和质量检查清单。\n7、推动剧本落地与持续迭代\n与AI制作、剪辑、运营及产品团队协作，根据制作可行性优化场景、人物和情节设计；结合播放、完播、互动及付费数据复盘内容表现，持续调整创作方向。\n\n二、任职要求\n1、具备5年以上短剧、网文、影视剧、互动内容或相关领域的策划与编剧经验，有成熟作品或商业化项目案例。\n2、具备原创开发和改编能力，能够从零搭建人物与故事体系，也能将长篇小说、影视内容或热点题材重构为快节奏短剧。\n3、熟悉华人男性用户的内容偏好，能够准确把握冲突、悬念、反转、爽点和情绪价值，并将其转化为可持续连载的剧情。\n4、具备较强的系列化创作能力，能够统筹人物成长、故事主线、单集钩子和阶段性高潮，避免剧情同质化或简单套用模板。\n5、了解AI视频生产的基本特点，能够兼顾人物一致性、场景复杂度、制作成本和镜头实现难度，确保剧本具有实际可制作性。\n6、具备剧本库、内容资产或创作流程建设经验，能够承担标准制定、质量审核和方法论沉淀，不局限于单纯完成写稿。\n7、具备良好的数据意识和跨团队协作能力，能够根据用户反馈及产品数据快速调整剧本，并推动内容顺利进入制作环节。", "cat": "AI / AIGC"}, {"id": "349", "title": "视频剪辑师", "salary": "10k-15k", "location": "现有人力无法兼顾高品质日常剪辑、二创稳定交付，需补充剪辑 1 名，统一内容风格、把控成片质量，保障多赛道高效交付。", "jd": "岗位JD描述\n一、岗位职责\n1.负责品牌日常短视频、活动节点、专题宣传物料的剪辑、视觉包装、调色精修及多版本导出；\n2.承接AI素材加工、二创、同人混剪、人物剧情重组、氛围感卡点视频剪辑制作\n3.配合运营拆解脚本意图，优化镜头节奏、转场配乐、字幕版式，把控成片质感与完播体验；\n4.统一全品牌视频视觉配色、包装体系与风格规范，保持系列内容高级质感与统一性；\n5.搭建分类素材库、剪辑模板与封面规范，沉淀复用流程，提升团队交付效率与标准化；\n6.参考视频播放、点击率、互动数据，迭代剪辑节奏与封面风格；\n7.适配业务紧急需求，快速产出深夜专区、限时活动、热点专题等高质感宣传剪辑物料。\n\n二、任职要求\n1.3年以上专业视频剪辑经验，有娱乐社群、信息流、IP同人二创剪辑经验优先；\n2.精通PR/AE，熟练使用剪映，具备专业调色、动态包装、特效合成能力，可独立高质量完成剪辑出片；\n3.具备相关剪辑作品集，擅长镜头解构、剧情重组、情绪卡点，有较强节奏把控与数据意识；\n4.网感审美在线，熟悉平台内容调性、热门玩法，可基于现有素材完成IP二次改编剪辑；\n5.能够利用AI输出素材进行视频加工剪辑，拒绝简单粗暴素材拼接；\n6.沟通协作顺畅，可多任务并行，接受高频迭代、排期管理与节点加急产出；\n7.有素材库搭建、剪辑模板沉淀、内容SOP标准化经验者优先。", "cat": "内容"}, {"id": "350", "title": "AI陪伴产品运营（AI女友方向）", "salary": "12K-18K", "location": "未明确", "jd": "岗位JD描述\n一、岗位职责\n1.负责成人向AI女友陪伴产品的整体运营，参与产品定位、目标用户分析、运营策略制定及上线冷启动，推动产品从0到1落地；\n2.围绕用户情感陪伴和成人互动需求，规划AI女友角色矩阵，包括人设、关系定位、对话风格、故事背景、互动场景及内容更新节奏；\n3.设计用户从注册、首次对话、关系升级到付费转化的完整运营路径，优化新用户激活、互动频次、次日及长期留存；\n4.策划会员订阅、虚拟礼物、剧情解锁、角色权益、限时活动等商业化玩法，持续提升付费率、客单价及用户生命周期价值；\n5.结合用户对话反馈和行为数据，协同产品及AI团队优化角色Prompt、回复质量、长期记忆、情绪反馈和内容丰富度，改善陪伴真实感与沉浸体验；\n6.搭建产品核心数据指标及复盘机制，持续跟踪注册转化、首聊率、互动轮次、留存率、付费率、ARPPU等指标，通过用户分层和A/B测试推动运营迭代；\n7.建立用户反馈、核心用户维护、流失召回及投诉处理机制，识别高价值用户需求，沉淀可复用的用户运营策略；\n8.负责竞品研究及行业趋势跟踪，持续分析AI陪伴、虚拟恋人、成人社交等产品的内容形态、商业模式及运营玩法；\n\n二、任职要求\n1.3年以上互联网产品运营、用户运营或内容运营经验，有AI陪伴、虚拟社交、聊天交友、互动娱乐、游戏或付费内容产品经验者优先；\n2.了解AI大模型及对话类产品的基本逻辑，能够参与角色Prompt、人设规则、对话效果及互动流程的配置、测试和优化；\n3.具备较强的用户洞察和内容策划能力，能够理解男性用户在情感陪伴、虚拟关系及成人互动场景中的核心需求；\n4.具备完整的用户增长和商业化思维，熟悉“拉新—激活—留存—付费—召回”运营链路，能够独立设计付费转化方案；\n5.数据敏感度较高，能够独立搭建指标体系、分析转化漏斗，并根据数据和用户反馈提出明确的优化方案；\n6.具备较强的文案及角色内容策划能力，能够独立完成人设、对话场景、关系成长线和活动方案设计；\n7.具备从0到1推进新产品或新项目的经验，目标意识强，能够主动拆解任务并推动跨部门协作落地；\n8.关注AI应用及成人内容行业发展，对新产品、新玩法和用户趋势保持敏感，能够接受成人向业务形态；", "cat": "AI / AIGC"}, {"id": "351", "title": "中高级运营专员（偏社区产品方向）", "salary": "12-16k", "location": "未明确", "jd": "岗位JD描述\n岗位职责：\n1、参与社区产品的运营规划和迭代优化，并全盘负责产品日常维护。\n2、每日/每周监控内容发布后的核心数据。\n3、运用AI工具制作和统计基础的数据报表，能够发现数据异常。\n4、对热点敏感，知道平台用户喜欢看什么。\n5、配合其他岗位，完成活动任务或其他即时性任务。\n\n任职要求：\n1. 至少2年以上社区类、视频web类产品运营经验。\n2. 熟练使用AI工具及常用办公软件。\n3. 不抗拒看数据，能从枯燥的数据中发现问题。\n4. 需要具备良好的执行力、观察力，以及一定的抗压能力。", "cat": "运营"}, {"id": "352", "title": "创作者运营", "salary": "12k-18k", "location": "未明确", "jd": "简历筛选要点：\n1. 有影视类从业经验优先\n2. 具备有实际拍摄/导演/剧本策划经验和能力\n3. 有过往案例可查阅\n\n岗位JD描述\n一、岗位职责：\n1. 对已入驻的创作者，完成“冷启动”引导；\n2. 建立A/B/C多级创作者画像，制定差异化的扶持政策和激励方案；\n3. 引导创作者生产符合自身定位和平台调性的高质内容，有实际拍摄和剧本策划经验和能力；\n4. 解答创作者日常疑问，协助调查创作者违规情况，建立平台忠诚度；\n5. 收集创作者对创作工具、运营措施的需求，推动创作者生态搭建。\n\n二、任职要求：\n1. 3年以上影视类创作者运营&孵化经验，有MCN机构经历者优先；\n2. 极强的沟通协调能力，对创作者进行日常维护；\n3. 适应高强度节奏，能接受“管家式”服务属性。", "cat": "运营"}, {"id": "353", "title": "中高级运营专员", "salary": "12k-15k", "location": "未明确", "jd": "简历筛选要点：\n1. 有视频站、短剧从业经验\n\n岗位JD描述\n一、岗位职责\n1. 负责成人视频产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n5. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n6. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进。\n\n二、任职要求\n1. 3年以上互联网运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有成人内容、成人社区、成人产品或相关泛娱乐场景运营经验者优先。", "cat": "运营"}, {"id": "354", "title": "运营专员（动漫方向）", "salary": "12k-15k", "location": "未明确", "jd": "简历筛选要点：\n1. 有二次元平台从业经验\n\n岗位JD描述\n一、岗位职责\n1. 负责成人二次元产品整体运营工作，围绕内容运营、用户运营、创作者运营及商业化转化制定并推动执行运营策略；\n2. 结合产品阶段目标，负责核心指标拆解与日常跟进，包括内容供给、用户活跃、留存、付费转化、营收等关键数据；\n3. 负责平台内容生态搭建与优化，提升内容丰富度、更新节奏、用户消费意愿及整体内容质量；\n4. 负责用户运营体系建设，围绕拉新、促活、留存、转化等环节策划并落地具体运营动作；\n5. 结合业务数据持续进行分析复盘，发现问题并推动策略优化，提升整体运营效率与业务结果；\n6. 协同产品、技术、内容、设计等相关团队，推动重点需求落地，保障新产品上线及后续运营节奏稳定推进。\n\n二、任职要求\n1. 3年以上二次元平台运营经验，内容运营、用户运营、增长运营方向优先；\n2. 具备完整项目运营经验，能够独立执行推进到数据复盘的全流程工作；\n3. 对数据敏感，具备较强的数据分析能力，能够进行指标拆解、效果评估及策略迭代；\n4. 具备较强的内容判断能力和用户洞察能力，有提升转化、留存或活跃的实际案例；\n5. 具备良好的跨部门协同推动能力，能够联动产品、技术、内容等团队高效配合；\n6. 结果导向强，执行力强，能够适应高节奏业务环境，并对业务结果负责；\n7. 有成人二次元产品或运营经验者优先。", "cat": "运营"}, {"id": "355", "tit
