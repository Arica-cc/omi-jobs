: "岗位：产品经理（中高级/高级 · 流量方向）｜HC 1\n\n岗位职责\n1、负责内容流量类 Web 产品矩阵（漫画、视频、资讯等多站点）核心模块的规划与迭代，对自然流量增长、搜索收录与排名、用户留存及广告变现等核心指标负责。\n2、主导 SEO 类需求的产品化落地：站内结构与页面模板优化、聚合页与内链体系、收录与状态码治理等，与 SEO 团队协作制定并推进增长方案。\n3、参与广告变现体系设计与迭代：广告版位规划与配置、变现效率优化，兼顾用户体验与收益平衡。\n4、基于数据分析、用户行为与竞品洞察，挖掘流量增长与商业化机会，推动产品创新。\n5、搭建产品关键指标体系，通过漏斗分析、A/B 测试及分层运营持续优化转化与留存。\n6、独立负责需求全流程：需求梳理、原型设计、评审排期、测试验收、上线复盘，多产品线并行推进。\n7、跨团队（研发、设计、SEO、运营、商业化）协同推动项目高质量落地，对产品经营结果负责，定期复盘并制定增长策略。\n\n任职要求\n1、本科及以上学历，3 年以上互联网 C 端产品经验；5 年以上且有独立带线经验者按高级评估。\n2、具备完整产品生命周期管理经验，独立负责或主导过日活 10 万以上量级的 Web/内容类 C 端产品，并取得可量化的流量增长、留存或商业化成果；主导过日活 30 万以上产品且有完整增长案例者优先。\n3、产品背景不限于内容站，资讯、漫画、视频、工具导航、社区等以自然流量为主的 to C 产品经验均可。\n4、熟悉 SEO 与自然流量增长机制（收录、排名、站内结构、内容聚合、多站点矩阵），有可验证的实操成功案例者优先。\n5、理解广告变现模式（展示广告、联盟、直客版位）及会员订阅、增值服务等付费场景设计。\n6、数据驱动，熟练运用数据分析、A/B 测试与漏斗模型发现问题、验证假设并指导决策；逻辑清晰，结构化思维能力强。\n7、具备出色的 0-1 落地与实操能力，原型与需求文档功底扎实，入职一周内可独立接手需求，即到即战。\n8、能适应多产品线并行的工作节奏，兼具单线深耕与多项目统筹、优先级管理能力；工作时间可配合覆盖平日晚间及周六时段。\n9、工作效率高，具备较强的创业精神与业务推动力，能在快速变化、资源有限的环境下持续创造价值。\n10、熟悉简中互联网内容生态与用户心智；对站群运营、程序化 SEO、AI 辅助内容生产等方向有理解者优先。", "cat": "产品与管理"}, {"id": "378", "title": "ai内容编辑（AI短剧内容）", "salary": "15k-25k", "location": "", "jd": "AI短剧内容岗位 JD\n一、岗位职责\n1、负责 AI 短剧内容的选题策划、剧情创作及内容生产。\n2、根据用户需求及市场热点，挖掘高潜力短剧题材，持续产出新选题。\n3、使用 AI 工具完成剧本大纲、人物设定、分集剧情、对白及分镜脚本等内容。\n4、负责 AI 短剧从选题、剧本、素材生成到成片包装的内容流程。\n5、持续研究热门短剧、短视频及 AI 内容趋势，拆解爆款内容的剧情结构和用户吸引点。\n6、根据播放量、点击率、完播率、互动率等数据，对短剧内容进行复盘和优化。\n7、沉淀 AI 短剧提示词、人物设定、剧情模板、素材模板等内容资产，提高团队生产效率。\n8、配合团队完成短剧内容批量生产及账号内容运营。\n\n二、岗位要求\n1、具备短剧、短视频、影视编剧、内容运营、等相关经验。\n2、对短剧内容有较强敏感度，能够快速判断题材是否具有吸引力。\n3、具备较好的剧情创作能力，能够设计人物关系、剧情冲突、悬念及反转。\n4、熟练使用 ChatGPT、Claude、Gemini 等 AI 工具，有较强的 AI 内容生产能力。\n5、了解 AI 图片、AI 视频、AI 配音等内容生成工具。\n6、具备较强的执行力和内容产出能力，能够适应批量化、高频率内容生产。\n7、有较强的学习能力，能够快速掌握新的 AI 工具及内容生产方式。\n\n三、加分项\n1、有 AI 短剧、AI 漫剧、AI 视频相关项目经验。\n2、有短剧编剧、短视频编剧或爆款短视频内容创作经验。\n3、熟悉即梦、可灵、Runway、Veo、海螺等 AI 视频工具。\n4、熟悉 Midjourney、Flux、Stable Diffusion 等 AI 图片工具。\n5、熟悉剪映、Premiere 等视频剪辑工具。\n6、有成熟的 AI Prompt、剧本模板或批量内容生产方法。\n7、有成功爆款案例，能够提供作品或数据证明。\n8、有从 0 到 1 搭建短剧内容项目经验。\n\n四、我们希望你具备\n\n1、内容能力：能够发现题材、设计剧情、制造冲突，知道什么内容能够吸引用户继续看。\n2、AI能力：不只是会使用 AI 聊天工具，而是能够真正将 AI 应用到选题、剧本、画面、配音、剪辑等内容生产环节。\n3、执行能力：能够快速将一个想法落地成完整内容，不拖延、不依赖他人推动。\n4、数据能力：能够通过播放、点击、完播、互动等数据判断内容好坏，并根据数据快速迭代。\n5、创新能力：能够持续尝试新的题材、人物设定、剧情结构和 AI 表现形式。\n6、结果导向：以内容产出效率和实际数据结果为核心，而不是单纯完成任务。", "cat": "内容与创作"}, {"id": "379", "title": "AI内容编辑（AI短剧编剧）", "salary": "12K–15K", "location": "", "jd": "AI短剧编剧（AI Screenwriter）\n\n岗位职责\n根据小说开发稿完成影视剧本开发，将小说内容转化为符合短剧及 AI 短剧制作规范的剧本。\n完成剧本结构调整、场次拆分、剧情压缩、节奏优化及对白改编，保证故事适配短剧叙事节奏。\n根据影视表达需求调整人物行为、剧情逻辑及场景设置，提高镜头表现力及拍摄可执行性。\n与导演共同完成故事板开发，参与剧本可视化设计，完成镜头拆解前的剧本优化工作。\n控制单集节奏、信息密度及剧情推进，合理安排高潮、反转、情绪节点及集尾悬念。\n根据导演及制作团队反馈持续优化剧本内容，确保剧本质量满足制作要求。\n\n任职要求\n熟悉影视剧本创作规范，能够独立完成小说向剧本的影视化改编，理解剧本与小说在叙事方式、节奏控制及镜头表达上的差异。\n熟悉场次拆分、戏剧冲突、人物动机、剧情节拍、对白设计及连续剧结构，能够根据镜头语言优化剧情推进及人物行为。\n具备较强的剧本可执行性意识，能够充分考虑场景转换、人物调度、制作成本及 AI 制作特点，提高剧本落地效率。\n能够与导演共同完成故事板开发，根据镜头设计持续调整剧本结构及对白节奏，提高剧本的视觉表达能力。\n有影视剧、动画、短剧、漫画编剧经验，熟悉 AI 内容创作流程者优先。\n\n优先考虑\n有影视编剧经验；\n有短剧剧本创作经验；\n有动画、漫画改编经验；\n熟悉 AI 剧本开发流程；\n熟悉导演工作流程及镜头语言。", "cat": "内容与创作"}, {"id": "380", "title": "AI内容编辑（AI短剧导演）", "salary": "15K–18K", "location": "", "jd": "AI短剧导演\n\n岗位职责\n根据剧本完成故事板设计及镜头语言设计；\n与编剧共同进行故事板开发，完成剧本可视化；\n输出故事板、镜头表、机位设计、景别设计及镜头调度方案；\n制定人物调度、演员调度、场面调度及镜头运动方案；\n控制画面节奏、叙事节奏、情绪节奏及视觉重心；\n指导 AI 视频制作完成镜头落地，并进行镜头审核；\n完成精剪，优化节奏、转场、蒙太奇关系及镜头衔接；\n对整集内容的视觉表达及最终成片质量负责。\n\n任职要求\n能够独立完成剧本可视化，根据剧本输出专业故事板、镜头表及导演阐述，并具备完整的镜头设计能力。\n熟悉镜头语言、场面调度、人物调度、景别设计及镜头运动设计，能够合理运用构图法则、轴线原则、连续性剪辑及蒙太奇等影视语言完成视觉叙事。\n具备较强的画面节奏控制能力，能够根据剧情调整镜头节奏、情绪节奏及视觉重心，并完成成片精剪及最终质量把控。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro，具有动画、短剧、影视或 AI 内容导演经验者优先。", "cat": "内容与创作"}, {"id": "381", "title": "AI内容编辑（AI视频制作）", "salary": "15K–18K", "location": "", "jd": "AI视频制作（AI Production Artist）\n\n岗位职责\n\n根据导演输出的故事板及镜头表完成 AI 内容生产；\n建立角色一致性（Character Consistency）、场景一致性（Environment Consistency）及数字资产库（Asset Library）；\n完成角色生成、场景生成、图生视频、镜头动画及素材制作；\n搭建并优化 AI 制作工作流，包括提示词工程、参考图控制、节点式工作流及模型调用；\n完成视频粗剪（Rough Cut）、字幕、配音、音效及初版包装；\n配合导演完成修改意见，输出最终交付版本。\n\n任职要求\n熟悉 AI 内容生产流程，能够根据故事板独立完成角色生成、场景生成、图生视频及整集内容制作，并保证角色一致性、场景一致性及整体视觉风格统一。\n熟悉提示词工程、参考图控制、节点式工作流及 AI 工作流搭建，能够根据项目需求优化生成效率及画面质量。\n能够独立完成素材整理、粗剪、字幕、音效、基础包装等后期制作，并具备一定的问题排查及工作流优化能力。\n熟悉 ComfyUI、Flux、Midjourney、Runway、Veo、Kling、Seedance 等 AI 工具中的一种或多种，有完整 AI 短剧、AI 动画或 AI 漫剧制作经验者优先。\n\n熟悉以下 AI 工具（至少部分）\nComfyUI，Flux，Midjourney，Stable Diffusion，Veo，Kling，Seedance，Runway，Pika，Luma\n\n熟练使用Premiere Pro，DaVinci Resolve或其他非线软件", "cat": "内容与创作"}, {"id": "382", "title": "AI内容编辑（AI短剧后期剪辑师）", "salary": "12K–18K", "location": "", "jd": "AI短剧后期剪辑师\n\n岗位职责\n负责 AI 漫剧项目的后期制作，根据导演完成的精剪版本进行成片精修，在不改变导演叙事意图的前提下，进一步优化剪辑点、动作衔接、视听连续性及整体完成度；\n负责对白、配音、环境声、拟音、音效及音乐的声音编辑与混音处理，根据剧情节拍建立完整的声音层次、情绪推进及视听节奏；\n负责 AI 生成素材的后期修整，处理生成镜头中常见的跳帧、闪烁、动作断裂、时序不连续、画面抖动及镜头衔接问题，并通过变速、补帧、遮罩、跟踪、合成等方式提高镜头可用性；\n根据项目视觉规范完成基础调色、镜头匹配、曝光及色彩统一，保证不同模型、不同批次生成素材之间的视觉连续性；\n负责字幕、片头片尾、基础动效、转场及项目包装，并按照平台技术规范完成母版输出、版本管理及最终交付；\n与导演共同完成终剪审核，根据修改意见完成后期调整，对成片的技术质量、声音质量及最终包装完成度负责。\n\n任职要求\n具备完整的影视后期制作能力，能够理解导演的剪辑意图和叙事节奏，熟悉连续性剪辑、动作匹配、视线匹配、节奏剪辑、平行蒙太奇、交叉剪辑等剪辑逻辑，能够判断一个剪辑点成立的叙事原因，而不是单纯按照音乐节拍拼接素材。\n具备较强的声音设计意识，能够完成对白编辑、降噪、响度控制、环境声铺设、拟音、音效设计及音乐编辑，并能够利用声音桥、声画对位、声画同步等方式强化场景空间感、情绪及戏剧节奏。\n熟练使用 Premiere Pro、DaVinci Resolve 或 Final Cut Pro 中至少一种专业非线性剪辑软件；能够完成基础调色、遮罩、跟踪、变速、关键帧及简单合成。熟悉 After Effects、Fusion、Audition 等后期工具者优先。\n需要理解 AI 生成视频的素材特性，能够识别并处理人物动作连续性、口型同步、画面闪烁、时序一致性、角色漂移、背景形变等常见问题。有 AI 漫剧、动画、短剧、影视后期或商业内容制作经验者优先。\n不接受仅会使用剪映套模板、自动字幕、卡点及预设转场，但缺乏影视剪辑逻辑和声音设计能力的候选人。\n作品要求\n面试需提供至少一部能够体现完整后期能力的作品，并说明本人具体负责的工作范围。\n作品审核重点关注：叙事节奏、剪辑点选择、动作连续性、声音设计、音乐使用、镜头匹配及整体完成度，不以单纯的特效数量或包装复杂程度作为评价标准。", "cat": "内容与创作"}, {"id": "383", "title": "AI内容编辑（网络小说作家）", "salary": "8K–14K", "location": "", "jd": "网络小说作家\n\n岗位职责\n负责 AI 短剧项目的前期 IP 内容开发，根据项目方向完成题材调研、内容策划及小说改编工作；\n深度研究网络文学市场，持续分析热门题材、爆款作品及用户阅读偏好，总结不同题材的核心爽点、人物关系、剧情节奏及商业化规律；\n根据项目需求，对指定题材或已有内容进行二次创作、剧情扩写、结构重组及人物深化，形成适合影视开发的小说版本；\n建立完整的世界观设定、人物关系网、人物成长线及剧情主线，保证长线剧情逻辑统一；\n完成剧情节拍设计、情绪推进、反转、悬念、高潮、集尾钩子等商业化内容设计，提高内容吸引力及持续阅读体验；\n输出完整的小说开发稿，包括人物设定、世界观设定、故事简介、章节内容及完整小说版本，并交付编剧进行剧本开发；\n持续建立公司 IP 储备库，沉淀原创故事、人物设定及可持续开发的内容资产。\n\n任职要求\n深度阅读网络文学，熟悉男频、女频、都市、悬疑、玄幻、仙侠、系统、重生、无限流、恋爱、校园等主流题材，能够准确分析作品爆点及商业价值。\n具备成熟的长篇小说创作能力，能够围绕人物成长、剧情推进及情绪节奏完成剧情扩写、人物深化及系列化内容开发，保证故事具有持续吸引力。\n熟悉网络文学创作规律，能够设计爽点、打脸、升级、反转、修罗场、悬念、人物成长及章节留钩，并理解不同平台读者的阅读偏好。\n具有优秀的文字驾驭能力，能够独立完成中长篇小说创作，有签约网络小说作者、责编、内容编辑或成熟创作经验者优先。\n能够熟练使用 AI 辅助创作工具进行资料整理、世界观整理及内容辅助创作，但具备独立完成原创及改编内容开发的能力。\n\n优先考虑\n有签约网络小说作者经历；\n有百万字以上完结作品；\n有短剧、漫画、动漫、游戏剧情创作经验；\n有 IP 改编或影视化开发经验。", "cat": "内容与创作"}, {"id": "384", "title": "AI内容编辑（AI影视资产生成）", "salary": "12K–18K", "location": "", "jd": "AI影视资产生成\n\n岗位职责\n负责公司 AI 影视数字资产体系建设，根据项目需求持续开发可重复使用的角色资产、场景资产、道具资产、服装资产、载具资产及环境资产；\n建立统一的数字资产规范，包括角色设定、风格规范、命名规则、版本管理、资产分类及数字资产库维护，保证不同项目之间的资产可复用性及一致性；\n根据导演及制作团队需求完成影视场景搭建、角色开发、服装设计、道具开发及风格设定，为内容制作提供标准化资产支持；\n搭建 AI 资产生产工作流，建立角色一致性、场景一致性、风格一致性及参考图控制方案，提高内容生产效率；\n建立 AI 工作流模板、模型预设、提示词模板及节点式工作流，持续优化数字资产生产效率；\n配合 AI 视频制作团队完成资产调试、问题修复及资产迭代，保证资产在不同模型及不同项目中的稳定调用；\n持续沉淀公司数字资产库，建立可持续迭代的影视资产体系，为后续项目及资产商业化提供基础支持。\n\n任职要求\n\n熟悉影视美术设计流程，具备较强的角色设计、场景设计、服装设计及道具设计能力，能够建立统一的视觉风格及数字资产规范。\n熟悉 AI 数字资产开发流程，能够完成角色一致性、场景一致性、风格统一、参考图控制及数字资产标准化管理，并理解资产复用及模块化开发理念。\n熟悉提示词工程、节点式工作流、模型管理及参考图工作流，能够独立搭建高复用性的 AI 资产生产流程，并持续优化生成效率及资产质量。\n熟悉数字资产管理、版本管理及命名规范，能够建立完整的资产分类体系及数字资产库，具备良好的工程化思维及团队协作能力。\n熟悉 ComfyUI、Stable Diffusion、FLUX、Midjourney 等 AI 图像工具，理解 LoRA、ControlNet、IP Adapter 等一致性控制技术，有 AI 影视、AI 动画、游戏美术或数字资产开发经验者优先。\n\n优先考虑\n有 Technical Artist（TA）、Environment Artist、Character Artist、Concept Artist、Asset Artist 等相关工作经验；\n有游戏、影视、动画、数字孪生或虚拟制作项目经验；\n熟悉 Blender、Maya、Cinema 4D、Unreal Engine、Houdini 等数字内容创作工具；\n有大型数字资产库建设或团队资产管理经验；\n有 AI 工作流开发、模型训练或 LoRA 制作经验。", "cat": "内容与创作"}, {"id": "385", "title": "中级运营（app内容运营）", "salary": "12K–20K", "location": "", "jd": "岗位类型: 全职\n岗位职责\n1、产品内容规划与生产: 负责 App 内容运营的整体规划,围绕产品定位、版本节奏与用户需求,制定内容策略并主导内容(图文 / 短视频 / 专题 / 活动内容等)的选题、生产、审核与上线;\n2、内容体系搭建: 搭建并迭代内容分类、标签与展示排序体系,建立内容发布 SOP,保证内容有序生产与精准分发,持续提升内容曝光量、覆盖率与消费效率;\n3、内容驱动增长与转化: 通过内容优化用户的浏览、互动、停留与转化路径,配合活动与产品节点策划内容玩法,推动内容对活跃、留存及付费的正向拉动;\n4、数据驱动内容迭代: 建立内容数据看板,跟踪曝光、点击率、完播率、互动率、转化率等核心指标,做内容复盘与 AB 测试,定位选题 / 开头 / 结构 / 封面 / 分发环节的问题并持续优化,沉淀可复用的爆款内容模型;\n5、内容生态与协同: 统筹站内内容生态与社区氛围,协同产品、设计、技术推进内容相关的功能与体验优化;带教初级内容运营,制定并落地内容运营流程与规范。\n\n任职要求\n1、3 年以上内容运营经验,有完整的产品内容操盘经验(从选题策划到生产分发到数据复盘),并拿过可量化结果;\n内容敏感度高,懂用户、懂产品节奏,能精准把握目标用户的内容偏好与消费习惯;\n2、数据驱动,熟练做内容数据分析、AB 测试与效果复盘,能用数据指导内容策略迭代;\n3、熟悉内容分类 / 标签体系、内容分发机制与内容 SOP 的搭建;\n4、有社交和视频内容运营经验优先,理解目标用户心理与产品节奏;\n5、策略与执行力强、抗压、结果导向,能独立操盘产品内容线或核心内容模块,简历能体现可量化成果(曝光、互动、转化、内容产能等)。\n\n加分条件\n1、有从 0 到 1 搭建产品内容体系或内容规模化增长的操盘经验,进来即能独立推进;\n2、熟练短视频 / 图文内容制作(选题、脚本、剪辑、包装),会用剪映 / Canva / Figma 等工具;\n3、有团队管理 / 带教经验,能搭建内容团队与生产流程;\n4、熟悉内容精细化运营、内容与用户分层结合、内容驱动付费 / 会员转化的玩法。", "cat": "内容与创作"}, {"id": "386", "title": "AI Algorithm Engineer", "salary": "年薪20万美金内", "location": "可远程", "jd": "Responsibilities\n\n• Lead research, pre-training, optimization, and iteration of Vision Foundation Models, including Stable Diffusion, DiT, Vision Transformer (ViT), Segment Anything Model (SAM), CLIP, and other cutting-edge computer vision models.\n\n• Design and fine-tune vision models for business scenarios such as AI image generation, image editing, multimodal understanding, and intelligent visual applications.\n\n• Lead Supervised Fine-Tuning (SFT), Parameter-Efficient Fine-Tuning (PEFT), LoRA, ControlNet, Adapter tuning, and related optimization techniques.\n\n• Explore and improve generative model architectures and visual feature extraction networks to enhance image quality, stability, resolution, inference efficiency, and multimodal alignment.\n\n• Collaborate with engineering teams to deploy large-scale AI models into production and optimize inference performance through quantization, pruning, inference acceleration, memory optimization, and deployment tuning.\n\n• Continuously track the latest academic research, open-source projects, and industry trends in Computer Vision (CV), Multimodal AI, and Generative AI, rapidly transforming new technologies into business value.\n\nRequirements\n\nEducation\n• Bachelor's degree or above in Computer Science, Artificial Intelligence, Applied Mathematics, or related fields.\n\nTechnical Skills\n\n• Strong expertise in Vision Foundation Models and a deep understanding of Diffusion Models, Vision Transformers (ViT), MAE, and related architectures.\n\n• Experience participating in or leading the complete pre-training lifecycle of large-scale vision or multimodal models with hundreds of millions (or billions) of parameters.\n\n• Strong understanding of dataset construction, data cleaning, training stability, and large-scale model optimization.\n\n• Hands-on experience with AIGC technologies, including Text-to-Image, Image-to-Image, and multimodal generation.\n\n• Proficient in Python and C++, with strong experience using PyTorch and excellent source code reading and secondary development capabilities.\n\n• Familiar with distributed training frameworks such as DeepSpeed, Megatron-LM, and FSDP, with hands-on experience in multi-node, multi-GPU training and compute resource management.\n\nPreferred Qualifications\n\n• Publications in top-tier AI conferences such as CVPR, ICCV, ECCV, NeurIPS, or ICLR.\n\n• Active contributor to GitHub, Hugging Face, or other open-source AI communities.\n\n• High-ranking achievements in AI competitions such as Kaggle.\n\n• Experience with TensorRT, CUDA programming, and low-level operator optimization.\n\n• Experience with High Performance Computing (HPC) environments.", "cat": "技术开发"}, {"id": "387", "title": "AI短剧编剧（欧美出海方向）", "salary": "面谈", "location": "", "jd": "岗位职责\n1. 负责欧美出海短剧的选题策划、故事构思、人物设定及完整剧本创作；\n2. 结合欧美观众的文化背景和内容偏好，设计开篇钩子、剧情冲突、情绪爽点及付费卡点；\n3. 把控故事结构、人物关系、剧情节奏和单集信息密度，确保剧本适合短剧形式；\n4. 持续研究海外短剧平台的热门题材、爆款作品及市场趋势，输出可落地的内容方向；\n5. 根据项目数据、用户反馈及制作要求，持续优化剧本节奏和情节设置；\n6. 使用AI工具辅助完成资料调研、创意拓展、剧本分析及内容优化；\n7. 与制片、分镜、生成、剪辑及运营人员协作，推动剧本顺利进入制作环节。\n\n任职要求\n1. 具备短剧编剧、网络文学、影视剧本或相关内容创作经验；\n2. 具备完整的故事创作能力，能够独立完成人物设定、故事大纲、分集梗概及剧本；\n3. 熟悉强冲突、快节奏、高情绪密度的短剧创作方式；\n4. 了解欧美文化、审美偏好及内容消费习惯，对海外短剧市场有一定研究；\n5. 具备良好的英语读写能力，能够阅读英文资料、理解英文剧本；\n6. 能够熟练使用ChatGPT、Claude、Grok等AI工具辅助创作；\n7. 具备良好的沟通协作能力，能够根据制作要求及时调整剧本。\n\n优先考虑（加分项）\n1. 有欧美出海短剧、海外网文或ReelShort类项目经验；\n2. 有已上线短剧作品或完整项目经验；\n3. 熟悉海外短剧付费模式及卡点设计；\n4. 能够提供完整剧本、上线作品或过往项目案例。\n\n应聘资料\n请提供个人简历、代表作品及相关项目案例，并注明个人在项目中负责的具体内容", "cat": "内容与创作"}, {"id": "388", "title": "AI短剧生成师（画面生成方向）", "salary": "15K–18K", "location": "", "jd": "岗位职责\n1. 根据剧本和分镜要求，使用MiniMax、Seedance等AI工具生成短剧视频镜头；\n2. 完成人物定妆、场景设计、参考图制作及基础视觉风格确定；\n3. 负责图片和视频提示词设计、参数调试、任务生成及失败任务重做；\n4. 控制角色形象、服装、场景及画面风格的一致性；\n5. 发现并处理角色漂移、动作异常、画面失真、镜头穿帮等问题；\n6. 根据剪辑和质检反馈完成镜头返修、补帧、重生成及素材替换；\n7. 按照项目要求完成素材命名、分类、整理及交付；\n8. 记录生成数量、成功率、返修率、耗时及制作成本，配合优化生产效率；\n9. 与编剧、分镜、工作流工程师、剪辑及质检人员协作，确保项目按时交付。\n\n任职要求\n1. 熟悉MiniMax、Seedance等AI视频生成工具，具备实际生成经验；\n2. 熟悉主流AI生图工具，能够完成人物定妆、场景图及镜头参考图制作；\n3. 具备较强的提示词设计和参数调试能力；\n4. 能够理解剧本和分镜，并将文字要求准确转化为可用画面；\n5. 具备基础的镜头语言、构图、光影、色彩及视觉审美能力；\n6. 具备角色一致性和画面连续性控制意识；\n7. 执行力强，能够按照标准流程完成批量化生产任务；\n8. 具备良好的沟通能力，能够快速理解修改意见并完成返修。\n\n 优先考虑\n1. 有AI短剧、AI漫剧或批量视频生成经验；\n2. 熟悉ComfyUI基础操作及常用生图工作流；\n3. 熟悉Flux、SDXL、LoRA、ControlNet等模型或技术；\n4. 具备分镜设计、剪辑或影视制作经验；\n5. 能够提供AI生成短剧、人物定妆图、分镜或视频作品。\n\n应聘资料\n请提供个人简历及相关作品，并简要说明：\n常用的AI生图和视频生成工具；\n日常可完成的视频镜头数量；\n角色一致性及异常画面处理经验；\n个人在相关项目中负责的具体工作。", "cat": "内容与创作"}, {"id": "389", "title": "中级运营专员", "salary": "10K–20K", "location": "", "jd": "岗位职责\n1. 独立负责产品运营工作，包括产品规划、内容运营、用户运营、活动策划及商业化转化；\n2. 根据产品目标制定阶段性运营方案，拆解关键指标并推动执行落地；\n3. 持续跟踪新增、活跃、留存、内容消费及付费等核心数据，发现问题并提出优化方案；\n4. 负责用户路径、内容结构、会员权益及付费场景的分析与优化；\n5. 结合市场趋势、竞品动态和用户需求，提出产品迭代及新方向建议；\n6. 协调产品、技术、设计、内容及渠道等岗位，推动需求按计划上线；\n7. 建立运营SOP、数据看板及复盘机制，提升团队执行效率；\n8. 能够独立承接项目，对项目进度、运营数据和最终结果负责。\n\n任职要求\n1. 具备3年以上互联网产品运营、内容运营或用户运营经验，有完整项目经验；\n2. 熟悉产品运营全流程，能够独立完成方案制定、执行推进及数据复盘；\n3. 具备较强的数据分析能力，能够通过数据定位问题并推动业务优化；\n4. 对用户增长、内容消费、留存提升及商业化转化有实际经验；\n5. 具备良好的项目管理和跨部门协作能力，能够推动复杂事项落地；\n6. 具备较强的业务判断能力，能够主动发现问题并提出解决方案；\n7. 结果导向，执行力强，能够适应项目快速调整和多任务推进；\n8. 具备团队管理、项目负责人或小组管理经验者优先。\n\n优先考虑\n1.  有 FB / INS / TikTok 短剧信息流投放或短剧出海相关经验（加分项）\n2. 有海外产品、出海内容或海外用户运营经验；\n3. 有产品从0到1搭建、老产品优化或商业化提升经验；\n4. 熟悉AI工具，并能够应用于内容生产、数据分析及日常运营；\n5. 能够提供过往项目数据、运营案例或完整复盘材料。\n6.有视频、短剧、内容平台、社区或泛娱乐产品运营经验；", "cat": "运营与市场"}, {"id": "390", "title": "AI 模型训练师 / AIGC 模型工程师", "salary": "15K–25K", "location": "", "jd": "岗位候选人画像：模型训练 + 本身用模型就做出产品 \n岗位职责\nLLM 大模型微调\n负责主流开源大语言模型的微调、评测与部署，包括 Qwen、DeepSeek、Llama 等；\n熟悉 SFT、LoRA、QLoRA、PEFT 等微调技术，能够完成数据准备、训练、评测、模型迭代全流程；\n能够针对垂直业务场景构建训练数据集，并持续优化模型效果。\nAIGC 图像 / 视频模型训练\n负责 Stable Diffusion、FLUX、Qwen-Image/Qwen-Image-Edit 等图像模型的 LoRA 微调及效果优化；\n熟悉角色 LoRA、风格 LoRA、服装/场景 LoRA 等训练方式；\n能针对 AI 短剧场景优化人物一致性、画风一致性、场景一致性及连续镜头效果；\n了解图生图、文生图、图生视频、视频生成等主流 AIGC 技术。\nComfyUI 工作流开发\n熟练使用 ComfyUI，能够独立搭建、调试和优化复杂工作流；\n熟悉 ControlNet、IP-Adapter、LoRA、Face/ID Reference、Inpainting、Upscale 等常见能力；\n能够将 ComfyUI Workflow 封装为 API，并接入实际业务生产系统；\n能够定位显存溢出、节点依赖、模型兼容、推理速度等问题。\n模型推理与性能优化\n负责模型推理性能、显存占用、吞吐量和响应时间优化；\n熟悉 FP16/BF16/FP8/INT8/INT4 等量化及混合精度方案；\n了解 vLLM、TensorRT-LLM、SGLang、ONNX Runtime、Torch Compile 等推理加速技术；\n了解 Tensor Parallel、Pipeline Parallel、多 GPU 推理及模型并行；\n能根据 GPU 型号、显存和业务并发设计合理的部署方案。\nAI 短剧生产能力建设\n参与 AI 短剧「剧本 → 分镜 → 角色 → 图片 → 视频 → 配音 → 成片」生产链路建设；\n研究角色一致性、连续分镜、动作控制、表情控制、镜头控制等关键技术；\n熟悉主流图片/视频生成模型及相关工作流；\n能针对短剧生产中的质量、速度、成本进行模型选型和优化。\nLinux / GPU 环境运维\n熟悉 Linux 常用命令、Shell、进程/端口/磁盘/网络等基础运维；\n能独立完成 NVIDIA Driver、CUDA、cuDNN、PyTorch 等 GPU 环境搭建和问题排查；\n熟悉 Docker，能够完成 AI 模型服务容器化部署；\n能处理显存不足、CUDA OOM、驱动版本冲突、依赖冲突、多 GPU 调度等常见问题；\n了解 Nginx、Docker Compose、Kubernetes 者优先。\n任职要求\n计算机、人工智能、软件工程等相关专业，有 AI 模型训练或 AIGC 项目经验；\n熟练掌握 Python、PyTorch，具备实际模型训练和调优能力；\n有 LLM SFT / LoRA / QLoRA 实际项目经验；\n有 Stable Diffusion、FLUX、Qwen-Image 等图像模型 LoRA 训练经验；\n熟练使用 ComfyUI，能够独立设计复杂 Workflow；\n对 GPU、CUDA、显存、模型量化和推理优化有较深入理解；\n熟悉 Linux 环境，具备基本服务器部署和故障排查能力；\n对 AI 图片、AI 视频、数字人、AI 短剧等方向有较强兴趣和技术敏感度；\n具备较强的模型效果分析能力，能够通过数据、Prompt、训练参数、模型结构和工作流持续改善最终效果。\n加分项\n有 AI 短剧、漫剧、AI 视频生成项目实际落地经验；\n有角色一致性、人物 LoRA、风格 LoRA、视频 LoRA 训练经验；\n熟悉 Diffusers、Transformers、PEFT、DeepSpeed、Accelerate；\n熟悉 Wan、HunyuanVideo、Seedance、Kling、Veo、MiniMax 等视频生成模型或平台；\n有 vLLM / SGLang / TensorRT-LLM 大模型推理部署经验；\n有多卡训练、分布式训练、Tensor Parallel 实战经验；\n熟悉 FFmpeg、OpenCV、视频抽帧、数据清洗及自动标注；\n有模型数据集构建、Caption、自动打标、数据质量治理经验；\n有 4090 / 5090 / A100 / H100 等 GPU 服务器实际部署和优化经验；\n具备 Docker / Kubernetes / GPU 集群运维经验。\n核心能力关键词\nLLM / SFT / LoRA / QLoRA / PEFT / PyTorch / Transformers / Diffusers / ComfyUI / Stable Diffusion / FLUX / Qwen-Image / ControlNet / IP-Adapter / AIGC / AI Video / AI短剧 / vLLM / SGLang / TensorRT-LLM / CUDA / Multi-GPU / Docker / Linux / FFmpeg\n我们希望你是\n不是单纯“调用模型 API”的应用开发，而是能够真正深入到 数据 → 训练 → 模型 → 推理 → 工作流 → GPU 部署 → 业务效果 整个链路的人。\n最终目标是：把模型训出来、把效果调出来、把推理速度提上去，并真正投入 AI 短剧生产。", "cat": "技术开发"}, {"id": "391", "title": "短剧生成师学徒", "salary": "6K–10K", "location": "", "jd": "岗位职责\n1.使用ChatGPT及其他AI工具生成短剧内容，包括创意构思、故事大纲、分集梗概及单集对白；\n2.根据短剧内容特点，设计剧情冲突、情绪爽点、人物关系及结尾钩子；\n3.测试不同的Prompt策略和生成方式，寻找质量更稳定、出稿效率更高的方法；\n4.参与剧目选题和内容方向讨论，判断不同题材的看点、爆点及用户吸引力；\n5.对AI生成的内容进行筛选、修改和优化，解决剧情不顺、逻辑不通及对白生硬等问题；\n6.拆解热门短剧的题材、结构、节奏及钩子设计，总结可以复用的内容方法；\n7.协助整理短剧生成流程、Prompt模板及操作SOP，将有效的方法沉淀下来。\n\n任职要求\n1.不限专业及科班背景，但需要对故事、情绪和人物关系有一定感觉；\n2.具备基本的内容审美，能够判断一段剧情是否有吸引力；\n3.使用过ChatGPT或类似AI工具，愿意反复测试、调整和优化生成结果；\n4.平时有观看短剧、影视剧或阅读小说的习惯，知道短剧开场要抓人、结尾要留钩子；\n5.具备基本的文字表达能力，写过日记、评论、剧评、故事或文案均可；\n6.对热门内容有好奇心，看到爆款作品愿意主动拆解其结构和爆点；\n7.学习能力和执行力强，能够接受反复修改，并按要求完成阶段性任务；\n8.具备良好的沟通协作能力，能够及时理解并落实修改意见。\n\n优先考虑\n1.写过剧本、小说、故事或其他原创内容；\n2.有短视频、自媒体或其他内容创作经验；\n3.对Prompt设计或AI内容生成流程有自己的理解；\n4.使用过多种大模型或其他AI内容工具；\n5.能够提供文字作品、内容账号或AI创作案例。\n\n应聘资料\n请提供个人简历，并简要说明：\n1.使用过哪些AI工具，主要用于哪些场景；\n2.平时是否观看短剧，熟悉或感兴趣的题材有哪些；\n3.是否有故事、剧本、评论、剧评或短视频文案等创作经历；\n4.对AI内容生成或Prompt测试有哪些实际经验；\n5.如有相关文字作品、内容账号或AI创作案例，请一并提供。", "cat": "内容与创作"}, {"id": "392", "title": "agent架构师", "salary": "20K–35K", "location": "", "jd": "AI 平台架构师 / AI 基础设施架构师\n岗位方向：AI Platform / Agent Infrastructure / Cloud Native / GPU Infrastructure\n经验要求：8 年以上开发/架构经验，3 年以上 AI 相关项目经验优先\n岗位职责\n负责公司 AI 平台及 AI 应用基础设施的整体架构设计与技术落地，支撑 AI Agent、AIGC 图像/视频、大模型 API、模型推理等业务稳定运行。\n不仅要求具备传统后端及云原生架构能力，还需要理解当前 AI 应用的技术体系，能够完成从：\nAI 应用 → Agent → 模型服务 → GPU 算力 → Kubernetes → DevOps → 可观测性\n的完整技术架构设计。\n1. AI 平台架构\n负责公司 AI 平台整体技术架构设计、技术选型及核心模块建设。\n负责 AI Agent、LLM、AIGC 图像/视频等业务的基础架构设计。\n建设统一 AI Gateway，对接 OpenAI、Claude、Gemini、DeepSeek、Qwen、MiniMax 及私有部署模型。\n设计统一模型调用层，实现模型路由、Fallback、负载均衡、限流、熔断、重试及成本控制。\n设计 Agent Runtime / Tool Runtime，支撑 Tool Calling、MCP、Workflow、异步任务等能力。\n建设模型、Prompt、Agent、Workflow 的版本管理和发布体系。\n负责 AI 服务高可用、高并发、可扩展架构设计。\n2. Python / Go 后端架构\n熟练使用 Python + Go 进行后端及基础设施开发。\nPython 方向熟悉 FastAPI、Pydantic、AsyncIO、Celery 等常见技术。\nGo 方向熟悉 Gin、Fiber、gRPC 等技术体系。\n熟悉 REST API、WebSocket、SSE、gRPC 等通信方式。\n熟悉微服务、分布式系统、任务队列、缓存、数据库及对象存储等基础架构。\n能够针对 AI 长任务、GPU 任务设计异步任务系统。\n具备高并发、限流、熔断、降级、幂等、重试、分布式锁等实际工程经验。\n3. Kubernetes / 云原生\n精通 Kubernetes 生产环境部署及运维。\n熟悉 Deployment、StatefulSet、DaemonSet、Job、CronJob、Service、Ingress、HPA、PVC 等核心资源。\n熟悉 Helm / Kustomize。\n能够设计多 Namespace、多环境、多集群部署架构。\n熟悉 Pod 调度、资源限制、健康检查、滚动更新、自动扩缩容。\n能够快速定位 Pod Pending、OOMKilled、CrashLoopBackOff、MinimumReplicasUnavailable 等常见问题。\n熟悉 GPU Kubernetes 调度，包括 NVIDIA Device Plugin、GPU Resource、Node Selector、Affinity/Taint/Toleration 等。\n有 EKS / ACK / GKE / Azure AKS 等公有云 Kubernetes 生产经验优先。\n4. GPU / AI Infra\n理解 GPU 推理服务的部署和资源管理。\n熟悉 NVIDIA GPU、CUDA、显存、GPU Utilization 等基本概念。\n能够设计 GPU 资源池及任务调度机制。\n熟悉多 GPU / 多节点推理场景。\n熟悉模型加载、模型缓存、冷启动、显存回收及 OOM 处理。\n理解 FP16 / BF16 / FP8 / INT8 / INT4 等推理优化方式。\n有 vLLM、SGLang、TensorRT-LLM、Triton Inference Server 等经验优先。\n有 ComfyUI / Diffusers / 图像视频生成任务的 GPU 调度经验优先。\n5. CI/CD & DevOps\n负责公司 AI 系统完整 DevOps 体系建设，包括：\nGit → Build → Test → Image → Registry → Deploy → Monitor → Rollback\n熟悉 Git / Gitea。\n能够基于 Gitea Actions / Drone / Jenkins / Argo CD 等建设自动化流水线。\n熟悉 Docker 镜像构建及镜像优化。\n熟悉 Harbor 或其他 Docker Registry。\n熟悉 Helm 自动化部署。\n熟悉 GitOps。\n能够设计 Dev / Test / Staging / Production 多环境发布体系。\n支持灰度发布、滚动发布、蓝绿发布及快速回滚。\n建设代码、镜像、配置、模型、Workflow 的版本追踪体系。\n6. 云计算架构\n熟悉 AWS / 阿里云 / 腾讯云 / GCP 等至少一种主流云平台。\n熟悉 VPC、Subnet、NAT Gateway、Load Balancer、安全组、DNS 等基础网络。\n熟悉对象存储 S3 / OSS。\n熟悉 CDN。\n熟悉云数据库、Redis、消息队列等云服务。\n能够设计跨区域 / 多云架构。\n能够针对 AI GPU 业务进行云资源成本优化。\n有混合云 / 本地 GPU + 云 GPU 架构经验优先。\n7. 可观测性与稳定性\n建设完整的：\nMetrics + Logs + Traces + Alerts\n可观测体系。\n熟悉：\nPrometheus\nGrafana\nLoki / ELK / OpenSearch\nOpenTelemetry\nJaeger / Tempo\n能够针对 AI 系统建立：\nAPI 请求耗时\nToken 消耗\n模型成功率\nAgent Task 成功率\nWorkflow 执行时间\nGPU 利用率\nGPU 显存\nQueue Length\n模型推理耗时\n单任务成本\n等关键指标。\n负责线上故障定位、容量规划、性能优化及稳定性治理。\n任职要求\n必备能力\n计算机相关专业本科及以上学历优先。\n8 年以上软件开发 / 架构相关经验。\n有大型互联网系统、AI 平台或云原生平台架构经验。\n熟练掌握 Python 和 Go，至少一门达到高级水平。\n熟悉 Linux / Docker / Kubernetes。\n有 Kubernetes 生产环境实际管理经验，而不仅仅是部署过 Demo。\n熟悉微服务及分布式系统设计。\n熟悉 MySQL / PostgreSQL / Redis / MQ / Object Storage 等基础组件。\n熟悉 Gitea / GitLab / GitHub 等代码管理体系。\n有完整 CI/CD Pipeline 建设经验。\n熟悉至少一种主流公有云。\n有良好的系统设计能力。", "cat": "技术开发"}, {"id": "393", "title": "编剧", "salary": "10-20k", "location": "", "jd": "岗位职责\n1. 结合内容方向、用户偏好、平台热点和商业目标，制定选题计划并完成故事概念、人物设定及剧情大纲。\n2. 将小说、故事梗概、网文素材或原创创意改编为符合短剧节奏的剧本，完成删减、合并、重组和二次创作。\n3. 设计人物关系、故事线、冲突、情绪节点、反转、爽点及集尾钩子，确保内容具有持续观看吸引力。\n4. 输出分集大纲、正文剧本和分镜卡，明确场景、角色、动作、镜头意图及关键画面需求，为导演和AI生成提供清晰输入。\n5. 与导演、AI生成师、剪辑师协作，根据生成效果、制作限制和用户反馈持续调整剧本与分镜。\n6. 沉淀选题库、题材模板、故事结构和创作规范，参与项目复盘并持续提升内容生产效率。\n任职要求\n1. 大专及以上学历，影视、中文、新闻、编导、新媒体等相关专业优先。\n2. 2年以上短剧、网文、影视、动漫或短视频编剧经验，具备完整项目作品或可验证的作品集。\n3. 熟悉短剧或短视频叙事节奏，能够设计强冲突、强反转、强钩子并控制单集信息密度。\n4. 具备较强的故事拆解、剧情重构、人物塑造和台词表达能力，能独立完成从大纲到成稿的创作。\n5. 对AI图片、AI视频生成流程有基本了解，愿意根据模型能力调整剧本与分镜表达。\n6. 沟通和执行能力强，能够适应较快的内容生产节奏，并对交付质量负责。\n加分项\n• 有爆款短剧、爆款网文、漫剧或高传播内容项目经验。\n• 完整参与过AI短剧从选题、剧本、生成到成片的全流程。\n• 具备基础数据分析意识，能够根据完播率、互动率等指标优化剧情结构。", "cat": "内容与创作"}, {"id": "394", "title": "开发工程师", "salary": "20-35k", "location": "7.认可远程协作方式，核心工作时段能稳定在线、响应及时、交付稳定，能适应高频沟通和快速迭代节奏。", "jd": "岗位职责\n1.具备全栈理解能力，能贯通产品需求、前端页面、后端接口、数据流转和部署上线全链路，不局限于单一模块或单一网站，在自己的主攻方向上能独立判断、能兜底。\n2.面向公司多条网站产品线，开发内容管理、素材库、任务编排、审核流转、跨站分发、数据看板等平台级通用能力，避免各产品线重复造轮子。\n3.建设AI能力接入层，包括大模型、图像/视频生成模型及第三方API的调用，处理异步任务、流式输出、限流、重试、降级和成本控制，支撑文案生成、封面生成、内容生成等多种AI使用场景。\n4.建设日志、权限、告警、质量追踪等基础设施，保障多站点平台的稳定性、安全性与可观测性；参与代码评审、测试、部署和性能优化，推动研发规范落地。\n5.把AI工具实际用进日常开发、联调、排障和文档沉淀，持续提升个人和团队的交付效率。\n6.具备强自驱和强复盘意识，能把踩坑经验、技术方案、操作规范和排障案例系统性沉淀为团队资产，推动团队形成统一的工程质量标准。\n7.与内容、运营、SEO等多个业务方保持高频沟通，能把不同产品线偏模糊、甚至相互冲突的诉求，转化为可执行、可复用的技术方案。\n任职要求\n1.本科及以上学历，计算机、软件工程、人工智能等相关专业优先。\n2.3年以上后端、全栈或平台型产品开发经验，最好有同时支撑多个网站/产品线的经验，能独立负责模块从设计到上线的完整过程。\n3.熟练掌握Python、Go、Node.js、Java中的至少一种语言，具备扎实的工程规范和代码质量意识。\n4.熟悉RESTful API、数据库、缓存、消息队列或任务调度，能处理高并发、幂等和异常恢复问题，有支撑多站点/多业务线的架构经验优先。\n5.了解大模型API调用、Prompt工程、RAG、Function Calling或Agent工作流中的至少两个方向，对AI开发工具有研究或强烈兴趣。\n6.熟悉Linux、Docker及至少一种云服务或容器部署环境，具备CI/CD和线上问题排查经验。\n7.认可远程协作方式，核心工作时段能稳定在线、响应及时、交付稳定，能适应高频沟通和快速迭代节奏。\n加分项\n1.有内容聚合类、资讯类网站或多站点/矩阵站点的开发经验。\n2.熟悉ComfyUI、Stable Diffusion、视频生成工作流或模型推理服务。\n3.具备前端、全栈、数据工程或LLMOps经验。", "cat": "技术开发"}, {"id": "395", "title": "Prompt优化工程师", "salary": "15-25k", "location": "6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。", "jd": "岗位职责\n1.具备从选题、内容形态到最终呈现效果的全链路理解能力，覆盖文案、图片、视频等多种内容形态，不局限于写Prompt本身。\n2.梳理编辑、运营、AI生成、剪辑等岗位的实际生产场景，分别定义可复用的文本类Prompt规范（标题、文案、SEO内容）和视觉类Prompt规范（封面、画面生成），建立结构化模板及负面提示词库。\n3.对主流文本大模型、图像和视频生成模型进行系统性对比测试，记录不同内容场景下的模型能力边界、参数效果、失败模式和成本差异，在自己主攻的方向上能独立判断、能兜底。\n4.设计A/B测试与量化评测指标，衡量可用率、一致性、点击率/审美质量、生成耗时和单条素材成本，用数据而非主观感受驱动优化。\n5.与运营、AI生成师和开发团队协作，把验证有效的Prompt和评测方法沉淀到平台、工作流或自动化评测工具中，让好经验能够复用推广。\n6.具备强自驱和强复盘意识，持续跟踪模型更新和行业实践，把踩坑记录、失败模式和最佳实践系统性整理为团队资产，并组织内部培训，推动团队形成统一的提示词工程标准。\n任职要求\n1.本科及以上学历，中文、新闻、设计、计算机、人工智能等相关专业优先。\n2.2年以上AIGC、Prompt工程、内容生产或模型评测经验，具备可验证的项目案例。\n3.熟悉主流文本大模型及文生图、视频生成模型，理解文案生成、参考图、首尾帧、镜头控制、风格迁移和一致性控制等不同方法。\n4.具备较强的文字表达、结构化思考和实验设计能力，能把个人经验转化为可复用的模板、流程和评测标准。\n5.能阅读模型文档、英文资料和社区案例，独立快速验证新技术并形成结论。\n6.认可远程协作方式，核心工作时段能稳定在线、响应及时，能适应高频沟通和快速迭代节奏。\n7.对内容质量和数据结果敏感，具备跨团队沟通和培训输出能力。\n加分项\n1.具备Python脚本、数据处理或自动化评测能力。\n熟悉ComfyUI、LoRA、模型微调或本地推理。", "cat": "技术开发"}, {"id": "396", "title": "中高级产品经理", "salary": "15-30k", "location": "", "jd": "岗位职责\n一、产品规划与需求分析\n负责 C 端产品及核心功能的规划与迭代；\n结合业务目标、用户需求、市场趋势及竞品情况制定产品方案；\n深入分析需求背景及目标，能够识别真实用户需求，而非简单承接业务需求；\n完成产品原型、PRD、业务流程及功能逻辑设计；\n持续优化产品架构、核心功能及用户体验。\n二、用户体验与产品迭代\n关注用户使用路径及核心业务场景；\n通过用户反馈、行为数据及业务数据发现产品问题；\n持续优化注册、使用、内容消费、互动、留存、付费等核心链路；\n关注产品细节及交互体验，推动体验问题持续改善；\n结合产品不同生命周期制定对应的迭代策略。\n三、数据分析与增长\n建立数据驱动的产品工作方式；\n关注新增、活跃、留存、转化、付费等核心产品指标；\n通过数据分析定位产品问题及增长机会；\n针对重点功能制定上线目标及效果验证指标；\n持续跟踪版本上线后的数据表现，形成“需求—上线—数据—复盘—迭代”闭环。\n四、项目推动与落地\n负责需求从规划、评审、设计、研发、测试、验收到上线的完整推进；\n制定合理的版本计划及项目排期；\n协调 UI、研发、测试、运营等相关团队推进项目落地；\n及时识别项目风险、资源冲突及进度问题，并推动解决；\n对负责产品的交付质量、上线结果及后续表现持续跟进。\n五、市场与竞品研究\n持续关注行业趋势、用户变化及竞争产品动态；\n定期开展竞品分析及市场调研；\n能够从竞品中分析产品定位、业务模式、用户场景及核心策略，而非简单进行功能对比；\n结合业务实际提出具有可落地性的产品优化及创新方案。\n⸻\n任职要求\n基本要求\n3年以上互联网 C 端产品经理相关经验；\n具备完整的产品需求分析、产品设计及项目落地经验；\n能够独立负责产品或核心业务模块；\n熟悉互联网产品研发流程及产品生命周期管理；\n熟练使用 Axure、Figma、墨刀等产品设计工具及常用项目管理工具；\n具备基本的数据分析能力，能够通过数据辅助产品判断。\n能力要求\n具备较强的 C 端产品思维和用户意识，能够站在用户、业务及产品多个角度分析问题；\n具备良好的需求分析能力，能够从表层需求进一步拆解业务目标和真实用户需求；\n具备较强的逻辑思维及产品架构能力，能够独立完成复杂业务及功能设计；\n具备数据驱动意识，能够通过数据发现问题、验证需求及评估版本效果；\n具备较强的项目推动能力，能够主动协调资源并推动问题解决；\n具备良好的沟通表达、跨部门协作及执行能力。\n加分项\n有内容社区、短视频、社交、泛娱乐、工具类等 C 端产品经验；\n有从 0-1 产品建设或核心产品重大版本迭代经验；\n有用户增长、会员体系、付费转化、社区互动等产品经验；\n有成熟产品的数据分析、用户研究及增长实验经验；\n具备一定商业化产品思维，能够兼顾用户体验与业务经营目标；\n熟悉 AI 产品或能够将 AI 工具应用于需求分析、竞品研究、产品设计及日常工作。\n4.有跨团队推动能力，能把事情真正落地。\n5.有较强执行力和抗压能力，能处理需求冲突与优先级判断，独立推进项目落地。\n6.具备较强的Owner意识，对结果负责。\n7.在日常工作中已将AI工具深度融入产品工作流，包括但不限于：使用AI辅助需求分析、竞品调研、文档撰写、原型生成、数据洞察等环节，能主动探索并落地AI提效手段。\n8.有团队管理经验或带教经验者优先。\n三、加分项\n1.熟练使用一种或多种AI原型/设计工具（如Figma AI、Codex、Claude AI、ChatGPT、Grok、Cursor等），能提供使用AI工具生成的原型案例作为参考。\n2.有播放器、内容、消费、社交、资讯等行业经验。\n3.做过增长、商业化相关项目。\n4.有技术背景或设计背景。", "cat": "产品与管理"}, {"id": "397", "title": "高级增长运营", "salary": "10-30k", "location": "", "jd": "岗位职责\n1.负责全渠道流量转化链路优化，通过优化官网点击率、各端安装率（iOS/安卓）及渠道转化逻辑，提升整体获客效率。\n2.通过前端逻辑调整与策略干预，提升用户拉单触发频率，以高频行为带动商业化转化。\n3.设计商业化策略：包括低门槛首充产品（如周会员）设计以降低付费门槛、提升新增付费率；规划高价值套餐（月/季包）及代金币体系，优化定价策略提升ARPPU表现；通过Push、站内信等手段建立老用户触达机制，提升续费召回率与老用户充值占比。\n4.基于\"拉单-付费率-ARPU\"等核心影响链路开展数据建模与实验验证，通过数据反馈持续迭代增长路径。\n5.建立数据看板与归因分析机制，围绕获客质量（点击转化率、安装转化率、渠道转化率）、增长规模（拉单率、拉单触发频次）、变现效率（新增付费率、ARPPU、综合ARPU）、存量经营（续费召回率、充值占比）等核心指标持续复盘优化。\n6.沉淀增长打法、实验结论和SOP，推动团队及其他产品线复用有效经验。\n任职要求\n1.5年以上用户增长、运营增长或商业化运营经验，有从0到1、1到10或规模化增长项目经验，能用数据说明个人贡献和业务结果。\n2.具备成熟的模型思维，能理清获客、拉单、付费、留存各环节指标间的联动关系，擅长拆解\"提升路径\"寻找业务增长点。\n3.有视频、工具或订阅类产品运营背景，熟悉付费门槛设置、套餐定价及代金币体系设计。\n4.具备扎实的数据分析能力，能从ARPU、ARPPU、付费渗透率、拉单率、安装转化率等指标波动中定位核心问题并产出解决方案。\n5.具备优秀的产品逻辑梳理能力，能推动前端逻辑调整、支付配置及运营策略高效落地。\n6.有跨部门沟通协作经验，能协调产品、技术、渠道、商务等团队推进项目落地。\n加分项\n1.具备自动化任务跟进或多Agent协同工作意识。\n2.有视频、内容或垂直领域成功增长案例。\n熟练使用SQL、BI工具或增长实验平台。", "cat": "运营与市场"}, {"id": "398", "title": "高级产品运营", "salary": "10-30k", "location": "", "jd": "岗位职责\n1.负责平台内容的上架管理，包括内容排期、元数据维护（标题、简介、标签、分类）、封面与物料把控；建立并持续优化内容标签体系，保障内容库结构清晰，对站内检索、推荐及用户浏览友好。\n2.负责首页、频道页、分类页、专题页等核心流量场的内容编排，策划片单、专题、榜单等运营栏目；结合播放数据、用户偏好及热点动态调整推荐位，提高优质内容曝光效率、点击率及播放转化。\n3.制定内容上线节奏及更新排播计划，包括定档、预告、上线、连载更新、完结等运营节奏；配合重点内容进行站内宣发及资源位配置，放大头部内容的拉新、活跃及留存价值。\n4.持续跟踪播放量、点击率、完播率、人均观看时长、内容拉新及留存贡献等核心指标，定期进行内容消费数据复盘，将结论转化为选片、编排及推荐调整策略。\n5.参与内容评估及引入建议，协助对接内容方、制作方或版权方，完成内容物料交付、信息整理及上线跟进。\n6.参与付费内容、会员专享内容及重点内容的运营策略制定，结合节假日、热点事件及平台活动完成内容侧策划与落地，提升会员内容消费及付费转化。\n任职要求\n1.本科及以上学历，3年以上视频/内容平台产品运营经验。\n2.熟悉内容运营全链路，包括排期上架、元数据管理、标签分类、运营位编排、专题策划等，至少独立负责过其中两个核心环节。\n3.具备较强的数据敏感度，能看懂内容播放漏斗，独立完成内容消费数据复盘，并根据数据提出具体的选片、推荐位及内容编排调整动作。\n4.对内容具备较强判断力，熟悉主流内容品类及题材趋势，能判断内容是否具备流量潜力，在选片、推荐及内容编排方面有自己的方法论。\n5.具备基本的文案及审美能力，能独立完成专题标题、内容简介、推荐语、标签及封面物料把控。\n6.有会员付费内容、单片付费、内容解锁或类似商业化运营经验者优先。\n加分项\n1.有内容采买评估、版权方或内容制作方对接经验。\n2.熟悉推荐系统基本逻辑，有根据用户行为数据优化内容推荐或与算法团队协作的经验。\n3.熟练使用AI工具提升内容运营效率，例如批量整理元数据、标签生成、简介生成、封面初筛及内容分类等。", "cat": "运营与市场"}, {"id": "399", "title": "中高级内容运营", "salary": "10-30k", "location": "", "jd": "岗位职责\n1.负责平台整体内容运营，制定内容分类、标签、专题、搜索页等内容策略，提升内容流量、用户留存与转化效率。\n2.负责内容矩阵的选题方向制定与更新排期统筹，跟踪内容数据表现（播放、完播、转化等），持续分析优化内容策略及运营打法，定期输出数据分析报告支撑业务决策。\n3.统筹站外推广工作，包括自媒体矩阵、TG频道、外链渠道等内容分发及曝光提升策略，跟踪竞品及行业动态持续优化增长模型。\n4.带领并考核内容/运营团队成员，把控内容更新、文案优化、专题活动等产出质量，对接平台端内容规范落地。\n5.定期对内容数据进行复盘，包括流量来源、搜索关键词、用户行为、转化路径等，形成优化方案并推动落地执行。\n6.建设选题库、素材库、标签体系和内容SOP，提升团队协作效率与内容复用率。\n7.对齐业务目标，推动跨团队协作，完成内容相关的临时性/专项工作。\n任职要求\n1.本科及以上学历，3年以上内容运营、短视频运营或网站运营相关经验，有细分内容领域行业经验者优先。\n2.具备较强的数据分析能力，能通过流量、留存、转化、用户行为等核心数据发现问题并制定优化策略。\n3.熟悉内容生态与SEO运营逻辑，对分类结构、标签体系、专题页、关键词布局、搜索流量增长等有实战经验。\n4.有站外推广、自媒体矩阵运营或社群运营经验，熟悉TG频道运营者优先。\n5.具备一定的团队协作或带教经验，能统筹多任务并推进落地。\n6.责任心强，抗压能力好，能适应快节奏的业务需求。\n加分项\n1.熟悉Google Analytics、Search Console等数据工具，有搜索引擎流量增长经验优先。\n2.有多站点/矩阵站点运营经验。\n3.有海外渠道（Telegram、Twitter、Facebook、Reddit等）运营经验。", "cat": "内容与创作"}, {"id": "400", "title": "AI生成师（必须会剪辑）", "salary": "10-30k", "location": "", "jd": "岗位职责\n1. 理解剧本、分镜和视觉参考，拆分角色、场景、道具、动作和镜头，形成结构化的生成任务。\n2. 根据不同内容需求选择文生图、图生视频、首尾帧、参考图等生成方式，配置模型、参数和生成工作流。\n3. 进行批量生成与“抽卡”筛选，从构图、角色一致性、动作自然度、光影、风格和瑕疵等维度判断素材可用性。\n4. 维护角色、场景、服装、道具和风格资产库，记录Prompt、参数、版本、成本及最终选用结果。\n5. 针对生成失败、连贯性不足、画面崩坏等问题持续迭代提示词和工作流，提升一次通过率与批量生产效率。\n6. 与编剧、导演、剪辑和开发团队协作，反馈工具问题，沉淀提示词模板、案例库和标准操作流程。\n任职要求\n1. 大专及以上学历，数字媒体、动画、视觉设计、影视制作、美术等相关专业优先。\n2. 1年以上AIGC内容生产经验，或具备能够证明生成能力的作品集与项目案例。\n3. 熟悉主流文生图、图生视频及视频生成工具，理解常用参数、参考图、首尾帧和风格控制方法。\n4. 具备较强的视觉审美和画面判断能力，能够识别角色漂移、结构错误、运动异常等常见问题。\n5. 具备提示词编写、结构化实验和持续迭代能力，能够承担一定强度的批量生产任务。\n6. 工作细致、耐心、责任心强，能够适应快速变化的模型和工具生态。\n加分项\n• 熟悉ComfyUI、工作流编排、LoRA训练或模型部署。\n• 有AI短剧、AI漫剧、广告或内容平台的稳定量产经验。\n• 能够编写脚本或小工具提高素材整理、批量生成和评测效率。", "cat": "内容与创作"}, {"id": "401", "title": "美术（专门做图）", "salary": "10-30k", "location": "", "jd": "岗位职责\n1.根据剧本、角色设定、分镜及视觉参考，使用AI生图工具完成角色、场景、服装、道具等资产图的生成与制作。\n2.根据不同项目风格和内容需求，选择合适的模型、参考图、Prompt及生成方式，输出符合项目要求的高质量视觉资产。\n3.负责AI生成图片的筛选和质量把控，从人物美感、构图、比例、光影、色彩、服装、材质及风格一致性等维度判断素材可用性。\n4.持续维护角色、场景、服装、道具及风格资产库，保证同一角色和同一项目下视觉风格、人物特征及整体质感统一。\n5.针对人物崩脸、手部异常、结构错误、服装穿帮、背景异常、风格漂移等问题持续调整Prompt、参考图及生成参数，提高资产一次通过率。\n6.与AI生图师、导演、编剧、剪辑等团队协作，根据项目需求快速调整视觉方案，并沉淀高质量资产模板和生成规范。\n任职要求\n大专及以上学历，美术、视觉设计、动画、数字媒体、影视制作等相关专业优先。\n1年以上AI生图、视觉设计、插画、原画或相关内容制作经验，有能够体现审美能力和AI生成能力的作品集。\n熟悉主流AI生图工具，能够熟练使用参考图、Prompt、局部重绘、图生图等方式完成资产生成。\n具备较高的视觉审美和画面判断能力，对人物五官、身材比例、服装搭配、构图、光影、色彩及整体质感有较强把控能力。\n能够快速识别AI图片中的人物漂移、结构错误、比例异常、风格不统一等问题，并通过调整生成方案进行优化。\n具备较强的风格理解和复刻能力，能够根据参考图快速还原指定美术风格，并保持批量素材的一致性。\n工作细致、耐心、责任心强，能够适应较快的内容生产节奏及一定规模的批量资产生成任务。\n加分项\n• 熟悉ComfyUI、Stable Diffusion、Flux、Midjourney等AI生图工具及相关工作流。\n• 熟悉LoRA、ControlNet、IP-Adapter、局部重绘、姿态控制、角色一致性等生成方法。\n• 有AI短剧、AI漫画、广告、游戏或内容平台资产批量生产经验。\n• 有较强的人像审美，尤其擅长人物脸型、五官、发型、服装、妆造及角色整体视觉包装。\n• 能够沉淀Prompt、工作流、模型、参数和参考图模板，提高团队批量生产效率。", "cat": "内容与创作"}, {"id": "402", "title": "紫禁内容线主管", "salary": "面议", "location": "", "jd": "岗位职责：\n1. 制定紫禁内容线业务规划及AI视频、短剧、漫画、小说生产目标。\n2. 统筹编剧、导演、美术、视频生成、剪辑、漫画及小说团队。\n3. 建立选题、生产、审核、交付、发布及复盘流程。\n4. 跟踪产量、周期、合格率、返工率、成本及内容效果。\n5. 统筹人员、工具、素材、预算及版权合规管理。\n6. 负责团队建设、绩效管理、人才培养及结果验收。\n\n任职要求：\n1. 具备内容、影视、短剧、漫画、小说或AIGC业务经验。\n2. 具备团队管理、目标拆解、资源统筹和项目推进能力。\n3. 熟悉规模化内容生产、质量管理和数据指标体系。\n4. 熟悉主流AI内容工具，具备成本及经营结果意识。\n5. 具备版权合规、内容安全和风险判断能力。\n6. 面试须提供代表性项目、团队管理案例、量化成果及30/60/90天规划。", "cat": "内容与创作"}, {"id": "403", "title": "承天海外线主管", "salary": "面议", "location": "", "jd": "岗位职责：\n1. 调研不同国家的市场规模、用户需求、竞争格局及商业机会。\n2. 建立海外用户画像，分析内容偏好、使用场景和付费习惯。\n3. 制定目标市场进入策略及业务本土化适配方案。\n4. 统筹AIGC内容生产、运营增长和产品团队。\n5. 建立内容生产、渠道分发、用户获取和转化闭环。\n6. 跟踪流量、获客成本、转化、留存及收入数据。\n7. 负责海外合规、团队建设、资源配置和结果验收。\n\n任职要求：\n1. 具备海外内容、用户增长、产品或运营管理经验。\n2. 善于开展不同国家的行业、竞品、产品及用户调研。\n3. 能快速形成内容、产品、渠道和运营本土化方案。\n4. 熟悉海外社媒、网站、SEO或付费投放。\n5. 了解文化差异、平台政策和合规要求。\n6. 面试须提供海外项目、目标国家调研、用户画像及30/60/90天规划。", "cat": "其他"}, {"id": "404", "title": "AIGC内容生产组组长", "salary": "20K-35K", "location": "", "jd": "岗位职责：\n1. 研究目标国家的内容趋势、热门题材及用户偏好。\n2. 根据调研制定内容方向、排期及产能目标。\n3. 统筹编剧、导演、美术、视频生成及剪辑岗位。\n4. 推动剧情、人物、场景、语言及视觉风格本土化。\n5. 建立生产、审核、交付及测试迭代流程。\n6. 跟踪产量、周期、合格率、上线率及流量效果。\n\n任职要求：\n1. 具备AIGC视频、短剧或内容制作经验。\n2. 熟悉从脚本到成片的完整流程。\n3. 具备海外内容调研和用户偏好分析能力。\n4. 能制定不同市场的内容本土化方案。\n5. 具备生产排期、质量管理和文化合规意识。\n6. 面试须提供3—5个AIGC案例、生产流程及本土化策略。", "cat": "内容与创作"}, {"id": "405", "title": "AIGC短剧编剧组组长", "salary": "20K-35K", "location": "", "jd": "岗位职责：\n1. 制定短剧选题方向、剧本计划及生产目标。\n2. 建立选题、大纲、分集、剧本、审核和定稿流程。\n3. 制定剧本模板、Prompt规范和质量标准。\n4. 负责剧本审核、修改指导及交付验收。\n5. 协同导演、美术、视频生成及剪辑团队完成内容生产。\n6. 负责编剧团队分工、培训和能力建设。\n\n任职要求：\n1. 具备短剧、影视、小说或漫画编剧经验。\n2. 具备人物塑造、剧情设计、对白及节奏控制能力。\n3. 熟悉短剧冲突、反转及结尾留钩等创作方法。\n4. 熟悉AI写作工具、Prompt设计和剧本审核。\n5. 具备生产排期和编剧带教能力。\n6. 面试须提供完整剧本、人物设定、故事及分集大纲和上线数据。", "cat": "内容与创作"}, {"id": "406", "title": "AIGC短剧编剧", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究热点题材、目标用户及短剧趋势。\n2. 完成选题、人物设定、故事梗概、分集大纲及剧本创作。\n3. 使用AI工具辅助创意、扩写、改写和优化。\n4. 根据审核意见完成剧本修改及版本迭代。\n5. 配合导演和制作团队调整剧本可执行性。\n\n任职要求：\n1. 具备良好的文字表达和故事创作能力。\n2. 熟悉短剧叙事结构、情节节奏及用户偏好。\n3. 能够独立完成从选题到分集剧本的创作。\n4. 熟悉AI写作工具，能适应批量生产和多轮修改。\n5. 具备内容合规和版权意识。\n6. 面试须提供3—5个编剧作品，至少含1份完整剧本和1份故事大纲。", "cat": "内容与创作"}, {"id": "407", "title": "视频策划导演（AIGC短剧方向）", "salary": "20K-25K", "location": "", "jd": "岗位职责：\n1. 将剧本转化为视频策划、导演阐述及分镜方案。\n2. 设计镜头结构、景别、人物动作及画面节奏。\n3. 指导美术和视频生成岗位统一角色及视觉风格。\n4. 筛选生成素材，指导剪辑并验收成片。\n\n任职要求：\n1. 具备短剧导演、视频策划或分镜设计经验。\n2. 熟悉镜头语言、视听表达和剧情节奏。\n3. 具备视觉审美、成片判断和跨岗位协调能力。\n4. 了解AI图片、AI视频工具的能力边界。\n5. 面试须提供3—5个成片及对应分镜、导演方案和职责说明。", "cat": "内容与创作"}, {"id": "408", "title": "AIGC美术", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 根据剧本和导演要求设计角色、场景及视觉风格。\n2. 完成人物造型、服饰、场景和关键画面设计。\n3. 使用AI绘图工具生成并优化视觉素材。\n4. 保障角色和风格一致，建设视觉素材库。\n\n任职要求：\n1. 具备美术、插画、视觉或概念设计能力。\n2. 具备良好的构图、色彩、光影及人物设计能力。\n3. 熟悉主流AI绘图工具、Prompt及图片修正。\n4. 具备角色一致性、版权和素材风险意识。\n5. 面试须提供8—15张作品，含角色、场景、一致性及生成前后对比。", "cat": "内容与创作"}, {"id": "409", "title": "AI内容生成组组长", "salary": "20K-25K", "location": "", "jd": "岗位职责：\n1. 拆解AI视频日、周及阶段性产能目标。\n2. 分配任务并跟进生成进度和交付结果。\n3. 建立素材、Prompt、生成、检查、修改和交付流程。\n4. 优化工具、模型参数、Prompt模板和生产工作流。\n5. 跟踪人效、周期、合格率、返工率及工具成本。\n6. 负责组员培训、质量辅导和结果验收。\n\n任职要求：\n1. 熟悉主流AI图片和AI视频生成工具。\n2. 具备Prompt设计、模型选择和参数调整能力。\n3. 能解决角色漂移、动作异常等生成问题。\n4. 具备产能管理、质量验收和流程优化能力。\n5. 面试须提供3—5个AI视频、完整生产流程及效率优化案例。", "cat": "内容与创作"}, {"id": "410", "title": "AIGC视频生成师", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 根据剧本、分镜和视觉设定生成视频镜头。\n2. 编写并优化图片、视频生成Prompt及参数。\n3. 完成人物、场景、动作及运镜素材生成。\n4. 检查画面稳定性、角色一致性和镜头可用性。\n5. 根据审核意见完成补充生成和版本修改。\n\n任职要求：\n1. 熟悉至少一种AI图片或视频生成工具。\n2. 具备Prompt编写、参数测试和结果优化能力。\n3. 具备基础构图、镜头、光影和视觉审美能力。\n4. 能适应批量生产、多轮修改及规范文件管理。\n5. 面试须提供3—5个AI视频，并说明工具、模型、Prompt和优化过程。", "cat": "内容与创作"}, {"id": "411", "title": "AIGC视频剪辑师", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 根据剧本、分镜及导演要求完成视频剪辑。\n2. 处理镜头衔接、节奏、字幕、音效、配乐和包装。\n3. 修正AI素材中的跳帧、画面异常及连续性问题。\n4. 按平台要求完成版本修改、输出及文件管理。\n\n任职要求：\n1. 熟练使用主流视频剪辑工具。\n2. 具备良好的节奏感和视听表达能力。\n3. 了解AI视频常见问题及基础修复方法。\n4. 能适应高频修改和批量成片需求。\n5. 面试须提供3—5个完整视频，至少含1个剧情类或AI视频作品。", "cat": "内容与创作"}, {"id": "412", "title": "海外AIGC短剧编剧", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究目标国家热门题材、用户偏好及内容趋势。\n2. 完成海外向选题、人物设定、大纲及剧本。\n3. 根据语言、文化和用户习惯进行本土化改写。\n4. 使用AI工具辅助创意、扩写、翻译和优化。\n5. 配合制作团队调整剧本并根据数据持续迭代。\n\n任职要求：\n1. 具备短剧、网文、漫画或影视编剧能力。\n2. 具备英文或目标市场内容阅读分析能力。\n3. 具备海外用户、内容趋势及本土化调研能力。\n4. 熟悉AI写作工具，具备文化敏感性和合规意识。\n5. 面试须提供海外向剧本、双语脚本或本土化改写案例。", "cat": "内容与创作"}, {"id": "413", "title": "海外视频策划导演（AIGC短剧方向）", "salary": "20K-25K", "location": "", "jd": "岗位职责：\n1. 将海外向剧本转化为视频及分镜方案。\n2. 根据目标市场审美设计镜头、节奏和视觉风格。\n3. 指导美术、生成及剪辑岗位完成本土化表达。\n4. 审核素材和成片，并根据平台数据优化内容。\n\n任职要求：\n1. 熟悉海外短视频、短剧或广告表达方式。\n2. 具备镜头设计、视听表达和分镜能力。\n3. 能调研不同国家的内容及视觉偏好。\n4. 具备跨文化内容判断和AI视频生产能力。\n5. 面试须提供3—5个成片、对应分镜及本土化说明。", "cat": "内容与创作"}, {"id": "414", "title": "海外AIGC美术", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究目标市场的视觉审美和文化元素。\n2. 设计符合当地特征的人物、服饰、场景和画面风格。\n3. 使用AI工具生成并优化视觉素材。\n4. 控制角色、场景及系列内容一致性。\n5. 建立海外视觉及Prompt素材库。\n\n任职要求：\n1. 具备美术、插画、概念或视觉设计能力。\n2. 熟悉AI绘图工具和英文Prompt。\n3. 具备海外视觉趋势和文化差异分析能力。\n4. 能控制人物和场景的本土化准确性。\n5. 面试须提供8—15张海外向作品及角色一致性案例。", "cat": "内容与创作"}, {"id": "415", "title": "海外AIGC视频生成师", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 根据海外剧本、分镜及视觉要求生成视频。\n2. 编写并优化英文Prompt及模型参数。\n3. 控制人物、服饰、场景和文化元素准确性。\n4. 检查角色一致性、动作合理性和镜头质量。\n5. 根据审核意见补充生成并按平台要求交付。\n\n任职要求：\n1. 熟悉AI图片或AI视频生成工具。\n2. 具备英文Prompt阅读和编写能力。\n3. 具备镜头、构图和海外视觉偏好判断能力。\n4. 能识别并修复AI视频常见问题。\n5. 面试须提供3—5个海外向AI视频及完整优化过程。", "cat": "内容与创作"}, {"id": "416", "title": "海外AIGC视频剪辑师", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 完成海外短剧和短视频剪辑。\n2. 处理镜头节奏、字幕、配音、音效及包装。\n3. 修复AI素材的画面及连续性问题。\n4. 完成英文或目标市场语言字幕。\n5. 按海外平台规格输出并根据数据优化。\n\n任职要求：\n1. 熟练使用主流剪辑工具。\n2. 熟悉海外短视频和短剧的内容节奏。\n3. 具备基础英文阅读和字幕检查能力。\n4. 能适应批量生产和多轮修改。\n5. 面试须提供3—5个海外向视频成片。", "cat": "内容与创作"}, {"id": "417", "title": "海外社媒运营", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 调研目标市场的用户偏好和社媒趋势。\n2. 负责海外账号搭建、内容排期及发布。\n3. 优化标题、封面、标签、语言和发布时间。\n4. 维护用户互动并跟踪播放、粉丝及跳转数据。\n5. 分析竞品并提出内容优化建议。\n\n任职要求：\n1. 熟悉TikTok、YouTube、Instagram、Facebook、X、Telegram等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知。\n2. 具备内容策划、文案和账号运营能力。\n3. 具备基础英文编辑及用户、热点和竞品调研能力。\n4. 能根据数据快速调整策略。\n5. 面试须提供2—3个账号案例及增长数据。", "cat": "运营与市场"}, {"id": "418", "title": "海外站点运营", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 研究目标国家用户的网站使用习惯。\n2. 负责站点内容、分类、标签和页面维护。\n3. 优化内容结构、推荐逻辑及更新节奏。\n4. 跟踪流量、跳出率、停留时长和转化。\n5. 收集用户反馈并协同SEO、社媒和投流做好承接。\n\n任职要求：\n1. 具备网站或内容平台运营经验。\n2. 熟悉CMS后台和内容发布流程。\n3. 具备用户调研、站点数据分析及基础SEO能力。\n4. 能发现并推进解决页面和功能问题。\n5. 面试须提供站点运营、内容改版或流量提升案例。", "cat": "运营与市场"}, {"id": "419", "title": "中级运营（内容运营）", "salary": "15K-25K", "location": "", "jd": "岗位介绍\n我们正在打造面向海外市场的 AI 短剧产品，业务涵盖成人内容与非成人内容两条产品线。希望你理解海外用户的内容偏好，能够结合内容策划、用户运营与数据分析，持续提升用户观看体验、留存和付费转化。\n岗位职责\n**内容运营：**负责短剧上架、分类标签、首页推荐、专题策划及更新排期，优化剧名、简介、封面和推荐文案，提升内容点击率、观看深度与追剧率。\n**用户运营：**围绕新用户引导、追剧提醒、用户召回及会员活动开展运营，提升用户活跃度、留存率与复购率。\n**付费转化：**协同产品团队优化免费试看、付费解锁、订阅及促销策略，分析用户从观看到付费的关键流失环节，推动转化提升。\n**数据分析：**跟踪内容表现、用户行为及收入数据，开展运营实验与效果复盘，将分析结果转化为具体优化动作。\n**增长协同：**配合投放及社媒团队提炼剧集卖点、筛选推广片段，结合获客表现与站内消费数据，优化素材与内容承接。\n**内容反馈与竞品研究：**持续研究海外短剧及相关内容产品，将用户偏好、评论和消费表现反馈给编剧与制作团队，支持选题、剧情节奏和内容供给优化。\n**分线运营：**根据成人与非成人内容线的受众、渠道及内容边界制定差异化运营方案，落实内容分级、审核与用户反馈处理要求。\n任职要求\n具备 2 年及以上互联网产品运营经验，且至少具备海外 App、短剧、网文、流媒体或订阅制内容产品中任一领域的运营经验。\n理解内容消费产品的运营逻辑，能够围绕“内容点击—持续观看—留存—付费”制定并执行运营方案。\n具备数据分析能力，熟练使用 Excel 或其他分析工具，能够独立完成数据复盘；掌握 SQL 者加分。\n英语水平达到大学英语四级（CET-4）及以上，能够阅读海外用户反馈、研究竞品，并撰写或校对基础英文运营文案。\n对海外用户的文化背景和内容偏好有敏感度，对 AI 短剧及新内容形式有兴趣，能够判断内容吸引力与观看体验。\n执行力强，能够在产品早期主动发现问题、协调资源并推动落地。\n能够接受成人内容相关业务，具备清晰的职业边界与内容合规意识；具体负责产品线在面试中沟通确认。\n加分项\n有海外内容产品从 0 到 1 上线或冷启动经验。\n有提升用户留存、订阅收入或付费转化的实际案例。\n熟悉北美市场，具备海外短剧、网文或成人内容产品运营经验。\n熟悉海外社媒、社区运营或广告素材测试。\n能够使用 AI 工具提升内容分析、文案与运营执行效率。", "cat": "内容与创作"}, {"id": "420", "title": "平面设计师", "salary": "10K-15K", "location": "", "jd": "岗位职责：\n1. 调研目标国家的视觉风格和用户审美。\n2. 完成广告、社媒、站点及内容封面设计。\n3. 针对不同国家和渠道进行视觉本土化。\n4. 配合投流团队进行素材测试和迭代。\n5. 根据点击和转化数据优化设计。\n\n任职要求：\n1. 熟练使用主流平面和图片处理工具。\n2. 具备良好的构图、色彩、字体和版式能力。\n3. 具备海外视觉趋势和用户审美分析能力。\n4. 能完成多语言、多尺寸素材并理解营销目标。\n5. 面试须提供8—15张广告、社媒、站点或内容视觉作品。", "cat": "内容与创作"}, {"id": "421", "title": "漫画编剧", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 负责漫画选题、人物及世界观设计。\n2. 完成故事大纲、分话脚本、对白及画面描述。\n3. 设计剧情冲突、节奏及章节留钩。\n4. 配合设计和制作岗位优化脚本并持续修改。\n\n任职要求：\n1. 具备漫画、小说或短剧内容创作能力。\n2. 具备人物塑造、故事结构和对白设计能力。\n3. 熟悉漫画分话、分镜描述及连载节奏。\n4. 能使用AI工具辅助创作，具备稳定产能。\n5. 面试须提供3—5个漫画脚本、人物设定、故事大纲或上线作品。", "cat": "内容与创作"}, {"id": "422", "title": "AI漫画设计师", "salary": "15K-20K", "location": "", "jd": "岗位职责：\n1. 根据漫画脚本完成分镜和画面设计。\n2. 使用AI工具生成人物、场景及漫画画面。\n3. 控制角色、场景及作品风格一致性。\n4. 对生成画面进行筛选、修正和局部重绘。\n5. 建立角色模型、风格模板及Prompt素材库。\n\n任职要求：\n1. 具备漫画、插画或视觉设计能力。\n2. 熟悉AI绘图工具及相关工作流程。\n3. 具备角色一致性、构图和连续画面控制能力。\n4. 能理解脚本并转化为具体画面。\n5. 面试须提供8—15张作品或2—3个完整漫画片段。", "cat": "内容与创作"}, {"id": "423", "title": "漫画制作师（排版／成片）", "salary": "10K-15K", "location": "", "jd": "岗位职责：\n1. 根据脚本和分镜完成漫画页面或条漫排版。\n2. 处理画格、对白框、字体及视觉动线。\n3. 完成画面修整、裁切、拼接和色彩调整。\n4. 检查错漏、顺序及完整性并按平台规范输出。\n\n任职要求：\n1. 熟悉漫画排版、图片编辑及平面设计工具。\n2. 了解条漫、页漫等漫画阅读逻辑。\n3. 具备版式设计、质量检查和批量交付能力。\n4. 面试须提供3—5个排版或成片案例，建议附原始素材对比。", "cat": "内容与创作"}, {"id": "424", "title": "AI小说编剧／主笔", "salary": "10K-20K", "location": "", "jd": "岗位职责：\n1. 研究用户偏好和小说题材趋势。\n2. 完成世界观、人物、主线及章节大纲设计。\n3. 使用AI工具完成正文生成、扩写、改写和润色。\n4. 控制人物逻辑、情节推进及章节连续性。\n5. 根据审核和用户反馈调整内容并沉淀素材库。\n\n任职要求：\n1. 具备网文、小说或相关文字创作能力。\n2. 具备长篇故事规划和持续创作能力。\n3. 熟悉网络小说结构、节奏及用户偏好。\n4. 熟悉AI写作工具并能控制内容一致性。\n5. 面试须提供完整大纲、人物设定及不少于3个连续章节。", "cat": "内容与创作"}, {"id": "425", "title": "AI 内容镜头审核", "salary": "15K-20K", "location": "", "jd": "岗位职责\n1. **镜头质量审核与分级**  \n   对 AI 生成镜头进行逐镜审核，依据统一的 A / B / C 质量标准完成分级，重点评估画面质量、人物一致性、动作自然度、场景稳定性及镜头逻辑，确保素材符合对应等级要求。\n\n2. **剪辑前质量把控**  \n   负责 AI 生成与后期剪辑之间的素材质量把关，严格执行入库标准，确保 C 级镜头不进入剪辑环节，减少因素材缺陷导致的后期补救与返工。\n\n3. **问题识别与精准标注**  \n   识别人物变形、身份特征不一致、动作异常、场景漂移、画面穿帮、镜头逻辑不合理及画质异常等问题，准确记录问题类型、发生时间点及具体表现，提供清晰、可追溯的审核反馈。\n\n4. **审核质量与返工控制**  \n   持续关注漏检率、审核准确率及素材质量问题引发的下游返工率，结合复核结果与剪辑反馈校准判断，保障审核质量与标准执行的一致性。\n\n5. **推动生成质量改进**  \n   汇总高频问题与共性缺陷，定期向 AI 视频生成团队反馈，协助优化生成方法、提示词、模型选型及生产流程，从源头降低问题镜头产生率。\n\n6. **审核标准与案例沉淀**  \n   持续整理典型问题镜头及优质案例，参与完善 A / B / C 分级标准、审核 SOP 与案例库，提升团队审核效率及判断的一致性、稳定性。\n\n任职要求\n\n1. 具备 AI 视频生成、视频后期制作、视频质检或相关内容制作经验，熟悉镜头质量评估的基本方法与流程。\n2. 对人物一致性、动作自然度、场景稳定性、画面完整度及镜头逻辑具备较强的识别与判断能力。\n3. 能够准确理解并严格执行统一的质量分级标准，在批量、高频审核场景下保持稳定的判断能力。\n4. 工作细致、耐心，对画面质量敏感，具备较强的标准意识、责任心与质量把控能力。\n5. 能够客观、准确地描述问题，明确问题位置及具体表现，提供可执行的反馈。\n6. 具备良好的沟通与团队协作能力，能够与 AI 生成、剪辑等团队高效配合，推动问题闭环解决。\n\n加分项\n\n- 具备 AI 视频或 AI 图像生成实操经验，熟悉主流生成工具及常见缺陷。\n- 具备短剧、漫剧、短视频等批量化内容生产经验。\n- 具备视频后期质检、成片审核或影视制作质量管理经验。\n- 曾担任生成团队骨干，承担镜头审核、质量把控或团队标准校准工作。\n- 具备视频质量标准、质检 SOP 或镜头案例库的建设经验。", "cat": "内容与创作"}, {"id": "426", "title": "AI短剧剧本审核", "salary": "10K-18K", "location": "", "jd": "负责 AI 短剧故事大纲、分集梗概及完整剧本的审核，检查故事逻辑、人物设定、戏剧冲突、情节节奏及对白表达，确保符合内容定位与制作要求。\n重点审核开场钩子、分集推进、情绪转折及集尾悬念，识别铺垫冗长、冲突不足、信息重复、剧情拖沓等问题，判断剧本是否具备持续追看的吸引力。\n检查人物动机、行为逻辑及关系发展，识别人设前后矛盾、转折缺少铺垫、情感变化突兀、伏笔遗漏等问题，保证故事连贯、人物成立。\n结合 AI 制作条件，评估场景、角色、动作及特效需求的实现难度，识别难以视觉化、制作复杂度过高或缺乏叙事必要性的内容，提出调整建议。\n按统一的 A / B / C 质量标准对剧本进行分级，承担进入分镜及制作环节前的审核工作，C 级剧本修改并复核通过后方可进入后续流程。\n输出准确到集数、场次或具体台词的审核意见，说明问题、影响及修改方向，与编剧、导演和制作团队协同推进修改，跟进版本复核，减少下游返工。\n汇总高频问题与优秀案例，持续完善剧本审核标准、审核 SOP 及案例库，提高团队判断的一致性。\n任职要求\n有短剧编剧、剧本编辑、剧本审核、网文改编或相关内容策划经验，面试需提供剧本作品、修改前后对比或审核案例，并说明本人负责部分。\n理解短剧叙事特点，能够判断开场吸引力、冲突强度、信息密度、情绪节奏及集尾悬念，能区分文字描写丰富与有效剧情推进。\n具备较强的故事分析能力，能够识别情节漏洞、人物动机不足、关系发展不合理及设定不一致等问题。\n理解基础视听表达，能够判断文字是否可以转化为清晰的画面与行动，关注单集时长、场景数量及制作可行性。\n能结合目标受众、题材定位及制作要求作出判断，避免仅凭个人喜好评价剧本。\n能准确描述问题并提出可执行的修改方向，不仅停留在“节奏慢”“不吸引人”等笼统评价。\n细致、有耐心，具备较强的标准意识、责任心及沟通能力，能够适应批量审稿、多版本修改与复核工作。\n加分项\n有北美市场短剧、网文或影视内容的编剧、编辑、剧本审核及本地化经验，了解北美用户的题材偏好、文化语境、人物关系与情感表达方式，能够识别不符合当地语境的情节和台词，并提出调整建议者优先。\n有 AI 短剧、漫剧或短剧完整项目制作经验，了解剧本到分镜、生成及剪辑的流程。\n有爱情、悬疑、奇幻等类型内容的创作或编辑经验。\n能结合观看留存、分集流失及用户反馈复盘剧本问题。\n有建立剧本验收标准、审核 SOP 或培训案例库的经验。", "cat": "内容与创作"}, {"id": "427", "title": "审计助理 / 审计员", "salary": "远程：6K-8K", "location": "", "jd": "一、岗位概述\n\n负责公司各类业务开支及渠道投放费用的审核与风险把控，确保资金使用真实、合理、合规、高效。重点负责播放器 App 项目相关渠道投放、市场推广及业务合作费用审核，并结合业务数据对投放效果进行分析评估，为公司降本增效和风险控制提供支持。\n\n---\n\n二、岗位职责\n\n1、开支审核与合规控制\n\n* 审核各部门提交的费用申请、合同、发票及付款凭证等资料；\n* 重点审核渠道投放费用、市场推广费用、商务合作费用等业务支出；\n* 核查费用真实性、合理性、预算执行情况及合规性，防范虚假、重复或异常支出；\n* 对异常费用进行风险预警，并提出整改建议。\n\n2、渠道投放审核\n\n* 负责渠道合作方资质审核及合作风险评估；\n* 审核渠道投放 ROI、转化率、留存率等核心运营指标；\n* 对渠道合作进行事前、事中、事后审核，形成审核意见及复盘报告，为续费、调整或终止合作提供依据。\n\n3、业务开支监控与数据分析\n\n* 定期统计、分析各类业务费用结构、占比及变化趋势；\n* 协助建立费用监控指标体系及风险预警机制；\n* 挖掘费用使用问题，提出降本增效及优化建议，为管理层提供数据支持。\n\n4、制度建设与流程优化\n\n* 协助制定及完善公司《开支审核管理制度》及相关流程；\n* 建立标准化费用台账、审核档案及复盘机制；\n* 配合开展费用合规培训，提高各部门费用管理意识。\n\n---\n\n 三、任职要求\n\n1. 本科及以上学历，财务、审计、会计、经济管理等相关专业优先；\n2. 具备良好的逻辑思维能力、数据分析能力及风险识别能力，能够独立完成审核分析工作；\n3. 工作认真细致，责任心强，原则性强，具备良好的职业操守及保密意识；\n4. 执行力强，学习能力强，能够主动推动工作落地并持续优化工作流程；\n5. 具备良好的沟通协调能力及团队协作意识，能够与业务、财务等部门高效协同；\n6. 吃苦耐劳，具备较强的抗压能力，能够适应快节奏工作及多任务处理；\n7. 对数据敏感，善于发现问题并进行分析，能够结合业务数据识别风险并提出可执行的优化建议；\n8. 熟练使用 Excel 等办公软件，能够完成数据整理、统计分析及审核报告编写；\n9. 具备良好的文字表达能力，能够独立撰写审核意见、分析报告及复盘总结。\n\n---\n\n四、加分项 const CATS = ["内容与创作", "运营与市场", "技术开发", "产品与管理", "职能与行政", "采集与逆向", "安全攻防", "其他"];

const catCounts = {};
JOBS.forEach(j => { catCounts[j.cat] = (catCounts[j.cat]||0) + 1; });

let activeCat = null;
try { activeCat = localStorage.getItem('omi_jobs_cat') || null; } catch(e) {}

const chipRow = document.getElementById('chipRow');
function renderChips(){
  const chips = [{cat:null,label:'全部',n:JOBS.length}].concat(
    CATS.filter(c => catCounts[c]).map(c => ({cat:c,label:c,n:catCounts[c]}))
  );
  chipRow.innerHTML = chips.map(c => `
    <div class="chip ${activeCat===c.cat ? 'active':''}" data-cat="${c.cat ?? ''}">
      ${c.label} <span class="n">${c.n}</span>
    </div>
  `).join('');
  chipRow.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-cat');
      activeCat = v === '' ? null : v;
      try { activeCat ? localStorage.setItem('omi_jobs_cat', activeCat) : localStorage.removeItem('omi_jobs_cat'); } catch(e) {}
      renderChips();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(escapedText, q){
  if (!q) return escapedText;
  const re = new RegExp('(' + escapeRegex(q) + ')', 'ig');
  return escapedText.replace(re, '<mark>$1</mark>');
}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const statsEl = document.getElementById('stats');

function render(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = JOBS.filter(j => {
    if (activeCat && j.cat !== activeCat) return false;
    if (!q) return true;
    return j.title.toLowerCase().includes(q) || j.jd.toLowerCase().includes(q);
  });

  // 有关键字时:标题命中的排在前面(最相关),仅描述里命中的排后面,
  // 且给后者打上"命中于描述"的提示,避免看起来像误匹配。
  if (q){
    filtered = filtered
      .map((j, idx) => ({ j, idx, titleHit: j.title.toLowerCase().includes(q) }))
      .sort((a, b) => {
        if (a.titleHit !== b.titleHit) return a.titleHit ? -1 : 1;
        return a.idx - b.idx; // 稳定排序,组内保持原顺序
      })
      .map(x => x.j);
  }

  statsEl.textContent = `显示 ${filtered.length} / ${JOBS.length} 个职位`;

  if (filtered.length === 0){
    list.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  list.innerHTML = filtered.map(j => {
    const titleHit = q ? j.title.toLowerCase().includes(q) : false;
    const jdOnlyHit = q && !titleHit;
    const titleHtml = highlight(escapeHtml(j.title), q);
    const jdHtml = highlight(escapeHtml(j.jd), q);
    return `
    <div class="card">
      <div class="card-top">
        <span class="card-tag">${escapeHtml(j.cat)}</span>
        <span class="card-id">#${escapeHtml(j.id)}</span>
      </div>
      <h3>${titleHtml}</h3>
      <div class="badge-row">
        ${j.salary ? `<span class="salary">${escapeHtml(j.salary)}</span>` : ''}
        ${j.location ? `<span class="location">📍 ${escapeHtml(j.location)}</span>` : ''}
        ${jdOnlyHit ? `<span class="card-tag jd-match">命中于描述</span>` : ''}
      </div>
      <div class="jd" id="jd-${j.id}">${jdHtml}</div>
      <div class="card-actions">
        <button class="toggle-btn" data-id="${j.id}">展开全文 ▾</button>
        <a class="apply-btn" href="https://t.me/y666899y" target="_blank" rel="noopener">投递 / 咨询 ↗</a>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const jd = document.getElementById('jd-' + btn.getAttribute('data-id'));
      const isExpanded = jd.classList.toggle('expanded');
      btn.textContent = isExpanded ? '收起 ▴' : '展开全文 ▾';
    });
  });
}

document.getElementById('searchInput').addEventListener('input', render);

renderChips();
render();
</script>
