le": "中高级运营专员（综合方向）", "salary": "12k-20k", "location": "未明确", "jd": "简历筛选要点：\n有成人内容或内容站实操经验优先，也接受绿色行业。不要纯执行岗位，需要对数据分析、流量获取、活动策划、产品迭代至少有一项擅长并拿到过结果。\n\n岗位JD描述\n一、岗位职责\n负责综合类成人内容产品整体运营，围绕内容供给、用户消费、创作者生态及商业化转化制定并推动中长期运营策略。\n从用户审美与消费意图出发，规划视频为主的内容搭建、专题页、更新节奏与转化路径，推动播放、付费转化、留存等核心指标提升。\n与技术、内容、设计团队协作，将运营需求落地，推动重点功能与内容落地。\n使用AI工具搭建动漫运营工作流，包括选题聚类、批量内容优化、标题/封面生成、质检与数据监控等。\n熟练使用ChatGPT、Claude、Gemini、Grok等工具中的一种或多种，提升内容生产与分析效率。\n跟踪核心数据表现（新增、播放、留存、付费转化、营收等），定期输出复盘与优化建议。\n关注成人行业趋势、AI内容生成与推荐算法变化，探索新的内容增长与变现机会。\n\n二、任职要求\n至少3年以上互联网内容/用户运营经验，有独立负责运营app或内容增长项目的完整经验。理解内容运营工作方式，能写需求、拆任务、排优先级并推动跨团队落地\n熟悉成人内容、用户消费路径、转化漏斗、数据指标拆解等基础方法。\n对AI工具有实际使用经验，能把AI融入稳定的日常工作流。\n具备较强的数据分析能力，能从播放、完播、转化等数据中发现问题并提出解决方案。\n具备良好的内容判断力，能识别低质量内容并建立内容质量标准。\n自驱力强，能从模糊目标中拆出可执行方案，适应高节奏业务环境。", "cat": "运营"}, {"id": "356", "title": "新媒体运营专员（海外增长方向）", "salary": "12k-16k", "location": "未明确", "jd": "简历筛选要点：\n具备社交平台账号运营、内容策划及用户导流经验，能够独立完成选题、文案、发布、互动和数据复盘。重点关注候选人实际负责过的账号、内容案例和增长结果，能够说明如何从内容曝光、用户互动推进到链接点击、App新增用户及后续转化。具备AI工具实际使用经验，能将AI用于日常内容生产和运营分析。\n本次招聘按以下两个方向匹配人才，各1人：\n海外媒体运营方向：侧重X、Facebook等平台，负责图文、话题策划、社区互动、账号增长及用户导流。\n国内内容分发方向：侧重快手、小红书、微博等平台，负责短视频或图文策划、素材测试、内容分发及用户导流。\n具体平台分工根据业务优先级和候选人能力确定，需要候选人有多平台媒体矩阵搭建能力。\n\n岗位JD描述\n一、岗位职责\n负责所分配社交平台的账号建设和日常运营，结合产品特点、目标用户及平台规则，制定运营策略、内容计划和发布排期。\n策划并执行图文、短视频及话题内容，完成选题、文案、素材需求对接和内容发布，持续优化内容表现。\n开展评论、私信及社群互动，收集用户反馈，处理日常咨询和账号异常，维护账号活跃度与用户关系。\n围绕App用户增长设计导流方式，跟踪内容曝光、互动、粉丝净增、链接点击、可归因新增用户及充值转化，优化内容与转化路径。\n持续开展内容和导流测试，针对开头、文案、素材、发布形式及引导方式提出假设、记录结果，并将有效经验用于后续运营。\n使用AI工具辅助选题整理、文案初稿、多语言改写、字幕制作和数据汇总，并对生成内容的准确性、表达质量及素材使用进行审核。\n与内容、设计、产品等团队协作，按时提交运营计划和数据复盘，沉淀账号管理、内容审核、发布互动及异常处理等运营SOP。\n\n二、任职要求\n具备新媒体或社交平台运营经验，能够独立负责账号日常运营，并提供实际运营案例或内容作品。\n熟悉上述至少一个招聘方向的平台特点、内容形式及用户互动方式，能够根据平台和目标用户调整运营方案。\n具备良好的选题、文案和内容判断能力，能够识别内容吸引力，审核AI生成内容，避免事实错误和低质量表达。\n具备数据分析意识，能够从曝光、互动、点击和新增用户等数据中发现问题，提出改进方案并验证效果。\n具备用户增长和转化意识，能够说明内容如何带来有效用户，并关注新增用户的留存、观看行为及后续转化。\n有AI工具实际使用经验，能够将AI融入日常工作，提高内容生产和数据整理效率。\n执行力和沟通能力良好，能够主动推进内容排期、素材对接及跨团队协作，对所负责账号的交付和运营结果负责。\n\n加分项\n有短剧、视频内容、娱乐类产品或App增长相关运营经验。\n有海外社交平台运营、跨市场内容策划或多语言内容制作经验。\n有从0到1搭建账号、社区或内容运营流程的经验，能够提供可核验的增长案例。\n具备短视频脚本策划、基础剪辑、字幕制作或图文素材制作能力。\n有渠道归因或付费推广经验，能够核算投入、获客成本及转化效果。", "cat": "商务 / 市场"}, {"id": "357", "title": "海外新媒体运营 / 矩阵引流", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责\n1. 全渠道矩阵运营：负责 X（Twitter）、TikTok、Instagram、YouTube Shorts 等海外主流平台的账号矩阵搭建与日常运营，初期人均管理 5 个账号，后续拓展至 5–10 个。\n2. 爆款内容创作与剪辑：针对短剧、AI 漫剧、动漫风格内容进行脚本二次创作、高光切片剪辑与文案包装，持续输出高转化率的图文与短视频。\n3. 前沿截流与流量获取：精准捕捉海外社媒爆点与热门话题，运用 AI 辅助工具及自动化截流策略，为站点与私域高效率导入精准流量。\n4. 私域流量沉淀与运营：打通\"社媒 $\\rightarrow$ 落地页 $\\rightarrow$ Telegram\"流量闭环，负责 Telegram 交流群及频道的日常互动、裂变活动策划及用户留存。\n5. 数据复盘与策略迭代：定期分析各平台展现量、互动率、转化率等关键指标，持续优化内容策略与引流链路。\n任职要求\n1. 大专及以上学历，2 年以上海外社交媒体运营或矩阵起号实战经验。\n2. 熟悉 X、TikTok、Instagram 等平台规则、推荐算法及防封禁机制。\n3. 具备优秀的内容敏感度（网感好），熟练掌握剪映/CapCut、Photoshop 等剪辑与设计工具。\n4. 拥有 Telegram 社群运营或矩阵截流引流实战案例者优先。\n优先加分项\n有百万级海外社媒矩阵起号或成功引流案例者优先（需附作品集）。\n 熟练运用 AI 绘画/AI 视频工具（如 Midjourney、Sora、Runway 等）协助高效产出内容者优先。", "cat": "运营"}, {"id": "358", "title": "数据专员（媒体账号与数据运营）", "salary": "10K-15K", "location": "未明确", "jd": "工作内容简述：媒体账号养护、投流执行与维护、表格管理\n\n岗位职责\n1. X（推特）账号养护与运营\n   负责账号日常养护，包括资料完善、内容更新、日常互动、账号状态检查及异常反馈，保持账号稳定运营，逐步提升账号活跃度、内容曝光和粉丝积累。\n2. 多账号管理\n   使用比特浏览器等工具管理账号及独立环境，维护账号台账，记录账号状态、操作情况和异常问题，做好账号安全与权限管理。\n3. 投流执行与跟进\n   按既定投放计划，完成 X KOL、蜂鸟云推及 Facebook 等渠道的联络、素材对接、排期确认和投放执行；检查发布情况，跟进执行进度，记录投放费用及效果数据。\n4. 日常表格填写与维护\n   负责账号管理表、投放记录表、渠道资源表、费用表及效果统计表等 Google 表格的日常填写、更新和核对，确保数据准确、完整、及时。\n5. 表格整理与数据汇总\n   整理各类表格的分类、命名、字段和归档，及时跟进缺失或异常数据，按要求完成日报、周报及阶段性数据汇总，方便团队查询和复盘。\n任职要求\n1. 有 X（推特）养号及实际运营经验，熟悉账号从基础养护到持续运营的工作流程，能独立安排并完成日常维护，有多账号运营经验者优先。\n2. 熟悉比特浏览器等多账号管理工具，具备账号安全意识，操作细致，能及时发现并反馈异常。\n3. 熟练使用 Google 表格，能长期、稳定地维护多份业务表格，掌握筛选、排序、常用函数等操作，善于整理信息、核对数据。\n4. 执行力强，能按照既定流程完成投放任务，主动跟进进度，及时反馈结果。\n5. 具备基本的对外沟通能力，熟悉 Telegram 的日常使用，能够识别常见诈骗及合作风险。\n6. 做事耐心、细致、有条理，具备责任心和保密意识。\n加分项\n- 有 X 起号、账号增长或稳定运营案例；\n- 有 KOL 对接、蜂鸟云推或 Facebook 渠道投放执行经验；\n- 会使用数据透视表、图表，能优化表格结构和填写流程；\n- 具备基础英语读写能力，会简单的图片或视频处理。", "cat": "运营"}, {"id": "359", "title": "紫禁内容线主管", "salary": "面议", "location": "未明确", "jd": "岗位职责：\n1. 制定紫禁内容线业务规划及AI视频、短剧、漫画、小说生产目标。\n2. 统筹编剧、导演、美术、视频生成、剪辑、漫画及小说团队。\n3. 建立选题、生产、审核、交付、发布及复盘流程。\n4. 跟踪产量、周期、合格率、返工率、成本及内容效果。\n5. 统筹人员、工具、素材、预算及版权合规管理。\n6. 负责团队建设、绩效管理、人才培养及结果验收。\n\n任职要求：\n1. 具备内容、影视、短剧、漫画、小说或AIGC业务经验。\n2. 具备团队管理、目标拆解、资源统筹和项目推进能力。\n3. 熟悉规模化内容生产、质量管理和数据指标体系。\n4. 熟悉主流AI内容工具，具备成本及经营结果意识。\n5. 具备版权合规、内容安全和风险判断能力。\n6. 面试须提供代表性项目、团队管理案例、量化成果及30/60/90天规划。", "cat": "内容"}, {"id": "360", "title": "承天海外线主管（短剧／AI内容）", "salary": "面议", "location": "未明确", "jd": "海外业务主管（短剧／AI内容）\n\n岗位介绍\n负责海外短剧业务从市场选择、产品启动到增长与商业化的整体推进，统筹内容、运营及产品团队，对阶段性经营结果负责。\n业务涵盖普通向及成人向短剧，产品形态包括 Web 与 App。目标国家及上线顺序将结合市场研究与业务验证确定。\n\n岗位职责\n1.市场研究与业务规划\n研究不同国家的用户需求、竞争格局、内容消费及付费习惯，评估市场机会与进入条件，制定目标市场、产品定位和阶段性业务计划。\n2.产品从零到一建设\n联动产品与研发团队，明确 Web、App 的功能范围、需求优先级及上线节奏，推动内容发现、观看、付费和回访等核心体验建设，并根据用户反馈持续优化。\n3.内容策略与供给管理\n结合目标市场确定题材、内容形态及本地化方向，统筹 AIGC 内容团队的生产排期、质量与成本，推动内容表现复盘及供给优化。\n4.用户增长与运营\n组织社媒自然流量、SEO、合作渠道或付费推广等获客工作，优化站外传播到站内观看、付费与留存的转化路径，提升用户质量和投入效率。\n5.商业化与数据分析\n联动团队制定并验证收费方式、会员权益及用户运营策略，跟踪获客成本、观看转化、付费、留存、收入和内容成本，依据数据调整业务方向及资源投入。\n6.团队管理与跨部门协作\n统筹内容、运营及产品团队，明确目标、分工和验收标准，推进关键岗位建设、人才培养及跨团队问题解决。\n7.预算与业务风险管理\n管理业务预算及阶段性投入，协同法务、支付、技术等相关团队落实目标市场的内容、版权、隐私、年龄访问及平台要求，保障业务持续运营。\n\n任职要求\n1.具备海外互联网业务经验，有内容平台、数字内容付费、用户增长、产品运营或相关业务管理经历，能够说明本人承担的职责与实际成果。\n2.有从零到一启动产品、新市场或新业务的完整项目经验，能够在信息和资源有限的情况下确定优先级、组织验证并推动落地。\n3.具备产品判断能力，能够将用户需求及业务问题转化为产品方案，与产品、研发团队共同完成需求取舍、上线验收和效果验证。\n4.具备内容判断与商业意识，理解内容吸引力、持续消费及用户付费之间的关系，能够结合目标受众制定内容与本地化策略。\n5.熟悉至少一种海外获客方式，如社媒自然增长、SEO、达人合作、联盟渠道或付费投放，具备从获客到站内转化的实践经验。\n6.具备较强的数据分析和经营意识，能够结合用户行为、收入与成本判断业务效果，制定可执行的优化方案。\n7.有团队管理或跨职能项目统筹经验，能够协调不同专业团队，明确责任、解决分歧，并对结果负责。\n8.英语能够支持日常业务研究、资料阅读与工作沟通；对文化差异及海外业务规则具备敏感度，能够识别需要专项核实的问题。\n能够接受并负责普通向及成人向内容业务的产品与运营管理工作。\n\n加分项\n有海外网赚、联盟营销、CPS／CPA 分销或流量变现经验，熟悉渠道合作、效果归因及收益核算，具备可说明的项目成果者优先。\n有海外短剧、网文、流媒体、互动娱乐或订阅制内容产品经验。\n有 Web 与 App 协同运营、支付转化或会员商业化经验。\n有成人向内容平台相关业务经验。\n有多个国家的市场进入、本地化或增长经验。\n有 AIGC 内容生产协同、内容成本管理或制作流程建设经验。", "cat": "AI / AIGC"}, {"id": "362", "title": "AIGC短剧编剧组组长", "salary": "20K-35K", "location": "未明确", "jd": "岗位职责：\n1. 制定短剧选题方向、剧本计划及生产目标。\n2. 建立选题、大纲、分集、剧本、审核和定稿流程。\n3. 制定剧本模板、Prompt规范和质量标准。\n4. 负责剧本审核、修改指导及交付验收。\n5. 协同导演、美术、视频生成及剪辑团队完成内容生产。\n6. 负责编剧团队分工、培训和能力建设。\n\n任职要求：\n1. 具备短剧、影视、小说或漫画编剧经验。\n2. 具备人物塑造、剧情设计、对白及节奏控制能力。\n3. 熟悉短剧冲突、反转及结尾留钩等创作方法。\n4. 熟悉AI写作工具、Prompt设计和剧本审核。\n5. 具备生产排期和编剧带教能力。\n6. 面试须提供完整剧本、人物设定、故事及分集大纲和上线数据。", "cat": "AI / AIGC"}, {"id": "363", "title": "AIGC短剧编剧", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究热点题材、目标用户及短剧趋势。\n2. 完成选题、人物设定、故事梗概、分集大纲及剧本创作。\n3. 使用AI工具辅助创意、扩写、改写和优化。\n4. 根据审核意见完成剧本修改及版本迭代。\n5. 配合导演和制作团队调整剧本可执行性。\n\n任职要求：\n1. 具备良好的文字表达和故事创作能力。\n2. 熟悉短剧叙事结构、情节节奏及用户偏好。\n3. 能够独立完成从选题到分集剧本的创作。\n4. 熟悉AI写作工具，能适应批量生产和多轮修改。\n5. 具备内容合规和版权意识。\n6. 面试须提供3—5个编剧作品，至少含1份完整剧本和1份故事大纲。", "cat": "AI / AIGC"}, {"id": "365", "title": "AIGC美术", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责：\n1. 根据剧本和导演要求设计角色、场景及视觉风格。\n2. 完成人物造型、服饰、场景和关键画面设计。\n3. 使用AI绘图工具生成并优化视觉素材。\n4. 保障角色和风格一致，建设视觉素材库。\n\n任职要求：\n1. 具备美术、插画、视觉或概念设计能力。\n2. 具备良好的构图、色彩、光影及人物设计能力。\n3. 熟悉主流AI绘图工具、Prompt及图片修正。\n4. 具备角色一致性、版权和素材风险意识。\n5. 面试须提供8—15张作品，含角色、场景、一致性及生成前后对比。", "cat": "AI / AIGC"}, {"id": "366", "title": "AI内容生成组组长", "salary": "20K-25K", "location": "未明确", "jd": "岗位职责：\n1. 拆解AI视频日、周及阶段性产能目标。\n2. 分配任务并跟进生成进度和交付结果。\n3. 建立素材、Prompt、生成、检查、修改和交付流程。\n4. 优化工具、模型参数、Prompt模板和生产工作流。\n5. 跟踪人效、周期、合格率、返工率及工具成本。\n6. 负责组员培训、质量辅导和结果验收。\n\n任职要求：\n1. 熟悉主流AI图片和AI视频生成工具。\n2. 具备Prompt设计、模型选择和参数调整能力。\n3. 能解决角色漂移、动作异常等生成问题。\n4. 具备产能管理、质量验收和流程优化能力。\n5. 面试须提供3—5个AI视频、完整生产流程及效率优化案例。", "cat": "AI / AIGC"}, {"id": "367", "title": "AIGC视频生成师", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 根据剧本、分镜和视觉设定生成视频镜头。\n2. 编写并优化图片、视频生成Prompt及参数。\n3. 完成人物、场景、动作及运镜素材生成。\n4. 检查画面稳定性、角色一致性和镜头可用性。\n5. 根据审核意见完成补充生成和版本修改。\n\n任职要求：\n1. 熟悉至少一种AI图片或视频生成工具。\n2. 具备Prompt编写、参数测试和结果优化能力。\n3. 具备基础构图、镜头、光影和视觉审美能力。\n4. 能适应批量生产、多轮修改及规范文件管理。\n5. 面试须提供3—5个AI视频，并说明工具、模型、Prompt和优化过程。", "cat": "AI / AIGC"}, {"id": "368", "title": "AIGC视频剪辑师", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 根据剧本、分镜及导演要求完成视频剪辑。\n2. 处理镜头衔接、节奏、字幕、音效、配乐和包装。\n3. 修正AI素材中的跳帧、画面异常及连续性问题。\n4. 按平台要求完成版本修改、输出及文件管理。\n\n任职要求：\n1. 熟练使用主流视频剪辑工具。\n2. 具备良好的节奏感和视听表达能力。\n3. 了解AI视频常见问题及基础修复方法。\n4. 能适应高频修改和批量成片需求。\n5. 面试须提供3—5个完整视频，至少含1个剧情类或AI视频作品。", "cat": "AI / AIGC"}, {"id": "369", "title": "海外AIGC短剧编剧", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究目标国家热门题材、用户偏好及内容趋势。\n2. 完成海外向选题、人物设定、大纲及剧本。\n3. 根据语言、文化和用户习惯进行本土化改写。\n4. 使用AI工具辅助创意、扩写、翻译和优化。\n5. 配合制作团队调整剧本并根据数据持续迭代。\n\n任职要求：\n1. 具备短剧、网文、漫画或影视编剧能力。\n2. 具备英文或目标市场内容阅读分析能力。\n3. 具备海外用户、内容趋势及本土化调研能力。\n4. 熟悉AI写作工具，具备文化敏感性和合规意识。\n5. 面试须提供海外向剧本、双语脚本或本土化改写案例。", "cat": "AI / AIGC"}, {"id": "371", "title": "海外AIGC美术", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究目标市场的视觉审美和文化元素。\n2. 设计符合当地特征的人物、服饰、场景和画面风格。\n3. 使用AI工具生成并优化视觉素材。\n4. 控制角色、场景及系列内容一致性。\n5. 建立海外视觉及Prompt素材库。\n\n任职要求：\n1. 具备美术、插画、概念或视觉设计能力。\n2. 熟悉AI绘图工具和英文Prompt。\n3. 具备海外视觉趋势和文化差异分析能力。\n4. 能控制人物和场景的本土化准确性。\n5. 面试须提供8—15张海外向作品及角色一致性案例。", "cat": "AI / AIGC"}, {"id": "372", "title": "海外AIGC视频生成师", "salary": "10K-20K", "location": "未明确", "jd": "SEO优化师（短剧／内容网站方向）\n【岗位职责】\n1、负责海内外短剧及内容网站的SEO工作，根据业务阶段制定并执行自然搜索增长计划，推动网站从0到1建立搜索流量。\n2、调研目标国家的搜索市场、用户需求及竞品网站，挖掘剧名、题材、剧情及观看需求等关键词机会，明确关键词优先级与页面布局。\n3、制定内容优化方案，协同内容团队完善首页、剧集详情页、题材分类页及相关内容页面，提高内容质量、搜索匹配度和用户体验。\n4、优化网站结构、标题、描述、内部链接及多语言页面配置，排查抓取、索引、重复页面、加载速度等问题，并推动产品及开发团队落实优化。\n5、通过优质内容、相关网站合作及自然引用等正规方式开展外链建设，持续提升网站的搜索可见度，坚持白帽SEO方法。\n6、使用数据工具跟踪收录、关键词排名、自然搜索曝光、点击及流量表现，结合用户观看、注册和付费等行为评估流量质量与业务贡献。\n7、定期复盘SEO效果，识别内容及技术问题，调整优化优先级，沉淀适合不同国家、语言和业务阶段的执行方法。\n【任职要求】\n1、具备海外网站SEO实操经验，有独立负责网站自然流量增长的项目经历；个人站长、海外电商独立站、内容站或工具站背景均可。\n2、具备从网站诊断、关键词研究、内容规划到优化落地和效果复盘的完整能力，能够独立制定计划并推动执行。\n3、熟悉Google等主流搜索引擎的基础工作机制，掌握白帽SEO方法，重视内容价值、用户体验及长期稳定增长。\n4、掌握站内优化和基础技术SEO，能够识别抓取与索引、网站结构、重复内容、多语言配置及页面性能等问题，并与开发人员沟通解决。\n5、具备英文关键词研究、搜索意图分析及内容判断能力，能够结合目标国家的语言和用户习惯制定差异化方案。\n6、熟练使用Google Search Console、GA4及至少一种常用SEO研究工具，能够区分品牌词与非品牌词、不同国家及页面的流量表现，并据此提出优化建议。\n7、具备结果意识，能够将自然搜索流量与用户观看、注册、付费等业务目标结合，关注有效流量及转化质量。\n8、坚持正规SEO打法，不采用黑帽手段、作弊外链或其他操纵搜索排名的方式。\n【加分项】\n1、有个人独立建站、运营及变现经验，能够展示持续获得自然搜索流量的网站。\n2、有海外短剧、小说、影视、流媒体或其他内容网站的SEO经验。\n3、有新站冷启动、多语言网站或多个国家市场的SEO项目经验。\n4、具备基础HTML、CMS配置或网站搭建能力，能够独立完成部分优化工作。\n5、有通过内容建设、网站结构优化及优质外链合作取得稳定增长的案例。", "cat": "AI / AIGC"}, {"id": "373", "title": "海外社媒运营", "salary": "15K-20K", "location": "有出海网赚类产品运营经验优先/加分。过往工作经历为web3的请勿推荐", "jd": "岗位职责：\n1. 调研目标市场的用户偏好和社媒趋势。\n2. 负责海外账号搭建、内容排期及发布。\n3. 优化标题、封面、标签、语言和发布时间。\n4. 维护用户互动并跟踪播放、粉丝及跳转数据。\n5. 分析竞品并提出内容优化建议。\n\n任职要求：\n1. 熟悉TikTok、YouTube、Instagram、Facebook、X、Telegram等平台底层玩法及推荐机制，对流量逻辑、内容分发及用户增长有成熟认知。\n2. 具备内容策划、文案和账号运营能力。\n3. 具备基础英文编辑及用户、热点和竞品调研能力。\n4. 能根据数据快速调整策略。\n5. 面试须提供2—3个账号案例及增长数据。", "cat": "运营"}, {"id": "374", "title": "海外站点运营", "salary": "15K-20K", "location": "有出海网赚类产品运营经验优先/加分。", "jd": "岗位职责：\n1. 研究目标国家用户的网站使用习惯。\n2. 负责站点内容、分类、标签和页面维护。\n3. 优化内容结构、推荐逻辑及更新节奏。\n4. 跟踪流量、跳出率、停留时长和转化。\n5. 收集用户反馈并协同SEO、社媒和投流做好承接。\n\n任职要求：\n1. 具备网站或内容平台运营经验。\n2. 熟悉CMS后台和内容发布流程。\n3. 具备用户调研、站点数据分析及基础SEO能力。\n4. 能发现并推进解决页面和功能问题。\n5. 面试须提供站点运营、内容改版或流量提升案例。", "cat": "运营"}, {"id": "375", "title": "中级运营（内容运营）", "salary": "15K-25K", "location": "有出海网赚类产品运营经验优先/加分。", "jd": "岗位介绍\n我们正在打造面向海外市场的 AI 短剧产品，业务涵盖成人内容与非成人内容两条产品线。希望你理解海外用户的内容偏好，能够结合内容策划、用户运营与数据分析，持续提升用户观看体验、留存和付费转化。\n岗位职责\n**内容运营：**负责短剧上架、分类标签、首页推荐、专题策划及更新排期，优化剧名、简介、封面和推荐文案，提升内容点击率、观看深度与追剧率。\n**用户运营：**围绕新用户引导、追剧提醒、用户召回及会员活动开展运营，提升用户活跃度、留存率与复购率。\n**付费转化：**协同产品团队优化免费试看、付费解锁、订阅及促销策略，分析用户从观看到付费的关键流失环节，推动转化提升。\n**数据分析：**跟踪内容表现、用户行为及收入数据，开展运营实验与效果复盘，将分析结果转化为具体优化动作。\n**增长协同：**配合投放及社媒团队提炼剧集卖点、筛选推广片段，结合获客表现与站内消费数据，优化素材与内容承接。\n**内容反馈与竞品研究：**持续研究海外短剧及相关内容产品，将用户偏好、评论和消费表现反馈给编剧与制作团队，支持选题、剧情节奏和内容供给优化。\n**分线运营：**根据成人与非成人内容线的受众、渠道及内容边界制定差异化运营方案，落实内容分级、审核与用户反馈处理要求。\n任职要求\n具备 2 年及以上互联网产品运营经验，且至少具备海外 App、短剧、网文、流媒体或订阅制内容产品中任一领域的运营经验。\n理解内容消费产品的运营逻辑，能够围绕“内容点击—持续观看—留存—付费”制定并执行运营方案。\n具备数据分析能力，熟练使用 Excel 或其他分析工具，能够独立完成数据复盘；掌握 SQL 者加分。\n英语水平达到大学英语四级（CET-4）及以上，能够阅读海外用户反馈、研究竞品，并撰写或校对基础英文运营文案。\n对海外用户的文化背景和内容偏好有敏感度，对 AI 短剧及新内容形式有兴趣，能够判断内容吸引力与观看体验。\n执行力强，能够在产品早期主动发现问题、协调资源并推动落地。\n能够接受成人内容相关业务，具备清晰的职业边界与内容合规意识；具体负责产品线在面试中沟通确认。\n加分项\n有海外内容产品从 0 到 1 上线或冷启动经验。\n有提升用户留存、订阅收入或付费转化的实际案例。\n熟悉北美市场，具备海外短剧、网文或成人内容产品运营经验。\n熟悉海外社媒、社区运营或广告素材测试。\n能够使用 AI 工具提升内容分析、文案与运营执行效率。", "cat": "内容"}, {"id": "376", "title": "漫画编剧", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 负责漫画选题、人物及世界观设计。\n2. 完成故事大纲、分话脚本、对白及画面描述。\n3. 设计剧情冲突、节奏及章节留钩。\n4. 配合设计和制作岗位优化脚本并持续修改。\n\n任职要求：\n1. 具备漫画、小说或短剧内容创作能力。\n2. 具备人物塑造、故事结构和对白设计能力。\n3. 熟悉漫画分话、分镜描述及连载节奏。\n4. 能使用AI工具辅助创作，具备稳定产能。\n5. 面试须提供3—5个漫画脚本、人物设定、故事大纲或上线作品。", "cat": "内容"}, {"id": "377", "title": "AI漫画设计师", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责：\n1. 根据漫画脚本完成分镜和画面设计。\n2. 使用AI工具生成人物、场景及漫画画面。\n3. 控制角色、场景及作品风格一致性。\n4. 对生成画面进行筛选、修正和局部重绘。\n5. 建立角色模型、风格模板及Prompt素材库。\n\n任职要求：\n1. 具备漫画、插画或视觉设计能力。\n2. 熟悉AI绘图工具及相关工作流程。\n3. 具备角色一致性、构图和连续画面控制能力。\n4. 能理解脚本并转化为具体画面。\n5. 面试须提供8—15张作品或2—3个完整漫画片段。", "cat": "AI / AIGC"}, {"id": "378", "title": "漫画制作师（排版／成片）", "salary": "10K-15K", "location": "未明确", "jd": "岗位职责：\n1. 根据脚本和分镜完成漫画页面或条漫排版。\n2. 处理画格、对白框、字体及视觉动线。\n3. 完成画面修整、裁切、拼接和色彩调整。\n4. 检查错漏、顺序及完整性并按平台规范输出。\n\n任职要求：\n1. 熟悉漫画排版、图片编辑及平面设计工具。\n2. 了解条漫、页漫等漫画阅读逻辑。\n3. 具备版式设计、质量检查和批量交付能力。\n4. 面试须提供3—5个排版或成片案例，建议附原始素材对比。", "cat": "内容"}, {"id": "379", "title": "AI小说编剧／主笔", "salary": "10K-20K", "location": "未明确", "jd": "岗位职责：\n1. 研究用户偏好和小说题材趋势。\n2. 完成世界观、人物、主线及章节大纲设计。\n3. 使用AI工具完成正文生成、扩写、改写和润色。\n4. 控制人物逻辑、情节推进及章节连续性。\n5. 根据审核和用户反馈调整内容并沉淀素材库。\n\n任职要求：\n1. 具备网文、小说或相关文字创作能力。\n2. 具备长篇故事规划和持续创作能力。\n3. 熟悉网络小说结构、节奏及用户偏好。\n4. 熟悉AI写作工具并能控制内容一致性。\n5. 面试须提供完整大纲、人物设定及不少于3个连续章节。", "cat": "AI / AIGC"}, {"id": "380", "title": "AI 内容镜头审核", "salary": "15K-20K", "location": "未明确", "jd": "岗位职责\n1. **镜头质量审核与分级**  \n   对 AI 生成镜头进行逐镜审核，依据统一的 A / B / C 质量标准完成分级，重点评估画面质量、人物一致性、动作自然度、场景稳定性及镜头逻辑，确保素材符合对应等级要求。\n\n2. **剪辑前质量把控**  \n   负责 AI 生成与后期剪辑之间的素材质量把关，严格执行入库标准，确保 C 级镜头不进入剪辑环节，减少因素材缺陷导致的后期补救与返工。\n\n3. **问题识别与精准标注**  \n   识别人物变形、身份特征不一致、动作异常、场景漂移、画面穿帮、镜头逻辑不合理及画质异常等问题，准确记录问题类型、发生时间点及具体表现，提供清晰、可追溯的审核反馈。\n\n4. **审核质量与返工控制**  \n   持续关注漏检率、审核准确率及素材质量问题引发的下游返工率，结合复核结果与剪辑反馈校准判断，保障审核质量与标准执行的一致性。\n\n5. **推动生成质量改进**  \n   汇总高频问题与共性缺陷，定期向 AI 视频生成团队反馈，协助优化生成方法、提示词、模型选型及生产流程，从源头降低问题镜头产生率。\n\n6. **审核标准与案例沉淀**  \n   持续整理典型问题镜头及优质案例，参与完善 A / B / C 分级标准、审核 SOP 与案例库，提升团队审核效率及判断的一致性、稳定性。\n\n任职要求\n\n1. 具备 AI 视频生成、视频后期制作、视频质检或相关内容制作经验，熟悉镜头质量评估的基本方法与流程。\n2. 对人物一致性、动作自然度、场景稳定性、画面完整度及镜头逻辑具备较强的识别与判断能力。\n3. 能够准确理解并严格执行统一的质量分级标准，在批量、高频审核场景下保持稳定的判断能力。\n4. 工作细致、耐心，对画面质量敏感，具备较强的标准意识、责任心与质量把控能力。\n5. 能够客观、准确地描述问题，明确问题位置及具体表现，提供可执行的反馈。\n6. 具备良好的沟通与团队协作能力，能够与 AI 生成、剪辑等团队高效配合，推动问题闭环解决。\n\n加分项\n\n- 具备 AI 视频或 AI 图像生成实操经验，熟悉主流生成工具及常见缺陷。\n- 具备短剧、漫剧、短视频等批量化内容生产经验。\n- 具备视频后期质检、成片审核或影视制作质量管理经验。\n- 曾担任生成团队骨干，承担镜头审核、质量把控或团队标准校准工作。\n- 具备视频质量标准、质检 SOP 或镜头案例库的建设经验。", "cat": "AI / AIGC"}, {"id": "381", "title": "AI短剧剧本审核", "salary": "10K-18K", "location": "未明确", "jd": "负责 AI 短剧故事大纲、分集梗概及完整剧本的审核，检查故事逻辑、人物设定、戏剧冲突、情节节奏及对白表达，确保符合内容定位与制作要求。\n重点审核开场钩子、分集推进、情绪转折及集尾悬念，识别铺垫冗长、冲突不足、信息重复、剧情拖沓等问题，判断剧本是否具备持续追看的吸引力。\n检查人物动机、行为逻辑及关系发展，识别人设前后矛盾、转折缺少铺垫、情感变化突兀、伏笔遗漏等问题，保证故事连贯、人物成立。\n结合 AI 制作条件，评估场景、角色、动作及特效需求的实现难度，识别难以视觉化、制作复杂度过高或缺乏叙事必要性的内容，提出调整建议。\n按统一的 A / B / C 质量标准对剧本进行分级，承担进入分镜及制作环节前的审核工作，C 级剧本修改并复核通过后方可进入后续流程。\n输出准确到集数、场次或具体台词的审核意见，说明问题、影响及修改方向，与编剧、导演和制作团队协同推进修改，跟进版本复核，减少下游返工。\n汇总高频问题与优秀案例，持续完善剧本审核标准、审核 SOP 及案例库，提高团队判断的一致性。\n任职要求\n有短剧编剧、剧本编辑、剧本审核、网文改编或相关内容策划经验，面试需提供剧本作品、修改前后对比或审核案例，并说明本人负责部分。\n理解短剧叙事特点，能够判断开场吸引力、冲突强度、信息密度、情绪节奏及集尾悬念，能区分文字描写丰富与有效剧情推进。\n具备较强的故事分析能力，能够识别情节漏洞、人物动机不足、关系发展不合理及设定不一致等问题。\n理解基础视听表达，能够判断文字是否可以转化为清晰的画面与行动，关注单集时长、场景数量及制作可行性。\n能结合目标受众、题材定位及制作要求作出判断，避免仅凭个人喜好评价剧本。\n能准确描述问题并提出可执行的修改方向，不仅停留在“节奏慢”“不吸引人”等笼统评价。\n细致、有耐心，具备较强的标准意识、责任心及沟通能力，能够适应批量审稿、多版本修改与复核工作。\n加分项\n有北美市场短剧、网文或影视内容的编剧、编辑、剧本审核及本地化经验，了解北美用户的题材偏好、文化语境、人物关系与情感表达方式，能够识别不符合当地语境的情节和台词，并提出调整建议者优先。\n有 AI 短剧、漫剧或短剧完整项目制作经验，了解剧本到分镜、生成及剪辑的流程。\n有爱情、悬疑、奇幻等类型内容的创作或编辑经验。\n能结合观看留存、分集流失及用户反馈复盘剧本问题。\n有建立剧本验收标准、审核 SOP 或培训案例库的经验。", "cat": "AI / AIGC"}, {"id": "382", "title": "出海短剧产品经理（网赚方向）", "salary": "20K-35K", "location": "未明确", "jd": "【岗位介绍】\n\n负责面向海外市场的短剧与任务激励类产品建设，将内容观看、用户激励、广告变现及收益提现等环节形成完整产品体验，推动 Web／App 从需求规划到上线迭代，对用户体验与业务效果负责。\n\n【岗位职责】\n\n1、市场调研与产品规划：开展目标国家及地区的市场、用户和竞品调研，分析短剧、任务激励及网赚类产品的业务模式、核心功能和增长机会，制定产品规划及版本迭代计划。\n\n2、用户需求与本土化设计：梳理用户画像、使用场景及核心需求，结合当地语言、设备、网络、内容消费及收款习惯，制定产品本土化方案，明确需求优先级。\n\n3、短剧观看与激励体系设计：设计内容发现、播放、追剧及用户回访体验，结合业务需要搭建观看任务、积分奖励、签到和邀请等机制，平衡内容消费、激励参与与用户留存。\n\n4、商业化与收益体系建设：设计广告展示、激励视频、奖励结算、收益记录及提现流程，明确奖励规则、状态流转和异常处理，协同运营及技术团队优化变现效率与奖励成本。\n\n5、产品方案与项目交付：独立输出产品需求文档、业务流程、交互原型、数据埋点及验收标准，协调设计、研发、测试和运营团队，推动需求评审、开发上线及效果复盘。\n\n6、数据分析与持续优化：跟踪获客转化、开播、观看时长、任务完成、留存、广告收益及提现等数据，通过用户反馈和实验验证优化产品，关注用户长期价值及投入产出。\n\n7、风险控制与异常体验：协同相关团队完善重复领取、异常邀请、无效流量及提现异常等识别与处理机制，落实目标市场的隐私、广告及相关平台要求，保障规则透明和用户权益。\n\n【任职要求】\n\n1、具备产品经理工作经验，有出海网赚、任务激励或内容激励类产品的实际项目经验，能够说明本人负责的业务环节及项目成果。\n\n2、熟悉任务体系、积分或奖励账户、激励广告、收益结算及提现等核心流程，能够设计完整的正常流程、异常状态和用户提示。\n\n3、具备独立负责产品模块或推动产品从零到一的能力，能够完成需求分析、方案设计、开发协同、上线验收及效果复盘。\n\n4、具备市场调研、竞品分析和用户研究能力，能够结合目标国家的用户习惯、设备条件及商业环境识别产品机会，推动本土化落地。\n\n5、能独立输出逻辑清晰的产品需求文档、业务流程及交互原型，具备数据埋点设计与验收能力，关注边界条件和异常处理。\n\n6、具备较强的数据分析与商业意识，能够综合广告收益、奖励支出、渠道成本及用户留存判断产品效果，避免仅以任务量或活跃人数衡量增长。\n\n7、具备良好的跨团队沟通和项目推进能力，能够明确优先级、协调资源并跟进交付，具有责任心和结果意识。\n\n8、英语能够支持海外竞品研究、资料阅读及基本工作沟通；了解用户隐私、广告平台规则及反作弊基本要求。\n\n【加分项】\n\n1、有海外短剧、网文、视频或其他内容消费产品经验。\n\n2、有“观看内容＋任务奖励＋广告变现”业务经验。\n\n3、有 Web 与 App 产品建设、跨端账户及权益协同经验。\n\n4、有海外广告变现、支付或提现服务对接经验。\n\n5、有邀请增长、用户分层、留存提升或反作弊策略设计经验。\n\n6、有不同国家或地区的产品本土化与增长验证经验。\n\n【面试说明】\n\n请准备1—3个本人参与或主导的产品项目，其中至少1个为出海网赚或任务激励类产品。可展示脱敏后的需求文档、流程、原型或数据成果，重点说明个人职责、关键决策及实际效果。", "cat": "产品"}, {"id": "383", "title": "短剧项目统筹", "salary": "10K-20K", "location": "未明确", "jd": "一、短剧项目统筹\n岗位目标\n统筹短剧从立项到成片交付的进度，协调编剧、导演、生成、剪辑等环节，及时处理交付卡点。\n岗位职责\n1. 根据项目目标拆解制作计划，明确各环节负责人、交付标准和截止时间。\n2. 跟踪剧本、分镜、素材生成、剪辑及审片进度，维护项目排期和交付台账。\n3. 协调跨环节资源与素材交接，发现延期、返工或需求变更时，及时提出调整方案并推动确认。\n4. 管理文件版本和修改记录，确保制作团队使用已确认的脚本、素材及反馈。\n5. 运用AI工具、机器人或自动化工作流，减少进度收集、任务提醒和信息汇总等重复操作；对延期、遗漏及异常进行提示，并核对自动化结果。\n6. 汇总项目交付情况，复盘制作周期、返工原因及流程问题，推动改进。\n任职要求\n1. 有短剧、影视后期、动画或内容制作项目协调经验。\n2. 熟悉从剧本、分镜到制作、剪辑及成片交付的基本流程；有AIGC短剧经验优先。\n3. 能使用表格或项目管理工具维护排期、任务和版本记录。\n4. 能将项目协同需求拆解为可执行的自动化流程，使用AI工具、机器人或低代码工具辅助进度管理；有实际搭建经验优先。\n5. 沟通清晰，能识别依赖关系、追踪问题并推动闭环。\n6. 能适应多项目并行及远程协作。", "cat": "职能"}, {"id": "384", "title": "发布与数据专员", "salary": "10K-15K", "location": "未明确", "jd": "二、发布与数据专员\n岗位目标\n保障短剧内容准确、按时发布，维护发布记录和基础数据，为内容与运营调整提供可核对的信息。\n岗位职责\n按已确认的发布计划完成内容上传、标题、封面、简介及标签配置。\n发布前核对成片版本、字幕、音画、集数顺序及平台要求，发现问题及时反馈。\n跟踪审核与上线状态，记录发布失败、退审、下架等异常并推动处理。\n收集各平台可获取的播放、完播、互动、关注及转化数据，维护统一口径的数据台账。\n按日、周汇总内容表现，标记数据异常及表现差异，为负责人提供原始依据。\n维护内容编号、版本、发布时间与平台链接，确保发布记录和数据能够对应。\n任职要求\n有短视频、短剧或内容平台发布及基础数据统计经验。\n熟练使用Excel或在线表格，能完成数据整理、去重、核对及基础分析。\n操作细致，重视账号权限、文件版本和发布准确性。\n能区分平台数据口径，不将不同平台、不同统计周期的数据直接混算。\n有海外平台操作经验、基础英语阅读能力或AIGC内容经验优先。", "cat": "其他"}, {"id": "385", "title": "审计员", "salary": "远程：8K-10K", "location": "未明确", "jd": "一、岗位概述\n\n负责公司各类业务开支及渠道投放费用的审核与风险把控，确保资金使用真实、合理、合规、高效。重点负责播放器 App 项目相关渠道投放、市场推广及业务合作费用审核，并结合业务数据对投放效果进行分析评估，为公司降本增效和风险控制提供支持。\n\n---\n\n二、岗位职责\n\n1、开支审核与合规控制\n\n* 审核各部门提交的费用申请、合同、发票及付款凭证等资料；\n* 重点审核渠道投放费用、市场推广费用、商务合作费用等业务支出；\n* 核查费用真实性、合理性、预算执行情况及合规性，防范虚假、重复或异常支出；\n* 对异常费用进行风险预警，并提出整改建议。\n\n2、渠道投放审核\n\n* 负责渠道合作方资质审核及合作风险评估；\n* 审核渠道投放 ROI、转化率、留存率等核心运营指标；\n* 对渠道合作进行事前、事中、事后审核，形成审核意见及复盘报告，为续费、调整或终止合作提供依据。\n\n3、业务开支监控与数据分析\n\n* 定期统计、分析各类业务费用结构、占比及变化趋势；\n* 协助建立费用监控指标体系及风险预警机制；\n* 挖掘费用使用问题，提出降本增效及优化建议，为管理层提供数据支持。\n\n4、制度建设与流程优化\n\n* 协助制定及完善公司《开支审核管理制度》及相关流程；\n* 建立标准化费用台账、审核档案及复盘机制；\n* 配合开展费用合规培训，提高各部门费用管理意识。\n\n---\n\n 三、任职要求\n\n1. 本科及以上学历，财务、审计、会计、经济管理等相关专业优先；\n2. 具备良好的逻辑思维能力、数据分析能力及风险识别能力，能够独立完成审核分析工作；\n3. 工作认真细致，责任心强，原则性强，具备良好的职业操守及保密意识；\n4. 执行力强，学习能力强，能够主动推动工作落地并持续优化工作流程；\n5. 具备良好的沟通协调能力及团队协作意识，能够与业务、财务等部门高效协同；\n6. 吃苦耐劳，具备较强的抗压能力，能够适应快节奏工作及多任务处理；\n7. 对数据敏感，善于发现问题并进行分析，能够结合业务数据识别风险并提出可执行的优化建议；\n8. 熟练使用 Excel 等办公软件，能够完成数据整理、统计分析及审核报告编写；\n9. 具备良好的文字表达能力，能够独立撰写审核意见、分析报告及复盘总结；\n10. 综合素质和解决问题能力要强，要求能加强内部质检和技能提升。\n\n---\n\n四、加分项\n\n1. 具有互联网、App、广告、流量投放等行业财务审核、费用控制、审计或风控相关工作经验；\n2. 熟悉渠道投放、市场推广费用管理流程，具备 ROI、转化率、留存率等运营数据分析经验；\n3. 有 App 推广、广告投放、流量渠道或广告结算相关经验；\n4. 熟悉 SEO、ASO 或互联网流量运营模式；\n5. 熟悉 Power BI、SQL、Python 等数据分析工具，具备数据可视化能力；\n6. 有内控、审计、反舞弊、风险管理等相关工作经验；\n7. 熟悉 AI 自动化办公、工作流搭建或 AI 提效实践经验；\n8. 熟悉 ChatGPT、Claude、Gemini 等主流大语言模型，能够利用 AI 工具辅助数据分析、文档整理、报告编写及提升工作效率者优先", "cat": "职能"}, {"id": "386", "title": "初级会计", "salary": "", "location": "伦敦 集中办公 请勿沟通公司所属行业", "jd": "Client Operations Officer \nApply\n\nRole Summary \nThe successful candidate will play a key role in ensuring that a portfolio of client companies operates smoothly on a day-to-day basis. You will be responsible for coordinating and delivering finance-related obligations, statutory filings and corporate governance requirements accurately and on time, in accordance with each client’s service agreement.\n\nKEY RESPONSIBILITIES\n- Deliver agreed service lines (bookkeeping, RTI, VAT and related filings) for a portfolio of client companies, to the service levels set out in their service agreements.\n- Support client governance: coordinating director/trustee sign-off, maintaining board minutes and statutory records, and keeping Companies House filings accurate and up to date.\n- Act as day-to-day liaison between the client company, our internal compliance and finance teams, and external auditors or lawyers.\n- Support periodic KYC/AML review updates for client companies and escalate anomalies promptly through internal procedures.\n- Monitor key contractual milestones (payment terms, notice periods, dispute timelines) and flag deviations early.\nRequirements\n- A degree or equivalent in accounting, finance or business administration; 1–3 years' relevant experience, ideally in an accountancy practice or corporate/trust services environment.\n- A relevant accounting qualification — fully or part-qualified AAT, ACCA or CIMA (or equivalent). Strong QBE candidates with solid bookkeeping/VAT/RTI experience are also considered.\n- Familiarity with UK company compliance basics (Companies House, VAT/RTI) is a strong plus.\n- Highly organised and detail-oriented, comfortable managing several clients and competing deadlines.\n- Fluent written and spoken English and Mandarin, confident reading English contracts and regulatory documents.", "cat": "职能"}, {"id": "387", "title": "高级会计", "salary": "", "location": "伦敦 集中办公 请勿沟通公司所属行业", "jd": "Client Operations Officer \nApply\n\nRole Summary \nThe successful candidate will play a key role in ensuring that a portfolio of client companies operates smoothly on a day-to-day basis. You will be responsible for coordinating and delivering finance-related obligations, statutory filings and corporate governance requirements accurately and on time, in accordance with each client’s service agreement.\n\nKEY RESPONSIBILITIES\n- Deliver agreed service lines (bookkeeping, RTI, VAT and related filings) for a portfolio of client companies, to the service levels set out in their service agreements.\n- Support client governance: coordinating director/trustee sign-off, maintaining board minutes and statutory records, and keeping Companies House filings accurate and up to date.\n- Act as day-to-day liaison between the client company, our internal compliance and finance teams, and external auditors or lawyers.\n- Support periodic KYC/AML review updates for client companies and escalate anomalies promptly through internal procedures.\n- Monitor key contractual milestones (payment terms, notice periods, dispute timelines) and flag deviations early.\nRequirements\n- A degree or equivalent in accounting, finance or business administration; 1–3 years' relevant experience, ideally in an accountancy practice or corporate/trust services environment.\n- A relevant accounting qualification — fully or part-qualified AAT, ACCA or CIMA (or equivalent). Strong QBE candidates with solid bookkeeping/VAT/RTI experience are also considered.\n- Familiarity with UK company compliance basics (Companies House, VAT/RTI) is a strong plus.\n- Highly organised and detail-oriented, comfortable managing several clients and competing deadlines.\n- Fluent written and spoken English and Mandarin, confident reading English contracts and regulatory documents.", "cat": "职能"}, {"id": "388", "title": "产品运营专员", "salary": "", "location": "请勿沟通公司所属行业。集中办公的签合同，远程的不签", "jd": "岗位说明书（JD）— 合规运营专员\n岗位名称        合规运营专员\n所属部门        合规部\n工作地点        远程 / 伦敦（可协商）\n汇报对象        合规部经理\n岗位概述\n负责产品在海外市场的合规落地与发行运营，覆盖海外主体资质管理、应用商店上架与海外社交媒体运营，保障产品合法上线并实现用户增长。\n主要职责\n1. 海外主体资质管理\n•管理海外运营主体的公司资料、开发者账户及商户资质，维护其持续有效\n•跟进各平台及目标市场对内容发行的资质要求（年龄分级、内容审查、数据保护、广告合规），落实整改\n•对接外部律所、会计师及服务商，处理注册、续期、变更及审核问询\n2. App 上架与商店运营\n•负责 App Store、Google Play 及其他海外渠道的账户开设、应用提交、版本更新与审核沟通\n•编写并优化商店页面（ASO）：标题、描述、关键词、截图与视频素材的本地化\n•处理内购/订阅配置、税务与支付设置，跟踪下架与政策变更风险\n3. 海外社媒运营\n•搭建并运营 TikTok、YouTube、Instagram、X 等海外账号，制定内容日历与发布节奏\n•结合内容策划切片、预告、话题与互动活动，提升曝光与转化\n•监测数据（曝光、互动、下载归因），产出周报/月报并提出优化方案\n•对接海外 KOL、社群及投放团队，协同推进增长\n任职要求\n•本科及以上学历，3年以上海外发行、出海产品运营或海外社媒运营经验；有短剧/网文/游戏出海经验优先\n•熟悉 App Store 与 Google Play 上架流程、审核规则及 ASO 方法\n•了解海外内容合规要点（GDPR、年龄分级、平台社区准则），有海外主体或开发者账户管理经验\n•英语可作为工作语言（书面与口头），具备第二外语者优先\n•熟练使用 AI 工具辅助内容生产与运营，能清晰描述与 AI 协作的方法\n•结果导向，跨时区协作与多任务处理能力强", "cat": "运营"}, {"id": "389", "title": "财务管理（股权）", "salary": "", "location": "伦敦 集中办公 请勿沟通公司所属行业", "jd": "JOB DESCRIPTION\nCorporate Finance & Structuring Manager\nVersion 1.1 (global recruitment) ·\nPurpose of the role\nThe company operates a network of independent businesses across enterprise technology, SaaS products, professional services and digital content, with entities in several jurisdictions and further entities planned across Europe, Asia and the Middle East. The role owns the financial modelling and structuring workstream behind that network: multi-entity financial planning, cap table and shareholding design, and the financial and administrative set-up of new entities in any of the network’s jurisdictions. It sits between the finance function and external legal and tax advisers in each country, converting strategic decisions into modelled options, documents and filings.\nKey responsibilities\n1. Multi-entity financial planning (approx. 40%)\n–Maintain the network-wide financial ledger by business unit and entity across jurisdictions and currencies: revenue, cost, tax, working capital and free cash flow.\n–Model profit retention and distribution paths for each entity, including local corporate tax, withholding tax, dividend rules and distributable reserves in the relevant jurisdiction.\n–Prepare cash and capital allocation proposals for board and shareholder review.\n–Support annual budgets, quarterly reforecasts and management reporting across entities.\n\n2. Shareholding and equity design (approx. 30%)\n–Build and maintain cap tables for each entity and project vehicle, including contributions, valuation, dilution, employee equity and exit scenarios.\n–Model shareholding options for new entities, joint projects and external investment rounds; prepare comparison papers for decision-makers.\n–Translate agreed shareholding terms into instructions for local lawyers (shareholders’ agreements, constitutional documents, share allotments) and review the financial terms of draft documents.\n–Maintain the shareholding and governance register — shareholders, directors, beneficial-ownership filings, share classes, reserved matters — in the format each jurisdiction requires.\n\n3. New entity set-up and structuring support (approx. 20%)\n–Prepare location and structure assessments for new entities: substance and running costs, banking feasibility, licensing requirements, full-chain tax effect (source-country tax, cross-border payments, recipient-country rules).\n–Coordinate incorporation, bank account opening, tax registrations and statutory filings with company secretaries, registered agents and advisers in each jurisdiction.\n–Support transfer pricing documentation for intra-network service agreements (pricing method, cost base, local file inputs) under OECD-based rules.\n\n4. Adviser coordination and documentation (approx. 10%)\n–Brief and manage external legal, tax and corporate services providers in multiple countries; track advice, fees and deadlines.\n–Keep structure charts, entity registers and the master structuring workbook current.\n–Contribute to internal policies on shareholding governance, related-party transactions and distributions.\n\nBoundaries of the role\nLegal opinions, tax opinions and final legal documents are provided by external professional firms in each jurisdiction. The role prepares the analysis, options and instructions, and coordinates execution; it does not give legal or tax advice.\nEssential requirements\n–Professional accounting qualification or finalist status (ACCA, ACA/CA, CIMA, CPA, HKICPA, ISCA, or equivalent).\n–3–6 years in corporate finance, transaction services, corporate tax structuring, or a finance lead role in a multi-entity or start-up environment.\n–Strong Excel financial modelling: three-statement models, cap tables, scenario analysis; tidy, auditable workbooks; comfortable working in multiple currencies.\n–Working knowledge of corporate tax, dividend and distribution rules and company registry filings in at least one of the network’s jurisdictions, and demonstrated ability to learn the rules of others.\n–Ability to read shareholders’ agreements and constitutional documents and extract the financial and control terms.\n–Clear written English; able to produce concise decision papers.\nDesirable\n–Hands-on experience with entities in two or more of: United Kingdom, Ireland, Cyprus, Czech Republic, Singapore, Hong Kong, UAE, mainland China.\n–Exposure to transfer pricing, withholding tax, participation exemption and foreign-sourced income rules.\n–Familiarity with company secretarial practice (share allotments, beneficial-ownership registers, board minutes) or an equivalent governance qualification.\n–Experience supporting an external investment round or joint venture from the company side.\n–Working-level Mandarin Chinese, given the network’s counterparties; not essential.\nCompetencies\nStructured thinking; accuracy under document-heavy workloads; comfort with ambiguity and multi-jurisdiction rules; discretion with shareholder-level information; independent coordination of external advisers across time zones.", "cat": "职能"}, {"id": "390", "title": "财务数据分析（初级）", "salary": "面谈", "location": "只Base在英国", "jd": "岗位名称：财务数据 / 出纳储备人员\n\n工作地点：base 英国\n\n岗位定位：\n这是一个长期培养岗位。前期从财务基础工作做起，根据个人特长和工作表现，后续有两条发展路径。我们看重候选人的人品、责任心和稳定性。只要认真踏实、值得信任，公司愿意投入时间和资源培养成长。\n\n基础工作\n1、负责公司各业务线的财务数据整理、流水核对与地址台账维护\n2、监控账户余额与资金异常，及时上报\n3、在 Google Sheet 中完成数据登记，定期编制基础财务数据报表\n\n发展方向\n方向 A：财务数据分析\n1、按产品、渠道、地区拆分收入与成本结构，进行核算与分析\n2、搭建投放 ROI、渠道分成、成本分摊等分析模型，输出月度经营分析报告\n3、用数据工具优化对账、报表流程，提升财务数据处理效率\n4、与业务、投放团队对接，将业务逻辑转化为财务分析视角\n方向 B：出纳打款\n1、根据工作表现、责任心及信任度，接触地址余额监控、小额测试打款，表现稳定后逐步进入出纳储备\n2、学习加密钱包、USDT 及区块链交易相关知识，严格按流程执行打款操作\n\n基本要求\n1、人品端正，责任心强，做事认真踏实，值得信任；工作稳定，有上进心和长期发展意愿\n2、工作细心，有原则，保密意识强，能够严格按照流程执行\n3、熟练使用 Excel、Google Sheet，能够进行数据整理、流水核对及台账维护\n4、愿意接受长期培养及必要的背景调查\n\n优先条件\n1、有互联网、游戏或广告行业财务或数据分析经验\n2、能熟练运用 AI 工具辅助数据分析\n3、对加密钱包、USDT、区块链交易有学习兴趣，有相关经验者优先\n4、英国或美国学习经历优先，财务、会计、金融、数据分析、商科等相关背景优先", "cat": "技术 / 数据"}, {"id": "391", "title": "财务数据分析（高级）", "salary": "- 亚洲远程：2,500–4,000 USDT／月。\n- 英国：£40,000–£50,000／年。\n- 以上为税前固定薪酬范围，", "location": "工作地点\n- 亚洲地区远程办公，需配合约定的工作及协作时段。", "jd": "岗位名称：财务运营与数据分析专员\n工作地点\n- 亚洲地区远程办公，需配合约定的工作及协作时段。\n- 英国混合办公，需能够定期参与线下协作。\n薪酬将根据相关经验及实际工作能力确定。\n岗位介绍\n我们希望寻找有实际工作经验，或在业务理解、数据分析、AI应用、自动化工具等方面具备突出能力的同事，参与团队日常财务运营，并带来实用的经验和方法。\n岗位以USDT资金收支、对账、财务数据整理及月度管理报表为核心，属于实操型专业岗位，不承担人员管理职责。后续可根据个人能力与业务需要，向经营分析及财务BP方向发展。\n工作内容\n1. 参与拨款、工资及费用支付的信息核对，完成收支登记、钱包地址及资金台账维护。\n2. 核对链上流水、内部台账及项目单位数据，识别并追查差异，跟进异常事项处理。\n3. 参与月初多方对账及上月数据汇总，与数据部门、项目单位等确认金额、归属及统计口径。\n4. 整理月初余额、月度流入流出和月末余额等数据，参与资金全景、现金流及其他管理报表制作。\n5. 结合自身特长，运用AI、表格、数据分析或编程工具，改善数据处理、对账及报表流程。\n6. 将有效的方法整理成可复用的模板或工具，与同事分享经验；逐步参与项目收入、成本及利润分析。\n\n基本要求\n1. 有财务运营、结算对账、财务数据或相关分析工作经验，能够独立完成具体工作，并说明实际成果。\n2. 具备基本资金与财务逻辑，工作细致，能够发现问题、追查原因，而不只是登记数据。\n3. 熟练使用Excel或Google Sheets结合ai运用，能够进行数据整理、核对及报表处理。\n4. 中文沟通流畅，能清楚说明数据、问题及处理思路，愿意分享经验并与团队协作。\n5. 责任心强，有原则，重视保密、数据权限和资金安全，严格遵守审批及复核流程。\n\n以下优势具备一项或多项即可，不要求全部满足\n- **业务经验：**熟悉互联网、游戏、广告、支付或跨境业务的结算、收支及成本逻辑。\n- **AI应用：**有使用AI解决实际工作问题的案例，能够验证结果，而非仅停留在日常问答。\n- **数据及自动化：**能运用SQL、Python、Apps Script、Power Query、BI等工具中的一种或多种，改善工作效率。\n- **财务分析经验：**有成熟企业的财务运营、经营分析或财务BP实操经验，能够将方法应用到具体业务中。\n有USDT、加密钱包或区块链交易核对经验者优先；暂无相关经验，但专业基础扎实、愿意学习者也可考虑。", "cat": "技术 / 数据"}, {"id": "392", "title": "新媒体运营", "salary": "15-18k", "loc const catCounts = {};

let activeCat = null;
try { activeCat = localStorage.getItem('omi_jobs_cat') || null; } catch(e) {}

const chipRow = document.getElementById('chipRow');
function renderChips(){
  const chips = [{cat:null,label:'全部',n:JOBS.length}].concat(
    CATS.filter(c => catCounts[c]).map(c => ({cat:c,label:c,n:catCounts[c]}))
  );
  chipRow.innerHTML = chips.map(c => `
    <div class="chip ${activeCat===c.cat ? 'active':''}" data-cat="${c.cat ?? ''}">
      ${c.label} <span class="n">${c.n}</span>
    </div>
  `).join('');
  chipRow.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-cat');
      activeCat = v === '' ? null : v;
      try { activeCat ? localStorage.setItem('omi_jobs_cat', activeCat) : localStorage.removeItem('omi_jobs_cat'); } catch(e) {}
      renderChips();
      render();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(escapedText, q){
  if (!q) return escapedText;
  const re = new RegExp('(' + escapeRegex(q) + ')', 'ig');
  return escapedText.replace(re, '<mark>$1</mark>');
}

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const statsEl = document.getElementById('stats');

    return j.title.toLowerCase().includes(q) || j.jd.toLowerCase().includes(q);

  // 有关键字时:标题命中的排在前面(最相关),仅描述里命中的排后面,

      .sort((a, b) => {

        return a.idx - b.idx; // 稳定排序,组内保持原顺序
      })
      .map(x => x.j);

      </div>

        <div class="right-actions">

          <a class="apply-btn" href="https://t.me/y666899y" target="_blank" rel="noopener">投递 / 咨询 ↗</a>
        </div>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const jd = document.getElementById('jd-' + btn.getAttribute('data-id'));
      const isExpanded = jd.classList.toggle('expanded');
      btn.textContent = isExpanded ? '收起 ▴' : '展开全文 ▾';
    });
  });

  list.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const job = JOBS.find(j => String(j.id) === String(id));
      if (!job) return;
      const parts = [job.title];
      if (job.salary) parts.push(job.salary);
      if (job.location) parts.push('📍 ' + job.location);
      parts.push('');
      parts.push(job.jd);
      const text = parts.join('\n');
      copyText(text, btn);
    });
  });
}

function copyText(text, btn){
  const showCopied = () => {
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onDone){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); onDone(); } catch(e) {}
  document.body.removeChild(ta);
}

document.getElementById('searchInput').addEventListener('input', render);

renderChips();
render();
</script>
